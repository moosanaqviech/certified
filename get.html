<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening the Already Certified app</title>
<meta name="robots" content="noindex,nofollow">
<!-- Smart-link / QR target. Runs the same OS detection as the header pill and
     redirects immediately: Android to Play, iOS/iPadOS to the App Store,
     everything else to /app.html. This is what the QR code encodes, so a
     desktop visitor scanning with any phone still lands on the right store.
     Self-hosted: no third-party smart-link service. -->
<script>
(function () {
  var ua = navigator.userAgent || "";
  var url;
  if (/android/i.test(ua)) {
    url = "https://play.google.com/store/apps/details?id=app.certify.mobile";
  } else if (/iPad|iPhone|iPod/.test(ua) ||
             (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
    url = "https://apps.apple.com/us/app/certify/id6786034656";
  } else {
    url = "/app.html";
  }
  window.location.replace(url);
})();
</script>
</head>
<body style="margin:0;background:#14161c;color:#e9e6dd;font-family:'Libre Franklin',system-ui,sans-serif;">
  <p style="padding:24px;font-size:14.5px;line-height:1.6;color:#8b90a0;">
    Opening the app. If nothing happens, <a href="/app.html" style="color:#e5c988;">continue to the app page</a>.
  </p>
</body>
</html>
