<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 2",
  badge: "Databricks Spark Developer Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer.",
  coverage: "Covers chapters 10-28: Unit 2 (Using Spark SQL) and Unit 3 (the DataFrame API). One question per chapter.",
  minutes: 38,
  pass: 70
};

const QUESTIONS = [

  /* Ch 10 - Reading data sources: files and JDBC */
  {
    q:`A team reads only last week's paid orders from a 900-million-row PostgreSQL table. The reader sets <code>option("query", "SELECT * FROM orders WHERE status = 'paid' AND created &gt; now() - interval '7 days'")</code> and adds <code>partitionColumn</code>, <code>lowerBound</code>, <code>upperBound</code> and <code>numPartitions</code> so the read runs in parallel, but the read is rejected. Which change keeps both the filter and the parallel read?`,
    opts:[
      "Load the whole table with a single-partition read, then apply the filter with <code>spark.sql</code> on the resulting DataFrame",
      "Move the SQL into <code>dbtable</code> as a parenthesized subquery with an alias, and keep the four partitioning options",
      "Remove the partitioning options and call <code>repartition(16)</code> after <code>load()</code> so sixteen executors share the read",
      "Set <code>fetchsize</code> to 16 so the reader opens sixteen database connections"
    ],
    correct:1,
    explain:`The <code>query</code> option cannot be combined with <code>partitionColumn</code>, but <code>dbtable</code> accepts anything valid in a FROM clause, including a subquery in parentheses with an alias, so the filter runs in the database and the partitioning options still split the read into parallel range queries. Repartitioning after the load is the tempting fix, but the rows still arrive through one connection in one task and are only shuffled afterwards. <code>fetchsize</code> controls rows per round trip, not the number of connections.`
  },

  /* Ch 11 - Writing: partitionBy and overwrite */
  {
    q:`A 3 TB orders dataset is rebuilt every night as Parquet at one path. Almost every downstream query filters on <code>region</code> (eight values), and readers should skip regions they do not ask for. The nightly job must succeed when the path already exists and must not keep yesterday's rows. Which write fits?`,
    opts:[
      "<code>df.write.mode(\"overwrite\").partitionBy(\"order_id\").parquet(path)</code>",
      "<code>df.write.mode(\"append\").partitionBy(\"region\").parquet(path)</code>",
      "<code>df.write.partitionBy(\"region\").parquet(path)</code>",
      "<code>df.write.mode(\"overwrite\").partitionBy(\"region\").parquet(path)</code>"
    ],
    correct:3,
    explain:`Partitioning by a low-cardinality column that queries filter on gives one folder per region, so a filter on region reads only matching folders, and <code>overwrite</code> replaces last night's output. Omitting the mode is the tempting near miss: the default <code>errorifexists</code> fails on the second night because the path exists. Append keeps every previous night's rows, and partitioning by a unique order id creates a folder per order, a small-files disaster with no pruning benefit for region filters.`
  },

  /* Ch 12 - Querying files directly with SQL */
  {
    q:`An analyst working only in a SQL cell needs to query semicolon-delimited CSV files with a header row in <code>/Volumes/main/raw/landing/</code>, without creating a table or writing any Python. Which statement returns properly named columns?`,
    opts:[
      "<code>SELECT * FROM read_files('/Volumes/main/raw/landing/', format =&gt; 'csv', header =&gt; true, sep =&gt; ';')</code>",
      "<code>SELECT * FROM csv.&#96;/Volumes/main/raw/landing/&#96;</code>",
      "<code>SELECT * FROM csv.&#96;/Volumes/main/raw/landing/&#96; OPTIONS (header 'true', sep ';')</code>",
      "<code>SELECT * FROM text.&#96;/Volumes/main/raw/landing/&#96;</code>, then split each line on semicolons"
    ],
    correct:0,
    explain:`<code>read_files</code> is the SQL function that reads files directly and accepts reader options, so the header row and the semicolon separator are both honored. A direct <code>csv.&#96;path&#96;</code> query is the tempting choice, but that form takes no reader options: it assumes a comma separator and no header, so each line lands in <code>_c0</code> as one string and the header becomes a data row. There is no OPTIONS clause on the path form, and the text format returns one <code>value</code> column that would still need manual parsing.`
  },

  /* Ch 13 - Save modes */
  {
    q:`A setup notebook writes a small reference table of country codes to a path. It runs at the start of every pipeline execution. The table must be created on the first run, must never be changed afterwards because other teams curate it by hand, and later runs must not fail. Which save mode should the write use?`,
    opts:[
      "<code>append</code>, so each run adds the codes only if they are missing",
      "<code>errorifexists</code>, so the curated table is protected",
      "<code>ignore</code>, so the write happens when the target is missing and is skipped silently when it exists",
      "<code>overwrite</code>, so every run starts from the same seed data"
    ],
    correct:2,
    explain:`<code>ignore</code> writes when nothing is there and does nothing when the target exists, which is exactly create once, never touch again, never fail. <code>errorifexists</code> also protects the table, which makes it the tempting choice, but it raises an error on every run after the first, so the pipeline would fail. Append adds every row again on each run (it has no notion of missing rows), and overwrite would wipe the hand-curated edits each time.`
  },

  /* Ch 14 - Persistent tables */
  {
    q:`An engineer saves results with <code>df.write.option("path", "s3://lake/sales/orders").saveAsTable("main.sales.orders")</code>. Months later a teammate runs <code>DROP TABLE main.sales.orders</code>. What happens?`,
    opts:[
      "The table is removed from the catalog and the data files at the path stay, because a table saved with an explicit path is an external table",
      "The data files are deleted, because <code>saveAsTable</code> always creates a managed table",
      "The statement fails, because a table with a path must be dropped with <code>DROP EXTERNAL TABLE</code>",
      "The files are kept for a retention period and then purged, as with any managed table"
    ],
    correct:0,
    explain:`Supplying a path with <code>option("path", ...)</code> makes <code>saveAsTable</code> create an external table: the catalog holds the definition while the files live at a location the team owns, so dropping the table removes only the definition. Without the path option the table would be managed, and then the tempting answer would be true: dropping a managed table removes its data as well. There is no DROP EXTERNAL TABLE statement; the same DROP TABLE handles both kinds.`
  },

  /* Ch 15 - Temporary and global temporary views */
  {
    q:`A notebook runs <code>spark.read.parquet("/data/prices").createOrReplaceTempView("prices")</code> at 09:00. At 11:00 another process replaces the Parquet files with new prices, and at 11:05 the same notebook session runs <code>SELECT avg(price) FROM prices</code> without registering anything again. Which prices does the query use?`,
    opts:[
      "The 09:00 prices, because a temporary view stores the rows that existed when it was registered",
      "Neither: the query fails, because a temporary view expires when its source files change",
      "The 09:00 prices, because Spark caches every DataFrame that is registered as a view",
      "The 11:00 prices, because a temporary view stores the query plan rather than the rows, so each query reads the source again"
    ],
    correct:3,
    explain:`A temporary view is a name for a DataFrame's plan, not a stored copy of its rows, so every query against it re-runs the plan and reads whatever is at the path now. Believing the view snapshotted the rows is the tempting mistake: nothing is materialized unless the DataFrame behind the view is explicitly cached. Registering a view does not cache it, and the view lives for the session regardless of what happens to the files.`
  },

  /* Ch 16 - Columns: select, withColumn, withColumnRenamed, drop */
  {
    q:`<code>salesDF</code> has the columns <code>sku</code>, <code>price</code> and <code>qty</code>. Which code adds a column <code>total</code> equal to price times quantity and renames <code>qty</code> to <code>quantity</code>?`,
    opts:[
      "<code>salesDF.withColumn(col(\"total\"), col(\"price\") * col(\"qty\")).withColumnRenamed(\"qty\", \"quantity\")</code>",
      "<code>salesDF.withColumn(\"total\", col(\"price\") * col(\"qty\")).withColumnRenamed(\"qty\", \"quantity\")</code>",
      "<code>salesDF.withColumn(\"total\", col(\"price\") * col(\"qty\")).withColumnRenamed(\"quantity\", \"qty\")</code>",
      "<code>salesDF.withColumn(\"total\", \"price * qty\").withColumnRenamed(\"qty\", \"quantity\")</code>"
    ],
    correct:1,
    explain:`<code>withColumn</code> takes the new column's name as a string and its value as a Column expression, and <code>withColumnRenamed</code> takes the existing name first and the new name second. Reversing the rename arguments is the tempting slip: <code>withColumnRenamed("quantity", "qty")</code> names a column that does not exist, so nothing is renamed. A Column object is not accepted as the name, and a plain string like "price * qty" is not a Column expression (it would need <code>expr()</code>).`
  },

  /* Ch 17 - Rows: filter, split and explode */
  {
    q:`<code>customersDF</code> has an <code>id</code> column and a <code>tags</code> column holding comma-separated text such as "vip,eu,newsletter"; some customers have a null <code>tags</code>. A report needs one row per customer per tag, and customers with no tags must still appear once with a null tag. Which code produces it?`,
    opts:[
      "<code>customersDF.select(\"id\", explode(split(col(\"tags\"), \",\")).alias(\"tag\"))</code>",
      "<code>customersDF.select(\"id\", split(col(\"tags\"), \",\").alias(\"tag\"))</code>",
      "<code>customersDF.select(\"id\", explode_outer(split(col(\"tags\"), \",\")).alias(\"tag\"))</code>",
      "<code>customersDF.select(\"id\", posexplode(col(\"tags\")))</code>"
    ],
    correct:2,
    explain:`<code>split</code> turns the text into an array and <code>explode_outer</code> emits one row per element, while still emitting a single row with a null value when the array is null or empty. Plain <code>explode</code> is the tempting choice and handles every tagged customer correctly, but it drops rows whose array is null or empty, so untagged customers vanish from the report. <code>split</code> alone leaves one array per row instead of one row per tag, and <code>posexplode</code> needs an array or map, not a string.`
  },

  /* Ch 18 - Deduplication and missing data */
  {
    q:`A retried load wrote some rows of <code>eventsDF</code> twice, identical in every column. The same <code>customer_id</code> legitimately appears on many different events. Which call removes only the accidental copies?`,
    opts:[
      "<code>eventsDF.dropDuplicates([\"customer_id\"])</code>",
      "<code>eventsDF.na.drop(\"all\")</code>",
      "<code>eventsDF.groupBy(\"customer_id\").count()</code>",
      "<code>eventsDF.distinct()</code>"
    ],
    correct:3,
    explain:`<code>distinct()</code> removes rows that are identical in every column, which is exactly what a retried load produces, and it leaves different events for the same customer alone (<code>dropDuplicates()</code> with no arguments does the same). Deduplicating on <code>customer_id</code> is the tempting option because it sounds targeted, but it keeps one arbitrary row per customer and throws away every legitimate repeat. <code>na.drop("all")</code> removes all-null rows, not duplicates, and a groupBy count collapses the events into totals.`
  },

  /* Ch 19 - Aggregations */
  {
    q:`Before modelling, a data scientist wants the count, mean, standard deviation, minimum, maximum and the 25th, 50th and 75th percentiles of every numeric column of <code>ordersDF</code>, with one call. Which call returns all of them?`,
    opts:[
      "<code>ordersDF.summary()</code>",
      "<code>ordersDF.describe()</code>",
      "<code>ordersDF.agg(avg(\"amount\"), stddev(\"amount\"))</code>",
      "<code>ordersDF.select(approx_count_distinct(\"amount\"))</code>"
    ],
    correct:0,
    explain:`<code>summary()</code> with no arguments returns count, mean, stddev, min, the 25%, 50% and 75% percentiles, and max. <code>describe()</code> is the tempting near twin, but it stops at count, mean, stddev, min and max, so the percentiles are missing. A hand-written <code>agg</code> covers one column and only the functions listed, and approximate distinct counting measures cardinality, not the distribution.`
  },

  /* Ch 20 - Dates and timestamps */
  {
    q:`<code>clicksDF</code> stores <code>event_ts</code> as Unix epoch seconds in a long column. A CSV report needs a date string such as 2026-10-07 for each click. Which expression produces it?`,
    opts:[
      "<code>to_date(col(\"event_ts\"), \"yyyy-MM-dd\")</code>",
      "<code>from_unixtime(col(\"event_ts\"), \"yyyy-MM-dd\")</code>",
      "<code>from_unixtime(col(\"event_ts\"), \"yyyy-mm-dd\")</code>",
      "<code>year(col(\"event_ts\"))</code>"
    ],
    correct:1,
    explain:`<code>from_unixtime</code> converts epoch seconds into a string in the given pattern, and <code>yyyy-MM-dd</code> means year, month, day. The lowercase <code>mm</code> version is the tempting look-alike, but <code>mm</code> is minutes, so the middle field shows the minute of the click instead of the month. <code>to_date</code> parses strings in that pattern rather than converting epoch numbers, and <code>year</code> extracts a single component, not a full date.`
  },

  /* Ch 21 - Joins */
  {
    q:`A marketing list needs every customer who has placed at least one order, with only the customer columns and exactly one row per customer, even when a customer has hundreds of orders. Which join produces it?`,
    opts:[
      "<code>customers.join(orders, \"customer_id\", \"inner\")</code>",
      "<code>customers.join(orders, \"customer_id\", \"left\")</code>",
      "<code>customers.join(orders, \"customer_id\", \"left_semi\")</code>",
      "<code>customers.join(orders, \"customer_id\", \"left_anti\")</code>"
    ],
    correct:2,
    explain:`A left semi join keeps the left rows that have at least one match and returns only the left side's columns, one row per left row however many matches exist. The inner join is the tempting choice because it does filter to customers with orders, but it emits one row per matching order and adds the order columns, so a customer with hundreds of orders appears hundreds of times. A left join keeps customers without orders too, and left anti returns exactly the customers this list must exclude.`
  },

  /* Ch 22 - Unions */
  {
    q:`January's extract has columns <code>id</code>, <code>amount</code> and <code>region</code>. From February the source adds a <code>channel</code> column. The team must combine both months into one DataFrame, with <code>channel</code> null for January rows. Which call does it?`,
    opts:[
      "<code>jan.unionByName(feb, allowMissingColumns=True)</code>",
      "<code>jan.union(feb)</code>",
      "<code>jan.unionAll(feb)</code>",
      "<code>jan.union(feb).distinct()</code>"
    ],
    correct:0,
    explain:`<code>unionByName</code> matches columns by name, and with <code>allowMissingColumns=True</code> it adds a column missing on one side as nulls, which is exactly the January rows' <code>channel</code>. Plain <code>union</code> is the tempting option, but it matches by position and requires the same number of columns, so three columns against four fails. <code>unionAll</code> is an alias of <code>union</code> with the same rule, and adding <code>distinct()</code> changes duplicate handling, not column matching.`
  },

  /* Ch 23 - Reading with explicit schemas */
  {
    q:`A nightly job reads 2,000 CSV files with <code>option("header", True).option("inferSchema", True)</code>. The read is slow, and on some nights a column flips from integer to string because one file has a stray value. Which change addresses both problems?`,
    opts:[
      "Raise <code>spark.sql.shuffle.partitions</code> so the inference pass runs on more tasks",
      "Pass an explicit schema with <code>spark.read.schema(\"id INT, amount DOUBLE, sold_on DATE\")</code> and drop <code>inferSchema</code>",
      "Call <code>cache()</code> on the DataFrame so inference runs only once per job",
      "Set <code>header</code> to false so Spark stops reading the first line of each file"
    ],
    correct:1,
    explain:`Schema inference makes an extra pass over the data to guess types, and the guess can change from night to night with the data; an explicit schema, here as a DDL string, skips that pass and fixes the types every run. Caching is the tempting fix, but inference happens when the DataFrame is created, before any cache could help, and the next night's run would infer again anyway. Shuffle partitions do not apply to a file scan, and dropping the header turns the column names into data.`
  },

  /* Ch 24 - Sorting, iterating and converting */
  {
    q:`A developer writes <code>top = scoresDF.orderBy(desc("score")).show(5)</code> and then <code>top[0]["player"]</code>, which fails with "'NoneType' object is not subscriptable". Which line gets the five highest-scoring rows as Row objects?`,
    opts:[
      "<code>top = scoresDF.orderBy(desc(\"score\")).printSchema()</code>",
      "<code>top = scoresDF.sort(\"score\", descending=True).show(5)</code>",
      "<code>top = scoresDF.orderBy(desc(\"score\")).limit(5)</code>, then index it like a list",
      "<code>top = scoresDF.orderBy(desc(\"score\")).take(5)</code>"
    ],
    correct:3,
    explain:`<code>show()</code> prints rows and returns None, which is why indexing failed; <code>take(5)</code> is an action that returns a Python list of the first five Row objects, so <code>top[0]["player"]</code> works. <code>limit(5)</code> is the tempting option, but it is a transformation that returns another DataFrame, which cannot be indexed like a list until it is collected. <code>sort</code> has an <code>ascending</code> parameter, not <code>descending</code>, and <code>printSchema()</code> also returns None.`
  },

  /* Ch 25 - Python UDFs */
  {
    q:`A data engineer writes a Python function <code>clean_sku(s)</code> with string logic that no built-in function covers, wraps it with <code>udf(clean_sku, StringType())</code>, and uses it in <code>withColumn</code>. An analyst now wants to call it from <code>spark.sql("SELECT clean_sku(sku) FROM products")</code>. What makes that work?`,
    opts:[
      "Nothing more: every function wrapped with <code>udf()</code> is visible to SQL automatically",
      "Registering a temporary view named <code>clean_sku</code> over the products DataFrame",
      "Registering it with <code>spark.udf.register(\"clean_sku\", clean_sku, StringType())</code> in the same session",
      "Rewriting it as a Pandas UDF, because SQL can only call vectorized functions"
    ],
    correct:2,
    explain:`<code>spark.udf.register</code> gives the function a name in the session's function registry, so SQL in that session can call it. Assuming the <code>udf()</code> wrapper already made it visible is the tempting mistake: the wrapper returns a Python object for the DataFrame API only, and SQL resolves names through the registry. A view registers a DataFrame, not a function, and SQL can call registered scalar UDFs whether or not they are vectorized.`
  },

  /* Ch 26 - Stateful operators and state stores */
  {
    q:`A streaming pipeline over payment events has four requirements. Which one needs a state store?`,
    opts:[
      "Keeping a running total of each customer's spend that carries over from one micro-batch to the next",
      "Rejecting events whose card number fails a custom checksum written as a Python UDF",
      "Dropping the internal columns before writing to the sink",
      "Converting each event's amount from cents to dollars"
    ],
    correct:0,
    explain:`A running total per customer depends on everything seen in earlier micro-batches, so Spark must keep the partial totals between batches, which is what a state store holds (and checkpoints for recovery). The checksum UDF is the tempting choice because it is custom code, but it decides each event on its own, so it is stateless and scales without remembering anything, like the guide's stateless-UDF example. Dropping columns and converting units are per-row projections with no memory of earlier rows.`
  },

  /* Ch 27 - Broadcast variables and accumulators */
  {
    q:`A developer creates <code>bad = spark.sparkContext.accumulator(0)</code>, defines a UDF that calls <code>bad.add(1)</code> for malformed rows, runs <code>checked = df.withColumn("ok", validate(col("raw")))</code>, and immediately prints <code>bad.value</code>, which shows 0 although the data has malformed rows. Why?`,
    opts:[
      "Accumulators can only be read on the executors, so the driver always sees the initial value",
      "<code>add</code> only works inside <code>foreach</code>; calls from a UDF are ignored",
      "No action has run yet, so the transformation and its UDF have not executed and nothing has been added",
      "The UDF needs the accumulator passed in as a broadcast variable before it can update it"
    ],
    correct:2,
    explain:`<code>withColumn</code> is a lazy transformation, so the UDF has not run and the accumulator has not been touched; after an action such as <code>count()</code> or a write, the driver reads the added value. The foreach option is tempting because updates inside actions are the only ones guaranteed to be applied exactly once, but updates from transformations are still applied when the work runs (possibly more than once on retries), not ignored. Accumulators are read on the driver, not the executors, and they are not broadcast variables.`
  },

  /* Ch 28 - Broadcast joins */
  {
    q:`To stop a large accidental broadcast, a teammate sets <code>spark.sql.autoBroadcastJoinThreshold</code> to -1. A join between a 2 TB fact table and a 4 MB country table now shows <code>SortMergeJoin</code> in <code>explain()</code>. What restores a broadcast for this one join without undoing the teammate's setting?`,
    opts:[
      "Nothing: with the threshold at -1, no join can be broadcast for the rest of the session",
      "Wrap the small side with the <code>broadcast()</code> hint, <code>facts.join(broadcast(countries), \"country_code\")</code>, because a hint forces the strategy regardless of the automatic threshold",
      "Call <code>countries.cache()</code>, because cached DataFrames are always broadcast",
      "Increase <code>spark.sql.shuffle.partitions</code> so the sort-merge join behaves like a broadcast join"
    ],
    correct:1,
    explain:`-1 disables only the automatic choice based on size estimates; an explicit <code>broadcast()</code> hint still tells the planner to broadcast that side, so the 4 MB table is shipped to every executor and the 2 TB side is joined in place without a shuffle. Believing -1 bans broadcasting outright is the tempting misreading. Caching does not choose a join strategy, and more shuffle partitions only change how a sort-merge join is split, not whether the large side is shuffled.`
  }
];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
