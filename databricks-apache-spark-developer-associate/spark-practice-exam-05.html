<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 5",
  badge: "Databricks Spark Developer Associate",
  blurb: "Full-length mock. Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer. Databricks publishes no official passing score; 70% is our practice target.",
  coverage: "Full-length mock exam: 45 questions in 90 minutes across all seven sections, sampled at the official 20/20/30/10/10/5/5 weights.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

  /* Ch 01 - Why Spark: advantages and challenges */
  {
    q:`A utility moved its nightly smart-meter job (80 GB a day) from pandas to a Spark cluster. The job now finishes, but engineers report two things: a bad cast inside a <code>withColumn</code> step raises its error on the final <code>write</code> line, and a <code>groupBy("meter_id")</code> step spills to disk. How should these two observations be read?`,
    opts:[
      "Both show the cluster is misconfigured: Spark executes each line eagerly, so errors and spills should appear exactly where the code asks for them",
      "Both are known costs of Spark: lazy evaluation makes errors surface at the action, and a wide transformation shuffles rows across the network and can spill when execution memory runs low",
      "The first is lineage-based recovery replaying the cast, and the second means in-memory processing has been switched off for the job",
      "Both mean 80 GB a day is too small for Spark, and the job should go back to pandas on one machine"
    ],
    correct:1,
    explain:`Transformations only build a plan, so a data-dependent failure is thrown by the action that runs the plan, not by the line that caused it; and a groupBy is a shuffle whose execution memory can spill to disk. Both are trade-offs Spark carries, not misconfiguration. Option D is the tempting overreaction, but 80 GB a day outgrows a single pandas process, which is exactly where Spark's scale-out pays.`
  },

  /* Ch 02 - Cluster anatomy: driver, executors, cores and memory */
  {
    q:`A fraud team plans to <code>cache()</code> a 200 GB DataFrame of scored card transactions that several reports reuse. The driver node has 32 GB of memory, and a teammate warns that the cache will run the driver out of memory. Where do the cached partitions actually live?`,
    opts:[
      "On the driver, which keeps every cached partition so it can hand copies to executors",
      "In the cluster manager, which stores cached data between applications",
      "On the driver's local disk, spilled there because it cannot fit in driver memory",
      "In the executors' memory, next to the shuffle output; the driver holds only the plan and the scheduling state"
    ],
    correct:3,
    explain:`Executors are the processes that run tasks and store data for an application: cached DataFrames and shuffle output live inside executor memory, which is also why losing an executor can mean recomputing its partitions. The driver plans and schedules and holds collected results, not cached partitions, so the teammate's warning is the tempting misreading of what "the driver holds" means. The cluster manager only allocates CPU and memory across applications and never holds data.`
  },

  /* Ch 03 - DataFrames, Datasets and the SparkSession lifecycle */
  {
    q:`A team runs the same ledger-check logic two ways: as a standalone PySpark script launched nightly, and interactively in a Databricks notebook. A reviewer proposes adding <code>spark.stop()</code> as the last line of both. What is the right call?`,
    opts:[
      "Add it to the standalone script, where it stops the underlying SparkContext and releases the executors; leave it out of the notebook, where the session belongs to the attached compute",
      "Add it to both: without spark.stop() the cached DataFrames are never cleared, but the executors stay allocated either way",
      "Add it to the notebook after every cell, so each cell starts with a fresh session",
      "Leave it out of both: executors are released automatically after every action"
    ],
    correct:0,
    explain:`A SparkSession lives as long as the application that owns it, and <code>spark.stop()</code> stops the underlying SparkContext and releases the executors, which is what a standalone script does at its end. On Databricks the notebook gets a pre-defined <code>spark</code> tied to the attached compute, so it is not stopped there. Option B is the tempting half-truth: stop does end the cached data, but only because it ends the whole application, executors included; nothing is released after each action.`
  },

  /* Ch 04 - Caching and storage levels */
  {
    q:`An eight-hour risk run reuses a 30 GB scenario DataFrame <code>scen</code> in hundreds of actions. Building it takes a 40-minute join. The executors run on spot instances that are sometimes reclaimed, and each time that happens tasks stall while the lost partitions are recomputed. Which persist call fits?`,
    opts:[
      "<code>scen.persist(StorageLevel.MEMORY_ONLY)</code>",
      "<code>scen.persist(StorageLevel.DISK_ONLY)</code>",
      "<code>scen.persist(StorageLevel.MEMORY_AND_DISK_2)</code>",
      "<code>scen.persist(StorageLevel.MEMORY_ONLY_SER)</code>"
    ],
    correct:2,
    explain:`A replicated <code>_2</code> level keeps each partition on two nodes, so when an executor is lost the tasks continue from the second copy instead of waiting for the 40-minute join to be recomputed. MEMORY_ONLY is the tempting fast choice, but every level without replication must recompute the lost partitions, which is the stall the team is seeing. PySpark has no <code>_SER</code> constants (Python data is always serialized), and DISK_ONLY still loses the copies held on the reclaimed node.`
  },

  /* Ch 05 - Executor memory and garbage collection */
  {
    q:`A sensor-analytics job caches a large lookup of device calibration data that every stage reuses. The Executors tab shows high GC time, and the team learns the collector keeps scanning those long-lived cached objects. They want Spark to keep execution and storage data outside the region the JVM garbage collector scans. Which configuration does that?`,
    opts:[
      "Set <code>spark.memory.offHeap.enabled</code> to true and give <code>spark.memory.offHeap.size</code> a value, so that data is kept off-heap",
      "Persist the lookup with <code>StorageLevel.MEMORY_ONLY_SER</code> so it is stored as compact bytes on the heap",
      "Raise <code>spark.memory.storageFraction</code> to 1.0 so cached blocks can never be evicted",
      "Raise <code>spark.executor.memoryOverhead</code>, which is where Spark places cached blocks"
    ],
    correct:0,
    explain:`On-heap memory is what garbage collection scans; with <code>spark.memory.offHeap.enabled</code> true and <code>spark.memory.offHeap.size</code> set, Spark can keep execution and storage data off-heap, where the collector never touches it. Option C is the tempting one because it talks about cached blocks, but a higher storage fraction only protects more of the on-heap region from eviction, so the collector still scans it. PySpark has no <code>_SER</code> constants, and memoryOverhead covers native and JVM overhead, not Spark's cached data.`
  },

  /* Ch 06 - The execution hierarchy */
  {
    q:`A notebook builds <code>daily = txns.groupBy("account_id").agg(sum("amount"))</code>, calls <code>daily.cache()</code>, runs <code>daily.count()</code>, and then runs <code>daily.filter(col("sum(amount)") &gt; 10000).show()</code>. On the second job's details page, one stage is drawn in gray and labelled skipped. What does that mean?`,
    opts:[
      "The stage failed and Spark dropped it, so the results shown are incomplete",
      "Its output already existed from the earlier job (the cached aggregate), so Spark did not need to run it again",
      "AQE removed the stage because its shuffle partitions turned out to be empty",
      "The stage ran on the driver instead of the executors, so it is not listed as an executor stage"
    ],
    correct:1,
    explain:`The job details page draws skipped stages in gray: their output already existed, for example from a cached DataFrame, so the second job reads that result instead of re-running the read and the aggregation. Option A is the tempting alarm, but a failed stage is reported as failed and retried, not grayed out as skipped. Stages never run on the driver; every stage is a set of tasks on executors.`
  },

  /* Ch 07 - Partitions and shuffles */
  {
    q:`In the Stages tab, the stage before a <code>groupBy("merchant_id")</code> shows Shuffle Write of 48 GB and the stage after it shows Shuffle Read of 48 GB. A new engineer asks where those 48 GB went in between. What is the accurate description?`,
    opts:[
      "The map tasks sent the rows to the driver, which regrouped them by merchant_id and handed them back out",
      "The rows were written to the job's output table path and re-read by the next stage",
      "The rows stayed in executor memory only; a shuffle never touches disk",
      "Each map task hashed every row's key to an output partition and wrote shuffle files to its executor's local disk; each reduce task then fetched its bucket from every map task over the network"
    ],
    correct:3,
    explain:`A shuffle has a map side that writes rows, grouped by target partition, into shuffle files on local disk (Shuffle Write), an exchange across the network, and a reduce side where one task per shuffle partition fetches its bucket from every map task (Shuffle Read). Disk plus network is why a shuffle costs so much more than a narrow step. Option C is the tempting simplification, but shuffle files are written to disk, and execution memory can also spill during one.`
  },

  /* Ch 08 - Transformations, actions and lazy evaluation */
  {
    q:`A quant wants to prepare a 10-row sample of a <code>trades</code> DataFrame for a later join without starting any Spark job yet. Which call returns a DataFrame and runs nothing?`,
    opts:[
      "<code>trades.first()</code>",
      "<code>trades.take(10)</code>",
      "<code>trades.limit(10)</code>",
      "<code>trades.count()</code>"
    ],
    correct:2,
    explain:`limit(n) is a transformation: it returns a new DataFrame and only adds a node to the plan, so no job runs until an action. take(10) is the tempting near-twin, but it is an action that runs the plan and returns a list of Row objects to the driver. first() and count() are actions too.`
  },

  /* Ch 09 - The Spark modules */
  {
    q:`Two analysts compute total exposure per trading desk over the same positions table. One registers a temporary view and runs <code>spark.sql("SELECT desk, SUM(notional) FROM positions GROUP BY desk")</code>; the other writes <code>positions.groupBy("desk").sum("notional")</code>. Which statement about performance is right?`,
    opts:[
      "The SQL version is faster, because SQL text is executed natively while Python DataFrame calls are interpreted row by row",
      "They perform the same: both are Spark SQL, planned by the Catalyst optimizer into the same plan",
      "The DataFrame version is faster, because it skips SQL parsing, which dominates the runtime",
      "The SQL version runs on the driver, while the DataFrame version runs on the executors"
    ],
    correct:1,
    explain:`SQL text and the DataFrame API are two front ends to the same Spark SQL engine: both go to the Catalyst optimizer, which builds the same logical and physical plan, so they run at the same speed. Option A is the tempting myth: DataFrame calls in Python only build a plan and never process rows in Python unless a UDF is involved. Both versions run as distributed jobs on the executors.`
  },

  /* Ch 10 - Reading data sources: files and JDBC */
  {
    q:`A bank's landing folder <code>/Volumes/fin/raw/cards/</code> receives transaction CSV files with a header row, but the upstream system also drops <code>.done</code> marker files and <code>.json</code> manifests into the same folder. Reading the folder picks up rows from those files too. Which read keeps only the CSV files?`,
    opts:[
      "<code>spark.read.option(\"header\", True).option(\"pathGlobFilter\", \"*.csv\").csv(\"/Volumes/fin/raw/cards/\")</code>",
      "<code>spark.read.option(\"header\", True).option(\"fileFilter\", \"*.csv\").csv(\"/Volumes/fin/raw/cards/\")</code>",
      "<code>spark.read.option(\"header\", True).option(\"sep\", \".csv\").csv(\"/Volumes/fin/raw/cards/\")</code>",
      "<code>spark.read.option(\"header\", True).csv(\"/Volumes/fin/raw/cards/\").filter(col(\"_c0\").endswith(\".csv\"))</code>"
    ],
    correct:0,
    explain:`A read path can be a whole directory, and <code>option("pathGlobFilter", "*.csv")</code> keeps only the files whose names match the pattern, so the markers and manifests are never read. Option D is the tempting after-the-fact fix, but a filter works on row values, not file names, and with header on there is no <code>_c0</code> column anyway. fileFilter is not a reader option, and <code>sep</code> sets the column separator inside a file.`
  },

  /* Ch 11 - Writing: partitionBy and overwrite */
  {
    q:`Meter readings were written with <code>partitionBy("region")</code> to <code>/lake/readings</code>. An analyst needs only the EU rows, must keep the <code>region</code> column in the result, and wants Spark to skip the other regions' folders. Which read fits?`,
    opts:[
      "<code>spark.read.parquet(\"/lake/readings/region=EU\")</code>",
      "<code>spark.read.option(\"partitionBy\", \"region\").parquet(\"/lake/readings\")</code>",
      "<code>spark.read.parquet(\"/lake/readings\").filter(col(\"region\") == \"EU\")</code>",
      "<code>spark.read.parquet(\"/lake/readings\").withColumn(\"region\", lit(\"EU\"))</code>"
    ],
    correct:2,
    explain:`Reading the root path recovers <code>region</code> from the folder names as a column, and a filter on the partition column lets Spark open only the <code>region=EU</code> folder (partition pruning). Pointing at the subfolder directly is the tempting shortcut: it reads the same files, but the partition value lives only in the folder name above the path, so the region column is missing. partitionBy is a writer method, not a reader option, and option D reads every region and relabels them all as EU.`
  },

  /* Ch 12 - Querying files directly with SQL */
  {
    q:`A partner sends settlement records twice: as ORC files and as a CSV export with a header row. In a SQL cell, <code>SELECT * FROM orc.&#96;/Volumes/fin/raw/settle_orc/&#96;</code> returns properly named, typed columns, while the same query with the <code>csv</code> prefix returns <code>_c0</code>, <code>_c1</code> and so on, all strings. What explains the difference?`,
    opts:[
      "The ORC query infers the schema by reading the files twice, and the CSV query skips that pass",
      "ORC files carry their own schema, so the direct query needs no options; a direct CSV query takes no reader options, so it uses the defaults of header false and no type inference",
      "Spark keeps ORC schemas in the metastore after the first read, but never stores CSV schemas",
      "Direct file queries apply header true to columnar formats only, so the header row of CSV is ignored"
    ],
    correct:1,
    explain:`ORC, like Parquet and Delta, is self-describing: the column names and types travel inside the files, so a direct query returns a proper table. The direct form has nowhere to put reader options, so a CSV is read with its defaults: no header and no inferred types. Option A is the tempting explanation, but no inference pass happens for ORC at all, and nothing is registered in a metastore by a direct query.`
  },

  /* Ch 12 - Querying files directly with SQL */
  {
    q:`An auditor queries a Delta table's folder with <code>SELECT count(*) FROM parquet.&#96;/Volumes/fin/ext/ledger/&#96;</code> and gets far more rows than the table holds, including entries that were updated or deleted weeks ago. Which statement returns only the table's current rows?`,
    opts:[
      "<code>SELECT count(*) FROM parquet.&#96;/Volumes/fin/ext/ledger/_delta_log&#96;</code>",
      "<code>SELECT count(DISTINCT *) FROM parquet.&#96;/Volumes/fin/ext/ledger/&#96;</code>",
      "<code>SELECT count(*) FROM csv.&#96;/Volumes/fin/ext/ledger/&#96;</code>",
      "<code>SELECT count(*) FROM delta.&#96;/Volumes/fin/ext/ledger/&#96;</code>"
    ],
    correct:3,
    explain:`With the <code>delta</code> prefix, Spark reads the folder as a Delta table, transaction log included, so the query sees the table's current version only. The parquet prefix reads every Parquet data file in the folder and ignores the log, so files that later updates and deletes removed from the table are still counted. Counting distinct rows is the tempting patch, but it cannot tell a superseded version of an entry from a current one, and the log folder holds commit records, not ledger rows.`
  },

  /* Ch 13 - Save modes */
  {
    q:`A quarterly regulatory export uses <code>report.write.mode("error").parquet(path)</code>. A reviewer asks for it to be changed to <code>mode("errorifexists")</code> "so that an accidental second run fails loudly instead of touching the existing export". What is accurate?`,
    opts:[
      "No change is needed: <code>\"error\"</code> and <code>\"errorifexists\"</code> are the same mode (the default), which raises an exception and writes nothing when the target exists",
      "The change is needed: <code>\"error\"</code> logs a warning and appends, while <code>\"errorifexists\"</code> raises",
      "The change is needed: <code>\"error\"</code> is not a valid mode string, so the current write fails on every run, even the first",
      "Neither protects the export: both delete the existing files first and then report an error"
    ],
    correct:0,
    explain:`"error" is accepted as the same mode as "errorifexists", which is also what the writer does with no mode at all: an existing target raises an exception and is left untouched. Option B is the tempting belief that the two spellings differ in behavior, which they do not. A missing target is created under every mode, so the first run succeeds either way.`
  },

  /* Ch 13 - Save modes */
  {
    q:`A utility adds a new region, and its first bronze write of meter telemetry uses <code>readings.write.mode("append").parquet("/lake/bronze/meters/region=APAC")</code>, a path that does not exist yet. A teammate insists the first run must use a different mode because "append needs something to append to". What happens on the first run?`,
    opts:[
      "It fails, because append requires an existing target; the first run must use errorifexists",
      "It succeeds but writes nothing, because append skips a missing target the way ignore skips an existing one",
      "The path is created and the rows are written: a missing target is created under every save mode",
      "It fails unless the first run uses overwrite, which is the only mode that creates paths"
    ],
    correct:2,
    explain:`A save mode only decides what happens when data already exists; a missing target is created under append, overwrite, ignore and errorifexists alike, exactly as any first write. Option B is the tempting mix-up with ignore, which skips the write only when the target already exists. So the same append line works on day one and every day after.`
  },

  /* Ch 14 - Persistent tables: saveAsTable, partitioning, bucketing and sorting */
  {
    q:`To speed up a nightly join on account_id, a bank wrote <code>trades</code> with <code>bucketBy(16, "account_id")</code> and <code>positions</code> with <code>bucketBy(64, "account_id")</code>, both through <code>saveAsTable</code>. The join plan still shows an Exchange under both sides. Why?`,
    opts:[
      "Bucketing only speeds up filters on the bucket column, never joins",
      "A join skips its shuffle only when both tables are bucketed on the join key with the same number of buckets; with 16 and 64 Spark shuffles anyway",
      "The tables also need sortBy(\"account_id\"), since bucketing does nothing without a sort",
      "Bucketed tables must be written in Delta format for the bucket layout to be used"
    ],
    correct:1,
    explain:`Bucketing hashes rows into a fixed number of files so equal keys sit together, and a join can use that only when both sides share the key and the bucket count; with different counts Spark shuffles unless <code>spark.sql.bucketing.coalesceBucketsInJoin.enabled</code> (off by default) coalesces one side. Option C is the tempting gap, but sortBy only orders rows within each bucket; it is optional and does not decide whether the shuffle is skipped. Partitioning serves filters, and Delta tables are not bucketed at all.`
  },

  /* Ch 15 - Temporary and global temporary views */
  {
    q:`A notebook registers <code>exposure</code>, the result of an expensive three-table join of trades, positions and prices, with <code>exposure.createOrReplaceTempView("exposure_v")</code>. Twelve <code>spark.sql</code> queries then hit <code>exposure_v</code>, and the Spark UI shows the full join running for every one of them. What fixes the repetition?`,
    opts:[

      "Use createTempView instead, which materializes the rows once instead of keeping a plan",

  },

  /* Ch 15 - Temporary and global temporary views */
  {
    q:`A risk application builds <code>rates</code> in its main session and then opens a second session with <code>spark.newSession()</code> for an isolated configuration. Code in the second session must query rates with SQL. Nothing may be written to storage, and nothing should outlive the application. Which approach works?`,
    opts:[

    ],
    correct:2,
    explain:`A global temporary view is shared by every session of the application, lives in the system-preserved <code>global_temp</code> database, is dropped when the application ends, and stores only a plan, so nothing is written. Option D is the tempting near miss: the view is right, but a global view must always be addressed as <code>global_temp.rates</code>. A plain temporary view is visible only to the session that registered it, and saveAsTable writes a persistent table.`
  },

  /* Ch 16 - Columns: select, withColumn, withColumnRenamed, drop */
  {
    q:`A transactions DataFrame <code>txns</code> needs a new column <code>currency</code> holding the constant "EUR" on every row, and its column <code>amt</code> renamed to <code>amount_eur</code>. Which code does both?`,
    opts:[

      "<code>txns.withColumn(\"currency\", lit(\"EUR\")).withColumnsRenamed(columns={\"amt\": \"amount_eur\"})</code>"
    ],
    correct:0,
    explain:`withColumn needs a Column as its second argument, so a constant goes through <code>lit()</code>, and withColumnRenamed takes the existing name first and the new name second. Option C is the tempting trap: with the names reversed the rename refers to a column that does not exist, which is a silent no-op, so amt survives. A bare string is not a Column, and withColumnsRenamed takes a plain dict, with no <code>columns=</code> keyword.`
  },

  /* Ch 17 - Rows: filter, split and explode */
  {
    q:`Each row of a telemetry DataFrame has meter_id and a map column <code>readings</code>, such as {"kwh": 451.2, "voltage": 229.8}. A report needs one row per map entry with exactly three columns: meter_id, key and value. Which code produces it?`,
    opts:[
      "<code>telemetry.select(\"meter_id\", posexplode(\"readings\"))</code>",

      "<code>telemetry.select(\"meter_id\", explode(\"readings\"))</code>",
      "<code>telemetry.select(\"meter_id\", split(col(\"readings\"), \",\"))</code>"
    ],
    correct:2,
    explain:`Exploding a map returns one row per entry with two columns named <code>key</code> and <code>value</code>, so selecting meter_id alongside it gives exactly the three columns required. posexplode is the tempting variant because it also explodes maps, but it adds a <code>pos</code> column, giving four columns. A map explode yields two columns, which cannot fit into the single column withColumn creates, and split works on strings, not maps.`
  },

  /* Ch 18 - Deduplication and missing data */
  {
    q:`A sensor DataFrame has device_id (string), temp (double), humidity (double) and firmware (string), with nulls scattered in the last three columns. In one call, missing temp and humidity must become 0 and missing firmware must become "unknown", while device_id is left alone. Which call does it?`,
    opts:[
      "<code>readings.na.fill(0)</code>",
      "<code>readings.na.fill({\"temp\": 0.0, \"humidity\": 0.0, \"firmware\": \"unknown\"})</code>",
      "<code>readings.na.fill(\"unknown\", subset=[\"temp\", \"humidity\", \"firmware\"])</code>",
      "<code>readings.na.drop(subset=[\"temp\", \"humidity\", \"firmware\"])</code>"
    ],
    correct:1,
    explain:`A dict passed to <code>na.fill</code> sets one replacement per column, so each column gets a value of its own type and unnamed columns are untouched. A single fill value only reaches columns whose type matches it, which is why option C is the tempting trap: the string "unknown" fills firmware but silently skips the two numeric columns. Option A fills only the numeric columns, and na.drop removes the rows instead of filling them.`
  },

  /* Ch 19 - Aggregations: groupBy, agg, approx_count_distinct and summary */
  {
    q:`Before setting fraud thresholds, a risk analyst wants, for every numeric column of <code>txns</code>, only four statistics: the count, the minimum, the 99th percentile and the maximum, in one call. Which call returns exactly that?`,
    opts:[
      "<code>txns.describe(\"count\", \"min\", \"99%\", \"max\")</code>",
      "<code>txns.describe()</code>",
      "<code>txns.summary()</code>",
      "<code>txns.summary(\"count\", \"min\", \"99%\", \"max\")</code>"
    ],
    correct:3,
    explain:`<code>summary(*statistics)</code> takes statistic names, and any percentile can be requested as a string such as "99%", so it returns exactly those four rows (percentiles are approximate). describe is the tempting look-alike, but its arguments are column names, so those strings would be read as columns to profile. describe() gives count, mean, stddev, min and max with no percentiles, and summary() with no arguments gives the quartiles, not the 99th percentile.`
  },

  /* Ch 20 - Dates and timestamps */
  {
    q:`A fraud rule must flag card transactions made on a Saturday or a Sunday. The column <code>ts</code> is a TIMESTAMP. Which filter is correct?`,

  },

  /* Ch 21 - Joins: inner, left, multiple keys and cross */
  {
    q:`A month-end reconciliation compares the internal <code>ledger</code> with the <code>bank</code> statement. Rows match on both account_id and txn_id, and the result must keep every entry from both sides, with nulls wherever one side has no match. Which join is correct?`,
    opts:[
      "<code>ledger.join(bank, [\"account_id\", \"txn_id\"], \"left\")</code>",
      "<code>ledger.join(bank, [\"account_id\", \"txn_id\"], \"left_anti\")</code>",
      "<code>ledger.join(bank, [\"account_id\", \"txn_id\"], \"full\")</code>",
      "<code>ledger.join(bank, ledger.account_id == bank.account_id &amp; ledger.txn_id == bank.txn_id, \"full\")</code>"
    ],
    correct:2,
    explain:`A list of names joins on both keys together and keeps one copy of each, and "full" (also "outer") keeps every row of both sides with nulls filling whichever side is missing. Option D is the tempting one because the join type is right, but in Python <code>&amp;</code> binds tighter than <code>==</code>, so without parentheses around each comparison the condition is built wrongly and fails. A left join drops bank lines missing from the ledger, and left_anti returns only the unmatched ledger rows.`
  },

  /* Ch 22 - Unions: union, unionAll and unionByName */
  {
    q:`Today's card-charge extract and yesterday's have the same schema. A customer was legitimately charged twice today for an identical amount, so two rows are exactly the same, and yesterday's extract already contains one copy of that row. The team needs the rows in today's extract that yesterday's does not contain, keeping duplicates. Which call fits?`,
    opts:[
      "<code>today.subtract(yesterday)</code>",
      "<code>today.exceptAll(yesterday)</code>",
      "<code>today.union(yesterday).distinct()</code>",
      "<code>today.unionAll(yesterday).dropDuplicates()</code>"
    ],
    correct:1,
    explain:`exceptAll is SQL EXCEPT ALL: it removes one matching row of today's for each row in yesterday's and preserves the remaining duplicate, so one of the two identical charges survives. subtract is the tempting choice, but it is EXCEPT DISTINCT, so both identical charges collapse and are removed by yesterday's single copy. A union followed by deduplication combines both days rather than finding what is new.`
  },

  /* Ch 23 - Reading with explicit schemas */
  {
    q:`A broker's trade files are CSV with a header row. amount must be an exact money type with 18 digits and 2 decimals, and trade_ts a timestamp, on every run, with no inference pass. Which read is correct?`,
    opts:[

      "<code>spark.read.schema(\"trade_id STRING, amount DOUBLE(18,2), trade_ts TIMESTAMP\").option(\"header\", True).csv(path)</code>",
      "<code>spark.read.option(\"inferSchema\", \"DECIMAL(18,2)\").option(\"header\", True).csv(path)</code>",
      "<code>spark.read.schema(\"trade_id STRING, amount DECIMAL(18,2), trade_ts TIMESTAMP\").option(\"header\", True).csv(path)</code>"
    ],
    correct:3,
    explain:`<code>schema()</code> accepts a DDL string of name TYPE pairs, and DECIMAL(18,2) is the exact type for money; with a schema supplied the reader skips inference and returns the declared types every run. Option A is the tempting StructType form, but the type classes must be instances with parentheses (<code>StringType()</code>), and DecimalType needs its precision and scale. DOUBLE takes no precision, and inferSchema is a true or false switch, not a type.`
  },

    q:`A job collects 500 flagged transactions with <code>rows = flagged.select("txn_id", "amount", "merchant").collect()</code>, where merchant is a nested struct (name, mcc). It builds payloads with <code>[r.asDict() for r in rows]</code>, but serializing them to JSON fails because each merchant value is still a Row. Which change gives plain nested dicts?`,
    opts:[

      "<code>flagged.select(\"txn_id\", \"amount\", \"merchant\").toList()</code>"
    ],
    correct:0,
    explain:`asDict() defaults to recursive=False, so a nested struct stays a Row inside the dict; <code>asDict(recursive=True)</code> converts the nested Rows to dicts as well. Option B is the tempting guess at a method name, but Row has no toDict. collect() takes no recursive argument, and a DataFrame has no toList() method.`
  },

  /* Ch 25 - Python UDFs */
  {
    q:`An IBAN check with no built-in equivalent is registered as <code>spark.udf.register("check_iban", check_iban, "boolean")</code>. The query <code>SELECT * FROM payments WHERE iban IS NOT NULL AND check_iban(iban)</code> still fails with a Python TypeError raised on None inside the function. Why, and what is the fix?`,
    opts:[
      "The register call needs the type IntegerType() for a boolean result",
      "Swap the conditions to check_iban(iban) AND iban IS NOT NULL, because SQL evaluates left to right",
      "Spark SQL does not guarantee the order in which subexpressions run, so the IS NOT NULL check does not shield the UDF; handle None inside the function",
      "A registered UDF cannot be used in a WHERE clause, only in the SELECT list"
    ],
    correct:2,
    explain:`Spark SQL makes no promise about evaluation order inside an expression, so the UDF can be called on a null iban even with the IS NOT NULL check written first; a SQL NULL arrives in Python as None, and the function must check for it. Option B is the tempting fix, but reordering relies on the same order guarantee that does not exist. A registered UDF works anywhere a function is allowed, and "boolean" is a valid return type.`
  },

  /* Ch 26 - Stateful operators and state stores */
  {
    q:`A streaming fraud model must remember, for each card_id, how many transactions it has seen at each merchant_id, across all micro-batches so far. The team writes a StatefulProcessor for <code>groupBy("card_id").transformWithStateInPandas(...)</code>. Which state variable fits?`,
    opts:[
      "A ValueState holding a single running count per card",
      "An accumulator per card, updated by each task and read back in <code>handleInputRows</code>",
      "A broadcast variable holding the counts, rebroadcast after every micro-batch",
      "A MapState from <code>handle.getMapState</code>, keyed by merchant_id with a count as the value"
    ],
    correct:3,
    explain:`State variables are kept per grouping key (here the card), and MapState holds a dict-like set of entries for that key, so each card keeps one count per merchant with containsKey, getValue and updateValue. ValueState is the tempting choice, but it holds one value per card, which loses the per-merchant breakdown. Accumulators can only be read on the driver and broadcast variables are read-only, so neither is state that tasks update across micro-batches.`
  },

  /* Ch 27 - Broadcast variables and accumulators */
  {
    q:`A scoring job builds a 30 MB dict <code>tiers</code> of merchant risk tiers on the driver and runs <code>bc = spark.sparkContext.broadcast(tiers)</code>. Its UDF body is <code>return tiers.get(merchant_id)</code>. The Spark UI still shows large task data shipped with every one of its 3,000 tasks. Why?`,
    opts:[
      "Broadcast variables only work inside RDD map functions, not in UDFs",
      "The UDF references the plain dict, so it is still serialized into every task's closure; the function must read <code>bc.value.get(merchant_id)</code>",
      "The broadcast was never sent because <code>bc.unpersist()</code> must be called first so executors fetch a fresh copy",
      "The dict should have been wrapped with <code>pyspark.sql.functions.broadcast(tiers)</code> instead"
    ],
    correct:1,
    explain:`A broadcast variable is cached once per executor, but tasks only use it when the function reads it through <code>.value</code>; referencing the original dict puts the dict itself into every task's closure. Option D is the tempting confusion: <code>functions.broadcast()</code> is a join hint that takes a DataFrame, not a Python dict. unpersist deletes the executor copies, and broadcast variables work fine inside UDFs.`
  },

  /* Ch 28 - Broadcast joins */
  {
    q:`An engineer joins a 2 TB <code>txns</code> table to a 6 MB <code>merchants</code> table on merchant_id and reads the physical plan: <code>BroadcastHashJoin [merchant_id], [merchant_id], Inner, BuildRight</code>, with a <code>BroadcastExchange</code> above the merchants scan and no <code>Exchange</code> above the txns scan. What does the plan say happened?`,
    opts:[
      "merchants, the right side, was copied whole to every executor as an in-memory hash table, and each task joined its own txns partition in place, so txns was never shuffled",
      "Both tables were shuffled by merchant_id into <code>spark.sql.shuffle.partitions</code> partitions, then sorted and merged",
      "txns, the larger side, was broadcast because BuildRight means the build side is the bigger table",
      "The join ran on the driver, which collected both tables before matching keys"
    ],
    correct:0,
    explain:`A BroadcastHashJoin with a BroadcastExchange on one side only means the small side was gathered and shipped once to each executor as a hash table, and BuildRight names the right side (merchants) as that broadcast side; with no Exchange above txns, the 2 TB side stayed where it was. Option B is the tempting description, but it is the sort-merge join, whose plan shows <code>SortMergeJoin</code> with an Exchange hashpartitioning and a Sort under both sides. The driver collects the small side before shipping it, but the matching runs on the executors.`
  },

  /* Ch 29 - repartition versus coalesce */
  {
    q:`A job writes 400 partitions of card transactions with <code>txns.write.partitionBy("region").parquet(out)</code>. There are 12 regions, and every region folder ends up with hundreds of small files, because every task holds rows of every region. Which change makes each region folder receive its rows from as few tasks as possible?`,
    opts:[
      "<code>txns.coalesce(12).write.partitionBy(\"region\").parquet(out)</code>",
      "<code>txns.repartition(\"region\").write.partitionBy(\"region\").parquet(out)</code>",
      "Set <code>spark.sql.files.maxPartitionBytes</code> to 1 GB before the write",
      "<code>txns.write.partitionBy(\"region\").option(\"numFiles\", 12).parquet(out)</code>"
    ],
    correct:1,
    explain:`repartition by a column hash-partitions rows so that all rows with the same region land in the same partition, so each task writes into one directory instead of all of them. coalesce(12) is the tempting choice because 12 matches the region count, but it only merges neighbouring partitions without regrouping by key, so each merged partition still holds many regions. maxPartitionBytes sizes input partitions on read, and numFiles is not a writer option.`
  },

  /* Ch 30 - Data skew and reducing shuffles */
  {
    q:`A join stage on a 64-core cluster runs 400 tasks. Its summary metrics show duration min 50 s, median 55 s, max 61 s, and shuffle read median 210 MB, max 230 MB, with no spill. The stage is too slow for the reporting deadline. What is the right reading?`,
    opts:[
      "This is data skew: salt the join key so the hot key spreads over several partitions",
      "This is data skew: AQE skew join handling will split the largest partition",
      "This is data skew: broadcast the larger side so no partition is overloaded",
      "This is not skew: tasks are uniformly sized, so skew fixes will not help; the stage is capacity-bound, so add cores or move less data by filtering and selecting before the shuffle"
    ],
    correct:3,
    explain:`The signature of skew is a max far above the median, with one task reading far more shuffle data; here max and median are within a few percent, so every task does a similar share and the stage is simply big for the cluster. Uniformly slow tasks call for more capacity or less shuffled data. Option B is the tempting answer because AQE is the default fix for skew, but no partition is anywhere near five times the median, so it would not split anything.`
  },

  /* Ch 31 - Adaptive Query Execution */
  {
    q:`On a busy shared cluster with AQE at its defaults, an engineer sees that after each shuffle AQE still leaves many post-shuffle partitions of only a few megabytes, far below the 64 MB advisory size, so stages run hundreds of tiny tasks. Which setting makes AQE coalesce toward the advisory size?`,
    opts:[
      "Set <code>spark.sql.adaptive.coalescePartitions.parallelismFirst</code> to false: by default AQE favors keeping tasks parallel and only enforces the 1 MB minimum",
      "Set <code>spark.sql.adaptive.coalescePartitions.enabled</code> to true, since coalescing is off by default",
      "Raise <code>spark.sql.shuffle.partitions</code> so AQE has more partitions to merge",
      "Lower <code>spark.sql.adaptive.advisoryPartitionSizeInBytes</code> to 1 MB"
    ],
    correct:0,
    explain:`With parallelismFirst true, the default, AQE prioritizes parallelism when coalescing and only guarantees the 1 MB minimum, which is why partitions stay small; the docs recommend setting it to false on a busy cluster so coalescing aims at the 64 MB advisory size. Option B is the tempting answer, but coalescing is already enabled by default. Raising the starting count only gives AQE more small pieces, and lowering the advisory size pushes in the wrong direction.`
  },

  /* Ch 31 - Adaptive Query Execution */
  {
    q:`Before running a join of trades with a filtered accounts table, an engineer runs explain() and sees <code>AdaptiveSparkPlan isFinalPlan=false</code> above a SortMergeJoin. After the query runs, the SQL tab of the Spark UI shows a BroadcastHashJoin for the same query. What happened?`,
    opts:[
      "explain() ran the query once and cached the accounts table, so the second run planned differently",
      "The Spark UI shows the plan of a different query, because explain() plans are never displayed there",
      "AQE re-planned at runtime: after the shuffle stage measured the filtered accounts side under the adaptive broadcast threshold, it switched the sort-merge join to a broadcast hash join; isFinalPlan=false marked the first plan as provisional",
      "Every broadcast hint is applied lazily, so a join always shows as sort-merge until it runs"
    ],
    correct:2,
    explain:`With AQE on, the plan printed before execution is the estimate-based initial plan, flagged <code>isFinalPlan=false</code>; once a shuffle stage reports real sizes, a join side under the broadcast threshold (10 MB by default) is converted to a broadcast hash join, and the final plan says <code>isFinalPlan=true</code>. Option A is the tempting explanation, but explain() never executes anything. A broadcast hint, when present, shows up in the plan before anything runs.`
  },

  /* Ch 32 - Logs and the Spark UI */
  {
    q:`A nightly ledger aggregation fails. The driver log shows ExecutorLostFailure (executor 12 exited caused by one of the running tasks); executor 12's stderr ends with java.lang.OutOfMemoryError: Java heap space; and the failing stage's summary metrics show a max shuffle read of 18 GB against a median of 300 MB. What is the best first fix?`,
    opts:[
      "Raise <code>spark.driver.memory</code>, since the driver log reported the failure",
      "Give that task less data: address the skewed partition (AQE skew join handling or salting the hot key, or more partitions), and only then consider more executor memory",
      "Raise <code>spark.driver.maxResultSize</code> so the results fit",
      "Set the log level to DEBUG with <code>setLogLevel</code> and rerun"
    ],
    correct:1,
    explain:`The executor's own log holds the root cause (heap exhausted), and the summary metrics show why: one task received about 60 times the median data, which is skew. The fix is to shrink what a single task holds; more executor memory comes after. Option A is the tempting misdirection: the driver log only reports that the job failed, while the memory that ran out was in an executor, and maxResultSize protects the driver from oversized collects.`
  },

  /* Ch 33 - The Structured Streaming model */
  {
    q:`A meter-telemetry stream uses <code>trigger(processingTime="1 minute")</code>. During a load spike one micro-batch takes 90 seconds. What does the engine do next?`,
    opts:[
      "It starts a second micro-batch in parallel at the one-minute mark, so two batches overlap",
      "It skips the missed interval and waits for the following one-minute boundary before the next batch",
      "It starts the next micro-batch right away when the overrunning batch finishes; and in an interval with no new data, no batch runs",
      "It fails the query, because a batch exceeded its trigger interval"
    ],
    correct:2,
    explain:`With a processing-time trigger the engine runs one micro-batch per interval; if a batch overruns, the next starts immediately after it, and if no new data has arrived, no batch runs. Option B is the tempting reading of "one per minute", but the engine does not wait for the next boundary after an overrun. Micro-batches of one query run one after another, never overlapping, and an overrun is not an error.`
  },

  /* Ch 34 - readStream, writeStream, output modes and sinks */
  {
    q:`A card-settlement stream must write every micro-batch to two Delta tables, a ledger and an audit copy, and a retried batch must not duplicate rows. Which design fits?`,
    opts:[
      "<code>writeStream.foreachBatch(write_both)</code>, where <code>write_both(batch_df, batch_id)</code> writes batch_df to both tables with ordinary batch writers and uses batch_id to make the writes idempotent",
      "Two separate writeStream queries on the same DataFrame that share one checkpointLocation, so their progress stays aligned",
      "<code>writeStream.format(\"delta\").option(\"path\", \"/ledger,/audit\")</code>, which fans out to both locations",
      "<code>writeStream.format(\"console\")</code>, then copy the output into both tables"
    ],
    correct:0,
    explain:`foreachBatch hands each micro-batch to a function as an ordinary DataFrame plus a unique batch ID, so any batch writer works, including several sinks in one function; it is at-least-once by default, and the batch ID is how the writes are made idempotent. Option B is the tempting design, but a checkpoint location belongs to exactly one query and must never be shared. A sink path is a single location, and the console sink is for debugging and is not fault tolerant.`
  },

  /* Ch 35 - Streaming operations: select, filter, window and aggregation */
  {
    q:`A stream counts card authorizations per merchant with <code>groupBy(window("ts", "15 minutes"), "merchant_id").count()</code>. One authorization is stamped exactly 14:30:00. Which window does it count toward?`,
    opts:[
      "14:15 to 14:30, because the timestamp marks the end of that window",
      "Both 14:15 to 14:30 and 14:30 to 14:45, because it sits on the boundary",
      "Neither: a row exactly on a boundary is dropped as ambiguous",
      "14:30 to 14:45, because window starts are inclusive and ends are exclusive"
    ],
    correct:3,
    explain:`A tumbling window is fixed and non-overlapping, so every event belongs to exactly one window, and starts are inclusive while ends are exclusive: 14:30:00 opens the 14:30 to 14:45 window. Option A is the tempting reading of the boundary as an end time, but the end is exclusive, so 14:30:00 is not in the earlier window. Counting in two windows only happens with a sliding window, which needs a slide argument.`
  },

  /* Ch 36 - Streaming deduplication */
  {
    q:`A card-transaction stream deduplicates exact replicas with <code>withWatermark("event_ts", "30 minutes").dropDuplicates(["txn_id", "event_ts"])</code>. An offline terminal later uploads a batch of genuine transactions two hours late, and they never appear in the output, although none of them is a duplicate. Why?`,
    opts:[
      "dropDuplicates keeps them in state but the output mode hides rows already seen",
      "Rows older than the watermark are dropped as too late, duplicates or not; keeping them needs a longer watermark delay, at the cost of more state",
      "Their txn_id values collided with other transactions, so they were treated as duplicates",
      "The state store provider evicted their keys because state was full"
    ],
    correct:1,
    explain:`With a watermark, deduplication state is bounded, and rows behind the watermark are dropped as too late, whether or not they are duplicates; a two-hour-late row is far behind a 30-minute watermark. Option C is the tempting explanation, but the subset includes event_ts, so only rows with the same id and the same timestamp count as duplicates. The delay is the trade: longer keeps late rows, but holds more keys in state.`
  },

  /* Ch 37 - Spark Connect */
  {
    q:`A platform team on Spark 4.0 wants an existing classic PySpark application to run through Spark Connect without editing its code, to check it is ready for a later move to a remote server. Which setting does that?`,
    opts:[
      "<code>spark-submit --deploy-mode connect app.py</code>",
      "<code>SparkSession.builder.master(\"connect\").getOrCreate()</code> inside the application",
      "Install pyspark-client next to full PySpark and keep running in classic mode",
      "Set <code>spark.api.mode</code> to connect, so the classic application runs through a local Spark Connect server"
    ],
    correct:3,
    explain:`Spark 4.0 adds <code>spark.api.mode</code>, which is classic by default; set to connect, a classic application runs through a local Spark Connect server with no code change, which surfaces any reliance on RDDs or SparkContext. Option C is the tempting one because pyspark-client is the Connect package, but installing it changes nothing about how this application runs, and it can only connect to a server. There is no connect deploy mode, and "connect" is not a master URL.`
  },

  /* Ch 38 - Deployment modes: local, client, cluster */
  {
    q:`A risk engineer submits <code>spark-submit --master yarn --deploy-mode cluster var_job.py</code> from a laptop. The job succeeds, but none of the script's progress lines printed with print() appear in the laptop's terminal. Where are they?`,
    opts:[
      "Nowhere: print() is suppressed for every job submitted with spark-submit",
      "In the executor logs, because in cluster mode the whole script runs inside tasks",
      "In the driver's logs on the cluster, because YARN launched the driver in a container on a cluster node, reachable through the Spark UI and the cluster manager's logs",
      "In the terminal only if --verbose is added to spark-submit"
    ],
    correct:2,
    explain:`Cluster mode puts the driver on a node inside the cluster, so output the driver prints lands in its logs there rather than on the submitting machine's console; client mode is the one that keeps the driver, and its output, with the submitter. Option B is the tempting answer, but the script's top-level code runs in the driver, not in tasks; only functions such as UDFs run on executors. --verbose prints submission details, not the remote driver's output.`
  },

  /* Ch 38 - Deployment modes: local, client, cluster */
  {
    q:`A quant runs <code>spark-submit --master local[8] backtest.py</code> on a 64-core server that is also a YARN gateway. The Spark UI shows a single executor entry, 8 task slots, and no other machines involved. What is going on?`,
    opts:[
      "<code>local[8]</code> runs the driver and the executor in one JVM on this machine, with 8 task threads; to use the cluster, submit with <code>--master yarn</code>",
      "<code>local[8]</code> requests 8 executors from YARN, and the others are still being provisioned",
      "The job is in client mode on YARN with 8 executors, and the UI only lists the driver's host",
      "The job is in cluster mode on 8 nodes, and the UI hides remote executors"
    ],
    correct:0,
    explain:`Local mode puts the driver and a single executor in one JVM on one machine, and the number in brackets is the count of task threads, so the backtest never leaves the server. Option B is the tempting reading of the number, but local mode has no cluster manager to ask for executors at all. Reaching YARN requires <code>--master yarn</code>, and then the deploy mode decides where the driver runs.`
  },

  /* Ch 39 - Pandas API on Spark */
  {
    q:`A Spark job condenses 2 billion meter readings into a daily summary of about 5,000 rows. An analyst now wants to run that summary through several plain pandas and SciPy routines on the driver for a one-off chart. Which approach fits?`,
    opts:[
      "Never convert: <code>to_pandas()</code> always collects the full source data, so keep the summary in Pandas API on Spark and skip SciPy",
      "Call <code>pandas_api()</code> on the summary and pass the result straight to SciPy, since it is a pandas DataFrame",
      "Convert the small summary to plain pandas (for example <code>summary.pandas_api().to_pandas()</code> or <code>summary.toPandas()</code>) and work locally, because it fits easily on the driver",
      "Wrap each SciPy routine in a row-at-a-time Python UDF and apply it to the summary"
    ],
    correct:2,
    explain:`Plain pandas is the right tool once data fits comfortably in one machine's memory, such as a small aggregated result after Spark has done the heavy lifting; collecting 5,000 rows to the driver is safe. Option A is the tempting overcorrection: to_pandas() collects only the frame it is called on, so the warning applies to large data, not a small summary. pandas_api() returns a distributed pandas-on-Spark frame, not a local pandas DataFrame, and a row-at-a-time UDF adds cost for nothing.`
  },

  /* Ch 40 - Pandas UDFs */
  {
    q:`A payments parser turns each raw gateway message into zero, one or several transaction rows, using vectorized pandas code. No grouping is needed. Which approach fits?`,
    opts:[
      "A Series to Series <code>@pandas_udf</code> applied with withColumn",
      "A Series to Scalar <code>@pandas_udf</code> applied with <code>agg()</code>",
      "<code>raw.applyInPandas(parse, schema)</code> called directly on the DataFrame",
      "<code>raw.mapInPandas(parse, schema)</code>, where parse takes an iterator of pandas DataFrames for each partition and yields DataFrames with any number of rows"
    ],
    correct:3,
    explain:`mapInPandas runs a plain function over each partition as an iterator of pandas DataFrames, with no grouping, and its output, described by the schema, may add or drop rows. Option A is the tempting one, but a Series to Series UDF must return exactly as many values as it receives, so it cannot turn one message into several rows. applyInPandas is a method of grouped data (after groupBy), and a Series to Scalar UDF returns one value per group.`
  },

];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
