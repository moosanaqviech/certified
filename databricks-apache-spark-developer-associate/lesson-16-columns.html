  /* 1: the four verbs */
  { html: `
    <div class="eyebrow reveal">The toolkit</div>
    <h2 class="reveal">Four verbs, one rule</h2>
    <p class="lead reveal" style="margin-bottom:16px">Each method <strong>returns a new DataFrame</strong> and leaves the one it was called on unchanged. That is why column work in Spark reads as a chain of calls.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>select(*cols)</b>Pick and compute columns. The result holds exactly the columns listed.</p></div>
      <div class="pill"><p><b>withColumn(name, col) and withColumns({...})</b>Add a column, or replace an existing one with the same name.</p></div>
      <div class="pill"><p><b>withColumnRenamed(existing, new) and withColumnsRenamed({...})</b>Change a name; the values stay as they were.</p></div>
      <div class="pill"><p><b>drop(*cols)</b>Remove one or several columns.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 2: select */

    <h2 class="reveal" style="font-size:26px">Strings, col() and expr()</h2>
    <div class="codeblock reveal" style="white-space:pre-wrap"><span class="kw">from</span> pyspark.sql.functions <span class="kw">import</span> col, expr
df.select(<span class="st">"name"</span>, <span class="st">"age"</span>)              <span class="cm"># names</span>
df.select(col(<span class="st">"age"</span>) + 1)             <span class="cm"># a Column</span>
df.select(<span class="st">"*"</span>, expr(<span class="st">"length(name)"</span>))  <span class="cm"># SQL text</span>
<span class="al">df.select(<span class="st">"name"</span>, (col(<span class="st">"age"</span>) + 10).alias(<span class="st">"age"</span>))</span></div>
    <div class="pills reveal" style="margin-top:14px">
      <div class="pill"><p><b>Strings name columns</b>To compute, build a Column with <code>col("age")</code> (or <code>df.age</code>) and use operators, or hand SQL text to <code>expr()</code>, which parses it into a Column.</p></div>
      <div class="pill"><p><b>alias() names the result</b>A computed column gets a generated name such as <code>length(name)</code>. <code>.alias("...")</code> sets your own.</p></div>
      <div class="pill"><p><b>Only what is listed survives</b><code>select</code> returns exactly its arguments; <code>"*"</code> expands to every existing column.</p></div>

  { steps: 3,
    html: `
    <div class="eyebrow reveal">withColumn</div>
    <h2 class="reveal" style="font-size:24px">A new name adds, the same name replaces</h2>
    <div class="art reveal" style="min-height:0;margin-bottom:12px">${A.wc}</div>
    <div class="stepcaps">
      <p class="lead" data-step="0" style="font-size:14px">The signature is <code>withColumn(colName, col)</code>: a string name, then a Column. Tap to apply three calls.</p>
      <p class="lead" data-step="1" style="font-size:14px"><code>.withColumn("total", col("price") * col("qty"))</code>: <strong>total</strong> does not exist yet, so it is added.</p>
      <p class="lead" data-step="2" style="font-size:14px"><code>.withColumn("item", upper(col("item")))</code>: <strong>item</strong> already exists, so it is replaced. No error, no second item column.</p>
      <p class="lead" data-step="3" style="font-size:14px"><code>.withColumns({"tax": col("total") * 0.1, "source": lit("web")})</code> adds both at once. Each <code>withColumn</code> adds a projection, and the docs warn that many calls (a loop, say) build big plans, even a <code>StackOverflowException</code>: use <code>withColumns</code> or one <code>select</code>.</p>
    </div>` },

<span class="cm"># several at once: a dict of existing to new</span>
df.withColumnsRenamed({<span class="st">"mName"</span>: <span class="st">"managerName"</span>,
                       <span class="st">"div"</span>: <span class="st">"division"</span>})</div>
    <div class="pills reveal" style="margin-top:14px">
      <div class="pill"><p><b>Reversed arguments fail silently</b>On a DataFrame with no <code>managerName</code> column, <code>withColumnRenamed("managerName", "mName")</code> is a <strong>no-op</strong>: no error, nothing renamed. Read it as "rename existing to new".</p></div>
      <div class="pill"><p><b>Two strings, nothing else</b>The new name is a plain string, never <code>lit(...)</code> or <code>col(...)</code>. There is no <code>columns=</code> keyword (that is the pandas <code>rename</code> shape); the dict form is <code>withColumnsRenamed</code>.</p></div>

    <h2 class="reveal" style="font-size:26px">Remove, set a constant, change a type</h2>
    <div class="codeblock reveal" style="white-space:pre-wrap"><span class="kw">from</span> pyspark.sql.functions <span class="kw">import</span> col, lit
df.drop(<span class="st">"division"</span>)                  <span class="cm"># one column</span>
df.drop(<span class="st">"division"</span>, <span class="st">"mName"</span>)         <span class="cm"># several</span>
<span class="al">df.withColumn(<span class="st">"country"</span>, lit(<span class="st">"US"</span>))</span>
df.withColumn(<span class="st">"sales"</span>, col(<span class="st">"sales"</span>).cast(<span class="st">"double"</span>))</div>
    <div class="pills reveal" style="margin-top:14px">
      <div class="pill"><p><b>drop</b>Takes one or more names (or Column objects), each as its own argument. A name that is not in the schema is a no-op, not an error.</p></div>
      <div class="pill"><p><b>lit()</b>The second argument of <code>withColumn</code> must be a Column, so a constant goes through <code>lit()</code>, which creates a Column of that literal value on every row.</p></div>
      <div class="pill"><p><b>cast()</b>Takes a type string such as <code>"double"</code> or a DataType such as <code>StringType()</code>. With ANSI mode on (the Spark 4.0 default), a malformed value such as <code>"abc"</code> cast to int raises <code>CAST_INVALID_INPUT</code> instead of returning null.</p></div>
    </div>` },

  /* 6: the sample-question chain, step build */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">Putting it together</div>
    <h2 class="reveal" style="font-size:23px">Replace one column, rename another</h2>
    <div class="art reveal" style="min-height:0;margin-bottom:12px">${A.chain}</div>
    <div class="stepcap-swap">
      <p class="lead" data-step="0" style="font-size:14.5px">Task: in <code>storesDF</code>, replace <code>division</code> with a new column named <code>state</code>, and rename <code>mName</code> to <code>managerName</code>. Tap to add one call at a time.</p>
      <p class="lead" data-step="1" style="font-size:14.5px"><strong>withColumn</strong> takes the name as a string and the values as a Column: <code>col("division")</code> copies division into <strong>state</strong>. Swapping the two arguments is a wrong answer.</p>
      <p class="lead" data-step="2" style="font-size:14.5px"><strong>drop</strong> removes the old column. Add-then-drop is how "replace a column with a differently named one" is written.</p>
      <p class="lead" data-step="3" style="font-size:14.5px"><strong>withColumnRenamed</strong> takes the existing name first. Every call returned a new DataFrame, so the whole thing is one chain: <code>storesDF.withColumn(...).drop(...).withColumnRenamed(...)</code>.</p>
    </div>` },

  /* 7: quiz, mirrors sample question 3 */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:19px">In <code>ordersDF</code>, the <code>region</code> column must be replaced by a new column named <code>territory</code> with the same values, and <code>cName</code> must be renamed to <code>customerName</code>. Which code block does both?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false" style="font-size:13px;overflow-wrap:anywhere"><span class="key">A</span><span>ordersDF.withColumn("territory", col("region")).drop("region").withColumnRenamed("customerName", "cName")</span></button>
      <button class="choice" data-correct="true" style="font-size:13px;overflow-wrap:anywhere"><span class="key">B</span><span>ordersDF.withColumn("territory", col("region")).drop("region").withColumnRenamed("cName", "customerName")</span></button>
      <button class="choice" data-correct="false" style="font-size:13px;overflow-wrap:anywhere"><span class="key">C</span><span>ordersDF.withColumn(col("region"), "territory").drop("region").withColumnRenamed("cName", "customerName")</span></button>
    </div>
    <div class="feedback"><b>Correct.</b> <code>withColumn</code> takes the new column's name as a string and its values as a Column, <code>drop</code> removes <code>region</code>, and <code>withColumnRenamed</code> takes the existing name first. Option A is the trap: its rename is reversed, and since <code>ordersDF</code> has no <code>customerName</code> column the call is a no-op, so <code>cName</code> quietly survives. Option C swaps the <code>withColumn</code> arguments: the first must be a string name, the second a Column.</div>` },

  /* 8: quiz, withColumn on an existing name */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px"><code>payments</code> has columns <code>id</code> and <code>amount</code>, where amount is a string. An engineer runs <code>payments2 = payments.withColumn("amount", col("amount").cast("double"))</code>. What is true afterwards?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>The call fails because amount already exists; it must be dropped or renamed first</button>
      <button class="choice" data-correct="false"><span class="key">B</span>payments2 has id, the original string amount, and a second amount column of type double</button>
      <button class="choice" data-correct="true"><span class="key">C</span>payments2 has id and amount, now a double; payments still has its string amount</button>
    </div>
    <div class="feedback"><b>Correct.</b> <code>withColumn</code> adds a column or replaces the existing column with the same name, so the string amount is swapped for the double one and there are still two columns. Option B is the tempting distractor: <code>withColumn</code> never creates a duplicate name. Option A is wrong because replacing is the documented behavior, not an error. And because the method returns a new DataFrame, <code>payments</code> itself is unchanged.</div>` },

  /* 9: done */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>

    <p class="lead reveal" style="text-align:center;margin-bottom:20px">You can add, replace, rename and drop columns, and spot a reversed or mistyped argument.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>select</b>Strings are names; <code>col()</code> and <code>expr()</code> build Columns; <code>alias()</code> names a computed one. Only listed columns survive.</p></div>
      <div class="pill"><p><b>withColumn(name, Column)</b>A new name adds, an existing name replaces. <code>withColumns({...})</code> for several; a long loop of <code>withColumn</code> grows the plan. <code>lit()</code> for constants, <code>cast()</code> for types.</p></div>

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ----------
   v2 adds opt-in, per-card step builds on top of the v1 card engine. A card
   with no `steps` field takes exactly the v1 paths below and renders and
   behaves identically; every v2 branch is guarded by `steps` being present. */
const ENGINE_VERSION = 'v2';
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};
const stepState = {};   // v2: current revealed step per card index (mirrors `answered`)

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

/* v2: apply step visibility for one card WITHOUT touching its .in class, so a
   step reveal never replays the card-entrance .reveal stagger. Cumulative for
   normal elements (data-step <= current). Captions append by default: inside
   .stepcaps they accumulate too (data-step="0" is the pre-first-tap caption),
   and captions behind the current step get .step-past (dimmed) while the
   current one stays at full strength. A .stepcap-swap container (or legacy
   .stepcap) opts into swap: only the caption whose data-step equals the
   current step is shown. */
function applySteps(idx) {
  const cur = stepState[idx] || 0;
  els[idx].querySelectorAll('[data-step]').forEach(function(nd) {
    const s = parseInt(nd.getAttribute('data-step'), 10);
    const swapCap = nd.closest && nd.closest('.stepcap-swap, .stepcap');
    const appendCap = !swapCap && nd.closest && nd.closest('.stepcaps');
    const on = swapCap ? (s === cur) : appendCap ? (s <= cur) : (s >= 1 && s <= cur);
    nd.classList.toggle('step-on', on);
    nd.classList.toggle('step-past', !!appendCap && on && s < cur);
  });
}

/* Card layout: the only place that adds/removes .in (and thus replays reveal).
   Called on card change, never on a step advance. */
function layout() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
    applySteps(idx);   // persists built state on revisit
  });
  glow.style.background = cards[i].glow || 'transparent';
}

/* Footer/button state only. Safe to call after a step advance (no reveal). */
function updateFooter() {
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  const total = c.steps || 0;
  const stepsLeft = total > 0 && (stepState[i] || 0) < total;
  if (stepsLeft) { nextBtn.disabled = false; nextBtn.textContent = (i === 0) ? 'Begin lesson' : 'Continue'; }
  else if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
}

function render() {
  layout();
  updateFooter();
  if (cards[i].quiz) wireQuiz(els[i], i);
}

/* v2: reveal the next step of the current card. Returns true if a step was
   consumed (so the caller does not also advance the card). */
function advanceStep(idx) {
  const total = cards[idx].steps || 0;
  if (!total) return false;
  const cur = stepState[idx] || 0;
  if (cur >= total) return false;
  stepState[idx] = cur + 1;
  applySteps(idx);
  updateFooter();
  return true;
}

/* v2: reveal every remaining step at once (swipe-left escape hatch). */
function skipSteps(idx) {
  const total = cards[idx].steps || 0;
  if (!total || (stepState[idx] || 0) >= total) return false;
  stepState[idx] = total;
  applySteps(idx);
  updateFooter();
  return true;
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

/* Primary action. On a step card mid-build this reveals the next step; once
   the steps are done (or on a card with none) it advances, honoring the quiz
   gate exactly as v1 did. Shared by the Continue button and ArrowRight. */
function handleNext() {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  if (advanceStep(i)) return;
  go(i + 1);
}
nextBtn.onclick = handleNext;
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* v2: tapping anywhere on a step card advances one step; once built, a tap
   advances the card (gate permitting). Cards with no steps ignore taps, so
   this listener is inert on v1-style cards. Elements with their own behavior
   (quiz choices, links) are skipped so a tap never double-fires. */
vp.addEventListener('click', e => {
  const c = cards[i];
  if (!c.steps) return;
  if (e.target.closest('.choice, a')) return;
  if ((stepState[i] || 0) < c.steps) { advanceStep(i); return; }
  if (!nextBtn.disabled && !c.last) go(i + 1);
});

/* Keys and swipes only move between cards (or, for a step card, between
   steps). Leaving the lesson always takes a deliberate tap, so a stray swipe
   on the final card cannot navigate away. ArrowRight mirrors the Continue
   button step-wise; ArrowLeft mirrors Back. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) handleNext();
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  // Swipe left: skip any remaining steps and advance in one gesture, honoring
  // the quiz gate (updateFooter re-derives nextBtn.disabled after the skip).
  if (dx < -50 && !cards[i].last) { skipSteps(i); if (!nextBtn.disabled) go(i + 1); }
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
</html>
