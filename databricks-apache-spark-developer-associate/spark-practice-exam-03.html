<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 3",
  badge: "Databricks Spark Developer Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer.",
  coverage: "Covers chapters 29-40: Unit 4 (troubleshooting and tuning), Unit 5 (Structured Streaming), Unit 6 (Spark Connect and deployment) and Unit 7 (Pandas API on Spark). One question per chapter.",
  minutes: 24,
  pass: 70
};

const QUESTIONS = [

  /* Ch 29 - repartition versus coalesce */
  {
    ref:{chapter:29},
    q:`A job aggregates a 2 TB table with <code>groupBy</code>; the aggregated result is about 4 GB, spread over 2,000 small, roughly even shuffle partitions. Before writing it as Parquet, the team wants about 40 output files, and wants to avoid paying for another full shuffle. Which call fits?`,
    opts:[
      "<code>df.repartition(40)</code>, because only repartition can reduce the number of partitions",
      "<code>df.coalesce(40)</code>, which merges existing partitions without a shuffle",
      "<code>df.coalesce(4000)</code> followed by <code>repartition(40)</code>, so partitions are balanced first",
      "Set <code>spark.sql.shuffle.partitions</code> to 40, since that controls the file count of any write"
    ],
    correct:1,
    explain:`<code>coalesce(n)</code> only lowers the partition count, and it does so by merging existing partitions on their executors, with no shuffle, which is exactly the cheap reduction wanted when the partitions are already even. <code>repartition(40)</code> also reaches 40, which makes it tempting, but it pays for a full shuffle of the data, the cost the team wants to avoid. A larger number passed to coalesce is ignored, and <code>spark.sql.shuffle.partitions</code> only sets the count after a shuffle; the team wants no further shuffle before the write.`
  },

  /* Ch 30 - Data skew and reducing shuffles */
  {
    ref:{chapter:30},
    q:`A join between <code>clicks</code> (4 TB) and <code>pages</code> (900 GB) stalls at 199 of 200 tasks. The Spark UI's summary metrics for the stage show a median shuffle read of 1.5 GB and a max of 210 GB, and about 60% of clicks have <code>page_id = 'home'</code>. Which change is most likely to finish the stage?`,
    opts:[
      "Raise <code>spark.sql.shuffle.partitions</code> from 200 to 2,000 so each partition is smaller",
      "Add a <code>broadcast()</code> hint on <code>pages</code> so no shuffle is needed",
      "Call <code>cache()</code> on <code>clicks</code> before the join",
      "Salt the hot key: add a random suffix to <code>page_id</code> on <code>clicks</code> and replicate the matching <code>pages</code> rows for each suffix, then join on the salted key"
    ],
    correct:3,
    explain:`The max-versus-median gap and one dominant key point to skew: every row for 'home' hashes to the same partition, so one task does a huge share of the work. Salting spreads that one key across many partitions. Raising the partition count is the tempting fix, but all rows with the same key still land in the same partition, so the straggler barely shrinks. A 900 GB table is far too large to broadcast, and caching does not change how rows are distributed.`
  },

  /* Ch 31 - Adaptive Query Execution */
  {
    ref:{chapter:31},
    q:`On Spark 4.0 with default settings, a team plans a join of a large fact table with a dimension table that a filter shrinks to about 5 MB at runtime, although the optimizer's file-size estimate for it is 2 GB. What does Adaptive Query Execution do here?`,
    opts:[
      "Once the filtered dimension's shuffle stage finishes and reports its real size, AQE can replace the planned sort-merge join with a broadcast hash join",
      "Nothing: AQE is disabled by default and must be turned on with <code>spark.sql.adaptive.enabled</code>",
      "AQE rewrites the plan before the first stage runs, using the 2 GB estimate to choose a shuffle hash join",
      "AQE caches the dimension table so the next run of the query can broadcast it"
    ],
    correct:0,
    explain:`AQE re-optimizes at stage boundaries using statistics from stages that have already run, so when the dimension side turns out to be about 5 MB, below the broadcast threshold, it can convert the sort-merge join to a broadcast hash join. It is on by default (<code>spark.sql.adaptive.enabled</code> has defaulted to true since Spark 3.2), which rules out the tempting "disabled" answer. AQE works from runtime statistics, not the static estimate, and it does not cache data between runs.`
  },

  /* Ch 32 - Logs and the Spark UI */
  {
    ref:{chapter:32},
    q:`A nightly job fails. The driver log ends with <code>Total size of serialized results of 312 tasks (4.1 GiB) is bigger than spark.driver.maxResultSize (4.0 GiB)</code>. The job's last step is <code>rows = df.collect()</code>, followed by a Python loop that writes each row to a file. What is the best fix?`,
    opts:[
      "Give the executors more memory, since the tasks produced the oversized results",
      "Raise <code>spark.sql.shuffle.partitions</code> so each task returns less data",
      "Stop collecting to the driver: write the DataFrame out with <code>df.write</code> so the executors write in parallel",
      "Set <code>spark.driver.maxResultSize</code> to 0 so the limit is removed"
    ],
    correct:2,
    explain:`The error is raised by the driver: <code>collect()</code> is pulling every row into one process, and the loop then writes them one by one. Writing with the DataFrame writer keeps the data on the executors and writes in parallel, removing the bottleneck. Removing the limit is the tempting quick fix, but the driver would then try to hold over 4 GiB of results and is likely to fail with an out-of-memory error instead. Executor memory and the shuffle partition count do not change how much the driver is asked to receive.`
  },

  /* Ch 33 - The Structured Streaming model */
  {
    ref:{chapter:33},
    q:`A streaming job reads Kafka, aggregates, and writes to a Delta table with a <code>checkpointLocation</code>. After a crash it is restarted with the same code but a <em>new, empty</em> checkpoint directory. Which outcome should the team expect?`,
    opts:[
      "Exactly-once results continue, because the Delta sink remembers which batches it committed for every query",
      "The query does not resume from the previous run's progress: the old offsets and aggregation state are lost, so data can be reprocessed or skipped and the aggregates start over",
      "The restart fails, because a streaming query cannot change its checkpoint location",
      "Nothing changes, because Kafka itself stores the query's offsets and state"
    ],
    correct:1,
    explain:`The checkpoint location holds the query's progress: the offsets it has processed (the write-ahead log) and its aggregation state. A new, empty checkpoint means a new query with no memory, so it starts from the configured starting offsets and rebuilds state from scratch, breaking the exactly-once guarantee for the restart. The tempting answer credits the sink, but the sink's idempotence relies on the batch IDs recorded in that same checkpoint. Kafka does not store Structured Streaming's state, and nothing stops a query from starting with a new location.`
  },

  /* Ch 34 - readStream, writeStream, output modes and sinks */
  {
    ref:{chapter:34},
    q:`A stream counts error events per <code>service</code> with no watermark. A dashboard reads a Kafka topic and wants every service's current total on every trigger; there are about 40 services and the number never grows. Which output mode fits?`,
    opts:[
      "<code>complete</code>: rewrite the full, small result table on every trigger",
      "<code>append</code>: each service's count is written once",
      "<code>update</code> to a Parquet file sink, so only changed services are written",
      "<code>complete</code> with a Parquet file sink, so the dashboard can read files"
    ],
    correct:0,
    explain:`An aggregation with no watermark supports update and complete, and complete outputs every row of the result table each trigger, which is what a dashboard showing every service's total wants. With about 40 fixed keys, keeping all state forever costs nothing. Append is the tempting default, but an aggregation without a watermark cannot use append because counts keep changing. The file sink accepts append only, so the two file-sink answers are rejected when the query starts.`
  },

  /* Ch 35 - Streaming operations: window and aggregation */
  {
    ref:{chapter:35},
    q:`A stream of sensor readings computes the average temperature per sensor in 5-minute event-time windows. Readings can arrive up to 10 minutes late. Without changing the results for on-time or 10-minute-late data, the team wants the aggregation's state to stop growing forever. Which code fits?`,
    opts:[
      "<code>readings.groupBy(\"sensor\", window(\"ts\", \"5 minutes\")).avg(\"temp\")</code> with a 10-minute trigger",
      "<code>readings.withWatermark(\"ts\", \"5 minutes\").groupBy(\"sensor\", window(\"ts\", \"10 minutes\")).avg(\"temp\")</code>",
      "<code>readings.groupBy(\"sensor\", window(\"ts\", \"5 minutes\", \"10 minutes\")).avg(\"temp\")</code>",
      "<code>readings.withWatermark(\"ts\", \"10 minutes\").groupBy(\"sensor\", window(\"ts\", \"5 minutes\")).avg(\"temp\")</code>"
    ],
    correct:3,
    explain:`<code>withWatermark("ts", "10 minutes")</code> tells Spark how late data may arrive, so once the watermark passes a window's end that window is final and its state is dropped, while readings up to 10 minutes late are still counted. Option B is the tempting one because it adds a watermark, but it swaps the two durations: the windows become 10 minutes wide and data more than 5 minutes late is dropped. A trigger interval does not bound state, and the third argument to <code>window</code> is a slide, which creates overlapping windows rather than a lateness limit.`
  },

  /* Ch 36 - Streaming deduplication */
  {
    ref:{chapter:36},
    q:`A payment stream can deliver the same <code>payment_id</code> twice. A retry may carry a different <code>event_ts</code>, up to 30 minutes after the original. Which deduplication catches those retries while keeping state bounded?`,
    opts:[
      "<code>payments.dropDuplicates([\"payment_id\"])</code> with no watermark",
      "<code>payments.withWatermark(\"event_ts\", \"30 minutes\").dropDuplicates([\"payment_id\", \"event_ts\"])</code>",
      "<code>payments.withWatermark(\"event_ts\", \"1 hour\").dropDuplicatesWithinWatermark([\"payment_id\"])</code>",
      "<code>payments.distinct()</code>"
    ],
    correct:2,
    explain:`<code>dropDuplicatesWithinWatermark</code> keys on the id alone, so copies with different timestamps still match, and it drops a key's state once the watermark passes, keeping state bounded; a delay longer than the largest gap between copies (one hour against 30 minutes) makes sure retries are still caught. Option B is the tempting one because it is bounded, but putting <code>event_ts</code> in the key means a retry with a new timestamp is not a duplicate. Option A catches every retry but keeps every payment id in state forever, and <code>distinct()</code> compares whole rows, so a retry with a different timestamp is not removed either.`
  },

  /* Ch 37 - Spark Connect */
  {
    ref:{chapter:37},
    q:`A platform team runs a shared Spark Connect server. One data scientist's local notebook process, connected as a Spark Connect client, crashes after its own pandas code runs out of memory on the laptop. Under Spark Connect, what happens to the other users' sessions on that server?`,
    opts:[
      "They keep running: the client is a separate process from the server's driver, so its crash takes down only that client",
      "They all fail, because every Spark Connect client shares one Python interpreter on the server",
      "They pause until the failed client reconnects with the same session ID",
      "They fail, because the client's crash also stops the Spark Connect server's JVM"
    ],
    correct:0,
    explain:`Stability is one of Spark Connect's headline benefits: the client is decoupled from the driver and talks to it over gRPC, so a client process that exhausts its own memory affects only itself; the server and the other sessions carry on. In classic mode the application and the driver are tightly coupled, which is where the tempting "server stops too" answer comes from. Clients do not share an interpreter on the server, and other sessions do not wait on a crashed one.`
  },

  /* Ch 38 - Deployment modes: local, client, cluster */
  {
    ref:{chapter:38},
    q:`A developer writes unit tests for PySpark transformations that must run in a CI container with no cluster available, using all of the container's CPU cores. How should the tests create their SparkSession?`,
    opts:[
      "<code>SparkSession.builder.remote(\"sc://localhost:15002\")</code>, because tests should always use Spark Connect",
      "Submit the tests with <code>--deploy-mode cluster</code> so the driver runs on a worker",
      "Submit the tests with <code>--deploy-mode client</code> against a YARN cluster",
      "<code>SparkSession.builder.master(\"local[*]\").getOrCreate()</code>, which runs the driver and executor in one JVM with a thread per core"
    ],
    correct:3,
    explain:`Local mode needs no cluster manager: the driver and executor share one JVM on one machine, and <code>local[*]</code> gives one task thread per logical core, which is what development and CI tests need. Client mode is the tempting distractor because it is the default deploy mode, but it still needs a cluster to host the executors, and cluster mode needs a cluster to place the driver on. A Spark Connect URL only works when a Spark Connect server is running, which the container does not have.`
  },

  /* Ch 39 - Pandas API on Spark */
  {
    ref:{chapter:39},
    q:`An analyst converts a large Spark DataFrame with <code>psdf = sdf.pandas_api()</code> and notices that operations on <code>psdf</code> spend extra computation building an index. The table already has a unique <code>order_id</code> column. What change avoids the extra work?`,
    opts:[
      "Set <code>compute.default_index_type</code> to <code>sequence</code>, which is the cheapest index type",
      "Call <code>sdf.pandas_api(index_col=\"order_id\")</code> so the existing key becomes the index and no default index has to be generated",
      "Use <code>sdf.toPandas()</code> instead, which needs no index",
      "Call <code>psdf.to_spark()</code> right away and work in the DataFrame API"
    ],
    correct:1,
    explain:`A pandas-on-Spark frame needs an index; when none is named, Spark attaches a default one (distributed-sequence by default), which takes extra computation to number the rows. Naming an existing unique column with <code>index_col</code> skips that. The <code>sequence</code> index is the tempting choice but the most expensive at scale, because it numbers rows on a single partition. <code>toPandas()</code> collects the whole large table to the driver, and switching straight back to Spark throws away the pandas syntax the analyst wanted.`
  },

  /* Ch 40 - Pandas UDFs */
  {
    ref:{chapter:40},
    q:`A column-level calculation has no built-in function, and a row-at-a-time Python UDF is too slow. Which definition creates a Pandas UDF that can be called as <code>df.withColumn("net", net_price("price", "tax"))</code>?`,
    opts:[
      "<code>@udf(\"double\")</code> on <code>def net_price(price: float, tax: float) -&gt; float: return price * (1 - tax)</code>",
      "<code>@pandas_udf(\"double\")</code> on <code>def net_price(price: pd.Series, tax: pd.Series) -&gt; float: return (price * (1 - tax)).mean()</code>",
      "<code>@pandas_udf(\"double\")</code> on <code>def net_price(price: pd.Series, tax: pd.Series) -&gt; pd.Series: return price * (1 - tax)</code>",
      "<code>df.groupBy(\"price\").applyInPandas(net_price, schema=\"net double\")</code>"
    ],
    correct:2,
    explain:`A Series to Series Pandas UDF takes pandas Series and returns a Series of the same length, receiving Arrow batches and computing on whole columns at once, so it works in <code>withColumn</code>. Option B is the tempting one because it is also a <code>@pandas_udf</code>, but its type hints return a scalar, which makes it a Series to Scalar aggregate meant for <code>groupBy().agg()</code>, not a per-row column. Option A is the row-at-a-time UDF the team wants to replace, and <code>applyInPandas</code> returns a new DataFrame per group, not a column.`
  }
];

/* Chapter table for the "Review: Chapter N" links in the answer review.
   Mirrors the course index UNITS array; free matches gate.ts. */
const CHAPTERS = {
  course: "spark-assoc",
  base: "",
  free: [1, 2, 3, 4, 5, 6, 7, 8, 9],
  list: {
    1:["lesson-01-why-spark.html", "Why Spark: Advantages and Challenges"],
    2:["lesson-02-cluster-anatomy.html", "Cluster Anatomy: Driver, Executors, Cores and Memory"],
    3:["lesson-03-dataframes-datasets-sparksession.html", "DataFrames, Datasets and the SparkSession Lifecycle"],
    4:["lesson-04-caching-and-storage-levels.html", "Caching and Storage Levels"],
    5:["lesson-05-executor-memory-and-gc.html", "Executor Memory and Garbage Collection"],
    6:["lesson-06-execution-hierarchy.html", "The Execution Hierarchy: Application, Job, Stage, Task"],
    7:["lesson-07-partitions-and-shuffles.html", "Partitions and Shuffles"],

    9:["lesson-09-spark-modules.html", "The Spark Modules: Core, SQL, Pandas API, Streaming, MLlib"],
    10:["lesson-10-reading-data-sources.html", "Reading Data Sources: Files and JDBC"],
    11:["lesson-11-writing-partitionby-and-overwrite.html", "Writing: partitionBy and Overwrite"],
    12:["lesson-12-querying-files-directly-with-sql.html", "Querying Files Directly with SQL"],
    13:["lesson-13-save-modes.html", "Save Modes: append, overwrite, ignore, errorifexists"],
    14:["lesson-14-persistent-tables.html", "Persistent Tables: saveAsTable, Partitioning, Bucketing and Sorting"],
    15:["lesson-15-temporary-views.html", "Temporary and Global Temporary Views"],
    16:["lesson-16-columns.html", "Columns: select, withColumn, withColumnRenamed, drop"],
    17:["lesson-17-rows-filter-split-explode.html", "Rows: filter, split and explode"],
    18:["lesson-18-deduplication-and-missing-data.html", "Deduplication and Missing Data"],
    19:["lesson-19-aggregations.html", "Aggregations: groupBy, agg, approx_count_distinct and summary"],
    20:["lesson-20-dates-and-timestamps.html", "Dates and Timestamps"],
    21:["lesson-21-joins.html", "Joins: Inner, Left, Multiple Keys and Cross"],
    22:["lesson-22-unions.html", "Unions: union, unionAll and unionByName"],
    23:["lesson-23-explicit-schemas.html", "Reading with Explicit Schemas"],
    24:["lesson-24-sorting-iterating-converting.html", "Sorting, Iterating and Converting"],
    25:["lesson-25-python-udfs.html", "Python UDFs"],
    26:["lesson-26-stateful-operators-state-stores.html", "Stateful Operators and State Stores"],
    27:["lesson-27-broadcast-variables-accumulators.html", "Broadcast Variables and Accumulators"],
    28:["lesson-28-broadcast-joins.html", "Broadcast Joins"],
    29:["lesson-29-repartition-versus-coalesce.html", "repartition versus coalesce"],
    30:["lesson-30-data-skew-and-reducing-shuffles.html", "Data Skew and Reducing Shuffles"],
    31:["lesson-31-adaptive-query-execution.html", "Adaptive Query Execution"],
    32:["lesson-32-logs-and-the-spark-ui.html", "Logs and the Spark UI: Diagnosing OOM and Underutilization"],
    33:["lesson-33-structured-streaming-model.html", "The Structured Streaming Model"],
    34:["lesson-34-readstream-writestream-output-modes-sinks.html", "readStream, writeStream, Output Modes and Sinks"],
    35:["lesson-35-streaming-operations-window-aggregation.html", "Streaming Operations: select, filter, window and aggregation"],
    36:["lesson-36-streaming-deduplication.html", "Streaming Deduplication"],
    37:["lesson-37-spark-connect.html", "Spark Connect"],
    38:["lesson-38-deployment-modes.html", "Deployment Modes: local, client, cluster"],
    39:["lesson-39-pandas-api-on-spark.html", "Pandas API on Spark"],
    40:["lesson-40-pandas-udfs.html", "Pandas UDFs"]
  }
};
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
