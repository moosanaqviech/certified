<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 4",
  badge: "Databricks Spark Developer Associate",
  blurb: "Full-length mock. Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer. Databricks publishes no official passing score; 70% is our practice target.",
  coverage: "Full-length mock exam: 45 questions in 90 minutes across all seven sections, sampled at the official 20/20/30/10/10/5/5 weights.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

  /* Ch 01 - Why Spark: advantages and challenges */
  {
    q:`On the busiest shopping weekend of the year, a 40-node Spark cluster is computing revenue per store from 9 TB of point-of-sale data. Halfway through a stage, one worker node fails and its executor is lost. How does Spark recover?`,
    opts:[
      "It recomputes only the partitions that lived on the lost executor, using the lineage that records how each partition was derived",
      "It restarts the whole application from the first stage, because a lost executor invalidates every partition computed so far",
      "It reads a second copy of every partition, because Spark replicates all data across two nodes by default",
      "It fails the job, and the team must rerun it manually once the node is replaced"
    ],
    correct:0,
    explain:`Fault tolerance through lineage is one of Spark's core advantages: Spark knows how each partition was built, so after an executor loss only the missing partitions are recomputed and the rest of the work is kept. The replication option is the tempting one, but Spark does not copy data byte by byte by default; replicated storage levels such as MEMORY_AND_DISK_2 exist only when a job asks for them. Restarting from scratch or failing outright would waste exactly the work lineage exists to protect.`
  },

  /* Ch 02 - Cluster anatomy: driver, executors, cores and memory */
  {
    q:`Two applications share one YARN cluster: an inventory forecast and a clickstream sessionizer. During the forecast's largest stage one of its executors dies with an OutOfMemoryError. What happens to the clickstream application?`,
    opts:[
      "Its tasks on the same worker node fail too, because executors on one node are shared by every application on it",
      "YARN moves the forecast's failed tasks onto the clickstream application's executors, slowing it down",
      "Nothing: each application gets its own executor processes, and the cluster manager only allocates resources between them",
      "It stops as well, because both applications are scheduled by the same driver"
    ],
    correct:2,
    explain:`Each Spark application has its own driver and its own executors for its whole lifetime, and two applications never share an executor, so one cannot crash the other's tasks. The cluster manager (YARN here) allocates CPU and memory across applications but never schedules individual tasks, which rules out the tempting "YARN moves the tasks" answer: task scheduling is done by each application's own driver. There is no shared driver between applications.`
  },

  /* Ch 03 - DataFrames, Datasets and the SparkSession lifecycle */
  {
    q:`A developer writes <code>orders.filter(col("status") == "returned")</code> on one line and <code>print(orders.count())</code> on the next, expecting the number of returned orders. The printed number is the total order count. What is wrong?`,
    opts:[
      "<code>filter</code> is lazy and <code>count()</code> does not trigger it, so the filter must be followed by <code>cache()</code>",
      "DataFrames are immutable: <code>filter</code> returned a new DataFrame that was never assigned, and <code>orders</code> is unchanged, so the result must be assigned, for example <code>returned = orders.filter(...)</code>",
      "<code>count()</code> ignores filters on Parquet sources unless predicate pushdown is disabled",
      "The SparkSession must be stopped and recreated before a filter takes effect on an existing DataFrame"
    ],
    correct:1,
    explain:`No DataFrame method changes a DataFrame in place: <code>filter</code> returns a new DataFrame and leaves <code>orders</code> exactly as it was, so counting <code>orders</code> counts everything. The lazy-evaluation option is the tempting one, but laziness is not the problem: <code>count()</code> is an action and would run the filter if it were called on the filtered DataFrame. Caching, pushdown settings and the session lifecycle have nothing to do with it.`
  },

  /* Ch 04 - Caching and storage levels */
  {
    q:`A pricing job builds a 2 GB product catalog DataFrame, calls <code>catalog.cache()</code>, and then runs thirty pricing actions on it. Right after the <code>cache()</code> line, before any action, the engineer opens the Storage tab of the Spark UI and finds it empty. What explains this?`,
    opts:[
      "The catalog is too large for MEMORY_ONLY, so Spark refused to cache it",
      "The Storage tab only lists DataFrames persisted with DISK_ONLY",
      "<code>cache()</code> works only after <code>persist(StorageLevel.MEMORY_ONLY)</code> has been called first",
      "<code>cache()</code> is lazy: nothing is stored until the first action computes the DataFrame, after which it appears in the Storage tab at the default MEMORY_AND_DISK level"
    ],
    correct:3,
    explain:`<code>cache()</code> only marks the DataFrame for caching; the first action materializes it, and from then on the Storage tab lists it with its level, size and partitions. Its level is the DataFrame default, MEMORY_AND_DISK, so the "too large for MEMORY_ONLY" explanation is the tempting misreading: a cached DataFrame that outgrows memory spills to disk rather than being refused. The Storage tab shows every persisted level, and <code>cache()</code> needs no prior <code>persist()</code> call (it is <code>persist()</code> with the default level).`
  },

  /* Ch 05 - Executor memory and garbage collection */
  {
    q:`A retail ETL job sets <code>spark.executor.memory</code> to 10g and leaves every memory setting at its default. Roughly how much of each executor's heap is the unified region shared by execution memory and storage memory, and how is it divided?`,
    opts:[
      "All 10 GB, divided evenly between execution and storage",
      "About 5.8 GB: 0.6 (spark.memory.fraction) of the heap left after the 300 MiB reserve; execution and storage borrow from each other, with spark.memory.storageFraction (0.5) protecting part of storage from eviction",
      "Exactly 5 GB for storage and 5 GB for execution, a fixed split neither side can cross",
      "About 3.9 GB, the 40 percent of the heap that spark.memory.fraction leaves outside Spark's control"
    ],
    correct:1,
    explain:`Spark first reserves 300 MiB, then makes spark.memory.fraction (0.6) of the remainder the unified region, roughly 5.8 GB of a 10 GB heap; the other 40 percent is user memory. The fixed 50/50 split is the tempting distractor, but unified means borrowed: execution can evict cached blocks down to the share spark.memory.storageFraction protects, and storage can fill the region when no task needs it. The 3.9 GB figure describes user memory, not the unified region.`
  },

  /* Ch 06 - The execution hierarchy: application, job, stage, task */
  {
    q:`A notebook reads daily orders (16 input partitions), runs <code>.groupBy("store_id").agg(sum("amount").alias("store_total"))</code>, then <code>.groupBy("region").agg(sum("store_total"))</code>, and finally writes the result with a single <code>write</code> call. Nothing is cached. How many jobs and stages does the write run?`,
    opts:[
      "One job with three stages: each groupBy is a shuffle, and a job has one more stage than it has shuffles",
      "Three jobs, one for each groupBy and one for the write",
      "One job with two stages, because consecutive groupBy calls are merged into a single shuffle",
      "One job with one stage, because there is only one action"
    ],
    correct:0,
    explain:`One action means one job, and inside it Spark cuts a stage boundary at every shuffle: read and partial aggregation (16 tasks), then the store aggregation after the first shuffle, then the region aggregation after the second, so three stages. The "one stage per action" answer confuses jobs with stages, and the "three jobs" answer treats transformations as if they submitted work; groupBy is a transformation and submits nothing. Two groupBys on different keys need two separate exchanges, so they are not merged.`
  },

  /* Ch 07 - Partitions and shuffles */
  {
    q:`A returns pipeline combines two feeds with <code>union</code>, then runs <code>filter</code>, then <code>withColumn</code>, then <code>distinct()</code>, and writes the result. Which step introduces a shuffle and a new stage?`,
    opts:[
      "<code>union</code>, because rows from two DataFrames must be brought onto the same executors",
      "<code>filter</code>, because every partition has to be scanned before Spark knows which rows survive",
      "<code>withColumn</code>, because adding a column rewrites the layout of every partition",
      "<code>distinct()</code>, because identical rows can sit in different partitions and must be brought together"
    ],
    correct:3,
    explain:`<code>distinct()</code> is a wide transformation: to find identical rows Spark must regroup every row by its value, which moves data across the network and starts a new stage. <code>union</code> is the tempting answer because it combines two inputs, but it is narrow: it simply keeps each side's partitions and appends them, so no row moves. <code>filter</code> and <code>withColumn</code> also work on each partition in place.`
  },

  /* Ch 08 - Transformations, actions and lazy evaluation */
  {
    q:`A cart pipeline runs <code>carts = raw.withColumn("qty", col("qty_raw").cast("int"))</code>, then <code>big = carts.filter(col("qty") &gt; 10)</code>, then <code>big.write.mode("overwrite").parquet(out)</code>. On Spark 4.0 the job fails with CAST_INVALID_INPUT, and the stack trace points at the write line, although the cast is two lines earlier. Why does the error surface there?`,
    opts:[
      "The write uses the wrong save mode, and the cast error is a side effect of overwriting the target",
      "The cast succeeded, but the Parquet writer casts the column again with stricter rules",
      "The first two lines are transformations that only build a plan; the cast runs when the write action executes it, so a bad value in qty_raw raises the error on the action line",
      "ANSI mode applies only to write operations, so casts inside transformations are never checked"
    ],
    correct:2,
    explain:`Transformations such as withColumn and filter only extend the plan, and the write is the action that runs it, so a data-dependent failure (here a string that cannot become an integer, which ANSI mode, on by default in Spark 4.0, turns into an error) is thrown by the action line, not the line that caused it. The "Parquet writer casts again" option is tempting because the trace names the write, but the failing operation is the upstream cast. ANSI mode governs casts and arithmetic everywhere, and the save mode only decides what happens to existing data.`
  },

  /* Ch 09 - The Spark modules */
  {
    q:`A recommendations team wants to train a classification model on 800 million rows of purchase history already loaded as a Spark DataFrame, chaining feature preparation and the classifier into one reusable workflow. Which API should they use?`,
    opts:[
      "<code>spark.mllib</code>, the RDD-based API, because it is the primary machine learning API",
      "Pandas API on Spark, because model training needs pandas-style indexing",
      "<code>pyspark.ml</code>, the DataFrame-based MLlib API, with a Pipeline of transformers and estimators",
      "Structured Streaming, because training has to process the rows in micro-batches"
    ],
    correct:2,
    explain:`MLlib's DataFrame-based API in <code>pyspark.ml</code> has been the primary machine learning API since Spark 2.0: feature transformers and an estimator are chained in a Pipeline, and <code>fit()</code> returns a model that transforms new data across the cluster. The RDD-based <code>spark.mllib</code> is the tempting choice by name, but it is in maintenance mode. Pandas API on Spark is for running pandas-style code at scale, and a static history table is a batch problem, not a stream.`
  },

  /* Ch 10 - Reading data sources: files and JDBC */
  {
    q:`A product catalog is exported as JSON files, each holding one pretty-printed JSON object that spans many lines. <code>spark.read.json(path)</code> returns a DataFrame with only a <code>_corrupt_record</code> column. Which read returns the catalog's real columns?`,
    opts:[
      "<code>spark.read.option(\"multiLine\", True).json(path)</code>",
      "<code>spark.read.option(\"header\", True).json(path)</code>",
      "<code>spark.read.option(\"inferSchema\", True).json(path)</code>",
      "<code>spark.read.text(path)</code>, then parse each line as JSON"
    ],
    correct:0,
    explain:`The JSON reader expects one object per line by default, so an object spread over many lines cannot be parsed and lands in <code>_corrupt_record</code>; <code>multiLine</code> set to true lets a record span lines. <code>inferSchema</code> is the tempting option because it sounds like it fixes column detection, but it is a CSV option: JSON already infers types from the values. <code>header</code> is also a CSV option, and the text reader would hand back single lines that are fragments of an object, not parseable JSON.`
  },

  /* Ch 10 - Reading data sources: files and JDBC */
  {
    q:`A nightly job reads an orders table over JDBC with <code>partitionColumn="order_id"</code>, <code>lowerBound=1</code>, <code>upperBound=1000000</code> and <code>numPartitions=10</code>. The table now holds order ids up to 5,000,000. What happens to the rows with ids above 1,000,000?`,
    opts:[
      "They are skipped, because the bounds act as a WHERE filter on the read",
      "The read fails with an error, because the data falls outside the declared range",
      "Spark queries the maximum id first and widens the stride so all ten tasks get equal ranges",
      "They are all read, by the last of the ten range queries: the bounds only set the stride, so that one task pulls about four million rows"
    ],
    correct:3,
    explain:`lowerBound and upperBound decide how the id range is cut into numPartitions strides; they never filter rows, so rows below the lower bound go to the first query and rows above the upper bound to the last. Nothing is lost, but the last task now reads far more than the others. Believing the bounds filter the table is the tempting misreading. Spark does not look up the real maximum for you, and out-of-range values do not raise an error.`
  },

  /* Ch 11 - Writing: partitionBy and overwrite */
  {
    q:`Daily store sales are written as Parquet to <code>/lake/sales</code>. Analysts filter on year and then month, so the layout must be nested folders such as <code>year=2026/month=10/</code>, and each rerun must replace the previous output. Which write fits?`,
    opts:[
      "<code>df.write.mode(\"overwrite\").partitionBy(\"month\", \"year\").parquet(\"/lake/sales\")</code>",
      "<code>df.write.mode(\"overwrite\").partitionBy(\"year\", \"month\").parquet(\"/lake/sales\")</code>",
      "<code>df.write.mode(\"overwrite\").bucketBy(12, \"month\").parquet(\"/lake/sales\")</code>",
      "<code>df.write.mode(\"append\").partitionBy(\"year\", \"month\").parquet(\"/lake/sales\")</code>"
    ],
    correct:1,
    explain:`partitionBy nests folders in the order its columns are given, so ("year", "month") produces <code>year=2026/month=10/</code>, and overwrite replaces the previous run. Reversing the columns is the tempting near miss: it still writes and still prunes on both columns, but the layout becomes <code>month=10/year=2026/</code>, not the one required. bucketBy works only with saveAsTable, so a path write with it fails, and append keeps every earlier run's rows beside the new ones.`
  },

  /* Ch 11 - Writing: partitionBy and overwrite */
  {
    q:`Sales were written with <code>partitionBy("store_id")</code>. A report reads one store with <code>spark.read.parquet("/lake/sales/store_id=17")</code> and then fails on <code>groupBy("store_id")</code> because the column does not exist. What explains it, and what is the better read?`,
    opts:[
      "partitionBy permanently deletes the partition column from the data, so store_id can never be read back",
      "The write used overwrite mode, which drops partition columns; rewrite the data with append",
      "store_id must be cast to a string before a partitioned read can see it",
      "The value lives in the folder name, so reading the subfolder directly loses it; read the root path and filter on store_id, which still reads only the matching folder"
    ],
    correct:3,
    explain:`With Hive-style partitioning the store_id value is stored in the directory name, not inside the files; a read of the root path turns the folder names back into a column, and a filter on store_id prunes the read to the <code>store_id=17</code> folder anyway. The "permanently deleted" option is the tempting half-truth: the value is not in the part files, but it is recovered from the layout when the root is read. The save mode and the column type play no part.`
  },

  /* Ch 12 - Querying files directly with SQL */
  {
    q:`An engineer wants a quick look at the web shop's raw access logs, plain text files in <code>/landing/weblogs/</code>, from a SQL cell with no table created: <code>SELECT * FROM text.&#96;/landing/weblogs/&#96; LIMIT 20</code>. What does the query return?`,
    opts:[
      "An error, because the text format needs a schema that a direct file query cannot supply",
      "One row per line of the files, in a single string column named <code>value</code>",
      "One row per file, with the whole file content in one column",
      "One row per line, split on whitespace into columns named <code>_c0</code>, <code>_c1</code> and so on"
    ],
    correct:1,
    explain:`The text format turns each line into a row with a single string column called <code>value</code>, which is exactly what a first look at log lines needs; the directory path reads every file inside it. The <code>_c0</code>, <code>_c1</code> option is the tempting one, but those generic names belong to CSV read with its defaults, and nothing splits text lines on whitespace. A direct file query takes no options or schema, and the text format needs none.`
  },

  /* Ch 13 - Save modes */
  {
    q:`A nightly job recomputes the last three days of returns and writes them to a Parquet path partitioned by <code>return_date</code> with <code>mode("overwrite")</code>. After the first run the path holds only those three days: two years of history are gone. Which write replaces just the three recomputed days and keeps the rest?`,
    opts:[
      "<code>df.write.mode(\"overwrite\").option(\"partitionOverwriteMode\", \"dynamic\").partitionBy(\"return_date\").parquet(path)</code>",
      "<code>df.write.mode(\"append\").partitionBy(\"return_date\").parquet(path)</code>",
      "<code>df.write.mode(\"ignore\").partitionBy(\"return_date\").parquet(path)</code>",
      "<code>df.write.mode(\"errorifexists\").partitionBy(\"return_date\").parquet(path)</code>"
    ],
    correct:0,
    explain:`With the default static setting an overwrite replaces the whole target; dynamic partition overwrite replaces only the partitions the write commits data for, so the three recomputed dates are rewritten and every other date is left alone, and reruns give the same result. Append is the tempting choice because it keeps the history, but each rerun adds the three days again, duplicating them. Ignore skips the write entirely once the path exists, and errorifexists fails on every run after the first.`
  },

  /* Ch 14 - Persistent tables: saveAsTable, partitioning, bucketing and sorting */
  {
    q:`The table <code>retail.inventory</code> has columns <code>store_id</code>, <code>sku</code>, <code>qty</code> (the first two are strings). A daily DataFrame <code>new_rows</code> has the same columns in the order <code>sku</code>, <code>store_id</code>, <code>qty</code>. Which call adds the rows with each value in the right column?`,
    opts:[
      "<code>new_rows.write.insertInto(\"retail.inventory\")</code>",
      "<code>new_rows.write.mode(\"overwrite\").saveAsTable(\"retail.inventory\")</code>",
      "<code>new_rows.write.mode(\"append\").saveAsTable(\"retail.inventory\")</code>",
      "<code>new_rows.write.insertInto(\"retail.inventory\", overwrite=True)</code>"
    ],
    correct:2,
    explain:`<code>mode("append").saveAsTable</code> adds to an existing table using its format and options and matches columns by name, so the different column order does no harm. <code>insertInto</code> is the tempting choice because it is made for inserting into existing tables, but it matches by position: SKUs would land in store_id and store ids in sku, silently, since both are strings. The two overwrite forms replace the table's existing rows instead of adding to them.`
  },

  /* Ch 14 - Persistent tables: saveAsTable, partitioning, bucketing and sorting */
  {
    q:`To speed up nightly joins on customer, an engineer writes <code>orders.write.bucketBy(32, "customer_id").sortBy("order_ts").parquet("/lake/orders_b")</code>, and the write fails. What is the cause?`,
    opts:[
      "Bucketing and sorting apply only to persistent tables, so the chain must end in <code>saveAsTable(...)</code> rather than a path write",
      "sortBy must be called before bucketBy in the writer chain",
      "The bucket count must equal spark.sql.shuffle.partitions, which is 200",
      "Parquet does not support bucketing, so the format must be CSV"
    ],
    correct:0,
    explain:`bucketBy and sortBy only mean something when the metastore records the bucket count and columns, so Spark allows them only with saveAsTable; a save to a path fails. The order option is the tempting one because sortBy does depend on bucketBy, but the fix is the target, not the order, and sortBy is chained after bucketBy. Any bucket count is allowed (both join sides just need the same one), and Parquet is a normal format for a bucketed table.`
  },

  /* Ch 15 - Temporary and global temporary views */
  {
    q:`A notebook cell runs <code>open_carts.createTempView("open_carts")</code>. Rerunning the cell fails with TempTableAlreadyExistsException. The view must stay visible to this SparkSession only. Which change makes reruns safe?`,
    opts:[
      "<code>open_carts.createGlobalTempView(\"open_carts\")</code>",
      "<code>open_carts.write.saveAsTable(\"open_carts\")</code>",
      "<code>open_carts.createOrReplaceGlobalTempView(\"open_carts\")</code>",
      "<code>open_carts.createOrReplaceTempView(\"open_carts\")</code>"
    ],
    correct:3,
    explain:`createOrReplaceTempView swaps an existing view of the same name instead of raising, and it stays scoped to the session that created it. createOrReplaceGlobalTempView is the tempting option because it also reruns safely, but it puts the view in global_temp, shared by every session in the application and addressed as <code>global_temp.open_carts</code>, which is not what was asked. createGlobalTempView still raises on an existing name, and saveAsTable writes a persistent table instead of a view.`
  },

  /* Ch 16 - Columns: select, withColumn, withColumnRenamed, drop */
  {
    q:`Every row of <code>orders</code> needs a constant column <code>channel</code> set to "web" and a column <code>price_usd</code> equal to <code>price</code> times <code>rate</code>, added in one call. Which code does it?`,
    opts:[
      "<code>orders.withColumn(\"channel\", \"web\").withColumn(\"price_usd\", col(\"price\") * col(\"rate\"))</code>",
      "<code>orders.withColumns({\"channel\": lit(\"web\"), \"price_usd\": col(\"price\") * col(\"rate\")})</code>",
      "<code>orders.withColumns(\"channel\", lit(\"web\"), \"price_usd\", col(\"price\") * col(\"rate\"))</code>",
      "<code>orders.withColumn({\"channel\": lit(\"web\"), \"price_usd\": col(\"price\") * col(\"rate\")})</code>"
    ],
    correct:1,
    explain:`withColumns takes a dict mapping each new column name to a Column, and a constant becomes a Column through <code>lit()</code>. The first option is the tempting one because withColumn is the familiar method, but its second argument must be a Column, so the bare string "web" is rejected (and it is two calls, not one). withColumns does not take alternating positional arguments, and withColumn does not take a dict.`
  },

  /* Ch 17 - Rows: filter, split and explode */
  {
    q:`A product table stores attributes as text such as "red|XL|cotton", and a report needs the size, the second piece. <code>split(col("attrs"), "|")</code> returns arrays of single characters instead. Which expression returns the size?`,
    opts:[
      "<code>split(col(\"attrs\"), \"|\").getItem(1)</code>",
      "<code>split(col(\"attrs\"), \",\").getItem(1)</code>",
      "<code>split(col(\"attrs\"), \"[|]\").getItem(1)</code>",
      "<code>explode(col(\"attrs\")).getItem(1)</code>"
    ],
    correct:2,
    explain:`split treats its pattern as a Java regular expression, and a bare pipe means "empty or empty", which matches between every character; putting the pipe in a character class, <code>[|]</code>, makes it a literal delimiter (escaping it works too). <code>getItem</code> counts from 0, so index 1 is the second piece, the size. The first option is the tempting one because the index is right, but it keeps the unescaped pattern that caused the problem. A comma never appears in the text, and explode needs an array or map, not a string.`
  },

  /* Ch 18 - Deduplication and missing data */
  {
    q:`An inventory snapshot has columns <code>store</code> and <code>sku</code> (strings) and <code>on_hand</code> and <code>on_order</code> (integers). After <code>inv.na.fill(0)</code>, the integer columns have no nulls, but nulls remain in <code>store</code> and <code>sku</code>. Why, and what fills every column in one call?`,
    opts:[
      "na.fill needs how=\"all\" to reach every column; use <code>inv.na.fill(0, how=\"all\")</code>",
      "A fill value only reaches columns whose type matches it, so 0 skips the strings; use a dict such as <code>inv.na.fill({\"on_hand\": 0, \"on_order\": 0, \"store\": \"unknown\", \"sku\": \"unknown\"})</code>",
      "na.fill skips columns used as keys; drop the rows with <code>inv.na.drop(subset=[\"store\", \"sku\"])</code> instead",
      "Nulls in strings must be replaced with <code>inv.na.replace(None, 0)</code>"
    ],
    correct:1,
    explain:`na.fill applies a single value only to columns of a matching type: 0 is numeric, so the string columns are silently skipped. A dict sets a value per column, so each column gets a fill of its own type in one call. The how="all" option is tempting because how appears on na.drop, but na.fill has no such parameter. Dropping rows discards data the task wanted filled, and replacing nulls with 0 would put a number in text columns.`
  },

  /* Ch 19 - Aggregations: groupBy, agg, approx_count_distinct and summary */
  {
    q:`Finance wants, per store, the number of orders, the exact number of distinct customers, and the average basket value, as named columns. Which code returns it?`,
    opts:[
      "<code>orders.groupBy(\"store_id\").agg(count(\"*\").alias(\"orders\"), approx_count_distinct(\"customer_id\").alias(\"customers\"), avg(\"basket\").alias(\"avg_basket\"))</code>",
      "<code>orders.groupBy(\"store_id\").count().avg(\"basket\")</code>",
      "<code>orders.agg(count(\"*\"), count_distinct(\"customer_id\"), avg(\"basket\")).groupBy(\"store_id\")</code>",
      "<code>orders.groupBy(\"store_id\").agg(count(\"*\").alias(\"orders\"), count_distinct(\"customer_id\").alias(\"customers\"), avg(\"basket\").alias(\"avg_basket\"))</code>"
    ],
    correct:3,
    explain:`groupBy followed by one agg with several aggregate expressions gives one row per store, and count_distinct (alias countDistinct) is the exact distinct count. The first option is the tempting one because it is shaped correctly, but approx_count_distinct is a HyperLogLog++ estimate with a 5 percent default error, not the exact number finance asked for. The groupBy count shortcut returns a DataFrame that has no avg method, and aggregating before grouping collapses everything into one row with no store_id left to group by.`
  },

  /* Ch 20 - Dates and timestamps */
  {
    q:`The returns policy flags any return made more than 30 days after delivery. <code>returnsDF</code> has DATE columns <code>delivered_on</code> and <code>returned_on</code>. Which filter selects the late returns?`,
    opts:[
      "<code>returnsDF.filter(datediff(col(\"delivered_on\"), col(\"returned_on\")) &gt; 30)</code>",
      "<code>returnsDF.filter(months_between(col(\"returned_on\"), col(\"delivered_on\")) &gt; 30)</code>",
      "<code>returnsDF.filter(datediff(col(\"returned_on\"), col(\"delivered_on\")) &gt; 30)</code>",
      "<code>returnsDF.filter(date_add(col(\"delivered_on\"), 30) &gt; col(\"returned_on\"))</code>"
    ],
    correct:2,
    explain:`datediff(end, start) counts the days from start to end with the end date first, so <code>datediff(returned_on, delivered_on)</code> is the number of days the customer waited. The first option is the tempting one because it uses the right function, but with the arguments swapped every result is negative and no return is ever flagged. months_between counts months, so "more than 30" would mean two and a half years, and the date_add filter selects the returns made within 30 days, the opposite set.`
  },

  /* Ch 21 - Joins: inner, left, multiple keys and cross */
  {
    q:`Sales targets are set per store per day. A report must keep every row of <code>sales</code>, attach the matching target where one exists, and keep a single copy of each key column. Both DataFrames have <code>store_id</code> and <code>day</code>. Which join fits?`,
    opts:[
      "<code>sales.join(targets, [\"store_id\", \"day\"], \"left\")</code>",
      "<code>sales.join(targets, sales.store_id == targets.store_id &amp; sales.day == targets.day, \"left\")</code>",
      "<code>sales.join(targets, \"store_id\", \"left\").join(targets, \"day\", \"left\")</code>",
      "<code>sales.join(targets, [\"store_id\", \"day\"], \"left_semi\")</code>"
    ],
    correct:0,
    explain:`A list of column names makes an equi-join on both keys and keeps one copy of each, and "left" keeps every sales row with nulls where no target matches. The expression form is the tempting one, but without parentheses around each comparison Python's & binds tighter than ==, so the condition is built wrongly; even written correctly it would keep two copies of each key. Two separate single-key joins multiply rows instead of matching on the pair, and left_semi returns only sales columns, dropping the targets.`
  },

  /* Ch 22 - Unions: union, unionAll and unionByName */
  {
    q:`<code>last_week</code> and <code>this_week</code> each hold one column, <code>sku</code>, listing the SKUs in the online catalog, with no repeats. Merchandising wants the SKUs that were listed last week but have disappeared this week. Which call returns them?`,
    opts:[
      "<code>last_week.union(this_week).distinct()</code>",
      "<code>last_week.intersect(this_week)</code>",
      "<code>last_week.subtract(this_week)</code>",
      "<code>this_week.subtract(last_week)</code>"
    ],
    correct:2,
    explain:`subtract returns the rows in this DataFrame that are not in the other (SQL EXCEPT DISTINCT), so <code>last_week.subtract(this_week)</code> is exactly the SKUs that dropped out. The reversed call is the tempting slip: it returns the SKUs that are new this week. intersect returns the SKUs present in both weeks, and a union followed by distinct returns every SKU from either week.`
  },

  /* Ch 23 - Reading with explicit schemas */
  {
    q:`Supplier price files arrive as CSV with a known layout (sku, price). The load must keep every good row, never fail on a bad line, and keep the raw text of each malformed line so it can be sent to a quarantine table. Which read fits?`,
    opts:[
      "<code>spark.read.schema(\"sku STRING, price DECIMAL(10,2)\").option(\"mode\", \"DROPMALFORMED\").csv(p)</code>",
      "<code>spark.read.schema(\"sku STRING, price DECIMAL(10,2), _corrupt_record STRING\").option(\"mode\", \"PERMISSIVE\").csv(p)</code>",
      "<code>spark.read.schema(\"sku STRING, price DECIMAL(10,2)\").option(\"mode\", \"FAILFAST\").csv(p)</code>",
      "<code>spark.read.option(\"inferSchema\", True).option(\"mode\", \"PERMISSIVE\").csv(p)</code>"
    ],
    correct:1,
    explain:`PERMISSIVE (the default mode) keeps every row and nulls the fields it could not parse, and declaring a string column named <code>_corrupt_record</code> in the schema makes Spark put the raw line there, ready to route to quarantine. DROPMALFORMED is the tempting one because the job also succeeds, but it silently throws the bad lines away, so there is nothing to quarantine. FAILFAST aborts on the first bad line, and inferSchema adds an extra pass without capturing anything.`
  },

  /* Ch 24 - Sorting, iterating and converting */
  {
    q:`A catalog page lists products by <code>category</code> ascending, then by <code>price</code> ascending, and products that have no price yet must appear at the end of each category, not the start. Which code sorts it that way?`,
    opts:[
      "<code>products.orderBy(col(\"category\").asc(), col(\"price\").asc_nulls_last())</code>",
      "<code>products.orderBy(\"category\", \"price\")</code>",
      "<code>products.orderBy(\"category\", \"price\", ascending=[True, True], nulls=\"last\")</code>",
      "<code>products.sort(col(\"category\"), col(\"price\").desc())</code>"
    ],
    correct:0,
    explain:`<code>asc_nulls_last()</code> sorts the column ascending and states explicitly that nulls go last. The plain orderBy is the tempting one because the directions are right, but by default nulls sort first in ascending order, so unpriced products would lead each category. orderBy and sort have no <code>nulls</code> keyword, and sorting price descending reverses the required order.`
  },

  /* Ch 25 - Python UDFs */
  {
    q:`A loyalty UDF is defined as <code>@udf(returnType=IntegerType())</code> on <code>def points(amount): return amount * 1.5</code>, where <code>amount</code> is a double. Every value of the new <code>points</code> column is NULL, and no error is raised. What is the cause?`,
    opts:[
      "Python UDFs cannot do arithmetic on double columns",
      "The UDF was not registered with <code>spark.udf.register</code>, so it returns NULL outside SQL",
      "The amount column is null on every row, so the UDF has nothing to multiply",
      "The function returns a Python float while the declared type is IntegerType; a classic Python UDF returns NULL on that mismatch, so declare DoubleType or return an int"
    ],
    correct:3,
    explain:`A row-at-a-time Python UDF must return values of the type it declares; when the function returns a float for an IntegerType column, the result is NULL, silently. Fixing the declared type (or converting inside the function) cures it. The registration option is tempting because register is a familiar UDF step, but it only makes the function callable from SQL; the DataFrame API uses the udf() wrapper directly. UDFs handle doubles fine, and nothing in the scenario suggests the input is null.`
  },

  /* Ch 26 - Stateful operators and state stores */
  {
    q:`A streaming query over cart events must keep each cart's running value across micro-batches and emit an "abandoned" event for a cart that sees no activity for 30 minutes, even if no new rows for that cart arrive. Which design fits?`,
    opts:[
      "A Python UDF that stores each cart's value in a module-level dictionary on the executors",
      "<code>applyInPandasWithState</code>, because it is the current recommended API for custom state in Python",
      "A stream-static join between the cart events and a static carts table",
      "<code>groupBy(\"cart_id\").transformWithStateInPandas(...)</code> with a StatefulProcessor that keeps a ValueState per cart and registers a processing-time timer handled in handleExpiredTimer"
    ],
    correct:3,
    explain:`transformWithStateInPandas is Spark 4.0's arbitrary stateful API: state variables such as ValueState are kept per key in the state store and checkpointed, and a registered timer fires handleExpiredTimer even when the key receives no new rows, which is exactly the abandonment rule. applyInPandasWithState is the tempting option because it also handles custom state, but it is the older, legacy API that transformWithStateInPandas replaces. A dictionary inside a Python worker is neither shared nor fault tolerant, and a static join holds no state between batches.`
  },

  /* Ch 27 - Broadcast variables and accumulators */
  {
    q:`A developer writes <code>returned = 0</code>, then a function <code>tally(row)</code> that runs <code>global returned; returned += 1</code> for returned orders, calls <code>orders.foreach(tally)</code>, and prints <code>returned</code>, which shows 0. What should change?`,
    opts:[
      "Each task gets its own copy of the variable through the serialized closure, and its updates never return to the driver; use <code>acc = spark.sparkContext.accumulator(0)</code>, call <code>acc.add(1)</code> in the function, and read <code>acc.value</code> on the driver",
      "<code>foreach</code> is a transformation, so nothing ran; add <code>count()</code> after it",
      "Wrap the counter with <code>spark.sparkContext.broadcast(0)</code> so all tasks update one shared copy",
      "Call <code>orders.cache()</code> first, so the function runs on the driver where the variable lives"
    ],
    correct:0,
    explain:`Spark ships each task a serialized copy of every variable its function references, and changes made on executors are never propagated back, so the driver's variable stays 0. An accumulator is the shared variable built for this: tasks add, only the driver reads, and updates made inside an action such as foreach are applied exactly once. The "foreach is a transformation" option is the tempting one, but foreach is an action, so the function did run. A broadcast variable is read-only, and caching never moves work to the driver.`
  },

  /* Ch 28 - Broadcast joins */
  {
    q:`The report must list every store, including stores with no orders, so a developer writes <code>broadcast(stores).join(orders, "store_id", "left")</code>, with <code>stores</code> at 2 MB and <code>orders</code> at 3 TB. explain() still shows a SortMergeJoin. What explains it?`,
    opts:[
      "Broadcast hints work only as SQL comments such as <code>/*+ BROADCAST(s) */</code>, so the DataFrame hint is ignored",
      "stores is already under the 10 MB threshold, so Spark ignores the hint as redundant",
      "In a left outer join only the right side can be broadcast, so the hinted left side cannot be the broadcast side and Spark falls back to a sort-merge join",
      "Broadcast hash joins support inner joins only"
    ],
    correct:2,
    explain:`A left outer join must keep every left row, so a broadcast hash join can only broadcast its right side; a hint on the preserved left side cannot be honored, and the plan falls back to sort-merge. "Inner joins only" is the tempting overstatement: left joins can be broadcast (on their right side), and so can right joins (on their left side); only full outer joins cannot. The broadcast() function and the SQL hint are equivalent, and being under the threshold makes a table eligible, it does not cancel a hint.`
  },

  /* Ch 29 - repartition versus coalesce */
  {
    q:`A daily job joins and aggregates 2 TB of orders into a 200 MB summary, and finance requires exactly one CSV file. After the engineer adds <code>coalesce(1)</code> before the write, the whole job takes three hours and the Spark UI shows a single task doing the join and aggregation work. What is the better change?`,
    opts:[
      "Keep <code>coalesce(1)</code> and add executor cores so the single task runs faster",
      "Use <code>repartition(1)</code> instead: its shuffle starts a new stage, so the heavy work stays parallel and only the final write runs as one task",
      "Set <code>spark.sql.shuffle.partitions</code> to 1 so the aggregation already produces one partition",
      "Use <code>coalesce(200)</code>, so each file is 1 MB"
    ],
    correct:1,
    explain:`coalesce has no stage boundary, so the work before it runs in the reduced number of tasks: coalesce(1) pulled the final heavy stage onto one core. repartition(1) pays a shuffle of the small 200 MB result, but the upstream stage keeps its own parallelism. More cores cannot speed up a single task, which makes the first option a trap. One shuffle partition would also make the aggregation a single task, and coalesce(200) neither reduces the work nor produces one file.`
  },

  /* Ch 30 - Data skew and reducing shuffles */
  {
    q:`A job joins <code>clicks</code> (5 TB, 60 columns) to <code>products</code> on <code>sku</code>, then keeps purchases with a Python UDF <code>is_purchase(event_type)</code>, and finally selects four columns. explain() shows both tables fully shuffled. Which rewrite moves the least data across the network?`,
    opts:[
      "Call <code>clicks.cache()</code> before the join so the shuffle reads from memory",
      "Before the join, filter clicks with the built-in <code>col(\"event_type\") == \"purchase\"</code> and select only the columns needed, so far fewer and narrower rows are shuffled",
      "Raise <code>spark.sql.shuffle.partitions</code> to 4000 so each shuffle partition is smaller",
      "Call <code>clicks.repartition(\"sku\")</code> before the join so the rows are already grouped by key"
    ],
    correct:1,
    explain:`Shuffle cost grows with both the number and the width of rows, and the optimizer cannot push a filter through a Python UDF, so the 60-column table is shuffled in full before the UDF ever runs. Filtering with a built-in condition and selecting the needed columns before the join shrinks what crosses the network. Repartitioning by sku is the tempting option because it sounds like preparing for the join, but it is itself a full shuffle of the same 5 TB. Caching does not reduce what is shuffled, and more partitions only split the same data into more pieces.`
  },

  /* Ch 30 - Data skew and reducing shuffles */
  {
    q:`A legacy job runs with AQE switched off and joins <code>order_lines</code> to <code>promotions</code> on <code>promo_code</code>; most lines carry the code 'NONE'. The join stage's summary metrics read: duration min 3 s, median 5 s, 75th percentile 6 s, max 52 min; shuffle read median 60 MB, max 18 GB. Which reading and fix are right?`,
    opts:[
      "Every executor is undersized; raise spark.executor.memory on all of them",
      "One node has slow hardware; the max task should be retried on another node",
      "The driver is the bottleneck; give the driver node more memory",
      "Data skew: the hot 'NONE' key sends one partition far more data than the median; turn AQE back on so its skew join splits that partition, or salt the key"
    ],
    correct:3,
    explain:`A max far above the median, with the shuffle read confirming that the slow task received hundreds of times more data, is the signature of skew: every row with the same key hashes to the same partition. AQE's skew join handling (an 18 GB partition is well over 5 times the median and over 256 MB) or salting splits it. Undersized executors is the tempting capacity reading, but that would make all tasks slow, not one. Slow hardware does not explain a 300-fold larger shuffle read, and the work is in an executor task, not the driver.`
  },

  /* Ch 31 - Adaptive Query Execution */
  {
    q:`A job reads a product catalog over JDBC with no partitioning options and immediately runs an expensive Python UDF on every row before any join or aggregation. The Spark UI shows that stage as one task while 95 other cores sit idle. AQE is on with default settings. Why does AQE not spread this work?`,
    opts:[
      "AQE is disabled by default and must be enabled with spark.sql.adaptive.enabled",
      "AQE only handles streaming queries, and this is a batch job",
      "AQE re-optimizes only at shuffle stage boundaries using runtime statistics; the first stage, before any shuffle, runs as planned, so the read needs partitioning options or a repartition before the UDF",
      "AQE never changes partition counts, it only switches join strategies"
    ],
    correct:2,
    explain:`AQE measures what a finished shuffle stage produced and re-plans the stages still to come, so nothing before the first shuffle (here the single-partition JDBC read and the UDF) can be changed by it. Partitioned JDBC options (partitionColumn, lowerBound, upperBound, numPartitions) or a repartition before the UDF fixes the parallelism. The "disabled by default" option is tempting but outdated: AQE has been on by default since Spark 3.2. AQE applies to batch queries, not streaming, and it does change partition counts by coalescing shuffle partitions.`
  },

  /* Ch 32 - Logs and the Spark UI: diagnosing OOM and underutilization */
  {
    q:`To debug SKU parsing, a developer adds <code>print()</code> calls inside a Python UDF used in <code>withColumn</code>. The job runs, but none of the printed lines appear in the notebook output or the driver log. Where should the developer look?`,
    opts:[
      "In the executor logs: code inside a UDF runs on the executors, so its output goes to each executor's stdout, linked from the Executors tab of the Spark UI",
      "In the driver log4j output, after raising the level with <code>setLogLevel(\"DEBUG\")</code>",
      "Nowhere: print is suppressed inside UDFs because they run in the JVM",
      "In the Storage tab, which records output produced while partitions are computed"
    ],
    correct:0,
    explain:`The driver log holds the script's own output and job-level failures, but a UDF runs in tasks on the executors, so anything it prints lands in that executor's stdout; the Executors tab lists every executor with links to its stdout and stderr. Raising the driver's log level is the tempting fix, but it changes how verbose Spark's messages are, not which machine the print ran on. Python UDFs run in Python worker processes, not silently in the JVM, and the Storage tab lists cached data.`
  },

  /* Ch 33 - The Structured Streaming model */
  {
    q:`A Structured Streaming query reads order events from Kafka and writes enriched events to another Kafka topic, with a checkpoint location set. After occasional restarts, downstream consumers see a few duplicate events, although the team assumed exactly-once delivery. What explains the duplicates?`,
    opts:[
      "The Kafka sink is at-least-once: after a restart the replayed micro-batch can be written again, so end-to-end exactly-once needs an idempotent sink, such as a file sink or foreachBatch writes keyed on the batch ID",
      "The Kafka source is not replayable, so Spark cannot re-read the offsets it logged",
      "The checkpoint location must be changed on every restart to clear stale offsets",
      "The query needs <code>trigger(once=True)</code> so each batch is written exactly once"
    ],
    correct:0,
    explain:`Exactly-once end to end needs three things: a replayable source, the offset log in the checkpoint, and an idempotent sink. Kafka as a source is replayable, but Kafka as a sink is at-least-once, so a batch replayed after a failure can be written twice. The "source not replayable" option is tempting because it names Kafka, but replay is exactly what the Kafka source supports. A new checkpoint would lose the query's progress entirely, and the deprecated once trigger changes timing, not delivery guarantees.`
  },

  /* Ch 34 - readStream, writeStream, output modes and sinks */
  {
    q:`A stream keeps only purchase events from the web shop (a <code>filter</code> and a <code>select</code>, no aggregation) and writes them as Parquet files. The developer sets <code>outputMode("complete")</code>, and the query fails when it starts. Which setup works?`,
    opts:[
      "<code>outputMode(\"update\")</code> to the Parquet file sink",
      "<code>outputMode(\"complete\")</code> after adding a watermark",
      "<code>outputMode(\"append\")</code>, the default, to the Parquet file sink",
      "<code>outputMode(\"complete\")</code> with <code>trigger(availableNow=True)</code>"
    ],
    correct:2,
    explain:`Complete mode outputs the whole result table each trigger and is allowed only for aggregation queries; a filter-and-select query emits each new row once, which is append, the default and the only mode the file sink accepts. Update is the tempting alternative because for a non-aggregating query it behaves like append, but the file sink rejects it. A watermark does not make complete mode legal for an unaggregated query, and a trigger changes when batches run, not which modes are allowed.`
  },

  /* Ch 35 - Streaming operations: select, filter, window and aggregation */
  {
    q:`Analytics wants to count page views per browsing session for each user on the web shop, where a session ends after 30 minutes with no activity from that user. Events can arrive up to an hour late, and state must stay bounded. Which streaming aggregation fits?`,
    opts:[
      "<code>views.groupBy(window(\"ts\", \"30 minutes\"), \"user_id\").count()</code>",
      "<code>views.groupBy(window(\"ts\", \"30 minutes\", \"5 minutes\"), \"user_id\").count()</code>",
      "<code>views.groupBy(session_window(\"user_id\", \"30 minutes\")).count()</code>",
      "<code>views.withWatermark(\"ts\", \"1 hour\").groupBy(session_window(\"ts\", \"30 minutes\"), \"user_id\").count()</code>"
    ],
    correct:3,
    explain:`A session window has a dynamic length: it grows while events keep arriving within the gap and closes after 30 quiet minutes, which matches the definition of a browsing session; the watermark lets Spark finalize old sessions and drop their state. The tumbling and sliding windows are the tempting options, but they cut time into fixed 30-minute slots that split one continuous session in two. session_window takes the event-time column, not the user id, and the first two options have no watermark, so state grows without bound.`
  },

  /* Ch 36 - Streaming deduplication */
  {
    q:`Each of a retailer's 800 stores sends a "store opened" registration event once, but the network occasionally redelivers it, sometimes days later and with a fresh <code>event_ts</code>. The stream must drop every redelivery, however late. Which deduplication fits?`,
    opts:[
      "<code>events.withWatermark(\"event_ts\", \"1 hour\").dropDuplicatesWithinWatermark([\"store_id\"])</code>",
      "<code>events.dropDuplicates([\"store_id\"])</code> with no watermark, since state can never exceed 800 keys",
      "<code>events.distinct()</code>",
      "<code>events.withWatermark(\"event_ts\", \"1 hour\").dropDuplicates([\"store_id\", \"event_ts\"])</code>"
    ],
    correct:1,
    explain:`Without a watermark, dropDuplicates remembers every key forever, so a copy is caught at any delay, and the usual cost (state that grows forever) does not apply because the key space is a fixed 800 stores. The within-watermark option is the tempting one because it handles copies with different timestamps, but copies arriving days apart are far beyond a one-hour threshold, and rows behind the watermark are dropped as too late. distinct() is not supported on streams, and putting event_ts in the key treats every redelivery with a new timestamp as a new row.`
  },

  /* Ch 37 - Spark Connect */
  {
    q:`A developer connected through Spark Connect from an IDE runs <code>bad = orders.filter(col("totl") &gt; 100)</code>, misspelling <code>total</code>. That line runs without error; the AnalysisException appears only on the next line, <code>bad.show()</code>. Why?`,
    opts:[
      "The Spark Connect server was unreachable when filter ran, so the error was queued until the connection returned",
      "Spark Connect does not support col() expressions, and show() falls back to a classic session that reports the error",
      "filter is executed on the client, and show() re-checks the result on the server",
      "The client only records an unresolved logical plan and never resolves column names; the server analyzes the plan when it is sent, which show() (or reading bad.columns or bad.schema) does"
    ],
    correct:3,
    explain:`Under Spark Connect, DataFrame calls build an unresolved logical plan on the client, so a misspelled column passes silently until something sends the plan to the server: an action such as show(), or a question about the plan such as columns, schema or explain(). The server's analyzer then raises the AnalysisException. The "filter executed on the client" option is tempting, but nothing executes on the client: the server runs every plan. col() expressions are fully supported, and an unreachable server would fail the call outright, not queue an error.`
  },

  /* Ch 37 - Spark Connect */
  {
    q:`A pricing job is being moved to Spark Connect. It uses <code>spark.sparkContext.broadcast(price_map)</code> inside a UDF and a <code>broadcast(stores)</code> join hint elsewhere. Under Spark Connect, which of the two fails?`,
    opts:[
      "Both, because Spark Connect supports no form of broadcasting",
      "Only the broadcast() join hint, because hints cannot be sent over gRPC",
      "Only the broadcast variable: a Spark Connect client has no SparkContext, while the join hint is part of the logical plan and still works",
      "Neither, because the server runs the code in classic mode"
    ],
    correct:2,
    explain:`A Spark Connect session does not expose spark.sparkContext, so SparkContext features such as broadcast variables and accumulators are unavailable, while the broadcast() function only marks a DataFrame in the plan, which the server honors. One fix is to turn price_map into a small DataFrame and join it with the hint. "Both fail" is the tempting answer because the word broadcast appears twice, but only one of them depends on SparkContext. The server does run classic Spark internally, yet the client cannot reach its SparkContext.`
  },

  /* Ch 38 - Deployment modes: local, client, cluster */
  {
    q:`A retailer runs a Spark Standalone cluster. A nightly pricing job is submitted with <code>spark-submit --master spark://master:7077 --deploy-mode cluster pricing_job.py</code>, and the submission is rejected. What is the cause, and what works instead?`,
    opts:[
      "Cluster mode requires --master local, so the master URL must change",
      "A Standalone cluster does not support cluster deploy mode for Python applications; submit in client mode from a gateway node, or run on YARN or Kubernetes for cluster mode",
      "Cluster mode is available only through a Spark Connect server",
      "Cluster mode on Standalone needs the --supervise flag to be accepted"
    ],
    correct:1,
    explain:`On a Standalone cluster, Python applications cannot use cluster deploy mode, so the job must run in client mode (ideally from a gateway close to the workers) or move to YARN or Kubernetes, which do support cluster mode for Python. The --supervise option is tempting because it is a Standalone cluster-mode flag, but it restarts a driver that exits with an error; it does not make Python cluster mode available. local mode has no cluster at all, and deploy modes are a spark-submit concept independent of Spark Connect.`
  },

  /* Ch 39 - Pandas API on Spark */
  {
    q:`An analyst using the Pandas API on Spark computes day-over-day sales change with <code>psdf["sales"].diff()</code> on two billion rows. The job is very slow, and the Spark UI shows one task processing all the data. What explains it?`,
    opts:[
      "diff, like shift and rank, runs over a window with no partitioning, which moves all the data into a single partition",
      "The default distributed-sequence index forces every operation onto the driver",
      "Pandas API on Spark executes every method on the driver with plain pandas",
      "Arrow is disabled, so the data is transferred row by row to Python"
    ],
    correct:0,
    explain:`In the Pandas API on Spark, shift, diff and rank are implemented with a window that has no partition specification, so all rows are moved to one partition and processed by a single task; on very large data they should be avoided or computed per group. The default index is the tempting answer because it does cost extra computation, but it numbers rows across partitions and does not move the work to the driver. Pandas API on Spark runs as distributed Spark work, not driver-side pandas, and Arrow settings do not explain a single task.`
  },

  /* Ch 40 - Pandas UDFs */
  {
    q:`Finance wants a custom trimmed-mean basket value per store (the mean after removing the top and bottom 5 percent), which no built-in function provides, computed with vectorized pandas code. Which definition and call work?`,
    opts:[
      "<code>@pandas_udf(\"double\")</code> on <code>def tmean(v: pd.Series) -&gt; pd.Series: ...</code>, called as <code>df.groupBy(\"store_id\").agg(tmean(\"basket\"))</code>",
      "<code>@udf(\"double\")</code> on <code>def tmean(v: float) -&gt; float: ...</code>, called as <code>df.groupBy(\"store_id\").agg(tmean(\"basket\"))</code>",
      "<code>df.groupBy(\"store_id\").applyInPandas(tmean, \"double\")</code>",
      "<code>@pandas_udf(\"double\")</code> on <code>def tmean(v: pd.Series) -&gt; float: ...</code>, called as <code>df.groupBy(\"store_id\").agg(tmean(\"basket\"))</code>"
    ],
    correct:3,
    explain:`A Pandas UDF whose type hints take a Series and return a scalar is a Series to Scalar UDF: a custom aggregate used in groupBy().agg(), returning one primitive value per group. The first option is the tempting one because it is also a @pandas_udf, but a Series return hint makes it a Series to Series UDF, which must return one value per input row and is not an aggregate. A row-at-a-time UDF sees one value, not a group, and applyInPandas needs a function from a pandas DataFrame to a DataFrame plus a full output schema, not a bare type.`
  }
];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
