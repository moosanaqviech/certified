<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 1",
  badge: "Databricks Spark Developer Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer.",
  coverage: "Covers chapters 1-9: Unit 1 (Apache Spark Architecture and Components). One question per chapter.",
  minutes: 18,
  pass: 70
};

const QUESTIONS = [

  /* Ch 01 - Why Spark: advantages and challenges */
  {
    q:`An analytics team processes a 400 MB CSV file once a month with pandas on one laptop, and the job finishes in under two minutes. A new hire proposes moving it to a six-node Spark cluster "to be future proof". Which assessment is correct?`,
    opts:[
      "Spark will finish faster, because it processes the file in memory across six nodes instead of one",
      "Spark is required, because pandas cannot load files larger than a few hundred megabytes",
      "Spark adds cluster scheduling and shuffle overhead that outweighs any gain on data this small; keep pandas until the data outgrows one machine",
      "Spark should be adopted, because lazy evaluation reduces the laptop's memory use"
    ],
    correct:2,
    explain:`Spark's advantages (in-memory processing across many machines, one engine for batch, SQL, streaming and ML) pay off when data no longer fits or finishes on one machine. For a 400 MB file that already runs in two minutes, the costs dominate: cluster startup, task scheduling, data distribution and shuffles across the network. The "faster across six nodes" option is the tempting one, but splitting a small file over a cluster spends more time coordinating than computing. pandas handles files of this size comfortably, and lazy evaluation is a planning model, not a memory saver.`
  },

  /* Ch 02 - Cluster anatomy: driver, executors, cores and memory */
  {
    q:`A PySpark application runs on a cluster with one driver and four worker nodes. Each worker hosts one executor with 8 cores and 32 GB of memory. A stage contains 64 tasks. How many tasks run at the same time, and which component decides which executor runs each task?`,
    opts:[
      "32 tasks at once; the driver's task scheduler assigns tasks to free executor cores",
      "64 tasks at once; every executor runs all the tasks of the stage",
      "4 tasks at once, one per executor; the cluster manager assigns each task",
      "32 tasks at once; the cluster manager schedules tasks and the driver only collects results"
    ],
    correct:0,
    explain:`Each executor core is a task slot, so four executors with 8 cores run 32 tasks concurrently; the remaining 32 tasks wait for free slots. The driver hosts the SparkSession and its schedulers: it builds the DAG, splits it into stages and tasks, and sends each task to an executor. The last option gets the count right but reverses the roles: the cluster manager allocates executors to the application and never schedules individual tasks.`
  },

  /* Ch 03 - DataFrames, Datasets and the SparkSession lifecycle */
  {
    q:`A data engineer writes a standalone PySpark script that must run on a laptop during development and on a shared cluster in production, and it begins with <code>from pyspark.sql import SparkSession</code>. Which line correctly obtains the entry point, and what happens if a session already exists in the process?`,
    opts:[
      "<code>spark = SparkSession.builder.create()</code>; it raises an error if a session exists",
      "<code>spark = SparkContext.getOrCreate()</code>; it returns a session that can read tables and run SQL",
      "<code>spark = SparkSession.builder.getOrCreate()</code>; it always starts a second session beside the existing one",
      "<code>spark = SparkSession.builder.appName(\"etl\").getOrCreate()</code>; it returns the existing session if there is one, otherwise it creates one"
    ],
    correct:3,
    explain:`SparkSession is the entry point for the DataFrame API, Spark SQL and reading data, and <code>getOrCreate()</code> is what makes a script portable: on a cluster where a session already exists (a Databricks notebook pre-creates <code>spark</code>) it returns that session, and on a laptop it creates one. The SparkContext option is the tempting near-miss: a SparkContext is the RDD-level entry point reached through <code>spark.sparkContext</code>, not a replacement for the session. The builder has no <code>create()</code> method, and getOrCreate never starts a second session in the same process.`
  },

  /* Ch 04 - Caching and storage levels */
  {
    q:`A 60 GB DataFrame is produced by a join followed by several expensive transformations, and five downstream actions reuse it. Across all executors about 40 GB of memory is available for storage. The job must not recompute the join for each action. Which choice fits?`,
    opts:[
      "<code>df.persist(StorageLevel.MEMORY_ONLY)</code>, because the fastest level is always the right one for a reused DataFrame",
      "<code>df.persist(StorageLevel.MEMORY_AND_DISK)</code> (what <code>df.cache()</code> gives), so partitions that do not fit in memory spill to local disk instead of being recomputed",
      "No caching, because Spark reuses the result of the join automatically between actions on the same DataFrame",
      "<code>df.persist(StorageLevel.DISK_ONLY_2)</code>, because replication is required whenever a DataFrame is larger than memory"
    ],
    correct:1,
    explain:`MEMORY_AND_DISK keeps what fits in memory and writes the rest to the executors' local disks, so no action recomputes the lineage; it is also the default level for DataFrames, which is what <code>cache()</code> uses. MEMORY_ONLY is the tempting choice, but with 60 GB of data and 40 GB of storage memory the partitions that do not fit are dropped and recomputed from the join on every action, which is exactly the cost the job must avoid. Without caching, each action re-runs the whole plan, and the replicated disk level protects against executor loss, which the scenario does not ask for.`
  },

  /* Ch 05 - Executor memory and garbage collection */
  {
    q:`In the Spark UI's Executors tab an engineer sees that several executors spend over 40 percent of task time in garbage collection, and two executors were lost with OutOfMemoryError during a stage that caches a large DataFrame and then aggregates it. Which change addresses the cause rather than the symptom?`,
    opts:[
      "Reduce memory pressure on the executors: unpersist DataFrames that are no longer needed or cache at a disk-backed level, and raise the partition count so each task holds less data",
      "Increase spark.sql.shuffle.partitions to 2000 so the aggregation uses less driver memory",
      "Call collect() before the aggregation so the data moves to the driver and the executors are freed",
      "Switch the cache to MEMORY_ONLY so cached partitions stay off disk and the garbage collector has less to scan"
    ],
    correct:0,
    explain:`Executors are JVM processes, and long garbage-collection pauses plus OutOfMemoryError are the signature of too many objects competing for executor memory: cached partitions and execution memory for the aggregation share the same unified pool. Freeing cache memory or letting it spill to disk, and giving each task a smaller slice, lowers that pressure. Switching to MEMORY_ONLY is the tempting distractor: it keeps more in memory, which makes GC worse, not better. Shuffle partitions do not affect driver memory, and collecting to the driver trades an executor OOM for a driver OOM.`
  },

  /* Ch 06 - The execution hierarchy */
  {
    q:`A notebook runs <code>df = spark.read.parquet(path).filter(col("status") == "paid")</code>, then <code>df.count()</code>, then <code>df.groupBy("country").count().show()</code>. The Parquet source produces 12 input partitions and spark.sql.shuffle.partitions is at its default. How many jobs run, and what does the second job look like?`,
    opts:[
      "One job, because both actions share the same DataFrame; it has one stage of 12 tasks",
      "Two jobs; the second has one stage with 12 tasks, because a count after groupBy needs no shuffle",
      "Two jobs; the second has two stages, the first with 200 tasks and the second with 12",
      "Two jobs, one per action; the second has a read-and-filter stage with 12 tasks, then, after the shuffle, an aggregation stage with 200 tasks"
    ],
    correct:3,
    explain:`Every action starts its own job, so count() and show() are two jobs. Inside the second job the groupBy is a wide transformation, so Spark cuts a stage boundary at the shuffle: the first stage reads and filters with one task per input partition (12), and the stage after the shuffle has as many tasks as shuffle partitions, 200 by default. The option with 200 then 12 has the stages in the wrong order: shuffle partitions apply after the exchange, not to the scan. Stages are the engine's way of grouping narrow work between shuffles.`
  },

  /* Ch 07 - Partitions and shuffles */
  {
    q:`The final stage of a job, right after a join, runs 200 tasks although the cluster has 16 cores and the joined result is about 50 MB, so most tasks process a few kilobytes. A teammate suggests raising spark.sql.shuffle.partitions "so more executors get memory". What is the accurate reading?`,
    opts:[
      "The setting controls how many executors receive shuffle data, so raising it spreads memory across more executors",
      "The setting is the number of partitions a shuffle produces (200 by default) and says nothing about memory; for a small result it should be lowered, or left to Adaptive Query Execution to coalesce, so fewer and fuller tasks run",
      "The setting limits Spark to processing the first 200 partitions, so raising it makes sure no data is skipped",
      "The 200 tasks come from the larger table's 200 input files, so the setting is irrelevant after a join"
    ],
    correct:1,
    explain:`spark.sql.shuffle.partitions sets how many partitions every shuffle (join, groupBy, distinct, orderBy) writes, which is why a stage after a join has 200 tasks whatever the data size. It does not allocate memory or executors, and it never skips data. With 50 MB spread over 200 partitions each task is mostly overhead, so fewer partitions (or AQE's runtime coalescing) is the fix. The input-file option confuses input partitions, which are set by file layout, with shuffle partitions, which are set by this configuration.`
  },

  /* Ch 08 - Transformations, actions and lazy evaluation */
  {
    q:`A script runs <code>df = spark.read.parquet(src)</code>, <code>eu = df.filter(col("region") == "EU")</code>, <code>joined = eu.join(dims, "id")</code>, <code>final = joined.withColumn("total", col("qty") * col("price"))</code> and then <code>final.write.mode("overwrite").parquet(out)</code>. The first four lines return in milliseconds and the last takes twenty minutes. What explains the timing, and what does the optimizer do with the filter?`,
    opts:[
      "The first four lines each read the data and cache it, so only the Parquet write is slow",
      "Spark runs transformations eagerly but in the background, and the write waits for them to finish",
      "The first four lines only build a logical plan; the write is the action that executes the plan, and the optimizer pushes the region filter down to the Parquet scan so only EU rows are read",
      "The filter runs after the join, because Spark executes transformations in the order they are written"
    ],
    correct:2,
    explain:`read, filter, join and withColumn are transformations: they return new DataFrames and add to the plan, and nothing touches the data until an action such as write, count or show. Lazy evaluation is what lets the Catalyst optimizer rewrite the whole plan before running it, including pushing the filter down to the scan and pruning unused columns. The "eager but in the background" option describes a model Spark does not use, and the order-as-written option is the misconception lazy evaluation exists to break. Caching only happens when the code asks for it.`
  },

  /* Ch 09 - The Spark modules */
  {
    q:`A team has three needs: run existing pandas-style code against a 3 TB dataset with minimal rewriting; keep a running count of events per minute from a Kafka topic with exactly-once output; and train a logistic regression on 500 million rows. Which Spark modules match, in that order?`,
    opts:[
      "MLlib; Spark SQL; Structured Streaming",
      "Pandas API on Spark; Spark Core RDDs with manual checkpointing; Spark SQL",
      "Spark SQL; Pandas API on Spark; MLlib",
      "Pandas API on Spark; Structured Streaming; MLlib"
    ],
    correct:3,
    explain:`Pandas API on Spark runs pandas syntax on distributed DataFrames, so existing pandas code scales with the fewest changes; Structured Streaming is the stream-processing module with micro-batches, checkpoints and exactly-once sinks; MLlib is the machine learning library with distributed algorithms such as logistic regression. The RDD option is the tempting one for streaming because checkpoints exist at that level too, but Structured Streaming provides the counting, windowing and delivery guarantees built in. Spark SQL is the engine under every DataFrame, not a substitute for the pandas-style API.`
  }
];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
