<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 6",
  badge: "Databricks Spark Developer Associate",
  blurb: "Full-length mock. Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer. Databricks publishes no official passing score; 70% is our practice target.",
  coverage: "Full-length mock exam: 45 questions in 90 minutes across all seven sections, sampled at the official 20/20/30/10/10/5/5 weights.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

  /* Ch 01 - Why Spark: advantages and challenges */
  {
    ref:{chapter:1},
    q:`A clinic's analytics script reads a 600 MB CSV of lab reference ranges with <code>spark.read</code> on a four-node cluster, immediately calls <code>toPandas()</code> on the whole DataFrame, and does every later step in pandas. A reviewer is asked whether Spark is helping. Which assessment is accurate?`,
    opts:[
      "Spark helps: after toPandas() the pandas steps keep running across the four executors",
      "Spark adds only overhead: toPandas() collects every record to the driver, so the work runs on one machine anyway, and data this size fits plain pandas",
      "Spark helps, because toPandas() is lazy and only moves rows to the driver when a pandas method needs them",
      "Spark helps as long as Arrow is enabled, since Arrow keeps the resulting pandas DataFrame distributed"
    ],
    correct:1,
    explain:`Calling toPandas() right after loading collects every record into the driver program, which is the tell-tale sign that the job never needed Spark: the data fits on one machine and the cluster only adds scheduling overhead. Option A is the tempting misreading, but once the data is a pandas DataFrame every step runs on the driver alone. toPandas() is an action, not a lazy step, and Arrow makes the conversion faster, not smaller or distributed.`
  },

  /* Ch 02 - Cluster anatomy: driver, executors, cores and memory */
  {
    ref:{chapter:2},
    q:`A media company is moving its transcoding analytics to Apache Spark 4.0. The platform team asks two things: which cluster managers it can point <code>--master</code> at, and what the cluster manager does once an application's executors are running. Which answer is accurate?`,
    opts:[
      "Only YARN; once executors start, the cluster manager sends each task to a free core",
      "Standalone, YARN or Kubernetes; the cluster manager then tracks every stage's tasks and retries the failed ones",
      "Standalone, YARN or Kubernetes; executors then pull their tasks from a queue that the cluster manager maintains",
      "Standalone, YARN or Kubernetes; the cluster manager allocates CPU and memory for the executors and then steps back, while the driver schedules every task"
    ],
    correct:3,
    explain:`Spark 4.0 supports three cluster managers: its own Standalone manager, Hadoop YARN and Kubernetes. The cluster manager hands out executors and allocates resources across applications, but it never sees a task, a stage or a DataFrame; the driver's DAG and task schedulers plan the work, send tasks to executors and retry failures. Option B is the tempting one because retries do happen, but tracking and retrying tasks is the driver's job.`
  },

  /* Ch 03 - DataFrames, Datasets and the SparkSession lifecycle */
  {
    ref:{chapter:3},
    q:`A logistics analyst has a small pandas DataFrame <code>depots_pdf</code> of 40 depot codes and needs it as a Spark DataFrame so it can be joined to shipment data. Which line creates it?`,
    opts:[
      "<code>depots = spark.createDataFrame(depots_pdf)</code>",
      "<code>depots = DataFrame(depots_pdf)</code>",
      "<code>depots = spark.read.pandas(depots_pdf)</code>",
      "<code>depots = depots_pdf.to_spark()</code>"
    ],
    correct:0,
    explain:`There is no DataFrame constructor in PySpark: every DataFrame comes from a method on the SparkSession, and createDataFrame accepts a list, an RDD, a pandas DataFrame, a numpy array or an Arrow table. Calling a DataFrame class directly is the tempting habit carried over from pandas, but it is not how Spark DataFrames are made. spark.read loads files and tables and has no pandas method, and a plain pandas DataFrame has no to_spark method.`
  },

  /* Ch 04 - Caching and storage levels */
  {
    ref:{chapter:4},
    q:`An ad-tech job builds a DataFrame of deduplicated impressions through two large joins, then runs eight reports over it during a six-hour window. The cluster runs on spot instances and executors are reclaimed regularly. The team wants the reports to keep running without waiting for lost cached partitions to be recomputed, and accepts paying for the extra storage. Which line fits?`,
    opts:[
      "<code>impressions.cache()</code>",
      "<code>impressions.persist(StorageLevel.MEMORY_ONLY_SER)</code>",
      "<code>impressions.persist(StorageLevel.MEMORY_AND_DISK_2)</code>",
      "<code>impressions.persist(StorageLevel.DISK_ONLY)</code>"
    ],
    correct:2,
    explain:`The _2 levels keep each cached partition on two nodes, so when one executor is lost the tasks read the surviving copy instead of waiting for a recompute, at twice the storage; MEMORY_AND_DISK_2 also spills overflow to disk. <code>cache()</code> is the tempting choice because it is the default and does survive a lost executor, but only by recomputing the lost partitions from lineage, which is exactly the wait the team wants to avoid. MEMORY_ONLY_SER is a JVM-only constant that PySpark does not offer, and DISK_ONLY keeps a single copy.`
  },

  /* Ch 05 - Executor memory and garbage collection */
  {
    ref:{chapter:5},
    q:`Each executor of a hospital imaging-metadata job is configured with <code>spark.executor.memory=8g</code>, <code>spark.executor.memoryOverhead=1g</code>, <code>spark.memory.offHeap.enabled=true</code> with <code>spark.memory.offHeap.size=2g</code>, and <code>spark.executor.pyspark.memory=1g</code>. How much memory does each executor's container need?`,
    opts:[
      "8 GB: only the JVM heap counts, because the other settings are carved out of it",
      "12 GB: the heap plus the memory overhead, the off-heap size and the PySpark memory",
      "9 GB: the heap plus the memory overhead; off-heap and PySpark memory live inside the heap",
      "10 GB: the heap plus the off-heap size, because memoryOverhead is only a suggested margin"
    ],
    correct:1,
    explain:`The container an executor needs is the sum of the JVM heap (spark.executor.memory), spark.executor.memoryOverhead for native and JVM overhead, the off-heap size when off-heap memory is enabled, and spark.executor.pyspark.memory. Option C is the tempting partial sum, but off-heap memory is by definition outside the JVM heap, which is why the garbage collector never scans it. Only spark.executor.memory sets the heap itself.`
  },

  /* Ch 06 - The execution hierarchy */
  {
    ref:{chapter:6},
    q:`With AQE disabled, a job reads delivery-scan Parquet files that produce 30 input partitions, then runs <code>scans.repartition(48).filter(col("status") == "DELIVERED").write.mode("overwrite").parquet(out)</code>. What does the Spark UI show for this write?`,
    opts:[
      "One job with two stages: 30 tasks that read the files and write shuffle output, then 48 tasks that filter and write the result",
      "One job with three stages, because the read, the repartition and the filter each start a new stage",
      "Two jobs, one for the repartition and one for the write, each running 48 tasks",
      "One job with a single stage of 48 tasks, because repartition is applied before any data is read"
    ],
    correct:0,
    explain:`The write is the only action, so there is one job, and repartition is a wide transformation, so the job splits into two stages at that shuffle: one task per input partition (30), then one task per shuffle partition (48), with the narrow filter pipelined into the second stage. Option B is the tempting one, but narrow steps such as filter never start a stage; only shuffles do. Transformations submit no jobs of their own.`
  },

  /* Ch 07 - Partitions and shuffles */
  {
    ref:{chapter:7},
    q:`On a cluster with 8 executor cores, a media analyst reads a single 2 GB Parquet file of video plays and runs <code>plays.rdd.getNumPartitions()</code>, which returns 16. A teammate expected 200, "because that is the default partition count". What explains the 16?`,
    opts:[
      "Spark creates exactly two partitions per executor core, and the cluster has 8 cores",
      "spark.sql.shuffle.partitions has been set to 16 for this session",
      "Parquet files are never split, so Spark divides the file by its row groups regardless of their size",
      "Input partitions come from file count and size: spark.sql.files.maxPartitionBytes caps each at 128 MB, so 2 GB becomes about 16, while the 200 default applies only to shuffle output"
    ],
    correct:3,
    explain:`For a file read, the initial partition count comes from how many files there are and how big they are: spark.sql.files.maxPartitionBytes (128 MB by default) caps one input partition, so a 2 GB file becomes about 16. spark.sql.shuffle.partitions, the source of the teammate's 200, only sets how many partitions a shuffle produces, and nothing here has shuffled yet. The 8 cores decide how many of those 16 tasks run at the same time.`
  },

  /* Ch 08 - Transformations, actions and lazy evaluation */
  {
    ref:{chapter:8},
    q:`Before scheduling a query that finds late shipments, an engineer wants to read all four plans Spark builds for the DataFrame <code>late</code> (parsed, analyzed, optimized logical and physical) without starting any job. Which call does that?`,
    opts:[
      "<code>late.explain()</code>",
      "<code>late.explain(mode=\"codegen\")</code>",
      "<code>late.explain(True)</code>",
      "<code>late.collect()</code>, then open the query in the SQL tab of the Spark UI"
    ],
    correct:2,
    explain:`explain(True), the extended form, prints the parsed, analyzed and optimized logical plans plus the physical plan, and like every explain call it only prints the plan and returns, executing nothing. Plain explain() is the tempting answer because it is the usual habit, but extended defaults to False, so it prints only the physical plan. codegen is a different mode, and collect() is an action that runs the whole job.`
  },

  /* Ch 09 - The Spark modules */
  {
    ref:{chapter:9},
    q:`A video platform uses Structured Streaming to keep a Delta table of plays current from a Kafka topic. The query sets a checkpoint location but no <code>trigger(...)</code> at all. How does the engine schedule micro-batches?`,
    opts:[
      "It runs micro-batches as fast as data arrives: by default the next micro-batch starts as soon as the previous one finishes",
      "It runs one micro-batch per minute, the default processing interval",
      "It processes everything available once and then stops, like availableNow",
      "It switches to continuous processing, because no micro-batch interval was given"
    ],
    correct:0,
    explain:`With no trigger set, Structured Streaming runs micro-batches back to back, the same as a processingTime trigger of 0, so the next batch starts as soon as the previous one completes. A fixed one-minute default is the tempting assumption, but an interval only applies when processingTime is set explicitly. Stopping after the available data needs trigger(availableNow=True), and continuous processing is an experimental mode that must be requested.`
  },

  /* Ch 10 - Reading data sources: files and JDBC */
  {
    ref:{chapter:10},
    q:`A 30-million-row pharmacy-dispensing table is read from Oracle over JDBC with partitionColumn, the bounds and numPartitions set correctly, so 16 tasks run in parallel. Each task still spends most of its time waiting on the database, pulling only 10 rows per round trip, the Oracle driver's default. Which option addresses that?`,
    opts:[
      "<code>.option(\"numPartitions\", 400)</code>, so many more connections share the round trips",
      "<code>.option(\"fetchsize\", 1000)</code>, so each round trip returns many more rows",
      "<code>.option(\"query\", \"SELECT * FROM dispensing\")</code> in place of dbtable",
      "<code>.repartition(400)</code> right after <code>load()</code>"
    ],
    correct:1,
    explain:`fetchsize sets how many rows the driver pulls per round trip; Oracle's driver defaults to 10, so raising it cuts the number of round trips by the same factor. More partitions is the tempting fix, but every task is a live database connection, and the guidance is to be wary above about 50 because too many can overwhelm the database. query only names the source another way (and cannot be combined with partitionColumn), and repartition moves rows after they have already arrived.`
  },

  /* Ch 10 - Reading data sources: files and JDBC */
  {
    ref:{chapter:10},
    q:`A team reads a 50-million-row PostgreSQL <code>shipments</code> table whose <code>shipment_id</code> runs from 1 to 50,000,000. They set <code>partitionColumn="shipment_id"</code>, <code>lowerBound=1</code>, <code>upperBound=10000000</code> and <code>numPartitions=10</code>, believing this reads only the first ten million shipments in parallel. What actually happens?`,
    opts:[
      "Only shipments 1 to 10,000,000 are read, in ten parallel queries of about a million rows each",
      "The read fails, because upperBound must be at least the column's largest value",
      "Spark falls back to a single-task read, because the bounds do not cover the whole table",
      "All 50 million rows are read: the bounds only set the stride, so the last of the ten queries also takes every row above 10,000,000 and runs far longer than the others"
    ],
    correct:3,
    explain:`lowerBound and upperBound decide how the range is cut into numPartitions queries; they do not filter, so rows below the lower bound go to the first query and rows above the upper bound to the last. Here the last task pulls about 41 million rows while the others pull about a million each. Option A is the tempting misreading of the bounds as a WHERE clause: to read a subset, filter inside a dbtable subquery, and set the bounds to the column's real range so the work is even.`
  },

  /* Ch 11 - Writing: partitionBy and overwrite */
  {
    ref:{chapter:11},
    q:`A carrier-performance job writes delivery scans with <code>scans.write.mode("overwrite").partitionBy("carrier", "scan_date").parquet("/data/scans")</code>. An analyst now needs only the UPS rows, with the <code>carrier</code> column still present in the result. Which read is right?`,
    opts:[
      "<code>spark.read.parquet(\"/data/scans/carrier=UPS\")</code>",
      "<code>spark.read.parquet(\"/data/scans/scan_date=*/carrier=UPS\")</code>",
      "<code>spark.read.parquet(\"/data/scans\").filter(col(\"carrier\") == \"UPS\")</code>",
      "<code>spark.read.option(\"partitionBy\", \"carrier\").parquet(\"/data/scans\")</code>"
    ],
    correct:2,
    explain:`Reading the root path recovers carrier and scan_date as columns from the folder names, and a filter on a partition column lets Spark open only the carrier=UPS folders (partition pruning). Reading the subfolder directly is the tempting shortcut: it reads the same files, but the carrier value lives in a folder name above the path, so the column is missing. Folders nest in partitionBy order, carrier first, so option B points at folders that do not exist, and partitionBy is a writer method, not a reader option.`
  },

  /* Ch 12 - Querying files directly with SQL */
  {

    q:`An analyst wants a quick look at Parquet files of ambulance dispatches in <code>/Volumes/ems/raw/dispatch/</code> from a SQL cell, without creating a table. Which statement is written correctly?`,
    opts:[
      "<code>SELECT * FROM parquet.&#96;/Volumes/ems/raw/dispatch/&#96; LIMIT 10</code>",
      "<code>SELECT * FROM parquet.'/Volumes/ems/raw/dispatch/' LIMIT 10</code>",
      "<code>SELECT * FROM parquet('/Volumes/ems/raw/dispatch/') LIMIT 10</code>",
      "<code>SELECT * FROM '/Volumes/ems/raw/dispatch/' USING parquet LIMIT 10</code>"
    ],
    correct:0,
    explain:`A direct file query puts the format name where a schema name would go, then a dot, then the path in backticks; the path can be a single file or a whole directory. Single quotes are the tempting variant because paths are usually string literals, but this form needs backticks so the path is read as an identifier. The format is not a function that takes the path, and USING belongs to CREATE TABLE, not to a SELECT.`

  /* Ch 13 - Save modes */
  {
    ref:{chapter:13},
    q:`A weekly job writes ad-campaign invoices with <code>invoices.write.parquet("/billing/invoices/2026-w41")</code>. One run fails halfway on a network error, and the automatic retry then fails at once because the first attempt left partial files at the path. The team wants any retry to leave exactly that week's complete invoices. Which change fits?`,
    opts:[
      "Add <code>.mode(\"append\")</code>, so the retry adds its rows to whatever the first attempt wrote",
      "Add <code>.mode(\"overwrite\")</code>, so every attempt replaces whatever is at the path with the full week",
      "Add <code>.mode(\"ignore\")</code>, so the retry skips the write when the path already exists",
      "Add <code>.mode(\"error\")</code>, the explicit form of the default, so the failure is reported more clearly"
    ],
    correct:1,
    explain:`The job recomputes a slice it owns, so its write must be idempotent: overwrite replaces the existing contents, and one attempt or three leave the same complete week. Append is the tempting choice because the retry would stop failing, but it stacks the full week on top of the partial first attempt and duplicates invoices. ignore reports success while keeping only the partial files, and "error" is the same mode as the default errorifexists, so the retry would still fail.`
  },

  /* Ch 13 - Save modes */
  {
    ref:{chapter:13},
    q:`A SQL-only engineer reruns one day of a delivery-scans table partitioned by <code>scan_date</code> with <code>INSERT OVERWRITE TABLE ops.scans PARTITION (scan_date = '2026-10-09') SELECT ...</code>. The table holds a year of days. What does the statement replace?`,
    opts:[
      "The whole table: INSERT OVERWRITE always truncates every partition first",
      "Nothing: INSERT OVERWRITE adds the rows to the existing partition, like INSERT INTO",
      "The statement fails, because only the DataFrame writer can overwrite a partition",
      "Only the 2026-10-09 partition: with a partition spec, INSERT OVERWRITE truncates the matching partition before inserting"
    ],
    correct:3,
    explain:`INSERT OVERWRITE without a partition spec truncates the whole table before inserting, but with one it truncates only the matching partitions, so the other days stay. Whole-table truncation is the tempting answer because that is what the bare statement does, and it is why the spec matters. INSERT INTO is the SQL statement whose rows are added to the existing ones.`
  },

  /* Ch 14 - Persistent tables */
  {
    ref:{chapter:14},
    q:`A hospital on Databricks creates a new managed table of patient encounters with <code>saveAsTable</code>. Queries filter on a mix of columns, from low-cardinality <code>facility</code> to high-cardinality <code>patient_id</code>. Which layout does Databricks recommend for this new table?`,
    opts:[
      "<code>partitionBy(\"patient_id\")</code>, so every patient gets a directory that queries can prune",
      "<code>bucketBy(64, \"patient_id\")</code>, since bucketing is the preferred layout for Delta tables",
      "Liquid Clustering, which Databricks recommends for all new Delta tables and which replaces partitioning and ZORDER",
      "No layout at all, because managed tables cannot be partitioned or clustered"
    ],
    correct:2,
    explain:`On Databricks, saveAsTable creates a Delta table by default, and Databricks recommends Liquid Clustering for all new tables: it handles high and low cardinality without fixed folder boundaries and replaces table partitioning and ZORDER. Bucketing is the tempting classic Spark answer, but the bucketing clause is not supported for Delta tables. Partitioning by a unique id creates a directory per patient, the small-files problem, and managed tables can carry a layout like any other table.`
  },

  /* Ch 14 - Persistent tables */
  {
    ref:{chapter:14},
    q:`A dispatch team created a scratch table with <code>routes.write.saveAsTable("ops.tmp_routes")</code>, giving no path, on Unity Catalog. At the end of the project someone runs <code>DROP TABLE ops.tmp_routes</code>. What happens to the data?`,
    opts:[

      "Nothing happens until the SparkSession that created the table ends",
      "The table becomes a temporary view backed by the remaining files"
    ],
    correct:0,
    explain:`saveAsTable without a path creates a managed table: the catalog owns the files, so DROP TABLE removes both the metadata and the data, and Unity Catalog deletes the files after its recovery period, 7 days by default. Keeping the files is the tempting answer because that is what happens to an external table, one created with option("path", ...) or LOCATION. A persistent table does not depend on the session that wrote it.`
  },

  /* Ch 15 - Temporary and global temporary views */
  {
    ref:{chapter:15},
    q:`A notebook caches the data behind a temporary view with <code>spark.catalog.cacheTable("routes_v")</code>. Later the same notebook runs <code>spark.catalog.dropTempView("routes_v")</code>. What does that call do?`,
    opts:[
      "Returns None and leaves the cached data in memory until the session ends",
      "Raises an error, because a cached view must be uncached before it can be dropped",

    ],
    correct:3,
    explain:`dropTempView returns a bool saying whether a view was dropped, and dropping a view also uncaches it if it had been cached. A view stores only a name and a query plan, so nothing on storage is deleted. Option A is the tempting assumption that a cache outlives its view, but the drop releases the cached data as well.`
  },

  /* Ch 16 - Columns: select, withColumn, withColumnRenamed, drop */
  {
    ref:{chapter:16},
    q:`A lab team adds 400 derived flag columns to a results DataFrame with a Python loop: <code>for c in panels: df = df.withColumn(c + "_high", col(c) &gt; limits[c])</code>. The driver spends minutes before any task starts, and longer loops end in a StackOverflowException. Which rewrite produces the same columns and fixes it?`,
    opts:[
      "Call <code>df.cache()</code> inside the loop so each withColumn reads from memory",
      "Add every column in one call: <code>df.withColumns({c + \"_high\": col(c) &gt; limits[c] for c in panels})</code>",
      "Use <code>df.withColumnRenamed(c, c + \"_high\")</code> inside the loop, which is cheaper than withColumn",
      "Wrap each comparison in <code>lit()</code> so Spark treats the new columns as constants"
    ],
    correct:1,
    explain:`Each withColumn call adds another projection to the plan, and the docs warn that calling it many times, for instance in a loop, builds big plans that are slow to analyze and can even overflow the stack. withColumns with a dict, or one select listing every new column, adds them all in a single projection. Caching is the tempting fix because the job feels slow, but the time is spent planning on the driver, not reading data; withColumnRenamed renames rather than adds, and lit() is for literal values.`
  },

  /* Ch 17 - Rows: filter, split and explode */
  {
    ref:{chapter:17},
    q:`Each row of a delivery-routes DataFrame holds <code>route_id</code> and an array column <code>stops</code>. Dispatch needs one row per stop with a <code>seq</code> column numbering the stops 1, 2, 3 in array order. Which code produces it?`,
    opts:[
      "<code>routes.select(\"route_id\", explode(\"stops\")).withColumn(\"seq\", col(\"pos\"))</code>",
      "<code>routes.select(\"route_id\", posexplode(\"stops\")).withColumnRenamed(\"pos\", \"seq\")</code>",
      "<code>routes.select(\"route_id\", posexplode(\"stops\")).withColumn(\"seq\", col(\"pos\") + 1)</code>",
      "<code>routes.select(\"route_id\", explode_outer(\"stops\", \"seq\"))</code>"
    ],
    correct:2,
    explain:`posexplode returns one row per element, with a pos column holding the element's position counted from 0 and the element in col, so adding 1 gives the 1-based sequence. Renaming pos is the tempting shortcut, but the numbering would start at 0. explode produces no pos column at all, and explode_outer takes only the column to explode.`
  },

  /* Ch 18 - Deduplication and missing data */
  {
    ref:{chapter:18},
    q:`An ICU vitals DataFrame has five measurement columns, listed in <code>m = ["hr", "spo2", "resp", "temp", "bp_sys"]</code>, plus <code>patient_id</code> and <code>ts</code>, which are never null. A model can use a reading only if at least three of the five measurements are present. Which call keeps exactly those rows?`,
    opts:[
      "<code>vitals.na.drop(thresh=3, subset=m)</code>",
      "<code>vitals.na.drop(thresh=3)</code>",
      "<code>vitals.na.drop(how=\"all\", subset=m)</code>",
      "<code>vitals.na.drop(how=\"any\", subset=m)</code>"
    ],
    correct:0,
    explain:`thresh keeps rows with at least that many non-null values, and subset limits the count to the listed columns, so thresh=3 over the five measurements is exactly the rule. Option B is the tempting near miss: without subset, the two never-null columns count toward the three, so a reading with a single measurement survives. how="all" drops only rows where all five are missing, and how="any" drops every row with one gap, discarding usable readings.`
  },

  /* Ch 19 - Aggregations */
  {
    ref:{chapter:19},
    q:`An ad-serving team needs one row per <code>campaign_id</code> with three figures: total impressions, counting every row even when <code>viewer_id</code> is null; an estimated number of unique viewers held to about 2 percent error; and the average <code>watch_secs</code>. Which aggregation gives all three?`,
    opts:[
      "<code>imps.groupBy(\"campaign_id\").agg(F.count(\"viewer_id\"), F.approx_count_distinct(\"viewer_id\", 0.02), F.avg(\"watch_secs\"))</code>",
      "<code>imps.groupBy(\"campaign_id\").agg(F.count(\"*\"), F.approx_count_distinct(\"viewer_id\", 0.02), F.mean(\"watch_secs\"))</code>",
      "<code>imps.groupBy(\"campaign_id\").agg(F.count(\"*\"), F.approx_count_distinct(\"viewer_id\"), F.avg(\"watch_secs\"))</code>",
      "<code>imps.groupBy(\"campaign_id\").agg(F.count(\"*\"), F.count_distinct(\"viewer_id\", 0.02), F.avg(\"watch_secs\"))</code>"
    ],
    correct:1,
    explain:`count("*") counts every row, nulls included, approx_count_distinct takes its maximum relative standard deviation (rsd) as the second argument, 0.02 here, and mean is an alias of avg. Option C is the tempting near miss: the form is right, but the default rsd is 0.05, so the estimate is only held to about 5 percent. count("viewer_id") skips null viewers and undercounts impressions, and count_distinct is exact and takes extra columns, not an error bound.`
  },

  /* Ch 20 - Dates and timestamps */
  {
    ref:{chapter:20},
    q:`An admissions DataFrame has DATE columns <code>admit_date</code> and <code>discharge_date</code>. A report computes length of stay with <code>F.datediff(F.col("admit_date"), F.col("discharge_date"))</code>, and every stay comes out negative: -4 for a patient admitted on 2026-03-02 and discharged on 2026-03-06. Which expression returns 4?`,
    opts:[
      "<code>F.months_between(F.col(\"discharge_date\"), F.col(\"admit_date\"))</code>",
      "<code>F.date_sub(F.col(\"discharge_date\"), F.col(\"admit_date\"))</code>",
      "<code>F.datediff(F.col(\"admit_date\"), F.col(\"discharge_date\")).cast(\"int\")</code>",
      "<code>F.datediff(F.col(\"discharge_date\"), F.col(\"admit_date\"))</code>"
    ],
    correct:3,
    explain:`datediff(end, start) counts days with the end date first, so swapping the arguments flips the sign. The cast is the tempting quick fix, but the result is already an integer, so it stays -4. months_between returns a fractional number of months rather than days, and date_sub moves a date back by a number of days and returns a DATE, not a gap.`
  },

  /* Ch 21 - Joins */
  {
    ref:{chapter:21},
    q:`Lab orders and lab results are matched on <code>specimen_code</code>. Some specimens on both sides have a null code, and the lab wants a null code on an order to pair with a null code on a result. <code>orders.join(results, orders.specimen_code == results.specimen_code)</code> leaves all of them out. Which join fixes it?`,
    opts:[
      "<code>orders.join(results, orders.specimen_code.eqNullSafe(results.specimen_code))</code>",
      "<code>orders.join(results, orders.specimen_code == results.specimen_code, \"full\")</code>",
      "<code>orders.join(results, \"specimen_code\")</code>",
      "<code>orders.join(results, orders.specimen_code == results.specimen_code, \"left_semi\")</code>"
    ],
    correct:0,
    explain:`In an equality join, == against a null returns null rather than true, so a null key finds no partner, not even another null; eqNullSafe returns true when both sides are null. The full join is tempting because the null rows reappear, but they come back unmatched and padded with nulls rather than paired. Joining on the column name is still an equality join with the same null rule, and left_semi only filters the orders side.`
  },

  /* Ch 22 - Unions */
  {
    ref:{chapter:22},
    q:`A hospital's billing extract and an insurer's claim file have the same columns in the same order, <code>(patient_id, procedure_code)</code>. A patient legitimately billed twice and claimed twice for the same procedure must appear twice in the list of rows present in both files. Which call returns that list?`,
    opts:[
      "<code>billing.intersect(claims)</code>",
      "<code>billing.union(claims).distinct()</code>",
      "<code>billing.intersectAll(claims)</code>",
      "<code>billing.exceptAll(claims)</code>"
    ],
    correct:2,
    explain:`intersectAll is SQL INTERSECT ALL: it returns rows present in both DataFrames and preserves duplicates, so a pair billed twice and claimed twice stays twice. intersect is the tempting near miss, but it is SQL INTERSECT, which removes duplicates and lists the pair once. union with distinct lists rows from either file, and exceptAll returns billing rows that have no match in claims.`
  },

  /* Ch 23 - Reading with explicit schemas */
  {
    ref:{chapter:23},
    q:`A lab-data job validated a vendor's CSV schema once and wants to keep it as text alongside the job, then rebuild it every night for <code>spark.read.schema(...)</code>. <code>good</code> is a DataFrame read with the correct schema, and <code>json</code> is Python's json module. Which code does the round trip?`,
    opts:[
      "<code>s = good.printSchema()</code>, later <code>StructType.fromJson(s)</code>",
      "<code>s = good.schema.json()</code>, later <code>StructType.fromJson(json.loads(s))</code>",
      "<code>s = good.schema().json()</code>, later <code>StructType.fromJson(json.loads(s))</code>",
      "<code>s = good.schema.json()</code>, later <code>StructType.fromJson(s)</code>"
    ],
    correct:1,
    explain:`df.schema is a property that returns the StructType, its json() method turns it into a JSON string, and StructType.fromJson rebuilds the schema from the parsed dict, hence json.loads. Option D is the tempting near miss: fromJson takes a dict, not the raw string. printSchema() prints a tree and returns None, and because schema is a property, good.schema() fails.`
  },

  /* Ch 24 - Sorting, iterating and converting */
  {
    ref:{chapter:24},
    q:`An emergency department's triage DataFrame has an integer <code>acuity</code> column, where 1 is most urgent; patients not yet assessed have a null acuity. <code>queue.orderBy(col("acuity").asc())</code> puts the unassessed patients at the top of the board. Which sort lists acuity 1 first and the unassessed patients last?`,
    opts:[
      "<code>queue.orderBy(col(\"acuity\").desc())</code>",
      "<code>queue.orderBy(\"acuity\", ascending=True, nulls=\"last\")</code>",
      "<code>queue.sort(col(\"acuity\").desc_nulls_last())</code>",
      "<code>queue.orderBy(col(\"acuity\").asc_nulls_last())</code>"
    ],
    correct:3,
    explain:`By default nulls sort first in ascending order and last in descending order, so an ascending sort needs asc_nulls_last() to keep acuity 1 on top and push the nulls to the bottom. Sorting descending is the tempting fix because it does move the nulls down, but it also puts the least urgent patients first, and desc_nulls_last has the same problem. orderBy has no nulls parameter; null placement is chosen per column.`
  },

  /* Ch 25 - Python UDFs */
  {
    ref:{chapter:25},
    q:`A logistics team writes a Python UDF that adds random jitter to delivery ETAs for a simulation, so the same input row can give a different output on each call. How should the UDF be declared so Spark does not treat it as deterministic?`,
    opts:[
      "<code>jitter = udf(add_jitter, \"double\").asNondeterministic()</code>",
      "<code>jitter = udf(add_jitter, \"double\", useArrow=True)</code>",
      "<code>jitter = spark.udf.register(\"jitter\", add_jitter, \"double\")</code>",
      "<code>jitter = udf(add_jitter)</code>, since a UDF with no returnType is nondeterministic"
    ],
    correct:0,
    explain:`Spark treats a UDF as deterministic by default; for output that can change for the same input, such as a random number, the UDF is marked with asNondeterministic(). useArrow=True is the tempting option because it also changes how the UDF runs, but it only swaps pickle for Arrow in the data transfer. Registering for SQL makes the name callable from spark.sql, and leaving out returnType just defaults the type to StringType.`
  },

  /* Ch 26 - Stateful operators and state stores */
  {
    ref:{chapter:26},
    q:`A fleet stream groups GPS pings by <code>vehicle_id</code> with <code>transformWithStateInPandas</code>. For each vehicle the processor must keep the most recent 20 pings, appending new ones and reading them back to smooth the route. Which state variable fits that need most directly?`,
    opts:[
      "A ValueState holding the latest ping only",
      "A MapState keyed by vehicle_id",
      "A ListState, which keeps a list per key with appendValue, appendList, put and get",
      "A broadcast variable updated by each micro-batch"
    ],
    correct:2,
    explain:`State variables are already kept per grouping key, and ListState holds a list for each key, with appendValue and appendList to add and get and put to read and replace, which fits a rolling set of recent pings. MapState is the tempting choice because it sounds per-vehicle, but it holds a dict of sub-keys within each key, and the per-vehicle split already comes from the grouping. ValueState holds one value, and a broadcast variable is read-only data sent from the driver.`
  },

  /* Ch 27 - Broadcast variables and accumulators */
  {
    ref:{chapter:27},
    q:`A long-running routing application broadcasts a 200 MB table of road segments with <code>bc = spark.sparkContext.broadcast(segments)</code>. After the nightly rebuild, that variable will never be used again, and the team wants its memory freed for good on the executors and the driver. Which call fits?`,
    opts:[
      "<code>bc.unpersist()</code>",
      "<code>bc.destroy()</code>",
      "<code>spark.catalog.clearCache()</code>",
      "<code>bc.value.clear()</code>"
    ],
    correct:1,
    explain:`destroy() frees everything the broadcast holds, and the variable cannot be used afterwards, which matches a value that is finished. unpersist() is the tempting choice, but it only deletes the copies cached on the executors, and if the variable is used again it is simply re-sent. clearCache drops cached tables and DataFrames, not broadcast variables, and modifying the broadcast value breaks the rule that a broadcast stays read-only once sent.`
  },

  /* Ch 28 - Broadcast joins */
  {
    ref:{chapter:28},
    q:`An analyst working only in <code>spark.sql</code> joins a 3 TB delivery-scans table to a 3 MB depots table aliased <code>d</code>. Because depots has no statistics, the plan shows a SortMergeJoin. Which statement makes Spark broadcast depots?`,
    opts:[
      "<code>SELECT /*+ BROADCAST(d) */ * FROM scans s JOIN depots d ON s.depot_id = d.depot_id</code>",
      "<code>SELECT /*+ MERGE(d) */ * FROM scans s JOIN depots d ON s.depot_id = d.depot_id</code>",
      "<code>SELECT /*+ SHUFFLE_HASH(d) */ * FROM scans s JOIN depots d ON s.depot_id = d.depot_id</code>",
      "<code>SET spark.sql.autoBroadcastJoinThreshold = -1</code>, then the same join without a hint"
    ],
    correct:0,
    explain:`The SQL hint BROADCAST (also accepted as BROADCASTJOIN or MAPJOIN) broadcasts the aliased side regardless of the threshold, the SQL form of broadcast() in Python. MERGE is the tempting look-alike, but it asks for a sort-merge join, which is what the plan already has, and SHUFFLE_HASH asks for a shuffle hash join. A threshold of -1 disables automatic broadcasting altogether.`
  },

  /* Ch 29 - repartition versus coalesce */
  {
    ref:{chapter:29},
    q:`After a heavy filter on shipment events, a DataFrame has 64 partitions ranging from 2 MB to 3 GB, and the next stage waits on a few huge tasks while most cores sit idle. The team wants 64 partitions of roughly equal size. Which call does it?`,
    opts:[
      "<code>events.coalesce(64)</code>",
      "<code>events.coalesce(32)</code>",
      "Set spark.sql.files.maxPartitionBytes to 64 MB",
      "<code>events.repartition(64)</code>"
    ],
    correct:3,
    explain:`repartition(n) shuffles every row so the new partitions come out roughly equal in size, which is the fix for wildly uneven partitions. coalesce(32) is the tempting cheap option, but it only merges neighboring partitions without a shuffle, so the 3 GB partitions stay large and the imbalance remains. coalesce(64) does nothing at the current count, and maxPartitionBytes sizes input splits when files are read, not partitions after a filter.`
  },

  /* Ch 30 - Data skew and reducing shuffles */
  {
    ref:{chapter:30},
    q:`A media team salts a skewed join between <code>plays</code>, where one live-sports channel dominates, and the small <code>channels</code> table, starting with <code>plays = plays.withColumn("salt", (F.rand() * 8).cast("int"))</code>. What must happen to <code>channels</code> before the two are joined on <code>["channel_id", "salt"]</code>?`,
    opts:[
      "Add its own random salt with the same expression, so both sides are salted alike",
      "Nothing: join on channel_id alone and let the salt on plays spread the hot channel",
      "Give every channels row one copy per salt value, using <code>F.explode(F.sequence(F.lit(0), F.lit(7)))</code> as its salt column",
      "Repartition channels into 8 partitions, one per salt value"
    ],
    correct:2,
    explain:`Salting spreads the hot key over 8 values on the big side, so the other side must carry every salt value for every key: exploding a 0 to 7 sequence gives each channels row 8 copies, and each salted group still finds its match. A random salt on both sides is the tempting symmetry, but then a play and its channel match only when two random numbers happen to agree. Joining on channel_id alone sends the hot key back to one partition, and partition counts do not create the missing salt values.`
  },

  {
    ref:{chapter:31},
    q:`A Structured Streaming query aggregates ad clicks per campaign, and every micro-batch runs 200 tiny reduce tasks over a few kilobytes of data. The session leaves <code>spark.sql.adaptive.enabled</code> at its default of true. Why are the shuffle partitions not coalesced?`,
    opts:[
      "AQE only coalesces partitions smaller than 1 KB; raise spark.sql.adaptive.advisoryPartitionSizeInBytes",
      "AQE re-plans batch queries only; a streaming query keeps the partition count from spark.sql.shuffle.partitions in every micro-batch",
      "AQE starts coalescing only after the first ten micro-batches, once it has collected statistics",
      "AQE needs a broadcast join in the plan before it can coalesce anything"
    ],

    explain:`Adaptive Query Execution re-optimizes batch queries at shuffle boundaries and does not apply to Structured Streaming, so a streaming aggregation runs with spark.sql.shuffle.partitions (200 by default) in each micro-batch. Option A is the tempting one because coalescing toward the advisory size is a real AQE feature, but it never runs on this query. There is no warm-up period, and coalescing does not depend on the join strategy.`
  },

  {

      "Set spark.log.level to INFO, so the stage data is written into the driver log",
      "End the job with collect(), so the results and the UI stay on the driver",
      "Set spark.eventLog.enabled to true for the job and open the Spark history server (port 18080), which rebuilds the UI from the event logs"
    ],
    correct:3,
    explain:`The live Spark UI is served by the driver only for as long as the application runs, so it disappears when the job ends. With spark.eventLog.enabled the application writes event logs, and the Spark history server rebuilds the same pages from them afterwards. Changing the log level is the tempting answer because it sounds like more detail, but it only affects log verbosity; the UI pages come from event logs, not from log lines.`
  },

  /* Ch 33 - The Structured Streaming model */
  {
    ref:{chapter:33},
    q:`A streaming query keeps a running count of video plays per title with <code>plays.groupBy("title_id").count()</code>, and it will run for months. A reviewer worries that Spark must store every play ever received in order to keep the counts correct. What does Structured Streaming actually keep?`,
    opts:[
      "Every input row, saved in the checkpoint so each trigger can recount from the beginning",
      "Every input row in executor memory, rescanned on each trigger",
      "Only the minimal state needed for the result, here the running count per title, which each trigger updates with the new rows before discarding them",
      "Nothing between triggers: each micro-batch's counts cover only that batch's rows"
    ],
    correct:2,
    explain:`The stream is modelled as an unbounded input table, but Spark never materializes it: each trigger reads the new rows, updates the result, discards the input, and keeps only the minimal intermediate state, here the counts per title in the state store. Storing every row in the checkpoint is the tempting worry, but the checkpoint holds offsets, commits and that state, not the input itself. Keeping nothing would turn the running count into per-batch counts.`
  },

  /* Ch 34 - readStream, writeStream, output modes and sinks */
  {
    ref:{chapter:34},
    q:`In a unit test, a developer wants to run a small streaming aggregation over test lab results and then check the result table with <code>spark.sql</code> on the driver. Which sink setup allows that?`,
    opts:[
      "<code>writeStream.format(\"memory\").queryName(\"lab_counts\").outputMode(\"complete\").start()</code>, then <code>spark.sql(\"SELECT * FROM lab_counts\")</code>",
      "<code>writeStream.format(\"console\").outputMode(\"complete\").start()</code>, then <code>spark.sql(\"SELECT * FROM console\")</code>",
      "<code>writeStream.format(\"memory\").outputMode(\"complete\").start()</code>, then <code>spark.sql(\"SELECT * FROM memory\")</code>",
      "<code>writeStream.format(\"kafka\").outputMode(\"complete\").start()</code>, then <code>spark.sql(\"SELECT * FROM kafka\")</code>"
    ],
    correct:0,
    explain:`The memory sink collects the output into an in-memory table on the driver, and the table's name comes from queryName(...), so spark.sql can query it by that name; like the console sink it is for debugging and is not fault tolerant. Leaving out queryName is the tempting slip: the format alone gives the table no name to query. The console sink only prints each batch, and a Kafka sink writes to a topic, not to a queryable table.`
  },

  /* Ch 35 - Streaming operations: window and aggregation */
  {
    ref:{chapter:35},
    q:`A stream counts deliveries per depot in 10-minute tumbling windows on <code>scan_ts</code>, with <code>withWatermark("scan_ts", "15 minutes")</code> and append mode. The latest event time seen so far is 10:42. A scan stamped 10:24 arrives now. What happens to it?`,
    opts:[
      "It is dropped, because it is more than 15 minutes behind the current wall-clock time",
      "It is counted in the 10:20 to 10:30 window, which is still open because the watermark (10:42 minus 15 minutes, so 10:27) has not passed that window's end",
      "It is counted in the 10:20 to 10:30 window, which was already emitted, so append mode writes a corrected row",
      "It is dropped, because any event older than the latest event time seen is late"
    ],
    correct:1,
    explain:`The watermark is the latest event time seen minus the threshold, 10:42 minus 15 minutes, so 10:27, and a window is final only once the watermark passes its end. The 10:20 to 10:30 window ends at 10:30, so it is still open and the scan is counted, while the 10:10 to 10:20 window is already final. Option C is the tempting one, but append mode emits each window once, after it closes, and never rewrites it; watermarks are measured in event time, not wall-clock time.`
  },

  /* Ch 36 - Streaming deduplication */
  {
    ref:{chapter:36},
    q:`An ad server's collector delivers at least once, so some impression events arrive twice as exact replicas: same <code>impression_id</code>, same <code>event_ts</code>, usually within a few minutes. New impression IDs arrive without end, billions a day. Which deduplication removes the replicas while keeping the state bounded?`,
    opts:[
      "<code>imps.dropDuplicates([\"impression_id\"])</code> with no watermark",
      "<code>imps.withWatermark(\"event_ts\", \"10 minutes\").dropDuplicates([\"impression_id\"])</code>",
      "<code>imps.distinct()</code>, because replicas match on every column",
      "<code>imps.withWatermark(\"event_ts\", \"10 minutes\").dropDuplicates([\"impression_id\", \"event_ts\"])</code>"
    ],
    correct:3,
    explain:`For exact replicas over an unbounded key space, the pattern is a watermark plus <code>dropDuplicates</code> on the id and the event-time column: because the event time is part of the key, Spark can drop a key's state once the watermark passes it, so state stays bounded. Option B is the tempting one because it declares a watermark, but the event-time column is not in the subset, so Spark cannot tell when a key is safe to forget and keeps every impression id in state. Plain <code>dropDuplicates</code> with no watermark and <code>distinct()</code> also keep every key forever, which is only acceptable for a small, fixed key set.`

  },

  /* Ch 38 - Deployment modes: local, client, cluster */
  {
    ref:{chapter:38},
    q:`A data engineer working from home over a VPN submits a production job to a YARN cluster in a distant region, in client mode. The job is slow, and most of the lost time is network latency between the driver and the executors. What should change?`,
    opts:[
      "Request twice as many executors, so more work runs in parallel",
      "Submit with --deploy-mode cluster, so YARN runs the driver on a cluster node next to its executors",

  },

  {

    q:`An analyst converts a large Spark DataFrame of ambulance dispatches with <code>pandas_api()</code>; it has no natural key column to use as the index. Row labels only need to be unique, and gaps in the numbering do not matter. Which setting gives the cheapest default index?`,

      "Leave compute.default_index_type at its default, distributed-sequence, which is already the cheapest",

    ],

    opts:[

      "Raising spark.sql.execution.arrow.maxRecordsPerBatch would split the hub depot into smaller batches and fix it",

    ],
    correct:2,
    explain:`applyInPandas hands the function each group as one complete pandas DataFrame, so every row of the hub depot is loaded into memory at once, and maxRecordsPerBatch, which caps Arrow batches for column UDFs, is not applied to groups. Raising or lowering the batch size is the tempting fix, but it never splits a group. Groups are not truncated, and applyInPandas runs on the executors' Python workers, not on the driver; the real fix is the skew itself, for example a finer grouping key.`

/* =====================================================================

===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
