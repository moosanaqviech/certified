<style>
  /* =====================================================================
     EXAM SHELL - frozen. Do not edit anything in this style block.
     All per-exam customization lives in the EXAM PAYLOAD script section.
  ===================================================================== */
  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;
    --ink-soft:#a7a59f; --ink-faint:#6b6a66; --gold:#e3b84a; --green:#34d3a6; --red:#e8625c;
    --line:rgba(255,255,255,0.08);
    --display:"Fraunces",Georgia,serif; --body:"Hanken Grotesk",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:radial-gradient(1100px 650px at 50% -8%,#1a1d29 0%,transparent 58%),var(--bg);font-family:var(--body);color:var(--ink);min-height:100vh;line-height:1.5;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* sticky top */
  .top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .timer.warn{color:var(--gold);}
  .timer svg{opacity:.7;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  /* intro */
  .intro{text-align:center;margin:auto 0;padding:30px 0;}
  .intro .badge{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px;}
  .intro h1{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.05;letter-spacing:-0.02em;margin-bottom:16px;}
  .intro p{color:var(--ink-soft);font-size:15.5px;max-width:30em;margin:0 auto 14px;}
  .facts{display:flex;justify-content:center;gap:0;margin:24px 0 28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .fact{flex:1;padding:16px 10px;}
  .fact+.fact{border-left:1px solid var(--line);}
  .fact b{display:block;font-family:var(--display);font-size:22px;font-weight:600;color:var(--gold);}
  .fact span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#14110c;font-weight:700;font-size:16px;padding:15px 30px;border-radius:14px;border:none;cursor:pointer;transition:transform .15s ease;font-family:var(--body);}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.35;pointer-events:none;}

  /* question */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .qnum{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:0.04em;}
  .flag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-faint);background:transparent;border:1px solid var(--line);border-radius:100px;padding:5px 12px;cursor:pointer;transition:.15s;font-family:var(--body);}
  .flag.on{color:var(--gold);border-color:var(--gold);background:rgba(227,184,74,0.1);}
  .qtext{font-size:18px;line-height:1.5;font-weight:500;margin-bottom:20px;}
  .qtext code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:5px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);line-height:1.4;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:rgba(255,255,255,0.2);}
  .opt.sel{border-color:var(--gold);background:rgba(227,184,74,0.08);}
  .opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .opt.sel .key{background:var(--gold);color:#14110c;}

  /* review states */
  .opt.correct{border-color:var(--green);background:rgba(52,211,166,0.1);}
  .opt.correct .key{background:var(--green);color:#072018;}
  .opt.incorrect{border-color:var(--red);background:rgba(232,98,92,0.1);}
  .opt.incorrect .key{background:var(--red);color:#2a0a08;}
  .explain{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .explain b{color:var(--ink);}

  /* nav dots */
  .nav-dots{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 4px;justify-content:center;}
  .dot{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-faint);cursor:pointer;transition:.15s;font-family:var(--body);}
  .dot.answered{background:var(--surface-2);color:var(--ink);border-color:rgba(255,255,255,0.18);}
  .dot.current{border-color:var(--gold);color:var(--gold);}
  .dot.flagged{box-shadow:inset 0 0 0 2px rgba(227,184,74,0.5);}

  /* footer nav */
  .foot{display:flex;gap:12px;margin-top:24px;}
  .foot .btn{flex:1;}

  /* results */
  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:140px;height:140px;margin:6px auto 18px;}
  .scorering svg{transform:rotate(-90deg);}
  .scorering .tr{stroke:rgba(255,255,255,0.1);}
  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scorering .ctr b{font-family:var(--display);font-size:38px;font-weight:600;line-height:1;}
  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .verdict{font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:6px;}
  .verdict.pass{color:var(--green);}
  .verdict.fail{color:var(--gold);}
  .res p{color:var(--ink-soft);font-size:14.5px;max-width:28em;margin:0 auto 22px;}
  .res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}
</style>

<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Final Exam: Units 1-7",
  badge: "Databricks DE Associate",
  blurb: "The full-course final mock. Fifty cumulative, scenario-based questions across every unit, in the style of the real certification. Pick the single best answer.",
  coverage: "Covers chapters 1-35: Units 1-7 (Platform, Ingestion, Transformation, Lakeflow Jobs, CI/CD, Monitoring & Optimization, Governance & Security).",
  minutes: 100,
  pass: 70
};

const QUESTIONS = [

  /* ============ UNIT 1 - THE DATABRICKS PLATFORM ============ */

  /* Ch 1 - The Lakehouse */
  {
    q:`A retailer maintains a data warehouse for finance dashboards and a data lake for the data-science team, paying to store overlapping data in both and constantly reconciling them. Which architecture eliminates the duplication while serving both teams?`,
    opts:[
      "Spin up a third system to copy data between the warehouse and lake",
      "A lakehouse, which adds warehouse features like ACID and governance on top of open lake storage",
      "Migrate everything into the warehouse and delete the lake",
      "Keep both and reconcile them with a nightly batch job"
    ],
    correct:1,
    explain:`A lakehouse unifies warehouse reliability and governance with the openness and low cost of lake storage on a single copy of data, serving BI and ML together. The nightly reconciliation is the sync pain the team already has, so it doesn't remove the duplication.`
  },

  /* Ch 2 - Delta Lake essentials */
  {
    q:`A streaming job writes to a plain Parquet directory, and a concurrent reader occasionally reads half-written files and returns corrupt results. What change guarantees readers only see complete data?`,
    opts:[
      "Switch the output to Delta tables, whose transaction log commits each write atomically",
      "Add more retries around the write",
      "Compress the Parquet files",
      "Have readers sleep a few seconds before reading"
    ],
    correct:0,
    explain:`Delta's transaction log makes writes atomic and gives readers snapshot isolation, so partial files are never visible. Retries or sleeps don't change the fact that a plain Parquet reader can still observe an in-progress write.`
  },

  /* Ch 2 - Delta time travel */
  {
    q:`A nightly job accidentally overwrote a Delta table with empty data three hours ago. What is the quickest way to recover the previous contents?`,
    opts:[
      "Rebuild the table by reprocessing all upstream sources",
      "Use time travel: query or RESTORE the table to the version before the overwrite",
      "Open a support ticket to recover deleted cloud files",
      "Nothing can be done; overwrites are permanent in Delta"
    ],
    correct:1,
    explain:`Delta retains earlier versions in its log, so RESTORE or VERSION AS OF brings back the pre-overwrite state immediately. Claiming overwrites are permanent misunderstands Delta, which writes a new version while old files persist until VACUUM.`
  },

  /* Ch 3 - Unity Catalog hierarchy */
  {
    q:`Which fully qualified name correctly reflects the Unity Catalog hierarchy?`,
    opts:[
      "schema.catalog.table",
      "catalog.table.schema",
      "catalog.schema.table",
      "table.schema.catalog"
    ],
    correct:2,
    explain:`Unity Catalog uses a three-level namespace of catalog, then schema, then table, giving catalog.schema.table. The other orderings rearrange those levels incorrectly.`
  },

  /* Ch 3 - Unity Catalog governance */
  {
    q:`An enterprise with multiple workspaces wants lineage, audit, and a single consistent permission model across all of them. What achieves this?`,
    opts:[
      "Maintain duplicate ACLs independently in each workspace",
      "Attach all workspaces to one account-level Unity Catalog metastore",
      "Use cloud storage bucket policies instead of a catalog",
      "Give every workspace its own metastore and sync nightly"
    ],
    correct:1,
    explain:`Unity Catalog operates at the account level, so a single shared metastore governs all attached workspaces with one grant model plus built-in lineage and audit. Per-workspace ACLs or separate metastores reintroduce the drift UC is designed to remove.`
  },

  /* Ch 4 - Compute and cost */
  {
    q:`A scheduled ETL pipeline runs on an interactive all-purpose cluster that stays on 24/7, and finance flags the cost. What reduces spend without hurting the job?`,
    opts:[
      "Keep it always on but disable auto-termination",
      "Move it to a job cluster that starts for each run and terminates after, billed at the Jobs rate",
      "Run it on a larger all-purpose cluster so it finishes faster",
      "Convert it to a manually triggered notebook"
    ],
    correct:1,
    explain:`Job clusters are ephemeral, start only for the scheduled run, and bill at the lower Jobs rate, which suits automated ETL. An always-on all-purpose cluster is for interactive use and costs more while idle.`
  },

  /* ============ UNIT 2 - DATA INGESTION AND LOADING ============ */

  /* Ch 5 - Ingestion patterns */
  {
    q:`Files arrive in cloud storage continuously, and the team needs each one processed shortly after arrival, exactly once, without reprocessing old files. Which pattern fits?`,
    opts:[
      "A one-time historical bulk load",
      "Incremental ingestion that tracks processed files and handles only new ones",
      "An hourly full reload of the directory",
      "Manual uploads through the UI"
    ],
    correct:1,
    explain:`Incremental ingestion processes only newly arrived data and remembers what it has handled, matching the once-each, low-latency need. A full hourly reload reprocesses every file each run, duplicating work.`
  },

  /* Ch 6 - COPY INTO */
  {
    q:`A COPY INTO command failed after loading some files. The engineer reruns the exact command. What is the outcome regarding already-loaded files?`,
    opts:[
      "They are loaded again, creating duplicates",
      "COPY INTO skips files it already loaded, so the rerun is idempotent",
      "The target table is truncated first",
      "The command errors out and refuses to run twice"
    ],
    correct:1,
    explain:`COPY INTO records which files it has loaded and skips them on rerun, making it idempotent and safe to retry. The assumption that it always re-appends duplicates is the misconception this tracking prevents.`
  },

  /* Ch 7 - Auto Loader rescued data */
  {
    q:`An Auto Loader JSON stream occasionally receives records with fields that don't match the inferred schema. The team wants those values captured, not lost or fatal. What handles this?`,
    opts:[
      "Disable schema inference",
      "Auto Loader places non-matching data in the _rescued_data column and keeps running",
      "Reject any file containing unexpected fields",
      "Cast all columns to string"
    ],
    correct:1,
    explain:`Auto Loader routes data that doesn't fit the inferred schema into _rescued_data so nothing is silently dropped and the stream continues. Disabling inference throws away the data-quality guarantees the rescued column provides.`
  },

  /* Ch 7 - Auto Loader schema evolution */
  {
    q:`With schema evolution enabled, an upstream source adds a new field mid-stream. What does Auto Loader do?`,
    opts:[
      "Permanently fails until an ALTER TABLE is run by hand",
      "Adds the new column and resumes, often after one automatic restart",
      "Silently drops the new field",
      "Requires recreating the target table"
    ],
    correct:1,
    explain:`Schema evolution lets Auto Loader detect the new field, add the column, and continue, usually after a single automatic restart. Silent dropping is what the rescued path avoids, not what evolution does.`
  },

  /* Ch 8 - Auto Loader vs COPY INTO */
  {
    q:`Millions of small files land continuously in cloud storage and must be ingested with low latency at scale. Which tool fits?`,
    opts:[
      "COPY INTO scheduled every few minutes",
      "Auto Loader, built to discover and process new files incrementally at high volume",
      "A nightly full batch load",
      "Manual COPY INTO with a hand-kept file list"
    ],
    correct:1,
    explain:`Continuous, high-volume, low-latency file arrival is the signature use case for Auto Loader, which scales to discover new files incrementally. COPY INTO suits bounded, periodic loads and struggles at this volume and cadence.`
  },

  /* Ch 9 - Lakeflow Connect */
  {
    q:`A team must regularly ingest data from Salesforce and a PostgreSQL database without building or maintaining custom extraction code. What is the intended tool?`,
    opts:[
      "Auto Loader pointed at the database",
      "A Lakeflow Connect managed connector for the SaaS or database source",
      "A hand-written JDBC notebook",
      "Manual CSV exports loaded with COPY INTO"
    ],
    correct:1,
    explain:`Lakeflow Connect offers managed connectors to applications and databases, removing the need to build custom pipelines. Auto Loader reads files from cloud storage and cannot connect directly to a source like Salesforce.`
  },

  /* Ch 10 - Choosing ingestion */
  {
    q:`Which signal-to-method pairing for ingestion is correct?`,
    opts:[
      "Continuous high-volume file arrival → COPY INTO",
      "A bounded one-time SQL file load → Auto Loader",
      "Ingesting from a SaaS app like Salesforce → Lakeflow Connect connector",
      "A small weekly fixed-file load → Structured Streaming"
    ],
    correct:2,
    explain:`SaaS and operational sources map to Lakeflow Connect, continuous file arrival to Auto Loader, and bounded periodic loads to COPY INTO. The other options attach the file-based tools to the wrong signals.`
  },

  /* ============ UNIT 3 - DATA TRANSFORMATION AND MODELING ============ */

  /* Ch 11 - Medallion */
  {
    q:`In the medallion architecture, raw ingested data with nulls and bad types should be cleaned at which point?`,
    opts:[
      "Before it lands in Bronze",
      "Only in Gold, just before dashboards",
      "When promoting Bronze to Silver, leaving Bronze as the raw record",
      "Never; Bronze and Silver should be identical"
    ],
    correct:2,
    explain:`Bronze preserves the raw ingested data as an audit copy, and cleaning, typing, and validation happen on the way to Silver. Cleaning before Bronze would destroy the untouched raw history Bronze exists to keep.`
  },

  /* Ch 12 - Joins (semantics) */
  {
    q:`A report must keep every row from the left table and fill in nulls where the right table has no match. Which join is this?`,
    opts:[
      "Inner join",
      "Left outer join",
      "Right outer join",
      "Cross join"
    ],
    correct:1,
    explain:`A left outer join preserves all left-side rows and nulls the unmatched right-side columns. An inner join would drop left rows with no match, losing rows the report requires.`
  },

  /* Ch 12 - Broadcast join */
  {
    q:`A join between a huge fact table and a small lookup table is slow due to a large shuffle of the fact table. What removes the shuffle?`,
    opts:[
      "Increase shuffle partitions",
      "Broadcast the small table so each executor joins locally without shuffling the large one",
      "Sort both inputs first",
      "Replace it with a cross join and filter"
    ],
    correct:1,
    explain:`Broadcasting the small table sends it to every executor so the large fact table need not be shuffled. Raising shuffle partitions only resizes the shuffle that broadcasting avoids entirely.`
  },

  /* Ch 13 - Column/row manipulation */
  {
    q:`A transformation needs to add a computed column and drop rows that fail a validation rule. Which combination is correct?`,
    opts:[
      "withColumn (or SELECT expression) to add the column, and filter / WHERE to drop bad rows",
      "withColumnRenamed to compute the new column",
      "A join to compute the column",
      "VACUUM to remove the bad rows"
    ],
    correct:0,
    explain:`withColumn or an equivalent SELECT expression derives the column, and filter/WHERE removes rows failing the rule. withColumnRenamed only renames a column, and VACUUM cleans old files, not rows.`
  },

  /* Ch 14 - Deduplication */
  {
    q:`A feed delivers occasional duplicate records and the team needs one row per key, keeping the latest by timestamp. What is the standard approach?`,
    opts:[
      "Rank rows per key by timestamp with a window (ROW_NUMBER) and keep rank 1",
      "GROUP BY all columns with COUNT",
      "Self-join to compare all rows",
      "It cannot be done in Spark"
    ],
    correct:0,
    explain:`Ranking rows within each key by recency and keeping the top rank returns the single latest full record per key. Grouping and counting summarizes occurrences but doesn't return the chosen record.`
  },

  /* Ch 15 - Spark tuning */
  {
    q:`One task in a stage runs far longer than all the others, which finish quickly. What is the likely cause and a fitting fix?`,
    opts:[
      "Executor memory too high; reduce it",
      "Data skew; use AQE skew handling or salt the hot key",
      "Too many columns; drop some",
      "Checkpointing disabled; enable it"
    ],
    correct:1,
    explain:`A lone long-running straggler task is the classic symptom of data skew, addressed by AQE skew handling or salting the skewed key. Reducing executor memory doesn't fix an uneven data distribution.`
  },

  /* Ch 16 - Gold-layer objects */
  {
    q:`A Gold object must stay current as base tables change but refresh only the changed data automatically, without full ETL reruns. Which object fits?`,
    opts:[
      "A standard view that recomputes fully each read",
      "A materialized view, precomputed and incrementally refreshed",
      "A temporary view",
      "A manually refreshed plain table"
    ],
    correct:1,
    explain:`A materialized view stores precomputed results and refreshes incrementally as base data changes, staying current without a full rebuild. A standard view stores nothing and recomputes on every read.`
  },

  /* Ch 17 - Data quality */
  {
    q:`A pipeline must guarantee a key column is never null and block violating rows at write time. What enforces this?`,
    opts:[
      "A comment documenting the rule",
      "A data quality expectation or enforced constraint that drops or fails violating rows",
      "A dashboard alert after the data lands",
      "A weekly manual review"
    ],
    correct:1,
    explain:`Expectations or enforced constraints apply the rule as data is written and can drop or fail violating rows before they enter the table. A dashboard alert only flags problems after bad data has already landed.`
  },

  /* ============ UNIT 4 - LAKEFLOW JOBS ============ */

  /* Ch 18 - DAG */
  {
    q:`In a Lakeflow Job, Task D must run only after Tasks B and C both succeed. How is this modeled?`,
    opts:[
      "Three separate jobs timed to line up",
      "Task dependencies listing B and C as upstream of D, forming a DAG",
      "A separate cron schedule per task",
      "One combined task containing all logic"
    ],
    correct:1,
    explain:`Tasks declare upstream dependencies and Lakeflow builds a DAG, so D waits for both B and C to succeed. Timing separate jobs is fragile and creates no real dependency.`
  },

  /* Ch 19 - Retries */
  {
    q:`A task fails intermittently from transient network errors and should recover on its own. What handles this best?`,
    opts:[
      "A task-level retry policy that re-attempts on transient failure",
      "A daily manual rerun by an engineer",
      "A bigger cluster",
      "Removing the task"
    ],
    correct:0,
    explain:`A task retry policy automatically re-attempts on transient failures with no human involvement. A manual rerun defeats automation and delays recovery.`
  },

  /* Ch 19 - Conditional */
  {
    q:`A task should run only when an upstream check returns true and be skipped otherwise. What implements this?`,
    opts:[
      "Conditional execution (an If/else condition task) that branches on the result",
      "Always run both tasks and ignore failures",
      "Retries to skip the task",
      "Deleting the downstream task"
    ],
    correct:0,
    explain:`A conditional or If/else task branches the DAG on a value, running the downstream task only when the condition holds. Retries re-run failed tasks and have nothing to do with conditional logic.`
  },

  /* Ch 20 - Trigger types */
  {
    q:`A job should start automatically when new files land in a storage path, not on a fixed clock. Which trigger fits?`,
    opts:[
      "A one-minute cron schedule",
      "A file arrival trigger",
      "A manual trigger",
      "An always-on polling loop"
    ],
    correct:1,
    explain:`A file arrival trigger fires on the event of new files landing, starting the job only when there's work. A one-minute cron wastes most runs and still adds latency versus event-driven firing.`
  },

  /* Ch 21 - Time vs data-driven */
  {
    q:`A report must be ready by a fixed time each morning regardless of when source data arrives. Which trigger best meets this?`,
    opts:[
      "A file arrival trigger keyed to the source",
      "A time-based (scheduled) trigger at the required time",
      "A manual trigger",
      "A continuous trigger"
    ],
    correct:1,
    explain:`A fixed daily deadline is a predictable cadence, which a time-based schedule guarantees. A file arrival trigger fires on data events, so readiness would drift with unpredictable arrival times.`
  },

  /* Ch 21 - Time vs data-driven (reverse) */
  {
    q:`Which trigger pairing is correct?`,
    opts:[
      "Irregular, event-driven file arrival → fixed cron schedule",
      "Predictable daily run → time-based schedule",
      "Strict 6am SLA → file arrival trigger",
      "Sporadic file drops → manual trigger"
    ],
    correct:1,
    explain:`A predictable cadence maps to a time-based schedule; irregular event-driven arrival maps to a data-driven file arrival trigger. The other options pair each signal with the wrong trigger.`
  },

  /* ============ UNIT 5 - CI/CD ============ */

  /* Ch 22 - Git Folders */
  {
    q:`A team needs branches, commits, and pull-request review for notebooks developed in the workspace. What provides this?`,
    opts:[
      "Git Folders connecting the workspace to a Git repo for branch/commit/PR work",
      "Exporting notebooks and emailing them",
      "Delta time travel on the notebooks",
      "Folders named v1, v2, v3"
    ],
    correct:0,
    explain:`Git Folders link the workspace to a Git repository so the team can branch, commit, and open pull requests. Delta time travel versions table data, not source code, so it can't provide branches or PR review.`
  },

  /* Ch 22 - PR workflow */
  {
    q:`A developer finished a feature on a branch in a Git Folder. What is the safe path to main?`,
    opts:[
      "Force-push the branch onto main",
      "Push the branch and open a pull request for review before merging",
      "Run it in prod first, then commit",
      "Overwrite main from the workspace UI"
    ],
    correct:1,
    explain:`Pushing the branch and opening a pull request adds review before merging into main. Force-pushing straight to main skips review and risks breaking shared code.`
  },

  /* Ch 23 - Asset Bundles */
  {
    q:`A team wants jobs, pipelines, and code packaged as version-controlled, repeatably deployable definitions. What tool does this?`,
    opts:[
      "Clicking each job into the UI per environment",
      "Databricks Asset Bundles, declaring code and resources as code and deploying together",
      "Storing job JSON on a wiki",
      "Git Folders alone, which version only notebooks"
    ],
    correct:1,
    explain:`Asset Bundles package code with resource definitions like jobs and pipelines so a project deploys as one versioned unit. Git Folders alone version notebooks but not the surrounding jobs and pipelines.`
  },

  /* Ch 24 - Promotion */
  {
    q:`Code and resources must move reliably from dev to test to prod. What is the recommended model?`,
    opts:[
      "Develop in prod and back-port to dev",
      "Promote one versioned bundle through dev, test, then prod targets from a single source of truth",
      "Recreate jobs by hand in each environment",
      "Copy and paste notebooks between workspaces"
    ],
    correct:1,
    explain:`Promoting one versioned bundle across targets keeps every environment built from the same source of truth, which makes promotion reliable. Recreating jobs by hand per environment invites drift and error.`
  },

  /* Ch 25 - CLI */
  {
    q:`A team wants to script job runs, file uploads, and bundle deploys from a terminal and in CI. What enables this?`,
    opts:[
      "Only the web UI can do these",
      "The Databricks CLI, which wraps the REST API into scriptable commands including bundle deploy",
      "Delta time travel",
      "Hand-written REST calls per action"
    ],
    correct:1,
    explain:`The Databricks CLI wraps the REST API into scriptable commands, making jobs, files, and bundle deploys automatable from a terminal or CI. Hand-writing REST calls is the tedious work the CLI replaces.`
  },

  /* Ch 25 - CLI profiles */
  {
    q:`A CI pipeline must target several workspaces from one machine with the Databricks CLI. What is the clean approach?`,
    opts:[
      "Hardcode a token in each script",
      "Use connection profiles (and bundle targets) to select the right workspace per command",
      "Reinstall the CLI per workspace",
      "Accept that the CLI targets only one workspace"
    ],
    correct:1,
    explain:`Connection profiles, with bundle targets, let one CLI installation address multiple workspaces by choosing the right configuration per command. Hardcoding tokens is insecure and unmanageable across environments.`
  },

  /* ============ UNIT 6 - MONITORING, OPTIMIZATION & TROUBLESHOOTING ============ */

  /* Ch 26 - Job health */
  {
    q:`A multi-task job run shows as failed. Where do you look first to find which task failed and why?`,
    opts:[
      "The billing console",
      "The Lakeflow Jobs UI run detail, with per-task status and links to each task's logs",
      "The Git Folder commit history",
      "The catalog's lineage graph"
    ],
    correct:1,
    explain:`The Jobs UI run detail breaks a run into tasks, showing which one failed and linking to its logs and error output. Billing and Git history say nothing about which task failed or why.`
  },

  /* Ch 27 - Spark UI skew */
  {
    q:`In a stage, most tasks finish in seconds but one runs for many minutes. What does the Spark UI pattern indicate?`,
    opts:[
      "Data skew - one partition got far more data than the rest",
      "A failed job needing restart",
      "Healthy parallelism",
      "A driver out-of-memory error"
    ],
    correct:0,
    explain:`A single straggler task with a duration far above the median is the signature of skew, where one partition got a disproportionate share of data and the stage waits for it. It is a slowness pattern, not a failure or healthy balance.`
  },

  /* Ch 27 - Spark UI spill */
  {
    q:`A stage shows large Spill (memory) and Spill (disk) values. What's happening and what does it mean?`,
    opts:[
      "The job already failed",
      "Task data exceeded memory and spilled to slow disk, hurting performance",
      "The cluster has idle, unused memory",
      "Shuffle has been eliminated"
    ],
    correct:1,
    explain:`Spill means a task's data didn't fit in memory and Spark wrote it to disk, which is much slower, so tasks are memory-starved and slow. Spill is a performance symptom, not a sign of idle memory or a finished job.`
  },

  /* Ch 28 - Liquid Clustering */
  {
    q:`A team repeatedly picks poor PARTITION BY columns, creating tiny files and skew, and wants better data skipping with less manual tuning. What should they use?`,
    opts:[
      "Add more partition columns",
      "Liquid Clustering with CLUSTER BY, replacing partitioning and Z-ordering",
      "Manually shrink target file size",
      "Drop clustering and rely on full scans"
    ],
    correct:1,
    explain:`Liquid Clustering (CLUSTER BY) replaces partitioning and Z-ordering, avoids the small-file and skew traps of bad partition columns, and lets clustering keys change later without a rewrite. More partition columns usually worsen the small-file problem.`
  },

  /* Ch 28 - Predictive Optimization */
  {
    q:`A team is tired of scheduling OPTIMIZE and VACUUM on their Unity Catalog managed tables. What removes that manual work?`,
    opts:[
      "Predictive Optimization, which runs OPTIMIZE, clustering, and VACUUM automatically when beneficial",
      "Scheduled Delta time travel",
      "An always-on cluster polling for maintenance",
      "Converting the tables to views"
    ],
    correct:0,
    explain:`Predictive Optimization automatically runs maintenance like OPTIMIZE, clustering, and VACUUM on managed tables when it helps, removing manual schedules. Time travel and views do not perform table maintenance.`
  },

  /* Ch 29 - Cluster failures */
  {
    q:`A job calls <code>collect()</code> on a billion-row DataFrame and dies with OutOfMemoryError on the driver. What's the right fix?`,
    opts:[
      "Add more executors",
      "Stop collecting all data to the driver; write results out with Spark instead",
      "Switch workers to spot instances",
      "Disable the Spark UI"
    ],
    correct:1,
    explain:`A driver OOM comes from pulling too much to one node, so the fix is to avoid collect()/toPandas() and let Spark write results distributed. More executors don't help because the bottleneck is the single driver.`
  },

  /* Ch 30 - Trends and baselines */
  {
    q:`A daily job's runtime jumps from 10 to 40 minutes the day after a deploy and stays at 40. Most likely cause?`,
    opts:[
      "Gradual organic data growth",
      "A specific change from the deploy, such as new code or config",
      "Random noise to ignore",
      "The baseline was set too low"
    ],
    correct:1,
    explain:`A sudden step aligned with a deployment points to a specific code or config change, not slow organic growth (which creeps) or noise (which wouldn't hold). Investigate what shipped in that release.`
  },

  /* ============ UNIT 7 - GOVERNANCE & SECURITY ============ */

  /* Ch 31 - Managed vs external (drop) */
  {
    q:`A team runs <code>DROP TABLE</code> on an external table in Unity Catalog. What happens to the underlying data files?`,
    opts:[
      "They are permanently deleted",
      "They remain in the team's cloud storage; only the metadata is removed",
      "They are moved into UC's managed storage location",
      "They are archived to a recycle bin for 30 days"
    ],
    correct:1,
    explain:`For an external table, Unity Catalog owns only the metadata pointer, so dropping it removes that pointer while the files stay in your own cloud storage. Deleting the files is the managed-table behaviour, not external.`
  },

  /* Ch 31 - Managed vs external (choose) */
  {
    q:`A team wants the simplest setup where Databricks owns the storage location and handles layout and optimization automatically. Which table type?`,
    opts:[
      "Managed table",
      "External table",
      "A raw Parquet directory",
      "A temporary view"
    ],
    correct:0,
    explain:`Managed tables let Unity Catalog own both metadata and data files and handle optimization, making them the simplest default. External tables are for when data must live in a specific location or be shared outside Databricks.`
  },

  /* Ch 32 - Converting (SET MANAGED) */
  {
    q:`A team runs <code>ALTER TABLE t SET MANAGED</code> on an external Delta table. What is the main effect?`,
    opts:[
      "It deletes the table's data",
      "The table becomes managed, with Unity Catalog taking ownership and upkeep of the files",
      "It only renames the table",
      "It converts the table to a view"
    ],
    correct:1,
    explain:`SET MANAGED upgrades an external Delta table to a managed one, so Unity Catalog owns the data and runs maintenance like Predictive Optimization. It does not delete data or merely rename the table.`
  },

  /* Ch 32 - Converting (lifecycle catch) */
  {
    q:`After converting an external table to managed, how does <code>DROP TABLE</code> behave compared with before?`,
    opts:[
      "It now also deletes the underlying data files",
      "Nothing changes; the files always survive a drop",
      "DROP TABLE is no longer permitted",
      "It archives the table instead of dropping it"
    ],
    correct:0,
    explain:`Managed tables tie the data lifecycle to the table, so after conversion a drop deletes the files too - the opposite of the external behaviour. That is why you verify the table and permissions before converting.`
  },

  /* Ch 33 - Access control (USE traversal) */
  {
    q:`A user has been granted SELECT on a table but still cannot read it. What is the most likely missing privilege?`,
    opts:[
      "MODIFY on the table",
      "USE CATALOG and USE SCHEMA on the parent catalog and schema",
      "Ownership of the metastore",
      "ALL PRIVILEGES on the workspace"
    ],
    correct:1,
    explain:`To reach a table you must be able to traverse to it: USE CATALOG and USE SCHEMA on its parents plus SELECT on the table. A SELECT grant alone, without USE on the parents, is not enough.`
  },

  /* Ch 33 - Access control (DENY precedence) */
  {
    q:`A principal is in a group granted SELECT on a table but also has an explicit DENY on that table. What is the result?`,
    opts:[
      "The grant wins; they can read it",
      "The deny wins; access is blocked",
      "Access becomes read-only for everyone",
      "The two cancel out and nothing applies"
    ],
    correct:1,
    explain:`DENY takes precedence over any grant, so an explicit deny blocks access even when the principal is otherwise granted the privilege through a group. Revoking removes a grant; denying overrides one.`
  },

  /* Ch 34 - Column masking */
  {
    q:`Analysts may use the customers table but must see SSNs only in masked form. What do you apply?`,
    opts:[
      "A column mask on the ssn column",
      "A REVOKE on the whole table",
      "A row filter on the table",
      "A DENY on the catalog"
    ],
    correct:0,
    explain:`A column mask redacts a specific column's value per user while leaving the rest of the row visible. Revoking removes all access and a row filter hides rows - neither matches masking a single column.`
  },

  /* Ch 34 - Row-level security */
  {
    q:`Each regional manager should query one orders table but see only their own region's rows. What enforces this?`,
    opts:[
      "A column mask on the region column",
      "A row filter (row-level security) keyed to the user's region",
      "A separate copy of the table per manager",
      "A DENY on the table"
    ],
    correct:1,
    explain:`Row-level security uses a row filter to restrict which rows return based on the caller's identity or group, so each manager sees only their region. Copying the table per manager defeats single-source governance.`
  },

  /* Ch 35 - ABAC (idea) */
  {
    q:`What distinguishes Attribute-Based Access Control (ABAC) from granting permissions on each object individually?`,
    opts:[
      "It encrypts every tagged column at rest",
      "Policies act on attributes (tags), so one rule governs every object carrying that tag",
      "It eliminates the need for Unity Catalog",
      "It applies only to external tables"
    ],
    correct:1,
    explain:`ABAC governs by attribute or tag rather than by individual object, so a single policy applies across all tagged data. That is what lets it scale where per-object grants don't.`
  },

  /* Ch 35 - ABAC (automatic coverage) */
  {
    q:`An ABAC policy masks anything tagged PII. A new table is later created with a column tagged PII. What happens to that column?`,
    opts:[
      "It is masked automatically, with no per-table setup",
      "Nothing, until someone manually adds a mask",
      "The table is blocked from creation",
      "Only existing tables are affected, never new ones"
    ],
    correct:0,
    explain:`Because the policy matches the PII tag, any object carrying that tag - including newly created ones - is covered automatically. That automatic, consistent coverage of current and future objects is the whole point of ABAC.`
  }
];

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

let state = { screen:"intro", i:0, answers:Array(QUESTIONS.length).fill(null), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a!==null).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i]===j?'sel':''}" data-j="${j}">
          <span class="key">${"ABCD"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j]!==null) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{ state.answers[i] = Number(el.dataset.j); render(); setProgress(); };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a===null).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(state.answers[idx]===Q.correct) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], ok=mine===Q.correct;
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(j===Q.correct) cls+=" correct";
          else if(j===mine) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCD"[j]}</span><span>${o}${j===mine?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:Array(QUESTIONS.length).fill(null), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
