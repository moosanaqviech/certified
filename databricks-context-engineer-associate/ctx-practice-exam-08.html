<script>
/* =====================================================================

   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.

/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Practice Exam 8",
  badge: "Databricks Context Engineer Associate",
  blurb: "Full-length mock. Exam-style, scenario-based questions across all seven sections. Most questions have one best answer; a few ask you to select two. Databricks publishes no official passing score; 70% is our practice target.",
  coverage: "Full-length mock exam: 45 questions in 90 minutes across all seven sections, weighted like the real exam.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

  /* Q1 - Ch 1 */
  { ref:{chapter:1}, q:`Larkspur Mutual's catastrophe-response agent answers adjuster questions about storm procedures. A trace of one turn shows about 2,000 tokens of system prompt, 3,000 tokens for five tools (all used regularly), 4,000 tokens of history, and 31,000 tokens of retrieved context: twelve full field manuals, though answers quote a single paragraph. Answers have started citing the wrong procedure. Which change most improves the agent's focus?`,
    opts:[
      "Retrieve the relevant sections instead of whole manuals",
      "Move to a model with a larger context window",
      "Remove two of the five tools to shrink fixed overhead",
      "Shorten the system prompt by half"
    ],
    correct:0,
    explain:`Retrieved manuals are by far the largest block and the answer uses almost none of it, so scoping retrieval removes the noise competing for attention. A larger window is tempting because it relieves pressure, but the window was never full; the problem is focus, not capacity.` },

  /* Q2 - Ch 2 */
  { ref:{chapter:2}, q:`Larkspur wants its claims agent to call the claims system through a Databricks managed MCP server, but only when the adjuster's identity is allowed to use that tool. Where is that permission controlled?`,
    opts:[
      "A Lakebase role attached to the agent's checkpoint database",
      "A Unity Catalog grant on the managed MCP server, which is a securable like any other",
      "An instruction in the system prompt listing which adjusters may call the tool",
      "An MLflow 3 scorer that flags unauthorized calls in traces"
    ],
    correct:1,
    explain:`Managed MCP servers are Unity Catalog securables, so who may call a tool is a grant. The scorer is tempting because it watches tool calls, but it only detects misuse after the fact; it does not prevent the call.` },

  /* Q3 - Ch 3 */
  { ref:{chapter:3}, q:`Larkspur's claims assistant retrieves both the 2025 and 2026 versions of the claims-handling manual. One says first contact must happen within 15 days, the other within 30, and the agent's answers switch between the two. What is the failure, and what fix addresses it at the source?`,
    opts:[
      "Context poisoning; validate model summaries before saving them to notes",
      "Context rot; retrieve more passages so the correct one dominates",
      "Context distraction; compact the session history",
      "Context clash; restrict retrieval to the authoritative, current manual"
    ],
    correct:3,
    explain:`Two real sources in the window disagree, which is clash, and the fix is to stop the outdated one from being injected. Poisoning is tempting because an answer is wrong, but nothing was fabricated; each figure comes from a genuine document.` },

  /* Q4 - Ch 4 */
  { ref:{chapter:4}, q:`Larkspur's finance agent has 25 tools loaded, including several marketing-analytics tools another team added. In short, fresh sessions it sometimes answers loss questions by calling a campaign-performance tool the task never needed. Which diagnosis and fix fit best?`,
    opts:[
      "Context rot; switch to a model with a later degradation point",
      "Context clash; add an instruction about which numbers to trust",
      "Context distraction; compact the history into a summary",
      "Context confusion; give the agent only the tools its finance tasks use"
    ],
    correct:3,
    explain:`Superfluous content is steering the answer in a short context, which is confusion, and removing what does not belong fixes it. Compaction is the tempting reflex for drifting agents, but these sessions are short; there is no long history to shrink.` },

  /* Q5 - Ch 5 */
  { ref:{chapter:5}, q:`A Larkspur broker spends Friday afternoon working through a complex quote with the underwriting agent, and the session goes well. On Monday the agent has no record of the coverage choices agreed on Friday. Which technique most directly addresses this?`,
    opts:[
      "Persist the agreed choices in durable memory in Lakebase and load them when a session starts",
      "Give the agent a larger context window",
      "Compact Friday's history into a high-fidelity summary",
      "Add an instruction to remember previous quotes"
    ],
    correct:0,
    explain:`The information is gone between sessions, not buried within one, so it needs durable memory. Compaction is tempting because it preserves history, but it works inside a session and cannot bring back state from a conversation that has ended.` },

  /* Q6 - Ch 6 */
  { ref:{chapter:6}, q:`Before launching a new policy-servicing agent, Larkspur's review finds that all tools from three MCP servers load on every request, the top 10 policy passages are injected on every turn, and the claim lookup returns the full 150-field record. Which TWO changes reduce context pressure proactively? Select TWO.`,
    opts:[
      "Scope the claim lookup to return only the fields the task uses",
      "Compact the history whenever usage reaches 80% of the window",
      "Move to a model with a larger context window",
      "Make retrieval a tool the agent calls only when a turn needs policy text",
      "Add an instruction telling the agent to ignore irrelevant passages"
    ],
    correct:[0,3],
    explain:`Just-in-time retrieval and scoped tool results are design-time choices that narrow what enters the window on every call. Compaction at 80% is tempting because it also manages pressure, but it is reactive relief for history that has already grown, not prevention.` },

  /* Q7 - Ch 7 */
  { ref:{chapter:7}, q:`Larkspur's support sessions run for many turns. Each turn retrieves only three passages, but history grows throughout. Evaluation shows correctness near 0.88 for requests under 30,000 input tokens and near 0.71 above 50,000, all well below the model's limit, across many customers and topics. Which intervention best restores quality?`,
    opts:[
      "Use extended thinking on every turn",
      "Retrieve more passages per turn to give the model more evidence",
      "Compact the history into a faithful summary plus recent items before it crosses the point where quality falls",
      "Switch to a model with a larger context window"
    ],
    correct:2,
    explain:`Quality tracks length below the limit, which is context rot, and here the length comes from session history, so compaction keeps it under the knee. A larger window is tempting, but degradation already happens far below the current limit.` },

  /* Q8 - Ch 9 */
  { ref:{chapter:9}, q:`Larkspur's support prompt says "Never mention other insurers." Customers who also hold a policy with another insurer now get refusals when they ask how the two policies coordinate on a shared claim. Which revision fixes this at the lowest token and maintenance cost?`,
    opts:[
      "Add fifteen example conversations showing coordination questions",
      "Restate the rule in capital letters marked CRITICAL",
      "Delete the rule entirely",
      "Narrow the rule: do not recommend or compare other insurers; explaining how a customer's other policy coordinates with ours is allowed"
    ],
    correct:3,
    explain:`The rule is wider than its purpose, so scoping it removes the over-refusal with one clause. Deleting it is cheap, which makes it tempting, but it reopens the risk the rule was added to prevent.` },

  /* Q9 - Ch 10 */
  { ref:{chapter:10}, q:`Larkspur's intake agent has room for one more few-shot example. Evaluation shows it handles single-vehicle claims correctly, calls its tools with the right arguments, and formats its output properly, but when a message describes two vehicles damaged in two separate incidents, it files a single claim. Which example adds the most?`,
    opts:[
      "An example showing the output format the agent already produces",
      "A message describing two separate incidents, resolved into two claims",
      "Another clean single-vehicle claim with a different vehicle type",
      "A claim handled in a way that breaks one of the prompt's rules, to show flexibility"
    ],
    correct:1,
    explain:`An ambiguous input resolved the intended way teaches the behavior the agent currently gets wrong. Another clean single-vehicle example is tempting because it is high quality, but the agent already passes that case, so it adds tokens without accuracy.` },

  /* Q10 - Ch 11 */
  { ref:{chapter:11}, q:`Larkspur's claims prompt v5 adds a commercial-lines glossary to v4, costing about 3,500 extra tokens per request. On the same evaluation set and scorers, correctness rises by 0.02 overall: commercial requests (12% of traffic) gain 0.15, and personal-lines requests are unchanged. What is the best decision?`,
    opts:[
      "Reject v5 entirely, since the overall gain is small",
      "Ship v5 to all traffic, since correctness went up",
      "Re-run v5 on a separate commercial-only dataset and compare it with v4's original run",
      "Keep v4 as the base and retrieve the glossary just in time for commercial requests"
    ],
    correct:3,
    explain:`The gain is concentrated in one slice, so deliver the driver only where it pays instead of in every request. Shipping v5 everywhere is tempting because the metric improved, but most requests would pay 3,500 tokens for no gain.` },

  /* Q11 - Ch 12 */
  { ref:{chapter:12}, q:`Larkspur's first draft of a claims-operations Genie space includes 22 tables, among them raw staging tables and an analyst's copy of the claims table. Answers sometimes come from the staging copy. What should change before wider sharing?`,
    opts:[
      "Narrow the space to a few curated tables or views for one domain, leaving out staging tables and copies",
      "Add a longer text instruction explaining which tables to prefer",
      "Add more sample questions so Genie learns the right tables",
      "Share it now and rely on user feedback to flag bad answers"
    ],
    correct:0,
    explain:`A focused set of curated tables is the foundation of a production-ready space, and it removes the wrong sources entirely. A longer instruction is tempting, but text instructions are interpreted, not enforced, and the confusing tables would still be there.` },

  /* Q12 - Ch 14 */
  { ref:{chapter:14}, q:`Larkspur's claims agent answers questions about current policies by querying policy_snapshot, a monthly snapshot table, instead of policies_current. Neither table has a table comment, and their column names are nearly identical. What is the highest-impact fix?`,
    opts:[
      "Move both tables into a separate schema",
      "Add an instruction to the agent's prompt: always use the latest data",
      "Add table comments in Unity Catalog stating each table's grain and purpose, and which one to use for current policies",
      "Rename every column in policy_snapshot"
    ],
    correct:2,
    explain:`The gap is missing metadata on two look-alike tables, and comments in Unity Catalog travel with the assets to every consumer. A prompt instruction is tempting as a quick fix, but "latest data" does not tell the agent which table holds it.` },

  /* Q13 - Ch 15 */
  { ref:{chapter:15}, q:`Analysts using Larkspur's claims-operations Genie space often ask variations of "show open claims for adjuster Priya Shah." Answers vary in how "open" is filtered. Which object best delivers a verified answer that still accepts the adjuster's name?`,
    opts:[
      "A parameterized query with an adjuster slot, marked as a trusted asset",
      "The raw claims table added to the space",
      "A text instruction defining open claims",
      "A Unity Catalog SQL function that hides the formula from Genie"
    ],
    correct:0,
    explain:`A parameterized query is verified logic with a slot for the user's value, and it can be a trusted asset. A UC function is tempting because it also returns verified logic, but its strength is hiding logic Genie should not see, which is not the requirement here.` },

  /* Q14 - Ch 16 */
  { ref:{chapter:16}, q:`Larkspur's agent drafts reserve-change memos for one claim at a time. Available sources: the claim record, the payment ledger, the reserving guidelines, a memo template, the adjuster's full email archive, and ten years of company-wide reserve history. Which set is necessary and sufficient?`,
    opts:[
      "The claim record and memo template only",
      "Every source, so the agent never lacks context",
      "The claim record, payment ledger, reserving guidelines and memo template",
      "The ten-year reserve history and the email archive"
    ],
    correct:2,
    explain:`The guidelines are the constraint, the record and ledger are the facts, and the template is the output specification. Including every source is tempting as the safe option, but the archive and history serve neither scoping nor execution and only add noise.` },

  /* Q15 - Ch 17 */
  { ref:{chapter:17}, q:`Larkspur's adjuster assistant gets questions like "What is claim 6120's current reserve, and does the policy's rental clause apply?" Many turns need no lookup at all. Which retrieval approach fits?`,
    opts:[
      "Just-in-time agentic retrieval: the agent queries claim data and searches wordings only when a turn needs them",
      "No retrieval; rely on the model's knowledge",
      "Pre-inference retrieval with a larger top-k to cover claim data too",
      "Pre-inference retrieval of the top 10 wording chunks on every turn"
    ],
    correct:0,
    explain:`The question needs live structured values and conditional, multi-source lookups, which is what just-in-time retrieval handles. A larger top-k is tempting, but embedding search over wordings cannot return a claim's current reserve, and it injects noise on turns that need nothing.` },

  /* Q16 - Ch 18 */
  { ref:{chapter:18}, q:`Larkspur's policy assistant must cite the wording and section it used and apply the version in force on the loss date. Its chunk table stores only chunk_id and text. Which change addresses both requirements?`,
    opts:[
      "Store document ID, section and effective dates on every chunk; filter on the loss date and inject chunks with their source",
      "Increase top-k so the right version is more likely retrieved",
      "Add a reranker to the query",
      "Add an instruction asking the model to cite its sources"
    ],
    correct:0,
    explain:`Both failures come from metadata dropped at chunking: nothing to filter on and nothing to cite. A citation instruction is tempting, but the model cannot cite a source the chunk does not carry.` },

  /* Q17 - Ch 19 */
  { ref:{chapter:19}, q:`Larkspur's claims-handling knowledge base holds articles from three teams, from one paragraph to 30 pages, with headings used inconsistently. Queries are both broad and narrow. Which chunking strategy is the best starting point?`,
    opts:[
      "Whole-document chunks",
      "Recursive splitting at roughly 512 to 1,024 tokens with 10 to 15% overlap",
      "Structural chunking by heading",
      "Fixed-size 100-token chunks with no overlap"
    ],
    correct:1,
    explain:`Recursive splitting respects natural boundaries where they exist without depending on them, which suits messy, mixed-length content. Structural chunking is tempting because the articles have headings, but inconsistent headings produce wildly uneven chunks.` },

  /* Q18 - Ch 20 */
  { ref:{chapter:20}, q:`A telematics vendor embeds each driving event and sends Larkspur's app a vector as the event happens. There is no Delta table in the path, and new events must be searchable immediately. Which AI Search index type fits, and who keeps it current?`,
    opts:[
      "A Delta Sync index built from a view over the vendor API",
      "A Delta Sync index with Databricks-managed embeddings",
      "A Delta Sync index with continuous sync",
      "A Direct Access index, with the application writing and deleting vectors"
    ],
    correct:3,
    explain:`Vectors from outside, per event, with no table in the path is the Direct Access case, and the application owns updates. Continuous Delta Sync is tempting because it is fast, but it still needs a source Delta table, which does not exist here.` },

  /* Q19 - Ch 21 */
  { ref:{chapter:21}, q:`Larkspur's wordings index is synced right after each pipeline run, and its contents are current. The right chunk is usually among the top 20 results but rarely in the top 5 that reach the prompt. Which change most directly helps?`,
    opts:[
      "Increase top-k so more chunks reach the prompt",
      "Rebuild the index as a Direct Access index",
      "Add a reranker to re-score the candidates for precision",
      "Switch the index to continuous sync"
    ],
    correct:2,
    explain:`The index is fresh and the right chunk is retrieved but ranked too low, which is exactly what reranking fixes, for a little latency. A bigger top-k is tempting because the chunk would get through, but it brings more noise into the window with it.` },

  /* Q20 - Ch 22 */
  { ref:{chapter:22}, q:`In an MLflow evaluation of Larkspur's claims assistant, RetrievalRelevance and RetrievalSufficiency pass on a cluster of questions, but RetrievalGroundedness fails: answers state settlement amounts that no retrieved chunk contains. Where is the problem?`,
    opts:[
      "In generation: the model is inventing past its context, so the fix is in the prompt or generation, not retrieval",
      "In freshness: the index has not been synced",
      "In retrieval: the index returns the wrong chunks",
      "In coverage: the needed documents are missing from the index's source"
    ],
    correct:0,
    explain:`Retrieval brought back relevant, sufficient context, and the answer still goes beyond it. A coverage gap is tempting because amounts are missing from the chunks, but sufficiency passed, so the needed facts were there.` },

  /* Q21 - Ch 24 */
  { ref:{chapter:24}, q:`A Larkspur customer returns three weeks after reporting hail damage and asks whether that claim was ever filed. The agent loads only the current conversation and says it has no record. Which memory source should have answered?`,
    opts:[
      "The MLflow trace of the current request",
      "Cross-session (long-term) memory holding key facts from earlier conversations",
      "The agent's in-context scratchpad",
      "Session (short-term) memory for the current thread"
    ],
    correct:1,
    explain:`The fact was born in a previous conversation, so only cross-session memory can hold it. Session memory is tempting because it holds conversation state, but a new thread starts empty.` },

  /* Q22 - Ch 25 */
  { ref:{chapter:25}, q:`Larkspur's letter-drafting agent writes one coverage letter per run in about six steps, finishes in under a minute, and nothing else reads its progress. Where should its plan and progress live?`,
    opts:[
      "In an in-context scratchpad",
      "In Lakebase long-term memory",
      "In a Delta table with one row per step",
      "In an MLflow experiment"
    ],
    correct:0,
    explain:`Short, single-run and private is the scratchpad's sweet spot. A Delta table is tempting because it is more robust, but it adds a table, tools and re-run safety for state that never needs to survive the run.` },

  /* Q23 - Ch 26 */
  { ref:{chapter:26}, q:`A Larkspur engineer switches the agent from an in-memory checkpointer to AsyncPostgresSaver on Lakebase. The first request fails because the checkpoint tables do not exist. What is missing?`,
    opts:[
      "Generating a new thread ID for every request",
      "Awaiting the checkpointer's setup the first time, before compiling and calling the graph",
      "Logging the checkpoints to MLflow instead",
      "Switching back to an in-memory checkpointer"
    ],
    correct:1,
    explain:`setup creates the checkpoint schema and must be run once, awaited in async code. A new thread ID per request is tempting as a reset, but it would only make every request start an empty conversation.` },

  /* Q24 - Ch 27 */
  { ref:{chapter:27}, q:`Larkspur's agent needs "this customer's last three interactions about claims," stored as memory rows in Lakebase with a timestamp and topic column. Which retrieval mechanism fits?`,
    opts:[
      "Loading every memory for the customer into the prompt",
      "AI Search over the memory text, filtered to the customer",
      "A structured query filtered to the customer and topic, ordered by time, limited to three",
      "AI Search across all customers' memories"

    correct:2,
    explain:`The phrase "last three" is an ordering and a count, which a structured query answers exactly. AI Search is tempting because it handles memory text well, but it returns ranked similar candidates, not the most recent three.` },

  /* Q25 - Ch 28 */
  { ref:{chapter:28}, q:`Larkspur's senior adjuster assistant keeps thousands of memories per adjuster from years of files. Any one question touches a handful, and many turns touch none. How should memories reach the window?`,
    opts:[
      "Statically, loading all memories at session start",
      "Dynamically, through a memory tool the agent calls when a turn needs a slice",
      "Not at all; the adjuster can restate what matters",
      "Statically, loading the 50 most recent memories at session start"
    ],
    correct:1,
    explain:`A large memory with sparse needs is the dynamic case; it keeps the window lean and reads current values. Loading the 50 most recent is tempting as a middle ground, but it still spends tokens every turn on memories most turns do not use.` },

  /* Q26 - Ch 29 */
  { ref:{chapter:29}, q:`Larkspur's agent retrieves memories through a tool. Traces show it often does not call the tool when a customer refers to earlier sessions, and customers complain about repeating themselves. Which change best fixes this without polluting the window?`,

      "Raise the tool's top-k from 5 to 30",

  { ref:{chapter:31}, q:`Larkspur compares four memory configurations on correctness, groundedness and retrieval sufficiency. S: 0.92, 0.70, 0.90. T: 0.88, 0.86, 0.87. U: 0.97, 0.93, 0.72. V: 0.80, 0.82, 0.81. Answers must score well on all three at once. Which configuration is most reliable?`,
    opts:[

    correct:1,
    explain:`Reliable means no lagging metric, and T's weakest score is well above S's (0.70) and U's (0.72). U is tempting because it tops correctness and edges T on average (about 0.873 to 0.870), but its sufficiency of 0.72 means missed memories. V is even, but its weakest score (0.80) still trails T's.` },

  { ref:{chapter:32}, q:`An adjuster asks Larkspur's agent to "list each payment on claim 5521 with its date." Unity Catalog function tools: <code>get_claim_payments(claim_id)</code> returning payment_id, amount and paid_on rows; <code>claim_paid_to_date(claim_id, currency)</code> returning one total; <code>policy_paid_to_date(policy_id)</code>; <code>update_payment(payment_id, amount)</code>. Which tool fits?`,

const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
