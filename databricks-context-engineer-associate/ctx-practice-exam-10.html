<script>
/* =====================================================================

   The only section you edit per exam: the E config object and the

/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Practice Exam 10",
  badge: "Databricks Context Engineer Associate",
  blurb: "Full-length mock. Exam-style, scenario-based questions across all seven sections. Most questions have one best answer; a few ask you to select two. Databricks publishes no official passing score; 70% is our practice target.",
  coverage: "Full-length mock exam: 45 questions in 90 minutes across all seven sections, weighted like the real exam.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

  /* Q1 - Ch 1 */
  { ref:{chapter:1}, q:`Larkspur's billing agent connects to MCP servers exposing 60 tools. A trace shows about 18,000 tokens of tool definitions, 2,500 of history and 1,500 of retrieved context per turn. A month of traces shows it calls only four tools, and it occasionally picks a similar-sounding wrong one. Which element is consuming a disproportionate share, and what helps most?`,
    opts:[
      "The retrieved context; retrieve fewer passages",
      "The tool definitions; give the agent a minimal tool set or load tools in stages",
      "The history; compact it into a summary",
      "None; the window is far from full, so focus is not the problem"
    ],
    correct:1,
    explain:`Tool definitions are most of the input and almost none contribute, which also explains the wrong picks. Thinking the window is fine because it is not full is tempting, but attention is spent long before capacity runs out.` },

  /* Q2 - Ch 3 */
  { ref:{chapter:3}, q:`Larkspur's system prompt says "Never waive a deductible." A retrieved 2026 catastrophe bulletin says deductibles are waived for declared events, and the agent's answers on catastrophe claims flip between the two. What is the failure, and how should it be resolved?`,
    opts:[
      "Context clash; resolve it before injection by making the precedence explicit, for example stating the catastrophe exception in the instruction",
      "Context rot; shorten the prompt",
      "Context confusion; remove the bulletin from the index",
      "Context poisoning; clear the bulletin from memory"
    ],
    correct:0,
    explain:`An instruction and a real retrieved document disagree, both in the window, which is clash. Poisoning is tempting because one answer is wrong, but neither statement is fabricated; both are genuine sources.` },

  /* Q3 - Ch 4 */
  { ref:{chapter:4}, q:`Larkspur's retrieval for its home-insurance assistant also returns marketing brochures for unrelated products. In short sessions, answers sometimes promote a pet-insurance add-on when customers ask about roof coverage. Which diagnosis and fix fit?`,
    opts:[
      "Context confusion; scope retrieval so only content the task needs is returned",
      "Context rot; move to a model with a later degradation point",
      "Context clash; make instruction precedence explicit",
      "Context distraction; compact the history"
    ],
    correct:0,
    explain:`Irrelevant content in a short context is steering the answer, which is confusion. Compaction is tempting because it reduces context, but these sessions are short and the noise comes from retrieval, not history.` },

  /* Q4 - Ch 5 */
  { ref:{chapter:5}, q:`Late in long sessions, Larkspur's agent ignores a constraint the customer stated in the first minutes ("no contact on weekends"). The team must keep long sessions. Which technique most directly addresses this?`,
    opts:[
      "Add an instruction to respect earlier constraints",
      "Move to a model with a larger context window",
      "Compaction that explicitly preserves user-stated constraints, exclusions and preferences",
      "Drop the oldest messages once the window is 75% full"
    ],
    correct:2,
    explain:`The constraint is buried in a long history, and compaction that keeps constraints restores it. Dropping old messages is the trap: the constraint lives in the oldest messages, so it would be the first thing lost.` },

  /* Q5 - Ch 6 */
  { ref:{chapter:6}, q:`Larkspur scoped its claim-lookup tool to return 8 fields instead of 140. How should the team confirm the change helped and did not remove something needed?`,
    opts:[
      "Ask a few adjusters whether answers look the same",
      "Check that input tokens per turn drop in MLflow traces and that quality scores on the same evaluation set hold or improve",
      "Confirm that the tool still returns without errors",
      "Check that the tool's response time fell"
    ],
    correct:1,
    explain:`Traces show the token saving and evaluation shows whether quality held; a drop would mean a needed field was removed. Faster responses are tempting as proof, but speed says nothing about whether answers still have what they need.` },

  /* Q6 - Ch 7 */
  { ref:{chapter:7}, q:`Larkspur's evaluation shows answer quality falls as input length grows, starting well below the model's limit. The failing requests come from many customers and topics, with no shared document or tool. What is the most likely failure?`,
    opts:[
      "Context poisoning from a bad note",
      "Context rot: length-driven degradation",
      "Context clash between two policy versions",
      "A tool selection error"
    ],
    correct:1,
    explain:`Quality tracking length across varied content is rot. Poisoning is tempting because answers are wrong, but poisoning would cluster on requests that carried the bad content, not on length.` },

  /* Q7 - Ch 8 */
  { ref:{chapter:8}, q:`Larkspur's coverage-review agent uses extended thinking on every turn of long multi-turn sessions, passing prior reasoning blocks back each time, and sessions now approach the token budget. What should change?`,
    opts:[
      "Raise the thinking budget",
      "Switch every turn to standard mode",
      "Use the lowest mode that meets quality, and pass back prior reasoning only when later turns must build on it",
      "Move to a model with a larger window and keep everything as is"
    ],
    correct:2,
    explain:`Prior reasoning passed back counts as input tokens, so keep the mode and the carry-over as small as quality allows. Switching everything to standard is tempting because it saves the most, but coverage reviews are multi-step and may genuinely need deliberation.` },

  /* Q8 - Ch 9 */
  { ref:{chapter:9}, q:`Larkspur's claims prompt says both "Keep answers concise" and "Always include the full claim timeline." On older claims with long histories, answers flip between terse and very long. Which revision is best?`,
    opts:[
      "Add a third rule: when in doubt, be concise",
      "Delete the timeline rule",
      "Merge them into one instruction with clear precedence: be concise, summarizing the timeline to key dates unless the user asks for all of it",
      "Add ten examples of good answers"
    ],
    correct:2,
    explain:`The failure comes from a conflict, so rewrite the pair as one instruction with precedence. A third rule is tempting because it targets the conflict, but it keeps both clashing rules and adds another one to maintain.` },

  /* Q9 - Ch 10 */
  { ref:{chapter:10}, q:`Leave-one-out evaluation on Larkspur's agent shows that removing any one of its three billing-question examples leaves scores unchanged, while removing the single cancellation example drops scores on cancellation requests. What should the team do?`,
    opts:[
      "Keep all examples, since none hurt",
      "Drop the cancellation example, since it is only one",
      "Add two more cancellation examples",
      "Drop billing examples (keeping one if a billing slice still needs it) and keep the cancellation example"
    ],
    correct:3,
    explain:`Each billing example contributes nearly nothing on its own, so that is where the budget is; re-run after cutting, since leave-one-out can miss redundancy. Keeping everything is tempting because nothing hurts, but each example costs tokens on every call.` },

  /* Q10 - Ch 12 */
  { ref:{chapter:12}, q:`Larkspur's reserves Genie space has 30 raw tables, and Genie joins them inconsistently, so the same question returns different numbers. Which change best addresses this?`,
    opts:[
      "Add sample questions for every table",
      "Add 30 more benchmark questions",
      "Add a long text instruction describing every join",
      "Curate a few pre-joined views or metric views, and declare join relationships in the knowledge store"
    ],
    correct:3,
    explain:`A focused, pre-joined surface with declared relationships removes the guesswork. A text instruction is tempting because it can describe joins, but instructions are interpreted, and 30 tables still leave many ways to join.` },

  /* Q11 - Ch 13 */
  { ref:{chapter:13}, q:`Across many different questions, Larkspur's Genie space reads "AY" as calendar year and does not know "IBNR." Which lever fits?`,
    opts:[
      "General instructions that define the domain vocabulary",
      "A SQL expression for IBNR",
      "A sample question using AY",
      "A trusted asset for the IBNR report"
    ],
    correct:0,
    explain:`Vocabulary that changes how many questions are read is an instructions job. A sample question is tempting because it shows the term in use, but it teaches one pattern, not what the term means everywhere else.` },

  /* Q12 - Ch 14 */
  { ref:{chapter:14}, q:`Larkspur's claims tables have 400 columns, many with weak comments, and the agent makes scattered errors. With limited time, where should metadata work start?`,
    opts:[
      "Generate AI comments for all 400 columns and save them unreviewed",
      "Collect failing questions, read the generated SQL, and fix the comments on the columns those queries got wrong",
      "Start alphabetically and work through every table",
      "Rename all columns to readable names first"
    ],
    correct:1,
    explain:`The columns in failing queries carry the gap, so fixing them first has the most impact. Bulk AI comments are tempting because they look thorough, but unreviewed generic comments often leave look-alike columns just as indistinct.` },

  /* Q13 - Ch 15 */
  { ref:{chapter:15}, q:`Larkspur's Genie space calls a Unity Catalog function for the cat-adjusted severity formula. Some analysts get errors when their questions use it, while others do not. What is the most likely fix?`,
    opts:[
      "Grant EXECUTE on the function to the analysts who get errors",
      "Add a text instruction explaining the formula",
      "Replace the function with a view",
      "Grant those analysts SELECT on the whole catalog"
    ],
    correct:0,
    explain:`Users need EXECUTE on functions a space uses. Replacing it with a view is tempting because views need only SELECT, but it would expose the formula the function was chosen to hide.` },

  /* Q14 - Ch 16 */
  { ref:{chapter:16}, q:`Larkspur's agent drafts claim-denial letters with correct facts and format, but sometimes cites an exclusion that does not apply. It sees the claim record and a letter template. What is most likely missing?`,
    opts:[
      "The claimant's full claim history",
      "The policy wording's applicable exclusions, fetched for the claim's policy",
      "More past denial letters",
      "The CRM contact record"
    ],
    correct:1,
    explain:`Without the exclusions themselves, the set is not sufficient, so the agent guesses which applies. More past letters are tempting as more context, but they show format, which is already right.` },

  /* Q15 - Ch 17 */
  { ref:{chapter:17}, q:`Larkspur's support chat answers many turns ("thanks," "what's my claim number again?") that need no policy text, but injects the top 8 wording passages on every turn. Which approach fits better?`,
    opts:[
      "Pre-inference retrieval with a reranker",
      "Pre-inference retrieval with top-k lowered to 4",
      "Just-in-time retrieval through a tool the agent calls when a turn needs policy text",
      "Pre-inference retrieval of whole documents"
    ],
    correct:2,
    explain:`Whether to retrieve depends on the turn, so retrieval should be triggered by need. Lowering top-k is tempting because it cuts tokens, but it still injects passages into turns that need none.` },

  /* Q16 - Ch 18 */
  { ref:{chapter:18}, q:`Larkspur parses policy PDFs from a governed volume for its RAG pipeline. Which choice at the chunking stage most enables later filtering and citation?`,
    opts:[
      "Store only chunk text to keep the table small",
      "Concatenate all sections into one chunk per document",
      "Keep document ID, section, effective dates and line of business on every chunk in the Delta table",
      "Drop section headers to save embedding tokens"
    ],
    correct:2,
    explain:`Metadata kept on each chunk is what makes filtering and citation possible downstream. Storing only text is tempting because it is lean, but then nothing exists to filter on or cite.` },

  /* Q17 - Ch 20 */
  { ref:{chapter:20}, q:`Larkspur's pipeline already computes embeddings into a column of the governed chunk table each night. Which index setup fits?`,
    opts:[
      "No index; query the embeddings column with SQL",
      "A Delta Sync index using the precomputed embeddings in the table",
      "A Delta Sync index with Databricks recomputing the embeddings",
      "A Direct Access index, since the embeddings are self-managed"
    ],
    correct:1,
    explain:`Delta Sync can use embeddings precomputed in the source table, keeping governance and automatic sync. Direct Access is tempting because the embeddings are self-managed, but the content already lives in a Delta table, so no write code is needed.` },

  /* Q18 - Ch 21 */
  { ref:{chapter:21}, q:`Larkspur's fraud-signals table updates constantly, and the fraud agent must see new signals within seconds. Its Delta Sync index uses triggered sync. What fits?`,
    opts:[
      "Run a triggered sync once a night",
      "Increase top-k",
      "Switch to continuous sync, accepting the higher cost of an always-running pipeline",
      "Rebuild as a Direct Access index without changing the pipeline"
    ],
    correct:2,
    explain:`When seconds matter, continuous sync keeps the index within seconds of the table. A nightly sync is tempting because it is cheap, but it leaves signals unsearchable for up to a day.` },

  /* Q19 - Ch 22 */
  { ref:{chapter:22}, q:`Larkspur's towing answers pass RetrievalRelevance and RetrievalSufficiency but fail correctness. RETRIEVER spans show chunks from manual_2025_export, tagged deprecated. What is the problem?`,
    opts:[
      "Retrieval from a non-authoritative, deprecated source",
      "The model is hallucinating beyond its context",
      "The query needs hybrid search",
      "A coverage gap in the index"
    ],
    correct:0,
    explain:`The chunks are relevant and complete, and the answer follows them, but they come from a deprecated copy. Hallucination is tempting because correctness fails, but the answer is faithful to what was retrieved.` },

  /* Q20 - Ch 23 */
  { ref:{chapter:23}, q:`To speed up a pilot, a Larkspur engineer built the claims index from sandbox.manual_flat, a one-time copy of the certified claims-manual table, and granted the agent access to the sandbox schema. The pilot scores well. What should happen before production?`,
    opts:[
      "Add a prompt line telling the agent to prefer certified content",
      "Rebuild the index on the certified table, or a governed view over it, and remove the agent's access to the sandbox copy",
      "Tag the sandbox copy certified",
      "Schedule a nightly refresh of the sandbox copy"
    ],
    correct:1,
    explain:`A copy drifts from its source, so the index must come from the authoritative asset, with least privilege. A nightly refresh is tempting because it keeps the copy fresher, but it maintains a second source that can still diverge.` },

const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
