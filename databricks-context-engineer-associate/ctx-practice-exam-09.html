<style>

  :root{

  .pbar{height:3px;background:rgba(255,255,255,0.1);}

  .res p{color:var(--ink-soft);font-size:14.5px;max-width:28em;margin:0 auto 22px;}
  .res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}

<script>
/* =====================================================================

   The only section you edit per exam: the E config object and the

/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Practice Exam 9",
  badge: "Databricks Context Engineer Associate",
  blurb: "Full-length mock. Exam-style, scenario-based questions across all seven sections. Most questions have one best answer; a few ask you to select two. Databricks publishes no official passing score; 70% is our practice target.",
  coverage: "Full-length mock exam: 45 questions in 90 minutes across all seven sections, weighted like the real exam.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

  /* Q1 - Ch 2 */
  { ref:{chapter:2}, q:`Larkspur wants its claims agent to remember each adjuster's working preferences (report format, preferred contact times) across separate conversations, and to resume open threads after a restart. Which part of the Databricks context stack owns that job?`,
    opts:[
      "A managed MCP server, which holds the data it exposes",
      "MLflow 3, by reading back earlier traces at session start",
      "Lakebase, as the durable store for thread checkpoints and long-term memories",
      "Unity Catalog, through tags on the adjusters table"
    ],
    correct:2,
    explain:`Durable agent state, short-term checkpoints and long-term memories, belongs in Lakebase. MLflow traces are tempting because they record every past turn, but they are for inspection; the agent does not resume from them.` },

  /* Q2 - Ch 3 */
  { ref:{chapter:3}, q:`Midway through a session, Larkspur's agent writes "policy includes an earthquake rider" into its notes after misreading a list of available add-ons. No document says the policy has the rider, yet later turns keep citing it. What is the failure, and what fixes it?`,
    opts:[
      "Context clash; retrieve only the current policy wording",
      "Context poisoning; check claims against sources before saving notes, and remove the bad note from the session",
      "Context distraction; compact the history",
      "Context confusion; remove unneeded tools"
    ],
    correct:1,
    explain:`A false fact entered, persisted and is being cited, with no source behind it: poisoning. Clash is tempting because the policy wording disagrees with the note, but the note was invented by the model, not taken from a second real source.` },

  /* Q3 - Ch 4 */
  { ref:{chapter:4}, q:`Three hours into a session about one customer's water-damage claim, Larkspur's support agent starts repeating checks it already completed and re-asking questions the customer answered. Everything in the context relates to this claim. Which diagnosis and fix fit?`,
    opts:[
      "Context distraction; compact the history into a faithful summary plus recent items",
      "Context clash; restrict retrieval to one source",
      "Context poisoning; validate tool outputs before saving them",
      "Context confusion; remove tools the task does not need"
    ],
    correct:0,
    explain:`All the content is relevant and quality falls with length, which is distraction. Removing tools is tempting as a general clean-up, but that is the confusion fix, and nothing irrelevant is steering this agent.` },

  /* Q4 - Ch 5 */
  { ref:{chapter:5}, q:`Larkspur's finance agent writes correct SQL but keeps reading "AY" as calendar year and does not know that "IBNR" means incurred but not reported. Which technique most directly addresses this?`,
    opts:[
      "Supply the missing meaning: Unity Catalog comments on the relevant columns or definitions of the terms in the instructions",
      "Reduce the tool set to the essentials",
      "Persist the terms in Lakebase long-term memory per user",
      "Compact the session history"
    ],
    correct:0,
    explain:`The failure is missing meaning, so the fix is to supply it where the agent reads definitions. Lakebase memory is tempting because it persists knowledge, but business definitions are metadata about the data, not per-user conversational memory.` },

  /* Q5 - Ch 6 */
  { ref:{chapter:6}, q:`Larkspur's renewals agent calls a claims lookup that returns the full 140-field claim record with every adjuster note, though renewal decisions use five fields. What is the proactive fix?`,
    opts:[
      "Move to a model with a larger context window",
      "Scope the tool to return only the fields the renewal task uses",
      "Add an instruction to ignore unused fields",
      "Compact the history after every tool call"
    ],
    correct:1,
    explain:`Tool result scoping narrows the inflow at design time on every call. Compacting after every call is tempting because it shrinks context, but it is reactive, costs a model call each time, and still lets the bulk in first.` },

  /* Q6 - Ch 7 */
  { ref:{chapter:7}, q:`Larkspur suspects its claims Q&A gets worse on long requests. How should the team find the point where length starts to hurt?`,
    opts:[
      "Compare the average evaluation score before and after a model change",
      "Measure latency per request",
      "Read the context limit from the model card",
      "Bucket evaluation quality by input-token length band, joining evaluation results to their traces"
    ],
    correct:3,
    explain:`Degradation is model-specific and starts below the limit, so it has to be measured by length band. The model card is tempting because it states a token figure, but capacity says what fits, not where quality falls.` },

  /* Q7 - Ch 8 */
  { ref:{chapter:8}, q:`Larkspur's intake router classifies hundreds of claims an hour into six queues with a two-second target. The only model approved for it always reasons and cannot switch reasoning off. Which mode fits?`,
    opts:[
      "Standard mode with reasoning switched off",
      "Reduced thinking at the lowest effort",
      "Extended thinking with a generous budget",
      "Extended thinking only on the first request of each hour"
    ],
    correct:1,
    explain:`For a simple, latency-bound task on a model that always reasons, the lowest effort is the floor. Standard mode is the natural pick for routing, which makes it tempting, but this model cannot turn reasoning off.` },

  /* Q8 - Ch 10 */
  { ref:{chapter:10}, q:`Larkspur's claims agent has room for two few-shot examples. Evaluation shows it never calls the escalate_to_fraud_review tool when it should, and it malforms the JSON reserve note; simple auto and home claims already pass. Which TWO candidate examples earn their tokens? Select TWO.`,
    opts:[
      "A clean, simple auto claim",
      "A suspicious claim handled by calling escalate_to_fraud_review with the right arguments",
      "A reserve note in the exact JSON structure required",
      "A simple home claim that differs from an existing example only in the address",
      "A claim answered in a way that breaks one of the prompt's rules"
    ],
    correct:[1,2],
    explain:`An untested tool path and an output structure are both behaviors the agent currently gets wrong. A clean simple auto claim is tempting because it is a good demonstration, but evaluation already passes that case, so it adds tokens without accuracy.` },

  /* Q9 - Ch 11 */
  { ref:{chapter:11}, q:`Larkspur's prompt v9 adds a reasoning checklist, six worked examples and a procedures appendix to v8, lifting correctness from 0.80 to 0.85 on the same evaluation set and scorers. Adding each element alone to v8 gives: checklist +0.005, examples +0.04, appendix +0.01. Which element drives the gain?`,
    opts:[
      "None alone; the gain only appears with all three",
      "The reasoning checklist",
      "The procedures appendix",
      "The worked examples"
    ],
    correct:3,
    explain:`The examples alone recover 0.04 of the 0.05 gain. The appendix is tempting because it is the largest addition, but measured alone it contributes only 0.01.` },

  /* Q10 - Ch 12 */
  { ref:{chapter:12}, q:`A Larkspur author adds 40 benchmark questions with ground-truth SQL to a Genie space and expects its answers to improve. A week later accuracy is unchanged. Why?`,
    opts:[
      "Benchmarks only work in spaces with five or fewer tables",
      "40 questions is too few for Genie to learn from",
      "Benchmarks measure accuracy; failures must be fixed in expressions, example SQL or instructions, then re-run",
      "Benchmarks take a week to train Genie, so accuracy will improve soon"
    ],
    correct:2,
    explain:`Benchmarks score the space; they do not teach it anything. Thinking more questions would help is tempting, but no number of benchmark questions changes what Genie reads when it writes SQL.` },

  /* Q11 - Ch 13 */
  { ref:{chapter:13}, q:`In Larkspur's finance Genie space, "loss ratio by region" works, but "how did each region's losses compare to premium" gives a poor answer. Terms and metric logic are otherwise correct. Which lever fits?`,
    opts:[
      "A SQL expression for loss ratio",
      "A general instruction defining loss ratio",
      "A trusted asset that certifies the regulatory loss ratio",
      "A sample question in the failing phrasing, with verified SQL"
    ],
    correct:3,
    explain:`The failure is phrasing coverage, which sample questions address. A SQL expression is tempting because loss ratio is a metric, but the metric already computes correctly; only one wording fails.` },

  /* Q12 - Ch 15 */
  { ref:{chapter:15}, q:`Larkspur's underwriting Genie space needs location and premium data from a raw table that also holds insured contact details. The domain never needs the contact details. Which object should the space use?`,
    opts:[
      "A view that includes the needed columns and leaves out the contact details",
      "The raw table, with an instruction not to show contact details",
      "The raw table with all columns, since Genie only reads what it needs",
      "A UC function that returns the full raw table"
    ],
    correct:0,
    explain:`A view that omits the sensitive columns keeps them out of context entirely. An instruction is tempting because it is quick, but instructions are interpreted, not enforced, and the columns would remain in the space.` },

  /* Q13 - Ch 16 */
  { ref:{chapter:16}, q:`Larkspur's agent drafts accurate subrogation letters, but their format varies widely. Its context includes the claim record, payments, and an archive of 10,000 past letters. What should change?`,
    opts:[
      "Remove the payments, since the facts are already right",
      "Replace the archive with one letter template as the output specification",
      "Add the claimant's full claim history",
      "Add more past letters so the model sees more variety"
    ],
    correct:1,
    explain:`The output specification is missing, and one template beats an archive. More letters are tempting as more guidance, but the archive is the source of the variation.` },

  /* Q14 - Ch 17 */
  { ref:{chapter:17}, q:`A Larkspur adjuster asks the assistant for claim 8814's current reserve. The assistant runs a vector search over claim notes and quotes a figure from an old note. Which approach should answer this kind of question?`,
    opts:[
      "Pre-inference vector search with a larger top-k",
      "A just-in-time query against the claims table or a UC function returning the current value",
      "A reranker on the claim-note results",
      "Hybrid search over the claim notes"
    ],
    correct:1,
    explain:`Exact, current values come from tables, fetched when the turn needs them. Hybrid search is tempting because it improves matching, but it still searches notes, which hold past values, not the current reserve.` },

  /* Q15 - Ch 18 */
  { ref:{chapter:18}, q:`Larkspur stores HR policy chunks and claims-manual chunks in one table and one index. The claims agent must never retrieve HR content, and security proposes a row filter on the chunk table. What actually works?`,
    opts:[
      "The row filter, since the index inherits Unity Catalog permissions row by row",
      "A reranker that ranks HR chunks lower",
      "Separate indexes, or an application-enforced filter, because AI Search does not apply row- or column-level permissions",
      "An instruction telling the claims agent to ignore HR content"
    ],
    correct:2,
    explain:`AI Search does not support row- or column-level permissions, so separation has to come from the index or an enforced filter. The row filter is tempting because Unity Catalog governs the table, but the index does not apply it.` },

  /* Q16 - Ch 19 */
  { ref:{chapter:19}, q:`Larkspur's customer FAQ has short entries of about 150 tokens, each answering one question, well under the embedding model's input limit. Which chunking strategy fits?`,
    opts:[
      "Fixed-size 50-token chunks with overlap",
      "Structural chunking by sentence",
      "Whole-document chunks, one per FAQ entry",
      "Recursive splitting at 512 to 1,024 tokens"
    ],
    correct:2,
    explain:`Short, single-topic documents have no boundary problems as a whole. Recursive splitting is tempting as the general default, but at this size it would just return each entry intact, or merge unrelated ones.` },

  /* Q17 - Ch 20 */
  { ref:{chapter:20}, q:`Larkspur's Delta Sync wordings index lags the source table by days. An engineer proposes rebuilding it as a Direct Access index to make it fresher. What is the better response?`,
    opts:[
      "Rebuild as Direct Access, since it updates automatically",
      "Switch to self-managed embeddings",
      "Increase top-k so newer chunks are found",
      "Keep Delta Sync and fix the sync, for example by running a sync task right after ingestion"
    ],
    correct:3,
    explain:`Staleness in a Delta Sync index is a sync question, not an index-type question. Direct Access is tempting because it sounds more direct, but it has no automatic sync at all; the application would have to write every change.` },

  /* Q18 - Ch 21 */
  { ref:{chapter:21}, q:`Larkspur's index is current. Questions about commercial auto policies issued in 2026 return chunks from personal auto and from 2023 wordings. Which change most directly helps?`,
    opts:[
      "Metadata filters on line of business and effective year",
      "Switching to a Direct Access index",
      "A larger top-k",
      "Continuous sync"
    ],
    correct:0,
    explain:`Results from the wrong product or period call for filtering before ranking. A larger top-k is tempting because the right chunks might appear, but it brings more of the wrong ones too.` },

  /* Q19 - Ch 22 */
  { ref:{chapter:22}, q:`MLflow evaluation of Larkspur's assistant shows commercial-wording questions fail RetrievalSufficiency. The commercial wordings are in the index's source table, but the agent's service identity holds SELECT only on the personal-lines index. What is the fix?`,
    opts:[
      "Grant the agent's identity SELECT on the index that holds the commercial wordings, and nothing broader",
      "Grant the identity SELECT on the whole catalog",
      "Rewrite the generation prompt",
      "Add a reranker"
    ],
    correct:0,
    explain:`This is an access gap: the content exists but the identity cannot reach it, so grant exactly what it needs. Catalog-wide SELECT is tempting because it fixes the failure, but it also opens every sandbox copy and export to the agent.` },

  /* Q20 - Ch 23 */
  { ref:{chapter:23}, q:`Larkspur must make sure its claims assistant retrieves only from authoritative sources. Which TWO steps actually restrict retrieval? Select TWO.`,
    opts:[
      "Index every copy, then filter out the copies at query time",
      "Add 'use only official sources' to the system prompt",
      "Build the assistant's index only from the certified claims-manual table",

  { ref:{chapter:24}, q:`Early in a chat, a Larkspur customer gives a new phone number. Later in the same chat, the agent texts a confirmation to the old number, loaded from cross-session memory at the start. What went wrong?`,

  /* Q22 - Ch 25 */

const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
