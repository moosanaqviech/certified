<script>
/* ============================================================
   ▼▼▼  LESSON PAYLOAD — BEGIN  ▼▼▼
   Unit 3 · Retrieval · Chapter 23 · Restricting Retrieval to
   Authoritative Sources. Objective 3.9. Closes Unit 3.
   Shape: cover, case file, restrict the space, design (step build), quiz
   (certified index plus least privilege), derived-copy trap, quiz
   (rebuild on certified), decision (last).
   Sources (fetched 7 Nov 2026): exam guide PDF (29 Jul 2026); UC certify and deprecate data (system.certification_status);
   AI Search overview (no row or column level permissions); unstructured
   retrieval tools (AI Search MCP needs SELECT on the index).
   ============================================================ */

/* ----------  NAV  ---------- */
/* Closes Unit 3, so next is the Unit 3 practice exam. */
const NAV = {
  catalog:   "index.html",
  next:      "ctx-practice-exam-03.html",
  nextLabel: "Practice test"
};

/* ----------  ART  ---------- */
const A = {
  cover: `<svg viewBox="0 0 320 200">
    <defs>
      <radialGradient id="x23r" cx="0.5" cy="0.5" r="0.6">
        <stop offset="0" style="stop-color:rgba(66,215,165,0.2)"/>
        <stop offset="1" style="stop-color:rgba(66,215,165,0)"/>
      </radialGradient>
    </defs>
    <style>
      .x23fence { animation: x23draw 6s ease-in-out infinite; stroke-dasharray: 420; }
      @keyframes x23draw { 0% { stroke-dashoffset: 420; } 40%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 420; } }
      .x23copy { animation: x23fade 6s ease-in-out infinite; }
      @keyframes x23fade { 0%, 30% { opacity: 1; } 50%, 85% { opacity: 0.25; } 100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .x23fence { animation: none; stroke-dashoffset: 0; }
        .x23copy { animation: none; opacity: 0.25; }
      }
    </style>
    <ellipse cx="160" cy="100" rx="156" ry="94" fill="url(#x23r)"/>
    <g font-family="Hanken Grotesk" font-weight="700" font-size="8.5" text-anchor="middle">
      <rect class="x23fence" x="60" y="40" width="140" height="110" rx="14" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
      <rect x="76" y="56" width="108" height="24" rx="6" fill="var(--accent)" fill-opacity="0.35"/><text x="130" y="72" fill="var(--ink)">claims_manual ✓</text>
      <rect x="76" y="86" width="108" height="24" rx="6" fill="var(--accent)" fill-opacity="0.35"/><text x="130" y="102" fill="var(--ink)">policy_wordings ✓</text>
      <circle cx="130" cy="130" r="10" fill="var(--ink)"/><text x="130" y="133" fill="var(--bg)" font-size="7">agent</text>
      <g class="x23copy">
        <rect x="216" y="50" width="92" height="22" rx="6" fill="var(--warm)" fill-opacity="0.3"/><text x="262" y="65" fill="var(--ink)">manual_export</text>
        <rect x="216" y="80" width="92" height="22" rx="6" fill="var(--warm)" fill-opacity="0.3"/><text x="262" y="95" fill="var(--ink)">sandbox.copy_v2</text>
        <rect x="216" y="110" width="92" height="22" rx="6" fill="var(--warm)" fill-opacity="0.3"/><text x="262" y="125" fill="var(--ink)">wordings_old</text>
      </g>
      <text x="160" y="186" fill="var(--ink-soft)" font-size="9.5" font-weight="500">Draw the boundary before the agent ships, not after.</text>
    </g>
  </svg>`,

  done: `<svg viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="38" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <path d="M28 43 l9 9 l19 -20" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`
};

/* ----------  CARDS  ---------- */
const cards = [

  /* 0: cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.3"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 3 · Retrieval · Chapter 23</div>
    <h1 class="reveal" style="font-size:34px">Restricting Retrieval to Authoritative Sources</h1>
    <p class="lead reveal">Before an agent goes live, design the governance that limits what it can retrieve to authoritative assets, not the derived copies that sit next to them.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1: case file */
  { html: `
    <div class="eyebrow reveal">Case file · Larkspur Mutual</div>
    <h2 class="reveal" style="font-size:25px">A deployment review</h2>
    <p class="lead reveal" style="margin-bottom:14px">Larkspur's claims assistant is ready for production. The review finds its service principal has SELECT on the whole <code>claims</code> catalog.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>What that catalog holds</b>The certified claims manual and wordings tables, plus exports, analysts' sandbox copies, and a "wordings_old" table nobody owns.</p></div>
      <div class="pill"><p><b>The plan on the table</b>Add a line to the system prompt: "Use only official sources."</p></div>
      <div class="pill"><p><b>The decision</b>What governance design actually restricts retrieval to authoritative sources?</p></div>
    </div>` },

  /* 2: the idea */
  { html: `
    <div class="eyebrow reveal">The idea</div>
    <h2 class="reveal" style="font-size:25px">Restrict the space, don't ask nicely</h2>
    <p class="lead reveal" style="margin-bottom:14px">An agent can only retrieve what its identity can reach and what its indexes contain. That is where the boundary belongs.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Derived copies drift</b>Exports and sandbox copies go stale, lose comments and tags, and look authoritative to a search.</p></div>
      <div class="pill"><p><b>Instructions are not access control</b>A prompt cannot stop a tool from returning a copy, and the model cannot tell which table is official.</p></div>
      <div class="pill"><p><b>Index filters are not either</b>AI Search does not apply row- or column-level permissions; what is in an index is reachable through it.</p></div>
    </div>` },

  /* 3: step build, design */
  { steps: 4,
    html: `
    <div class="eyebrow reveal">The design</div>
    <h2 class="reveal" style="font-size:24px">Four steps before go-live</h2>
    <div class="pills">
      <div class="pill" data-step="1" style="pointer-events:none"><p><b>Identify the authoritative assets</b>Owned, maintained tables, marked with the <code>system.certification_status</code> tag set to <code>certified</code>.</p></div>
      <div class="pill" data-step="2" style="pointer-events:none"><p><b>Build retrieval only from them</b>Indexes sourced from certified tables; Genie spaces and tools over the same assets.</p></div>
      <div class="pill" data-step="3" style="pointer-events:none"><p><b>Grant least privilege</b>The agent's identity gets SELECT on those indexes and tables (and EXECUTE on its functions), not on the catalog or sandbox schemas.</p></div>
      <div class="pill" data-step="4" style="pointer-events:none"><p><b>Mark the rest</b>Tag copies <code>deprecated</code> so people and tools see it, and retire what nobody owns.</p></div>
    </div>` },

  /* 4: quiz */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:18px">Larkspur's claims assistant will search wordings through an AI Search index and query claims through UC functions. Copies of the wordings table exist in other schemas. Which design restricts retrieval to authoritative sources?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span><span>Index the certified table; grant the agent SELECT on that index and EXECUTE on its functions, nothing more</span></button>
      <button class="choice" data-correct="false"><span class="key">B</span><span>Keep catalog-wide SELECT and instruct the agent to prefer tables tagged certified</span></button>
      <button class="choice" data-correct="false"><span class="key">C</span><span>Index all wordings tables together and add a <code>source</code> column the agent can filter on</span></button>
      <button class="choice" data-correct="false"><span class="key">D</span><span>Delete the copies after deployment if problems appear</span></button>
    </div>
    <div class="feedback"><b>Correct.</b> The index contains only authoritative content, and the identity can reach nothing else. C is tempting because filtering looks precise, but the copies are still in the index and nothing enforces the filter on every call.</div>` },

  /* 5: the derived-copy trap */
  { html: `
    <div class="eyebrow reveal">The derived-copy trap</div>
    <h2 class="reveal" style="font-size:25px">Copies arrive with good intentions</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>"It's faster"</b>A flattened export for a demo becomes the index source and never refreshes.</p></div>
      <div class="pill"><p><b>"It's cleaner"</b>An analyst's tidied copy drops columns and comments that agents relied on.</p></div>
      <div class="pill"><p><b>"It's the same data"</b>Until the source is amended and the copy is not.</p></div>
      <div class="pill"><p><b>The fix</b>Improve the authoritative asset (a view over it, better comments) instead of copying it. Lineage in Unity Catalog shows when an index drifts onto a copy.</p></div>
    </div>` },

  /* 6: quiz */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:18px">To speed up a pilot, a Larkspur engineer built the claims assistant's index from <code>sandbox.manual_flat</code>, a one-time flattened copy of the certified claims-manual table. The pilot worked well, and the team wants to ship. What should happen before deployment?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span><span>Ship as-is, since the pilot's evaluation scores were good</span></button>
      <button class="choice" data-correct="false"><span class="key">B</span><span>Schedule a job to re-copy the certified table into the sandbox weekly</span></button>
      <button class="choice" data-correct="true"><span class="key">C</span><span>Rebuild the index on the certified table (or a governed view over it) and remove the agent's access to the sandbox copy</span></button>
      <button class="choice" data-correct="false"><span class="key">D</span><span>Tag the sandbox copy as certified so it counts as authoritative</span></button>
    </div>
    <div class="feedback"><b>Right.</b> The pilot scored well against a copy that will drift. B keeps the copy fresher, which is tempting, but it maintains a second source that can still diverge and stays outside the certified asset's ownership.</div>` },

  /* 7: decision */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="done-badge reveal">${A.done}</div>
    <div class="eyebrow reveal" style="text-align:center">Decision · Larkspur Mutual · Unit 3 complete</div>
    <h2 class="reveal" style="text-align:center;font-size:25px">Certified sources, narrow grants</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:16px;font-size:15px">The assistant's indexes are rebuilt on the certified manual and wordings tables. Its service principal loses catalog-wide SELECT and gets SELECT on two indexes and EXECUTE on three functions. Copies are tagged deprecated, and "wordings_old" is retired.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Identify</b>Certified, owned assets.</p></div>
      <div class="pill"><p><b>Build and grant</b>Indexes from those only; least privilege for the agent.</p></div>
      <div class="pill"><p><b>Not a prompt</b>Instructions and filters do not draw the boundary.</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ----------
   v2 adds opt-in, per-card step builds on top of the v1 card engine. A card
   with no `steps` field takes exactly the v1 paths below and renders and
   behaves identically; every v2 branch is guarded by `steps` being present. */
const ENGINE_VERSION = 'v2';
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};
const stepState = {};   // v2: current revealed step per card index (mirrors `answered`)

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

/* v2: apply step visibility for one card WITHOUT touching its .in class, so a
   step reveal never replays the card-entrance .reveal stagger. Cumulative for
   normal elements (data-step <= current). Captions append by default: inside
   .stepcaps they accumulate too (data-step="0" is the pre-first-tap caption),
   and captions behind the current step get .step-past (dimmed) while the
   current one stays at full strength. A .stepcap-swap container (or legacy
   .stepcap) opts into swap: only the caption whose data-step equals the
   current step is shown. */
function applySteps(idx) {
  const cur = stepState[idx] || 0;
  els[idx].querySelectorAll('[data-step]').forEach(function(nd) {
    const s = parseInt(nd.getAttribute('data-step'), 10);
    const swapCap = nd.closest && nd.closest('.stepcap-swap, .stepcap');
    const appendCap = !swapCap && nd.closest && nd.closest('.stepcaps');
    const on = swapCap ? (s === cur) : appendCap ? (s <= cur) : (s >= 1 && s <= cur);
    nd.classList.toggle('step-on', on);
    nd.classList.toggle('step-past', !!appendCap && on && s < cur);
  });
}

/* Card layout: the only place that adds/removes .in (and thus replays reveal).
   Called on card change, never on a step advance. */
function layout() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
    applySteps(idx);   // persists built state on revisit
  });
  glow.style.background = cards[i].glow || 'transparent';
}

/* Footer/button state only. Safe to call after a step advance (no reveal). */
function updateFooter() {
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  const total = c.steps || 0;
  const stepsLeft = total > 0 && (stepState[i] || 0) < total;
  if (stepsLeft) { nextBtn.disabled = false; nextBtn.textContent = (i === 0) ? 'Begin lesson' : 'Continue'; }
  else if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
}

function render() {
  layout();
  updateFooter();
  if (cards[i].quiz) wireQuiz(els[i], i);
}

/* v2: reveal the next step of the current card. Returns true if a step was
   consumed (so the caller does not also advance the card). */
function advanceStep(idx) {
  const total = cards[idx].steps || 0;
  if (!total) return false;
  const cur = stepState[idx] || 0;
  if (cur >= total) return false;
  stepState[idx] = cur + 1;
  applySteps(idx);
  updateFooter();
  return true;
}

/* v2: reveal every remaining step at once (swipe-left escape hatch). */
function skipSteps(idx) {
  const total = cards[idx].steps || 0;
  if (!total || (stepState[idx] || 0) >= total) return false;
  stepState[idx] = total;
  applySteps(idx);
  updateFooter();
  return true;
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

/* Primary action. On a step card mid-build this reveals the next step; once
   the steps are done (or on a card with none) it advances, honoring the quiz
   gate exactly as v1 did. Shared by the Continue button and ArrowRight. */
function handleNext() {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  if (advanceStep(i)) return;
  go(i + 1);
}
nextBtn.onclick = handleNext;
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* v2: tapping anywhere on a step card advances one step; once built, a tap
   advances the card (gate permitting). Cards with no steps ignore taps, so
   this listener is inert on v1-style cards. Elements with their own behavior
   (quiz choices, links) are skipped so a tap never double-fires. */
vp.addEventListener('click', e => {
  const c = cards[i];
  if (!c.steps) return;
  if (e.target.closest('.choice, a')) return;
  if ((stepState[i] || 0) < c.steps) { advanceStep(i); return; }
  if (!nextBtn.disabled && !c.last) go(i + 1);
});

/* Keys and swipes only move between cards (or, for a step card, between
   steps). Leaving the lesson always takes a deliberate tap, so a stray swipe
   on the final card cannot navigate away. ArrowRight mirrors the Continue
   button step-wise; ArrowLeft mirrors Back. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) handleNext();
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  // Swipe left: skip any remaining steps and advance in one gesture, honoring
  // the quiz gate (updateFooter re-derives nextBtn.disabled after the skip).
  if (dx < -50 && !cards[i].last) { skipSteps(i); if (!nextBtn.disabled) go(i + 1); }
  if (dx > 50 && i > 0) go(i - 1);
});

render();

/* Back to quiz (additive). A "Review: Chapter N" link in a quiz explanation
   opens this lesson with ?back=<quiz path>, plus &tab=1 when it opened in a
   new tab. Only then a small bar above the progress segments offers the way
   back: closing the tab returns to the untouched quiz tab, otherwise it goes
   to the quiz path, which restores the session. No param, no change. */
(function () {
  let back = null, tab = false;
  try {
    const p = new URLSearchParams(location.search), b = p.get('back');
    tab = p.get('tab') === '1';
    if (b && b.charAt(0) === '/' && b.charAt(1) !== '/' && b.charAt(1) !== '\\') {
      const u = new URL(b, location.href);
      if (u.origin === location.origin) back = u.pathname + u.search;
    }
  } catch (e) { return; }
  if (!back) return;
  const bar = document.createElement('div');
  bar.style.cssText = 'position:relative;z-index:7;padding:14px 20px 0;';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = '← Back to quiz';
  btn.style.cssText = 'font:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--surface-2,rgba(255,255,255,0.06));border:1px solid var(--line,rgba(255,255,255,0.1));border-radius:999px;padding:7px 14px;cursor:pointer;';
  btn.onclick = () => {
    if (tab) { try { window.close(); } catch (e) {} setTimeout(() => { location.href = back; }, 300); }
    else location.href = back;
  };
  bar.appendChild(btn);
  const tb = document.getElementById('topbar');
  tb.parentNode.insertBefore(bar, tb);
})();
</script>
</body>
</html>
