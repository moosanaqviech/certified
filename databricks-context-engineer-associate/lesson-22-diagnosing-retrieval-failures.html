<script>
/* ============================================================
   ▼▼▼  LESSON PAYLOAD — BEGIN  ▼▼▼
   Unit 3 · Retrieval · Chapter 22 · Diagnosing Retrieval Failures with
   MLflow Eval Logs. Objective 3.8.
   Shape: cover, case file, three judges, patterns (step build), check UC
   (step build), quiz (deprecated source), governance actions, quiz
   (coverage gap), decision (last).
   Sources (fetched 7 Nov 2026): exam guide PDF (29 Jul 2026); MLflow built-in judges (RetrievalRelevance, RetrievalGroundedness
   without ground truth; RetrievalSufficiency needs expectations; traces
   required); UC certify and deprecate data. No per-chunk claims.
   ============================================================ */

/* ----------  NAV  ---------- */
const NAV = {
  catalog:   "index.html",
  next:      "lesson-23-authoritative-sources.html",
  nextLabel: "Next chapter"
};

/* ----------  ART  ---------- */
const A = {
  cover: `<svg viewBox="0 0 320 200">
    <defs>
      <radialGradient id="x22r" cx="0.5" cy="0.5" r="0.6">
        <stop offset="0" style="stop-color:rgba(66,215,165,0.2)"/>
        <stop offset="1" style="stop-color:rgba(66,215,165,0)"/>
      </radialGradient>
    </defs>
    <style>
      .x22scan { animation: x22move 5s ease-in-out infinite; }
      @keyframes x22move { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(78px); } }
      @media (prefers-reduced-motion: reduce) {
        .x22scan { animation: none; transform: translateY(39px); }
      }
    </style>
    <ellipse cx="160" cy="100" rx="156" ry="94" fill="url(#x22r)"/>
    <g font-family="Hanken Grotesk" font-weight="700" font-size="9">
      <rect x="30" y="34" width="260" height="122" rx="10" fill="var(--surface-2)" stroke="var(--line)"/>
      <g fill="var(--ink-soft)" font-size="8" letter-spacing="0.8"><text x="44" y="52">REQUEST</text><text x="128" y="52">RELEVANCE</text><text x="194" y="52">SUFFICIENCY</text><text x="250" y="52">GROUNDED</text></g>
      <g fill="var(--ink)">
        <text x="44" y="76">q-0412</text><text x="44" y="100">q-0418</text><text x="44" y="124">q-0431</text><text x="44" y="148">q-0440</text>
      </g>
      <g font-size="10">
        <text x="148" y="76" fill="var(--accent)">yes</text><text x="214" y="76" fill="var(--accent)">yes</text><text x="266" y="76" fill="var(--accent)">yes</text>
        <text x="148" y="100" fill="var(--accent)">yes</text><text x="214" y="100" fill="var(--warm)">no</text><text x="266" y="100" fill="var(--accent)">yes</text>
        <text x="148" y="124" fill="var(--warm)">no</text><text x="214" y="124" fill="var(--warm)">no</text><text x="266" y="124" fill="var(--accent)">yes</text>
        <text x="148" y="148" fill="var(--accent)">yes</text><text x="214" y="148" fill="var(--accent)">yes</text><text x="266" y="148" fill="var(--warm)">no</text>
      </g>
      <g class="x22scan"><rect x="34" y="62" width="252" height="20" rx="5" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-opacity="0.6"/></g>
      <text x="160" y="186" text-anchor="middle" fill="var(--ink-soft)" font-size="9.5" font-weight="500">Each pattern of judgments points to a different failure.</text>
    </g>
  </svg>`,

  done: `<svg viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="38" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <path d="M28 43 l9 9 l19 -20" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`
};

/* ----------  CARDS  ---------- */
const cards = [

  /* 0: cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.3"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 3 · Retrieval · Chapter 22</div>
    <h1 class="reveal" style="font-size:34px">Diagnosing Retrieval Failures with MLflow Eval Logs</h1>
    <p class="lead reveal">Read retrieval judges, trace spans and Unity Catalog metadata together to name the failure mode, then apply the governance action that resolves it.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1: case file */
  { html: `
    <div class="eyebrow reveal">Case file · Larkspur Mutual</div>
    <h2 class="reveal" style="font-size:25px">The evaluation run came back mixed</h2>
    <p class="lead reveal" style="margin-bottom:14px">Larkspur ran <code>mlflow.genai.evaluate</code> on its claims assistant with retrieval judges and an evaluation set with expected facts. Three clusters of failures stand out.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Cluster 1</b>Questions about Quebec claims: retrieved chunks are relevant, but key facts are missing.</p></div>
      <div class="pill"><p><b>Cluster 2</b>Towing questions: relevant, sufficient chunks, but quoting last year's limits.</p></div>
      <div class="pill"><p><b>Cluster 3</b>A few answers state amounts that no retrieved chunk contains.</p></div>
    </div>` },

  /* 2: separate retrieval from generation */
  { html: `
    <div class="eyebrow reveal">The idea</div>
    <h2 class="reveal" style="font-size:25px">Three judges split the problem</h2>
    <p class="lead reveal" style="margin-bottom:14px">MLflow's built-in retrieval judges run on traces, so they can separate what was retrieved from what was generated.</p>
    <div class="pills reveal">
      <div class="pill"><p><b><code>RetrievalRelevance</code></b>Is the retrieved context relevant to the request? No ground truth needed.</p></div>
      <div class="pill"><p><b><code>RetrievalSufficiency</code></b>Does the context contain the facts needed? Requires expectations (ground truth).</p></div>
      <div class="pill"><p><b><code>RetrievalGroundedness</code></b>Is the response supported by the context? No ground truth needed.</p></div>
    </div>` },

  /* 3: step build, patterns */
  { steps: 4,
    html: `
    <div class="eyebrow reveal">Reading the patterns</div>
    <h2 class="reveal" style="font-size:24px">Which judge fails tells you where</h2>
    <div class="pills">
      <div class="pill" data-step="1" style="pointer-events:none"><p><b>Relevance fails</b>Retrieval brings back the wrong material: a search or index configuration problem (Chapter 21).</p></div>
      <div class="pill" data-step="2" style="pointer-events:none"><p><b>Relevant, but not sufficient</b>The right kind of content, but the needed facts are not reachable: missing from the corpus or the index, or out of the agent's access.</p></div>
      <div class="pill" data-step="3" style="pointer-events:none"><p><b>Relevant and sufficient, but wrong</b>The content itself is wrong: a stale or non-authoritative source. Check where the chunks came from.</p></div>
      <div class="pill" data-step="4" style="pointer-events:none"><p><b>Retrieval fine, groundedness fails</b>The model is inventing past its context: a generation problem, not a retrieval one.</p></div>
    </div>` },

  /* 4: step build, add UC metadata */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">Then check Unity Catalog</div>
    <h2 class="reveal" style="font-size:24px">Where did the chunks come from?</h2>
    <div class="pills">
      <div class="pill" data-step="1" style="pointer-events:none"><p><b>The RETRIEVER span</b>Shows which chunks came back, with their document IDs and source fields, for each failing request.</p></div>
      <div class="pill" data-step="2" style="pointer-events:none"><p><b>The index's source table</b>Is it the authoritative table, or a derived copy? Lineage in UC shows what it was built from; a <code>deprecated</code> certification tag is a red flag.</p></div>
      <div class="pill" data-step="3" style="pointer-events:none"><p><b>Coverage and access</b>Is the missing document set in the source at all? Does the agent's identity hold SELECT on what it should search?</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 5: quiz */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:18px">Towing questions pass relevance and sufficiency but fail Correctness: answers quote last year's limits. The RETRIEVER spans show chunks from <code>manual_2025_export</code>, tagged deprecated in UC. What failure mode is this?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span><span>Irrelevant retrieval from a poor search configuration</span></button>
      <button class="choice" data-correct="false"><span class="key">B</span><span>A generation failure: the model ignores its context</span></button>
      <button class="choice" data-correct="true"><span class="key">C</span><span>Retrieval from a non-authoritative, deprecated source</span></button>
      <button class="choice" data-correct="false"><span class="key">D</span><span>Insufficient context because too few chunks are retrieved</span></button>
    </div>
    <div class="feedback"><b>Correct.</b> The chunks are on topic and complete, and the answer follows them, but they come from a deprecated copy. B is tempting because Correctness fails, but the answer faithfully reflects the context it was given; the context is the problem.</div>` },

  /* 6: governance actions */
  { html: `
    <div class="eyebrow reveal">The fix is often governance</div>
    <h2 class="reveal" style="font-size:25px">Failure mode to action</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>Non-authoritative source</b>Repoint the index to the certified table, deprecate the copy, and revoke the agent's access to it.</p></div>
      <div class="pill"><p><b>Coverage gap</b>Bring the missing documents into the governed source table so the index includes them.</p></div>
      <div class="pill"><p><b>Access gap</b>Grant the agent's identity SELECT on the index or source it should use, and nothing broader.</p></div>
      <div class="pill"><p><b>Not governance</b>Relevance failures need query settings; groundedness failures need prompt or generation fixes.</p></div>
    </div>` },

  /* 7: quiz */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:18px">Quebec questions pass relevance but fail sufficiency; spans show only national wordings. The index's source is built from one volume, and Quebec wordings sit in another governed volume never added. Which action resolves this?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span><span>Add a reranker so Quebec content ranks higher</span></button>
      <button class="choice" data-correct="false"><span class="key">B</span><span>Increase the number of retrieved chunks</span></button>
      <button class="choice" data-correct="false"><span class="key">C</span><span>Add an instruction telling the agent to consider provincial differences</span></button>
      <button class="choice" data-correct="true"><span class="key">D</span><span>Add the Quebec volume to the pipeline feeding the index's source table, then sync</span></button>
    </div>
    <div class="feedback"><b>Right.</b> Relevant but insufficient, with the needed documents absent from the index's source, is a coverage gap; the fix is to bring that governed source in. A reranker (A) or a bigger top-k (B) can only reorder or add chunks the index already holds.</div>` },

  /* 8: decision */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="done-badge reveal">${A.done}</div>
    <div class="eyebrow reveal" style="text-align:center">Decision · Larkspur Mutual</div>
    <h2 class="reveal" style="text-align:center;font-size:25px">Three clusters, three actions</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:16px;font-size:15px">Quebec wordings join the governed pipeline (coverage gap). The towing index is repointed from the deprecated export to the certified manual table (source problem). Ungrounded amounts go to the prompt team (generation problem). The evaluation is re-run.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Judges</b>Relevance, sufficiency and groundedness split the failure.</p></div>
      <div class="pill"><p><b>Spans and UC</b>Show where the chunks came from.</p></div>
      <div class="pill"><p><b>Act</b>Often on governance, not on the model.</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ----------
   v2 adds opt-in, per-card step builds on top of the v1 card engine. A card
   with no `steps` field takes exactly the v1 paths below and renders and
   behaves identically; every v2 branch is guarded by `steps` being present. */
const ENGINE_VERSION = 'v2';
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};
const stepState = {};   // v2: current revealed step per card index (mirrors `answered`)

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

/* v2: apply step visibility for one card WITHOUT touching its .in class, so a
   step reveal never replays the card-entrance .reveal stagger. Cumulative for
   normal elements (data-step <= current). Captions append by default: inside
   .stepcaps they accumulate too (data-step="0" is the pre-first-tap caption),
   and captions behind the current step get .step-past (dimmed) while the
   current one stays at full strength. A .stepcap-swap container (or legacy
   .stepcap) opts into swap: only the caption whose data-step equals the
   current step is shown. */
function applySteps(idx) {
  const cur = stepState[idx] || 0;
  els[idx].querySelectorAll('[data-step]').forEach(function(nd) {
    const s = parseInt(nd.getAttribute('data-step'), 10);
    const swapCap = nd.closest && nd.closest('.stepcap-swap, .stepcap');
    const appendCap = !swapCap && nd.closest && nd.closest('.stepcaps');
    const on = swapCap ? (s === cur) : appendCap ? (s <= cur) : (s >= 1 && s <= cur);
    nd.classList.toggle('step-on', on);
    nd.classList.toggle('step-past', !!appendCap && on && s < cur);
  });
}

/* Card layout: the only place that adds/removes .in (and thus replays reveal).
   Called on card change, never on a step advance. */
function layout() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
    applySteps(idx);   // persists built state on revisit
  });
  glow.style.background = cards[i].glow || 'transparent';
}

/* Footer/button state only. Safe to call after a step advance (no reveal). */
function updateFooter() {
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  const total = c.steps || 0;
  const stepsLeft = total > 0 && (stepState[i] || 0) < total;
  if (stepsLeft) { nextBtn.disabled = false; nextBtn.textContent = (i === 0) ? 'Begin lesson' : 'Continue'; }
  else if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
}

function render() {
  layout();
  updateFooter();
  if (cards[i].quiz) wireQuiz(els[i], i);
}

/* v2: reveal the next step of the current card. Returns true if a step was
   consumed (so the caller does not also advance the card). */
function advanceStep(idx) {
  const total = cards[idx].steps || 0;
  if (!total) return false;
  const cur = stepState[idx] || 0;
  if (cur >= total) return false;
  stepState[idx] = cur + 1;
  applySteps(idx);
  updateFooter();
  return true;
}

/* v2: reveal every remaining step at once (swipe-left escape hatch). */
function skipSteps(idx) {
  const total = cards[idx].steps || 0;
  if (!total || (stepState[idx] || 0) >= total) return false;
  stepState[idx] = total;
  applySteps(idx);
  updateFooter();
  return true;
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

/* Primary action. On a step card mid-build this reveals the next step; once
   the steps are done (or on a card with none) it advances, honoring the quiz
   gate exactly as v1 did. Shared by the Continue button and ArrowRight. */
function handleNext() {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  if (advanceStep(i)) return;
  go(i + 1);
}
nextBtn.onclick = handleNext;
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* v2: tapping anywhere on a step card advances one step; once built, a tap
   advances the card (gate permitting). Cards with no steps ignore taps, so
   this listener is inert on v1-style cards. Elements with their own behavior
   (quiz choices, links) are skipped so a tap never double-fires. */
vp.addEventListener('click', e => {
  const c = cards[i];
  if (!c.steps) return;
  if (e.target.closest('.choice, a')) return;
  if ((stepState[i] || 0) < c.steps) { advanceStep(i); return; }
  if (!nextBtn.disabled && !c.last) go(i + 1);
});

/* Keys and swipes only move between cards (or, for a step card, between
   steps). Leaving the lesson always takes a deliberate tap, so a stray swipe
   on the final card cannot navigate away. ArrowRight mirrors the Continue
   button step-wise; ArrowLeft mirrors Back. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) handleNext();
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  // Swipe left: skip any remaining steps and advance in one gesture, honoring
  // the quiz gate (updateFooter re-derives nextBtn.disabled after the skip).
  if (dx < -50 && !cards[i].last) { skipSteps(i); if (!nextBtn.disabled) go(i + 1); }
  if (dx > 50 && i > 0) go(i - 1);
});

render();

/* Back to quiz (additive). A "Review: Chapter N" link in a quiz explanation
   opens this lesson with ?back=<quiz path>, plus &tab=1 when it opened in a
   new tab. Only then a small bar above the progress segments offers the way
   back: closing the tab returns to the untouched quiz tab, otherwise it goes
   to the quiz path, which restores the session. No param, no change. */
(function () {
  let back = null, tab = false;
  try {
    const p = new URLSearchParams(location.search), b = p.get('back');
    tab = p.get('tab') === '1';
    if (b && b.charAt(0) === '/' && b.charAt(1) !== '/' && b.charAt(1) !== '\\') {
      const u = new URL(b, location.href);
      if (u.origin === location.origin) back = u.pathname + u.search;
    }
  } catch (e) { return; }
  if (!back) return;
  const bar = document.createElement('div');
  bar.style.cssText = 'position:relative;z-index:7;padding:14px 20px 0;';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = '← Back to quiz';
  btn.style.cssText = 'font:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--surface-2,rgba(255,255,255,0.06));border:1px solid var(--line,rgba(255,255,255,0.1));border-radius:999px;padding:7px 14px;cursor:pointer;';
  btn.onclick = () => {
    if (tab) { try { window.close(); } catch (e) {} setTimeout(() => { location.href = back; }, 300); }
    else location.href = back;
  };
  bar.appendChild(btn);
  const tb = document.getElementById('topbar');
  tb.parentNode.insertBefore(bar, tb);
})();
</script>
</body>
</html>
