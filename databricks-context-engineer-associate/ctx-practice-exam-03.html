const E = {
  name: "Practice Exam 3",
  badge: "Databricks Context Engineer Associate",
  blurb: "Scenario-based questions across Unit 3, Knowledge Retrieval and Genie Configuration. Pick the single best answer.",
  coverage: "Covers Unit 3: all 10 chapters, one question per chapter. The live exam also includes multiple-selection items.",
  minutes: 20,
  pass: 70
};

const QUESTIONS = [

  /* Ch 14 - Unity Catalog Metadata as Agent Context (3.1) */
  { ref:{chapter:14}, q:`Larkspur Mutual's Genie space overcounts active policies. The SQL counts rows in <code>policies</code>, which holds one row per policy term, so renewed policies appear several times. The table has no comment, and its column comments are accurate. Which fix has the highest impact?`,
    opts:[
      "Rename the table to policy_terms_all_history",
      "Add a table comment stating the grain (one row per policy term) and that policy counts use distinct policy_id",
      "Add a sample question asking for the number of active policies",
      "Add more tables to the space so Genie has alternatives"
    ],
    correct:1,
    explain:`The missing metadata is the table's grain, and a table comment in Unity Catalog fixes it for every question and every consumer. A sample question (C) would fix one phrasing of one count, but other questions that aggregate the same table would still double count.` },

  /* Ch 15 - Curating Unity Catalog Objects for a Genie Space (3.2) */
  { ref:{chapter:15}, q:`Larkspur's distribution team often asks "how much premium did broker X write between two dates?" Finance has verified the SQL. The logic is not sensitive, and reviewers want to be able to read it. Which object should the Genie space include for this question?`,
    opts:[
      "The raw premium and broker tables, with a general instruction explaining the join",
      "A Unity Catalog SQL function that encapsulates the calculation",
      "A general instruction containing the verified SQL as text",
      "A parameterized query with broker and date parameters, marked as a trusted asset"
    ],
    correct:3,
    explain:`A verified query with slots for user-supplied values is a parameterized query, and as a trusted asset its answers come from that verified logic while the SQL stays readable. A UC function (B) would also return verified answers, but its strength is hiding logic Genie cannot see, which this team does not want.` },

  /* Ch 16 - Scoping a Task (3.6) */
  { ref:{chapter:16}, q:`Larkspur's reserving agent recommends an initial reserve for one new auto claim at a time. Available sources: the claim's FNOL record, the reserving guidelines table by loss type, the claim's payment history, the customer's marketing preferences, and every reserve recommendation made in the last ten years. Which set of context elements is necessary and sufficient?`,
    opts:[
      "The FNOL record, the reserving guidelines for that loss type, and the claim's payment history",
      "All five sources, so the recommendation is fully informed",
      "The FNOL record and ten years of past recommendations",
      "The reserving guidelines and the marketing preferences"
    ],
    correct:0,
    explain:`The FNOL record and payment history supply the claim's facts, and the guidelines supply the rule the recommendation must follow. Option B sounds thorough, but marketing preferences and ten years of past recommendations serve neither scoping nor execution and add noise to the window.` },

  /* Ch 17 - Pre-Inference vs Just-in-Time Agentic Retrieval (3.7, TO) */
  { ref:{chapter:17}, q:`Larkspur's underwriting assistant helps underwriters during a session. Some turns need a guideline passage, some need current exposure totals from Delta tables for a named account, and many are follow-ups that need no lookup. Which retrieval design fits?`,
    opts:[
      "Pre-inference: embed every turn and inject the top ten guideline chunks before each model call",
      "Pre-inference over an index that also contains nightly snapshots of exposure tables",
      "Just-in-time: a guideline retriever tool and an exposure query tool the model calls when a turn needs them",
      "No retrieval: load all guidelines and the account's exposures into the system prompt at session start"
    ],
    correct:2,
    explain:`Conditional need, live structured values and mixed sources are the just-in-time signals. Option B is tempting because it seems to cover both sources in one search, but embedding search over snapshots returns neither exact nor current totals, and it still injects chunks on turns that need nothing.` },

  /* Ch 18 - RAG over a Unity Catalog-Governed Document Corpus (3.4) */
  { ref:{chapter:18}, q:`Larkspur is adding litigation memos to its claims RAG pipeline. Only the legal team's agent may ever retrieve them; the general claims assistant must not. All chunks currently feed one AI Search index. The security team proposes a row filter on the chunk table. What design meets the requirement?`,
    opts:[
      "Apply the row filter; the index inherits it, so the claims assistant cannot see the memos",
      "Put the memos in a separate index built from their own governed table, and grant SELECT on it only to the legal agent's identity",
      "Keep one index and add an instruction telling the claims assistant to ignore legal memos",
      "Keep one index and lower num_results so memos rarely appear"
    ],
    correct:1,
    explain:`AI Search does not apply row- or column-level permissions, so separation has to come from the index boundary plus Unity Catalog grants on the index. Option A is the tempting assumption because UC governs the source table, but the index does not inherit the row filter.` },

  /* Ch 19 - Chunking Strategy (3.5, TO) */
  { ref:{chapter:19}, q:`Larkspur is indexing its adjuster training library: articles from several teams ranging from half a page to 40 pages, some with clear headings and many without. The embedding model accepts 8,192 tokens, and adjusters ask both broad "how should I approach..." questions and narrow lookups. Which chunking approach is the best starting point?`,
    opts:[
      "Recursive splitting at roughly 512 to 1,024 tokens with 10 to 15% overlap",
      "Structural chunks split on each heading",
      "One chunk per article",
      "Fixed 256-token chunks with no overlap"
    ],
    correct:0,
    explain:`Mixed lengths, unreliable headings and mixed query types are the signals for recursive splitting with overlap. Structural chunking (B) is attractive for documents with headings, but here headings are inconsistent, so chunks would be wildly uneven and many articles would not split at all.` },

  /* Ch 20 - AI Search Index Types (3.3, TO) */
  { ref:{chapter:20}, q:`Larkspur's claims-manual chunks are written to a Delta table by a nightly pipeline and served from a Delta Sync index with triggered sync. Answers are often days out of date, and an engineer proposes converting to a Direct Access index with upserts from the pipeline "so it stays fresh." What should the team do?`,
    opts:[
      "Convert to Direct Access, since programmatic upserts are always fresher",
      "Convert to Direct Access and compute embeddings in the pipeline",
      "Keep Delta Sync but rebuild the index from scratch each night",
      "Keep the Delta Sync index and add a sync task right after the nightly pipeline"
    ],
    correct:3,
    explain:`The content already lives in a governed Delta table, which is the Delta Sync signal, and the staleness comes from syncs that never run, not from the index type. Direct Access (A) would work, but the team would own every upsert, delete and embedding to solve a scheduling problem.` },

  /* Ch 21 - AI Search Freshness and Signal Quality (3.3) */
  { ref:{chapter:21}, q:`Larkspur's policy-wording index is current, and queries use hybrid search. Evaluation shows the chunk that answers the question is usually among the top 30 results but rarely in the top 5 passed to the model. Which change addresses this most directly?`,
    opts:[
      "Switch the index to continuous sync",
      "Pass the top 30 results to the model instead of the top 5",
      "Add a reranker to re-score the candidates before taking the top 5",
      "Switch from hybrid to pure vector search"
    ],
    correct:2,
    explain:`The right chunk is retrieved but ranked too low, which is the reranking signal; Databricks notes it typically adds under a second of latency. Passing 30 results (B) would include the right chunk, but it floods the window with mostly irrelevant text, trading a ranking problem for a context problem.` },

  /* Ch 22 - Diagnosing Retrieval Failures with MLflow Eval Logs (3.8) */
  { ref:{chapter:22}, q:`In Larkspur's evaluation of its claims assistant, a cluster of failing requests passes RetrievalRelevance and RetrievalSufficiency but fails RetrievalGroundedness: answers state settlement amounts that appear in none of the retrieved chunks. The index sources a certified table. What is the failure, and where does the fix belong?`,
    opts:[
      "A generation failure; fix the prompt or generation so answers stay within the retrieved context",
      "A coverage gap; add the missing settlement documents to the index's source table",
      "A non-authoritative source; repoint the index to a certified table",
      "A retrieval-ranking problem; add a reranker"
    ],
    correct:0,
    explain:`Retrieval is relevant and sufficient, and the source is certified, so the model is inventing beyond its context: a generation problem. Option B is tempting because amounts are "missing," but RetrievalSufficiency passed, so the needed facts were present; the answer added ones that were not.` },

  /* Ch 23 - Restricting Retrieval to Authoritative Sources (3.9) */
  { ref:{chapter:23}, q:`Before deploying Larkspur's renewals agent, the team finds two candidate indexes: one built on the certified renewals-guidelines table, and one built on an analyst's copy of it that has better column comments and is currently scoring slightly higher in evaluation. Which approach restricts retrieval to authoritative sources?`,
    opts:[
      "Deploy on the copy's index, since it scores higher",
      "Use the index on the certified table, move the improved comments onto the certified table, and remove the agent's access to the copy",
      "Deploy both indexes and instruct the agent to prefer the certified one",
      "Tag the analyst's copy as certified so both count as authoritative"
    ],
    correct:1,
    explain:`The copy's advantage is metadata, which belongs on the authoritative asset; the agent then retrieves only from the certified source. Option A is tempting because of the evaluation score, but the copy will drift from the source, and its score will not survive the next amendment.` }

];

    35:["lesson-35-disambiguating-tool-descriptions.html", "Disambiguating Overlapping Tool Descriptions"],
    36:["lesson-36-clearing-raw-tool-outputs.html", "Clearing Raw Tool Outputs"],
    37:["lesson-37-agent-skills.html", "Agent Skills: Moving Rare Capabilities Out of the System Prompt"]
  }
};
/* ===== EXAM PAYLOAD - END ===== */
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
