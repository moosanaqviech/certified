<style>
  /* =====================================================================
     EXAM SHELL - frozen. Do not edit anything in this style block.
     All per-exam customization lives in the EXAM PAYLOAD script section.
  ===================================================================== */
  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;
    --ink-soft:#a7a59f; --ink-faint:#6b6a66; --gold:#e3b84a; --green:#34d3a6; --red:#e8625c;
    --line:rgba(255,255,255,0.08);
    --display:"Fraunces",Georgia,serif; --body:"Hanken Grotesk",system-ui,sans-serif;

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:radial-gradient(1100px 650px at 50% -8%,#1a1d29 0%,transparent 58%),var(--bg);font-family:var(--body);color:var(--ink);min-height:100vh;line-height:1.5;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* sticky top */
  .top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .timer.warn{color:var(--gold);}
  .timer svg{opacity:.7;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  /* intro */
  .intro{text-align:center;margin:auto 0;padding:30px 0;}
  .intro .badge{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px;}
  .intro h1{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.05;letter-spacing:-0.02em;margin-bottom:16px;}
  .intro p{color:var(--ink-soft);font-size:15.5px;max-width:30em;margin:0 auto 14px;}
  .facts{display:flex;justify-content:center;gap:0;margin:24px 0 28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .fact{flex:1;padding:16px 10px;}
  .fact+.fact{border-left:1px solid var(--line);}
  .fact b{display:block;font-family:var(--display);font-size:22px;font-weight:600;color:var(--gold);}
  .fact span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#14110c;font-weight:700;font-size:16px;padding:15px 30px;border-radius:14px;border:none;cursor:pointer;transition:transform .15s ease;font-family:var(--body);}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.35;pointer-events:none;}

  /* question */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .qnum{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:0.04em;}
  .flag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-faint);background:transparent;border:1px solid var(--line);border-radius:100px;padding:5px 12px;cursor:pointer;transition:.15s;font-family:var(--body);}
  .flag.on{color:var(--gold);border-color:var(--gold);background:rgba(227,184,74,0.1);}
  .qtext{font-size:18px;line-height:1.5;font-weight:500;margin-bottom:20px;}
  .qtext code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:5px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);line-height:1.4;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:rgba(255,255,255,0.2);}
  .opt.sel{border-color:var(--gold);background:rgba(227,184,74,0.08);}
  .opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .opt.sel .key{background:var(--gold);color:#14110c;}

  /* review states */
  .opt.correct{border-color:var(--green);background:rgba(52,211,166,0.1);}
  .opt.correct .key{background:var(--green);color:#072018;}
  .opt.incorrect{border-color:var(--red);background:rgba(232,98,92,0.1);}
  .opt.incorrect .key{background:var(--red);color:#2a0a08;}
  .explain{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .explain b{color:var(--ink);}

  /* nav dots */
  .nav-dots{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 4px;justify-content:center;}
  .dot{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-faint);cursor:pointer;transition:.15s;font-family:var(--body);}
  .dot.answered{background:var(--surface-2);color:var(--ink);border-color:rgba(255,255,255,0.18);}
  .dot.current{border-color:var(--gold);color:var(--gold);}
  .dot.flagged{box-shadow:inset 0 0 0 2px rgba(227,184,74,0.5);}

  /* footer nav */
  .foot{display:flex;gap:12px;margin-top:24px;}
  .foot .btn{flex:1;}

  /* results */
  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:140px;height:140px;margin:6px auto 18px;}
  .scorering svg{transform:rotate(-90deg);}
  .scorering .tr{stroke:rgba(255,255,255,0.1);}
  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scorering .ctr b{font-family:var(--display);font-size:38px;font-weight:600;line-height:1;}
  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .verdict{font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:6px;}
  .verdict.pass{color:var(--green);}
  .verdict.fail{color:var(--gold);}
  .res p{color:var(--ink-soft);font-size:14.5px;max-width:28em;margin:0 auto 22px;}
  .res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}

  <div class="top">

      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6" stroke-linecap="round"/></svg>
      <span id="timerVal">20:00</span>

<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 3",
  badge: "AWS Data Engineer Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Most questions have one best answer; a few ask you to select two.",
  coverage: "Covers chapters 1-30: Unit 1 (ingestion and transformation), Unit 2 (data stores), and Unit 3 (operations and support).",
  minutes: 60,
  pass: 72
};

const QUESTIONS = [

  /* Ch 01 - Streaming vs batch ingestion */
  {
    q:`A fraud model scores card transactions and must see a cardholder's last five transactions within one second of authorization. The same transactions also feed a monthly chargeback report. An engineer proposes one nightly batch pipeline serving both. What is wrong with that?`,
    opts:[
      "Nothing: one pipeline is simpler, and the fraud model can read yesterday's data",
      "The fraud use case has a sub-second freshness requirement that a nightly batch cannot meet, so it needs a streaming path even though the report does not",
      "Batch pipelines cannot write to the same destination that a streaming pipeline writes to",
      "The monthly report requires streaming ingestion because it aggregates across a long window"
    ],
    correct:1,
    explain:`Two consumers with different freshness requirements need two clocks, even when they share a source and a destination. The fraud path streams; the monthly report is happy with batch. Collapsing both to nightly is the tempting simplification, but it silently makes the fraud model useless.`
  },

  /* Ch 02 - Kinesis Data Streams: shards, retention, replay */
  {
    q:`A Kinesis data stream in provisioned mode must absorb a steady 3 MB per second of ingest, and four separate consumer applications each need to read the full stream at that rate using the shared throughput model. What is the constraint the team must plan around?`,
    opts:[
      "Each consumer needs its own stream, because a shard can serve only one consumer",
      "Read capacity is unlimited in shared throughput mode, so only ingest matters",
      "Consumers must share the 1 MB per second write capacity of each shard",
      "Shared throughput gives each shard 2 MB per second of read capacity across all consumers, so four consumers reading 3 MB per second will contend unless enhanced fan-out is used"
    ],
    correct:3,
    explain:`A shard provides 1 MB per second in and 2 MB per second out, and in shared throughput mode every consumer draws from that same 2 MB per second. Four full-rate readers exceed it, so the fix is enhanced fan-out, which gives each registered consumer its own 2 MB per second per shard. Creating a stream per consumer is the tempting workaround, but it duplicates ingest cost and the producers' work.`
  },

  /* Ch 03 - Kinesis Data Streams vs Amazon MSK */
  {
    q:`A team debates Kinesis Data Streams versus Amazon MSK. Someone claims that only MSK preserves the order of related records. What is the accurate statement about ordering in the two services?`,
    opts:[
      "Both preserve ordering within a partition unit: a Kinesis shard and a Kafka partition, chosen by the partition key, so ordering is not the deciding factor",
      "Only Amazon MSK preserves ordering, because Kafka writes to a single log per topic",
      "Only Kinesis Data Streams preserves ordering, because shards are strictly sequential while Kafka partitions are not",
      "Neither preserves ordering, so applications must sort by timestamp after reading"
    ],
    correct:0,
    explain:`Both services guarantee order within one partition unit and neither guarantees it across the whole stream, so ordering does not separate them. The real deciding signal is the Kafka ecosystem: existing Kafka clients, connectors, or APIs point to MSK, and their absence points to Kinesis Data Streams.`
  },

  /* Ch 04 - Amazon Data Firehose */
  {
    q:`An Amazon Data Firehose stream delivers records to Amazon S3. A downstream team asks whether they can attach a second application that reads the same records independently and can rewind six hours after a bug. What should you tell them?`,
    opts:[
      "Register the second application as an enhanced fan-out consumer on the delivery stream",
      "Increase the delivery stream's retention period to 24 hours so a second reader can rewind",
      "Firehose does not retain records for consumers to read or replay, so events that need multiple independent readers and rewind belong in a Kinesis data stream",
      "Enable record format conversion, which keeps a replayable copy of each record"
    ],
    correct:2,
    explain:`Firehose is a delivery pipe: it buffers and writes to a destination, it does not keep a readable log, so it has no consumers, no offsets, and no replay. When multiple independent readers and rewind are requirements, the durable log is Kinesis Data Streams (a common pattern is a stream with Firehose attached as one of its consumers).`
  },

  /* Ch 05 - Amazon Managed Service for Apache Flink */
  {
    q:`A team must report, every minute, the total order value over the trailing 10 minutes. A colleague suggests a 10-minute tumbling window. Which TWO statements about the window choice are correct?`,
    opts:[
      "A sliding window of 10 minutes advancing every 1 minute produces the required output",
      "A 10-minute tumbling window emits a result only once every 10 minutes, not every minute",
      "Tumbling windows overlap, so consecutive results share most of their records",
      "A session window would emit a result every minute regardless of activity",
      "Only a global window with no boundaries can compute a trailing total"
    ],
    correct:[0,1],
    explain:`Tumbling windows are fixed and non-overlapping, so a 10-minute tumbling window fires every 10 minutes, which misses the once-a-minute requirement. A sliding window of the same size advancing by 1 minute emits every minute over the trailing 10, which is exactly what was asked. Session windows close on inactivity gaps, so their timing follows the data, not a fixed cadence.`
  },

  /* Ch 06 - Batch ingestion sources: S3, DMS, AppFlow */
  {
    q:`A team uses AWS DMS to replicate an on-premises SQL Server database into Amazon S3 with ongoing change data capture. Analysts complain that the S3 target holds many small files and they cannot tell inserts from deletes. What should the team understand about the target?`,
    opts:[
      "DMS cannot write change data to S3, only to database targets",
      "DMS writes CDC output as files carrying an operation column that marks each row as insert, update, or delete, so the consumer applies them, and target file settings control how often files are written",
      "The S3 target automatically applies changes in place, so the small files are a bug",
      "Analysts should query the S3 target with Amazon Athena, which merges CDC files automatically"
    ],
    correct:1,
    explain:`With an S3 target, DMS lands change records as files that include an operation indicator, and something downstream (a Glue job, or an Iceberg table) must apply them; S3 has no in-place update semantics. Expecting the target to merge changes itself is the common misconception here, and Athena reads files as they are rather than reconciling them.`
  },

  /* Ch 07 - AWS Glue for ETL */
  {
    q:`An AWS Glue job reads a catalog table partitioned by <code>dt</code> and filters to a single day in Spark, but CloudWatch shows the job reading the entire multi-year dataset from S3 before filtering. What most directly reduces the data read?`,
    opts:[
      "Apply a pushdown predicate on the partition column when creating the DynamicFrame, so Glue lists and reads only the matching partitions",
      "Increase the number of workers so the read finishes faster",
      "Switch the job from G.1X to G.2X worker type",
      "Enable job bookmarks so old partitions are skipped on later runs"
    ],
    correct:0,
    explain:`A pushdown predicate is evaluated against partition metadata before any files are opened, so unmatched partitions are never read. More or larger workers is the tempting fix because the job is slow, but it pays to read the same excess data faster. Bookmarks track processed data across runs, which is a different problem.`
  },

  /* Ch 08 - AWS Glue vs Amazon EMR */
  {
    q:`A platform team already operates a persistent Amazon EMR cluster for interactive notebooks and Hive workloads. A new requirement arrives: a small ETL job that runs for three minutes, four times a day, on an unrelated dataset. What is the cost-aware choice?`,
    opts:[
      "Add the job to the existing EMR cluster, since the cluster is already paid for",
      "Launch a dedicated transient EMR cluster for each of the four daily runs",
      "Rewrite the job in Amazon Redshift SQL to avoid Spark entirely",
      "Run it as an AWS Glue job, which bills only for the minutes it runs and needs no cluster"
    ],
    correct:3,
    explain:`Twelve minutes of work a day on an unrelated dataset is the serverless signal: Glue bills per job run with nothing to size. Adding it to the existing cluster is the tempting answer because the capacity looks free, but it couples an unrelated job to that cluster's scheduling, versions, and maintenance windows, and a transient cluster per run pays startup time repeatedly for a three-minute job.`
  },

  /* Ch 09 - Transforming data in Amazon Redshift */
  {
    q:`An executive dashboard runs the same expensive aggregation over a 4 billion row fact table many times a day, and new rows arrive continuously. The team wants the result precomputed and kept current without writing and scheduling refresh code. What fits?`,
    opts:[
      "A temporary table rebuilt at the start of each dashboard session",
      "A CTAS table rebuilt by a nightly scheduled job",
      "A materialized view with automatic refresh, so Redshift maintains the precomputed result as base data changes",
      "A standard view over the fact table, which caches its result after the first query"
    ],
    correct:2,
    explain:`A materialized view stores the computed result and, with automatic refresh, Redshift keeps it current as the base table changes, which is precisely "precomputed and maintained without refresh code". The nightly CTAS is the tempting alternative and does precompute, but it needs a schedule the team must own and leaves the result stale between runs. A standard view stores no result at all.`
  },

  /* Ch 10 - Step Functions vs Amazon MWAA */
  {
    q:`A Step Functions workflow calls a third-party API that intermittently returns HTTP 500. The team currently wraps the call in a Lambda function containing custom retry loops and error classification. What does Step Functions offer instead?`,
    opts:[
      "Retry and Catch fields declared on the state itself, with backoff rate and max attempts, so retry logic lives in the workflow definition rather than in function code",
      "An automatic global retry of the entire workflow whenever any state fails",
      "Nothing: retry logic must always be implemented inside the task code",
      "A dead-letter queue on the state machine that reruns failed executions on a schedule"
    ],
    correct:0,
    explain:`Declarative Retry and Catch on each state is a core reason to use Step Functions: error handling becomes part of the visible workflow instead of code hidden in a function. Re-running the whole workflow is the tempting mental model, but it would repeat already-successful steps and their side effects.`
  },

  /* Ch 11 - Event-driven pipelines with Amazon EventBridge */
  {
    q:`A pipeline currently runs a Lambda function every 5 minutes that lists an S3 prefix to see whether a partner file has landed. The file usually arrives once a day. The team wants to cut cost and latency at the same time. What should they do?`,
    opts:[
      "Reduce the polling schedule to once an hour",
      "Replace polling with an EventBridge rule on the S3 object created event that invokes the pipeline the moment the file lands",
      "Keep the schedule but raise the Lambda memory so each poll finishes faster",
      "Move the polling loop into a Step Functions Wait state"
    ],
    correct:1,
    explain:`Event-driven beats polling on both axes here: no invocations happen when nothing arrives, and processing starts on the object created event rather than up to five minutes later. Slowing the schedule is the tempting compromise, but it cuts cost by making latency worse, which is the opposite of what was asked.`
  },

  /* Ch 12 - Infrastructure as code and CI/CD */
  {
    q:`All pipeline resources are defined in CloudFormation, but an engineer changed a Glue job's timeout directly in the console during an incident. The team wants to detect this class of change across their stacks. What addresses it?`,
    opts:[
      "Enable S3 versioning on the bucket that stores the templates",
      "Re-deploy every stack nightly, whether or not anything changed",
      "Review CloudTrail management events by hand each week",
      "Run CloudFormation drift detection on the stacks, which compares live resource configuration against the template"
    ],
    correct:3,
    explain:`Drift detection exists for exactly this: it reports where a live resource no longer matches the stack template, so the console change surfaces as drift. Reviewing CloudTrail by hand is the tempting alternative and would show who made the call, but it is manual and tells you about events rather than about current configuration state.`
  },

  /* Ch 13 - Lambda for data processing */
  {
    q:`A Lambda function parses and compresses files, and profiling shows it is CPU-bound. It currently runs at 512 MB and takes 40 seconds per invocation. The team wants faster invocations and is willing to test a higher memory setting. Why can this reduce cost as well as duration?`,
    opts:[
      "Lambda charges per invocation only, so duration has no effect on cost",
      "Higher memory settings receive a discounted per-millisecond rate",
      "Lambda allocates CPU in proportion to memory, so a CPU-bound function can finish enough faster that the shorter duration offsets the higher per-millisecond price",
      "Raising memory enables provisioned concurrency automatically, which is billed at a lower rate"
    ],
    correct:2,
    explain:`Memory is the only performance dial in Lambda, and CPU scales with it, so a CPU-bound function often runs disproportionately faster at a higher setting and can cost the same or less overall. The claim that cost is per invocation only is the tempting simplification, but Lambda bills memory multiplied by duration.`
  },

  /* Ch 14 - Choosing a data store: Redshift vs DynamoDB vs RDS */
  {
    q:`An internal tool needs a store for roughly 200 GB of highly relational data: a dozen tables, frequent joins across them, ad hoc queries whose shape is not known in advance, and strict transactional consistency. Traffic is moderate and predictable. Which store fits?`,
    opts:[
      "Amazon DynamoDB, using a single-table design with secondary indexes for each query",
      "Amazon RDS, which gives a relational engine with joins, ACID transactions, and flexible ad hoc SQL",
      "Amazon Redshift, since analytical warehouses handle joins efficiently",
      "Amazon S3 with Amazon Athena, since 200 GB is small for a data lake"
    ],
    correct:1,
    explain:`Unpredictable query shapes plus joins plus transactions is the relational profile, and at moderate, predictable traffic RDS is the straightforward fit. DynamoDB is the tempting distractor because it scales well, but it requires access patterns to be known up front so keys and indexes can be modeled for them, and it does not join.`
  },

  /* Ch 15 - Data lakes on S3 */
  {
    q:`A data lake on S3 stores five years of clickstream as uncompressed JSON in a single flat prefix. Athena queries filter almost exclusively by event date and select 6 of the 80 available columns. Which TWO changes most reduce the bytes each query scans?`,
    opts:[
      "Partition the data by event date so queries prune to the days they need",
      "Convert the files to a columnar format such as Apache Parquet so only the selected columns are read",
      "Enable S3 Versioning on the bucket",
      "Move the objects to S3 Standard-IA",
      "Enable S3 Transfer Acceleration on the bucket"
    ],
    correct:[0,1],
    explain:`Partitioning prunes at the directory level so filtered-out days are never opened, and a columnar format means a query touching 6 of 80 columns reads roughly that fraction of each file. The storage class and Transfer Acceleration options change cost and transfer speed, not the amount of data a query must scan.`
  },

  /* Ch 16 - AWS Glue Data Catalog and crawlers */
  {
    q:`An organization runs Athena for ad hoc analysis, Redshift Spectrum for warehouse-side joins, and Amazon EMR for Spark jobs, all over the same S3 datasets. Each team currently maintains its own table definitions and they have drifted apart. What is the correct fix?`,
    opts:[
      "Point all three engines at the AWS Glue Data Catalog as a shared metastore so one table definition serves every engine",
      "Have each team run a crawler on its own schedule so definitions refresh more often",
      "Copy the datasets into three buckets, one per engine, so each team owns its own copy",
      "Standardize on Athena and have the other two teams query through it"
    ],
    correct:0,
    explain:`One definition, every engine, is exactly what the Glue Data Catalog provides: Athena, Redshift Spectrum, and EMR all read it, so drift becomes impossible by construction. More frequent per-team crawlers is the tempting fix, but it keeps three separate definitions and simply refreshes each of them faster.`
  },

  /* Ch 17 - Schema discovery and schema evolution */
  {
    q:`A daily ingest occasionally adds a new optional column to its JSON output. The catalog table must reflect the addition automatically, but a crawler must never remove columns that stopped appearing in recent files. How is that configured?`,
    opts:[
      "Recreate the table with each crawler run so the schema always matches the newest files",
      "Turn the crawler off and update the table manually whenever a column appears",
      "Set the crawler's schema change policy to update the table for new columns, and configure it to ignore or log deletions rather than apply them",
      "Set the crawler to run only once, since a schema is fixed after the first crawl"
    ],
    correct:2,
    explain:`Crawler schema change policies control update and delete behavior separately, so additive change can be applied automatically while deletions are ignored or logged. Recreating the table each run is the tempting way to stay current, but it would drop columns absent from the newest files, which is precisely the outcome to avoid.`
  },

  /* Ch 18 - AWS Schema Conversion Tool */
  {
    q:`A company is consolidating an on-premises Teradata data warehouse into Amazon Redshift. The warehouse has hundreds of tables plus stored procedures and vendor-specific SQL. Which combination of tools does the job?`,
    opts:[
      "AWS Glue crawlers to build the Redshift schema, then COPY for the data",
      "AWS DMS alone, which converts warehouse schemas as part of the migration",
      "Amazon Redshift COPY alone, which infers table structures from the source files",
      "AWS SCT to convert the schema and the procedural code to Redshift dialect, then AWS DMS to move the data"
    ],
    correct:3,
    explain:`SCT converts structure and code between different engines, including data warehouse migrations to Redshift; DMS then moves the rows. Expecting DMS to do both is the frequent mix-up: DMS is a data movement and replication service, so schema and procedural code conversion is not its job.`
  },

  /* Ch 19 - Open table formats: Apache Iceberg on S3 */
  {
    q:`A nightly job overwrote an Iceberg table with a bad transformation, and analysts noticed the next morning. What does Iceberg let the team do?`,
    opts:[
      "Roll the table back to the snapshot that was current before the bad write, and query earlier snapshots to compare",
      "Nothing, unless S3 Versioning was enabled on every data file in the bucket",
      "Restore from the previous night's full table backup, which Iceberg takes automatically",
      "Undo the write only if it is still inside a 24-hour transaction window"
    ],
    correct:0,
    explain:`Every Iceberg commit produces a snapshot, and snapshots are what make both time travel and rollback possible without restoring anything. S3 Versioning is the tempting answer since it also keeps old copies, but it works at the object level with no notion of a consistent table state, so reassembling a coherent table version by hand would be guesswork.`
  },

  /* Ch 20 - S3 Lifecycle and storage class transitions */
  {
    q:`A dataset's access pattern is genuinely unpredictable: some objects are read daily for months, others are never touched again. The team wants automatic cost optimization, no retrieval fees, and no lifecycle rules to maintain. Which storage class fits?`,
    opts:[
      "S3 Standard-IA, with a lifecycle rule transitioning objects after 30 days",
      "S3 Intelligent-Tiering, which moves objects between access tiers automatically based on usage and charges no retrieval fees",
      "S3 One Zone-IA, which is cheaper than Standard-IA for infrequently used data",
      "S3 Glacier Instant Retrieval, which offers millisecond access at archive prices"
    ],
    correct:1,
    explain:`Intelligent-Tiering exists for unknown or changing access patterns: it monitors objects and moves them between tiers for a small monitoring fee, with no retrieval charges and no rules to maintain. Standard-IA with a lifecycle rule is the tempting manual equivalent, but it assumes objects go cold on a predictable schedule and it does charge retrieval fees when that assumption is wrong.`
  },

  /* Ch 21 - DynamoDB TTL, versioning, and lifecycle */
  {
    q:`A DynamoDB table uses TTL to expire records after 90 days, but compliance now requires that expired records be archived to S3 rather than simply disappearing. What is the standard pattern?`,
    opts:[
      "Disable TTL and run a nightly scan that copies then deletes old items",
      "Enable point-in-time recovery, which writes expired items to S3 as they age out",
      "Enable DynamoDB Streams and process TTL deletions, which appear as REMOVE records, writing each to S3 before it is gone for good",
      "Add an S3 Lifecycle rule to the table's underlying storage"
    ],
    correct:2,
    explain:`TTL deletions surface in DynamoDB Streams as REMOVE records that are distinguishable from user deletes, so a stream consumer can archive each item as it expires. The nightly scan is the tempting alternative, but a full table scan is expensive and reintroduces exactly the cleanup job TTL was adopted to remove.`
  },

  /* Ch 22 - Redshift distribution and sort keys */
  {
    q:`Analysts almost always filter a 3 TB Redshift fact table by <code>event_date</code>, yet the query plan shows nearly every block being read. The table already uses an appropriate distribution key for its joins. What most directly cuts the data read?`,
    opts:[
      "Change the distribution style to ALL so every node holds the full table",
      "Add more nodes to the cluster so the scan is spread wider",
      "Create a materialized view for each dashboard query",
      "Define <code>event_date</code> as the sort key, so zone maps let Redshift skip blocks outside the filtered range"
    ],
    correct:3,
    explain:`Sort keys drive the zone maps that record each block's min and max values, so a filter on the sort key lets Redshift skip blocks entirely instead of reading them. Adding nodes is the tempting reflex, but it parallelizes the same excessive scan rather than reducing it, and ALL distribution on a 3 TB table would replicate it to every node.`
  },

  /* Ch 23 - Automating data processing with Glue and Step Functions */
  {
    q:`A pipeline crawls a new S3 prefix, runs a cleansing Glue job, then runs two aggregation Glue jobs in parallel, and every component is a Glue resource. The team wants the whole sequence visible as one unit with per-run history. What is the simplest fit?`,
    opts:[
      "A Step Functions state machine invoking each Glue API call in turn",
      "An AWS Glue workflow, which models the crawler and jobs as one DAG with triggers between them and a run history per execution",
      "An EventBridge rule per component, each firing the next on completion",
      "A Lambda function that calls the Glue APIs in order and polls for completion"
    ],
    correct:1,
    explain:`When every step is a Glue resource, a Glue workflow keeps the orchestration inside the service and gives one run view across the crawler and jobs. Step Functions is the tempting general answer and would work, but it adds a second service to operate for a pipeline that never leaves Glue; it earns its place once the pipeline branches out to Lambda, EMR, or other services.`
  },

  /* Ch 24 - Querying data with Amazon Athena */
  {
    q:`A finance team's Athena bill has grown sharply and an audit finds analysts running unbounded <code>SELECT *</code> queries over a raw CSV dataset. Which TWO controls directly limit what those queries can cost?`,
    opts:[
      "Set a per-query data scanned limit on the analysts' Athena workgroup",
      "Use CTAS to publish a partitioned, Parquet-formatted copy of the dataset and point analysts at it",
      "Increase the Athena query timeout so queries are less likely to be retried",
      "Move the dataset to S3 Glacier Instant Retrieval to lower storage cost",
      "Grant the analysts read-only IAM permissions on the bucket"
    ],
    correct:[0,1],
    explain:`A workgroup data usage control caps the bytes a single query may scan, which stops one careless query from running up the bill, and republishing the data as partitioned Parquet cuts the bytes every well-formed query scans. The storage class and IAM options change storage cost and access rights, neither of which affects Athena's per-byte-scanned charge.`
  },

  /* Ch 25 - Redshift Spectrum: federated and cross-service queries */
  {
    q:`Before Redshift Spectrum can query Parquet files sitting in S3, what has to exist?`,
    opts:[
      "An external schema in Redshift referencing a Data Catalog database, plus external tables describing the S3 data, and an IAM role Redshift can assume to read the bucket",
      "A COPY of the S3 files into a temporary Redshift table, refreshed before each query",
      "An AWS DMS task replicating the S3 files into the cluster's local storage",
      "A VPC endpoint policy that grants the analysts direct S3 access from their laptops"
    ],
    correct:0,
    explain:`Spectrum queries data in place through external schemas and tables backed by the Glue Data Catalog, with an attached IAM role providing the cluster's access to S3. Copying the files in first is the tempting answer, but loading the data is precisely what Spectrum is chosen to avoid.`
  },

  /* Ch 26 - Log analysis with Athena and OpenSearch Service */
  {
    q:`A platform team needs both a live operations dashboard with sub-minute alerting on application logs, and cheap ad hoc investigation across three years of the same logs. What architecture fits?`,
    opts:[
      "Index all three years into Amazon OpenSearch Service, since it can also serve historical queries",
      "Query everything with Amazon Athena, adding a one-minute scheduled query to drive the dashboard",
      "Index a recent window (for example 30 days) into OpenSearch for live dashboards and alerting, and keep the full history in S3 for Athena",
      "Store the logs only in CloudWatch Logs and use metric filters for both needs"
    ],
    correct:2,
    explain:`The two requirements have opposite cost profiles, so most teams run both: OpenSearch indexes a recent window for real-time search and alerting, while S3 plus Athena holds the long tail at storage prices. Indexing all three years is the tempting single-tool answer, but keeping years of logs on searchable index storage is far more expensive than the occasional Athena scan it replaces.`
  },

  /* Ch 27 - Monitoring pipelines with CloudWatch */
  {
    q:`A Lambda consumer of a Kinesis data stream keeps a healthy invocation count and no errors, yet downstream dashboards are hours behind. Which CloudWatch signal reveals the problem, and what should be alarmed on?`,
    opts:[
      "The Errors metric, alarmed when it exceeds zero",
      "The IteratorAge metric, alarmed when it exceeds a threshold, because it shows how old the records being processed are",
      "The Invocations metric, alarmed when it drops below the daily average",
      "The Duration metric, alarmed at the function's configured timeout"
    ],
    correct:1,
    explain:`IteratorAge measures how far behind the stream a consumer is running, so it is the metric that exposes a consumer keeping up with no errors but processing stale records. Errors and Invocations look healthy in precisely this scenario, which is why alarming on them alone lets the lag go unnoticed.`
  },

  /* Ch 28 - Auditing with CloudTrail */
  {
    q:`A team enables CloudTrail data events for every S3 bucket and every Lambda function in the account, and the trail's storage and delivery costs jump sharply. What is the right adjustment?`,
    opts:[
      "Disable the trail entirely and rely on CloudWatch metrics",
      "Switch the trail to a single Region so fewer events are recorded",
      "Reduce the S3 Lifecycle retention on the log bucket to one day",
      "Keep management events on account-wide, and scope data events to the specific buckets and prefixes that actually need object-level auditing"
    ],
    correct:3,
    explain:`Management events are low volume and belong on everywhere; data events are per-object-operation and are the volume driver, so they should be scoped to the sensitive resources that need them. Cutting log retention to a day is the tempting cost fix, but it destroys the audit history the trail exists to provide.`
  },

  /* Ch 29 - Data quality checks with AWS Glue DataBrew */
  {
    q:`A daily feed must be blocked from the curated zone whenever more than 1% of <code>order_total</code> values are null or <code>status</code> falls outside an allowed set. Which TWO statements describe how to implement and act on this?`,
    opts:[
      "Define the conditions as rules in a ruleset and evaluate them against each incoming batch",
      "Wire the validation outcome into the pipeline so a failing batch stops promotion instead of being written to the curated zone",
      "Use a DataBrew profile job alone, since profiling blocks a dataset when statistics look wrong",
      "Apply a DataBrew recipe, which rejects rows that violate the expected schema",
      "Rely on the Glue crawler, which fails when column values fall outside their historical range"
    ],
    correct:[0,1],
    explain:`A ruleset turns expectations into explicit pass or fail conditions evaluated per batch, and the check only protects anything if its outcome gates promotion in the pipeline. Profile jobs describe a dataset's statistics but do not enforce thresholds, recipes transform data rather than reject it, and crawlers only infer structure.`
  },

  /* Ch 30 - Data skew and sampling techniques */
  {
    q:`A Glue Spark job's stage detail shows 199 tasks finishing in under a minute while one task runs for two hours and then fails with an out-of-memory error. What does this pattern indicate, and what addresses the cause?`,
    opts:[
      "Data skew: one key holds a disproportionate share of the rows, so the fix is to spread that key, for example by salting it or repartitioning, rather than to enlarge the workers",
      "Insufficient parallelism: raising the number of workers will split the long task",
      "A corrupt input file: re-running the job will resolve it",
      "Network throttling on S3: enabling S3 Transfer Acceleration will resolve it"
    ],
    correct:0,
    explain:`One task doing all the work while the rest idle is the signature of skew, where a single key concentrates the rows in one partition. Adding workers is the tempting fix, but a single skewed partition still lands on one executor, so the long task stays long; the key itself has to be spread.`
  }

];

/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
