<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Full Mock 2",
  badge: "AWS Data Engineer Associate",
  blurb: "Sit it cold, under exam conditions: sixty-five scenario questions in 130 minutes, sampled across all four domains at their official weights, no feedback until you submit. Most questions have one best answer; a few ask you to select two.",
  coverage: "Sealed mock 2 of 2, new scenarios throughout. Samples all 40 chapters by domain weight: Ingestion and Transformation 34%, Data Store Management 26%, Operations and Support 22%, Security and Governance 18%. None of these questions appear in the unit practice exams or in Full Mock 1.",
  minutes: 130,
  pass: 72
};
const QUESTIONS = [
  /* Coverage plan (65 questions, official domain weights, every chapter at least once;
     5 select-two items at positions 9, 22, 37, 48 and 61):
     Domain 1 Ingestion and Transformation (34%): 22 questions, Ch 1 (x2), 2, 3, 4 (x2), 5, 6 (x2), 7 (x2), 8, 9 (x2), 10, 11 (x2), 12, 13 (x2), 37 (x2)
     Domain 2 Data Store Management (26%): 17 questions, Ch 14 (x2), 15, 16, 17, 18, 19 (x3), 20, 21 (x2), 22, 38 (x2), 39 (x2)
     Domain 3 Operations and Support (22%): 14 questions, Ch 23, 24 (x3), 25, 26 (x2), 27 (x2), 28 (x2), 29, 30 (x2)
     Domain 4 Security and Governance (18%): 12 questions, Ch 31 (x2), 32 (x2), 33, 34, 35, 36 (x3), 40 (x2) */
  /* Ch 14 - Choosing a data store: Redshift vs DynamoDB vs RDS */
  {
    q:`A ride-hailing company is reviewing a new team member's storage design for three workloads. The trip-state service reads and writes the current state of a trip by <code>trip_id</code> at about 100,000 requests per second with single-digit millisecond latency and an attribute set that varies by trip type. Driver payroll needs multi-table transactions with joins and strict consistency at moderate volume. City planners run quarterly demand analyses over three years of completed trips. Which assignment fits?`,
    opts:[
      "DynamoDB for trip state, Amazon RDS for payroll, Amazon Redshift for the demand analyses",
      "Amazon Redshift for all three, scaled with more nodes as request rates grow",
      "DynamoDB for trip state and payroll, Amazon Redshift for the demand analyses",
      "Amazon RDS for trip state and payroll, Amazon Redshift for the demand analyses, since both operational workloads are relational in nature and a single engine simplifies operations"
    ],
    correct:0,
    explain:`The access pattern names the store: millisecond key lookups at massive scale with a flexible item shape are DynamoDB, relational transactions with joins and ACID guarantees are RDS, and aggregations over years of history are OLAP in a columnar warehouse. Putting trip state on RDS (the tempting consolidation) asks a row-based transactional engine to serve 100,000 key reads per second with a schema that changes per trip, which is the workload DynamoDB exists for, while payroll on DynamoDB would push multi-table joins into application code.`
  },
  /* Ch 05 - Amazon Managed Service for Apache Flink */
  {
    q:`A fintech's fraud team runs a hand-written Kinesis Data Streams consumer on two EC2 instances that keeps per-account rolling totals in memory. In a post-incident review the team reports that an instance crash lost the running totals, that they have since written their own checkpointing and state-recovery code, and that adding shards requires manual rebalancing of the consumer. What should the reviewer recommend?`,
    opts:[
      "Keep the custom consumer but persist the running totals to DynamoDB after every record, which gives durable state and exactly-once recovery without changing the consumer framework the team already understands",
      "Replace the consumer with Amazon Data Firehose, which maintains the totals between deliveries",
      "Move the logic to Amazon Managed Service for Apache Flink, which provides keyed state, windowing, checkpointing and scaling as the framework",
      "Add a third EC2 instance so a crash no longer loses the state"
    ],
    correct:2,
    explain:`Three ways exist to work with a stream, and a hand-rolled consumer is the one where the team reinvents state, fault tolerance and scaling itself; Managed Flink is the middle ground that gives the code those things, with checkpoints protecting the running totals and capacity scaling for them. Bolting durable state onto the custom consumer (the tempting incremental fix) keeps the team in the business of writing a stream-processing framework, and Firehose has no memory across records at all.`
  },
  /* Ch 28 - Auditing with CloudTrail */
  {
    q:`A fintech's post-incident review already knows which IAM role changed an S3 bucket policy that exposed customer statements. The regulator now asks for two more facts: the network location the call came from and the exact policy document that was applied. Where does the team get both?`,
    opts:[
      "From S3 server access logs on the bucket, which record every management action with the caller's IP address and attach the full request body for policy changes",
      "From CloudWatch metrics for the bucket, which record the policy version",
      "From AWS Config, which is the only service that records request parameters",
      "From the CloudTrail event for the PutBucketPolicy call, whose fields include the source IP address and the request parameters"
    ],
    correct:3,
    explain:`A CloudTrail event carries the context needed to reconstruct a change: the identity, the action, the time, the source IP address, the request parameters (here the new policy document) and the response. Server access logs (the tempting log source) record object-level requests against the bucket's contents, not the control-plane call that changed its policy, and CloudWatch metrics are numbers, not an audit record.`
  },
  /* Ch 36 - Data privacy and governance frameworks */
  {
    q:`A game studio wants to release a dataset of in-game behaviour to university researchers. The privacy office requires that no record can ever be traced back to a player, by anyone, under any process, and the studio has no need to re-link records later. Which de-identification approach fits?`,
    opts:[
      "Pseudonymization, replacing player IDs with tokens and keeping the token mapping under a protected key for future lawful requests",
      "Anonymization, irreversibly stripping identifiers so the data cannot be linked to a person",
      "Encrypting the player ID column with a customer managed KMS key before publishing the files",
      "Masking player IDs in the published view while keeping the raw IDs in the same table for internal use"
    ],
    correct:1,
    explain:`When re-identification must be impossible and nobody needs to re-link, anonymization is the right tool: it removes the link to a person permanently, which is what open analytics data calls for. Pseudonymization (the tempting choice because it is the common privacy technique) deliberately keeps a protected mapping so re-identification stays possible, which violates the requirement that nobody can ever trace a record back.`
  },
  /* Ch 02 - Kinesis Data Streams: shards, retention, replay */
  {
    q:`A game studio is capacity planning a Kinesis data stream in provisioned mode for match telemetry: 4,500 records per second, each about 200 bytes, roughly 0.9 MB per second in total. The engineer provisions one shard because the volume is under 1 MB per second, and producers are throttled immediately at launch. What was missed?`,
    opts:[
      "The 1 MB per second figure is the read limit; writes are limited to 2 MB per second per shard, so two shards were needed",
      "The partition key must be a low-cardinality value in provisioned mode so records aggregate onto one shard",
      "A shard also caps writes at 1,000 records per second, so this record rate needs at least five shards",
      "Provisioned mode has a minimum of ten shards for new streams, so the stream should have been created in on-demand mode, which absorbs any record rate without shard planning"
    ],
    correct:2,
    explain:`A shard's write capacity has two ceilings, 1 MB per second or 1,000 records per second, and whichever is hit first throttles; many small records exhaust the record limit long before the byte limit, so 4,500 records per second needs at least five shards. Reading the limits the other way around (the tempting option) confuses the 2 MB per second read limit with the write side, and a low-cardinality key would create a hot shard rather than relieve one.`
  },
  /* Ch 19 - Open table formats: Apache Iceberg on S3 */
  {
    q:`An e-commerce marketplace's pricing dashboard reads a product table stored as plain Parquet files in S3. Twice a day a Glue job rewrites the table in place, and during those minutes the dashboards show half the catalog or fail on missing files. A post-incident review asks what would give readers a consistent view during writes without keeping a second copy of the data.`,
    opts:[
      "Store the table as Apache Iceberg, whose atomic snapshot commits mean readers see the old or the new version, never a mix",
      "Run the Glue job with more workers so the rewrite window shrinks",
      "Enable S3 Versioning so readers fall back to the previous object version",
      "Write the new files to a dated prefix and have the dashboards switch their S3 path once the job's final file lands, which avoids readers seeing partial output"
    ],
    correct:0,
    explain:`A folder of files has no atomic commit, so readers observe whatever mix of old and new objects exists mid-write; Iceberg's metadata layer publishes a new snapshot in one step, so a query pins a complete version. The dated-prefix switch (the tempting workaround) rebuilds a crude version of that idea by hand, needs every reader to coordinate the path change, and still leaves a window where the catalog points at an incomplete prefix.`
  },
  /* Ch 11 - Event-driven pipelines with Amazon EventBridge */
  {
    q:`A logistics company receives carrier webhook messages on an Amazon SQS queue. Only messages whose status is delivered should start a Step Functions workflow, and each should be enriched with the shipment's customer record (looked up by a Lambda function) before the workflow starts. The team wants no polling code of its own. Which EventBridge feature fits?`,
    opts:[
      "An EventBridge rule on the default event bus with an event pattern on the status field, since rules can read SQS queues directly",
      "EventBridge Scheduler invoking a Lambda function every minute to drain the queue and start workflows for the matching messages, which keeps the routing logic in one place",
      "An EventBridge archive with replay, so matching messages are replayed into the workflow",
      "An EventBridge Pipe with the queue as source, a filter on status, a Lambda enrichment step, and Step Functions as the target"
    ],
    correct:3,
    explain:`Pipes is the point-to-point half of EventBridge: one source (here an SQS queue), optional filtering, optional enrichment, one target, with the polling of the queue handled by the service. A scheduled Lambda drain (the tempting answer) is the polling loop the team wants to eliminate, and an event bus rule cannot consume from a queue; a queue is a Pipes source, not a bus event source.`
  },
  /* Ch 24 - Querying data with Amazon Athena */
  {
    q:`A utility's operations dashboard issues the same six Athena queries every two minutes to refresh its tiles. The underlying partitions change only once an hour, yet every refresh scans the full day's data and the Athena bill has become the team's largest line item. What cuts the cost most directly without changing the dashboard's queries?`,
    opts:[
      "Add a per-query data-scan limit to the dashboard's workgroup, which cancels any refresh before it reaches the expensive part of the scan and keeps the bill predictable",
      "Move the data to a cheaper S3 storage class, since Athena charges by storage tier",
      "Convert the dashboard's tables to a Spark-enabled workgroup, where notebooks are billed by DPU-hours rather than bytes scanned",
      "Enable query result reuse on the workgroup so repeated identical queries return the cached result and scan nothing"
    ],
    correct:3,
    explain:`Athena bills by bytes scanned, and result reuse lets an identical recent query return its cached result without scanning at all, which is exactly the shape of a dashboard that re-asks the same questions far more often than the data changes. A scan limit (the tempting guardrail) cancels a query that runs past the cap rather than making the refresh cheaper, so the tiles would simply fail, and storage class changes what storage costs, not what a query scans.`
  },
  /* Ch 09 - Transforming data in Amazon Redshift: ELT patterns */
  {
    q:`A bank's nightly load into Amazon Redshift uses a single COPY command over one 60 GB uncompressed CSV file in S3 and takes four hours, while the cluster's CPU sits mostly idle. The export format is under the team's control. Which TWO changes speed up the load? (Select TWO.)`,
    opts:[
      "Split the export into many compressed files (ideally a multiple of the cluster's slice count) so COPY loads them in parallel across every slice",
      "Replace COPY with a series of INSERT statements issued from a Lambda function, which spreads the load over time",
      "Export the data as columnar Parquet instead of uncompressed CSV, so COPY moves far fewer bytes",
      "Load through Redshift Spectrum by creating an external table and running SELECT * so the Spectrum fleet does the work",
      "Run the COPY from an Amazon EMR cluster so Spark reads the file in parallel before handing it to Redshift"
    ],
    correct:[0,2],
    explain:`COPY is fast because it loads in parallel across every slice, but one file is one unit of work, so a single 60 GB file leaves most of the cluster idle; splitting the export into many compressed files and using a columnar format lets every slice work at once on far fewer bytes. Row-by-row INSERT statements (the tempting rewrite) are the slowest way to load Redshift by a wide margin, and COPY runs inside Redshift, so EMR cannot speed it up.`
  },
  /* Ch 32 - IAM policies vs Lake Formation permissions */
  {
    q:`A marketplace exposes a shared orders table through Athena to the analysts of its 5,000 third-party sellers. Each seller may see only its own rows, and the platform team wants one table and one grant model rather than per-seller copies. Which approach fits?`,
    opts:[
      "An IAM policy per seller with a condition on the seller_id value in each object",
      "Lake Formation row-level data filters on the table, one per seller, granted to each seller's role",
      "A separate S3 prefix per seller written by a nightly Glue job, with a bucket policy per prefix, which keeps Athena queries fast because each seller scans only its own data and never touches a shared table",
      "An Athena view per seller with a WHERE clause, relying on analysts to use their own view"
    ],
    correct:1,
    explain:`Filtering rows per principal is the grain Lake Formation exists for: a data filter on the catalog table restricts each seller's role to its own rows, enforced by the engine, on one table. Per-seller prefixes (the tempting workaround) turn one table into 5,000 copies to load and govern, and IAM operates on whole objects, so a condition on a value inside a row is not something it can express.`
  },
  /* Ch 07 - AWS Glue for ETL */
  {
    q:`A logistics company's hourly Glue job uses job bookmarks to process only new shipment files. After a logic fix, the team re-runs the job over last month's files to regenerate the output, but the run finishes in seconds and writes nothing, although the source files are still in S3. What explains this, and what should they do?`,
    opts:[
      "The bookmark records those files as already processed; reset or rewind the bookmark (or run the backfill with bookmarks disabled) so the run reads them again",
      "The files have moved to a colder storage class and Glue skips them; restore them first",
      "Job bookmarks only track Kinesis sources; the S3 run has no input defined",
      "The job's push-down predicate excludes last month's partitions, so the backfill must be submitted with a new predicate covering the month and the bookmark left untouched, since bookmarks never affect which files are read"
    ],
    correct:0,
    explain:`A job bookmark records how far the job has already processed so scheduled runs stay incremental, which is exactly why a deliberate backfill over old input reads nothing until the bookmark is reset, rewound or bypassed for that run. The predicate explanation (the tempting answer) gets the mechanism backwards: bookmarks are precisely the feature that decides which already-seen input is skipped.`
  },
  /* Ch 20 - S3 Lifecycle policies and storage class transitions */

    q:`A utility keeps ten years of smart-meter interval files. Files are queried heavily for 90 days and then almost never, but the regulator can request any historical day's files and expects them the same business day, within a few hours. A new engineer proposes transitioning everything to S3 Glacier Deep Archive after 90 days for the lowest storage cost. What should the reviewer change?`,

  },

  },
  /* Ch 36 - Data privacy and governance frameworks */
  {
    q:`A regulator asks an electricity retailer to show how its governance programme covers five obligations: classifying personal data, controlling who can access it, protecting it at rest, disposing of it on schedule, and proving all of the above. The team wants to name one AWS service for each. Which mapping is correct?`,

  },
  /* Ch 33 - Encryption with AWS KMS */
  {
    q:`A fintech's new engineer, reviewing the design for a 600 TB data lake encrypted with SSE-KMS, objects that every object write and read would send the data through KMS, and worries about KMS throughput and the service's small request payload limit. What should the data engineer explain?`,
    opts:[
      "The concern is valid: KMS encrypts each object's bytes directly, so a lake this size needs several customer managed keys and request-rate increases to avoid throttling during large loads",
      "KMS is only used for the first write; later reads use a cached plaintext copy S3 keeps",
      "S3 uses envelope encryption: each object is encrypted with a data key, and KMS only encrypts and decrypts that small data key, so the object bytes never pass through KMS",
      "Objects above the KMS payload limit are stored unencrypted and flagged"
    ],
    correct:2,
    explain:`Envelope encryption is the core trick: the data is encrypted with a data key, the data key is wrapped by the KMS key and stored beside the ciphertext, and KMS only ever handles the small key, which is why the design scales to any volume without moving gigabytes through KMS. The direct-encryption reading (the tempting worry) misdescribes the service; KMS guards keys, it never holds the data.`
  },

  /* Ch 13 - Lambda for data processing */
  {
    q:`A logistics company's Lambda function consumes an SQS queue of scan events, about five million messages a day, and the event source mapping was left at a batch size of one. The function's own work per message takes a few milliseconds, yet its invocation count and cost are the highest in the account. What should the team change first?`,

  },
  /* Ch 27 - Monitoring pipelines with CloudWatch Logs and metrics */

  },
  /* Ch 40 - Data sharing patterns */

    q:`A logistics company licenses a vendor's road-weather dataset, which the vendor offers through AWS Data Exchange. The company wants to query the data in place with Athena, never hold its own copy, and have access end automatically when the annual contract lapses. Which Data Exchange product type should it subscribe to, and why?`,

  },

  },
  /* Ch 19 - Open table formats: Apache Iceberg on S3 */
  {
    q:`A securities regulator asks a brokerage to reproduce a position report exactly as it would have run against the trades table at market close on 31 March, four months ago. The table is an Apache Iceberg table on S3 that has been updated thousands of times since, and the team's snapshot expiration keeps a year of history. How can the team produce the report?`,
    opts:[

      "Rebuild the table from the raw zone by replaying every ingestion job up to 31 March into a temporary copy, which is the only way to get a transactionally consistent view because Iceberg snapshots record schema changes, not data",

    correct:1,
    explain:`Each Iceberg commit writes a snapshot whose manifests list the exact data files valid at that moment, so a query pinned to the snapshot current at market close sees the table as it was, corrections and all, with no restore and no rebuild. Filtering the current table by trade date (the tempting shortcut) returns rows as they look today, including every later update and deletion, which is not what the regulator asked for, and the replay option misdescribes snapshots, which track data files, not just schema.`
  },
  /* Ch 21 - DynamoDB TTL, versioning, and lifecycle management */
  {
    q:`A fintech's design review covers a DynamoDB table of customer risk profiles. The regulator requires that every historical version of a profile be retrievable for seven years. The new engineer's design relies on enabling point-in-time recovery and assumes DynamoDB keeps prior item versions the way S3 Versioning does. Which TWO statements should the reviewer make? (Select TWO.)`,
    opts:[

      "Point-in-time recovery restores a whole table to a moment within the last 35 days; it is not a per-item version history",
      "A TTL attribute set seven years out will keep each version readable until then"

    correct:[1,3],
    explain:`DynamoDB has no row versioning of its own, so a requirement to keep every version means modeling it in the key design, and PITR is a recovery tool that restores an entire table to a second within the last 35 days rather than a queryable history of individual items. Treating Streams as an archive (the tempting half-truth) fails because a stream holds recent changes for processing, not seven years of them, and TTL only decides when an item is deleted.`
  },
  /* Ch 37 - Integrating LLMs into data processing with Amazon Bedrock */
  {
    q:`A marketplace engineer proposes an Amazon Bedrock call per record to map each order's status code (one of 14 fixed strings documented by the order system) to a reporting category, across 60 million records a day, and to replace the raw code with the model's output. A reviewer objects. What should the reviewer recommend?`,

  },
  /* Ch 30 - Data skew and sampling techniques for quality checks */
  {
    q:`A bank's nightly Glue Spark job joining transactions to merchants has grown from 40 minutes to four hours over a quarter, although total data volume grew only 20 percent. A new engineer suspects the join is skewed on <code>merchant_id</code> but is asked to prove it before changing the key. Which evidence confirms skew?`,
    opts:[
      "A CloudWatch alarm on the job's total duration, which rises only when skew is present",
      "The Glue job's DPU-hours metric, which grows faster than the input volume whenever one key dominates, so a rising DPU-hour-per-gigabyte ratio is the standard proof of a skewed join key",
      "The crawler's table statistics, which report the number of distinct merchant_id values",
      "The stage's per-task view in the Spark UI (or Glue job metrics): a few tasks with far longer duration and much larger shuffle read than the rest"

    correct:3,
    explain:`Skew is detected from per-task duration and shuffle metrics: when a handful of tasks in the join stage run many times longer and read far more shuffle data than their peers, a hot key is sending them most of the rows, and the job runs at the pace of the busiest task. Total duration or DPU-hours (the tempting aggregate signals) say the job got slower, not why; only the per-task distribution separates skew from a job that is simply larger.`
  },

    q:`An e-commerce marketplace's order events flow through a Kinesis data stream consumed by an Amazon Managed Service for Apache Flink application. Finance now needs every raw event archived to S3 as compressed Parquet for seven years. A new engineer proposes changing every producer to write a second copy to S3 as well as to the stream. What is the better design?`,

  },
  /* Ch 23 - Automating data processing with Glue workflows and Step Functions */
  {
    q:`A game studio processes about 50,000 small in-game purchase receipts an hour, each needing a four-step validation (two Lambda functions, a DynamoDB write and an SNS publish) that completes in under a second, with retries on each step. The team built it on Step Functions Standard workflows, and the per-transition cost has become the largest line in the pipeline bill. What should they change?`,

    correct:3,
    explain:`Step Functions has two workflow types for two shapes of work: Standard suits long-running pipelines billed per state transition, and Express suits high-volume, short executions, which is exactly 50,000 sub-second validations an hour. Folding everything into one Lambda function (the tempting cost cut) does not keep the retries and branching, it reimplements them in code and loses the per-step visibility, and a Glue workflow orchestrates Glue crawlers and jobs, not Lambda and DynamoDB.`

  },

  /* Ch 35 - Audit logging with CloudTrail and CloudTrail Lake */

  /* Ch 26 - Log analysis with Athena and Amazon OpenSearch Service */

  },
  /* Ch 01 - Streaming vs batch ingestion */
  {
    q:`An electricity distributor's protection engineers must be alerted within seconds when a substation reports a fault, so a crew can be dispatched. Faults are rare: a few hundred events a day across the grid. A new team member argues that such a small volume does not justify streaming and proposes a batch job that collects fault events every 15 minutes. What should the reviewer conclude?`,
    opts:[
      "Agree: streaming only pays off above a few thousand events a second, and a 15-minute batch is close enough to real time for dispatch while avoiding shard costs that would dwarf the value of a few hundred events",
      "Agree, because batch jobs are more reliable than stream consumers for rare events",
      "Disagree only if the fault events also feed a monthly report",
      "Disagree: the deciding question is how fast a stale fault becomes wrong, and seconds-old data means streaming, whatever the event volume"
    ],
    correct:3,
    explain:`The decision is about staleness, not volume: a fault that is noticed 15 minutes late has already cost the time a crew should have been moving, so the value decays in seconds and the feed belongs on a stream even though it is tiny. The volume threshold argument (the tempting one) applies a throughput rule to a latency question; a stream with little traffic costs little, and a batch window cannot be made short enough to count as seconds.`
  },
  /* Ch 18 - AWS Schema Conversion Tool and DMS Schema Conversion */
  {
    q:`A bank's cutover-weekend plan for moving an Oracle lending database to Amazon Aurora PostgreSQL reads: Saturday 06:00 start the DMS full load, Saturday 18:00 run DMS Schema Conversion against the target, Sunday enable change data capture. The DMS full load fails within minutes of starting. What is wrong with the plan?`,

    explain:`Skew is caused by a lopsided key, and a null or default value is the classic one: every null-keyed row hashes to the same task, so that task carries 40 percent of the data and runs out of memory. Repartitioning before the join (the tempting fix) does not help, because the join re-shuffles by key and all nulls land together again; the rows must be split off or salted so the hot value is spread.`

    q:`A utility's Redshift <code>readings</code> table is distributed on <code>reading_timestamp</code> because dashboards filter on time ranges, and it is joined to the <code>meters</code> table on <code>meter_id</code> in every report. Joins show heavy redistribution and the time filters still scan most blocks. How should the two keys be set?`,

    explain:`The two levers answer two different questions: the distribution key decides which slice a row lands on, so it belongs on the join column to co-locate matching rows, and the sort key decides the order on disk, so it belongs on the filter column where zone maps can skip blocks; the current design has them swapped. ALL on the readings table (the tempting way to kill the shuffle) replicates a large fact table to every node, which is exactly the table size ALL is wrong for.`

    ],
    correct:3,
    explain:`Firehose batches by two conditions and flushes on whichever comes first, so a stream that never fills the size buffer within the interval produces one small file per interval regardless of how large the size setting is; a longer interval is the lever, at the cost of latency. The per-shard explanation (the tempting mechanical answer) is invented, since Firehose buffers the delivery stream as a whole, and dynamic partitioning routes records to prefixes without changing file size.`
  },
  /* Ch 17 - Schema discovery and schema evolution */
  {
    q:`A marketplace receives a daily headerless CSV export from a payments vendor. Last month the vendor silently swapped the order of two columns; the Glue crawler kept the existing table, Athena returned fee values in the tax column, and finance reported wrong numbers for a week before anyone noticed. Which change to the handoff makes schema discovery robust to this?`,
    opts:[
      "Lock the catalog table's schema and disable crawler updates, so a changed column order is rejected at query time instead of silently returning wrong values to finance",
      "Have the vendor deliver a self-describing format such as Parquet or Avro, where each file carries its own column names and types",
      "Run the crawler twice a day so the swap is detected within hours",
      "Ask the vendor to compress the CSV files so corrupted exports fail to open"
    ],
    correct:1,
    explain:`Discovery can only be as good as what the data says about itself: a headerless CSV carries no names or types, so a column swap is invisible to a crawler and to Athena alike, while Parquet and Avro embed the schema in every file, so columns are read by name whatever their order. Locking the table (the tempting defensive move) does not reject anything, because positional CSV columns still line up with the locked schema and the wrong values keep flowing.`
  },
  /* Ch 37 - Integrating LLMs into data processing with Amazon Bedrock */
  {
    q:`A game studio runs a nightly Amazon Bedrock batch inference job that classifies the day's player chat reports from JSONL in S3. The Step Functions workflow polls the job status every 30 seconds for up to six hours, and the downstream load joins the output file to the input by line position, which has produced mislabeled records. Which TWO changes fix the design? (Select TWO.)`,
    opts:[
      "Switch to synchronous InvokeModel calls from a Map state so results return in order",
      "Have the workflow wait for the job state change event that Bedrock publishes to EventBridge instead of polling",
      "Set the job's temperature to zero so the output file preserves the input order",
      "Join the output to the input on recordId, since output order is not guaranteed",
      "Request the output as CSV so line positions are stable"
    ],
    correct:[1,3],
    explain:`A batch inference job writes one modelOutput per input record keyed by recordId, in no guaranteed order, so the join must use the key, and the job's state changes are published to EventBridge so a workflow can be resumed on completion without a six-hour polling loop. Switching to synchronous per-record calls (the tempting way to force ordering) reintroduces the requests-per-minute throttling that batch inference exists to avoid, and temperature controls sampling, not file order.`
  },
  /* Ch 07 - AWS Glue for ETL */
  {
    q:`A game studio's Glue job reads session events as a DynamicFrame, resolves mixed column types with <code>resolveChoice</code>, and must then deduplicate sessions with a windowed ranking expressed in Spark SQL. The engineer is stuck because the DynamicFrame API offers no window functions. What is the intended path?`,
    opts:[
      "Rewrite the whole job as a Glue Python shell job using pandas",
      "Call toDF() to convert to a Spark DataFrame, run the Spark SQL window logic, and convert back if a DynamicFrame is needed for the write",
      "Replace resolveChoice with a fixed Spark schema and drop the DynamicFrame entirely, since DynamicFrames cannot be used in the same job as Spark DataFrames once Spark SQL is involved",
      "Run the deduplication in Athena after the job writes the raw sessions"
    ],
    correct:1,
    explain:`DynamicFrames bend to messy schema and then hand off: toDF() drops into a plain Spark DataFrame whenever Spark SQL is the better tool, and the two can be mixed freely in one job. Abandoning the DynamicFrame (the tempting all-or-nothing answer) throws away resolveChoice, the feature that was handling the mixed types, on the false premise that the two frame types cannot coexist.`
  },
  /* Ch 24 - Querying data with Amazon Athena */
  {
    q:`A game studio's analysts added LIMIT 1000 to their exploratory Athena queries against a 40 TB uncompressed JSON table after being told to cut cost, but the monthly bill did not move. The platform engineer is asked why. What should they explain?`,
    opts:[
      "Athena bills bytes scanned, and LIMIT caps rows returned after the scan; convert to Parquet and partition the table to scan less",
      "LIMIT only applies when the query is run through the console, not through the JDBC driver the analysts use",
      "The table is stored in S3 Standard, which Athena bills at the full rate; moving it to Standard-IA lowers the per-query charge because Athena's price follows the storage class of the objects it reads",
      "Athena bills per query, so the number of queries must fall"
    ],
    correct:0,
    explain:`One rule drives every Athena optimization: the charge is for data scanned, and a LIMIT clause trims the result after the engine has already read the data, so it cannot reduce the bill; a columnar format and partitions on the filter column are what shrink the scan. The storage-class explanation (the tempting cost lever) is wrong because Athena's price does not depend on where the objects are stored, only on how many bytes it reads.`
  },
  /* Ch 31 - IAM authentication for data services */
  {
    q:`A game studio's BI tool connects to Amazon Redshift with a shared database user whose password is pasted into each analyst's connection profile and has not been rotated in two years. The security team wants analysts authenticated by their own IAM identity with nothing permanent to rotate. What fits?`,
    opts:[
      "Rotate the shared database password monthly and distribute it through the BI tool's administrator",
      "Create a database user per analyst with a password stored in AWS Secrets Manager and rotated automatically every 30 days, which is the standard pattern for warehouse credentials",
      "Place the Redshift cluster in a private subnet so the shared password cannot be used from outside",
      "Have the tool request temporary Redshift database credentials from the analysts' IAM identities, so no permanent database password exists"
    ],
    correct:3,
    explain:`The IAM identity model reaches into the warehouse: Redshift can issue temporary database credentials for an IAM identity, so each analyst authenticates as themselves and there is no stored password to rotate or share. Per-analyst passwords rotated by Secrets Manager (the tempting hardening) still leaves 300 long-lived secrets in existence and keeps authentication outside IAM, which is what the security team asked to end.`
  },
  /* Ch 15 - Data lakes on S3 */
  {
    q:`A bank's three analytics teams each ingest the same raw transaction feed into their own tool: one into HDFS on a long-running EMR cluster, one into Redshift, one into an OpenSearch domain. The quarterly cost review finds three full copies of the data and three slightly different versions of the truth. Which data lake principle addresses both findings?`,
    opts:[
      "Standardize on Redshift for all three teams so there is one copy inside one engine",
      "Replicate the raw feed to each team's store with S3 Replication so all three copies are kept identical",
      "Land one copy in S3 and let each engine (EMR, Redshift Spectrum, Athena) read it in place, decoupling storage from compute",
      "Keep the three stores but schedule a nightly reconciliation job that compares row counts across them and alerts on drift, so the versions converge"
    ],
    correct:2,
    explain:`The lake's founding idea is storage decoupled from compute: one copy in cheap object storage, schema applied on read, and many engines querying the same files, so there is nothing to copy and nothing to diverge. A reconciliation job (the tempting operational patch) accepts three copies as given and spends effort detecting the drift the architecture creates, and forcing every team into Redshift removes the engines that fit their workloads.`
  }
];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
