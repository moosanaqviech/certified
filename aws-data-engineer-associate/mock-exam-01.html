<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Full Mock 1",
  badge: "AWS Data Engineer Associate",
  blurb: "Sit it cold, under exam conditions: sixty-five scenario questions in 130 minutes, sampled across all four domains at their official weights, no feedback until you submit. Most questions have one best answer; a few ask you to select two.",
  coverage: "Sealed mock 1 of 2. Samples all 40 chapters by domain weight: Ingestion and Transformation 34%, Data Store Management 26%, Operations and Support 22%, Security and Governance 18%. None of these questions appear in the unit practice exams.",
  minutes: 130,
  pass: 72
};
const QUESTIONS = [
  /* Coverage plan (65 questions, official domain weights, every chapter at least once;
     5 select-two items at positions 5, 18, 31, 44 and 58):
     Domain 1 Ingestion and Transformation (34%): 22 questions, Ch 1, 2 (x2), 3, 4 (x2), 5 (x2), 6, 7 (x2), 8 (x2), 9, 10 (x2), 11 (x2), 12, 13 (x2), 37
     Domain 2 Data Store Management (26%): 17 questions, Ch 14 (x2), 15 (x2), 16 (x2), 17, 18, 19 (x2), 20 (x2), 21, 22 (x2), 38, 39
     Domain 3 Operations and Support (22%): 14 questions, Ch 23 (x2), 24 (x2), 25 (x2), 26, 27 (x2), 28, 29 (x2), 30 (x2)
     Domain 4 Security and Governance (18%): 12 questions, Ch 31, 32 (x2), 33 (x2), 34 (x2), 35 (x2), 36, 40 (x2) */
  /* Ch 01 - Streaming vs batch ingestion */
  {
    q:`An ad-tech company receives about 60 GB of campaign performance exports a day from its demand-side partners. The only consumer is a morning report that the account managers review at 09:00. A new director argues that at this volume the ingestion must be rebuilt as a streaming pipeline, because batch cannot keep up with tens of gigabytes a day. How should the data engineer respond?`,
    opts:[
      "Agree: once daily volume passes a few gigabytes, only a streaming pipeline can ingest it reliably, since a scheduled job has a fixed window in which it must finish and the window shrinks as volume grows",
      "Disagree: volume is not the deciding factor; the question is how fast stale data becomes wrong, and a once-a-day report makes batch the right fit",
      "Agree, because streaming ingestion is cheaper per gigabyte than a scheduled job",
      "Disagree, because streaming cannot deliver to the same S3 lake the report reads"
    ],
    correct:1,
    explain:`Streaming and batch are different clocks over the same destinations, and the decision is about staleness, not size: a report read once each morning gains nothing from data that is seconds old, while 60 GB a day is routine for a scheduled load. The director's volume argument (the tempting one) confuses throughput with latency; batch jobs scale with data volume, and a streaming path for this consumer would add shard management and always-on consumers for no benefit.`
  },
  /* Ch 15 - Data lakes on S3 */
  {
    q:`A hospital network is onboarding device telemetry from six new monitor vendors. Each vendor's payload structure is different, two vendors have not finalized their formats, and the analytics team cannot agree on a target model yet. The warehouse team insists that nothing can be loaded until a schema is approved, which is blocking ingestion. Which property of an S3 data lake resolves the deadlock?`,
    opts:[
      "S3 Transfer Acceleration, which lets the vendors upload before the schema review finishes",
      "S3 Object Lock, which freezes each vendor's payload structure at upload time so the analytics team can approve one version of the schema before any query engine is allowed to read it",
      "S3 Intelligent-Tiering, which keeps unmodeled data cheap until it is used",
      "Schema-on-read: raw payloads land in the lake as they arrive and structure is applied when they are queried, so modeling can follow ingestion"
    ],
    correct:3,
    explain:`A lake decouples storage from structure: raw data lands first and a schema is applied at query time (through the catalog) once the model is agreed, so unfinished formats do not block capture. Object Lock (the tempting choice because it mentions freezing structure) makes objects immutable for retention; it has nothing to do with schemas and would not let modeling follow ingestion.`
  },
  /* Ch 27 - Monitoring pipelines with CloudWatch */
  {
    q:`A manufacturing IoT platform runs an hourly AWS Glue job that aggregates sensor readings. Twice this month the job succeeded but wrote zero rows because an upstream feed was empty, and nobody noticed until a plant manager complained. The job's failure alarm never fired. What should the team add?`,
    opts:[
      "A custom CloudWatch metric for rows written, with an alarm when it drops below a floor",
      "A second alarm on the Glue job failure metric with a lower threshold",
      "A CloudWatch Logs Insights query over the job's log group that the on-call engineer runs each morning, since Glue writes the row count to its logs and Insights can aggregate it by run",
      "A longer job timeout so the job waits for the upstream feed to fill"
    ],
    correct:0,
    explain:`The job did not fail, so no failure metric can catch it: the signal that matters is a business number, rows written, which the job publishes as a custom metric (for example through the embedded metric format) and an alarm watches. A second failure alarm (the tempting choice) monitors the same metric that stayed healthy, and a saved Insights query only helps someone who remembers to run it.`
  },
  /* Ch 33 - Encryption with AWS KMS */
  {
    q:`An insurer stores claims documents in an S3 bucket encrypted with SSE-KMS under a customer managed key. An analyst's IAM role has <code>s3:GetObject</code> on the bucket, yet every download fails with an access denied error, while a colleague on a different role succeeds. What is the most likely cause?`,
    opts:[
      "The bucket must use SSE-S3 before roles other than the uploader can read",
      "The objects were uploaded through S3 Transfer Acceleration, which restricts downloads",
      "The analyst's role cannot use the KMS key, so the key policy or a missing kms:Decrypt permission rejects the decryption even though the S3 check passed",
      "The analyst must be added to the bucket ACL as well as the IAM policy"
    ],
    correct:2,
    explain:`Reading an SSE-KMS object is checked twice: the caller needs permission on the S3 object and permission to use the KMS key, so a role with only the S3 side fails at decryption. Switching to SSE-S3 (the tempting fix) would remove the second gate rather than correct the permission, and would throw away the key-level control and CloudTrail decryption record the insurer chose SSE-KMS for.`
  },
  /* Ch 02 - Kinesis Data Streams: shards, retention, replay */
  {
    q:`A media streaming company fans playback events out through Amazon SNS to three SQS queues, one per consumer team. Two new requirements arrive: a consumer must be able to rewind and reprocess the previous day's events after a bug fix, and events for the same viewing session must be processed in the order they occurred. The architect proposes moving the feed to a Kinesis data stream. Which TWO properties of Kinesis Data Streams satisfy the new requirements? (Select TWO.)`,
    opts:[
      "Records persist for the retention period after being read, so a consumer can restart from an earlier sequence number or timestamp and reprocess them",
      "Records sharing a partition key land on the same shard and are strictly ordered within it, so a session's events are processed in sequence",
      "Reading a record removes it from the stream, so each consumer sees every event exactly once",
      "Ordering is guaranteed across the whole stream regardless of partition key",
      "Retention is unlimited by default, so no setting needs to change for the one-day replay"
    ],
    correct:[0,1],
    explain:`A stream is a durable log, not a queue: reading does not remove records, so a consumer can rewind within the retention window, and ordering is guaranteed within a shard, which the session ID as partition key exploits. The delete-on-read option (the tempting one, because it describes SQS) is exactly the property that makes replay impossible on the current design, ordering is per shard rather than stream-wide, and retention defaults to 24 hours, so a one-day replay needs that setting raised.`
  },
  /* Ch 07 - AWS Glue for ETL */
  {
    q:`A healthcare analytics team has an AWS Glue Spark job that runs nightly for two minutes: it downloads a 3 MB reference CSV from a vendor API, reshapes it with the pandas library and writes one small file to S3. The job is billed for 10 DPUs during every run including the Spark startup, which makes it the most expensive step per byte in the pipeline. What should the team change?`,
    opts:[
      "Convert the job to a Glue streaming ETL job so Spark stays warm between runs",
      "Enable job bookmarks so the job skips the reference file when it has not changed",
      "Run it as a Glue Python shell job, the job type for small non-Spark tasks, instead of a Spark job",
      "Keep the Spark job but raise its worker type to G.2X, because larger workers initialize Spark faster and so shorten the startup time the team is paying for on a two-minute job"
    ],
    correct:2,
    explain:`Glue has two job types for a reason: Spark jobs handle large distributed data, while Python shell jobs run small, non-Spark Python tasks such as calling an API and reshaping a few megabytes, at a fraction of the DPU cost and without a Spark startup. Bigger workers (the tempting lever) make the oversized engine faster, not cheaper, and a streaming job would keep Spark running all night for a two-minute task.`
  },
  /* Ch 24 - Querying data with Amazon Athena */
  {
    q:`An ad-tech team registers impression logs as an Athena table partitioned by <code>dt</code> and <code>region</code>. New partitions land every hour, and analysts complain that queries over the latest hour return nothing until the nightly crawler runs. Partition values follow a predictable pattern. What removes both the delay and the crawler dependency?`,
    opts:[
      "Run MSCK REPAIR TABLE at the start of every analyst session, which registers the new hourly partitions in the catalog faster than a crawler because it only lists prefixes",
      "Configure partition projection so Athena computes partition locations from table properties",
      "Create a materialized view over the table so new partitions refresh on read",
      "Convert the logs to uncompressed CSV so Athena can list the prefixes directly"
    ],
    correct:1,
    explain:`Partition projection describes the partition scheme (ranges, enumerations, date patterns) in table properties, so Athena resolves which prefixes a query needs in memory and never waits for a crawler or metadata update. Running MSCK REPAIR TABLE (the tempting fix) registers partitions but has to be run every time new ones arrive and scans the prefix listing, which is the manual step projection eliminates.`
  },
  /* Ch 32 - IAM policies vs Lake Formation permissions */
  {
    q:`A clinical research platform spans 14 producer accounts, each of which grants analysts access to its lake tables by editing S3 bucket policies and per-analyst IAM policies. The governance office needs one place where table and column permissions are granted and reviewed, and wants producer teams to stop hand-editing bucket policies for every request. What is the appropriate change?`,
    opts:[
      "Create one IAM group per producer account and attach every analyst to the groups whose data they need",
      "Have each producer account publish a single S3 access point per table so that analysts receive one URL each and the bucket policy no longer has to name individual principals when access is granted",
      "Consolidate every table into one bucket in one account so a single bucket policy covers all grants",
      "Register the lake locations with Lake Formation and have data lake administrators grant catalog permissions centrally, replacing per-bucket policies with database-style grants"
    ],
    correct:3,
    explain:`Lake Formation is the central, fine-grained layer: once S3 locations are registered, administrators grant table and column permissions in one place and the underlying S3 access is handled for them, which is exactly the review point the governance office asked for. Access points per table (the tempting option) still leave the grant inside each account's bucket policy, so neither centralization nor column grain is achieved.`
  },
  /* Ch 14 - Choosing a data store: Redshift vs DynamoDB vs RDS */
  {
    q:`A connected-factory platform keeps three years of machine readings and wants its quality engineers to run BI dashboards with multi-table joins and aggregations across the whole history, with new readings landing hourly. One proposal is to add read replicas to the plant's Amazon RDS for MySQL database; another is to build the dashboards on DynamoDB with one table per report. Which store fits the workload?`,
    opts:[
      "Amazon Redshift, a columnar MPP warehouse built for aggregations and joins over large history",
      "Amazon RDS with read replicas, since replicas remove the analytical load from the primary",
      "Amazon DynamoDB with one table per report, because a key-value store returns a precomputed dashboard row in single-digit milliseconds and the hourly landing job can maintain every report table as it writes",
      "Amazon RDS with the instance scaled to the largest class"
    ],
    correct:0,
    explain:`Aggregations and joins over years of history are OLAP, which is what Redshift's columnar, massively parallel engine is for. Precomputing every report into DynamoDB tables (the tempting choice because the reads would be fast) gives up ad hoc analysis entirely and turns the hourly load into a maintenance job for every dashboard, and RDS replicas still run warehouse-scale scans on a row-based engine.`
  },
  /* Ch 04 - Amazon Data Firehose */
  {
    q:`An insurer's security team wants its application log records delivered continuously into a third-party SIEM that accepts data through Splunk and HTTP endpoints. Each record needs one field renamed on the way, and the team refuses to write or operate a consumer application. Which design fits?`,
    opts:[
      "An Amazon Data Firehose stream with the SIEM as its destination and a Lambda transform renaming the field in flight",
      "A Kinesis data stream with an EC2 consumer that forwards records to the SIEM",
      "A Managed Service for Apache Flink application that renames the field and writes to the SIEM",
      "An Amazon Data Firehose stream delivering to S3 only, because Firehose cannot reach third-party destinations, with the SIEM configured to poll the bucket every minute for new objects"
    ],
    correct:0,
    explain:`Firehose is the no-code delivery pipe: its supported destinations include S3, Redshift, OpenSearch Service, Splunk, Snowflake and HTTP endpoints, and an optional Lambda transform reshapes records before delivery, so the whole requirement is configuration. The S3-and-poll option (the tempting one) is built on a false premise, since Firehose delivers to Splunk and HTTP endpoints directly, and the Flink and EC2 options add an application to operate.`
  },
  /* Ch 29 - Data quality checks with AWS Glue DataBrew */
  {
    q:`An insurance operations analyst runs an AWS Glue DataBrew profile job on a 400 GB monthly broker file and the profile reports zero nulls in <code>policy_id</code>. Two days later the load fails because several thousand rows have a null <code>policy_id</code>. The analyst asks why the profile missed them. What is the explanation and fix?`,
    opts:[
      "Profile jobs only report distributions, not null counts; attach a recipe job that counts nulls explicitly, since recipes run against the full dataset and write their statistics beside the output",
      "The crawler that registered the dataset dropped the null rows; rerun it before profiling",
      "By default a profile job evaluates a sample of the dataset, so rare nulls can be missed; configure the profile to run on the full dataset (or a far larger sample) when every bad row matters",
      "Nulls in a key column are ignored by DataBrew; add a ruleset instead"
    ],
    correct:2,

  /* Ch 05 - Amazon Managed Service for Apache Flink */

  /* Ch 22 - Redshift performance basics: distribution keys and sort keys */

    explain:`CREATE TABLE AS builds a brand-new table each night, which is why the previous table's grants and physical design vanish with it; the ELT pattern for a production table is to define it once and append or swap into it with INSERT INTO SELECT. The materialized-view explanation (the tempting answer) is invented: a view has its own definition and never pushes keys or grants onto its base table.`
  },
  /* Ch 30 - Data skew and sampling techniques for quality checks */
  {
    q:`A hospital data team must estimate the share of malformed diagnosis codes across a 6 TB claims table before a migration. One rare but regulated specialty accounts for 0.4 percent of rows and its codes must be measured. An engineer proposes a quick random sample of 20,000 rows. What is the risk, and what sampling approach fixes it?`,
    opts:[
      "A random sample of that size may hold almost no rows from the rare specialty; a stratified sample that preserves each specialty's proportion fixes it",
      "Random sampling is biased toward recent rows; sort the table by date first",
      "Random sampling is too slow on 6 TB; take the first 20,000 rows instead",
      "Sampling is never acceptable for a regulated quality check, because any sample under one percent of the rows carries a margin of error wider than the rate being measured; scan every row"
    ],
    correct:0,
    explain:`A simple random sample estimates the overall rate well but can miss a 0.4 percent group almost entirely, which is exactly the group the regulator cares about; stratifying by specialty guarantees it is represented. Taking the first rows (the tempting shortcut) is worse than random because ordered data is not representative, and a full scan is only required when every bad row must be caught, not when a rate is being estimated.`
  },
  /* Ch 17 - Schema discovery and schema evolution */
  {
    q:`A factory's sensor firmware team plans to change the <code>reading_value</code> column in its daily CSV drops from an integer to a decimal string, in place, in next week's release. Downstream Athena queries, a Glue job and a Redshift COPY all read the column. The team asks whether a crawler set to update the table will absorb the change. How should the data engineer answer?`,
    opts:[
      "Yes: a crawler re-infers types on each run, so the change is absorbed with no downstream work",
      "Yes, if the crawler's schema change policy is set to log rather than update",
      "No, because a crawler never changes a column's type once the table exists, so the team must drop and recreate the catalog table before the first decimal file arrives and then rerun the crawler",
      "No: a type change is a breaking change for existing readers, so it needs an evolution strategy, such as adding a new column alongside the old one and deprecating the old one later"
    ],
    correct:3,
    explain:`Additive changes (a new nullable column) are safe because readers ignore what they do not know; a type change on an existing column is breaking, since the Glue job, the COPY and the queries all assume the old type, so it needs a deliberate strategy rather than a silent in-place deploy. The drop-and-recreate answer (the tempting one) is both wrong about crawlers, which can update types, and misses the point: whatever the catalog says, the readers still break.`
  },
  /* Ch 12 - Infrastructure as code and CI/CD for data pipelines */
  {
    q:`An insurer's data platform is defined in AWS CDK and deployed by a CodePipeline with CodeBuild. A Glue job change passed its unit tests and deployed to staging, where it then corrupted a table because a schema assumption was wrong. The team wants this class of defect caught before staging. Where in the pipeline does the fix belong?`,
    opts:[
      "In the deploy stage, with a manual approval before staging",
      "In the build stage: an integration test that runs the job against a representative sample and validates the output schema, so the pipeline fails before deploying",
      "In the source stage, by requiring two reviewers on every pull request",
      "After staging, with CloudFormation drift detection on the stack"
    ],
    correct:1,
    explain:`CI/CD earns its value when the build stage proves the change against realistic data, so a schema mismatch fails the pipeline before any environment is touched. A manual approval before staging (the tempting gate) delays the deploy without testing anything, and drift detection reports console changes to deployed resources, which is unrelated to a logic defect in the job.`
  },
  /* Ch 26 - Log analysis with Athena and Amazon OpenSearch Service */
  {
    q:`A media streaming company's network team proposes loading three years of VPC Flow Logs, already in S3, into an Amazon OpenSearch Service domain. The team queries the logs about once a month during capacity reviews and has no alerting or dashboard requirement. The platform team is cost-sensitive. What should the data engineer recommend?`,
    opts:[
      "Proceed with the OpenSearch domain, but size it with UltraWarm nodes so that three years of indexed logs cost about the same as leaving them in S3 and queries return in milliseconds",
      "Load the logs into Amazon Redshift so the network team can use SQL",
      "Query the logs in place with Athena, partitioned by date, since monthly ad hoc questions over data already in S3 suit pay-per-query far better than an always-on index",
      "Stream the logs into CloudWatch Logs and use Logs Insights"
    ],
    correct:2,
    explain:`The split is fresh-and-frequent versus occasional-and-cheap: with no alerting or dashboards and one question a month, an always-on OpenSearch domain bills continuously for indexing and storage that sit idle, while Athena charges only for the bytes each query scans. The UltraWarm argument (the tempting cost rebuttal) still runs a domain around the clock, and CloudWatch Logs would mean re-ingesting three years of data that already sits where Athena can read it.`
  },
  /* Ch 21 - DynamoDB TTL, versioning, and lifecycle management */
  {
    q:`An ad-tech platform stores bid-session records in DynamoDB. Each night a Lambda function scans the whole table, finds sessions older than 24 hours and deletes them one by one. The scan now takes two hours, consumes a large share of the table's read and write capacity, and still leaves expired sessions visible for most of the day. What should replace it?`,
    opts:[
      "An S3 lifecycle rule on the table's export bucket that expires sessions after a day",
      "A global secondary index on the session timestamp so the nightly scan becomes a query",
      "DynamoDB TTL with an epoch expiry attribute on each item, so the service deletes expired sessions in the background at no write cost",
      "DynamoDB Streams with a Lambda function that deletes each session when its record appears, which removes the scan and reaches the items within seconds of expiry at no capacity cost"
    ],
    correct:2,
    explain:`Records with a natural end date are what TTL is for: set one attribute and the service removes expired items continuously without a scan and without consuming write capacity. The Streams-based deleter (the tempting engineering answer) still issues a write per item, so it pays the capacity the scan paid, and a stream record appears when an item changes, not when it ages; the index only makes the scan cheaper rather than removing it.`
  },
  /* Ch 02 - Kinesis Data Streams: shards, retention, replay */
  {
    q:`A hospital's telemetry consumer wrote corrupted output for the last 36 hours because of a code bug. The Kinesis data stream's retention is set to 7 days, and the bug is now fixed. The team wants the corrected output for those 36 hours. What should they do?`,
    opts:[
      "Ask every bedside monitor to resend the last 36 hours of readings, because a consumer cannot move backwards in a stream and the only way to see a record again is for the producer to put it a second time",
      "Restart the consumer from a timestamp (or sequence number) 36 hours back so it re-reads the retained records through the corrected code",
      "Increase the shard count so the consumer can catch up on the missed records",
      "Switch the consumer to enhanced fan-out so it receives the earlier records again"
    ],
    correct:1,
    explain:`Replay is the payoff of a persistent log: reading does not delete records, and with 7 days of retention the consumer simply starts again from an earlier position and reprocesses them, no producer involvement needed. Asking producers to resend (the tempting fallback) assumes the delete-on-read behavior of a queue, which a stream does not have, and shard count or fan-out change throughput, not position.`
  },
  /* Ch 32 - IAM policies vs Lake Formation permissions */
  {
    q:`A manufacturing company registered its lake's S3 location with Lake Formation and granted an analyst group SELECT on a quality-metrics table through Lake Formation. The group's Athena queries succeed, but a batch job that reads the same table's Parquet files directly from S3 under a different role fails. The job needs whole-prefix read access and performs no column filtering. Which authorization layer should the job's access be defined in?`,
    opts:[
      "Lake Formation, by granting the job's role cell-level permissions on the table",
      "Lake Formation, by applying an LF-Tag to each Parquet object",
      "Neither; the job should assume the analysts' role so it inherits their grant, because Lake Formation credential vending applies to any principal reading the registered location regardless of the engine",
      "IAM: an S3 read policy on the prefix for the job's role, since broad object access for a service is the IAM layer while Lake Formation governs catalog queries"
    ],
    correct:3,
    explain:`The two layers are complementary: a job reading files straight from S3 with no fine-grained requirement is a resource-level IAM question, while Lake Formation grants govern catalog tables for query engines. Cell-level permissions (the tempting choice because Lake Formation already covers the table) do not apply to direct object reads, and LF-Tags attach to Data Catalog resources, not to individual S3 objects.`
  },
  /* Ch 18 - AWS Schema Conversion Tool and DMS Schema Conversion */
  {
    q:`An insurer is migrating an Oracle policy database to Amazon Aurora PostgreSQL. The project plan assumes that AWS DMS Schema Conversion will translate the tables and indexes, and separately budgets a team of contractors to rewrite all 200 PL/SQL stored procedures and functions by hand from scratch. What should the data engineer point out?`,
    opts:[
      "Schema conversion also converts stored procedures, functions and views, flagging only what it cannot translate, so the rewrite budget should cover the flagged objects, not all 200",
      "The plan is correct: schema conversion handles tables and indexes only, and all procedural code must be rewritten manually because PL/SQL has no PostgreSQL equivalent that an automated tool can target",
      "Neither tables nor procedures need conversion, because DMS translates them as it copies the rows",
      "Oracle to Aurora PostgreSQL is a homogeneous migration, so no conversion is needed at all"
    ],
    correct:0,
    explain:`The conversion tool rewrites database objects (tables, indexes, views, stored procedures and functions) from the source dialect into the target's, and its assessment report lists the objects that need manual work, which is what the contractor budget should be scoped to. The tables-only assumption (the tempting one) understates the tool, and DMS itself moves rows, it does not translate code; Oracle to PostgreSQL is heterogeneous, so conversion is needed.`
  },
  /* Ch 33 - Encryption with AWS KMS */
  {
    q:`A healthcare analytics company must let a research partner's AWS account read de-identified claims from an S3 bucket that currently uses SSE-KMS with the AWS managed key <code>aws/s3</code>. The partner's reads fail at decryption, and the bucket holds hundreds of millions of small objects, so KMS request charges are already a concern. Which TWO changes make the cross-account reads work while keeping the cost of SSE-KMS manageable? (Select TWO.)`,
    opts:[
      "Re-encrypt under a customer managed key, since only a customer managed key's policy can grant another account's principals the use of the key",
      "Enable S3 Bucket Keys on the bucket so S3 uses a bucket-level data key instead of calling KMS for every object",
      "Edit the aws/s3 key policy to add the partner account as a principal",
      "Switch the bucket to SSE-S3 so the partner no longer needs key permission",
      "Create one customer managed key per object so each grant is as narrow as possible"
    ],
    correct:[0,1],
    explain:`An AWS managed key cannot have its policy edited or be shared across accounts, so cross-account decryption needs a customer managed key whose policy grants the partner, and Bucket Keys cut KMS requests by caching a bucket-level key, keeping SSE-KMS affordable at scale. Editing the aws/s3 key policy (the tempting direct fix) is not possible, SSE-S3 would drop the key control and CloudTrail decryption record the company has today, and a key per object multiplies calls and management.`
  },
  /* Ch 04 - Amazon Data Firehose */
  {
    q:`A factory's edge gateways publish readings to a Kinesis data stream, and an Amazon Data Firehose stream delivers them to S3 in Parquet. A new IAM policy written for the Firehose delivery role lists <code>Action: "datafirehose:*"</code>, and deployment fails with an invalid action error. What should the engineer understand?`,
    opts:[
      "The rename was cosmetic: IAM actions, the CLI and CloudWatch kept the original firehose identifiers, so the policy should use the firehose: prefix",
      "Delivery roles do not use IAM actions; permissions are set in the stream's properties",
      "The policy must name Kinesis Data Streams actions, since Firehose inherits permissions from its source stream",
      "The action prefix changed with the rename, and the AWS CLI and IAM policy validator must be upgraded to the current version before the new datafirehose prefix is recognized in a policy document"

    correct:0,
    explain:`AWS dropped Kinesis from the product name in February 2024 but left every programmatic identifier unchanged, so policies, scripts and dashboards use the original firehose names while prose uses the current one. Expecting a new prefix (the tempting assumption from the rename) is exactly the trap, and the delivery role is an ordinary IAM role whose permissions are expressed as IAM actions.`
  },
  /* Ch 24 - Querying data with Amazon Athena */
  {
    q:`A hospital research group needs to iteratively explore and profile a large set of Glue Data Catalog tables in Python, trying feature transformations interactively, with no cluster to size or keep warm. Their SQL work already runs in an Athena workgroup. What should the data engineer provision?`,
    opts:[
      "A persistent Amazon EMR cluster with JupyterHub installed",
      "An Athena workgroup with the Apache Spark engine, so notebooks start in seconds against the same catalog tables and bill by DPU-hours",
      "A larger per-query data-scan limit on the existing SQL workgroup, since Athena SQL supports Python user-defined functions and the scan limit is what prevents the exploratory queries from running",
      "A Glue Python shell job the researchers edit and rerun for each experiment"

    correct:1,
    explain:`Athena notebooks run interactive PySpark on a Spark-enabled workgroup against the same Glue Data Catalog tables as the SQL engine, with no infrastructure and billing by DPU-hours for the session, which fits iterative, code-driven exploration. A persistent EMR cluster (the tempting choice) delivers notebooks too but is exactly the cluster the group does not want to size or keep running.`
  },
  /* Ch 14 - Choosing a data store: Redshift vs DynamoDB vs RDS */
  {
    q:`An insurer built its new policy-quoting application directly on Amazon Redshift because the analytics team already ran it. The application performs thousands of single-row inserts and updates per second and point lookups by quote ID, and users complain of multi-second latency and write queuing, while the warehouse's nightly reports run fine. What is the appropriate fix?`,
    opts:[
      "Add Redshift nodes so the single-row writes are spread across more slices",
      "Define a sort key on quote_id so point lookups skip blocks",
      "Move the application's transactional workload to an OLTP store (Amazon RDS, or DynamoDB for pure key access) and keep Redshift for the reports, loading it from the operational store",
      "Convert the application's tables to DISTSTYLE ALL so every node can answer a lookup"
    ],
    correct:2,
    explain:`Redshift is a columnar warehouse built for scans and aggregations, not for high-rate single-row writes and point lookups; that access pattern names an OLTP store, and the warehouse stays for the analytics it does well. Adding nodes (the tempting scale-up) spreads an unsuitable workload across more hardware without changing the engine's row-at-a-time cost, and a sort key helps range scans rather than thousands of transactional writes per second.`
  },
  /* Ch 07 - AWS Glue for ETL */
  {
    q:`An ad-tech AWS Glue Spark job joins a day of click events to a wide campaign dimension. On G.1X workers it fails intermittently with executor out-of-memory errors during the join stage, and its daily input volume swings tenfold between weekdays and weekends, so the team has provisioned 100 workers for every run and pays for them even on quiet days. Which change addresses both the failures and the cost?`,
    opts:[
      "Keep G.1X workers but raise the count to 200, because Glue pools the memory of all workers into one shared heap, so adding workers always removes executor out-of-memory errors",
      "Convert the job to a Python shell job, which has no executor memory limit",
      "Raise the job timeout so the long-running executors finish",
      "Move to a larger worker type such as G.2X for more memory per executor, and enable Glue auto scaling so each run sizes its workers to demand"
    ],
    correct:3,
    explain:`The worker type sets the memory each executor has, so a memory-bound join stage needs a bigger worker, and Glue auto scaling adds and removes workers during the run as stages demand, so quiet days stop paying for 100 idle workers. Doubling the G.1X count (the tempting fix) does not raise any single executor's memory, since workers do not share a heap, and a Python shell job is for small non-Spark tasks, not a distributed join.`
  },
  /* Ch 23 - Automating data processing with Glue workflows and Step Functions */
  {
    q:`A media company onboards a new content partner every few weeks. Each partner needs the same pipeline (a crawler over the partner's prefix, a cleansing Glue job, an aggregation Glue job, chained on success), differing only in the S3 prefix, the catalog database and a schedule. Today an engineer rebuilds the workflow by hand each time and the copies have started to drift. What should the team adopt?`,
    opts:[
      "A Step Functions state machine per partner, since Step Functions can template a workflow",
      "An Amazon MWAA environment with one DAG per partner, since Airflow is the only orchestrator whose definitions can be parameterized and reused across many near-identical pipelines",
      "One shared Glue workflow that every partner's files flow through, with the prefix hard-coded",
      "A Glue blueprint that turns the workflow into a parameterized template, so each partner's workflow is generated from one definition with its own prefix, database and schedule"
    ],
    correct:3,
    explain:`Blueprints exist for exactly this: a Glue workflow (crawlers, jobs and triggers) becomes a reusable template whose parameters are supplied when a new workflow is created, so the copies cannot drift. The MWAA claim (the tempting one) is false, since parameterization is not unique to Airflow and brings an environment to run for an all-Glue pipeline, and a single shared workflow with a hard-coded prefix cannot serve partners that differ by prefix and schedule.`
  },
  /* Ch 40 - Data sharing patterns */
  {
    q:`A hospital network receives three sharing requests in one quarter. A research consortium in an AWS account outside the organization needs live access to curated Glue tables in the lake, with patient columns hidden. A pharmaceutical vendor supplies a licensed drug-interaction data set and wants the hospital's access to end automatically when the contract lapses. The finance department's own Redshift workgroup needs to query the clinical warehouse tables live without loading them. Which mechanism matches each request?`,
    opts:[
      "Lake Formation cross-account grants (through a resource link, with a column filter) for the consortium, an AWS Data Exchange subscription for the vendor data, and a Redshift datashare for finance",
      "AWS Data Exchange for all three requests, since it manages entitlements for any consumer",
      "A Redshift datashare for the consortium, Lake Formation grants for the vendor data, and S3 Replication for finance, because replication is the only pattern that keeps a consumer's heavy queries off the producer's compute",
      "A nightly UNLOAD to S3 and cross-account copies for all three, with IAM policies on the copies"

    correct:0,
    explain:`Each layer has its own in-place sharing mechanism: Lake Formation grants share lake tables across accounts (the consumer queries through a resource link and the filter hides the columns), Data Exchange manages third-party entitlements so access ends with the subscription, and a datashare gives another Redshift namespace live access on its own compute. The replication option (the tempting one for finance) misses that a datashare already keeps consumer queries on the consumer's compute, and every copy is a new dataset to govern.`
  },
  /* Ch 05 - Amazon Managed Service for Apache Flink */
  {
    q:`An insurer's claims events are produced to an Amazon MSK topic. A reviewer rejects a proposal to compute per-minute fraud aggregates with Amazon Managed Service for Apache Flink, stating that the service can only read from Kinesis Data Streams and only write to Kinesis Data Streams, so the team would first have to bridge the topic into a stream. What is the accurate response?`,
    opts:[

      "The reviewer is right about the source, but the sink can be any service",

  },
  /* Ch 15 - Data lakes on S3 */
  {
    q:`A manufacturing company partitioned its sensor lake by <code>sensor_id</code> (about 120,000 values) because engineers wanted to find one sensor's data quickly. Athena queries that filter on a plant and a day, which is how nearly all dashboards query the data, have become slower and more expensive as the number of partitions grows, and planning a query now takes longer than scanning it. What should the team change?`,
    opts:[
      "Add sensor_id as a second-level partition under the existing scheme, because Athena prunes nested partitions in order and so a two-level layout is always faster than a one-level layout",
      "Convert the partition values to integers so the catalog lists them faster",
      "Repartition by the columns queries actually filter on (plant and date), which have moderate cardinality, so each query prunes to a few prefixes instead of listing 120,000",
      "Remove partitioning entirely and rely on Parquet column statistics"
    ],
    correct:2,
    explain:`Partitioning pays off when the partition column matches the query filter and the number of partitions stays reasonable; 120,000 sensor partitions force every plant-and-day query to enumerate them all, which is the over-partitioning trap. Nesting another level (the tempting extension) multiplies the partition count further, and dropping partitioning altogether throws away the single biggest lever on scan cost.`
  },
  /* Ch 29 - Data quality checks with AWS Glue DataBrew */
  {
    q:`A streaming platform receives a new subscriber dataset from an acquired company. Before anyone builds a pipeline on it, an analyst who does not write code must learn what the data actually looks like: how many nulls each column has, whether <code>subscriber_id</code> is unique, how values are distributed and which columns are correlated. What should the analyst run?`,
    opts:[
      "A DataBrew recipe job with a remove-duplicates step, which reports the duplicates it found",
      "A Glue crawler over the dataset, whose table statistics include null counts, uniqueness ratios and column correlations alongside the inferred column types",
      "A DataBrew profile job on the dataset, which writes those statistics to S3 and surfaces outliers and correlations",
      "An Athena CTAS query that copies the dataset to Parquet"
    ],
    correct:2,
    explain:`A profile job is the discovery step: it evaluates the dataset and reports null counts, uniqueness, value distributions, outliers and column correlations with no code, so the analyst knows what needs fixing before anything is built. A crawler (the tempting answer because it also inspects the data) infers schema and registers a table; it does not report data quality statistics, and a recipe job transforms rather than describes.`
  },
  /* Ch 08 - AWS Glue vs Amazon EMR for transformation */
  {
    q:`An ad-tech company is moving an on-premises Hadoop platform to AWS: Hive queries over a 300 TB warehouse, an HBase store that serves real-time bid lookups, Presto for interactive analysis, and Spark jobs pinned to a specific release because of a library dependency. The migration plan requires the existing jobs and applications to run without rewrites. A cloud architect proposes AWS Glue for the whole estate. What should the reviewer conclude?`,

      "Amazon Redshift fits, since Hive SQL is close enough to Redshift SQL to load the warehouse and retire the rest",
      "Amazon Athena for the Hive and Presto queries and DynamoDB for HBase, rewriting the lookup applications",

    correct:3,
    explain:`Named Hadoop-ecosystem tools, a pinned Spark release and a no-rewrite clause are the EMR signals: it hosts Hive, HBase, Presto and Spark on a managed cluster whose release and instances you choose. Glue (the tempting serverless answer) is Spark ETL only; its Hive-compatible catalog stores table metadata but does not run Hive, HBase or Presto, so the estate would need rewriting, which the plan forbids.`
  },
  /* Ch 19 - Open table formats: Apache Iceberg on S3 */

    q:`An insurer's claims lake stores Apache Iceberg tables in a general purpose S3 bucket, written continuously by a streaming job. The platform team spends hours each week scheduling compaction, expiring snapshots and deleting orphan files, and wants that maintenance handled by the service while keeping the tables queryable from Athena, Redshift and EMR through the Glue Data Catalog and Lake Formation. What should they adopt?`,
    opts:[
      "Amazon S3 Tables (table buckets), where compaction, snapshot expiration and unreferenced-file removal run automatically and the tables integrate with the Glue Data Catalog and Lake Formation",
      "Convert the tables back to plain Parquet folders so there is no metadata to maintain",
      "Move the tables into Amazon Redshift managed storage so Redshift handles vacuuming",
      "Enable S3 Intelligent-Tiering on the bucket so small files are consolidated automatically"
    ],
    correct:0,
    explain:`S3 Tables is the managed Iceberg option: a third bucket type that stores Iceberg tables as first-class resources and runs their housekeeping for you, while the same engines query them through the catalog. Reverting to plain Parquet (the tempting simplification) removes the maintenance by removing the transactions, time travel and row-level updates the lake adopted Iceberg for, and Intelligent-Tiering moves objects between tiers without ever merging files.`
  },
  /* Ch 25 - Federated and cross-service queries: Redshift Spectrum */
  {
    q:`A media company's Redshift dashboard must show subscription revenue alongside each subscriber's current plan, which lives in an Amazon Aurora PostgreSQL database and changes throughout the day. The team currently COPYs the plan table into Redshift every night and the business complains the dashboard is stale by noon. Which capability fixes the staleness without an ETL pipeline?`,

      "A Redshift datashare from the Aurora database to the Redshift cluster",

    correct:1,
    explain:`Federated query reaches into live RDS and Aurora PostgreSQL or MySQL databases from the leader node, pushing predicates down and pulling back only matching rows, so the join reflects the current plan with no copy. Spectrum (the tempting sibling feature) reads S3 through external tables, not operational databases, and datashares are Redshift-to-Redshift; a more frequent COPY only shrinks the staleness window.`
  },
  /* Ch 35 - Audit logging with CloudTrail and CloudTrail Lake */
  {
    q:`An ad-tech company delivers its CloudTrail logs to an S3 bucket for long-term retention. During an audit, the examiner asks the team to demonstrate that none of the delivered log files have been modified or deleted since delivery. The bucket is encrypted with SSE-KMS and access is tightly restricted. What provides the proof the examiner wants?`,

    explain:`Log file validation makes CloudTrail write signed digests that cover the delivered log files, so integrity and completeness can be proven after the fact, which is tamper evidence. Encryption (the tempting answer because it protects the files) keeps them confidential but says nothing about whether an authorized principal altered or removed one.`
  },
  /* Ch 10 - Orchestrating with Step Functions vs Amazon MWAA */
  {
    q:`A manufacturing company's architecture board is comparing AWS Step Functions and Amazon MWAA for a new quality-inspection pipeline. One member claims only MWAA can retry a failed step and only Step Functions can run on a schedule, so the team will need both. Which TWO statements correctly describe what the two orchestrators share? (Select TWO.)`,

    correct:[0,1],

  },
  /* Ch 16 - AWS Glue Data Catalog and crawlers */
  {
    q:`An insurer's privacy officer reviews the data platform and raises two concerns about the AWS Glue Data Catalog: that it holds a second copy of the policyholder data, which would need its own encryption and retention controls, and that deleting a catalog table is the way to delete a dataset under a retention request. What should the data engineer explain?`,

      "The catalog holds a compressed replica of each table so engines can query without reaching S3, which is why dropping the table frees the storage and satisfies a deletion request",
      "The catalog holds data for tables created by crawlers but not for tables created by DDL",

    ],
    correct:0,
    explain:`A catalog table describes the files (columns and types, location, format), and the bytes never leave S3, so the catalog needs no separate data-protection regime and a retention request is fulfilled by deleting or expiring the S3 objects. The replica explanation (the tempting one) would make dropping a table a deletion mechanism, which it is not; the objects remain exactly where they were.`
  },
  /* Ch 13 - Lambda for data processing */
  {
    q:`A healthcare integration team receives about 50 small JSON messages a minute in an S3 bucket, each under 5 KB, and must rename three fields and write each message to a curated prefix within a minute of arrival. They implemented this as an AWS Glue Spark job started per object, and the pipeline is both slow (minutes per message) and the costliest in the account. What should they use instead?`,
    opts:[
      "Amazon EMR Serverless with a Spark application per object",
      "A Glue streaming ETL job reading the bucket continuously",
      "A Glue Python shell job per object, since Python shell jobs start faster than Spark jobs and are billed per DPU-hour with no minimum, so the per-message cost falls to a fraction of a cent",
      "An AWS Lambda function triggered by the S3 object-created event, which transforms each small message in milliseconds and bills only per request and run time"
    ],
    correct:3,
    explain:`Light, fast, per-event transformation is the Lambda shape: a function fires on each object, finishes in milliseconds, and costs nothing when idle, whereas any Spark engine pays startup and minimum billing for a 5 KB file. A Python shell job per object (the tempting cheaper Glue option) still carries a job-start delay and per-run billing floor that make it a poor fit for 50 tiny events a minute.`
  },
  /* Ch 22 - Redshift performance basics: distribution keys and sort keys */
  {
    q:`An ad-tech warehouse has a 2 TB staging table that is truncated and reloaded each night, then read in full by a single transformation step; it is never joined to another table. It was created with DISTKEY on <code>load_batch_id</code>, and because each night's load carries one batch ID, every nightly load lands on one slice and the load and the full scan both run slowly. Which distribution style fits this table?`,
    opts:[
      "DISTSTYLE ALL, so every node holds the whole table and the scan is local",
      "DISTKEY on advertiser_id, so the table is co-located with the advertiser dimension",
      "DISTSTYLE EVEN, which spreads rows round-robin across slices when there is no join key to co-locate on, so the load and the full scan use every slice",
      "Keep DISTKEY load_batch_id but add a sort key on it, because a sort key on the distribution column forces Redshift to spread rows with the same key across all slices as it sorts them"
    ],
    correct:2,
    explain:`EVEN distribution is for exactly this: a table with no join partner has nothing to co-locate, and round-robin placement uses every slice for loads and scans, which the single-value DISTKEY was preventing. ALL (the tempting choice for a fast scan) replicates 2 TB onto every node for a table that is never joined, and a sort key orders rows within a slice, it never changes which slice a row lands on.`
  },
  /* Ch 34 - Data masking and PII detection with Amazon Macie */
  {
    q:`A streaming platform runs Amazon Macie across its S3 estate. When Macie reports sensitive data in a bucket that is not on the approved list, the security team currently learns about it days later from a weekly review and then manually restricts the bucket. They want the restriction applied within minutes of the finding, with no one watching a console. What should the engineer build?`,
    opts:[
      "A CloudWatch alarm on the Macie findings count metric, with an SNS topic that pages the security team so they can apply the restriction, because findings cannot be consumed by automation",
      "A nightly Glue job that scans the buckets for PII with a regular expression",
      "A Macie sensitive data discovery job scheduled to run every hour",
      "An EventBridge rule that matches Macie finding events and invokes a Lambda function (or Step Functions workflow) that restricts the bucket and opens a ticket automatically"
    ],
    correct:3,
    explain:`Macie publishes each finding to EventBridge (and Security Hub), so a rule can route it to automation that applies the restriction within minutes, closing the loop without a console. Paging a human (the tempting answer) still leaves the restriction manual and rests on a false claim, since findings are events automation can consume; running discovery jobs more often finds problems faster but does nothing about acting on them.`
  },
  /* Ch 11 - Event-driven pipelines with Amazon EventBridge */
  {
    q:`A hospital's data team runs a Lambda function every two minutes that calls the Glue API to list recent job runs and sends an alert if any has failed, so a failed nightly job is noticed within minutes. The team wants to drop the polling but keep the alerting, and later route failures of specific jobs to different on-call channels. What should they build?`,
    opts:[
      "Keep the polling Lambda but lengthen the interval to ten minutes to cut cost",
      "A CloudWatch Logs subscription filter on each Glue job's log group that forwards every log line to SNS, which is the only way to learn about a job failure without calling the Glue API",
      "An EventBridge rule matching Glue Job State Change events with state FAILED, targeting SNS, with additional rules per job name as routing needs grow",
      "A Glue conditional trigger that starts an alerting job when the nightly job fails"
    ],
    correct:2,
    explain:`A Glue job's state change is itself an event on the bus, so a rule that matches FAILED (optionally narrowed by job name) fires the moment the job fails, with no polling and with per-job routing just another rule. The subscription-filter option (the tempting one) forwards raw log lines rather than a state event and its claim of being the only alternative to polling is false; a Glue conditional trigger can start another Glue job but cannot deliver a notification or route by channel.`
  },
  /* Ch 30 - Data skew and sampling techniques for quality checks */
  {
    q:`A manufacturing company must certify that no record in a 9 TB export of product-safety test results carries an invalid test-station identifier, because any single bad record invalidates the regulatory filing. A data engineer proposes estimating the error rate with a 1 percent stratified sample to save cost. What should the team do?`,
    opts:[
      "Scan the full dataset: when every bad row must be caught, a sample (however well stratified) can only estimate a rate, so it cannot certify that none exist",
      "Use the stratified sample, since stratification guarantees every station is represented",
      "Use a systematic sample of every hundredth row, which is cheaper than stratifying",
      "Use a 10 percent random sample, which is large enough that the probability of missing a single invalid record among nine terabytes falls below any regulator's materiality threshold"
    ],
    correct:0,
    explain:`Sampling estimates overall quality cheaply, but its risk is the same for every method: a non-representative draw hides the very rows being looked for, so when every bad record must be found, such as for a regulatory filing, the full dataset is scanned. The 10 percent random sample (the tempting compromise) still leaves a 90 percent chance of missing any particular bad row, and stratification guarantees group proportions, not the absence of individual bad records.`
  },
  /* Ch 20 - S3 Lifecycle policies and storage class transitions */
  {
    q:`An insurer keeps scanned claim documents in S3. Adjusters open a document frequently for about 90 days after filing; after that, a document is requested rarely but when it is, the adjuster needs it within milliseconds during a phone call. Documents must be kept for 7 years. The team wants the lowest storage cost that still meets the retrieval need. Which lifecycle design fits?`,
    opts:[
      "Transition to S3 Glacier Deep Archive after 90 days and expire after 7 years",
      "Transition to S3 Standard-IA (or Glacier Instant Retrieval) after 90 days, keeping millisecond access, and expire after 7 years",
      "Keep every document in S3 Standard for 7 years so retrieval is never delayed",
      "Transition to S3 Glacier Flexible Retrieval after 90 days and ask adjusters to call back"
    ],
    correct:1,
    explain:`The two deciding questions are how often the data is read and how fast it must come back: rarely read but needed in milliseconds rules out the archive tiers whose restores take minutes to hours, so an infrequent-access class with immediate retrieval is the cheapest fit, with expiration enforcing the retention limit. Deep Archive (the tempting lowest-cost tier) saves the most on storage but its hours-long restore fails the phone-call requirement.`
  }
];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
