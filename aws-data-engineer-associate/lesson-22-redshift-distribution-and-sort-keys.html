/* ----------  CARDS  ---------- */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 2 · Chapter 22</div>
    <h1 class="reveal">Redshift distribution and sort keys</h1>
    <p class="lead reveal">Redshift spreads a table across many <strong>slices</strong> and works them in parallel. Two choices decide whether that parallelism helps or hurts: how rows are <strong>distributed</strong> across slices, and how they are <strong>sorted</strong> within them.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — the MPP setup */
  { html: `
    <div class="eyebrow reveal">The core idea</div>
    <h2 class="reveal">Two levers on every query</h2>
    <div class="art reveal">${A.mpp}</div>
    <p class="lead reveal">Because the data lives across slices, the enemy of speed is <strong>moving data between them</strong> and <strong>scanning more than you need</strong>. The <strong>distribution key</strong> controls which slice a row lands on; the <strong>sort key</strong> controls the order of rows on disk. Both aim to touch less data.</p>
    <div class="spacer"></div>` },

  /* 2 — distribution styles */
  { html: `
    <div class="eyebrow reveal">Distribution</div>
    <h2 class="reveal">KEY, EVEN, or ALL</h2>
    <div class="art reveal">${A.dist}</div>
    <p class="lead reveal"><strong>KEY</strong> sends rows with the same key value to the same slice, so joined tables sharing that key are co-located and need no shuffle. <strong>EVEN</strong> spreads rows round-robin when there is no obvious join key. <strong>ALL</strong> copies a whole table to every node, ideal for small dimension tables, wasteful for large ones.</p>
    <div class="spacer"></div>` },

  /* 3 — skew */
  { html: `
    <div class="eyebrow reveal">The KEY risk</div>
    <h2 class="reveal">A bad key creates skew</h2>
    <div class="art reveal">${A.skew}</div>
    <p class="lead reveal">KEY distribution only helps if the key's values are <strong>evenly spread</strong>. Choose a column with few or lopsided values and most rows pile onto one slice. That slice becomes a bottleneck: the query runs only as fast as its <strong>most overloaded slice</strong>, while the others sit idle.</p>
    <div class="spacer"></div>` },

    <h2 class="reveal">Sort keys let blocks be skipped</h2>

    <p class="lead reveal">A <strong>sort key</strong> stores rows in order on disk. Redshift keeps <strong>zone maps</strong> recording the min and max value in each block, so a query that filters on the sort key can <strong>skip whole blocks</strong> that cannot match. A date sort key over a fact table means a one-quarter report reads a quarter of the blocks.</p>
    <div class="spacer"></div>` },

  /* 5 — choosing */
  { html: `
    <div class="eyebrow reveal">Choosing keys</div>
    <h2 class="reveal">Match keys to the query</h2>
    <p class="lead reveal" style="margin-bottom:18px">The queries tell you what to pick.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Distribute on the join column</b>Co-locate large tables joined on the same key to avoid shuffling, if its values spread evenly.</p></div>
      <div class="pill"><p><b>Sort on the filter column</b>Sort by what queries range over, often a date, so zone maps prune the scan.</p></div>
      <div class="pill"><p><b>Small tables go ALL</b>Replicate small dimensions so joins never move them across nodes.</p></div>
    </div>` },

  /* 6 — quiz: distribution co-locate */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">Two large tables are frequently joined on customer_id, and the join is slow because rows are shuffled between nodes. Which choice removes the shuffle?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span>KEY distribution on customer_id, so matching rows share a slice</button>
      <button class="choice" data-correct="false"><span class="key">B</span>EVEN distribution on both tables</button>
      <button class="choice" data-correct="false"><span class="key">C</span>ALL distribution on both large tables</button>
    </div>
    <div class="feedback"><b>Correct.</b> KEY distribution on the join column co-locates matching rows on the same slice, so the join needs no cross-node shuffle. EVEN spreads rows without regard to the key, leaving the shuffle in place, and replicating two large tables with ALL wastes huge amounts of storage on every node.</div>` },

  /* 7 — quiz: sort key for filtering */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">Queries almost always filter a large fact table by event_date, yet each one scans the whole table. What most directly cuts the data scanned?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Switching the table to EVEN distribution</button>
      <button class="choice" data-correct="true"><span class="key">B</span>A sort key on event_date, so zone maps skip non-matching blocks</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Adding more nodes to the cluster</button>
    </div>
    <div class="feedback"><b>Correct.</b> Sorting on event_date lets Redshift's zone maps skip the blocks outside the filtered range, so a query reads only the relevant dates. Distribution style controls data placement across slices, not how much each slice scans, and adding nodes still scans the whole table, just with more hardware.</div>` },

  /* 8 — done */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Chapter 22 complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">You can now tune a Redshift table with the two keys that matter, and you have finished Unit 2.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Distribution places rows</b>KEY co-locates joins, EVEN spreads, ALL replicates small tables; a bad key causes skew.</p></div>
      <div class="pill"><p><b>Sort orders rows</b>Zone maps skip non-matching blocks, so sort on the column queries filter.</p></div>
      <div class="pill"><p><b>Match keys to queries</b>Distribute on the join column, sort on the filter column.</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
</html>
