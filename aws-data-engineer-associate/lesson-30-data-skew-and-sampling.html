      <rect x="128" y="88" width="70" height="20" rx="5" fill="rgba(217,70,239,0.12)" stroke="var(--accent)" stroke-width="1.2"/><text x="163" y="102" text-anchor="middle" fill="var(--accent)">A#3</text>

/* ----------  CARDS  ---------- */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 3 · Chapter 30</div>
    <h1 class="reveal">Data skew and sampling</h1>
    <p class="lead reveal">Two facts about data at scale shape quality and performance work: data is almost never spread evenly (<strong>skew</strong>), and it is usually too large to inspect every row cheaply (which is why you <strong>sample</strong>). This closing chapter covers both.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — framing */
  { html: `
    <div class="eyebrow reveal">Two realities</div>
    <h2 class="reveal">Uneven, and enormous</h2>
    <p class="lead reveal" style="margin-bottom:18px">Both realities push back on naive processing and naive quality checks.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Skew: data is uneven</b>A few keys or partitions hold most of the rows, so the work does not split evenly across workers.</p></div>
      <div class="pill"><p><b>Scale: data is huge</b>Scanning every row to check quality is slow and costly, so you estimate from a representative sample.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 2 — what skew is */
  { html: `
    <div class="eyebrow reveal">Data skew</div>
    <h2 class="reveal">One task does all the work</h2>
    <p class="lead reveal" style="margin-bottom:18px">When values pile onto a few keys, the workers holding them do far more than the rest.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>The symptom</b>One straggler task runs for minutes while the others finished long ago, and may run out of memory. The job is only as fast as its busiest task.</p></div>
      <div class="pill"><p><b>The cause</b>A lopsided join or partition key: a null, a default, or one mega-customer that owns most of the rows.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 3 — fixing skew */
  { html: `
    <div class="eyebrow reveal">Fixing skew</div>
    <h2 class="reveal">Spread the load</h2>
    <div class="art reveal">${A.salt}</div>
    <p class="lead reveal">You detect skew from per-task duration and shuffle metrics in the Spark UI, Glue metrics, and CloudWatch. Then you spread it: pick a <strong>higher-cardinality key</strong> that distributes evenly, <strong>salt</strong> a hot key by adding a random suffix so one value splits across tasks (then aggregate back), or <strong>repartition</strong> and let Spark adaptive query execution rebalance skewed joins. The same idea as a good Redshift distribution key from Chapter 22.</p>
    <div class="spacer"></div>` },

  /* 4 — sampling why */
  { html: `
    <div class="eyebrow reveal">Sampling</div>
    <h2 class="reveal">Estimate, do not scan it all</h2>
    <p class="lead reveal" style="margin-bottom:18px">Checking every row of a huge dataset is slow and expensive, so a representative sample estimates the whole.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Cheap and fast</b>A well-chosen sample gives a close estimate of overall quality (null rate, distribution) at a fraction of the cost.</p></div>
      <div class="pill"><p><b>Already built in</b>DataBrew profile jobs sample by default, which is why they stay fast on large data.</p></div>
    </div>
    <div class="spacer"></div>` },

    <div class="eyebrow reveal">Choosing a sample</div>
    <h2 class="reveal">Three ways, one risk</h2>
    <div class="art reveal">${A.samp}</div>
    <p class="lead reveal"><strong>Random</strong> gives every row an equal chance. <strong>Stratified</strong> preserves group proportions, so small but important categories are not missed. <strong>Systematic</strong> takes every nth row. The risk is the same for all: a <strong>non-representative</strong> sample hides the very problems you are checking for, so scan the full dataset when every bad row must be caught, such as for compliance.</p>
    <div class="spacer"></div>` },

    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">A Glue Spark job joining on customer_id runs for hours; one task processes far more than the rest and sometimes fails with out-of-memory, because a single customer owns most of the rows. What addresses the root cause?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Increase the job timeout so the slow task can finish</button>
      <button class="choice" data-correct="false"><span class="key">B</span>Add more DPUs to the job</button>
      <button class="choice" data-correct="true"><span class="key">C</span>Salt the hot key so that customer's rows spread across tasks</button>
    </div>
    <div class="feedback"><b>Correct.</b> This is data skew: one key holds most of the rows, so salting spreads that value across multiple tasks and removes the straggler. A longer timeout just waits on the same overloaded task, and more DPUs add workers that sit idle while the one skewed task still does all the work.</div>` },

    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>A simple random sample of a few thousand rows</button>
      <button class="choice" data-correct="true"><span class="key">B</span>A stratified sample that keeps each category's proportion</button>

    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Chapter 30 complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">You can now spot and fix skew, and sample data wisely for quality checks. That closes Unit 3.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Skew slows jobs</b>A hot key overloads one task; fix it with a better key, salting, or repartition and adaptive query execution.</p></div>
      <div class="pill"><p><b>Sample to check at scale</b>Random, stratified, or systematic; estimate quality cheaply instead of scanning everything.</p></div>
      <div class="pill"><p><b>Mind representativeness</b>A biased sample hides problems; scan in full when every bad row must be caught.</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
