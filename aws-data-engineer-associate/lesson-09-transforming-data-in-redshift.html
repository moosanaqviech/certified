<script>
/* ============================================================

/* ----------  ART  (custom SVGs, referenced from cards as ${A.name})  ---------- */
const A = {

    <text x="192" y="107" text-anchor="middle" fill="var(--ink-soft)" font-family="Hanken Grotesk" font-size="9">transform with SQL</text>

  </svg>`,

  elt: `<svg viewBox="0 0 320 180">

      <rect x="102" y="34" width="34" height="22" rx="6" fill="var(--surface-2)" stroke="var(--etl)" stroke-width="1.2"/><text x="119" y="49" text-anchor="middle" fill="var(--etl)">L</text>
    </g>
    <text x="80" y="74" text-anchor="middle" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="8">transform before loading</text>
    <text x="240" y="22" text-anchor="middle" fill="var(--accent)" font-family="Hanken Grotesk" font-size="10" font-weight="700">ELT</text>
    <g font-family="Hanken Grotesk" font-size="8.5" font-weight="700">
      <rect x="184" y="34" width="34" height="22" rx="6" fill="rgba(239,68,68,0.08)" stroke="var(--accent)" stroke-width="1.3"/><text x="201" y="49" text-anchor="middle" fill="var(--accent)">E</text>
      <rect x="223" y="34" width="34" height="22" rx="6" fill="rgba(239,68,68,0.08)" stroke="var(--accent)" stroke-width="1.3"/><text x="240" y="49" text-anchor="middle" fill="var(--accent)">L</text>
      <rect x="262" y="34" width="34" height="22" rx="6" fill="rgba(239,68,68,0.14)" stroke="var(--accent)" stroke-width="1.6"/><text x="279" y="49" text-anchor="middle" fill="var(--accent)">T</text>
    </g>
    <text x="240" y="74" text-anchor="middle" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="8">transform inside the warehouse</text>
    <line x1="160" y1="30" x2="160" y2="86" stroke="var(--line)" stroke-width="1"/>
    <text x="160" y="120" text-anchor="middle" fill="var(--ink)" font-family="Hanken Grotesk" font-size="11" font-weight="700">Redshift is fast at SQL over big data,</text>
    <text x="160" y="138" text-anchor="middle" fill="var(--ink)" font-family="Hanken Grotesk" font-size="11" font-weight="700">so push the transform to it.</text>
    <text x="160" y="162" text-anchor="middle" fill="var(--ink-soft)" font-family="Hanken Grotesk" font-size="9.5">No separate cluster to move data through first.</text>

  transform: `<svg viewBox="0 0 320 150">

/* ----------  CARDS  ---------- */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 1 · Chapter 9</div>
    <h1 class="reveal">Transforming data in Redshift</h1>
    <p class="lead reveal">Chapter 7 transformed data with Glue before loading it. A warehouse flips that order: load the raw data first, then reshape it in place with SQL. That pattern has a name, <strong>ELT</strong>, and Redshift is built for it.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — ELT vs ETL */
  { html: `
    <div class="eyebrow reveal">The core shift</div>
    <h2 class="reveal">ELT: load first, transform in SQL</h2>
    <div class="art reveal">${A.elt}</div>
    <p class="lead reveal">ETL transforms data on a separate engine before loading it. <strong>ELT</strong> loads the raw data into Redshift first, then transforms it there with SQL. Because Redshift is a columnar, massively parallel (MPP) warehouse, running the transform <strong>where the data already sits</strong> avoids shuttling it through another cluster.</p>
    <div class="spacer"></div>` },

  /* 2 — COPY into staging */
  { html: `
    <div class="eyebrow reveal">Step 1: land it</div>
    <h2 class="reveal">COPY loads raw data into staging</h2>
    <div class="art reveal">${A.copy}</div>
    <p class="lead reveal" style="margin-bottom:16px">The <code>COPY</code> command bulk-loads files from S3 into a staging table in parallel across every node. Raw data arrives untransformed, ready to work on.</p>
    <div class="codeblock reveal"><span class="cm">-- parallel bulk load from S3</span>
<span class="kw">COPY</span> staging.events <span class="kw">FROM</span> <span class="st">'s3://lake/raw/events/'</span>
<span class="kw">IAM_ROLE</span> <span class="st">'arn:aws:iam::acct:role/redshift'</span>
<span class="kw">FORMAT AS</span> PARQUET;</div>` },

  /* 3 — CTAS / INSERT INTO SELECT */
  { html: `
    <div class="eyebrow reveal">Step 2: reshape it</div>
    <h2 class="reveal">CTAS and INSERT INTO SELECT</h2>
    <div class="art reveal">${A.transform}</div>
    <p class="lead reveal" style="margin-bottom:16px">The transform is ordinary SQL. <code>CREATE TABLE AS</code> (CTAS) builds a new table from a query; <code>INSERT INTO SELECT</code> appends transformed rows into a production table. Both run on Redshift's parallel engine.</p>
    <div class="codeblock reveal"><span class="cm">-- clean and shape into production</span>
<span class="kw">CREATE TABLE</span> prod.daily_sales <span class="kw">AS</span>
<span class="kw">SELECT</span> region, <span class="kw">date_trunc</span>(<span class="st">'day'</span>, ts) d, <span class="kw">sum</span>(amount)
<span class="kw">FROM</span> staging.events <span class="kw">GROUP BY</span> 1, 2;</div>` },

  /* 4 — materialized views */
  { html: `
    <div class="eyebrow reveal">Precompute the heavy work</div>
    <h2 class="reveal">Materialized views cache the result</h2>
    <div class="art reveal">${A.mview}</div>
    <p class="lead reveal">When a dashboard runs the same expensive aggregation again and again, a <strong>materialized view</strong> computes it once and stores the result. Redshift can <strong>auto-refresh</strong> it as base data changes, so queries read a precomputed answer instead of re-scanning the whole fact table. A plain view, by contrast, re-runs its query every time.</p>
    <div class="spacer"></div>` },

  /* 5 — putting the pattern together */
  { html: `
    <div class="eyebrow reveal">The pattern</div>
    <h2 class="reveal">Staging to production, orchestrated</h2>
    <p class="lead reveal" style="margin-bottom:18px">Real pipelines chain these steps and wrap them in logic.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Staging then production</b>COPY into staging, transform with CTAS or INSERT SELECT, publish clean tables downstream.</p></div>
      <div class="pill"><p><b>Stored procedures</b>Wrap multi-step transforms in a procedure for control flow, error handling, and reuse.</p></div>
      <div class="pill"><p><b>Query S3 in place</b>Redshift Spectrum reads S3 data directly for ELT that never fully loads it (Chapter 25).</p></div>
    </div>` },

  /* 6 — quiz: ELT choice */
  { quiz: true,
    html: `

    <h2 class="reveal" style="font-size:20px">A team already loads large raw datasets into Redshift and wants to transform them using the warehouse's own compute, without moving data out to a separate Spark cluster. Which approach fits?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Export the data to AWS Glue, transform there, and reload it</button>
      <button class="choice" data-correct="true"><span class="key">B</span>An ELT pattern: transform in place with SQL using CTAS and INSERT INTO SELECT</button>

    </div>
    <div class="feedback"><b>Correct.</b> With the data already in Redshift, ELT keeps the transform in SQL on the warehouse's MPP engine, no extra cluster and no data movement. Exporting to Glue or pre-processing with Lambda both pull data back out of the warehouse, which is exactly what ELT avoids.</div>` },

  { quiz: true,

      <button class="choice" data-correct="false"><span class="key">A</span>A standard view over the fact table</button>

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
