<style>
  /* =====================================================================
     EXAM SHELL - frozen. Do not edit anything in this style block.
     All per-exam customization lives in the EXAM PAYLOAD script section.
  ===================================================================== */
  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;
    --ink-soft:#a7a59f; --ink-faint:#6b6a66; --gold:#e3b84a; --green:#34d3a6; --red:#e8625c;
    --line:rgba(255,255,255,0.08);
    --display:"Fraunces",Georgia,serif; --body:"Hanken Grotesk",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:radial-gradient(1100px 650px at 50% -8%,#1a1d29 0%,transparent 58%),var(--bg);font-family:var(--body);color:var(--ink);min-height:100vh;line-height:1.5;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* sticky top */
  .top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .timer.warn{color:var(--gold);}
  .timer svg{opacity:.7;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  /* intro */
  .intro{text-align:center;margin:auto 0;padding:30px 0;}
  .intro .badge{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px;}
  .intro h1{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.05;letter-spacing:-0.02em;margin-bottom:16px;}
  .intro p{color:var(--ink-soft);font-size:15.5px;max-width:30em;margin:0 auto 14px;}
  .facts{display:flex;justify-content:center;gap:0;margin:24px 0 28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .fact{flex:1;padding:16px 10px;}
  .fact+.fact{border-left:1px solid var(--line);}
  .fact b{display:block;font-family:var(--display);font-size:22px;font-weight:600;color:var(--gold);}
  .fact span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#14110c;font-weight:700;font-size:16px;padding:15px 30px;border-radius:14px;border:none;cursor:pointer;transition:transform .15s ease;font-family:var(--body);}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.35;pointer-events:none;}

  /* question */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .qnum{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:0.04em;}
  .flag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-faint);background:transparent;border:1px solid var(--line);border-radius:100px;padding:5px 12px;cursor:pointer;transition:.15s;font-family:var(--body);}
  .flag.on{color:var(--gold);border-color:var(--gold);background:rgba(227,184,74,0.1);}
  .qtext{font-size:18px;line-height:1.5;font-weight:500;margin-bottom:20px;}
  .qtext code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:5px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);line-height:1.4;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:rgba(255,255,255,0.2);}
  .opt.sel{border-color:var(--gold);background:rgba(227,184,74,0.08);}
  .opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .opt.sel .key{background:var(--gold);color:#14110c;}

  /* review states */
  .opt.correct{border-color:var(--green);background:rgba(52,211,166,0.1);}
  .opt.correct .key{background:var(--green);color:#072018;}
  .opt.incorrect{border-color:var(--red);background:rgba(232,98,92,0.1);}
  .opt.incorrect .key{background:var(--red);color:#2a0a08;}
  .explain{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .explain b{color:var(--ink);}

  /* nav dots */
  .nav-dots{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 4px;justify-content:center;}
  .dot{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-faint);cursor:pointer;transition:.15s;font-family:var(--body);}
  .dot.answered{background:var(--surface-2);color:var(--ink);border-color:rgba(255,255,255,0.18);}
  .dot.current{border-color:var(--gold);color:var(--gold);}
  .dot.flagged{box-shadow:inset 0 0 0 2px rgba(227,184,74,0.5);}

  /* footer nav */
  .foot{display:flex;gap:12px;margin-top:24px;}
  .foot .btn{flex:1;}

  /* results */
  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:140px;height:140px;margin:6px auto 18px;}
  .scorering svg{transform:rotate(-90deg);}
  .scorering .tr{stroke:rgba(255,255,255,0.1);}
  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scorering .ctr b{font-family:var(--display);font-size:38px;font-weight:600;line-height:1;}
  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .verdict{font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:6px;}
  .verdict.pass{color:var(--green);}
  .verdict.fail{color:var(--gold);}
  .res p{color:var(--ink-soft);font-size:14.5px;max-width:28em;margin:0 auto 22px;}
  .res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}

<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 5",
  badge: "AWS Data Engineer Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Most questions have one best answer; a few ask you to select two.",
  coverage: "Full coverage, all 36 chapters: Units 1-4, a second pass with entirely new scenarios.",
  minutes: 72,
  pass: 72
};

const QUESTIONS = [

  /* Ch 01 - Streaming vs batch ingestion */
  {
    q:`A single source of order events must feed a real-time inventory service and a nightly financial reconciliation. A reviewer insists a team must commit to either streaming or batch for a given source. What is the accurate position?`,
    opts:[
      "The reviewer is right: mixing the two on one source produces duplicate records",
      "The reviewer is right: a source can have only one ingestion pipeline attached to it",
      "The reviewer is wrong, but only because batch can always be simulated by buffering a stream for 24 hours",
      "The reviewer is wrong: the choice belongs to each consumer, so one source can be streamed for the inventory service and batch-loaded for the nightly reconciliation"
    ],
    correct:3,
    explain:`Ingestion style is a property of what a consumer needs, not of the source, so the same events can travel a streaming path and a batch path. The buffering answer is close but states it too narrowly: the point is not that batch is a degraded stream, it is that each consumer's staleness tolerance decides its own path.`
  },

  /* Ch 02 - Kinesis Data Streams: shards, retention, replay */
  {
    q:`A stream in provisioned mode has run at 6 shards for a year. Sustained ingest has now doubled and producers see write throttling. The team wants to increase capacity without changing producer or consumer code. What do they do?`,
    opts:[
      "Recreate the stream with more shards and repoint every producer and consumer",
      "Reshard the stream by splitting shards to raise its total throughput, which producers and consumers handle transparently as the shard set changes",
      "Extend the retention period so throttled records are retried later",
      "Register the consumers for enhanced fan-out, which raises write capacity"
    ],
    correct:1,
    explain:`Resharding (splitting shards, or scaling the shard count) is the supported way to grow a provisioned stream in place, and clients using the standard libraries follow the shard set as it changes. Enhanced fan-out is the tempting distractor, but it adds dedicated read throughput per consumer and does nothing for the write side, which is where the throttling is.`
  },

  /* Ch 03 - Kinesis Data Streams vs Amazon MSK */
  {
    q:`A team needs an event log that retains a topic's full history indefinitely, so a new consumer joining in two years can rebuild its state from the beginning. Which option supports that requirement directly?`,
    opts:[
      "Kinesis Data Streams, by setting the retention period to its maximum",
      "Amazon Data Firehose, whose delivery streams retain records until read",
      "Amazon MSK, where Kafka topic retention can be set to retain data indefinitely (and log compaction can keep the latest value per key)",
      "Either service: both retain stream data indefinitely by default"
    ],
    correct:2,
    explain:`Unbounded retention and log compaction are Kafka capabilities, so MSK is what supports rebuilding state from the beginning of a topic years later. Kinesis retention is generous but bounded, so it is the tempting near-miss, and Firehose retains nothing for consumers at all.`
  },

  /* Ch 04 - Amazon Data Firehose */
  {
    q:`A Firehose stream to S3 is configured with a large buffer size and a long buffer interval. Downstream Athena users are happy with the file sizes but the operations team complains that data takes too long to appear. What is the trade-off being made?`,
    opts:[
      "Buffering trades delivery latency against object size: larger buffers produce fewer, larger objects that query efficiently, while smaller buffers deliver sooner but create many small files",
      "Buffering affects only cost, not latency or file size",
      "Larger buffers reduce latency because Firehose flushes as soon as the buffer is allocated",
      "Buffer settings apply only to the S3 backup location, not to the primary destination"
    ],
    correct:0,
    explain:`Firehose flushes when either the buffer size or the buffer interval is reached, so tuning them moves the pipeline along a single axis between fresh-but-fragmented and delayed-but-well-sized. Believing larger buffers reduce latency inverts the mechanism, and the small files it would otherwise avoid are exactly what makes Athena queries slow.`
  },

  /* Ch 05 - Amazon Managed Service for Apache Flink */
  {
    q:`A team of SQL-fluent analysts, with no Java or Scala experience, needs windowed aggregations over a Kinesis data stream. What should you tell them about building this on Managed Service for Apache Flink?`,
    opts:[
      "They must hire Java developers, since Flink applications are written only in Java or Scala",
      "They should use Amazon Athena instead, since it can query a Kinesis data stream directly",
      "They should first land the stream in S3 and query it with Athena, because Flink cannot express windowed aggregations in SQL",
      "Flink applications can be authored in SQL as well as Python and Java, so the analysts can express windowed aggregations without learning a JVM language"
    ],
    correct:3,
    explain:`Managed Service for Apache Flink supports SQL and Python alongside Java, so windowing and aggregation are expressible without JVM skills. Landing in S3 and querying with Athena is the tempting fallback, but it converts a continuous computation into periodic batch queries and gives up the sub-minute results the streaming design exists to provide.`
  },

  /* Ch 06 - Batch ingestion sources: S3, DMS, AppFlow */
  {
    q:`A company is moving a self-managed PostgreSQL database to Amazon RDS for PostgreSQL, with the same engine on both sides and no schema changes. What does the migration require?`,
    opts:[
      "AWS SCT to convert the schema, then AWS DMS to move the data",
      "AWS DMS alone, since the source and target run the same engine so no schema conversion is needed",
      "Amazon AppFlow, configured with a PostgreSQL connector",
      "A manual dump and restore, because DMS supports only heterogeneous migrations"
    ],
    correct:1,
    explain:`Schema conversion is only needed when the engines differ; a homogeneous migration goes straight to DMS, which handles the full load and ongoing replication. Reaching for SCT anyway is the reflex the exam tests, and it adds a conversion step with nothing to convert.`
  },

  /* Ch 07 - AWS Glue for ETL */
  {
    q:`A Glue job reads semi-structured JSON whose <code>quantity</code> field arrives sometimes as a number and sometimes as a string. Which TWO statements about DynamicFrames are correct?`,
    opts:[
      "A DynamicFrame is self-describing and can hold a choice type, recording both observed types for a field instead of failing on the conflict",
      "ResolveChoice lets the job settle the ambiguity explicitly, for example by casting to one type or projecting the field into separate typed columns",
      "A DynamicFrame requires a schema to be declared before the job reads any data",
      "A DynamicFrame cannot be converted to a Spark DataFrame, so a job must choose one model for its whole lifetime",
      "DynamicFrames can only read from Amazon S3, so catalog and JDBC sources need DataFrames"
    ],
    correct:[0,1],
    explain:`The pair is the point of DynamicFrames: they tolerate schema conflicts by carrying a choice type, and ResolveChoice is how you then decide what the field should be. The others are false: no schema is declared up front, DynamicFrames convert to and from DataFrames freely, and they read from catalog and JDBC sources as well as S3.`
  },

  /* Ch 08 - AWS Glue vs Amazon EMR */
  {
    q:`A data science group wants a shared environment where they can run interactive notebooks, use Presto for exploratory SQL, run Spark jobs, and try Apache Hudi, all against the same cluster and all tunable by them. Which service fits?`,
    opts:[
      "Amazon EMR, which runs a multi-framework Hadoop ecosystem cluster the team can configure and attach notebooks to",
      "AWS Glue, adding one job per framework",
      "AWS Glue interactive sessions, which provide Presto and Hudi alongside Spark",
      "Amazon Athena, which covers every framework in the list"
    ],
    correct:0,
    explain:`Multiple frameworks on one configurable cluster is the EMR profile: Spark, Presto, Hudi, and notebooks all coexist, and the team owns the tuning. Glue is the tempting serverless answer, but it is a managed Spark ETL service rather than a Hadoop ecosystem, so most of the list simply is not there.`
  },

  /* Ch 09 - Transforming data in Amazon Redshift */
  {
    q:`Data is already loaded in Amazon Redshift. A proposal suggests UNLOADing it to S3, transforming it in an AWS Glue Spark job, and COPYing the results back. The transformations are joins, aggregations, and window functions. What should a reviewer say?`,
    opts:[
      "The design is sound: Spark handles window functions that Redshift SQL cannot express",
      "The design is sound, because transformations should never run on a warehouse cluster",
      "The round trip adds two data movements and a second engine for work Redshift SQL already does well, so the transformation should run in place as ELT",
      "The design should use Redshift Spectrum for the transformation step instead of Glue"
    ],
    correct:2,
    explain:`When the data already lives in the warehouse and the work is relational, ELT in SQL avoids exporting, reprocessing, and reloading it. The claim that Redshift cannot do window functions is the tempting technical objection, but it is simply false, and Spectrum is for reading data that is still in S3.`
  },

  /* Ch 10 - Step Functions vs Amazon MWAA */
  {
    q:`A workflow must process an unknown number of files (sometimes 5, sometimes 5,000) by running the same Lambda function against each one, with bounded concurrency and per-item error handling. Which Step Functions feature is designed for this?`,
    opts:[
      "A Parallel state with one branch defined per file",
      "A Wait state that loops until all files are processed",
      "A Choice state that recursively re-enters the workflow once per file",
      "A Map state, which runs the same processing steps for each item in a collection, with a configurable maximum concurrency"
    ],
    correct:3,
    explain:`Map is the iteration primitive: it applies the same sub-workflow to every element of a collection with a concurrency limit, so the workflow does not need to know the count in advance. A Parallel state is the tempting neighbor, but its branches are fixed in the definition, so it cannot adapt to a varying number of files.`
  },

  /* Ch 11 - Event-driven pipelines with Amazon EventBridge */
  {
    q:`A team maintains a small EC2 instance whose only job is to run cron entries that call AWS APIs on schedules. They want to retire the instance without rewriting the schedules as application code. What replaces it?`,
    opts:[
      "An always-on Lambda function that sleeps between scheduled actions",
      "EventBridge scheduled rules (or EventBridge Scheduler) using cron or rate expressions to invoke the targets directly, with no server to operate",
      "An AWS Batch job queue polled continuously by a compute environment",
      "A Step Functions workflow with Wait states approximating each cron entry"
    ],
    correct:1,
    explain:`EventBridge supports cron and rate expressions natively and invokes targets directly, which is a direct replacement for a cron server. The always-on Lambda option is the tempting lift-and-shift, but Lambda bills for the whole sleeping duration and caps out at 15 minutes, so it cannot hold a daily schedule anyway.`
  },

  /* Ch 12 - Infrastructure as code and CI/CD */
  {
    q:`A CloudFormation stack update fails partway through: three of eight resources were updated before an error. What does CloudFormation do, and what should the team inspect before retrying?`,
    opts:[
      "It leaves the three updated resources in place and marks the stack as partially deployed, so the team must reconcile the difference by hand",
      "It deletes the stack entirely, so the team must redeploy from scratch",
      "It rolls the stack back to its previous state automatically, and the team should inspect the stack events to find the resource and reason that caused the failure, then use a change set to preview the corrected update",
      "It retries the failed resource indefinitely until it succeeds"
    ],
    correct:2,
    explain:`Automatic rollback to the last known good state is what makes a stack a safe deployment unit, and the stack events log names the failing resource and its error. Assuming a partially deployed stack is the tempting worry, and it is exactly the outcome that CloudFormation's rollback behavior is designed to prevent.`
  },

  /* Ch 13 - Lambda for data processing */
  {
    q:`One malformed record in a Kinesis data stream causes a Lambda consumer to throw an exception. Because the batch keeps failing and retrying, the shard stops making progress and lag grows for every downstream consumer. What resolves this?`,
    opts:[
      "Configure the event source mapping's failure handling: bisect the batch on error to isolate the bad record, cap the retry attempts, and send failed records to an on-failure destination",
      "Increase the function's memory so the record parses successfully",
      "Increase the batch size so the malformed record is a smaller fraction of each batch",
      "Enable provisioned concurrency so a fresh instance handles the record"
    ],
    correct:0,
    explain:`This is the poison pill problem, and the event source mapping has the controls for it: bisecting on error narrows the failure to the offending record, a retry limit stops the infinite loop, and an on-failure destination captures it so the shard can move on. Adjusting memory or batch size is the tempting performance thinking, but the batch fails for a data reason and will fail identically at any size.`
  },

  /* Ch 14 - Choosing a data store: Redshift vs DynamoDB vs RDS */
  {
    q:`An Amazon RDS instance backs a production application. Analysts have started running multi-hour aggregate queries against it, and the application's latency now degrades every afternoon. What is the appropriate fix?`,
    opts:[
      "Increase the RDS instance size until both workloads fit comfortably",
      "Move the analytical workload off the operational database into a warehouse such as Amazon Redshift (or a lake queried with Athena), loaded from RDS on a schedule",
      "Ask the analysts to run their queries at night against the same instance",
      "Convert the RDS tables to DynamoDB so both workloads scale independently"
    ],
    correct:1,
    explain:`OLTP and OLAP workloads have different shapes and should not compete for the same instance, so the analytical work belongs in a store built for scans and aggregations. Scaling the instance is the tempting quick fix, but it treats a workload separation problem as a capacity problem and the contention returns as either side grows.`
  },

  /* Ch 15 - Data lakes on S3 */
  {
    q:`A director asks why the company keeps analytical data in S3 rather than loading everything into the warehouse. Which statement best captures the architectural reason?`,
    opts:[
      "S3 is faster than a warehouse for every query shape",
      "S3 enforces schemas on write, which improves data quality",
      "Warehouses cannot store semi-structured data at all",
      "S3 decouples storage from compute, so one copy of the data can be read by Athena, Redshift Spectrum, EMR, and Glue, and storage scales and is priced independently of any engine"
    ],
    correct:3,
    explain:`Decoupling is the point: the data sits in an open format in one place and different engines are attached and detached as needs change, with storage cost independent of compute. The speed claim is the tempting oversimplification, since a well-tuned warehouse usually beats a lake on the queries it was designed for; the lake's advantage is flexibility and cost, not raw latency.`
  },

  /* Ch 16 - AWS Glue Data Catalog and crawlers */
  {
    q:`A team's S3 datasets have well-known, stable schemas that are defined in their infrastructure-as-code repository. An engineer proposes running crawlers hourly across all of them anyway. What is the reasonable objection?`,
    opts:[
      "Crawlers exist to discover unknown or changing structure; for schemas the team already defines and version-controls, the table definitions can be created directly, so hourly crawling adds cost and a source of unexpected schema changes",
      "Crawlers cannot be scheduled more often than once a day",
      "Crawlers can only create tables, so they would fail on datasets that already have table definitions",
      "Crawlers would convert the underlying files, which the team does not want"
    ],
    correct:0,
    explain:`Crawlers earn their cost when structure is unknown or evolving; when the schema is already authored and version-controlled, defining tables directly is cheaper and keeps the catalog matching the reviewed definition. Crawlers never modify underlying files, which is a common misconception and a different objection entirely.`
  },

  /* Ch 17 - Schema discovery and schema evolution */
  {
    q:`A producer must evolve an Avro schema without breaking consumers still reading with the previous version. Which TWO changes are safe under backward-compatible evolution?`,
    opts:[
      "Adding a new optional field that has a default value",
      "Widening a field's type from int to long",
      "Removing a required field that consumers still read",
      "Renaming an existing field to a clearer name",
      "Narrowing a field's type from long to int"
    ],
    correct:[0,1],
    explain:`Additive changes with defaults and type widenings preserve the ability to read older data, which is what backward compatibility requires. Removing a required field, renaming one, or narrowing a type all break readers or risk losing values, and a rename is especially deceptive because it looks additive while actually dropping the old field.`
  },

  /* Ch 18 - AWS Schema Conversion Tool */
  {
    q:`After running AWS SCT against a Microsoft SQL Server source and applying the converted schema to Amazon Aurora PostgreSQL, a team finds the target tables exist but contain no rows. What is the correct interpretation?`,
    opts:[
      "The conversion failed silently and must be re-run with a larger SCT instance",
      "SCT converts and applies schema objects and code, but it does not migrate rows; AWS DMS performs the data migration as the next step",
      "SCT migrates data only for tables under a size threshold, so the large tables were skipped",
      "The target must be Amazon RDS for PostgreSQL rather than Aurora for data to be copied"
    ],
    correct:1,
    explain:`The division of labor is the exam point: SCT converts structure and procedural code, DMS moves the data, and empty target tables after conversion are the expected intermediate state. Reading empty tables as a failure is the tempting conclusion, and it sends teams debugging a conversion that actually succeeded.`
  },

  /* Ch 19 - Open table formats: Apache Iceberg on S3 */
  {
    q:`Queries against a Hive-style partitioned table only prune partitions when analysts remember to filter on the derived <code>event_day</code> column rather than the raw <code>event_timestamp</code>. What does Iceberg offer here?`,
    opts:[
      "Nothing: partition pruning always requires filtering on the physical partition column",
      "Hidden partitioning, where the table records how partition values derive from a source column, so a filter on the timestamp prunes partitions without the analyst knowing the layout",
      "Automatic conversion of every query to a full table scan, which removes the inconsistency",
      "A requirement that all queries include the partition column, enforced at query time"
    ],
    correct:1,
    explain:`Hidden partitioning stores the transform from source column to partition value in table metadata, so Iceberg applies it during planning and a filter on the raw timestamp still prunes. That also means the physical layout can change later (partition evolution) without rewriting every query, which is the deeper benefit.`
  },

  /* Ch 20 - S3 Lifecycle and storage class transitions */
  {
    q:`A team is choosing between S3 Standard-IA and S3 One Zone-IA for derived Parquet files that can be regenerated from raw data in a few hours. Cost is the priority. What should drive the decision?`,
    opts:[
      "One Zone-IA is unsuitable because it charges retrieval fees that Standard-IA does not",
      "Standard-IA should always be chosen, because One Zone-IA has a longer minimum storage duration",
      "One Zone-IA is unsuitable for any production data regardless of reproducibility",
      "One Zone-IA stores data in a single Availability Zone, so it costs less but loses the data if that AZ is lost; that risk is acceptable precisely because these files are reproducible"
    ],
    correct:3,
    explain:`The trade in One Zone-IA is durability across Availability Zones for a lower price, so the right question is what happens if the data is lost. Regenerable derived files tolerate that, which makes this one of its intended uses; both IA classes charge retrieval fees, so that is not the differentiator.`
  },

  /* Ch 21 - DynamoDB TTL, versioning, and lifecycle */
  {
    q:`A team enables TTL on a DynamoDB table, pointing it at an <code>expires_at</code> attribute they populate with an ISO 8601 timestamp string. Weeks pass and nothing is ever deleted. What is wrong?`,
    opts:[
      "The TTL attribute must hold a Number containing a Unix epoch timestamp in seconds, so a string value is ignored and no item ever expires",
      "TTL requires the attribute to be part of the table's primary key",
      "TTL only deletes items written after TTL was enabled, so the existing items are unaffected",
      "TTL must be enabled per item using a conditional write, not at the table level"
    ],
    correct:0,
    explain:`TTL evaluates a Number attribute holding epoch seconds; anything else, including a formatted date string, is simply skipped, which is why deletion appears to do nothing. Assuming TTL only applies to newly written items is the tempting explanation for the same symptom, but it would still have expired items written since enabling.`
  },

  /* Ch 22 - Redshift distribution and sort keys */
  {
    q:`A data engineer is deciding which tables should use DISTSTYLE ALL. Which TWO characteristics make a table a good candidate?`,
    opts:[
      "It is small enough that a full copy on every node is affordable",
      "It is joined by many large fact tables, so replicating it removes redistribution from those joins",
      "It is the largest fact table in the warehouse, so replication spreads its scan cost",
      "It receives very high write throughput throughout the day",
      "Its rows must be distributed evenly across slices for load balancing"
    ],
    correct:[0,1],
    explain:`ALL distribution suits small, frequently joined dimension tables: the storage multiplier is affordable and every join against them becomes local. Large tables and write-heavy tables are the wrong candidates, since replication multiplies both storage and write cost, and wanting even spread across slices describes EVEN distribution instead.`
  },

  /* Ch 23 - Automating data processing with Glue and Step Functions */
  {
    q:`An orchestration must call a partner REST API that occasionally times out, then run a Glue job, and if the API ultimately fails after retries it must run a compensating cleanup step rather than stopping. Which design expresses this best?`,
    opts:[
      "A Glue workflow, using a conditional trigger to run cleanup when the first job fails",
      "An EventBridge rule chain, with a dead-letter queue capturing failures for later manual cleanup",
      "A Step Functions state machine, using Retry on the API task for the timeouts and Catch to route a final failure to the cleanup state",
      "A Lambda function implementing the retries, timeouts, and cleanup in code"
    ],
    correct:2,
    explain:`Retry with backoff plus Catch routing to a compensating state is exactly what Step Functions expresses declaratively, and the pipeline spans services rather than living inside Glue. A Glue workflow is the tempting choice because a Glue job is involved, but workflows orchestrate Glue resources and have no way to call and retry an external API.`
  },

  /* Ch 24 - Querying data with Amazon Athena */
  {
    q:`A finance director wants Athena spend attributed per department and wants the marketing team's exploratory queries to be unable to affect the finance team's reporting queries. What provides both?`,
    opts:[
      "One IAM policy per department restricting which tables each can read",
      "A separate AWS account per department, with cross-account bucket policies",
      "A separate S3 bucket per department, with lifecycle rules per bucket",
      "A separate Athena workgroup per department, each with its own query result location, data usage controls, and CloudWatch metrics for cost attribution"
    ],
    correct:3,
    explain:`Workgroups are Athena's isolation and cost-attribution boundary: per-workgroup metrics attribute spend and per-workgroup data limits stop one team's runaway query from becoming everyone's problem. IAM policies are the tempting answer, but they govern which data can be read, not how much a query may scan or whose budget it lands on.`
  },

  /* Ch 25 - Redshift Spectrum: federated and cross-service queries */
  {
    q:`A single Redshift query must join local warehouse tables, three years of Parquet history in S3, and current order status held in an Amazon RDS for PostgreSQL database. Which capabilities does this require?`,
    opts:[
      "Redshift Spectrum for both the S3 history and the PostgreSQL data, since both are external",
      "Redshift Spectrum for the S3 history via external tables, and a federated query to read the live PostgreSQL data",
      "A federated query for both, since Spectrum reads only Redshift-managed storage",
      "Neither: all three sources must be loaded into the cluster before they can be joined"
    ],
    correct:1,
    explain:`The two features cover different externals: Spectrum reads files in S3 through external tables, while federated query reaches into a live operational database such as RDS or Aurora. Using Spectrum for both is the common conflation, and it fails because Spectrum has no way to read a running relational engine.`
  },

  /* Ch 26 - Log analysis with Athena and OpenSearch Service */
  {
    q:`An engineer needs to investigate an incident that happened 20 minutes ago by searching the last hour of Lambda function logs for a correlation ID, with no infrastructure to set up and no table to define. What is the most direct tool?`,
    opts:[
      "CloudWatch Logs Insights, querying the function's log group directly",
      "Amazon Athena, after exporting the log group to S3 and defining a table over it",
      "Amazon OpenSearch Service, after configuring a subscription filter and index template",
      "Amazon Macie, scanning the log group for the correlation ID"
    ],
    correct:0,
    explain:`The logs are already in CloudWatch Logs, so Logs Insights queries them in place with nothing to build, which is the right reach for a one-hour investigation. Athena and OpenSearch both fit the same broad job but require the logs to be exported or indexed first, which is worthwhile for long retention or continuous dashboards, not for a single incident.`
  },

  /* Ch 27 - Monitoring pipelines with CloudWatch */
  {
    q:`An on-call rotation is being paged constantly: a single slow Glue run triggers three separate alarms (duration, downstream queue depth, and freshness), even though the pipeline is still meeting its SLA. What reduces the noise without hiding real failures?`,
    opts:[
      "Delete two of the three alarms and keep only the duration alarm",
      "Raise every alarm threshold until the pages stop",
      "A composite alarm that pages only when the relevant alarms indicate a genuine problem together, leaving the individual alarms in place for diagnosis",
      "Move all three alarms to a CloudWatch dashboard and stop paging entirely"
    ],
    correct:2,
    explain:`Composite alarms combine existing alarm states into one paging condition, so correlated symptoms of a single event produce one page while the underlying alarms remain available for diagnosis. Deleting alarms or inflating thresholds is the tempting quick fix, but both work by discarding signal and will eventually hide a real outage.`
  },

  /* Ch 28 - Auditing with CloudTrail */
  {
    q:`A security reviewer opens the CloudTrail console in a new account and finds recent API activity already listed, but no record of S3 object reads. Which TWO statements explain what they are seeing?`,
    opts:[
      "Management events are recorded by default and visible in CloudTrail Event history for a recent rolling window, which is why the account already shows activity",
      "S3 object-level operations are data events, which are not logged unless explicitly enabled on a trail",
      "Data events are enabled by default and must be explicitly disabled to reduce cost",
      "CloudTrail Event history retains all events for seven years by default",
      "CloudTrail records application log output alongside API calls"
    ],
    correct:[0,1],
    explain:`Management events are captured by default and browsable in Event history for a recent window, while data events such as S3 GetObject and PutObject are high volume and opt-in per trail. Assuming data events are on by default is the misconception that leaves teams believing they have object-level auditing when they do not, and Event history is a short rolling window rather than long-term retention.`
  },

  /* Ch 29 - Data quality checks with AWS Glue DataBrew */
  {
    q:`A team wants data quality rules expressed as code, evaluated against a catalog table inside their existing Glue ETL pipeline, with results published so a failing run can stop promotion to the curated zone. What fits?`,
    opts:[
      "A DataBrew project opened by an analyst before each run",
      "AWS Glue Data Quality, defining rules in DQDL against the catalog table and evaluating them as a step in the pipeline, so the outcome can gate promotion",
      "An Amazon Macie job configured with custom data identifiers",
      "A Glue crawler with a schema change policy set to fail on unexpected values"
    ],
    correct:1,
    explain:`Glue Data Quality is the code-defined option: rules are written in DQDL against catalog tables and evaluated inside the pipeline, producing a result the workflow can branch on. A DataBrew project is the tempting neighbor, but it is an interactive visual session rather than an automated gate, and Macie looks for sensitive data rather than quality violations.`
  },

  /* Ch 30 - Data skew and sampling techniques */
  {
    q:`To estimate the null rate of a column quickly, an analyst runs a query with <code>LIMIT 100000</code> against a table partitioned by date and reports the result as the dataset's overall null rate. Why is this unreliable?`,
    opts:[
      "A LIMIT returns whichever rows the engine reads first, typically concentrated in a few partitions, so the sample reflects those partitions rather than the whole dataset",
      "LIMIT is not supported on partitioned tables, so the result is undefined",
      "100,000 rows is always too small a sample regardless of how it is chosen",
      "LIMIT forces a full scan, so the query is expensive without being more accurate"
    ],
    correct:0,
    explain:`LIMIT stops early rather than sampling, so the rows come from whatever the engine happened to read first, which on a partitioned table skews toward a handful of partitions. The size of the sample is not the core problem: a properly randomized or stratified sample of the same size can estimate the rate well, which is why the sampling method matters more than the row count.`
  },

  /* Ch 31 - IAM authentication for data services */
  {
    q:`An AWS Glue job in the analytics account must read an S3 bucket owned by the data-platform account. Neither team wants to create or share long-lived credentials. What is the standard mechanism?`,
    opts:[
      "Make the bucket public and restrict access by source IP address",
      "Create an IAM user in the data-platform account and store its access keys in the Glue job parameters",
      "Copy the data into the analytics account nightly so no cross-account access is needed",
      "A role in the data-platform account with a trust policy allowing the analytics account's Glue role to assume it, plus a bucket policy granting that role access"
    ],
    correct:3,
    explain:`Cross-account access is expressed as role assumption: the resource account's role trusts the calling principal, and the caller receives temporary credentials for it. Creating a user and sharing its keys is the tempting shortcut, and it reintroduces exactly the long-lived secret both teams said they wanted to avoid.`
  },

  /* Ch 32 - IAM policies vs Lake Formation permissions */
  {
    q:`An administrator grants an analyst SELECT on three columns of a table through Lake Formation, but the analyst's Athena query still fails with an access denied error. What is the most likely cause?`,
    opts:[
      "Lake Formation column-level grants take up to 24 hours to take effect",
      "Athena does not honor Lake Formation permissions and requires bucket policies instead",
      "Both gates must allow the access: the analyst's IAM identity policy has to permit the Athena and Glue Catalog actions involved, in addition to the Lake Formation grant on the data",
      "Column-level grants require the table to be stored in Apache Iceberg format"
    ],
    correct:2,
    explain:`IAM and Lake Formation are not alternatives, they are layered: IAM decides which API calls the principal may make, and Lake Formation decides which catalog data those calls may touch, so a missing IAM permission blocks a correctly granted table. Reading the failure as a Lake Formation problem is the tempting diagnosis and sends the administrator to re-grant permissions that were already correct.`
  },

  /* Ch 33 - Encryption with AWS KMS */
  {
    q:`A bucket holds internal analytics output. The team wants server-side encryption at rest, has no requirement to audit individual decryptions, no need to revoke access by key policy, and wants to avoid per-request key charges at high volume. Which option fits?`,
    opts:[
      "SSE-S3, where S3 manages the keys, with no KMS request charges and no key policy to administer",
      "SSE-KMS with an AWS managed key, since it is functionally identical to SSE-S3",
      "SSE-KMS with a customer managed key, since customer managed keys are always the recommended default",
      "Client-side encryption, so the data is encrypted before it reaches S3"
    ],
    correct:0,
    explain:`SSE-S3 satisfies encryption at rest with nothing to manage and no per-request KMS charges, which matches a workload that needs none of what KMS adds. Defaulting to a customer managed key is the tempting "more secure is always better" answer, but it buys auditability and revocation the team explicitly does not need, at real cost and administrative overhead.`
  },

  /* Ch 34 - Data masking and PII detection with Amazon Macie */
  {
    q:`A team is planning how to run Amazon Macie across roughly 900 S3 buckets. Which TWO statements are accurate?`,
    opts:[
      "Automated sensitive data discovery continuously samples objects across the estate to build an ongoing picture of where sensitive data is likely to be",
      "A sensitive data discovery job scans a chosen set of buckets on demand or on a schedule, for deeper inspection of specific targets",
      "Macie redacts or masks the sensitive values it finds in the source objects",
      "Macie encrypts every bucket where it finds sensitive data",
      "Macie can only inspect data after it has been loaded into Amazon DynamoDB"
    ],
    correct:[0,1],
    explain:`The two modes are complementary: continuous automated discovery samples broadly to show where sensitive data probably is, and targeted jobs inspect chosen buckets thoroughly. Macie detects and reports; it never masks, redacts, or encrypts, so hiding a flagged column from analysts is a separate job for Lake Formation or a transformation.`
  },

  /* Ch 35 - Audit logging with CloudTrail and CloudTrail Lake */
  {
    q:`A security team must guarantee that API activity from all 40 accounts in an AWS Organization is captured centrally, and that a member account administrator cannot turn off logging for their own account. What provides this?`,
    opts:[
      "A per-account trail in each of the 40 accounts, all delivering to one central S3 bucket",
      "An organization trail created in the management account, which applies to every member account and cannot be modified or disabled by member account administrators",
      "A single-Region trail in the management account, since Organizations replicates it automatically",
      "An S3 bucket policy on the central log bucket denying delete actions"
    ],
    correct:1,
    explain:`An organization trail is created once in the management account and applies across every member account, and member administrators cannot modify or disable it, which is what makes the guarantee hold. Forty individual trails delivering to one bucket is the tempting equivalent, but each remains under its own account's control and can be switched off locally.`
  },

  /* Ch 36 - Data privacy and governance frameworks */
  {
    q:`A privacy policy states that raw customer interaction records must be deleted 24 months after collection, across a data lake, a warehouse, and an operational key-value store. What implements retention consistently across all three?`,
    opts:[
      "Document the 24-month rule in the data catalog and review compliance quarterly",
      "Rely on each engineering team to delete old records when they notice them",
      "Enable versioning everywhere so old records can be proven deleted",
      "Apply the platform mechanism native to each store: an S3 Lifecycle expiration rule on the lake, a scheduled deletion of partitions older than 24 months in the warehouse, and DynamoDB TTL on the operational table"
    ],
    correct:3,
    explain:`Retention is enforced where the data lives, so one policy becomes a lifecycle rule, a scheduled deletion, and a TTL attribute, each automatic in its own store. Documenting the rule and reviewing it periodically is the tempting governance-only answer, but a policy nothing enforces is exactly what an auditor's sampling will find has quietly failed.`
  }

];

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
