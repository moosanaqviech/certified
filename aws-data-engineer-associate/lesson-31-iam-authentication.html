/* ----------  CARDS  ---------- */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 4 · Chapter 31</div>
    <h1 class="reveal">IAM authentication for data services</h1>
    <p class="lead reveal">Every request to an AWS data service starts with one question: <strong>who are you?</strong> Answering it is <strong>authentication</strong>, and AWS Identity and Access Management (IAM) is the front door. This chapter is about proving identity; deciding what that identity may do comes next.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — auth vs authz */
  { html: `
    <div class="eyebrow reveal">Two halves of access</div>
    <h2 class="reveal">Authentication, then authorization</h2>
    <p class="lead reveal" style="margin-bottom:18px">Access control is two questions in sequence, and this chapter is the first one.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Authentication: who are you?</b>Prove your identity with credentials before AWS will consider the request at all.</p></div>
      <div class="pill"><p><b>Authorization: what may you do?</b>Once identified, policies decide which actions are allowed. That is the next chapter.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 2 — identities */
  { html: `
    <div class="eyebrow reveal">Identities</div>
    <h2 class="reveal">Users and roles</h2>
    <div class="art reveal">${A.idn}</div>
    <p class="lead reveal">An <strong>IAM user</strong> carries <strong>long-term credentials</strong>, a stored secret suited to humans or legacy apps. An <strong>IAM role</strong> has <strong>no stored secret</strong>: it is assumed on demand and hands back <strong>temporary credentials</strong> that expire. Roles are the modern default, because there is nothing to leak or rotate.</p>
    <div class="spacer"></div>` },

  /* 3 — how services authenticate */
  { html: `
    <div class="eyebrow reveal">Service identity</div>
    <h2 class="reveal">Services assume a role</h2>
    <div class="art reveal">${A.svc}</div>
    <p class="lead reveal">A Glue job, a Lambda function, or a Redshift cluster does not carry a password. Each <strong>assumes an IAM service role</strong>, and the role's temporary credentials let it reach S3 and other services. This is why you should never embed access keys in a job script: the role already authenticates the service for you.</p>
    <div class="spacer"></div>` },

  /* 4 — how people and apps authenticate */
  { html: `
    <div class="eyebrow reveal">Human identity</div>
    <h2 class="reveal">Federate, do not multiply users</h2>
    <p class="lead reveal" style="margin-bottom:18px">People and external apps get in without a pile of long-lived IAM users.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Federation for people</b>IAM Identity Center, SAML, or OIDC lets users sign in with an existing identity and assume a role, no per-person IAM user.</p></div>
      <div class="pill"><p><b>Roles for apps</b>Applications call STS to assume a role and receive temporary credentials. Static access keys are a last resort, and get rotated.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 5 — authenticating to the store */
  { html: `
    <div class="eyebrow reveal">At the data store</div>
    <h2 class="reveal">IAM reaches into the database</h2>
    <p class="lead reveal" style="margin-bottom:18px">The same identity model extends to the engines that hold your data.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>RDS</b>IAM database authentication issues a short-lived token instead of a stored database password.</p></div>
      <div class="pill"><p><b>Redshift</b>Temporary credentials can be generated from an IAM identity rather than a permanent DB user login.</p></div>
      <div class="pill"><p><b>S3, Glue, Athena</b>Every call is checked against the caller's IAM identity before anything runs.</p></div>
    </div>` },

  /* 6 — quiz: service role */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">A Glue job needs to read from and write to an S3 bucket. What is the right way for it to authenticate to S3?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span>Attach an IAM service role to the job so it uses temporary credentials</button>
      <button class="choice" data-correct="false"><span class="key">B</span>Embed an IAM user's access key and secret in the job script</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Run the job with the account root user's credentials</button>
    </div>
    <div class="feedback"><b>Correct.</b> The job assumes an IAM service role and gets temporary credentials automatically, with no secret stored anywhere. Embedding a user's access keys puts a long-lived secret in code where it can leak, and the root user should never be used for routine workloads because it cannot be scoped down.</div>` },

  /* 7 — quiz: IAM database authentication */
  { quiz: true,

    <div class="eyebrow reveal">Quick check</div>

      <button class="choice" data-correct="false"><span class="key">A</span>Store the database password in the application source code</button>
      <button class="choice" data-correct="true"><span class="key">B</span>IAM database authentication, which issues a short-lived token</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Give the application the account's root access keys</button>
    </div>
    <div class="feedback"><b>Correct.</b> IAM database authentication lets the application request a short-lived token from IAM instead of holding a permanent password, so there is no static secret to manage or rotate. Hardcoding a password is exactly what they want to eliminate, and root credentials are both far too broad and still a long-lived secret.</div>` },

    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Chapter 31 complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">You can now reason about how identities prove themselves to AWS data services, and why roles beat stored keys.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Authentication is identity</b>Prove who you are first; what you can do is authorization, the next chapter.</p></div>
      <div class="pill"><p><b>Roles over users</b>Roles hand out temporary credentials with nothing stored; services assume a role to reach data.</p></div>
      <div class="pill"><p><b>Into the store</b>Federate people, and use IAM tokens for RDS instead of static database passwords.</p></div>
    </div>

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
