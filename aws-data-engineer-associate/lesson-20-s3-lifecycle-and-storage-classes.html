    <h1 class="reveal">S3 lifecycle and storage classes</h1>
    <p class="lead reveal">Not all data is worth the same storage. Fresh data gets queried; old data mostly waits. S3 has a spectrum of <strong>storage classes</strong> from hot to cold, and <strong>lifecycle policies</strong> move data down that spectrum as it ages.</p>
    <div class="art grow reveal">${A.cover}</div>` },

    <p class="lead reveal">Every class stores data with the same durability, but they trade <strong>storage price</strong> against <strong>retrieval price and latency</strong>. Colder classes cost far less to store and more (and slower) to read back. The right class depends on how often the data is actually accessed.</p>
    <div class="spacer"></div>` },

    <h2 class="reveal">From Standard to Deep Archive</h2>
    <div class="art reveal">${A.classes}</div>
    <p class="lead reveal"><strong>Standard</strong> is for frequent access. <strong>Standard-IA</strong> lowers storage cost for infrequent access but adds a retrieval fee. The <strong>Glacier</strong> tiers archive data at very low cost, and <strong>Glacier Deep Archive</strong> is the cheapest, with retrieval measured in hours. Colder means cheaper to keep, slower to get back.</p>
    <div class="spacer"></div>` },

      <button class="choice" data-correct="false"><span class="key">A</span>Keep everything in S3 Standard for the full 7 years</button>
      <button class="choice" data-correct="true"><span class="key">B</span>A lifecycle policy that transitions objects to Glacier Deep Archive after 30 days</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Expire and delete the logs after 30 days</button>
    </div>
    <div class="feedback"><b>Correct.</b> The data is hot for 30 days then rarely read but must be kept, so a lifecycle transition to Deep Archive slashes storage cost while preserving it for compliance. Holding it all in Standard wastes money on cold data, and deleting after 30 days violates the 7-year retention requirement.</div>` },

  /* 7 — quiz: Intelligent-Tiering */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">A dataset has unpredictable, changing access patterns, and the team wants automatic cost optimization with no retrieval fees and no lifecycle rules to maintain. Which storage class fits?</h2>
    <div class="choices reveal">

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
</html>
