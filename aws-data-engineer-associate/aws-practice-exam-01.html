<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Title is set from E.name at runtime; this is only a fallback -->
<title>Practice Exam 1 · AWS Data Engineer Associate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     EXAM SHELL - frozen. Do not edit anything in this style block.
     All per-exam customization lives in the EXAM PAYLOAD script section.
  ===================================================================== */
  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;
    --ink-soft:#a7a59f; --ink-faint:#6b6a66; --gold:#e3b84a; --green:#34d3a6; --red:#e8625c;
    --line:rgba(255,255,255,0.08);
    --display:"Fraunces",Georgia,serif; --body:"Hanken Grotesk",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:radial-gradient(1100px 650px at 50% -8%,#1a1d29 0%,transparent 58%),var(--bg);font-family:var(--body);color:var(--ink);min-height:100vh;line-height:1.5;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* sticky top */
  .top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .timer.warn{color:var(--gold);}
  .timer svg{opacity:.7;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  /* intro */
  .intro{text-align:center;margin:auto 0;padding:30px 0;}
  .intro .badge{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px;}
  .intro h1{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.05;letter-spacing:-0.02em;margin-bottom:16px;}
  .intro p{color:var(--ink-soft);font-size:15.5px;max-width:30em;margin:0 auto 14px;}
  .facts{display:flex;justify-content:center;gap:0;margin:24px 0 28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .fact{flex:1;padding:16px 10px;}
  .fact+.fact{border-left:1px solid var(--line);}
  .fact b{display:block;font-family:var(--display);font-size:22px;font-weight:600;color:var(--gold);}
  .fact span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#14110c;font-weight:700;font-size:16px;padding:15px 30px;border-radius:14px;border:none;cursor:pointer;transition:transform .15s ease;font-family:var(--body);}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.35;pointer-events:none;}

  /* question */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .qnum{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:0.04em;}
  .flag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-faint);background:transparent;border:1px solid var(--line);border-radius:100px;padding:5px 12px;cursor:pointer;transition:.15s;font-family:var(--body);}
  .flag.on{color:var(--gold);border-color:var(--gold);background:rgba(227,184,74,0.1);}
  .qtext{font-size:18px;line-height:1.5;font-weight:500;margin-bottom:20px;}
  .qtext code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:5px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);line-height:1.4;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:rgba(255,255,255,0.2);}
  .opt.sel{border-color:var(--gold);background:rgba(227,184,74,0.08);}
  .opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .opt.sel .key{background:var(--gold);color:#14110c;}

  /* review states */
  .opt.correct{border-color:var(--green);background:rgba(52,211,166,0.1);}
  .opt.correct .key{background:var(--green);color:#072018;}
  .opt.incorrect{border-color:var(--red);background:rgba(232,98,92,0.1);}
  .opt.incorrect .key{background:var(--red);color:#2a0a08;}
  .explain{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .explain b{color:var(--ink);}

  /* nav dots */
  .nav-dots{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 4px;justify-content:center;}
  .dot{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-faint);cursor:pointer;transition:.15s;font-family:var(--body);}
  .dot.answered{background:var(--surface-2);color:var(--ink);border-color:rgba(255,255,255,0.18);}
  .dot.current{border-color:var(--gold);color:var(--gold);}
  .dot.flagged{box-shadow:inset 0 0 0 2px rgba(227,184,74,0.5);}

  /* footer nav */
  .foot{display:flex;gap:12px;margin-top:24px;}
  .foot .btn{flex:1;}

  /* results */
  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:140px;height:140px;margin:6px auto 18px;}
  .scorering svg{transform:rotate(-90deg);}
  .scorering .tr{stroke:rgba(255,255,255,0.1);}
  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scorering .ctr b{font-family:var(--display);font-size:38px;font-weight:600;line-height:1;}
  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .verdict{font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:6px;}
  .verdict.pass{color:var(--green);}
  .verdict.fail{color:var(--gold);}
  .res p{color:var(--ink-soft);font-size:14.5px;max-width:28em;margin:0 auto 22px;}
  .res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="lbl" id="topLbl">Practice Exam</span>
    <span class="timer" id="timer" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6" stroke-linecap="round"/></svg>
      <span id="timerVal">20:00</span>
    </span>
  </div>
  <div class="pbar"><i id="pbar"></i></div>

  <div class="body-wrap" id="root"></div>
</div>

<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 1",
  badge: "AWS Data Engineer Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Most questions have one best answer; a few ask you to select two.",
  coverage: "Covers chapters 1-13: Unit 1, Data Ingestion and Transformation (34% of DEA-C01).",
  minutes: 26,
  pass: 72
};

const QUESTIONS = [

  /* Ch 01 - Streaming vs batch ingestion */
  {
    q:`A retailer ingests two feeds into the same S3 data lake. The pricing team says a competitor price feed that is 10 minutes stale has already cost them money. The finance team's revenue report runs once a day and only needs transactions through midnight. What is the most appropriate design?`,
    opts:[
      "Batch both feeds on the same nightly schedule, since they land in the same S3 data lake",
      "Stream the competitor feed and batch the finance feed, because the two have different tolerances for stale data",
      "Stream both feeds, because streaming is the safer default whenever requirements might change later",
      "Batch the competitor feed hourly and stream the finance feed, to balance cost across the two pipelines"
    ],
    correct:1,
    explain:`Ingestion choice is driven by how fast data goes stale, not by where it lands. The price feed loses value in minutes, so it streams; the revenue report is read once a day, so a scheduled batch is enough. Streaming both looks safe but pays continuous cost and operational overhead for data nobody reads until morning.`
  },

  /* Ch 02 - Kinesis Data Streams: shards, retention, replay */
  {
    q:`A Kinesis data stream in provisioned mode has 8 shards. One shard throttles with <code>ProvisionedThroughputExceededException</code> while the other seven sit near idle. Producers set the partition key to the device's country code, and 70% of devices report from one country. What is the most direct fix?`,
    opts:[
      "Extend the stream's retention period from 24 hours to 7 days",
      "Switch the consumer to enhanced fan-out so it gets a dedicated read path",
      "Add four more shards, bringing the stream to 12",
      "Change the partition key to a high cardinality value such as the device ID, so records hash evenly across shards"
    ],
    correct:3,
    explain:`The partition key is hashed to pick a shard, so a low cardinality key concentrates most traffic on one shard no matter how many exist. A high cardinality key spreads the load. Adding shards is the tempting answer, but with the same skewed key the hot country still lands on a single shard and keeps throttling.`
  },

  /* Ch 03 - Kinesis Data Streams vs Amazon MSK */
  {
    q:`A three-person team with no Kafka experience needs a durable, ordered event log feeding a Lambda consumer. Their stated priority is the smallest possible operational surface: no brokers to size, no cluster version upgrades. Which choice matches that signal, and what do they give up?`,
    opts:[
      "Kinesis Data Streams: AWS manages capacity as shards, and the team gives up the Kafka ecosystem of connectors and clients",
      "Amazon MSK provisioned: brokers are managed for you, and the team gives up ordering within a partition",
      "Amazon MSK: managed Kafka removes partition sizing entirely, so there is nothing left to tune",
      "Amazon Data Firehose: a managed log the team can replay from, with no shards to size"
    ],
    correct:0,
    explain:`Kinesis Data Streams is the low-overhead option when nothing in the requirements says Kafka, and it integrates natively with Lambda. Firehose is the tempting distractor because it needs no capacity management, but it is a delivery service, not a stream you can retain and replay from. MSK is the right answer only when existing Kafka clients, connectors, or APIs are in play.`
  },

  /* Ch 04 - Amazon Data Firehose */
  {
    q:`A team must land raw clickstream JSON in Amazon S3 as Parquet, with no consumer application to write or operate. Which TWO Amazon Data Firehose capabilities make that possible?`,
    opts:[
      "Record format conversion to Parquet, using a table schema from the AWS Glue Data Catalog",
      "An AWS Lambda transform invoked on buffered records before delivery",
      "Shard-level replay of the last 24 hours of records",
      "Consumer group offsets tracked independently per reading application",
      "Enhanced fan-out, giving each reader a dedicated throughput pipe"
    ],
    correct:[0,1],
    explain:`Firehose converts records to Parquet or ORC using a Glue Data Catalog schema, and can invoke a Lambda function to reshape records in flight, so no consumer code is needed. The other options are Kinesis Data Streams and Apache Kafka features: Firehose does not retain records for replay, track offsets, or offer enhanced fan-out, because it delivers rather than persists.`
  },

  /* Ch 05 - Amazon Managed Service for Apache Flink */
  {
    q:`A Managed Service for Apache Flink application computes a 5-minute tumbling-window aggregate. After a restart, the team finds the in-flight window results were lost and the aggregate began again from empty. Which feature is designed to prevent that?`,
    opts:[
      "Raising the application's Kinesis Processing Units (KPUs) so it has more parallelism",
      "Switching the aggregate from a tumbling window to a sliding window",
      "Checkpoints, which snapshot operator state so a restart resumes from the last consistent point",
      "Enhanced fan-out on the source stream, so the application never misses a record"
    ],
    correct:2,
    explain:`Flink's value is the state it carries across events, and checkpoints are what make that state durable: on restart the application resumes from the last snapshot rather than an empty window. Enhanced fan-out is tempting because it sounds like a delivery guarantee, but it only widens the read path from the stream; it does nothing for state the application had already accumulated.`
  },

  /* Ch 06 - Batch ingestion sources: S3, DMS, AppFlow */
  {
    q:`An AWS DMS task has finished its full load from an on-premises Oracle database into Amazon S3, but the source keeps taking new transactions and the target is drifting behind. The team needs the target current right up to cutover. What handles this?`,
    opts:[
      "Change the task to migrate existing data and replicate ongoing changes, so change data capture continues after the full load",
      "Re-run the full load task nightly until the cutover date",
      "Create a replicate data changes only task now, starting from the current time",
      "Use Amazon AppFlow to keep the Oracle source and the S3 target in sync"
    ],
    correct:0,
    explain:`Full load plus CDC is the standard migration pattern: DMS copies existing rows, then streams ongoing changes so the target stays current until cutover. A CDC-only task started now is the tempting choice, but it would miss every change made while the full load was running. AppFlow moves SaaS application data, not relational database changes.`
  },

  /* Ch 07 - AWS Glue for ETL */
  {
    q:`An AWS Glue job runs hourly over an S3 prefix that keeps receiving new files. Analysts report duplicated rows in the target because every run reprocesses the whole prefix. What is the intended fix?`,
    opts:[
      "Increase the job's worker count so each run finishes before the next one starts",
      "Enable job bookmarks so each run processes only files that arrived since the last successful run",
      "Convert the job from DynamicFrames to Spark DataFrames",
      "Add a crawler ahead of the job so the catalog only exposes new partitions"
    ],
    correct:1,
    explain:`Job bookmarks are Glue's built-in state for incremental processing: the job records how far it got and skips already-processed files on the next run. Adding a crawler is the tempting distractor, but a crawler only updates metadata in the Data Catalog; the job would still read every file the table points at.`
  },

  /* Ch 08 - AWS Glue vs Amazon EMR */
  {
    q:`Two teams are picking a transformation engine. Team A runs short, bursty Spark jobs a few times a day and wants nothing to size or manage. Team B needs Apache HBase, a pinned open-source Spark version, and Spot Instances on a long-running cluster. Which pairing is correct?`,
    opts:[
      "Team A: Amazon EMR. Team B: AWS Glue",
      "Both teams: AWS Glue, since Glue connectors cover Apache HBase",
      "Both teams: Amazon EMR, since EMR costs less for any Spark workload",
      "Team A: AWS Glue. Team B: Amazon EMR"
    ],
    correct:3,
    explain:`Glue is serverless Spark: no clusters, billed per job, ideal for short bursty ETL. EMR gives you the cluster, so it is the answer whenever the requirements name Hadoop ecosystem components, specific engine versions, or purchasing options like Spot. "EMR is always cheaper" is the tempting shortcut, but a cluster idling between two short daily jobs costs more than the equivalent Glue runs.`
  },

  /* Ch 09 - Transforming data in Amazon Redshift */
  {
    q:`A nightly pipeline must load 500 million rows from S3 into an Amazon Redshift staging table, then merge them into a production fact table. The team wants the fastest bulk load path and wants the transformation to run on the warehouse's own compute. Which approach fits?`,
    opts:[
      "An AWS Glue job writing to Redshift over JDBC, one batch per Spark partition",
      "Amazon Data Firehose delivering the rows straight into the production fact table",
      "COPY the files from S3 into the staging table, then merge with INSERT INTO ... SELECT",
      "Redshift Spectrum external tables queried directly by the dashboards each morning"
    ],
    correct:2,
    explain:`COPY is Redshift's parallel bulk loader: it reads the S3 files across slices, which no row-by-row or JDBC path matches. Once the data is in staging, SQL does the merge, which is what ELT means. The Glue over JDBC option is plausible because Glue can write to Redshift, but it pushes the load through a single connection path and moves the transform off the warehouse.`
  },

  /* Ch 10 - Step Functions vs Amazon MWAA */
  {
    q:`A pipeline runs twice a day and takes about 20 minutes per run. The team is choosing between AWS Step Functions and Amazon MWAA, and cost is the deciding factor. Which statement correctly captures the difference?`,
    opts:[
      "Step Functions bills per state transition, so an idle pipeline costs nothing, while an MWAA environment bills continuously whether DAGs run or not",
      "MWAA bills per DAG run, so an idle environment costs nothing",
      "Both are serverless and bill only for the seconds a run is executing",
      "Step Functions requires a worker fleet sized for peak concurrency, so it costs more while idle"
    ],
    correct:0,
    explain:`Step Functions is pay-per-use: with two short runs a day, an idle workflow costs nothing. MWAA runs an Airflow environment (schedulers, workers, a web server) that bills by the hour regardless of DAG activity. "Both are serverless" is the tempting simplification, but MWAA provisions an environment for you rather than removing it.`
  },

  /* Ch 11 - Event-driven pipelines with Amazon EventBridge */
  {
    q:`An EventBridge rule should start an AWS Glue job only when an object is created under the <code>raw/orders/</code> prefix with a <code>.parquet</code> suffix, but the job fires for every object written anywhere in the bucket. Where is the right place to fix this?`,
    opts:[
      "Add a guard clause to the Glue job script so it exits early for objects it should ignore",
      "Tighten the rule's event pattern so it matches only that prefix and suffix in the event detail",
      "Create a separate bucket per file type, with one rule per bucket",
      "Replace the event pattern with a schedule expression that polls the bucket every five minutes"
    ],
    correct:1,
    explain:`Event patterns filter on the event's own fields, including the S3 object key, so unwanted events never reach the target and never cost a job start. Filtering inside the Glue script works but still launches (and bills for) a job per object. Replacing the pattern with a schedule throws away the event-driven design the question is built on.`
  },

  /* Ch 12 - Infrastructure as code and CI/CD */
  {
    q:`The same Glue job, IAM role, and S3 bucket must exist in dev, test, and prod, differing only in bucket names and job capacity. The team wants one reviewed definition instead of three drifting ones. What is the standard approach?`,
    opts:[
      "Keep three hand-maintained copies of the template, one per environment",
      "Template production only, and build dev and test in the console where iteration is faster",
      "One parameterized CloudFormation template, deployed as a separate stack per environment",
      "A CodeBuild project that runs AWS CLI create commands from a shell script"
    ],
    correct:2,
    explain:`Parameters exist so one reviewed template can produce environment-specific stacks, which is what keeps dev, test, and prod from drifting apart. The CLI script is the tempting distractor because it is also automated, but imperative create commands have no desired-state model: nothing detects or corrects drift, and re-running it is not idempotent.`
  },

  /* Ch 13 - Lambda for data processing */
  {
    q:`An AWS Lambda function consuming a 10-shard Kinesis data stream is falling behind: the <code>IteratorAge</code> metric climbs steadily through the day. Which TWO changes increase the function's throughput against that stream?`,
    opts:[
      "Raise the event source mapping's batch size so each invocation handles more records",
      "Set a parallelization factor above 1, so more than one invocation processes each shard concurrently",
      "Raise the function timeout from 3 minutes to the 15-minute maximum",
      "Enable provisioned concurrency on the function",
      "Reduce the function's memory setting to cut cost per invocation"
    ],
    correct:[0,1],
    explain:`For a poll-based Kinesis source, throughput is governed by the event source mapping: a larger batch size moves more records per invocation, and a parallelization factor above 1 lifts the one-invocation-per-shard ceiling. Provisioned concurrency is the tempting pick, but it removes cold-start latency and does nothing for how fast records are pulled off shards. A longer timeout only lets a slow invocation run longer; less memory makes it slower still.`
  }

];

/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
