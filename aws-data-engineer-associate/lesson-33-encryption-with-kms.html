/* ----------  CARDS  ---------- */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 4 · Chapter 33</div>
    <h1 class="reveal">Encryption with AWS KMS</h1>
    <p class="lead reveal">Encryption protects data even when everything else fails. <strong>AWS Key Management Service (KMS)</strong> is where the keys live and how services encrypt your data at rest. The core trick is <strong>envelope encryption</strong>: a key, wrapped inside another key.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — envelope encryption */
  { html: `
    <div class="eyebrow reveal">The core idea</div>
    <h2 class="reveal">Envelope encryption</h2>
    <div class="art reveal">${A.env}</div>
    <p class="lead reveal">Your data is encrypted with a <strong>data key</strong>. That data key is then encrypted by a <strong>KMS key</strong> and stored, wrapped, alongside the ciphertext. To read the data, a service asks KMS to unwrap the data key. KMS <strong>guards the keys and never holds your data</strong>, and this design scales to any volume without sending gigabytes through KMS.</p>
    <div class="spacer"></div>` },

  /* 2 — key types */
  { html: `
    <div class="eyebrow reveal">Key types</div>
    <h2 class="reveal">Managed for you, or by you</h2>
    <div class="art reveal">${A.keys}</div>
    <p class="lead reveal">An <strong>AWS managed key</strong> (like <code>aws/s3</code>) is created and rotated for you at no charge, but you cannot edit its policy or share it across accounts. A <strong>customer managed key</strong> is one you own: you control its <strong>key policy, rotation, and cross-account grants</strong>, and can disable it, for a small monthly cost.</p>
    <div class="spacer"></div>` },

  /* 3 — key policy + IAM */
  { html: `
    <div class="eyebrow reveal">Who may decrypt</div>
    <h2 class="reveal">The key policy is a second gate</h2>
    <p class="lead reveal" style="margin-bottom:18px">Access to encrypted data is checked twice, which lets you separate holding data from reading it.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>IAM permission</b>The caller must be allowed to reach the resource, for example the S3 object.</p></div>
      <div class="pill"><p><b>Key policy permission</b>The caller must also be allowed to use the KMS key. Deny it and even a bucket reader cannot decrypt.</p></div>
    </div>
    <div class="spacer"></div>` },

    <h2 class="reveal" style="font-size:20px">A compliance team must audit every decryption of a sensitive S3 dataset and be able to revoke one team's ability to read it without moving the data. What encryption fits?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>SSE-S3 with S3-managed keys</button>
      <button class="choice" data-correct="true"><span class="key">B</span>SSE-KMS with a customer managed key</button>
      <button class="choice" data-correct="false"><span class="key">C</span>No encryption, restricting access with a bucket policy instead</button>
    </div>
    <div class="feedback"><b>Correct.</b> SSE-KMS with a customer managed key logs every decryption in CloudTrail and lets you deny a principal in the key policy, revoking read access without touching the data. SSE-S3 keys are opaque, with no usage log and no policy you can edit, and a bucket policy alone neither encrypts the data nor records key use.</div>` },

  /* 7 — quiz: bucket keys for cost */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">A bucket holds hundreds of millions of objects encrypted with SSE-KMS, and KMS request charges have grown large. How do you cut the cost while keeping SSE-KMS?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Switch the bucket to SSE-S3</button>
      <button class="choice" data-correct="true"><span class="key">B</span>Enable S3 Bucket Keys on the bucket</button>

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
</html>
