const cards = [

  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",

    <h1 class="reveal">AWS Glue for ETL</h1>
    <p class="lead reveal">So far the data has been captured and moved. Now it gets <strong>transformed</strong>: cleaned, joined, reshaped. Glue is the AWS way to run that work on Apache Spark without provisioning a single server.</p>

  /* 1 — what Glue is */
  { html: `
    <div class="eyebrow reveal">The core idea</div>
    <h2 class="reveal">Serverless Spark, no cluster to run</h2>
    <p class="lead reveal" style="margin-bottom:18px">Glue runs your extract, transform, and load logic on Apache Spark that AWS provisions and scales for you.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Managed Apache Spark</b>You supply the transformation; Glue handles the engine, the scaling, and the shutdown when the job ends.</p></div>
      <div class="pill"><p><b>Pay for what runs</b>Billed per DPU-hour (data processing unit) while a job runs, nothing in between.</p></div>
      <div class="pill"><p><b>Wired to the catalog</b>Jobs read table definitions from the Glue Data Catalog, so schema lives in one place. Crawlers fill it (Chapter 16).</p></div>
    </div>` },

  /* 2 — jobs */

    <div class="eyebrow reveal">Jobs</div>
    <h2 class="reveal">The job is the unit of work</h2>
    <div class="art reveal">${A.jobs}</div>
    <p class="lead reveal">A Glue job runs your script. <strong>Spark jobs</strong> (PySpark or Scala) handle large distributed data; <strong>Python shell jobs</strong> handle small, non-Spark tasks. You size a job with worker type and number of workers, and Glue Studio can author it visually or in code.</p>

    <h2 class="reveal">A frame that bends to messy schema</h2>
    <div class="art reveal">${A.dframe}</div>
    <p class="lead reveal">A DynamicFrame is Glue's take on a Spark DataFrame, built for semi-structured data with inconsistent or evolving schema. It needs no schema up front and can hold a <strong>choice of types</strong> for a field, which <code>resolveChoice</code> then settles. Call <code>toDF()</code> to drop into plain Spark SQL whenever you want it.</p>

  /* 6 — quiz: DynamicFrame */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">A Glue job reads JSON where one field arrives sometimes as a string and sometimes as a number, and the job keeps failing on the schema mismatch. What is the most direct fix?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span>Keep the data in a DynamicFrame and use resolveChoice to settle the field's type</button>
      <button class="choice" data-correct="false"><span class="key">B</span>Convert to a Spark DataFrame first, which infers one rigid schema</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Drop every record where the field's type is ambiguous</button>
    </div>
    <div class="feedback"><b>Correct.</b> DynamicFrames exist for exactly this: resolveChoice reconciles the mixed types without failing the job. Forcing a rigid DataFrame schema up front is what triggers the error, and discarding ambiguous records throws away valid data.</div>` },

  { quiz: true,

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
