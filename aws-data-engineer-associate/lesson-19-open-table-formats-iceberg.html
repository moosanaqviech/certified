  .eyebrow { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; margin-bottom: 14px; }
  .eyebrow .dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:8px; transform: translateY(-1px); }

  .choice { text-align:left; cursor:pointer; background: var(--surface-2); border: 1.5px solid var(--line); color: var(--ink); font-family: var(--body); font-weight: 600; font-size: 15px; padding: 16px 18px; border-radius: 15px; display:flex; align-items:center; gap: 13px; transition: border-color 0.2s, background 0.2s, transform 0.1s; }

  .choice.correct { border-color: var(--accent); background: var(--accent-glow); }

  .choice.wrong { border-color: rgba(232,98,92,0.8); background: rgba(232,98,92,0.12); }

  .feedback { margin-top:16px; font-size:14.5px; line-height:1.5; color: var(--ink-soft); opacity:0; transform: translateY(8px); transition: 0.35s ease; }
  .feedback.show { opacity:1; transform:none; }
  .feedback b { color: var(--accent); font-weight:600; }

  @media (max-width: 440px) { .stage { padding: 0; } .phone { width:100%; height:100dvh; max-height:100dvh; border-radius:0; padding:0; box-shadow:none;} .screen { border-radius:0; } }
</style>

const cards = [

  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",

    <h1 class="reveal">Open table formats: Iceberg</h1>
    <p class="lead reveal">A data lake stores tables as folders of Parquet. That is cheap, but a folder is not a table: no transactions, no safe updates, no way to see last week's version. <strong>Apache Iceberg</strong> fixes that with a metadata layer.</p>

    <h2 class="reveal">A folder of files is not a table</h2>
    <div class="art reveal">${A.problem}</div>
    <p class="lead reveal">Raw Parquet in S3 gives you cheap storage and schema-on-read, but none of the guarantees a warehouse has. Two writers can corrupt each other, there is <strong>no atomic commit</strong>, updating or deleting a single row means rewriting files, and you cannot ask what the table looked like yesterday.</p>
    <div class="spacer"></div>` },

    <div class="spacer"></div>` },

    <div class="spacer"></div>` },

    <h2 class="reveal" style="font-size:20px">Analysts must reproduce a report exactly as the data stood on a past date, and occasionally roll back a bad write. Which Iceberg capability provides this?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Running a Glue crawler over the current files</button>
      <button class="choice" data-correct="true"><span class="key">B</span>Snapshots and time travel, which address any prior table version</button>
      <button class="choice" data-correct="false"><span class="key">C</span>An S3 lifecycle policy on the bucket</button>
    </div>
    <div class="feedback"><b>Correct.</b> Iceberg keeps each commit as a snapshot, so a query can pin a past version and a bad write can be rolled back to an earlier one. A crawler only re-infers the current schema, and a lifecycle policy moves or expires objects rather than preserving queryable history.</div>` },

  /* 8 — done */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Chapter 19 complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">You can now explain what a folder of files lacks and what an open table format adds.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Files alone are not a table</b>No transactions, no clean updates, no history.</p></div>
      <div class="pill"><p><b>Metadata is the fix</b>Iceberg tracks table state as snapshots for ACID, time travel, and safe evolution.</p></div>
      <div class="pill"><p><b>Open and supported</b>Athena, Glue, EMR, and Redshift read and write Iceberg on your own S3.</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
