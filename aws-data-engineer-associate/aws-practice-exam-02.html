<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 2",
  badge: "AWS Data Engineer Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Most questions have one best answer; a few ask you to select two.",
  coverage: "Covers chapters 1-22: Unit 1 (ingestion and transformation) and Unit 2 (data store management).",
  minutes: 44,
  pass: 72
};

const QUESTIONS = [

  /* Ch 01 - Streaming vs batch ingestion */
  {
    q:`A compliance team ingests a 4 GB CSV extract dropped by a partner at 02:00 each day and loads it into Amazon Redshift for a report published at 08:00. An architect proposes rebuilding the pipeline on Kinesis Data Streams so the data is always fresh. What is the strongest argument against that change?`,
    opts:[
      "Kinesis Data Streams cannot deliver data into Amazon Redshift",
      "Streaming pipelines cannot preserve the record ordering the compliance report depends on",
      "The report is published once a day, so fresher data changes nothing downstream while the streaming pipeline adds cost and operational surface",
      "CSV files cannot be ingested by a streaming service"
    ],
    correct:2,
    explain:`Ingestion latency should be justified by a consumer that can act on it. Nothing reads this data before 08:00, so continuous ingestion buys no business value and adds an always-on component to run. Ordering is the tempting objection, but Kinesis does preserve order within a shard, so that is not the reason to reject the design.`
  },

  /* Ch 02 - Kinesis Data Streams: shards, retention, replay */
  {
    q:`A Kinesis data stream is left at its default retention setting. A downstream consumer was disabled for three days during an incident, and the team now wants to reprocess everything it missed. What can they recover?`,
    opts:[
      "Only the most recent 24 hours: a stream retains records for 24 hours by default, and retention must be extended before the gap occurs, not after",
      "All three days, because Kinesis Data Streams retains records for 7 days by default",
      "All three days, because records are kept until every registered consumer acknowledges them",
      "Nothing, because a record is discarded as soon as any consumer reads it"
    ],
    correct:0,
    explain:`The default retention window is 24 hours (extendable to 7 days, and further with long-term retention), so records older than that are already gone. The "kept until acknowledged" option is the tempting one because that is how a queue such as SQS behaves, but Kinesis is a time-windowed log: reading a record never removes it, and expiry is driven purely by the retention period.`
  },

  /* Ch 03 - Kinesis Data Streams vs Amazon MSK */
  {
    q:`A migration plan states that existing Kafka Connect sink connectors, the Kafka Streams API, and current consumer group offsets must all keep working with no client rewrites. Which service satisfies that?`,
    opts:[
      "Kinesis Data Streams, with the Kinesis Client Library replacing the consumer group logic",
      "Amazon MSK, which runs Apache Kafka itself, so connectors, the Streams API, and existing offsets keep working",
      "Amazon Data Firehose, with a Lambda transform standing in for the Kafka Streams application",
      "Amazon Managed Service for Apache Flink, reading the topics through its Kafka connector"
    ],
    correct:1,
    explain:`When a requirement names the Kafka ecosystem itself, MSK is the answer: it is Apache Kafka, so existing clients, connectors, and offsets carry over untouched. Kinesis Data Streams is the tempting swap because it does the same core job, but every producer and consumer would have to be rewritten against a different API and offset model.`
  },

  /* Ch 04 - Amazon Data Firehose */
  {
    q:`An Amazon Data Firehose stream writes every record into one flat <code>s3://lake/raw/</code> prefix, so Athena queries scan the whole dataset. The team wants records routed into prefixes by the region field inside each record, without operating a consumer application. What provides this?`,
    opts:[
      "Enable record format conversion so the delivered objects are written as Parquet",
      "Increase the buffer size so each delivered object is larger",
      "Add an S3 Lifecycle rule that reorganizes objects by region after delivery",
      "Enable dynamic partitioning, which builds the S3 prefix from a key extracted out of each record"
    ],
    correct:3,
    explain:`Dynamic partitioning lets Firehose read a value out of each record and use it in the destination prefix, which is exactly what partition pruning in Athena needs. Format conversion to Parquet is the tempting answer since it also reduces scanned bytes, but it changes the file encoding, not the prefix layout, so every query still opens every partition. Lifecycle rules change storage class, never object keys.`
  },

  /* Ch 05 - Amazon Managed Service for Apache Flink */
  {
    q:`A payments team must join a stream of orders against a stream of payment confirmations that arrive up to 90 seconds later, emitting matched pairs continuously as they resolve. Which service fits?`,
    opts:[
      "Amazon Managed Service for Apache Flink, which holds windowed state so events arriving at different times can be matched",
      "Amazon Data Firehose with a Lambda transform, which can look up the matching payment per batch",
      "An AWS Glue batch job every five minutes joining the two S3 prefixes",
      "An Amazon Athena scheduled query joining the two tables every minute"
    ],
    correct:0,
    explain:`Matching two events that arrive at different times requires remembering the first one until the second shows up, which is what Flink's windowed state does. The Firehose plus Lambda option is tempting because Lambda can call out to a store, but the transform is stateless and sees only the current buffer, so it has no view of an order buffered minutes earlier.`
  },

  /* Ch 06 - Batch ingestion sources: S3, DMS, AppFlow */
  {
    q:`A team has two requirements: pull Zendesk ticket records into Amazon S3 hourly with field mapping and filtering and no custom code, and continuously replicate an on-premises MySQL database into Amazon Aurora. Which pairing fits?`,
    opts:[
      "AWS DMS for both, using its SaaS endpoint for Zendesk",
      "Amazon AppFlow for both, using its database connector for MySQL",
      "Amazon AppFlow for the Zendesk feed, AWS DMS for the MySQL replication",
      "An AWS Glue crawler for Zendesk, AWS DMS for MySQL"
    ],
    correct:2,
    explain:`AppFlow is the no-code path for SaaS applications, with built-in mapping and filtering; DMS is the database migration and CDC service. Using DMS for both is the tempting answer because DMS also moves data on a schedule, but its endpoints are databases and data stores, not SaaS APIs like Zendesk.`
  },

  /* Ch 07 - AWS Glue for ETL */
  {
    q:`A Glue aggregation job must run only after two independent upstream Glue jobs have both succeeded. What wires that dependency?`,
    opts:[
      "A scheduled trigger set to fire 30 minutes after the upstream jobs usually finish",
      "A conditional trigger in a Glue workflow that fires when both upstream jobs reach SUCCEEDED",
      "An on-demand trigger that the on-call engineer starts once the upstream jobs are green",
      "Job bookmarks on the downstream job, so it waits until new data is present"
    ],
    correct:1,
    explain:`Conditional triggers watch job state, so the downstream job starts on actual success rather than on a guess about timing. The scheduled trigger is the tempting shortcut, but a slow upstream run means the aggregation reads incomplete data, and a fast one means it waits for nothing. Job bookmarks track processed data, they do not sequence jobs.`
  },

  /* Ch 08 - AWS Glue vs Amazon EMR */
  {
    q:`A team runs a six-hour Spark job over 40 TB every night. They want to choose instance types, buy task capacity on Spot, and tune YARN and Spark configuration themselves. Which service fits, and why?`,
    opts:[
      "Amazon EMR, because it exposes instance types, Spot purchasing for task nodes, and cluster-level Spark and YARN configuration",
      "AWS Glue, because Glue jobs can also be scheduled onto Spot capacity",
      "AWS Glue with more DPUs, because Glue lets you pin the open-source Spark version",
      "Amazon EMR Serverless, because it lets you select Spot Instances for its workers"
    ],
    correct:0,
    explain:`Long-running, heavily tuned Spark work with purchasing-option requirements is the EMR signal: you own the cluster, so you own the knobs. EMR Serverless is the tempting near-miss, since it is still EMR, but it abstracts the capacity away and does not let you choose Spot Instances for its workers.`
  },

  /* Ch 09 - Transforming data in Amazon Redshift */
  {
    q:`A reporting table in Amazon Redshift is rebuilt nightly from staging data. Analysts must never see a half-loaded version of it. Which pattern meets that?`,
    opts:[
      "Truncate the reporting table, then insert rows as the transformation produces them",
      "Let analysts query during the load, since Redshift blocks readers automatically while a COPY runs",
      "UNLOAD the table to S3 and have analysts query it through Redshift Spectrum during the rebuild",
      "Build the new version into a staging table with CTAS, then swap it into place inside a transaction"
    ],
    correct:3,
    explain:`Building into a separate table and swapping inside a transaction means readers see either the old table or the new one, never a partial state. Truncate-then-insert is the tempting simple version, but it leaves the reporting table empty or partly filled for the whole load window.`
  },

  /* Ch 10 - Step Functions vs Amazon MWAA */
  {
    q:`A team maintains 40 Apache Airflow DAGs with dynamic task generation in Python, relies on Airflow's backfill semantics, and uses a large set of community provider packages. They want to run this on AWS with minimal rework. What fits?`,
    opts:[
      "AWS Step Functions, using a Map state to generate the tasks dynamically",
      "AWS Step Functions Express Workflows, which cost less for high-volume runs",
      "Amazon MWAA, which runs the existing DAGs, providers, and backfill semantics unchanged",
      "Amazon EventBridge Scheduler, with one schedule per DAG"
    ],
    correct:2,
    explain:`When the requirement names Airflow itself (DAGs, providers, backfills), MWAA is the answer because it is managed Airflow, so the existing Python carries over. Step Functions with a Map state is the tempting rewrite, but it means re-expressing 40 DAGs in Amazon States Language and giving up the provider ecosystem and backfill behavior.`
  },

  /* Ch 11 - Event-driven pipelines with Amazon EventBridge */
  {
    q:`An EventBridge rule invokes an AWS Lambda target. During a throttling incident, some events failed delivery and were never processed. The team wants failure handling configured on the rule's target itself. Which TWO target settings address this?`,
    opts:[
      "A dead-letter queue on the target, so events that exhaust retries land in an SQS queue",
      "A retry policy setting the maximum retry attempts and maximum event age",
      "An event bus archive that can be replayed after an incident",
      "An input transformer that reshapes the event before delivery",
      "A schedule expression that re-runs the rule every hour"
    ],
    correct:[0,1],
    explain:`Retry policy and dead-letter queue are the two delivery-failure settings on a rule's target: retries handle transient throttling, and the DLQ captures whatever still fails so nothing is silently dropped. Archive and replay is the tempting third, but it is configured on the event bus, not the target, and replays events back onto the bus rather than protecting one target's delivery.`
  },

  /* Ch 12 - Infrastructure as code and CI/CD */
  {
    q:`On every commit, a team wants unit tests to run, then a CloudFormation stack to deploy to staging, then a human approval before the same stack deploys to production. Which composition does this?`,
    opts:[
      "A single CodeBuild project whose buildspec runs the tests and then the deployment commands",
      "A CodePipeline with a CodeBuild test stage, a CloudFormation deploy stage for staging, and a manual approval action before the production deploy stage",
      "AWS CodeDeploy, which handles CloudFormation stack updates and approval gates",
      "An EventBridge rule on each commit that invokes a Lambda function to deploy"
    ],
    correct:1,
    explain:`CodePipeline models the stages and gates: CodeBuild runs the tests, a CloudFormation action deploys, and a manual approval action pauses for a human. A single CodeBuild project is the tempting simplification, but a buildspec is one linear script with no way to pause for approval between environments.`
  },

  /* Ch 13 - Lambda for data processing */
  {
    q:`A single-pass transformation over a 200 GB dataset takes roughly 40 minutes on one machine. A developer proposes running it as an AWS Lambda function. What is the blocker?`,
    opts:[
      "A Lambda invocation is capped at 15 minutes, so this belongs in AWS Glue or Amazon EMR unless the work is split across many parallel invocations",
      "Lambda functions cannot be granted read access to Amazon S3 buckets",
      "Lambda functions are limited to 512 MB of memory, which cannot hold the working set",
      "Lambda functions stop after 5 minutes unless provisioned concurrency is enabled"
    ],
    correct:0,
    explain:`The 15-minute maximum execution time is the hard ceiling that rules Lambda out for a 40-minute single-pass job; Glue or EMR are the right tools, or the work has to be decomposed into many shorter parallel invocations. The 512 MB claim is a common misconception: that is the default ephemeral <code>/tmp</code> size, while function memory goes far higher.`
  },

  /* Ch 14 - Choosing a data store: Redshift vs DynamoDB vs RDS */
  {
    q:`A mobile game must read a player profile by player ID in single-digit milliseconds, with traffic spiking unpredictably to millions of requests per minute. There are no joins and no ad hoc analytical queries. Which store fits?`,
    opts:[
      "Amazon Redshift, with concurrency scaling enabled for the spikes",
      "Amazon RDS for PostgreSQL with read replicas behind a connection pooler",
      "Amazon Redshift Serverless, so capacity follows the spikes automatically",
      "Amazon DynamoDB, a key-value store built for single-digit millisecond lookups by key at any scale"
    ],
    correct:3,
    explain:`Lookup by key, extreme request rates, and no joins is the DynamoDB profile exactly. RDS with read replicas is the tempting middle ground, but a relational engine still carries connection limits and vertical scaling ceilings that millions of requests per minute will hit, and the workload needs none of what it offers in return.`
  },

  /* Ch 15 - Data lakes on S3 */
  {
    q:`An Athena table reads 4 million Parquet objects averaging 20 KB each from a single S3 prefix. Queries are slow even though the data is columnar and compressed. What helps most?`,
    opts:[
      "Raise the Athena query timeout and retry the queries that fail",
      "Add an hourly partition level so each partition holds fewer files",
      "Compact the small objects into larger ones, a few hundred MB each, so each query opens far fewer files",
      "Move the dataset to S3 Standard-IA to lower the cost of the scans"
    ],
    correct:2,
    explain:`This is the small files problem: per-object request overhead dominates, so the fix is compaction into fewer, larger objects. Adding an hourly partition level is the tempting move because partitioning usually helps, but here it splits the same tiny files across even more prefixes and makes the overhead worse.`
  },

  /* Ch 16 - AWS Glue Data Catalog and crawlers */
  {
    q:`A daily job writes new dated prefixes such as <code>dt=2026-08-04/</code> into S3. Athena returns no rows for the newest day until someone intervenes. What is the correct automated fix?`,
    opts:[
      "Schedule the Glue crawler to run after the daily load so new partitions are registered in the catalog",
      "Have an engineer run MSCK REPAIR TABLE each morning",
      "Drop and recreate the external table every day with CREATE EXTERNAL TABLE",
      "Turn on S3 versioning so Athena always sees the newest objects"
    ],
    correct:0,
    explain:`Athena reads partitions from the Glue Data Catalog, so a new prefix is invisible until the catalog knows about it; a crawler scheduled after the load registers new partitions automatically. Running MSCK REPAIR TABLE is the tempting answer because it does fix the symptom, but the question asks for an automated fix and that command is a manual step someone has to remember.`
  },

  /* Ch 17 - Schema discovery and schema evolution */
  {
    q:`A streaming producer registers its Avro schema in the AWS Glue Schema Registry with BACKWARD compatibility. The team now wants to rename a required field and change its type from string to int. What happens?`,
    opts:[
      "The registry accepts the version, and consumers migrate automatically at their next poll",
      "The registry rejects the new version: under BACKWARD compatibility a new schema must still be able to read data written with the previous one, and a rename plus a type change breaks that",
      "The registry accepts the version, because BACKWARD compatibility only compares the number of fields",
      "No check happens: a Glue crawler updates the catalog table and consumers pick up the change"
    ],
    correct:1,
    explain:`That is what a compatibility mode is for: BACKWARD requires that a consumer on the new schema can still read data produced under the old one, and renaming a required field while changing its type violates that, so registration fails. The "consumers migrate automatically" option is the tempting one, but the registry enforces contracts, it does not rewrite consumers.`
  },

  /* Ch 18 - AWS Schema Conversion Tool */
  {
    q:`Before committing to an Oracle to Amazon Aurora PostgreSQL migration, a team needs an estimate of how much of the schema and PL/SQL will convert automatically and how much must be rewritten by hand. What produces that?`,
    opts:[
      "An AWS DMS task with data validation enabled, run against a test target",
      "An AWS Glue crawler pointed at the Oracle instance over a JDBC connection",
      "A DMS full load task run once, whose logs list the objects it could not create",
      "The AWS SCT assessment report, which grades each schema object by how much manual work its conversion needs"
    ],
    correct:3,
    explain:`The assessment report is the planning artifact: it inventories schema objects and code and flags what SCT can convert versus what a human must rewrite, before any data moves. DMS validation is the tempting choice because it also produces a report, but it compares row data after a migration; it says nothing about converting stored procedures.`
  },

  /* Ch 19 - Open table formats: Apache Iceberg on S3 */
  {
    q:`A privacy request requires deleting every row for one user from a 30 TB table stored as plain Parquet files in S3. Today the team satisfies these by rewriting entire partitions. What changes if the table is Apache Iceberg?`,
    opts:[
      "Iceberg compresses the data so full partition rewrites finish faster",
      "Iceberg stores the rows in DynamoDB, where deleting by key is cheap",
      "Iceberg supports row-level DELETE, tracking which files changed and committing a new snapshot instead of rewriting whole partitions",
      "Nothing changes: Iceberg tables are append-only, so deletes still mean rewriting partitions"
    ],
    correct:2,
    explain:`Iceberg's metadata layer tracks the table as a set of files per snapshot, which is what makes a row-level DELETE possible without rewriting everything around it. The append-only option is the tempting one because that is true of a plain Parquet data lake, but the whole point of an open table format is bringing transactional updates and deletes to those same files.`
  },

  /* Ch 20 - S3 Lifecycle and storage class transitions */
  {
    q:`Application logs are queried heavily for 30 days, then almost never, but must be retained for 7 years to satisfy an auditor who accepts a retrieval time measured in hours. Which TWO S3 Lifecycle actions implement that at the lowest storage cost?`,
    opts:[
      "Transition objects to S3 Glacier Deep Archive 30 days after creation",
      "Expire objects 7 years (2555 days) after creation",
      "Transition objects to S3 Standard-IA on the day they are created",
      "Transition objects back to S3 Standard after 7 years so the auditor can read them",
      "Delete noncurrent versions after 1 day so only the latest log file is retained"
    ],
    correct:[0,1],
    explain:`One transition rule moves the logs to the cheapest archival class once the hot window closes, and one expiration rule deletes them when the retention obligation ends, so nothing is stored past its purpose. Transitioning to Standard-IA on day zero is the tempting extra saving, but lifecycle transitions to Standard-IA require the object to have been in S3 Standard for at least 30 days, and it would keep the logs in a far more expensive class than Deep Archive.`
  },

  /* Ch 21 - DynamoDB TTL, versioning, and lifecycle */
  {
    q:`A DynamoDB table uses TTL to expire event records. An engineer notices that items whose TTL timestamp passed six hours ago are still returned by queries. What is the correct explanation?`,
    opts:[
      "TTL deletion is a background process that typically completes within 48 hours of expiry, so applications should filter expired items in their reads",
      "TTL only applies to tables that have a sort key defined",
      "The TTL attribute must be a string in ISO 8601 format, so these timestamps are being ignored",
      "TTL marks items for deletion but never removes them until a DeleteItem request is issued"
    ],
    correct:0,
    explain:`TTL is a best-effort background sweep, not an instant delete, so reads can see expired items for a while and should filter on the expiry attribute. The "never removes them" option is tempting because the symptom looks like nothing is happening, but TTL does delete the items on its own, and those deletes consume no write capacity.`
  },

  /* Ch 22 - Redshift distribution and sort keys */
  {
    q:`A 2 GB dimension table is joined to every large fact table in an Amazon Redshift cluster, and query plans show it being redistributed across nodes on each join. Which distribution style removes that redistribution, and at what cost?`,
    opts:[
      "DISTSTYLE EVEN, which spreads rows round robin so every node holds part of the join",
      "DISTSTYLE ALL, which keeps a full copy of the dimension on every node, at the cost of extra storage and slower loads",
      "A DISTKEY on the dimension's surrogate key, which replicates the table to every node",
      "DISTSTYLE AUTO, which always selects KEY distribution for tables under 5 GB"
    ],
    correct:1,
    explain:`ALL distribution replicates a small table to every node, so any join against it is local and nothing moves over the network; the price is storing it N times and slower writes. A DISTKEY is the tempting answer, but it colocates rows on one join column only and does not replicate, so the dimension still moves when it is joined on anything else.`
  }

];

/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
