/* ----------  CARDS  ---------- */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 4 · Chapter 36</div>
    <h1 class="reveal">Data privacy and governance</h1>
    <p class="lead reveal">The last chapter steps back. <strong>Governance</strong> is the set of policies and tools that keep data discoverable, high-quality, secure, and compliant. <strong>Privacy</strong> is protecting personal data under the law. This chapter frames both, and ties the whole unit together.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — what they mean */
  { html: `
    <div class="eyebrow reveal">The frame</div>
    <h2 class="reveal">Governance and privacy</h2>
    <p class="lead reveal" style="margin-bottom:18px">Two related goals sit over everything a data engineer builds.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Governance</b>Make data discoverable, trustworthy, secure, and compliant, with clear ownership and policy.</p></div>
      <div class="pill"><p><b>Privacy</b>Protect personal data under regulations like GDPR, CCPA, and HIPAA, honoring data residency and individual rights.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 2 — the five pillars */
  { html: `
    <div class="eyebrow reveal">The pillars</div>
    <h2 class="reveal">Five things governance does</h2>
    <div class="art reveal">${A.pillars}</div>
    <p class="lead reveal">Good governance runs a loop: <strong>classify</strong> data by sensitivity, <strong>control</strong> who can access it, <strong>protect</strong> it with encryption and masking, <strong>retain</strong> and dispose of it on a schedule, and <strong>audit</strong> to prove all of the above. Each pillar is a habit, not a one-time setup.</p>
    <div class="spacer"></div>` },

    <div class="eyebrow reveal">Handling personal data</div>
    <h2 class="reveal">Classify, then de-identify</h2>
    <p class="lead reveal" style="margin-bottom:18px">Reducing exposure of personal data comes down to labeling it and, where possible, removing the link to a person.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Anonymization</b>Irreversibly strips identity so data can never be traced back to a person. Best for open analytics.</p></div>
      <div class="pill"><p><b>Pseudonymization</b>Replaces identifiers with tokens, reversible only with a protected key, so you can re-link when a legitimate need arises.</p></div>
    </div>
    <div class="spacer"></div>` },

    <p class="lead reveal" style="text-align:center;margin-bottom:20px">You have finished Unit 4, and the full course: all four domains of the AWS Data Engineer Associate exam.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Governance is a loop</b>Classify, control, protect, retain, and audit, running continuously.</p></div>
      <div class="pill"><p><b>Privacy is the law</b>De-identify with anonymization or pseudonymization, and respect residency and retention.</p></div>

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
