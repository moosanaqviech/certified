<style>
  /* =====================================================================

  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;
    --ink-soft:#a7a59f; --ink-faint:#6b6a66; --gold:#e3b84a; --green:#34d3a6; --red:#e8625c;

  html{scroll-behavior:smooth;}
  body{background:radial-gradient(1100px 650px at 50% -8%,#1a1d29 0%,transparent 58%),var(--bg);font-family:var(--body);color:var(--ink);min-height:100vh;line-height:1.5;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* sticky top */
  .top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}

  .timer.warn{color:var(--gold);}
  .timer svg{opacity:.7;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  /* intro */
  .intro{text-align:center;margin:auto 0;padding:30px 0;}
  .intro .badge{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px;}
  .intro h1{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.05;letter-spacing:-0.02em;margin-bottom:16px;}

  .facts{display:flex;justify-content:center;gap:0;margin:24px 0 28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#14110c;font-weight:700;font-size:16px;padding:15px 30px;border-radius:14px;border:none;cursor:pointer;transition:transform .15s ease;font-family:var(--body);}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}

  /* question */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .qnum{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:0.04em;}

  .qtext{font-size:18px;line-height:1.5;font-weight:500;margin-bottom:20px;}

  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);line-height:1.4;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:rgba(255,255,255,0.2);}

  .opt.sel .key{background:var(--gold);color:#14110c;}

  /* review states */
  .opt.correct{border-color:var(--green);background:rgba(52,211,166,0.1);}
  .opt.correct .key{background:var(--green);color:#072018;}

  .explain b{color:var(--ink);}

  /* nav dots */
  .nav-dots{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 4px;justify-content:center;}

  .dot.answered{background:var(--surface-2);color:var(--ink);border-color:rgba(255,255,255,0.18);}

  /* footer nav */
  .foot{display:flex;gap:12px;margin-top:24px;}

  /* results */
  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:140px;height:140px;margin:6px auto 18px;}
  .scorering svg{transform:rotate(-90deg);}
  .scorering .tr{stroke:rgba(255,255,255,0.1);}
  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scorering .ctr b{font-family:var(--display);font-size:38px;font-weight:600;line-height:1;}
  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .verdict{font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:6px;}
  .verdict.pass{color:var(--green);}
  .verdict.fail{color:var(--gold);}
  .res p{color:var(--ink-soft);font-size:14.5px;max-width:28em;margin:0 auto 22px;}
  .res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}

<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 4",
  badge: "AWS Data Engineer Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Most questions have one best answer; a few ask you to select two.",
  coverage: "Full coverage, all 36 chapters: Units 1-4, weighted like the real DEA-C01 exam.",
  minutes: 72,
  pass: 72
};

const QUESTIONS = [

  /* Ch 01 - Streaming vs batch ingestion */
  {
    q:`An industrial platform collects readings from 500 sensors that report once every 15 minutes. The only consumer is a maintenance report reviewed each morning. An architect has designed a Kinesis based streaming pipeline for it. What should a reviewer point out?`,
    opts:[
      "Kinesis cannot ingest data arriving as infrequently as every 15 minutes",
      "The design is correct: sensor telemetry is always a streaming workload",
      "No consumer acts on the data before the next morning, so a scheduled batch ingestion meets the requirement at lower cost and with less to operate",
      "The design is correct, because 500 producers exceed what batch ingestion can handle"
    ],
    correct:2,
    explain:`The source being sensors does not make the workload streaming; the consumer's tolerance for staleness does. Nothing reads these readings until morning, so a scheduled batch load is sufficient. "Telemetry is always streaming" is the tempting pattern match, and it is exactly the reflex the exam tests against.`
  },

  /* Ch 02 - Kinesis Data Streams: shards, retention, replay */
  {
    q:`A new stream's traffic is impossible to forecast: it may sit near zero for days, then spike unpredictably. The team does not want to monitor and resize shards, and accepts a higher per-record price for that. Which capacity choice fits?`,
    opts:[
      "On-demand capacity mode, where the stream scales its throughput automatically with observed traffic",
      "Provisioned mode with shards sized for the largest spike seen so far",
      "Provisioned mode with one shard, relying on retries during spikes",
      "On-demand mode, but with a manual shard count set as a ceiling"
    ],
    correct:0,
    explain:`On-demand mode exists for exactly this profile: throughput scales with traffic and there is no shard count to manage, at a higher price per unit of data. Provisioning for peak is the tempting safe answer, but it pays for the peak continuously through the long quiet periods.`
  },

  /* Ch 03 - Kinesis Data Streams vs Amazon MSK */
  {
    q:`A team runs Kafka Streams applications and wants to keep them, but is unwilling to size, patch, or scale brokers, and their traffic is highly variable. Which option matches both constraints?`,
    opts:[
      "Kinesis Data Streams in on-demand mode, rewriting the Kafka Streams applications against the Kinesis APIs",
      "Amazon MSK Serverless, which runs Apache Kafka with capacity managed automatically, so the existing Kafka clients keep working",
      "Amazon MSK provisioned, sizing the brokers for the highest expected throughput",
      "Amazon Data Firehose, which accepts Kafka producer traffic natively"
    ],
    correct:1,
    explain:`MSK Serverless keeps the Kafka API and ecosystem, which the existing applications require, while removing broker sizing and scaling. Kinesis in on-demand mode solves the capacity half of the problem but fails the other half, since it would mean rewriting the Kafka Streams applications the team explicitly wants to keep.`
  },

  /* Ch 04 - Amazon Data Firehose */
  {
    q:`An Amazon Data Firehose stream delivers to Amazon Redshift. During a maintenance window the cluster is unreachable, and afterwards the team wants to confirm nothing was lost. What does Firehose do with records it cannot deliver?`,
    opts:[
      "It discards them after the first failed attempt and emits a CloudWatch metric",
      "It pauses ingestion at the producer until the destination recovers",
      "It holds them in the delivery stream indefinitely until the destination returns",
      "It retries for a configured duration and backs up records it still cannot deliver to the S3 backup bucket configured on the stream"
    ],
    correct:3,
    explain:`Firehose retries for a configured window and writes what it still cannot deliver to the S3 backup location, so failed records are recoverable rather than lost. Expecting the stream to hold them indefinitely is the tempting assumption, but Firehose is a delivery service with a bounded buffer, not a durable log like Kinesis Data Streams.`
  },

  /* Ch 05 - Amazon Managed Service for Apache Flink */
  {
    q:`A Managed Service for Apache Flink application has kept up with traffic for months, but a product launch is expected to triple event volume. The team wants the application to absorb the increase without someone watching it on launch night. What should they configure?`,
    opts:[
      "Enable automatic scaling so the application adds Kinesis Processing Units as load rises, having verified the parallelism settings allow it",
      "Increase the source stream's retention period to 7 days so a backlog can be caught up later",
      "Add a second copy of the application reading the same stream, so the two share the load",
      "Increase the checkpoint interval so less time is spent snapshotting state"
    ],
    correct:0,
    explain:`KPUs are the capacity unit for a Flink application, and automatic scaling adjusts them in response to load, which is what unattended absorption of a traffic increase requires. Longer retention is the tempting safety net, but it only buys time to fall behind; it does not add processing capacity.`
  },

  /* Ch 06 - Batch ingestion sources: S3, DMS, AppFlow */
  {
    q:`A team uses Amazon AppFlow to pull Salesforce opportunity records into S3 every hour. Sales asks for the data to arrive within a minute of a record changing, rather than waiting for the next hourly run. What is the right change?`,
    opts:[
      "Replace AppFlow with an AWS DMS task pointed at the Salesforce API",
      "Shorten the scheduled flow to run every minute",
      "Configure the flow to be event-triggered so it runs when Salesforce emits a change event, rather than on a schedule",
      "Write a Lambda function that polls the Salesforce API every 30 seconds"
    ],
    correct:2,
    explain:`AppFlow supports event-triggered flows for sources that publish change events, which converts the hourly pull into a push on change. Running the schedule every minute is the tempting brute-force fix, but it means constant polling and still averages a delay, while a custom polling Lambda gives up the no-code integration AppFlow was chosen for.`
  },

  /* Ch 07 - AWS Glue for ETL */
  {
    q:`A team wants to run continuous Spark transformations on records arriving in a Kinesis data stream, writing enriched output to S3, and would like to stay inside AWS Glue rather than adopt another service. What supports this?`,
    opts:[
      "A Glue job with bookmarks enabled and a schedule that runs every minute",
      "A Glue streaming ETL job, which runs a continuous Spark Structured Streaming application against the stream in micro-batches",
      "A Glue crawler configured with the Kinesis stream as its data source",
      "A Glue workflow whose trigger fires each time a record arrives"
    ],
    correct:1,
    explain:`Glue streaming ETL jobs run Spark Structured Streaming continuously against a Kinesis or Kafka source, so the team gets stream processing without leaving Glue. Scheduling a batch job every minute is the tempting approximation, but it pays job startup on every run and still processes in fixed slices rather than continuously.`
  },

  /* Ch 08 - AWS Glue vs Amazon EMR */
  {
    q:`A team's workload is pure Spark: no Hive, no HBase, no notebooks, no version pinning. They want per-second billing with no clusters to manage, but they also want to size the Spark application's resources themselves rather than reason in Glue DPUs. Which option fits?`,
    opts:[
      "Amazon EMR on EC2 with managed scaling and a long-running cluster",
      "AWS Glue with the maximum worker count, which exposes Spark executor sizing directly",
      "Amazon EMR on EKS, running Spark on an existing Kubernetes cluster the team does not have",
      "Amazon EMR Serverless, which runs Spark applications without provisioning clusters while still exposing Spark-level resource configuration"
    ],
    correct:3,
    explain:`EMR Serverless sits between the two: no cluster to manage, but the EMR runtime and Spark-level configuration are still available. A long-running EC2 cluster contradicts the no-clusters requirement, and EMR on EKS is only sensible when the team already operates Kubernetes.`
  },

  /* Ch 09 - Transforming data in Amazon Redshift */
  {
    q:`A multi-step nightly transformation inside Amazon Redshift involves several dependent SQL statements, conditional logic, and error handling, and it must run entirely within the warehouse on a schedule. What is the natural fit?`,
    opts:[
      "A Redshift stored procedure holding the logic, invoked on a schedule (for example by a scheduled query or EventBridge rule)",
      "A separate AWS Glue job for each SQL statement, chained with triggers",
      "A materialized view, which can express conditional logic and error handling",
      "An external Lambda function issuing each statement over a JDBC connection and sleeping between them"
    ],
    correct:0,
    explain:`Stored procedures are how Redshift expresses multi-statement logic with control flow and error handling, and scheduling invokes them without moving compute anywhere else. The Lambda over JDBC option is the tempting DIY equivalent, but it reimplements sequencing and error handling outside the database while adding a 15-minute execution ceiling.`
  },

  /* Ch 10 - Step Functions vs Amazon MWAA */
  {
    q:`A pipeline must call Amazon Athena, then AWS Glue, then Amazon SNS, with different branches based on a query result. The team has no Airflow experience and wants to avoid writing and maintaining code that calls each service's API. Which option matches?`,
    opts:[
      "Amazon MWAA, since Airflow ships operators for each of these services",
      "A single Lambda function using the AWS SDK to call each service in order",
      "AWS Step Functions, whose optimized service integrations invoke Athena, Glue, and SNS directly from the state machine, with Choice states for the branching",
      "Amazon EventBridge rules chained together, one per service call"
    ],
    correct:2,
    explain:`Step Functions calls these services directly from the workflow definition, so branching and invocation are configuration rather than code, which matches a team with no Airflow background. MWAA would work but means adopting and operating Airflow for a pipeline that never needed it, and its always-on environment costs more than a workflow that bills per transition.`
  },

  /* Ch 11 - Event-driven pipelines with Amazon EventBridge */
  {
    q:`An order placed event must reach a fraud service, an analytics pipeline, and a warehouse system, and the team expects to add more consumers later without redeploying the producer. Which TWO facts about EventBridge make this the right pattern?`,
    opts:[
      "A single event can be matched by multiple rules, each delivering to its own target, so consumers are added independently of the producer",
      "The producer publishes to the event bus without knowing which consumers exist, so adding a fourth consumer is a new rule rather than a producer change",
      "EventBridge guarantees that all targets of an event are invoked inside a single transaction",
      "EventBridge delivers each event to exactly one target, chosen by priority order",
      "Consumers must be registered on the producer's side before they can receive events"
    ],
    correct:[0,1],
    explain:`The decoupling comes from two properties: many rules can match the same event, and the producer has no knowledge of consumers, so growth is additive on the consumer side. There is no cross-target transaction, and delivery is fan-out rather than a single prioritized target, which is what distinguishes an event bus from a queue.`
  },

  /* Ch 12 - Infrastructure as code and CI/CD */
  {
    q:`A team defines its infrastructure in TypeScript using the AWS CDK. During review, someone asks how this relates to CloudFormation. What is accurate?`,
    opts:[
      "The CDK replaces CloudFormation with its own deployment engine and state store",
      "The CDK synthesizes CloudFormation templates from code, so deployments are still CloudFormation stacks with the same drift detection and rollback behavior",
      "The CDK issues AWS API calls directly, so there is no template and no stack",
      "The CDK is only for application code and cannot define infrastructure such as IAM roles"
    ],
    correct:1,
    explain:`The CDK is an authoring layer: it synthesizes templates, and what actually deploys is a CloudFormation stack, so stack-level behavior such as drift detection and rollback still applies. Believing it bypasses CloudFormation is the common misconception, and it leads teams to look for state and drift in the wrong place.`
  },

  /* Ch 13 - Lambda for data processing */
  {
    q:`A Lambda function triggered by S3 uploads writes to an Amazon RDS instance. During a bulk upload of 20,000 files, Lambda scales out sharply and the database starts refusing connections. What is the correct control?`,
    opts:[
      "Set reserved concurrency on the function, capping how many instances can run at once so the database sees a bounded connection count",
      "Enable provisioned concurrency so instances are pre-initialized",
      "Increase the function's memory so each invocation finishes sooner",
      "Increase the function timeout so connection attempts have longer to succeed"
    ],
    correct:0,
    explain:`Reserved concurrency puts a ceiling on simultaneous executions, which is how you protect a downstream resource with a hard connection limit from Lambda's scaling. Provisioned concurrency is the tempting near-match by name, but it pre-warms instances to remove cold starts and does nothing to limit the peak.`
  },

  /* Ch 14 - Choosing a data store: Redshift vs DynamoDB vs RDS */
  {
    q:`An e-commerce platform serves the shopping cart with single-digit millisecond key lookups and also needs analysts to run multi-year trend analysis over the same order history. A proposal suggests picking one store for both. What is the better design?`,
    opts:[
      "Amazon Redshift alone, with the cart reading through a materialized view",
      "Amazon DynamoDB alone, with analysts querying it using secondary indexes",
      "Amazon RDS alone, which serves both operational reads and analytical queries",
      "DynamoDB for the operational cart, with order history landed into Amazon Redshift (or S3) for the analytical workload"
    ],
    correct:3,
    explain:`These are two different workload shapes: key-value reads at low latency and large scans with joins and aggregations. Using the operational store for analytics is the tempting consolidation, but DynamoDB does not aggregate across years efficiently and heavy analytical scans would compete with the latency-sensitive cart traffic.`
  },

  /* Ch 15 - Data lakes on S3 */
  {
    q:`A data lake writes ingested files, cleaned files, and business-level aggregates all into the same S3 prefix. A reprocessing incident then makes it impossible to tell which files were the original inputs. What structural practice prevents this?`,
    opts:[
      "Enable S3 Versioning so previous object versions can be recovered",
      "Compress every object so raw files are visibly smaller than aggregates",
      "Separate the lake into zones (raw, cleaned, curated) so each stage writes to its own prefix and the immutable raw inputs stay reprocessable",
      "Add a file naming convention that encodes the processing stage in the object key"
    ],
    correct:2,
    explain:`Zones give each processing stage its own location, which keeps the raw inputs intact and reprocessable and makes lineage obvious. A naming convention is the tempting lighter-weight fix, but it is a convention nothing enforces, so one job writing the wrong name reintroduces the problem; versioning recovers overwritten objects but does not separate the stages.`
  },

  /* Ch 16 - AWS Glue Data Catalog and crawlers */
  {
    q:`A crawler runs over <code>s3://lake/events/</code> and creates 40 separate tables instead of the single table the team expected. The prefix contains files whose schemas differ slightly between subfolders. What is happening?`,
    opts:[
      "The crawler creates one table per file by default, so a table count equal to the file count is expected",
      "The crawler groups data into tables by compatible schema and structure, so incompatible schemas across subfolders produce separate tables; making the data consistent (or configuring how the crawler groups it) yields one table",
      "The crawler failed partway and the extra tables are artifacts that should be deleted",
      "Table proliferation is caused by S3 prefixes that contain more than 1000 objects"
    ],
    correct:1,
    explain:`Crawlers decide table boundaries by schema and structure similarity, so genuinely divergent schemas under one prefix become separate tables; the fix is upstream consistency, or telling the crawler how to group. Assuming one table per file is the common misreading, and it points teams at the file count rather than the schema drift that actually caused it.`
  },

  /* Ch 17 - Schema discovery and schema evolution */
  {
    q:`A table on S3 must support renaming a column and changing a column's type over time, without rewriting existing data files and without breaking queries that ran before the change. Which approach provides this?`,
    opts:[
      "Store the table in Apache Iceberg, whose schema evolution tracks columns by ID so renames and type promotions apply to the table without rewriting the data",
      "Keep plain Parquet files and re-run the crawler after each change",
      "Keep plain Parquet files and recreate the external table definition after each change",
      "Store the table as CSV, since CSV has no embedded schema to conflict with"
    ],
    correct:0,
    explain:`Iceberg assigns each column a stable ID, so a rename or a safe type promotion is a metadata operation and old files remain readable. Re-running a crawler over plain Parquet is the tempting equivalent, but the crawler only re-infers what the files contain, so a rename looks like a dropped column plus a new one rather than the same column under a new name.`
  },

  /* Ch 18 - AWS Schema Conversion Tool */
  {
    q:`A team is planning an Oracle to Amazon Aurora PostgreSQL migration and wants schema conversion to happen within the same service and console they will use for the data migration, rather than installing a separate desktop application. What should they use?`,
    opts:[
      "AWS Glue Studio, which generates target schemas from a source database connection",

/* =====================================================================

===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
