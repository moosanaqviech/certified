/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Practice Exam 2",
  badge: "AWS Solutions Architect Associate (SAA-C03)",
  blurb: "Scenario-based questions across Unit 2, Design Resilient Architectures. Most have one best answer; a few ask you to select two.",
  coverage: "Covers Unit 2 (Domain 2): all 17 chapters across Modules 2.1 and 2.2. One question per chapter.",
  minutes: 34,
  pass: 72
};

const QUESTIONS = [

  /* Ch 24 - Architecture Styles: Multi-Tier vs Microservices vs Event-Driven (S2.1.1) */
  { ref:{chapter:24}, q:`When an order is placed, a retailer's order service must trigger inventory updates, loyalty points, a confirmation email, and analytics. New teams add consumers every quarter, and the order team does not want to change or redeploy its service each time one is added. Which architecture style fits best?`,
    opts:[
      "A multi-tier design with a larger application tier that runs all five functions in one deployment",
      "Event-driven: the order service publishes an OrderPlaced event to an Amazon EventBridge bus, and each consumer subscribes with its own rule",
      "Microservices where the order service calls each consumer's REST API synchronously before it returns",
      "A shared database table that every consumer polls for new order rows"
    ],
    correct:1,
    explain:`In an event-driven design the producer emits an event to a router and does not know who consumes it, so a new consumer is just a new rule on the bus and the order service never changes. Synchronous calls from the order service to every consumer (C) are still microservices, but they couple the producer to each consumer's address and availability, so every new consumer means a code change and one slow service delays every order.` },

  /* Ch 25 - Scaling Strategies: Out vs Up, and Designing Stateless Components (S2.1.2) */
  { ref:{chapter:25}, q:`A web application runs on EC2 instances in an Auto Scaling group behind an Application Load Balancer. Sessions are kept in each instance's memory, and sticky sessions are enabled. Users are still logged out whenever the group scales in or an instance fails. What should a solutions architect do so the group can scale freely without logging users out?`,
    opts:[
      "Increase the sticky session duration on the target group to 24 hours",
      "Replace the instances with a larger instance type and stop scaling in",
      "Turn off scale-in on the Auto Scaling group so instances are never removed",
      "Move session state to Amazon ElastiCache or DynamoDB so any instance can serve any request"
    ],
    correct:3,
    explain:`Scaling out works only when instances are stateless: with sessions in a shared store such as ElastiCache or DynamoDB, an instance can be removed or replaced and the next instance still finds the session. Longer stickiness (A) only pins users to an instance for longer; when that instance goes away the session in its memory goes with it, so stickiness never fixes state stored on the instance.` },

  /* Ch 26 - Decoupling with Amazon SQS: Standard vs FIFO, Visibility Timeout, Dead-Letter Queues (K2.1.2, K2.1.11) */
  { ref:{chapter:26}, q:`Workers poll an Amazon SQS standard queue for video thumbnail jobs. Each job takes up to 4 minutes to process. The queue uses the default settings, and the team sees many jobs processed two or three times. What is the most likely fix?`,
    opts:[
      "Raise the queue's visibility timeout above the longest processing time, for example to 6 minutes",
      "Enable long polling by setting the receive wait time to 20 seconds",
      "Increase the message retention period to 14 days",
      "Add a delivery delay of 15 minutes to every message"
    ],
    correct:0,
    explain:`The default visibility timeout is 30 seconds, so a message being processed for 4 minutes becomes visible again and another worker receives it. Setting the timeout above the processing time keeps it hidden until the worker deletes it (consumers should still be idempotent, since standard queues are at-least-once). Long polling (B) cuts empty receives and cost, but does nothing to stop a message reappearing mid-processing.` },

  /* Ch 27 - Services for Loose Coupling: SQS vs SNS vs EventBridge vs Amazon MQ (S2.1.3) */
  { ref:{chapter:27}, q:`A company is moving two systems to AWS. First, on-premises Java applications exchange messages over JMS with an Apache ActiveMQ broker, and the team cannot rewrite the messaging code. Second, every new shipment event must reach three teams' services, and each team must receive every event and process it at its own pace even when one service is down for an hour. Which TWO choices meet these requirements?`,
    opts:[
      "Replace the broker with a single Amazon SQS queue shared by the Java applications",
      "Use Amazon MQ for ActiveMQ so the applications keep their JMS code and point at a managed broker",
      "Send shipment events to one Amazon SQS queue that all three teams poll",
      "Publish shipment events to an Amazon SNS topic with a separate Amazon SQS queue subscribed for each team",
      "Have the shipment service call each team's API directly and retry on failure"
    ],
    correct:[1,3],
    explain:`Amazon MQ runs managed ActiveMQ or RabbitMQ brokers that speak JMS, AMQP, MQTT and STOMP, so it is the service for lifting existing broker clients without code changes. SNS to SQS fan-out gives every team its own copy of each event, and each queue buffers messages while its consumer is down. One shared SQS queue (C) delivers each message to only one consumer, so the three teams would split the events instead of each receiving all of them.` },

  /* Ch 28 - When to Use Containers: ECS vs EKS, EC2 Launch Type vs Fargate (S2.1.4) */
  { ref:{chapter:28}, q:`A team already deploys its services with Helm charts to Kubernetes and runs a log collection agent as a DaemonSet on every node. It wants AWS to manage the Kubernetes control plane. Which option fits these requirements?`,
    opts:[
      "Amazon EKS with all pods running on AWS Fargate",
      "Amazon ECS with the Fargate launch type",
      "Amazon EKS with EC2 managed node groups",
      "A self-managed Kubernetes cluster installed on EC2 instances"
    ],
    correct:2,
    explain:`Helm charts and Kubernetes manifests call for EKS, and the DaemonSet needs real nodes, which EC2 managed node groups provide while AWS runs the control plane. EKS on Fargate (A) removes the nodes to manage, but Fargate does not support DaemonSets, so the log agent would have to be rebuilt as a sidecar in every pod.` },

  /* Ch 29 - When to Use Serverless: AWS Lambda Patterns and Limits (S2.1.5) */
  { ref:{chapter:29}, q:`A Lambda function writes order records to a legacy database that fails when more than 50 connections are open. During sales events the function scales out and overwhelms the database, and at the same time other functions in the account start getting throttled. What should a solutions architect configure?`,
    opts:[
      "Provisioned concurrency of 50 on the function",
      "Reserved concurrency of 50 on the function",
      "More memory on the function so each invocation finishes faster",
      "A request to raise the account's concurrency quota"
    ],
    correct:1,
    explain:`Reserved concurrency does two things: it caps the function at 50 concurrent executions, which protects the database, and it sets that capacity aside so this function cannot consume the rest of the account's pool and starve other functions. Provisioned concurrency (A) keeps environments initialized to remove cold starts, but it is not a ceiling: the function can still scale past 50 with on-demand concurrency.` },

  /* Ch 30 - Amazon API Gateway: REST vs HTTP vs WebSocket APIs (K2.1.1) */
  { ref:{chapter:30}, q:`A company is publishing a product catalog API to partners. It needs responses cached at the API layer, AWS WAF in front of the API, and per-partner API keys with usage plans that set request quotas. Which API Gateway option meets all these requirements?`,
    opts:[
      "An HTTP API with a JWT authorizer",
      "A WebSocket API with a connection route per partner",
      "An HTTP API behind an Application Load Balancer",
      "A REST API"
    ],
    correct:3,
    explain:`Caching, AWS WAF integration, API keys and usage plans are REST API features. An HTTP API with a JWT authorizer (A) is cheaper and simpler, which makes it a common distractor, but HTTP APIs offer no API caching, no usage plans or API keys, and no direct WAF association.` },

  /* Ch 31 - Workflow Orchestration with AWS Step Functions (K2.1.16) */
  { ref:{chapter:31}, q:`An order workflow validates the order, charges the card, then waits for a warehouse worker to confirm the item was picked, which can take up to three days, and then books shipping. The card must never be charged twice. Which design fits?`,
    opts:[
      "A Step Functions Standard workflow that pauses on a task using .waitForTaskToken until the warehouse app returns the token",
      "A Step Functions Express workflow that polls the warehouse system in a loop",
      "A chain of Lambda functions where one function sleeps until the warehouse confirms",
      "An SQS queue with a delivery delay on each message until the pick is done"
    ],
    correct:0,
    explain:`Standard workflows run for up to a year with exactly-once execution, and the callback pattern pauses the task until the warehouse app sends the token back, so nothing runs or bills while it waits. An Express workflow (B) is capped at five minutes and is at-least-once for asynchronous runs, so it can neither wait three days nor guarantee a single charge.` },

  /* Ch 32 - Purpose-Built Services: Managed AI Services as Architecture Components (S2.1.7 = S2.2.8) */
  { ref:{chapter:32}, q:`An insurer receives scanned claim forms as PDFs with tables and form fields. It must extract the fields into a database and then flag claims whose free-text description shows negative sentiment. The team has no machine learning experience. Which combination of services fits best?`,
    opts:[
      "Amazon Rekognition to read the forms and Amazon Translate for the sentiment",
      "Amazon Transcribe to convert the forms and Amazon Comprehend for the sentiment",
      "Amazon Textract to extract the fields and Amazon Comprehend to detect sentiment",
      "A custom model trained and hosted in Amazon SageMaker AI for both steps"
    ],
    correct:2,
    explain:`Textract is built to pull text, tables and key-value pairs from scanned documents, and Comprehend detects sentiment in text, so both steps are API calls with no model to train. A custom SageMaker AI model (D) could do the job, but it adds data labeling, training and hosting for problems that managed services already solve, which a team without ML experience should avoid.` },

  /* Ch 33 - Automating for Infrastructure Integrity: Immutable Infrastructure with AWS CloudFormation (S2.2.1) */
  { ref:{chapter:33}, q:`Administrators log in to production EC2 instances to patch them and change configuration, and the servers have drifted apart so that some releases fail on only a few instances. The company wants every instance in a release to be identical and rollback to be fast. What should a solutions architect recommend?`,
    opts:[
      "Run AWS Systems Manager Patch Manager nightly on the production instances",
      "Build a golden AMI per release with EC2 Image Builder, roll it out by replacing instances through CloudFormation, and keep the previous AMI for rollback",
      "Turn on CloudFormation drift detection and email the results to the administrators",
      "Take an EBS snapshot of each instance before every manual change"
    ],
    correct:1,
    explain:`Immutable infrastructure never changes a running server: each release is a new image, instances are replaced rather than patched, and rollback means redeploying the previous AMI, so every instance in a release is the same. Patch Manager (A) is the right tool for long-lived nodes, but it still changes servers in place, which is how this fleet drifted in the first place.` },

  /* Ch 34 - Services for High Availability Across AZs and Regions (S2.2.2) */
  { ref:{chapter:34}, q:`A MySQL-compatible database backs a global application. The database must keep running automatically if one Availability Zone fails, serve low-latency reads in two other Regions, and allow a secondary Region to take over within minutes with an RPO measured in seconds. Which TWO choices meet these requirements?`,
    opts:[
      "Amazon RDS for MySQL Single-AZ with cross-Region automated backups",
      "Amazon DynamoDB global tables",
      "An Amazon Aurora MySQL cluster with Aurora Replicas in other Availability Zones",
      "Nightly database dumps copied to S3 with Cross-Region Replication",
      "An Aurora Global Database with secondary clusters in the two other Regions"
    ],
    correct:[2,4],
    explain:`Aurora keeps six copies of the data across three AZs, and an Aurora Replica in another AZ is promoted automatically if the writer's AZ fails. Aurora Global Database adds read-only secondary clusters in other Regions with replication lag of about a second and promotion in minutes. DynamoDB global tables (B) are multi-Region and multi-active, but DynamoDB is not MySQL-compatible, so the application would have to be rewritten.` },

  /* Ch 35 - Amazon Route 53: Routing Policies and Health Checks for Failover (K2.2.1, K2.2.6) */
  { ref:{chapter:35}, q:`A company serves example.com from an ALB in us-east-1 and keeps a standby ALB in us-west-2. Traffic should go to us-west-2 only when us-east-1 is unhealthy, and the record must work at the zone apex. Which Route 53 configuration fits?`,
    opts:[
      "Failover routing with primary and secondary alias records pointing at the two ALBs, with target health evaluated on the primary",
      "Weighted routing with CNAME records set to 100 and 0",
      "Latency routing with alias records for both ALBs",
      "Multivalue answer routing that returns both ALB addresses"
    ],
    correct:0,
    explain:`Failover routing answers with the primary record while its health check or evaluated target health passes and switches to the secondary when it fails, and alias records are allowed at the zone apex and cost nothing to query. Weighted CNAME records (B) fail twice: a CNAME cannot exist at the apex, and a weight of 0 is not a health-driven failover. Latency routing (C) would send users near us-west-2 to the standby all the time.` },

  /* Ch 36 - Metrics That Match the Business: CloudWatch Alarms and AWS X-Ray (S2.2.3) */
  { ref:{chapter:36}, q:`The on-call team for a checkout service is paged several times a week by CPU alarms on its EC2 instances while customers notice nothing. Last month a broken payment step went unnoticed for six hours overnight because almost no one was shopping. Which change best fixes both problems?`,
    opts:[
      "Lower the CPU alarm threshold so problems are caught earlier",
      "Enable AWS X-Ray tracing and review the service map each morning",
      "Subscribe the team to the AWS Health Dashboard for the Region",
      "Alarm on business metrics such as successful checkouts and error rate, combine alarms with a composite alarm, and run a CloudWatch Synthetics canary that completes a test checkout"
    ],
    correct:3,
    explain:`An alarm should track what customers experience, so successful checkouts and errors replace CPU, and a composite alarm pages only when the signals that matter agree, which cuts noise. A canary generates its own traffic, so it catches a broken step even when no real users are shopping. X-Ray (B) helps find where a request failed once someone is looking, but tracing by itself pages no one at 2 a.m.` },

  /* Ch 37 - Mitigating Single Points of Failure (S2.2.4) */
  { ref:{chapter:37}, q:`An application runs in private subnets across three Availability Zones, and all three route tables send internet traffic to one NAT gateway in the first AZ. The application also calls a partner payment API, and when that API slows down the clients retry immediately in tight loops, which makes the slowdown worse. Which TWO changes improve resilience?`,
    opts:[
      "Create a NAT gateway in each AZ and point each AZ's private route table at the NAT gateway in the same AZ",
      "Replace the NAT gateway with a single larger NAT instance",
      "Raise the client retry count to 10 with a fixed 100 ms wait",
      "Retry with exponential backoff and jitter, only on idempotent calls that carry an idempotency token",
      "Create NAT gateways in all three AZs but keep every route table pointing at the first one"
    ],
    correct:[0,3],
    explain:`A NAT gateway lives in one AZ, so one gateway for all three AZs is a single point of failure; one per AZ with matching routes means losing an AZ only affects that AZ. Exponential backoff with jitter spreads retries out instead of hammering a struggling dependency, and an idempotency token keeps a retried payment from charging twice. More retries at a fixed short wait (C) is exactly the retry storm the team already has, only larger.` },

  /* Ch 38 - Data Durability and Availability: Storage Characteristics and Backup Strategy (S2.2.5) */
  { ref:{chapter:38}, q:`A reporting server keeps its only copy of critical files on a single EBS gp3 volume. The company wants to recover the data if the volume's Availability Zone fails or if someone deletes files by mistake. What should a solutions architect do?`,
    opts:[
      "Attach a second EBS volume in the same AZ and mirror the two volumes with RAID 1",
      "Move the files to S3 One Zone-IA to lower storage cost",
      "Take scheduled EBS snapshots with AWS Backup and keep several restore points",
      "Rely on EBS replication, which already copies every volume across AZs"
    ],
    correct:2,
    explain:`EBS replicates a volume only inside its own AZ, while snapshots are stored regionally and can be restored to a new volume in any AZ, and keeping several restore points undoes an accidental deletion. RAID 1 in the same AZ (A) protects against one volume failing but both volumes go down with the AZ, and mirroring copies a deletion to both instantly.` },

  /* Ch 39 - Selecting a Disaster Recovery Strategy Against RPO and RTO (S2.2.6) */
  { ref:{chapter:39}, q:`A company's DR plan requires the recovery Region to accept production traffic immediately after a disaster, even at reduced capacity, and then scale up to full size. The budget rules out running a full-size copy of production in the second Region. Which DR strategy fits?`,
    opts:[
      "Backup and restore",
      "Warm standby",
      "Pilot light",
      "Multi-site active/active"
    ],
    correct:1,
    explain:`Warm standby runs a scaled-down but fully working copy in the recovery Region, so it can take traffic at once and then scale out, at a fraction of the cost of full duplication. Pilot light (C) keeps the data live but the application servers switched off, so they must be started before the Region can serve traffic. For either strategy, infrastructure as code and raised service quotas in the recovery Region should be in place before the disaster.` },

  /* Ch 40 - Making Legacy Applications Reliable Without Code Changes (S2.2.7) */
  { ref:{chapter:40}, q:`A legacy application runs on one EC2 instance and cannot be modified or scaled horizontally. When the instance fails, an administrator rebuilds it by hand. After each RDS Multi-AZ failover, the application opens hundreds of new database connections at once and the database becomes unstable. Which solution improves reliability without code changes?`,
    opts:[
      "Run the instance in an Auto Scaling group with a minimum and maximum of one, launched from a golden AMI across two AZs behind an ALB, and connect to the database through RDS Proxy",
      "Add a CloudWatch alarm with EC2 automatic recovery and move the database to a larger instance class",
      "Rewrite the application as Lambda functions behind API Gateway",
      "Replicate the instance to another Region with AWS Elastic Disaster Recovery"
    ],
    correct:0,
    explain:`An Auto Scaling group of one replaces a failed instance automatically, in another AZ if needed, and the ALB gives clients a stable endpoint. RDS Proxy pools connections and keeps them open through a Multi-AZ failover, so the database never sees the connection storm. EC2 automatic recovery (B) restarts the instance on new hardware in the same AZ but does not survive an AZ failure, and a larger database still has to absorb the storm. Elastic Disaster Recovery (D) is Regional DR, not everyday self-healing.` }

];

const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
