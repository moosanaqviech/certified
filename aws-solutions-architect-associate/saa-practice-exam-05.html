<script>

/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Full Mock Exam 1",
  badge: "AWS Solutions Architect Associate (SAA-C03)",
  blurb: "A full-length practice exam across all four SAA-C03 domains. Most questions have one best answer; a few ask you to select two.",
  coverage: "Mirrors the real exam shape: 65 questions sampled at the official domain weights, 20 Design Secure Architectures, 17 Design Resilient Architectures, 15 Design High-Performing Architectures and 13 Design Cost-Optimized Architectures, with their own retail and financial services scenarios.",
  minutes: 130,
  pass: 72
};

const QUESTIONS = [

  /* Ch 01 - AWS Global Infrastructure and the Shared Responsibility Model (K1.1.3, K1.1.5) */
  { ref:{chapter:1}, q:`A payments company runs its card-processing application on Amazon EC2 instances and stores transaction records in Amazon DynamoDB. An auditor asks which security tasks the company itself must perform. Which task is the company's responsibility?`,
    opts:[
      "Patching the hypervisor that hosts the EC2 instances",
      "Applying security patches to the operating system on the EC2 instances",
      "Physically securing the data centers that host DynamoDB",
      "Patching the DynamoDB storage servers"
    ],
    correct:1,
    explain:`On EC2 the customer owns the guest operating system, so OS patching is the company's job. Option A is tempting because patching is a shared control, but the shared split is that AWS patches the infrastructure up to the hypervisor and host OS, while the customer patches the guest OS. DynamoDB servers and data center security are entirely AWS's.` },

  /* Ch 02 - Locking Down the Root User and IAM Users: MFA, Access Keys, Least Privilege (S1.1.1) */
  { ref:{chapter:2}, q:`An online retailer's new AWS account is used by three administrators who all sign in as the root user with a shared password, and the root user has an access key used by a reporting script. What should a solutions architect do first to reduce risk?`,
    opts:[
      "Rotate the root access key every 90 days and share the new key with the administrators",
      "Create IAM users for the script and keep using root for the administrators",
      "Enable AWS CloudTrail and keep the current sign-in practice",
      "Enable MFA on the root user, delete the root access key, and give the administrators and the script their own identities with least privilege"
    ],
    correct:3,
    explain:`The root user should have MFA and no access keys and be kept for the short list of root-only tasks; people and workloads get their own identities scoped to what they need. Rotating the root key (A) still leaves a permanent full-access credential in a script and shared among people. CloudTrail records activity but removes no risk.` },

  /* Ch 04 - Role-Based Access with AWS STS: Role Switching and Cross-Account Access (S1.1.3) */
  { ref:{chapter:4}, q:`A bank hires a third-party fraud analytics vendor that needs read access to transaction files in one S3 bucket in the bank's account. The vendor serves many banks from its own AWS account. How should the bank grant access while preventing the confused deputy problem?`,
    opts:[
      "Create an IAM role that trusts the vendor's account and requires an external ID that the vendor assigns to the bank",
      "Create an IAM user for the vendor and email its access keys",
      "Make the bucket public and restrict it with an obscure bucket name",
      "Create a role that trusts any AWS account and rely on the bucket policy to limit access"
    ],
    correct:0,
    explain:`A cross-account role with a trust policy naming the vendor's account and requiring the vendor-assigned external ID stops another vendor customer from tricking the vendor into using the bank's role. An IAM user with keys (B) works but creates long-lived credentials to leak and rotate. A public bucket and an open trust policy expose the data.` },

  /* Ch 05 - Multi-Account Security Strategy: AWS Organizations, SCPs, and AWS Control Tower (S1.1.4) */
  { ref:{chapter:5}, q:`An insurance group is creating a new multi-account environment for 25 business units. It wants a standard landing zone with central log archive and audit accounts, and it must prevent anyone in member accounts from disabling AWS CloudTrail. Which TWO actions meet these goals?`,
    opts:[
      "Set up AWS Control Tower to create the landing zone with its log archive and audit accounts",
      "Attach a service control policy that denies cloudtrail:StopLogging and cloudtrail:DeleteTrail to the organizational units that hold member accounts",
      "Create an IAM user in each account with permission to view CloudTrail",
      "Run all workloads in the management account so its policies apply",
      "Attach an SCP that allows cloudtrail:* so that CloudTrail permissions are granted to every user"
    ],
    correct:[0,1],
    explain:`Control Tower builds the landing zone, including the log archive and audit accounts, and an SCP denying the CloudTrail stop and delete actions sets a ceiling no member identity can exceed. An allow SCP (E) never grants anything; SCPs only limit. Workloads belong outside the management account, which SCPs do not restrict.` },

  /* Ch 06 - Resource-Based Policies vs Identity-Based Policies (S1.1.5) */
  { ref:{chapter:6}, q:`A retailer's analytics account must let a Lambda function in its marketing account write files to a single S3 bucket in the analytics account. The marketing team wants to keep its function's own execution role identity rather than switching roles. What is required?`,
    opts:[
      "Only an identity-based policy on the function's execution role that names the bucket",
      "Only a bucket policy in the analytics account that names the execution role",
      "A bucket policy in the analytics account that allows the execution role, and an identity-based policy on the execution role that allows the writes",
      "An SCP in the marketing account that allows s3:PutObject"
    ],
    correct:2,
    explain:`Across accounts both sides must allow: the bucket policy lets the caller's own identity reach that one resource, and the caller's identity policy must also allow the action. An identity policy alone (A) can only speak for its own account, so the analytics account would refuse the request. A bucket policy alone fails the caller-side check, and SCPs never grant.` },

  /* Ch 07 - Federating a Directory: IAM Identity Center vs IAM SAML Federation vs AWS Directory Service (S1.1.6) */
  { ref:{chapter:7}, q:`A retail chain with 60 AWS accounts in AWS Organizations already manages its workforce in Microsoft Entra ID. It wants employees to sign in once and reach the accounts they need with permissions managed centrally, with the least ongoing effort. What should it use?`,
    opts:[
      "IAM Identity Center with Entra ID as the external identity provider, assigning permission sets to groups",
      "IAM SAML federation configured separately in each of the 60 accounts",
      "AWS Managed Microsoft AD with a trust to Entra ID",
      "IAM users in each account with passwords synchronized by a script"
    ],
    correct:0,
    explain:`IAM Identity Center connects one external identity source to every account in the organization, and permission sets become roles in each target account, all managed in one place. Per-account SAML federation (B) works but means 60 IdP registrations, role sets and certificate rotations. Managed Microsoft AD is for AD-aware workloads, not account sign-in.` },

  /* Ch 08 - Network Segmentation: Public Subnets, Private Subnets, and Subnet Tiers (S1.2.2) */
  { ref:{chapter:8}, q:`A fintech startup launches its payment API, its application servers and its PostgreSQL database in the default VPC. A security review says the database must not be reachable from the internet in any way. What is the best design change?`,
    opts:[
      "Keep the database in the default subnet and remove its public IP address",
      "Add a network ACL that blocks port 5432 in the default subnets",
      "Create a VPC with public subnets for the load balancer and private subnets, spread across two AZs, for the application and database tiers",
      "Move the database into a public subnet in a different AZ"
    ],
    correct:2,
    explain:`A subnet is private when its route table has no route to the internet gateway, so tiers that must not face the internet belong in private subnets, with only the load balancer public. Every default subnet is public (A), so the database stays one setting away from exposure. A NACL rule is a patch on a subnet that is still public.` },

  /* Ch 09 - Routing and Egress: Route Tables, Internet Gateways, and NAT Gateways (S1.2.1 part) */
  { ref:{chapter:9}, q:`Application servers in private subnets of a bank's VPC must download operating system updates from the internet over IPv4, but nothing on the internet may start a connection to them. What should the route tables for the private subnets use as the default route?`,
    opts:[
      "The internet gateway",
      "A NAT gateway in a public subnet",
      "A virtual private gateway",
      "The local route"
    ],
    correct:1,
    explain:`A NAT gateway in a public subnet gives private IPv4 resources outbound-only internet access; return traffic flows back, but no inbound connection can start. An internet gateway route (A) makes the subnet public and, with public IPs, two-way. The local route only covers traffic inside the VPC, and a virtual private gateway leads to a VPN.` },

  /* Ch 11 - VPC Endpoints: Gateway Endpoints vs Interface Endpoints (AWS PrivateLink) (K1.2.2) */
  { ref:{chapter:11}, q:`An insurance company's on-premises claims system, connected to AWS by Direct Connect, must send messages to an Amazon SQS queue without the traffic crossing the public internet. Instances in the VPC must use the same private path. What should the architect create?`,
    opts:[
      "A gateway VPC endpoint for SQS",
      "A NAT gateway in each AZ",
      "A public SQS endpoint with an IP allow list",
      "An interface VPC endpoint for SQS, with private DNS, reachable over the Direct Connect connection"
    ],
    correct:3,
    explain:`Interface endpoints place PrivateLink network interfaces in the VPC, support SQS, and can be reached from on premises over Direct Connect or VPN. Gateway endpoints (A) exist only for S3 and DynamoDB and are not reachable from on premises. A NAT gateway or the public endpoint sends traffic over the internet.` },

  /* Ch 12 - Perimeter Protection: AWS WAF, AWS Shield, AWS Firewall Manager, and AWS Network Firewall (S1.2.3 part) */
  { ref:{chapter:12}, q:`A retailer runs 40 AWS accounts, each with Application Load Balancers in front of storefront applications. Security wants the same AWS WAF rules, including SQL injection protection, applied to every ALB, and applied automatically to accounts created later. What should it use?`,
    opts:[
      "AWS Shield Standard",
      "AWS Network Firewall in each VPC",
      "AWS Firewall Manager with an AWS WAF policy across the organization",
      "Security groups that block SQL keywords"
    ],
    correct:2,
    explain:`Firewall Manager enforces a WAF policy centrally across accounts in the organization, including new accounts as they join. Network Firewall (B) inspects VPC traffic at the packet level but is not how WAF web ACLs are deployed to ALBs at scale. Shield Standard covers network-layer DDoS, and security groups cannot inspect request content.` },

  /* Ch 13 - Application Secrets: AWS Secrets Manager vs Systems Manager Parameter Store (S1.2.3 part) */
  { ref:{chapter:13}, q:`A payments platform stores an Amazon RDS for MySQL master password in a configuration file baked into its AMI. Compliance now requires the password to be rotated automatically every 30 days without code changes on each rotation. What should the architect use?`,
    opts:[
      "AWS Secrets Manager with automatic rotation, with the application reading the secret at runtime through its IAM role",
      "A Systems Manager Parameter Store standard parameter updated by hand each month",
      "Environment variables in the EC2 user data",
      "An S3 object encrypted with SSE-S3 that the application downloads at startup"
    ],
    correct:0,
    explain:`Secrets Manager rotates database credentials on a schedule with a rotation function, and applications fetch the current value at runtime with their role's permissions. Parameter Store (B) stores secure values cheaply but has no built-in rotation, so someone would have to change it every month. Values in user data or AMIs are exactly what to avoid.` },

  /* Ch 14 - Securing Application Sign-In with Amazon Cognito: User Pools and Identity Pools (K1.2.4, K1.2.5) */
  { ref:{chapter:14}, q:`An e-commerce mobile app lets shoppers sign in with email or with Google, and after sign-in the app must upload profile photos directly to an S3 prefix unique to each shopper using temporary AWS credentials. Which design fits?`,
    opts:[
      "IAM users for each shopper, with access keys stored in the app",
      "An Amazon Cognito identity pool alone, with no sign-in",
      "IAM Identity Center with a permission set per shopper",
      "An Amazon Cognito user pool for sign-in, federated with Google, and an identity pool that exchanges the tokens for temporary credentials scoped to each shopper's prefix"
    ],
    correct:3,
    explain:`The user pool authenticates shoppers natively or through Google, and the identity pool swaps the token for temporary AWS credentials through an IAM role that can scope access to the shopper's own prefix. An identity pool alone (B) can issue guest credentials but cannot sign shoppers in with email. Identity Center is for workforce access to AWS accounts, not app customers.` },

  /* Ch 15 - Threat Detection and Posture: GuardDuty, Macie, Inspector, Security Hub, Detective (K1.2.5) */
  { ref:{chapter:15}, q:`A bank suspects that some S3 buckets used by its data teams contain unencrypted spreadsheets with customer credit card numbers. It wants an automated way to discover such data across all its buckets. Which service should it use?`,
    opts:[
      "Amazon GuardDuty",
      "Amazon Macie",
      "Amazon Inspector",
      "Amazon Detective"
    ],
    correct:1,
    explain:`Macie uses managed data identifiers to find sensitive data such as credit card numbers and PII in S3 objects, with automated discovery across buckets. GuardDuty (A) detects active threats from logs and activity, such as unusual API calls, but does not classify what is inside files. Inspector scans for software vulnerabilities, and Detective investigates findings.` },

  /* Ch 16 - Securing External Connections: Site-to-Site VPN, Client VPN, and Direct Connect (S1.2.4) */
  { ref:{chapter:16}, q:`A credit union's 300 loan officers work remotely and need secure access from their laptops to internal applications in a VPC, authenticated with the credit union's SAML identity provider and limited by group. Which solution fits with the least infrastructure to manage?`,
    opts:[
      "AWS Site-to-Site VPN to each officer's home router",
      "An AWS Direct Connect hosted connection per officer",
      "Bastion hosts with public IP addresses and SSH keys for each officer",
      "AWS Client VPN with SAML federated authentication and authorization rules per group"
    ],
    correct:3,
    explain:`Client VPN is the managed remote-access service for individual users, authenticated by AD, SAML or certificates, with authorization rules limiting each group to its networks. Site-to-Site VPN (A) connects whole networks, not individual laptops, and home routers are not managed endpoints. Direct Connect is a private line to a facility, and bastions expose SSH.` },

  /* Ch 18 - Encrypting Data at Rest with AWS KMS (S1.3.2) */
  { ref:{chapter:18}, q:`A retailer encrypts millions of small order-receipt objects in S3 with SSE-KMS using a customer managed key, and its AWS KMS request charges have become significant. It must keep using its own KMS key. What change reduces the KMS cost?`,
    opts:[
      "Switch the bucket default encryption to SSE-S3",
      "Enable S3 Bucket Keys for the bucket's SSE-KMS encryption",
      "Use client-side encryption with a key stored in the application",
      "Disable default encryption and encrypt only some objects"
    ],
    correct:1,
    explain:`An S3 Bucket Key lets S3 use a bucket-level key derived from the KMS key, which cuts the number of KMS requests sharply while the customer managed key stays in control. SSE-S3 (A) removes the KMS calls but abandons the requirement to use the company's own KMS key. Keys in application code and partial encryption weaken protection.` },

  /* Ch 19 - Encrypting Data in Transit: AWS Certificate Manager and TLS (S1.3.3) */
  { ref:{chapter:19}, q:`An online store serves its site through Amazon CloudFront with an Application Load Balancer origin in eu-west-1. It needs free managed TLS certificates for both the CloudFront distribution and the ALB, and certificates that renew without manual steps. Which TWO actions are required?`,
    opts:[
      "Request the certificate for the CloudFront distribution in AWS Certificate Manager in US East (N. Virginia)",
      "Copy the eu-west-1 certificate to us-east-1 for CloudFront",
      "Use DNS validation for the ACM certificates",
      "Use email validation so the domain owner approves each renewal",
      "Import a self-signed certificate into CloudFront"
    ],
    correct:[0,2],
    explain:`CloudFront only uses ACM certificates from US East (N. Virginia), and DNS validation lets ACM renew in-use certificates automatically while the validation record stays in DNS. ACM certificates cannot be copied between Regions (B); request one in each Region instead. Email validation (D) requires someone to approve every renewal, which is the manual step to avoid.` },

  /* Ch 20 - Access Policies for Encryption Keys: KMS Key Policies and Grants (S1.3.4) */
  { ref:{chapter:20}, q:`A bank's security team must manage a customer managed KMS key that protects loan documents: edit its policy, rotate it and schedule deletion. Policy says the security team must never be able to decrypt the documents. How should the key policy be written?`,
    opts:[
      "Give the security team kms:* on the key",
      "Give the security team decrypt permission and remove the key's administrators",
      "Make the security team key administrators without key user permissions, and grant encrypt and decrypt only to the application role",
      "Rely on an IAM policy that denies the security team kms:Decrypt, with no key policy changes"
    ],
    correct:2,
    explain:`Key administrators manage the key's lifecycle and policy without any cryptographic use, while key users encrypt and decrypt; splitting the two meets the rule. kms:* (A) includes Decrypt, which is exactly what must be excluded. An IAM deny on its own still leaves an over-broad key policy, and administrators could edit the policy to undo it.` },

  /* Ch 21 - Implementing Backups and Replication: AWS Backup, Cross-Region and Cross-Account Copies, S3 Replication (S1.3.5) */
  { ref:{chapter:21}, q:`After a ransomware incident at a peer bank, a bank requires that backups of its RDS databases be copied to a separate account that the production account cannot alter, and that nobody, including administrators, can delete the copies before their retention ends. What should it configure?`,
    opts:[
      "AWS Backup copy rules to a vault in a separate backup account within the organization, with Vault Lock in compliance mode",
      "Manual RDS snapshots kept in the production account",
      "S3 Same-Region Replication of database exports in the production account",
      "AWS Backup in the production account with Vault Lock in governance mode"
    ],
    correct:0,
    explain:`Cross-account copies isolate backups from a compromised source account, and compliance-mode Vault Lock cannot be lifted by anyone before retention ends. Governance mode (D) can be bypassed by identities with the right IAM permissions, and keeping it in the production account leaves the copies within the attacker's reach. Replication copies mistakes and deletions too.` },

  /* Ch 22 - Data Access, Lifecycle, and Protection Policies: Block Public Access, Object Ownership, Versioning, Object Lock (S1.3.6) */
  { ref:{chapter:22}, q:`A brokerage must store trade confirmation records in S3 in WORM form for seven years. Regulators require that no user, including the root user, can delete or overwrite a record during that period. What should the architect configure?`,
    opts:[
      "S3 Versioning with MFA delete",
      "S3 Object Lock in compliance mode with a seven-year retention period",
      "S3 Object Lock in governance mode with a seven-year retention period",
      "A bucket policy that denies s3:DeleteObject to all users"
    ],
    correct:1,
    explain:`Compliance mode prevents any user, including root, from deleting or shortening retention on a locked version until the period ends. Governance mode (C) can be bypassed by users with special permissions, so it does not meet a regulator's "no one" rule. A bucket policy can be changed by an administrator, and versioning with MFA delete still allows authorized purges.` },

  /* Ch 23 - Rotating Encryption Keys and Renewing Certificates (S1.3.7) */
  { ref:{chapter:23}, q:`A payments company uses a public TLS certificate from a third-party certificate authority, imported into AWS Certificate Manager and attached to its ALB. The security team asks what happens as the certificate approaches expiry. What should the architect tell them?`,
    opts:[
      "ACM renews imported certificates automatically through DNS validation",
      "ACM renews the certificate as long as it stays attached to the ALB",
      "The team must obtain a new certificate from the issuer and reimport it over the existing one before expiry, which keeps the ARN and associations",
      "The ALB switches to an ACM-issued certificate automatically"
    ],
    correct:2,
    explain:`ACM only renews certificates it issued; an imported certificate must be renewed with the issuer and reimported over the old one, which keeps its ARN and attachments. Option B is tempting because ACM-issued certificates renew while in use, but that never applies to imported ones. ACM sends expiry events in advance so the team can act.` },

  /* Ch 24 - Architecture Styles: Multi-Tier vs Microservices vs Event-Driven (S2.1.1) */
  { ref:{chapter:24}, q:`An online marketplace's monolith is deployed as one unit, so a fix to the search feature waits for the release of every other team. Search and checkout also need to scale separately, and a bug in recommendations must not take down checkout. Which architecture style fits?`,
    opts:[
      "Microservices: small services with their own data and APIs, owned and deployed by separate teams",
      "A three-tier architecture with a larger application tier",
      "A single larger EC2 instance for the monolith",
      "A multi-tier design with the database moved to Amazon Aurora"
    ],
    correct:0,
    explain:`Microservices let each team deploy, scale and fail independently, which matches every requirement. A larger application tier (B) still ships and scales as one unit, so search fixes keep waiting and a recommendations bug can still affect checkout. Changing the database or instance size does not split the release unit.` },

  /* Ch 25 - Scaling Strategies: Out vs Up, and Designing Stateless Components (S2.1.2) */
  { ref:{chapter:25}, q:`A retailer's web tier runs on an Auto Scaling group behind an ALB. Shoppers lose their carts whenever the group scales in, because carts are kept in instance memory. What is the best fix?`,
    opts:[
      "Enable sticky sessions on the ALB",
      "Scale up to a single larger instance",
      "Disable scale-in on the Auto Scaling group",
      "Store cart and session state in Amazon ElastiCache or DynamoDB so any instance can serve any shopper"
    ],
    correct:3,
    explain:`Moving state out of the instances makes the tier stateless, so instances can be added or removed freely. Sticky sessions (A) hide the problem: when a sticky instance is terminated, its shoppers still lose their carts. A single instance removes availability, and disabling scale-in wastes money.` },

  /* Ch 26 - Decoupling with Amazon SQS: Standard vs FIFO, Visibility Timeout, Dead-Letter Queues (K2.1.2, K2.1.11) */
  { ref:{chapter:26}, q:`A bank processes account ledger updates from an SQS queue. Updates for the same account must be applied strictly in order and exactly once, while updates for different accounts can be processed in parallel. What should the architect use?`,
    opts:[
      "An SQS FIFO queue with the account ID as the message group ID",
      "An SQS standard queue with a long visibility timeout",
      "An SQS standard queue with a delay queue setting",
      "An SNS standard topic with an SQS standard subscription"
    ],
    correct:0,
    explain:`FIFO queues preserve order within a message group and deliver exactly once, and using the account ID as the group keeps each account ordered while different accounts process in parallel. Standard queues (B) deliver at least once with best-effort ordering, and a visibility timeout cannot change that. Delays and SNS standard topics do not add ordering.` },

  /* Ch 27 - Services for Loose Coupling: SQS vs SNS vs EventBridge vs Amazon MQ (S2.1.3) */
  { ref:{chapter:27}, q:`A retailer wants to react when a SaaS payment provider sends events, routing refunds to one Lambda function and chargebacks to another based on fields inside each event, with no servers to manage. Which service fits?`,
    opts:[
      "Amazon SQS standard queue polled by both functions",
      "Amazon MQ with ActiveMQ",
      "Amazon SNS with one topic for all events",
      "Amazon EventBridge with a partner event source and content-based rules"
    ],
    correct:3,
    explain:`EventBridge receives events from SaaS partners and routes them by matching fields inside the event to different targets. SNS (C) fans out and can filter messages, but it has no partner event source integration for SaaS providers the way EventBridge does. An SQS queue hands each message to one consumer, and Amazon MQ is for existing broker protocols.` },

  /* Ch 28 - When to Use Containers: ECS vs EKS, EC2 Launch Type vs Fargate (S2.1.4) */
  { ref:{chapter:28}, q:`A small e-commerce team is containerizing a long-running Java order service. It has no Kubernetes experience, traffic varies widely through the day, and it wants the least operational overhead. Which platform should it choose?`,
    opts:[
      "Amazon EKS on self-managed EC2 nodes",
      "Amazon ECS on AWS Fargate",
      "Amazon ECS on EC2 instances with a custom AMI",
      "AWS Lambda functions with a 15-minute timeout"
    ],
    correct:1,
    explain:`ECS is the simplest AWS-native orchestrator, and Fargate removes servers entirely while scaling with variable traffic. EKS (A) is the choice when Kubernetes, its tooling or portability is the requirement, which it is not here, and self-managed nodes add work. Lambda's 15-minute limit does not suit a long-running service.` },

  /* Ch 29 - When to Use Serverless: AWS Lambda Patterns and Limits (S2.1.5) */
  { ref:{chapter:29}, q:`An insurer wants to run code each time a customer uploads a claim photo to S3: resize the image and write metadata to DynamoDB. Each run takes about 3 seconds, uploads arrive in unpredictable bursts, and the team wants to pay only when work happens. What should it use?`,
    opts:[
      "An EC2 Auto Scaling group polling the bucket",
      "An Amazon ECS service running 24/7",
      "An AWS Lambda function triggered by S3 event notifications",
      "An AWS Batch job scheduled every hour"
    ],
    correct:2,
    explain:`Lambda runs short, event-driven tasks directly from S3 notifications, scales with bursts and charges only for invocations and duration. An always-on ECS service (B) keeps paying through quiet hours and still needs something to deliver the events. Polling instances and hourly Batch jobs add delay and idle cost.` },

  /* Ch 30 - Amazon API Gateway: REST vs HTTP vs WebSocket APIs (K2.1.1) */
  { ref:{chapter:30}, q:`A bank is building an internal API used only by applications in its VPCs. The API must not be reachable from the internet and must be protected by AWS WAF. Which API Gateway option fits?`,
    opts:[
      "An HTTP API with a JWT authorizer",
      "A WebSocket API",
      "A private REST API accessed through an interface VPC endpoint, with a resource policy and AWS WAF",
      "An edge-optimized REST API with an API key"
    ],
    correct:2,
    explain:`Private APIs exist only as REST APIs and are reachable solely through an interface VPC endpoint, locked down by a resource policy; REST APIs also support AWS WAF. An HTTP API (A) is cheaper and simpler but cannot be private in that way and does not support WAF. An edge-optimized API is public, and API keys are not access control.` },

  /* Ch 31 - Workflow Orchestration with AWS Step Functions (K2.1.16) */
  { ref:{chapter:31}, q:`A lender's loan approval process scores an application, then waits up to five days for an underwriter to approve or reject it in an internal tool, then funds the loan. The company wants managed orchestration without writing polling code. What should it build?`,
    opts:[
      "An Express Step Functions workflow with a Wait state of five days",
      "A Standard Step Functions workflow that uses the wait-for-callback pattern with a task token for the underwriter step",
      "A Lambda function that sleeps until the underwriter responds",
      "An SQS queue that the underwriter tool polls every minute"
    ],
    correct:1,
    explain:`Standard workflows run for up to a year and support .waitForTaskToken, which pauses until the underwriter tool sends the token back. Express workflows (A) last at most five minutes and do not support callbacks. A Lambda function cannot run more than 15 minutes, and an SQS polling loop is the custom code the company wants to avoid.` },

  /* Ch 32 - Purpose-Built Services: Managed AI Services as Architecture Components (S2.1.7 = S2.2.8) */
  { ref:{chapter:32}, q:`An online retailer receives thousands of product reviews a day in several languages. It wants each review translated to English and tagged as positive, negative or neutral, with no machine learning expertise on the team. Which combination fits?`,
    opts:[
      "Amazon SageMaker AI to train a custom sentiment model",
      "Amazon Rekognition and Amazon Polly",
      "Amazon Textract and Amazon Lex",
      "Amazon Translate followed by Amazon Comprehend sentiment analysis"
    ],
    correct:3,
    explain:`Translate changes the language and Comprehend detects sentiment, both as pre-trained APIs that need no ML expertise. SageMaker AI (A) could build a model, but data preparation, training and hosting are the team's job, so it is never the least-effort answer when a managed service fits. Rekognition, Polly, Textract and Lex handle images, speech, documents and chat.` },

  /* Ch 33 - Automating for Infrastructure Integrity: Immutable Infrastructure with AWS CloudFormation (S2.2.1) */
  { ref:{chapter:33}, q:`A payments company's production web servers have drifted from each other after months of manual changes over SSH, and a recent hand-applied patch broke two of them. It wants identical, reproducible servers and easy rollback. What should it adopt?`,
    opts:[
      "Build golden AMIs with EC2 Image Builder and deploy them through CloudFormation, replacing instances instead of patching them in place",
      "Give more engineers SSH access so patches are applied faster",
      "Take nightly snapshots of each server and restore whichever one breaks",
      "Use larger instances so fewer servers need patching"
    ],
    correct:0,
    explain:`Immutable infrastructure replaces servers from a versioned image defined in code, so every instance is identical and rollback means switching back to the previous image. Nightly snapshots (C) preserve each server's drift and roll back data along with configuration. More SSH access causes more drift, and fewer servers still drift.` },

  /* Ch 34 - Services for High Availability Across AZs and Regions (S2.2.2) */
  { ref:{chapter:34}, q:`A global payments platform needs its transaction database to survive the loss of an entire AWS Region, with an RPO of seconds and an RTO of minutes, and its web tier to survive the loss of an Availability Zone. Which TWO choices meet these needs?`,
    opts:[
      "Amazon Aurora Global Database with a secondary Region",
      "An RDS for MySQL single-AZ instance with daily snapshots copied to another Region",
      "An Application Load Balancer and an Auto Scaling group spanning at least two AZs",
      "A single EC2 instance with an Elastic IP address",
      "An S3 bucket with Transfer Acceleration"
    ],
    correct:[0,2],
    explain:`Aurora Global Database replicates to secondary Regions with an RPO typically measured in seconds and promotes a secondary in minutes, and a load balancer with an Auto Scaling group across AZs keeps the web tier serving through an AZ loss. Daily snapshots (B) mean up to a day of lost data and hours to restore. A single instance is a single point of failure.` },

  /* Ch 35 - Amazon Route 53: Routing Policies and Health Checks for Failover (K2.2.1, K2.2.6) */
  { ref:{chapter:35}, q:`An online retailer serves customers in North America from us-east-1 and customers in Europe from eu-central-1. For data residency, European customers must always be answered by the European stack. Which Route 53 routing policy should be used?`,
    opts:[
      "Latency-based routing",
      "Weighted routing with 50 percent to each Region",
      "Simple routing with both IP addresses",
      "Geolocation routing based on the user's continent"
    ],
    correct:3,
    explain:`Geolocation routing answers by the user's location, so European users always reach the European stack, which data residency requires. Latency routing (A) sends users to the fastest Region, which is usually but not always the nearest one, so it cannot guarantee residency. Weighted and simple routing ignore where the user is.` },

  /* Ch 36 - Metrics That Match the Business: CloudWatch Alarms and AWS X-Ray (S2.2.3) */
  { ref:{chapter:36}, q:`A retailer's checkout traffic is high at noon and near zero at 4 a.m. A static alarm on order volume either pages constantly at night or misses real drops at noon. What should the operations team configure?`,
    opts:[
      "A CloudWatch anomaly detection alarm on the order volume metric",
      "A higher static threshold during the day only",
      "A composite alarm that restarts EC2 instances",
      "An alarm on average CPU utilization of the web servers"
    ],
    correct:0,
    explain:`Anomaly detection learns the metric's expected band, including daily and weekly patterns, so it alarms on unusual drops at any hour. A static threshold (B) cannot follow a curve that changes through the day, which is the problem described. CPU does not measure orders, and composite alarms cannot take EC2 actions.` },

  /* Ch 37 - Mitigating Single Points of Failure (S2.2.4) */
  { ref:{chapter:37}, q:`A payment API sometimes times out after the card has already been charged. The client retries and some customers are charged twice. What should the architect add?`,
    opts:[
      "More retries with no delay",
      "A larger instance for the payment service",
      "An idempotency token, such as the order ID, sent by the client and checked by the service before charging",
      "A longer client timeout with no retries"
    ],
    correct:2,
    explain:`With an idempotency token, the service records the first result for that key and returns it on a retry instead of charging again. More retries without a token (A) make duplicate charges more likely, not less. A bigger instance or a longer timeout reduces timeouts but does not make a retry safe.` },

  /* Ch 38 - Data Durability and Availability: Storage Characteristics and Backup Strategy (S2.2.5) */
  { ref:{chapter:38}, q:`A bank keeps scanned loan agreements in S3 One Zone-IA to save money. These documents are the only copy and cannot be re-created. What is the main durability concern?`,
    opts:[
      "One Zone-IA has lower than 11 nines of durability within its AZ",
      "One Zone-IA stores data in a single Availability Zone, so an AZ-level event could lose irreplaceable documents",
      "One Zone-IA does not support encryption",
      "One Zone-IA objects cannot be retrieved in milliseconds"
    ],
    correct:1,
    explain:`One Zone classes keep data in one AZ, so a fire or flood there could destroy it; only re-creatable data belongs there. Option A is tempting, but S3 classes, One Zone included, are designed for 11 nines of durability within their storage footprint: the risk is the single-AZ footprint, not a lower figure. One Zone-IA supports encryption and millisecond access.` },

  /* Ch 39 - Selecting a Disaster Recovery Strategy Against RPO and RTO (S2.2.6) */
  { ref:{chapter:39}, q:`An insurer's policy administration system must recover in another Region within a few hours, data loss of a few minutes is acceptable, and compute costs in the recovery Region must be minimal until a disaster. Which DR strategy fits?`,
    opts:[
      "Pilot light: replicate the data continuously and keep servers off until needed",
      "Active/active across both Regions",
      "Warm standby with a scaled-down copy serving traffic",
      "Backup and restore from daily snapshots"
    ],
    correct:0,
    explain:`Pilot light keeps data replicating continuously, meeting a minutes-level RPO, while servers stay off until a disaster, keeping compute cost minimal and recovery within hours. Warm standby (C) recovers faster but runs a scaled-down copy all the time, which costs more than needed here. Daily backups lose up to a day of data.` },

  /* Ch 40 - Making Legacy Applications Reliable Without Code Changes (S2.2.7) */
  { ref:{chapter:40}, q:`A retailer runs a legacy inventory application on one EC2 instance. It cannot be changed or run on more than one instance. When the instance fails, someone rebuilds it by hand. How can the architect make it self-healing without code changes?`,
    opts:[
      "Run it on two instances behind an ALB with sticky sessions",
      "Put it in an Auto Scaling group of one instance, from a golden AMI, spanning multiple AZs, with ELB health checks behind an ALB",
      "Take a weekly AMI and keep the instance as is",
      "Rewrite the application as Lambda functions"
    ],
    correct:1,
    explain:`An Auto Scaling group with minimum and maximum of one replaces a failed instance automatically, in another AZ if needed, and ELB health checks catch application failures too. Two instances (A) break the constraint that it can only run once. Weekly AMIs still need a manual rebuild, and a rewrite violates the no-code-change rule.` },

  /* Ch 41 - Storage Configurations for Performance: EBS Volume Types, Instance Store, S3 Throughput, FSx for Lustre (S3.1.1) */
  { ref:{chapter:41}, q:`A trading analytics firm runs a nightly risk simulation on hundreds of EC2 instances that all read the same 50 TB market data set stored in S3, and needs parallel, sub-millisecond file access during the run. Which storage fits?`,
    opts:[
      "An EBS gp3 volume attached to every instance",
      "Instance store on one large instance",
      "Amazon EFS One Zone",
      "Amazon FSx for Lustre linked to the S3 bucket"
    ],
    correct:3,
    explain:`FSx for Lustre is a parallel file system built for HPC that can be linked to an S3 data set, serving many instances at high throughput and low latency. EFS (C) is a shared file system too, but it is not designed for this level of parallel HPC throughput. A gp3 volume attaches to one instance, and instance store on one host cannot feed hundreds.` },

  /* Ch 42 - Storage That Scales: Object vs File vs Block (S3.1.2) */
  { ref:{chapter:42}, q:`An e-commerce company runs a content management system on a fleet of Linux EC2 instances in three AZs. All instances must read and write the same product media files through a POSIX file system, and the library grows unpredictably. Which storage fits?`,
    opts:[
      "An EBS io2 volume with Multi-Attach",
      "Instance store on each instance, synchronized nightly",
      "Amazon EFS with a Regional file system",
      "An S3 bucket mounted as a block device"
    ],
    correct:2,
    explain:`EFS is a shared NFS file system that many Linux instances across AZs mount at once, and it grows without capacity planning. io2 Multi-Attach (A) is limited to instances in one AZ and needs an application that coordinates writes. Instance store is lost on stop, and S3 is object storage, not a block device.` },

  /* Ch 43 - Decoupling So Components Scale Independently (S3.2.1) */
  { ref:{chapter:43}, q:`During flash sales, a retailer's web tier accepts orders faster than its fulfillment service can process them, and orders fail when the fulfillment instances are overloaded. How should the architect decouple the tiers so each scales on its own?`,
    opts:[
      "Have the web tier write orders to an SQS queue, and scale the fulfillment workers on the queue backlog per instance",
      "Scale the fulfillment instances on the web tier's CPU",
      "Make the web tier call the fulfillment service synchronously with longer timeouts",
      "Run both tiers on one larger instance"
    ],
    correct:0,
    explain:`A queue lets the web tier return immediately while workers drain orders at their own pace, scaling on backlog per instance. Scaling fulfillment on the web tier's CPU (B) ties one tier's capacity to another tier's metric, which does not reflect the work waiting. Synchronous calls keep the tiers coupled, and one instance removes independent scaling.` },

  /* Ch 45 - Compute Options and Features: EC2 Instance Types for Performance (S3.2.3) */
  { ref:{chapter:45}, q:`A bank runs a tightly coupled risk calculation using MPI across 32 EC2 instances that exchange data constantly, and node-to-node latency limits the job. Which configuration improves performance most?`,
    opts:[
      "Spread the instances across three AZs",
      "Use burstable T instances",
      "Put the instances in a spread placement group",
      "Use instances that support Elastic Fabric Adapter in a cluster placement group"
    ],
    correct:3,
    explain:`EFA adds OS-bypass networking for tightly coupled HPC such as MPI, and a cluster placement group packs instances close together for the lowest latency. A spread placement group (C) puts instances on separate hardware for resilience, which increases distance between them. Spreading across AZs adds latency, and T instances throttle under load.` },

  /* Ch 47 - Configuring Read Replicas (S3.3.1) */
  { ref:{chapter:47}, q:`An insurer's RDS for PostgreSQL primary is overloaded by analysts' reporting queries at month end, slowing policy updates. Reports can tolerate data a few seconds old. What should the architect do?`,
    opts:[
      "Convert the instance to Multi-AZ and send reports to the standby",
      "Create a read replica and point the reporting tool at the replica's endpoint",
      "Add more storage to the primary",
      "Run the reports on the primary at a higher priority"
    ],
    correct:1,
    explain:`A read replica takes the read-only reporting load off the primary, and slight asynchronous lag is acceptable for reports. A Multi-AZ instance standby (A) exists for failover and does not serve reads. More storage or higher priority leaves the same load on the primary.` },

  /* Ch 48 - Designing Database Architectures (S3.3.2) */
  { ref:{chapter:48}, q:`A retailer's serverless checkout uses Lambda functions that each open a connection to an Aurora MySQL cluster. During sales, thousands of concurrent functions exhaust the database's connections. What should the architect add?`,
    opts:[
      "A larger Lambda memory setting",
      "More Aurora Replicas",
      "Amazon RDS Proxy between the functions and the cluster",
      "An SQS queue in front of every read"
    ],
    correct:2,
    explain:`RDS Proxy pools and shares database connections, so thousands of short-lived functions reuse a small set of connections, and it smooths failovers. More replicas (B) add read capacity but each still has connection limits, and the writer's connections remain exhausted. Lambda memory does not change connection counts.` },

  /* Ch 50 - Choosing a Database Type: Relational, Key-Value, Document, Graph, Wide-Column, In-Memory, Warehouse (S3.3.4) */
  { ref:{chapter:50}, q:`A payments company needs to detect fraud rings by following links between cards, devices, merchants and accounts several hops deep, in near real time. Queries on its relational database with repeated self-joins are too slow. Which database type fits?`,
    opts:[
      "A key-value store such as Amazon DynamoDB",
      "A graph database such as Amazon Neptune",
      "A data warehouse such as Amazon Redshift",
      "An in-memory cache such as Amazon ElastiCache"
    ],
    correct:1,
    explain:`Graph databases store relationships directly, so multi-hop traversals across cards, devices and accounts are fast. DynamoDB (A) excels at key lookups at scale but has no native way to traverse many hops of relationships. Redshift is for analytics over large history, and a cache does not model relationships.` },

  /* Ch 51 - Integrating Caching: ElastiCache Lazy Loading vs Write-Through, and DAX (S3.3.5) */
  { ref:{chapter:51}, q:`An online store's product detail pages read prices from Amazon RDS. Only a small share of products is popular, and after a price change shoppers must never see the old price. Which TWO caching choices meet these needs?`,
    opts:[
      "Use lazy loading so only requested products enter the cache",
      "Cache every product in advance and never expire entries",
      "Use write-through so each price update also updates the cache",
      "Use Amazon DynamoDB Accelerator (DAX) in front of RDS",
      "Disable caching for the product pages"
    ],
    correct:[0,2],
    explain:`Lazy loading keeps the cache small by filling it only with products people request, and write-through updates the cache on every price change so readers never see a stale price. DAX (D) is a cache for DynamoDB only and cannot sit in front of RDS. Caching everything forever wastes memory and serves stale prices.` },

  /* Ch 52 - Network Topology: VPC Peering vs Transit Gateway vs PrivateLink (S3.4.1) */
  { ref:{chapter:52}, q:`A payment processor offers a fraud-scoring API to hundreds of merchant VPCs in other AWS accounts. Many merchants use the same 10.0.0.0/16 CIDR as the processor, and merchants must reach only the API. What should the processor use?`,
    opts:[
      "AWS PrivateLink: an endpoint service behind a Network Load Balancer, with merchants creating interface endpoints",
      "VPC peering with each merchant VPC",
      "A Transit Gateway shared with all merchants",
      "Public internet access with IP allow lists"
    ],
    correct:0,
    explain:`PrivateLink exposes one service in one direction, exchanges no routes, so overlapping CIDRs are fine, and consumers reach nothing else. Peering (B) cannot connect overlapping CIDRs and would open whole networks. A Transit Gateway also routes between networks and requires non-overlapping ranges.` },

  /* Ch 55 - Load Balancing Strategy: ALB vs NLB vs GWLB (S3.4.4 = S4.2.1) */
  { ref:{chapter:55}, q:`A stock exchange's order-entry service uses a custom TCP protocol, must handle millions of requests per second at very low latency, and partners must allow-list fixed IP addresses. Which load balancer fits?`,
    opts:[
      "An Application Load Balancer",
      "A Gateway Load Balancer",
      "A Network Load Balancer with Elastic IP addresses",
      "A Classic Load Balancer"
    ],
    correct:2,
    explain:`An NLB works at layer 4 for TCP and UDP, handles millions of requests per second at low latency, and supports static Elastic IPs per AZ. An ALB (A) routes HTTP at layer 7 and does not offer static IPs. A GWLB is for inline security appliances, not serving the application.` },

  /* Ch 56 - Building and Securing a Data Lake: S3, the AWS Glue Data Catalog, and AWS Lake Formation (S3.5.1) */
  { ref:{chapter:56}, q:`A bank's data lake holds a customers table in S3. Branch analysts may see only their region's rows, and nobody outside the compliance team may see the national ID column. The bank wants to manage this centrally for Athena queries. What should it use?`,
    opts:[
      "Separate S3 buckets per region with bucket policies",
      "IAM policies on the analysts that name object prefixes",
      "Encrypt the column with a different KMS key",
      "AWS Lake Formation permissions with row-level filters by region and column-level restrictions on the national ID"
    ],
    correct:3,
    explain:`Lake Formation grants table, column and row-level permissions centrally, enforced for Athena queries. Separate buckets (A) can split by region but cannot hide a column inside the files, and they multiply copies. Prefix-level IAM policies cannot filter rows or columns, and a different KMS key does not hide a column within an object.` },

  /* Ch 57 - Streaming Architectures: Kinesis Data Streams vs Amazon Data Firehose vs Amazon MSK (S3.5.2) */
  { ref:{chapter:57}, q:`A retailer streams clickstream events and wants them delivered to S3 as Parquet files for Athena, with no consumer code to write or servers to manage. Near-real-time delivery is fine. Which service fits?`,
    opts:[
      "Amazon Kinesis Data Streams with custom consumers on EC2",
      "Amazon MSK with Kafka Connect",
      "Amazon SQS with Lambda writing files",
      "Amazon Data Firehose with record format conversion to Parquet"
    ],
    correct:3,
    explain:`Firehose delivers streaming data to S3 with buffering and can convert records to Parquet using a Glue schema, with no code. Kinesis Data Streams (A) suits real-time custom consumers and replay, but it requires the consumer code the retailer wants to avoid. MSK is for existing Kafka applications.` },

  /* Ch 59 - Visualization Strategies: Amazon Quick on Athena, Redshift, and OpenSearch Service (S3.5.4) */
  { ref:{chapter:59}, q:`A payments company's operations team must search application logs from the last few hours by error code and see dashboards of latency spikes within seconds of the logs arriving. Which solution fits?`,
    opts:[
      "Amazon Quick on Athena querying daily log files",
      "Amazon Redshift with nightly loads",
      "Amazon OpenSearch Service with OpenSearch Dashboards, fed through Amazon Data Firehose",
      "An S3 bucket with S3 Select"
    ],
    correct:2,
    explain:`OpenSearch Service makes streamed logs searchable within seconds and includes OpenSearch Dashboards for operational views. Quick on Athena (A) suits occasional dashboards over data already in S3, but daily files cannot show seconds-old errors. Nightly Redshift loads are hours behind.` },

  /* Ch 61 - Ingestion Configurations: Frequency, Buffering, and Secure Entry Points (S3.5.6) */
  { ref:{chapter:61}, q:`Producers in private subnets of a bank's VPC send transaction events to Amazon Data Firehose. Security requires that the traffic never traverse the internet and that producers can only put records into that one stream. What should the architect configure?`,
    opts:[
      "An interface VPC endpoint for Firehose, and an IAM policy allowing only firehose:PutRecordBatch on that stream",
      "A NAT gateway and an IAM policy allowing firehose:*",
      "A public subnet for the producers with security groups",
      "A gateway VPC endpoint for Firehose"
    ],
    correct:0,
    explain:`An interface endpoint keeps producer traffic on the AWS network, and a least-privilege policy limits producers to writing records to the one stream. A NAT gateway (B) sends traffic out through the internet path, and firehose:* is far broader than needed. Gateway endpoints exist only for S3 and DynamoDB.` },

  /* Ch 62 - Transforming Data Between Formats: CSV to Parquet with AWS Glue (S3.5.7) */
  { ref:{chapter:62}, q:`A retailer lands new CSV sales files in S3 every hour and wants them converted to partitioned Parquet for Athena. Each run should process only the files that arrived since the last run. What should the data team use?`,
    opts:[
      "An Athena CTAS query over the entire raw table every hour",
      "An AWS Glue Spark job with job bookmarks enabled, writing partitioned Parquet",
      "Amazon Data Firehose reading the files from S3",
      "S3 Lifecycle rules that convert files to Parquet"
    ],
    correct:1,
    explain:`A Glue job reads the cataloged CSV and writes compressed, partitioned Parquet, and job bookmarks track what was processed so each run handles only new files. A CTAS over the whole table (A) reprocesses everything every hour. Firehose converts streaming records, not files already in S3, and lifecycle rules change storage classes, not formats.` },

  /* Ch 63 - Cost Visibility: Cost Explorer, AWS Budgets, the Cost and Usage Report, and Cost Allocation Tags (K4.1.2, K4.1.3) */
  { ref:{chapter:63}, q:`A bank's finance team needs hourly, resource-level cost line items, including tags, delivered to S3 so it can build chargeback reports with Athena. Which tool provides this?`,
    opts:[
      "The AWS Cost and Usage Report, built through AWS Data Exports",
      "AWS Budgets",
      "AWS Cost Explorer's monthly view",
      "AWS Trusted Advisor"
    ],
    correct:0,
    explain:`The Cost and Usage Report delivers the most detailed line items, by hour, resource and tag, to S3 for querying with Athena. Cost Explorer (C) visualizes trends and forecasts, but it is not a line-item export for custom chargeback. Budgets alerts on thresholds, and Trusted Advisor flags optimization checks.` },

  /* Ch 64 - Storage Strategies: Batch vs Individual Uploads, and Requester Pays (S4.1.1) */
  { ref:{chapter:64}, q:`A point-of-sale system in 2,000 stores uploads each transaction to S3 as its own 1 KB object, creating hundreds of millions of PUT requests a month. Analysts query the data once a day. What lowers cost most?`,
    opts:[
      "Move the objects to S3 Standard-IA",
      "Enable S3 Transfer Acceleration",
      "Enable Requester Pays on the bucket",
      "Batch transactions into larger files, for example through Amazon Data Firehose buffering, before writing to S3"
    ],
    correct:3,
    explain:`Request charges scale with the number of objects, so batching records into larger files turns hundreds of millions of PUTs into a few thousand, and daily analysis does not need per-transaction objects. Standard-IA (A) bills at least 128 KB per object and adds retrieval fees, so tiny objects cost more there. Requester Pays only shifts download charges.` },

  /* Ch 65 - The Correct Storage Size for a Workload (S4.1.2) */
  { ref:{chapter:65}, q:`A cost review of an insurer's accounts finds hundreds of unattached EBS volumes left behind by terminated instances. Nobody knows whether the data matters, but it is rarely, if ever, needed. What is the most cost-effective action?`,
    opts:[
      "Keep the volumes and convert them to io2",
      "Delete the volumes immediately without backups",
      "Snapshot each volume, then delete the volumes",
      "Attach each volume to a new small instance"
    ],
    correct:2,
    explain:`Snapshots are incremental, stored in S3 and much cheaper than provisioned volumes, yet any volume can be recreated if someone needs it. Deleting without backups (B) is cheapest but irreversible when nobody knows if the data matters. io2 costs more, and attaching volumes to new instances adds instance charges.` },

  /* Ch 68 - S3 Object Lifecycles and Data Lifecycles (S4.1.5, S4.1.9) */
  { ref:{chapter:68}, q:`A retailer's receipts bucket holds objects that are read often for 60 days, read only for occasional disputes for the next year, and must be deleted after three years. Retrieval within hours is acceptable after the first year. Which lifecycle configuration is most cost-effective?`,
    opts:[
      "Keep all objects in S3 Standard and delete after three years",
      "Transition to S3 Standard-IA after 60 days, to S3 Glacier Deep Archive after 425 days, and expire after three years",
      "Transition to S3 Glacier Deep Archive on day 1 and expire after three years",
      "Transition to S3 One Zone-IA after 60 days and keep forever"
    ],
    correct:1,
    explain:`Each stage follows access: Standard while busy, Standard-IA for occasional dispute reads that need fast access, Deep Archive once hours are acceptable, then expiry at three years. Deep Archive on day 1 (C) is the cheapest storage but makes the busy first 60 days wait hours for every read. One Zone-IA forever ignores both the deletion rule and resilience.` },

  /* Ch 71 - Selecting a Storage Tier: S3 Storage Classes (S4.1.8) */
  { ref:{chapter:71}, q:`A bank's data lake holds millions of objects whose access patterns are unknown and change over time: some go cold for months and then become hot again. The team does not want to guess transition days or pay retrieval fees. Which storage class fits?`,
    opts:[
      "S3 Standard-IA",
      "S3 Intelligent-Tiering",
      "S3 Glacier Flexible Retrieval",
      "S3 One Zone-IA"
    ],
    correct:1,
    explain:`Intelligent-Tiering moves each object between access tiers based on its use, with no retrieval fees, for a small monitoring charge per object. Standard-IA (A) suits data read about once a month, and its retrieval fees punish objects that become hot again. Flexible Retrieval restores in minutes to hours, and One Zone-IA keeps data in one AZ.` },

  /* Ch 72 - The Most Cost-Effective Storage Service: S3 vs EFS vs FSx vs EBS (S4.1.10) */
  { ref:{chapter:72}, q:`A retailer's Windows-based merchandising application needs shared file storage over SMB with permissions from the corporate Active Directory. The team wants a managed service rather than running file servers. Which service fits?`,
    opts:[
      "Amazon EFS with lifecycle management",
      "Amazon S3 with S3 Object Lambda",
      "Amazon FSx for Windows File Server joined to Active Directory",
      "Amazon EBS volumes on a self-managed Windows server"
    ],
    correct:2,
    explain:`FSx for Windows File Server provides managed SMB shares that integrate with Active Directory permissions. EFS (A) is elastic and cheap, but it is NFS for Linux and does not serve SMB with Windows ACLs. S3 is object storage, and EBS on a self-managed server is the file server the team wants to avoid.` },

  /* Ch 73 - EC2 Purchasing Options: On-Demand, Savings Plans, Reserved Instances, and Spot (K4.2.4) */
  { ref:{chapter:73}, q:`A bank runs two compute workloads. The first is a core banking service on EC2 that runs 24/7 at a steady size and will move from m6i to newer instance families over the next three years. The second is an overnight risk batch that checkpoints its progress and can restart. Which TWO purchasing choices minimize cost?`,
    opts:[
      "A Compute Savings Plan for the core banking service",
      "Spot Instances for the overnight risk batch",
      "Three-year Standard Reserved Instances for m6i for the core banking service",
      "On-Demand Instances for the overnight risk batch",
      "Dedicated Hosts for both workloads"
    ],
    correct:[0,1],
    explain:`A Compute Savings Plan discounts steady usage while letting the bank change instance families freely, and Spot gives the steepest discount to a batch that checkpoints and can restart after an interruption. Standard RIs for m6i (C) lock the discount to one configuration that the bank plans to leave. On-Demand batch capacity costs more than Spot, and Dedicated Hosts serve licensing needs.` },

  /* Ch 75 - Cost-Effective Compute Services: Lambda vs Fargate vs EC2 (S4.2.3) */
  { ref:{chapter:75}, q:`An e-commerce site's coupon validation API is called a few hundred times an hour, with short bursts during promotions. It currently runs on two always-on EC2 instances averaging 3 percent CPU, and each request completes in under 200 ms. What is most cost-effective?`,
    opts:[
      "Buy Reserved Instances for the two EC2 instances",
      "Move to larger EC2 instances to absorb the bursts",
      "Run the API on Amazon ECS on EC2 with a minimum of two instances",
      "Rebuild the API on AWS Lambda behind Amazon API Gateway"
    ],
    correct:3,
    explain:`Lambda bills per request and duration, so near-idle hours cost almost nothing and bursts scale automatically. Reserved Instances (A) discount the instances but still pay for capacity that sits at 3 percent CPU. Larger instances or an EC2-backed cluster keep paying for idle capacity.` },

  /* Ch 77 - Selecting an Instance Family for Cost (S4.2.5) */
  { ref:{chapter:77}, q:`An insurer's internal claims portal runs on m6i.large instances that average 4 percent CPU with brief spikes when staff log in each morning. What instance choice most likely lowers cost without hurting users?`,
    opts:[
      "Burstable T instances such as t3 or t4g sized for the baseline",
      "Compute optimized c6i instances",
      "Memory optimized r6i instances",
      "Storage optimized i4i instances"
    ],
    correct:0,
    explain:`Burstable T instances give a low-cost baseline and earn credits to burst, which suits low-average, spiky use. Compute optimized instances (B) give the most CPU per dollar for sustained CPU-bound work, which this portal does not have. Memory and storage optimized families pay for resources the portal does not use.` },

  /* Ch 80 - Cost-Effective Database Services: DynamoDB vs RDS, Serverless vs Provisioned (S4.3.3) */
  { ref:{chapter:80}, q:`A retailer's internal returns-processing tool uses a relational database that is busy for a few hours on weekday mornings and idle the rest of the time. It runs on a provisioned Aurora instance sized for the busy hours. What lowers cost while keeping it relational?`,
    opts:[
      "Buy a three-year reserved DB instance for the current size",
      "Add an Aurora Replica for the morning load",
      "Move the cluster to Aurora Serverless v2 with a low minimum capacity",
      "Migrate the tool to DynamoDB provisioned capacity"
    ],
    correct:2,
    explain:`Aurora Serverless v2 scales capacity up for the morning load and back down when idle, so quiet hours cost little. A reserved DB instance (A) discounts the rate but still pays for busy-hour capacity around the clock. A replica adds an instance, and DynamoDB would mean rewriting a relational tool.` },

  /* Ch 83 - NAT for Cost: One Shared NAT Gateway vs One per AZ vs a NAT Instance (S4.4.1) */
  { ref:{chapter:83}, q:`A retailer's test VPC spans two AZs with a NAT gateway in each. Outbound traffic is light, and the team accepts losing internet access from the test environment during an AZ outage. How can it cut NAT cost with the least effort?`,
    opts:[
      "Remove one NAT gateway and route both AZs' private subnets to the remaining one",
      "Replace both NAT gateways with NAT instances",
      "Add a second NAT gateway in each AZ",
      "Assign public IPv4 addresses to all test instances"
    ],
    correct:0,
    explain:`With light traffic, a gateway's hourly charge outweighs the small cross-AZ transfer, so one shared gateway is cheaper, and the outage risk is accepted. NAT instances (B) remove processing fees but add instances to patch, scale and fail over, which is more effort. Public IPv4 addresses bill hourly and expose the instances.` },

  /* Ch 85 - Routing to Minimize Transfer Costs (S4.4.3) */
  { ref:{chapter:85}, q:`Two VPCs in the same Region, an order-processing VPC and a reporting VPC, exchange 150 TB a month through a Transit Gateway that connects only those two VPCs. The Transit Gateway data processing charge dominates the network bill. What should the architect do?`,
    opts:[
      "Add a NAT gateway between the VPCs",
      "Replace the Transit Gateway with a VPC peering connection",
      "Move the reporting VPC to another Region",
      "Put AWS Global Accelerator between the VPCs"
    ],
    correct:1,
    explain:`VPC peering has no hourly fee or processing charge, so for two VPCs it removes the per-GB Transit Gateway charge entirely. A NAT gateway (A) adds its own processing charge and is for internet egress. Another Region adds inter-Region transfer, and Global Accelerator serves internet users.` },

  /* Ch 86 - CDNs and Edge Caching: Amazon CloudFront vs AWS Global Accelerator (S4.4.4) */
  { ref:{chapter:86}, q:`An online retailer serves product images and videos from an S3 bucket in one Region to shoppers worldwide. The same files are requested millions of times a day, and S3 data transfer out is a large share of the bill. What should it add?`,
    opts:[
      "AWS Global Accelerator in front of the bucket",
      "S3 Cross-Region Replication to every Region",
      "S3 Transfer Acceleration for downloads",
      "An Amazon CloudFront distribution with the bucket as its origin"
    ],
    correct:3,
    explain:`CloudFront serves repeated requests from edge caches, and transfer from S3 to CloudFront is not charged, so origin egress drops sharply. Global Accelerator (A) uses the edge network but caches nothing, so every byte still leaves the origin, plus a per-GB premium. Replicating everywhere multiplies storage, and Transfer Acceleration charges extra for speed.` }
];

    87:["lesson-87-network-optimization-review.html", "Reviewing Existing Workloads for Network Optimizations"],
    88:["lesson-88-throttling-strategy.html", "Selecting a Throttling Strategy"],
    89:["lesson-89-bandwidth-allocation.html", "Bandwidth Allocation: Multiple VPN Tunnels and Direct Connect Speeds"]
  }
};
/* ===== EXAM PAYLOAD - END ===== */
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
