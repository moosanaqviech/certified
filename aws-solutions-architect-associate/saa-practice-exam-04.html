/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Practice Exam 4",
  badge: "AWS Solutions Architect Associate (SAA-C03)",
  blurb: "Scenario-based questions across Unit 4, Design Cost-Optimized Architectures. Most have one best answer; a few ask you to select two.",
  coverage: "Covers Unit 4 (Domain 4): all 27 chapters across Modules 4.1 to 4.4. One question per chapter.",
  minutes: 54,
  pass: 72
};

const QUESTIONS = [

  /* Ch 63 - Cost Visibility: Cost Explorer, AWS Budgets, the Cost and Usage Report, and Cost Allocation Tags (K4.1.2, K4.1.3) */
  { ref:{chapter:63}, q:`A company runs 30 AWS accounts under AWS Organizations. Finance wants each product team's monthly spend broken down by service, and a warning to the team lead whenever that team is forecast to exceed its budget. Every resource already carries a Team tag. What should a solutions architect do?`,
    opts:[
      "Build a dashboard in Amazon CloudWatch from the EstimatedCharges metric",
      "Activate Team as a cost allocation tag, then create AWS Budgets filtered by Team with forecasted-spend alerts",
      "Export the Cost and Usage Report to S3 and have each team query it with Athena every morning",
      "Enable AWS Trusted Advisor cost optimization checks in every account"
    ],
    correct:1,
    explain:`A tag only shows in cost tools once it is activated as a cost allocation tag; Budgets can then filter by it and alert on forecasted spend before it happens. The CUR (C) has the detail but no alerting, so teams would discover overruns after the fact. CloudWatch billing metrics cannot split spend by tag.` },

  /* Ch 64 - Storage Strategies: Batch vs Individual Uploads, and Requester Pays (S4.1.1) */
  { ref:{chapter:64}, q:`A university hosts a 900 TB climate dataset in S3 that research groups in many other AWS accounts download for their own analysis. Download charges now exceed the storage bill, and the university wants the groups to pay for their own access. What should it configure?`,
    opts:[
      "Make the bucket public and enable S3 Transfer Acceleration",
      "Move the dataset to S3 Glacier Deep Archive",
      "Copy the dataset into a bucket in each research group's account every month",
      "Enable Requester Pays on the bucket and require authenticated requests"
    ],
    correct:3,
    explain:`With Requester Pays, the bucket owner still pays storage while each authenticated requester pays the request and download charges. Copying the data into every account (C) shifts download cost but multiplies storage and still incurs the transfer to make each copy. Transfer Acceleration adds cost, and Deep Archive would make downloads take hours.` },

  /* Ch 65 - The Correct Storage Size for a Workload (S4.1.2) */
  { ref:{chapter:65}, q:`A fleet of 200 EC2 instances each has a 1 TiB gp2 data volume holding about 150 GiB. The volumes were sized at 1 TiB only to get 3,000 IOPS. How can the team cut storage cost without losing performance?`,
    opts:[
      "Create smaller gp3 volumes sized for the data plus headroom, which include 3,000 IOPS at any size, and move the data",
      "Change the volumes to st1 Throughput Optimized HDD",
      "Keep gp2 and shrink each volume in place to 200 GiB with Elastic Volumes",
      "Change the volumes to io2 with 3,000 provisioned IOPS"
    ],
    correct:0,
    explain:`gp3 includes 3,000 IOPS regardless of size and costs less per GiB, so a volume sized for the data matches today's performance for a fraction of the price. Option C is tempting, but Elastic Volumes can only grow a volume, never shrink it; a smaller volume means a new volume and a data copy. st1 is poor at random I/O, and io2 charges for every IOPS.` },

  /* Ch 66 - The Lowest Cost Method of Transferring Data to AWS Storage (S4.1.3) */
  { ref:{chapter:66}, q:`A company must move a one-time 2 TB archive of project files from its office into S3. It has a 500 Mbps internet link with spare capacity and two weeks to finish. What is the lowest-cost method?`,
    opts:[
      "Order an AWS Direct Connect connection for the transfer",
      "Use AWS DataSync with a scheduled task every hour",
      "Upload the files over the existing internet link with the AWS CLI using multipart uploads",
      "Use S3 Transfer Acceleration for every upload"
    ],
    correct:2,
    explain:`2 TB moves over 500 Mbps in well under a day, inbound transfer to S3 is free, and the CLI adds only request charges. DataSync (B) works but adds a per-GB fee for scheduling and verification that a one-time copy with plenty of time does not need. Direct Connect takes weeks to provision, and Transfer Acceleration charges extra for speed nobody needs.` },

  /* Ch 67 - When Storage Auto Scaling Is Required (S4.1.4) */
  { ref:{chapter:67}, q:`A SaaS product keeps each customer's data in its own Amazon RDS for MySQL instance. Some tenants grow slowly, others jump suddenly, and two instances ran out of storage last month. Over-allocating every instance for the worst case would double the storage bill. What should the architect do?`,
    opts:[
      "Migrate every tenant to Amazon S3",
      "Enable RDS storage autoscaling on each instance with a maximum storage threshold",
      "Add a read replica to each instance",
      "Schedule a weekly Lambda function that doubles every instance's storage"
    ],
    correct:1,
    explain:`Storage autoscaling grows each instance only when its free space runs low, with the threshold capping how far it can go, so quiet tenants stay small and fast growers never fill up. A weekly job (D) grows every instance whether or not it needs space, and storage cannot be shrunk afterward. Replicas copy the data and add no space to the primary.` },

  /* Ch 68 - S3 Object Lifecycles and Data Lifecycles (S4.1.5, S4.1.9) */
  { ref:{chapter:68}, q:`A versioned S3 bucket stores application exports. Exports are read for 30 days and rarely after, must be kept for one year, and the bucket also holds many abandoned parts from failed multipart uploads. Old versions are never needed after 7 days. Which TWO lifecycle actions reduce cost while meeting the rules?`,
    opts:[
      "Transition current objects to S3 Standard-IA after 30 days and expire them after 365 days",
      "Transition all objects to S3 Glacier Deep Archive on day 1",
      "Expire noncurrent versions 7 days after they become noncurrent, and abort incomplete multipart uploads after a few days",
      "Suspend versioning on the bucket",
      "Move all objects to S3 One Zone-IA immediately"
    ],
    correct:[0,2],
    explain:`Standard-IA after the 30 busy days, then expiry at a year, follows the access pattern and the retention rule; expiring noncurrent versions and aborting incomplete uploads removes storage nobody can see but everyone pays for. Deep Archive on day 1 (B) breaks the first month of reads with restores that take hours. Suspending versioning keeps every version already stored.` },

  /* Ch 69 - Selecting a Backup and Archival Solution (S4.1.6) */
  { ref:{chapter:69}, q:`A company uses AWS Backup for its EBS volumes and DynamoDB tables. Daily backups are kept for 7 years for compliance, but restores are only ever requested for the last 30 days, and the backup storage bill keeps growing. What change cuts cost while keeping the 7-year retention?`,
    opts:[
      "Reduce retention to 30 days",
      "Copy every backup to a second Region",
      "Replace AWS Backup with manual snapshots taken by a script",
      "Add a lifecycle rule in the backup plan that moves backups to cold storage after 30 days, for resource types that support it"
    ],
    correct:3,
    explain:`Cold storage keeps backups for the full retention at a much lower price, and moving them after 30 days leaves recent backups warm for fast restores (cold storage needs at least 90 days, easily met here). Cutting retention (A) breaks the 7-year rule. A second Region doubles the storage, and scripts lose the plan's central retention control.` },

  /* Ch 70 - Hybrid Storage and Migration: AWS Storage Gateway vs DataSync vs Transfer Family (S4.1.7) */
  { ref:{chapter:70}, q:`A logistics firm receives shipping manifests from 300 trading partners, who upload files over SFTP to a server in its data center. The firm wants the files to land in S3 for processing and to stop running the SFTP server, without changing anything for partners. What should it use?`,
    opts:[
      "AWS Transfer Family with an SFTP endpoint that stores files in S3",
      "AWS DataSync from the existing SFTP server to S3 every hour",
      "An S3 File Gateway shared with each partner",
      "Amazon S3 presigned URLs emailed to each partner"
    ],
    correct:0,
    explain:`Transfer Family runs a managed SFTP endpoint that writes straight to S3, so partners keep their SFTP clients and the firm retires its server. DataSync (B) can copy the files into S3 but leaves the on-premises SFTP server in place, which the firm wants gone. A File Gateway is an NFS or SMB share for local apps, not an endpoint for outside partners.` },

  /* Ch 71 - Selecting a Storage Tier: S3 Storage Classes (S4.1.8) */
  { ref:{chapter:71}, q:`A medical imaging archive keeps scans for years. Any scan might be opened in the first week, then a few times a year at most, but when a doctor opens an old scan it must load in milliseconds. Which S3 storage class is most cost-effective for scans older than a week?`,
    opts:[
      "S3 Standard",
      "S3 Glacier Flexible Retrieval",
      "S3 Glacier Instant Retrieval",
      "S3 One Zone-IA"
    ],
    correct:2,
    explain:`Glacier Instant Retrieval suits data read a few times a year that must still return in milliseconds, at a lower storage price than the IA classes. Flexible Retrieval (B) is cheaper to store but restores in minutes to hours, which a doctor waiting on a scan cannot accept. One Zone-IA keeps irreplaceable medical records in a single AZ.` },

  /* Ch 72 - The Most Cost-Effective Storage Service: S3 vs EFS vs FSx vs EBS (S4.1.10) */
  { ref:{chapter:72}, q:`An engineering firm runs a mix of Linux and Windows workstations that must share the same project files over both NFS and SMB, and it wants deduplication and automatic tiering of cold files to cut storage cost. Which service fits?`,
    opts:[
      "Amazon EFS with lifecycle management",
      "Amazon FSx for NetApp ONTAP",
      "Amazon FSx for Lustre",
      "Amazon EBS Multi-Attach volumes"
    ],
    correct:1,
    explain:`FSx for NetApp ONTAP serves the same data over NFS and SMB and adds deduplication, compression and tiering of cold data to a cheaper capacity pool. EFS (A) tiers cold files too, but it speaks NFS only, so the Windows workstations could not use SMB. Lustre is for HPC, and EBS Multi-Attach is block storage, not a shared file service.` },

  /* Ch 73 - EC2 Purchasing Options: On-Demand, Savings Plans, Reserved Instances, and Spot (K4.2.4) */
  { ref:{chapter:73}, q:`A web application's Auto Scaling group never drops below 10 instances, peaks at 40 during business hours, and the stateless web tier tolerates losing an instance. The company expects to run it for three years. Which TWO purchasing choices lower cost most while keeping the service reliable?`,
    opts:[
      "A Savings Plan sized to cover the 10-instance baseline",
      "Spot Instances, across several instance types, for part of the capacity above the baseline",
      "Reserved Instances covering all 40 instances",
      "Dedicated Hosts for the whole group",
      "Spot Instances for the entire group, including the baseline"
    ],
    correct:[0,1],
    explain:`A commitment on the always-running baseline gets the deep discount with no waste, and Spot covers part of the burst cheaply because the stateless tier survives interruptions. Reserving all 40 (C) pays for 30 instances that sit idle every night. An all-Spot group (E) risks losing its baseline capacity when Spot is reclaimed.` },

  /* Ch 74 - Scaling Methods for Elastic Workloads: Horizontal vs Vertical, and EC2 Hibernation (S4.2.2) */
  { ref:{chapter:74}, q:`A QA team's test environment runs an Auto Scaling group of 8 instances around the clock, but tests run only on weekdays from 7:00 to 19:00. How can the team cut the cost of this environment with the least effort?`,
    opts:[
      "Scheduled actions that set the group's capacity to zero each evening and on weekends, and restore it each morning",
      "Replace the 8 instances with 2 larger ones running 24/7",
      "Buy a Compute Savings Plan for all 8 instances",
      "Add a target tracking policy on CPU at 70%"
    ],
    correct:0,
    explain:`Scheduled actions remove the instances when nobody is testing and bring them back before the day starts, so the group runs about 60 of 168 hours a week. A Savings Plan (C) discounts the hourly rate but still pays for every idle hour. Target tracking would never drop below the group's minimum, and fewer, larger instances still run all week.` },

  /* Ch 75 - Cost-Effective Compute Services: Lambda vs Fargate vs EC2 (S4.2.3) */
  { ref:{chapter:75}, q:`A team runs a containerized report generator that is triggered a few times a day. Each run takes 25 to 40 minutes, and nobody wants to manage servers or a cluster of instances. The current EC2 host sits idle more than 90 percent of the time. What is most cost-effective?`,
    opts:[
      "AWS Lambda functions triggered on the same schedule",
      "A larger EC2 instance with a three-year Reserved Instance",
      "Amazon ECS on an EC2 Auto Scaling group with a minimum of two instances",
      "Amazon ECS tasks on AWS Fargate, started on demand for each run"
    ],
    correct:3,
    explain:`Fargate bills only for the vCPU and memory of each task while it runs, with no servers to manage, so idle time costs nothing. Lambda (A) is tempting because it also costs nothing when idle, but a run of 25 to 40 minutes exceeds Lambda's 15-minute limit. An EC2-backed cluster with a minimum of two instances pays for idle capacity all day.` },

  /* Ch 76 - Availability by Workload Class: Production vs Non-Production (S4.2.4) */
  { ref:{chapter:76}, q:`A company copied its production template for a new staging environment: Multi-AZ RDS, NAT gateways in three AZs, and On-Demand instances in three AZs, all running 24/7. Staging is used only by testers during working hours and has no uptime requirement. Which change lowers cost most?`,
    opts:[
      "Buy reserved DB instances for the staging database",
      "Add a second Region to staging for disaster recovery testing",
      "Run staging in a single AZ with single-AZ RDS and one NAT gateway, and stop it outside working hours",
      "Keep the design and switch the instances to a newer generation"
    ],
    correct:2,
    explain:`Staging has no uptime requirement, so it does not need resilience across AZs, and stopping it outside working hours removes most of its running hours. Reserved DB instances (A) lower the rate but commit to a production-sized footprint running all day. A second Region adds cost, and a newer generation saves a little on a design that is still oversized.` },

  /* Ch 77 - Selecting an Instance Family for Cost (S4.2.5) */
  { ref:{chapter:77}, q:`An in-memory caching tier runs on c6i.4xlarge instances. CloudWatch and the CloudWatch agent show memory at 90 percent and CPU at 12 percent, and the team keeps adding instances to get more RAM. Which change lowers cost for the same capacity?`,
    opts:[
      "Move to a memory optimized family such as r6i, which gives more GiB per vCPU",
      "Move to t3 burstable instances",
      "Move to a larger c6i size",
      "Move to storage optimized i4i instances"
    ],
    correct:0,
    explain:`The tier is memory-bound while CPU sits idle, so a memory optimized family supplies the RAM with fewer, cheaper instances instead of buying cores to get memory. A larger c6i (C) adds memory only alongside even more unused CPU. Burstable T instances do not solve a memory shortage, and storage optimized instances pay for local NVMe the cache does not need.` },

  /* Ch 78 - Selecting an Instance Size: Right-Sizing with AWS Compute Optimizer (S4.2.6) */
  { ref:{chapter:78}, q:`A company wants to right-size hundreds of EC2 instances across many accounts, using recommendations based on real utilization, including memory. What should it do?`,
    opts:[
      "Tag every instance and review Cost Explorer's monthly bill by tag",
      "Opt in to AWS Compute Optimizer and install the CloudWatch agent on the instances to publish memory metrics",
      "Enable detailed monitoring on every instance and resize by hand",
      "Buy Savings Plans first, then review sizes next year"
    ],
    correct:1,
    explain:`Compute Optimizer analyzes CloudWatch metrics to recommend instance types and sizes, and it includes memory only when the CloudWatch agent publishes it. Detailed monitoring (C) makes the default metrics more frequent but still contains no memory metric, and resizing hundreds of instances by hand does not scale. Buying commitments before right-sizing locks in waste.` },

  /* Ch 79 - Database Backup and Retention Policies: Snapshot Frequency vs RPO (S4.3.1) */
  { ref:{chapter:79}, q:`An Aurora MySQL cluster has a 5-minute RPO. A cron job also takes a manual snapshot every hour and never deletes them, and after three years snapshot storage is the largest line on the database bill. What should the architect do?`,
    opts:[
      "Increase the manual snapshot frequency to every 5 minutes",
      "Copy all manual snapshots to another Region",
      "Disable automated backups to save storage",
      "Rely on automated backups with point-in-time recovery for the RPO, and delete manual snapshots that no retention policy requires"
    ],
    correct:3,
    explain:`Automated backups with point-in-time recovery already restore to within minutes, so hourly manual snapshots add storage without improving the RPO; deleting the ones no policy needs ends the waste. Snapshots every 5 minutes (A) would multiply the cost to do what PITR already does. Disabling automated backups removes point-in-time recovery altogether.` },

  /* Ch 80 - Cost-Effective Database Services: DynamoDB vs RDS, Serverless vs Provisioned (S4.3.3) */
  { ref:{chapter:80}, q:`A DynamoDB table in on-demand mode serves a steady, predictable load all day, rising each morning and falling each night in the same pattern for the past year. Throughput charges keep climbing. What should the team do?`,
    opts:[
      "Move the table to an RDS instance",
      "Add a DynamoDB global table in a second Region",
      "Switch the table to provisioned capacity with auto scaling",
      "Change the table class to Standard-IA"
    ],
    correct:2,
    explain:`For steady, predictable traffic, provisioned capacity with auto scaling following the daily curve costs less per request than on-demand. Standard-IA (D) cuts storage prices but raises request prices, so it suits tables where storage dominates, not a busy throughput-bound table. A global table adds a second copy to pay for.` },

  /* Ch 81 - Cost-Effective Database Types: Columnar and Time-Series Data (S4.3.4) */
  { ref:{chapter:81}, q:`Analysts run ad hoc queries a few times a week over 40 TB of clickstream history stored as compressed CSV in S3. Each query selects 3 of 60 columns and a date range, and the company does not want to run a warehouse that sits idle between queries. What lowers query cost most?`,
    opts:[
      "Convert the data to Parquet partitioned by date and query it with Amazon Athena",
      "Load the data into a provisioned Amazon Redshift cluster running 24/7",
      "Load the data into an Amazon RDS for PostgreSQL instance",
      "Keep CSV and add more Athena workgroups"
    ],
    correct:0,
    explain:`Parquet is columnar, so Athena reads only the 3 needed columns, and date partitions skip the rest of the history; Athena charges per byte scanned with nothing running between queries. A provisioned Redshift cluster (B) is columnar too but bills around the clock for a few queries a week. A row-based RDS instance scans whole rows.` },

  /* Ch 82 - Migrating Database Schemas and Data with AWS DMS: Homogeneous vs Heterogeneous (S4.3.5) */
  { ref:{chapter:82}, q:`A company is moving a Microsoft SQL Server database with many stored procedures to Amazon Aurora PostgreSQL to remove license costs. The application must keep running until a short cutover. Which approach fits?`,
    opts:[
      "Back up SQL Server and restore the backup into Aurora PostgreSQL",
      "Convert the schema and code with DMS Schema Conversion (or AWS SCT), then migrate with AWS DMS full load and change data capture",
      "Use a DMS homogeneous data migration",
      "Run AWS DMS full load only during a weekend outage"
    ],
    correct:1,
    explain:`Changing engines needs the schema and stored procedures converted to PostgreSQL first, and DMS full load plus CDC keeps the target in sync until a short cutover. A homogeneous migration (C) only works when source and target use the same engine. A SQL Server backup cannot be restored into PostgreSQL, and full load alone means a long outage.` },

  /* Ch 83 - NAT for Cost: One Shared NAT Gateway vs One per AZ vs a NAT Instance (S4.4.1) */
  { ref:{chapter:83}, q:`A production VPC spans three AZs. Private subnets in all three route to a single NAT gateway in AZ a. The bill shows large cross-AZ data transfer on outbound traffic to third-party APIs, and reliability reviews flagged the NAT gateway as a single point of failure. What should the architect do?`,
    opts:[
      "Replace the NAT gateway with a NAT instance in AZ a",
      "Add an S3 gateway endpoint",
      "Move all workloads into AZ a",
      "Create a NAT gateway in each AZ and point each AZ's private route table at its own"
    ],
    correct:3,
    explain:`A NAT gateway per AZ with same-AZ routing removes the cross-AZ transfer and makes each AZ independent, which fixes both findings. An S3 gateway endpoint (B) cuts NAT charges only for S3 traffic, and this traffic goes to third-party APIs. A NAT instance keeps the single point of failure and adds patching, and one AZ for everything removes resilience.` },

  /* Ch 84 - Network Connections for Cost: Direct Connect vs VPN vs Internet (S4.4.2) */
  { ref:{chapter:84}, q:`A company already has a 10 Gbps Direct Connect connection carrying tens of terabytes a month. It wants a backup path in case the circuit fails, at the lowest cost, and can accept lower throughput while the backup is in use. What should it add?`,

      "A second 10 Gbps dedicated connection at the same location",
      "A second 10 Gbps dedicated connection at a different location",
      "An AWS Site-to-Site VPN over the internet as a backup path",
      "AWS Global Accelerator in front of the VPC"
    ],
    correct:2,
    explain:`A Site-to-Site VPN costs a small hourly fee and is billed for data only when traffic fails over to it, which fits a budget backup that can run slower. A second circuit at another location (B) gives the most resilience but pays port-hours on an idle 10 Gbps link all month. Global Accelerator serves internet users, not private on-premises links.` },

  /* Ch 85 - Routing to Minimize Transfer Costs (S4.4.3) */
  { ref:{chapter:85}, q:`A company's application tier and its self-managed Elasticsearch cluster run in different AZs and exchange 100 TB a month. The application also reaches the cluster through the nodes' Elastic IP addresses. Interruptions are acceptable for this internal analytics workload. Which TWO changes reduce data transfer charges?`,

      "Place the application instances in the same AZ as the cluster",
      "Route the traffic through a Transit Gateway",
      "Put AWS Global Accelerator in front of the cluster",
      "Replicate the cluster to a second Region"
    ],
    correct:[0,1],
    explain:`Traffic sent to public or Elastic IPs is billed even inside a Region, and traffic between AZs is billed in both directions, so private IPs in the same AZ make the flow free; the workload accepts the lower resilience. A Transit Gateway (C) adds a per-GB processing charge on top. Global Accelerator and a second Region both add transfer cost.` },

  /* Ch 86 - CDNs and Edge Caching: Amazon CloudFront vs AWS Global Accelerator (S4.4.4) */
  { ref:{chapter:86}, q:`A news site serves articles and images from an Application Load Balancer in one Region to readers worldwide. Most readers request the same popular pages, and the EC2 fleet and data transfer out keep growing. What should the architect add?`,
    opts:[
      "An Amazon CloudFront distribution with the ALB as the origin and caching for the popular content",
      "AWS Global Accelerator in front of the ALB",
      "A larger EC2 instance type for the web fleet",
      "A second ALB in another Region with Route 53 latency records"

    correct:0,
    explain:`CloudFront serves repeated requests from edge caches, so fewer requests reach the fleet, and transfer from AWS origins to CloudFront is not charged. Global Accelerator (B) also uses the edge network, but it caches nothing: every request still hits the ALB, plus a per-GB premium. A second Region doubles the infrastructure without cutting repeat work.` },

  { ref:{chapter:87}, q:`A cost review finds that a usage type ending in NatGateway-Bytes is the largest network charge. The private subnets host batch jobs that read and write Amazon S3 and DynamoDB in the same Region. What is the most effective fix?`,

      "Move the batch jobs to public subnets with public IPv4 addresses",
      "Enable VPC Flow Logs and keep the current design"

    correct:1,
    explain:`NatGateway-Bytes is NAT data processing; gateway endpoints route S3 and DynamoDB traffic around the NAT gateway at no charge. Flow logs (D) help attribute traffic, but the source is already known, and logging alone changes nothing on the bill. NAT instances add management, and public IPv4 addresses bill hourly and expose the jobs.` },

  /* Ch 88 - Selecting a Throttling Strategy (S4.4.6) */
  { ref:{chapter:88}, q:`A public API on API Gateway and Lambda is being hammered by scrapers from a few hundred IP addresses, driving up Lambda and data transfer costs. Legitimate users are spread across many addresses. What is the most cost-effective first control?`,

      "Add more API keys and give one to each scraper",
      "Move the API to EC2 instances behind an ALB",
      "Attach AWS WAF with a rate-based rule that limits requests per IP address"

    explain:`A WAF rate-based rule blocks addresses that exceed the limit before requests reach API Gateway and Lambda, so the abusive traffic stops costing money. Raising reserved concurrency (A) does the opposite: it lets more scraper requests run. API keys identify cooperating clients for usage plans; scrapers will not send them. Moving to EC2 does not stop the traffic.` },

  /* Ch 89 - Bandwidth Allocation: Multiple VPN Tunnels and Direct Connect Speeds (S4.4.7) */

const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
