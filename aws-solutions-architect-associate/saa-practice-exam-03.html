/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Practice Exam 3",
  badge: "AWS Solutions Architect Associate (SAA-C03)",
  blurb: "Scenario-based questions across Unit 3, Design High-Performing Architectures. Most have one best answer; a few ask you to select two.",
  coverage: "Covers Unit 3 (Domain 3): all 22 chapters across Modules 3.1 to 3.5. One question per chapter.",
  minutes: 44,
  pass: 72
};

const QUESTIONS = [

  /* Ch 41 - Storage Configurations for Performance: EBS Volume Types, Instance Store, S3 Throughput, FSx for Lustre (S3.1.1) */
  { ref:{chapter:41}, q:`A log analytics job on EC2 reads 4 TB of large log files sequentially each night and needs about 450 MiB/s of throughput. The data is kept for a month, and cost matters more than random I/O performance. Which EBS volume type fits best?`,
    opts:[
      "io2 Block Express with 20,000 provisioned IOPS",
      "Throughput Optimized HDD (st1)",
      "Cold HDD (sc1)",
      "gp3 at its baseline settings"
    ],
    correct:1,
    explain:`st1 is built for large sequential reads at up to 500 MiB/s at a lower price per GiB than SSD. sc1 (C) is cheaper still but tops out at 250 MiB/s, below the requirement. gp3's baseline is 125 MiB/s, and io2 pays for IOPS this streaming workload does not need.` },

  /* Ch 42 - Storage That Scales: Object vs File vs Block (S3.1.2) */
  { ref:{chapter:42}, q:`A media company's mobile app lets millions of users upload photos, and the photos are served over HTTPS to any device. Storage needs are expected to grow from 50 TB to several petabytes, and nobody wants to plan capacity. Which storage fits?`,
    opts:[
      "Amazon EFS Regional file system mounted on the web servers",
      "Amazon EBS gp3 volumes, resized as they fill",
      "Amazon FSx for Lustre linked to an archive",
      "Amazon S3"
    ],
    correct:3,
    explain:`S3 stores a virtually unlimited number of objects accessed over HTTPS by any client, with no capacity to provision. EFS (A) also grows automatically, but it is a file system mounted by servers, so every photo request would pass through instances and NFS. EBS volumes cap at 64 TiB and attach to one instance.` },

  /* Ch 43 - Decoupling So Components Scale Independently (S3.2.1) */
  { ref:{chapter:43}, q:`An image processing tier pulls jobs from an Amazon SQS queue. Each job takes about 2 seconds, and the business accepts a wait of at most 60 seconds. The team wants the worker Auto Scaling group to grow and shrink with the work waiting. What should it configure?`,
    opts:[
      "Target tracking on a backlog-per-instance metric with a target of 30 messages",
      "Target tracking on average CPU utilization at 50%",
      "A step scaling policy on the queue's total ApproximateNumberOfMessages",
      "A scheduled action that doubles capacity during business hours"
    ],
    correct:0,
    explain:`Backlog per instance (messages waiting divided by running instances) tracks the work each worker owns, and the target is the acceptable wait divided by the processing time: 60 / 2 = 30. Total queue depth (C) ignores how many workers already run, so the same backlog triggers the same change whether there are 2 or 20 instances. CPU does not reflect waiting jobs.` },

  /* Ch 44 - Scaling Metrics and Conditions: EC2 Auto Scaling Policies (S3.2.2) */
  { ref:{chapter:44}, q:`A booking site's traffic rises steeply every weekday morning in a pattern that repeats week after week. Each new instance needs 8 minutes to warm its cache before it can serve, so users see slow pages during the morning ramp. Which TWO changes address this?`,
    opts:[
      "Add a predictive scaling policy alongside the existing target tracking policy",
      "Replace target tracking with simple scaling and a 300-second cooldown",
      "Configure a warm pool of pre-initialized instances for the Auto Scaling group",
      "Lower the maximum capacity of the group",
      "Switch the instances to a burstable T family"
    ],
    correct:[0,2],
    explain:`Predictive scaling learns the weekly pattern and launches capacity before the ramp, and a warm pool keeps instances already initialized so they join in seconds instead of 8 minutes. Simple scaling (B) is still reactive and waits out a cooldown after each step, so it would make the ramp slower, not faster.` },

  /* Ch 45 - Compute Options and Features: EC2 Instance Types for Performance (S3.2.3) */
  { ref:{chapter:45}, q:`A financial modeling application runs on t3.xlarge instances. It performs well for the first hour of each batch, then slows sharply for the rest of the run while CPU utilization drops to a fixed low level. The instances use standard credit mode. What is the best fix?`,
    opts:[
      "Move to larger T instances in standard mode",
      "Add more EBS throughput to the instances",
      "Move to a compute optimized (C) family sized for sustained CPU",
      "Place the instances in a spread placement group"
    ],
    correct:2,
    explain:`The pattern is a burstable instance running out of CPU credits and dropping to its baseline. Sustained CPU-heavy work belongs on a non-burstable family, and C instances give the most CPU per dollar. Larger T instances (A) earn credits faster but still throttle under sustained load. Placement groups do not add CPU.` },

  /* Ch 46 - Resource Type and Size: Lambda Memory and Fargate Task Size (S3.2.4) */
  { ref:{chapter:46}, q:`A Lambda function that compresses uploaded files is configured with 256 MB of memory and takes 12 seconds per run. Its logs show peak memory use of 140 MB. The team wants faster runs without paying much more. What should it do first?`,
    opts:[
      "Reduce memory to 160 MB, since the function only uses 140 MB",
      "Increase memory and measure duration, for example with the AWS Lambda Power Tuning tool",
      "Raise the function timeout to 15 minutes",
      "Enable provisioned concurrency"
    ],
    correct:1,
    explain:`Lambda allocates CPU in proportion to memory, so a CPU-bound compression job gets faster with more memory, and the shorter duration can offset the higher per-millisecond rate. Option A is tempting because memory use looks low, but cutting memory also cuts CPU and slows the function further. Provisioned concurrency only removes cold starts.` },

  /* Ch 47 - Configuring Read Replicas (S3.3.1) */
  { ref:{chapter:47}, q:`An RDS for MySQL database serves a product catalog to users in North America. A new storefront in Europe needs low-latency reads of the same catalog, and the company also wants a copy it can promote if the primary Region fails. What should a solutions architect configure?`,
    opts:[
      "A Multi-AZ standby in the primary Region",
      "A second read replica in the primary Region",
      "Daily snapshots copied to a European Region",
      "A cross-Region read replica in a European Region"
    ],
    correct:3,
    explain:`A cross-Region read replica serves European reads locally and can be promoted to a standalone primary if the original Region fails. A Multi-AZ standby (A) protects against an AZ failure, but in an instance deployment it serves no reads and stays in the same Region. Daily snapshots would be stale and slow to restore.` },

  /* Ch 48 - Designing Database Architectures (S3.3.2) */
  { ref:{chapter:48}, q:`A serverless API uses Lambda functions that each open a connection to an Aurora PostgreSQL cluster. During traffic spikes the database rejects new connections, even though its CPU and memory stay moderate. Which change fixes this with the least application rework?`,
    opts:[
      "Put Amazon RDS Proxy between the functions and the cluster",
      "Add two Aurora Replicas to the cluster",
      "Move the cluster to a larger instance class",
      "Set reserved concurrency on every function to 1"
    ],
    correct:0,
    explain:`RDS Proxy pools and reuses database connections, so thousands of short-lived invocations share a small set and bursts are queued instead of rejected. A larger instance class (C) raises the connection limit, but it pays for compute the database does not need and still breaks at the next spike. Replicas add read capacity, not connection pooling for writes.` },

  /* Ch 49 - Choosing an Engine: MySQL vs PostgreSQL, Amazon RDS vs Amazon Aurora (S3.3.3 = S4.3.2) */
  { ref:{chapter:49}, q:`A company runs a Microsoft SQL Server database for a packaged application whose vendor supports only SQL Server. It wants AWS to handle patching, backups and Multi-AZ failover, with no changes to the application. Which option fits?`,
    opts:[
      "Amazon Aurora PostgreSQL-Compatible Edition",
      "Amazon Aurora MySQL-Compatible Edition",
      "Amazon RDS for SQL Server in a Multi-AZ deployment",
      "Amazon DynamoDB with a migration layer"
    ],
    correct:2,
    explain:`The application must keep speaking SQL Server, and RDS runs SQL Server as a managed engine with Multi-AZ. Aurora (A and B) only offers MySQL- and PostgreSQL-compatible editions, so the vendor's supported engine would be gone.` },

  /* Ch 50 - Choosing a Database Type: Relational, Key-Value, Document, Graph, Wide-Column, In-Memory, Warehouse (S3.3.4) */
  { ref:{chapter:50}, q:`A company is designing two new systems. The first is a gaming leaderboard and session store that needs microsecond reads and must not lose data if a node fails. The second must answer questions like "which customers bought the same products as this customer's friends" across a social network in milliseconds. Which TWO services fit these systems?`,
    opts:[
      "Amazon MemoryDB for the leaderboard and session store",
      "Amazon Redshift for the leaderboard and session store",
      "Amazon Keyspaces for the social network queries",
      "Amazon Neptune for the social network queries",
      "Amazon ElastiCache with Memcached for the leaderboard and session store"
    ],
    correct:[0,3],
    explain:`MemoryDB is a durable in-memory database (Valkey and Redis OSS compatible) with a Multi-AZ transaction log, so it gives microsecond reads without losing data on a node failure. Neptune is a graph database built to traverse relationships such as friends and purchases. Memcached (E) is fast, but it has no replication or persistence, so a node failure loses the data.` },

  /* Ch 51 - Integrating Caching: ElastiCache Lazy Loading vs Write-Through, and DAX (S3.3.5) */
  { ref:{chapter:51}, q:`A DynamoDB table backs a product page that receives millions of reads per minute. Reads take single-digit milliseconds, but the business now wants microsecond reads with minimal code change, and slightly stale data is acceptable. What should the architect add?`,
    opts:[
      "DynamoDB Accelerator (DAX) in front of the table",
      "An ElastiCache for Memcached cluster with lazy loading code in the application",
      "A DynamoDB global table in a second Region",
      "Strongly consistent reads on every request"
    ],
    correct:0,
    explain:`DAX is an in-memory cache that speaks the DynamoDB API, so the app swaps its client and eventually consistent reads drop to microseconds. ElastiCache (B) could also cache the items, but the team would have to write and maintain the caching logic. Global tables add Regions, not microsecond reads, and strongly consistent reads bypass caches.` },

  /* Ch 52 - Network Topology: VPC Peering vs Transit Gateway vs PrivateLink (S3.4.1) */
  { ref:{chapter:52}, q:`Three VPCs (A, B and C) in one account are connected by peering: A to B and B to C. Applications in VPC A cannot reach a database in VPC C. The company expects to add about 20 more VPCs and a VPN to its data center next year. What should a solutions architect recommend?`,
    opts:[
      "Enable transitive routing on the existing peering connections",
      "Create a transit gateway, attach all VPCs and the VPN, and manage routing in its route tables",
      "Expose the database in VPC C through a Gateway Load Balancer",
      "Add a NAT gateway in VPC B to forward traffic from A to C"
    ],
    correct:1,
    explain:`VPC peering is never transitive, and a transit gateway is the hub that routes between all attached VPCs and the VPN as the network grows. Option A is tempting, but peering has no transitive setting to turn on. A NAT gateway in B does not route between peered VPCs, and a Gateway Load Balancer is for inline appliances.` },

  /* Ch 53 - Network Configurations That Scale: CIDR Planning, IPv6, and Subnet Sizing (S3.4.2) */
  { ref:{chapter:53}, q:`A company is creating 15 new VPCs across several accounts. It plans to connect them to each other and to its data center, which uses 10.0.0.0/8 in places, and wants address assignment tracked centrally so no two networks overlap. What should it use?`,
    opts:[
      "The default 172.31.0.0/16 range for every VPC",
      "The same 10.0.0.0/16 range in each VPC, separated by different accounts",
      "Secondary CIDRs added later to fix any conflicts",
      "Amazon VPC IP Address Manager (IPAM) allocating unique ranges from a planned pool"
    ],
    correct:3,
    explain:`IPAM plans and tracks IP space across accounts and allocates each VPC a unique block, so peering and Transit Gateway routing keep working as networks connect. Reusing one range (B) breaks routing between any VPCs that share it, and separate accounts do not help. Secondary CIDRs cannot fix an overlapping primary range.` },

  /* Ch 54 - Placing Resources: Placement Groups, Local Zones, AWS Wavelength, AWS Outposts (S3.4.3) */
  { ref:{chapter:54}, q:`A mobile game studio wants a real-time multiplayer feature with the lowest possible latency for players on 5G phones in several cities. The game servers run on EC2 and should keep using the company's VPC. Where should the servers run?`,
    opts:[
      "In a cluster placement group in the nearest Region",
      "On AWS Outposts racks at the studio's office",
      "In AWS Wavelength Zones on the carriers' 5G networks",
      "Behind Amazon CloudFront in the nearest Region"
    ],
    correct:2,
    explain:`Wavelength places EC2 inside carriers' 5G networks, so traffic from phones reaches the game servers without leaving the carrier network, and a Wavelength Zone extends the company's VPC. Outposts (B) puts compute in the company's own building, which is close to the office, not to players spread across cities.` },

  /* Ch 55 - Load Balancing Strategy: ALB vs NLB vs GWLB (S3.4.4 = S4.2.1) */
  { ref:{chapter:55}, q:`A security team must route all inbound and outbound traffic for 30 VPCs through a fleet of third-party firewall appliances, and the fleet must scale and stay highly available without each VPC managing its own appliances. Which load balancing option fits?`,
    opts:[
      "An Application Load Balancer with path-based rules",
      "A Gateway Load Balancer with Gateway Load Balancer endpoints in each VPC",
      "A Network Load Balancer with one Elastic IP per AZ",
      "Route 53 weighted records pointing at the appliances"
    ],
    correct:1,

const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
