<script>
/* ============================================================
   ▼▼▼  LESSON PAYLOAD — BEGIN  ▼▼▼
   Unit 4 · Module 4.3 · Chapter 80 · Cost-Effective Database Services:
   DynamoDB vs RDS, Serverless vs Provisioned (trade-off)
   Objective S4.3.3 (cost-effective database services) with K4.3.3
   (caching strategies), K4.3.5 (capacity planning, capacity units),
   K4.3.8 (read replicas) and K4.3.9 (database types and services). This
   is the home of DynamoDB capacity units. Database types by access
   pattern are Chapter 50; caching for performance is Chapter 51.
   Shape: cover, shared ground (step build), DynamoDB on-demand, DynamoDB
   provisioned with auto scaling, provisioned RDS and Aurora with
   commitments, Aurora Serverless v2, cheaper than a bigger instance,
   comparison table (step build), decision signals, quiz (on-demand for a
   new, unpredictable table), quiz (Aurora Serverless v2 for a database
   idle most of the day), recap. 12 cards, two quizzes, correct letters A
   and C.
   Sources (all checked 26 Oct 2026):
   docs.aws.amazon.com/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html
   (pay per request, no idle capacity; on-demand is the default and
   recommended mode);
   docs.aws.amazon.com/amazondynamodb/latest/developerguide/provisioned-capacity-mode.html
   (one RCU is one strongly consistent or two eventually consistent reads
   per second of an item up to 4 KB; one WCU is one write per second of up
   to 1 KB; auto scaling through Application Auto Scaling with a target
   utilization; reserved capacity);
   docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.TableClasses.html
   (Standard-IA table class for tables where storage dominates cost);
   docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithReservedDBInstances.html
   (one or three-year reserved DB instances, a billing discount tied to
   instance type and Region);
   docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html
   (Database Savings Plans up to 35 percent across Aurora, RDS, DynamoDB,
   ElastiCache and more, including serverless usage);
   docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.html
   and aurora-serverless-v2.how-it-works.html (the docs now title it
   "Aurora serverless"; an ACU is about 2 GiB of memory with CPU and
   networking; scales in half-ACU steps; recent versions scale to 0 ACUs
   with automatic pause and resume; charged for capacity consumed). The
   course says "Aurora Serverless v2", as Chapter 48 does.
   Palette note: aquamarine accent; --ok is amber.
   Cover animates (a request-rate line spikes; an on-demand bar follows it
   exactly while a provisioned bar holds a flat line with a gap of unused
   capacity shaded). Step builds on cards 1 and 7.
   ============================================================ */

/* ----------  NAV  ---------- */
const NAV = {
  catalog:   "index.html",
  next:      "lesson-81-cost-effective-database-types.html",
  nextLabel: "Next chapter"
};

/* ----------  ART  (custom SVGs, referenced from cards as ${A.name})  ---------- */
const A = {
  cover: `<svg viewBox="0 0 320 200">
    <defs>
      <radialGradient id="c80r" cx="0.5" cy="0.5" r="0.6">
        <stop offset="0" style="stop-color:rgba(76,240,202,0.16)"/>
        <stop offset="1" style="stop-color:rgba(76,240,202,0)"/>
      </radialGradient>
    </defs>
    <style>
      .c80use { transform-box: fill-box; transform-origin: bottom; animation: c80load 5s ease-in-out infinite; }
      @keyframes c80load { 0%, 20% { transform: scaleY(0.2); } 45% { transform: scaleY(1); } 70%, 100% { transform: scaleY(0.2); } }
      @media (prefers-reduced-motion: reduce) {
        .c80use { animation: none; }
      }
    </style>
    <ellipse cx="160" cy="100" rx="155" ry="92" fill="url(#c80r)"/>
    <g font-family="Hanken Grotesk" text-anchor="middle">
      <path d="M40 150 L280 150" stroke="var(--line)"/>
      <rect class="c80use" x="70" y="50" width="60" height="100" rx="6" fill="var(--accent)" opacity="0.85"/>
      <text x="100" y="166" fill="var(--accent)" font-size="9" font-weight="700">on-demand</text>
      <text x="100" y="178" fill="var(--ink-faint)" font-size="7.5">pays for what it uses</text>
      <rect x="190" y="70" width="60" height="80" rx="6" fill="var(--surface-2)" stroke="var(--sky)" stroke-dasharray="4 3"/>
      <rect class="c80use" x="190" y="50" width="60" height="100" rx="6" fill="var(--sky)" opacity="0.5"/>
      <text x="220" y="166" fill="var(--sky)" font-size="9" font-weight="700">provisioned</text>
      <text x="220" y="178" fill="var(--ink-faint)" font-size="7.5">pays for the box</text>
      <text x="160" y="196" fill="var(--ink-soft)" font-size="9.5">Spiky load wastes a fixed box; steady load fills it.</text>
    </g>
  </svg>`,

  done: `<svg viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="38" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <path d="M28 43 l9 9 l19 -20" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`
};

/* ----------  CARDS  ---------- */
const cards = [

  /* 0: cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 4 · Module 4.3 · Chapter 80</div>
    <h1 class="reveal" style="font-size:31px">Cost-effective database services</h1>
    <p class="lead reveal">Whether the database is DynamoDB or RDS, the cost question is the same one as for compute: pay per request for spiky or unknown load, or buy capacity in bulk when load is steady.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1: shared ground, step build */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">Shared ground</div>
    <h2 class="reveal" style="font-size:25px">Three questions first</h2>
    <div class="pills">
      <div class="pill" style="pointer-events:none" data-step="1"><p><b>Data model</b>Key-value access at any scale points to DynamoDB; joins, transactions across tables and SQL reporting point to RDS or Aurora (Chapter 50).</p></div>
      <div class="pill" style="pointer-events:none" data-step="2"><p><b>Traffic shape</b>Unknown, spiky or idle for hours favors per-request or serverless; steady and predictable favors provisioned capacity.</p></div>
      <div class="pill" style="pointer-events:none" data-step="3"><p><b>Commitment</b>A steady baseline for a year or more can be discounted further.</p></div>
    </div>
    <div class="stepcaps" style="margin-top:8px">
      <p class="lead" data-step="0" style="pointer-events:none;font-size:14px">The model picks the service; the traffic picks the mode. Tap through.</p>
    </div>` },

  /* 2: DynamoDB on-demand */
  { html: `
    <div class="eyebrow reveal">Option 1 · DynamoDB on-demand</div>
    <h2 class="reveal" style="font-size:25px">Pay per request</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>How it bills</b>Per read and write request; no capacity to plan and nothing paid for idle time.</p></div>
      <div class="pill"><p><b>Pick it for</b>New tables, unpredictable or spiky traffic, and tables idle much of the day. It is the default and AWS's recommended mode.</p></div>
      <div class="pill"><p><b>Watch</b>At steady high throughput, provisioned capacity usually costs less per request.</p></div>
    </div>` },

  /* 3: DynamoDB provisioned */
  { html: `
    <div class="eyebrow reveal">Option 2 · DynamoDB provisioned</div>
    <h2 class="reveal" style="font-size:25px">Capacity units</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>RCU and WCU</b>One RCU is one strongly consistent (or two eventually consistent) reads per second of up to 4 KB. One WCU is one write per second of up to 1 KB.</p></div>
      <div class="pill"><p><b>Auto scaling</b>Set minimum, maximum and a target utilization; capacity follows the daily curve.</p></div>
      <div class="pill"><p><b>Pick it for</b>Predictable traffic. Eventually consistent reads halve read cost; reserved capacity cuts it further.</p></div>

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ----------
   v2 adds opt-in, per-card step builds on top of the v1 card engine. A card
   with no `steps` field takes exactly the v1 paths below and renders and
   behaves identically; every v2 branch is guarded by `steps` being present. */
const ENGINE_VERSION = 'v2';
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};
const stepState = {};   // v2: current revealed step per card index (mirrors `answered`)

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

/* v2: apply step visibility for one card WITHOUT touching its .in class, so a
   step reveal never replays the card-entrance .reveal stagger. Cumulative for
   normal elements (data-step <= current). Captions append by default: inside
   .stepcaps they accumulate too (data-step="0" is the pre-first-tap caption),
   and captions behind the current step get .step-past (dimmed) while the
   current one stays at full strength. A .stepcap-swap container (or legacy
   .stepcap) opts into swap: only the caption whose data-step equals the
   current step is shown. */
function applySteps(idx) {
  const cur = stepState[idx] || 0;
  els[idx].querySelectorAll('[data-step]').forEach(function(nd) {
    const s = parseInt(nd.getAttribute('data-step'), 10);
    const swapCap = nd.closest && nd.closest('.stepcap-swap, .stepcap');
    const appendCap = !swapCap && nd.closest && nd.closest('.stepcaps');
    const on = swapCap ? (s === cur) : appendCap ? (s <= cur) : (s >= 1 && s <= cur);
    nd.classList.toggle('step-on', on);
    nd.classList.toggle('step-past', !!appendCap && on && s < cur);
  });
}

/* Card layout: the only place that adds/removes .in (and thus replays reveal).
   Called on card change, never on a step advance. */
function layout() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
    applySteps(idx);   // persists built state on revisit
  });
  glow.style.background = cards[i].glow || 'transparent';
}

/* Footer/button state only. Safe to call after a step advance (no reveal). */
function updateFooter() {
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  const total = c.steps || 0;
  const stepsLeft = total > 0 && (stepState[i] || 0) < total;
  if (stepsLeft) { nextBtn.disabled = false; nextBtn.textContent = (i === 0) ? 'Begin lesson' : 'Continue'; }
  else if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
}

function render() {
  layout();
  updateFooter();
  if (cards[i].quiz) wireQuiz(els[i], i);
}

/* v2: reveal the next step of the current card. Returns true if a step was
   consumed (so the caller does not also advance the card). */
function advanceStep(idx) {
  const total = cards[idx].steps || 0;
  if (!total) return false;
  const cur = stepState[idx] || 0;
  if (cur >= total) return false;
  stepState[idx] = cur + 1;
  applySteps(idx);
  updateFooter();
  return true;
}

/* v2: reveal every remaining step at once (swipe-left escape hatch). */
function skipSteps(idx) {
  const total = cards[idx].steps || 0;
  if (!total || (stepState[idx] || 0) >= total) return false;
  stepState[idx] = total;
  applySteps(idx);
  updateFooter();
  return true;
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

/* Primary action. On a step card mid-build this reveals the next step; once
   the steps are done (or on a card with none) it advances, honoring the quiz
   gate exactly as v1 did. Shared by the Continue button and ArrowRight. */
function handleNext() {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  if (advanceStep(i)) return;
  go(i + 1);
}
nextBtn.onclick = handleNext;
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* v2: tapping anywhere on a step card advances one step; once built, a tap
   advances the card (gate permitting). Cards with no steps ignore taps, so
   this listener is inert on v1-style cards. Elements with their own behavior
   (quiz choices, links) are skipped so a tap never double-fires. */
vp.addEventListener('click', e => {
  const c = cards[i];
  if (!c.steps) return;
  if (e.target.closest('.choice, a')) return;
  if ((stepState[i] || 0) < c.steps) { advanceStep(i); return; }
  if (!nextBtn.disabled && !c.last) go(i + 1);
});

/* Keys and swipes only move between cards (or, for a step card, between
   steps). Leaving the lesson always takes a deliberate tap, so a stray swipe
   on the final card cannot navigate away. ArrowRight mirrors the Continue
   button step-wise; ArrowLeft mirrors Back. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) handleNext();
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  // Swipe left: skip any remaining steps and advance in one gesture, honoring
  // the quiz gate (updateFooter re-derives nextBtn.disabled after the skip).
  if (dx < -50 && !cards[i].last) { skipSteps(i); if (!nextBtn.disabled) go(i + 1); }
  if (dx > 50 && i > 0) go(i - 1);
});

render();

/* Back to quiz (additive). A "Review: Chapter N" link in a quiz explanation
   opens this lesson with ?back=<quiz path>, plus &tab=1 when it opened in a
   new tab. Only then a small bar above the progress segments offers the way
   back: closing the tab returns to the untouched quiz tab, otherwise it goes
   to the quiz path, which restores the session. No param, no change. */
(function () {
  let back = null, tab = false;
  try {
    const p = new URLSearchParams(location.search), b = p.get('back');
    tab = p.get('tab') === '1';
    if (b && b.charAt(0) === '/' && b.charAt(1) !== '/' && b.charAt(1) !== '\\') {
      const u = new URL(b, location.href);
      if (u.origin === location.origin) back = u.pathname + u.search;
    }
  } catch (e) { return; }
  if (!back) return;
  const bar = document.createElement('div');
  bar.style.cssText = 'position:relative;z-index:7;padding:14px 20px 0;';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = '← Back to quiz';
  btn.style.cssText = 'font:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--surface-2,rgba(255,255,255,0.06));border:1px solid var(--line,rgba(255,255,255,0.1));border-radius:999px;padding:7px 14px;cursor:pointer;';
  btn.onclick = () => {
    if (tab) { try { window.close(); } catch (e) {} setTimeout(() => { location.href = back; }, 300); }
    else location.href = back;
  };
  bar.appendChild(btn);
  const tb = document.getElementById('topbar');
  tb.parentNode.insertBefore(bar, tb);
})();
</script>
