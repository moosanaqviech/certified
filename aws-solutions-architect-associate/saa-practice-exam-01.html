/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Practice Exam 1",
  badge: "AWS Solutions Architect Associate (SAA-C03)",
  blurb: "Scenario-based questions across Unit 1, Design Secure Architectures. Most have one best answer; a few ask you to select two.",
  coverage: "Covers Unit 1 (Domain 1): all 23 chapters across Modules 1.1, 1.2, and 1.3. One question per chapter.",
  minutes: 46,
  pass: 72
};

const QUESTIONS = [

  /* Ch 01 - Global Infrastructure and the Shared Responsibility Model (K1.1.3, K1.1.5) */
  { ref:{chapter:1}, q:`A company moves a PostgreSQL database from a self-managed EC2 instance to Amazon RDS for PostgreSQL. Under the shared responsibility model, which task remains the company's after the move?`,
    opts:[
      "Patching the host operating system that runs the database engine",
      "Controlling network access through security groups and managing database user accounts",
      "Physically securing the data center where the database storage lives",
      "Replacing failed storage hardware underneath the DB instance"
    ],
    correct:1,
    explain:`RDS is a managed service: AWS runs and patches the host and engine and owns the hardware and facilities, while the customer still decides who can reach the database and who can log in to it. Patching the host OS (A) was the company's job on EC2, but on RDS it moves below the line to AWS; the customer only picks the maintenance window.` },

  /* Ch 02 - Root User and IAM Users (S1.1.1) */
  { ref:{chapter:2}, q:`An audit of a standalone AWS account finds that the root user has access keys used by a nightly script, a single MFA device on one employee's phone, and that employee's personal address as the root email. Which set of changes follows AWS root user best practices?`,
    opts:[
      "Rotate the root access keys monthly and store them in AWS Secrets Manager",
      "Keep the root keys but attach a permissions boundary that limits root to the script's actions",
      "Enforce MFA for all IAM users and leave the root user unchanged, since it is rarely used",
      "Delete the root keys, move the script to an IAM role, use a business group email, and add a second MFA device held by someone else"
    ],
    correct:3,
    explain:`AWS says the root user should have no access keys, workloads should use roles, the root email should be a business-managed group address, and more than one MFA device should be registered, ideally split across people. Rotating and vaulting the keys (A) still leaves a permanent full-access credential in a script, and no policy or boundary (B) can restrict the root user.` },

  /* Ch 03 - Authorization Model and Policy Evaluation (S1.1.2) */
  { ref:{chapter:3}, q:`A user belongs to two groups. The Developers group policy allows <code>s3:*</code> on all buckets. The Contractors group policy explicitly denies <code>s3:DeleteObject</code> on the <code>prod-data</code> bucket. The user also has a permissions boundary allowing <code>s3:*</code> and <code>ec2:*</code>. What can the user do?`,
    opts:[
      "Deleting objects in prod-data is denied, and terminating EC2 instances is denied because no identity-based policy allows it",
      "Deleting objects in prod-data is allowed, because the broader Developers allow takes precedence",
      "Terminating EC2 instances is allowed, because the permissions boundary includes ec2:*",
      "Both actions are allowed until the permissions boundary is removed"
    ],
    correct:0,
    explain:`An explicit deny in any applicable policy wins, so the Contractors statement blocks the delete regardless of the Developers allow. A permissions boundary only caps what identity-based policies grant and never grants anything itself (C), so with no identity policy allowing ec2 actions, EC2 termination stays implicitly denied.` },

  /* Ch 04 - Role-Based Access with AWS STS (S1.1.3) */
  { ref:{chapter:4}, q:`A CI job uses its role in account A to assume a deployment role in account B, then uses that session to assume a migration role in account C. The migration runs for 3 hours. The AssumeRole call into account C with <code>DurationSeconds</code> of 10800 fails, although the role in C allows 12-hour sessions. Why?`,
    opts:[
      "The trust policy in account C is missing an external ID condition",
      "A trust policy cannot name a role that is itself an assumed-role session",
      "Role chaining limits the chained session to a maximum of one hour",
      "AssumeRole cannot cross more than one account boundary per job"
    ],
    correct:2,
    explain:`Assuming a role with credentials from another assumed role is role chaining, and AWS caps that session at one hour regardless of the role's maximum session duration; requesting longer makes the call fail. An external ID (A) protects third-party access against the confused deputy problem and is unrelated to session length.` },

  /* Ch 05 - Multi-Account Security Strategy (S1.1.4, K1.1.1) */
  { ref:{chapter:5}, q:`A company is building a new organization that will grow to 30 accounts. No account may use Regions other than eu-west-1 and eu-central-1, and every new account must arrive with CloudTrail and AWS Config enabled and a check that flags public S3 buckets. Which TWO actions meet these requirements with the least operational overhead?`,
    opts:[
      "Set up an AWS Control Tower landing zone and create new accounts through Account Factory",
      "Attach an IAM policy that denies other Regions to every user and role in each account",
      "Enable only consolidated billing and set AWS Budgets alerts for each Region",
      "Enable the Region deny control, a preventive control enforced with an SCP, on the organization's OUs",
      "Run a scheduled Lambda function that deletes resources launched in other Regions"
    ],
    correct:[0,3],
    explain:`Control Tower builds the landing zone with CloudTrail, Config and detective controls such as the public S3 bucket check, and Account Factory enrolls each new account automatically. A preventive control backed by an SCP blocks every principal in every member account from unapproved Regions, including users created later. Per-user IAM policies (B) must be maintained in every account and miss new identities, which is exactly the overhead SCPs remove.` },

  /* Ch 06 - Resource-Based vs Identity-Based Policies (S1.1.5) */
  { ref:{chapter:6}, q:`A Lambda function in account A must be invoked by an Amazon EventBridge rule in account A and by an application role in account B. The team does not want to create any new IAM roles. What should the architect configure?`,
    opts:[
      "A new role in account A that EventBridge and the account B application both assume before invoking",
      "Function policy statements allowing the EventBridge rule (by aws:SourceArn) and the account B role, plus an identity policy on the B role allowing lambda:InvokeFunction",
      "Only an identity policy on the account B role that allows lambda:InvokeFunction on the function ARN",
      "A service control policy that allows lambda:InvokeFunction across both accounts"
    ],
    correct:1,
    explain:`A Lambda resource-based policy is how a service or another account is allowed to invoke a function, and cross-account access also needs the caller's own identity policy to allow the action, so both sides agree. An identity policy in account B alone (C) cannot grant access to account A's function, and a new shared role (A) breaks the requirement and adds a role switch for no benefit.` },

  /* Ch 07 - Federating a Directory (S1.1.6, K1.1.2) */
  { ref:{chapter:7}, q:`A company runs Microsoft Active Directory on premises and is moving Windows workloads to AWS. New EC2 Windows servers must apply Group Policy and authenticate users even when the VPN to the data center is down, and on-premises users must keep using their existing accounts. Which option fits?`,
    opts:[
      "AD Connector pointed at the on-premises domain controllers",
      "IAM Identity Center with its built-in Identity Center directory",
      "IAM SAML 2.0 federation from the on-premises AD FS server",
      "AWS Managed Microsoft AD in the VPC with a trust to the on-premises forest"
    ],
    correct:3,
    explain:`AWS Managed Microsoft AD runs real domain controllers in two AZs of the VPC, so domain-joined servers keep authenticating and applying Group Policy without the data center link, while a trust lets on-premises users use their existing accounts. AD Connector (A) is a proxy that stores nothing in AWS, so every authentication fails when the VPN is down.` },

  /* Ch 08 - Network Segmentation (S1.2.2) */
  { ref:{chapter:8}, q:`A team creates a /28 subnet in each of two AZs for a fleet of VPC-attached Lambda functions that needs at least 14 network interfaces per subnet. Deployments fail with errors about insufficient IP addresses. What is the cause?`,
    opts:[
      "AWS reserves five addresses in every subnet, so each /28 offers only 11 usable addresses",
      "/28 is smaller than the minimum subnet size a VPC allows",
      "A subnet must span both AZs, so the two /28 blocks are counted as one",
      "VPC-attached Lambda functions require IPv6-only subnets"
    ],
    correct:0,
    explain:`A /28 holds 16 addresses and AWS reserves the first four and the last one in every subnet, leaving 11, which is below the 14 the fleet needs. /28 is in fact the smallest subnet size AWS permits (B), so it is valid; it is simply too small here, and a subnet always lives in exactly one AZ.` },

  /* Ch 09 - Routing and Egress (S1.2.1) */
  { ref:{chapter:9}, q:`A VPC has a zonal NAT gateway in each of three AZs, but every private subnet's route table sends 0.0.0.0/0 to the NAT gateway in AZ a. An outage in AZ a cut outbound internet access for instances in AZs b and c. What should the architect change?`,
    opts:[
      "Attach a second internet gateway to the VPC for redundancy",
      "Move each NAT gateway into a private subnet so it survives an AZ failure",
      "Give each AZ's private subnets a route table that points at the NAT gateway in the same AZ",
      "Route the private subnets' 0.0.0.0/0 directly to the internet gateway"
    ],
    correct:2,
    explain:`A zonal NAT gateway lives in one AZ, so the resilient pattern is one NAT gateway per AZ with each AZ's private route table pointing at its own (a regional NAT gateway is the newer alternative). A VPC can have only one internet gateway (A), and routing private subnets straight to it (D) would make them public subnets.` },

  /* Ch 10 - Security Groups vs Network ACLs (S1.2.1, K1.2.3) */
  { ref:{chapter:10}, q:`Web servers sit in a subnet whose network ACL allows inbound TCP 443 from 0.0.0.0/0 and outbound TCP 443 to 0.0.0.0/0, with nothing else allowed. The security group allows inbound 443. Clients can open connections but never receive responses. What is the cause?`,
    opts:[
      "The security group needs an outbound rule allowing return traffic to clients",
      "The network ACL is stateless, so it needs an outbound rule for the clients' ephemeral port range",
      "The network ACL rules must be numbered in descending order to be evaluated",
      "The subnet route table is missing a route for return traffic"
    ],
    correct:1,
    explain:`Responses go back to the client's ephemeral port (for example 1024 to 65535), not to 443, and a stateless network ACL evaluates that return traffic against its outbound rules, where nothing allows it. Security groups are stateful (A), so return traffic for an allowed inbound connection is permitted automatically without any outbound rule.` },

  /* Ch 11 - VPC Endpoints (K1.2.2) */
  { ref:{chapter:11}, q:`Lambda functions in private subnets with no NAT gateway must read a database password from AWS Secrets Manager and write items to Amazon DynamoDB, without traffic crossing the internet. Which design is the most cost-effective?`,
    opts:[
      "Gateway endpoints for both Secrets Manager and DynamoDB",
      "A NAT gateway in a public subnet for both services",
      "Interface endpoints for both Secrets Manager and DynamoDB",
      "An interface endpoint for Secrets Manager and a gateway endpoint for DynamoDB"
    ],
    correct:3,
    explain:`Gateway endpoints exist only for S3 and DynamoDB and cost nothing, so DynamoDB should use one, while Secrets Manager is reached privately through an interface endpoint (PrivateLink). Interface endpoints for both (C) would work but add hourly and per-GB charges for DynamoDB that the free gateway endpoint avoids, and option A fails because Secrets Manager has no gateway endpoint.` },

  /* Ch 12 - Perimeter Protection (S1.2.3, K1.2.6) */
  { ref:{chapter:12}, q:`A media site runs on Amazon CloudFront in front of an Application Load Balancer. It suffers HTTP request floods from rotating IP addresses, and the company wants AWS DDoS specialists available during attacks and credits for scaling charges caused by DDoS. Which TWO actions meet these needs?`,
    opts:[
      "Add AWS WAF rate-based rules to a web ACL on the CloudFront distribution",
      "Deploy AWS Network Firewall in the VPC that hosts the ALB",
      "Subscribe to AWS Shield Advanced and protect the distribution and the ALB",
      "Enable Amazon GuardDuty in the account",
      "Restrict the ALB security group to known client IP ranges"
    ],
    correct:[0,2],
    explain:`AWS WAF rate-based rules throttle the layer 7 floods at the edge, and Shield Advanced adds access to the Shield Response Team plus cost protection for DDoS-driven scaling, which Shield Standard does not offer. Network Firewall (B) inspects VPC traffic at the packet level and sits behind CloudFront, so it cannot absorb an edge HTTP flood, and GuardDuty detects threats but blocks nothing.` },

  /* Ch 13 - Secrets Manager vs Parameter Store (S1.2.3, K1.2.1) */
  { ref:{chapter:13}, q:`A Lambda function in account A needs a third-party API key that is owned by account B and must be rotated every 60 days by a custom rotation function. Which approach fits?`,
    opts:[
      "Store it in AWS Secrets Manager in account B with 60-day rotation, a resource policy for the account A role, and a customer managed KMS key whose policy allows that role",
      "Store it as an advanced SecureString parameter in Parameter Store and rely on Parameter Store's built-in 60-day rotation",
      "Store it as a standard SecureString parameter and share it with account A through a resource policy",
      "Store it in an encrypted Lambda environment variable and redeploy the function every 60 days"
    ],
    correct:0,
    explain:`Secrets Manager provides scheduled rotation through a rotation function and cross-account access through a resource policy, with a customer managed key so the other account can decrypt. Parameter Store (B) has no built-in rotation, so someone would have to build and run the schedule, and standard parameters cannot be shared across accounts at all (C).` },

  /* Ch 14 - Amazon Cognito (K1.2.4, K1.2.5) */
  { ref:{chapter:14}, q:`A customer portal runs on EC2 behind an Application Load Balancer. Every page must require customers to sign in first, and the team wants no authentication code in the application. What should the architect do?`,
    opts:[
      "Create a Cognito identity pool and attach it to the ALB's target group",
      "Put Amazon API Gateway in front of the ALB with a Cognito user pool authorizer",
      "Create a Cognito user pool and add an authenticate-cognito action to the ALB's HTTPS listener rule",
      "Create an IAM user for each customer and require console sign-in"
    ],
    correct:2,
    explain:`An ALB HTTPS listener can authenticate users against a Cognito user pool before forwarding, so the application receives only signed-in requests and contains no sign-in code. An identity pool (A) exchanges tokens for AWS credentials and does not sign users in to a web app, and adding API Gateway (B) introduces a new tier just to do what the ALB already supports.` },

  /* Ch 15 - Threat Detection and Posture (K1.2.5) */
  { ref:{chapter:15}, q:`A security team needs continuous scanning of its EC2 instances and the container images in Amazon ECR for known software vulnerabilities, with findings prioritized by whether the affected resource is reachable from the network. Which service meets this need?`,
    opts:[
      "Amazon GuardDuty",
      "Amazon Macie",
      "Amazon Detective",
      "Amazon Inspector"
    ],
    correct:3,
    explain:`Amazon Inspector continuously scans EC2 instances, ECR images and Lambda functions for software vulnerabilities and network exposure and scores findings accordingly. GuardDuty (A) is the tempting pick because it is also a security detector, but it looks for active threats in logs and activity, not for vulnerable packages.` },

  /* Ch 16 - Securing External Connections (S1.2.4) */
  { ref:{chapter:16}, q:`A company connects its data center to AWS with a single AWS Direct Connect connection. It wants a backup path that can be set up quickly and costs little, accepting lower and less predictable performance while the backup is in use. What should the architect add?`,
    opts:[
      "AWS Client VPN endpoints for the data center's servers",
      "An AWS Site-to-Site VPN connection over the internet as the backup path",
      "A second dedicated Direct Connect connection at the same location",
      "An Amazon CloudFront distribution in front of the VPC"
    ],
    correct:1,
    explain:`Site-to-Site VPN runs IPsec over the existing internet link, is set up in minutes and is inexpensive, which makes it the standard low-cost backup for Direct Connect. A second dedicated connection (C) gives better resilience and performance but costs far more and takes longer to provision, and Client VPN is for individual users, not networks.` },

  /* Ch 17 - Meeting Compliance Requirements (S1.3.1, K1.3.1) */
  { ref:{chapter:17}, q:`Yesterday someone deleted the bucket policy on a production S3 bucket. The security team must find out which IAM identity made the change and from which IP address, as quickly as possible. Where should they look?`,
    opts:[
      "AWS CloudTrail event history, which records management events such as DeleteBucketPolicy",
      "AWS Config's configuration timeline for the bucket",
      "Amazon Macie findings for the bucket",
      "AWS Artifact compliance reports for the account"
    ],
    correct:0,
    explain:`CloudTrail records API calls, including who made each call and the source IP, and its event history keeps 90 days of management events at no charge. AWS Config (B) shows that the bucket's configuration changed and when, but the identity and source IP of the caller come from CloudTrail.` },

  /* Ch 18 - Encrypting Data at Rest with AWS KMS (S1.3.2, K1.3.4) */
  { ref:{chapter:18}, q:`An existing unencrypted Amazon EBS volume is attached to a production EC2 instance. Policy now requires it to be encrypted with a customer managed KMS key. How can the architect achieve this?`,
    opts:[
      "Turn on encryption for the existing volume in the EBS console",
      "Enable EBS encryption by default for the account and Region",
      "Snapshot the volume, copy the snapshot with encryption using the key, create a new volume from it, and swap it in",
      "Apply SSE-KMS to the volume with the customer managed key"
    ],
    correct:2,
    explain:`An existing unencrypted volume cannot be encrypted in place; the documented path is an encrypted snapshot copy and a new volume created from it. Encryption by default (B) only applies to volumes created after it is turned on, so the existing volume stays unencrypted, and SSE-KMS is an S3 setting, not an EBS one.` },

  /* Ch 19 - Encrypting Data in Transit (S1.3.3) */
  { ref:{chapter:19}, q:`A website is served through Amazon CloudFront. Visitors who type http:// must be moved to HTTPS automatically, and a separate S3 bucket that partners read directly must reject any request not sent over TLS. What should the architect configure?`,
    opts:[
      "Set the viewer protocol policy to redirect HTTP to HTTPS, and add a bucket policy that denies requests when aws:SecureTransport is false",
      "Request the CloudFront certificate in the same Region as the partner bucket, and enable default encryption on the bucket",
      "Put a Network Load Balancer with a TLS listener in front of the bucket",
      "Add an AWS WAF rule that blocks port 80 on the distribution, and enable SSE-KMS on the bucket"
    ],
    correct:0,
    explain:`CloudFront's viewer protocol policy can redirect HTTP to HTTPS, and a bucket policy deny conditioned on aws:SecureTransport being false rejects plain-HTTP requests to S3. Default encryption (B) protects data at rest, not in transit, and CloudFront certificates must be requested in us-east-1, not the bucket's Region.` },

  /* Ch 20 - Access Policies for Encryption Keys (S1.3.4) */
  { ref:{chapter:20}, q:`A platform team must be able to manage a customer managed KMS key (edit its policy, enable or disable it, schedule its deletion) but must never be able to decrypt data protected by it. How should access be granted?`,
    opts:[
      "Switch the data to an AWS managed key, which administrators cannot use to decrypt",
      "Attach AdministratorAccess to the platform role, since IAM administrators cannot use KMS keys to decrypt",
      "Create a grant that gives the platform role administrative operations on the key",
      "In the key policy, give the platform role the key administrator actions but none of the cryptographic actions such as kms:Decrypt"
    ],
    correct:3,
    explain:`KMS separates key administrators from key users in the key policy: administrators can manage and delete the key without being allowed to encrypt or decrypt. Grants (C) can only allow cryptographic operations and a few grant-related ones, not administration such as scheduling deletion, and AdministratorAccess (B) does include kms:Decrypt wherever the key policy enables IAM policies.` },

  /* Ch 21 - Backups and Replication (S1.3.5, K1.3.2) */
  { ref:{chapter:21}, q:`After a ransomware scare, a company requires daily backups of its RDS databases and EFS file systems, stored in a second Region, that nobody in the production account can delete, including its administrators and root user. Which TWO actions meet these requirements?`,
    opts:[
      "Enable versioning on the database and file system volumes",
      "Create an AWS Backup plan with a daily rule that copies recovery points to a vault in another Region in a separate backup account in the same organization",
      "Apply AWS Backup Vault Lock in governance mode to the production vault",
      "Apply AWS Backup Vault Lock in compliance mode to the destination vault",
      "Schedule a Lambda function that snapshots each resource nightly"
    ],
    correct:[1,3],
    explain:`AWS Backup copy rules can send recovery points to another Region and another account in the same organization, moving them outside the production account's control, and Vault Lock in compliance mode stops anyone, root included, from deleting them before retention ends. Governance mode (C) can be removed by principals with the right IAM permissions, so a compromised administrator could still delete the backups.` },

  /* Ch 22 - Data Access, Lifecycle, and Protection Policies (S1.3.6, K1.3.3) */
  { ref:{chapter:22}, q:`A team wants objects in an S3 bucket to be recoverable after accidental deletion or overwrite, and wants any permanent deletion of an object version to require an MFA code. Which configuration meets this?`,
    opts:[
      "Enable S3 Object Lock in compliance mode with a one-year retention period",
      "Enable versioning, then have the root user enable MFA delete on the bucket",
      "Turn on all four Block Public Access settings for the bucket",
      "Configure S3 Replication to a second bucket in another Region"
    ],
    correct:1,
    explain:`Versioning turns deletes into delete markers and overwrites into new versions, and MFA delete, which only the root user can enable, requires an MFA code to permanently delete a version or change versioning. Object Lock compliance mode (A) prevents deletion entirely for the retention period, which is stricter than asked and blocks legitimate cleanup.` },

  /* Ch 23 - Rotating Encryption Keys and Renewing Certificates (S1.3.7) */
  { ref:{chapter:23}, q:`A company uses a customer managed KMS key whose key material it imported from its own HSM. Policy now requires new key material every year, and applications must keep using the same key ID. What should the architect do?`,
    opts:[
      "Enable automatic key rotation on the key with a 365-day period",
      "Create a new KMS key each year and repoint the application's alias at it",
      "Import new key material each year and perform an on-demand rotation of the key",
      "Request a new certificate from AWS Certificate Manager each year"
    ],
    correct:2,
    explain:`Automatic rotation is not supported for keys with imported material, but on-demand rotation is, so the company imports new material and rotates while keeping the same key ID, with old material retained to decrypt older data. Creating a new key behind an alias (B) also changes the material, but it gives applications a new key ID and leaves data encrypted under the old key to manage separately, which the requirement rules out.` }

];

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
