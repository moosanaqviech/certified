<script>

/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Full Mock Exam 3",
  badge: "AWS Solutions Architect Associate (SAA-C03)",
  blurb: "A full-length practice exam across all four SAA-C03 domains. Most questions have one best answer; a few ask you to select two.",
  coverage: "Mirrors the real exam shape: 65 questions sampled at the official domain weights, 20 Design Secure Architectures, 17 Design Resilient Architectures, 15 Design High-Performing Architectures and 13 Design Cost-Optimized Architectures, with their own logistics, gaming and public sector scenarios.",
  minutes: 130,
  pass: 72
};

const QUESTIONS = [

  /* Ch 01 - AWS Global Infrastructure and the Shared Responsibility Model (K1.1.3, K1.1.5) */
  { ref:{chapter:1}, q:`A game studio moves its player profiles from a self-managed database on EC2 to Amazon DynamoDB. Under the shared responsibility model, which task remains the studio's responsibility after the move?`,
    opts:[
      "Patching the operating system of the servers that run DynamoDB",
      "Writing the IAM policies that control which roles can read the table, and choosing its encryption key",
      "Securing the physical data centers that host the table",
      "Replacing failed disks in the storage fleet behind the table"
    ],
    correct:1,
    explain:`For a managed service like DynamoDB, AWS runs the servers, storage and facilities, while the customer keeps responsibility for its data, who can access it and how it is encrypted. Patching the operating system (A) was the studio's job on EC2, but with DynamoDB AWS patches the hosts. Physical security and disk replacement are inherited controls.` },

  /* Ch 02 - Locking Down the Root User and IAM Users: MFA, Access Keys, Least Privilege (S1.1.1) */
  { ref:{chapter:2}, q:`A state agency runs 25 member accounts in AWS Organizations. An audit asks it to reduce the risk from root user credentials across all member accounts with the least ongoing effort, while still being able to perform the rare root-only tasks. What should it do?`,
    opts:[
      "Buy a hardware MFA device for each of the 25 member root users",
      "Rotate every member account's root password every month",
      "Attach an SCP that denies all actions to the root user in member accounts and keep the credentials",
      "Enable centralized root access, remove root credentials from member accounts, and run root-only tasks from the management account"
    ],
    correct:3,
    explain:`With centralized root access, member accounts have no root password, keys or MFA to protect, and the management account performs privileged root tasks centrally. An SCP (C) does restrict member root users, but the credentials still exist and must be secured, so the risk and the effort remain. 25 MFA devices and monthly rotations are the high-effort path.` },

  /* Ch 03 - A Flexible Authorization Model: Users, Groups, Roles, Policies, and How AWS Evaluates Them (S1.1.2) */
  { ref:{chapter:3}, q:`An education platform lets its developers create IAM roles for their own Lambda functions. Security requires that no role a developer creates can ever have more permissions than a company-approved boundary policy. What should the platform team configure?`,
    opts:[
      "Allow iam:CreateRole only with a condition that requires the company boundary as the new role's permissions boundary",
      "Give developers AdministratorAccess and review CloudTrail weekly",
      "Attach an SCP that allows all IAM actions",
      "Ask developers to add the boundary's statements as an inline policy on each role"
    ],
    correct:0,
    explain:`A permissions boundary caps what a role's identity policies can grant, and a condition on iam:CreateRole (iam:PermissionsBoundary) forces every new role to carry it, which is the delegation pattern. Weekly CloudTrail review (B) only finds over-privileged roles after the fact. Inline copies of the statements grant permissions rather than limiting them.` },

  /* Ch 04 - Role-Based Access with AWS STS: Role Switching and Cross-Account Access (S1.1.3) */
  { ref:{chapter:4}, q:`A fleet telematics vendor assumes IAM roles in hundreds of customer accounts to read vehicle data from S3. One customer worries that another customer could give the vendor that customer's role ARN and trick the vendor into reading its data. What should the customer require in its role?`,
    opts:[
      "Create an IAM user with access keys for the vendor instead of a role",
      "Share the account's root credentials with the vendor's support team",
      "A trust policy that allows the vendor's account only with an sts:ExternalId condition set to an ID unique to this customer",
      "A bucket policy that grants the vendor account's root principal full access"
    ],
    correct:2,
    explain:`This is the confused deputy problem: requiring a unique external ID in the trust policy means the vendor can assume the role only when acting for this customer. IAM user access keys (A) are long-term credentials that can leak and do nothing to stop the confusion. Granting the vendor's whole account in a bucket policy widens access instead of narrowing it.` },

  /* Ch 06 - Resource-Based Policies vs Identity-Based Policies (S1.1.5) */
  { ref:{chapter:6}, q:`A county's open data bucket lives in account A. An analytics role in account B must read objects from that one bucket while keeping its own identity, without assuming a role in account A. What is required?`,
    opts:[
      "Only an identity policy in account B that names the bucket",
      "Only a bucket policy in account A that names the role; nothing in account B",
      "A bucket policy in account A that allows the role, plus an identity policy in account B that allows s3:GetObject on the bucket",
      "Turn off Block Public Access and make the bucket public"
    ],
    correct:2,
    explain:`Across accounts both sides must allow: the bucket policy lets the role in, and the role's own identity policy must allow the action. An identity policy alone (A) can speak only for its own account, so the bucket in account A ignores it. A bucket policy alone does not work either, because the caller is an identity in another account, not an AWS service.` },

  /* Ch 07 - Federating a Directory: IAM Identity Center vs IAM SAML Federation vs AWS Directory Service (S1.1.6) */
  { ref:{chapter:7}, q:`A school district runs 12 AWS accounts in AWS Organizations. Staff identities live in Microsoft Entra ID, and the district wants one sign-in portal for all accounts with the least administration. Separately, new Windows servers on EC2 must join the district's existing on-premises Active Directory domain, with no directory data stored in AWS. Which TWO should the architect use?`,
    opts:[
      "An IAM user for every staff member in each account",
      "IAM Identity Center with Microsoft Entra ID as the identity source",
      "IAM SAML federation configured separately in each of the 12 accounts",
      "An Amazon Cognito user pool for staff sign-in",
      "AD Connector to join the EC2 instances to the existing domain"
    ],
    correct:[1,4],
    explain:`Identity Center connects the external IdP once and turns permission sets into roles in every account, and AD Connector proxies requests to the on-premises directory so instances join it without copying directory data into AWS. Per-account SAML federation (C) works but repeats the IdP setup, roles and certificate rotation 12 times. Cognito is for application customers, not staff.` },

  /* Ch 08 - Network Segmentation: Public Subnets, Private Subnets, and Subnet Tiers (S1.2.2) */
  { ref:{chapter:8}, q:`A county is building a property records application with an Application Load Balancer, application servers and a database. Only the load balancer may be reachable from the internet, and every tier must survive an AZ failure. Which subnet design fits?`,
    opts:[
      "The ALB in public subnets in two AZs; the application servers and database in private subnets in the same two AZs",
      "All three tiers in public subnets in two AZs, protected by security groups",
      "All three tiers in the default VPC's subnets",
      "The ALB in a private subnet, and the servers and database in public subnets"
    ],
    correct:0,
    explain:`Private subnets have no route to the internet gateway, so the application and database tiers cannot be reached from the internet, and spreading each tier over two AZs survives an AZ loss. Public subnets with security groups (B) rely on a single control and give instances an internet path. Every default VPC subnet is public.` },

  /* Ch 09 - Routing and Egress: Route Tables, Internet Gateways, and NAT Gateways (S1.2.1) */
  { ref:{chapter:9}, q:`IoT gateway instances run in a dual-stack private subnet. They must send IPv6 traffic out to a device management service on the internet, and nothing on the internet may open IPv6 connections to them. What should the subnet's route table send ::/0 to?`,
    opts:[
      "A NAT gateway in a public subnet",
      "An egress-only internet gateway",
      "The VPC's internet gateway",
      "A gateway VPC endpoint"
    ],
    correct:1,
    explain:`An egress-only internet gateway allows outbound IPv6 connections and their replies but blocks connections started from the internet. A NAT gateway (A) is the outbound-only answer for IPv4, not for IPv6 addresses that are already globally routable. The internet gateway would allow inbound IPv6 too, and gateway endpoints serve only S3 and DynamoDB.` },

  /* Ch 10 - Security Groups vs Network ACLs (S1.2.1, K1.2.3) */
  { ref:{chapter:10}, q:`A logistics company's security team finds an attack coming from one known IP address range. It must stop that range from reaching any instance in a public subnet, whatever security groups the instances use. What should it configure?`,
    opts:[
      "A deny rule for the range in each security group",
      "Remove all inbound rules from the security groups",
      "A blackhole route for the range in the subnet's route table",
      "An inbound deny rule for the range in the subnet's network ACL, numbered before the allow rules"
    ],
    correct:3,
    explain:`Network ACLs support deny rules, are evaluated in number order and apply to every instance in the subnet, so one low-numbered deny blocks the range. Security groups (A) have allow rules only and cannot deny a range. Removing all inbound rules would cut off legitimate users, and route tables decide where traffic goes, not whether it is allowed.` },

  /* Ch 11 - VPC Endpoints: Gateway Endpoints vs Interface Endpoints (AWS PrivateLink) (K1.2.2) */
  { ref:{chapter:11}, q:`Amazon ECS tasks run in private subnets with no NAT gateway or internet gateway, and they fail to start because they cannot pull their images from Amazon ECR. What should the architect add so the tasks can pull images privately?`,
    opts:[
      "Only an S3 gateway endpoint",
      "A NAT instance in a private subnet",
      "A VPC peering connection to the ECR service",
      "Interface endpoints for the ECR API and ECR Docker registry, plus an S3 gateway endpoint for the image layers"
    ],
    correct:3,
    explain:`ECR's API and registry are reached through interface endpoints, and the image layers are stored in S3, so the tasks also need the S3 gateway endpoint. An S3 gateway endpoint alone (A) covers the layers but not the ECR calls that start each pull. A NAT instance in a private subnet has no internet path, and AWS services are not peered.` },

  /* Ch 13 - Application Secrets: AWS Secrets Manager vs Systems Manager Parameter Store (S1.2.3) */
  { ref:{chapter:13}, q:`A game backend needs dozens of feature flags and endpoint settings organized per environment, with no rotation and at the lowest cost. It also needs a database password that must rotate automatically every 30 days. Where should each be stored?`,
    opts:[
      "Both in AWS Secrets Manager",
      "Both in Parameter Store SecureString parameters, with a custom rotation script for the password",
      "Feature flags in Parameter Store standard parameters, and the password in Secrets Manager with automatic rotation",
      "Both as plain environment variables in the task definition"
    ],
    correct:2,
    explain:`Standard parameters are free and suit hierarchical configuration, while Secrets Manager has built-in scheduled rotation for database credentials. Putting everything in Secrets Manager (A) works but pays a per-secret charge for flags that never rotate. Parameter Store has no built-in rotation, and plain environment variables expose the password.` },

  /* Ch 14 - Securing Application Sign-In with Amazon Cognito: User Pools and Identity Pools (K1.2.4, K1.2.5) */
  { ref:{chapter:14}, q:`A mobile game lets players sign in with a username and password or with their Google account. After sign-in, the app must upload each player's screenshots directly to S3, under a prefix only that player can write to. What should the architect use?`,
    opts:[
      "An IAM user for each player",
      "A Cognito user pool federated with Google, and a Cognito identity pool that exchanges the tokens for temporary credentials scoped to the player's prefix",
      "IAM Identity Center with a permission set for players",
      "Access keys embedded in the app, with a bucket policy limiting uploads"
    ],
    correct:1,
    explain:`The user pool signs players in, natively or through Google, and the identity pool swaps the token for temporary AWS credentials through a role that can be scoped per player. IAM users (A) do not scale to millions of players and mean long-term credentials. Identity Center is for workforce users, and embedded keys can be extracted from the app.` },

  /* Ch 15 - Threat Detection and Posture: GuardDuty, Macie, Inspector, Security Hub, Detective (K1.2.5) */
  { ref:{chapter:15}, q:`A state transportation department wants to be alerted when compromised credentials make unusual API calls or instances start talking to crypto-mining hosts. It also needs to find which of its 400 S3 buckets contain citizens' personal data. Which TWO services meet these needs?`,
    opts:[
      "Amazon GuardDuty",
      "Amazon Inspector",
      "Amazon Macie",
      "AWS Trusted Advisor",
      "AWS Artifact"
    ],
    correct:[0,2],
    explain:`GuardDuty analyzes logs and activity to flag active threats such as anomalous API calls and mining traffic, and Macie discovers sensitive data such as personal information in S3. Inspector (B) is tempting because it is also a security scanner, but it finds software vulnerabilities in EC2, images and Lambda, not threats in progress. Artifact holds AWS's compliance reports.` },

  /* Ch 16 - Securing External Connections: Site-to-Site VPN, Client VPN, and Direct Connect (S1.2.4) */
  { ref:{chapter:16}, q:`Two manufacturing plants must connect their networks to 20 VPCs within a week. Traffic is light and must be encrypted, and each plant has an internet link and an IPsec-capable router. Which design fits?`,
    opts:[
      "A Site-to-Site VPN connection from each plant to a transit gateway attached to the 20 VPCs",
      "AWS Client VPN with a client on every plant workstation",
      "A Direct Connect connection to each plant",
      "VPC peering connections from each VPC to the plants"
    ],
    correct:0,
    explain:`Site-to-Site VPN joins a whole network over IPsec in minutes, and terminating it on a transit gateway gives both plants one attachment that reaches all 20 VPCs. Direct Connect (C) gives consistent bandwidth but takes weeks to provision and is not encrypted by default. Client VPN connects individual users, and peering connects VPCs, not offices.` },

  /* Ch 17 - Meeting Compliance Requirements: AWS Config, CloudTrail, AWS Artifact, and Macie (S1.3.1) */
  { ref:{chapter:17}, q:`An auditor reviewing a public university's cloud program asks for evidence that the AWS data centers hosting its workloads are covered by independent SOC and ISO audits. Where should the university get this evidence?`,
    opts:[
      "AWS Artifact",
      "An AWS Config conformance pack",
      "AWS CloudTrail Lake",
      "Amazon Macie"
    ],
    correct:0,
    explain:`AWS Artifact provides on-demand downloads of AWS's own compliance reports and certifications, which is the evidence for controls AWS operates. A Config conformance pack (B) evaluates the university's own resource configurations, not AWS's data centers. CloudTrail records API activity, and Macie finds sensitive data.` },

  /* Ch 18 - Encrypting Data at Rest with AWS KMS (S1.3.2) */
  { ref:{chapter:18}, q:`A logistics company writes millions of small shipment records each day to an S3 bucket encrypted with SSE-KMS and a customer managed key. KMS request charges have grown sharply, and some uploads are being throttled. What change addresses both with the least effort?`,
    opts:[
      "Switch the bucket to SSE-C with keys held by the application",
      "Move the key into AWS CloudHSM",
      "Create a separate KMS key for each object prefix",
      "Enable S3 Bucket Keys on the bucket"
    ],
    correct:3,
    explain:`An S3 Bucket Key generates a bucket-level key from the KMS key, so S3 calls KMS far less often, cutting request cost and throttling while keeping the customer managed key. SSE-C (A) removes KMS calls but makes the application handle and send keys with every request. CloudHSM and more keys add work without reducing calls.` },

  /* Ch 19 - Encrypting Data in Transit: AWS Certificate Manager and TLS (S1.3.3) */
  { ref:{chapter:19}, q:`A game publisher serves its website through Amazon CloudFront in front of an ALB in eu-west-1. The team requested and validated an ACM certificate for www.example.com in eu-west-1, but it does not appear when they edit the CloudFront distribution. What should they do?`,
    opts:[
      "Export the certificate's private key and upload it to the distribution",
      "Serve HTTP between viewers and CloudFront until the certificate appears",
      "Request and DNS-validate a certificate for the domain in us-east-1, and attach it to the distribution",
      "Copy the existing certificate to us-east-1 with ACM"
    ],
    correct:2,
    explain:`CloudFront uses certificates from US East (N. Virginia) only, so a certificate must be requested or imported there; DNS validation then lets ACM renew it automatically. ACM certificates cannot be copied between Regions (D), so a second request is the way. Serving HTTP drops encryption, and integrated certificates are not handled by exporting keys.` },

  /* Ch 20 - Access Policies for Encryption Keys: KMS Key Policies and Grants (S1.3.4) */
  { ref:{chapter:20}, q:`Objects in a bucket in account A are encrypted with a customer managed KMS key in account A. A role in account B is allowed by the bucket policy to read them, but every GetObject call fails with an access denied error from KMS. What fixes it?`,
    opts:[
      "Add an IAM policy in account A that allows the role to decrypt",
      "Add a statement to the key policy in account A that allows the role in account B to use kms:Decrypt, and allow kms:Decrypt on the key in the role's IAM policy",
      "Re-encrypt the objects with the AWS managed key aws/s3",
      "Turn off encryption on the bucket"
    ],
    correct:1,
    explain:`Cross-account use of a KMS key needs the key policy to allow the other account's principal and that principal's own IAM policy to allow the action. An IAM policy in account A (A) cannot grant permissions to an identity in account B. AWS managed keys cannot be shared across accounts at all, and dropping encryption breaks the security requirement.` },

  /* Ch 21 - Implementing Backups and Replication: AWS Backup, Cross-Region and Cross-Account Copies, S3 Replication (S1.3.5) */
  { ref:{chapter:21}, q:`A game studio enabled S3 Cross-Region Replication from its asset bucket to a bucket in another Region. New uploads now appear in the destination, but the two years of assets that already existed are missing there. How should the team copy them?`,
    opts:[
      "Suspend and re-enable versioning on the source bucket",
      "Run S3 Batch Replication for the existing objects",
      "Enable S3 Replication Time Control",
      "Add a lifecycle rule to the destination bucket"
    ],
    correct:1,
    explain:`Replication rules apply to new objects only; S3 Batch Replication replicates objects that existed before the rule, using the same configuration. Replication Time Control (C) is tempting because it is a replication feature, but it only sets a 15-minute target for new objects. Toggling versioning and lifecycle rules copy nothing.` },

  /* Ch 22 - Data Access, Lifecycle, and Protection Policies: Block Public Access, Object Ownership, Versioning, Object Lock (S1.3.6) */
  { ref:{chapter:22}, q:`A school district must keep student records in S3 for seven years, and no one, including administrators and the root user, may delete or overwrite them before then. What should the district configure?`,
    opts:[
      "Versioning with MFA delete",
      "S3 Object Lock in governance mode with a seven-year default retention",
      "S3 Object Lock in compliance mode with a seven-year default retention",
      "A lifecycle rule that expires objects after seven years"
    ],
    correct:2,
    explain:`Compliance mode retention cannot be shortened or removed by anyone, including the root user, until it expires. Governance mode (B) is tempting because it also locks objects, but users with the bypass permission can still delete them. MFA delete only adds a step to permanent deletion, and a lifecycle rule deletes data rather than protecting it.` },

  /* Ch 24 - Architecture Styles: Multi-Tier vs Microservices vs Event-Driven (S2.1.1) */
  { ref:{chapter:24}, q:`A logistics platform is one large application. The route optimization feature needs far more compute than the rest, separate teams want to release their features independently, and a bug in billing must not take down shipment tracking. Which architecture style fits?`,
    opts:[
      "Keep the single application and move it to a larger instance",
      "A three-tier application with one shared database for every feature",
      "A single application deployed to several Regions",
      "Microservices, each with its own API and data, owned and deployed by separate teams"
    ],
    correct:3,
    explain:`Microservices let each feature deploy, scale and fail on its own, which matches independent teams, a compute-hungry optimizer and fault isolation. A three-tier design (B) separates layers, not features, so every team still ships one unit and shares one database. A larger instance or more Regions keeps the features coupled.` },

  /* Ch 25 - Scaling Strategies: Out vs Up, and Designing Stateless Components (S2.1.2) */
  { ref:{chapter:25}, q:`A licensing server for a ministry's desktop software runs on one EC2 instance. It keeps all state in memory, cannot be modified or clustered, and the vendor licenses it per server. It now runs out of memory at peak. What is the appropriate scaling approach?`,
    opts:[
      "Move it to a larger instance type with more memory during a maintenance window",
      "Put it in an Auto Scaling group of four instances behind an ALB",
      "Enable sticky sessions on a load balancer",
      "Rewrite it as Lambda functions"
    ],
    correct:0,
    explain:`A component that holds unshareable state, cannot be changed and is licensed per server is the case for scaling up. Scaling out (B) only works when any copy can serve any request; four independent copies would each hold different state and need four licenses. Sticky sessions hide the problem, and a rewrite is ruled out.` },

  /* Ch 26 - Decoupling with Amazon SQS: Standard vs FIFO, Visibility Timeout, Dead-Letter Queues (K2.1.2, K2.1.11) */
  { ref:{chapter:26}, q:`Delivery trucks send location updates to an SQS queue. Updates for each truck must be processed in the order they were sent, but different trucks should be processed in parallel by many workers. How should the queue be designed?`,
    opts:[
      "A standard queue with long polling",
      "A standard queue with a 15-minute delay",
      "A FIFO queue that uses the truck ID as the message group ID",
      "A FIFO queue that puts every message in a single message group"
    ],
    correct:2,
    explain:`FIFO ordering applies per message group, so using the truck ID keeps each truck's updates in order while groups for different trucks are processed in parallel. One group for everything (D) also preserves order but forces all messages through one at a time. Standard queues offer only best-effort ordering, with or without delays.` },

  /* Ch 27 - Services for Loose Coupling: SQS vs SNS vs EventBridge vs Amazon MQ (S2.1.3) */
  { ref:{chapter:27}, q:`A public university uses a SaaS help desk product that publishes ticket events. IT wants high-priority tickets to start an incident workflow, password tickets to go to a Lambda function, and everything else archived, without polling the vendor. What should the architect use?`,
    opts:[
      "An SQS standard queue that every target polls",
      "An SNS topic with every target subscribed",
      "An Amazon MQ broker",
      "An Amazon EventBridge partner event bus with rules that match on fields in each event"
    ],
    correct:3,
    explain:`EventBridge receives events from supported SaaS partners and routes each one by its content to different targets. SNS (B) fans out every message to every subscriber, so each target would receive tickets it does not want unless filtering is bolted on, and it has no partner integration. A queue delivers each message to one consumer, and Amazon MQ is for existing broker protocols.` },

  /* Ch 28 - When to Use Containers: ECS vs EKS, EC2 Launch Type vs Fargate (S2.1.4) */
  { ref:{chapter:28}, q:`A city's permit application is a long-running Java service. The team wants to containerize it with the least operational overhead, has no requirement for Kubernetes, and does not want to manage servers. Which option fits?`,
    opts:[
      "Amazon ECS with the Fargate launch type",
      "Amazon EKS with self-managed EC2 nodes",
      "Docker installed on EC2 instances managed by the team",
      "AWS Lambda container images"
    ],
    correct:0,
    explain:`ECS has no control plane to run, and Fargate removes the servers, so the team only defines tasks and services. EKS (B) suits teams that need Kubernetes, and self-managed nodes add patching and capacity work. Lambda container images still carry the 15-minute limit, which does not fit a long-running service.` },

  /* Ch 29 - When to Use Serverless: AWS Lambda Patterns and Limits (S2.1.5) */
  { ref:{chapter:29}, q:`S3 uploads of sensor files trigger a Lambda function asynchronously. Some events fail after Lambda's automatic retries, and the team only learns about them when customers complain about missing data. What should it configure?`,
    opts:[
      "Raise the function timeout to 15 minutes",
      "An on-failure destination, such as an SQS queue, for asynchronous invocations",
      "Provisioned concurrency on the function",
      "More memory for the function"
    ],
    correct:1,
    explain:`After two retries an asynchronous event is discarded unless it is captured, so an on-failure destination (or a dead-letter queue) keeps failed events for inspection and reprocessing. A longer timeout (A) may help slow runs but does nothing for events that fail for other reasons. Provisioned concurrency and memory do not keep failed events.` },

  /* Ch 30 - Amazon API Gateway: REST vs HTTP vs WebSocket APIs (K2.1.1) */
  { ref:{chapter:30}, q:`A game studio is adding in-game chat. The server must push messages to connected players the moment they arrive, and players send messages over the same persistent connection. Which API Gateway type fits?`,
    opts:[
      "A REST API with caching enabled",
      "An HTTP API with a JWT authorizer",
      "An edge-optimized REST API",
      "A WebSocket API"
    ],
    correct:3,
    explain:`WebSocket APIs keep a persistent two-way connection so the backend can push messages to clients and clients can send on the same channel. An HTTP API (B) is a cheap request-and-response proxy, so clients would have to poll for new messages. REST caching and edge optimization also serve request-and-response traffic.` },

  /* Ch 31 - Workflow Orchestration with AWS Step Functions (K2.1.16) */
  { ref:{chapter:31}, q:`A records office must run the same validation steps on 2 million scanned files in an S3 bucket, in parallel, with retries for failures and a summary of results at the end, without building a queue and worker fleet. What should it use?`,
    opts:[
      "A Step Functions Distributed Map state reading the objects from S3",
      "One Lambda function that invokes itself recursively for each file",
      "An Express workflow with an inline Map over all 2 million items",
      "A cron job on one EC2 instance"
    ],
    correct:0,
    explain:`Distributed Map runs each item as a child workflow execution, reads large data sets straight from S3, and handles retries and results at scale. An inline Map in an Express workflow (C) runs inside one short execution with a single history, which is not built for millions of items. Recursive Lambda chains and one cron instance lose the built-in retries and visibility.` },

  /* Ch 32 - Purpose-Built Services: Managed AI Services as Architecture Components (S2.1.7 = S2.2.8) */
  { ref:{chapter:32}, q:`A national park service receives visitor feedback in 30 languages. It wants each comment converted to English and scored for sentiment, with the least effort and no ML expertise. Which design fits?`,
    opts:[
      "Train a custom model in Amazon SageMaker AI on past comments",
      "Amazon Translate to convert the text, then Amazon Comprehend for sentiment",
      "Amazon Rekognition for the text",
      "Amazon Polly to read the comments aloud, then Amazon Transcribe"
    ],
    correct:1,
    explain:`Translate changes the language and Comprehend analyzes sentiment, both as pre-trained APIs with no model to build. SageMaker AI (A) could do it, but training and hosting a model is never the least-effort answer when managed services already cover the task. Rekognition analyzes images, and Polly and Transcribe convert between text and speech.` },

  /* Ch 33 - Automating for Infrastructure Integrity: Immutable Infrastructure with AWS CloudFormation (S2.2.1) */
  { ref:{chapter:33}, q:`A central IT team must deploy the same logging and alerting stack to 20 accounts across three Regions and keep every copy identical as the template changes. What should it use?`,
    opts:[
      "Deploy the template by hand in each account and Region",
      "AWS Systems Manager Patch Manager",
      "AWS CloudFormation StackSets from a delegated administrator account",
      "Copy a golden AMI to every Region"
    ],
    correct:2,
    explain:`StackSets create, update and delete the same stack across many accounts and Regions in one operation, so every copy follows the template. Manual deployment (A) multiplies effort and invites drift across 60 copies. Patch Manager patches existing nodes, and an AMI is not a logging and alerting stack.` },

  /* Ch 34 - Services for High Availability Across AZs and Regions (S2.2.2) */
  { ref:{chapter:34}, q:`A game's leaderboards run on DynamoDB in us-east-1. Players in North America and Europe should read and write in their nearest Region with low latency, and the game must keep working if a whole Region fails. What should the architect use?`,
    opts:[
      "DynamoDB global tables with replicas in a US and a European Region",
      "DynamoDB Streams with a Lambda function that copies items to a second table",
      "Amazon RDS Multi-AZ",
      "An Aurora cross-Region read replica"
    ],
    correct:0,
    explain:`Global tables replicate a table across Regions with every replica accepting reads and writes, which gives local latency and survives a Regional loss. A custom Streams and Lambda copy (B) rebuilds the same thing with code to maintain and conflict handling to invent. RDS Multi-AZ stays in one Region, and an Aurora replica is read-only.` },

  /* Ch 35 - Amazon Route 53: Routing Policies and Health Checks for Failover (K2.2.1, K2.2.6) */
  { ref:{chapter:35}, q:`An education app runs active-active in three Regions behind ALBs. Each user should reach the Region that answers fastest for them, and a Region that becomes unhealthy should stop receiving traffic automatically. Which Route 53 setup fits?`,
    opts:[
      "Simple routing with all three ALB addresses in one record",
      "Latency-based alias records for each Region, with health checks evaluated",
      "Geolocation records by country with no health checks",
      "Weighted records split evenly, with no health checks"
    ],
    correct:1,
    explain:`Latency records send each user to the Region with the lowest measured latency, and health checks remove an unhealthy Region from the answers. Geolocation (C) routes by the user's location, which is not the same as the fastest Region, and without health checks it keeps sending users to a failed Region. Simple and unhealthy-blind weighted routing do neither.` },

  /* Ch 36 - Metrics That Match the Business: CloudWatch Alarms and AWS X-Ray (S2.2.3) */
  { ref:{chapter:36}, q:`A state tax portal's login page broke at 2 a.m. after a deployment, and nobody noticed until morning because almost no one signs in overnight, so error alarms stayed quiet. How can the team detect such failures even with no user traffic?`,
    opts:[
      "Alarm on average CPU utilization of the web servers",
      "Alarm on the count of 5XX errors",
      "Turn on AWS X-Ray tracing",
      "A CloudWatch Synthetics canary that signs in every few minutes, with an alarm on its success rate"
    ],
    correct:3,
    explain:`A canary generates its own traffic on a schedule, so a broken login fails the canary even when no real users arrive. An error-count alarm (B) needs requests to produce errors, which is exactly what was missing overnight. CPU stays normal on a broken page, and X-Ray traces requests that actually happen.` },

  /* Ch 37 - Mitigating Single Points of Failure (S2.2.4) */
  { ref:{chapter:37}, q:`A game's in-app store sometimes times out after a coin purchase has already been charged. The client retries, and some players are charged twice. What change prevents duplicate charges while keeping retries?`,
    opts:[
      "Increase the payment service's timeout",
      "Disable client retries entirely",
      "Have the client send a unique purchase ID that the service records, returning the original result for repeated requests",
      "Move the payment service to a larger instance"
    ],
    correct:2,
    explain:`An idempotency key lets the service recognize a retry and return the first result instead of charging again, so retries become safe. Disabling retries (B) avoids duplicates but turns every transient failure into a lost purchase. A longer timeout or bigger instance makes timeouts rarer without making retries safe.` },

  /* Ch 38 - Data Durability and Availability: Storage Characteristics and Backup Strategy (S2.2.5) */
  { ref:{chapter:38}, q:`A college stores its learning management system's course files on an Amazon EFS One Zone file system. A review requires the files to survive the loss of an Availability Zone and to be recoverable after accidental deletion. What should the college do?`,
    opts:[
      "Keep EFS One Zone and enable lifecycle management to IA",
      "Move to a Regional EFS file system and protect it with AWS Backup",
      "Move the files to an EBS volume with Multi-Attach",
      "Store the files on instance store volumes"
    ],
    correct:1,
    explain:`Regional EFS stores data redundantly across multiple AZs, and AWS Backup recovery points cover deletions that replication would copy. Lifecycle to IA (A) lowers cost but leaves the data in one AZ. EBS volumes live in a single AZ, and instance store data is lost when the instance stops.` },

  /* Ch 39 - Selecting a Disaster Recovery Strategy Against RPO and RTO (S2.2.6) */
  { ref:{chapter:39}, q:`A ferry operator's ticketing system needs an RPO of 15 minutes and an RTO of 4 hours if its primary Region fails. Compute in the recovery Region should cost as little as possible until a disaster. Which TWO elements make up the right strategy?`,
    opts:[
      "Run full production capacity in both Regions at all times",
      "Take nightly database backups and copy them to the recovery Region",
      "Replicate the database continuously to the recovery Region",
      "Keep CloudFormation templates ready to launch the application tier in the recovery Region during failover",
      "Run a warm standby at half capacity that serves live traffic"
    ],
    correct:[2,3],
    explain:`This is pilot light: data replicates continuously so the RPO is minutes, while application servers are launched from infrastructure as code only when needed, which fits a 4-hour RTO at minimal running cost. Nightly backups (B) are cheaper still but put up to a day of data at risk, missing the 15-minute RPO. Active-active and warm standby pay for compute the RTO does not require.` },

  /* Ch 40 - Making Legacy Applications Reliable Without Code Changes (S2.2.7) */
  { ref:{chapter:40}, q:`A vendor application that cannot be modified opens hundreds of database connections to RDS for MySQL. During each Multi-AZ failover it floods the new primary with reconnects and errors for several minutes. How can the team improve this without code changes?`,
    opts:[
      "Put Amazon RDS Proxy in front of the database and point the application at the proxy endpoint",
      "Add a read replica and send all traffic to it",
      "Move the database to a larger instance class",
      "Add retry logic with exponential backoff to the application"
    ],
    correct:0,
    explain:`RDS Proxy pools connections, absorbs surges and keeps client connections open through a Multi-AZ failover, needing only an endpoint change. Retry logic (D) is the right pattern in new code, but the application cannot be modified. A replica cannot accept writes, and a bigger instance does not stop the reconnect storm.` },

  /* Ch 42 - Storage That Scales: Object vs File vs Block (S3.1.2) */
  { ref:{chapter:42}, q:`A news site for a public broadcaster runs its content management system on a fleet of Linux instances across three AZs. Every instance must read and write the same uploaded media files through a POSIX file system, and the library grows unpredictably. Which storage fits?`,
    opts:[
      "An EBS volume attached to each instance",
      "Instance store volumes synchronized nightly",
      "An S3 bucket accessed through the SDK only",
      "An Amazon EFS Regional file system mounted on every instance"
    ],
    correct:3,
    explain:`EFS is a shared POSIX file system that many Linux instances mount at once across AZs, and it grows and shrinks with the files. S3 (C) scales without limit but is object storage over an API, not a mounted file system the CMS expects. EBS volumes attach to one instance in one AZ, and instance store is temporary.` },

  /* Ch 43 - Decoupling So Components Scale Independently (S3.2.1) */
  { ref:{chapter:43}, q:`Each sensor reading from a factory must be processed by three independent systems: an alerting service, a historian and a machine learning feature store. Each runs at a different speed and must scale on its own backlog without slowing the others. What should the architect build?`,
    opts:[
      "One SQS queue that all three systems poll",
      "Synchronous calls from the sensor gateway to each system",
      "An SNS topic that fans out to a separate SQS queue for each system, each scaled on its own queue depth",
      "One Kinesis shard read by a single consumer that calls the three systems"
    ],
    correct:2,
    explain:`Fan-out through SNS gives each system its own copy of every message in its own queue, so each scales and fails independently. A single shared queue (A) delivers each message to only one consumer, so each system would see a third of the readings. Synchronous calls couple the gateway to the slowest system.` },

  /* Ch 44 - Scaling Metrics and Conditions: EC2 Auto Scaling Policies (S3.2.2) */
  { ref:{chapter:44}, q:`A game's matchmaking API runs on EC2 instances behind an ALB. Load tests show each instance handles about 1,000 requests per minute comfortably, and CPU is a poor signal for this workload. Which scaling policy needs the least tuning?`,
    opts:[
      "Simple scaling on average CPU with a 300-second cooldown",
      "A scheduled action every evening",
      "Target tracking on ALBRequestCountPerTarget with a target of 1,000",
      "Step scaling on memory utilization from the default EC2 metrics"
    ],
    correct:2,
    explain:`Target tracking on requests per target keeps each instance near the load it handles well and adjusts capacity in both directions automatically. Simple scaling on CPU (A) watches the wrong signal and waits out cooldowns. EC2 publishes no memory metric by default, and a schedule cannot follow unpredictable match traffic.` },

  /* Ch 45 - Compute Options and Features: EC2 Instance Types for Performance (S3.2.3) */
  { ref:{chapter:45}, q:`A multiplayer game runs dedicated game servers that are CPU-bound and push very high packet rates over UDP. The server binaries already build for arm64. Which instance choice fits best?`,
    opts:[
      "A memory optimized R instance",
      "A compute optimized, network optimized Graviton instance such as c7gn",
      "A storage optimized I instance",
      "A burstable T instance in unlimited mode"
    ],
    correct:1,
    explain:`Game servers are a compute optimized workload, the n variant adds network performance for high packet rates, and the g marks Graviton, which the arm64 builds can use. Burstable T instances (D) are cheap for low average CPU, but a sustained CPU-bound server would run on surplus credits all day. R and I families pay for memory and local disks the servers do not need.` },

  /* Ch 46 - Resource Type and Size: Lambda Memory and Fargate Task Size (S3.2.4) */
  { ref:{chapter:46}, q:`An ECS service on Fargate runs tasks sized at 4 vCPU and 16 GB. Container Insights shows each task uses about 0.5 vCPU and 2 GB, and the service already scales out by adding tasks. What should the team do?`,
    opts:[
      "Reduce the task size to fit one copy's real needs, and keep scaling the task count with Service Auto Scaling",
      "Move the service to Lambda",
      "Double the task size to leave headroom",
      "Switch to the EC2 launch type with the same task size"
    ],
    correct:0,
    explain:`Fargate bills the requested vCPU and memory per second whether used or not, so sizing each task for one unit of work and scaling on count keeps both performance and cost right. Switching launch types (D) keeps the oversized task definition and adds instances to manage. Doubling the size wastes more, and Lambda is not a drop-in for a container service.` },

  /* Ch 48 - Designing Database Architectures (S3.3.2) */
  { ref:{chapter:48}, q:`An IoT platform writes about 50,000 small device readings per second and reads them back only by device ID and time. Its RDS for PostgreSQL writer is saturated even on the largest instance class. Which database design scales the writes?`,
    opts:[
      "Add five read replicas to the RDS instance",
      "Put ElastiCache in front of the database",
      "Move to a larger RDS instance with more Provisioned IOPS",
      "Amazon DynamoDB with device ID as the partition key and time as the sort key"
    ],
    correct:3,
    explain:`DynamoDB spreads writes across partitions by key, so throughput grows with the table, and key-plus-time lookups match the access pattern. Read replicas (A) are tempting because they add capacity, but they serve reads only and never add write throughput. A cache helps repeated reads, and the instance is already at the largest size.` },

  /* Ch 49 - Choosing an Engine: MySQL vs PostgreSQL, Amazon RDS vs Amazon Aurora (S3.3.3 = S4.3.2) */
  { ref:{chapter:49}, q:`A transport ministry is building a route planning application that relies on geospatial queries through PostGIS. It wants a managed relational database whose storage grows automatically and is replicated across three AZs. Which choice fits?`,
    opts:[
      "Amazon RDS for MySQL",
      "Amazon RDS for MariaDB",
      "Amazon DynamoDB",
      "Amazon Aurora PostgreSQL-Compatible Edition"
    ],
    correct:3,
    explain:`PostGIS is a PostgreSQL extension, and Aurora's shared cluster storage grows automatically with copies across three AZs. RDS for MySQL (A) is a common default for web applications but lacks PostGIS. MariaDB is a MySQL relative, and DynamoDB is not a relational engine with geospatial SQL.` },

  /* Ch 52 - Network Topology: VPC Peering vs Transit Gateway vs PrivateLink (S3.4.1) */
  { ref:{chapter:52}, q:`A game studio has two VPCs in the same Region, with non-overlapping CIDR blocks: one for game servers and one for analytics. They need full private IP reachability with each other, at the lowest cost and with no single device in the path. What should the architect use?`,
    opts:[
      "A VPC peering connection",
      "An AWS Transit Gateway",
      "AWS PrivateLink",
      "A Site-to-Site VPN between the two VPCs"
    ],
    correct:0,
    explain:`Peering joins two VPCs directly with no gateway in the path and no hourly or processing charge. A Transit Gateway (B) also connects them but adds per-attachment hours and per-GB processing that only pay off with many networks. PrivateLink exposes one service in one direction, and a VPN adds tunnels to manage.` },

  /* Ch 53 - Network Configurations That Scale: CIDR Planning, IPv6, and Subnet Sizing (S3.4.2) */
  { ref:{chapter:53}, q:`An Amazon EKS cluster for a logistics platform can no longer schedule new pods: the subnets have run out of IP addresses because every pod takes a VPC address. The VPC's primary CIDR is 10.20.0.0/16. What should the team do?`,
    opts:[
      "Resize the VPC's primary CIDR to a /14",
      "Resize the existing subnets to be larger",
      "Associate a secondary CIDR block, such as one from 100.64.0.0/10, and create larger subnets in it for the pods",
      "Create a new VPC and peer it to the cluster's VPC"
    ],
    correct:2,
    explain:`Neither a VPC's primary CIDR nor a subnet can be resized, but a secondary CIDR can be added and new, larger subnets created in it, a common fix for pod address exhaustion. Resizing the primary CIDR (A) is not possible. A peered VPC does not add addresses to the cluster's own subnets.` },

  /* Ch 54 - Placing Resources: Placement Groups, Local Zones, AWS Wavelength, AWS Outposts (S3.4.3) */
  { ref:{chapter:54}, q:`A game analytics team runs a 60-node Apache Cassandra cluster on EC2 in one AZ. It wants a single hardware rack failure to affect as few nodes as possible, with each replica group on separate racks. Which placement strategy fits?`,
    opts:[
      "A cluster placement group",
      "A partition placement group",
      "A spread placement group",
      "A Wavelength Zone"
    ],
    correct:1,
    explain:`Partition placement groups put groups of instances on separate racks, so a rack failure hits one partition, which suits distributed stores like Cassandra. A spread group (C) puts each instance on distinct hardware but allows only seven instances per AZ, far fewer than 60. A cluster group packs nodes together, the opposite of the goal.` },

  /* Ch 56 - Building and Securing a Data Lake: S3, the AWS Glue Data Catalog, and AWS Lake Formation (S3.5.1) */
  { ref:{chapter:56}, q:`A public health department's data lake holds a patient visits table. Analysts must query every column except the patient name and address columns, using Athena, without maintaining a second copy of the data. What should the architect configure?`,
    opts:[
      "Lake Formation data permissions on the table that exclude the two personal columns for the analysts",
      "A separate S3 bucket containing a copy of the table without those columns",
      "IAM policies that allow the analysts to read only some S3 prefixes",
      "A separate Athena workgroup for the analysts"
    ],
    correct:0,
    explain:`Lake Formation grants permissions at the column level on catalog tables, and Athena enforces them, so analysts see the table without the personal columns. A copy without the columns (B) works but creates a second data set to keep in sync. S3 prefixes cannot split columns inside the same files, and workgroups manage settings and cost, not column access.` },

  /* Ch 58 - Data Transfer Solutions: DataSync vs Transfer Family vs Physical Transfer (S3.5.3) */
  { ref:{chapter:58}, q:`A city archive must move 400 TB of scanned records from an on-premises NFS share into S3 within three weeks, over a 200 Mbps internet link. After the bulk move, new and changed files must be copied to S3 every night. Which TWO solutions fit?`,
    opts:[
      "AWS Data Transfer Terminal for the initial 400 TB",
      "AWS Snowball Edge devices for the initial 400 TB",
      "An AWS Transfer Family SFTP endpoint for the staff",
      "An AWS DataSync scheduled task for the nightly incremental copies",
      "S3 Transfer Acceleration for the full 400 TB"
    ],
    correct:[0,3],
    explain:`At 200 Mbps the bulk copy would take months, so physical transfer through Data Transfer Terminal fits the deadline, and DataSync then copies only changed files on a schedule with verification. Snowball Edge (B) is no longer available to new customers. Transfer Acceleration speeds distance, not a link this small, and Transfer Family is for outside partners.` },

  /* Ch 59 - Visualization Strategies: Amazon Quick on Athena, Redshift, and OpenSearch Service (S3.5.4) */
  { ref:{chapter:59}, q:`A game's live operations team needs to search application logs and chart error spikes by server within seconds of the events happening. Which visualization approach fits?`,
    opts:[
      "Amazon Quick dashboards on Athena over the S3 log archive",
      "Amazon Quick on Amazon Redshift with SPICE refreshed daily",
      "Amazon OpenSearch Service with OpenSearch Dashboards, fed by a Firehose stream",
      "AWS CloudTrail event history"
    ],
    correct:2,
    explain:`OpenSearch Service indexes streamed logs within seconds and its built-in Dashboards handle search and operational charts. Quick on Redshift with SPICE (B) is strong for repeated business reporting, but a daily refresh and warehouse loads cannot show seconds-old errors. Athena over the archive suits occasional analysis, and CloudTrail records API calls, not application logs.` },

  /* Ch 60 - Compute for Data Processing: AWS Glue vs Amazon EMR vs AWS Batch (S3.5.5) */
  { ref:{chapter:60}, q:`A transport research lab runs 10,000 independent traffic simulations, each a container that runs for about two hours. The code is not Spark, jobs can be retried if interrupted, and cost matters. What should the lab use?`,
    opts:[
      "AWS Glue jobs",
      "AWS Batch with array jobs on Spot capacity",
      "An Amazon EMR cluster",
      "Step Functions invoking Lambda functions"
    ],
    correct:1,
    explain:`Batch queues containerized jobs, fans one definition out to thousands with array jobs and runs them on cheap Spot capacity that suits retryable work. Glue (A) is serverless Spark ETL, not a runner for arbitrary simulation containers. EMR targets Hadoop and Spark frameworks, and two-hour runs exceed Lambda's 15-minute limit.` },

  /* Ch 61 - Ingestion Configurations: Frequency, Buffering, and Secure Entry Points (S3.5.6) */
  { ref:{chapter:61}, q:`Producers in a factory's private subnets, with no NAT gateway, must send sensor records to a Kinesis data stream. Security requires that traffic stays off the internet and that producers can only write to that one stream. What should the architect configure?`,
    opts:[
      "A NAT gateway and an IAM role with full Kinesis access",
      "The public Kinesis endpoint with long-term access keys on each producer",
      "An S3 gateway endpoint for the producers",
      "An interface VPC endpoint for Kinesis Data Streams, and a role that allows only the put-record actions on that stream"
    ],
    correct:3,
    explain:`An interface endpoint keeps producer traffic on the AWS network, and least-privilege IAM limits producers to writing records to the one stream. A NAT gateway (A) sends traffic toward the public endpoint and the role is far too broad. Gateway endpoints exist only for S3 and DynamoDB, and long-term keys are the credential to avoid.` },

  /* Ch 63 - Cost Visibility: Cost Explorer, AWS Budgets, the Cost and Usage Report, and Cost Allocation Tags (K4.1.2, K4.1.3) */
  { ref:{chapter:63}, q:`A finance analyst at a logistics company wants to see, in a chart, which AWS services drove the bill's growth over the last 12 months and a forecast for the next quarter, without building any reporting pipeline. What should the analyst use?`,
    opts:[
      "AWS Budgets",
      "AWS Cost Explorer",
      "The Cost and Usage Report delivered to S3",
      "AWS Trusted Advisor"
    ],
    correct:1,
    explain:`Cost Explorer charts up to 13 months of history by service, account or tag and forecasts future spend, with nothing to build. The Cost and Usage Report (C) has the most detail but arrives as files in S3 that need Athena or a dashboard to analyze. Budgets alerts on thresholds, and Trusted Advisor flags optimization checks.` },

  /* Ch 65 - The Correct Storage Size for a Workload (S4.1.2) */
  { ref:{chapter:65}, q:`Trusted Advisor flags 140 unattached EBS volumes left behind by terminated game servers, plus three years of daily snapshots that nobody restores. The team wants to cut this storage cost while still being able to recreate a volume if ever needed. What should it do?`,
    opts:[
      "Convert the unattached volumes to io2",
      "Leave the volumes in place but stop the snapshots",
      "Double the size of each volume so they can be reused later",
      "Snapshot each unattached volume and delete it, and add a snapshot lifecycle policy that removes old snapshots"
    ],
    correct:3,
    explain:`Snapshots are incremental and much cheaper than provisioned volumes, so keeping a snapshot and deleting the volume preserves recovery, and a lifecycle policy stops old snapshots piling up. Keeping the volumes (B) keeps paying for provisioned capacity that no instance uses. io2 and larger sizes raise the cost.` },

  /* Ch 68 - S3 Object Lifecycles and Data Lifecycles (S4.1.5, S4.1.9) */
  { ref:{chapter:68}, q:`A game stores match replay files of about 2 MB each. Players watch them often in the first week, rarely after that, and the files are deleted at 90 days. Which lifecycle configuration is most cost-effective?`,
    opts:[
      "Transition to S3 Glacier Deep Archive after 7 days and expire after 90 days",
      "Upload directly to S3 One Zone-IA and expire after 90 days",
      "Transition to S3 Standard-IA after 30 days and expire after 90 days",
      "Keep everything in S3 Standard with no lifecycle rules"
    ],
    correct:2,
    explain:`Standard-IA is cheaper for rarely read data, objects must be 30 days old before moving there, and expiry at 90 days ends the cost. Deep Archive (A) has a 180-day minimum storage duration, so deleting at 90 days is billed for the remainder, and its restores take hours. Storing replays in One Zone-IA from day 1 charges retrievals during the busy first week.` },

  /* Ch 71 - Selecting a Storage Tier: S3 Storage Classes (S4.1.8) */
  { ref:{chapter:71}, q:`A city's open data portal stores thousands of data sets, mostly larger than 1 MB. Access is unpredictable: some data sets sit untouched for months, then suddenly become popular. The city wants the lowest storage cost with no retrieval fees or lifecycle tuning. Which storage class fits?`,
    opts:[
      "S3 Intelligent-Tiering",
      "S3 Standard-IA",
      "S3 Glacier Flexible Retrieval",
      "S3 One Zone-IA"
    ],
    correct:0,
    explain:`Intelligent-Tiering moves each object between access tiers automatically as its use changes, with no retrieval fees, which suits unknown and shifting access. Standard-IA (B) is cheaper to store, but sudden popularity would bring retrieval fees on every read. Glacier Flexible Retrieval restores in minutes to hours, and One Zone-IA keeps the data in one AZ.` },

  /* Ch 72 - The Most Cost-Effective Storage Service: S3 vs EFS vs FSx vs EBS (S4.1.10) */
  { ref:{chapter:72}, q:`A game studio keeps 300 TB of finished build artifacts on Amazon EFS Standard. Its build tools fetch artifacts through the AWS SDK over HTTPS and never need a mounted file system. Which storage would cost least for this data?`,
    opts:[
      "Keep EFS Standard and add more throughput",
      "Amazon FSx for NetApp ONTAP",
      "Amazon S3, with lifecycle rules for artifacts that age",
      "Amazon EBS volumes attached to a file server"
    ],
    correct:2,
    explain:`S3 has the lowest price per GB of the storage services and its classes go lower still, and the tools already work over an API rather than a file system. FSx for NetApp ONTAP (B) adds deduplication and tiering but is a file service sized in capacity, paying for features the tools do not use. EBS bills provisioned capacity and needs a server in front.` },

  /* Ch 75 - Cost-Effective Compute Services: Lambda vs Fargate vs EC2 (S4.2.3) */
  { ref:{chapter:75}, q:`A county's permit portal resizes each uploaded scan, which takes about 3 seconds. Uploads arrive in heavy bursts at month end and almost none arrive the rest of the month. Today an EC2 instance runs all month for this. What is most cost-effective?`,
    opts:[
      "An AWS Lambda function triggered by S3 upload events",
      "A larger EC2 instance with a three-year Reserved Instance",
      "Amazon ECS on an EC2 Auto Scaling group with a minimum of two instances",
      "An always-on Amazon EMR cluster"
    ],
    correct:0,
    explain:`Lambda bills per request and per millisecond and scales with each burst, so the quiet weeks cost nothing and each 3-second job fits easily within its limits. A Reserved Instance (B) discounts the hourly rate but still pays for an instance that is idle most of the month. A cluster with a minimum of two instances keeps paying for idle capacity.` },

  /* Ch 77 - Selecting an Instance Family for Cost (S4.2.5) */
  { ref:{chapter:77}, q:`A school district's student information system runs on t3.xlarge instances in unlimited mode at a steady 60 percent CPU all day. Each month's bill includes large surplus CPU credit charges. What change lowers cost for the same performance?`,
    opts:[
      "Move to t3.2xlarge instances in unlimited mode",
      "Switch the T3 instances to standard credit mode",
      "Move to memory optimized X instances",
      "Move to a fixed-performance general purpose family, such as m7i or m7g"
    ],
    correct:3,
    explain:`Steady CPU above the T baseline pays surplus credit charges all day, so a fixed-performance general purpose instance delivers the same work without them. Standard mode (B) stops the charges but throttles the instances to baseline once credits run out, cutting performance. A larger T instance keeps the same pattern, and X instances buy memory the system does not need.` },

  /* Ch 80 - Cost-Effective Database Services: DynamoDB vs RDS, Serverless vs Provisioned (S4.3.3) */
  { ref:{chapter:80}, q:`A logistics company runs steady RDS for PostgreSQL instances and provisioned DynamoDB tables around the clock and will for years. Next year it plans to move some RDS databases to Aurora and change instance families. Which purchase keeps a discount through those changes?`,
    opts:[
      "Reserved DB instances for today's RDS instance types",
      "A Database Savings Plan",
      "On-Demand pricing with no commitment",
      "A Compute Savings Plan"
    ],
    correct:1,
    explain:`Database Savings Plans apply across engines, instance families and Regions, covering RDS, Aurora and DynamoDB, so the discount follows the migration. Reserved DB instances (A) are tied to an instance type and Region, so moving to Aurora or another family would leave them unused. Compute Savings Plans cover EC2, Fargate and Lambda, not databases.` },

  /* Ch 82 - Migrating Database Schemas and Data with AWS DMS: Homogeneous vs Heterogeneous (S4.3.5) */
  { ref:{chapter:82}, q:`A ministry plans to move a large Oracle database with thousands of PL/SQL procedures to Aurora PostgreSQL to remove license costs. Before committing, leadership wants an estimate of how much of the schema and code will convert automatically and how much needs manual work. What should the team run first?`,
    opts:[
      "An AWS DMS full load task into a test cluster",
      "Oracle Data Pump into Aurora PostgreSQL",
      "Amazon RDS Proxy in front of the Oracle database",
      "A DMS Schema Conversion assessment report for the source database"
    ],
    correct:3,
    explain:`DMS Schema Conversion assesses the source schema and code and reports what converts automatically and what needs manual effort, which is the estimate leadership wants. A DMS full load (A) moves data but says nothing about converting PL/SQL procedures. Data Pump cannot load into PostgreSQL, and RDS Proxy pools connections.` },

  /* Ch 83 - NAT for Cost: One Shared NAT Gateway vs One per AZ vs a NAT Instance (S4.4.1) */
  { ref:{chapter:83}, q:`A media company runs NAT instances on small EC2 instances in each AZ, with failover scripts it maintains. Outbound traffic has grown, the instances drop packets at peak, and the team wants the least operational overhead with high availability. What should it do?`,
    opts:[
      "Move the NAT instances to larger instance types",
      "Replace them with a NAT gateway in each AZ, with each AZ's route table pointing to its own",
      "Add internet gateway routes to the private subnets",
      "Add an S3 gateway endpoint"
    ],
    correct:1,
    explain:`NAT gateways are managed, redundant within their AZ and scale up to 100 Gbps, so per-AZ gateways remove the scripts, patching and bandwidth ceiling. Larger instances (A) raise the ceiling but keep all the operational work. Internet gateway routes would make the subnets public, and an S3 endpoint helps only S3 traffic.` },

  /* Ch 85 - Routing to Minimize Transfer Costs (S4.4.3) */
  { ref:{chapter:85}, q:`A nightly analytics job runs on EC2 in us-west-2 and reads 50 TB a month from an S3 bucket in us-east-1. The data must stay in us-east-1, and the job has no reason to run in us-west-2. Which change reduces data transfer cost most?`,
    opts:[
      "Run the job on EC2 in us-east-1, in the same Region as the bucket",
      "Enable S3 Transfer Acceleration on the bucket",
      "Put AWS Global Accelerator in front of the bucket",
      "Replicate the whole bucket to us-west-2 every day"
    ],
    correct:0,
    explain:`Data between EC2 and S3 in the same Region has no transfer charge, so moving the job next to its data removes the inter-Region cost. Replicating to us-west-2 (D) still pays inter-Region transfer to make each copy, plus a second copy's storage. Transfer Acceleration and Global Accelerator add charges for speed.` },

  /* Ch 87 - Reviewing Existing Workloads for Network Optimizations (S4.4.5) */
  { ref:{chapter:87}, q:`A cost review of a game backend shows rising cross-AZ data transfer that nobody can attribute, plus charges for public IPv4 addresses. Which TWO actions should the team take first?`,
    opts:[
      "Disable AWS CloudTrail to reduce log traffic",
      "Enable VPC Flow Logs to S3 and query them with Athena to rank flows by bytes and AZ pair",
      "Release Elastic IP addresses that are not attached to anything",
      "Enable S3 Transfer Acceleration on every bucket",
      "Put AWS Global Accelerator in front of the backend"
    ],
    correct:[1,2],
    explain:`Flow logs attribute the cross-AZ bytes to specific sources and destinations so the right flows can be fixed, and every public IPv4 address bills hourly, idle or not, so unused Elastic IPs are pure waste. Transfer Acceleration (D) and Global Accelerator add per-GB charges rather than removing cross-AZ transfer, and disabling CloudTrail removes the audit trail.` },

  /* Ch 89 - Bandwidth Allocation: Multiple VPN Tunnels and Direct Connect Speeds (S4.4.7) */
  { ref:{chapter:89}, q:`A manufacturer connects to AWS with two 10 Gbps dedicated Direct Connect connections bundled in a link aggregation group at one Direct Connect location. A new requirement says connectivity must survive the loss of that whole location. What should it add?`,
    opts:[
      "A third 10 Gbps connection to the existing LAG",
      "A move to a single 100 Gbps connection at the same location",
      "A Direct Connect connection at a second Direct Connect location",
      "MACsec encryption on the existing connections"
    ],
    correct:2,
    explain:`A LAG aggregates connections at one location, so it adds bandwidth but shares that location's fate; a connection at a second location is what survives a location failure. Adding to the LAG (A) gives more bandwidth at the same single location. A bigger port has the same weakness, and MACsec adds encryption, not resilience.` }
];

    85:["lesson-85-routing-transfer-costs.html", "Routing to Minimize Transfer Costs"],
    86:["lesson-86-cdn-and-edge.html", "CDNs and Edge Caching: Amazon CloudFront vs AWS Global Accelerator"],
    87:["lesson-87-network-optimization-review.html", "Reviewing Existing Workloads for Network Optimizations"],
    88:["lesson-88-throttling-strategy.html", "Selecting a Throttling Strategy"],
    89:["lesson-89-bandwidth-allocation.html", "Bandwidth Allocation: Multiple VPN Tunnels and Direct Connect Speeds"]
  }
};
/* ===== EXAM PAYLOAD - END ===== */
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
