<script>
/* ============================================================
   ▼▼▼  LESSON PAYLOAD — BEGIN  ▼▼▼
   Unit 4 · Module 4.1 · Chapter 68 · S3 Object Lifecycles and Data
   Lifecycles
   Objectives S4.1.5 (managing S3 object lifecycles) and S4.1.9 (selecting
   the correct data lifecycle) with K4.1.7 (data lifecycles) and K4.1.9

   71.

   housekeeping rules (step build), quiz (noncurrent version expiration),

   expire), recap. 8 cards, two quizzes, correct letters A and D.
   Sources (all checked 26 Oct 2026):
   docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html
   (transition actions move objects between storage classes; expiration
   actions delete them; rules apply to current and noncurrent versions;
   abort incomplete multipart uploads; filters by prefix, tags and object
   size);
   docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html
   (objects under 128 KB are not transitioned by default; minimum storage
   durations apply, and transitioning or deleting earlier is charged for
   the remainder; transitions are charged per object);
   docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
   (30-day minimum for Standard-IA and One Zone-IA, 90 days for Glacier
   Instant Retrieval and Flexible Retrieval, 180 days for Deep Archive).
   Palette note: mint accent; --ok is amber.
   Cover animates (an object slides down a staircase of colder classes and
   fades out at the end). Step builds on cards 1 and 3.
   ============================================================ */

/* ----------  NAV  ---------- */
const NAV = {
  catalog:   "index.html",
  next:      "lesson-69-backup-and-archival.html",
  nextLabel: "Next chapter"
};

/* ----------  ART  (custom SVGs, referenced from cards as ${A.name})  ---------- */
const A = {
  cover: `<svg viewBox="0 0 320 200">
    <defs>
      <radialGradient id="c68r" cx="0.5" cy="0.5" r="0.6">

/* ----------  CARDS  ---------- */
const cards = [

  /* 0: cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 4 · Module 4.1 · Chapter 68</div>
    <h1 class="reveal" style="font-size:31px">S3 object lifecycles</h1>
    <p class="lead reveal">Most data is read often when new and rarely after. S3 Lifecycle rules follow that curve automatically: moving objects to cheaper classes as they age, and deleting them when they are no longer needed.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1: access pattern drives the lifecycle, step build */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">Data lifecycle</div>
    <h2 class="reveal" style="font-size:25px">Follow the access pattern</h2>
    <div class="pills">
      <div class="pill" style="pointer-events:none" data-step="1"><p><b>Hot</b>New data read daily: S3 Standard.</p></div>
      <div class="pill" style="pointer-events:none" data-step="2"><p><b>Cooling, then cold</b>Read monthly: Standard-IA. Read quarterly or for audits: a Glacier class.</p></div>
      <div class="pill" style="pointer-events:none" data-step="3"><p><b>Done</b>Retention period over: expire (delete) it, so you stop paying at all.</p></div>
    </div>
    <div class="stepcaps" style="margin-top:8px">

    </div>` },

  { html: `

    <h2 class="reveal" style="font-size:25px">Moving objects colder</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>Days after creation</b>"Move to Standard-IA after 30 days, to Glacier Flexible Retrieval after 90." Objects must be at least 30 days old before Standard-IA.</p></div>
      <div class="pill"><p><b>Minimum durations</b>IA classes 30 days, Glacier Instant and Flexible 90, Deep Archive 180. Moving or deleting sooner is billed for the rest.</p></div>
      <div class="pill"><p><b>Small objects</b>Under 128 KB are skipped by default; each transition is charged per object.</p></div>

  /* 3: housekeeping, step build */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">Expiration and cleanup</div>
    <h2 class="reveal" style="font-size:25px">Rules that delete waste</h2>
    <div class="pills">
      <div class="pill" style="pointer-events:none" data-step="1"><p><b>Expire current versions</b>Delete objects a set number of days after creation, when the retention period ends.</p></div>
      <div class="pill" style="pointer-events:none" data-step="2"><p><b>Noncurrent versions</b>With versioning on, overwritten and deleted objects become noncurrent versions that keep billing. Transition or expire them N days after they become noncurrent.</p></div>
      <div class="pill" style="pointer-events:none" data-step="3"><p><b>Incomplete multipart uploads</b>Abort them after a few days; their uploaded parts are billed but invisible in listings. Also remove expired delete markers.</p></div>

    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span><span>A lifecycle rule that expires noncurrent versions 30 days after they become noncurrent</span></button>
      <button class="choice" data-correct="false"><span class="key">B</span><span>A lifecycle rule that expires current objects after 30 days</span></button>
      <button class="choice" data-correct="false"><span class="key">C</span><span>Suspend versioning on the bucket</span></button>
      <button class="choice" data-correct="false"><span class="key">D</span><span>Move the bucket to S3 Intelligent-Tiering</span></button>
    </div>
    <div class="feedback"><b>Correct.</b> Every overwrite leaves a noncurrent version that keeps billing; a noncurrent expiration rule removes them after 30 days while current files stay. Option C is tempting because it stops new versions, but every version already stored remains and keeps costing money. Expiring current objects would delete live reports.</div>` },

  /* 5: scoping rules */
  { html: `
    <div class="eyebrow reveal">Scoping a rule</div>
    <h2 class="reveal" style="font-size:25px">Different data, different rules</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>Filters</b>Apply a rule to a prefix (logs/), to objects with a tag (retention=7y), or by object size.</p></div>
      <div class="pill"><p><b>Several rules per bucket</b>Logs can expire after a year while invoices move to Deep Archive and stay for seven.</p></div>
      <div class="pill"><p><b>Unknown pattern?</b>Use S3 Intelligent-Tiering instead of guessing transition days (Chapter 71).</p></div>
    </div>` },

  /* 6: quiz, log lifecycle */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:19px">Logs land in S3 Standard. Engineers query them for 30 days, auditors read them rarely in year one, a 12-hour restore is fine after that, and they must be deleted at seven years. Which lifecycle is cheapest?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span><span>Stay in Standard, expire after seven years</span></button>
      <button class="choice" data-correct="false"><span class="key">B</span><span>Deep Archive on day 1, expire after seven years</span></button>
      <button class="choice" data-correct="false"><span class="key">C</span><span>One Zone-IA after 30 days, kept for seven years</span></button>
      <button class="choice" data-correct="true"><span class="key">D</span><span>Standard-IA at 30 days, Deep Archive at 365, expire at about 2,555</span></button>
    </div>
    <div class="feedback"><b>Correct.</b> Each stage matches the access pattern, then deletion at seven years. Option B is tempting because Deep Archive is cheapest, but engineers query the logs daily in the first month and restores take hours. One Zone-IA keeps compliance data in one AZ.</div>` },

  /* 7: done */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.3"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Chapter 68 complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:18px">Next: choosing backup and archival solutions.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Transitions</b>Colder classes as access drops; watch the 30, 90 and 180-day minimums.</p></div>
      <div class="pill"><p><b>Expiration</b>Delete at end of retention; expire noncurrent versions.</p></div>
      <div class="pill"><p><b>Cleanup</b>Abort incomplete multipart uploads; scope rules by prefix and tag.</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ----------
   v2 adds opt-in, per-card step builds on top of the v1 card engine. A card
   with no `steps` field takes exactly the v1 paths below and renders and
   behaves identically; every v2 branch is guarded by `steps` being present. */
const ENGINE_VERSION = 'v2';
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};
const stepState = {};   // v2: current revealed step per card index (mirrors `answered`)

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

/* v2: apply step visibility for one card WITHOUT touching its .in class, so a
   step reveal never replays the card-entrance .reveal stagger. Cumulative for
   normal elements (data-step <= current). Captions append by default: inside
   .stepcaps they accumulate too (data-step="0" is the pre-first-tap caption),
   and captions behind the current step get .step-past (dimmed) while the
   current one stays at full strength. A .stepcap-swap container (or legacy
   .stepcap) opts into swap: only the caption whose data-step equals the
   current step is shown. */
function applySteps(idx) {
  const cur = stepState[idx] || 0;
  els[idx].querySelectorAll('[data-step]').forEach(function(nd) {
    const s = parseInt(nd.getAttribute('data-step'), 10);
    const swapCap = nd.closest && nd.closest('.stepcap-swap, .stepcap');
    const appendCap = !swapCap && nd.closest && nd.closest('.stepcaps');
    const on = swapCap ? (s === cur) : appendCap ? (s <= cur) : (s >= 1 && s <= cur);
    nd.classList.toggle('step-on', on);
    nd.classList.toggle('step-past', !!appendCap && on && s < cur);
  });
}

/* Card layout: the only place that adds/removes .in (and thus replays reveal).
   Called on card change, never on a step advance. */
function layout() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
    applySteps(idx);   // persists built state on revisit
  });
  glow.style.background = cards[i].glow || 'transparent';
}

/* Footer/button state only. Safe to call after a step advance (no reveal). */
function updateFooter() {
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  const total = c.steps || 0;
  const stepsLeft = total > 0 && (stepState[i] || 0) < total;
  if (stepsLeft) { nextBtn.disabled = false; nextBtn.textContent = (i === 0) ? 'Begin lesson' : 'Continue'; }
  else if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
}

function render() {
  layout();
  updateFooter();
  if (cards[i].quiz) wireQuiz(els[i], i);
}

/* v2: reveal the next step of the current card. Returns true if a step was
   consumed (so the caller does not also advance the card). */
function advanceStep(idx) {
  const total = cards[idx].steps || 0;
  if (!total) return false;
  const cur = stepState[idx] || 0;
  if (cur >= total) return false;
  stepState[idx] = cur + 1;
  applySteps(idx);
  updateFooter();
  return true;
}

/* v2: reveal every remaining step at once (swipe-left escape hatch). */
function skipSteps(idx) {
  const total = cards[idx].steps || 0;
  if (!total || (stepState[idx] || 0) >= total) return false;
  stepState[idx] = total;
  applySteps(idx);
  updateFooter();
  return true;
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

/* Primary action. On a step card mid-build this reveals the next step; once
   the steps are done (or on a card with none) it advances, honoring the quiz
   gate exactly as v1 did. Shared by the Continue button and ArrowRight. */
function handleNext() {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  if (advanceStep(i)) return;
  go(i + 1);
}
nextBtn.onclick = handleNext;
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* v2: tapping anywhere on a step card advances one step; once built, a tap
   advances the card (gate permitting). Cards with no steps ignore taps, so
   this listener is inert on v1-style cards. Elements with their own behavior
   (quiz choices, links) are skipped so a tap never double-fires. */
vp.addEventListener('click', e => {
  const c = cards[i];
  if (!c.steps) return;
  if (e.target.closest('.choice, a')) return;
  if ((stepState[i] || 0) < c.steps) { advanceStep(i); return; }
  if (!nextBtn.disabled && !c.last) go(i + 1);
});

/* Keys and swipes only move between cards (or, for a step card, between
   steps). Leaving the lesson always takes a deliberate tap, so a stray swipe
   on the final card cannot navigate away. ArrowRight mirrors the Continue
   button step-wise; ArrowLeft mirrors Back. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) handleNext();
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  // Swipe left: skip any remaining steps and advance in one gesture, honoring
  // the quiz gate (updateFooter re-derives nextBtn.disabled after the skip).
  if (dx < -50 && !cards[i].last) { skipSteps(i); if (!nextBtn.disabled) go(i + 1); }
  if (dx > 50 && i > 0) go(i - 1);
});

render();

/* Back to quiz (additive). A "Review: Chapter N" link in a quiz explanation
   opens this lesson with ?back=<quiz path>, plus &tab=1 when it opened in a
   new tab. Only then a small bar above the progress segments offers the way
   back: closing the tab returns to the untouched quiz tab, otherwise it goes
   to the quiz path, which restores the session. No param, no change. */
(function () {
  let back = null, tab = false;
  try {
    const p = new URLSearchParams(location.search), b = p.get('back');
    tab = p.get('tab') === '1';
    if (b && b.charAt(0) === '/' && b.charAt(1) !== '/' && b.charAt(1) !== '\\') {
      const u = new URL(b, location.href);
      if (u.origin === location.origin) back = u.pathname + u.search;
    }
  } catch (e) { return; }
  if (!back) return;
  const bar = document.createElement('div');
  bar.style.cssText = 'position:relative;z-index:7;padding:14px 20px 0;';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = '← Back to quiz';
  btn.style.cssText = 'font:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--surface-2,rgba(255,255,255,0.06));border:1px solid var(--line,rgba(255,255,255,0.1));border-radius:999px;padding:7px 14px;cursor:pointer;';
  btn.onclick = () => {
    if (tab) { try { window.close(); } catch (e) {} setTimeout(() => { location.href = back; }, 300); }
    else location.href = back;
  };
  bar.appendChild(btn);
  const tb = document.getElementById('topbar');
  tb.parentNode.insertBefore(bar, tb);
})();
</script>
</body>
</html>
