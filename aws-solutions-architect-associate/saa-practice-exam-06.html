/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Full Mock Exam 2",
  badge: "AWS Solutions Architect Associate (SAA-C03)",
  blurb: "A full-length practice exam across all four SAA-C03 domains. Most questions have one best answer; a few ask you to select two.",
  coverage: "Mirrors the real exam shape: 65 questions sampled at the official domain weights, 20 Design Secure Architectures, 17 Design Resilient Architectures, 15 Design High-Performing Architectures and 13 Design Cost-Optimized Architectures, with their own healthcare and media scenarios.",
  minutes: 130,
  pass: 72
};

const QUESTIONS = [

  /* Ch 01 - AWS Global Infrastructure and the Shared Responsibility Model (K1.1.3, K1.1.5) */
  { ref:{chapter:1}, q:`A streaming company runs its video transcoding fleet on Amazon EC2 instances that it launched from its own AMI. A security assessment asks which party is responsible for patching the guest operating system and for the security group rules on those instances. What is the correct answer?`,
    opts:[
      "The company is responsible for both the guest OS patches and the security group rules",
      "AWS patches the guest OS, and the company manages the security group rules",
      "The company patches the guest OS, and AWS manages the security group rules",
      "AWS is responsible for both, because EC2 is an AWS service"
    ],
    correct:0,
    explain:`On EC2 the customer controls everything from the guest operating system up: patches, installed software, security group rules and data, while AWS secures the hardware, hypervisor and facilities. Option B is tempting because AWS patches the hosts under managed services such as RDS, but on EC2 the guest OS is the customer's. Security groups are customer-configured firewall rules.` },

  /* Ch 02 - Locking Down the Root User and IAM Users: MFA, Access Keys, Least Privilege (S1.1.1) */
  { ref:{chapter:2}, q:`A streaming company runs 25 member accounts in AWS Organizations, each created with its own root password and MFA device that a small team must look after. Security wants to reduce root credential risk across all member accounts with the least ongoing effort, while still being able to perform root-only tasks when needed. What should the architect do?`,
    opts:[
      "Create root access keys in every account and store them in AWS Secrets Manager",
      "Buy 25 hardware MFA devices and rotate the root passwords quarterly",
      "Enable centralized root access management, remove root credentials from the member accounts, and perform root-only tasks from the management account",
      "Delete the root user in each member account"
    ],
    correct:2,
    explain:`Centralized root access management lets the management account remove member root credentials and still carry out the few root-only tasks centrally, so there is nothing per account to guard. More MFA devices (B) protect the credentials but keep 25 sets to manage, which is the effort the company wants to drop. Root access keys are never recommended, and the root user cannot be deleted.` },

  /* Ch 03 - A Flexible Authorization Model: Users, Groups, Roles, Policies, and How AWS Evaluates Them (S1.1.2) */
  { ref:{chapter:3}, q:`A research role has an identity-based policy that allows <code>s3:GetObject</code> on the genomics bucket. The role also has a permissions boundary that allows only <code>dynamodb:*</code>. The organization's SCP is FullAWSAccess, and the bucket policy says nothing about the role. A GetObject call from the role is denied. Which TWO statements explain how AWS evaluated the request?`,
    opts:[
      "The permissions boundary does not allow s3:GetObject, so the request is implicitly denied even though the identity policy allows it",
      "An Allow in the identity-based policy overrides the permissions boundary",
      "Every applicable ceiling (SCP, permissions boundary, session policy) must allow the action before an identity-based Allow takes effect",
      "A permissions boundary grants the permissions it lists on its own",
      "The FullAWSAccess SCP grants the role access to the bucket"
    ],
    correct:[0,2],
    explain:`Boundaries and SCPs only limit: an action must be allowed by every ceiling and then by a policy that grants it, so a boundary without S3 leaves the request implicitly denied. Option B is tempting because the identity policy clearly allows the call, but an identity Allow never overrides a boundary. Neither boundaries nor SCPs grant anything themselves.` },

  /* Ch 04 - Role-Based Access with AWS STS: Role Switching and Cross-Account Access (S1.1.3) */
  { ref:{chapter:4}, q:`A hospital hires a third-party analytics vendor that will read de-identified data from an S3 bucket in the hospital's account. The vendor serves many customers from its own AWS account. The hospital wants no long-term credentials and protection against the confused deputy problem. What should it set up?`,
    opts:[
      "An IAM user for the vendor with access keys rotated every 90 days",
      "A role in the hospital's account that trusts the vendor's account and requires a unique external ID in its trust policy",
      "A public bucket policy limited to the vendor's IP addresses",
      "A role that trusts the vendor's account, with the external ID kept as a secret password"
    ],
    correct:1,
    explain:`A cross-account role issues temporary credentials, and requiring the external ID the vendor assigned to this customer stops another of the vendor's customers from tricking it into using the role. Option D describes the same role but treats the external ID as a secret, which it is not: anyone who can view the role sees it. IAM user keys are long-term credentials.` },

  /* Ch 05 - Multi-Account Security Strategy: AWS Organizations, SCPs, and AWS Control Tower (S1.1.4) */
  { ref:{chapter:5}, q:`A healthcare company must guarantee that no one in any member account, including account administrators, can stop or delete the organization's CloudTrail trails. New accounts are added every month. Which control meets this requirement?`,
    opts:[
      "An IAM policy in each account that denies CloudTrail changes to developers",
      "An AWS Config rule that reports trails that have been stopped",
      "A permissions boundary on every administrator role",
      "A service control policy on the organization root that denies cloudtrail:StopLogging and cloudtrail:DeleteTrail"
    ],
    correct:3,
    explain:`An SCP at the root caps every identity in every member account, including administrators and accounts added later, and cannot be removed from inside the account. A Config rule (B) only detects the change after it happens, so it does not guarantee anything. IAM policies and boundaries can be edited by the account administrators they are meant to restrict.` },

  /* Ch 06 - Resource-Based Policies vs Identity-Based Policies (S1.1.5) */
  { ref:{chapter:6}, q:`A publishing platform has an Amazon SNS topic that must deliver new-article notifications to an Amazon SQS queue in the same account. Messages never arrive in the queue. What should the architect add?`,
    opts:[
      "An IAM role that SNS assumes to write to the queue",
      "An SQS queue policy that allows the SNS service principal to send messages, with a condition on the topic's ARN",
      "An identity-based policy on the developers' IAM users that allows sqs:SendMessage",
      "A KMS key policy that allows the developers to decrypt messages"
    ],
    correct:1,
    explain:`When an AWS service acts on a resource, the resource-based policy is the place to allow it: the queue policy names sns.amazonaws.com and limits it to this topic with aws:SourceArn. A role for SNS (A) is tempting, but SNS delivers to SQS under the queue's resource policy, not by assuming a role. The developers' permissions do not affect what SNS can do.` },

  /* Ch 08 - Network Segmentation: Public Subnets, Private Subnets, and Subnet Tiers (S1.2.2) */
  { ref:{chapter:8}, q:`A patient portal has an internet-facing load balancer, application servers and a database. The application servers and database must never be reachable from the internet, and each tier must survive the loss of one Availability Zone. Which subnet design fits?`,
    opts:[
      "All three tiers in public subnets in one AZ, protected by security groups",
      "The load balancer and application servers in public subnets in two AZs, the database in a private subnet in one AZ",
      "All three tiers in the default VPC's subnets in two AZs",
      "The load balancer in public subnets in two AZs, and the application and database tiers in private subnets in the same two AZs"
    ],
    correct:3,
    explain:`Only the load balancer needs a route to the internet gateway; private subnets have none, so the app and database cannot be reached from the internet, and spreading each tier over two AZs survives an AZ loss. The default VPC (C) is tempting because it already spans AZs, but every default subnet is public. Option B exposes the app tier and leaves the database in one AZ.` },

  /* Ch 09 - Routing and Egress: Route Tables, Internet Gateways, and NAT Gateways (S1.2.1 (part)) */
  { ref:{chapter:9}, q:`A team creates a new subnet for a medical records database and does not associate a route table with it. A security scan then reports that the subnet has a route to the internet gateway. What is the best fix?`,
    opts:[
      "Remove the internet gateway route from the main route table, and give public subnets their own custom route table",
      "Delete the VPC's local route",
      "Attach a security group that denies all outbound traffic",
      "Move the database to a subnet in another VPC with no internet gateway"
    ],
    correct:0,
    explain:`A subnet without an explicit association uses the main route table, so keeping internet routes out of the main table means new subnets start private. A security group (C) only filters traffic and does not change where the subnet routes, so the scan finding would remain. The local route cannot be deleted, and a new VPC is far more work than fixing the route tables.` },

  /* Ch 10 - Security Groups vs Network ACLs (S1.2.1 (part)) */
  { ref:{chapter:10}, q:`A video platform sees abusive traffic from one /24 address range hitting every instance in a public subnet. The team wants to block that range for the whole subnet while leaving all other traffic unchanged. What should it use?`,
    opts:[
      "A deny rule in each instance's security group",
      "A new route table that sends the range to a blackhole",
      "A network ACL rule that denies the /24 range, numbered before the rule that allows web traffic",
      "AWS Shield Standard"
    ],
    correct:2,
    explain:`Network ACLs support deny rules, apply to the whole subnet, and are evaluated in number order, so a low-numbered deny for the range blocks it before the allow rule. Security groups (A) are the usual primary control but have no deny rules at all, so they cannot block a single range. Route tables decide destinations, not sources.` },

  /* Ch 11 - VPC Endpoints: Gateway Endpoints vs Interface Endpoints (AWS PrivateLink) (K1.2.2) */
  { ref:{chapter:11}, q:`A hospital's on-premises imaging servers connect to a VPC over AWS Direct Connect. They must upload studies to Amazon S3 privately, without traversing the internet. The VPC already has an S3 gateway endpoint for its own instances. What should the architect add?`,
    opts:[
      "A route on premises that points S3 traffic at the gateway endpoint",
      "A NAT gateway in the VPC for the on-premises traffic",
      "An S3 interface endpoint in the VPC, used by the on-premises servers over Direct Connect",
      "S3 Transfer Acceleration on the bucket"
    ],
    correct:2,
    explain:`Interface endpoints are private IP addresses in the VPC, so on-premises clients can reach them over Direct Connect; gateway endpoints are route table entries usable only from inside the VPC. Option A is tempting because the gateway endpoint already exists, but it cannot be reached from on premises. A NAT gateway and Transfer Acceleration both use public paths.` },

  /* Ch 12 - Perimeter Protection: AWS WAF, AWS Shield, AWS Firewall Manager, and AWS Network Firewall (S1.2.3 (part)) */
  { ref:{chapter:12}, q:`A live sports streaming service expects large DDoS attacks during finals. It wants help from an AWS response team during an attack and protection against the scaling charges an attack could cause. What should it subscribe to?`,
    opts:[
      "AWS Shield Advanced on its CloudFront distributions and load balancers",
      "AWS WAF with a rate-based rule only",
      "Amazon GuardDuty",
      "AWS Shield Standard"
    ],
    correct:0,
    explain:`Shield Advanced adds access to the AWS Shield Response Team, attack visibility and DDoS cost protection. A WAF rate-based rule (B) helps against HTTP floods but brings no response team or cost protection. Shield Standard is already on for every customer at no charge and offers neither, and GuardDuty detects threats rather than absorbing attacks.` },

  /* Ch 13 - Application Secrets: AWS Secrets Manager vs Systems Manager Parameter Store (S1.2.3 (part)) */
  { ref:{chapter:13}, q:`A clinical application reads its Amazon RDS database password at runtime. Compliance requires the password to change every 30 days automatically, with no outage and no code that the team writes to rotate it. Where should the password be stored?`,
    opts:[
      "In a Parameter Store SecureString parameter",
      "In the application's environment variables, updated by a monthly deployment",
      "In an encrypted file inside the AMI",
      "In AWS Secrets Manager with automatic rotation configured on a 30-day schedule"
    ],
    correct:3,
    explain:`Secrets Manager rotates database credentials on a schedule with a managed rotation function, and applications fetch the current value at runtime. A Parameter Store SecureString (A) is encrypted and fetched at runtime too, but Parameter Store has no built-in rotation, so the team would have to build it. Values in AMIs or environment files are never the answer.` },

  /* Ch 15 - Threat Detection and Posture: GuardDuty, Macie, Inspector, Security Hub, Detective (K1.2.5) */
  { ref:{chapter:15}, q:`A health insurer wants continuous threat detection that analyzes CloudTrail events, VPC Flow Logs and DNS logs, and alerts when an EC2 instance starts communicating with known malicious IP addresses or mining cryptocurrency. Which service fits?`,
    opts:[
      "Amazon Inspector",
      "Amazon GuardDuty",
      "Amazon Macie",
      "AWS Artifact"
    ],
    correct:1,
    explain:`GuardDuty analyzes logs and activity such as CloudTrail, VPC Flow Logs and DNS queries to find active threats like contact with known bad IPs or crypto mining. Inspector (A) is the tempting security scanner, but it looks for software vulnerabilities and exposure, not live malicious behavior. Macie finds sensitive data in S3, and Artifact holds compliance reports.` },

  /* Ch 16 - Securing External Connections: Site-to-Site VPN, Client VPN, and Direct Connect (S1.2.4) */
  { ref:{chapter:16}, q:`Three hundred clinicians need secure access from their own laptops to internal applications in a VPC, signing in with the hospital's Active Directory credentials, with access limited by AD group. What should the architect deploy?`,
    opts:[
      "An AWS Site-to-Site VPN connection to each clinician's home router",
      "An AWS Direct Connect connection",
      "Public IP addresses on the application servers, protected by security groups",
      "AWS Client VPN with Active Directory authentication and authorization rules per group"
    ],
    correct:3,
    explain:`Client VPN gives individual users an encrypted connection from their own devices, authenticates them against Active Directory, and authorizes each group to specific networks. Site-to-Site VPN (A) connects whole networks through a customer gateway device, not individual laptops. Direct Connect is a dedicated line for sites, and public IPs expose the applications.` },

  /* Ch 17 - Meeting Compliance Requirements: AWS Config, CloudTrail, AWS Artifact, and Macie (S1.3.1) */
  { ref:{chapter:17}, q:`Before storing patient data on AWS, a hospital's compliance officer must review AWS's SOC reports and accept a Business Associate Addendum with AWS. Where are these obtained?`,
    opts:[
      "AWS Config conformance packs",
      "AWS Artifact",
      "AWS CloudTrail Lake",
      "Amazon Macie"
    ],
    correct:1,
    explain:`AWS Artifact provides on-demand access to AWS compliance reports and lets customers review and accept agreements with AWS. Config conformance packs (A) check the customer's own resources against rules, which is useful later but says nothing about AWS's controls. CloudTrail records API activity, and Macie finds sensitive data in S3.` },

  /* Ch 18 - Encrypting Data at Rest with AWS KMS (S1.3.2) */
  { ref:{chapter:18}, q:`A media archive bucket uses SSE-KMS with a customer managed key and receives millions of small objects a day. AWS KMS request charges and request volume have become a problem. What change reduces them most while keeping SSE-KMS?`,
    opts:[
      "Switch the bucket to SSE-C",
      "Create a new KMS key every month",
      "Enable S3 Bucket Keys on the bucket",
      "Move the bucket to another Region"
    ],
    correct:2,
    explain:`An S3 Bucket Key lets S3 use a bucket-level key derived from the KMS key, so S3 stops calling KMS for every object and KMS requests and costs fall sharply. SSE-C (A) removes KMS calls but abandons SSE-KMS, its key policy control and its CloudTrail audit, and makes the company manage keys itself. New keys or Regions do not change the per-object calls.` },

  /* Ch 19 - Encrypting Data in Transit: AWS Certificate Manager and TLS (S1.3.3) */
  { ref:{chapter:19}, q:`A streaming site's origin runs in eu-west-1 behind an ALB. The team requested a public ACM certificate for www.example.com in eu-west-1, but the certificate does not appear when they configure the Amazon CloudFront distribution. What should they do?`,
    opts:[
      "Request or import the certificate in US East (N. Virginia) and select it on the distribution",
      "Copy the eu-west-1 certificate to the CloudFront distribution with the ACM console",
      "Export the certificate's private key and upload it to the distribution",
      "Switch the certificate to email validation"
    ],
    correct:0,
    explain:`CloudFront only uses ACM certificates in US East (N. Virginia), wherever the origin runs. Copying the certificate (B) sounds natural, but ACM certificates are Regional and cannot be copied between Regions; a new one must be requested in us-east-1. Changing validation does not change the Region.` },

  /* Ch 20 - Access Policies for Encryption Keys: KMS Key Policies and Grants (S1.3.4) */
  { ref:{chapter:20}, q:`Objects in an S3 bucket in account A are encrypted with a customer managed KMS key in account A. An analytics role in account B already has bucket access through the bucket policy, but every GetObject call fails with an access denied error from KMS. What must be done?`,
    opts:[
      "Allow account B in the KMS key policy, and allow kms:Decrypt on the key in the role's IAM policy in account B",
      "Allow kms:Decrypt in the role's IAM policy in account B only",
      "Re-encrypt the objects with the AWS managed key for S3",
      "Create a grant in account B for its own key"
    ],
    correct:0,
    explain:`Cross-account use of a KMS key needs both sides: the key policy in account A must allow account B, and the caller's IAM policy in B must allow the KMS action. Option B is tempting because it fixes the caller's side, but without the key policy allowing account B no IAM policy can grant use of the key. AWS managed keys cannot be shared across accounts.` },

  /* Ch 22 - Data Access, Lifecycle, and Protection Policies: Block Public Access, Object Ownership, Versioning, Object Lock (S1.3.6) */
  { ref:{chapter:22}, q:`A publisher must keep signed contracts in S3 so that no one, not even the root user, can delete or overwrite them for seven years, and any accidental overwrite of other files in the bucket must be recoverable. Which TWO settings meet these requirements?`,
    opts:[
      "Enable S3 Versioning on the bucket",
      "Use S3 Object Lock in governance mode with a seven-year retention period",
      "Use S3 Object Lock in compliance mode with a seven-year retention period",
      "Add a lifecycle rule that expires objects after seven years",
      "Enable MFA delete and nothing else"
    ],
    correct:[0,2],
    explain:`Versioning keeps every overwritten version recoverable and is required for Object Lock; compliance mode then blocks deletion or overwriting by anyone, including root, until retention ends. Governance mode (B) looks similar, but users with special permissions can bypass it, which fails "not even the root user". An expiry rule deletes data rather than protecting it.` },

  /* Ch 23 - Rotating Encryption Keys and Renewing Certificates (S1.3.7) */
  { ref:{chapter:23}, q:`A telehealth portal's Application Load Balancer uses a certificate that the company bought from a third-party authority and imported into ACM. It expires in 30 days. What must the team do to keep the site working?`,
    opts:[
      "Nothing: ACM renews every certificate it stores automatically",
      "Enable automatic key rotation on the certificate",
      "Get a new certificate from the issuer and reimport it into ACM over the existing one",
      "Switch the listener to HTTP until the certificate renews"
    ],
    correct:2,
    explain:`ACM renews only certificates it issued; an imported certificate must be replaced by reimporting a new one, which keeps the same ARN and load balancer association. Option A is tempting because ACM-issued certificates do renew on their own, but imported ones never do, so the site would break at expiry. Certificates have no key rotation setting.` },

  /* Ch 24 - Architecture Styles: Multi-Tier vs Microservices vs Event-Driven (S2.1.1) */
  { ref:{chapter:24}, q:`When a podcast network publishes an episode, four systems must react: transcoding, transcript generation, subscriber notifications and the search index. More systems will be added next year, and the publishing service must not change each time. Which architecture style fits best?`,
    opts:[
      "A multi-tier application where the publishing service calls each system in turn",
      "Event-driven: the publishing service emits an 'episode published' event to an event bus, and each system subscribes with its own rule",
      "Microservices that call each other synchronously over REST",
      "A single larger instance running all five systems"
    ],
    correct:1,
    explain:`In an event-driven design the producer emits one event and any number of consumers react, so new systems are added as new rules without touching the publisher. Synchronous microservices (C) split the code but still make the publisher know and wait on every consumer, so each new system means a change. One instance couples everything together.` },

  /* Ch 25 - Scaling Strategies: Out vs Up, and Designing Stateless Components (S2.1.2) */
  { ref:{chapter:25}, q:`A video-on-demand site runs in an Auto Scaling group behind an ALB. Viewers lose their watch history and are signed out whenever the group scales in, because sessions are kept in each instance's memory. What is the best fix?`,
    opts:[
      "Enable sticky sessions on the ALB",
      "Disable scale-in on the Auto Scaling group",
      "Replace the group with one larger instance",
      "Store sessions in a shared store such as Amazon ElastiCache or DynamoDB so any instance can serve any request"
    ],
    correct:3,
    explain:`Moving session state out of the instances makes the tier stateless, so scaling in or out no longer loses anything. Sticky sessions (A) are tempting because they keep a viewer on one instance, but that instance still disappears on scale-in, taking the session with it. Disabling scale-in or scaling up gives up elasticity and availability.` },

  /* Ch 26 - Decoupling with Amazon SQS: Standard vs FIFO, Visibility Timeout, Dead-Letter Queues (K2.1.2, K2.1.11) */
  { ref:{chapter:26}, q:`Workers poll an Amazon SQS standard queue for lab result reports. Each report takes about 90 seconds to process, and the queue uses the default visibility timeout. Many reports are processed twice. What should the team change?`,
    opts:[
      "Switch to a FIFO queue",
      "Raise the queue's visibility timeout above the processing time, for example to 3 minutes",
      "Enable long polling with a 20-second wait time",
      "Add a delay queue of 15 minutes"
    ],
    correct:1,
    explain:`The default visibility timeout is 30 seconds, so a message becomes visible again while the first worker is still working on it and a second worker picks it up; setting the timeout above the processing time fixes that. FIFO (A) is tempting for exactly-once processing, but the root cause is the timeout and would remain. Long polling and delays do not affect redelivery.` },

  /* Ch 27 - Services for Loose Coupling: SQS vs SNS vs EventBridge vs Amazon MQ (S2.1.3) */
  { ref:{chapter:27}, q:`A laboratory system publishes each completed test result. The billing system, the patient notification service and the research data warehouse must each receive every result and process it at their own pace, even if one of them is down for an hour. What should the architect build?`,
    opts:[
      "One SQS queue that all three systems poll",
      "Direct HTTPS calls from the laboratory system to each consumer",
      "An Amazon MQ broker with one consumer",
      "An SNS topic with three SQS queues subscribed, one per consuming system"
    ],
    correct:3,
    explain:`SNS fans out a copy of each result to every subscribed queue, and each queue buffers messages until its own consumer is ready. A single queue (A) delivers each message to only one worker, so the three systems would split the results instead of each getting all of them. Direct calls fail whenever a consumer is down.` },

  /* Ch 28 - When to Use Containers: ECS vs EKS, EC2 Launch Type vs Fargate (S2.1.4) */
  { ref:{chapter:28}, q:`A small media team wants to run its long-running ad-insertion service in containers. It has no Kubernetes experience or requirement, traffic is unpredictable, and it wants the least operational overhead with no servers to manage. Which option fits?`,
    opts:[
      "Amazon ECS with the Fargate launch type",
      "Amazon EKS on a self-managed EC2 node group",
      "Amazon ECS on EC2 instances the team patches",
      "AWS Lambda with a 15-minute timeout"
    ],
    correct:0,
    explain:`ECS is the AWS-native orchestrator with no control plane to run, and Fargate removes the servers, scaling capacity with the tasks. EKS (B) suits teams that already use Kubernetes or need its portability, which this team does not, and self-managed nodes add work. Lambda's 15-minute limit rules out a long-running service.` },

  /* Ch 29 - When to Use Serverless: AWS Lambda Patterns and Limits (S2.1.5) */
  { ref:{chapter:29}, q:`An S3 upload event invokes a Lambda function asynchronously to create thumbnails for a photo library. Occasionally a malformed file makes the function fail, and after a few attempts those events vanish without a trace. What should the team configure?`,
    opts:[
      "Provisioned concurrency for the function",
      "A larger memory setting",
      "An on-failure destination (or a dead-letter queue) for the function's asynchronous invocations",
      "A longer function timeout of 15 minutes"
    ],
    correct:2,
    explain:`Lambda retries a failed asynchronous invocation twice and then discards the event unless an on-failure destination or dead-letter queue captures it for inspection. More memory (B) might speed up good files but does nothing about events that fail and are dropped. Provisioned concurrency only removes cold starts.` },

  /* Ch 30 - Amazon API Gateway: REST vs HTTP vs WebSocket APIs (K2.1.1) */
  { ref:{chapter:30}, q:`A live events platform wants viewers' apps to receive chat messages and score updates pushed from the backend in real time, over a long-lived two-way connection, without the clients polling. Which API Gateway API type fits?`,
    opts:[
      "A REST API with caching enabled",
      "An HTTP API with JWT authorizers",
      "A WebSocket API",
      "A private REST API behind an interface endpoint"
    ],
    correct:2,
    explain:`WebSocket APIs keep a persistent two-way connection, so the backend can push messages to connected clients as they happen. A REST API with caching (A) serves repeated reads cheaply but is request and response only, so clients would have to poll. HTTP APIs are also request and response, and private APIs are for VPC callers.` },

  /* Ch 31 - Workflow Orchestration with AWS Step Functions (K2.1.16) */
  { ref:{chapter:31}, q:`A pharmacy chain is building a prescription workflow. Each prescription must wait for a licensed pharmacist to approve it, which can take up to three days, and a nightly job must check 2 million prescription records stored in S3 in parallel with retries. Which TWO Step Functions features fit these needs?`,
    opts:[
      "A Standard workflow that pauses with the .waitForTaskToken pattern until the pharmacist's approval returns the token",
      "An Express workflow that waits for the approval",
      "Lambda functions that invoke each other and sleep until approval arrives",
      "A Distributed Map state that reads the records from S3 and runs a child workflow per batch",
      "An SQS queue that a cron script polls every minute"
    ],
    correct:[0,3],
    explain:`Standard workflows run for up to a year and support the callback pattern, so an execution can pause for days until the approver sends the task token back; Distributed Map processes huge S3 data sets as parallel child workflows. Express workflows (B) are tempting for cost, but they last at most five minutes and do not support callbacks. Chained, sleeping Lambdas bill while they wait and cap at 15 minutes.` },

  /* Ch 32 - Purpose-Built Services: Managed AI Services as Architecture Components (S2.1.7 = S2.2.8) */
  { ref:{chapter:32}, q:`A video publisher must produce text transcripts of its English programs and subtitles in Spanish and French, with the least development effort and no machine learning expertise. Which combination fits?`,
    opts:[
      "Amazon Transcribe for the transcripts, then Amazon Translate for the other languages",
      "Amazon Polly for the transcripts, then Amazon Comprehend for the other languages",
      "Train custom speech and translation models in Amazon SageMaker AI",
      "Amazon Rekognition to read the speech from the video frames"
    ],
    correct:0,
    explain:`Transcribe turns speech into text and Translate converts that text into other languages, both as pre-trained APIs with no models to build. Polly (B) is the tempting speech service, but it goes the other way, turning text into audio, and Comprehend analyzes text rather than translating it. Training models in SageMaker AI is never the least-effort answer for common tasks.` },

  /* Ch 33 - Automating for Infrastructure Integrity: Immutable Infrastructure with AWS CloudFormation (S2.2.1) */
  { ref:{chapter:33}, q:`A healthcare company must deploy the same logging and security baseline stack to 40 accounts in three Regions, keep every copy identical, and update all of them in one operation when the baseline changes. What should it use?`,
    opts:[
      "Run the CloudFormation template by hand in each account and Region",
      "AWS Systems Manager Patch Manager",
      "Golden AMIs built with EC2 Image Builder",
      "AWS CloudFormation StackSets from an administrator account"
    ],
    correct:3,
    explain:`StackSets create, update or delete the same stack across many accounts and Regions in one operation, keeping every copy in line with the template. Running the template by hand (A) uses the same code but over 120 separate deployments, inviting drift and missed updates. Patch Manager patches instances, and AMIs cover server images, not account baselines.` },

  /* Ch 34 - Services for High Availability Across AZs and Regions (S2.2.2) */
  { ref:{chapter:34}, q:`A streaming service stores viewer profiles and watch progress. Viewers in North America and Europe must be able to update their data in their nearest Region with low latency, and the service must keep working if an entire Region fails. Which database design fits?`,
    opts:[
      "Amazon Aurora Global Database with the primary in North America",
      "Amazon DynamoDB global tables with replicas in both Regions",
      "A single RDS Multi-AZ instance in North America",
      "DynamoDB in one Region with on-demand backups copied to Europe"
    ],
    correct:1,
    explain:`DynamoDB global tables are multi-active: each Region's replica accepts writes and replicates to the others, so users write locally and either Region can carry on alone. Aurora Global Database (A) survives a Region loss too, but it has a single writer Region, so European writes would cross the Atlantic. Multi-AZ protects against AZ failure only.` },

  /* Ch 35 - Amazon Route 53: Routing Policies and Health Checks for Failover (K2.2.1, K2.2.6) */
  { ref:{chapter:35}, q:`Licensing rules require a video service to send viewers in European countries to its EU deployment and everyone else to its US deployment, based on where the viewer is, not on which Region answers fastest. Which Route 53 routing policy fits?`,
    opts:[
      "Latency-based routing",
      "Weighted routing at 50 percent each",
      "Simple routing with both IP addresses",
      "Geolocation routing with a default record for all other locations"
    ],
    correct:3,
    explain:`Geolocation routing answers based on the user's country or continent, with a default record for everyone else, which is what licensing by location needs. Latency-based routing (A) is tempting because the EU Region is usually fastest for Europeans, but it routes by measured latency, so some viewers could land in the wrong Region. Weighted and simple routing ignore location.` },

  /* Ch 36 - Metrics That Match the Business: CloudWatch Alarms and AWS X-Ray (S2.2.3) */
  { ref:{chapter:36}, q:`A telehealth booking site has almost no traffic between midnight and 6:00. Last week the site was down at 2:00 and nobody noticed until morning, because its error-rate alarms saw no requests at all. What should the team add?`,
    opts:[
      "A lower threshold on the existing error-rate alarm",
      "An Amazon CloudWatch Synthetics canary that runs the booking flow every few minutes, with an alarm on its success rate",
      "A composite alarm combining CPU and memory alarms",
      "AWS X-Ray tracing on the booking service"
    ],
    correct:1,
    explain:`A canary sends its own scripted requests on a schedule, so it detects an outage even when no real users are there to generate errors. Lowering the threshold (A) still depends on real traffic, and with no requests there is nothing to measure. Composite alarms reduce noise, and X-Ray traces requests that actually happen.` },

  /* Ch 37 - Mitigating Single Points of Failure (S2.2.4) */
  { ref:{chapter:37}, q:`After a brief outage of a patient records API, thousands of mobile clients retried at the same instant every second, and the flood kept the recovering service down for another 20 minutes. Which change prevents this?`,
    opts:[
      "Retry immediately and more often so requests succeed sooner",
      "Remove retries from the clients entirely",
      "Have clients retry with exponential backoff, random jitter and a retry cap",
      "Add a second API in the same Availability Zone"
    ],
    correct:2,
    explain:`Backoff spaces retries out, jitter spreads clients so they stop retrying in lockstep, and a cap stops endless attempts, so a recovering service is not crushed. Removing retries (B) avoids the flood but turns every brief blip into a user-facing failure. Faster retries make the storm worse.` },

  /* Ch 38 - Data Durability and Availability: Storage Characteristics and Backup Strategy (S2.2.5) */
  { ref:{chapter:38}, q:`A clinic stores its only copy of scanned consent forms on an Amazon EFS One Zone file system to save money. An auditor points out that the forms are irreplaceable. What change best protects them against an AZ-level event and accidental deletion?`,
    opts:[
      "Move to an EFS Regional file system and protect it with automatic backups in AWS Backup",
      "Copy the forms to S3 One Zone-IA as a second copy",
      "Add more mount targets to the One Zone file system",
      "Enable EFS lifecycle management to move files to Infrequent Access"
    ],
    correct:0,
    explain:`A Regional file system stores data redundantly across AZs, and backups with retention recover files that are deleted or corrupted, which replication alone would copy faithfully. S3 One Zone-IA (B) adds a second copy, but it also lives in a single AZ, so the same AZ-level event could take both. Lifecycle changes the price, not the durability.` },

  /* Ch 39 - Selecting a Disaster Recovery Strategy Against RPO and RTO (S2.2.6) */
  { ref:{chapter:39}, q:`A hospital's billing system needs an RPO of a few minutes, but the business accepts an RTO of a few hours and wants to keep spending in the recovery Region as low as possible. Which DR strategy fits?`,
    opts:[
      "Pilot light: replicate the data continuously, keep the application servers off, and start them from infrastructure as code during a disaster",
      "Warm standby: run a scaled-down copy of the full stack serving no traffic",
      "Backup and restore from nightly snapshots",
      "Active/active across two Regions"
    ],
    correct:0,
    explain:`Pilot light keeps data current with continuous replication, meeting the minutes-level RPO, while compute stays off until needed, which fits an RTO of hours at low cost. Warm standby (B) would also meet the targets but keeps servers running all the time, costing more than the business needs. Nightly backups risk a day of data, and active/active is the most expensive.` },

  /* Ch 40 - Making Legacy Applications Reliable Without Code Changes (S2.2.7) */
  { ref:{chapter:40}, q:`A vendor's records application, which cannot be modified, opens a new database connection for every request to its Amazon RDS for MySQL Multi-AZ instance. Connection storms exhaust the database during peaks and after each failover. The team may only change the database endpoint in the application's configuration. What should it do?`,
    opts:[
      "Add read replicas and point the application at them",
      "Rewrite the application to use a connection pool",
      "Put Amazon RDS Proxy in front of the database and point the application's configuration at the proxy endpoint",
      "Move the database to a larger instance class"
    ],
    correct:2,
    explain:`RDS Proxy pools and reuses connections, absorbs surges, and keeps client connections open through a Multi-AZ failover, needing only an endpoint change. Rewriting the application (B) would fix it properly, but the vendor forbids code changes. Read replicas do not take the writes, and a bigger instance only raises the ceiling the storms hit.` },

  /* Ch 41 - Storage Configurations for Performance: EBS Volume Types, Instance Store, S3 Throughput, FSx for Lustre (S3.1.1) */
  { ref:{chapter:41}, q:`A video transcoding fleet writes large temporary intermediate files during each job and needs the highest possible local I/O. The intermediate files are discarded when the job ends, and the source and output files live in S3. Where should the intermediate files go?`,
    opts:[
      "EBS io2 Block Express volumes with maximum provisioned IOPS",
      "Instance store volumes on an instance type that includes them",
      "An Amazon EFS file system",
      "S3 Standard"
    ],
    correct:1,
    explain:`Instance store disks are physically attached to the host, give the fastest local I/O and are included in the instance price; losing their data on stop or termination does not matter for scratch files. io2 Block Express (A) is fast and durable, but durability is wasted on throwaway data and every provisioned IOPS is billed. EFS and S3 are network storage.` },

  /* Ch 42 - Storage That Scales: Object vs File vs Block (S3.1.2) */
  { ref:{chapter:42}, q:`An animation studio's render farm of Linux instances spread across three AZs must read and write the same project files through a standard POSIX file system. Storage grows unpredictably and nobody wants to manage capacity. Which storage fits?`,
    opts:[
      "Amazon EBS gp3 volumes with Multi-Attach",
      "Amazon S3, accessed with the AWS CLI from each node",
      "Instance store on each render node",
      "An Amazon EFS Regional file system mounted on every node"
    ],
    correct:3,
    explain:`EFS is an elastic NFS file system that many Linux instances across AZs mount at once, growing and shrinking with the data. S3 (B) scales without limit, but it is object storage over an API, not a mounted POSIX file system the render software can use directly. EBS volumes live in one AZ, and instance store is local to each node.` },

  /* Ch 44 - Scaling Metrics and Conditions: EC2 Auto Scaling Policies (S3.2.2) */
  { ref:{chapter:44}, q:`A news publisher's web tier runs in an Auto Scaling group behind an ALB. The pages are light on CPU, but each instance handles about 500 requests per second comfortably before responses slow down. The team wants capacity to follow traffic with the least tuning. Which policy fits?`,
    opts:[
      "Step scaling on average CPU utilization",
      "Target tracking on the ALB request count per target, with a target of about 500",
      "Simple scaling with a 300-second cooldown",
      "Scheduled scaling that doubles capacity at 9:00 every day"
    ],
    correct:1,
    explain:`Target tracking holds a metric near a target with alarms managed for it, and requests per target measures the thing that actually runs out on this tier. Step scaling on CPU (A) watches a metric that stays low here, so the tier would slow down before any alarm fired, and it needs more tuning. Simple and scheduled scaling are coarser.` },

  /* Ch 46 - Resource Type and Size: Lambda Memory and Fargate Task Size (S3.2.4) */
  { ref:{chapter:46}, q:`A health app's API runs as Amazon ECS tasks on Fargate. Each task requests 4 vCPU and 16 GB, but Container Insights shows peak use of 0.5 vCPU and 2 GB per task, and the service already scales the number of tasks with load. What should the team change to cut cost without hurting performance?`,
    opts:[
      "Move the API to Lambda with 10,240 MB of memory",
      "Switch the tasks to the EC2 launch type",
      "Raise the service's minimum task count",
      "Reduce each task's size to a smaller CPU and memory pair that covers one task's peak with headroom"
    ],
    correct:3,
    explain:`Fargate bills the vCPU and memory each task requests, used or not, so sizing a task for one copy's real peak and letting the service add tasks cuts cost directly. Moving to the EC2 launch type (B) changes who manages servers but leaves the same oversized requests in place. A bigger minimum adds cost, and a maximum-memory Lambda is oversized too.` },

  /* Ch 47 - Configuring Read Replicas (S3.3.1) */
  { ref:{chapter:47}, q:`A patient app saves profile changes to an Aurora PostgreSQL cluster and immediately reloads the profile through the cluster's reader endpoint. Users sometimes see their old details for a moment after saving. What should the developers do?`,
    opts:[
      "Send reads that must reflect a user's own recent write to the writer (cluster) endpoint",
      "Add more Aurora Replicas",
      "Convert the replicas to a Multi-AZ standby",
      "Enable Aurora Global Database"
    ],
    correct:0,
    explain:`Aurora Replicas are asynchronous, so a read that follows a write can briefly miss it; read-after-write paths should use the writer endpoint while other reads stay on the reader endpoint. More replicas (B) spread the read load but each one can lag in the same way, so the stale read remains. Global Database adds Regions, not consistency.` },

  /* Ch 49 - Choosing an Engine: MySQL vs PostgreSQL, Amazon RDS vs Amazon Aurora (S3.3.3 = S4.3.2) */
  { ref:{chapter:49}, q:`A clinical trials platform depends on PostgreSQL features such as rich SQL and extensions. Its data grows unpredictably, the team does not want to size storage, and it needs low-lag read replicas with fast failover. Which option fits best?`,
    opts:[
      "Amazon RDS for MySQL with gp3 storage",
      "Amazon RDS for PostgreSQL with Provisioned IOPS storage sized for three years",
      "Amazon Aurora PostgreSQL-Compatible Edition",
      "Amazon DynamoDB"
    ],
    correct:2,
    explain:`Aurora PostgreSQL keeps the PostgreSQL engine the app depends on, and its shared cluster storage grows automatically while Aurora Replicas read the same volume with low lag and fast failover. RDS for PostgreSQL (B) keeps the engine too, but storage must be sized and paid for up front, and its replicas have their own storage with more lag. MySQL and DynamoDB change the engine.` },

  /* Ch 50 - Choosing a Database Type: Relational, Key-Value, Document, Graph, Wide-Column, In-Memory, Warehouse (S3.3.4) */
  { ref:{chapter:50}, q:`A streaming service wants real-time recommendations such as "viewers connected to people who watched this also liked", traversing relationships several hops deep between viewers, titles, genres and actors. Self-joins in its relational database are too slow. Which database type fits?`,
    opts:[
      "A key-value store such as Amazon DynamoDB",
      "A data warehouse such as Amazon Redshift",
      "A graph database such as Amazon Neptune",
      "An in-memory cache such as Amazon ElastiCache"
    ],
    correct:2,
    explain:`Graph databases store nodes and edges, so multi-hop relationship queries are their native operation. DynamoDB (A) gives fast lookups by key at any scale, but traversing arbitrary relationships several hops deep is not what its access patterns are designed for. Redshift is for analytics scans, and a cache only speeds up reads of another store.` },

  /* Ch 51 - Integrating Caching: ElastiCache Lazy Loading vs Write-Through, and DAX (S3.3.5) */
  { ref:{chapter:51}, q:`A medication dosage service caches drug records in ElastiCache in front of RDS. Pharmacists must never see an outdated dosage from the cache after a record is updated, and reads vastly outnumber writes. Which caching strategy fits?`,
    opts:[
      "Write-through: update the cache whenever the database record is written",
      "Lazy loading with a 24-hour TTL",
      "Lazy loading with no TTL",
      "No cache; scale the database up instead"
    ],
    correct:0,
    explain:`Write-through updates the cache on every write, so cached records always match the database. Lazy loading with a TTL (B) is the common default, but it fills the cache only on a miss, so an updated dosage can stay stale in the cache until the TTL runs out. With no TTL, stale entries could live indefinitely.` },

  /* Ch 53 - Network Configurations That Scale: CIDR Planning, IPv6, and Subnet Sizing (S3.4.2) */
  { ref:{chapter:53}, q:`A media company's Amazon EKS cluster gives every pod a VPC IP address. As the cluster grows, pods stay pending and node launches fail with insufficient free addresses in the /22 subnets. The VPC's primary CIDR cannot change. What should the architect do?`,
    opts:[
      "Resize the existing subnets to /20",
      "Move the cluster to the default VPC",
      "Lower the cluster's maximum node count",
      "Associate a secondary CIDR block such as 100.64.0.0/16 with the VPC, create larger subnets in it, and place the pods there"
    ],
    correct:3,
    explain:`A VPC can take secondary CIDR blocks, and the 100.64.0.0/10 range is commonly used for pod addresses, so new larger subnets give the cluster room to grow. Resizing subnets (A) sounds like the direct fix, but neither a subnet nor the primary CIDR can be resized once created. Capping nodes just stops growth.` },

  /* Ch 54 - Placing Resources: Placement Groups, Local Zones, AWS Wavelength, AWS Outposts (S3.4.3) */
  { ref:{chapter:54}, q:`A post-production studio in Los Angeles edits high-resolution video on virtual workstations and needs single-digit millisecond latency from its office to the compute. The nearest AWS Region is several hundred miles away. What should the architect use?`,
    opts:[
      "AWS Wavelength Zones",
      "An AWS Local Zone in Los Angeles, with a subnet for the workstations",
      "A cluster placement group in the nearest Region",
      "Amazon CloudFront"
    ],
    correct:1,
    explain:`Local Zones put compute and storage in a metro area near users, giving single-digit millisecond latency for work such as media editing. Wavelength (A) also brings compute close to users, but it sits inside carrier 5G networks for mobile devices, not an office network. A placement group stays in the distant Region, and CloudFront caches content rather than running workstations.` },

  /* Ch 55 - Load Balancing Strategy: ALB vs NLB vs GWLB (S3.4.4 = S4.2.1) */
  { ref:{chapter:55}, q:`A streaming platform needs two load balancers. The first serves its web and API traffic, routing /api and /video to different target groups and signing users in with Amazon Cognito. The second receives live video ingest from broadcast partners over UDP, and the partners allowlist fixed IP addresses. Which TWO choices meet these needs?`,
    opts:[
      "An Application Load Balancer for the web and API traffic",
      "A Network Load Balancer for the web and API traffic",
      "A Gateway Load Balancer for the UDP ingest",
      "A Network Load Balancer with an Elastic IP address per AZ for the UDP ingest",
      "An Application Load Balancer for the UDP ingest"
    ],
    correct:[0,3],
    explain:`ALBs work at layer 7 with path-based routing and built-in Cognito authentication; NLBs handle UDP at layer 4 and take a static or Elastic IP per AZ for partner allowlists. An NLB for the web traffic (B) is tempting for its speed, but it does not read HTTP paths or authenticate users. GWLB fronts inline security appliances, and ALBs do not carry UDP.` },

  /* Ch 57 - Streaming Architectures: Kinesis Data Streams vs Amazon Data Firehose vs Amazon MSK (S3.5.2) */
  { ref:{chapter:57}, q:`A publisher wants its website clickstream events delivered to S3 as Parquet files for Athena within a few minutes of arriving. It does not want to write or run any consumer code or manage capacity. Which service fits?`,
    opts:[
      "Kinesis Data Streams with a custom consumer application on EC2",
      "Amazon MSK with Kafka Connect",
      "Amazon SQS with a Lambda function that writes to S3",
      "Amazon Data Firehose with record format conversion to Parquet, delivering to S3"
    ],
    correct:3,
    explain:`Firehose is no-code delivery: it scales itself, buffers by size and time, and converts JSON records to Parquet before writing to S3. Kinesis Data Streams (A) handles the stream well, but delivering to S3 as Parquet means building and running the consumer the publisher wants to avoid. MSK suits existing Kafka applications.` },

  /* Ch 58 - Data Transfer Solutions: DataSync vs Transfer Family vs Physical Transfer (S3.5.3) */
  { ref:{chapter:58}, q:`A broadcaster must move an 800 TB archive of master tapes, already digitized onto local storage, into S3 within six weeks. Its only internet link is 200 Mbps and cannot be upgraded in time. What should it use?`,
    opts:[
      "AWS DataSync over the existing link",
      "AWS Data Transfer Terminal, carrying the data on its own storage devices to a transfer location",
      "AWS Transfer Family with an SFTP endpoint",
      "S3 Transfer Acceleration"
    ],
    correct:1,
    explain:`At 200 Mbps, 800 TB would take more than a year to send, so physical transfer is the only way to meet six weeks, and Data Transfer Terminal is the physical option open to new customers. DataSync (A) is the right tool for online migrations, but it is still limited by the 200 Mbps link. Transfer Family and Transfer Acceleration use the same link.` },

  /* Ch 60 - Compute for Data Processing: AWS Glue vs Amazon EMR vs AWS Batch (S3.5.5) */
  { ref:{chapter:60}, q:`A genomics lab must run a containerized variant-calling tool, not built on Spark, against 50,000 independent samples each week. Each sample takes 20 to 40 minutes, the work can be interrupted and restarted, and cost matters most. What should it use?`,
    opts:[
      "AWS Glue Spark jobs",
      "An Amazon EMR cluster running Hive",
      "AWS Batch array jobs on Spot capacity",
      "AWS Lambda functions, one per sample"
    ],
    correct:2,
    explain:`AWS Batch runs any container as queued jobs, array jobs fan one definition out across thousands of samples, and interruptible work fits Spot pricing. Glue (A) is the managed ETL choice, but it runs Spark jobs, and this tool is not built on Spark. Lambda's 15-minute limit is shorter than each sample's run.` },

  /* Ch 62 - Transforming Data Between Formats: CSV to Parquet with AWS Glue (S3.5.7) */
  { ref:{chapter:62}, q:`Each night, new CSV files of prescription claims land in an S3 raw zone that already holds five years of files. The data team wants them converted to partitioned Parquet for Athena without reprocessing the old files every run. What should it build?`,
    opts:[
      "An AWS Glue Spark job with job bookmarks enabled, writing compressed Parquet partitioned by date",
      "A Glue crawler alone, run every night",
      "An Athena CREATE TABLE query over the raw CSV files",
      "A larger Athena workgroup"
    ],
    correct:0,
    explain:`A Glue job converts the CSV to compressed, partitioned Parquet, and job bookmarks make each run process only files it has not seen. A crawler (B) is tempting because it is part of the pipeline, but it only catalogs data; it converts nothing. Querying the raw CSV still scans every row and column.` },

  /* Ch 66 - The Lowest Cost Method of Transferring Data to AWS Storage (S4.1.3) */
  { ref:{chapter:66}, q:`A hospital is retiring an on-premises NFS file server holding 40 TB and millions of files. The data must be copied into S3, re-synced every night with each transfer verified until cutover in three weeks, and the IT team has no time to build and maintain scripts. What is the most cost-effective approach?`,
    opts:[
      "AWS DataSync with a scheduled task from the NFS server to S3",
      "AWS Data Transfer Terminal",
      "An AWS Direct Connect connection with a custom copy script",
      "S3 Transfer Acceleration with the AWS CLI on a cron job"
    ],
    correct:0,
    explain:`DataSync's per-GB fee buys incremental syncs, scheduling and verification of every transfer, which replaces scripts the team cannot build; the link can carry 40 TB well within three weeks. Data Transfer Terminal (B) suits data too large for the link before a deadline, and it cannot do nightly re-syncs. Direct Connect takes weeks to provision, and Transfer Acceleration adds charges while still needing scripts.` },

  /* Ch 67 - When Storage Auto Scaling Is Required (S4.1.4) */
  { ref:{chapter:67}, q:`A media archive runs a self-managed PostgreSQL database on EC2. Its 2 TiB gp3 data volume is 90 percent full and grows steadily. The team wants to add capacity with the least disruption. What should it do?`,
    opts:[
      "Stop the instance, detach the volume and attach a new larger one",
      "Enable RDS storage autoscaling on the instance",
      "Increase the volume's size in place with Elastic Volumes, then extend the file system",
      "Change the volume to st1"
    ],
    correct:2,
    explain:`Elastic Volumes grow an EBS volume while it is in use, and extending the file system makes the space available without downtime. RDS storage autoscaling (B) is the answer for RDS databases, but this database is self-managed on EC2, so there is no such setting. Swapping volumes requires a stop and a data copy, and st1 changes performance, not size.` },

  /* Ch 69 - Selecting a Backup and Archival Solution (S4.1.6) */
  { ref:{chapter:69}, q:`A film studio must keep its raw camera footage for 10 years after each production. The footage is almost never read, and when it is, a wait of up to two days is acceptable. Which storage is the most cost-effective?`,
    opts:[
      "S3 Standard-IA",
      "S3 Glacier Deep Archive",
      "S3 Glacier Instant Retrieval",
      "EBS snapshots of the editing volumes"
    ],
    correct:1,
    explain:`Deep Archive is the lowest-cost storage class, built for data kept for years and rarely read, with restores in hours, well inside two days. Glacier Instant Retrieval (C) is archival too, but it charges more per GB for millisecond access the studio does not need. EBS snapshots are not an archive and cost more.` },

  /* Ch 70 - Hybrid Storage and Migration: AWS Storage Gateway vs DataSync vs Transfer Family (S4.1.7) */
  { ref:{chapter:70}, q:`A newspaper's on-premises editing workstations must keep saving to the same SMB file share, but the company wants the files stored in S3 at cloud prices, with recently used files cached locally for fast access. What should it deploy?`,
    opts:[
      "AWS DataSync from the file server to S3 every night",
      "AWS Transfer Family with an SFTP endpoint",
      "An Amazon FSx File Gateway",
      "An Amazon S3 File Gateway presenting an SMB share on premises"
    ],
    correct:3,
    explain:`S3 File Gateway presents NFS or SMB shares on premises, stores each file as an S3 object, and caches recent data locally. DataSync (A) copies data into S3, but it is for moves and syncs, so the workstations would still save to the local server. FSx File Gateway is no longer available to new customers, and Transfer Family is for partners using SFTP or similar.` },

  /* Ch 73 - EC2 Purchasing Options: On-Demand, Savings Plans, Reserved Instances, and Spot (K4.2.4) */
  { ref:{chapter:73}, q:`A hospital is moving a Microsoft SQL Server workload to EC2 and wants to bring its existing per-core SQL Server licenses, which require visibility of the physical cores and sockets the instances run on. Which option fits?`,
    opts:[
      "Spot Instances",
      "Amazon EC2 Dedicated Hosts",
      "Dedicated Instances",
      "On-Demand Instances with default tenancy"
    ],
    correct:1,
    explain:`Dedicated Hosts give a whole physical server with visibility of sockets and cores, which per-socket and per-core bring-your-own licenses require. Dedicated Instances (C) also run on single-tenant hardware, but they give no socket or core visibility or placement control. Spot and default tenancy share hardware.` },

  /* Ch 74 - Scaling Methods for Elastic Workloads: Horizontal vs Vertical, and EC2 Hibernation (S4.2.2) */
  { ref:{chapter:74}, q:`Instances in a video transcoding Auto Scaling group take 12 minutes to boot and load their codecs. To avoid slow starts during bursts, the team keeps 10 extra instances running all day. How can it keep fast scale-out while cutting this cost?`,
    opts:[
      "Replace the group with a few very large instances",
      "Buy Reserved Instances for the 10 idle instances",
      "Add a step scaling policy on CPU",
      "Configure a warm pool of pre-initialized instances kept in the Stopped state"
    ],
    correct:3,
    explain:`A warm pool keeps instances already initialized beside the group; stopped instances cost only their EBS volumes and Elastic IPs, and they join quickly when load rises. Reserved Instances (B) discount the idle instances but still pay for them around the clock. Larger instances lose elasticity, and a scaling policy does not shorten the 12-minute boot.` },

  /* Ch 76 - Availability by Workload Class: Production vs Non-Production (S4.2.4) */
  { ref:{chapter:76}, q:`A hospital runs a patient-facing scheduling app that must survive the loss of an Availability Zone, and a development copy used by four developers during weekday working hours with no uptime requirement. Which design is the most cost-effective?`,
    opts:[
      "Production across two AZs with RDS Multi-AZ; development in a single AZ with single-AZ RDS, stopped outside working hours",
      "Both environments across three AZs with RDS Multi-AZ, running 24/7",
      "Both environments in a single AZ to save money",
      "Production in a single AZ with nightly backups; development across two AZs"
    ],
    correct:0,
    explain:`Each class gets only the availability its users need: production pays for Multi-AZ resilience, while development runs small, in one AZ, and only during working hours. Running both Multi-AZ around the clock (B) meets production's need but doubles spending on a development copy nobody depends on. A single-AZ production design fails the AZ requirement.` },

  /* Ch 78 - Selecting an Instance Size: Right-Sizing with AWS Compute Optimizer (S4.2.6) */
  { ref:{chapter:78}, q:`An m5.4xlarge instance runs a content management system. Over the past month its CPU peaked at 9 percent and memory, published by the CloudWatch agent, peaked at 12 percent, and Compute Optimizer marks it over-provisioned. What is the most cost-effective change?`,
    opts:[
      "Move to an r5.4xlarge instance",
      "Buy a three-year Savings Plan covering the m5.4xlarge",
      "Resize to a smaller size in the same family, such as m5.xlarge, and verify performance",
      "Add a second m5.4xlarge for headroom"
    ],
    correct:2,
    explain:`Every resource is underused, so stepping down within the family cuts the price roughly in half per size while still covering the peak. A Savings Plan (B) lowers the rate, but it commits to paying for capacity the system does not use; right-size first, then commit. A memory optimized family or a second instance adds cost.` },

  /* Ch 79 - Database Backup and Retention Policies: Snapshot Frequency vs RPO (S4.3.1) */
  { ref:{chapter:79}, q:`A health records database on Amazon RDS needs an RPO of 5 minutes for day-to-day recovery, and regulators require a copy of the database from the end of every month, kept for seven years. Which TWO measures meet these requirements most cost-effectively?`,
    opts:[
      "Set the automated backup retention period to seven years",
      "Use automated backups with point-in-time recovery, with a retention window that matches the recovery policy",
      "Take a manual snapshot every five minutes and keep them for seven years",
      "Keep a monthly copy for seven years, for example with an AWS Backup plan rule or a monthly snapshot exported to S3",
      "Disable automated backups and rely on monthly snapshots"
    ],
    correct:[1,3],
    explain:`Automated backups with point-in-time recovery restore to within about five minutes, and one retained copy per month meets the regulators without keeping daily data for years. A seven-year automated retention (A) is not possible: automated backups top out at 35 days. Five-minute manual snapshots multiply storage to do what point-in-time recovery already does.` },

  /* Ch 81 - Cost-Effective Database Types: Columnar and Time-Series Data (S4.3.4) */
  { ref:{chapter:81}, q:`A streaming service's analysts run complex dashboards many times a day that scan billions of viewing events but read only a few columns. The queries run on an oversized RDS for MySQL instance that also serves the app. Which change is most cost-effective?`,
    opts:[
      "Upgrade the RDS instance to the largest class",
      "Add three read replicas of the same size for the dashboards",
      "Load the viewing events into Amazon Redshift, a columnar warehouse, and downsize the RDS instance to what the app needs",
      "Move the events to DynamoDB on-demand"
    ],
    correct:2,
    explain:`Columnar storage reads only the columns a query names, and with frequent, complex dashboards a warehouse such as Redshift fits better than per-query scanning; the RDS instance can then shrink. Read replicas (B) take the load off the primary, but each is still row-based and oversized for scans. DynamoDB is not built for analytical scans.` },

  /* Ch 84 - Network Connections for Cost: Direct Connect vs VPN vs Internet (S4.4.2) */
  { ref:{chapter:84}, q:`A visual effects studio renders in AWS and pulls about 80 TB of finished frames back to its data center every month, steadily, over the internet. Data transfer out is its largest AWS network charge. Which change lowers it most?`,
    opts:[
      "Order an AWS Direct Connect connection and move the transfers onto it",
      "Add a Site-to-Site VPN and send the transfers through it",
      "Enable S3 Transfer Acceleration",
      "Schedule the transfers at night, when the internet link is idle"
    ],
    correct:0,
    explain:`Direct Connect charges a lower per-GB rate for data leaving AWS, so at 80 TB a month the savings far outweigh the port-hours. A VPN (B) is cheap to add, but VPN traffic pays the standard data transfer out rate, the same as the internet, so the bill would barely change. Transfer Acceleration costs extra.` },

  /* Ch 86 - CDNs and Edge Caching: Amazon CloudFront vs AWS Global Accelerator (S4.4.4) */
  { ref:{chapter:86}, q:`A regional broadcaster serves its video catalog through Amazon CloudFront. Almost all of its viewers are in North America and Europe, and it wants to lower its CloudFront bill without moving off CloudFront. What should it change?`,
    opts:[
      "Put AWS Global Accelerator in front of the distribution",
      "Disable caching on the distribution",
      "Move the origin to a second Region",
      "Select a CloudFront price class that serves only from the lower-cost edge locations its viewers use"
    ],
    correct:3,
    explain:`A price class caps what the distribution pays by serving from fewer, cheaper edge locations, which costs little when viewers are concentrated in those areas. Global Accelerator (A) also uses the edge network, but it adds an hourly fee and a per-GB premium and caches nothing. Disabling caching would raise origin load and cost.` },

  /* Ch 88 - Selecting a Throttling Strategy (S4.4.6) */
  { ref:{chapter:88}, q:`A Lambda function writes patient intake forms to an RDS database that supports about 100 connections. During morning surges the function scales to 800 concurrent executions and the database starts refusing connections. Short delays in processing are acceptable. What should the team configure first?`,
    opts:[
      "Provisioned concurrency of 800 on the function",
      "Reserved concurrency on the function, set to a level the database can handle",
      "A larger memory setting for the function",
      "API Gateway usage plans with API keys for each patient"
    ],
    correct:1,
    explain:`Reserved concurrency caps how many copies of the function run at once, so the database never sees more connections than it can handle, and it also caps spend. Provisioned concurrency (A) keeps environments warm to remove cold starts, which would make the surge reach the database even faster. Memory and usage plans do not limit concurrency.` }
];

    74:["lesson-74-scaling-for-cost.html", "Scaling Methods for Elastic Workloads: Horizontal vs Vertical, and EC2 Hibernation"],
    75:["lesson-75-cost-effective-compute.html", "Cost-Effective Compute Services: Lambda vs Fargate vs EC2"],
    76:["lesson-76-availability-by-workload-class.html", "Availability by Workload Class: Production vs Non-Production"],
    77:["lesson-77-instance-family-for-cost.html", "Selecting an Instance Family for Cost"],

    79:["lesson-79-database-backup-retention.html", "Database Backup and Retention Policies: Snapshot Frequency vs RPO"],
    80:["lesson-80-cost-effective-database-services.html", "Cost-Effective Database Services: DynamoDB vs RDS, Serverless vs Provisioned"],

    85:["lesson-85-routing-transfer-costs.html", "Routing to Minimize Transfer Costs"],
    86:["lesson-86-cdn-and-edge.html", "CDNs and Edge Caching: Amazon CloudFront vs AWS Global Accelerator"],
    87:["lesson-87-network-optimization-review.html", "Reviewing Existing Workloads for Network Optimizations"],
    88:["lesson-88-throttling-strategy.html", "Selecting a Throttling Strategy"],

};
