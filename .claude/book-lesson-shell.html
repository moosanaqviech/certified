<!DOCTYPE html>
<html lang="en">
<head>
<!-- Book lesson shell (book engine v1). Copy to books/<book-id>/lesson-NN-name.html
     and edit ONLY the marked zones: title, canonical, palette, summary and the
     lesson JSON. The engine lives in books/engine/ and is shared by every lesson.
     Run: python3 scripts/validate_book.py books/<book-id> -->
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GBFP6K89Q6"></script>
<script data-ga>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-GBFP6K89Q6');
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- engine: book-v1 -->
<!-- ==== EDIT: lesson title ==== -->
<title>{{TITLE}}</title>
<!-- ==== EDIT: canonical. Self-referencing, absolute, keeps .html.
     Form: https://certify.courses/books/<book-id>/<this-filename>.html ==== -->
<link rel="canonical" href="{{CANONICAL}}">
<!-- Pilot: kept out of search until the book product launches. Remove at launch. -->
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="../../assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<link rel="manifest" href="../../site.webmanifest">
<meta name="theme-color" content="{{BG}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../engine/book-engine.v1.css">
<!-- ==== EDIT: palette. The four values from this book's book.json, unchanged. ==== -->
<style id="palette">:root{--bg:{{BG}};--tint:{{TINT}};--accent:{{ACCENT}};--ink:{{INK}}}</style>
<!-- Cloudflare Web Analytics --><script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "f87a00f33c654abdab2b4c9a42d5aa21"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>
<main id="app">
<!-- ==== EDIT: plain-text summary. Shown before the engine starts, to readers
     without JavaScript and to search engines. Two or three sentences. ==== -->
<article class="summary">
<h1>{{TITLE_PLAIN}}</h1>
<p>{{SUMMARY}}</p>
</article>
</main>
<!-- ==== EDIT: lesson JSON. Data only: no script, no HTML outside "art". ==== -->
<script type="application/json" id="lesson">
{{LESSON_JSON}}
</script>
<script src="../engine/book-engine.v1.js"></script>
</body>
</html>
