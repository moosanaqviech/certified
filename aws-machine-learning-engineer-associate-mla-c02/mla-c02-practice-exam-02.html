<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Practice Exam 2",
  badge: "AWS ML Engineer Associate (MLA-C02)",
  blurb: "Scenario-based questions across Unit 2, ML Model and Foundation Model Development. Most have one best answer; a few ask you to select two.",
  coverage: "Covers Unit 2 (Domain 2): all 19 chapters across Modules 2.1, 2.2, and 2.3. One question per chapter.",
  minutes: 38,
  pass: 72
};

const QUESTIONS = [

  /* Ch 21 - Choosing an ML Approach */
  { q:`A bank must predict loan default from tabular applicant data and, by regulation, explain to each applicant which factors drove a denial. Inference runs in a real-time application form. Which approach fits best?`,
    opts:[
      "A foundation model on Amazon Bedrock prompted with the applicant record",
      "A SageMaker built-in algorithm such as XGBoost, with SageMaker Clarify for per-prediction explanations",
      "A custom deep neural network trained on the applicant data",
      "A JumpStart image-classification model fine-tuned on the forms"
    ],
    correct:1,
    explain:`Why: Tabular data plus a hard interpretability requirement plus low-latency real-time inference is the classical-algorithm profile, and Clarify supplies the per-applicant SHAP explanations the regulation needs. A foundation model (A) can reason over the record but is the hardest to explain and wrong on latency and cost for a real-time form.` },

  /* Ch 22 - Selecting a Foundation Model from Amazon Bedrock */
  { q:`A support platform must auto-tag roughly 5 million chat messages a day into one of 12 intent categories. The task is simple, but cost and throughput are the priority. Which Bedrock choice fits best?`,
    opts:[
      "A small, low-latency model such as Amazon Nova Micro or Claude Haiku",
      "A flagship model such as Claude Opus for maximum accuracy",
      "A Titan Text Embeddings model",
      "An image-generation model such as Nova Canvas"
    ],
    correct:0,
    explain:`Why: Simple classification at millions of calls a day with cost and throughput as the priority is the small-model case: Nova Micro or Haiku classify accurately enough at a fraction of the price and latency. A flagship (B) is the most accurate but paying flagship rates and latency for an easy 12-way tag at that volume is the mismatch the triangle warns against.` },

  /* Ch 23 - Custom vs Managed vs Pre-Trained vs FMs */
  { q:`A logistics company needs to extract line items and totals from scanned supplier invoices. It has no ML engineers and wants this shipped in days. Which option fits best?`,
    opts:[
      "A custom convolutional model trained on labeled invoice images",
      "A JumpStart object-detection model fine-tuned on invoices",
      "Amazon Textract, which extracts structured data from documents through an API",
      "A foundation model prompted to read each invoice image"
    ],
    correct:2,
    explain:`Why: Document data extraction is a standard task Textract already solves behind an API, with no training, no data, and no ML team, matching the days-long deadline. A custom model (A) could reach high accuracy but needs labeled data, GPU time, and ML skill the team does not have, climbing far higher up the build-or-buy ladder than the problem requires.` },

  /* Ch 24 - Fine-Tuning Strategies for Pre-Trained FMs */
  { q:`A health-tech firm finds a base foundation model constantly misreads clinical abbreviations and drug names. It has twenty years of unlabeled physician notes but no labeled question-answer pairs. Which customization method fits best?`,
    opts:[
      "Supervised fine-tuning on the physician notes",
      "Continued pre-training on the unlabeled clinical text",
      "Model distillation from a larger medical model",
      "Retrieval-augmented generation over a drug database"
    ],
    correct:1,
    explain:`Why: The gap is domain fluency and the asset is a large unlabeled corpus, which is exactly what continued pre-training consumes to teach an industry's vocabulary and patterns. Supervised fine-tuning (A) needs labeled prompt-and-completion pairs the firm does not have; raw notes are input-only data.` },

  /* Ch 25 - RAG Architecture Patterns */
  { q:`A team must launch an internal assistant that answers policy questions from documents in Amazon S3 and cites its sources. It wants this in production quickly and has nobody to operate a vector database. Which approach fits best?`,
    opts:[
      "Amazon Bedrock Knowledge Bases with RetrieveAndGenerate over the S3 documents",
      "Fine-tune a foundation model on the policy documents",
      "A custom RAG stack on self-managed OpenSearch with bespoke orchestration",
      "Continued pre-training on the policy corpus"
    ],
    correct:0,
    explain:`Why: Cited answers over changing documents, needed fast, with nobody to run infrastructure, is the managed Knowledge Bases case: it handles ingestion, chunking, the vector store, and citations out of the box. Fine-tuning (B) bakes knowledge into weights without citations, and every policy edit would require retraining rather than a re-sync.` },

  /* Ch 26 - AWS AI Services for Business Problems */
  { q:`A media platform lets users upload photos and must automatically block images containing explicit or violent content before they go live. The team has no ML engineers. Which service fits best?`,
    opts:[
      "Amazon Comprehend content classification",
      "Amazon Textract with the Queries feature",
      "A custom convolutional model on SageMaker AI",
      "Amazon Rekognition content moderation"
    ],
    correct:3,
    explain:`Why: The input is images and the goal is detecting unsafe visual content, which is exactly Rekognition's content-moderation capability, available through an API with no ML skill. Comprehend (A) also moderates but works on text, not images, so it cannot see what is in a photo.` },

  /* Ch 27 - SageMaker AI Built-In Algorithms and Script Mode */
  { q:`A researcher has a custom Hugging Face Transformers training script that fine-tunes a text model and wants AWS to manage the training infrastructure without building a Docker image. Which approach fits?`,
    opts:[
      "Script mode using the prebuilt Hugging Face framework container",
      "The built-in BlazingText algorithm",
      "Bring your own container built from scratch",
      "Rewrite the model as a built-in Sequence-to-Sequence job"
    ],
    correct:0,
    explain:`Why: An existing custom script plus a framework AWS already provides a container for is the script-mode case: pass the script as the entry point and skip Docker entirely. Building your own container (C) is unnecessary work when a maintained Hugging Face container already exists for exactly this.` },

  /* Ch 28 - Training Mechanics (MULTI) */
  { q:`A team runs long, non-urgent deep learning training jobs that can tolerate interruption and wants to cut their cost by up to about 90% without losing progress if an interruption happens. Which TWO changes together achieve this? (Select TWO.)`,
    opts:[
      "Use Managed Spot Training on the training jobs",
      "Configure checkpointing to Amazon S3 so an interrupted job resumes",
      "Switch from data-parallel to model-parallel distributed training",
      "Increase the number of epochs to improve accuracy"
    ],
    correct:[0,1],
    explain:`Why: Managed Spot Training delivers the deep savings on interruptible jobs, and checkpointing to S3 lets an interrupted job resume rather than restart, so no progress is lost. Model parallelism (C) is for models too large to fit on one GPU, not a cost lever; more epochs (D) increases cost and time.` },

  /* Ch 29 - Hyperparameter Optimization with AMT */
  { q:`A team is tuning a deep neural network that logs validation accuracy after every epoch and wants to minimize wasted compute by dropping weak configurations before they finish. Which AMT strategy fits best?`,
    opts:[
      "Grid search over all combinations",
      "Random search with maximum parallelism",
      "Hyperband",
      "Bayesian optimization running one job at a time"
    ],
    correct:2,
    explain:`Why: An iterative algorithm that reports a metric each epoch is Hyperband's use case: it reallocates epochs to promising configurations and stops weak ones early, cutting wasted compute. Bayesian (D) is the efficient general default but does not use per-epoch intermediate results to kill underperformers mid-training.` },

  /* Ch 30 - Overfitting, Underfitting, and Catastrophic Forgetting */
  { q:`A classifier reaches 98% accuracy on the training set but only 74% on the validation set. Which change is most likely to help?`,
    opts:[
      "Add more layers to increase model capacity",
      "Apply regularization such as L2 or dropout, and consider early stopping",
      "Train for many more epochs",
      "Remove the validation set to simplify evaluation"
    ],
    correct:1,
    explain:`Why: A large train-to-validation gap is the classic overfitting signature, so regularization (L2, dropout) and early stopping push the model back toward generalizing. Adding capacity (A) increases variance and would make overfitting worse, not better.` },

  /* Ch 31 - Ensembles */
  { q:`A GenAI application sends every request to an expensive flagship model. Most requests are simple and only a small fraction are genuinely hard. The team must cut cost without losing quality on the hard cases. What should they build?`,
    opts:[
      "A bagging ensemble of flagship models",
      "A stacking meta-model over several flagship models",
      "Boosting several copies of the flagship model",
      "A model cascade: a cheap model first, escalating low-confidence cases to the flagship"
    ],
    correct:3,
    explain:`Why: Mostly easy traffic with a small hard tail, and a cost target that must not hurt hard-case quality, is the cascade case: serve the easy majority cheaply and escalate only uncertain requests. A stacking meta-model (B) would run several flagship models per request, increasing cost rather than cutting it.` },

  /* Ch 32 - Prompt Engineering vs Fine-Tuning */
  { q:`A production service classifies documents and must return a strict JSON schema every time. The current prompt carries many examples, making each call long and costly at millions of requests per day, and it still occasionally breaks format. The team has thousands of labeled examples. What is the better approach?`,
    opts:[
      "Add even more examples to the prompt",
      "Raise the model's temperature for variety",
      "Fine-tune the model on the labeled examples so the format is built in and prompts get short",
      "Switch to a larger flagship model with the same long prompt"
    ],
    correct:2,
    explain:`Why: A strict format that must hold every time, long expensive prompts at massive volume, and a labeled dataset on hand is the fine-tuning case: the behavior moves into the weights, prompts shrink, per-call cost drops, and consistency improves. Adding more examples (A) makes each call even longer and costlier while still not guaranteeing the format.` },

  /* Ch 33 - Reproducible Experiments (MULTI) */
  { q:`A data science team adopts managed MLflow on Amazon SageMaker AI. Which TWO statements are correct? (Select TWO.)`,
    opts:[
      "It tracks parameters, metrics, and artifacts for each run so experiments are comparable",
      "It can register the best run to the SageMaker Model Registry for deployment",
      "It hosts the model's real-time inference endpoint in place of a SageMaker endpoint",
      "It replaces the need to version prompts separately"
    ],
    correct:[0,1],
    explain:`Why: Managed MLflow logs parameters, metrics, and artifacts per run and can promote the best run into the SageMaker Model Registry for deployment. It does not itself host the inference endpoint (C), and it does not remove the need for prompt versioning (D), which is managed separately with versions and aliases.` },

  /* Ch 34 - Baselines, Drift, and Shadow vs Production Variants */
  { q:`A bank has a new fraud model and must confirm it behaves well on real production traffic and load, but regulators forbid exposing any customer to an unproven model. How should it test the model before promotion?`,
    opts:[
      "Shadow testing: send a copy of live traffic to the new model without returning its responses to users",
      "A production variant taking 20% of real traffic",
      "Replace the live model outright and watch metrics",
      "Offline evaluation on last year's data only"
    ],
    correct:0,
    explain:`Why: Testing on real production traffic while exposing no customer to the new model is exactly shadow testing: it mirrors live requests to the shadow model but never returns its responses. A 20% production variant (B) does expose one in five real customers to the unproven model, which the regulator forbids.` },

  /* Ch 35 - Classification and Regression Metrics (MULTI) */
  { q:`A fraud model is trained on data where only 1.5% of transactions are fraudulent, and missing real fraud is the costly error. Which TWO evaluation choices are appropriate? (Select TWO.)`,
    opts:[
      "Prioritize recall so that missed fraud (false negatives) is minimized",
      "Report F1 rather than raw accuracy",
      "Use overall accuracy as the headline metric",
      "Use RMSE on the predicted class labels"
    ],
    correct:[0,1],
    explain:`Why: On a rare positive class where misses are costly, recall targets the false negatives and F1 gives a balanced single number that stays honest under imbalance. Overall accuracy (C) is the trap: predicting "not fraud" for everyone scores about 98.5% while catching nothing. RMSE (D) is a regression metric, not for classification.` },

  /* Ch 36 - Explaining Outputs and Debugging Convergence */
  { q:`A lender must show regulators, for each declined application, which input features most drove the model's decision, in real time as decisions are made. Which capability fits?`,
    opts:[
      "SageMaker Debugger built-in rules",
      "SageMaker Clarify online explainability with SHAP feature attributions",
      "SageMaker Model Monitor data quality",
      "Automatic Model Tuning"
    ],
    correct:1,
    explain:`Why: Per-prediction feature importance served in real time is Clarify's online explainability using SHAP. Debugger (A) also answers a "why," but its "why" is about training convergence, not explaining a deployed model's individual predictions.` },

  /* Ch 37 - NLP Evaluation Metrics */
  { q:`A team evaluates an abstractive summarizer and worries most about whether summaries omit key points from the source. Reference summaries are available. Which metric is the most appropriate primary measure?`,
    opts:[
      "BLEU",
      "RMSE",
      "ROUGE (for example ROUGE-L)",
      "ROC AUC"
    ],
    correct:2,
    explain:`Why: The concern is coverage of the reference's content, which is recall, and ROUGE is the recall-oriented summarization metric. BLEU (A) is precision-oriented and built for translation, so it rewards matching wording rather than capturing all the key content.` },

  /* Ch 38 - Human-in-the-Loop Evaluation and LLM-as-a-Judge */
  { q:`A team wants to score the quality of 50,000 chatbot responses after every model or prompt change, quickly and within a small budget, as part of its release pipeline. Which approach fits best?`,
    opts:[
      "An LLM-as-a-judge evaluation with a clear rubric, run automatically",
      "A human review panel rating all 50,000 responses each release",
      "BLEU against a single reference answer",
      "Accuracy on exact string match"
    ],
    correct:0,
    explain:`Why: Scoring tens of thousands of open-ended responses on every release, fast and cheap, is the LLM-as-a-judge case: it applies the rubric consistently at scale inside the pipeline. A full human panel every release (B) is the highest fidelity but cannot meet the volume, speed, or budget for continuous checks.` },

  /* Ch 39 - RAG System Monitoring */
  { q:`A RAG assistant frequently produces answers that state facts not present in the passages it retrieved, even though those retrieved passages are on-topic for the query. Which RAG quality metric is failing, and where is the fault?`,
    opts:[
      "Context relevance, a retrieval fault",
      "Recall at k, a retrieval fault",
      "Latency, an operational fault",
      "Groundedness (faithfulness), a generation fault"
    ],
    correct:3,
    explain:`Why: On-topic context but answers with unsupported facts is a groundedness (faithfulness) failure: the model is hallucinating beyond the retrieved context, a generation-side problem to fix with prompting or the model. Context relevance (A) would be failing only if the passages were off-topic, but here retrieval is working; the breakdown is in how the answer uses the context.` }

];
/* ===== EXAM PAYLOAD - END ===== */
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
