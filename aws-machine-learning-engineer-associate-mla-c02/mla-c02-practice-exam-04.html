const E = {
  name: "Practice Exam 4",
  badge: "AWS ML Engineer Associate (MLA-C02)",
  blurb: "Scenario-based questions across Unit 4, Operating, Monitoring, and Securing ML and AI Solutions. Most have one best answer; a few ask you to select two.",
  coverage: "Covers Unit 4 (Domain 4): all 17 chapters across Modules 4.1, 4.2, and 4.3. One question per chapter.",

const QUESTIONS = [

  /* Ch 60 - Monitoring Model Performance */
  { ref:{chapter:60}, q:`A team needs to track a deployed model's quality over time and be alerted when its predictions drift from training-time behavior, using managed AWS tooling rather than custom scripts. Which approach fits best?`,
    opts:[
      "Rely on the endpoint's CPU and memory metrics alone",
      "Manually re-score the model once a quarter",
      "Use SageMaker Model Monitor with a scheduled drift-detection pipeline and CloudWatch alarms",
      "Turn on AWS Config rules for the endpoint"
    ],
    correct:2,
    explain:`Model Monitor captures baselines and runs scheduled checks for data and model-quality drift, emitting metrics you can alarm on in CloudWatch, which is the managed monitoring path. Infrastructure metrics (A) show host health, not prediction quality, and a quarterly manual re-score (B) is neither continuous nor automated.` },

  /* Ch 61 - Detecting Data Distribution Change and Workflow Anomalies */
  { ref:{chapter:61}, q:`A daily inference pipeline suddenly receives records whose feature distributions differ sharply from training data, and prediction quality degrades. What is the most direct way to catch this automatically going forward?`,
    opts:[
      "Increase the endpoint instance size",
      "Monitor for data distribution change (data drift) and alarm when statistics deviate from the training baseline",
      "Switch to a larger foundation model",
      "Disable auto scaling on the endpoint"
    ],
    correct:1,
    explain:`Comparing incoming feature statistics against the training baseline and alarming on deviation is exactly data-drift detection, which catches distribution change before it silently degrades results. A bigger instance (A) or model (C) does not detect or address a distribution shift in the inputs.` },

  /* Ch 62 - A/B Testing in Production */
  { ref:{chapter:62}, q:`A team wants to compare a new model version against the current one on real traffic, sending a small share to the new version and shifting more only if its business metrics hold up. Which SageMaker capability supports this directly?`,
    opts:[
      "Production variants on one endpoint with weighted traffic between the two models",
      "Two entirely separate accounts",
      "A batch transform job comparing offline predictions",
      "A multi-model endpoint loading both from S3"
    ],
    correct:0,
    explain:`Production variants let one endpoint host both models and split live traffic by weight, so you can start small and shift the weight as metrics confirm the new version, the essence of an A/B test. Batch transform (C) is offline and cannot test on live traffic, and a multi-model endpoint (D) serves many models by name, not a weighted comparison.` },

  /* Ch 63 - Monitoring Agents */
  { ref:{chapter:63}, q:`A multi-step agent intermittently returns incomplete answers; logs show some tool calls failing and some model responses being cut off mid-stream. What should monitoring focus on to diagnose these agent-specific failures?`,
    opts:[
      "Only the final answer's sentiment",
      "Endpoint disk utilization",
      "The number of S3 buckets in the account",
      "Per-step traces of tool-call failures, truncated streaming responses, and coordination errors across the agent's steps"
    ],
    correct:3,
    explain:`Agent failures hide between the steps, so tracing each tool call, watching for truncated streaming, and checking step-to-step coordination surfaces the real cause. Sentiment of the final answer (A) and host disk usage (B) reveal nothing about which step failed or why the stream was cut off.` },

  /* Ch 64 - Inference Instance Families for Performance and Cost */
  { ref:{chapter:64}, q:`A real-time deep-learning model needs low-latency GPU inference, but a smaller tabular model alongside it runs fine on CPU. What is the most cost-effective instance strategy?`,
    opts:[
      "Run both models on the largest available GPU instances",
      "Match each model to the right instance family: a GPU (or accelerated) instance for the deep-learning model and a CPU instance for the tabular model",
      "Run both on the smallest CPU instance to save money",
      "Use the same instance type for every model for consistency"
    ],
    correct:1,
    explain:`Matching the workload to the instance family (accelerated compute for the deep model, general-purpose CPU for the light tabular model) gives the needed latency without paying for GPUs the tabular model cannot use. Putting everything on big GPUs (A) wastes money, and forcing the deep model onto CPU (C) misses its latency target.` },

  /* Ch 65 - Troubleshooting Tools */
  { ref:{chapter:65}, q:`Requests to a Bedrock-backed agent are slow, and the team needs to see where time is spent across the model call, retrieval, and downstream service calls in a single request. Which tool gives that end-to-end view?`,
    opts:[
      "AWS Config configuration history",
      "Amazon S3 access logs",
      "Distributed tracing (AWS X-Ray and Bedrock AgentCore observability) to follow a request across its components",
      "IAM Access Analyzer"
    ],
    correct:2,
    explain:`Distributed tracing with X-Ray and AgentCore observability stitches one request's spans across the model, retrieval, and downstream calls, so you can see which segment is slow. Config history (A) and S3 access logs (B) describe resource state and object access, not a single request's latency breakdown.` },

  /* Ch 66 - Dashboards and Capacity Optimization (MULTI) */
  { ref:{chapter:66}, q:`A team wants a single operational dashboard for an ML service and wants the endpoint to hold cost and performance targets as traffic varies. Which TWO actions accomplish this? (Select TWO.)`,
    opts:[
      "Build a CloudWatch dashboard combining latency, invocation, error, and cost-related metrics",
      "Configure endpoint auto scaling on a target metric so capacity tracks demand",
      "Delete CloudWatch metrics older than one day to save cost",
      "Run the endpoint at fixed maximum capacity at all times"
    ],
    correct:[0,1],
    explain:`A CloudWatch dashboard gives the single operational view, and target-tracking auto scaling keeps capacity (and therefore cost and latency) aligned with demand. Deleting recent metrics (C) removes the very data the dashboard needs, and fixed maximum capacity (D) wastes money during low traffic.` },

  /* Ch 67 - Cost Management Tools and Purchasing Options */
  { ref:{chapter:67}, q:`Cost Explorer shows a production endpoint running at a steady 24/7 baseline with a predictable load for the next year. Which purchasing choice reduces its cost the most for that baseline?`,
    opts:[
      "Keep it fully On-Demand indefinitely",
      "Commit that steady baseline to a Savings Plan (or reserved capacity)",
      "Move the always-on endpoint to Spot capacity",
      "Add more On-Demand instances to spread the load"
    ],
    correct:1,
    explain:`A predictable, always-on baseline is exactly what a Savings Plan or reserved capacity discounts in exchange for a 1 or 3 year commitment. On-Demand (A) pays the highest rate for known steady usage, and Spot (C) is for interruptible work, not an always-on production endpoint.` },

  /* Ch 68 - FM Inference Costs */
  { ref:{chapter:68}, q:`A generative AI feature's Bedrock bill is dominated by token usage, with long prompts resent on every call and verbose outputs. Which change most directly lowers token cost without changing the model?`,
    opts:[
      "Provision more endpoints",
      "Switch every call to provisioned throughput regardless of volume",
      "Increase the maximum output token limit",
      "Trim and cache prompt context and cap output length to reduce input and output tokens per call"
    ],
    correct:3,
    explain:`Token cost scales with input plus output tokens, so trimming repeated context, caching it, and capping output length cut the billed tokens per call directly. Raising the output limit (C) increases tokens, and blanket provisioned throughput (B) is only economical at sustained high volume, not a token-reduction lever.` },

  /* Ch 69 - AI Cost Patterns */
  { ref:{chapter:69}, q:`A RAG system's costs are climbing because its vector store keeps growing and every knowledge-base refresh re-embeds the entire corpus. Which pair of changes targets these AI-specific cost drivers?`,
    opts:[
      "Send longer prompts and increase topK",
      "Use a flagship generation model and add endpoints",
      "Switch to incremental sync so only changed chunks are re-embedded, and reduce embedding dimensions (or prune stale vectors) to cut storage",
      "Disable monitoring to reduce overhead"
    ],
    correct:2,
    explain:`The two drivers named are embedding compute on refresh and vector storage growth; incremental sync re-embeds only what changed, and smaller dimensions or pruning cut storage and search cost. Longer prompts and higher topK (A) raise cost, and the generation model (B) is not what is driving these embedding and storage bills.` },

  /* Ch 70 - Securing CI/CD Pipelines (MULTI) */
  { ref:{chapter:70}, q:`An ML CI/CD pipeline must catch source-code vulnerabilities before merge and known CVEs in the container images it ships. Which TWO services should be wired in? (Select TWO.)`,
    opts:[
      "Amazon CodeGuru Security to statically analyze the source code",
      "Amazon Inspector to continuously scan the ECR container images for CVEs",
      "Amazon Macie to scan the source for PII",
      "AWS Config to record pipeline resource changes"
    ],
    correct:[0,1],
    explain:`CodeGuru Security is static analysis for source-code flaws (secrets, injection), and Inspector continuously scans built artifacts like ECR images for CVEs, covering both requirements. Macie (C) classifies sensitive data in storage, not code vulnerabilities, and Config (D) records configuration state rather than scanning for vulnerabilities.` },

  /* Ch 71 - Least Privilege and IAM */
  { ref:{chapter:71}, q:`A SageMaker execution role currently has s3:* on all buckets. Security asks for least privilege while the job still reads one input prefix and writes one output prefix. What should the policy become?`,
    opts:[
      "Only s3:GetObject and s3:PutObject scoped to the two specific bucket prefixes the job uses",
      "AdministratorAccess for simplicity",
      "s3:* on all buckets but with MFA required",
      "An IAM user with long-lived keys in the training script"
    ],
    correct:0,
    explain:`Least privilege scopes both the actions (just Get and Put) and the resources (just the two prefixes) to what the job actually needs. Admin access (B) and account-wide s3:* (C) are the opposite of least privilege, and long-lived keys in a script (D) add a credential-leak risk.` },

  /* Ch 72 - Auditing and Compliance */
  { ref:{chapter:72}, q:`During an audit you must prove which IAM identity deleted a production endpoint last month, including the time and source IP of the call. Which service holds that record?`,
    opts:[
      "Amazon CloudWatch metrics",
      "AWS CloudTrail, which logs the DeleteEndpoint API call with identity, time, and source IP",
      "Amazon Inspector findings",
      "AWS Config compliance status"
    ],
    correct:1,
    explain:`CloudTrail records every management API call with the caller identity, timestamp, and source IP, which is exactly the forensic detail the audit needs. Config (D) tracks resource configuration and compliance over time but not the identity behind a specific API call, and CloudWatch metrics (A) show performance, not actor identity.` },

  /* Ch 73 - Network Isolation (MULTI) */
  { ref:{chapter:73}, q:`A regulated bank must run a SageMaker real-time endpoint so that neither its inference traffic nor its calls to Amazon S3 traverse the public internet. Which TWO configurations achieve this? (Select TWO.)`,
    opts:[
      "Deploy the endpoint into private subnets with security groups (a VPC configuration)",
      "Use VPC endpoints (PrivateLink) for S3 and the SageMaker APIs",
      "Give the endpoint a public IP restricted by a security group",
      "Encrypt the model artifacts with KMS and leave networking at default"
    ],
    correct:[0,1],
    explain:`Private subnets with security groups keep the endpoint off the public internet, and VPC endpoints route S3 and SageMaker calls over PrivateLink on the AWS network. A public IP (C) still exposes an internet path, and KMS (D) protects data at rest but does nothing about the network route.` },

  /* Ch 74 - Troubleshooting Security and Mitigating AI Risks */
  { ref:{chapter:74}, q:`A training job fails with AccessDenied reading encrypted objects from S3, even though its execution role's policy allows s3:GetObject on that bucket. What is the most likely remaining cause?`,
    opts:[
      "The model is overfitting",
      "The instance type is too small",
      "The role lacks kms:Decrypt on the key encrypting the objects (or the bucket policy does not allow the role)",
      "Auto scaling is disabled on the endpoint"
    ],
    correct:2,
    explain:`When the identity policy already allows the action, an AccessDenied on encrypted objects points to a missing kms:Decrypt grant on the encryption key, or a bucket resource policy that excludes the role. Overfitting (A) and instance size (B) are unrelated to an access-control error.` },

  /* Ch 75 - Bedrock API Keys vs IAM Credentials */
  { ref:{chapter:75}, q:`A production application will call Bedrock continuously and must use fine-grained, auto-rotating credentials with no long-lived secret to store. Which authentication approach is correct?`,
    opts:[
      "Standard IAM authentication: assume an IAM role and sign requests with SigV4",
      "A long-term Bedrock API key stored in the application config",
      "A short-term Bedrock API key refreshed by hand every 12 hours",
      "One shared API key across all instances"
    ],
    correct:0,
    explain:`Production apps needing fine-grained, auto-rotating credentials should assume an IAM role and use SigV4, the standard governable path with no long-lived token to leak. A long-term key (B) is meant for exploration, and manually refreshing a short-term key (C) is fragile compared with role-based credentials.` },

  /* Ch 76 - Bedrock Guardrails and Sensitive Data Protection */
  { ref:{chapter:76}, q:`A Bedrock-based assistant must never emit customer PII such as emails or card numbers, and must refuse to give medical advice. Which single configuration meets both requirements?`,
    opts:[
      "A VPC endpoint plus a restrictive security group",
      "An IAM policy denying bedrock:InvokeModel",
      "AWS Config rules on the endpoint",
      "A Bedrock Guardrail with a sensitive-information filter for PII and a denied topic for medical advice"
    ],
    correct:3,
    explain:`Bedrock Guardrails combines a sensitive-information filter (to redact or block PII) with denied topics (to refuse medical advice) in one configuration applied to the model. Network controls (A) and IAM (B) govern access to the model, not the content it is allowed to produce.` }

];

const CHAPTERS = {

/* =====================================================================

const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
