/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Practice Exam 3",
  badge: "AWS ML Engineer Associate (MLA-C02)",
  blurb: "Scenario-based questions across Unit 3, Deployment and Orchestration of ML and AI Workflows. Most have one best answer; a few ask you to select two.",
  coverage: "Covers Unit 3 (Domain 3): all 20 chapters across Modules 3.1, 3.2, and 3.3. One question per chapter.",
  minutes: 40,
  pass: 72
};

const QUESTIONS = [

  /* Ch 40 - Inference Strategies */
  { ref:{chapter:40}, q:`A model processes uploaded videos up to 700 MB, each taking several minutes, submitted sporadically, with results the user can collect later. Which inference option fits best?`,
    opts:[
      "A real-time endpoint on a large GPU instance kept always on",
      "Serverless inference invoked per upload",
      "Asynchronous inference, which queues large, long-running requests and returns results to S3",
      "A real-time endpoint with a longer timeout"
    ],
    correct:2,
    explain:`Why: Large payloads, multi-minute processing, and tolerance for a delayed result are the asynchronous inference profile: it queues requests, handles inputs up to 1 GB and long runtimes, and can scale to zero between bursts. An always-on real-time endpoint (A) risks timeouts on multi-minute inference and pays for idle GPU between sporadic uploads.` },

  /* Ch 41 - Compute Environments and Deployment Targets */
  { ref:{chapter:41}, q:`A team wants managed autoscaling on invocation metrics, data capture, and model monitoring for a real-time model, without building that tooling and with no existing container-platform requirement. Which deployment target fits best?`,
    opts:[
      "SageMaker AI hosting (a real-time endpoint)",
      "Amazon EKS with a custom serving stack",
      "AWS Lambda behind API Gateway",
      "Amazon ECS on Fargate"
    ],
    correct:0,
    explain:`Why: Wanting managed autoscaling, data capture, and monitoring for ML inference without building it is the SageMaker hosting case, where those features are built in. EKS (B) could serve the model but would require assembling all that ML tooling and running Kubernetes, the opposite of what the team asked for.` },

  /* Ch 42 - Orchestrators and Multi-Model or Multi-Container Deployments */
  { ref:{chapter:42}, q:`A SaaS company trains a separate XGBoost model per customer, 3,000 in total, each called only a few times a day, and cannot afford 3,000 endpoints. What should they use?`,
    opts:[
      "A multi-container endpoint with 3,000 containers",
      "A multi-model endpoint that loads each customer's model from S3 on demand",
      "A serial inference pipeline of 3,000 stages",
      "One real-time endpoint per customer"
    ],
    correct:1,
    explain:`Why: Thousands of same-framework models with light, uneven traffic is the multi-model endpoint case: models sit in S3 and load on demand onto shared instances, so you pay for a few instances instead of 3,000. A multi-container endpoint (A) caps at 15 containers and is for a few different models, not thousands of similar ones.` },

  /* Ch 43 - FM Deployment Options */
  { ref:{chapter:43}, q:`A team fine-tuned a model with Bedrock Custom Model Import and must serve it in production with guaranteed, predictable throughput. Which deployment option is required?`,
    opts:[
      "Bedrock on-demand per-token inference",
      "AWS Lambda with the model in the package",
      "Batch transform on SageMaker AI",
      "Bedrock Provisioned Throughput"
    ],
    correct:3,
    explain:`Why: Custom and imported models are served through Provisioned Throughput, which also delivers the guaranteed throughput steady production needs. On-demand (A) is for base models with no commitment and shared quotas, and does not provide the reserved capacity a customized model requires.` },

  /* Ch 44 - Importing Outside Models */
  { ref:{chapter:44}, q:`A team fine-tuned a Llama model in an external environment and wants to serve it through the Bedrock API with no endpoints to manage. What is the appropriate path?`,
    opts:[
      "Bedrock Custom Model Import, staging the safetensors weights in S3",
      "A SageMaker endpoint with a bring-your-own container",
      "Repackage the model as an AWS Lambda layer",
      "Retrain the model from scratch inside Bedrock"
    ],
    correct:0,
    explain:`Why: Llama is a supported architecture, and Custom Model Import brings the weights into Bedrock so you call the model with the same API and no endpoint to run. A SageMaker BYOC endpoint (B) would work but reintroduces the endpoint management the team wants to avoid.` },

  /* Ch 45 - Deploying Agents */
  { ref:{chapter:45}, q:`A support agent on Amazon Bedrock must look up order status and start returns by calling internal APIs. What is the right way to give it that ability?`,
    opts:[
      "Put the full API responses in the agent's instructions",
      "Define an action group with a schema for the operations and a Lambda function to execute them",
      "Fine-tune the model on past API responses",
      "Increase the model's context window"
    ],
    correct:1,
    explain:`Why: Giving an agent the ability to act means defining an action group: a schema declares the operations and parameters, and a Lambda function calls the internal APIs. Putting API responses in the instructions (A) is static text; it cannot look up a live order or trigger a return.` },

  /* Ch 46 - On-Demand vs Provisioned Resources */
  { ref:{chapter:46}, q:`A team runs large, non-urgent training jobs that already checkpoint to S3 and can restart if interrupted, and wants the lowest possible compute cost. Which purchase option fits best?`,
    opts:[
      "On-demand instances",
      "A three-year Savings Plan",
      "Spot instances (Managed Spot Training)",
      "A dedicated host"
    ],
    correct:2,
    explain:`Why: Interruptible, checkpointed training that wants the deepest discount is the Spot case: up to about 90% off, with checkpointing to resume after any reclaim. A three-year Savings Plan (B) discounts steady baseline usage but locks in a long commitment and still costs far more than Spot for interruptible batch work.` },

  /* Ch 47 - Automating Provisioning with CloudFormation and AWS CDK */
  { ref:{chapter:47}, q:`A team must stand up identical ML environments (endpoint, bucket, role, alarms) across dev, staging, and production, reviewed in source control and reproducible on demand. What should they use?`,
    opts:[
      "Create the resources by hand in the console for each environment",
      "A one-off Boto3 script kept on a laptop",
      "An AMI snapshot of a running instance",
      "Infrastructure as code (CloudFormation or CDK) deployed per environment"
    ],
    correct:3,
    explain:`Why: Reproducible, version-controlled, identical environments are exactly what infrastructure as code delivers: one template deployed per environment. Clicking through the console (A) is neither repeatable nor reviewable and drifts between environments, the problem IaC solves.` },

  /* Ch 48 - Containers for ML and AI Workloads */
  { ref:{chapter:48}, q:`A team builds custom training and inference images and needs a private, managed store that SageMaker AI and ECS pull from, with vulnerability scanning on each image. Which service is this?`,
    opts:[
      "Amazon S3",
      "Amazon ECR",
      "AWS CodeArtifact",
      "Amazon EFS"
    ],
    correct:1,
    explain:`Why: A private, managed container registry with image scanning that AWS services pull from is Amazon ECR. S3 (A) stores objects, not container images pulled by tag, and it does not provide image vulnerability scanning or registry semantics.` },

  /* Ch 49 - Programmatic Deployment inside a VPC (MULTI) */
  { ref:{chapter:49}, q:`A regulated bank must deploy a SageMaker AI real-time endpoint so its inference traffic and calls to Amazon S3 never traverse the public internet. Which TWO configurations achieve this? (Select TWO.)`,
    opts:[
      "Attach a VPC configuration with private subnets and security groups to the endpoint",
      "Use VPC endpoints (PrivateLink) for S3 and the SageMaker APIs",
      "Give the endpoint a public IP restricted by a security group",
      "Encrypt the model artifacts with KMS and leave networking at default"
    ],
    correct:[0,1],
    explain:`Why: Running the endpoint in private subnets with security groups, and reaching AWS services over VPC endpoints (PrivateLink), keeps all traffic off the public internet. A public IP with a security group (C) still exposes the endpoint to the internet, and KMS encryption (D) protects data at rest but does nothing about the network path.` },

  /* Ch 50 - Auto Scaling */
  { ref:{chapter:50}, q:`A CPU-backed real-time endpoint sees traffic that rises and falls through the day. The team wants it to add and remove instances to hold a steady request load per instance. What is the simplest approach?`,
    opts:[
      "A target-tracking policy on SageMakerVariantInvocationsPerInstance",
      "A fixed instance count set to the daily peak",
      "Manually resizing the endpoint each morning and evening",
      "Switching to batch transform"
    ],
    correct:0,
    explain:`Why: Holding a steady per-instance request load while capacity follows demand is target tracking on invocations per instance, the standard SageMaker scaling metric. A fixed count at peak (B) wastes money off-peak and still cannot absorb a surge above that peak.` },

  /* Ch 51 - Amazon Bedrock Knowledge Bases */
  { ref:{chapter:51}, q:`A team wants to stand up a Bedrock Knowledge Base over their S3 documents as fast as possible, without operating any vector database themselves. Which vector store option should they choose?`,
    opts:[
      "A self-managed OpenSearch cluster they size and operate",
      "An Aurora PostgreSQL cluster they provision and tune first",
      "Quick-create, which provisions an Amazon OpenSearch Serverless vector store",
      "Store the vectors as objects in S3"
    ],
    correct:2,
    explain:`Why: Quick-create provisions an OpenSearch Serverless vector store automatically, the fastest path with nothing to operate. A self-managed cluster (A) or a hand-provisioned Aurora database (B) are bring-your-own options that add exactly the operational work the team wants to avoid.` },

  /* Ch 52 - Agent State Management */
  { ref:{chapter:52}, q:`A customer-service agent must remember a returning user's preferences and past issues across separate conversations days apart. What does this require?`,
    opts:[
      "Only the within-session conversation history",
      "Long-term (persistent) memory, for example AgentCore Memory or a DynamoDB-backed store",
      "A larger model context window on each call",
      "Retraining the model after every conversation"
    ],
    correct:1,
    explain:`Why: Remembering a user across separate sessions is long-term memory that must persist beyond any one conversation, which managed memory or a DynamoDB-backed store provides. Session history alone (A) is cleared between conversations, so it cannot carry preferences days later.` },

  /* Ch 53 - Deployment Strategies and Rollback (MULTI) */
  { ref:{chapter:53}, q:`A team deploys a new model version to a busy endpoint and wants to limit risk during the rollout and revert automatically if it misbehaves. Which TWO practices achieve this? (Select TWO.)`,
    opts:[
      "Shift traffic gradually with a canary or linear traffic-shifting mode",
      "Attach CloudWatch alarms so guardrails auto-roll back during the baking period",
      "Use an all-at-once traffic shift to finish quickly",
      "Delete the old endpoint as soon as the new one is created"
    ],
    correct:[0,1],
    explain:`Why: A canary or linear shift limits how much traffic the new version takes at once, and alarm-based auto-rollback reverts automatically if metrics degrade. An all-at-once shift (C) sends all traffic to the new version immediately, and deleting the old endpoint (D) removes the very thing rollback depends on.` },

  /* Ch 54 - CI/CD with the Code Services */
  { ref:{chapter:54}, q:`A team wants a push to their GitHub repository to trigger a pipeline that builds, tests, and deploys. Which service connects the external GitHub repo to the pipeline?`,
    opts:[
      "CodeBuild",
      "CodeDeploy",
      "Amazon ECR",
      "CodeConnections (formerly CodeStar Connections)"
    ],
    correct:3,
    explain:`Why: CodeConnections links CodePipeline to an external source repository like GitHub, so a push triggers the pipeline. CodeBuild (A) runs the build and tests once code is in the pipeline, but it does not establish the connection to the external repo.` },

  /* Ch 55 - Automated Testing, Including Prompt Testing */
  { ref:{chapter:55}, q:`A GenAI summarizer's test asserts the output exactly equals a reference summary, and it fails constantly even when summaries are good. What should the team do?`,
    opts:[
      "Set temperature to 0 and keep exact-match assertions forever",
      "Test criteria instead of exact strings: required facts, format, and safety, scored by an evaluation or LLM judge",
      "Remove the tests since GenAI cannot be tested",
      "Only test the deployment infrastructure, never the outputs"
    ],
    correct:1,
    explain:`Why: Non-deterministic outputs need criteria-based assertions (facts present, format, safety) scored by an evaluation or LLM judge, not exact string matching. Forcing temperature to 0 (A) reduces variation but still fails valid paraphrases and does not test the qualities that matter.` },

  /* Ch 56 - Retraining and Model Versioning */
  { ref:{chapter:56}, q:`A team wants their model to retrain automatically only when production data has drifted from the training distribution, not on a fixed schedule. How should they trigger retraining?`,
    opts:[
      "A SageMaker Model Monitor drift alarm that triggers the retraining pipeline via EventBridge",
      "A nightly cron job that always retrains",
      "Manually retrain whenever someone remembers",
      "Retrain on every inference request"
    ],
    correct:0,
    explain:`Why: Retraining when data actually drifts is drift-triggered: Model Monitor detects the drift and fires an alarm that EventBridge routes to the retraining pipeline. A nightly cron (B) retrains regardless of whether drift occurred, wasting compute when nothing changed and lagging when drift happens mid-day.` },

  /* Ch 57 - Prompt Management with Amazon Bedrock */
  { ref:{chapter:57}, q:`A team hard-codes prompt strings in their application, so every prompt tweak needs a full redeploy and there is no history of changes. What should they adopt?`,
    opts:[
      "Fine-tune the model on each new prompt",
      "Paste each prompt into an environment variable at build time",
      "Amazon Bedrock Prompt Management, storing prompts as versioned resources the app references by version",
      "Store prompts as comments in the code"
    ],
    correct:2,
    explain:`Why: Versioned, centrally managed prompts referenced by version let the team change and roll back prompts without a code deploy and keep full history, which is Bedrock Prompt Management. Build-time environment variables (B) still require a rebuild and deploy for every change and provide no version history.` },

  /* Ch 58 - Agent Deployment Pipelines */
  { ref:{chapter:58}, q:`A team wants applications to always call a stable "production" name for their agent while they promote new agent versions and roll back safely behind it. What provides this?`,
    opts:[

const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
