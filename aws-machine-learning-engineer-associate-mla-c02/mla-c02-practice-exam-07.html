<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Full Mock Exam 3",
  badge: "AWS ML Engineer Associate (MLA-C02)",
  blurb: "A full-length practice exam across all four MLA-C02 domains. Most questions have one best answer; a few ask you to select two.",
  coverage: "Mirrors the real exam shape: 65 questions sampling Domain 1 (Data Preparation for ML and AI), Domain 2 (ML and FM Development), Domain 3 (Deployment and Orchestration), and Domain 4 (Operating, Monitoring, and Securing).",
  minutes: 130,
  pass: 72
};

const QUESTIONS = [

  /* Ch 01 - Data Formats */
  { q:`A team lands nested API responses in S3 as line-delimited JSON. A daily Spark job reads all of it but only ever needs 6 of the roughly 90 fields, and job runtime and read cost are both climbing. Which storage change gives the biggest reduction with the least query rewriting?`,
    opts:[
      "Compress the JSON files with Snappy and leave the layout unchanged",
      "Concatenate the JSON into a few very large files to cut object count",
      "Rewrite the dataset to Apache Parquet partitioned by date",
      "Convert the dataset to a single wide CSV with a header row"
    ],
    correct:2,
    explain:`Why: Parquet is columnar, so the Spark job reads only the 6 needed fields and prunes row groups, cutting both bytes read and runtime with no change to the query logic. Compressing JSON (A) shrinks storage but a reader still decompresses and parses all 90 fields of every record, so scan work barely drops.` },

  /* Ch 02 - Storage Decisions */
  { q:`Several SageMaker AI training instances must all read and write the same shared directory of intermediate checkpoints during a distributed job, with POSIX file semantics. Which storage service fits best?`,
    opts:[
      "Amazon EBS volumes, one attached to each training instance",
      "Amazon EFS mounted on every training instance",
      "Amazon S3 accessed through the S3 API from each instance",
      "Amazon DynamoDB with checkpoint blobs stored as items"
    ],
    correct:1,
    explain:`Why: EFS is a shared POSIX file system that many instances can mount at once for concurrent reads and writes to the same directory, which is exactly the shared-checkpoint pattern. EBS (A) is a block volume attached to a single instance and cannot be shared read-write across the fleet the way described.` },

  /* Ch 03 - Streaming Ingestion */
  { q:`Clickstream events arrive continuously and must land in S3 as Parquet in roughly one-minute batches with no code to manage, applying a light field transform on the way. Which service best delivers this?`,
    opts:[
      "Amazon Managed Service for Apache Flink with a custom operator",
      "An AWS Glue streaming job writing micro-batches",
      "A self-managed Kafka Connect cluster on EC2",
      "Amazon Data Firehose with a Lambda transform and Parquet conversion"
    ],
    correct:3,
    explain:`Why: Amazon Data Firehose is the no-code delivery stream that buffers records, runs a Lambda transform, converts to Parquet, and writes to S3 on a buffer interval, matching every requirement. Managed Service for Apache Flink (A) can do it but is a full stream-processing application to build and operate, more than this simple buffered delivery needs.` },

  /* Ch 04 - Merging Sources and Troubleshooting */
  { q:`An AWS Glue Spark job joins a 2 TB fact table to a 4 MB reference table and one stage runs for hours with heavy shuffle and a few straggler tasks. What is the most effective fix?`,
    opts:[
      "Broadcast the 4 MB table so the join happens without shuffling the fact table",
      "Increase the number of DPUs to add more executors",
      "Repartition the fact table into more partitions before the join",
      "Cache the fact table in memory before the join runs"
    ],
    correct:0,
    explain:`Why: A tiny dimension table should be broadcast so every executor holds a local copy and the huge fact table is never shuffled, which removes the shuffle-and-straggler stage entirely. Adding DPUs (B) throws compute at a shuffle that a broadcast join makes unnecessary, so it costs more without fixing the root cause.` },

  /* Ch 05 - Vector Databases (MULTI) */
  { q:`A team is choosing a vector store for an Amazon Bedrock knowledge base and weighing OpenSearch, Aurora PostgreSQL with pgvector, and Amazon S3 Vectors. Which TWO statements are accurate guidance? (Select TWO.)`,
    opts:[
      "Amazon S3 Vectors suits large corpora with infrequent queries where cost matters most",
      "Aurora PostgreSQL with pgvector lets a team keep vectors alongside relational data it already runs",
      "Amazon OpenSearch Serverless is the lowest-cost choice for a rarely queried archive",
      "pgvector cannot be used as a Bedrock knowledge base vector store",
      "S3 Vectors delivers the lowest single-digit millisecond latency of the three"
    ],
    correct:[0,1],
    explain:`Why: S3 Vectors is pay-per-use object storage built for big, infrequently queried corpora where cost dominates, and pgvector keeps embeddings next to relational data in a database the team already operates. OpenSearch Serverless (C) keeps OCUs warm and costs more for a rarely queried archive, and S3 Vectors trades latency for cost so it is not the fastest (E).` },

  /* Ch 06 - Ingesting Multimodal Data */
  { q:`A support workflow must ingest customer call recordings (audio), scanned forms (images), and chat logs (text) and store each so downstream ML jobs can retrieve any modality by a shared case ID. What is a sound design?`,
    opts:[
      "Force all three modalities into a single DynamoDB table as base64 attributes",
      "Store the raw objects in S3 under a case-ID prefix, with a metadata catalog keyed on case ID",
      "Transcribe and OCR everything up front so only text is ever stored",
      "Keep audio on EBS, images on EFS, and text in RDS with no shared key"
    ],
    correct:1,
    explain:`Why: S3 holds large multimodal objects cheaply, and a metadata catalog keyed on case ID lets jobs resolve any modality for a case, the standard multimodal ingestion pattern. Base64 in DynamoDB (A) hits item-size limits and inflates cost, since large audio and image blobs do not belong in a key-value item.` },

  /* Ch 07 - SageMaker Feature Store */
  { q:`A real-time recommendation model needs a customer's freshest features at inference in single-digit milliseconds, while a nightly training job needs the full point-in-time history of the same features. How should the feature group be configured?`,
    opts:[
      "Offline store only, queried through Athena for both training and inference",
      "Online store only, with training reading the latest records repeatedly",
      "Both online and offline stores enabled on the feature group",
      "Two unrelated feature groups with manually copied records"
    ],
    correct:2,
    explain:`Why: Enabling both stores gives the online store for low-latency inference reads and the offline store for point-in-time historical training data from one feature group. An offline-only group (A) cannot serve millisecond inference lookups, since Athena over S3 is built for batch history, not per-request reads.` },

  /* Ch 08 - Feature Engineering */
  { q:`A gradient-boosted model uses a customer-age feature (18 to 95) and an annual-income feature (10,000 to 4,000,000). The team wants age effects to be captured in life-stage bands rather than as a raw continuous value. Which transform fits age?`,
    opts:[
      "One-hot encode the raw integer age directly",
      "Standardize age to zero mean and unit variance",
      "Apply a log transform to the age column",
      "Bin age into ordered ranges such as 18 to 25, 26 to 40, and so on"
    ],
    correct:3,
    explain:`Why: Binning groups a continuous value into meaningful ranges, which is precisely how you turn age into life-stage bands the model can split on. Standardizing age (B) rescales it but keeps it continuous, so it does not produce the discrete bands the requirement calls for.` },

  /* Ch 09 - Encoding Features */
  { q:`A linear model uses a US-state column with 50 distinct values that have no inherent order. Which encoding avoids introducing a false ranking while keeping the columns interpretable?`,
    opts:[
      "One-hot encoding, one indicator column per state",
      "Label encoding that maps each state to an integer 0 to 49",
      "Ordinal encoding of states sorted by population",
      "Hashing the state name into a single numeric feature"
    ],
    correct:0,
    explain:`Why: One-hot encoding gives each state its own indicator with no ordering, which is what a linear model needs for a nominal category. Label encoding (B) assigns integers 0 to 49 that the linear model reads as a magnitude, inventing an order that does not exist among states.` },

  /* Ch 12 - Text Pre-Processing */
  { q:`A biomedical classifier underperforms because standard tokenization splits terms like gene names and dosages into meaningless pieces, and the corpus is small. Which pre-processing step most directly helps?`,
    opts:[
      "Lowercase all text and remove every stop word",
      "Apply domain-specific tokenization and synonym augmentation for medical terms",
      "Truncate each document to its first 128 tokens",
      "Replace all digits with a single placeholder token"
    ],
    correct:1,
    explain:`Why: Domain-aware tokenization keeps specialized terms intact and synonym augmentation expands a small corpus with valid variants, both raising signal for a biomedical model. Aggressive lowercasing and stop-word removal (A) can strip meaningful casing and terms, hurting rather than helping a technical vocabulary.` },

  /* Ch 13 - Preparing Documents for RAG */
  { q:`A RAG system over long policy manuals returns chunks that cut off mid-clause, so answers miss context that continues into the next chunk. Which chunking adjustment addresses this most directly?`,
    opts:[
      "Reduce the chunk size so more chunks are retrieved per query",
      "Remove all metadata to shrink each chunk",
      "Use fixed-size chunks with overlap so adjacent chunks share boundary text",
      "Store each entire manual as one chunk"
    ],
    correct:2,
    explain:`Why: Overlapping chunks carry boundary text into the neighbor, so a clause that spans a split still appears whole in at least one retrieved chunk. Shrinking chunk size with no overlap (A) makes the mid-clause cutoffs more frequent, not fewer, since every boundary is still a hard break.` },

  /* Ch 14 - Masking, Redaction, Anonymization */
  { q:`Before sharing a support-ticket dataset with an external analytics vendor, a team must remove names, emails, and phone numbers from free-text fields at scale, with no custom regex to maintain. Which service fits best?`,
    opts:[
      "Amazon Macie to classify the S3 bucket for sensitive data",
      "AWS KMS to encrypt the ticket fields before sharing",
      "Amazon Comprehend PII detection and redaction over the text fields",
      "Amazon CloudTrail to log who accessed the tickets"
    ],
    correct:3,
    explain:`Why: Amazon Comprehend detects and redacts PII entities like names, emails, and phone numbers in free text without hand-written regex, which is the described anonymization task. Macie (A) discovers and reports sensitive data in S3 but does not rewrite the text to remove the PII from each field.` },

  /* Ch 15 - Preparing Data for FM Fine-Tuning */
  { q:`A team will fine-tune a chat foundation model to follow its brand voice and has 5,000 curated examples of ideal customer replies. How should the training data be shaped?`,
    opts:[
      "Prompt and completion (or messages) pairs where each input maps to the desired reply",
      "A single large unlabeled text file of all past replies for continued pre-training",
      "Only the completions, with prompts omitted to save tokens",
      "A vector index of the replies for retrieval at inference"
    ],
    correct:0,
    explain:`Why: Instruction fine-tuning needs labeled input-to-output pairs so the model learns to map a prompt to the desired reply, which the 5,000 curated examples provide. An unlabeled text file (B) is the continued-pre-training shape for absorbing raw domain text, not for teaching a specific input-to-reply mapping.` },

  /* Ch 16 - Cleaning Data */
  { q:`A sensor dataset has about 4% of temperature readings missing at random, and dropping those rows would discard useful readings from other columns. Which handling is most appropriate before training a regression model?`,
    opts:[
      "Delete every row that has any missing temperature value",
      "Impute the missing temperatures using a statistic such as the median",
      "Replace missing temperatures with a large sentinel like 9999",
      "Leave the missing values as empty strings for the model to handle"
    ],
    correct:1,
    explain:`Why: With only 4% missing at random, median imputation keeps the other columns of those rows usable while filling gaps with a robust estimate. Deleting the rows (A) throws away valid data in every other column, and a 9999 sentinel (C) injects an extreme value that distorts a regression model.` },

  /* Ch 17 - Data Quality Validation */
  { q:`An ML engineer must automatically block a nightly load when more than 2% of order_total values are negative or the customer_id column drops below 99% completeness, and record which rows failed. Which approach fits?`,
    opts:[
      "Run a DataBrew profile job after the load and review it manually",
      "Encode the rules as AWS Glue Data Quality checks in the ETL job so the load fails on breach",
      "Add a CloudWatch alarm on the load job duration",
      "Enable S3 versioning so bad loads can be rolled back later"
    ],
    correct:2,
    explain:`Why: Glue Data Quality expresses completeness and value rules in DQDL, evaluates them inside the ETL job before data lands, fails the load on breach, and can flag the offending rows. A DataBrew profile job after the load (A) reports quality but runs too late to block the batch and does not automatically stop the pipeline.` },

  /* Ch 18 - Labeling with SageMaker Ground Truth */
  { q:`A team needs 80,000 product images labeled with categories, has a tight budget, and finds that large blocks of images are near-duplicates of each other. How should the Ground Truth job be set up to cut cost?`,
    opts:[
      "Send every image to a vendor workforce with three workers each",
      "Use a private workforce and label all 80,000 images manually",
      "Send all images to Mechanical Turk with no consolidation",
      "Enable automated data labeling so the model labels confident images and humans handle the rest"
    ],
    correct:3,
    explain:`Why: Automated data labeling (active learning) trains a model as humans label, then auto-labels high-confidence images so people only handle the uncertain ones, which cuts cost most when many images are similar. Labeling all 80,000 manually (B) ignores the redundancy and pays humans for images the model could confidently label.` },

  /* Ch 19 - Bias Metrics and Class Imbalance */
  { q:`A churn dataset has 92% negatives and 8% positives, and a model reaches 92% accuracy while flagging almost no churners. Which single change best exposes and starts to fix the imbalance during evaluation?`,
    opts:[
      "Report recall and F1 for the positive class instead of overall accuracy",
      "Increase the number of training epochs",
      "Switch the loss function to mean squared error",
      "Remove the churn label from the feature set"
    ],
    correct:0,
    explain:`Why: Recall and F1 on the minority class reveal that the model misses churners, which raw accuracy hides when 92% of rows are the majority. More epochs (B) only train the same imbalance harder and do not change the metric that is masking the failure.` },

  /* Ch 20 - Validating AI Training Data */
  { q:`Before fine-tuning an assistant, a team must screen a large JSONL corpus of prompt-response pairs to drop examples containing toxic or unsafe content. Which service performs the content-safety screen on the text?`,
    opts:[
      "Amazon Macie sensitive data discovery on the JSONL files",
      "SageMaker Clarify pre-training bias report over the corpus",
      "Amazon Comprehend toxicity detection, dropping high-scoring pairs",
      "Amazon Bedrock Guardrails attached to the training S3 bucket"
    ],
    correct:2,
    explain:`Why: Amazon Comprehend scores text for toxicity across categories, so the team can filter out unsafe prompt-response pairs before fine-tuning. Bedrock Guardrails (D) screen prompts and responses at inference for a deployed application and do not scan files sitting in a bucket.` },

  /* Ch 21 - Choosing an ML Approach */
  { q:`A bank must predict loan default and a regulator requires that each decision be explained with the specific factors that drove it. Which modeling approach best balances accuracy with this hard interpretability requirement?`,
    opts:[
      "A deep neural network with post-hoc saliency maps",
      "A gradient-boosted tree model whose feature contributions can be reported per prediction",
      "A large language model prompted to justify each decision in prose",
      "A k-means clustering model over applicant features"
    ],
    correct:1,
    explain:`Why: Gradient-boosted trees are strong tabular predictors and support per-prediction feature attributions that satisfy a factor-level explanation requirement. An LLM justifying decisions in prose (C) produces plausible narratives that are not guaranteed to reflect the true drivers, which fails a regulatory audit.` },

  /* Ch 22 - Selecting a Foundation Model from Bedrock */
  { q:`A team must pick an Amazon Bedrock foundation model for high-volume, latency-sensitive product-description summaries where quality must stay acceptable but cost per call is the deciding factor. How should they choose?`,
    opts:[
      "Always select the largest available model for the best quality",
      "Pick a model by name recognition alone",
      "Choose the newest model regardless of task fit",
      "Benchmark candidate models on representative summaries and compare quality, latency, and cost"
    ],
    correct:3,
    explain:`Why: Selecting a Bedrock model means testing candidates on your own task and comparing the quality, latency, and cost triangle, since a smaller model that meets the quality bar at lower cost wins a cost-sensitive workload. Always choosing the largest model (A) maximizes quality but ignores the latency and cost constraints that define this task.` },

  /* Ch 23 - Custom vs Managed vs Pre-Trained vs FMs */
  { q:`A team needs to extract text and key-value pairs from scanned invoices and wants the fastest path to production with no model training. Which option fits best?`,
    opts:[
      "Use Amazon Textract, a managed AI service for document extraction",
      "Train a custom object-detection model from scratch on SageMaker AI",
      "Fine-tune a large foundation model on invoice images",
      "Build a rules engine that parses PDFs with regular expressions"
    ],
    correct:0,
    explain:`Why: Amazon Textract is a managed service purpose-built to pull text and key-value pairs from documents with no training, giving the fastest route to production. Training a custom model from scratch (B) requires labeled data, tuning, and hosting for a capability the managed service already provides.` },

  /* Ch 27 - Built-In Algorithms and Script Mode */
  { q:`A team wants to train a standard XGBoost model on tabular data in SageMaker AI without writing or maintaining custom training code. Which approach is most appropriate?`,
    opts:[
      "Package a custom container with a hand-written boosting implementation",
      "Use the SageMaker AI built-in XGBoost algorithm with hyperparameters and input channels",
      "Write a from-scratch training loop and run it in script mode",
      "Call a Bedrock foundation model to score the tabular rows"
    ],
    correct:1,
    explain:`Why: The built-in XGBoost algorithm is the managed, no-code-to-maintain path for standard tabular boosting: you supply data and hyperparameters and SageMaker AI runs the training. A custom container (A) or a from-scratch loop (C) reimplements what the built-in already provides and adds maintenance the requirement rules out.` },

  /* Ch 28 - Training Mechanics */
  { q:`A model's validation loss stops improving after epoch 12 of a planned 40, yet training loss keeps falling and the job runs the full 40 epochs at high cost. Which change reduces cost while preserving the best model?`,
    opts:[
      "Increase the batch size so each epoch runs faster",
      "Lower the learning rate and keep all 40 epochs",
      "Enable early stopping so training halts when validation loss stops improving",
      "Disable checkpointing to save storage"
    ],
    correct:2,
    explain:`Why: Early stopping ends training when validation loss plateaus and keeps the best checkpoint, cutting the wasted epochs 13 to 40 while retaining peak performance. A larger batch size (A) speeds each epoch but still runs all 40, so it does not stop the overtraining or capture the best model automatically.` },

  /* Ch 29 - Hyperparameter Optimization */
  { q:`A team must tune six hyperparameters for a SageMaker AI model and wants the tuner to use results from finished jobs to pick the next promising configurations rather than sampling blindly. Which Automatic Model Tuning strategy fits?`,
    opts:[
      "Grid search over all combinations",
      "Random search across the ranges",
      "A single training job with default hyperparameters",
      "Bayesian optimization guided by prior trial results"
    ],
    correct:3,
    explain:`Why: Bayesian optimization in Automatic Model Tuning builds a surrogate model from completed trials to choose the next configurations intelligently, which is efficient for a six-dimensional space. Grid search (A) enumerates combinations blindly and explodes combinatorially across six parameters, wasting jobs on unpromising regions.` },

  /* Ch 30 - Overfitting/Underfitting/Forgetting */
  { q:`After fine-tuning a general foundation model on a narrow support dataset, the model answers support questions well but has lost much of its former general reasoning ability. What phenomenon is this and which mitigation fits?`,
    opts:[
      "Catastrophic forgetting; mix in general-domain examples or use a lighter fine-tune",
      "Overfitting; add L2 regularization to the tabular features",
      "Underfitting; train for far more epochs on support data",
      "Data leakage; remove duplicate support tickets"
    ],
    correct:0,
    explain:`Why: Losing prior general capability while gaining narrow skill is catastrophic forgetting, mitigated by blending in general-domain data or using a lighter-touch adaptation. Calling it overfitting with L2 on tabular features (B) misdiagnoses the problem, which is about eroded pretrained knowledge, not variance on tabular inputs.` },

  /* Ch 31 - Ensembles */
  { q:`A team has several weak decision-tree learners and wants to combine them so each new tree focuses on the errors the previous trees made, improving accuracy. Which ensemble technique is this?`,
    opts:[
      "Bagging, training trees on independent bootstrap samples in parallel",
      "Boosting, training trees sequentially to correct prior errors",
      "A simple average of unrelated pretrained models",
      "Random feature selection with no combination step"
    ],
    correct:1,
    explain:`Why: Boosting trains learners sequentially, weighting or targeting the residual errors of earlier learners, which is the described error-focusing behavior. Bagging (A) trains trees independently on bootstrap samples to reduce variance and does not steer later trees toward earlier mistakes.` },

  /* Ch 32 - Prompt Engineering vs Fine-Tuning */
  { q:`A team can already get acceptable results from a foundation model by adding a few worked examples in the prompt, and the task and format change often. Which approach should they prefer before investing in customization?`,
    opts:[
      "Fine-tune the model on thousands of labeled examples immediately",
      "Run continued pre-training on the domain corpus",
      "Distill the model into a smaller one first",
      "Use few-shot prompt engineering, iterating on instructions and examples"
    ],
    correct:3,
    explain:`Why: When in-context examples already work and requirements shift often, prompt engineering is faster and cheaper to iterate than retraining, so it is the right first move. Immediate fine-tuning (A) locks in behavior with costly labeled data and must be redone whenever the frequently changing task shifts.` },

  /* Ch 33 - Reproducible Experiments */
  { q:`An ML team needs to record parameters, metrics, and artifacts for every training run so any past result can be reproduced and compared later. Which capability should they use on SageMaker AI?`,
    opts:[
      "Store metrics in ad hoc text files in each engineer's home directory",
      "Rely on CloudWatch dashboards to eyeball run performance",
      "Use MLflow tracking on SageMaker AI to log parameters, metrics, and artifacts per run",
      "Keep results only in the SageMaker AI console job list"
    ],
    correct:2,
    explain:`Why: MLflow tracking on SageMaker AI logs parameters, metrics, and artifacts per run in one queryable store, which is what makes experiments reproducible and comparable. Ad hoc text files (A) are unstructured, easily lost, and cannot be systematically compared across runs and engineers.` },

  /* Ch 34 - Baselines/Drift/Shadow */
  { q:`Before promoting a new model version to production, a team wants to route live traffic to it and compare its outputs against the current model without affecting customers. Which mechanism fits?`,
    opts:[
      "Replace the production variant outright and watch the metrics",
      "Run the new model only on last month's batch data",
      "Send live traffic to a shadow variant whose responses are logged but not returned to users",
      "Enable multi-model endpoints to host both versions"
    ],
    correct:2,
    explain:`Why: A shadow variant receives a copy of live traffic and its outputs are logged for comparison but never returned, so real requests exercise the new model with zero customer impact. Replacing the production variant outright (A) exposes every user to an unvalidated model, which is the risk shadow testing exists to avoid.` },

  /* Ch 35 - Classification and Regression Metrics */
  { q:`A medical screening model must minimize missed positive cases (false negatives) even at the cost of some false alarms. Which metric should the team optimize and report?`,
    opts:[
      "Precision, to reduce false alarms above all",
      "Recall (sensitivity), to reduce missed positive cases",
      "Overall accuracy on the full dataset",
      "R-squared on the predicted scores"
    ],
    correct:1,
    explain:`Why: Recall measures the share of true positives caught, so maximizing it directly minimizes missed cases, which is the screening priority. Precision (A) targets fewer false alarms, the opposite trade-off, and would tolerate missing real cases to keep alarms low.` },

  /* Ch 36 - Explaining Outputs and Debugging (MULTI) */
  { q:`A team must both explain which features drive a tabular model's predictions and diagnose why a deep training job's loss is not converging. Which TWO tools address these needs? (Select TWO.)`,
    opts:[
      "SageMaker Clarify for feature attribution and explainability",
      "SageMaker Debugger to capture tensors and flag training issues like vanishing gradients",
      "Amazon Macie to explain feature importance",
      "AWS Config to trace loss curves during training",
      "Amazon Textract to debug gradient behavior"
    ],
    correct:[0,1],
    explain:`Why: Clarify computes feature attributions that explain predictions, and Debugger captures training tensors and detects convergence problems such as vanishing gradients. Macie (C) finds sensitive data, not feature importance, and AWS Config (D) tracks resource configuration state, not training loss curves.` },

  /* Ch 37 - NLP Evaluation Metrics */
  { q:`A team evaluates an abstractive summarization model and wants a metric that rewards overlap between the generated summary and reference summaries, especially recall of reference content. Which metric fits best?`,
    opts:[
      "Root mean squared error between token counts",
      "ROUGE, which measures n-gram overlap with reference summaries",
      "Classification accuracy on summary sentences",
      "Silhouette score of summary embeddings"
    ],
    correct:1,
    explain:`Why: ROUGE measures overlap of n-grams and sequences between a generated summary and references, with a recall orientation that suits summarization. RMSE on token counts (A) compares lengths, not content overlap, so it says nothing about whether the summary captures the reference meaning.` },

  /* Ch 38 - Human-in-the-Loop and LLM-as-a-Judge */
  { q:`A team must evaluate thousands of chatbot responses for helpfulness quickly, then have humans review only the borderline cases. Which evaluation design fits this scale and budget?`,
    opts:[
      "Have humans manually score all thousands of responses",

      "Score every response with a keyword blocklist only",
      "Use an LLM-as-a-judge to score all responses, routing low-confidence or low-scoring ones to human review"
    ],
    correct:3,
    explain:`Why: An LLM judge scores the full volume cheaply and fast, and routing only borderline cases to humans focuses expensive review where it matters, a standard scalable evaluation design. Manual scoring of all responses (A) does not scale to thousands and blows the budget the design is meant to control.` },

  /* Ch 39 - RAG System Monitoring */
  { q:`A production RAG assistant gives increasingly wrong answers, and the team suspects the retrieval step is surfacing irrelevant chunks. Which measurement most directly confirms a retrieval problem?`,
    opts:[
      "Track retrieval accuracy, such as whether the ground-truth passages appear in the top-k results",
      "Measure only the generation model's token throughput",
      "Count total requests per hour to the endpoint",
      "Monitor the vector store's disk utilization"
    ],
    correct:0,
    explain:`Why: Retrieval accuracy, measured by whether the correct passages appear in the retrieved top-k, isolates whether the retriever is at fault before blaming the generator. Token throughput (B) reflects generation speed and says nothing about whether the right chunks were retrieved.` },

  /* Ch 40 - Inference Strategies */
  { q:`A model must score a 20 GB batch of records once each night, with results written to S3 by morning and no need for a persistent endpoint. Which inference strategy is most cost-effective?`,
    opts:[

    ],

  /* Ch 41 - Compute Environments */
  { q:`A team already runs its microservices on Amazon EKS and wants to host a custom ML inference container next to them, reusing the cluster's autoscaling and networking. Which target fits best?`,

  /* Ch 42 - Orchestrators and Multi-Model */

  /* Ch 43 - FM Deployment Options */

  /* Ch 48 - Containers for ML */

  /* Ch 49 - Programmatic Deployment inside a VPC */
  { q:`A team must deploy a SageMaker AI endpoint from code so that traffic to Amazon S3 and the endpoint stays on the AWS network and never traverses the public internet. What should the deployment configure?`,

  /* Ch 50 - Auto Scaling */
  { q:`A real-time endpoint sees traffic that triples during business hours and falls to near zero overnight, and the team wants instance count to follow demand automatically. Which configuration fits?`,

    correct:3,

  /* Ch 51 - Bedrock Knowledge Bases (MULTI) */
  { q:`A team wants an Amazon Bedrock knowledge base to return more precisely ordered context for a customer-support assistant. Which TWO configuration choices directly improve retrieval quality? (Select TWO.)`,

      "Disable the vector store and query the raw documents",

    ],
    correct:[0,1],
    explain:`Why: A reranker reorders the initial candidates so the most relevant chunks reach the model, and tuning chunking plus top-k shapes what the retriever returns, both directly improving retrieval quality. A larger generation instance (C) speeds output but does not change which chunks are retrieved, and disabling the vector store (D) removes semantic retrieval entirely.` },

  /* Ch 52 - Agent State Management */
  { q:`A multi-step Bedrock agent must remember earlier turns and intermediate results across a long conversation so later steps can use them. What is the right way to handle this state?`,
    opts:[

      "Store state only in a local variable inside one Lambda invocation",
      "Rely on the model to memorize the full history without any store"
    ],
    correct:0,
    explain:`Why: Long agentic conversations need session state persisted in a managed store keyed to the session so later steps can retrieve earlier results reliably. A local variable in a single Lambda invocation (C) vanishes when that invocation ends, so nothing survives across turns.` },

  /* Ch 53 - Deployment Strategies and Rollback */
  { q:`A team must release a new model version to a high-traffic endpoint while limiting blast radius, sending a small slice of traffic first and rolling back automatically if error rates spike. Which strategy fits?`,
    opts:[
      "A full all-at-once cutover to the new version",
      "A manual deploy with no automated rollback",
      "A canary deployment that shifts a small percentage first and rolls back on alarm",
      "Deleting the old version before deploying the new one"
    ],
    correct:2,
    explain:`Why: A canary deployment routes a small traffic slice to the new version and, wired to CloudWatch alarms, rolls back automatically if errors spike, which limits blast radius. An all-at-once cutover (A) exposes all traffic immediately, the opposite of the small-slice, low-risk rollout requested.` },

  /* Ch 54 - CI/CD */
  { q:`A team wants a pipeline that pulls source from a Git repository, builds and tests a training container, and then deploys the model, using AWS-native CI/CD services. Which combination fits?`,

      "A single cron job on EC2 that copies files to production",
      "Only CodeCommit with no build or deploy automation"
    ],
    correct:1,
    explain:`Why: CodePipeline orchestrates the stages, CodeBuild builds and tests the container, a deploy stage releases the model, and CodeConnections links the Git source, which is the AWS-native CI/CD pattern. Manual laptop scripts (A) are not a pipeline and give no repeatable, automated build-test-deploy flow.` },

  /* Ch 55 - Automated Testing for ML and AI Pipelines */
  { q:`Before a new prompt template ships to production, a team wants the CI pipeline to automatically verify the model still returns correctly formatted, on-policy answers for a suite of known inputs. What should they add?`,

    ],
    correct:3,
    explain:`Why: Automated prompt tests run the template against a suite of inputs and assert on the outputs, failing the build when a change regresses format or policy before it reaches production. Watching production error rates only (A) catches problems after users are already affected, which automated pre-release testing is meant to prevent.` },

  { q:`A regulated team must keep every approved model version with its metrics and lineage so it can prove which version served a given prediction during an audit. Which service supports this?`,

  /* Ch 57 - Prompt Management with Amazon Bedrock */
  { q:`A team iterates frequently on prompts for a Bedrock application and needs to version prompts, promote a tested version to production, and roll back without editing application code. Which capability fits?`,

  /* Ch 58 - Agent Deployment Pipelines and Version Management */
  { q:`A team ships changes to a Bedrock agent (instructions, action groups, and tools) several times a week and needs each release to be versioned and promotable through test before production. What is the right practice?`,
    opts:[
      "Edit the live production agent directly for every change",

      "Use agent versions and aliases in an automated pipeline that promotes a tested version to a production alias",
      "Recreate the agent from scratch on each change"
    ],
    correct:2,

  /* Ch 59 - Orchestrating RAG Updates and Knowledge Base Refresh */
  { q:`Source documents behind a RAG knowledge base change daily, and stale answers appear when new content is not indexed. How should the team keep the knowledge base current with the least manual effort?`,
    opts:[
      "Re-embed and reindex the entire corpus by hand each morning",

      "Rebuild the whole knowledge base from zero every night",
      "Schedule an automated ingestion job that syncs changed documents into the knowledge base on a cadence"
    ],
    correct:3,

  /* Ch 60 - Monitoring Model Performance */
  { q:`A production Bedrock application must be continuously evaluated for answer quality and safety on live traffic, with results visible over time to catch degradation. Which approach fits?`,
    opts:[
      "Use CloudWatch generative AI observability and Bedrock model evaluation to track quality and safety metrics over time",
      "Check output quality only when a user files a support ticket",
      "Measure endpoint CPU utilization as a proxy for answer quality",
      "Rely on a one-time pre-launch evaluation and never re-check"
    ],
    correct:0,
    explain:`Why: CloudWatch generative AI observability paired with Bedrock model evaluation tracks quality and safety metrics continuously so degradation shows up in dashboards over time. CPU utilization (C) reflects infrastructure load and has no relationship to whether answers are correct or safe.` },

  /* Ch 61 - Detecting Data Distribution Change */
  { q:`A model's accuracy is slipping in production even though the code is unchanged, and the team suspects the live input distribution has drifted from the training data. Which capability best detects this?`,

  /* Ch 64 - Inference Instance Families */

      "A memory-optimized instance intended for in-memory databases"

  /* Ch 65 - Troubleshooting Tools */
  { q:`A request through a Bedrock agent that calls several Lambda tools is intermittently slow, and the team needs to see the end-to-end path and find which downstream call adds the latency. Which tool set fits?`,

  /* Ch 66 - Dashboards and Capacity Optimization */
  { q:`An operations team wants a single view combining endpoint latency, error rate, and instance utilization so it can spot when to tune capacity and keep cost, performance, and reliability in balance. What should they build?`,

      "A CloudWatch dashboard aggregating the endpoint's latency, error, and utilization metrics",
      "Individual engineers checking metrics ad hoc in separate consoles",
      "A nightly email of raw log lines with no aggregation",
      "A one-time screenshot of metrics taken at launch"

      "Spot Instances for the always-on production baseline",

  /* Ch 68 - FM Inference Costs */
  { q:`A Bedrock chatbot's monthly bill is dominated by long conversations that resend the entire history in every request. Which change most directly reduces token cost without hurting answer quality?`,
    opts:[
      "Switch to a larger, more expensive model",
      "Summarize or truncate prior turns so fewer input tokens are sent each request",
      "Raise the maximum output token limit for every response",
      "Send each user message as a separate parallel request"
    ],
    correct:1,
    explain:`Why: FM cost scales with tokens, so summarizing or trimming the conversation history cuts input tokens per request directly, which is where the spend concentrates. A larger model (A) raises per-token price and makes the token-heavy bill worse rather than reducing it.` },

  /* Ch 69 - AI Cost Patterns */
  { q:`A RAG platform's cost is rising and the team is unsure whether embedding compute, vector storage, or per-query agent calls is the driver. What should they do first to control AI-specific cost?`,
    opts:[
      "Immediately delete the vector store to save storage",
      "Cap the number of users allowed on the platform",
      "Rewrite the application in a different language",
      "Attribute cost across embedding compute, vector storage, and agent consumption, then optimize the largest driver"
    ],
    correct:3,
    explain:`Why: AI cost management starts by attributing spend to embedding compute, vector storage, and agent consumption so effort goes to the true driver. Deleting the vector store (A) guesses at the cause and could break retrieval while saving on a component that may not be the main cost.` },

  /* Ch 70 - Securing CI/CD */
  { q:`A team wants its ML CI/CD pipeline to automatically scan application source for security flaws and scan container images for known vulnerabilities before deployment. Which AWS services fit?`,
    opts:[
      "Amazon CodeGuru for code review and Amazon Inspector for image and workload vulnerability scanning",
      "Amazon Macie for both code and image scanning",
      "AWS Config rules to statically analyze source code",
      "CloudTrail to detect vulnerabilities in container images"
    ],
    correct:0,
    explain:`Why: CodeGuru reviews source for security and quality issues while Inspector scans container images and workloads for known vulnerabilities, covering both pipeline needs. Macie (B) discovers sensitive data in storage and is not a source-code or image vulnerability scanner.` },

  /* Ch 71 - Least Privilege and IAM */
  { q:`A SageMaker AI training job needs to read one specific S3 prefix and write to another, and nothing else. Which IAM design follows least privilege?`,
    opts:[
      "Attach AdministratorAccess to the training role for simplicity",
      "Use long-lived access keys shared across all jobs",
      "Grant an execution role a policy allowing only the required S3 actions on those two prefixes",
      "Make the S3 buckets public so the job can reach them"
    ],
    correct:2,
    explain:`Why: A scoped execution role that permits only the needed S3 actions on exactly those two prefixes is the least-privilege design. AdministratorAccess (A) grants far more than the job needs, so any compromise of the role exposes the entire account.` },

  /* Ch 72 - Auditing and Compliance */
  { q:`A compliance team must answer who invoked a specific model endpoint and when, and confirm that endpoint configurations have not drifted from an approved baseline. Which two-service pairing fits?`,
    opts:[
      "S3 access logs for API calls and CloudWatch for configuration state",
      "AWS CloudTrail for API call history and AWS Config for resource configuration and drift",
      "Amazon Inspector for API history and Macie for configuration drift",
      "CloudWatch Logs for both API history and configuration tracking"
    ],
    correct:1,
    explain:`Why: CloudTrail records who made which API calls and when, and AWS Config tracks resource configurations and detects drift from a baseline, together answering both questions. S3 access logs (A) cover object access, not the full record of endpoint API invocations, so they cannot answer who invoked the endpoint.` },

  /* Ch 73 - Network Isolation (MULTI) */
  { q:`A team must isolate a SageMaker AI inference workload so it has no direct internet exposure and only approved services can reach it. Which TWO controls contribute to this network isolation? (Select TWO.)`,
    opts:[
      "Deploy the endpoint into private subnets within a VPC",
      "Restrict inbound access with tightly scoped security groups",
      "Attach an internet gateway and allow 0.0.0.0/0 inbound",
      "Store the model artifact in a public S3 bucket",
      "Grant the endpoint the AdministratorAccess policy"
    ],
    correct:[0,1],
    explain:`Why: Private subnets keep the endpoint off the public internet, and tightly scoped security groups limit which sources can reach it, together isolating the workload. An internet gateway with 0.0.0.0/0 inbound (C) exposes the endpoint broadly, the opposite of isolation, and a public bucket (D) leaks the artifact.` },

  /* Ch 74 - Troubleshooting Security and Mitigating AI Risks */
  { q:`A generative application starts leaking system-prompt instructions and following injected commands hidden in user-supplied documents. Which mitigation most directly reduces this prompt-injection risk?`,
    opts:[
      "Increase the model's maximum output length",
      "Give the model broader tool permissions to handle any request",
      "Log the incidents and take no protective action",
      "Add input and output guardrails and separate trusted instructions from untrusted content"
    ],
    correct:3,
    explain:`Why: Guardrails plus a clear boundary between trusted system instructions and untrusted user or document content directly reduce prompt-injection and instruction-leak risk. Broadening tool permissions (B) does the opposite, giving a hijacked prompt more capability to cause harm.` },

  /* Ch 75 - Bedrock API Keys vs IAM Credentials */
  { q:`A production service running on AWS compute needs to call Amazon Bedrock, and the security team requires short-lived, automatically rotated credentials scoped by policy rather than static secrets. Which approach fits?`,
    opts:[
      "Assign an IAM role to the compute so the service uses temporary credentials to call Bedrock",
      "Generate a long-lived Bedrock API key and paste it into the code",
      "Share one API key across every service in the account",
      "Embed static AWS access keys in an environment file on the host"
    ],
    correct:0,
    explain:`Why: An IAM role on the compute supplies short-lived, automatically rotated credentials scoped by policy, which meets the security requirement for production workloads. A long-lived API key pasted into code (B) is a static secret that does not rotate and is easily leaked, the very thing the team wants to avoid.` },

  /* Ch 76 - Amazon Bedrock Guardrails and Sensitive Data Protection */
  { q:`A customer-facing assistant must block disallowed topics, filter harmful content, and redact PII such as account numbers from both user inputs and model responses. Which capability implements this in one place?`,
    opts:[
      "Write custom regex filters scattered through the application code",
      "Rely on the base model to refuse everything unsafe on its own",
      "Configure Amazon Bedrock Guardrails with topic, content, and sensitive-information (PII) policies",
      "Turn off logging so sensitive data is never recorded"
    ],
    correct:2,
    explain:`Why: Bedrock Guardrails apply denied-topic, content-filter, and sensitive-information (PII redaction) policies to both inputs and outputs from one managed configuration. Relying on the base model to self-refuse (B) is inconsistent and unenforceable, which is why a dedicated guardrail layer exists.` }

];

/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
