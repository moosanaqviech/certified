<script>
/* =====================================================================

   QUESTIONS array. Everything below the END marker is the frozen engine.

/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Full Mock Exam 2",
  badge: "AWS ML Engineer Associate (MLA-C02)",
  blurb: "A full-length practice exam across all four MLA-C02 domains. Most questions have one best answer; a few ask you to select two.",
  coverage: "Mirrors the real exam shape: 65 questions sampling Domain 1 (Data Preparation for ML and AI), Domain 2 (ML and FM Development), Domain 3 (Deployment and Orchestration), and Domain 4 (Operating, Monitoring, and Securing).",
  minutes: 130,
  pass: 72
};

const QUESTIONS = [

  /* Ch 03 - Streaming Ingestion */
  { q:`A retailer streams IoT sensor readings into Amazon Kinesis Data Streams and needs stateful tumbling-window aggregations (per-device averages over 5-minute windows) computed with sub-second latency before the results are stored. Which service should process the stream?`,
    opts:[
      "Amazon Managed Service for Apache Flink",
      "AWS Lambda triggered per record",
      "A nightly AWS Glue batch job",
      "Amazon Athena queries run against the raw stream"
    ],
    correct:0,
    explain:`Why: Stateful windowed aggregations over a continuous stream are exactly what Amazon Managed Service for Apache Flink is built for, holding window state with low latency. Lambda (B) processes records statelessly and is awkward for maintaining 5-minute window state across invocations.` },

  /* Ch 04 - Merging Sources and Troubleshooting */
  { q:`An AWS Glue Spark job joins a 2 TB transactions table with a 50 MB reference table. The job is slow and CloudWatch shows heavy shuffle activity. What is the most effective fix?`,
    opts:[
      "Increase the number of retries configured on the job",
      "Convert the reference table to CSV before the join",
      "Broadcast the small reference table so the large table is not shuffled",
      "Disable job bookmarks on the job"
    ],
    correct:2,
    explain:`Why: Broadcasting the tiny reference table sends a copy to every executor so the 2 TB table stays in place, removing the shuffle that dominates the runtime. Adding retries (A) does not change the shuffle cost; it just reruns the same slow plan.` },

  /* Ch 05 - Vector Databases */
  { q:`A team building semantic search over millions of embeddings needs approximate nearest-neighbor search with metadata filtering and horizontal scaling, delivered as a managed service. Which vector store fits best?`,
    opts:[
      "Store the vectors as files in Amazon S3 and scan them on every query",
      "Amazon OpenSearch Service with the k-NN vector engine",
      "Amazon RDS for PostgreSQL with pgvector on a small instance",
      "Amazon DynamoDB with a numeric sort key"
    ],
    correct:1,
    explain:`Why: Millions of vectors needing approximate nearest-neighbor search, metadata filtering, and managed horizontal scaling is the Amazon OpenSearch Service k-NN case. Scanning raw files in S3 (A) forces a full linear comparison per query, which cannot hold interactive latency at millions of vectors.` },

  /* Ch 06 - Ingesting Multimodal Data */
  { q:`A team ingests customer support data made up of chat text, call-recording audio, and screenshot images, and must store each type where it can later feed ML pipelines cost-effectively. What is the best storage foundation?`,
    opts:[
      "Load everything as BLOB columns in Amazon RDS",
      "Keep only the text and discard the audio and images",
      "Store all three types as items in Amazon DynamoDB",
      "Store the raw objects in Amazon S3 with a consistent prefix and metadata scheme"
    ],
    correct:3,
    explain:`Why: Large, diverse binary objects such as audio and images alongside text belong in Amazon S3, which stores any object type cheaply and durably and integrates with ML pipelines. Packing audio and image blobs into RDS (A) is expensive and hits row and storage limits that object storage avoids.` },

  /* Ch 07 - SageMaker Feature Store */
  { q:`A team wants features computed once and reused for both low-latency real-time inference and large-scale training, with a guarantee that training and serving see the same feature values. Which capability provides this?`,
    opts:[
      "Amazon SageMaker Feature Store with its online and offline stores",
      "A CSV file regenerated separately for training and for serving",
      "Caching features only in the application layer",
      "Amazon ElastiCache used on its own"
    ],
    correct:0,
    explain:`Why: Feature Store keeps an online store for real-time reads and an offline store for training from the same feature definitions, which removes training-serving skew. Regenerating a CSV separately for each path (B) is precisely what causes skew, because the two pipelines can drift apart.` },

  /* Ch 08 - Feature Engineering */
  { q:`A regression model uses an income feature that is heavily right-skewed with a long tail of very high values, which hurts the model. Which transformation most directly addresses the skew?`,
    opts:[
      "One-hot encoding of the income values",
      "Min-max scaling to the 0 to 1 range",
      "A log transformation of the income values",
      "Dropping the income feature entirely"
    ],
    correct:2,
    explain:`Why: A log transform compresses a long right tail and makes a skewed distribution more symmetric, which helps models sensitive to scale and skew. Min-max scaling (B) only rescales the range and preserves the skew, so the long tail still distorts the model.` },

  /* Ch 09 - Encoding Features */
  { q:`A dataset has a categorical feature with over 10,000 unique high-cardinality values, and one-hot encoding would explode dimensionality. For a gradient-boosted tree model, which encoding is most appropriate?`,
    opts:[
      "One-hot encode all 10,000 categories",
      "Assign a random number to each category",
      "Tokenize the values as free text",
      "Label (ordinal) or target encoding to keep it a single numeric column"
    ],
    correct:3,
    explain:`Why: For high-cardinality categories feeding a tree model, label or target encoding keeps a compact numeric representation without the 10,000-column blowup of one-hot. One-hot (A) creates thousands of sparse columns that inflate memory and training time for little benefit here.` },

  /* Ch 10 - Transformation Tools */
  { q:`A data analyst with no coding experience needs to build a repeatable, visual data-cleaning recipe (deduplicate, standardize formats, fix types) on datasets in S3, with no servers to manage. Which tool fits best?`,
    opts:[
      "Hand-written PySpark on a self-managed Amazon EMR cluster",
      "AWS Glue DataBrew visual recipes",
      "A custom AWS Lambda function for each transformation",
      "Amazon Athena SQL scripts maintained by hand"
    ],
    correct:1,
    explain:`Why: A no-code, visual, repeatable cleaning recipe on S3 data with nothing to operate is exactly AWS Glue DataBrew. Writing PySpark on a self-managed EMR cluster (A) requires coding skill and cluster operations the analyst does not have.` },

  /* Ch 11 - Embedding Models */
  { q:`A team must convert a catalog of product descriptions into dense numerical vectors for semantic similarity search on Amazon Bedrock. Which model type should they use?`,
    opts:[
      "An embedding model such as Amazon Titan Text Embeddings",
      "A text-generation model prompted to summarize each product",
      "An image-generation model",
      "A speech-to-text model"
    ],
    correct:0,
    explain:`Why: Turning text into dense vectors for similarity search is precisely what an embedding model like Titan Text Embeddings does. A text-generation model (B) produces prose, not the fixed-length numeric vectors that semantic search compares.` },

  /* Ch 12 - Text Pre-Processing */
  { q:`Before training a domain NLP model on legal text full of specialized terms and abbreviations, the team finds a generic tokenizer splits key legal terms into meaningless subwords. Which pre-processing step most directly helps?`,
    opts:[
      "Lowercasing everything and removing all punctuation",
      "Padding all documents to a fixed length",
      "Extending the vocabulary with domain-specific terms and abbreviations before tokenization",
      "Randomly shuffling the words in each document"
    ],
    correct:2,
    explain:`Why: Adding domain terms and abbreviations to the vocabulary keeps legal concepts as coherent tokens instead of fragmenting them, improving the model's grasp of the domain. Simply lowercasing and stripping punctuation (A) does not stop the tokenizer from shattering specialized terms.` },

  /* Ch 13 - Preparing Documents for RAG */
  { q:`A RAG system over long technical manuals returns chunks that cut off mid-section and lose their heading context, hurting answer quality. Which chunking approach best preserves meaning and enables filtering?`,
    opts:[
      "One giant chunk per whole document",
      "Fixed 50-character chunks with no overlap",
      "Random splitting at arbitrary byte offsets",
      "Semantic or hierarchical chunking that respects section boundaries, with heading metadata attached"
    ],
    correct:3,
    explain:`Why: Chunking on section boundaries keeps each chunk self-contained, and attaching heading metadata lets retrieval filter and contextualize, both of which raise answer quality. Fixed 50-character chunks (B) slice sentences apart and carry no structure, producing the mid-section cutoffs described.` },

  /* Ch 14 - Masking, Redaction, Anonymization (MULTI) */
  { q:`A team must remove personally identifiable information from a support-ticket dataset before using it to fine-tune a model, and needs managed, automated ways to find and handle PII. Which TWO approaches are appropriate? (Select TWO.)`,
    opts:[
      "Use Amazon Comprehend PII detection to locate and redact entities such as names and emails in the text",
      "Apply Amazon Macie to discover and classify sensitive data in the S3 dataset",
      "Publish the raw tickets and rely on the model to ignore the PII",
      "Rename the S3 bucket to something obscure",
      "Store the data unencrypted to simplify access"
    ],
    correct:[0,1],
    explain:`Why: Comprehend PII detection finds and redacts sensitive entities in the text itself, and Macie discovers and classifies sensitive data across the S3 dataset, so together they locate and handle PII before training. Relying on the model to ignore PII (C) leaves the sensitive data in the training set, which is the risk being avoided.` },

  /* Ch 15 - Preparing Data for FM Customization */
  { q:`A team wants to fine-tune a foundation model on Amazon Bedrock so it follows their support tone and format. What data shape must they prepare?`,
    opts:[
      "A large corpus of unlabeled raw web text",
      "Labeled prompt-and-completion pairs in the required JSONL format",
      "Only a system prompt with no examples",
      "A set of images with captions"
    ],
    correct:1,
    explain:`Why: Supervised fine-tuning of a foundation model needs labeled prompt-and-completion pairs (in the required JSONL structure) that demonstrate the target behavior. Unlabeled raw text (A) is the input for continued pre-training, not the demonstration pairs supervised fine-tuning requires.` },

  /* Ch 16 - Cleaning Data */
  { q:`A training dataset has about 8% of rows missing the numeric "age" value at random, and the team does not want to discard those rows. Which handling is most appropriate?`,
    opts:[
      "Impute the missing age values, for example with the median",
      "Drop the age column entirely",
      "Replace every missing age with 0",
      "Delete all rows that have any missing value"
    ],
    correct:0,
    explain:`Why: Imputing the missing numeric values (for example with the median) preserves the rows and the feature while filling the gaps in a robust way. Replacing missing ages with 0 (C) injects a false value that skews the distribution and misleads the model.` },

  /* Ch 17 - Data Quality Validation */
  { q:`A team wants automated checks (completeness, uniqueness, allowed ranges) to run inside their ETL pipeline and fail the run when data quality drops below thresholds. Which capability fits best?`,
    opts:[
      "Manual spot-checks by an analyst each morning",
      "Amazon CloudWatch alarms on CPU usage",
      "AWS Glue Data Quality rules enforced in the pipeline",
      "Amazon Rekognition label detection"
    ],
    correct:2,
    explain:`Why: AWS Glue Data Quality defines rules such as completeness and allowed ranges and enforces them inside the pipeline, failing or flagging runs automatically. Manual morning spot-checks (A) are neither automated nor able to gate the pipeline before bad data flows downstream.` },

  /* Ch 18 - Labeling with Ground Truth */
  { q:`A team must label 100,000 images for an object-detection model, wants a managed labeling workflow with a private workforce and annotator consensus, and wants cost to fall as labeling proceeds. Which service fits?`,
    opts:[
      "Amazon Rekognition Custom Labels on its own",
      "A single spreadsheet shared with the team",
      "Amazon Comprehend",
      "Amazon SageMaker Ground Truth with automated data labeling"
    ],
    correct:3,
    explain:`Why: Ground Truth provides managed labeling jobs with private workforces, annotation consensus, and automated data labeling that cuts cost as the model learns from human labels. Rekognition Custom Labels (A) trains on labels you already have; it does not run the human annotation workflow itself.` },

  /* Ch 19 - Bias Metrics and Class Imbalance */
  { q:`A hiring model is trained on data where one demographic group makes up only 5% of positive outcomes, and the team wants to measure pre-training bias across groups. Which tool and approach fit?`,
    opts:[
      "Ignore the imbalance since the model will correct it",
      "Use SageMaker Clarify to compute pre-training bias metrics such as class imbalance and difference in positive label proportions",
      "Increase the learning rate",
      "Use ROUGE to measure fairness"
    ],
    correct:1,
    explain:`Why: SageMaker Clarify computes pre-training bias metrics (class imbalance, difference in proportions of labels) across groups, which is exactly what the team needs before training. Assuming the model self-corrects (A) is false, because class imbalance typically biases the model toward the majority outcome.` },

  /* Ch 20 - Validating AI Training Data */
  { q:`Before fine-tuning a foundation model, a team must screen its prompt-response training pairs for toxic or unsafe content and malformed examples. Which practice is most appropriate?`,
    opts:[
      "Run automated content-safety and format-validation checks over the pairs, removing unsafe or malformed examples",
      "Fine-tune first and inspect the outputs later",
      "Shuffle the pairs to hide the bad examples",
      "Increase the number of epochs to dilute the bad data"
    ],
    correct:0,
    explain:`Why: Screening the prompt-response pairs for unsafe content and malformed structure before training keeps toxic and broken examples out of the model. Fine-tuning first and inspecting later (B) bakes the bad behavior into the weights, which is far harder to undo than filtering upfront.` },

  /* Ch 24 - Fine-Tuning Strategies for FMs */
  { q:`A company has a base foundation model that answers well but knows nothing about its 5,000 internal product SKUs, and it holds thousands of labeled question-answer pairs about those products. It wants the model to answer product questions in its own voice with no external retrieval step. Which customization fits?`,
    opts:[
      "Continued pre-training on unlabeled logs",
      "Prompt engineering with a few examples",
      "Supervised fine-tuning on the labeled question-answer pairs",
      "Model distillation to a smaller model"
    ],
    correct:2,
    explain:`Why: Labeled question-answer pairs plus a goal of built-in behavior with no retrieval step is the supervised fine-tuning case, which teaches the model the specific answers and voice. Continued pre-training (A) needs a large unlabeled corpus and teaches domain fluency, not specific labeled answers.` },

  /* Ch 25 - RAG Architecture Patterns and Retrieval Optimization */
  { q:`A RAG system retrieves passages that are topically related but often misses the single most relevant passage, lowering answer accuracy. The initial vector search returns 20 candidates. Which optimization most directly improves which passage reaches the model?`,
    opts:[
      "Increase the foundation model's temperature",
      "Shorten the system prompt",
      "Switch to a smaller embedding model",
      "Add a reranking model to reorder the 20 candidates by relevance"
    ],
    correct:3,
    explain:`Why: A reranker reorders the initial candidate set by deeper relevance scoring, pushing the single best passage to the top for the model to use. Raising temperature (A) only makes generation more random and does nothing to improve which retrieved passage is selected.` },

  /* Ch 26 - AWS AI Services */
  { q:`A call center must convert thousands of recorded support calls into searchable text transcripts with speaker labels. The team has no ML engineers. Which service fits best?`,
    opts:[
      "Amazon Comprehend",
      "Amazon Transcribe",
      "Amazon Textract",
      "Amazon Rekognition"
    ],
    correct:1,
    explain:`Why: Converting speech audio into text transcripts with speaker labeling is Amazon Transcribe's core capability, available through an API with no ML skill required. Comprehend (A) analyzes text for sentiment and entities but cannot turn audio into transcripts in the first place.` },

  /* Ch 27 - Built-In Algorithms and Script Mode */
  { q:`A team needs to train a gradient-boosted model on tabular data quickly, wants a well-optimized AWS-maintained implementation, and does not want to write model code. Which option fits?`,
    opts:[
      "The SageMaker AI built-in XGBoost algorithm",
      "Bring your own container with a hand-coded booster",
      "Script mode with a custom PyTorch script",
      "Amazon Comprehend custom classification"
    ],
    correct:0,
    explain:`Why: A maintained, optimized tabular gradient-boosting implementation with no model code to write is exactly the built-in XGBoost algorithm. Bringing your own container (B) means writing and maintaining the algorithm and image, which the requirement explicitly avoids.` },

  /* Ch 28 - Training Mechanics */
  { q:`A model's training and validation loss both keep falling, but the job stops at a fixed epoch count before convergence, wasting a better result, while other runs overfit past a point. Which mechanism best addresses stopping at the right time automatically?`,
    opts:[
      "Always training for exactly 3 epochs",
      "Removing the validation set",
      "Early stopping based on the validation metric with a patience setting",
      "Increasing batch size to the maximum"
    ],
    correct:2,
    explain:`Why: Early stopping monitors the validation metric and halts when it stops improving, so training neither cuts off too soon nor overfits past the optimum. A fixed 3 epochs (A) is the arbitrary cutoff causing the problem, since the ideal epoch count varies per run.` },

  /* Ch 29 - Hyperparameter Optimization */
  { q:`A team runs SageMaker AI Automatic Model Tuning and wants the search to use results from completed training jobs to choose the next hyperparameter values intelligently rather than testing combinations blindly. Which tuning strategy fits?`,
    opts:[
      "Grid search",
      "Random search",
      "Manual guessing",
      "Bayesian optimization"
    ],
    correct:3,
    explain:`Why: Bayesian optimization builds a model of the objective from finished jobs and uses it to pick promising next configurations, which is exactly the informed search described. Grid search (A) evaluates a fixed lattice of combinations regardless of prior results, so it does not learn from completed jobs.` },

  /* Ch 30 - Overfitting, Underfitting, Catastrophic Forgetting */
  { q:`After fine-tuning a foundation model on a narrow customer-service dataset, the model answers support questions well but has lost general reasoning ability it had before. What is this called, and a reasonable mitigation?`,
    opts:[
      "Underfitting; train for more epochs on the narrow set",
      "Catastrophic forgetting; mix in general data during fine-tuning or use a lighter-touch method",
      "Overfitting; remove all regularization",
      "Data leakage; shuffle the labels"
    ],
    correct:1,
    explain:`Why: Losing prior general capability after narrow fine-tuning is catastrophic forgetting, mitigated by blending general examples into the fine-tuning data or using a lighter-touch adaptation. Calling it underfitting and training more on the narrow set (A) would deepen the forgetting by pushing further from the base capabilities.` },

  /* Ch 31 - Ensembles (MULTI) */
  { q:`A team wants to improve a tabular model's predictive accuracy by combining multiple models rather than relying on one. Which TWO ensemble techniques are valid ways to do this? (Select TWO.)`,
    opts:[
      "Bagging, training models on bootstrap samples and averaging their predictions",
      "Boosting, training models sequentially so each corrects the previous one's errors",
      "Using a single model but doubling its learning rate",
      "Deleting the validation set to add more training data",
      "Lowering the batch size to 1"
    ],
    correct:[0,1],
    explain:`Why: Bagging (bootstrap-sampled models averaged) and boosting (sequential error-correcting models) are both established ensemble methods that raise accuracy by combining learners. Doubling one model's learning rate (C) is a single-model hyperparameter change, not an ensemble, and can destabilize training.` },

  /* Ch 32 - Prompt Engineering vs Fine-Tuning */
  { q:`A team needs a foundation model to adopt a new output style for a one-off internal report, has only a handful of examples, and wants to iterate within a day at no training cost. Which approach fits best?`,
    opts:[
      "Fine-tune the model on the handful of examples",
      "Run continued pre-training on the report",
      "Prompt engineering with a few in-context examples",
      "Train a model from scratch"
    ],
    correct:2,
    explain:`Why: A one-off need, very few examples, same-day iteration, and no training budget is the prompt-engineering case: place a few examples in the prompt and adjust instantly. Fine-tuning (A) needs more data and a training cycle, which is overkill and too slow for a single one-off report.` },

  /* Ch 33 - Reproducible Experiments */
  { q:`A team runs dozens of training experiments and cannot reproduce which hyperparameters produced their best model. Which capability most directly solves this?`,
    opts:[
      "Managed MLflow on Amazon SageMaker AI to track parameters, metrics, and artifacts per run",
      "Storing only the final model file in Amazon S3",
      "Emailing results to the team after each run",
      "Increasing the training instance size"
    ],
    correct:0,
    explain:`Why: Managed MLflow logs the parameters, metrics, and artifacts of every run so any result can be traced back to its exact configuration. Saving only the final model file (B) discards the run history, leaving no record of which hyperparameters produced it.` },

  /* Ch 34 - Baselines, Drift, Shadow vs Production Variants */
  { q:`A deployed model's accuracy is slowly degrading in production and the team wants automated alerts when the live input data distribution drifts away from the training baseline. Which capability fits?`,
    opts:[
      "Automatic Model Tuning",
      "SageMaker Ground Truth",
      "Amazon Textract",
      "SageMaker Model Monitor with a data-quality baseline and drift alerts"
    ],
    correct:3,
    explain:`Why: Model Monitor captures a baseline from the training data and continuously compares live traffic to it, alerting when the distribution drifts. Automatic Model Tuning (A) searches hyperparameters during training and has no role in monitoring a deployed model for drift.` },

  /* Ch 35 - Classification and Regression Metrics */
  { q:`A house-price regression model must be evaluated so that large prediction errors are penalized more heavily than small ones, expressed in the same units as price. Which metric fits best?`,
    opts:[
      "Accuracy",
      "Root mean squared error (RMSE)",
      "F1 score",
      "ROC AUC"
    ],
    correct:1,
    explain:`Why: RMSE is a regression metric in the target's own units that squares errors, penalizing large misses more than small ones, matching the requirement. Accuracy (A) and F1 are classification metrics and are undefined for continuous price predictions.` },

  /* Ch 36 - Explaining Outputs and Debugging */
  { q:`During training, a deep model's loss suddenly explodes to NaN partway through, and the team wants to inspect gradients and tensors to find the cause, such as vanishing or exploding gradients. Which tool fits?`,
    opts:[
      "SageMaker Clarify",
      "Amazon Macie",
      "SageMaker Debugger with built-in rules for exploding gradients and loss-not-decreasing",
      "AWS CloudTrail"
    ],
    correct:2,
    explain:`Why: Debugger captures tensors and gradients during training and offers built-in rules for issues like exploding gradients, which is exactly the convergence problem here. Clarify (A) explains predictions and measures bias; it does not inspect training-time gradients and tensors.` },

  /* Ch 37 - NLP Evaluation Metrics */
  { q:`A team evaluates a machine-translation model against reference translations and wants a standard precision-oriented n-gram overlap metric designed for translation. Which metric fits?`,
    opts:[
      "BLEU",
      "RMSE",
      "ROUGE-L recall",
      "R-squared"
    ],
    correct:0,
    explain:`Why: BLEU is the standard precision-oriented n-gram overlap metric built specifically for machine translation against references. RMSE (B) is a regression metric for numeric predictions and does not apply to comparing generated text with references.` },

  /* Ch 38 - Human-in-the-Loop and LLM-as-a-Judge */
  { q:`A team must certify that a medical-summary generator meets a strict quality bar before launch, where subtle factual errors carry high risk and nuanced judgment is required. For the final pre-launch sign-off, which evaluation is most appropriate?`,

      "LLM-as-a-judge alone with no oversight",
      "A human-in-the-loop expert review of a sampled set of outputs"

    correct:3,
    explain:`Why: High-stakes, nuanced correctness for a final sign-off calls for human expert review, which catches the subtle factual errors that automated scores miss. Exact string match (A) fails valid paraphrases and cannot judge medical correctness, making it unfit for a high-risk certification.` },

  /* Ch 39 - RAG System Monitoring */
  { q:`A RAG assistant's answer quality dropped after new documents were added. The team suspects retrieval is now surfacing the wrong passages. Which metric should they monitor to confirm a retrieval-side problem?`,

  /* Ch 49 - Programmatic Deployment in a VPC */
  { q:`A team deploys a SageMaker AI endpoint from Boto3 and must ensure the endpoint has no internet access and can reach Amazon S3 privately for compliance. Which configuration fits?`,

  /* Ch 50 - Auto Scaling */
  { q:`A real-time SageMaker AI endpoint sees traffic that spikes during business hours and is idle overnight, and the team wants to add and remove instances automatically based on load. Which approach fits best?`,

  /* Ch 52 - Agent State Management */
  { q:`A conversational agent must remember context across turns within a session and, for some users, across sessions, so it does not lose track mid-task. Which approach fits best?`,

  /* Ch 53 - Deployment Strategies and Rollback (MULTI) */
  { q:`A team wants to limit blast radius when rolling out a new model version to a busy endpoint and revert automatically on failure. Which TWO practices apply? (Select TWO.)`,

  /* Ch 54 - CI/CD */
  { q:`A team wants an automated pipeline that, on each commit to their repository, builds a container, runs tests, and deploys the model endpoint, orchestrating the stages end to end. Which service orchestrates the overall workflow?`,

  /* Ch 55 - Automated Testing for ML and AI Pipelines */
  { q:`A team wants their CI pipeline to automatically catch when a prompt change degrades an LLM feature's output quality before it reaches production. Which practice fits best?`,

      "Automated prompt tests that score outputs against expected criteria in the pipeline, failing the build on regression"

    correct:3,

  /* Ch 62 - A/B Testing in Production */

  { q:`A production multi-step agent sometimes fails silently: a tool call times out and the agent returns an incomplete answer. The team wants visibility into each step, tool latency, and failures. Which approach fits best?`,

  /* Ch 71 - Least Privilege and IAM */
  { q:`A SageMaker AI training job needs to read one specific S3 bucket and write to another, and nothing else. Following least privilege, how should its execution role be configured?`,

    explain:`Why: CloudTrail records API calls (who, what, and when) across the account, which is exactly the audit trail required. CloudWatch metrics (A) capture performance and utilization numbers, not the identity-and-action API history an audit needs.` },

  /* Ch 73 - Network Isolation (MULTI) */
  { q:`A team must isolate a SageMaker AI inference endpoint so it has no inbound internet exposure and tight control over which resources can reach it. Which TWO measures apply? (Select TWO.)`,
    opts:[
      "Deploy the endpoint's resources in private subnets within a VPC",
      "Use security groups to allow traffic only from approved sources",
      "Assign the endpoint a public IP and open it to 0.0.0.0/0",
      "Disable all IAM authentication",
      "Place the endpoint in a public subnet with an internet gateway route"
    ],
    correct:[0,1],
    explain:`Why: Private subnets keep the endpoint off the public internet and security groups restrict inbound access to approved sources, together delivering the isolation required. Assigning a public IP open to 0.0.0.0/0 (C) exposes the endpoint to the whole internet, the opposite of isolation.` },

  /* Ch 74 - Troubleshooting Security and Mitigating AI Risks */
  { q:`A public-facing LLM application is being manipulated by users who embed instructions in their input to override the system prompt and leak internal data (prompt injection). Which mitigation is most appropriate?`,
    opts:[
      "Raise the model temperature",
      "Give the model broader data access to satisfy requests",
      "Add input and output guardrails, validate and constrain inputs, and limit the model's data access to least privilege",
      "Remove all logging so attacks are not recorded"
    ],
    correct:2,
    explain:`Why: Layering guardrails, input validation, and least-privilege data access limits what an injected instruction can achieve and what it can reach, directly mitigating prompt injection. Giving the model broader data access (B) increases the blast radius of a successful injection, making the risk worse.` },

  /* Ch 75 - Bedrock API Keys vs IAM Credentials */
  { q:`An enterprise application running on AWS infrastructure needs long-term, auditable, least-privilege access to Bedrock foundation models, integrated with existing IAM roles and policies. Which credential approach fits best?`,
    opts:[
      "Share one long-lived Bedrock API key across all services",
      "Use IAM roles with scoped policies (for example an instance or execution role) to call Bedrock",
      "Embed personal user passwords in the app",
      "Disable authentication inside the VPC"
    ],
    correct:1,
    explain:`Why: IAM roles with scoped policies give temporary, auditable, least-privilege access that integrates with existing AWS identity controls, which suits an enterprise application on AWS. A single shared long-lived API key (A) is hard to scope per service, rotate, and audit, weakening security compared with IAM roles.` },

  /* Ch 76 - Bedrock Guardrails and Sensitive Data Protection */
  { q:`A customer-facing GenAI assistant must block disallowed topics, filter harmful content, and redact PII such as credit card numbers from both user inputs and model responses, configured centrally and reused across models. Which capability fits?`,
    opts:[
      "Amazon Bedrock Guardrails",
      "Amazon Macie on its own",
      "A longer system prompt asking the model to behave",
      "Amazon CloudWatch alarms"
    ],
    correct:0,
    explain:`Why: Bedrock Guardrails centrally enforces denied topics, content filters, and PII redaction on both inputs and outputs and can be reused across models. Relying on a longer system prompt (C) is easily bypassed by prompt injection and gives no consistent, enforced PII redaction the way Guardrails does.` }

];
/* ===== EXAM PAYLOAD - END ===== */
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
