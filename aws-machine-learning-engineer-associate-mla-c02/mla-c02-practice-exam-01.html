<script>
/* =====================================================================

   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.

/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Practice Exam 1",
  badge: "AWS ML Engineer Associate (MLA-C02)",
  blurb: "Scenario-based questions across Unit 1, Data Preparation for ML and AI. Most have one best answer; a few ask you to select two.",
  coverage: "Covers Unit 1 (Domain 1): all 20 chapters across Modules 1.1, 1.2, and 1.3. One question per chapter.",
  minutes: 40,
  pass: 72
};

const QUESTIONS = [

  /* Ch 01 - Choosing Data Formats */
  { ref:{chapter:1}, q:`A 6 TB clickstream table lives in S3 as gzipped CSV. Analysts and a daily feature job query 8 of its 180 columns through Amazon Athena, and scanned-bytes costs keep rising. What is the most effective change?`,
    opts:[
      "Split the CSV into thousands of smaller gzip files to increase parallelism",
      "Convert the data to Apache Parquet with an AWS Glue job or an Athena CTAS query",
      "Convert the data to JSON Lines so Athena parses only the needed fields",
      "Load the table into Amazon DynamoDB and query the 8 attributes by key"
    ],
    correct:1,
    explain:`Parquet is columnar, so Athena reads only the requested columns and skips blocks by statistics, which is what drives scanned bytes and cost down. Splitting the CSV (A) adds parallelism but every reader still scans all 180 columns of every row, so bytes scanned barely change.` },

  /* Ch 02 - Storage Decisions */
  { ref:{chapter:2}, q:`A fraud model needs each customer's last ten transactions at inference time, looked up by customer ID in under 10 milliseconds at high request rates. Where should this data live?`,
    opts:[
      "Parquet files in S3, read with Fast File mode",
      "An Amazon RDS read replica queried with SQL by customer ID",
      "An Amazon DynamoDB table keyed on customer ID",
      "An Amazon OpenSearch Service index with customer ID as a keyword field"
    ],
    correct:2,
    explain:`Single-digit millisecond reads by key at any scale is DynamoDB's core profile, the usual online store for inference-time features. The RDS replica (B) can do a keyed lookup but ties latency to a relational engine sized for transactions and competes with application traffic. S3 (A) is for training scans, not per-request lookups.` },

  /* Ch 03 - Streaming Ingestion and Transformation */
  { ref:{chapter:3}, q:`A fraud feature needs the count of transactions per card over a 5-minute sliding window, joined against a second stream of card-status updates, with sub-second latency and exactly-once results. Which service fits?`,
    opts:[
      "A Lambda function using tumbling windows on the transaction stream",
      "Amazon Managed Service for Apache Flink consuming both streams",
      "Amazon Data Firehose with a Lambda transform and a 60-second buffer",
      "An AWS Glue streaming job with schema detection enabled"
    ],
    correct:1,
    explain:`Sliding windows, a stream-to-stream join, durable state, and exactly-once via checkpoints are exactly what Managed Service for Apache Flink provides. Lambda tumbling windows (A) aggregate per shard but cannot slide or join a second stream. Glue with schema detection cannot join streaming data and its 100-second micro-batches miss the latency target.` },

  /* Ch 04 - Merging Sources and Troubleshooting */
  { ref:{chapter:4}, q:`An AWS Glue job converts two million small JSON files from S3 into Parquet. The driver's memory climbs past 50% within minutes while executors stay below 5%, and the run fails with Exit Code 1. What should the ML engineer change?`,
    opts:[
      "Read the input as a DynamicFrame with groupFiles set to inPartition",
      "Double the number of G.1X workers so more executors share the files",
      "Enable job bookmarks so each run processes fewer files",
      "Switch the job to an R.4X memory-optimized worker type"
    ],
    correct:0,
    explain:`Idle executors and a saturated driver mean the driver is drowning in per-file bookkeeping; file grouping lets each task read a whole group, so the driver tracks far fewer tasks. Adding workers (B) scales executors, which are not the bottleneck. A bigger worker (D) postpones the same task-per-file failure.` },

  /* Ch 05 - Vector Databases for AI */
  { ref:{chapter:5}, q:`A legal team wants an Amazon Bedrock knowledge base over 600 million contract chunks. Analysts run a few hundred queries a day, sub-second answers are acceptable, and the main requirement is lowest storage and operating cost. Which vector store fits?`,
    opts:[
      "An Amazon OpenSearch Service domain sized so all HNSW graphs fit in memory",
      "An Amazon OpenSearch Serverless vector collection with the OCU minimum raised",
      "Aurora PostgreSQL with pgvector on a large memory-optimized instance",
      "An Amazon S3 Vectors index chosen as the knowledge base vector store"
    ],
    correct:3,
    explain:`Infrequent queries, a huge corpus (S3 Vectors indexes hold up to 2 billion vectors), acceptable sub-second latency, and cost as the deciding axis is exactly the S3 Vectors workload, and Knowledge Bases supports it directly. A Serverless collection (B) still pays for OCUs and memory whenever it serves, far more than pay-per-use object storage.` },

  /* Ch 06 - Ingesting Multimodal Data */
  { ref:{chapter:6}, q:`Two million product photos sit in S3 and their labels sit in a CSV keyed by file name. The team wants to train a SageMaker AI image classifier without a preprocessing job that joins labels to pixels. What should they build?`,
    opts:[
      "A Glue job that copies each image into a folder named after its label",
      "A Parquet table with the image bytes stored in a binary column",
      "A DynamoDB table mapping file names to labels that the training script queries",
      "An augmented manifest in JSON Lines with an image-ref URI and label per line, read in Pipe mode"
    ],
    correct:3,
    explain:`The augmented manifest is SageMaker AI's mechanism for attaching metadata to S3 objects at training time: the job follows each -ref URI and passes the listed attributes to the algorithm, no join step. Copying images into label folders (A) works but duplicates two million objects to encode one column a manifest line carries for free.` },

  /* Ch 07 - SageMaker Feature Store (MULTI) */
  { ref:{chapter:7}, q:`A team uses an online-and-offline SageMaker Feature Store feature group for a real-time model. Which TWO statements are correct? (Select TWO.)`,
    opts:[
      "The online store keeps every historical record per identifier",
      "The online store keeps only the record with the latest event time per identifier",
      "A PutRecord with an event time earlier than the stored one still overwrites the online value",
      "The offline store is append-only and reaches S3 within about 15 minutes"
    ],
    correct:[1,3],
    explain:`The online store retains only the latest-event-time record per identifier, and the offline store appends all history to S3 within about 15 minutes. The online store does not keep full history (A), and an earlier event time is ignored, not written (C), which is the semantics that trips up backfills.` },

  /* Ch 08 - Feature Engineering */
  { ref:{chapter:8}, q:`A logistic regression model uses transaction amount as a feature. Amounts are heavily right-skewed: most under 50, a few near 200,000, and the model underfits the typical range. Which transform should come first?`,
    opts:[
      "Min-max scale the amount to the range 0 to 1",
      "One-hot encode the amount",
      "Apply a log1p transform, then standardize",
      "Drop every row with an amount above 10,000"
    ],
    correct:2,
    explain:`A log compresses the long tail so the typical range stops being squeezed into a sliver, and the following standardization gives the linear model a well-behaved input. Min-max (A) is the trap: with a 200,000 maximum, ordinary transactions land within a fraction of a percent of zero, the very compression the team is suffering.` },

  /* Ch 09 - Encoding Features */
  { ref:{chapter:9}, q:`A payments model uses a merchant-name column with 40,000 distinct values, many misspelled variants of the same merchant, feeding a logistic regression. How should the column be encoded?`,
    opts:[
      "Similarity encoding, so typo variants map to nearby vectors at fixed width",
      "One-hot encoding with one column per merchant",
      "Ordinal encoding sorted alphabetically",
      "Drop the column since it has too many values to be useful"
    ],
    correct:0,
    explain:`Similarity encoding tokenizes each name into character 3-grams and min-hashes them into a low-dimensional embedding, so misspellings land close together and 40,000 values become about 30 columns. One-hot (B) is order-free but produces 40,000 sparse columns and treats every misspelling as an unrelated merchant.` },

  /* Ch 10 - Transformation Tools */
  { ref:{chapter:10}, q:`Marketing analysts get a new CSV every Monday with inconsistent dates, nulls, and typos in region names. They cannot write code and want the same cleanup applied automatically each week, with a data quality profile. Which tool should the ML engineer set up?`,
    opts:[
      "A Spark job on EMR scheduled weekly with Amazon EventBridge",
      "A SageMaker Data Wrangler flow the analysts rerun in Studio each week",
      "AWS Glue DataBrew: a saved recipe run as a scheduled recipe job, plus a profile job",
      "An Amazon Athena CTAS query the analysts edit each week"
    ],
    correct:2,
    explain:`DataBrew is built for non-coders: a recipe captures the cleanup once, a scheduled recipe job reapplies it, and profile jobs report quality. The Data Wrangler flow (B) can do the transforms but is a SageMaker AI tool for ML practitioners, and the analysts have no model to feed and no SageMaker environment.` },

  /* Ch 11 - Embedding Models */
  { ref:{chapter:11}, q:`A team embeds a knowledge base with Cohere Embed using input_type "classification" for every call, then embeds user questions the same way. Retrieval returns weak matches. What should change?`,
    opts:[
      "Set truncate to NONE so long documents are not cut",
      "Switch to int8 embeddings to reduce noise",
      "Embed the corpus with search_document and the questions with search_query",
      "Increase the vector index dimension to 2,048"
    ],
    correct:2,
    explain:`Cohere's input_type prepends tokens that shape the vector for its job; the documented retrieval pairing is search_document for stored content and search_query for queries. Truncation (A) can lose tails but would not cause uniformly weak matches, and the dimension (D) is fixed at 1,024 by the model.` },

  /* Ch 12 - Text Pre-Processing */
  { ref:{chapter:12}, q:`An application builds prompts from retrieved documents and intermittently fails with input-too-long errors on one Bedrock model but not another. The team wants to fix it without guessing at limits. What should they do?`,
    opts:[
      "Cap prompts at 4 characters per token times the context limit",
      "Call the Bedrock CountTokens API for the target model and trim retrieved text to fit",
      "Lowercase and strip whitespace so the prompt tokenizes to fewer tokens",
      "Set both models to the same tokenizer in the request body"
    ],
    correct:1,
    explain:`Tokenization is model-specific, and CountTokens returns the exact count a model would charge, free of charge, so the app trims to the real per-model limit. The characters-per-token estimate (A) is fine for planning dataset size but is the guess that produces intermittent failures. Tokenizers are not a request parameter (D).` },

  /* Ch 13 - Preparing Documents for RAG */
  { ref:{chapter:13}, q:`A legal knowledge base built with default chunking retrieves the right clause, but answers are wrong because the clause depends on definitions two paragraphs earlier. Which chunking change fixes this?`,
    opts:[
      "Hierarchical chunking, so matched child chunks are returned as their larger parent chunks",
      "Semantic chunking with a low breakpoint threshold to create more chunks",
      "No chunking, so each contract is retrieved whole",
      "Fixed-size chunking with overlap set to zero to avoid duplicated text"
    ],
    correct:0,
    explain:`Hierarchical chunking keeps retrieval precise with small child chunks and delivers surrounding definitions via the parent chunk. No chunking (C) also returns context but a whole contract as one embedding matches poorly and drops page numbers from citations. A lower semantic threshold (B) makes chunks smaller, the opposite of what is needed.` },

  /* Ch 14 - Masking, Redaction, and Anonymization (MULTI) */
  { ref:{chapter:14}, q:`A dataset must be anonymized so that analysts cannot recover the original values by any means. Which TWO DataBrew techniques are irreversible? (Select TWO.)`,
    opts:[
      "CRYPTOGRAPHIC_HASH on the column",
      "DETERMINISTIC_ENCRYPT with a stored key",
      "SHUFFLE_ROWS within the column",
      "ENCRYPT (probabilistic) with a stored key"
    ],
    correct:[0,2],
    explain:`Hashing and shuffling cannot be reversed to the original values, so they truly anonymize. Both encryption options (B and D) are designed to be decrypted by a key holder, which makes them pseudonymization, not anonymization; deterministic encryption is the common trap because it preserves joins but is still reversible.` },

  /* Ch 15 - Preparing Data for FM Customization */
  { ref:{chapter:15}, q:`An engineering firm has 200 GB of internal technical manuals and a base model that misuses the firm's terminology. Labeling examples is not feasible. Which dataset should the ML engineer prepare first?`,
    opts:[
      "A distillation prompt set generated from manual headings",
      "A messages-format fine-tuning set with the manuals as assistant turns",
      "A metadata sidecar per manual for a knowledge base",
      "A cleaned, deduplicated input-only JSONL corpus for continued pre-training"
    ],
    correct:3,
    explain:`Domain language with no labels is the continued pre-training case: cleaned passages with an input field only, in volume. A knowledge base (C) exposes the manuals at retrieval time but hands the model passages at runtime and does not change how the model itself uses the terminology.` },

  /* Ch 16 - Cleaning Data */
  { ref:{chapter:16}, q:`A model trained on scraped reviews scores 0.98 on its test set but 0.71 in production. Investigation shows many reviews appear two or three times across the file. What went wrong and what fixes it?`,
    opts:[
      "Duplicates put the same review in train and test; deduplicate before splitting",
      "The learning rate is too high; lower it and retrain",
      "The test set is too small; raise its share to 40%",
      "Missing values were mean-imputed; use the median instead"
    ],
    correct:0,
    explain:`When duplicates are split after the fact, copies land on both sides, so the model is tested on rows it trained on and the score inflates, exactly the train-versus-production gap. Enlarging the test set (C) changes the ratio but still lets duplicates straddle the split, so the leak remains.` },

  /* Ch 17 - Data Quality Validation */
  { ref:{chapter:17}, q:`A nightly ETL pipeline must refuse to load a batch into the data lake when more than 1% of customer IDs are null or any ID is duplicated, and it must record exactly which rows failed. Which approach fits?`,
    opts:[
      "A DataBrew profile job scheduled to run after the load",
      "AWS Glue Data Quality rules in the ETL job, with completeness and uniqueness checks",
      "Data Wrangler Data Insights run manually each morning",
      "Amazon Macie sensitive data discovery on the batch"
    ],
    correct:1,
    explain:`Glue Data Quality in an ETL job evaluates DQDL rules before the data lands and can identify the exact failing records, which is precisely the gate described. A DataBrew profile job (A) reports quality but running after the load means the bad batch is already in the lake, and profiling does not itself block the pipeline.` },

  /* Ch 18 - Labeling and Annotation */
  { ref:{chapter:18}, q:`A hospital needs 300,000 unreleased medical images labeled with bounding boxes on a limited budget, and the images cannot leave its control. How should the Ground Truth job be configured?`,

  /* Ch 19 - Bias Metrics and Class Imbalance (MULTI) */

  /* Ch 20 - Validating AI Training Data */

const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
