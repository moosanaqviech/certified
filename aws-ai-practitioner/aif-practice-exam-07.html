<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Full Mock 3",
  badge: "AWS AI Practitioner (AIF-C01)",
  blurb: "A full-length mock: 50 scenario questions across all five domains at the official weights, 90 minutes. Most questions have one best answer; a few ask you to select two. Pass mark is 70%, our practice target (the real exam reports a scaled score of 700 out of 1,000).",
  coverage: "All five domains, sampled at the official weights: 10 Fundamentals of AI and ML, 12 Fundamentals of GenAI, 14 Applications of Foundation Models, 7 Responsible AI, 7 Security and Governance. Its own scenarios, never reused in drills.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

  /* Ch 03 - Inference types · Objective 1.1.3 */
  {
    q:`A mobile network operator has a churn model trained in Amazon SageMaker AI. Every Sunday night it wants a churn score for all 8 million subscribers, written to Amazon S3 so the marketing team can plan Monday's retention campaign. No application calls the model at any other time. Which inference type fits best?`,
    opts:[
      "Real-time inference on a persistent endpoint",
      "A batch transform job over the full subscriber dataset",
      "Serverless inference, so idle time is not paid for",
      "Asynchronous inference with an SNS notification per subscriber"
    ],
    correct:1,
    explain:`Scoring an entire dataset on a schedule, with results needed by morning and no on-demand callers, is the batch case: a batch transform job reads the data from S3, writes results back, and its instances are deleted when the job ends. Serverless is the tempting option because it also avoids paying for idle time, but it is built for intermittent requests with payloads up to 4 MB, not for scoring a whole dataset in one job. A real-time endpoint would bill all week for one night of work, and asynchronous inference queues individual large requests rather than scoring a whole dataset.`
  },

  /* Ch 06 - When AI adds value · Objective 1.2.1 */
  {
    q:`A hotel group's reservations team reads about 20,000 guest emails a day and forwards each one to billing, events, housekeeping, concierge or loyalty. Two years of past emails are already tagged with the department that handled them, and an occasional misrouted email is a minor delay. What is the best use of AI/ML here?`,
    opts:[
      "No ML: hire more staff, because a model can sometimes be wrong",
      "A keyword rule list, because rules are always the cheaper option",
      "A model that writes a full reply to every email with no review",
      "A model that classifies each email and routes it automatically"
    ],
    correct:3,
    explain:`Routine sorting at high volume, with labeled history and tolerable errors, is the automation case for ML: a classifier learns the routing from the tagged emails and does the forwarding. The keyword list is the tempting option because rules can be a good baseline, but email wording varies too much for a fixed list to state the pattern fully. Hiring more staff ignores a clear scale problem, and auto-replying with no review is a different, riskier task than the one described.`
  },

  /* Ch 07 - Regression, classification or clustering · Objective 1.2.3 */
  {
    q:`A wind farm operator records, for every turbine and every past day, the weather forecast and the exact megawatt-hours the turbine produced. It wants to tell the grid operator how many megawatt-hours each turbine will produce tomorrow. Which technique fits?`,
    opts:[
      "Regression on the daily output in megawatt-hours",
      "Binary classification of high and low output days",
      "Clustering turbines by their output patterns",
      "Multiclass classification into three output bands"
    ],
    correct:0,
    explain:`The grid operator needs a number, and history has the true number attached, so this is supervised regression (a forecast of a value is still a regression-style question). Banding the output into classes is the tempting option because it sounds simpler, but it throws away the exact quantity the operator asked for. Clustering finds groups without predicting anything, and a yes or no answer is not an amount.`
  },

  /* Ch 08 - Real-world AI applications · Objective 1.2.4 */
  {
    q:`A streaming service has 30,000 hours of older shows with no subtitles. It wants the spoken dialogue in each episode turned into on-screen text so viewers can watch with captions. Which type of AI application does this need first?`,
    opts:[
      "Natural language processing to detect the sentiment of each scene",
      "Computer vision to detect objects and faces in the video frames",
      "Speech recognition to convert the spoken audio into text",
      "A recommendation system that suggests shows with captions"
    ],
    correct:2,
    explain:`The input is recorded speech and the output is text, which is speech recognition. NLP is the tempting option because captions are text, but NLP analyzes text that already exists; the dialogue has to be transcribed before any language analysis could run. Computer vision reads the picture, not the soundtrack, and recommendations do not create captions.`
  },

  /* Ch 09 - AWS managed AI services · Objective 1.2.5 */
  {
    q:`A resort chain wants guests to phone in and say things like "book a massage for Friday afternoon". The system must understand the request, fill in missing details by asking follow-up questions, and reply out loud in a natural voice. The chain has no machine learning staff. Which TWO AWS services fit this voice bot best?`,
    opts:[
      "Amazon Lex",
      "Amazon Transcribe",
      "Amazon Polly",
      "Amazon Comprehend",
      "A custom speech model trained in Amazon SageMaker AI"
    ],
    correct:[0,2],
    explain:`Amazon Lex builds conversational interfaces for voice and text, mapping the request to an intent and slots to fill, and Amazon Polly turns the bot's text replies into lifelike speech. Amazon Transcribe is the tempting option because it is a speech service, but its job in this design would be converting recorded calls into text for records and review, not running the conversation. Comprehend analyzes text for meaning and sentiment, and a custom SageMaker AI model is unnecessary work when ready-made services already do the job.`
  },

  /* Ch 10 - Traditional ML vs foundation models · Objective 1.2.6 */
  {
    q:`A power utility wants to predict transformer failures from vibration and temperature sensor readings. The model must run on small devices at remote substations with unreliable connectivity and respond in milliseconds. Years of sensor history labeled with past failures are available. Which approach fits best?`,
    opts:[
      "Send each sensor reading to a foundation model through Amazon Bedrock",
      "Run a large multimodal foundation model on each substation device",
      "Train a small traditional classifier on the labeled sensor history",
      "Prompt a foundation model with a summary of the substation manuals"
    ],
    correct:2,
    explain:`Structured sensor data, one prediction, labeled history and tight operational constraints (small devices, millisecond latency, poor connectivity) all point to a lean traditional model. Calling a foundation model through Amazon Bedrock is the tempting option because it is the easy default for AI on AWS, but every call needs a network round trip and costs more per prediction, which the remote substations cannot rely on. A large FM is far too heavy for a small device, and manuals in a prompt do not predict failures from sensor readings.`
  },

  /* Ch 11 - The AI/ML pipeline · Objective 1.3.1 */
  {
    q:`A freight company is starting an ML project on delivery delays. Before changing any data, a data scientist plots the distribution of delivery times, checks correlations between distance and delay, and counts missing values and outliers. Which pipeline stage is this?`,
    opts:[
      "Exploratory data analysis",
      "Pre-processing to clean the data",
      "Feature engineering",
      "Model evaluation on test data"
    ],
    correct:0,
    explain:`Looking at the data before changing it, through statistics, distributions, correlations, missing values and outliers, is exploratory data analysis (EDA). Pre-processing is the tempting option because it also deals with missing values and outliers, but pre-processing fixes or drops them, and the scenario says nothing has been changed yet. Feature engineering creates new inputs, and evaluation scores a trained model on test data.`
  },

  /* Ch 12 - Model sources · Objective 1.3.2 */
  {
    q:`A news agency wants to caption its photo archive quickly and has no labeled captions. It plans to adopt a pre-trained open-source model from Amazon SageMaker JumpStart instead of training its own. Which statement about this choice is accurate?`,
    opts:[
      "The agency will know exactly what data the model learned from",
      "A large labeled caption dataset is needed before the first use",
      "Open-source weights may be used for any purpose without review",
      "A license sets how it may be used, and others chose its data"
    ],
    correct:3,
    explain:`A pre-trained model is fast to start with and needs no training data, but it comes with a license that sets how it may be used, and its training data was chosen by someone else, so the agency inherits any gaps or biases. The idea that open weights allow any use is the tempting option because open-source sounds unrestricted, but some models even require accepting an end user license agreement first. Known lineage is a benefit of a custom-trained model, not an adopted one, and a pre-trained model needs no large labeled dataset to start.`
  },

  /* Ch 12 - Hosting a model in production · Objective 1.3.3 */
  {
    q:`A broadcaster's data team customized an open-source language model of an architecture that Amazon Bedrock supports for import. The team does not want to choose, patch or scale instances. Which statement about serving this model is accurate?`,
    opts:[
      "Any model a team trained itself must run on an endpoint it manages",
      "Amazon Bedrock Custom Model Import can serve it as a managed API",
      "The model must be pre-trained again inside Amazon Bedrock first",
      "Amazon Quick can host the model for the broadcaster's developers"
    ],
    correct:1,
    explain:`A self-trained model usually needs self-hosting, unless the managed service can import it, and Amazon Bedrock Custom Model Import does exactly that for supported open-source architectures, so the provider runs the infrastructure. The self-hosting option is the tempting one because it is the usual rule for custom models, but the supported architecture is the exception that removes it. Pre-training again is the most expensive step there is and solves nothing, and Amazon Quick is a workspace for business users, not a model host.`
  },

  /* Ch 11 - AWS services along the pipeline · Objective 1.3.4 */
  {
    q:`A car parts manufacturer has 50,000 photos of welds and needs each one labeled "good" or "defective" by human workers before it can train a custom inspection model. Which AWS service or feature is built for this stage?`,
    opts:[
      "Amazon SageMaker Ground Truth",
      "Amazon SageMaker AI Feature Store",
      "Amazon Quick and its Quick Sight dashboards",
      "Kiro, generating labels from a written spec"
    ],
    correct:0,
    explain:`Labeling training data with human workers is the job of SageMaker Ground Truth, a SageMaker AI feature for the data stages of the pipeline. Feature Store is the tempting option because it also sits in the data stages, but it stores engineered features for reuse in training and inference; it does not get images labeled. Amazon Quick serves business users exploring data, and Kiro is a developer's agentic IDE that writes code.`
  },

  /* Ch 15 - Tokens, chunking, embeddings and vectors · Objective 2.1.1 */
  {
    q:`A sports broadcaster's archive holds millions of untagged photos. Editors want to type "fans celebrating in the rain at a stadium" and get back matching photos that already exist in the archive. Which approach fits best?`,
    opts:[
      "A text-only LLM that writes a detailed description of the scene",
      "A diffusion model that creates a new image from the text description",
      "Multimodal embeddings of photos and text, with similarity search",
      "A model with a larger context window that reads the whole archive"
    ],
    correct:2,
    explain:`A multimodal embedding model, such as Amazon Titan Multimodal Embeddings, places images and text in one shared space, so a text query's vector lands near the vectors of matching photos and a similarity search finds them. The diffusion model is the tempting option because it turns a description into an image, but it invents a new picture instead of finding real archive photos. A text-only LLM returns words, and no context window holds millions of photos.`
  },

  /* Ch 17 - GenAI use cases · Objective 2.1.2 */
  {
    q:`A telecom company is modernizing a decades-old billing system. Its engineers want an AI tool that converts the legacy code into Java, explains modules nobody on the team understands, and writes tests for the new version. Which GenAI use case is this?`,
    opts:[
      "Summarization of the billing documentation",
      "Code generation",
      "Translation between human languages",
      "A customer service agent"
    ],
    correct:1,
    explain:`Writing code, explaining unfamiliar code, writing tests and converting code from one language to another during modernization are all code generation. Translation is the tempting option because the code is being "translated", but that use case means human languages such as Spanish and Japanese. Summarization condenses text, and a customer service agent resolves customer requests.`
  },

  /* Ch 19 - The FM lifecycle · Objective 2.1.3 */
  {
    q:`An energy company plans to customize a foundation model for field engineers. Before choosing a model, the team removes duplicate reports and personal details, drops off-topic records, confirms the data may legally be used, and checks that every region and equipment type is covered. Which FM lifecycle stage is this?`,
    opts:[
      "Model selection",
      "Pre-training",
      "Evaluation",
      "Data selection"
    ],
    correct:3,
    explain:`Deciding which data the model will learn from, making it relevant, representative and clean, and confirming it is allowed to be used is data selection, the first stage, and its quality sets the ceiling for everything after. Pre-training is the tempting option because it also involves training data, but it is the huge first run by model providers on vast unlabeled data, not a business cleaning its own records. Model selection comes next, and evaluation tests a model after training.`
  },

  /* Ch 20 - Token-based pricing · Objective 2.1.4 */
  {
    q:`A hotel chain's concierge chatbot on Amazon Bedrock sends the same 8,000-token property guide and instructions at the start of every request, followed by a short guest question. The bill is high and replies are slow to start. The model supports prompt caching. Which change helps both most directly?`,
    opts:[
      "Move every request to the Priority tier",
      "Raise the maximum output length",
      "Buy Provisioned Throughput for a 6-month term at peak size",
      "Use prompt caching for the repeated prefix"
    ],
    correct:3,
    explain:`The cost and the wait come from the same repeated 8,000 input tokens, and prompt caching bills cached prefix tokens at a reduced rate and speeds up the response (AWS cites up to 90% lower cost and up to 85% lower latency for supported models). Provisioned Throughput is the tempting option because it changes how capacity is bought, but the same long prefix would still be processed on every call. Priority costs more, and a higher output cap adds tokens rather than removing them.`
  },

  /* Ch 21 - Context engineering · Objective 2.1.5 */
  {
    q:`An energy trading desk's assistant receives 30 pages of pasted market reports in every request. The rule "always quote prices in euros per megawatt-hour" sits halfway through that text, and the model often ignores it. Which context engineering change fits best?`,
    opts:[
      "Switch to a model with a larger context window for the reports",
      "Put the rule first and send only the relevant passages",
      "Raise the temperature so the model explores other formats",
      "Fine-tune the model on last year's market reports"

      "AWS CloudTrail logging of each model invocation",
      "Amazon Inspector scans of the game servers"
    ],
    correct:1,
    explain:`Toxicity is handled by output filtering, and Amazon Bedrock Guardrails content filters run on the model's output as well as the user's input, checking each response before it reaches the player. The system prompt line is the tempting option because it states the rule, but players can push a model past instructions, which is exactly what provocation does. CloudTrail records API activity, and Inspector scans workloads for vulnerabilities.`
  },

  /* Ch 55 - Hallucination detection and grounding · Objective 5.1.5 */
  {
    q:`An energy retailer's assistant tells customers their current tariff rate and next bill date, and sometimes states a rate that is wrong. The correct values for every account live in the billing database. Which approach improves accuracy most reliably?`,
    opts:[
      "Add 'only state accurate rates' to the system prompt",
      "Set the temperature to 0 for every single customer reply",
      "Fine-tune the model on last year's tariff sheets",
      "Check rates and dates against the billing database"
    ],
    correct:3,
    explain:`Output validation against a system of record compares prices, dates and account facts with the database before they are shown, so a wrong rate is caught or replaced with the true value. Temperature 0 is the tempting option because it makes answers consistent, but consistent is not correct: a low setting can make a wrong answer consistently wrong. A prompt instruction cannot stop the model inventing, and last year's tariffs are out of date.`
  },

  /* Ch 56 - Governance and compliance services · Objective 5.2.1 */
  {
    q:`An auditor at a mobile operator asks two questions about its AI platform: who changed an Amazon Bedrock guardrail configuration last Tuesday, and whether the training data bucket was encrypted and compliant with internal rules on 1 March. Which TWO AWS services provide this evidence?`,
    opts:[
      "AWS Artifact",
      "AWS CloudTrail",
      "Amazon Inspector",
      "AWS Config",
      "AWS Trusted Advisor"
    ],
    correct:[1,3],
    explain:`AWS CloudTrail records API activity, including who changed a guardrail and when, and AWS Config records resource configurations over time and evaluates them against rules, so it shows the bucket's settings on a past date. Trusted Advisor is the tempting option because it includes security checks, but it gives best-practice recommendations, not a history of a resource's settings or of who did what. Artifact holds AWS's own compliance reports, and Inspector scans workloads for vulnerabilities.`
  },

  /* Ch 58 - Governance processes and the Scoping Matrix · Objective 5.2.3 */
  {
    q:`A wind energy company builds an internal assistant on an existing foundation model in Amazon Bedrock, using RAG over its own maintenance documents. The model itself is not fine-tuned or retrained. Where does this use case sit in the Generative AI Security Scoping Matrix?`,
    opts:[
      "Scope 1: consumer app",
      "Scope 2: enterprise app",
      "Scope 3: pre-trained models",
      "Scope 4: fine-tuned models (own data)"
    ],
    correct:2,
    explain:`Building an application on an existing foundation model is Scope 3, where the organization secures its application, prompts, retrieval data, guardrails and access. Scope 4 is the tempting option because the company's own documents are involved, but RAG adds them to the prompt without changing the model; Scope 4 means customizing the model with the organization's data. Scopes 1 and 2 are using someone else's finished app.`
  }

];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
