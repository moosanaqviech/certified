<script>
/* ============================================================
   ▼▼▼  LESSON PAYLOAD — BEGIN  ▼▼▼
   Unit 3 · Chapter 30 · Inference parameters
   Objective 3.1.2 (describe the effect of inference parameters on model
   responses: temperature, input/output length). The index adds top-p,
   top-k and stop sequences, which sit beside temperature in the Amazon
   Bedrock inference configuration.
   Shape: cover, how a model picks the next token (step build),
   temperature (step build), top-p and top-k, output length and stop
   sequences, quiz (a support bot giving different policy answers to the
   same question: lower the temperature, C), presets for three tasks (step
   build), quiz (a reply cut off mid-sentence: raise the maximum output
   length, B), recap. 9 cards.
   Sources (official AWS pages, confirmed by search on 14 Oct 2026; direct
   fetches of docs.aws.amazon.com are blocked from this environment):
   docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
   (lower temperature gives more deterministic responses, higher more
   random; top P samples from the top share of the probability
   distribution, e.g. 0.8 is the top 80%; top K is a fixed number of most
   likely candidates; response length caps generated tokens; stop
   sequences end generation when produced);
   docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
   (Converse base inference configuration: maxTokens, temperature, topP,
   stopSequences; top K goes in additional model request fields for some
   models); Anthropic Claude parameter pages on Bedrock (some recent models
   accept temperature or top_p, not both). AIF-C01 exam guide v1.1.
   Cover animates (next-token probability bars sharpen at low temperature
   and flatten at high temperature as a dial swings).
   Step builds on card 1, card 2 and card 6.
   ============================================================ */

/* ----------  NAV  ---------- */
const NAV = {
  catalog:   "index.html",
  next:      "lesson-31-rag-and-knowledge-bases.html",
  nextLabel: "Next chapter"
};

/* ----------  ART  (custom SVGs, referenced from cards as ${A.name})  ---------- */
const A = {
  cover: `<svg viewBox="0 0 320 200">
    <defs>
      <radialGradient id="c30r" cx="0.5" cy="0.5" r="0.6">
        <stop offset="0" style="stop-color:rgba(150,144,223,0.18)"/>
        <stop offset="1" style="stop-color:rgba(150,144,223,0)"/>
      </radialGradient>
    </defs>
    <style>
      .c30b { transform-box: fill-box; transform-origin: 50% 100%; }
      .c30top { animation: c30a 5s ease-in-out infinite; }

      @keyframes c30b { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.9); } }
      @keyframes c30c { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(3.2); } }

    </style>
    <ellipse cx="160" cy="100" rx="155" ry="88" fill="url(#c30r)"/>
    <g font-family="Hanken Grotesk" font-size="9">
      <text x="20" y="26" fill="var(--ink-soft)">"The sky is ..."  next-token odds</text>

      <rect class="c30b c30low" x="116" y="134" width="30" height="16" rx="4" fill="var(--accent)" fill-opacity="0.5"/>

      <text x="43" y="166" text-anchor="middle" fill="var(--ink-soft)">blue</text>
      <text x="87" y="166" text-anchor="middle" fill="var(--ink-soft)">clear</text>
      <text x="131" y="166" text-anchor="middle" fill="var(--ink-soft)">falling</text>
      <text x="175" y="166" text-anchor="middle" fill="var(--ink-soft)">jazz</text>
      <path d="M222 150 A40 40 0 0 1 302 150" fill="none" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>
      <path d="M222 150 A40 40 0 0 1 240 117" fill="none" stroke="var(--sky)" stroke-width="6" stroke-linecap="round"/>
      <path d="M284 117 A40 40 0 0 1 302 150" fill="none" stroke="var(--warm)" stroke-width="6" stroke-linecap="round"/>
      <line class="c30needle" x1="262" y1="150" x2="262" y2="116" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="262" cy="150" r="5" fill="var(--ink)"/>
      <text x="262" y="96" text-anchor="middle" fill="var(--ink)" font-weight="700">temperature</text>

  done: `<svg viewBox="0 0 84 84">

/* ----------  CARDS  ---------- */
const cards = [

  /* 0: cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 3 · Chapter 30</div>
    <h1 class="reveal">Inference parameters</h1>
    <p class="lead reveal">Same model, same prompt, different answers. <strong>Inference parameters</strong> are the dials sent with each request: how adventurous the model is when it picks words, and how long it may keep going.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1: how the next token is picked, step build */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">The mechanism</div>
    <h2 class="reveal" style="font-size:24px">One token at a time, by probability</h2>
    <div class="pills">
      <div class="pill" data-step="1"><p><b>A list of candidates</b>At every step the model scores every possible next token. "Blue" might get 70%, "clear" 15%, "falling" 4%.</p></div>
      <div class="pill" data-step="2"><p><b>A draw, not a lookup</b>The model samples one token from that list, adds it to the text, and scores again. Thousands of draws make one answer.</p></div>
      <div class="pill" data-step="3"><p><b>The dials shape the draw</b>Temperature, top-p and top-k change which candidates can be drawn. Length settings and stop sequences decide when drawing ends.</p></div>
    </div>` },

  /* 2: temperature, step build */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">Dial 1</div>
    <h2 class="reveal" style="font-size:24px">Temperature: how random</h2>
    <div class="pills">
      <div class="pill" data-step="1"><p><b style="color:var(--sky)">Low (near 0)</b>The likeliest token wins almost every time. Answers are focused, consistent and repeatable. Good for facts, extraction and code.</p></div>
      <div class="pill" data-step="2"><p><b style="color:var(--warm)">High (toward 1)</b>Less likely tokens get a real chance. Answers are more varied and creative, and more likely to wander or invent details.</p></div>
      <div class="pill" data-step="3"><p><b>What it does not do</b>Temperature does not add knowledge or fix wrong facts. A low setting makes a wrong answer consistently wrong.</p></div>
    </div>` },

  /* 3: top-p and top-k */
  { html: `
    <div class="eyebrow reveal">Dials 2 and 3</div>
    <h2 class="reveal" style="font-size:24px">Top-p and top-k: how many candidates</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>Top-p (nucleus sampling)</b>Keep only the most likely tokens whose probabilities add up to p. At 0.8, the draw comes from the top 80% of the probability; the long tail of odd words is cut.</p></div>
      <div class="pill"><p><b>Top-k</b>Keep only the k most likely tokens, a fixed count. Top-k of 1 always takes the single best token.</p></div>
      <div class="pill"><p><b>Lower means safer</b>Smaller p or k narrows the choice: more predictable text. Larger values widen it: more diverse text.</p></div>
      <div class="pill"><p><b>One at a time</b>Change temperature or top-p, not both at once. Some models accept only one of the two, and not every model offers top-k.</p></div>
    </div>` },

  /* 4: length and stop sequences */
  { html: `
    <div class="eyebrow reveal">Dials 4 and 5</div>
    <h2 class="reveal" style="font-size:24px">When the answer ends</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>Maximum output length</b>A cap on generated tokens (maxTokens in the Converse API). Too low and replies stop mid-sentence; a higher cap allows longer, and costlier, answers.</p></div>
      <div class="pill"><p><b>Input length</b>The prompt plus any documents must fit the model's context window, and every input token is billed. Shorter, focused input is cheaper and often better.</p></div>
      <div class="pill"><p><b>Stop sequences</b>Text that ends generation the moment the model produces it, such as "END" or a new "User:" turn. Useful to stop a model from rambling or writing both sides of a chat.</p></div>
    </div>
    <div class="codeblock reveal" style="margin-top:12px">{ <span class="st">"maxTokens"</span>: <span class="al">400</span>, <span class="st">"temperature"</span>: <span class="al">0.2</span>,<br>&nbsp;&nbsp;<span class="st">"stopSequences"</span>: [<span class="st">"END"</span>] }</div>` },

  /* 5: quiz, lower temperature */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:19px">An HR chatbot on Amazon Bedrock answers policy questions from a fixed policy text in its prompt. Employees asking the same question get noticeably different wording and details each time, and HR wants consistent answers. Which change helps most?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span><span>Raise the temperature toward 1</span></button>
      <button class="choice" data-correct="false"><span class="key">B</span><span>Raise the maximum output length</span></button>
      <button class="choice" data-correct="true"><span class="key">C</span><span>Lower the temperature toward 0</span></button>
      <button class="choice" data-correct="false"><span class="key">D</span><span>Add a stop sequence after each sentence</span></button>
    </div>
    <div class="feedback"><b>Correct.</b> A low temperature makes the model pick the likeliest tokens almost every time, so the same question gets the same, focused answer. Option A is the tempting one because it names the right dial, but it turns it the wrong way: higher temperature adds variety. B only allows longer replies, and D would cut every answer after one sentence.</div>` },

  /* 6: presets, step build */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">Matching dials to the task</div>
    <h2 class="reveal" style="font-size:24px">Three tasks, three settings</h2>
    <div class="pills">
      <div class="pill" data-step="1"><p><b style="color:var(--sky)">Extract invoice fields as JSON</b>Temperature near 0, a modest length cap, a stop sequence after the closing brace. Accuracy and format beat variety.</p></div>
      <div class="pill" data-step="2"><p><b>Summarize a support ticket</b>Low to medium temperature, a length cap that fits two or three sentences. Faithful, short, a little natural variation.</p></div>
      <div class="pill" data-step="3"><p><b style="color:var(--warm)">Brainstorm ad slogans</b>Higher temperature or top-p, so each run offers fresh ideas. A human picks the best, so some misses are fine.</p></div>
    </div>` },

  /* 7: quiz, output length */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:19px">A report generator on Amazon Bedrock often returns summaries that stop in the middle of a sentence. The prompt and the content are fine. Which inference setting should be changed?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span><span>Lower the top-p value</span></button>
      <button class="choice" data-correct="true"><span class="key">B</span><span>Raise the maximum output length (maxTokens)</span></button>
      <button class="choice" data-correct="false"><span class="key">C</span><span>Raise the temperature</span></button>
      <button class="choice" data-correct="false"><span class="key">D</span><span>Lower the top-k value</span></button>
    </div>
    <div class="feedback"><b>Correct.</b> A reply that stops mid-sentence has hit its output token cap, so raising maxTokens lets the summary finish (at a slightly higher cost per request). Option A is the tempting one because top-p is the dial people tune most, but it shapes which words are chosen, not how many. C and D also change word choice, never the length limit.</div>` },

  /* 8: done */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Chapter 30 complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">Next: giving the model knowledge it was never trained on.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Randomness</b>Temperature: low is focused and repeatable, high is varied and riskier. Top-p and top-k limit how many candidate tokens can be drawn.</p></div>
      <div class="pill"><p><b>Length</b>Maximum output length caps the reply (too low truncates it); input must fit the context window, and every token is billed.</p></div>
      <div class="pill"><p><b>Stop sequences</b>End generation the moment a chosen string appears.</p></div>

    <div class="spacer"></div>` }

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ----------
   v2 adds opt-in, per-card step builds on top of the v1 card engine. A card
   with no `steps` field takes exactly the v1 paths below and renders and
   behaves identically; every v2 branch is guarded by `steps` being present. */
const ENGINE_VERSION = 'v2';
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};
const stepState = {};   // v2: current revealed step per card index (mirrors `answered`)

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

/* v2: apply step visibility for one card WITHOUT touching its .in class, so a
   step reveal never replays the card-entrance .reveal stagger. Cumulative for
   normal elements (data-step <= current). Captions append by default: inside
   .stepcaps they accumulate too (data-step="0" is the pre-first-tap caption),
   and captions behind the current step get .step-past (dimmed) while the
   current one stays at full strength. A .stepcap-swap container (or legacy
   .stepcap) opts into swap: only the caption whose data-step equals the
   current step is shown. */
function applySteps(idx) {
  const cur = stepState[idx] || 0;
  els[idx].querySelectorAll('[data-step]').forEach(function(nd) {
    const s = parseInt(nd.getAttribute('data-step'), 10);
    const swapCap = nd.closest && nd.closest('.stepcap-swap, .stepcap');
    const appendCap = !swapCap && nd.closest && nd.closest('.stepcaps');
    const on = swapCap ? (s === cur) : appendCap ? (s <= cur) : (s >= 1 && s <= cur);
    nd.classList.toggle('step-on', on);
    nd.classList.toggle('step-past', !!appendCap && on && s < cur);
  });
}

/* Card layout: the only place that adds/removes .in (and thus replays reveal).
   Called on card change, never on a step advance. */
function layout() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
    applySteps(idx);   // persists built state on revisit
  });
  glow.style.background = cards[i].glow || 'transparent';
}

/* Footer/button state only. Safe to call after a step advance (no reveal). */
function updateFooter() {
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  const total = c.steps || 0;
  const stepsLeft = total > 0 && (stepState[i] || 0) < total;
  if (stepsLeft) { nextBtn.disabled = false; nextBtn.textContent = (i === 0) ? 'Begin lesson' : 'Continue'; }
  else if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
}

function render() {
  layout();
  updateFooter();
  if (cards[i].quiz) wireQuiz(els[i], i);
}

/* v2: reveal the next step of the current card. Returns true if a step was
   consumed (so the caller does not also advance the card). */
function advanceStep(idx) {
  const total = cards[idx].steps || 0;
  if (!total) return false;
  const cur = stepState[idx] || 0;
  if (cur >= total) return false;
  stepState[idx] = cur + 1;
  applySteps(idx);
  updateFooter();
  return true;
}

/* v2: reveal every remaining step at once (swipe-left escape hatch). */
function skipSteps(idx) {
  const total = cards[idx].steps || 0;
  if (!total || (stepState[idx] || 0) >= total) return false;
  stepState[idx] = total;
  applySteps(idx);
  updateFooter();
  return true;
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

/* Primary action. On a step card mid-build this reveals the next step; once
   the steps are done (or on a card with none) it advances, honoring the quiz
   gate exactly as v1 did. Shared by the Continue button and ArrowRight. */
function handleNext() {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  if (advanceStep(i)) return;
  go(i + 1);
}
nextBtn.onclick = handleNext;
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* v2: tapping anywhere on a step card advances one step; once built, a tap
   advances the card (gate permitting). Cards with no steps ignore taps, so
   this listener is inert on v1-style cards. Elements with their own behavior
   (quiz choices, links) are skipped so a tap never double-fires. */
vp.addEventListener('click', e => {
  const c = cards[i];
  if (!c.steps) return;
  if (e.target.closest('.choice, a')) return;
  if ((stepState[i] || 0) < c.steps) { advanceStep(i); return; }
  if (!nextBtn.disabled && !c.last) go(i + 1);
});

/* Keys and swipes only move between cards (or, for a step card, between
   steps). Leaving the lesson always takes a deliberate tap, so a stray swipe
   on the final card cannot navigate away. ArrowRight mirrors the Continue
   button step-wise; ArrowLeft mirrors Back. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) handleNext();
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  // Swipe left: skip any remaining steps and advance in one gesture, honoring
  // the quiz gate (updateFooter re-derives nextBtn.disabled after the skip).
  if (dx < -50 && !cards[i].last) { skipSteps(i); if (!nextBtn.disabled) go(i + 1); }
  if (dx > 50 && i > 0) go(i - 1);
});

render();

/* Back to quiz (additive). A "Review: Chapter N" link in a quiz explanation
   opens this lesson with ?back=<quiz path>, plus &tab=1 when it opened in a
   new tab. Only then a small bar above the progress segments offers the way
   back: closing the tab returns to the untouched quiz tab, otherwise it goes
   to the quiz path, which restores the session. No param, no change. */
(function () {
  let back = null, tab = false;
  try {
    const p = new URLSearchParams(location.search), b = p.get('back');
    tab = p.get('tab') === '1';
    if (b && b.charAt(0) === '/' && b.charAt(1) !== '/' && b.charAt(1) !== '\\') {
      const u = new URL(b, location.href);
      if (u.origin === location.origin) back = u.pathname + u.search;
    }
  } catch (e) { return; }
  if (!back) return;
  const bar = document.createElement('div');
  bar.style.cssText = 'position:relative;z-index:7;padding:14px 20px 0;';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = '← Back to quiz';
  btn.style.cssText = 'font:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--surface-2,rgba(255,255,255,0.06));border:1px solid var(--line,rgba(255,255,255,0.1));border-radius:999px;padding:7px 14px;cursor:pointer;';
  btn.onclick = () => {
    if (tab) { try { window.close(); } catch (e) {} setTimeout(() => { location.href = back; }, 300); }
    else location.href = back;
  };
  bar.appendChild(btn);
  const tb = document.getElementById('topbar');
  tb.parentNode.insertBefore(bar, tb);
})();
</script>
</body>
</html>
