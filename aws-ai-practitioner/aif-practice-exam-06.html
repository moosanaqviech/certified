<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Full Mock 2",
  badge: "AWS AI Practitioner (AIF-C01)",
  blurb: "A full-length mock: 50 scenario questions across all five domains at the official weights, 90 minutes. Most questions have one best answer; a few ask you to select two. Pass mark is 70%, our practice target (the real exam reports a scaled score of 700 out of 1,000).",
  coverage: "All five domains, sampled at the official weights: 10 Fundamentals of AI and ML, 12 Fundamentals of GenAI, 14 Applications of Foundation Models, 7 Responsible AI, 7 Security and Governance. Its own scenarios, never reused in drills.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

  /* Ch 02 - Algorithm vs model · Objective 1.1.1 */
  {
    ref:{chapter:2},
    q:`A state public health agency runs the same decision tree algorithm on hospital admission data from two different states to predict flu-season admissions. The two resulting artifacts give different predictions for the same inputs, and a manager asks why "the same AI" behaves differently. Which explanation is accurate?`,
    opts:[
      "The two states used different algorithms, because their outputs differ",
      "Same algorithm, different training data, so each run produced a different model",
      "The model is the learning procedure, and the algorithm is the saved artifact",
      "Inference re-learns the parameters on every request, so the outputs drift apart"
    ],
    correct:1,
    explain:`An algorithm is the general learning method; running it on training data tunes parameters, and the saved result is the model. Different data produced two different models, so their predictions differ. The tempting option blames different algorithms, but the algorithm was identical; only the data changed. Swapping the two terms gets the vocabulary backwards, and inference applies a trained model without re-learning it.`
  },

  /* Ch 01 - AI, ML and agentic AI · Objective 1.1.2 */
  {
    ref:{chapter:1},
    q:`A city benefits office runs three systems. System 1 is a hand-coded rules engine that rejects applications above a fixed income threshold. System 2 learned from thousands of past applications to predict which new ones are missing documents. System 3 is given a goal, then looks up the case, emails the applicant for missing documents through a mail tool, and updates the case record without step-by-step prompting. Which description is correct?`,
    opts:[
      "All three are machine learning, because each makes decisions about applications",
      "Only System 3 is AI; the other two are ordinary software",
      "System 3 is deep learning but not machine learning, because it uses a neural network",
      "System 1 is AI but not ML, System 2 is ML, and System 3 is agentic AI"
    ],
    correct:3,
    explain:`Rule-based systems sit inside the AI umbrella but outside ML, because nobody learned the threshold from data. System 2 learns patterns from labeled history, which is ML, and System 3 pursues a goal by acting through tools, which is agentic AI. The tempting option calls everything ML, but making decisions with data is not the same as learning from it. Deep learning is a subset of ML, so it cannot sit outside it.`
  },

  /* Ch 04 - Data types · Objective 1.1.4 */
  {
    ref:{chapter:4},
    q:`A health insurer stores years of free-text notes that nurses typed during case-management calls. The notes sit in one column of a database table, and nothing records a category or outcome for each note. An analytics team wants to describe this data correctly before choosing an approach. Which description fits best?`,
    opts:[
      "Unstructured, unlabeled text data",
      "Structured tabular data, because it is stored in a table column",
      "Labeled data, because qualified nurses wrote every note",
      "Time-series data, because each note has a call date"
    ],
    correct:0,
    explain:`Free text has no predefined attributes, so it is unstructured, and since no category or outcome is attached to each note, it is unlabeled. The tempting option treats the storage location as the data type, but a long note in a column is still free text with no schema inside it. A label is the answer a model should learn, not the author's credentials, and a date alone does not make the order of the notes carry the pattern.`
  },

  /* Ch 05 - Learning types · Objective 1.1.5 */
  {
    ref:{chapter:5},
    q:`A state unemployment agency has 200,000 past claims. Investigators marked each one either "paid normally" or "required fraud review". The agency wants a model that flags new claims likely to require review, so investigators can prioritize them. Which type of learning fits?`,
    opts:[
      "Unsupervised learning, because the goal is to find unusual claims",
      "Reinforcement learning, with a reward for each fraud case caught",
      "Supervised learning, since each past claim has a known outcome",
      "Self-supervised learning, because the claims can label themselves"
    ],
    correct:2,
    explain:`Every training record carries the answer the model should learn (paid normally or required review), so this is supervised learning, a binary classification. The tempting option fits when no labels exist and the aim is to surface oddities, but here investigators have already labeled the history, which is more useful. Reinforcement learning needs an agent acting in an environment, and self-supervised learning is how foundation models learn from unlabeled data.`
  },

  /* Ch 06 - When AI is the wrong tool · Objective 1.2.2 */
  {
    ref:{chapter:6},
    q:`A rural clinic receives about 30 referral letters a month. A receptionist reads each one and sends it to one of three departments in a couple of minutes, and almost never makes a mistake. A vendor proposes training a custom ML model to route the letters automatically. What is the best response?`,
    opts:[
      "Build the model, because automating a manual task always lowers cost",
      "Keep the current process, since the gain cannot cover the model's cost",
      "Use a foundation model instead, since it needs no labeled letters",
      "Label every past letter first, then set an accuracy target for the model"
    ],
    correct:1,
    explain:`A cost-benefit check weighs value per decision times volume against the full lifetime cost of data, build, inference and maintenance, measured against the current baseline. Thirty accurate two-minute decisions a month leave almost nothing for a model to save. The tempting option assumes automation always pays, but the benefit here is tiny and the lifetime cost is not. A foundation model or a labeling project still adds cost without beating the baseline.`
  },

  /* Ch 07 - Regression, classification or clustering · Objective 1.2.3 */
  {
    ref:{chapter:7},
    q:`A hospital wants to tell its bed managers how many days each newly admitted patient is likely to stay. It has five years of past admissions with diagnosis, age, admission type and the actual length of stay in days. Which technique fits?`,
    opts:[
      "Regression on the length of stay in days",
      "Binary classification of stays longer than five days",
      "Clustering patients into groups by diagnosis",
      "Multiclass classification into short, medium and long stays"
    ],
    correct:0,
    explain:`The business wants a number of days, and the history has the true number attached, so regression fits. The tempting option answers a related yes-or-no question, but bed managers asked for the expected days, not whether a stay passes a cutoff. Three bands lose the same detail, and clustering groups patients without predicting anything.`
  },

  /* Ch 08 - Real-world AI applications · Objective 1.2.4 */
  {
    ref:{chapter:8},
    q:`A county government is reviewing five planned AI projects, each labeled with the application family the project team thinks it belongs to. Which TWO projects are labeled correctly?`,
    opts:[
      "Turning recordings of council meetings into searchable transcripts: speech recognition",
      "Pulling the fields out of scanned, handwritten permit forms: recommendation system",
      "Answering residents' questions from published county ordinances, with citations: agentic AI",
      "Estimating next winter's daily call volume at the 311 center from five years of history: forecasting",
      "Flagging unusual vendor invoices for auditors to review: computer vision"
    ],
    correct:[0,3],
    explain:`Spoken audio turned into text is speech recognition, and predicting a future number from time-ordered history is forecasting. The ordinance assistant is the tempting one, but answering from the organization's own documents with citations is a knowledge base; agentic AI is for systems that must take multi-step actions. Reading handwritten forms is computer vision (document understanding), and flagging unusual invoices is fraud or anomaly detection on records, not images.`
  },

  /* Ch 10 - Traditional ML vs foundation models · Objective 1.2.6 */
  {
    ref:{chapter:10},
    q:`A medical device maker is building an alarm feature for a bedside monitor. The monitor has modest hardware and no network connection, and it must decide from structured vital-sign readings within milliseconds whether to sound an alarm, giving the same result for the same readings every time. Labeled historical readings are available. Which approach fits?`,
    opts:[
      "A foundation model through Amazon Bedrock, because it is the most capable option",
      "A multimodal foundation model on a SageMaker AI endpoint, called over the network",
      "A large language model prompted with the readings and the alarm rules",
      "A small traditional ML model trained on the labeled vital-sign readings"
    ],
    correct:3,
    explain:`Tight latency, small hardware, no network, structured input and a need for repeatable output are the operational signals that favor a lean traditional model. The tempting option chooses capability, but an FM is larger, slower, priced per token, nondeterministic and reached over a network the monitor does not have. The endpoint and the prompted LLM fail the same constraints.`
  },

  /* Ch 12 - Managed API vs self-hosted · Objective 1.3.3 */
  {
    ref:{chapter:12},
    q:`A state health department's only engineer is comparing two ways to serve the same open-weight model: calling it through Amazon Bedrock, where it is offered, or deploying it to a SageMaker AI real-time endpoint. Traffic is a few hundred requests on weekdays and none at nights or weekends. Which statement compares the two correctly?`,
    opts:[
      "Both bill per token, but the endpoint is cheaper because the department hosts it itself",
      "The endpoint scales down to zero on its own, so both options cost nothing while idle",
      "Bedrock bills per token; the endpoint bills per instance hour, busy or idle",
      "Bedrock makes the team choose instance types, while the endpoint picks them automatically"
    ],
    correct:2,
    explain:`A managed API service charges for the tokens used and leaves capacity, patching and scaling to the provider, so quiet nights and weekends cost nothing. A self-hosted endpoint bills for instance time while it runs, and its scaling and patching fall on the team. The tempting option assumes self-hosting is cheaper, but light, spiky traffic pays for idle instances. The last option swaps the two services' roles.`
  },

  /* Ch 14 - Precision and recall · Objective 1.3.6 */
  {
    ref:{chapter:14},
    q:`A hospital's readmission model flagged 50 discharged patients as high risk. Of those 50, 30 were readmitted within a month. In total, 40 of all discharged patients were readmitted. What are the model's precision and recall?`,
    opts:[
      "Precision 60%, recall 75%",
      "Precision 75%, recall 60%",
      "Precision 60%, recall 60%",
      "Precision 80%, recall 75%"
    ],
    correct:0,
    explain:`Precision is true positives over everything flagged: 30 of 50, or 60%. Recall is true positives over all real cases: 30 of 40, or 75%. The tempting option swaps the two, the most common slip: precision asks how often a flag is right, recall asks how many real cases were caught. The other pairs do not match the counts.`
  },

  /* Ch 15 - Embeddings and vectors · Objective 2.1.1 */
  {
    ref:{chapter:15},
    q:`A medical school has an archive of 50,000 histology slide images with no captions. Students want to type a description such as "inflamed liver tissue with scarring" and get back matching images from the archive. Which approach makes this possible?`,
    opts:[
      "A diffusion model that generates an image matching each description",
      "Multimodal embeddings of images and text in one space, then similarity search",
      "Fixed-size chunking of each image so more of them fit in one prompt",
      "A model with a larger context window, given the whole archive in every request"
    ],
    correct:1,
    explain:`Multimodal embeddings, such as Amazon Titan Multimodal Embeddings, place images and text in one shared vector space, so a text query embedded with the same model lands near the matching images and a similarity search returns them. The tempting option produces a new picture, but students need real slides from the archive, not invented ones. Chunking applies to documents, and no context window holds 50,000 images.`
  },

  /* Ch 17 - GenAI use cases · Objective 2.1.2 */
  {
    ref:{chapter:17},
    q:`A state agency wants to move its legacy COBOL benefits programs to Java. It plans to have an FM rewrite each module in Java and add a plain-language explanation of what the module does, for its developers to review. Which GenAI use case is this?`,
    opts:[
      "Translation, because the work moves content from one language to another",
      "Summarization, because each module gets a short explanation",
      "An AI assistant that answers developers' questions in chat",
      "Code generation, which includes converting and explaining code"
    ],
    correct:3,
    explain:`Writing code, explaining unfamiliar code and converting code from one programming language to another during modernization are all code generation. The tempting option reads "one language to another" literally, but the translation use case is about human languages, such as localizing text into Spanish or Japanese. The explanation is a by-product of the code work, not the main job, and nobody asked for a chat assistant.`
  },

  /* Ch 19 - FM lifecycle · Objective 2.1.3 */
  {
    ref:{chapter:19},
    q:`A public health institute plans to fine-tune a model on transcripts from its health information hotline. Before any training, the team removes duplicate calls, strips personal details, drops off-topic and abusive transcripts, and checks that callers from every region and language group are covered. Which stage of the FM lifecycle is this?`,
    opts:[
      "Evaluation, because the team is checking coverage",
      "Pre-training, because the model will learn from the transcripts",
      "Data selection, which picks and cleans the training data",
      "Feedback, because the transcripts come from real users"
    ],
    correct:2,
    explain:`Choosing relevant, representative data and cleaning out duplicates, sensitive personal information and toxic or irrelevant content is data selection, the first stage. The tempting option sees a check and calls it evaluation, but evaluation tests a model's outputs, and no model has been trained yet. Pre-training is the provider's broad run on unlabeled data, and feedback comes after deployment.`
  },

  /* Ch 20 - Token-based pricing · Objective 2.1.4 */
  {
    ref:{chapter:20},
    q:`An insurer's claims assistant on Amazon Bedrock sends the same 8,000-token policy manual at the start of every request, followed by an adjuster's short question. Adjusters wait for each answer while on calls with customers. The model supports prompt caching. Which change lowers both cost and latency most directly?`,
    opts:[
      "Use prompt caching for the repeated manual prefix",
      "Move the requests to batch inference for its lower price",
      "Raise the maximum output length so answers are complete",
      "Buy Provisioned Throughput for the busiest hours"
    ],
    correct:0,
    explain:`Prompt caching stores the repeated prefix, so later calls that reuse it are billed at a reduced rate for those tokens and respond faster. The tempting option is batch inference, which is cheaper, but its results are not immediate, and adjusters are waiting live. A higher output cap adds tokens, and Provisioned Throughput buys capacity rather than cutting the tokens each call carries.`

    opts:[
      "Amazon Bedrock Guardrails with a sensitive information filter",
      "AWS PrivateLink",
      "AWS KMS customer-managed keys",
      "Amazon Macie"
    ],
    correct:3,
    explain:`Amazon Macie scans Amazon S3 with machine learning and pattern matching to find sensitive data before it goes into training or a knowledge base. The tempting option masks PII in prompts and answers at run time, but by then the personal data would already be indexed; the requirement is to find it before ingestion. PrivateLink keeps traffic off the public internet, and KMS keys encrypt data without discovering what is in it.`
  },

  /* Ch 53 - Data cataloging · Objective 5.1.2 */
  {
    ref:{chapter:53},
    q:`A national public health agency has hundreds of datasets spread across teams. Data scientists building a model cannot find which dataset holds vaccination records, who owns it, how it is classified or where it is stored. Which practice addresses this most directly?`,
    opts:[
      "A central data catalog (the AWS Glue Data Catalog)",
      "Amazon SageMaker Model Cards written for each model",
      "Source citations returned by a knowledge base",
      "Encrypting every dataset with AWS KMS keys"
    ],
    correct:0,
    explain:`Data cataloging lists each dataset with its owner, schema, classification and location, so data can be found and governed, which is exactly the gap described. Model Cards are the tempting option because they document data origins, but they record the training data for a model version, not an inventory of every dataset. Citations describe where a RAG answer came from, and encryption protects data without making it findable.`
  },

  /* Ch 53 - Assessing data quality · Objective 5.1.3 */
  {
    ref:{chapter:53},
    q:`A clinical research organization's training pipeline loads lab results every night. One night a partner feed switches measurement units and leaves 30% of values blank, and the next model version trains on that data without anyone noticing. Which practice would have prevented this?`,
    opts:[
      "Encrypting the nightly feed at rest with AWS KMS",
      "Adding differential privacy noise to the lab results",
      "Automated quality checks that halt the pipeline on failure",
      "Training the model for more epochs to average out the errors"
    ],
    correct:2,
    explain:`Assessing data quality means checking completeness, accuracy and consistency every time data enters the pipeline, and stopping the pipeline when a check fails, so bad data never reaches training. Encryption is the tempting option because it is a core secure data practice, but it protects data from being read, not from being wrong. Differential privacy protects individuals in results, and more training on bad data only teaches the errors.`
  },

  /* Ch 54 - Toxicity and output filtering · Objective 5.1.4 */
  {
    ref:{chapter:54},
    q:`A school district's homework helper on Amazon Bedrock occasionally produces insulting replies when students try to provoke it. The district needs every response checked for harmful content before it reaches a student. Which control fits?`,
    opts:[
      "A monthly toxicity evaluation in Amazon Bedrock Model Evaluation",
      "Amazon Bedrock Guardrails content filters on model output",
      "AWS CloudTrail logging of every model invocation",
      "Amazon Inspector scans of the application's containers"
    ],
    correct:1,
    explain:`Output filtering checks each response before the user sees it, and Guardrails content filters for hate, insults, violence and similar categories run on output as well as input. The tempting option measures how often a model produces toxic content, which is useful for choosing or tracking a model, but it filters nothing in real time. CloudTrail records API activity, and Inspector scans for software vulnerabilities.`
  },

  /* Ch 55 - Output validation and confidence scoring · Objective 5.1.5 */
  {
    ref:{chapter:55},
    q:`A health insurer's member assistant already answers from plan documents through RAG. Compliance now wants two more safeguards: coverage answers must be validated against logical rules that policy experts wrote from the coverage policies, and answers with weak support must go to a person instead of the member. Which TWO measures meet these requirements?`,
    opts:[
      "Add an instruction never to invent coverage rules to the system prompt",
      "Automated Reasoning checks that validate answers against the experts' policy rules",
      "Raise the temperature so the model weighs more possible answers",
      "A threshold on grounding scores that routes low-scoring answers to staff",
      "Lower the grounding threshold so that fewer answers are blocked"
    ],
    correct:[1,3],
    explain:`Automated Reasoning checks in Amazon Bedrock Guardrails validate answers against logical rules written from the company's policies, and confidence scoring with a threshold decides what is shown: below it, the answer is declined or routed to a person. The prompt instruction is the tempting option, but the model cannot tell which of its statements are invented, so wording is not a control. Higher temperature adds randomness, and lowering the threshold lets more weakly supported answers through, the opposite of what compliance asked.`
  },

  /* Ch 57 - Deleting derived data · Objective 5.2.2 */
  {
    ref:{chapter:57},
    q:`Following its data policy, a university deletes a withdrawn research report from the Amazon S3 bucket behind its RAG assistant. Weeks later, the assistant still quotes the report's findings, with a citation. What did the deletion step miss?`,
    opts:[
      "S3 Object Lock, which should have been turned on for the bucket",
      "Model invocation logging, which records the prompts and responses",
      "Moving the report to a cheaper storage class instead of deleting it",
      "Derived copies: its chunks in the vector store and prompt logs"
    ],
    correct:3,
    explain:`Deleting a document is not enough when its chunks still sit in a vector store or its text sits in prompt logs, so the knowledge base must be re-synced and those copies expired too. Object Lock is the tempting option because it is a retention control, but it prevents deletion, the opposite of what the policy needs. Invocation logging records interactions without removing anything, and archiving keeps the data.`
  },

  /* Ch 58 - Generative AI Security Scoping Matrix · Objective 5.2.3 */
  {
    ref:{chapter:58},
    q:`A state health department builds a public FAQ application on an existing foundation model in Amazon Bedrock. It adds RAG over its own published web pages and does no fine-tuning. Where does this use case sit in the Generative AI Security Scoping Matrix?`,
    opts:[
      "Scope 2: an enterprise app with GenAI features",
      "Scope 3: an application built on a pre-trained model",
      "Scope 4: fine-tuned models, because it uses its own data",
      "Scope 5: a self-trained model"
    ],
    correct:1,
    explain:`Building an application on an existing foundation model, such as one in Amazon Bedrock, is Scope 3, where the department secures its application, prompts, retrieval data, guardrails and access. Scope 4 is the tempting option because the department's own data is involved, but RAG supplies data at request time without customizing the model; Scope 4 means fine-tuning it. Scope 2 is third-party business software, and Scope 5 means training from scratch.`
  }
];

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
