<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 1",
  badge: "AWS AI Practitioner (AIF-C01)",
  blurb: "Exam-style, scenario-based questions, one per chapter. Most questions have one best answer; a few ask you to select two. Pass mark is 70%, our practice target (the real exam reports a scaled score of 700 out of 1,000).",
  coverage: "Covers chapters 1-14: Unit 1 (Fundamentals of AI and ML). One question per chapter.",
  minutes: 28,
  pass: 70
};

const QUESTIONS = [

  /* Ch 01 - AI, ML, deep learning, GenAI and agentic AI · Objective 1.1.2 */
  {
    q:`A marketing team uses a tool that writes full product descriptions from a few bullet points. The tool calls a large language model (LLM). One colleague insists the tool is "generative AI, not machine learning". Which statement is accurate?`,
    opts:[
      "It is generative AI only, because generative AI is a separate field that sits outside machine learning",
      "It is generative AI built on a foundation model, which is deep learning, so it is also ML and AI",
      "It is agentic AI, because it produces finished text without a person writing each sentence",
      "It is a rule-based system, because the bullet points fully determine what the tool writes"
    ],
    correct:1,
    explain:`The terms nest: AI contains ML, ML contains deep learning, and deep learning contains generative AI, whose LLMs and other foundation models are very large neural networks. So the tool is GenAI and, by the same token, ML and AI. The colleague's view (GenAI outside ML) gets the nesting wrong. Agentic AI would pursue a goal over several steps by acting through tools; writing text on request is a single generative task.`
  },

  /* Ch 02 - Models, algorithms, training and inference · Objective 1.1.1 */
  {
    q:`A team trains a simple model to predict apartment rents. It scores poorly on the listings it was trained on, and almost exactly as poorly on a held-out set of new listings. What is the most likely explanation?`,
    opts:[
      "The model is overfitting: it memorized the training listings instead of the general pattern",
      "The model is biased, because it gives similar results on two different sets of data",
      "Inference is failing, so the model should be moved to an always-on real-time endpoint",
      "The model is underfitting: it is too simple to capture the pattern at all"
    ],
    correct:3,
    explain:`Poor results on the training data and equally poor results on new data is the signature of underfitting: the model is too simple for the pattern. Overfitting is the tempting answer, but an overfit model scores very well on data it has seen and much worse on new data, and there is no such gap here. Bias means a systematic skew against some groups or situations, and the way a model is served does not change how accurate it is.`
  },

  /* Ch 03 - Inference types: batch, real-time, asynchronous, serverless · Objective 1.1.3 */
  {
    q:`An HR team's internal tool sends a small JSON record to a model a few times an hour, at unpredictable times, and is idle overnight and at weekends. Users accept a short delay on the first request after a quiet spell. The team does not want to choose or manage instances, or pay for idle capacity. Which Amazon SageMaker AI inference option fits?`,
    opts:[
      "Serverless inference, which scales with traffic and down to zero when idle",
      "Real-time inference on a persistent endpoint backed by chosen instances",
      "Asynchronous inference, with each record placed in Amazon S3 first",
      "A nightly batch transform job over the day's records"
    ],
    correct:0,
    explain:`Intermittent, unpredictable traffic with quiet periods, small payloads, no instances to manage, and tolerance for a cold start are the serverless signals. Real-time inference is the tempting choice because it also answers in the same call, but its instances run and are billed whether or not requests arrive, which the team wants to avoid. Asynchronous inference is meant for large payloads and long processing, and a nightly batch job cannot answer a user who is waiting.`
  },

  /* Ch 04 - Data types in AI models · Objective 1.1.4 */
  {
    q:`A hospital has 50,000 chest X-ray images. A radiologist has marked each image "pneumonia" or "clear", and the hospital wants to train a model to make that call on new images. How is this training data best described?`,
    opts:[
      "Structured tabular data, labeled with the diagnosis in one column",
      "Unstructured image data, unlabeled because images have no schema",
      "Unstructured image data, labeled with a diagnosis for each image",
      "Time-series data, because each X-ray was taken on a known date"
    ],
    correct:2,
    explain:`Two separate questions describe any dataset: what shape it is, and whether each example carries the answer. X-rays are images, which are unstructured, and each one is paired with the radiologist's diagnosis, so the data is labeled. The second option is the tempting one because images have no rows and columns, but being unstructured says nothing about labels: a label is the answer attached to each example. A timestamp alone does not make data time-series; the order would have to carry the pattern.`
  },

  /* Ch 05 - Supervised, unsupervised and reinforcement learning · Objective 1.1.5 */
  {
    q:`A bank holds millions of past card transactions, but none has ever been marked as fraud or legitimate. Its risk team wants a model to surface transactions that look unlike normal customer behavior so analysts can review them. Which type of learning fits?`,
    opts:[
      "Supervised classification trained on the transaction history",
      "Reinforcement learning, with a reward for each flagged transaction",
      "Supervised regression that predicts each transaction's amount",
      "Unsupervised learning that detects anomalies in unlabeled data"
    ],
    correct:3,
    explain:`With no labels and a goal of finding records that do not fit the normal pattern, this is anomaly detection, an unsupervised task. Supervised classification is the tempting choice because fraud detection is often built that way, but supervised learning needs a known answer on each training record, and none exists here. Reinforcement learning needs an agent acting in an environment with a reward, and predicting the amount answers a different question.`
  },

  /* Ch 06 - When AI adds value, and when it is the wrong tool · Objective 1.2.2 */
  {
    q:`A company is reviewing five proposed machine learning (ML) projects. Which TWO are poor fits for ML? (Select TWO.)`,
    opts:[
      "Calculating each employee's overtime pay, which the labor agreement defines with an exact formula",
      "Flagging which of two million monthly product reviews mention a safety problem, for a small team to check",
      "Routing incoming support emails to one of eight teams, using two years of emails already routed by hand",
      "Predicting demand for a specialty part that is ordered about four times a year, with no sales history kept",
      "Ranking incoming insurance claims by fraud risk so investigators review the riskiest claims first"
    ],
    correct:[0,3],
    explain:`Overtime pay needs a specific outcome defined by a formula, so deterministic code is exact, cheap and auditable, while a model could only approximate it. The specialty part fails the cost-benefit check: a handful of decisions a year and no historical data to learn from. The review-flagging project is the most tempting distractor because a wrong flag is possible, but its scale is beyond the team and a person checks every flag, which is where ML adds value. Email routing (automation from labeled history) and claim ranking (assisting a human decision) are strong ML cases too.`
  },

  /* Ch 07 - Regression, classification or clustering · Objective 1.2.3 */
  {
    q:`A lender's underwriters have placed every application from the last five years into risk tier 1, 2, 3 or 4. The lender wants each new application assigned to a tier automatically. Which technique fits?`,
    opts:[
      "Regression that predicts the tier number for each application",
      "Multiclass classification trained on the tiered applications",
      "Clustering that groups the applications into four segments",
      "Binary classification of each application as approve or decline"
    ],
    correct:1,
    explain:`The categories are known in advance and the history is labeled with them, so this is supervised multiclass classification. Regression is the tempting choice because the tiers are numbered, but a tier is a category, not an amount: tier 4 is not "twice" tier 2. Clustering ignores the labels and would invent its own four groups that need not match the underwriters' tiers, and approve or decline answers a different, two-way question.`
  },

  /* Ch 08 - Real-world AI applications · Objective 1.2.4 */
  {
    q:`A law firm wants its staff to type questions such as "What is our policy on accepting gifts from clients?" and receive answers drawn from the firm's own internal policy documents, with citations to the source passages. Which type of AI application fits?`,
    opts:[
      "Agentic AI that plans multi-step actions and calls tools in other systems",
      "A recommendation system that suggests documents similar staff have read",
      "A knowledge base that retrieves relevant passages and answers from them",
      "Speech recognition that converts each staff question into text first"
    ],
    correct:2,
    explain:`Answering questions from the organization's own content, with citations, is the knowledge base pattern: retrieve the relevant passages, then have a model answer from them (Amazon Bedrock Knowledge Bases on AWS). Agentic AI is the tempting distractor because it also uses a model, but it is for completing tasks by taking actions in other systems, and nothing here needs to be done beyond answering. Recommendations rank items for a person, and the questions are typed, so speech recognition plays no part.`
  },

  /* Ch 09 - AWS managed AI services · Objective 1.2.5 */
  {
    q:`A hotel group receives written guest reviews in fifteen languages. Its analysts want every review available in English to read, and want each one scored for sentiment with its key phrases pulled out. The group has no machine learning staff. Which TWO AWS services together meet the need? (Select TWO.)`,
    opts:[
      "Amazon Transcribe",
      "Amazon Translate",
      "Amazon Polly",
      "Amazon Lex",
      "Amazon Comprehend"
    ],
    correct:[1,4],
    explain:`Amazon Translate converts the reviews into English, and Amazon Comprehend analyzes the text for sentiment and key phrases; the two are often chained exactly this way, with no model training. Amazon Transcribe is the tempting distractor because it also turns content into text, but it converts speech into text, and these reviews are already written. Polly runs the other way (text into speech), and Lex builds conversational chatbots.`
  },

  /* Ch 10 - Traditional ML vs foundation models · Objective 1.2.6 */
  {
    q:`A payment processor must score every card transaction for fraud from structured fields (amount, merchant, location, time) in a few milliseconds, at very high volume, and the same transaction must always get the same score. Labeled history of past fraud is available. Which approach fits?`,
    opts:[
      "A traditional classification model trained on the labeled transaction fields",
      "A foundation model through Amazon Bedrock, prompted with each transaction",
      "A foundation model, since one pre-trained model can handle many tasks",
      "A large language model that writes a description of each transaction first"
    ],
    correct:0,
    explain:`Structured input, a single prediction, labeled data, tight latency, huge volume and repeatable output are all operational signals that favor a lean traditional model. The Bedrock option is the tempting one because it needs no training, but a foundation model is larger, slower and costlier per call, and its output is nondeterministic, which breaks the same-score requirement. Breadth across many tasks is worth nothing when the job is one narrow prediction.`
  },

  /* Ch 11 - The AI/ML pipeline and the AWS service at each stage · Objective 1.3.4 */
  {
    q:`Developers must build the application code that connects a model's data preparation, training and deployment stages. They want a tool that turns a prompt into a spec (requirements, design and tasks) and then generates the code, documentation and tests. Which AWS offering fits?`,
    opts:[
      "Amazon Quick, with its Quick Sight dashboards",
      "Amazon Bedrock Model Evaluation",
      "Amazon SageMaker AI automatic model tuning",
      "Kiro, the agentic AI IDE for developers"
    ],
    correct:3,
    explain:`Kiro is an agentic AI IDE: it turns a prompt into a spec of requirements, design and tasks, then into code, documentation and tests, which is exactly the developers' need. Amazon Quick is the tempting distractor because it is also AI-powered, but it serves business users who explore data and consume results in dashboards and plain-language answers, not developers writing code. Bedrock Model Evaluation compares models and prompts, and automatic model tuning searches for the best hyperparameters.`
  },

  /* Ch 12 - Model sources and hosting · Objective 1.3.3 */
  {
    q:`A team wants to use a specific open-source model whose weights it holds. The model is not offered in Amazon Bedrock and its architecture is not supported for import. The platform team must also choose the instance type and keep traffic on its own network path. How should the model reach production?`,
    opts:[
      "Call it through Amazon Bedrock on-demand, paying per input and output token",
      "Pre-train a new foundation model from scratch so the team owns every setting",
      "Host it on an Amazon SageMaker AI endpoint the team configures and runs",
      "Send its requests to Amazon Comprehend and use custom classification instead"
    ],
    correct:2,
    explain:`A model the managed service does not offer, plus a requirement to control instances and the network path, points to a self-hosted API on an endpoint the team runs, such as a SageMaker AI endpoint. Amazon Bedrock is the tempting default because it is serverless and billed per token, but it only serves its catalog models and supported imports, so this model cannot run there. Pre-training is the extreme case almost no organization takes on, and Comprehend is a different, pre-trained service.`
  },

  /* Ch 13 - MLOps fundamentals · Objective 1.3.5 */
  {
    q:`One engineer retrains a demand forecasting model by hand in a notebook. Last month a retrained version that performed worse went live without anyone noticing, and the team could not restore the previous version. Which TWO practices would have prevented this? (Select TWO.)`,
    opts:[
      "Moving the endpoint to larger instances with automatic scaling",
      "Retraining every night on a fixed timer and deploying each result directly",
      "A repeatable pipeline with an evaluation gate that stops a model that is not better",
      "Replacing the forecasting model with a foundation model that needs no retraining",
      "Registering each model version with its metrics and approval status in a model registry"
    ],
    correct:[2,4],
    explain:`An automated pipeline with an evaluation gate compares each new model with the live one and blocks a worse one, and a model registry (such as the Amazon SageMaker AI model registry) keeps every version with its metrics and approval history, so the previous version can be rolled back. A fixed nightly retrain is the tempting distractor because it automates retraining, but with no evaluation gate it can ship a worse model even faster. Larger instances solve a scaling problem the team does not have, and swapping in a foundation model does not remove the need for versioning and evaluation.`
  },

  /* Ch 14 - Model metrics vs business metrics · Objective 1.3.6 */
  {
    q:`An email provider's spam filter moves suspected spam into a folder that users rarely open. Users complain that important messages from banks and employers keep disappearing, while the occasional spam that reaches the inbox is only a minor annoyance. Which metric should the team prioritize when improving the filter?`,
    opts:[
      "Precision, so that messages flagged as spam are almost always spam",
      "Recall, so that as little spam as possible ever reaches the inbox",
      "Accuracy, because most messages are legitimate and it counts every right call",
      "F1, because it weighs both kinds of error equally in one number"
    ],
    correct:0,
    explain:`The costly error here is the false positive: a real message flagged as spam and hidden. Precision measures how often a spam flag is right, so it is the metric to favor. Recall is the tempting choice because it is the usual metric for catching bad items, but pushing recall up flags more messages and tends to hide even more real ones, the error users are complaining about. Accuracy can look high on imbalanced data while hiding the problem, and F1 weighs both errors equally when the scenario says one costs far more.`
  }
];

/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
