/* ----------  CARDS  ---------- */
const cards = [

  /* 0: cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",

    <h1 class="reveal">Data governance strategies</h1>
    <p class="lead reveal">AI systems create new data at every step: training sets, embeddings, prompts, responses, logs. Data governance decides for each of them <strong>where it may live</strong>, <strong>who watches it</strong> and <strong>how long it is kept</strong>.</p>

    html: `
    <div class="eyebrow reveal">Strategy 1</div>
    <h2 class="reveal" style="font-size:24px">Manage the whole data lifecycle</h2>
    <div class="pills">
      <div class="pill" data-step="1"><p><b>Create and collect</b>Know why each dataset is collected, and classify it (public, internal, personal, restricted).</p></div>
      <div class="pill" data-step="2"><p><b>Store</b>In an approved location, encrypted, with an owner.</p></div>
      <div class="pill" data-step="3"><p><b>Use</b>Only for approved purposes, such as training, a knowledge base, or analytics, by people and systems with access.</p></div>
      <div class="pill" data-step="4"><p><b>Archive</b>Move data that is rarely needed to cheaper storage, still protected.</p></div>

      <div class="pill"><p><b>Monitoring</b>Watch defined signals and alert on them: unusual data access, guardrail interventions rising, costs spiking, configuration drift (AWS Config).</p></div>
      <div class="pill"><p><b>Observation</b>Understand behavior over time: traces of agent steps, sampled answers reviewed for quality, data and model drift.</p></div>
      <div class="pill"><p><b>Tooling</b>Amazon CloudWatch for metrics, logs and alarms; the evaluation and logging tools from Chapters 42 and 54 for AI behavior.</p></div>
    </div>` },

  /* 5: retention, step build */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">Strategy 5</div>
    <h2 class="reveal" style="font-size:24px">Retention</h2>
    <div class="pills">
      <div class="pill" data-step="1"><p><b>Keep it as long as required, no longer</b>Some records must be kept for years by law; personal data should be deleted when no longer needed.</p></div>
      <div class="pill" data-step="2"><p><b>Automate it</b>Amazon S3 Lifecycle rules archive and expire objects; CloudWatch Logs retention settings expire log groups; S3 Object Lock prevents deletion when records must be preserved.</p></div>
      <div class="pill" data-step="3"><p><b>Remember derived data</b>Deleting a document is not enough if its chunks still sit in a vector store or its text in prompt logs. Re-sync and expire those too.</p></div>
    </div>` },

  /* 6: quiz, residency */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:19px">A European insurer's regulator requires that customer data used by its GenAI assistant is stored and processed only within the EU. The team wants cross-Region inference for capacity. What approach meets the rule?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span><span>A global inference profile, for the most capacity</span></button>
      <button class="choice" data-correct="true"><span class="key">B</span><span>EU Regions for all data and an EU geographic inference profile</span></button>
      <button class="choice" data-correct="false"><span class="key">C</span><span>Any Region, as long as the data is encrypted with KMS</span></button>
      <button class="choice" data-correct="false"><span class="key">D</span><span>Turn off logging so no data is stored</span></button>
    </div>
    <div class="feedback"><b>Correct.</b> Residency is met by choosing EU Regions for storage and an EU geographic inference profile so requests are processed only inside the EU, while still gaining extra capacity. Option A is the tempting one because it maximizes throughput, but a global profile can route requests outside the EU. Encryption (C) protects data but does not change where it is processed, and D removes the audit trail.</div>` },

  /* 7: quiz, retention */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:19px">A company keeps every customer chat transcript and prompt log from its AI assistant forever, "just in case". Its policy says personal data must be kept only 12 months. What should it do?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span><span>Keep everything, but encrypt it</span></button>
      <button class="choice" data-correct="false"><span class="key">B</span><span>Move all transcripts to a cheaper storage class</span></button>
      <button class="choice" data-correct="false"><span class="key">C</span><span>Delete only the transcripts, keeping the prompt logs</span></button>
      <button class="choice" data-correct="true"><span class="key">D</span><span>Set automated 12-month retention on transcripts and logs, and delete expired data</span></button>
    </div>
    <div class="feedback"><b>Correct.</b> A retention policy only works when it is enforced: lifecycle and log retention rules expire both transcripts and prompt logs after 12 months. Option A is the tempting one because encryption is good practice, but keeping personal data past its retention period still breaks the policy. B changes cost, not retention, and C forgets that prompt logs hold the same personal data.</div>` },

  /* 8: done */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Chapter 57 complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">Next: governance processes, and the last chapter of the course.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Lifecycle and residency</b>Rules from creation to deletion; Regions and geographic inference profiles keep data where it must stay.</p></div>
      <div class="pill"><p><b>Logging, monitoring, observation</b>Record activity, alert on signals, watch behavior over time; protect the logs.</p></div>
      <div class="pill"><p><b>Retention</b>As long as required and no longer, automated, including derived copies.</p></div>
    </div>
    <div class="spacer"></div>` }

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ----------
   v2 adds opt-in, per-card step builds on top of the v1 card engine. A card
   with no `steps` field takes exactly the v1 paths below and renders and
   behaves identically; every v2 branch is guarded by `steps` being present. */
const ENGINE_VERSION = 'v2';
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};
const stepState = {};   // v2: current revealed step per card index (mirrors `answered`)

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

/* v2: apply step visibility for one card WITHOUT touching its .in class, so a
   step reveal never replays the card-entrance .reveal stagger. Cumulative for
   normal elements (data-step <= current). Captions append by default: inside
   .stepcaps they accumulate too (data-step="0" is the pre-first-tap caption),
   and captions behind the current step get .step-past (dimmed) while the
   current one stays at full strength. A .stepcap-swap container (or legacy
   .stepcap) opts into swap: only the caption whose data-step equals the
   current step is shown. */
function applySteps(idx) {
  const cur = stepState[idx] || 0;
  els[idx].querySelectorAll('[data-step]').forEach(function(nd) {
    const s = parseInt(nd.getAttribute('data-step'), 10);
    const swapCap = nd.closest && nd.closest('.stepcap-swap, .stepcap');
    const appendCap = !swapCap && nd.closest && nd.closest('.stepcaps');
    const on = swapCap ? (s === cur) : appendCap ? (s <= cur) : (s >= 1 && s <= cur);
    nd.classList.toggle('step-on', on);
    nd.classList.toggle('step-past', !!appendCap && on && s < cur);
  });
}

/* Card layout: the only place that adds/removes .in (and thus replays reveal).
   Called on card change, never on a step advance. */
function layout() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
    applySteps(idx);   // persists built state on revisit
  });
  glow.style.background = cards[i].glow || 'transparent';
}

/* Footer/button state only. Safe to call after a step advance (no reveal). */
function updateFooter() {
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  const total = c.steps || 0;
  const stepsLeft = total > 0 && (stepState[i] || 0) < total;
  if (stepsLeft) { nextBtn.disabled = false; nextBtn.textContent = (i === 0) ? 'Begin lesson' : 'Continue'; }
  else if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
}

function render() {
  layout();
  updateFooter();
  if (cards[i].quiz) wireQuiz(els[i], i);
}

/* v2: reveal the next step of the current card. Returns true if a step was
   consumed (so the caller does not also advance the card). */
function advanceStep(idx) {
  const total = cards[idx].steps || 0;
  if (!total) return false;
  const cur = stepState[idx] || 0;
  if (cur >= total) return false;
  stepState[idx] = cur + 1;
  applySteps(idx);
  updateFooter();
  return true;
}

/* v2: reveal every remaining step at once (swipe-left escape hatch). */
function skipSteps(idx) {
  const total = cards[idx].steps || 0;
  if (!total || (stepState[idx] || 0) >= total) return false;
  stepState[idx] = total;
  applySteps(idx);
  updateFooter();
  return true;
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

/* Primary action. On a step card mid-build this reveals the next step; once
   the steps are done (or on a card with none) it advances, honoring the quiz
   gate exactly as v1 did. Shared by the Continue button and ArrowRight. */
function handleNext() {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  if (advanceStep(i)) return;
  go(i + 1);
}
nextBtn.onclick = handleNext;
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* v2: tapping anywhere on a step card advances one step; once built, a tap
   advances the card (gate permitting). Cards with no steps ignore taps, so
   this listener is inert on v1-style cards. Elements with their own behavior
   (quiz choices, links) are skipped so a tap never double-fires. */
vp.addEventListener('click', e => {
  const c = cards[i];
  if (!c.steps) return;
  if (e.target.closest('.choice, a')) return;
  if ((stepState[i] || 0) < c.steps) { advanceStep(i); return; }
  if (!nextBtn.disabled && !c.last) go(i + 1);
});

/* Keys and swipes only move between cards (or, for a step card, between
   steps). Leaving the lesson always takes a deliberate tap, so a stray swipe
   on the final card cannot navigate away. ArrowRight mirrors the Continue
   button step-wise; ArrowLeft mirrors Back. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) handleNext();
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  // Swipe left: skip any remaining steps and advance in one gesture, honoring
  // the quiz gate (updateFooter re-derives nextBtn.disabled after the skip).
  if (dx < -50 && !cards[i].last) { skipSteps(i); if (!nextBtn.disabled) go(i + 1); }
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
</html>
