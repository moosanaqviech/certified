<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 2",
  badge: "AWS AI Practitioner (AIF-C01)",
  blurb: "Exam-style, scenario-based questions, one per chapter. Most questions have one best answer; a few ask you to select two. Pass mark is 70%, our practice target (the real exam reports a scaled score of 700 out of 1,000).",
  coverage: "Covers chapters 15-28: Unit 2 (Fundamentals of GenAI). One question per chapter.",
  minutes: 28,
  pass: 70
};

const QUESTIONS = [

  /* Ch 15 - Tokens, chunking, embeddings, and vectors · Objective 2.1.1 */
  {
    q:`A company is building a knowledge base in Amazon Bedrock Knowledge Bases from long engineering reports. Each report wanders between topics at irregular points that do not line up with paragraph or page lengths, and retrieved passages often mix two unrelated topics. The team accepts some extra cost at ingestion time. Which chunking strategy fits best?`,
    opts:[
      "Fixed-size chunks with a 20% overlap between neighbouring chunks",
      "No chunking, so each report is stored as one complete chunk",
      "Semantic chunking, so each chunk ends where the topic changes",
      "The default strategy of roughly 300 tokens that keeps sentences whole"
    ],
    correct:2,
    explain:`Semantic chunking groups sentences by meaning, so a chunk ends where the topic shifts, which fixes passages that mix two topics. It uses a foundation model during ingestion, which is the extra cost the team has accepted. Fixed-size chunking with overlap is the tempting option, but it cuts by token count, not by topic, so mixed passages remain. No chunking makes each report one huge chunk, and the default strategy also splits by size rather than meaning.`
  },

  /* Ch 16 - Foundation models: transformer LLMs, multi-modal, diffusion · Objective 2.1.1 */
  {
    q:`A utility company wants field technicians to photograph a damaged meter, type "what is wrong with this, and is it safe to touch?", and receive a written answer in the app. Which kind of model is designed for this job?`,
    opts:[
      "A multi-modal model that accepts an image and text and replies in text",
      "A diffusion model that generates an image from the technician's description",
      "A text-only transformer LLM, given the file name of the photo in the prompt",
      "An embedding model that returns the stored photo closest to the new one"
    ],
    correct:0,
    explain:`The input mixes two modalities (an image and a text question) and the output is text, which is exactly what a multi-modal understanding model, such as an Amazon Nova understanding model, is for. The text-only LLM is the tempting option because the answer is text, but it cannot see the photo, so a file name tells it nothing about the damage. A diffusion model creates new images rather than reading them, and an embedding model finds similar items without explaining anything.`
  },

  /* Ch 17 - GenAI use cases · Objective 2.1.2 */
  {
    q:`An airline wants travelers to message it in plain language to change a flight. The system should check seat availability, rebook the passenger, and send the new itinerary, with no staff member involved unless something fails. Which GenAI use case does this describe?`,
    opts:[
      "An AI assistant that drafts suggested replies for the airline's support staff",
      "Summarization of each traveler's message history into a short case note",
      "A recommendation engine that suggests alternative destinations",
      "A customer service agent that acts through the airline's systems"
    ],
    correct:3,
    explain:`Talking to customers directly and resolving the request end to end by calling company systems (availability, rebooking, confirmation) is a customer service agent. The AI assistant is the tempting option because it runs on the same conversational model, but an assistant advises a person who then acts, and here no staff member is involved. Summarization and recommendations each cover only a fragment of the job and take no action.`
  },

  /* Ch 18 - GenAI strengths and limits · Objective 2.2.2 */
  {
    q:`An insurer pilots an FM that recommends whether to approve claims. In review, one recommendation cites "Section 14.3 of the policy", a section that does not exist in the policy. Separately, a regulator asks why the model recommended denying another claim, and nobody can trace the reason. Which TWO disadvantages of GenAI do these findings show?`,
    opts:[
      "Hallucination",
      "Lack of interpretability",
      "Nondeterminism",
      "Adaptability",
      "Responsiveness"
    ],
    correct:[0,1],
    explain:`A confident citation to a section that does not exist is invented content, which is hallucination. Being unable to explain why the model produced a particular recommendation is the interpretability problem, which bites hardest on decisions a regulator can challenge. Nondeterminism is the tempting third pick, but it means the same prompt giving different outputs on different runs, and neither finding describes that. Adaptability and responsiveness are advantages, not disadvantages.`
  },

  /* Ch 19 - The FM lifecycle · Objective 2.1.3 */
  {
    q:`A legal-tech team has just fine-tuned a text FM in Amazon Bedrock on a few thousand labeled contract clauses. The product manager wants it live for customers tomorrow. Which lifecycle stage should come next, before deployment?`,
    opts:[
      "Pre-training, so the model learns general language patterns from a broad corpus",
      "Evaluation, testing the model with benchmark cases, metrics, and human review",
      "Feedback, collecting customer ratings to judge whether the fine-tuning worked",
      "Data selection, choosing an unlabeled corpus for a second pre-training run"
    ],
    correct:1,
    explain:`Evaluation gates deployment: the fine-tuned model is tested against the task with test cases, automated metrics and human reviewers, and a failure sends it back to data, model choice or fine-tuning. Feedback is the tempting option because customer ratings do show quality, but feedback comes after deployment and would expose customers to an untested model. Pre-training is the provider's broad first run that the base model already went through, so repeating it is neither needed nor practical.`
  },

  /* Ch 20 - Token-based pricing · Objective 2.1.4 */
  {
    q:`A retrieval-based chatbot on Amazon Bedrock on-demand pricing sends about 6,000 tokens of retrieved passages with every question, many of them irrelevant, and its answers often run to several long paragraphs. Users say it is slow and the monthly bill is high. Which TWO changes reduce both cost and latency?`,
    opts:[
      "Move to a larger, more capable model so it answers in fewer attempts",
      "Stream the response so the first words appear on screen sooner",
      "Retrieve fewer, more relevant passages for each question",
      "Move every request to the Priority tier for faster responses",
      "Ask for concise answers and set a maximum output length"
    ],
    correct:[2,4],
    explain:`On-demand pricing bills input and output tokens, and the same tokens set the wait: input length drives time to first token and output length drives the rest, so trimming retrieved context and bounding the answer cut cost and latency together. Streaming is the tempting distractor, but it only shows the first words sooner; the full answer is just as long and costs the same. A larger model carries a higher rate per token, and the Priority tier costs more than Standard.`
  },

  /* Ch 21 - Context engineering · Objective 2.1.5 */
  {
    q:`An internal HR assistant includes all 40 available tool definitions and the full text of the policy library in every request. Costs are high, and answers often miss a key policy fact that sits somewhere in the middle of the pasted text. What is the best context engineering fix?`,
    opts:[
      "Switch to a model with a much larger context window so nothing has to be cut",
      "Fine-tune the model on the policy library so the text no longer needs to be sent",
      "Raise the temperature so the model explores more of the pasted text",
      "Send only the relevant passages and tools, with key facts at the start"
    ],
    correct:3,
    explain:`Context engineering aims for the smallest set of context that lets the model do the task: select the relevant passages and only the tools the workflow needs, and place what matters where the model weights it most, at the start or end of the window. The larger context window is the tempting option, but every token is still billed, tool descriptions still consume tokens, and the key fact is still buried mid-window. Fine-tuning teaches general patterns rather than serving current policy text, and temperature only changes randomness.`
  },

  /* Ch 22 - Anatomy of an AI agent · Objective 2.1.6 */
  {
    q:`A travel company's booking agent should remember a customer's seat preference and dietary needs on every trip, even when trips are booked months apart in separate sessions. Which agent capability provides this?`,
    opts:[
      "Short-term memory that holds the conversation and tool results of the current session",
      "Long-term memory stored outside the model and retrieved into context when relevant",
      "A larger context window that carries every past conversation in each request",
      "A deterministic workflow that fixes the booking steps in a set order"
    ],
    correct:1,
    explain:`Facts that must survive across sessions belong in long-term memory, kept in an external store and retrieved into the context only when relevant (Amazon Bedrock AgentCore Memory provides this as a managed service). Short-term memory is the tempting option, but it covers only the current session and is gone when the next trip is booked months later. Replaying every past conversation in a bigger window is costly and slow, and a fixed workflow controls step order, not what the agent remembers.`
  },

  /* Ch 23 - MCP and multi-agent patterns · Objective 2.1.6 */
  {
    q:`A bank has a fraud-analysis agent built with one framework and a customer-communication agent built by another team with a different framework. The fraud agent must discover the communication agent's skills and endpoint, then delegate the task of notifying a customer to it. Which standard is designed for this?`,
    opts:[
      "The Agent2Agent (A2A) protocol, using agent cards that list skills",
      "The Model Context Protocol (MCP), exposing the bank's core banking APIs as tools",
      "A shared blackboard where both agents post partial results in any order",
      "Fine-tuning both agents' FMs on each other's documentation"
    ],
    correct:0,
    explain:`A2A is the agent-to-agent protocol: agents built on different frameworks discover each other through an agent card describing skills and endpoint, and delegate tasks. MCP is the tempting option because it is the better-known standard, but MCP connects an agent to tools and data, not one agent to another agent. A blackboard shares partial results asynchronously rather than delegating a task, and fine-tuning gives a model knowledge about a system without any way to call it.`
  },

  /* Ch 24 - Business value and metrics for GenAI · Objective 2.2.4 */
  {
    q:`A GenAI support assistant performed well in a pilot with the English-speaking billing team. Leadership now plans to roll it out to the technical support team and to the German and Japanese markets, and asks for evidence that it will hold up there. Which metric answers this most directly?`,
    opts:[
      "Return on investment calculated from the billing team's pilot results",
      "Average revenue per user across all three markets",
      "Cross-domain performance, with accuracy checked per team and language",
      "Conversion rate on the support website before and after the pilot"
    ],
    correct:2,
    explain:`Cross-domain performance asks whether the application stays accurate across every area it serves, such as other teams and languages, and strong results in the pilot domain do not prove that. ROI from the pilot is the tempting option because sponsors care about payback, but it describes the one domain already tested and says nothing about quality elsewhere, which is the gate that has to be passed first. ARPU and conversion rate are revenue metrics a support assistant does not directly move.`
  },

  /* Ch 25 - The AWS GenAI stack, and why build on it · Objective 2.3.3 */
  {
    q:`A healthcare company's security review raises two questions before it adopts Amazon Bedrock: whether patient details in prompts will be used to train the providers' models, and how auditors can see evidence of the service's compliance certifications. Which TWO facts answer these questions?`,
    opts:[
      "Amazon Bedrock Guardrails stops every prompt from reaching the model provider's systems",
      "Amazon Bedrock does not share prompts with providers or use them for training",
      "Prompts stay private only after the company fine-tunes its own copy of the model",
      "Compliance reports covering Amazon Bedrock can be downloaded from AWS Artifact",
      "Under the shared responsibility model, AWS decides which data customers may send"
    ],
    correct:[1,3],
    explain:`Keeping prompts and outputs away from model providers, and out of base-model training, is a standing property of Bedrock, and the audit reports for standards such as ISO and SOC are downloadable from AWS Artifact. The Guardrails option is the tempting distractor, but Guardrails filters harmful content, denied topics and sensitive data; it is a safety control, not the reason prompts stay private. Fine-tuning creates a private copy but is not a precondition for privacy, and under shared responsibility the customer, not AWS, decides what data goes in.`
  },

  /* Ch 26 - Amazon Bedrock vs Amazon SageMaker JumpStart · Objective 2.3.1 */
  {
    q:`A team deployed an open FM from SageMaker JumpStart to a SageMaker AI endpoint for an internal drafting tool. The tool is used a few hours a week, yet the monthly bill is high. A comparable model offered in Amazon Bedrock meets the quality bar, and the team has no need to control hardware or network placement. What should it do?`,
    opts:[
      "Keep the JumpStart endpoint and move it to a larger instance type",
      "Keep the JumpStart endpoint and switch to a smaller instance type",
      "Keep the JumpStart endpoint and add Amazon Bedrock Guardrails in front of it",
      "Move the tool to Amazon Bedrock on demand, paying per token used"
    ],
    correct:3,
    explain:`A JumpStart endpoint bills for instance time while it runs, busy or idle, so a tool used a few hours a week pays mostly for idle hours. Bedrock on demand is serverless and billed per token, so quiet hours cost nothing, and the team needs none of the hardware control that justifies self-hosting. A smaller instance is the tempting option because it lowers the hourly rate, but the endpoint still bills every idle hour and the team still operates it. Guardrails filter content and do not change how the model is billed.`
  },

  /* Ch 27 - Agent and assistant tooling on AWS · Objective 2.3.1 */
  {
    q:`A software team wants an AI tool where a developer describes a feature in a prompt, and the tool first produces written requirements, a design, and a sequenced task list, then has agents implement the tasks in the codebase. They also want automated actions when files change. Which AWS offering fits?`,
    opts:[
      "Kiro, the agentic IDE with spec-driven development and agent hooks",
      "Strands Agents, the open-source SDK for writing a custom agent",
      "Amazon Bedrock AgentCore Runtime, hosting a coding agent in production",
      "Amazon Quick, using Quick Flows to automate the feature work"
    ],
    correct:0,
    explain:`Kiro is the agentic IDE for developers: spec-driven development turns a prompt into requirements, a design and a task list before agents implement them, and agent hooks automate actions when files change. Strands Agents is the tempting option because it is the AWS agent SDK, but the team would be writing and running its own agent instead of using a finished development tool. AgentCore runs a team's own agents in production, and Amazon Quick is an agentic workspace for business users, not a coding environment.`
  },

  /* Ch 28 - Cost trade-offs of AWS GenAI services · Objective 2.3.4 */
  {
    q:`An app in one EU Region uses an Amazon Bedrock model on demand. Traffic is low most of the day, but short, unpredictable bursts exceed the Region's capacity and some requests are throttled. Data must stay within the EU. Which option best addresses the bursts without paying for idle capacity?`,
    opts:[
      "Provisioned throughput with a 6-month term, sized for the largest burst",
      "Batch inference for all requests, collecting results the next morning",
      "Cross-Region inference within the EU geography",
      "Fine-tuning a smaller model and serving it from a dedicated endpoint"
    ],
    correct:2,
    explain:`Cross-Region inference sends on-demand requests to other Regions in the same geography when one is busy, absorbing bursts while billing stays per token, and keeping to the EU geography respects the residency rule. Provisioned throughput is the tempting option because it guarantees capacity, but it bills every hour whether used or not, and this traffic is low most of the day. Batch inference suits offline jobs that can wait, and a fine-tuned model adds training and always-on hosting cost.`
  }

];

/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
