    <p class="lead reveal" style="font-size:14.5px;margin-top:12px">The tell is the gap: compare training results with results on a validation set the model never saw.</p>` },

  /* 3: symptoms and fixes */
  { html: `
    <div class="eyebrow reveal">Symptoms and fixes</div>
    <h2 class="reveal" style="font-size:24px">What to do about each</h2>
    <div class="pills reveal">
      <div class="pill"><p><b style="color:var(--warm)">Underfitting (both scores low)</b>Use a more capable model, add informative features, or train longer.</p></div>
      <div class="pill"><p><b style="color:var(--sky)">Overfitting (training high, validation low)</b>Get more and more varied data, simplify the model, use regularization, or stop training earlier.</p></div>
      <div class="pill"><p><b>The goal</b>A model that generalizes: similar results on training data and on data it has never seen.</p></div>
    </div>` },

  /* 4: effects on groups */
  { html: `
    <div class="eyebrow reveal">Who pays for the error</div>
    <h2 class="reveal" style="font-size:24px">Effects on demographic groups</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>Errors are not shared evenly</b>A model can be accurate on average while making most of its mistakes on a smaller group it saw little of.</p></div>
      <div class="pill"><p><b>Overfitting makes it worse</b>A model that memorized the majority's patterns generalizes worst to people unlike them.</p></div>
      <div class="pill"><p><b>Real consequences</b>Wrongly denied loans, missed diagnoses, misidentified faces: inaccuracy concentrated on one group becomes unfairness.</p></div>
    </div>` },

  /* 5: quiz, overfitting */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:19px">A churn model scores 99% accuracy on its training data but only 71% on a validation set of new customers. What is the most likely problem?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span><span>Underfitting: the model is too simple</span></button>
      <button class="choice" data-correct="false"><span class="key">B</span><span>The validation set is wrong and should be dropped</span></button>
      <button class="choice" data-correct="true"><span class="key">C</span><span>Overfitting: high variance, the model memorized the training data</span></button>
      <button class="choice" data-correct="false"><span class="key">D</span><span>The model has no bias of any kind</span></button>
    </div>
    <div class="feedback"><b>Correct.</b> Excellent training results with much worse results on unseen data is the overfitting signature. More varied data, a simpler model or regularization help. Option A is the tempting one because both are fitting problems, but an underfit model scores poorly on the training data too. Dropping the validation set (B) only hides the problem.</div>` },

  /* 6: detection tools, step build */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">Detecting bias</div>

      <div class="pill" data-step="2"><p><b>Subgroup analysis</b>Break results down by group (age, gender, region, language) instead of one overall score. Gaps between groups are the evidence of bias.</p></div>
      <div class="pill" data-step="3"><p><b>Human audits</b>People review samples of decisions and outputs, especially for truthfulness and trustworthiness that metrics miss, and for high-stakes cases.</p></div>
    </div>` },

  /* 7: monitoring */
  { html: `

    <h2 class="reveal" style="font-size:24px">Bias can appear later</h2>
    <div class="pills reveal">

      <div class="pill"><p><b>Keep measuring</b>Repeat subgroup analysis on fresh predictions on a schedule, and audit samples of live outputs.</p></div>
      <div class="pill"><p><b>Tools</b>Amazon SageMaker Clarify computed standard bias metrics on data and predictions; it is now closed to new customers, so new projects compute the same metrics with open-source libraries. For FMs, Amazon Bedrock Model Evaluation covers responsible AI metrics such as stereotyping.</p></div>
    </div>` },

  /* 8: quiz, subgroup analysis */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:19px">An insurer's claims model is 94% accurate overall. Breaking results down by age band shows 70% accuracy for customers over 60. Which practice revealed the problem, and what does it show?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span><span>Subgroup analysis; it shows errors concentrated on one demographic group</span></button>
      <button class="choice" data-correct="false"><span class="key">B</span><span>Label quality analysis; it proves the labels are wrong</span></button>
      <button class="choice" data-correct="false"><span class="key">C</span><span>Overall accuracy; it shows the model is fine</span></button>
      <button class="choice" data-correct="false"><span class="key">D</span><span>A human audit; it shows the model underfits everyone</span></button>
    </div>
    <div class="feedback"><b>Correct.</b> Splitting results by group is subgroup analysis, and a large gap for one age band is the evidence of bias that the overall score hid. Next steps: check whether older customers are underrepresented and whether their labels are reliable. Option B is the tempting one because label problems are a common cause, but this analysis compared groups, it did not inspect labels. C is exactly the number that hid the gap.</div>` },

  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `

    <div class="done-badge reveal">${A.done}</div>

    <div class="pills reveal">
      <div class="pill"><p><b>Underfit and overfit</b>High bias: poor everywhere. High variance: great in training, poor on new data.</p></div>
      <div class="pill"><p><b>Effects</b>Inaccuracy, often concentrated on underrepresented groups.</p></div>
      <div class="pill"><p><b>Detect and monitor</b>Label quality analysis, subgroup analysis, human audits, repeated after launch.</p></div>

    <div class="spacer"></div>` }

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ----------
   v2 adds opt-in, per-card step builds on top of the v1 card engine. A card
   with no `steps` field takes exactly the v1 paths below and renders and
   behaves identically; every v2 branch is guarded by `steps` being present. */
const ENGINE_VERSION = 'v2';
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};
const stepState = {};   // v2: current revealed step per card index (mirrors `answered`)

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

/* v2: apply step visibility for one card WITHOUT touching its .in class, so a
   step reveal never replays the card-entrance .reveal stagger. Cumulative for
   normal elements (data-step <= current). Captions append by default: inside
   .stepcaps they accumulate too (data-step="0" is the pre-first-tap caption),
   and captions behind the current step get .step-past (dimmed) while the
   current one stays at full strength. A .stepcap-swap container (or legacy
   .stepcap) opts into swap: only the caption whose data-step equals the
   current step is shown. */
function applySteps(idx) {
  const cur = stepState[idx] || 0;
  els[idx].querySelectorAll('[data-step]').forEach(function(nd) {
    const s = parseInt(nd.getAttribute('data-step'), 10);
    const swapCap = nd.closest && nd.closest('.stepcap-swap, .stepcap');
    const appendCap = !swapCap && nd.closest && nd.closest('.stepcaps');
    const on = swapCap ? (s === cur) : appendCap ? (s <= cur) : (s >= 1 && s <= cur);
    nd.classList.toggle('step-on', on);
    nd.classList.toggle('step-past', !!appendCap && on && s < cur);
  });
}

/* Card layout: the only place that adds/removes .in (and thus replays reveal).
   Called on card change, never on a step advance. */
function layout() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
    applySteps(idx);   // persists built state on revisit
  });
  glow.style.background = cards[i].glow || 'transparent';
}

/* Footer/button state only. Safe to call after a step advance (no reveal). */
function updateFooter() {
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  const total = c.steps || 0;
  const stepsLeft = total > 0 && (stepState[i] || 0) < total;
  if (stepsLeft) { nextBtn.disabled = false; nextBtn.textContent = (i === 0) ? 'Begin lesson' : 'Continue'; }
  else if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
}

function render() {
  layout();
  updateFooter();
  if (cards[i].quiz) wireQuiz(els[i], i);
}

/* v2: reveal the next step of the current card. Returns true if a step was
   consumed (so the caller does not also advance the card). */
function advanceStep(idx) {
  const total = cards[idx].steps || 0;
  if (!total) return false;
  const cur = stepState[idx] || 0;
  if (cur >= total) return false;
  stepState[idx] = cur + 1;
  applySteps(idx);
  updateFooter();
  return true;
}

/* v2: reveal every remaining step at once (swipe-left escape hatch). */
function skipSteps(idx) {
  const total = cards[idx].steps || 0;
  if (!total || (stepState[idx] || 0) >= total) return false;
  stepState[idx] = total;
  applySteps(idx);
  updateFooter();
  return true;
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

/* Primary action. On a step card mid-build this reveals the next step; once
   the steps are done (or on a card with none) it advances, honoring the quiz
   gate exactly as v1 did. Shared by the Continue button and ArrowRight. */
function handleNext() {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  if (advanceStep(i)) return;
  go(i + 1);
}
nextBtn.onclick = handleNext;
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* v2: tapping anywhere on a step card advances one step; once built, a tap
   advances the card (gate permitting). Cards with no steps ignore taps, so
   this listener is inert on v1-style cards. Elements with their own behavior
   (quiz choices, links) are skipped so a tap never double-fires. */
vp.addEventListener('click', e => {
  const c = cards[i];
  if (!c.steps) return;
  if (e.target.closest('.choice, a')) return;
  if ((stepState[i] || 0) < c.steps) { advanceStep(i); return; }
  if (!nextBtn.disabled && !c.last) go(i + 1);
});

/* Keys and swipes only move between cards (or, for a step card, between
   steps). Leaving the lesson always takes a deliberate tap, so a stray swipe
   on the final card cannot navigate away. ArrowRight mirrors the Continue
   button step-wise; ArrowLeft mirrors Back. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) handleNext();
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  // Swipe left: skip any remaining steps and advance in one gesture, honoring
  // the quiz gate (updateFooter re-derives nextBtn.disabled after the skip).
  if (dx < -50 && !cards[i].last) { skipSteps(i); if (!nextBtn.disabled) go(i + 1); }
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
</html>
