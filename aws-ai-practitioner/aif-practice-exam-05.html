<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Full Mock 1",
  badge: "AWS AI Practitioner (AIF-C01)",
  blurb: "A full-length mock: 50 scenario questions across all five domains at the official weights, 90 minutes. Most questions have one best answer; a few ask you to select two. Pass mark is 70%, our practice target (the real exam reports a scaled score of 700 out of 1,000).",
  coverage: "All five domains, sampled at the official weights: 10 Fundamentals of AI and ML, 12 Fundamentals of GenAI, 14 Applications of Foundation Models, 7 Responsible AI, 7 Security and Governance. Its own scenarios, never reused in drills.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

  /* Ch 02 - Algorithms, models, training and inference · Objective 1.1.1 */
  {
    ref:{chapter:2},
    q:`A sporting goods retailer's store-traffic team has a well-tuned gradient boosting setup that predicts footfall. The returns team wants to predict which online orders will be sent back, and a manager suggests simply copying the traffic team's trained model. Which statement is accurate?`,
    opts:[
      "The model is the general learning method, so the traffic model can be reused for returns as is",
      "Running inference on returns data will gradually adapt the traffic model to the new task",
      "The algorithm can be shared, but training it on returns data yields a new model",
      "Reusing the same algorithm guarantees both teams will get the same predictions"
    ],
    correct:2,
    explain:`An algorithm is the general learning procedure; the model is what training on a specific dataset produces, saved as learned parameters. Same algorithm, different data, different model, so the returns team must train its own. The tempting option swaps the two terms: the traffic model learned footfall patterns and knows nothing about returns. Inference only applies a trained model to new data; it does not change what the model learned.`
  },

  /* Ch 01 - AI, ML, deep learning, GenAI and agentic AI · Objective 1.1.2 */
  {
    ref:{chapter:1},
    q:`A cosmetics brand runs three tools. Tool 1 predicts which customers will buy again next month from their purchase history. Tool 2 writes personalized email copy with a large language model. Tool 3 is given the goal "win back lapsed customers": it picks the customers, drafts offers, schedules sends through the email platform's API, and adjusts based on open rates. Which statement relates them correctly?`,
    opts:[
      "Tool 1 is ML, Tool 2 is GenAI, Tool 3 is agentic AI, and all three are AI",
      "Only Tools 2 and 3 count as AI, because Tool 1 only predicts a label or a number",
      "Tool 3 is generative AI rather than agentic AI, because it drafts the offers",
      "Tool 1 is not machine learning, because nothing says it uses a neural network"
    ],
    correct:0,
    explain:`Tool 1 learns patterns from past data (ML), Tool 2 generates new content with an LLM (GenAI), and Tool 3 works toward a goal over several steps, acting through tools and checking results (agentic AI). All of them sit inside the AI umbrella. The tempting option labels Tool 3 as GenAI because it drafts text, but generating content is one step; pursuing the goal autonomously through tools is what defines it. ML does not require a neural network, and prediction is exactly what most ML does.`
  },

  /* Ch 03 - Inference types · Objective 1.1.3 */
  {
    ref:{chapter:3},
    q:`A credit union wants a churn-risk score for each of its 2 million members every Sunday night. The data sits in Amazon S3, marketing reads the results on Monday morning, and nothing needs an answer on demand. Which Amazon SageMaker AI inference option fits best?`,
    opts:[
      "Real-time inference on a persistent endpoint",
      "Serverless inference that scales to zero between calls",
      "Asynchronous inference with an Amazon SNS notification",
      "A batch transform job that reads the dataset from S3"
    ],
    correct:3,
    explain:`Scoring a whole dataset on a schedule, with results needed by morning and no on-demand requests, is the batch transform case: SageMaker AI launches instances for the job, writes results to S3 and removes them when it finishes. Asynchronous inference is the tempting option because it handles large work and notifies when done, but it is built for queued individual requests needing answers in minutes, not one bulk job over every record. Real-time and serverless endpoints answer single requests while a caller waits.`
  },

  /* Ch 04 - Data types in AI models · Objective 1.1.4 */
  {
    ref:{chapter:4},
    q:`A consumer lender exports past loan applications as rows with columns for income, loan amount, term, employment length and application date, plus a final column "repaid on time: yes or no". It wants a model that predicts repayment for new applications. How is this dataset best described?`,
    opts:[
      "Unlabeled, unstructured text data, since the applications began as forms",
      "Labeled, structured tabular data, with repayment as the label",
      "Time-series data, because each application carries a date",
      "Unlabeled data, because no person tagged each row by hand"
    ],
    correct:1,
    explain:`Rows and columns under a fixed schema are structured, tabular data, and the repayment column is the answer the model should learn to predict, which makes it labeled. Time-series is the tempting option because of the date column, but the rows are independent applications; the order of dates does not carry the pattern being predicted. A label recorded from real outcomes is still a label even if nobody tagged rows by hand.`
  },

  /* Ch 05 - Supervised, unsupervised and reinforcement learning · Objective 1.1.5 */
  {
    ref:{chapter:5},
    q:`A fashion e-commerce company wants software that decides, day by day through a season, how much to mark down each item. No record of the "correct" markdown exists, but a simulator built from past sales can play out a whole season and score its total profit. Which type of learning fits?`,
    opts:[
      "Supervised learning, using last season's markdowns as the labels",
      "Reinforcement learning, with simulated profit as the reward",
      "Unsupervised clustering of items by how fast they sell",
      "Self-supervised learning on the product descriptions"
    ],
    correct:1,
    explain:`An agent choosing actions (markdowns) in an environment and receiving a reward (profit) is reinforcement learning, and it suits problems where nobody can label the right move for every situation. Supervised learning is the tempting option because past decisions exist, but they are not correct answers: copying them only reproduces whatever the planners did. Clustering groups items without deciding anything, and self-supervision on text does not learn a pricing policy.`
  },

  /* Ch 06 - When AI adds value · Objective 1.2.1 */
  {
    ref:{chapter:6},
    q:`A bank's mail room sorts about 40,000 customer letters a day by hand into 12 departments. Years of past letters are labeled with the department that handled them, and a misrouted letter is simply forwarded on, so occasional errors are tolerable. Where does ML add the most value here?`,
    opts:[
      "Assisting human decisions, with a person approving every routing suggestion",
      "Producing a specific outcome that must be exact for every letter",
      "Very little, because the cost-benefit check fails for letters",
      "Automating a repetitive, high-volume sorting task"
    ],
    correct:3,
    explain:`Routine routing at high volume, with labeled history and tolerable errors, is the automation case: the model sorts letters with no person in the loop. Assisting human decisions is the tempting option because it is also a valid value of ML, but having someone approve 40,000 suggestions a day keeps the manual bottleneck the bank wants to remove. Nothing here needs an exact formula, and the volume makes the cost-benefit favorable.`
  },

  /* Ch 06 - When AI is the wrong tool · Objective 1.2.2 */
  {
    ref:{chapter:6},
    q:`A boutique furniture maker takes about 30 custom orders a month. Its workshop manager already estimates delivery dates accurately from a simple lead-time table, and past orders were never recorded digitally. A consultant proposes an ML model to predict delivery dates. What is the best recommendation?`,
    opts:[
      "Keep the lead-time table: the volume is tiny, the rules work and there is no data",
      "Build the model anyway and have the workshop manager review every predicted date before it is sent",
      "Use a foundation model and paste each order's details into the prompt",
      "Spend a year digitizing records, then build a model whatever the cost"
    ],
    correct:0,
    explain:`The cost-benefit check fails on every count: tiny volume, a rules-based baseline that already works, and no historical data to learn from. The tempting option adds human review, which sounds safe, but it pays for a model and a reviewer to approximate what the table already does well. A foundation model still produces a guess, and gathering data regardless of cost ignores the benefit side of the analysis.`
  },

  /* Ch 09 - AWS managed AI services · Objective 1.2.5 */
  {
    ref:{chapter:9},
    q:`A regional bank records thousands of customer service calls a week. It wants each recording turned into text, then wants the text analyzed for customer sentiment and recurring key phrases so managers can see why customers are unhappy. The bank has no machine learning staff. Which TWO AWS services together meet the need? (Select TWO.)`,
    opts:[
      "Amazon Polly",
      "Amazon Transcribe",
      "Amazon Lex",
      "Amazon Comprehend",
      "A custom model trained in Amazon SageMaker AI"
    ],
    correct:[1,3],
    explain:`Amazon Transcribe converts recorded speech into text, and Amazon Comprehend detects sentiment and key phrases in that text: two pre-trained services behind an API, with no ML staff needed. Polly is the tempting option because it is also a speech service, but it runs the other way, turning text into speech. Lex builds chatbots rather than analyzing past calls, and training a custom model is unnecessary when ready-made services do the job.`
  },

  /* Ch 12 - Where models come from · Objective 1.3.2 */
  {
    ref:{chapter:12},
    q:`A home goods retailer plans to start from an open-weight foundation model listed in Amazon SageMaker JumpStart rather than train its own. Before it deploys the model for product questions, what should the team understand about this model source?`,
    opts:[
      "The model was trained on the retailer's catalog, so its answers reflect only the retailer's data",
      "Open-weight models carry no usage terms, so any commercial use is allowed",
      "Its license sets how it may be used, and it inherits any biases in its training data",
      "It must be pre-trained again on the retailer's data before it can answer anything"
    ],
    correct:2,
    explain:`A pre-trained model is fast to adopt, but it comes with a license (some require accepting an end user license agreement), and its training data was chosen by someone else, so the retailer inherits whatever gaps or biases it holds. The tempting option assumes open weights mean no terms, which is exactly the check the team must not skip. The model never saw the retailer's private data, and it works out of the box; adaptation with prompts, retrieval or fine-tuning is optional.`
  },

  /* Ch 13 - MLOps fundamentals · Objective 1.3.5 */
  {
    ref:{chapter:13},
    q:`A grocery chain's demand model scored well in testing but makes poor predictions in production. Engineers find that the "average weekly sales" feature is computed one way in the data scientist's training notebook and a different way in the production code. Which MLOps concept describes the cause, and what fixes it?`,
    opts:[
      "Model drift; the world has changed, so retrain the model every night on the newest data",
      "Technical debt; use one versioned pipeline that computes the feature for both",
      "Underfitting; switch to a more complex algorithm and train for longer",
      "Scalability; move the production endpoint to larger instances"
    ],
    correct:1,
    explain:`Features computed one way in training and another in production are a classic technical-debt shortcut, and the fix is to version the code and configuration and run one automated pipeline so both sides use the same logic. Drift is the tempting option because production results decayed, but drift means the world changed; here the inputs were never the same as in training, and nightly retraining would not reconcile the two calculations. The model scored well in testing, so it is not underfit, and instance size does not affect accuracy.`
  },

  /* Ch 15 - Tokens, chunking, embeddings, and vectors · Objective 2.1.1 */
  {
    ref:{chapter:15},
    q:`A fintech compares two text models on Amazon Bedrock for summarizing monthly account statements. The same 2,000-word statement shows a different number of input tokens on each model's usage report. What is the most likely reason?`,
    opts:[
      "One model bills per word and the other bills per character",
      "A model that produces larger embeddings counts each extra dimension as an input token",
      "One model silently adds earlier users' conversations to every prompt",
      "Each model's tokenizer splits text differently, giving a different token count"
    ],
    correct:3,
    explain:`A token is a run of characters a model treats as one unit, and each model's tokenizer splits text differently, so identical input can be a different token count on another model. That is why cost estimates must be made for the model that will actually run. The tempting option assumes a word or character meter, but Bedrock text models are billed per input and output token, never per word. Embedding size and other users' conversations have nothing to do with this request's input count.`
  },

  /* Ch 17 - GenAI use cases · Objective 2.1.2 */
  {
    ref:{chapter:17},
    q:`A credit card issuer has a large body of legacy batch programs that few of its engineers still understand. It wants each program explained in plain English, rewritten in a modern programming language, and given unit tests. Which GenAI use case is this?`,
    opts:[
      "Code generation",
      "Translation",
      "Summarization",
      "A customer service agent"
    ],
    correct:0,
    explain:`Explaining unfamiliar code, converting it from one language to another during modernization and writing tests are all code generation, since code is text the same models can write. Translation is the tempting option because the work moves between languages, but that use case refers to human languages, not programming languages. Summarization condenses long text into shorter text, which is only a small part of this job, and no customer is being served.`
  },

  /* Ch 19 - The FM lifecycle · Objective 2.1.3 */
  {
    ref:{chapter:19},
    q:`A home improvement retailer is assembling 5,000 example prompts with ideal responses to adapt a foundation model. The team removes duplicate records, strips out customers' personal information, drops off-topic examples, and checks that every product department is represented. Which FM lifecycle stage is this work?`,
    opts:[
      "Pre-training",
      "Evaluation",
      "Data selection",
      "Model selection"
    ],
    correct:2,
    explain:`Choosing, cleaning and checking the data a model will learn from is data selection, and its quality sets the ceiling for every later stage. Evaluation is the tempting option because the team is checking quality, but evaluation tests the model's outputs, not the training examples. Pre-training is the provider's broad run on vast unlabeled data, and model selection is choosing which FM to build on, not preparing examples.`
  },

  /* Ch 20 - Token-based pricing · Objective 2.1.4 */
  {
    ref:{chapter:20},
    q:`An online electronics store's shopping assistant on Amazon Bedrock sends the same 8,000-token block of store policies and instructions at the start of every request, followed by a short customer question. Traffic is uneven through the day. Which change most directly lowers both the cost and the latency of these requests?`,
    opts:[
      "Move every request to the Priority tier",
      "Buy Provisioned Throughput sized for the busiest hour of the day",

      "Publish nothing about the assistant, so attackers learn nothing at all",
      "Replace the assistant with a decision tree so the report is unnecessary"
    ],
    correct:1,
    explain:`Transparency helps safety when people can inspect data, limits and evaluations, but publishing the exact safety filters and system prompt can help attackers design jailbreaks; the balance is to share what supports accountability and document the sensitive controls internally. Publishing everything is the tempting option because transparency is a responsible AI goal, but this is exactly where openness can hurt safety. Publishing nothing loses accountability, and a decision tree cannot answer open-ended fraud questions.`
  },

  /* Ch 52 - Securing AI systems on AWS · Objective 5.1.1 */
  {
    ref:{chapter:52},
    q:`An online retailer plans to load 2 million customer support documents from Amazon S3 into an Amazon Bedrock knowledge base. Before ingestion, the security team wants the bucket scanned to find any files that contain card numbers, credentials or other sensitive data. Which AWS service fits?`,
    opts:[
      "Amazon Bedrock Guardrails sensitive information filters",
      "AWS Key Management Service (AWS KMS)",
      "AWS PrivateLink",
      "Amazon Macie"
    ],
    correct:3,
    explain:`Amazon Macie scans Amazon S3 with machine learning and pattern matching to find sensitive data before it goes into training or a knowledge base. Guardrails sensitive information filters are the tempting option because they also detect PII, but they check prompts and responses at run time, not files sitting in a bucket before ingestion. KMS manages encryption keys and PrivateLink keeps traffic off the public internet; neither finds sensitive content.`
  },

  /* Ch 53 - Data provenance · Objective 5.1.2 */
  {
    ref:{chapter:53},
    q:`At a consumer goods company, data scientists choosing training data for a new model cannot tell which datasets exist, who owns each one, where it is stored, or which contain personal data. Which practice addresses this most directly?`,
    opts:[
      "A central data catalog, such as the AWS Glue Data Catalog",
      "Amazon SageMaker Model Cards recording each model version's training data",
      "Source citations returned with every generated answer",
      "AWS CloudTrail logs of every API call in the account"
    ],
    correct:0,
    explain:`Data cataloging lists each dataset with its owner, schema, classification and location, so data can be found and governed before anyone trains on it. Model Cards are the tempting option because they also document training data, but they record what was used for a model version after the fact; they do not help discover what datasets exist. Citations describe where a RAG answer came from, and CloudTrail records API activity, not dataset ownership.`
  },

  /* Ch 53 - Secure data engineering · Objective 5.1.3 */
  {
    ref:{chapter:53},
    q:`A payments fintech is building a pipeline that feeds transaction records into fine-tuning jobs and a knowledge base. Which TWO practices follow secure data engineering best practice? (Select TWO.)`,
    opts:[
      "Give every engineer write access to the knowledge base sources so that fixes land quickly",
      "Run automated quality checks as data enters the pipeline, halting it on failure",
      "Skip quality checks on internal data, since only outside data can be poisoned",
      "Replace customer identifiers with tokens that only an authorized system can map back",
      "Keep raw card data unencrypted in the training bucket to speed up jobs"
    ],
    correct:[1,3],
    explain:`Automated quality checks that halt the pipeline catch errors and can be the first sign of tampering, and pseudonymization is a privacy-enhancing technology that removes identities while keeping data usable. Broad write access is the tempting option because it speeds up fixes, but write access to training and knowledge sources is the most sensitive right, and most poisoning starts there. Internal data can be poisoned too, and sensitive data must be encrypted at rest.`
  },

  /* Ch 54 - Threats to AI systems · Objective 5.1.4 */
  {
    ref:{chapter:54},
    q:`A private bank turns on Amazon Bedrock model invocation logging for its customer assistant. The delivered logs contain full prompts, including account details customers typed, captured before any guardrail ran. What should the bank do with these logs?`,
    opts:[
      "Leave them open to all developers, since they are needed for debugging",
      "Nothing extra: Guardrails mask PII in answers, so the logs hold no sensitive data",
      "Encrypt them with AWS KMS, restrict access and set a retention period",
      "Turn off AWS CloudTrail to reduce how much data is stored"
    ],
    correct:2,
    explain:`Logs of AI interactions are data too: they can hold personal data and pre-guardrail input, so they need encryption with KMS, tight access control and a retention setting. The Guardrails option is the tempting one because masking does protect answers, but these logs capture the raw prompts before any filter ran. Open developer access is a data leakage path, and turning off CloudTrail removes the audit trail without protecting the prompt logs.`
  },

  /* Ch 55 - Hallucination detection and grounding · Objective 5.1.5 */
  {
    ref:{chapter:55},
    q:`A mortgage lender's assistant answers borrowers' eligibility questions. Credit experts have written the lending policy as a set of logical rules, such as loan-to-value limits by product. The lender wants every answer validated against those rules, with corrections suggested when an answer breaks one. Which approach fits best?`,
    opts:[
      "A system prompt line saying never state an incorrect eligibility rule",
      "Automated Reasoning checks in Amazon Bedrock Guardrails",
      "A higher temperature so the model considers more possible answers",
      "A model with a longer context window"
    ],
    correct:1,
    explain:`Automated Reasoning checks validate answers against logical rules written from the company's policies and suggest corrections, which matches rule-based eligibility exactly. The prompt instruction is the tempting option because it is easy, but a model cannot tell which of its statements are wrong, so "do not make things up" is not a defense. Temperature adds randomness, and a longer window does not validate anything.`
  },

  /* Ch 56 - Governance and compliance services · Objective 5.2.1 */
  {
    ref:{chapter:56},
    q:`A toy retailer's cloud team wants regular recommendations across its AI workloads: idle or unused resources driving up cost, security groups left open, and service limits about to be reached. Which AWS service is designed for this?`,
    opts:[
      "AWS Config with custom rules",
      "AWS CloudTrail",
      "AWS Artifact",
      "AWS Trusted Advisor"
    ],
    correct:3,
    explain:`Trusted Advisor inspects the account and recommends improvements across cost, performance, resilience, security and service limits. AWS Config is the tempting option because it also flags security settings, but it evaluates resource configurations against rules you define and keeps their history; it does not give best-practice recommendations on cost and limits. CloudTrail records API activity, and Artifact provides AWS's own compliance reports.`
  },

  /* Ch 57 - Data governance strategies · Objective 5.2.2 */
  {
    ref:{chapter:57},
    q:`An online pet supply store receives a customer's request to delete their personal data. The team deletes the customer's documents from the Amazon S3 bucket behind its Amazon Bedrock knowledge base, yet a week later the assistant still quotes them, and the text also sits in prompt logs. What has the deletion missed?`,
    opts:[
      "Nothing; deleting the source files in S3 completes the request",
      "The files should have been moved to a cheaper storage class instead of deleted",
      "Derived copies: re-sync the knowledge base and expire the logged text",
      "The model's temperature, which makes it repeat what it has seen"
    ],
    correct:2,
    explain:`The delete stage of the data lifecycle must cover derived data: chunks still sit in the vector store until the knowledge base is re-synced, and the same text lives in prompt logs that need expiring. The tempting option assumes deleting the source is enough, but the assistant answers from what was last ingested, not from the bucket. Archiving changes cost, not retention, and temperature has nothing to do with stored copies.`
  }
];

/* =====================================================================

===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
