<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 4",
  badge: "AWS AI Practitioner (AIF-C01)",
  blurb: "Exam-style, scenario-based questions, one per chapter. Most questions have one best answer; a few ask you to select two. Pass mark is 70%, our practice target (the real exam reports a scaled score of 700 out of 1,000).",
  coverage: "Covers chapters 44-58: Unit 4 (Guidelines for Responsible AI) and Unit 5 (Security, Compliance, and Governance). One question per chapter.",
  minutes: 30,
  pass: 70
};

const QUESTIONS = [

  /* Ch 44 - Features of responsible AI · Objectives 4.1.1, 4.1.3 */
  {
    q:`A team must choose a model for a high-volume FAQ assistant. A small model and a very large model both meet the quality bar in testing. The company has a commitment to reduce the environmental impact of its IT. Which choice reflects responsible model selection?`,
    opts:[
      "The small model, since it meets the need with less compute and energy per request",
      "The very large model, since bigger models are always more responsible",
      "Train a new model from scratch so the company controls its energy use",
      "Whichever model has the longest context window"
    ],
    correct:0,
    explain:`Responsible selection includes environmental cost: when a smaller model meets the quality bar, it uses less compute and energy for every request, which AWS Well-Architected guidance recommends checking first. The very large model is the tempting option because size suggests quality, but here quality is already equal, so it only adds energy and cost. Training from scratch is the most energy-intensive choice of all.`
  },

  /* Ch 45 - Amazon Bedrock Guardrails · Objective 4.1.2 */
  {
    q:`A pharmacy chain's assistant on Amazon Bedrock must never discuss dosage changes for prescription drugs, and must hide any customer email addresses that appear in its answers while keeping the rest of the answer. Which TWO Amazon Bedrock Guardrails policies meet these needs?`,
    opts:[
      "A word filter listing every drug name",
      "A denied topic for prescription dosage advice",
      "A contextual grounding check with a high threshold",
      "A content filter for violence set to high",
      "A sensitive information filter for email addresses in mask mode"
    ],
    correct:[1,4],
    explain:`A denied topic blocks a subject in context however it is phrased, and a sensitive information filter in mask mode hides just the email address and lets the rest of the answer through. The word filter is the tempting option because drug names relate to the rule, but it would block every mention of a drug, including harmless ones, and still miss dosage advice phrased without a name. Grounding checks and violence filters address other risks.`
  },

  /* Ch 46 - Legal risks of GenAI · Objective 4.1.4 */
  {
    q:`A travel site's AI assistant tells customers that a hotel offers free cancellation up to the day of arrival, which is not true. Several customers book on that basis and demand refunds. Which legal risk does this illustrate, and which measure reduces it most directly?`,
    opts:[
      "Intellectual property infringement; check the model's license",
      "Biased output; rebalance the training data",
      "Hallucination presented as fact; ground answers in the hotels' actual policies and check them",
      "Environmental impact; use a smaller model"
    ],
    correct:2,
    explain:`The assistant stated an invented policy as fact, and the company may be held to what its channel said. Grounding answers in the real hotel policies, with a grounding check, attacks the cause. Biased output is the tempting option because customers were treated unfairly, but no group was treated differently; the problem is a false statement. The license and model size are unrelated.`
  },

  /* Ch 47 - What a good dataset looks like · Objective 4.1.5 */
  {
    q:`A city builds a model to predict which neighborhoods need road repairs, trained on residents' pothole reports from a smartphone app. Neighborhoods where few residents use the app are predicted to need almost no repairs. What is the main dataset problem?`,
    opts:[
      "The data comes from too many curated sources",
      "The dataset is not inclusive or balanced: some neighborhoods are barely represented",
      "The dataset is too diverse in road types",
      "The labels are encrypted"
    ],
    correct:1,
    explain:`Reports come mostly from neighborhoods with many app users, so others are underrepresented and the model learns that they have few problems: an inclusivity and balance gap. Adding other data sources (inspections, sensors) for those areas fixes it. The curated-sources option is the tempting one because source choice is the root issue, but the problem is one narrow source, not too many good ones.`
  },

  /* Ch 48 - Bias and variance · Objectives 4.1.6, 4.1.7 */
  {
    q:`A speech recognition model has a 6% word error rate overall. The team wants to know whether it serves all customers equally well before launch in a multilingual country. Which practice answers that question?`,
    opts:[
      "Report the overall error rate to leadership",
      "Retrain with a higher learning rate",
      "Lower the model's temperature",
      "Subgroup analysis: compare error rates by language, accent, age and gender"
    ],
    correct:3,
    explain:`An overall score can hide large gaps; breaking error rates down by group is subgroup analysis, and a much higher rate for one accent or language is the evidence of bias. Reporting the overall rate is the tempting option because it is a real result, but it is exactly the number that would hide unequal performance. Training settings and temperature do not measure fairness.`
  },

  /* Ch 49 - Transparent vs opaque models · Objectives 4.2.1, 4.2.3 */
  {
    q:`A health insurer must explain to each member why a claim was flagged for review, and an auditor will check that the explanations match how decisions are made. On its structured claims data, a decision tree scores almost as well as a deep neural network. Which choice fits best?`,
    opts:[
      "The decision tree, because its decision path is the explanation",
      "The neural network, because higher accuracy always wins",
      "A foundation model that writes a plausible reason for each flag",
      "Either model, with no explanation given to members"
    ],
    correct:0,
    explain:`When explanations must reflect the real decision and a transparent model performs almost as well, the interpretable model is the responsible choice: its path is the reason. The foundation model is the tempting option because it produces readable reasons, but a generated reason is not guaranteed to match how the decision was actually made, which the auditor will check. A small accuracy gain does not outweigh the explanation requirement.`
  },

  /* Ch 50 - Tools for transparency · Objective 4.2.2 */
  {
    q:`Before using a managed AWS AI service for document analysis, a compliance team wants AWS's own description of the service's intended use cases, limitations and responsible AI design choices. Which resource should it read?`,
    opts:[
      "An Amazon SageMaker Model Card created by the team",
      "AWS Artifact compliance reports",
      "The AWS AI Service Card for that service",
      "The team's AWS CloudTrail logs"
    ],
    correct:2,
    explain:`AWS AI Service Cards are AWS's responsible AI documentation for its services, covering intended uses, limitations, design choices and deployment guidance. The SageMaker Model Card is the tempting option because it also documents intended use and limits, but customers write model cards for their own models; it would not contain AWS's description of its service. Artifact holds security and compliance reports, and CloudTrail logs API activity.`
  },

  /* Ch 51 - Human-centered design for explainable AI · Objective 4.2.4 */
  {
    q:`A job platform uses AI to rank applicants for recruiters. Applicants are not told AI is involved, and rejected applicants receive no reason and no way to respond. Which change best applies human-centered design for explainable AI?`,
    opts:[
      "Hide the AI further so applicants are not worried",
      "Disclose AI use, give the main reasons in plain language, and offer a route to human review",
      "Publish the model's full weights on the website",
      "Add a thumbs-up button for recruiters only"
    ],
    correct:1,
    explain:`Human-centered explainability tells affected people that AI is involved, explains decisions in terms they can act on, and gives them a feedback or appeal route to a person. Publishing weights is the tempting option because it sounds maximally transparent, but raw weights mean nothing to an applicant and do not explain their outcome. A recruiter-only button ignores the people the decision affects.`
  },

  /* Ch 52 - Securing AI systems on AWS · Objective 5.1.1 */
  {
    q:`A company is deploying an agent on Amazon Bedrock AgentCore that reads customers' calendars in a third-party service. The agent must act with each signed-in user's own access, and only managers may call its "approve leave" tool, enforced outside the model. Which TWO features meet these needs?`,
    opts:[
      "Amazon Macie on the calendar exports",
      "Amazon Bedrock AgentCore Identity, to authenticate users and act on their behalf with stored credentials",
      "AWS Trusted Advisor checks on the agent's account",
      "A system prompt telling the agent which users are managers",
      "Policy in Amazon Bedrock AgentCore, with a rule that restricts the approve leave tool to managers"
    ],
    correct:[1,4],
    explain:`AgentCore Identity authenticates callers and lets the agent reach outside tools with the user's own delegated access through its token vault; Policy in AgentCore evaluates each tool call against rules at the gateway, outside the model. The system prompt is the tempting option because it states the rule, but instructions can be overridden by prompt injection, so they are not an enforcement mechanism. Macie and Trusted Advisor do not control agent access.`
  },

  /* Ch 53 - Data provenance and secure data engineering · Objectives 5.1.2, 5.1.3 */
  {
    q:`A data team discovers that a corrupted file entered a training dataset three months ago. It must find every model version trained on that dataset version, and prevent unreviewed edits to training data in future. Which combination fits best?`,
    opts:[
      "Larger validation sets and higher temperature",
      "Source citations in RAG answers and a denied topic",
      "Amazon Bedrock Guardrails on the training jobs",
      "Data lineage linking dataset versions to model versions, plus restricted write access and versioned, checked datasets"
    ],
    correct:3,
    explain:`Lineage records which dataset versions trained which model versions, so the affected models can be found; integrity controls (least-privilege write access, versioning, checksums, reviewed changes) stop silent edits in future. Source citations are the tempting option because they also document data origins, but they describe where a RAG answer came from, not what trained a model. Guardrails filter prompts and responses, not training data.`
  },

  /* Ch 54 - Threats to AI systems · Objective 5.1.4 */
  {
    q:`An internal assistant built on a knowledge base answers an intern's question by quoting salary figures from an HR file the intern has no permission to open. The knowledge base indexes every document in the company's shared drive. Which threat is this, and what is the best fix?`,
    opts:[
      "Data leakage; filter retrieval by the user's permissions and keep restricted files out of the index",
      "Toxicity; raise the content filter strength",
      "Jailbreaking; add a prompt attack filter",
      "A software vulnerability; run Amazon Inspector"
    ],
    correct:0,
    explain:`Sensitive data reaching a user who may not see it is data leakage; the fix is permission-aware retrieval and keeping restricted documents out of indexes that everyone can query. Jailbreaking is the tempting option because the outcome looks like a bypass, but the intern asked a normal question; the system simply retrieved what it should not have. The content was not toxic, and Inspector scans software, not data access.`
  },

  /* Ch 55 - Hallucination detection and grounding · Objective 5.1.5 */
  {
    q:`A bank's RAG assistant sometimes adds fee amounts that do not appear in the retrieved fee schedule. The team wants the system itself to catch these unsupported answers before customers see them. Which approach fits best?`,
    opts:[
      "Add 'do not invent fees' to the system prompt",
      "Raise the temperature so the model considers more options",
      "A contextual grounding check in Amazon Bedrock Guardrails, blocking answers below the grounding threshold",
      "Remove the knowledge base so the model answers from training data"
    ],
    correct:2,
    explain:`A contextual grounding check scores each answer against the retrieved source and blocks it when the score falls below the threshold, which catches fees that are not in the schedule. The prompt instruction is the tempting option because it names the problem, but the model cannot reliably tell which of its statements are invented, so an instruction alone is not validation. Higher temperature and removing the sources both make hallucination worse.`
  },

  /* Ch 56 - Governance and compliance services · Objective 5.2.1 */
  {
    q:`A security lead wants continuous scanning of the EC2 instances and container images that host a company's AI application for known software vulnerabilities, with findings prioritized by severity. Which AWS service is designed for this?`,
    opts:[
      "AWS Artifact",
      "Amazon Inspector",
      "AWS Config",
      "AWS CloudTrail"
    ],
    correct:1,
    explain:`Amazon Inspector is automated, continuous vulnerability management for workloads such as EC2 instances, container images in Amazon ECR and Lambda functions. AWS Config is the tempting option because it also checks resources continuously, but it evaluates configuration settings against rules, not software vulnerabilities. Artifact provides AWS's own compliance reports, and CloudTrail logs API activity.`
  },

  /* Ch 57 - Data governance strategies · Objective 5.2.2 */
  {
    q:`A company's policy says customer prompts and responses logged by its GenAI assistant may be kept for at most 90 days, and that all such data must stay in its home AWS Region. Which TWO actions support this policy?`,
    opts:[
      "Set 90-day retention on the log destinations, such as CloudWatch Logs retention or S3 Lifecycle expiration",
      "Use a global cross-Region inference profile for maximum capacity",
      "Turn off AWS CloudTrail to reduce stored data",
      "Keep the logs, models and inference in the home Region, using an in-geography inference profile if cross-Region capacity is needed",
      "Copy the logs to a backup Region for safety"
    ],
    correct:[0,3],
    explain:`Retention is enforced by automatic expiry on the log stores, and residency by keeping data and processing in the home Region (or an in-geography profile). The global inference profile is the tempting option because it improves capacity, but it can route requests outside the geography, breaking residency. Copying logs to another Region breaks residency too, and turning off CloudTrail removes the audit trail without addressing either rule.`
  },

  /* Ch 58 - Governance processes and the Scoping Matrix · Objective 5.2.3 */
  {
    q:`Employees at a law firm have started pasting client documents into a free public chatbot to summarize them. The firm's governance team wants to classify this use and respond. Where does it sit in the Generative AI Security Scoping Matrix, and what is the main governance lever?`,
    opts:[
      "Scope 5; retrain the chatbot's model on firm data",
      "Scope 3; add Amazon Bedrock Guardrails to the public chatbot",
      "Scope 4; fine-tune the public chatbot",
      "Scope 1; an acceptable use policy and training on what data may be entered, plus an approved alternative"
    ],
    correct:3,
    explain:`A public consumer GenAI service is Scope 1: the firm controls neither the model nor its data handling, so governance works through policy (what data may be entered), training and offering an approved tool. Scope 3 is the tempting option because guardrails are a strong control, but the firm cannot attach its own guardrails to someone else's public chatbot; that applies when it builds on a model itself. Scopes 4 and 5 require owning model customization or training.`
  }
];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
