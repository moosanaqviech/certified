      <text x="160" y="124" text-anchor="middle" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="7.5">or CLUSTER BY AUTO and let predictive optimization pick and maintain the keys</text>

  done: `<svg viewBox="0 0 84 84">

  </svg>`
};

/* ----------  CARDS  ---------- */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 5 · Chapter 26</div>
    <h1 class="reveal">Liquid Clustering</h1>
    <p class="lead reveal">A filter on a large table is fast only if the engine can skip the files that cannot match. <strong>Liquid Clustering</strong> arranges rows so that it can, and it is the layout Databricks recommends for every new table, replacing partitioning and Z-Order.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — data skipping, step build */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">Why it works</div>
    <h2 class="reveal" style="font-size:24px">Data skipping</h2>
    <div class="art reveal">${A.skip}</div>
    <div class="stepcaps">
      <p class="lead" data-step="0" style="font-size:14.5px">The speed comes from reading fewer files, not from reading them faster. Tap to see how a filter skips.</p>
      <p class="lead" data-step="1" style="font-size:14.5px">Delta records statistics for each data file: the minimum and maximum of each column (the first 32 by default).</p>
      <p class="lead" data-step="2" style="font-size:14.5px">If rows are laid out so that each file covers a narrow range of the filter column, those statistics become selective: file 3 is the only one whose date range contains 14 March.</p>
      <p class="lead" data-step="3" style="font-size:14.5px">The scan reads file 3 and skips the rest. Without a layout, every file holds a bit of every date, every file's range matches, and the query reads the whole table. Clustering is what makes the ranges narrow.</p>
    </div>` },

  /* 2 — what it is and why it replaced the old ways */
  { html: `
    <div class="eyebrow reveal">What it is</div>
    <h2 class="reveal">The recommended layout, and the contrast case</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>Liquid Clustering</b>A data layout technique that clusters rows by up to four key columns, incrementally, and that lets you change the keys later without rewriting existing data. Databricks recommends it for all new tables, streaming tables and materialized views included.</p></div>
      <div class="pill"><p><b>Partitioning, the contrast</b>Directories per value of a column. It cannot be changed without rewriting the table, and the wrong column produces thousands of tiny partitions or a few huge ones. Chosen once, lived with forever.</p></div>
      <div class="pill"><p><b>Z-Order, the contrast</b>A sort applied at OPTIMIZE time over chosen columns. It has to redo the whole table each run and cannot coexist with clustering; liquid clustering supersedes it.</p></div>
      <div class="pill"><p><b>The rule</b>A table uses CLUSTER BY, or PARTITIONED BY and ZORDER, never both.</p></div>
    </div>` },

  /* 3 — the SQL, step build */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">The SQL</div>
    <h2 class="reveal" style="font-size:24px">Create, change, maintain</h2>
    <div class="art reveal">${A.keys}</div>
    <div class="stepcaps">
      <p class="lead" data-step="0" style="font-size:14.5px">Three statements cover the lifecycle. Tap through them.</p>
      <p class="lead" data-step="1" style="font-size:14.5px"><strong>CLUSTER BY</strong> on CREATE TABLE names the keys: the columns your queries filter on most. Up to four; dates, timestamps, strings, numbers and struct fields all qualify, arrays and maps do not.</p>
      <p class="lead" data-step="2" style="font-size:14.5px"><strong>ALTER TABLE ... CLUSTER BY</strong> changes the keys with no rewrite; the new layout applies to data written from then on.</p>
      <p class="lead" data-step="3" style="font-size:14.5px"><strong>OPTIMIZE</strong> clusters the data that arrived since the last run (it is incremental, rewriting only what it must); OPTIMIZE ... FULL reclusters everything after a key change. <strong>CLUSTER BY AUTO</strong> hands both the choice of keys and the maintenance to predictive optimization, based on the actual query workload.</p>
    </div>` },

  /* 4 — choosing keys */
  { html: `
    <div class="eyebrow reveal">Choosing keys</div>
    <h2 class="reveal">Which columns, and how many</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>The filter columns</b>Pick the columns that appear in WHERE clauses most often: the date range every report starts with, the customer or region most queries narrow to. A COVERAGE_FILTER_KEYS_CLUSTERING insight (Chapter 23) means a common filter is not on a key.</p></div>
      <div class="pill"><p><b>High cardinality is fine</b>Unlike partitioning, a customer_id with millions of values is a good clustering key; there are no directories to explode.</p></div>
      <div class="pill"><p><b>Fewer is better</b>Every extra key dilutes how tightly the others cluster; below about 10 TB, more than one or two keys can hurt single-column filters. Four is the ceiling, not a target.</p></div>
      <div class="pill"><p><b>Unsure?</b>CLUSTER BY AUTO on a managed table, and let the workload decide.</p></div>
    </div>` },

  /* 5 — quiz: apply */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">A 5 TB Delta table of events has no clustering or partitioning. Nearly every query filters on event_date, and the query profile shows almost no files pruned. What is the recommended fix?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Rebuild the table PARTITIONED BY (event_date) and run OPTIMIZE ZORDER BY (event_date)</button>
      <button class="choice" data-correct="true"><span class="key">B</span>ALTER TABLE events CLUSTER BY (event_date), then OPTIMIZE (FULL for the existing data)</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Increase the warehouse size so the full scan finishes sooner</button>
    </div>
    <div class="feedback"><b>Correct.</b> Liquid clustering on the filter column narrows each file's date range so the scan skips the rest, and it is applied to an existing table with ALTER and an OPTIMIZE, no rebuild. Partition plus Z-Order is the tempting legacy answer, but Databricks recommends liquid clustering instead, and the two cannot be combined anyway. A bigger warehouse still reads all 5 TB.</div>` },

  /* 6 — quiz: changing keys */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">A table was clustered on region when it was created. Query patterns have shifted and most filters are now on customer_id. What does changing the layout involve?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span>ALTER TABLE ... CLUSTER BY (customer_id); new writes use the new key and an OPTIMIZE FULL reclusters existing data, with no table rebuild</button>
      <button class="choice" data-correct="false"><span class="key">B</span>Recreate the table with CREATE TABLE AS SELECT, since clustering keys are fixed at creation</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Add customer_id as a fifth clustering key alongside the existing four</button>
    </div>
    <div class="feedback"><b>Correct.</b> Redefining clustering keys without rewriting existing data is the headline difference between liquid clustering and partitioning; ALTER changes the keys and OPTIMIZE FULL applies them to old data when you want. Recreating the table is what partitioning would require, not clustering. Four keys is the maximum, and adding keys dilutes clustering anyway.</div>` },

  /* 7 — done */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Chapter 26 complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">You can now apply liquid clustering to a filtered table and explain why the scan gets smaller.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Why</b>File statistics plus a narrow layout equals data skipping.</p></div>
      <div class="pill"><p><b>How</b>CLUSTER BY on create or alter, up to four filter columns, OPTIMIZE to cluster, CLUSTER BY AUTO to delegate.</p></div>
      <div class="pill"><p><b>Contrast</b>Partitioning and Z-Order are the old way; never combined with clustering.</p></div>
    </div>
    <div class="spacer"></div>` }

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ----------
   v2 adds opt-in, per-card step builds on top of the v1 card engine. A card
   with no `steps` field takes exactly the v1 paths below and renders and
   behaves identically; every v2 branch is guarded by `steps` being present. */
const ENGINE_VERSION = 'v2';
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};
const stepState = {};   // v2: current revealed step per card index (mirrors `answered`)

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

/* v2: apply step visibility for one card WITHOUT touching its .in class, so a
   step reveal never replays the card-entrance .reveal stagger. Cumulative for
   normal elements (data-step <= current). Captions append by default: inside
   .stepcaps they accumulate too (data-step="0" is the pre-first-tap caption),
   and captions behind the current step get .step-past (dimmed) while the
   current one stays at full strength. A .stepcap-swap container (or legacy
   .stepcap) opts into swap: only the caption whose data-step equals the
   current step is shown. */
function applySteps(idx) {
  const cur = stepState[idx] || 0;
  els[idx].querySelectorAll('[data-step]').forEach(function(nd) {
    const s = parseInt(nd.getAttribute('data-step'), 10);
    const swapCap = nd.closest && nd.closest('.stepcap-swap, .stepcap');
    const appendCap = !swapCap && nd.closest && nd.closest('.stepcaps');
    const on = swapCap ? (s === cur) : appendCap ? (s <= cur) : (s >= 1 && s <= cur);
    nd.classList.toggle('step-on', on);
    nd.classList.toggle('step-past', !!appendCap && on && s < cur);
  });
}

/* Card layout: the only place that adds/removes .in (and thus replays reveal).
   Called on card change, never on a step advance. */
function layout() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
    applySteps(idx);   // persists built state on revisit
  });
  glow.style.background = cards[i].glow || 'transparent';
}

/* Footer/button state only. Safe to call after a step advance (no reveal). */
function updateFooter() {
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  const total = c.steps || 0;
  const stepsLeft = total > 0 && (stepState[i] || 0) < total;
  if (stepsLeft) { nextBtn.disabled = false; nextBtn.textContent = (i === 0) ? 'Begin lesson' : 'Continue'; }
  else if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
}

function render() {
  layout();
  updateFooter();
  if (cards[i].quiz) wireQuiz(els[i], i);
}

/* v2: reveal the next step of the current card. Returns true if a step was
   consumed (so the caller does not also advance the card). */
function advanceStep(idx) {
  const total = cards[idx].steps || 0;
  if (!total) return false;
  const cur = stepState[idx] || 0;
  if (cur >= total) return false;
  stepState[idx] = cur + 1;
  applySteps(idx);
  updateFooter();
  return true;
}

/* v2: reveal every remaining step at once (swipe-left escape hatch). */
function skipSteps(idx) {
  const total = cards[idx].steps || 0;
  if (!total || (stepState[idx] || 0) >= total) return false;
  stepState[idx] = total;
  applySteps(idx);
  updateFooter();
  return true;
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

/* Primary action. On a step card mid-build this reveals the next step; once
   the steps are done (or on a card with none) it advances, honoring the quiz
   gate exactly as v1 did. Shared by the Continue button and ArrowRight. */
function handleNext() {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  if (advanceStep(i)) return;
  go(i + 1);
}
nextBtn.onclick = handleNext;
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* v2: tapping anywhere on a step card advances one step; once built, a tap
   advances the card (gate permitting). Cards with no steps ignore taps, so
   this listener is inert on v1-style cards. Elements with their own behavior
   (quiz choices, links) are skipped so a tap never double-fires. */
vp.addEventListener('click', e => {
  const c = cards[i];
  if (!c.steps) return;
  if (e.target.closest('.choice, a')) return;
  if ((stepState[i] || 0) < c.steps) { advanceStep(i); return; }
  if (!nextBtn.disabled && !c.last) go(i + 1);
});

/* Keys and swipes only move between cards (or, for a step card, between
   steps). Leaving the lesson always takes a deliberate tap, so a stray swipe
   on the final card cannot navigate away. ArrowRight mirrors the Continue
   button step-wise; ArrowLeft mirrors Back. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) handleNext();
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  // Swipe left: skip any remaining steps and advance in one gesture, honoring
  // the quiz gate (updateFooter re-derives nextBtn.disabled after the skip).
  if (dx < -50 && !cards[i].last) { skipSteps(i); if (!nextBtn.disabled) go(i + 1); }
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
