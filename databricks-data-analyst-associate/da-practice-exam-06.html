<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 6",
  badge: "Databricks Data Analyst Associate",
  blurb: "Full-length mock. Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer. Databricks publishes no official passing score; 70% is our practice target.",
  coverage: "Full-length mock exam: 45 questions in 90 minutes, one per chapter across all nine sections plus extra weight on Section 4 (Databricks SQL), mirroring the real exam's shape.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

  /* Q1 · Ch 01 - platform components */
  {
    q:`A CFO asks why the analytics team no longer copies data into a separate warehouse product before building dashboards. Which explanation reflects the Data Intelligence Platform's design?`,
    opts:[
      "Databricks SQL warehouses query Delta tables governed by Unity Catalog directly, so the same data serves engineering pipelines, dashboards and Genie without a copy",
      "Dashboards read directly from the raw cloud storage files, bypassing tables entirely",
      "The platform automatically exports every table to a third-party warehouse each night",
      "Analysts query the pipelines' notebooks, which cache the latest results"
    ],
    correct:0,
    explain:`The lakehouse premise is one governed copy in open Delta format that every workload, including SQL warehouses and AI/BI, reads in place. The raw-files option is tempting because the data does live in object storage, but consumption goes through Unity Catalog tables and the warehouse engine, not file paths. There is no nightly export, and notebooks are not a serving layer.`
  },

  /* Q2 · Ch 02 - Catalog Explorer objects */
  {
    q:`An analyst is asked to "find the table" behind a metric but discovers the name refers to a view that itself reads two tables in another schema. What does the three-level namespace tell her about referring to those tables from her own schema?`,
    opts:[
      "Objects in other schemas cannot be referenced; the tables must be copied into her schema first",
      "She references them with their full catalog.schema.table names, provided she has USE CATALOG, USE SCHEMA and SELECT on them",
      "Views hide their source tables, so the names cannot be discovered",
      "Only the view's owner may read the underlying tables"
    ],
    correct:1,
    explain:`Any object is addressable by its three-part name from anywhere on the metastore, subject to the traversal and data privileges. The copy-first option is a common beginner belief but contradicts the whole point of a shared namespace. A view's definition is visible in Catalog Explorer to those permitted, and reading the sources needs privileges, not ownership.`
  },

  /* Q3 · Ch 03 - managed vs external */
  {
    q:`A compliance team requires that when a customer dataset is deleted from the catalog its files are removed too, and the platform team wants automatic optimization. Which table type meets both, and what should the analyst avoid?`,
    opts:[
      "An external table, avoiding VACUUM",
      "A managed table, avoiding Liquid Clustering, which pins files",
      "An external table in a volume, avoiding shallow clones",
      "A managed table, avoiding registering the data as an external table at a fixed path elsewhere"
    ],
    correct:3,
    explain:`Managed tables let Unity Catalog control the file lifecycle, so DROP deletes the data and automatic optimizations apply; that is why Databricks recommends them. External tables are the tempting "we control the path" choice, but dropping one leaves the files behind, failing the compliance requirement. Clustering does not pin files, and volumes are not tables.`
  },

  /* Q4 · Ch 04 - certified tables, lineage, access */
  {
    q:`Before using a table for a board report, an analyst wants to confirm it is the owner-endorsed source, see which job writes it and when, and check that she can read every column. Which sequence in Catalog Explorer does that?`,
    opts:[
      "Check the Certified badge, open the Lineage tab for the upstream job and History for the last write, and review her grants on the Permissions tab",
      "Check the row count on Overview, open Sample Data, and run SHOW TABLES",
      "Check the Insights tab for popular queries, and open the table's comment",
      "Check the table's tags, open Query History, and ask the owner for a screenshot"
    ],
    correct:0,
    explain:`Certification is the endorsement signal, lineage names the writing job, the History tab timestamps the last write, and Permissions shows what she may read. The row-count and sample-data option is the tempting "look at the data" route, but it verifies nothing about provenance or trust. Insights and tags are helpful context, not confirmation.`
  },

  /* Q5 · Ch 05 - Databricks Marketplace */
  {
    q:`A provider wants to offer a dataset to a specific set of partner companies rather than to every Databricks customer. Which Marketplace capability fits?`,
    opts:[
      "Publishing the listing publicly and asking non-partners not to install it",
      "A private exchange, where the provider controls which consumers can see and access the listing",
      "Emailing partners a Delta Sharing token, since Marketplace only supports public listings",
      "Publishing the listing as a notebook so it cannot be queried"
    ],
    correct:1,
    explain:`Marketplace supports private exchanges alongside public listings, so a provider can restrict a data product to chosen consumers while still using the Marketplace install experience. The public-plus-honor-system option is tempting for its simplicity but offers no control. Direct Delta Sharing outside Marketplace is possible, but the question asks for the Marketplace feature, and notebooks are not the mechanism.`
  },

  /* Q6 · Ch 06 - certified datasets */
  {
    q:`A steward wants analysts to stop querying a legacy sales table without deleting it, because two old reports still depend on it. Which Catalog Explorer action communicates that in the UI and in search?`,
    opts:[
      "Revoke SELECT from everyone, which breaks the two reports until they migrate",
      "Rename the table with a legacy_ prefix",
      "Set the table's asset status to Deprecated (and certify the replacement), so the warning shows wherever the table appears",
      "Delete the table's comment so it looks unmaintained"
    ],
    correct:2,
    explain:`Asset status has both Certified and Deprecated values, and a deprecated table shows a warning in Catalog Explorer and search while remaining queryable for the dependents. Revoking access is the tempting hard stop, but the question preserves the two reports. Renaming breaks references, and removing a comment communicates nothing reliable.`
  },

  /* Q7 · Ch 07 - tags and lineage */
  {
    q:`A governance team wants to report every table tagged cost_center = finance without opening each one in the UI. Where can that list be produced with SQL?`,
    opts:[
      "From DESCRIBE HISTORY on each table, filtered by tag",
      "Tags are UI-only metadata and cannot be queried",
      "From system.query.history, which records tags per statement",
      "From the information_schema.table_tags view, filtered on tag_name and tag_value"
    ],
    correct:3,
    explain:`Unity Catalog exposes tags through information_schema views (table_tags, column_tags, schema_tags and so on), so a SQL filter on name and value produces the list. The UI-only option is a common assumption but wrong. History records table versions and query history records statements, neither of which carries tags.`
  },

  /* Q8 · Ch 08 - cleaning data in SQL */
  {
    q:`A phone column mixes formats such as "(555) 010-2233", "555.010.2233" and "5550102233". The analyst needs a single digits-only STRING column for matching. Which expression is correct?`,
    opts:[
      "cast(phone AS BIGINT)",
      "replace(phone, '-', '')",
      "regexp_replace(phone, '[^0-9]', '')",
      "trim(phone)"
    ],
    correct:2,
    explain:`regexp_replace with a class that matches every non-digit strips parentheses, spaces, dots and dashes in one pass and keeps the result a string. Casting to BIGINT is tempting for "digits only", but it fails on the punctuated values and would drop leading zeros. replace handles one character, and trim only touches the ends.`
  },

  /* Q9 · Ch 09 - five ways in */
  {
    q:`A vendor drops 40 fixed CSV files into cloud storage once a quarter, and the team wants them loaded into a Delta table idempotently, re-running safely if the job restarts. Which ingestion method fits the bounded, repeatable load?`,
    opts:[
      "COPY INTO, which loads only files it has not already loaded",
      "The UI file upload, repeated 40 times",
      "A Lakehouse Federation connection to the storage bucket",
      "A Marketplace listing pointing at the folder"
    ],
    correct:0,
    explain:`COPY INTO is the retriable, idempotent load for a bounded set of files: re-running it skips files already ingested. The UI upload is tempting for CSVs but is a one-off, manual path. Federation queries external databases, not files in a bucket, and Marketplace distributes another organization's data products.`
  },

  /* Q10 · Ch 10 - upload a file */
  {
    q:`After uploading a spreadsheet through the UI, an analyst finds the table was created in a catalog she did not intend and wants the data in her team's schema. What is the cleanest correction?`,
    opts:[
      "Edit the table's location property to point at the other schema",
      "Ask a workspace admin to move the catalog",
      "Re-run the upload choosing the intended catalog and schema in the dialog (or CTAS the data into the target and drop the first table)",
      "Grant the team SELECT on the accidental table, since tables cannot move"
    ],
    correct:2,
    explain:`The upload dialog lets the user pick the target catalog and schema, so repeating it with the right target (or copying with CREATE TABLE AS SELECT and dropping the stray table) fixes the placement. Editing a location is the tempting "just point it elsewhere" move, but managed tables have no user-editable path. Catalogs are not moved to fix one table, and a grant leaves the data in the wrong place.`
  },

  /* Q11 · Ch 11 - Databricks Assistant */
  {
    q:`A query fails with a column-not-found error deep in a 60-line statement. Which Databricks Assistant (Genie Code) capability shortens the fix, and what does it rely on?`,
    opts:[
      "The Diagnose error action, which explains the failure and proposes a corrected query using the tables' Unity Catalog metadata",
      "Automatic execution of every suggestion until one succeeds",
      "Rewriting the table's schema to add the missing column",
      "Looking up the column in the workspace's audit logs"
    ],
    correct:0,
    explain:`The Assistant reads the error and the statement, uses catalog metadata to spot the misnamed column, and offers a fix the analyst reviews and applies. Running suggestions until one works is the tempting fantasy but not how it operates; it drafts, the user runs. It never alters schemas, and audit logs have nothing to do with column names.`
  },

  /* Q12 · Ch 12 - SQL warehouses */
  {
    q:`A team runs a small dashboard for an hour each morning and nothing else. Their pro warehouse costs more than expected because it stays up all day. Which two settings should they revisit?`,
    opts:[
      "The cluster count and Photon toggle",
      "The maximum query duration and result cache size",
      "The warehouse name and its tags",
      "Auto-stop (shorter idle timeout) and the warehouse type (serverless starts in seconds, so a short auto-stop costs little in wait time)"
    ],
    correct:3,
    explain:`Auto-stop reclaims an idle warehouse, and serverless makes a short idle timeout painless because restarts are near-instant, which is why Databricks recommends it. Cluster count and Photon are the tempting knobs because they are prominent, but they affect concurrency and speed, not idle cost. Names, tags and cache settings do not change billing behavior.`
  },

  /* Q13 · Ch 13 - Lakehouse Federation */
  {
    q:`After an admin creates a connection and a foreign catalog for a Snowflake account, an analyst can see the foreign tables but a query fails with a permission error. What is the most likely reason?`,
    opts:[
      "The analyst has not been granted USE CATALOG, USE SCHEMA and SELECT on the foreign catalog objects, which are governed like any Unity Catalog securable",
      "Foreign tables can only be queried by the connection's creator",
      "Federated queries require a classic warehouse",
      "The foreign catalog must first be converted to managed tables"
    ],
    correct:0,
    explain:`Foreign catalogs sit in the three-level namespace and their objects require the usual Unity Catalog grants; seeing a table in the list (through BROWSE or catalog-level visibility) does not confer SELECT. The creator-only option is the tempting misreading of "connection credentials", which are used for the remote system, not to authorize Databricks users. Warehouse type and conversion are not prerequisites.`
  },

  /* Q14 · Ch 14 - streaming tables vs materialized views */
  {
    q:`A materialized view over a large fact table is refreshed nightly, and the team wants to know what happens to the underlying query each night. Which statement is accurate?`,
    opts:[
      "The view is recomputed from scratch on every read, so the refresh is a no-op",
      "Databricks refreshes the stored result, incrementally where the query allows it and by full recomputation otherwise, so readers get precomputed results between refreshes",
      "Only new rows are appended and old aggregates never change",
      "The refresh copies the fact table into the view's storage"
    ],
    correct:1,
    explain:`Materialized views persist their results and are refreshed, with incremental refresh when the query shape supports it and full recompute when it does not; reads between refreshes never rerun the query. Append-only behavior is the tempting confusion with streaming tables. The view stores the query's result, not a copy of the source.`
  },

  /* Q15 · Ch 15 - dynamic vs materialized views */
  {
    q:`A dynamic view uses is_member('sales_managers') to decide whether to show the margin column, and managers report seeing REDACTED. Their membership was created as an account-level group. What is wrong?`,
    opts:[
      "Dynamic views cannot reference groups; use current_user() with a hard-coded list",
      "Margin columns cannot be conditionally shown; use a row filter instead",
      "The view needs a materialized copy to evaluate group membership",
      "is_member() checks legacy workspace-local groups; the view should use is_account_group_member(), which evaluates account-level membership"
    ],
    correct:3,
    explain:`Databricks documents is_account_group_member() as the function for Unity Catalog dynamic views because is_member() exists for Hive-metastore compatibility and does not evaluate account-level groups. The hard-coded list is the tempting workaround but replaces a group with a maintenance burden. Column conditions in views are exactly how column-level dynamic views work, and materialization has no role.`
  },

  /* Q16 · Ch 16 - aggregates */
  {
    q:`A query groups orders by customer and reports avg(discount). Several customers show a lower average than expected because many of their orders have NULL discounts. What is happening?`,
    opts:[
      "avg() treats NULL as zero, which drags the average down",
      "avg() requires an ORDER BY to handle NULLs",
      "NULL discounts cause the group to be dropped entirely",
      "avg() ignores NULLs, so the average is over discounted orders only; if undiscounted orders should count as zero, use avg(coalesce(discount, 0))"
    ],
    correct:3,

/* =====================================================================

const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
