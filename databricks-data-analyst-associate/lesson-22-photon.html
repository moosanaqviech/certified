<script>
/* ============================================================
   ▼▼▼  LESSON PAYLOAD — BEGIN  ▼▼▼
   Unit 5 · Chapter 22 · Photon: Features, Benefits, and Supported Workloads
   Objective: understand the features, benefits, and supported workloads of
   Photon. Concept lesson: what Photon is (native C++ vectorized engine,
   Spark-API compatible), what it accelerates, what it does not (UDFs, RDD,
   stateful streaming, sub-two-second queries), transparent fallback,
   where it is on, and how to see it in a profile.
   Sources: docs.databricks.com/aws/en/compute/photon,
   /sql/user/queries/query-profile, /sql/user/queries/performance-insights.
   Cover animates (rows flow one at a time, then in batches); step build
   on card 1.
   ============================================================ */

/* ----------  NAV  ---------- */
const NAV = {
  catalog:   "index.html",
  next:      "lesson-23-finding-slow-queries.html",
  nextLabel: "Next chapter"
};

/* ----------  ART  (custom SVGs, referenced from cards as ${A.name})  ---------- */
const A = {
  cover: `<svg viewBox="0 0 320 200">
    <defs>
      <radialGradient id="c22r" cx="0.5" cy="0.5" r="0.6">
        <stop offset="0" style="stop-color:rgba(167,139,250,0.22)"/>
        <stop offset="1" style="stop-color:rgba(167,139,250,0)"/>
      </radialGradient>
    </defs>
    <style>
      .c22s { animation: c22slow 4s linear infinite; }
      .c22s.s2 { animation-delay: 1.3s; } .c22s.s3 { animation-delay: 2.6s; }
      @keyframes c22slow { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(200px); opacity: 0; } }
      .c22f { animation: c22fast 1.3s linear infinite; }
      .c22f.f2 { animation-delay: 0.43s; } .c22f.f3 { animation-delay: 0.86s; }
      @keyframes c22fast { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(200px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .c22s, .c22f { animation: none; opacity: 0.7; transform: translateX(100px); } }
    </style>
    <ellipse cx="160" cy="100" rx="150" ry="74" fill="url(#c22r)"/>
    <g>
      <text x="60" y="58" text-anchor="end" fill="var(--ink-soft)" font-family="Hanken Grotesk" font-size="8.5" font-weight="700">row at a time</text>
      <path d="M70 64 H 290" stroke="var(--line)" stroke-width="1.2"/>
      <circle class="c22s" cx="72" cy="64" r="3" fill="var(--ink-soft)"/><circle class="c22s s2" cx="72" cy="64" r="3" fill="var(--ink-soft)"/><circle class="c22s s3" cx="72" cy="64" r="3" fill="var(--ink-soft)"/>
    </g>
    <g>
      <text x="60" y="124" text-anchor="end" fill="var(--accent)" font-family="Hanken Grotesk" font-size="8.5" font-weight="700">Photon: batches</text>
      <path d="M70 130 H 290" stroke="var(--accent)" stroke-width="1.2" opacity="0.6"/>
      <rect class="c22f" x="72" y="122" width="26" height="16" rx="3" fill="var(--accent)"/><rect class="c22f f2" x="72" y="122" width="26" height="16" rx="3" fill="var(--accent)"/><rect class="c22f f3" x="72" y="122" width="26" height="16" rx="3" fill="var(--accent)"/>
    </g>
    <text x="160" y="176" text-anchor="middle" fill="var(--ink-soft)" font-family="Hanken Grotesk" font-size="9.5">Thousands of rows per step, in native code, with no code changes.</text>
  </svg>`,

  ops: `<svg viewBox="0 0 320 150">
    <g font-family="Hanken Grotesk" font-size="8.5" font-weight="700">
      <g data-step="1">
        <rect x="14" y="14" width="140" height="56" rx="9" fill="rgba(167,139,250,0.12)" stroke="var(--accent)" stroke-width="1.2"/>
        <text x="84" y="32" text-anchor="middle" fill="var(--accent)">accelerated</text>
        <text x="84" y="47" text-anchor="middle" fill="var(--ink-soft)" font-weight="400">scan, filter, project, hash aggregate,</text>
        <text x="84" y="60" text-anchor="middle" fill="var(--ink-soft)" font-weight="400">hash join, shuffle, window, sort, writes</text>
      </g>
      <g data-step="2">
        <rect x="166" y="14" width="140" height="56" rx="9" fill="var(--surface-2)" stroke="var(--warm)" stroke-width="1.2"/>
        <text x="236" y="32" text-anchor="middle" fill="var(--warm)">not covered</text>
        <text x="236" y="47" text-anchor="middle" fill="var(--ink-soft)" font-weight="400">UDFs, RDD and Dataset APIs,</text>
        <text x="236" y="60" text-anchor="middle" fill="var(--ink-soft)" font-weight="400">stateful streaming</text>
      </g>
      <g data-step="3">
        <path d="M236 70 v14" stroke="var(--warm)" stroke-width="1.2"/>
        <rect x="60" y="86" width="200" height="50" rx="9" fill="var(--surface-2)" stroke="var(--line)"/>
        <text x="160" y="106" text-anchor="middle" fill="var(--ink)">transparent fallback</text>
        <text x="160" y="122" text-anchor="middle" fill="var(--ink-soft)" font-weight="400">that operation runs on the Spark runtime, the rest stays in Photon</text>
      </g>
    </g>
  </svg>`,

  done: `<svg viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="38" fill="none" stroke="var(--accent)" stroke-width="3"/>

/* ----------  CARDS  ---------- */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 5 · Chapter 22</div>
    <h1 class="reveal">Photon</h1>
    <p class="lead reveal">Every query on a SQL warehouse runs on <strong>Photon</strong>, and you never asked for it. The exam wants three things: what it is, what it speeds up, and the few workloads it leaves to plain Spark.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — what it is */
  { html: `
    <div class="eyebrow reveal">Features</div>
    <h2 class="reveal">A native, vectorized engine behind the Spark API</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>What it replaces</b>The JVM execution engine of Spark SQL, with a native C++ runtime. Your SQL and DataFrame code is unchanged; the Spark APIs stay the same.</p></div>
      <div class="pill"><p><b>Vectorized</b>Operators process columnar batches of thousands of rows at a time using SIMD instructions, instead of one row at a time.</p></div>
      <div class="pill"><p><b>Native</b>No garbage-collection pauses, no JIT warm-up, less memory overhead. That is where the speed comes from, not from a different query plan.</p></div>
      <div class="pill"><p><b>Where it is on</b>Serverless compute, every SQL warehouse (all three types), and serverless pipelines. On classic clusters it is a checkbox, "Use Photon Acceleration", on by default.</p></div>
    </div>` },

  /* 2 — what it accelerates, step build */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">Supported workloads</div>
    <h2 class="reveal" style="font-size:24px">Accelerated, not covered, fallback</h2>
    <div class="art reveal">${A.ops}</div>
    <div class="stepcaps">
      <p class="lead" data-step="0" style="font-size:14.5px">Photon covers most of what a SQL query is made of. Tap to see both sides.</p>
      <p class="lead" data-step="1" style="font-size:14.5px"><strong>Accelerated:</strong> scans of Delta and Parquet, filters, projections, hash aggregates, hash joins (replacing sort-merge joins), shuffles, window functions, sorts, and writes to Delta, Parquet and Iceberg. SQL, DataFrame and stateless streaming workloads all benefit.</p>
      <p class="lead" data-step="2" style="font-size:14.5px"><strong>Not covered:</strong> user-defined functions, the RDD and Dataset APIs, and stateful streaming. A query that runs in under two seconds also gains nothing worth measuring.</p>
      <p class="lead" data-step="3" style="font-size:14.5px"><strong>Fallback:</strong> when an operation is unsupported, the compute transparently switches to the Spark runtime for that operation and returns to Photon afterward. Nothing fails; it just runs slower for that step.</p>

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ----------
   v2 adds opt-in, per-card step builds on top of the v1 card engine. A card
   with no `steps` field takes exactly the v1 paths below and renders and
   behaves identically; every v2 branch is guarded by `steps` being present. */
const ENGINE_VERSION = 'v2';
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};
const stepState = {};   // v2: current revealed step per card index (mirrors `answered`)

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

/* v2: apply step visibility for one card WITHOUT touching its .in class, so a
   step reveal never replays the card-entrance .reveal stagger. Cumulative for
   normal elements (data-step <= current). Captions append by default: inside
   .stepcaps they accumulate too (data-step="0" is the pre-first-tap caption),
   and captions behind the current step get .step-past (dimmed) while the
   current one stays at full strength. A .stepcap-swap container (or legacy
   .stepcap) opts into swap: only the caption whose data-step equals the
   current step is shown. */
function applySteps(idx) {
  const cur = stepState[idx] || 0;
  els[idx].querySelectorAll('[data-step]').forEach(function(nd) {
    const s = parseInt(nd.getAttribute('data-step'), 10);
    const swapCap = nd.closest && nd.closest('.stepcap-swap, .stepcap');
    const appendCap = !swapCap && nd.closest && nd.closest('.stepcaps');
    const on = swapCap ? (s === cur) : appendCap ? (s <= cur) : (s >= 1 && s <= cur);
    nd.classList.toggle('step-on', on);
    nd.classList.toggle('step-past', !!appendCap && on && s < cur);
  });
}

/* Card layout: the only place that adds/removes .in (and thus replays reveal).
   Called on card change, never on a step advance. */
function layout() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
    applySteps(idx);   // persists built state on revisit
  });
  glow.style.background = cards[i].glow || 'transparent';
}

/* Footer/button state only. Safe to call after a step advance (no reveal). */
function updateFooter() {
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  const total = c.steps || 0;
  const stepsLeft = total > 0 && (stepState[i] || 0) < total;
  if (stepsLeft) { nextBtn.disabled = false; nextBtn.textContent = (i === 0) ? 'Begin lesson' : 'Continue'; }
  else if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
}

function render() {
  layout();
  updateFooter();
  if (cards[i].quiz) wireQuiz(els[i], i);
}

/* v2: reveal the next step of the current card. Returns true if a step was
   consumed (so the caller does not also advance the card). */
function advanceStep(idx) {
  const total = cards[idx].steps || 0;
  if (!total) return false;
  const cur = stepState[idx] || 0;
  if (cur >= total) return false;
  stepState[idx] = cur + 1;
  applySteps(idx);
  updateFooter();
  return true;
}

/* v2: reveal every remaining step at once (swipe-left escape hatch). */
function skipSteps(idx) {
  const total = cards[idx].steps || 0;
  if (!total || (stepState[idx] || 0) >= total) return false;
  stepState[idx] = total;
  applySteps(idx);
  updateFooter();
  return true;
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

/* Primary action. On a step card mid-build this reveals the next step; once
   the steps are done (or on a card with none) it advances, honoring the quiz
   gate exactly as v1 did. Shared by the Continue button and ArrowRight. */
function handleNext() {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  if (advanceStep(i)) return;
  go(i + 1);
}
nextBtn.onclick = handleNext;
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* v2: tapping anywhere on a step card advances one step; once built, a tap
   advances the card (gate permitting). Cards with no steps ignore taps, so
   this listener is inert on v1-style cards. Elements with their own behavior
   (quiz choices, links) are skipped so a tap never double-fires. */
vp.addEventListener('click', e => {
  const c = cards[i];
  if (!c.steps) return;
  if (e.target.closest('.choice, a')) return;
  if ((stepState[i] || 0) < c.steps) { advanceStep(i); return; }
  if (!nextBtn.disabled && !c.last) go(i + 1);
});

/* Keys and swipes only move between cards (or, for a step card, between
   steps). Leaving the lesson always takes a deliberate tap, so a stray swipe
   on the final card cannot navigate away. ArrowRight mirrors the Continue
   button step-wise; ArrowLeft mirrors Back. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) handleNext();
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  // Swipe left: skip any remaining steps and advance in one gesture, honoring
  // the quiz gate (updateFooter re-derives nextBtn.disabled after the skip).
  if (dx < -50 && !cards[i].last) { skipSteps(i); if (!nextBtn.disabled) go(i + 1); }
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
