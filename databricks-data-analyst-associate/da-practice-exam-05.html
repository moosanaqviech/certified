<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 5",
  badge: "Databricks Data Analyst Associate",
  blurb: "Full-length mock. Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Most questions have one best answer; a few ask you to select two. Databricks publishes no official passing score; 70% is our practice target.",
  coverage: "Full-length mock exam: 45 questions in 90 minutes, one per chapter across all nine sections plus extra weight on Section 4 (Databricks SQL), mirroring the real exam's shape.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

  /* Q1 · Ch 01 - platform components */
  {
    q:`A newly hired analyst is told: "Governance lives in one place, storage is open format, SQL runs on its own compute, and dashboards and Genie sit on top." Which mapping of Data Intelligence Platform components to those four roles is correct?`,
    opts:[
      "Delta Lake governs, Unity Catalog stores, Lakeflow runs SQL, Databricks SQL serves dashboards",
      "Unity Catalog governs, Photon stores, Lakeflow Jobs run SQL, Marketplace serves dashboards",
      "Unity Catalog governs, Delta Lake stores, Databricks SQL warehouses run SQL, AI/BI serves dashboards and Genie",
      "Catalog Explorer governs, Delta Sharing stores, notebooks run SQL, Lakeflow serves dashboards"
    ],
    correct:2,
    explain:`Unity Catalog is the governance layer, Delta Lake the open table format the data lives in, Databricks SQL warehouses the compute analysts query on, and AI/BI (dashboards and Genie) the consumption layer. The first option swaps governance and storage, a common mix-up because Delta Lake enforces constraints of its own; it does not hold permissions or lineage. Photon is an engine, not storage, and Catalog Explorer is a UI over Unity Catalog, not the governance system itself.`
  },

  /* Q2 · Ch 02 - Catalog Explorer objects */
  {
    q:`In Catalog Explorer an analyst opens a schema and sees an object with a table icon, another marked as a view, and a third marked as a materialized view. Without running anything, what can she conclude about where each one's data comes from?`,
    opts:[
      "The table holds stored data, the view is a saved query recomputed when read, and the materialized view holds precomputed results refreshed on a schedule or on demand",
      "All three hold stored data; the labels only describe how they were created",
      "The view and materialized view are both recomputed on every read; only the table stores data",
      "The materialized view is a pointer to files in a volume, the others are Delta tables"
    ],
    correct:0,
    explain:`Tables store data, views are stored queries evaluated at read time, and materialized views persist their results and are refreshed rather than recomputed per read. The all-stored option is the tempting simplification because all three appear in the same list, but a view never holds rows. Materialized views are refreshed, not recomputed per read, and nothing here involves volumes.`
  },

  /* Q3 · Ch 03 - managed vs external */
  {
    q:`An analyst dropped a table she believed was a scratch copy, and a downstream job that read the same cloud path kept working afterwards. Which statement explains what happened and what kind of table it was?`,
    opts:[
      "It was a managed table; Unity Catalog keeps the files for seven days after a drop, which is why the job still ran",
      "It was a view over the job's table, so dropping it removed nothing",
      "It was a managed table restored automatically by the job's time-travel read",
      "It was an external table; DROP removed only the metadata and the files at the registered location stayed in place for the job"
    ],
    correct:3,
    explain:`Dropping an external table removes the Unity Catalog entry and leaves the data files where they were, so anything reading the path directly continues. The managed-table option is tempting because managed data is retained briefly after a drop, but that retention is for undrop, not for path-based readers, and a managed table's files are not addressable by other jobs in the first place. Jobs do not restore tables by reading them.`
  },

  /* Q4 · Ch 04 - certified tables, lineage, access */
  {
    q:`A finance lead wants analysts to prefer one revenue table over three similar copies and to be able to see, in the UI, which dashboards depend on it and who can read it. Which Catalog Explorer features cover the three needs?`,
    opts:[
      "A comment on the table, the Sample Data tab, and the History tab",
      "Certifying the table (asset status), the Lineage tab, and the Permissions tab",
      "Pinning the table, the Insights tab, and the Details tab",
      "A tag on the table, the Overview tab, and query history"
    ],
    correct:1,
    explain:`Marking the table Certified signals the trusted copy and surfaces in search, the Lineage tab shows upstream and downstream objects including dashboards, and the Permissions tab lists grants. Tags are the tempting substitute for certification, but a tag is free-form metadata rather than the status the UI and Genie recognize. Comments, sample data and history answer none of the three questions.`
  },

  /* Q5 · Ch 05 - Databricks Marketplace */
  {
    q:`A team needs third-party weather history joined to its sales data. A colleague suggests downloading CSVs from the vendor's website each month. What does Databricks Marketplace change about that plan?`,
    opts:[
      "Marketplace listings are delivered through Delta Sharing into a read-only shared catalog that the provider keeps current, so no download or reload is needed",
      "Marketplace copies the vendor's data into the team's own managed tables once, after which the team maintains it",
      "Marketplace only lists notebooks and models, so the CSV plan stands",
      "Marketplace requires the vendor to be on the same Databricks account as the consumer"
    ],
    correct:0,
    explain:`Marketplace data products arrive through Delta Sharing as a shared catalog the consumer queries in place, and the provider updates the share, which removes the monthly download entirely. The one-time-copy option is tempting because "installing" a listing sounds like a load, but the shared catalog stays linked to the provider. Marketplace lists datasets, notebooks and models, and providers and consumers are different organizations on different accounts.`
  },

  /* Q6 · Ch 06 - certified datasets */
  {
    q:`An analyst searching Catalog Explorer for "customer" gets forty results across bronze, silver and gold schemas. Which single action narrows the list to the assets data owners have vetted for analysis?`,
    opts:[
      "Sort the results by last modified time",
      "Filter to tables larger than one gigabyte",
      "Open only tables in the gold schema, since gold is always certified",
      "Filter the results to assets with the Certified status"
    ],
    correct:3,
    explain:`Certification is an explicit asset status owners set, and search can filter on it, which is exactly the trust signal the analyst needs. The gold-schema option is tempting because gold is the curated layer, but layering is a naming convention, not a status, and an uncertified gold table is common. Modification time and size say nothing about vetting.`
  },

  /* Q7 · Ch 07 - tags and lineage */
  {
    q:`A dashboard shows a wrong total and the analyst must find which upstream table introduced the change, then flag every column carrying customer email for a review. Which two Catalog Explorer capabilities does she use?`,
    opts:[
      "The lineage graph to trace upstream from the dashboard's table, and column tags to label the email columns",
      "The History tab to trace upstream, and comments to label the email columns",
      "Query history to trace upstream, and certification to label the email columns",
      "The Insights tab to trace upstream, and the Permissions tab to label the email columns"
    ],
    correct:0,
    explain:`Lineage is captured automatically and the graph walks from a table to its upstream sources across notebooks, jobs and queries, while tags are the key-value labels applied to columns and queryable later. The History tab is tempting for "what changed", but it shows one table's own versions, not the tables feeding it. Certification marks whole assets as trusted and cannot label a column.`
  },

  /* Q8 · Ch 08 - cleaning data in SQL */
  {
    q:`A raw customer table has duplicate rows per customer_id from repeated loads, with the newest load carrying the correct values, and the email column has trailing spaces and mixed case. Which query produces one clean row per customer?`,
    opts:[
      "SELECT DISTINCT customer_id, email FROM raw_customers",
      "SELECT customer_id, upper(email) FROM raw_customers GROUP BY customer_id",
      "SELECT customer_id, trim(lower(email)) AS email FROM raw_customers WHERE loaded_at = max(loaded_at)",
      "SELECT customer_id, trim(lower(email)) AS email FROM (SELECT *, row_number() OVER (PARTITION BY customer_id ORDER BY loaded_at DESC) AS rn FROM raw_customers) WHERE rn = 1"
    ],
    correct:3,
    explain:`A window row_number partitioned by the key and ordered newest-first, filtered to rn = 1, keeps exactly the latest row per customer, and trim plus lower normalizes the email. DISTINCT is the tempting shortcut, but rows that differ in their spacing or capitalization are not duplicates to DISTINCT, and it cannot prefer the newest load. The GROUP BY option selects a non-aggregated column and fails, and an aggregate cannot appear in WHERE.`
  },

  /* Q9 · Ch 09 - five ways in */
  {
    q:`Three sources must be landed: a SaaS CRM with a supported connector, a folder in cloud storage that receives new JSON files every few minutes, and a one-off spreadsheet from a manager. Which combination is the recommended fit?`,
    opts:[
      "COPY INTO for all three, since it handles any file type",
      "Lakeflow Connect for the CRM, a streaming table over Auto Loader for the JSON folder, and the UI file upload for the spreadsheet",
      "Delta Sharing for the CRM, the UI upload for the JSON folder, and Lakeflow Connect for the spreadsheet",
      "A streaming table for all three so everything stays incremental"
    ],
    correct:1,
    explain:`Managed connectors are for SaaS and databases, Auto Loader behind a streaming table is the continuous-file-arrival pattern, and a one-off file belongs in the UI upload. COPY INTO is the tempting universal answer, but it suits a bounded set of files, not a connector-backed SaaS source or a continuously growing folder. Delta Sharing is for another organization's data, and a spreadsheet does not need a pipeline.`
  },

  /* Q10 · Ch 10 - upload a file */
  {
    q:`A manager uploads a CSV through the Create or modify table UI. The zip_code column is inferred as an integer and leading zeros vanish. What should the analyst do before the table is created?`,
    opts:[
      "Change the column's type to STRING in the upload preview so the values are stored as typed",
      "Accept the integer type and restore the zeros later with a view",
      "Re-save the CSV with quotes around every value, which forces string inference",
      "Upload the file into a volume instead, because the UI cannot override inferred types"
    ],
    correct:0,
    explain:`The upload UI shows a preview with inferred types and lets the user override them before creating the managed Delta table, which is the moment to make zip codes strings. Restoring zeros in a view is the tempting patch, but once the leading zeros are gone as integers the original width is unknown. Quoting values does not change inference, and volumes are for files that stay files.`
  },

  /* Q11 · Ch 11 - Databricks Assistant */
  {
    q:`In the SQL editor an analyst types a natural-language request and Databricks Assistant (now Genie Code) drafts a query joining two tables. What must the analyst still do before trusting the result, and why?`,
    opts:[
      "Nothing; the Assistant executes and validates the query against Unity Catalog before showing it",
      "Copy the query into a Genie space, which is the only place generated SQL can run",
      "Ask the Assistant to certify the query, which marks it as trusted",
      "Read the generated SQL and run it herself, because the Assistant drafts from Unity Catalog metadata but does not guarantee the logic is correct"
    ],
    correct:3,
    explain:`The Assistant uses table and column metadata to draft SQL, explain errors and suggest fixes, and the analyst reviews and runs the result; it is an authoring aid, not an oracle. The auto-validate option is the tempting belief, but drafting is not execution and the Assistant cannot know the analyst's intent was captured. Certification applies to data assets, and generated SQL runs anywhere SQL runs.`
  },

  /* Q12 · Ch 12 - SQL warehouses */
  {
    q:`Sixty analysts share one warehouse and complain that queries queue at 9 a.m., while any single query finishes quickly once it starts. Which change addresses the symptom directly?`,
    opts:[
      "Increase the warehouse size so each query gets more resources",
      "Enable Photon on the warehouse",
      "Raise the warehouse's maximum cluster count so it scales out for concurrency",
      "Shorten the auto-stop interval so idle time is reclaimed"
    ],
    correct:2,
    explain:`Queuing under many concurrent users is solved by scaling out: more clusters (a higher max) handle more queries at once, whereas size makes an individual query faster. Increasing size is the tempting lever because it is the bigger number, but the scenario says individual queries are already fast. Photon is already on for warehouses, and auto-stop affects idle cost, not morning contention.`
  },

  /* Q13 · Ch 13 - Lakehouse Federation */
  {
    q:`A team must join a table in an external PostgreSQL database with lakehouse data for a weekly report and does not want to build a pipeline. What does Lakehouse Federation provide, and what is the caveat?`,
    opts:[
      "A connection plus a foreign catalog so the PostgreSQL tables are queried in place with the three-level namespace; the caveat is that heavy, repeated workloads are better served by ingesting the data",
      "A one-time copy of the PostgreSQL schema into managed tables; the caveat is that the copy must be refreshed by hand",
      "A streaming replica of the database; the caveat is that it requires a dedicated cluster",
      "A Marketplace listing of the database; the caveat is that the vendor must approve it"
    ],
    correct:0,
    explain:`Federation registers a connection and a foreign catalog, so external tables appear under catalog.schema.table and are queried live with pushdown, and Databricks positions it for exploration and light joins rather than heavy recurring loads. The copy option is tempting because it sounds durable, but that describes ingestion with Lakeflow Connect, not federation. Nothing about federation streams or involves Marketplace.`
  },

  /* Q14 · Ch 14 - streaming tables vs materialized views */
  {
    q:`An analyst needs two objects in Databricks SQL: one that keeps appending new event files from cloud storage as they land, and one that holds a daily summary of those events for a dashboard. Which pair is right?`,
    opts:[
      "A materialized view for the events and a streaming table for the summary",
      "A streaming table (CREATE STREAMING TABLE with Auto Loader) for the events and a materialized view (CREATE MATERIALIZED VIEW) for the summary",
      "Two materialized views, one per purpose",
      "Two regular views, refreshed by a scheduled query"
    ],
    correct:1,
    explain:`Streaming tables are the incremental ingestion object, appending new files without reprocessing old ones, and materialized views precompute a query's result for fast reads, refreshed on a schedule. The reversed pair is the tempting swap, but a materialized view cannot consume a file stream incrementally and a streaming table would not hold a summary. Regular views store nothing and would recompute the whole summary per read.`
  },

  /* Q15 · Ch 15 - dynamic vs materialized views */

    q:`Two requirements: regional managers must each see only their own region's rows of a sales table, and an executive dashboard needs a fast total by region that does not recompute on every open. Which objects satisfy each?`,

const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
