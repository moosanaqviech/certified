<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 1",
  badge: "Databricks Data Analyst Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Most questions have one best answer; a few ask you to select two.",
  coverage: "Covers chapters 1-10: Unit 1 (the platform), Unit 2 (managing data), and Unit 3 (importing data). One question per chapter.",
  minutes: 20,
  pass: 70
};

const QUESTIONS = [

  /* Ch 01 - The Data Intelligence Platform */
  {
    q:`A retailer wants one component to keep a sales table current from files that land every few minutes, and a different component to run a notebook each night only after that table has been refreshed. Which pairing matches the platform's components to those two jobs?`,
    opts:[
      "Delta Lake for the refresh, Unity Catalog for the nightly notebook",
      "Lakeflow Spark Declarative Pipelines (a streaming table) for the refresh, Lakeflow Jobs for the dependent nightly notebook",
      "Databricks SQL for the refresh, Photon for the nightly notebook",
      "Mosaic AI for the refresh, the Data Intelligence Engine for the nightly notebook"
    ],
    correct:1,
    explain:`Keeping a table current from arriving files is pipeline work, which is what Lakeflow Spark Declarative Pipelines (the guide's "Delta Live Tables") does through a streaming table, and running tasks in order on a schedule is Lakeflow Jobs. Databricks SQL and Photon are the tempting near-miss because a warehouse could run the refresh query, but neither orchestrates a dependency between two tasks. Delta Lake stores tables and Unity Catalog governs them; they do not run anything.`
  },

  /* Ch 02 - Catalog Explorer objects */
  {
    q:`A new analyst runs SELECT * FROM orders in the SQL editor and gets a "table or view not found" error, although they can open prod.sales.orders in Catalog Explorer and preview its sample data. What is the most likely cause?`,
    opts:[
      "The analyst has SELECT on the table but not on the catalog",
      "Sample Data uses cached rows, so the table may have been dropped",
      "The query resolved the bare name against a different default catalog and schema; the three-level name prod.sales.orders would work",
      "The SQL editor cannot read managed tables without a LOCATION clause"
    ],
    correct:2,
    explain:`A one-part name resolves against the session's current catalog and schema, and unless those are set to prod and sales the lookup fails; the three-level name is unambiguous everywhere. A permissions cause is tempting, but a missing grant produces a permission error, and a working Sample Data preview shows the analyst already has SELECT plus the parent USE grants. Sample Data reads live rows with running compute, and managed tables never need a LOCATION.`
  },

  /* Ch 03 - Managed vs external tables */
  {
    q:`A data platform team is registering a Parquet dataset that a separate operations system writes to an S3 prefix every hour and reads back. Analysts must query it through Unity Catalog, and dropping the Databricks table must never remove the files. Which table type should they create?`,
    opts:[
      "A managed table created with CREATE TABLE AS SELECT from the prefix, with the recovery window extended to 30 days",
      "A managed table, because Unity Catalog never deletes data files",
      "A temporary view over read_files, refreshed every hour",
      "An external table with a LOCATION on a registered external location covering that prefix"
    ],
    correct:3,
    explain:`Files another system owns and keeps writing are the external-table case: Unity Catalog governs the metadata and access while the files stay at the LOCATION, and DROP TABLE leaves them untouched. The managed table with a long recovery window is the tempting compromise, but it copies the data out of the prefix, so the operations system's hourly writes would never reach it, and after the window the copy is purged anyway. A temporary view is session-scoped and gives no governance.`
  },

  /* Ch 04 - Certified tables, lineage, access controls */
  {
    q:`A workspace admin grants SELECT on the catalog finance to the group analysts so they can query finance.ledger.journal. A week later a new schema finance.forecasts and its tables are created. What access do the analysts have to the new tables?`,
    opts:[
      "SELECT, because privileges granted on a catalog are inherited by every schema and table inside it, including ones created later",
      "None, because grants are recorded per table at the time they are made",
      "SELECT only after the owner of finance.forecasts re-runs the grant",
      "Read access to metadata only, until USE SCHEMA is granted on finance.forecasts"
    ],
    correct:0,
    explain:`Unity Catalog privileges inherit downward: a grant on a catalog applies to all current and future schemas and objects within it, which is exactly why granting high in the tree is both convenient and risky. The per-table answer is the tempting mental model from older systems, but it is not how the hierarchy works. USE SCHEMA is still needed to reach objects, but a grant on the catalog does not remove that; the question states the analysts already query journal, so the parent USE grants are in place.`
  },

  /* Ch 05 - Databricks Marketplace */
  {
    q:`An analyst finds a free demographic dataset on the Databricks Marketplace and clicks Get instant access. Which TWO statements describe what happens next?`,
    opts:[
      "The dataset is copied into the analyst's default catalog by a Lakeflow job",
      "A read-only catalog appears in Catalog Explorer, delivered through Delta Sharing with no copy of the data",
      "The analyst becomes the owner of that catalog and can grant colleagues read access with normal privileges",
      "The provider must approve the request before any data is visible",
      "The tables can be modified in place once the terms are accepted"
    ],
    correct:[1,2],
    explain:`A Marketplace listing is delivered over Delta Sharing as a read-only catalog in the consumer's metastore, and the consumer who accepted it owns that catalog, so onward access is granted with ordinary Unity Catalog privileges. No copy is made and no job runs. Provider approval applies to Request access listings, not instant-access ones, and shared tables are never writable.`
  },

  /* Ch 06 - Certified datasets */
  {
    q:`A data team has replaced prod.crm.customers_v1 with prod.crm.customers. Existing dashboards on the old table must keep working for a quarter, but they want every new query, and Genie, to be steered to the new table. Which combination achieves this with the least disruption?`,
    opts:[
      "Revoke SELECT on customers_v1 and grant it on customers",
      "Rename customers_v1 to customers_deprecated so its name warns people",
      "Assign the Certified status to customers and the Deprecated status to customers_v1",
      "Add the comment 'use customers instead' to customers_v1 and rely on analysts reading it"
    ],
    correct:2,
    explain:`Certified marks the endorsed asset and Deprecated warns against the old one in every surface (Catalog Explorer, search, the SQL editor), and certification helps Genie prioritize the endorsed table, all without breaking a single existing query. Revoking access is the tempting hard stop, but it breaks the dashboards the team wanted to keep for a quarter. Renaming breaks lineage and every existing reference, and a comment is not a status anything filters on.`
  },

  /* Ch 07 - Tags and lineage */
  {
    q:`An analyst must confirm which upstream column populates the revenue figure on a published dashboard, and which other dashboards would change if that upstream column were fixed. Where in Catalog Explorer is this answered?`,
    opts:[
      "The Insights tab of the dashboard's source table, which lists frequent queries",
      "The Lineage tab of the source table: column lineage for the revenue column, and downstream assets for the dependents",
      "The Permissions tab, which shows every principal that can read the column",
      "The History tab, which records every version of the column's values"
    ],
    correct:1,
    explain:`Column-level lineage traces a column back to the upstream column that fed it, and the downstream side of the lineage graph lists the dashboards, jobs and tables that depend on the source. Insights is the tempting near-miss: it shows who queries the table often, not which column feeds which dashboard. Permissions lists grants, and History lists Delta commits, neither of which is a dependency map.`
  },

  /* Ch 08 - Cleaning data in SQL */
  {
    q:`A raw orders table has an order_date STRING column in which about 1% of rows hold malformed values. A CREATE OR REPLACE TABLE AS SELECT that casts the column to DATE fails entirely on the first bad value. The team wants the clean rows loaded and the bad ones identifiable. What should they change?`,
    opts:[
      "Use try_cast(order_date AS DATE), which yields NULL for malformed values instead of failing, then filter or flag the NULLs",
      "Wrap the cast in coalesce(cast(order_date AS DATE), current_date()) so bad values default to today",
      "Add a CHECK constraint on order_date so the malformed rows are dropped during the load",
      "Cast the column to STRING first, then to DATE, so the parser is more lenient"
    ],
    correct:0,
    explain:`Under ANSI SQL a plain CAST raises an error on invalid input and aborts the statement, while try_cast returns NULL for that value and lets the rest load, so the bad rows can be filtered or inspected. The coalesce answer is tempting, but the inner cast still fails before coalesce ever sees a NULL, and silently substituting today's date would corrupt the data anyway. A CHECK constraint never drops rows; a violating write fails the transaction. Casting through STRING changes nothing.`
  },

  /* Ch 09 - Five ways in */
  {
    q:`A company receives three kinds of data: a SaaS CRM reachable only through its API, a partner's live shipment table on the partner's own Databricks account, and its own clickstream files that land in cloud storage continuously. Which set of ingestion approaches matches them, in that order?`,
    opts:[
      "COPY INTO, Marketplace, Delta Sharing",
      "Delta Sharing, Auto Loader, the file upload dialog",
      "Auto Loader, Lakeflow Connect, COPY INTO",
      "Lakeflow Connect managed connector, Delta Sharing, Auto Loader as a streaming table"
    ],
    correct:3,
    explain:`An application behind an API is the managed connector case (API-driven intake), a partner's live governed table is Delta Sharing (shared, never copied), and continuously arriving files at scale are Auto Loader, which SQL users run as a streaming table. The Auto Loader, Lakeflow Connect, COPY INTO option is the tempting scramble because each tool is real, but Auto Loader cannot call a CRM's API, Lakeflow Connect does not mount a partner's table, and COPY INTO is for a bounded set of files, not an endless stream.`
  },

  /* Ch 10 - Uploading a file */
  {
    q:`A finance analyst has a 40 MB CSV of budget targets on their laptop and needs it as a queryable table in prod.finance today; it will be replaced by a new file next quarter. Which action fits?`,
    opts:[
      "Email the file to the platform team to place it in S3 and register an external table",
      "Configure Auto Loader over the laptop's folder so future files are picked up automatically",
      "Use New, Add or upload data, Create or modify a table to upload it as a managed Delta table, choosing Overwrite existing table next quarter",
      "Paste the rows into a notebook cell and create the table with INSERT statements"
    ],
    correct:2,
    explain:`A small, one-off file the analyst owns is exactly what the upload dialog is for: it creates a managed Delta table in Unity Catalog, and the same dialog's Overwrite existing table option handles next quarter's replacement. Auto Loader is the tempting "automate it" answer, but it reads cloud storage and volumes, not a laptop, and a quarterly file is not a stream. Routing through the platform team or hand-typing INSERT statements adds work for no governance benefit.`
  }

];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
