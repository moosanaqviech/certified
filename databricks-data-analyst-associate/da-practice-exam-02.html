<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 2",
  badge: "Databricks Data Analyst Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Most questions have one best answer; a few ask you to select two.",
  coverage: "Covers chapters 11-21: Unit 4, Executing Queries with Databricks SQL and SQL Warehouses. One question per chapter.",
  minutes: 22,
  pass: 70
};

const QUESTIONS = [

  /* Ch 11 - Databricks Assistant */
  {
    q:`A notebook cell fails with a one-character typo in a column name. The analyst wants the quickest path to a corrected, re-run cell without retyping it. Which Assistant feature fits, and what does it do?`,
    opts:[
      "/optimize, which rewrites the query for the correct column and improves its plan",
      "Quick Fix, which proposes the single-line correction as a diff with an Accept and run button",
      "/findTables, which locates the table whose column was misspelled",
      "/prettify, which reformats the cell so the typo becomes visible"
    ],
    correct:1,
    explain:`Quick Fix targets exactly this: basic errors fixable in a single-line change, offered as a diff you accept and run. Diagnose Error is the broader sibling that triggers /fix for complex errors. /optimize is about performance, not correctness; /findTables searches Unity Catalog metadata for relevant tables; /prettify only formats.`
  },

  /* Ch 12 - SQL warehouses */
  {
    q:`At 9 a.m. sixty analysts open dashboards backed by one Small pro warehouse with min and max clusters both set to 1. Individual queries are fast when run alone, but at peak everyone waits. Which change addresses the symptom?`,
    opts:[
      "Increase the cluster size to X-Large so each query gets more workers",
      "Switch the channel from Current to Preview for the newer scheduler",
      "Lower auto stop to 5 minutes so the warehouse recycles more often",
      "Raise max clusters so the warehouse adds clusters when queries queue, since one cluster handles about ten concurrent queries"
    ],
    correct:3,
    explain:`Queries that are fast alone but queue under load are a concurrency problem, and scaling (more clusters, roughly one per ten concurrent queries) is the lever for it; the warehouse adds clusters as the queue grows and removes them afterward. A bigger size is the tempting fix, but it speeds up a single query and does not raise the concurrency limit per cluster. The channel and auto stop settings do not affect queuing.`
  },

  /* Ch 13 - Lakehouse Federation */
  {
    q:`A foreign catalog over a PostgreSQL CRM was created last quarter. An analyst's query filters the foreign accounts table on region and joins it to Delta orders. Which TWO statements about how this runs are correct?`,
    opts:[
      "The region filter is pushed down to PostgreSQL so only matching rows travel to Databricks",
      "The join between the foreign rows and the Delta table runs on the Databricks warehouse",
      "Databricks caches the federated result so the next identical query reads nothing from PostgreSQL",
      "The analyst can UPDATE the foreign accounts table through the foreign catalog",
      "The query requires a classic SQL warehouse"
    ],
    correct:[0,1],
    explain:`Federation pushes filters and projections down to the remote database over JDBC, and the remaining work, including the join with Delta data, executes on Databricks compute. Result and disk caching are not supported for federated queries, foreign catalogs are read-only, and federation needs a pro or serverless warehouse, not classic.`
  },

  /* Ch 14 - Streaming tables vs materialized views */
  {
    q:`A team needs two objects: one that appends web clickstream files as they land, processing each file exactly once, and one that serves a dashboard a daily join of that clickstream with a customer table that receives corrections. Which pairing is right?`,
    opts:[
      "A streaming table for the clickstream and a materialized view for the dashboard join",
      "A materialized view for the clickstream and a streaming table for the dashboard join",
      "Streaming tables for both, since they refresh incrementally",
      "Materialized views for both, since they handle any source"
    ],
    correct:0,
    explain:`An append-only file source processed once is the streaming table's job, and a join over a table that is updated and deleted, precomputed for many dashboard readers, is the materialized view's. Two streaming tables is the tempting efficiency answer, but a streaming table cannot reflect corrections in its sources. Two materialized views would recompute the clickstream ingest instead of appending it.`
  },

  /* Ch 15 - Dynamic vs materialized views */
  {
    q:`Regional directors must query one revenue object and each see only their own region's rows, while never being granted access to the underlying table. Which object delivers this?`,
    opts:[
      "A materialized view whose SELECT filters rows with is_account_group_member(), refreshed hourly",
      "A standard view with SELECT * and a grant on the base table to each director",
      "A dynamic view whose WHERE clause uses is_account_group_member() to filter rows per reader, with SELECT granted on the view only",
      "A CREATE TABLE AS SELECT per director, scheduled nightly"
    ],
    correct:2,
    explain:`Per-reader row filtering evaluated at query time is what a dynamic view does, and granting the view instead of the table is the documented pattern. The materialized view is the tempting distractor, but its result is computed once at refresh for everyone, so a per-reader condition cannot vary by who is asking. A standard view with base-table grants exposes the table, and per-director tables multiply copies to govern.`
  },

  /* Ch 16 - Aggregates */
  {
    q:`A product table has 10,000 rows; 1,500 have a NULL weight. Which set of results does SELECT count(*), count(weight), count(DISTINCT weight), avg(weight) FROM products describe correctly?`,
    opts:[
      "10,000; 10,000; the number of unique weights including NULL; the mean with NULL counted as zero",
      "8,500; 8,500; the number of unique weights; the mean of all 10,000 rows",
      "10,000; 8,500; the number of unique non-NULL weights; the mean of the 8,500 known weights",
      "10,000; 8,500; the number of unique non-NULL weights; NULL, because NULLs are present"
    ],
    correct:2,
    explain:`count(*) counts every row, count(weight) and count(DISTINCT weight) skip NULLs, and avg ignores NULLs and divides by the 8,500 known values. The option treating NULL as zero is the common misconception; SQL never substitutes zero. An aggregate returns NULL only when its group has no non-NULL values at all, not when some are NULL.`
  },

  /* Ch 17 - Joins */
  {
    q:`An analyst joins a 1 million row orders table to a 50,000 row customers table on customer_id and the result has 1.4 million rows. No filter was applied and every order has exactly one customer_id. What explains the extra rows, and how is it fixed?`,
    opts:[
      "customers has duplicate customer_id values, multiplying matching orders; deduplicate customers to one row per key before joining",
      "A LEFT JOIN added a NULL row for each order without a customer; switch to INNER JOIN",
      "The join key types differ, so Spark fell back to a cross join; cast both keys",
      "orders contains NULL customer_ids that matched every customer; add WHERE customer_id IS NOT NULL"
    ],
    correct:0,
    explain:`A row count above the left table's count with no unmatched-side padding means the right side has more than one row per key, and every order with such a key was duplicated; reducing customers to one row per customer_id fixes it. A LEFT JOIN cannot produce more than one row per unmatched order, and NULL keys never match anything, so the NULL option has the mechanism backwards. Type mismatches produce errors or empty matches, not a cross join.`
  },

  /* Ch 18 - Set operations */
  {
    q:`Two tables, refunds_2025 and refunds_2026, have identical schemas and refund ids that cannot overlap between years. A report stacks them with UNION and it is slow on a large warehouse. Which change is correct and why?`,
    opts:[
      "Use INTERSECT, which returns the stacked rows without duplicates faster",
      "Use a FULL OUTER JOIN on refund_id, which combines both tables in one pass",
      "Use EXCEPT, which is faster because it returns only distinct rows",
      "Use UNION ALL, which skips the deduplication shuffle that UNION performs and cannot lose rows here"
    ],
    correct:3,
    explain:`UNION deduplicates the combined result, a global distinct that is the expensive step; with ids that cannot overlap it removes nothing, so UNION ALL returns the same rows without the shuffle. INTERSECT returns only rows present in both tables (none here), EXCEPT subtracts one from the other, and a FULL OUTER JOIN on disjoint keys produces wide rows with half their columns NULL rather than a stacked list.`
  },

  /* Ch 19 - Sorting and filtering */
  {
    q:`A query must list customers whose September orders total more than 5,000, considering only shipped orders, sorted by total descending with any customers lacking a total shown last. Which clause placement is correct?`,
    opts:[
      "WHERE SUM(amount) > 5000 AND status = 'shipped' ... ORDER BY total DESC",
      "WHERE status = 'shipped' ... GROUP BY customer_id HAVING SUM(amount) > 5000 ORDER BY total DESC NULLS LAST",
      "HAVING status = 'shipped' AND SUM(amount) > 5000 ORDER BY total ASC",
      "WHERE status = 'shipped' ... GROUP BY customer_id QUALIFY SUM(amount) > 5000 ORDER BY total DESC"
    ],
    correct:1,
    explain:`Row conditions go in WHERE, which runs before grouping and cannot hold an aggregate; group conditions go in HAVING after GROUP BY; and DESC already puts NULLs last, with NULLS LAST making the intent explicit. Putting SUM in WHERE is an error, HAVING on a row column wastes the aggregation, and QUALIFY is for window functions, not aggregates.`
  },

  /* Ch 20 - Creating tables and unifying sources */
  {
    q:`A marketing team wants one governed table combining a CSV of campaigns uploaded to a volume, a Parquet folder of impressions in an external location, and the Delta orders table, refreshed by rerunning one statement. Which approach fits?`,
    opts:[
      "Three external tables, one per source, and a view that joins them at query time",
      "COPY INTO a new table from all three sources in one statement",
      "CREATE OR REPLACE TABLE ... AS SELECT joining read_files over the CSV and the Parquet folder with the Delta table by name",
      "Upload the Parquet and Delta data through the file upload dialog alongside the CSV"
    ],
    correct:2,
    explain:`read_files makes the CSV and the Parquet folder table-valued sources that join with a Delta table in a single CTAS, and CREATE OR REPLACE makes the refresh a rerun that keeps the table's grants and history. Three external tables plus a view is the tempting flexible design, but it recomputes the join per query and registers the Delta table a second time. COPY INTO loads files into one existing table from one location and does not join, and the upload dialog is for files on a laptop.`
  },

  /* Ch 21 - Delta time travel */
  {
    q:`A finance team must compare a Delta table's state at each month end for the past year. Their first attempt, TIMESTAMP AS OF a date eleven months ago, fails. The table has default retention settings. What is the durable solution?`,
    opts:[
      "Run VACUUM with RETAIN 0 HOURS so old versions are reindexed",
      "Restore the table to each month-end version in turn and export it",
      "Nothing is needed; time travel on managed tables is unlimited",
      "Raise delta.deletedFileRetentionDuration and delta.logRetentionDuration to a year on the table, accepting the storage cost, or snapshot each month end with DEEP CLONE or CTAS"
    ],
    correct:3,
    explain:`With defaults, old data files are removed after 7 days and log entries after 30, so a version eleven months back cannot be reconstructed; keeping versions that long means raising both retention settings on purpose or, better, saving each month end as its own table, since the docs warn that history is not an archival mechanism. VACUUM with zero retention destroys old files rather than restoring them, and RESTORE needs the version's files just as a query does.`
  }

];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
