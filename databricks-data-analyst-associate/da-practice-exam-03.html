<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 3",
  badge: "Databricks Data Analyst Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Most questions have one best answer; a few ask you to select two.",
  coverage: "Covers chapters 22-34: Unit 5 (analyzing queries) and Unit 6 (dashboards and visualizations). One question per chapter.",
  minutes: 26,
  pass: 70
};

const QUESTIONS = [

  /* Ch 22 - Photon */
  {
    q:`A team compares two workloads on the same serverless SQL warehouse: a nightly aggregation joining three multi-terabyte Delta tables, and a lookup that returns one row in half a second. They ask which will benefit from Photon and why. What is the accurate answer?`,
    opts:[
      "Neither, because Photon must be enabled per query with a hint",
      "Both equally, because Photon is a different query optimizer that rewrites every plan",
      "The lookup, because Photon is designed for low-latency point reads",
      "The aggregation, because Photon's vectorized C++ operators accelerate large scans, joins and aggregates, while sub-two-second queries gain nothing measurable"
    ],
    correct:3,
    explain:`Photon replaces the execution engine, not the optimizer, and its gains come from processing large columnar batches in native code, so heavy scans, hash joins and aggregates are where it pays; Databricks states that queries under about two seconds do not improve. The point-read option inverts that. Photon is always on for SQL warehouses and needs no hint.`
  },

  /* Ch 23 - Finding slow queries */
  {
    q:`A dashboard query has become slow. Its entry in Query History shows a long duration, a DATA_SPILL performance insight, and a profile whose top operator is a Hash Aggregate with a high memory peak; the rows in and out look normal. Which action does the evidence point at?`,
    opts:[
      "Increase the SQL warehouse size so the aggregation has more memory per task",
      "Rewrite the join keys, since the aggregate is producing too many rows",
      "Run OPTIMIZE on the source table to fix the small-file problem",
      "Raise max clusters so the query can use more than one cluster"
    ],
    correct:0,
    explain:`Spilling with a high memory peak and normal row counts means the work does not fit in memory, and the DATA_SPILL insight's own recommendation is a larger warehouse. Fan-out would show rows out far above rows in, which the profile rules out. Small files would surface as a DATA_FILE_SIZE insight on the scan, and extra clusters help concurrency, not a single query's memory.`
  },

  /* Ch 24 - Auditing with Delta history */
  {
    q:`An auditor asks an analyst to prove how many rows last night's MERGE inserted into a certified table and to produce the exact rows that were deleted by an unexpected DELETE that ran an hour earlier. Which TWO sources answer these?`,
    opts:[
      "DESCRIBE HISTORY, whose operationMetrics for the MERGE version give numTargetRowsInserted",
      "SELECT ... VERSION AS OF the version before the DELETE EXCEPT SELECT ... VERSION AS OF the version after it, to list the removed rows",
      "The Insights tab in Catalog Explorer, which records rows changed per user",
      "system.access.audit, which stores the deleted rows for 30 days",
      "The query result cache, which retains the pre-delete result"
    ],
    correct:[0,1],
    explain:`Table history carries per-version row metrics, and time travel makes the pre- and post-delete versions queryable so a set difference yields the deleted rows themselves. Insights shows query popularity, the audit log records events rather than row contents, and the result cache is not a data archive.`
  },

  /* Ch 25 - Query history and caching */
  {
    q:`Two analysts on different serverless SQL warehouses in the same workspace run an identical statement over an unchanged table ten minutes apart. The second run returns almost instantly and shows no query profile. What explains this?`,
    opts:[
      "The disk cache on the first warehouse was shared over the network with the second",
      "The remote result cache, shared across warehouses in the workspace, served the stored result, and cached runs are not profiled",
      "The second analyst's warehouse was larger, so the same query ran faster",
      "Query History deduplicated the statement and reused the earlier profile"
    ],
    correct:1,
    explain:`Serverless warehouses share a workspace-wide remote result cache that returns a stored result for an identical statement while the data is unchanged, and Databricks notes that queries answered from the cache have no profile. The disk cache is per node and holds file copies, not results. A larger warehouse would still produce a profile, and Query History records every run separately.`
  },

  /* Ch 26 - Liquid Clustering */
  {
    q:`A 12 TB Delta table is queried almost exclusively with filters on customer_id, a column with 40 million distinct values. The table is not partitioned or clustered, and scans read nearly every file. Which layout change does Databricks recommend, and why is the alternative worse?`,
    opts:[
      "Partition the table by customer_id, since partitioning is the most reliable way to prune files",
      "Add a Z-Order on customer_id and keep the table unpartitioned, since Z-Order and clustering are equivalent",
      "Cluster the table with CLUSTER BY (customer_id): high cardinality is fine for liquid clustering, and partitioning on it would create tens of millions of tiny partitions",
      "Increase the warehouse size, because file pruning depends on the number of workers"
    ],
    correct:2,
    explain:`Liquid clustering on the filter column narrows each file's range of customer_id so data skipping works, and unlike partitioning it handles very high cardinality with no directory explosion; it is the recommended layout for new tables. Partitioning on a 40-million-value column is the classic anti-pattern. Z-Order is the superseded technique and cannot be combined with clustering, and pruning happens before workers are involved.`
  },

  /* Ch 27 - Fixing a query */
  {
    q:`A query SELECT store_id, sum(amount) AS total FROM sales WHERE sum(amount) > 10000 GROUP BY store_id fails. What is the fault and the fix?`,
    opts:[
      "GROUP BY must precede WHERE; swap the clauses",
      "sum() is not allowed with GROUP BY; use count() instead",
      "The alias total must be used in WHERE instead of sum(amount)",
      "An aggregate cannot appear in WHERE (INVALID_WHERE_CONDITION); move the condition to HAVING sum(amount) > 10000 after GROUP BY"
    ],
    correct:3,
    explain:`WHERE filters rows before any grouping, so it cannot evaluate an aggregate; HAVING is the clause that filters groups after GROUP BY. Using the alias would not help, because aliases are not visible in WHERE either and the aggregate would still be evaluated too early. Clause order in the text is fixed by the grammar, and sum() with GROUP BY is ordinary SQL.`
  },

  /* Ch 28 - AI/BI Dashboards */
  {
    q:`An analyst is editing a published dashboard's draft: adding a page, a new dataset from another catalog, and a text widget. Viewers report seeing none of it. What is happening, and what must the analyst do?`,
    opts:[
      "Draft changes auto-save but do not reach viewers until the analyst publishes again, creating a new snapshot",
      "Datasets from a second catalog cannot be added; the dashboard must be split into two",
      "The viewers lack CAN EDIT, which is required to see new pages",
      "The 24-hour cache is hiding the changes; the analyst must clear it"
    ],
    correct:0,
    explain:`A published dashboard is a snapshot; the draft is a separate working copy that auto-saves and stays invisible to viewers until Publish is clicked again. Multiple datasets from any reachable catalog are supported, up to 100 per dashboard. CAN VIEW is enough to see everything that has been published, and the cache stores results, not layout.`
  },

  /* Ch 29 - Visualizations in notebooks and the SQL editor */
  {
    q:`An analyst built a chart on the output of a Python cell in a notebook and wants to add it to a team's AI/BI dashboard. The Add to dashboard option is not offered. Why, and what is the fix?`,
    opts:[
      "Notebook visualizations can never be added to dashboards; rebuild it in the SQL editor's visualization tab",
      "Only visualizations built on SQL cells can be added to AI/BI dashboards; rewrite the query as a SQL cell (or in the SQL editor) and add it from there",
      "The chart type is unsupported; switch it to a bar chart",
      "The dashboard must be published first; publish it and the option appears"
    ],
    correct:1,
    explain:`Add to dashboard is available for SQL cell and SQL editor visualizations because the query becomes a dataset; charts on Python or Scala output can only be placed in a notebook dashboard. The first option is too broad, since SQL cells in notebooks do work. Chart type and the dashboard's publish state do not gate the option.`
  },

  /* Ch 30 - Parameters */
  {
    q:`A dashboard dataset reads 300 million rows. Viewers use a filter widget bound to the region field and every change takes a minute. The team wants region selection to re-run the query for just that region. What should they change?`,
    opts:[
      "Bind the filter widget to a field on a smaller dataset",
      "Convert the dashboard to individual data permissions so each viewer's query is smaller",
      "Add a :region parameter to the dataset's WHERE clause and bind the filter widget to that parameter, so the query itself is re-run with the chosen value",
      "Switch the widget from single value to multiple values, which pushes the filter down"
    ],
    correct:2,
    explain:`A field filter narrows results that were already fetched, so the full dataset is still queried; a parameter changes the SQL, so the warehouse reads only the chosen region. Credentials affect what a viewer may see, not how much is scanned. Multi-select on a field filter is still a post-fetch filter, and moving the widget to another dataset does not change the heavy one.`
  },

  /* Ch 31 - Sharing dashboards */
  {
    q:`A published dashboard must be viewed by an audit firm's staff who have Databricks account identities but no workspace membership, and it must also be displayed inside the company's internal portal. Which TWO settings are involved?`,
    opts:[
      "CAN MANAGE for the audit staff, since external viewers need elevated rights",
      "The sharing setting \"Anyone in my account can view\", so account users outside the workspace can open the link",
      "The Embed option in the Share dialog plus a workspace admin allowing the portal's domain under External access",
      "Sharing the draft rather than the published version",
      "Disabling the dashboard's result cache so embedded views are always live"
    ],
    correct:[1,2],
    explain:`Account-wide viewing is the mechanism for users in the account but not the workspace, and embedding needs the iframe snippet together with the admin's embed-domain allowance. CAN VIEW is all a viewer needs; drafts cannot be shared with viewers or embedded; and the cache has nothing to do with sharing.`
  },

  /* Ch 32 - Scheduling a dashboard refresh */
  {
    q:`A dashboard is published with shared data permissions. Its source tables finish loading at 03:00. Leadership opens it at 08:00 and wants it fast and current, and a summary emailed to a distribution list. Which configuration fits?`,
    opts:[
      "A schedule at 02:00 so the cache is warm well before anyone arrives",
      "An alert on the dashboard that fires at 08:00 and emails the leadership",
      "A schedule at 03:30 daily with the distribution list as email subscribers, which re-runs the datasets, fills the shared cache and sends a PDF snapshot",
      "No schedule; the 24-hour cache already refreshes the dashboard automatically"
    ],
    correct:2,
    explain:`A schedule after the load re-executes the datasets into the shared cache and delivers a snapshot to subscribers, which covers both asks. A 02:00 run precedes the load and would cache stale data for the day. Alerts fire on conditions, not as a delivery mechanism, and the cache stores results rather than refreshing them; without a run, the first viewer waits.`
  },

  /* Ch 33 - Alerts */
  {
    q:`Ops must be paged when the number of failed payment events in the last 10 minutes exceeds 50, repeatedly while the problem persists, and told when it clears. Which alert configuration meets all three requirements?`,
    opts:[
      "An alert with notification frequency set to once, since repeated pages are never desirable",
      "A dashboard subscription every 10 minutes to the PagerDuty destination",
      "A query counting all failures ever, condition > 50, evaluated once a day",
      "A query counting failures in the last 10 minutes, condition first value > 50, a schedule every 5 minutes, a PagerDuty destination, notification frequency set to repeat until OK, and Notify on OK enabled"
    ],
    correct:3,
    explain:`Every requirement maps to an alert setting: the windowed query and threshold define the condition, a frequent schedule catches it quickly, PagerDuty is a supported destination, repeat-until-OK keeps paging during the incident, and Notify on OK announces recovery. A subscription delivers regardless of condition, an all-time count never returns to OK, and notifying once contradicts the "while it persists" requirement.`
  },

  /* Ch 34 - Choosing the visualization */
  {
    q:`A product manager wants a single dashboard widget that shows whether monthly churn has been rising or falling over the past 18 months, with the campaign launch month visible. Which visualization communicates this most clearly?`,
    opts:[
      "A line chart of churn rate by month with the launch month marked",
      "A table of 18 monthly churn rates",
      "A counter showing this month's churn rate",
      "A pie chart of churned versus retained customers"
    ],
    correct:0,
    explain:`A direction over time is a trend question, and a line over a time axis is the chart that shows it at a glance; a marked month adds the context. A pie shows a single moment's proportions with no time axis, a table hides the shape in numbers, and a counter shows one value with no trend at all.`
  }

];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
