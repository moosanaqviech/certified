<style>
  :root {
    /* ===== SHELL — do not change between lessons ===== */
    --frame: #13141f;
    --surface: #161822;
    --surface-2: #1e2130;
    --ink: #f1f1f6;

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  .topbar { position: relative; z-index: 6; padding: 18px 20px 8px; display: flex; gap: 5px; align-items: center; }
  .seg { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; }

  .art { margin: 6px 0 22px; display: flex; align-items: center; justify-content: center; min-height: 150px; }
  .art.grow { flex: 1; }

  .card.in .reveal { animation: rise 0.55s cubic-bezier(0.2,0.7,0.2,1) backwards; }
  .card.in .reveal:nth-child(1){ animation-delay: 0.05s; }
  .card.in .reveal:nth-child(2){ animation-delay: 0.13s; }
  .card.in .reveal:nth-child(3){ animation-delay: 0.21s; }
  .card.in .reveal:nth-child(4){ animation-delay: 0.29s; }
  @keyframes rise { from { opacity:0; transform: translateY(14px);} to {opacity:1; transform:none;} }

  /* ===== v2: step-sequenced card builds ===== */
  /* Any element carrying data-step starts hidden and rises in only once its
     step is reached. step-on is added by the engine (see applySteps). SVG <g>
     groups animate here too: CSS transforms on SVG elements work in modern
     WebKit and the iOS shell. Do NOT put an entrance .reveal on a [data-step]
     element, and do NOT rely on a transform= attribute on a [data-step] <g>
     (the CSS transform below would override it: position children directly). */
  [data-step] { opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity 0.3s cubic-bezier(0.2,0.7,0.2,1), transform 0.3s cubic-bezier(0.2,0.7,0.2,1); }
  [data-step].step-on { opacity: 1; transform: translateY(0); pointer-events: auto; }
  /* Appended captions (.stepcaps): the engine adds .step-past to captions of
     steps already behind the current one, dimming them; the current step's
     caption stays at opacity 1. The base [data-step] transition already
     includes opacity, so the dim animates. Declared after .step-on so the
     dim wins on already-revealed elements. */
  [data-step].step-past { opacity: 0.55; }

  .spacer { flex: 1; }

  .tag { display: inline-flex; align-items:center; gap:8px; padding: 7px 13px; border-radius: 100px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em; border: 1px solid var(--line); background: rgba(255,255,255,0.03); margin-bottom: 18px; }

  .pills { display:flex; flex-direction:column; gap:10px; margin-top: 6px;}

  .pill p { font-size: 14.5px; line-height:1.4; color: var(--ink-soft); }
  .pill p b { color: var(--ink); font-weight:600; display:block; margin-bottom:2px; font-size:15px;}

  .codeblock { background:#0a1011; border:1px solid var(--line); border-radius:14px; padding:16px 18px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:12.5px; line-height:1.7; color:var(--ink-soft); overflow-x:auto; }

  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.88em; background: rgba(255,255,255,0.07); padding: 2px 6px; border-radius: 5px; color: var(--ink); }

  .footer { position: relative; z-index: 6; padding: 12px 24px 26px; display: flex; align-items:center; gap: 14px; }
  .btn { flex: 1; border: none; font-family: var(--body); font-weight: 700; font-size: 16px; letter-spacing: 0.01em; padding: 16px; border-radius: 16px; cursor: pointer; background: var(--ink); color: var(--bg); transition: transform 0.15s ease, opacity 0.2s ease, background 0.3s ease; }
  .btn:active { transform: scale(0.97); }
  .btn.ghost { flex: 0 0 auto; width: 54px; background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--line); font-size: 20px; }
  .btn:disabled { opacity: 0.3; pointer-events: none; }
  .btn.alt { flex: 1 1 0; background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--line); }
  .btn[hidden] { display: none; }
  /* final card, two exits side by side: shrink to keep both on one line.
     Stacking them instead would cost the card ~50px of height, and the
     recap card is already the tightest one in a lesson. */
  .footer.end .btn { font-size: 14px; white-space: nowrap; padding: 16px 10px; }
  @media (max-width: 359px) { .footer.end { padding-left: 14px; padding-right: 14px; gap: 10px; } .footer.end .btn { font-size: 13px; padding: 15px 8px; } }

  .choices { display:flex; flex-direction:column; gap:11px; margin-top: 4px;}
  .choice { text-align:left; cursor:pointer; background: var(--surface-2); border: 1.5px solid var(--line); color: var(--ink); font-family: var(--body); font-weight: 600; font-size: 15px; padding: 16px 18px; border-radius: 15px; display:flex; align-items:center; gap: 13px; transition: border-color 0.2s, background 0.2s, transform 0.1s; }
  .choice:active { transform: scale(0.985); }
  .choice .key { width:26px; height:26px; border-radius:8px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background: rgba(255,255,255,0.06); font-size:13px; color: var(--ink-soft); }
  .choice.correct { border-color: var(--accent); background: var(--accent-glow); }
  .choice.correct .key { background: var(--accent); color: var(--accent-ink); }
  .choice.wrong { border-color: rgba(232,98,92,0.8); background: rgba(232,98,92,0.12); }
  .choice.dim { opacity: 0.45; }

  .feedback { margin-top:16px; font-size:14.5px; line-height:1.5; color: var(--ink-soft); opacity:0; transform: translateY(8px); transition: 0.35s ease; }
  .feedback.show { opacity:1; transform:none; }
  .feedback b { color: var(--accent); font-weight:600; }

  .done-badge { width: 84px; height:84px; margin: 0 auto 6px; }

  @media (max-width: 440px) { .stage { padding: 0; } .phone { width:100%; height:100dvh; max-height:100dvh; border-radius:0; padding:0; box-shadow:none;} .screen { border-radius:0; } }

  /* ===== v2: reduced motion ===== */
  /* Kill every engine-driven motion when the viewer asks for less: the card
     slide, the entrance reveal, the glow crossfade, and the step transitions
     all become instant (elements still appear, just without travel). Payload
     looping motion must be authored as CSS keyframes inside the SVG's own
     <style> block and wrapped in this same query, so it is covered too. */
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card.in .reveal { animation: none; }
    .glow { transition: none; }
    [data-step] { transition: none; }
  }
  /* ===== desktop: let the lesson use the screen ===== */
  /* Below 900px the lesson keeps its phone column. On a laptop or monitor the
     column widens and the art (viewBox 320x200, labels drawn at phone size)
     renders at up to twice its phone width, capped by viewport height so a
     cover still fits above the footer; the type steps up with it. Shell CSS
     only: the payload and the engine are untouched by this block. */
  @media (min-width: 900px) {
    .phone { max-width: 860px; }
    .topbar { padding: 22px 72px 10px; }
    .card { padding: 24px 72px 40px; }
    .footer { padding: 14px 72px 30px; }
    svg { max-width: min(640px, 76vh); }
    .art { min-height: 240px; margin: 10px 0 28px; }
    .eyebrow { font-size: 13px; }
    h1 { font-size: 52px; }
    h2 { font-size: 36px; }
    .lead { font-size: 20px; }
    .tag { font-size: 14px; }
    .pill p { font-size: 16.5px; }
    .pill p b { font-size: 17px; }
    .codeblock { font-size: 14px; }
    .choice { font-size: 17px; }
    .feedback { font-size: 16.5px; }
    .footer.end .btn { font-size: 16px; }
  }
</style>

<script>
/* ============================================================
   ▼▼▼  LESSON PAYLOAD — BEGIN  ▼▼▼
   Unit 6 · Chapter 34 · Choosing the Visualization That Communicates the Insight (TO)
   Objective: identify the effective visualization type to communicate
   insights clearly. Trade-off lesson: shared ground (the question the
   chart must answer), one card per chart family (comparison, trend,
   part-of-whole, relationship, single value and detail), the side-by-side
   table, decision signals with the misleading choices, two quizzes in
   opposite directions. Chart names follow the AI/BI dashboard widget
   types. Closes Unit 6, so NAV points at Practice Exam 3.
   Sources: docs.databricks.com/aws/en/visualizations/visualization-types,
   /dashboards/visualizations/.
   Cover animates (the same data as bars, then a line); step build on card 1.
   ============================================================ */

/* ----------  NAV  ---------- */
const NAV = {
  catalog:   "index.html",
  next:      "da-practice-exam-03.html",
  nextLabel: "Practice test"
};

/* ----------  ART  (custom SVGs, referenced from cards as ${A.name})  ---------- */
const A = {
  cover: `<svg viewBox="0 0 320 200">
    <defs>
      <radialGradient id="c34r" cx="0.5" cy="0.5" r="0.6">
        <stop offset="0" style="stop-color:rgba(34,211,238,0.22)"/>
        <stop offset="1" style="stop-color:rgba(34,211,238,0)"/>
      </radialGradient>
    </defs>
    <style>
      .c34bar { animation: c34bar 7s ease-in-out infinite; transform-origin: 50% 150px; }
      @keyframes c34bar { 0%, 38% { transform: scaleY(1); opacity: 1; } 48%, 88% { transform: scaleY(0); opacity: 0; } 98%, 100% { transform: scaleY(1); opacity: 1; } }
      .c34line { stroke-dasharray: 300; stroke-dashoffset: 300; animation: c34line 7s ease-in-out infinite; }
      @keyframes c34line { 0%, 45% { stroke-dashoffset: 300; opacity: 0; } 50% { opacity: 1; } 70%, 88% { stroke-dashoffset: 0; opacity: 1; } 95%, 100% { stroke-dashoffset: 300; opacity: 0; } }
      .c34t1 { animation: c34t1 7s ease-in-out infinite; } .c34t2 { animation: c34t2 7s ease-in-out infinite; }
      @keyframes c34t1 { 0%, 38% { opacity: 1; } 48%, 88% { opacity: 0; } 98%, 100% { opacity: 1; } }
      @keyframes c34t2 { 0%, 45% { opacity: 0; } 55%, 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .c34bar, .c34line, .c34t1, .c34t2 { animation: none; } .c34line { stroke-dashoffset: 0; opacity: 1; } .c34t2 { opacity: 1; } }
    </style>
    <ellipse cx="160" cy="100" rx="150" ry="74" fill="url(#c34r)"/>
    <path d="M40 150 H 290" stroke="var(--line)" stroke-width="1.2"/>
    <g fill="rgba(34,211,238,0.5)">
      <rect class="c34bar" x="52" y="110" width="22" height="40"/><rect class="c34bar" x="90" y="96" width="22" height="54"/><rect class="c34bar" x="128" y="120" width="22" height="30"/><rect class="c34bar" x="166" y="80" width="22" height="70"/><rect class="c34bar" x="204" y="70" width="22" height="80"/><rect class="c34bar" x="242" y="58" width="22" height="92"/>
    </g>
    <path class="c34line" d="M63 110 L101 96 L139 120 L177 80 L215 70 L253 58" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="Hanken Grotesk" font-size="8" fill="var(--ink-faint)" text-anchor="middle">
      <text x="63" y="164">Apr</text><text x="101" y="164">May</text><text x="139" y="164">Jun</text><text x="177" y="164">Jul</text><text x="215" y="164">Aug</text><text x="253" y="164">Sep</text>
    </g>
    <g font-family="Hanken Grotesk" font-size="9.5" font-weight="700" fill="var(--accent)" text-anchor="middle">
      <text class="c34t1" x="160" y="40">Bars ask: which month was biggest?</text>
      <text class="c34t2" x="160" y="40">A line asks: where is this heading?</text>
    </g>
    <text x="160" y="190" text-anchor="middle" fill="var(--ink-soft)" font-family="Hanken Grotesk" font-size="9.5">Same six numbers. The chart decides what the reader notices.</text>
  </svg>`,

  q: `<svg viewBox="0 0 320 140">
    <g data-step="1">
      <rect x="14" y="14" width="292" height="26" rx="7" fill="rgba(34,211,238,0.12)" stroke="var(--accent)"/>
      <text x="160" y="31" text-anchor="middle" fill="var(--accent)" font-family="Hanken Grotesk" font-size="9" font-weight="700">1. What question must the reader answer in two seconds?</text>
    </g>
    <g data-step="2">
      <rect x="14" y="50" width="292" height="26" rx="7" fill="var(--surface-2)" stroke="var(--accent)"/>
      <text x="160" y="67" text-anchor="middle" fill="var(--ink)" font-family="Hanken Grotesk" font-size="9" font-weight="700">2. What shape is the data: categories, time, parts, pairs, one value?</text>
    </g>
    <g data-step="3">
      <rect x="14" y="86" width="292" height="26" rx="7" fill="var(--surface-2)" stroke="var(--line)"/>
      <text x="160" y="103" text-anchor="middle" fill="var(--ink)" font-family="Hanken Grotesk" font-size="9" font-weight="700">3. How many things: 5 categories or 50? 6 months or 600 days?</text>
      <text x="160" y="130" text-anchor="middle" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="8">the answers pick the chart; taste only picks the colors</text>
    </g>
  </svg>`,

  done: `<svg viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="38" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <path d="M28 43 l9 9 l19 -20" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`
};

/* ----------  CARDS  ---------- */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 6 · Chapter 34 · Trade-off</div>
    <h1 class="reveal">Choosing the visualization</h1>
    <p class="lead reveal">Every chart type answers one kind of question well and the others badly. The exam describes an insight and asks which visualization communicates it clearly; the answer is always in the question the reader is supposed to answer.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — shared ground, step build */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">Shared ground</div>
    <h2 class="reveal" style="font-size:24px">Three questions before any chart</h2>
    <div class="art reveal">${A.q}</div>
    <div class="stepcaps">
      <p class="lead" data-step="0" style="font-size:14.5px">All the chart families in the AI/BI dashboard widget list answer the same three questions differently. Tap to ask them.</p>
      <p class="lead" data-step="1" style="font-size:14.5px"><strong>What must the reader answer</strong> at a glance? Which is biggest, is it going up, how much of the whole, are these related, what is the number.</p>
      <p class="lead" data-step="2" style="font-size:14.5px"><strong>What shape is the data?</strong> Categories, a time axis, parts of a total, pairs of measures, or a single value.</p>
      <p class="lead" data-step="3" style="font-size:14.5px"><strong>How many things?</strong> A pie of four slices reads; a pie of forty does not. Six months is a line; six hundred days may need aggregation first.</p>
    </div>` },

  /* 2 — comparison and trend */
  { html: `
    <div class="eyebrow reveal">Two families</div>
    <h2 class="reveal">Comparison and trend</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>Bar chart</b>Compares a measure across categories: revenue by region, tickets by team. Horizontal bars when labels are long; stacked bars when each category has a composition; grouped bars to compare two series per category.</p></div>
      <div class="pill"><p><b>Line chart</b>Shows change over a continuous axis, almost always time: daily active users, monthly revenue. Several lines compare trends; an area chart adds the magnitude under the line, stacked areas show composition over time.</p></div>
      <div class="pill"><p><b>Combo chart</b>A bar and a line on two axes when a count and a rate must be read together, such as orders and conversion by month.</p></div>
      <div class="pill"><p><b>The confusion</b>A bar chart of months works, but it invites "which month was biggest" when the question was "is it growing". Time on the x-axis usually wants a line.</p></div>
    </div>` },

  /* 3 — part of whole and relationship */
  { html: `
    <div class="eyebrow reveal">Two more families</div>
    <h2 class="reveal">Part of a whole, and relationship</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>Pie chart</b>Shares of one total, when there are few slices (about five or fewer) and the shares differ visibly. Beyond that, angles become unreadable and a sorted bar chart says the same thing better.</p></div>
      <div class="pill"><p><b>Funnel</b>A sequence of stages that each keep a fraction of the last: visits, carts, checkouts, orders.</p></div>
      <div class="pill"><p><b>Scatter plot</b>Two measures per row, to see whether they move together: discount versus margin, tenure versus spend. Add a third measure as bubble size.</p></div>
      <div class="pill"><p><b>Heatmap</b>A measure across two categorical axes: sales by weekday and hour. Density reads as color where a table of numbers would not.</p></div>
    </div>` },

  /* 4 — single value, detail, geography */
  { html: `
    <div class="eyebrow reveal">The rest</div>
    <h2 class="reveal">Single value, detail, and place</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>Counter</b>One number, big: today's revenue, open incidents, with an optional comparison to a target or a previous period. A KPI tile is a counter, not a one-bar chart.</p></div>
      <div class="pill"><p><b>Table and pivot</b>When the reader needs exact values, many columns, or to look something up. A pivot table cross-tabulates two dimensions with an aggregate. Charts summarize; tables serve detail.</p></div>
      <div class="pill"><p><b>Histogram and box plot</b>The distribution of one measure: order sizes, response times. A histogram shows the shape; a box plot shows the median and spread per category.</p></div>
      <div class="pill"><p><b>Map</b>Choropleth for a measure by region, point map for events at coordinates. Only when geography is the question, not decoration.</p></div>
    </div>` },

        <tr style="border-bottom:1px solid var(--line);"><td style="padding:9px 6px; color:var(--ink-soft);">Is it going up over time?</td><td style="padding:9px 6px; color:var(--ink);">Line</td><td style="padding:9px 6px; color:var(--ink);">Pie, table</td></tr>
        <tr style="border-bottom:1px solid var(--line);"><td style="padding:9px 6px; color:var(--ink-soft);">How much of the total is each part?</td><td style="padding:9px 6px; color:var(--ink);">Pie (few parts) or stacked bar</td><td style="padding:9px 6px; color:var(--ink);">Line</td></tr>
        <tr style="border-bottom:1px solid var(--line);"><td style="padding:9px 6px; color:var(--ink-soft);">Do these two measures move together?</td><td style="padding:9px 6px; color:var(--ink);">Scatter</td><td style="padding:9px 6px; color:var(--ink);">Two bars side by side</td></tr>
        <tr style="border-bottom:1px solid var(--line);"><td style="padding:9px 6px; color:var(--ink-soft);">What is the number right now?</td><td style="padding:9px 6px; color:var(--ink);">Counter</td><td style="padding:9px 6px; color:var(--ink);">A one-bar chart</td></tr>
        <tr style="border-bottom:1px solid var(--line);"><td style="padding:9px 6px; color:var(--ink-soft);">Where do we lose people in a process?</td><td style="padding:9px 6px; color:var(--ink);">Funnel</td><td style="padding:9px 6px; color:var(--ink);">Pie</td></tr>
        <tr><td style="padding:9px 6px; color:var(--ink-soft);">What are the exact values?</td><td style="padding:9px 6px; color:var(--ink);">Table or pivot</td><td style="padding:9px 6px; color:var(--ink);">Any chart</td></tr>

  { html: `
    <div class="eyebrow reveal">Decision signals</div>

    <div class="pills reveal">

      <div class="pill"><p><b>A dual axis that lies</b>Two lines on separate scales can be made to cross anywhere; use a combo chart only when both scales are labeled and the pairing is natural.</p></div>
      <div class="pill"><p><b>A truncated bar axis</b>Bars starting above zero exaggerate differences; lines may start where the data lives, bars must start at zero.</p></div>
      <div class="pill"><p><b>Too many series</b>Eight lines become spaghetti; split into small multiples or keep the two that matter and gray the rest.</p></div>

    html: `

  /* 8 — quiz: comparison direction */
  { quiz: true,
    html: `

  /* 9 — done */

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ----------
   v2 adds opt-in, per-card step builds on top of the v1 card engine. A card
   with no `steps` field takes exactly the v1 paths below and renders and
   behaves identically; every v2 branch is guarded by `steps` being present. */
const ENGINE_VERSION = 'v2';
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};
const stepState = {};   // v2: current revealed step per card index (mirrors `answered`)

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

/* v2: apply step visibility for one card WITHOUT touching its .in class, so a
   step reveal never replays the card-entrance .reveal stagger. Cumulative for
   normal elements (data-step <= current). Captions append by default: inside
   .stepcaps they accumulate too (data-step="0" is the pre-first-tap caption),
   and captions behind the current step get .step-past (dimmed) while the
   current one stays at full strength. A .stepcap-swap container (or legacy
   .stepcap) opts into swap: only the caption whose data-step equals the
   current step is shown. */
function applySteps(idx) {
  const cur = stepState[idx] || 0;
  els[idx].querySelectorAll('[data-step]').forEach(function(nd) {
    const s = parseInt(nd.getAttribute('data-step'), 10);
    const swapCap = nd.closest && nd.closest('.stepcap-swap, .stepcap');
    const appendCap = !swapCap && nd.closest && nd.closest('.stepcaps');
    const on = swapCap ? (s === cur) : appendCap ? (s <= cur) : (s >= 1 && s <= cur);
    nd.classList.toggle('step-on', on);
    nd.classList.toggle('step-past', !!appendCap && on && s < cur);
  });
}

/* Card layout: the only place that adds/removes .in (and thus replays reveal).
   Called on card change, never on a step advance. */
function layout() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
    applySteps(idx);   // persists built state on revisit
  });
  glow.style.background = cards[i].glow || 'transparent';
}

/* Footer/button state only. Safe to call after a step advance (no reveal). */
function updateFooter() {
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  const total = c.steps || 0;
  const stepsLeft = total > 0 && (stepState[i] || 0) < total;
  if (stepsLeft) { nextBtn.disabled = false; nextBtn.textContent = (i === 0) ? 'Begin lesson' : 'Continue'; }
  else if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
}

function render() {
  layout();
  updateFooter();
  if (cards[i].quiz) wireQuiz(els[i], i);
}

/* v2: reveal the next step of the current card. Returns true if a step was
   consumed (so the caller does not also advance the card). */
function advanceStep(idx) {
  const total = cards[idx].steps || 0;
  if (!total) return false;
  const cur = stepState[idx] || 0;
  if (cur >= total) return false;
  stepState[idx] = cur + 1;
  applySteps(idx);
  updateFooter();
  return true;
}

/* v2: reveal every remaining step at once (swipe-left escape hatch). */
function skipSteps(idx) {
  const total = cards[idx].steps || 0;
  if (!total || (stepState[idx] || 0) >= total) return false;
  stepState[idx] = total;
  applySteps(idx);
  updateFooter();
  return true;
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

/* Primary action. On a step card mid-build this reveals the next step; once
   the steps are done (or on a card with none) it advances, honoring the quiz
   gate exactly as v1 did. Shared by the Continue button and ArrowRight. */
function handleNext() {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  if (advanceStep(i)) return;
  go(i + 1);
}
nextBtn.onclick = handleNext;
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* v2: tapping anywhere on a step card advances one step; once built, a tap
   advances the card (gate permitting). Cards with no steps ignore taps, so
   this listener is inert on v1-style cards. Elements with their own behavior
   (quiz choices, links) are skipped so a tap never double-fires. */
vp.addEventListener('click', e => {
  const c = cards[i];
  if (!c.steps) return;
  if (e.target.closest('.choice, a')) return;
  if ((stepState[i] || 0) < c.steps) { advanceStep(i); return; }
  if (!nextBtn.disabled && !c.last) go(i + 1);
});

/* Keys and swipes only move between cards (or, for a step card, between
   steps). Leaving the lesson always takes a deliberate tap, so a stray swipe
   on the final card cannot navigate away. ArrowRight mirrors the Continue
   button step-wise; ArrowLeft mirrors Back. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) handleNext();
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  // Swipe left: skip any remaining steps and advance in one gesture, honoring
  // the quiz gate (updateFooter re-derives nextBtn.disabled after the skip).
  if (dx < -50 && !cards[i].last) { skipSteps(i); if (!nextBtn.disabled) go(i + 1); }
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
