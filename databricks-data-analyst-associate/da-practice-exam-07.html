<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 7",
  badge: "Databricks Data Analyst Associate",
  blurb: "Full-length mock. Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Most questions have one best answer; a few ask you to select two. Databricks publishes no official passing score; 70% is our practice target.",
  coverage: "Full-length mock exam: 45 questions in 90 minutes, one per chapter across all nine sections plus extra weight on Section 4 (Databricks SQL), mirroring the real exam's shape.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

  /* Q1 · Ch 01 - platform components */
  {
    q:`A data analyst is asked which part of the platform to open for each task: run an ad hoc query, check who may read a table, and see the scheduled pipeline that refreshes it. Which mapping is right?`,
    opts:[
      "Notebook for the query, Marketplace for permissions, Catalog Explorer for the pipeline",
      "Dashboards for the query, query history for permissions, volumes for the pipeline",
      "Genie for the query, the Assistant for permissions, Delta Sharing for the pipeline",
      "SQL editor on a SQL warehouse for the query, Catalog Explorer's Permissions tab for who may read it, and Lakeflow Jobs (or the table's lineage) for the refresh pipeline"
    ],
    correct:3,
    explain:`Queries run in the SQL editor on a warehouse, grants are visible on the object's Permissions tab in Catalog Explorer, and scheduled work lives in Lakeflow Jobs, reachable from the table's lineage. The notebook option is plausible for the query but sends permissions to Marketplace, which distributes data products. Genie and dashboards consume rather than administer.`
  },

  /* Q2 · Ch 02 - Catalog Explorer objects */
  {
    q:`An analyst finds two schemas named sales in different catalogs and a colleague says "that is impossible, names must be unique". Who is right?`,
    opts:[
      "The colleague: schema names are unique across the metastore",
      "The analyst: names are unique only within their parent, so two catalogs can each contain a schema called sales, and the full name disambiguates them",
      "The colleague: Unity Catalog appends a suffix to duplicate schema names",
      "The analyst, but only if the two catalogs are bound to different workspaces"
    ],
    correct:1,
    explain:`Uniqueness applies within a container: catalog names are unique in the metastore, schema names within a catalog, table names within a schema, which is why three-part names exist. The metastore-wide uniqueness claim is the tempting intuition from single-database systems. No suffixes are added, and binding has nothing to do with naming.`
  },

  /* Q3 · Ch 03 - managed vs external */
  {
    q:`An analyst runs DESCRIBE EXTENDED on a table and sees Type: EXTERNAL with a Location in a cloud bucket. A teammate plans to run OPTIMIZE and VACUUM on it. What should the analyst point out?`,
    opts:[
      "External tables cannot be optimized",
      "OPTIMIZE converts the table to managed",
      "VACUUM on an external table deletes unreferenced files at that path, so any other system relying on those files (or time travel to old versions) will lose them",
      "External tables are read-only"
    ],
    correct:2,
    explain:`Maintenance commands work on external tables, but VACUUM physically deletes files no longer referenced by the current version, which matters when the path is shared with other tools or old versions are still needed. The cannot-optimize option is a common misconception; layout commands are fine. Nothing converts a table's type, and external tables accept writes.`
  },

  /* Q4 · Ch 04 - certified tables, lineage, access */
  {
    q:`A table owner wants to certify her gold table so analysts and Genie treat it as trusted. Which statement about certification is accurate?`,
    opts:[
      "Certification is set by owners (or users with the right privileges) as an asset status in Catalog Explorer and surfaces in search and in Genie descriptions; it does not change permissions",
      "Certification automatically grants SELECT to all account users",
      "Certification requires the table to be a materialized view",
      "Certification is applied by running OPTIMIZE with the CERTIFY option"
    ],
    correct:0,
    explain:`Asset status is metadata set in Catalog Explorer that signals trust to people and to Genie, and it leaves grants exactly as they are. The auto-grant option is the tempting conflation of trust with access. Certification applies to tables and views of any kind, and there is no such OPTIMIZE option.`
  },

  /* Q5 · Ch 05 - Databricks Marketplace */
  {
    q:`A consumer installs a free Marketplace dataset and later asks why she cannot ALTER one of its tables to add a column. What explains it?`,
    opts:[
      "Free listings are trial versions with editing disabled for 30 days",
      "Marketplace tables are views and views cannot be altered",
      "She needs the CREATE TABLE privilege on the shared catalog",
      "Marketplace data arrives as a Delta Sharing share in a read-only catalog; to modify it, copy the data into her own managed table"
    ],
    correct:3,
    explain:`Installed listings are Delta Sharing shares surfaced as a read-only catalog the provider controls; consumers query in place or copy out to modify. The trial-period option invents a rule. Privileges on a shared catalog cannot make provider data writable, and shared tables are tables, not views.`
  },

  /* Q6 · Ch 06 - certified datasets */
  {
    q:`A Genie space is being built over sales data, and the author must pick between a certified gold table and an uncertified but more detailed silver table. Which reasoning matches Databricks guidance?`,
    opts:[
      "Prefer the certified gold table: it is the owner-vetted, curated dataset, and fewer, well-described columns improve Genie accuracy",
      "Prefer the silver table, since more columns give Genie more context",
      "Use both so Genie can choose per question",
      "Certification is irrelevant to Genie; pick by row count"
    ],
    correct:0,
    explain:`Certified assets are the trust signal for both people and Genie, and the Genie best practice is a small set of curated, well-described tables. More columns are the tempting "more is better" reasoning but widen the context the model must filter and worsen results. Adding both invites ambiguous column matches.`
  },

  /* Q7 · Ch 07 - tags and lineage */
  {
    q:`A column's lineage graph shows it flowing from a bronze table through a notebook into three gold tables, but a fourth table that the team believes uses it is missing. What is the most likely explanation?`,
    opts:[
      "Lineage must be declared manually and nobody registered the fourth table",
      "Column lineage only tracks the first three downstream tables",
      "Lineage is captured automatically from runs on Unity Catalog compute, so the fourth table is either written outside Unity Catalog compute, not written recently, or not actually derived from that column",
      "The fourth table is external, and external tables never appear in lineage"
    ],
    correct:2,
    explain:`Unity Catalog records lineage automatically from queries and jobs that run on supported compute; a missing edge means the write did not go through that path, has aged out, or does not exist. Manual declaration is the tempting assumption from other catalogs but is not how Databricks lineage works. There is no three-table cap, and external tables do appear.`
  },

  /* Q8 · Ch 08 - cleaning data in SQL */
  {
    q:`A signup_date column arrived as STRING with values like "2026-03-14" and "14/03/2026". The analyst needs a DATE column and wants rows with unparseable values kept as NULL rather than failing the query. Which approach works?`,
    opts:[
      "cast(signup_date AS DATE), which returns NULL on failure by default",
      "date_format(signup_date, 'yyyy-MM-dd')",
      "to_date(signup_date), which auto-detects any format",
      "coalesce(try_to_date(signup_date, 'yyyy-MM-dd'), try_to_date(signup_date, 'dd/MM/yyyy')), which tries each format and yields NULL when neither matches"
    ],
    correct:3,
    explain:`The try_ variants return NULL instead of raising on bad input, and coalescing two format attempts handles the mixed layouts. A plain cast is the tempting default but errors on the second format under ANSI behavior. to_date without a format cannot parse day-first strings, and date_format produces a string from a date, the opposite direction.`
  },

  /* Q9 · Ch 09 - five ways in */
  {
    q:`A partner company already runs Databricks and wants to give the analytics team live access to a set of tables without either side copying data. Which path is the recommended fit?`,
    opts:[
      "Nightly COPY INTO from files the partner exports",
      "A Lakeflow Connect connector to the partner's warehouse",
      "Delta Sharing (Databricks-to-Databricks), which mounts the partner's share as a read-only catalog with no data movement",
      "The partner uploads files through the UI each morning"
    ],
    correct:2,
    explain:`Delta Sharing is the mechanism for another organization's data, and the Databricks-to-Databricks flavor needs no tokens and no copies. Lakeflow Connect is the tempting ingestion answer, but it is for SaaS applications and databases the team owns access to, and it copies data. File exports and uploads reintroduce the copying the question rules out.`
  },

  /* Q10 · Ch 10 - upload a file */
  {
    q:`A manager wants to add this month's rows from a new CSV to the table she created last month through the UI upload, without losing last month's rows. Which option in the upload flow does that?`,
    opts:[
      "Choose to append to (or modify) the existing table in the Create or modify table dialog",
      "Create a new table with the same name, which merges automatically",
      "Upload into a volume and run VACUUM",
      "The UI cannot add to an existing table; use Marketplace"
    ],
    correct:0,
    explain:`The Create or modify table UI supports adding data to an existing table, not just creating one. Creating a same-name table is the tempting shortcut but fails or overwrites rather than merging. Volumes plus VACUUM is unrelated, and Marketplace is for provider listings.`
  },

  /* Q11 · Ch 11 - Databricks Assistant */
  {
    q:`Which statement about the Databricks Assistant (Genie Code) in the SQL editor is accurate regarding data access?`,
    opts:[
      "It can draft SQL against any table in the metastore regardless of the user's permissions, because it reads the full catalog",
      "It runs queries under a service account with elevated privileges",
      "It uses metadata the user is permitted to see to draft and explain SQL; the generated query still runs under the user's own Unity Catalog permissions",
      "It only works on tables the user owns"
    ],
    correct:2,
    explain:`The Assistant is scoped by the user's permissions for the metadata it draws on, and executing its output is an ordinary query as the user. The read-everything option is the tempting fear, but the Assistant cannot see beyond the user's grants. No elevated service account is involved, and ownership is not required.`
  },

  /* Q12 · Ch 12 - SQL warehouses */
  {
    q:`A workload needs materialized views and streaming tables created from Databricks SQL, and the team is choosing a warehouse type. What must they know?`,
    opts:[
      "Any warehouse type supports them, since they are ordinary SQL objects",
      "They require a dedicated all-purpose cluster",
      "Only classic warehouses support them, for compatibility",
      "Creating streaming tables and materialized views from Databricks SQL uses serverless compute, so a serverless warehouse is the fit"
    ],
    correct:3,
    explain:`Streaming tables and materialized views created in Databricks SQL run on serverless pipelines, which is another reason serverless is the recommended warehouse type. The any-type option is the tempting simplification. Classic warehouses are the contrast case, and clusters are not how Databricks SQL creates these objects.`
  },

  /* Q13 · Ch 13 - Lakehouse Federation */
  {
    q:`An analyst runs a federated query that joins a 500-million-row table in an external MySQL database to a small Delta table, and it is slow and loads the source database. What is the appropriate response?`,
    opts:[
      "Ingest the large external table into Delta (for example with Lakeflow Connect) and join locally, keeping federation for exploration and light workloads",
      "Increase the SQL warehouse size until the source database keeps up",
      "Convert the Delta table to external so both sides are external",
      "Add a LIMIT to the external side, since federation streams rows lazily"
    ],
    correct:0,
    explain:`Federation is positioned for ad hoc exploration and small joins; a heavy, repeated workload over a large remote table should be ingested. Scaling the warehouse is the tempting lever but the bottleneck is the remote database. Changing the Delta table's type does nothing, and a LIMIT changes the answer.`
  },

  /* Q14 · Ch 14 - streaming tables vs materialized views */
  {
    q:`A streaming table ingests clickstream files. An analyst notices a corrected file was re-dropped into the folder with the same name and asks whether the table now reflects the correction. What is true?`,
    opts:[
      "Yes; streaming tables re-read every file on each refresh",
      "Yes, if the warehouse is serverless",
      "No; a streaming table processes each source file once (append-only, incremental), so a replaced file is not reprocessed and the correction needs a full refresh or a downstream fix",
      "No, because streaming tables ignore files smaller than the previous version"
    ],
    correct:2,
    explain:`Streaming tables are incremental and append-only: a file already ingested is not processed again, which is what makes them efficient and also why in-place corrections do not flow through. Re-reading everything is the tempting assumption and describes a full refresh, not normal operation. Warehouse type and file size play no part.`
  },

  /* Q15 · Ch 15 - dynamic vs materialized views */
  {
    q:`An analyst creates a dynamic view that hides salary unless the caller is in hr, then grants analysts SELECT on the view and, for convenience, SELECT on the underlying table. What has she undone?`,
    opts:[
      "Nothing; the view's logic still applies to every query",
      "The group check; is_account_group_member() stops working when the table is granted",
      "The view; granting the table invalidates dependent views",
      "The protection: analysts can query the base table directly and read salary, which is why Databricks recommends not granting users the tables a dynamic view references"
    ],
    correct:3,
    explain:`A dynamic view only protects data reached through the view, so direct table access bypasses it; the documented practice is to grant the view and withhold the table. The "nothing" option is the tempting belief that the view is a policy on the table, which it is not (column masks are). Grants do not invalidate views or break functions.`
  },

  /* Q16 · Ch 16 - aggregates */
  {
    q:`A query must count orders per customer and also show, per row, the customer's share of all orders. Which combination does that in one statement?`,
    opts:[
      "GROUP BY customer_id with count(*), and a window function such as sum(count(*)) OVER () to obtain the grand total for the share",
      "GROUP BY customer_id with count(*) and a second GROUP BY with no columns in the same SELECT",
      "count(*) with HAVING for the share",
      "count(DISTINCT customer_id) divided by count(*)"
    ],
    correct:0,

/* =====================================================================

const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
