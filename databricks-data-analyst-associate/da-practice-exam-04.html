<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 4",
  badge: "Databricks Data Analyst Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Most questions have one best answer; a few ask you to select two.",
  coverage: "Covers chapters 35-43: Unit 7 (Genie spaces), Unit 8 (data modeling) and Unit 9 (securing data). One question per chapter.",
  minutes: 18,
  pass: 70
};

const QUESTIONS = [

  /* Ch 35 - Genie spaces: purpose, features, and components */
  {
    q:`A sales director asks a Genie space "Why did EMEA revenue fall in August, and what should we change?" The space returns a table of monthly EMEA revenue and nothing else. A colleague says the space is misconfigured. What is the accurate assessment?`,
    opts:[
      "The space is missing a general instruction telling Genie to explain its results",
      "The space lacks a trusted asset for root-cause analysis, so Genie fell back to a plain query",
      "The space behaved as designed: Genie generates read-only SQL over the curated data and does not interpret results or make recommendations",
      "The warehouse timed out before the analysis step could run"
    ],
    correct:2,
    explain:`Genie turns natural-language questions into SQL, runs it, and returns results with a visualization; it does not interpret why a number moved or what to do about it, which Databricks lists explicitly among the questions it cannot answer. The general-instruction option is the tempting fix, but instructions shape SQL generation and summaries, not causal analysis. Trusted assets return verified queries, and a warehouse timeout would have produced an error rather than a table.`
  },

  /* Ch 36 - Creating a Genie space */
  {
    q:`An author is building a Genie space over a 40-table sales schema. Early tests mis-join tables and pick wrong columns. Which change follows Databricks' best practice most directly?`,
    opts:[
      "Reduce the space to a handful of tables, pre-joining related tables into views or metric views and hiding irrelevant columns",
      "Add all 40 tables plus their bronze sources so Genie has the complete picture",
      "Move every join rule into the general text instructions block",
      "Switch the warehouse from serverless to pro so the model gets more time"
    ],
    correct:0,
    explain:`Databricks recommends five or fewer well-described tables, pre-joined into views or metric views, with noise columns hidden: the more focused the selection, the better the answers. Adding tables is the tempting instinct but widens the context the model must filter and worsens accuracy. Text instructions are global context and the last resort; join logic belongs in the knowledge store or a view. Warehouse type affects query speed, not SQL generation.`
  },

  /* Ch 37 - Sharing Genie spaces */
  {
    q:`A space must be reachable by 300 business users who will ask questions and rate answers, by two curators who add example SQL, and by one owner who reviews everyone's conversations and embeds the space in the intranet. Which TWO assignments are correct?`,
    opts:[
      "Business users get CAN EDIT, since rating answers changes the space",
      "Business users get CAN VIEW (or CAN RUN) through a group, plus SELECT on the space's tables",
      "The owner needs CAN MANAGE, which is required to monitor other users' conversations and to embed",
      "The curators need CAN MANAGE, since adding example SQL modifies permissions",
      "The owner needs only CAN EDIT, because embedding is an edit action"
    ],
    correct:[1,2],
    explain:`CAN VIEW and CAN RUN grant the same abilities on a space (ask questions, give feedback), and every user still needs SELECT on the underlying data because access is evaluated as themselves. Monitoring other users' conversations, changing permissions and embedding are CAN MANAGE actions. Curators need only CAN EDIT to add example SQL and trusted assets, and rating answers is an ordinary viewer action, not an edit.`
  },

  /* Ch 38 - Optimizing Genie spaces */
  {
    q:`After a month in use, a space's benchmark accuracy is 68 percent and users report "wrong fiscal quarter" in most bad answers. The company's fiscal year starts in February. What is the best sequence of actions?`,
    opts:[
      "Delete the benchmark questions that fail, since they no longer reflect real usage",
      "Add a SQL expression (or example query) defining fiscal quarter with synonyms, re-run the benchmarks, and add the reviewed questions to the benchmark set",
      "Ask users to keep clicking Fix it so Genie learns the fiscal calendar from feedback",
      "Raise the pass threshold in the benchmark settings so the score is reported correctly"
    ],
    correct:1,
    explain:`Business jargon such as a February fiscal year is a documented failure cause, and the fix is context: a SQL expression or example query for the term, then benchmarks to confirm the change and to guard it. Relying on Fix it is the tempting shortcut, but Genie does not learn from feedback automatically; an editor must act on it. Deleting failing benchmarks hides the problem, and benchmarks have no pass threshold to raise.`
  },

  /* Ch 39 - Star, snowflake, and data vault */
  {
    q:`A logistics company must integrate shipment data from nine carriers whose feeds change format every few months, keep an auditable record of every load, and still give planners simple dashboards. Which modeling approach fits?`,
    opts:[
      "A snowflake schema in silver, since normalized dimensions absorb format changes",
      "A single star schema in bronze so planners can query raw data directly",
      "A data vault of hubs, links and satellites in silver, feeding star-schema marts in gold for the dashboards",
      "A data vault in gold that planners query directly, avoiding a second model"
    ],
    correct:2,
    explain:`Changing sources, auditability and incremental extension are the data vault's signals: insert-only hubs, links and satellites in silver, with a read-optimized star schema published in gold for BI. The snowflake option is tempting because "normalized" sounds like flexibility, but it is still a dimensional presentation model and offers none of the audit trail. Planners should never query a vault directly (it is write-optimized), and a star schema in bronze contradicts the medallion layering.`
  },

  /* Ch 40 - Where the models sit in the medallion architecture */
  {
    q:`A gold dimension table declares PRIMARY KEY (customer_sk) RELY. An analyst notices a query that joins the fact table to the dimension without selecting any dimension column runs faster than expected, and asks whether the key is being enforced. What is true?`,
    opts:[
      "The key is enforced at write time, so duplicate customer_sk values would have been rejected",
      "The optimizer used RELY to eliminate the unnecessary join, but Databricks never enforces the key; if duplicates exist the result could be wrong",
      "RELY causes Databricks to validate uniqueness on every query, which is why it is faster",
      "Primary keys are ignored entirely in Unity Catalog; the speed-up came from the disk cache"
    ],
    correct:1,
    explain:`Primary and foreign key constraints are informational and not enforced; RELY lets the optimizer trust them for rewrites such as join elimination and removing redundant DISTINCTs on Photon compute, and Databricks states that relying on a violated constraint can produce incorrect results. The write-time option describes ordinary relational databases and is the classic misconception. Nothing validates uniqueness per query, and the keys are used, not ignored.`
  },

  /* Ch 41 - Unity Catalog roles and sharing settings */
  {
    q:`A workspace admin needs to give a new analytics team read access to every current and future table in the finance.gold schema, following Databricks best practices. Which set of statements does that?`,
    opts:[
      "GRANT SELECT ON TABLE finance.gold.sales TO each analyst individually, repeated as tables are added",
      "GRANT ALL PRIVILEGES ON CATALOG finance TO the analytics group",
      "GRANT MANAGE ON SCHEMA finance.gold TO the analytics group, since MANAGE includes reading",
      "GRANT USE CATALOG ON CATALOG finance, GRANT USE SCHEMA ON SCHEMA finance.gold, and GRANT SELECT ON SCHEMA finance.gold, all to the analytics group"
    ],
    correct:3,
    explain:`SELECT granted on the schema is inherited by every table in it, now and later, and the two USE privileges provide the traversal; granting to a group rather than to users is the stated best practice. ALL PRIVILEGES on the catalog is the tempting one-liner but grants far more than read across every schema. MANAGE does not confer data access by itself and should be granted sparingly, and per-user, per-table grants are the anti-pattern the question describes.`
  },

  /* Ch 42 - The three-level namespace */
  {
    q:`A data engineer creates a managed volume finance.raw.uploads and asks where partners' CSV files should be written and what governs access. Which answer is correct?`,
    opts:[
      "To /Volumes/finance/raw/uploads/, governed by READ VOLUME and WRITE VOLUME plus USE CATALOG and USE SCHEMA",
      "To the workspace's DBFS root, governed by workspace admin settings",
      "To /Volumes/uploads/, since managed volumes are not namespaced under a catalog and schema",
      "To an external location the engineer must create first, since managed volumes cannot hold files from outside Databricks"
    ],
    correct:0,
    explain:`Volumes live in the three-level namespace and are accessed by path at /Volumes/catalog/schema/volume, with READ VOLUME and WRITE VOLUME as the data privileges and the usual container traversal. The DBFS root is the legacy ungoverned location that volumes replace. A managed volume is created inside the schema's managed storage and needs no external location; it is only a matter of who has WRITE VOLUME.`
  },

  /* Ch 43 - Storage and management best practices: ownership and PII */
  {
    q:`A table owner leaves the company. Her successor must attach a row filter to the customers table she owned and cannot, because the ALTER TABLE fails on permissions. What is the correct resolution?`,
    opts:[
      "Drop and recreate the table under the successor's name so ownership resets",
      "Grant the successor SELECT and MODIFY on the table, which together allow policy changes",
      "Recreate the row filter as a dynamic view instead, since only original owners can attach filters",
      "Have the schema owner, a metastore admin, or a MANAGE holder run ALTER TABLE customers OWNER TO the successor's group, then attach the filter"
    ],
    correct:3,
    explain:`Applying a row filter or mask to an existing table needs the owner (or MANAGE plus SELECT), and ownership can be transferred by the current owner, the container's owner, a metastore admin, or a MANAGE holder with ALTER ... OWNER TO; transferring to a group is the best practice that prevents the problem recurring. Drop and recreate is the tempting brute-force fix but loses history, grants and lineage. SELECT plus MODIFY are data privileges and do not authorize policy changes.`
  }
];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
