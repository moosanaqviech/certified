   Sources: docs.databricks.com/aws/en/sql/language-manual/

/* ----------  NAV  ---------- */

/* ----------  ART  (custom SVGs, referenced from cards as ${A.name})  ---------- */
const A = {
  cover: `<svg viewBox="0 0 320 200">
    <defs>
      <radialGradient id="c18r" cx="0.5" cy="0.5" r="0.6">

    </style>
    <ellipse cx="160" cy="100" rx="150" ry="74" fill="url(#c18r)"/>
    <text x="160" y="24" text-anchor="middle" fill="var(--accent)" font-family="Hanken Grotesk" font-size="9" font-weight="700" letter-spacing="1.5">UNION STACKS ROWS</text>
    <g class="c18a">
      <rect x="34" y="40" width="84" height="16" rx="4" fill="rgba(96,165,250,0.18)" stroke="var(--accent)"/><text x="76" y="51" text-anchor="middle" fill="var(--ink)" font-family="Hanken Grotesk" font-size="8">web · ana</text>
      <rect x="34" y="60" width="84" height="16" rx="4" fill="rgba(96,165,250,0.18)" stroke="var(--accent)"/><text x="76" y="71" text-anchor="middle" fill="var(--ink)" font-family="Hanken Grotesk" font-size="8">web · bo</text>

      <g class="c18dup"><rect x="202" y="60" width="84" height="16" rx="4" fill="rgba(251,146,60,0.18)" stroke="var(--warm)"/><text x="244" y="71" text-anchor="middle" fill="var(--ink)" font-family="Hanken Grotesk" font-size="8">web · bo</text></g>

  ops: `<svg viewBox="0 0 320 150">

/* ----------  CARDS  ---------- */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 4 · Chapter 18</div>
    <h1 class="reveal">Set operations</h1>
    <p class="lead reveal">A join adds columns from another table; a set operation adds rows from another query. Web orders and store orders in one list, customers in both lists, customers in one but not the other: that is UNION, INTERSECT and EXCEPT, and the exam mostly asks about the first one's two forms.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — the four operations, step build */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">The operations</div>
    <h2 class="reveal" style="font-size:24px">Two sets, four results</h2>
    <div class="art reveal">${A.ops}</div>
    <div class="stepcaps">
      <p class="lead" data-step="0" style="font-size:14.5px">Query A returns 1, 2, 3; query B returns 3, 4. Tap to combine them.</p>
      <p class="lead" data-step="1" style="font-size:14.5px"><strong>UNION</strong> stacks both and removes duplicate rows (UNION DISTINCT is the default). <strong>UNION ALL</strong> stacks both and keeps every row, including the 3 that appears in each.</p>
      <p class="lead" data-step="2" style="font-size:14.5px"><strong>INTERSECT</strong> keeps only rows present in both queries.</p>
      <p class="lead" data-step="3" style="font-size:14.5px"><strong>EXCEPT</strong> (MINUS is an alias) keeps rows from the first query that are absent from the second. Unlike UNION, it is not symmetric: swap the queries and the answer changes.</p>
    </div>` },

  /* 2 — the rules */
  { html: `
    <div class="eyebrow reveal">The rules</div>
    <h2 class="reveal">Columns must line up</h2>
    <div class="codeblock reveal"><span class="kw">SELECT</span> order_id, customer_id, amount, <span class="st">'web'</span>   <span class="kw">AS</span> channel <span class="kw">FROM</span> web_orders
<span class="kw">UNION ALL</span>
<span class="kw">SELECT</span> order_id, customer_id, amount, <span class="st">'store'</span> <span class="kw">AS</span> channel <span class="kw">FROM</span> store_orders;</div>
    <div class="pills reveal" style="margin-top:12px">
      <div class="pill"><p><b>Same number of columns</b>Each query must return the same count, matched by <strong>position</strong>, not by name. A missing column is a query error; a swapped pair is a silent data error.</p></div>
      <div class="pill"><p><b>Compatible types</b>Each position must have a common type; a STRING under an INT will not combine.</p></div>
      <div class="pill"><p><b>The first query names the result</b>Column names and aliases come from the first SELECT; later aliases are ignored. ORDER BY applies to the whole combined result, so put it last.</p></div>
    </div>` },

  /* 3 — UNION vs UNION ALL */
  { html: `
    <div class="eyebrow reveal">The exam's favorite</div>
    <h2 class="reveal">UNION vs UNION ALL</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>What UNION costs</b>Deduplicating means the engine must compare every row against every other, a shuffle and sort over the whole result. On large tables that is the expensive part of the query.</p></div>
      <div class="pill"><p><b>When UNION ALL is right</b>Two sources that cannot overlap (web orders and store orders have different ids) or where repeats are real data (the same product sold twice). It is also the correct default whenever you are not sure, because it never hides rows.</p></div>
      <div class="pill"><p><b>When UNION is right</b>You want a distinct list and the sources can overlap: customers who bought online combined with customers who bought in store, each once.</p></div>
      <div class="pill"><p><b>The tell</b>If a total drops after switching UNION ALL to UNION, rows were genuine duplicates in the data, or identical rows from two sources were merged. Check before trusting either number.</p></div>
    </div>` },

  /* 4 — INTERSECT and EXCEPT in practice */
  { html: `
    <div class="eyebrow reveal">In practice</div>
    <h2 class="reveal">INTERSECT and EXCEPT for reconciliation</h2>
    <div class="codeblock reveal"><span class="cm">-- customers active on both channels</span>
<span class="kw">SELECT</span> customer_id <span class="kw">FROM</span> web_orders
<span class="kw">INTERSECT</span>
<span class="kw">SELECT</span> customer_id <span class="kw">FROM</span> store_orders;

<span class="cm">-- rows in yesterday's snapshot missing from today's</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> orders <span class="kw">VERSION AS OF</span> 41
<span class="kw">EXCEPT</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> orders;</div>
    <p class="lead reveal" style="font-size:14px;margin-top:12px">Both deduplicate by default, like UNION (EXCEPT ALL and INTERSECT ALL keep counts). EXCEPT with time travel is the quickest way to answer "what disappeared", a pattern Chapter 24 returns to.</p>` },

  { html: `
    <div class="eyebrow reveal">Decision signals</div>
    <h2 class="reveal">Join or set operation?</h2>

      <div class="pill"><p><b>"Add the customer's name to each order"</b>A join: columns from another table, matched by key.</p></div>
      <div class="pill"><p><b>"One list of orders from two systems"</b>UNION ALL: rows from another query with the same shape.</p></div>
      <div class="pill"><p><b>"Ids in this list that are also in that list"</b>INTERSECT (or a SEMI JOIN if you need the other table's columns).</p></div>
      <div class="pill"><p><b>"Ids in this list but not that one"</b>EXCEPT (or an ANTI JOIN).</p></div>
    </div>` },

  { quiz: true,

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ----------
   v2 adds opt-in, per-card step builds on top of the v1 card engine. A card
   with no `steps` field takes exactly the v1 paths below and renders and
   behaves identically; every v2 branch is guarded by `steps` being present. */
const ENGINE_VERSION = 'v2';
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};
const stepState = {};   // v2: current revealed step per card index (mirrors `answered`)

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

/* v2: apply step visibility for one card WITHOUT touching its .in class, so a
   step reveal never replays the card-entrance .reveal stagger. Cumulative for
   normal elements (data-step <= current). Captions append by default: inside
   .stepcaps they accumulate too (data-step="0" is the pre-first-tap caption),
   and captions behind the current step get .step-past (dimmed) while the
   current one stays at full strength. A .stepcap-swap container (or legacy
   .stepcap) opts into swap: only the caption whose data-step equals the
   current step is shown. */
function applySteps(idx) {
  const cur = stepState[idx] || 0;
  els[idx].querySelectorAll('[data-step]').forEach(function(nd) {
    const s = parseInt(nd.getAttribute('data-step'), 10);
    const swapCap = nd.closest && nd.closest('.stepcap-swap, .stepcap');
    const appendCap = !swapCap && nd.closest && nd.closest('.stepcaps');
    const on = swapCap ? (s === cur) : appendCap ? (s <= cur) : (s >= 1 && s <= cur);
    nd.classList.toggle('step-on', on);
    nd.classList.toggle('step-past', !!appendCap && on && s < cur);
  });
}

/* Card layout: the only place that adds/removes .in (and thus replays reveal).
   Called on card change, never on a step advance. */
function layout() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
    applySteps(idx);   // persists built state on revisit
  });
  glow.style.background = cards[i].glow || 'transparent';
}

/* Footer/button state only. Safe to call after a step advance (no reveal). */
function updateFooter() {
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  const total = c.steps || 0;
  const stepsLeft = total > 0 && (stepState[i] || 0) < total;
  if (stepsLeft) { nextBtn.disabled = false; nextBtn.textContent = (i === 0) ? 'Begin lesson' : 'Continue'; }
  else if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
}

function render() {
  layout();
  updateFooter();
  if (cards[i].quiz) wireQuiz(els[i], i);
}

/* v2: reveal the next step of the current card. Returns true if a step was
   consumed (so the caller does not also advance the card). */
function advanceStep(idx) {
  const total = cards[idx].steps || 0;
  if (!total) return false;
  const cur = stepState[idx] || 0;
  if (cur >= total) return false;
  stepState[idx] = cur + 1;
  applySteps(idx);
  updateFooter();
  return true;
}

/* v2: reveal every remaining step at once (swipe-left escape hatch). */
function skipSteps(idx) {
  const total = cards[idx].steps || 0;
  if (!total || (stepState[idx] || 0) >= total) return false;
  stepState[idx] = total;
  applySteps(idx);
  updateFooter();
  return true;
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

/* Primary action. On a step card mid-build this reveals the next step; once
   the steps are done (or on a card with none) it advances, honoring the quiz
   gate exactly as v1 did. Shared by the Continue button and ArrowRight. */
function handleNext() {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  if (advanceStep(i)) return;
  go(i + 1);
}
nextBtn.onclick = handleNext;
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* v2: tapping anywhere on a step card advances one step; once built, a tap
   advances the card (gate permitting). Cards with no steps ignore taps, so
   this listener is inert on v1-style cards. Elements with their own behavior
   (quiz choices, links) are skipped so a tap never double-fires. */
vp.addEventListener('click', e => {
  const c = cards[i];
  if (!c.steps) return;
  if (e.target.closest('.choice, a')) return;
  if ((stepState[i] || 0) < c.steps) { advanceStep(i); return; }
  if (!nextBtn.disabled && !c.last) go(i + 1);
});

/* Keys and swipes only move between cards (or, for a step card, between
   steps). Leaving the lesson always takes a deliberate tap, so a stray swipe
   on the final card cannot navigate away. ArrowRight mirrors the Continue
   button step-wise; ArrowLeft mirrors Back. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) handleNext();
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  // Swipe left: skip any remaining steps and advance in one gesture, honoring
  // the quiz gate (updateFooter re-derives nextBtn.disabled after the skip).
  if (dx < -50 && !cards[i].last) { skipSteps(i); if (!nextBtn.disabled) go(i + 1); }
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
