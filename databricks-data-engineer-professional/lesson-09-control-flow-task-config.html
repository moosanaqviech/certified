const A = {
  cover: `<svg viewBox="0 0 320 200">
    <rect x="16" y="82" width="72" height="34" rx="9" fill="var(--surface-2)" stroke="var(--accent)" stroke-width="1.5"/>

  done: `<svg viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="38" fill="none" stroke="var(--accent)" stroke-width="3"/>

};

/* ----------  CARDS  ---------- */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.3"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 1 · Chapter 9</div>
    <h1 class="reveal">Control Flow and Task Configuration</h1>
    <p class="lead reveal">A job is more than a list of steps. Task dependencies, conditional rules, and per-task settings turn a handful of notebooks into a controllable workflow.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — concept: job is a DAG of tasks */
  { html: `
    <div class="eyebrow reveal">Concept</div>
    <h2 class="reveal">A job is a DAG of tasks</h2>
    <p class="lead reveal" style="margin-bottom:16px">Each task names the tasks it depends on. Those depends_on edges are the whole control flow.</p>
    <div class="codeblock reveal">
<span class="kw">tasks:</span><br>
&nbsp;&nbsp;- <span class="kw">task_key:</span> <span class="st">ingest</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">notebook_task:</span> {...}<br>
<br>
&nbsp;&nbsp;- <span class="kw">task_key:</span> <span class="st">transform</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="al">depends_on:</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- <span class="kw">task_key:</span> <span class="st">ingest</span>
    </div>
    <div class="pills reveal">
      <div class="pill"><p><b>Tasks with no shared edge run in parallel</b>transform and validate both depend only on ingest, so the scheduler runs them at the same time.</p></div>
    </div>` },

  /* 2 — concept: task types */
  { html: `
    <div class="eyebrow reveal">Concept</div>
    <h2 class="reveal">A task is not always a notebook</h2>
    <p class="lead reveal" style="margin-bottom:18px">The task type decides what runs. A single job can mix them freely.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Compute tasks</b>Notebook, Python script, Python wheel (from Chapter 2), JAR, or a SQL query or dashboard refresh.</p></div>
      <div class="pill"><p><b>Orchestration tasks</b>Pipeline runs a Lakeflow Declarative Pipeline. Run Job triggers another job, letting you compose workflows from smaller ones.</p></div>
      <div class="pill"><p><b>Control-flow tasks</b>If/else branches on a condition. For Each runs one task once per item in a list.</p></div>
    </div>` },

  /* 3 — concept: run_if dependency rules */
  { html: `
    <div class="eyebrow reveal">Concept</div>
    <h2 class="reveal">run_if decides when a task fires</h2>
    <p class="lead reveal" style="margin-bottom:14px">By default a task runs only if every dependency succeeded. run_if changes that rule.</p>
    <div class="codeblock reveal">
&nbsp;&nbsp;- <span class="kw">task_key:</span> <span class="st">cleanup</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">depends_on:</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- <span class="kw">task_key:</span> <span class="st">transform</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- <span class="kw">task_key:</span> <span class="st">load</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;<span class="al">run_if:</span> <span class="st">ALL_DONE</span>
    </div>
    <div class="pills reveal">
      <div class="pill"><p><b>ALL_SUCCESS</b> (default): every dependency succeeded. <b style="display:inline">ALL_DONE</b>: every dependency finished, pass or fail. <b style="display:inline">AT_LEAST_ONE_FAILED</b>: fires only when something upstream broke.</p></div>
    </div>` },

  /* 4 — concept: condition + for-each */
  { html: `
    <div class="eyebrow reveal">Concept</div>
    <h2 class="reveal">Branch and loop without extra jobs</h2>
    <p class="lead reveal" style="margin-bottom:18px">Two task types express the control flow a plain DAG cannot.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>If/else condition</b>Compares two values (often job parameters or task values) and sends the run down one of two branches. A skipped branch does not count as a failure.</p></div>
      <div class="pill"><p><b>For Each</b>Takes a list and runs its inner task once per element, in parallel up to a concurrency limit. One notebook, many inputs, no copy-paste tasks.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 5 — concept: task values */
  { html: `
    <div class="eyebrow reveal">Concept</div>
    <h2 class="reveal">Tasks pass values downstream</h2>
    <p class="lead reveal" style="margin-bottom:14px">A task can set a value that a later task reads, so a branch or a filter can react to it.</p>
    <div class="codeblock reveal">
<span class="cm"># in the "count" task</span><br>
dbutils.jobs.taskValues.<span class="al">set</span>(<br>
&nbsp;&nbsp;&nbsp;&nbsp;key = <span class="st">"rows"</span>,<br>
&nbsp;&nbsp;&nbsp;&nbsp;value = 4200)<br>
<br>
<span class="cm"># in a downstream task</span><br>
n = dbutils.jobs.taskValues.<span class="al">get</span>(<br>
&nbsp;&nbsp;&nbsp;&nbsp;taskKey = <span class="st">"count"</span>,<br>
&nbsp;&nbsp;&nbsp;&nbsp;key = <span class="st">"rows"</span>)
    </div>` },

  /* 6 — concept: task configuration (1.10) */
  { html: `
    <div class="eyebrow reveal">Concept</div>
    <h2 class="reveal">Every task carries its own config</h2>
    <p class="lead reveal" style="margin-bottom:18px">Objective 1.10: the settings that decide how, and how reliably, each task runs.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Shared job cluster</b>Tasks can share one job cluster that spins up once and tears down at the end, cheaper than an all-purpose cluster left running.</p></div>
      <div class="pill"><p><b>Retries and timeouts</b>A per-task retry policy re-runs a flaky task automatically. A timeout kills one that hangs, so it cannot block the whole job.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 7 — quiz: run_if (control flow, 1.9) */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">A final task must delete scratch files whether the transform and load tasks succeeded or failed, so nothing is left behind. Which run_if rule fits?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>ALL_SUCCESS, the default, so it runs after the pipeline completes cleanly</button>
      <button class="choice" data-correct="true"><span class="key">B</span>ALL_DONE, so cleanup runs once both upstream tasks finish, pass or fail</button>
      <button class="choice" data-correct="false"><span class="key">C</span>AT_LEAST_ONE_FAILED, so cleanup only happens when something breaks</button>

  { quiz: true,

    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">The same ingestion notebook must run for 40 source tables named in a list, ideally several at a time. What is the cleanest way to build this?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span>A For Each task wrapping the notebook, iterating the list with a concurrency limit</button>
      <button class="choice" data-correct="false"><span class="key">B</span>Forty separate notebook tasks, one per table, all depending on ingest</button>
      <button class="choice" data-correct="false"><span class="key">C</span>One notebook with a Python for-loop over the 40 tables, run as a single task</button>
    </div>

  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Chapter 9 complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">You can now shape a job's control flow with dependencies and rules, and configure each task to run reliably.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Control flow</b>depends_on builds the DAG; run_if, If/else, and For Each decide what fires and how often.</p></div>
      <div class="pill"><p><b>Task config</b>Shared job clusters, retries, timeouts, and task values make each step cheap, reliable, and connected.</p></div>
    </div>
    <div class="spacer"></div>` }

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
</html>
