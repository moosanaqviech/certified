/* ----------  ART  (custom SVGs, referenced from cards as ${A.name})  ---------- */

/* ----------  CARDS  ---------- */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 1 · Chapter 8</div>

    <h1 class="reveal">Structured Streaming vs. Lakeflow Pipelines</h1>
    <p class="lead reveal">Lakeflow Declarative Pipelines run on Structured Streaming underneath. The question is never which engine, it is who owns the wiring: you, or the platform.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — shared ground */
  { html: `
    <div class="eyebrow reveal">Shared ground</div>
    <h2 class="reveal">One engine under both</h2>
    <p class="lead reveal" style="margin-bottom:18px">Everything a streaming table does, Structured Streaming is doing for it.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Same incremental core</b>Both read sources incrementally, checkpoint their progress, and recover to exactly-once results after a failure.</p></div>
      <div class="pill"><p><b>Same sources</b>Auto Loader, Kafka, and Delta tables feed either one. Chapter 4's cloudFiles reader is the same code in both worlds.</p></div>
      <div class="pill"><p><b>Same clusters underneath</b>Both ultimately run Spark jobs. The difference is everything wrapped around that job, not the job itself.</p></div>
    </div>` },

  /* 2 — option A: Structured Streaming */
  { html: `
    <div class="eyebrow reveal" style="color:var(--ss)">Option A</div>
    <h2 class="reveal" style="color:var(--ss)">Raw Structured Streaming</h2>
    <p class="lead reveal" style="margin-bottom:18px">readStream to writeStream, in your own job. Total control, total responsibility.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Any sink, any logic</b>foreachBatch can write to Kafka, an external database, or three places at once. Stateful operators like mapGroupsWithState are available for custom session logic.</p></div>
      <div class="pill"><p><b>You own the wiring</b>Checkpoint locations, trigger intervals, retries, monitoring, and orchestration between streams are all yours to build and maintain.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 3 — option B: Lakeflow Declarative Pipelines */
  { html: `
    <div class="eyebrow reveal" style="color:var(--lp)">Option B</div>
    <h2 class="reveal" style="color:var(--lp)">Lakeflow Declarative Pipelines</h2>
    <p class="lead reveal" style="margin-bottom:18px">The managed wrapper from Chapters 4 through 7. Less surface area, far less to operate.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>The platform owns the wiring</b>Checkpoints, retries, the DAG, event logs, and data-quality expectations all come built in. apply_changes handles CDC without a hand-written merge.</p></div>
      <div class="pill"><p><b>The constraint</b>Results land as streaming tables and materialized views in Unity Catalog. Writing to an arbitrary external sink is not what it is for.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 4 — side-by-side comparison */
  { html: `
    <div class="eyebrow reveal">Side by side</div>
    <h2 class="reveal" style="font-size:24px">Control vs. managed</h2>
    <div class="reveal" style="overflow-x:auto; margin-top:12px;">
      <table style="width:100%; border-collapse:collapse; font-size:12.5px;">

          <td style="padding:10px 6px; color:var(--ink);">Anything</td>
          <td style="padding:10px 6px; color:var(--ink);">Delta tables in UC</td>

        <tr style="border-bottom:1px solid var(--line);">
          <td style="padding:10px 6px; color:var(--ink-soft);">Checkpoints, retries</td>
          <td style="padding:10px 6px; color:var(--ink);">You manage</td>

          <td style="padding:10px 6px; color:var(--ink-soft);">Data quality</td>

  /* 5 — decision signal */
  { html: `
    <div class="eyebrow reveal">Decision signal</div>
    <h2 class="reveal">Ask where the results must land</h2>
    <p class="lead reveal" style="margin-bottom:18px">The sink decides faster than any other signal.</p>
    <div class="pills reveal">
      <div class="pill"><p><b style="color:var(--lp)">Delta tables in the lakehouse: Lakeflow Pipelines</b>Medallion pipelines that end in queryable tables get expectations, CDC handling, and managed operations for free. This is the default choice.</p></div>
      <div class="pill"><p><b style="color:var(--ss)">External sinks or custom state: Structured Streaming</b>Pushing results to Kafka or an external system, or logic that needs arbitrary stateful operators, requires the raw API. Reach for it when the managed wrapper cannot express the job.</p></div>
    </div>` },

  /* 6 — quiz: favors Structured Streaming */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:21px">A fraud team needs each scored transaction pushed to a Kafka topic within seconds, so a downstream service can block cards. Which approach fits?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span>Raw Structured Streaming with foreachBatch writing to the Kafka sink</button>
      <button class="choice" data-correct="false"><span class="key">B</span>A Lakeflow streaming table, since it processes rows incrementally too</button>

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
</html>
