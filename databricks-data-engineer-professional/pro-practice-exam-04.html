<title>Practice Exam · Databricks DE Professional</title>

<style>
  /* =====================================================================
     EXAM SHELL - frozen. Do not edit anything in this style block.
     All per-exam customization lives in the EXAM PAYLOAD script section.
  ===================================================================== */
  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;
    --ink-soft:#a7a59f; --ink-faint:#6b6a66; --gold:#e3b84a; --green:#34d3a6; --red:#e8625c;
    --line:rgba(255,255,255,0.08);
    --display:"Fraunces",Georgia,serif; --body:"Hanken Grotesk",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:radial-gradient(1100px 650px at 50% -8%,#1a1d29 0%,transparent 58%),var(--bg);font-family:var(--body);color:var(--ink);min-height:100vh;line-height:1.5;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* sticky top */
  .top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .timer.warn{color:var(--gold);}
  .timer svg{opacity:.7;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  /* intro */
  .intro{text-align:center;margin:auto 0;padding:30px 0;}
  .intro .badge{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px;}
  .intro h1{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.05;letter-spacing:-0.02em;margin-bottom:16px;}
  .intro p{color:var(--ink-soft);font-size:15.5px;max-width:30em;margin:0 auto 14px;}
  .facts{display:flex;justify-content:center;gap:0;margin:24px 0 28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .fact{flex:1;padding:16px 10px;}
  .fact+.fact{border-left:1px solid var(--line);}
  .fact b{display:block;font-family:var(--display);font-size:22px;font-weight:600;color:var(--gold);}
  .fact span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#14110c;font-weight:700;font-size:16px;padding:15px 30px;border-radius:14px;border:none;cursor:pointer;transition:transform .15s ease;font-family:var(--body);}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.35;pointer-events:none;}

  /* question */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .qnum{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:0.04em;}
  .flag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-faint);background:transparent;border:1px solid var(--line);border-radius:100px;padding:5px 12px;cursor:pointer;transition:.15s;font-family:var(--body);}
  .flag.on{color:var(--gold);border-color:var(--gold);background:rgba(227,184,74,0.1);}
  .qtext{font-size:18px;line-height:1.5;font-weight:500;margin-bottom:20px;}
  .qtext code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:5px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);line-height:1.4;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:rgba(255,255,255,0.2);}
  .opt.sel{border-color:var(--gold);background:rgba(227,184,74,0.08);}
  .opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .opt.sel .key{background:var(--gold);color:#14110c;}

  /* review states */
  .opt.correct{border-color:var(--green);background:rgba(52,211,166,0.1);}
  .opt.correct .key{background:var(--green);color:#072018;}
  .opt.incorrect{border-color:var(--red);background:rgba(232,98,92,0.1);}
  .opt.incorrect .key{background:var(--red);color:#2a0a08;}
  .explain{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .explain b{color:var(--ink);}

  /* nav dots */
  .nav-dots{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 4px;justify-content:center;}
  .dot{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-faint);cursor:pointer;transition:.15s;font-family:var(--body);}
  .dot.answered{background:var(--surface-2);color:var(--ink);border-color:rgba(255,255,255,0.18);}
  .dot.current{border-color:var(--gold);color:var(--gold);}
  .dot.flagged{box-shadow:inset 0 0 0 2px rgba(227,184,74,0.5);}

  /* footer nav */
  .foot{display:flex;gap:12px;margin-top:24px;}
  .foot .btn{flex:1;}

  /* results */
  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:140px;height:140px;margin:6px auto 18px;}
  .scorering svg{transform:rotate(-90deg);}
  .scorering .tr{stroke:rgba(255,255,255,0.1);}
  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scorering .ctr b{font-family:var(--display);font-size:38px;font-weight:600;line-height:1;}
  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .verdict{font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:6px;}
  .verdict.pass{color:var(--green);}
  .verdict.fail{color:var(--gold);}
  .res p{color:var(--ink-soft);font-size:14.5px;max-width:28em;margin:0 auto 22px;}
  .res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}
</style>

<body>
<div class="app">
  <div class="top">
    <span class="lbl" id="topLbl">Practice Exam</span>
    <span class="timer" id="timer" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6" stroke-linecap="round"/></svg>
      <span id="timerVal">20:00</span>
    </span>
  </div>
  <div class="pbar"><i id="pbar"></i></div>

  <div class="body-wrap" id="root"></div>

<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 4",
  badge: "Databricks DE Professional",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer.",
  coverage: "Covers all 16 chapters across Units 1-4: Developing Code with Python and SQL, Data Ingestion and Acquisition, Transformation Cleansing and Quality, and Data Sharing and Federation.",
  minutes: 70,
  pass: 70
};

const QUESTIONS = [
  /* Ch 01 - DABs Project Structure for Scalable Python */
  {
    q:`Two engineers on the same bundle repo each run <code>databricks bundle deploy -t dev</code> on the same afternoon without touching databricks.yml, and each ends up with their own separate copy of every resource. What produces that separation automatically?`,
    opts:[
      `mode: development on the dev target prefixes resource names and deploy paths with the deploying user's identity`,
      `The CLI queues deploys and serializes them one at a time, so no two ever run concurrently`,
      `Each engineer must manually rename resources in their own fork of databricks.yml before deploying`,
      `databricks.yml assigns a random suffix to every deploy regardless of target`
    ],
    correct:0,
    explain:`mode: development automatically prefixes resource names and paths with the deploying user's identity, which is exactly why two engineers deploying the same bundle land in separate, non-colliding copies with no manual renaming involved. The CLI does not serialize or queue deploys, and nothing about databricks.yml assigns random suffixes on its own.`
  },
  {
    q:`A reviewer sees a new job parameter default hardcoded as a long currency-conversion formula string inside <code>resources/jobs.yml</code>, instead of a reference to a function. What is the concern, and what should replace it?`,
    opts:[
      `No concern; job parameters in resources/*.yml can carry arbitrary computed logic`,
      `The formula belongs in src/ as a tested, importable function; resources/*.yml should only declare structure, not carry business logic`,
      `The formula should move into databricks.yml, since that is where all computed defaults belong`,
      `The formula should be duplicated across every job that needs it, since resources/*.yml files cannot share code`
    ],
    correct:1,
    explain:`resources/*.yml is meant to declare what runs and when, clusters, schedules, task graphs, not carry embedded business logic; a currency-conversion formula belongs in src/ as an importable, unit-testable function instead. databricks.yml only holds bundle-level config like targets, not computed defaults, and nothing requires duplicating logic across files instead of sharing a function.`
  },
  {
    q:`A bundle has both a dev and a prod target defined. An engineer runs <code>databricks bundle run nightly_etl</code> with no <code>-t</code> flag and is unsure which target's version of the job actually fires. What determines that?`,
    opts:[
      `It always resolves to whichever target was deployed most recently, regardless of flags`,
      `It fails outright; the CLI requires -t on every run command with no default`,
      `The command uses whatever target is configured as the bundle's default, or the CLI prompts if none is set`,
      `It runs the job under every defined target simultaneously`
    ],
    correct:2,
    explain:`Without an explicit -t flag, the CLI falls back to the bundle's configured default target, or prompts if none is set. It does not run every target at once and does not simply track deploy recency. Being explicit with -t dev or -t prod is exactly how a team avoids this ambiguity in the first place.`
  },
  /* Ch 02 - Libraries and Dependencies: PyPI, Wheels, Source Archives */
  {
    q:`A pipeline that ran fine for months suddenly breaks after a scheduled trigger, with errors tracing to a breaking API change in a dependency. The team finds the dependency was declared as <code>pandas</code> with no version, not <code>pandas==2.2.0</code>. What is the direct cause, and the fix?`,
    opts:[
      `PyPI itself is unreliable; switch to a source archive instead to avoid this`,
      `The dependency should have been installed with %pip install instead of declared in the bundle`,
      `Nothing could have prevented this; dependency breakage is unavoidable over time`,
      `An unpinned dependency can resolve to a newer, breaking version on a later install; pin it to an exact version instead`
    ],
    correct:3,
    explain:`Leaving a dependency unpinned means later installs can silently resolve to a newer version, including one with a breaking change; pinning to an exact version like pandas==2.2.0 is the fix, since it makes every install reproducible. Source archives address a different concern (build requirements), not version drift, and %pip install would make the dependency less reproducible, not more, since it is session-scoped.`
  },
  {
    q:`A job runs on a minimal, compiler-free cluster image. A required dependency's latest version only ships a source distribution for the cluster's Python version, no wheel. What is the most likely outcome, and the safer long-term fix?`,
    opts:[
      `The install likely fails, since building the source archive needs a compiler and headers the image lacks; pin to the last version that shipped a wheel, or build one in-house`,
      `Nothing breaks; pip builds source distributions without needing any compiler`,
      `Databricks automatically swaps in a wheel from a different Python version to compensate`,
      `The job falls back to %pip install, which does not require a compiler for source builds`
    ],
    correct:0,
    explain:`With no wheel available, pip has to build the source archive locally, which needs a compiler and headers a minimal image may not have, so the install can fail; pinning to a version with a wheel, or building one in-house, sidesteps the missing build tools. Databricks does not auto-substitute wheels across Python versions, and %pip install still triggers the same local build for an unwheeled package.`
  },
  /* Ch 03 - Python and Pandas UDFs */
  {
    q:`A pipeline defines a Python UDF that runs a regex to check whether a string looks like a valid phone number, when Spark's built-in <code>regexp_like()</code> already covers the same pattern. What is the strongest argument for removing the UDF?`,
    opts:[
      `UDFs cannot use regular expressions at all, so this one must be broken`,
      `regexp_like() runs inside Catalyst's optimized path with no data leaving the JVM; the UDF adds serialization overhead a built-in function does not pay`,
      `Removing the UDF would only matter if the table were streaming, not batch`,
      `There is no real difference; both approaches compile down to the same execution plan`
    ],
    correct:1,
    explain:`Reaching for a UDF only makes sense when nothing built-in covers the case; here regexp_like() already does, and it runs entirely inside Catalyst's optimized path with no Python process involved, while any UDF pays serialization overhead crossing that boundary. UDFs support regex fine, batch versus streaming does not change this trade-off, and a UDF is not compiled into the same optimized plan as a built-in function.`
  },
  {
    q:`A pandas UDF loads a large spaCy NLP model from disk inside the function body, and that load time dominates the job's runtime because it repeats on every batch. Which function signature fixes this without changing what the UDF computes?`,
    opts:[
      `A scalar Series -> Series pandas UDF, since scalar UDFs never reload state`,
      `A plain row-at-a-time @udf, since it avoids batch-level state entirely`,
      `Iterator[pd.Series] -> Iterator[pd.Series], loading the model once before iterating over batches instead of once per batch`,
      `mapInPandas with a smaller batch size, so the reload happens more often but each one is cheaper`
    ],
    correct:2,
    explain:`The iterator-of-Series signature lets setup code, like loading a model, run once before the loop over batches begins, so the expensive load happens a single time instead of once per batch. A scalar Series to Series pandas UDF still gets invoked fresh per batch, a plain row-at-a-time UDF would reload it once per row, far worse, and shrinking batch size only makes the reload happen more often.`
  },
  /* Ch 04 - Production Pipelines: Lakeflow Declarative Pipelines + Auto Loader */
  {
    q:`A bronze table ingests JSON via Auto Loader. A new field starts appearing in files from an upstream source that changed its schema last week. The pipeline keeps running without failing, and the new field shows up in the target table automatically. What made that possible?`,
    opts:[
      `Auto Loader ignores schema changes entirely and simply drops any unrecognized field`,
      `The pipeline restarted from scratch automatically the moment the new field appeared`,
      `JSON files never carry a schema, so there was nothing for Auto Loader to reconcile`,
      `cloudFiles.schemaLocation persisted the previously inferred schema along with its evolution history, so the new column was added rather than rejected`
    ],
    correct:3,
    explain:`schemaLocation is where Auto Loader checkpoints the schema it inferred and tracks its evolution history; that is what lets a genuinely new column be added automatically instead of breaking the stream or being silently dropped. Auto Loader does not restart from scratch on a schema change, and JSON is semi-structured, its schema is inferred at read time, not absent entirely.`
  },
  {
    q:`An engineer insists a separate orchestration tool is needed to guarantee silver_orders finishes before gold_orders runs in a Lakeflow Declarative Pipeline, since "nothing else could know the order." Is a separate orchestrator required here?`,
    opts:[
      `No; the pipeline parses gold_orders's function body for a spark.read.table("silver_orders") reference and builds that dependency edge automatically at deploy time`,
      `Yes, since Lakeflow Declarative Pipelines have no concept of dependency ordering on their own`,
      `Yes, but only because this involves two different tables rather than two views`,
      `No, but only if both tables happen to share the same trigger interval`
    ],
    correct:0,
    explain:`Lakeflow Declarative Pipelines parse every table function to find read references like spark.read.table("silver_orders") and build the dependency DAG from them automatically; no external orchestrator, trigger alignment, or table-versus-view distinction changes that. This automatic inference is the core of the declarative model.`
  },
  /* Ch 05 - Automating Jobs: UI, API, and CLI */
  {
    q:`A platform team wants every job deployed through Terraform-style, repeatable automation with no manual UI steps at any point in the pipeline. Which interface do they need to build around, and what makes the UI unsuitable for this specific goal?`,
    opts:[
      `The UI, since it is the only interface that guarantees a job looks correct before it runs`,
      `The CLI or the REST API it wraps; the UI requires a human clicking through it, which breaks repeatable, unattended automation`,
      `Any of the three interchangeably, since they all read and write the same job spec`,
      `The REST API only; the CLI cannot be invoked from an automation pipeline`
    ],
    correct:1,
    explain:`Repeatable, unattended automation needs something scriptable and non-interactive, which the CLI (often via bundle deploy) and REST API both are, while the UI fundamentally requires a person to click through it. The three interfaces do share one underlying job spec, but that does not make them equally fit for unattended automation, and the CLI runs perfectly well inside a script or pipeline.`
  },
  {
    q:`An analyst wants to test a notebook once against a modified date range, with no permanent job definition left behind afterward for anyone to stumble on later. Which API call is built for exactly this?`,
    opts:[
      `jobs/run-now, since it accepts one-time parameter overrides on any job`,
      `jobs/create, followed immediately by a manual delete once the test finishes`,
      `jobs/runs/submit, which runs the task once with no job definition persisted at all`,
      `jobs/list, filtered to jobs created in the last hour`
    ],
    correct:2,
    explain:`runs/submit is designed for exactly this: an ephemeral, one-off run with nothing saved behind it. run-now does accept overrides, but only against a job that already exists and stays in its run history. create-then-delete works but leaves a needless job definition sitting around in between, and jobs/list only reads existing state, it does not run anything.`
  },
  /* Ch 06 - Streaming Tables vs Materialized Views (TO) */
  {
    q:`A bronze table ingests ad-impression events via Auto Loader. Every impression is a brand-new, immutable event; nothing already landed is ever edited or removed. Which table type fits, and what would a materialized view add here that this source never needs?`,
    opts:[
      `A materialized view, since ad-tech data is always high volume and volume favors materialized views`,
      `Neither; ad-impression events should always be processed as a one-time batch load`,
      `A materialized view, because streaming tables cannot ingest through Auto Loader`,
      `A streaming table; its incremental, process-once model fits an append-only source exactly, and a materialized view would only add an unnecessary recompute cost`
    ],
    correct:3,
    explain:`When a source only ever appends, a streaming table's incremental, process-once semantics fit exactly, with lower latency and nothing lost. A materialized view would still work, but it pays a recompute or incremental-maintenance cost to guard against upstream changes this strictly append-only source never produces. Volume is not the deciding signal here, and streaming tables commonly read from Auto Loader.`
  },
  {
    q:`A gold table reports current stock levels per warehouse from a silver inventory table that gets corrected whenever a physical recount finds a discrepancy (existing rows are updated, not just appended). Which table type keeps gold accurate after a recount, and why would a streaming table fall short?`,
    opts:[
      `A materialized view; it recomputes or incrementally maintains its result against silver's current state, so a corrected row is reflected, unlike a streaming table which only ever sees new rows`,
      `A streaming table, since it processes new corrections with the lowest latency`,
      `A streaming table paired with a manual foreachBatch step layered on top`,
      `Either type works equally well as long as the pipeline runs frequently`
    ],
    correct:0,
    explain:`A streaming table only ever processes new rows; a recount that updates an existing silver row is invisible to it, or gets misread as a brand-new event. A materialized view recomputes or incrementally maintains its result against silver's current state, so the corrected stock level flows through correctly. foreachBatch is a raw Structured Streaming construct, not something layered onto a Lakeflow streaming table, and running more often does not change what a streaming table is able to see.`
  },
  /* Ch 07 - CDC with the AUTO CDC API */
  {
    q:`A subscription-status CDC feed occasionally redelivers a message due to consumer retries after a network blip. Two copies of the same change for subscriber_id 501 arrive, both carrying identical sequence_by values. What keeps the target table correct despite the duplicate delivery?`,
    opts:[
      `create_auto_cdc_flow rejects the second copy outright as a duplicate sequence value`,
      `keys and sequence_by together make the operation effectively idempotent: applying either copy of an identical, same-key, same-sequence change lands the target in the same state`,
      `The pipeline fails, since create_auto_cdc_flow cannot process two records with the same sequence_by value`,
      `Only whichever copy is processed first is applied; the second is always silently discarded regardless of content`
    ],
    correct:1,
    explain:`keys identifies which target row a change belongs to, and sequence_by decides which of several changes to that key wins; when both copies carry the same key and the same sequence value, applying either one produces the same result, making a redelivered duplicate effectively harmless. Nothing in create_auto_cdc_flow rejects a repeated sequence value or fails on it, and it is the shared key and sequence value, not arrival order, that explains why the duplicate is harmless.`
  },
  {
    q:`A compliance team must be able to show what a user's consent preferences were on any past date, not just today. Which AUTO CDC configuration provides that, and what does it add to the target table?`,
    opts:[
      `stored_as_scd_type=1, the default, since it is the simplest option to configure`,
      `apply_as_deletes, since historical answers require removing stale preference rows`,
      `stored_as_scd_type=2, which retains every version of a row and adds __START_AT and __END_AT columns marking when each version was valid`,
      `sequence_by pointed at the user's original account-creation date instead of the change timestamp`
    ],
    correct:2,
    explain:`A point-in-time question requires retained history, which only SCD Type 2 provides: every change becomes its own row bounded by __START_AT and __END_AT, so a past consent state is still queryable. Type 1 overwrites in place and only shows the current value, apply_as_deletes governs how source deletes are handled rather than history retention, and sequence_by controls ordering, not what gets stored.`
  },
  /* Ch 08 - Structured Streaming vs Lakeflow Pipelines (TO) */
  {
    q:`A pipeline reads Kafka and must push each processed event as an HTTP call to a partner's REST API within seconds, with no Delta table involved in that hop at all. Which approach fits, and what single fact decides it?`,
    opts:[
      `A Lakeflow streaming table, since it processes incrementally with lower latency than raw Structured Streaming`,
      `A materialized view refreshed every few seconds, since materialized views can call external APIs directly`,
      `Either approach works equally well, since both run on the same Structured Streaming engine underneath`,
      `Raw Structured Streaming with foreachBatch, since the sink is an external REST API, not a Delta table in Unity Catalog, which the managed pipeline cannot target`
    ],
    correct:3,
    explain:`The deciding fact is the sink: Lakeflow Declarative Pipelines produce streaming tables and materialized views inside Unity Catalog, never arbitrary external calls, so a REST API sink rules it out regardless of latency. Raw Structured Streaming with foreachBatch can call any external system per micro-batch, which is exactly what is needed. Materialized views are still Delta objects in Unity Catalog, not a general external-call mechanism, and sharing an engine underneath does not make the two interchangeable when the target differs.`
  },
  {
    q:`A three-person team hand-manages checkpoint paths, retry policies, and duplicated null-checks across four raw Structured Streaming jobs that all land bronze-silver-gold Delta tables in Unity Catalog. What is the strongest fix for their rising operational load?`,
    opts:[
      `Migrate the four jobs into a Lakeflow Declarative Pipeline; checkpoints, retries, and data-quality expectations come managed, and their sink already fits what it targets`,
      `Keep the current design, since medallion architectures require foreachBatch for correctness`,

    correct:0,

  {
    q:`A job's ingest task feeds two parallel tasks, validate and enrich. A final notify_oncall task should alert only if either of those two failed, and stay silent after a clean run. Which run_if setting on notify_oncall is correct?`,

    correct:2,
    explain:`A For Each task runs one inner task per list element with a configurable concurrency limit, so 12 regions need one task definition, not 12, and the limit of 4 directly matches the rate-limit requirement. Twelve hardcoded tasks is the duplication this feature exists to remove, an internal loop runs everything sequentially on one task with no real parallelism, and run_if governs conditional execution, not iteration or concurrency.`

  /* Ch 10 - Testing Pipelines: assertDataFrameEqual, transform, Debugger */
  {
    q:`A test compares actual and expected DataFrames holding the same rows, but a window-function step reordered them, and a separately computed ratio reads 0.3333333333334 against an expected 1/3. Using assertDataFrameEqual with default settings, what happens?`,

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

let state = { screen:"intro", i:0, answers:Array(QUESTIONS.length).fill(null), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a!==null).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i]===j?'sel':''}" data-j="${j}">
          <span class="key">${"ABCD"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j]!==null) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{ state.answers[i] = Number(el.dataset.j); render(); setProgress(); };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a===null).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(state.answers[idx]===Q.correct) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], ok=mine===Q.correct;
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(j===Q.correct) cls+=" correct";
          else if(j===mine) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCD"[j]}</span><span>${o}${j===mine?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:Array(QUESTIONS.length).fill(null), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
