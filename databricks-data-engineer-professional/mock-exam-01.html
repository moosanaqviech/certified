<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Full Mock 1",
  badge: "Databricks DE Professional",
  blurb: "Sit it cold, under exam conditions: fifty-nine scenario questions in two hours, sampled across all ten exam sections at their official weights, no feedback until you submit. Pick the single best answer.",
  coverage: "Sealed mock 1 of 2. Samples all 37 chapters by section weight: Developing Code 22%, Ingestion 7%, Transformation and Quality 10%, Sharing and Federation 5%, Monitoring and Alerting 10%, Cost and Performance 13%, Security and Compliance 10%, Governance 7%, Debugging and Deploying 10%, Data Modelling 6%. None of these questions appear in the unit practice exams.",
  minutes: 120,
  pass: 70
};
const QUESTIONS = [
  /* Coverage plan (59 questions, every chapter at least once, interleaved):
     Unit 1  Developing Code with Python and SQL   13  Ch 1 x2, 2, 3, 4, 5, 6 x2, 7, 8, 9 x2, 10
     Unit 2  Data Ingestion and Acquisition         4  Ch 11 x2, 12 x2
     Unit 3  Transformation, Cleansing, Quality     6  Ch 13 x3, 14 x3
     Unit 4  Data Sharing and Federation            3  Ch 15, 16 x2
     Unit 5  Monitoring and Alerting                6  Ch 17 x2, 18, 19, 20 x2
     Unit 6  Cost and Performance Optimisation      8  Ch 21 x2, 22 x2, 23, 24, 25 x2
     Unit 7  Security and Compliance                6  Ch 26, 27 x2, 28 x2, 29
     Unit 8  Data Governance                        4  Ch 30 x2, 31 x2
     Unit 9  Debugging and Deploying                6  Ch 32 x2, 33 x2, 34 x2
     Unit 10 Data Modelling                         3  Ch 35, 36, 37 */
  /* Ch 9 - Control flow and task configuration */
  {
    q:`A retailer's nightly job has a <code>fetch_rates</code> task that calls a partner API. About one run in twenty, the call fails with a transient timeout and the whole job stops; the on-call engineer then reruns it by hand and it succeeds. The team wants the job to recover on its own without changing the dependency graph. Which task setting fits?`,
    opts:[
      "Set run_if: ALL_DONE on every downstream task so the job continues past the failed fetch_rates and finishes without the rates, which the operator can backfill later",
      "Configure a per-task retry policy on fetch_rates, so a transient failure re-runs that task automatically",
      "Add a task timeout on fetch_rates so a hanging API call is killed quickly and the operator is paged sooner to rerun the job",
      "Wrap fetch_rates in a For Each task over a list of two attempts so the second iteration runs if the first one fails"
    ],
    correct:1,
    explain:`A per-task retry policy is the task configuration built for flaky steps: the failed task is re-run automatically and the rest of the job proceeds as normal once it succeeds. ALL_DONE (the tempting control-flow fix) lets downstream tasks run without the rates they depend on, and a timeout only shortens how long a hung call takes to fail; it never retries anything.`
  },
  /* Ch 22 - Deletion vectors and Liquid Clustering */
  {
    q:`A payments team's 20 TB <code>transactions</code> table is Liquid Clustered on <code>(merchant_id, txn_date)</code>. During a cost review an engineer notices the nightly <code>OPTIMIZE</code> finishes in minutes and rewrites only a small fraction of the files, and concludes the command "is not really clustering the table". What is the correct reading?`,
    opts:[
      "The engineer is right: OPTIMIZE only compacts small files, and clustering is applied solely by OPTIMIZE ZORDER BY, which the nightly job is not running and should be added",
      "The engineer is right: a Liquid Clustered table is reclustered only when its keys are redefined with ALTER TABLE, so a routine OPTIMIZE has no clustering effect",
      "The engineer is partly right: OPTIMIZE reclusters only the newest partition each night, so older data drifts until the table is recreated",
      "It is working as designed: a routine OPTIMIZE on a Liquid Clustered table rewrites only the data that drifted out of its clustered layout, so it is usually fast"
    ],
    correct:3,
    explain:`Incremental maintenance is the point of Liquid Clustering: routine OPTIMIZE touches only what has drifted, which is why it is cheap on a 20 TB table, and OPTIMIZE FULL is reserved for a first-time enable or a clustering-key change. The Z-Order reading (the tempting one for engineers used to the older layout) is the contrast case: Z-Order is a one-time sort that decays, and it cannot coexist with Liquid Clustering at all.`
  },
  /* Ch 1 - DABs project structure */
  {
    q:`A telecom's security audit finds that production jobs deployed from a Databricks Asset Bundle run under the identity of whichever engineer last ran <code>databricks bundle deploy -t prod</code>, so run ownership changes with every deploy. Which change to <code>databricks.yml</code> fixes this?`,
    opts:[
      "Set run_as with a service_principal_name under the prod target, so every deployment of that target runs as the service principal regardless of who deploys",
      "Switch the prod target to mode: development, so each deploy is prefixed with the deployer's identity and the run owner is at least recorded in the resource name",
      "Move the job definitions from resources/ into the src/ package, so the Python code rather than the YAML declares the identity the job runs under",
      "Add a single named engineer to the bundle's permissions block as the only deployer, so the run identity is predictable even though it is still a person"
    ],
    correct:0,
    explain:`The production target is where the bundle declares its run identity: mode: production with run_as pointing at a service principal deploys to one fixed path and runs as that non-human identity no matter who triggers the deploy. Switching to mode: development (the tempting misread) does the opposite of what production needs: it prefixes paths per user and still runs as a person, and resources/ not src/ is where deployment configuration belongs.`
  },
  /* Ch 14 - Quarantining bad data with expectations */
  {
    q:`A logistics pipeline put <code>@dp.expect_or_fail</code> on its bronze shipment-scans table to require a non-null <code>carrier_code</code>. A newly onboarded carrier sends about 0.5% of scans with a null code, so every update now fails and none of the other 99.5% of scans land. The team wants good rows flowing and the bad rows kept somewhere reviewable. What should they do?`,
    opts:[
      "Keep expect_or_fail on bronze and add a retry policy to the pipeline, since a null that is transient on one update usually resolves on the next",
      "Replace it with plain expect on bronze so the null rows land in the production table and are only counted in the event log",
      "Leave bronze permissive, apply expect_or_drop on silver, and add a quarantine dataset selecting rows where carrier_code IS NULL",
      "Keep expect_or_fail but move it from bronze to the silver table, so bronze keeps ingesting and only silver halts when a null arrives"
    ],
    correct:2,
    explain:`Fail severity is for a violation that would silently corrupt everything downstream, such as a broken key; a 0.5% null rate on one attribute has a small blast radius, so drop-plus-quarantine keeps production clean while preserving the evidence. Moving expect_or_fail to silver (the tempting half-measure) still rolls back every silver update over the same small problem, so the curated table stops refreshing instead of the raw one.`
  },
  /* Ch 27 - Row filters and column masks */
  {
    q:`A national benefits agency keeps one <code>claims</code> table. Caseworkers in each regional office may see every column, but only the rows for their own region, and the agency does not want per-region copies or a view per office to maintain. Which mechanism fits?`,
    opts:[
      "A column mask on the region column that returns NULL for any row outside the caseworker's region, so other regions' rows become unusable",
      "A row filter function that checks the row's region against the caseworker's groups with is_account_group_member, bound with SET ROW FILTER ... ON (region)",
      "One view per regional office carrying a WHERE region = ... clause, with SELECT granted on each view to that office's group and the base table hidden from everyone",
      "A GRANT SELECT on the table to each regional group with a predicate in the grant statement, so Unity Catalog filters the rows at grant time"
    ],
    correct:1,
    explain:`A row filter is a boolean SQL function evaluated per row at query time against the querying user's identity, so one physical table serves every office its own rows. A column mask (the tempting mix-up) reshapes a value but never removes a row, so other regions' rows would still be visible, and Unity Catalog grants carry no predicate.`
  },
  /* Ch 33 - Job repair and parameter overrides */
  {
    q:`A payments settlement job has five tasks. Task 3, <code>write_ledger</code>, failed partway through after appending roughly half of its rows to the ledger table; tasks 1 and 2 succeeded. The on-call engineer is about to click Repair Run. What must be checked first?`,
    opts:[
      "Whether write_ledger is idempotent: Repair Run reruns it as written and does not clean up the partial output, so a plain append would duplicate rows",
      "Whether tasks 1 and 2 will be rerun as well, since Repair Run restarts the run from the first task and discards their earlier output unless they are explicitly excluded",
      "Whether the job has only one task, since Repair Run is offered for single-task jobs and a multi-task job must be rerun with Run Now instead",
      "Whether the original job cluster is still running, since a repair must execute on the exact cluster instance that ran the failed attempt"
    ],
    correct:0,
    explain:`Repair Run reruns only the failed task and its dependents while keeping successful tasks' results, but whether a rerun is safe depends entirely on the task's own logic: the platform does not undo a partial write. The claim that repair restarts from task 1 (the tempting worry) is backwards: preserving tasks 1 and 2 is precisely what repair is for, and repair applies only to jobs with two or more tasks.`
  },
  /* Ch 6 - Streaming tables vs materialized views (TO) */
  {
    q:`A public-sector pipeline builds a gold table that joins a silver <code>benefit_payments</code> stream to a <code>postcode_region</code> reference table. The reference table is reloaded every night by a full overwrite from a national registry, and about two hundred postcodes change region each month. Which table type should the gold table be, and why?`,
    opts:[
      "A streaming table, since the payments side is append-only and that side determines the table type for the whole join",
      "A streaming table reading the reference table with skipChangeCommits, so the nightly overwrite does not break the stream and the payments side keeps its low latency",
      "A materialized view, because the nightly overwrite is a cheap operation that a streaming table cannot start from",
      "A materialized view, because the reference table's rows are rewritten after they land and only a materialized view keeps the join current against them"
    ],
    correct:3,
    explain:`The decision signal is whether any source changes after landing or only grows; a nightly full overwrite rewrites existing rows, so a streaming table, which only ever sees new rows, would either break or keep joining to stale regions. The skipChangeCommits variant (the tempting way to keep the stream alive) explicitly discards the changed rows, which is the opposite of what a region correction needs.`
  },
  /* Ch 17 - System tables: cost, audit, utilization */
  {
    q:`A telecom platform team must rename the <code>imsi</code> column in <code>silver.subscribers</code> and needs to know every downstream table that was built from that column over the last three months, across all workspaces, before making the change. Which source answers this?`,
    opts:[
      "system.billing.usage grouped by the tables each job wrote, which lists the outputs of every job that read silver.subscribers",
      "The Jobs REST API, which returns the input and output tables of every job run for a given source table across all workspaces in the account",
      "system.access.column_lineage (and table_lineage), which record which tables and columns fed which downstream tables",
      "Catalog Explorer's comment on the column, where the owners of dependent tables are expected to have registered themselves"
    ],
    correct:2,
    explain:`Lineage lives in the access schema: table_lineage and column_lineage reconstruct which tables and columns fed which downstream objects from the account's query history, which is exactly the blast-radius question a rename raises. The Jobs REST API (the tempting programmatic option) reports run status and configuration, not data flow, and billing records what was consumed, not what was read or written.`
  },
  /* Ch 36 - Liquid Clustering vs partitioning vs Z-Order (TO) */
  {
    q:`A telecom is migrating to Unity Catalog and the plan says "convert every table to Liquid Clustering". One table is a 60 TB call-detail archive partitioned by <code>region</code> (twelve stable values that never change), created years ago and queried almost always by region. Which call fits for this table?`,
    opts:[
      "Leave it partitioned: a very large table on a stable, low-cardinality key that never changes is the narrow case where partitioning's rigidity costs nothing",
      "Convert it to Liquid Clustering while keeping the region partitioning, since the two layouts stack and each handles a different query shape",
      "Replace the partitioning with a scheduled OPTIMIZE ZORDER BY (region) so the layout can be refreshed as new calls land",
      "Convert it now: Liquid Clustering is the recommendation for every table, so any table left partitioned is a defect the migration must remove before sign-off, whatever its size"
    ],
    correct:0,
    explain:`Liquid Clustering is the default for new tables, and the lesson's contrast case is exactly this one: an existing, massive table on a stable, low-cardinality key, where the inability to change the key is not costing anything real. Converting while keeping partitioning (the tempting compromise) is not possible, since Liquid Clustering cannot coexist with partitioning or Z-Order on the same table.`
  },
  /* Ch 11 - Multi-format ingestion */
  {
    q:`A public-sector archive team has been handed eleven years of census extracts as 40,000 CSV files in one cloud-storage prefix. Nothing will ever be added to that prefix again. An engineer proposes an Auto Loader stream with a checkpoint and schemaLocation to load them. What is the better call?`,
    opts:[
      "Auto Loader in file notification mode, which is the recommended path whenever the file count is in the tens of thousands, since directory listing would be too slow",
      "A one-time batch read or a COPY INTO statement: for a single known batch with no future arrivals, incremental file tracking buys nothing",
      "Structured Streaming against a message bus, loading each file as an event so the archive can be replayed later",
      "Auto Loader with directory listing, since CSV is a semi-structured format that only Auto Loader can infer a schema for"
    ],
    correct:1,
    explain:`The ingestion pattern follows the arrival pattern: Auto Loader earns its checkpoint and discovery machinery when files keep landing over time, and a one-off archive has no future arrivals to track, so a plain batch read or COPY INTO does the job with nothing left running. File notification mode (the tempting scale answer) solves discovery cost for a growing prefix, not for a prefix that will never change again.`
  },
  /* Ch 25 - Diagnosing bottlenecks with Query Profile */
  {
    q:`A logistics cost review opens Query Profile for a nightly route-cost query. One join operator shows about 900 GB of shuffle read and write. One side is the 40 MB <code>depots</code> dimension, the other the 2 TB <code>shipments</code> fact. What is the cheapest effective fix?`,
    opts:[

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
