<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Title is set from E.name at runtime; this is only a fallback -->
<title>Practice Exam · Databricks DE Professional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     EXAM SHELL - frozen. Do not edit anything in this style block.
     All per-exam customization lives in the EXAM PAYLOAD script section.
  ===================================================================== */
  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;
    --ink-soft:#a7a59f; --ink-faint:#6b6a66; --gold:#e3b84a; --green:#34d3a6; --red:#e8625c;
    --line:rgba(255,255,255,0.08);
    --display:"Fraunces",Georgia,serif; --body:"Hanken Grotesk",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:radial-gradient(1100px 650px at 50% -8%,#1a1d29 0%,transparent 58%),var(--bg);font-family:var(--body);color:var(--ink);min-height:100vh;line-height:1.5;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* sticky top */
  .top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .timer.warn{color:var(--gold);}
  .timer svg{opacity:.7;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  /* intro */
  .intro{text-align:center;margin:auto 0;padding:30px 0;}
  .intro .badge{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px;}
  .intro h1{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.05;letter-spacing:-0.02em;margin-bottom:16px;}
  .intro p{color:var(--ink-soft);font-size:15.5px;max-width:30em;margin:0 auto 14px;}
  .facts{display:flex;justify-content:center;gap:0;margin:24px 0 28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .fact{flex:1;padding:16px 10px;}
  .fact+.fact{border-left:1px solid var(--line);}
  .fact b{display:block;font-family:var(--display);font-size:22px;font-weight:600;color:var(--gold);}
  .fact span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#14110c;font-weight:700;font-size:16px;padding:15px 30px;border-radius:14px;border:none;cursor:pointer;transition:transform .15s ease;font-family:var(--body);}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.35;pointer-events:none;}

  /* question */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .qnum{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:0.04em;}
  .flag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-faint);background:transparent;border:1px solid var(--line);border-radius:100px;padding:5px 12px;cursor:pointer;transition:.15s;font-family:var(--body);}
  .flag.on{color:var(--gold);border-color:var(--gold);background:rgba(227,184,74,0.1);}
  .qtext{font-size:18px;line-height:1.5;font-weight:500;margin-bottom:20px;}
  .qtext code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:5px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);line-height:1.4;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:rgba(255,255,255,0.2);}
  .opt.sel{border-color:var(--gold);background:rgba(227,184,74,0.08);}
  .opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .opt.sel .key{background:var(--gold);color:#14110c;}

  /* review states */
  .opt.correct{border-color:var(--green);background:rgba(52,211,166,0.1);}
  .opt.correct .key{background:var(--green);color:#072018;}
  .opt.incorrect{border-color:var(--red);background:rgba(232,98,92,0.1);}
  .opt.incorrect .key{background:var(--red);color:#2a0a08;}
  .explain{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .explain b{color:var(--ink);}

  /* nav dots */
  .nav-dots{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 4px;justify-content:center;}
  .dot{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-faint);cursor:pointer;transition:.15s;font-family:var(--body);}
  .dot.answered{background:var(--surface-2);color:var(--ink);border-color:rgba(255,255,255,0.18);}
  .dot.current{border-color:var(--gold);color:var(--gold);}
  .dot.flagged{box-shadow:inset 0 0 0 2px rgba(227,184,74,0.5);}

  /* footer nav */
  .foot{display:flex;gap:12px;margin-top:24px;}
  .foot .btn{flex:1;}

  /* results */
  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:140px;height:140px;margin:6px auto 18px;}
  .scorering svg{transform:rotate(-90deg);}
  .scorering .tr{stroke:rgba(255,255,255,0.1);}
  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scorering .ctr b{font-family:var(--display);font-size:38px;font-weight:600;line-height:1;}
  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .verdict{font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:6px;}
  .verdict.pass{color:var(--green);}
  .verdict.fail{color:var(--gold);}
  .res p{color:var(--ink-soft);font-size:14.5px;max-width:28em;margin:0 auto 22px;}
  .res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}
</style>
</head>

<div class="app">
  <div class="top">
    <span class="lbl" id="topLbl">Practice Exam</span>
    <span class="timer" id="timer" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6" stroke-linecap="round"/></svg>
      <span id="timerVal">20:00</span>
    </span>
  </div>
  <div class="pbar"><i id="pbar"></i></div>

<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 9",
  badge: "Databricks DE Professional",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer.",
  coverage: "Covers all 34 chapters across Units 1-9: Developing Code with Python and SQL through Debugging and Deploying.",
  minutes: 120,
  pass: 70
};

const QUESTIONS = [
  /* Ch 01 - DABs Project Structure for Scalable Python */
  {
    q:`An amusement ride manufacturer's bundle defines a "cert" target with mode: production, run_as a service principal, used for certification testing. Two engineers deploying to cert the same day land at the identical fixed path, unlike their dev deploys. Why?`,
    opts:[
      `mode: production always deploys to one fixed path, typically run_as a service principal, regardless of the target's name`,
      `cert silently falls back to development mode whenever two people deploy the same day`,
      `The second engineer's deploy is rejected to avoid the collision`,
      `Fixed-path behavior only applies to targets literally named "prod"`
    ],
    correct:0,
    explain:`mode: production deploys to a single fixed path, typically run_as a service principal, no matter what the target is called. Nothing falls back to development mode automatically, and the second deploy is not rejected.`
  },
  {
    q:`A reviewer at a ride manufacturer sees a stress-tolerance calculation hardcoded as a job parameter default inside resources/jobs.yml, instead of a reference to a tested function. What is the concern?`,
    opts:[
      `None; resources/*.yml can carry any computed default`,
      `The calculation belongs in src/ as a tested, importable function; resources/*.yml should declare structure, not carry logic`,
      `The calculation should move into databricks.yml instead`,
      `The calculation must be duplicated across every job that needs it`
    ],
    correct:1,
    explain:`resources/*.yml declares what runs and when, not embedded logic; a stress-tolerance calculation belongs in src/ as an importable, testable function.`
  },
  /* Ch 02 - Libraries and Dependencies: PyPI, Wheels, Source Archives */
  {
    q:`A pet insurance claims-scoring pipeline broke on a scheduled run after a shared dependency, declared with no version pin, resolved to a newer release with a breaking change. What is the direct cause, and the fix?`,
    opts:[
      `PyPI itself is unreliable for this kind of package; switch to a source archive instead`,
      `The dependency should have been installed with %pip install instead of declared in the bundle`,
      `An unpinned dependency can resolve to a newer, breaking version on a later install; pin it to an exact version instead`,
      `Nothing could have prevented this`
    ],
    correct:2,
    explain:`Leaving a dependency unpinned lets a later install silently resolve to a breaking version; pinning an exact version makes every install reproducible.`
  },
  {
    q:`A pet insurance company's job cluster image has no C compiler. A required actuarial package ships only a source distribution for the cluster's Python version, no wheel. What is the likely outcome, and the safer fix?`,
    opts:[
      `Nothing breaks; source distributions never need a compiler`,
      `Databricks automatically substitutes a compatible wheel from a different Python version`,
      `The job falls back to %pip install, which does not require a compiler`,
      `The install likely fails, since the build needs a compiler and headers the image lacks; pin to the last version with a wheel, or build one in-house`
    ],
    correct:3,
    explain:`With no wheel, pip must build the source archive locally, needing a compiler and headers a minimal image may lack.`
  },
  /* Ch 03 - Python and Pandas UDFs */
  {
    q:`An optometry chain's pipeline defines a Python UDF calling .upper() on a lens-code column, duplicating Spark's built-in upper(). What is the strongest argument for removing the UDF?`,
    opts:[
      `upper() runs inside Catalyst's optimized path with no Python process involved; any UDF pays serialization overhead the built-in never incurs`,
      `UDFs cannot uppercase strings, so this one must be broken`,
      `Removing it only matters if the column is later joined`,
      `There is no real difference between the two`
    ],
    correct:0,
    explain:`Reaching for a UDF only makes sense when nothing built-in covers the case; upper() already does, running entirely inside Catalyst's optimized path.`
  },
  {
    q:`An optometry chain's pandas UDF loads a 2 GB prescription-verification model from disk inside the function body, and that load dominates runtime because it repeats every batch. Which signature fixes this?`,
    opts:[
      `A scalar Series -> Series pandas UDF, since scalar signatures never reload state`,
      `Iterator[pd.Series] -> Iterator[pd.Series], loading the model once before iterating over batches`,
      `A plain row-at-a-time @udf`,
      `mapInPandas with a smaller batch size`
    ],
    correct:1,
    explain:`The iterator-of-Series signature lets setup code run once before the batch loop begins, instead of reloading the model on every batch.`
  },
  /* Ch 04 - Production Pipelines: Lakeflow Declarative Pipelines + Auto Loader */
  {
    q:`A funeral home network's bronze table ingests service-record JSON via Auto Loader. A new location adds a field mid-quarter, and the pipeline keeps running, with the field showing up automatically. What made that possible?`,
    opts:[
      `Auto Loader ignores schema changes entirely`,
      `The pipeline restarted from scratch automatically`,
      `cloudFiles.schemaLocation persisted the previously inferred schema and its evolution history`,
      `JSON files never carry a schema`
    ],
    correct:2,
    explain:`schemaLocation checkpoints the inferred schema and evolution history, letting a genuinely new column be added automatically.`
  },
  {
    q:`An engineer at the funeral home network insists a separate orchestrator is required to guarantee bronze_records finishes before silver_records runs in a Lakeflow Declarative Pipeline. Is that necessary?`,
    opts:[
      `Yes, Lakeflow Declarative Pipelines have no concept of dependency ordering on their own`,
      `Yes, but only because this involves two tables rather than two views`,
      `No, but only if both share the same trigger interval`,
      `No; the pipeline parses silver_records's spark.read.table("bronze_records") reference and builds that dependency edge automatically`
    ],
    correct:3,
    explain:`Lakeflow Declarative Pipelines parse every table function for read references and build the dependency DAG automatically.`
  },
  /* Ch 05 - Automating Jobs: UI, API, and CLI */
  {
    q:`A wedding-venue booking platform wants every job deployed through repeatable, scripted automation with no manual UI steps anywhere. Which interface do they need, and why is the UI unsuitable?`,
    opts:[
      `The CLI or the REST API it wraps; the UI requires a human clicking through it`,
      `The UI, since it is the only interface that guarantees a job looks correct`,
      `Any of the three interchangeably`,
      `The REST API only; the CLI cannot be invoked from automation`
    ],
    correct:0,
    explain:`Unattended automation needs something scriptable, which the CLI and REST API both are, while the UI requires a person clicking through it.`
  },
  {
    q:`A booking platform's ops analyst wants to test a pricing notebook once against an adjusted seasonality parameter, with no permanent job left behind. Which API call fits?`,
    opts:[
      `jobs/run-now, since it accepts one-time overrides on any job`,
      `jobs/runs/submit, which runs the task once with no job definition persisted`,
      `jobs/create, followed by a manual delete once the test finishes`,
      `jobs/list, filtered to jobs created in the last hour`
    ],
    correct:1,
    explain:`runs/submit is built for an ephemeral, one-off run with nothing saved behind it.`
  },
  /* Ch 06 - Streaming Tables vs Materialized Views (TO) */
  {
    q:`A scuba certification org's bronze table ingests dive-log submissions via Auto Loader. Every submission is new and immutable; nothing already landed is edited. Which table type fits, and what would a materialized view cost unnecessarily?`,
    opts:[
      `A materialized view, since certification data should default to the safer option`,
      `Neither; submissions should be processed as a one-time batch load`,
      `A streaming table; its incremental, process-once model fits an append-only source exactly, and a materialized view would only add a needless recompute cost`,
      `A materialized view, because streaming tables cannot ingest through Auto Loader`
    ],
    correct:2,
    explain:`When a source only ever appends, a streaming table's incremental semantics fit exactly, with lower latency and no downside.`
  },
  {
    q:`A certification org's instructor-rating gold table is built from a silver table corrected whenever a dispute review reverses a rating (existing rows updated, not appended). Which table type keeps the summary accurate?`,
    opts:[
      `A streaming table, since it processes corrections with the lowest latency`,
      `A streaming table paired with a manual foreachBatch step`,
      `Either type works equally well if run frequently`,
      `A materialized view; it recomputes against silver's current state, so a corrected row is reflected, unlike a streaming table`
    ],
    correct:3,
    explain:`A streaming table only ever processes new rows; a materialized view recomputes against silver's current state, so the correction flows through.`
  },
  /* Ch 07 - CDC with the AUTO CDC API */
  {
    q:`An artisan bakery chain's inventory-adjustment CDC feed replicates across two facility gateways, and a change occasionally arrives out of order, with an older sequence value landing after a newer one already applied. What keeps the target table correct?`,
    opts:[
      `sequence_by compares the incoming change's sequence value to what has already been applied, and only lets a genuinely newer change through`,
      `create_auto_cdc_flow processes every record strictly in arrival order regardless of sequence_by`,
      `The pipeline fails whenever a change arrives out of order`,
      `Out-of-order changes are silently ignored entirely`
    ],
    correct:0,
    explain:`sequence_by decides which of several changes to the same key wins by comparing the incoming value against what was already applied.`
  },
  {
    q:`A bakery chain's quality team needs to know a recipe's approved ingredient list as of any past date, not just today. Which AUTO CDC configuration provides that?`,
    opts:[
      `stored_as_scd_type=1, the default`,
      `stored_as_scd_type=2, which retains every version of a row with __START_AT and __END_AT columns`,
      `apply_as_deletes, since historical answers require removing stale rows`,
      `sequence_by pointed at the recipe's original creation date`
    ],
    correct:1,
    explain:`A point-in-time question requires retained history, which only SCD Type 2 provides via __START_AT and __END_AT bounded rows.`
  },
  /* Ch 08 - Structured Streaming vs Lakeflow Pipelines (TO) */
  {
    q:`An ice cream franchise's pipeline reads freezer-sensor events from Kafka and must push spoilage alerts to an external maintenance-dispatch API within seconds, with no Delta table in that hop. Which approach fits, and what single fact decides it?`,
    opts:[
      `A Lakeflow streaming table, since it processes incrementally with the lowest latency`,
      `A materialized view refreshed every few seconds`,
      `Raw Structured Streaming with foreachBatch, since the sink is an external API, not a Delta table in Unity Catalog`,
      `Either approach works equally well, since both run on Structured Streaming underneath`
    ],
    correct:2,
    explain:`Lakeflow Declarative Pipelines produce streaming tables and materialized views inside Unity Catalog, never arbitrary external calls.`
  },
  {
    q:`An ice cream franchise building their first bronze-silver-gold sales pipeline wants checkpoint management and data-quality checks out of the box, and their output is Delta tables in Unity Catalog. What is the strongest recommendation?`,
    opts:[
      `Build it on raw Structured Streaming, since medallion pipelines require foreachBatch`,
      `Either approach is equally appropriate`,
      `Structured Streaming for bronze, manual process for silver and gold`,
      `Build it as a Lakeflow Declarative Pipeline; checkpoints, retries, and expectations come managed, and the sink already fits`
    ],
    correct:3,
    explain:`Everything this new team wants is exactly what a Lakeflow Declarative Pipeline provides out of the box.`
  },
  /* Ch 09 - Control Flow and Task Configuration in Jobs */
  {
    q:`A pottery studio network's kiln-usage job has a compute_stats task feeding two parallel tasks, publish and archive. A final audit_log task must run once both finish, whether they succeeded or failed. Which run_if setting fits?`,
    opts:[
      `ALL_DONE, so it runs once both upstream tasks finish, regardless of outcome`,
      `ALL_SUCCESS, the default`,
      `AT_LEAST_ONE_FAILED`,
      `A For Each task wrapping audit_log`
    ],
    correct:0,
    explain:`ALL_DONE fires once every dependency has finished, pass or fail, matching "log every run regardless of outcome."`
  },
  {
    q:`The same class-attendance sync notebook must run once for each of 16 studio locations listed in a config value, with no more than 4 running at once due to a shared booking-API rate limit. What achieves this with one task definition?`,
    opts:[
      `Sixteen separate tasks, one hardcoded per location`,
      `A For Each task wrapping the sync notebook, iterating the 16-location list with a concurrency limit of 4`,
      `One task with an internal Python loop over all 16 locations`,
      `run_if=AT_LEAST_ONE_FAILED on a single task`
    ],
    correct:1,
    explain:`A For Each task runs one inner task per list element with a configurable concurrency limit, matching the rate-limit requirement directly.`
  },
  /* Ch 10 - Testing Pipelines: assertDataFrameEqual, transform, Debugger */
  {
    q:`An escape room franchise's test compares actual and expected DataFrames holding the same rows, but a window-function step reordered them, and a separately computed average completion time reads 42.300000000002 against an expected 42.3. Using assertDataFrameEqual with defaults, what happens?`,
    opts:[
      `Both comparisons fail, since exact order and float equality are required by default`,
      `The row-order comparison fails, and the average passes, since only whole numbers get float tolerance`,
      `Both comparisons pass; assertDataFrameEqual treats rows as unordered by default and applies rtol/atol tolerances`,
      `The row-order comparison passes, and the average fails, since there is no built-in float tolerance`
    ],
    correct:2,
    explain:`assertDataFrameEqual forgives both by default: unordered row comparison, and rtol/atol tolerance for floating-point differences.`
  },
  {
    q:`An escape room franchise's booking transformation passes every unit test on hand-built sample rows, but produces wrong output only for reservations from one specific franchise location in production. What is the fastest way to find the divergence?`,
    opts:[
      `Keep writing more assertDataFrameEqual cases until one happens to reproduce it`,
      `Rewrite the transformation as a plain row-at-a-time UDF`,
      `Treat the discrepancy as unrelated data noise`,
      `Set a breakpoint inside the transformation and step through it against that location's real data`
    ],
    correct:3,
    explain:`The bug only appears on a specific production case the tests never covered, so the debugger is the direct path to watch exactly where it diverges.`
  },
  /* Ch 11 - Multi-Format Ingestion: Files, Message Buses, Cloud Storage (1 question) */
  {
    q:`A climbing gym chain's turnstile sensors publish check-in events continuously through a Kafka bridge, and a real-time occupancy service must react within seconds, with no requirement that events ever land as files first. Which ingestion path fits, and why do both Auto Loader modes fall short?`,
    opts:[
      `Structured Streaming reading directly from the Kafka topic with format("kafka"); both Auto Loader modes discover files that have already landed`,
      `Auto Loader with directory listing, since it needs no cloud-provider setup`,
      `Auto Loader with file notification, since it is built for the lowest latency`,
      `A scheduled COPY INTO run every 10 seconds`
    ],
    correct:0,
    explain:`Kafka is read directly with format("kafka"), removing the file hop entirely; both Auto Loader modes assume data has already landed as files.`
  },
  /* Ch 12 - Append-Only Pipelines: Batch and Streaming on Delta (1 question) */
  {
    q:`A martial arts dojo network's dashboard reads a class-attendance Delta table with readStream.table(). A separate audit job runs an OVERWRITE against historical partitions to correct a misfiled batch. What happens to the dashboard's stream on its next micro-batch?`,
    opts:[
      `It silently skips the corrected partitions and continues streaming only the newest appends`,
      `It throws an exception by default, since OVERWRITE is not an append-only change`,
      `It automatically reprocesses the entire table from the beginning`,
      `Nothing changes, since readStream.table() only reacts to streaming writers`
    ],
    correct:1,
    explain:`Structured Streaming throws by default the moment an OVERWRITE touches the table it is reading, since it assumes an append-only source.`
  },
  /* Ch 13 - Advanced Transformations: Window Functions, Joins, Aggregations */
  {
    q:`A record label's report must flag each artist's best-selling album while still showing every historical release row. A colleague proposes GROUP BY artist_id with MAX(sales). Why is that wrong here?`,
    opts:[
      `GROUP BY is correct; it always preserves every row it groups over`,
      `A broadcast join against a separately maintained lookup table`,
      `RANK() OVER (PARTITION BY artist_id ORDER BY sales DESC) instead, since window functions add a rank without collapsing rows`,
      `DISTINCT on artist_id and sales preserves full release history automatically`
    ],
    correct:2,
    explain:`A window function computes a per-artist rank while leaving every release row intact; GROUP BY collapses each artist into one row.`

const PASS = E.pass;
const SECONDS = E.minutes * 60;

let state = { screen:"intro", i:0, answers:Array(QUESTIONS.length).fill(null), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a!==null).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i]===j?'sel':''}" data-j="${j}">
          <span class="key">${"ABCD"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j]!==null) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{ state.answers[i] = Number(el.dataset.j); render(); setProgress(); };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a===null).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(state.answers[idx]===Q.correct) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], ok=mine===Q.correct;
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(j===Q.correct) cls+=" correct";
          else if(j===mine) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCD"[j]}</span><span>${o}${j===mine?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:Array(QUESTIONS.length).fill(null), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
