<style>
  /* =====================================================================

  :root{

  .opt.incorrect{border-color:var(--red);background:rgba(232,98,92,0.1);}
  .opt.incorrect .key{background:var(--red);color:#2a0a08;}
  .explain{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .explain b{color:var(--ink);}

  /* nav dots */
  .nav-dots{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 4px;justify-content:center;}
  .dot{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-faint);cursor:pointer;transition:.15s;font-family:var(--body);}
  .dot.answered{background:var(--surface-2);color:var(--ink);border-color:rgba(255,255,255,0.18);}
  .dot.current{border-color:var(--gold);color:var(--gold);}
  .dot.flagged{box-shadow:inset 0 0 0 2px rgba(227,184,74,0.5);}

  /* footer nav */
  .foot{display:flex;gap:12px;margin-top:24px;}
  .foot .btn{flex:1;}

  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:140px;height:140px;margin:6px auto 18px;}

  .scorering .tr{stroke:rgba(255,255,255,0.1);}
  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}

  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .verdict{font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:6px;}
  .verdict.pass{color:var(--green);}
  .verdict.fail{color:var(--gold);}
  .res p{color:var(--ink-soft);font-size:14.5px;max-width:28em;margin:0 auto 22px;}
  .res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}
</style>

const QUESTIONS = [

  {
    ref:{chapter:1},
    q:`A planetarium network's bundle defines a "preview" target with mode: production, run_as a service principal. Two engineers deploying to preview the same day land at the identical fixed path, unlike their dev deploys. Why?`,
    opts:[
      `mode: production always deploys to one fixed path, typically run_as a service principal, regardless of the target's name`,
      `preview silently falls back to development mode whenever two people deploy the same day`,
      `The second engineer's deploy is rejected to avoid the collision`,
      `Fixed-path behavior only applies to targets literally named "prod"`
    ],
    correct:0,

  },
  {
    ref:{chapter:1},
    q:`A reviewer at a planetarium network sees a star-catalog lookup hardcoded as a job parameter default inside resources/jobs.yml, instead of a reference to a tested function. What is the concern?`,
    opts:[
      `None; resources/*.yml can carry any computed default`,
      `The lookup belongs in src/ as a tested, importable function; resources/*.yml should declare structure, not carry logic`,
      `The lookup should move into databricks.yml instead`,
      `The lookup must be duplicated across every job that needs it`
    ],
    correct:1,
    explain:`resources/*.yml declares what runs and when, not embedded logic; the lookup belongs in src/ as an importable, testable function.`
  },
  /* Ch 02 - Libraries and Dependencies: PyPI, Wheels, Source Archives */
  {
    ref:{chapter:2},
    q:`An indoor go-kart racing chain's lap-timing pipeline broke on a scheduled run after a shared dependency, declared with no version pin, resolved to a newer release with a breaking change. What is the direct cause, and the fix?`,
    opts:[
      `PyPI itself is unreliable for this kind of package; switch to a source archive instead`,
      `The dependency should have been installed with %pip install instead of declared in the bundle`,
      `An unpinned dependency can resolve to a newer, breaking version on a later install; pin it to an exact version instead`,
      `Nothing could have prevented this`
    ],
    correct:2,
    explain:`Leaving a dependency unpinned lets a later install silently resolve to a breaking version; pinning an exact version makes every install reproducible.`
  },
  {
    ref:{chapter:2},
    q:`A go-kart chain's job cluster image has no C compiler. A required timing-hardware package ships only a source distribution for the cluster's Python version, no wheel. What is the likely outcome, and the safer fix?`,
    opts:[
      `Nothing breaks; source distributions never need a compiler`,
      `Databricks automatically substitutes a compatible wheel from a different Python version`,
      `The job falls back to %pip install, which does not require a compiler`,
      `The install likely fails, since the build needs a compiler and headers the image lacks; pin to the last version with a wheel, or build one in-house`
    ],
    correct:3,
    explain:`With no wheel, pip must build the source archive locally, needing a compiler and headers a minimal image may lack.`
  },
  /* Ch 03 - Python and Pandas UDFs */
  {
    ref:{chapter:3},
    q:`A trampoline park chain's pipeline defines a Python UDF calling .lower() on a park-code column, duplicating Spark's built-in lower(). What is the strongest argument for removing the UDF?`,
    opts:[
      `lower() runs inside Catalyst's optimized path with no Python process involved; any UDF pays serialization overhead the built-in never incurs`,
      `UDFs cannot lowercase strings, so this one must be broken`,
      `Removing it only matters if the column is later joined`,
      `There is no real difference between the two`
    ],
    correct:0,
    explain:`Reaching for a UDF only makes sense when nothing built-in covers the case; lower() already does.`
  },
  {
    ref:{chapter:3},
    q:`A trampoline park's pandas UDF loads a 2.5 GB injury-risk model from disk inside the function body, and that load dominates runtime because it repeats every batch. Which signature fixes this?`,
    opts:[
      `A scalar Series -> Series pandas UDF, since scalar signatures never reload state`,
      `Iterator[pd.Series] -> Iterator[pd.Series], loading the model once before iterating over batches`,
      `A plain row-at-a-time @udf`,
      `mapInPandas with a smaller batch size`
    ],
    correct:1,
    explain:`The iterator-of-Series signature lets setup code run once before the batch loop begins.`
  },
  /* Ch 04 - Production Pipelines: Lakeflow Declarative Pipelines + Auto Loader */
  {
    ref:{chapter:4},
    q:`An axe throwing venue chain's bronze table ingests booking JSON via Auto Loader. A new location adds a field mid-quarter, and the pipeline keeps running, with the field showing up automatically. What made that possible?`,
    opts:[
      `Auto Loader ignores schema changes entirely`,
      `The pipeline restarted from scratch automatically`,
      `cloudFiles.schemaLocation persisted the previously inferred schema and its evolution history`,
      `JSON files never carry a schema`
    ],
    correct:2,
    explain:`schemaLocation checkpoints the inferred schema and evolution history, letting a genuinely new column be added automatically.`
  },
  {
    ref:{chapter:4},
    q:`An engineer at the venue chain insists a separate orchestrator is required to guarantee bronze_bookings finishes before silver_bookings runs in a Lakeflow Declarative Pipeline. Is that necessary?`,
    opts:[
      `Yes, Lakeflow Declarative Pipelines have no concept of dependency ordering on their own`,
      `Yes, but only because this involves two tables rather than two views`,
      `No, but only if both share the same trigger interval`,
      `No; the pipeline parses silver_bookings's dlt.read("bronze_bookings") reference and builds that dependency edge automatically`
    ],
    correct:3,
    explain:`Lakeflow Declarative Pipelines parse every table function for read references and build the dependency DAG automatically.`
  },
  /* Ch 05 - Automating Jobs: UI, API, and CLI */
  {
    ref:{chapter:5},
    q:`A karaoke bar chain wants every job deployed through repeatable, scripted automation with no manual UI steps anywhere. Which interface do they need, and why is the UI unsuitable?`,
    opts:[
      `The CLI or the REST API it wraps; the UI requires a human clicking through it`,
      `The UI, since it is the only interface that guarantees a job looks correct`,
      `Any of the three interchangeably`,
      `The REST API only; the CLI cannot be invoked from automation`
    ],
    correct:0,
    explain:`Unattended automation needs something scriptable, which the CLI and REST API both are, while the UI requires a person clicking through it.`
  },
  {
    ref:{chapter:5},
    q:`A karaoke bar chain's ops analyst wants to test a song-popularity notebook once against an adjusted date range, with no permanent job left behind. Which API call fits?`,
    opts:[
      `jobs/run-now, since it accepts one-time overrides on any job`,
      `jobs/runs/submit, which runs the task once with no job definition persisted`,
      `jobs/create, followed by a manual delete once the test finishes`,
      `jobs/list, filtered to jobs created in the last hour`
    ],
    correct:1,
    explain:`runs/submit is built for an ephemeral, one-off run with nothing saved behind it.`
  },
  /* Ch 06 - Streaming Tables vs Materialized Views (TO) */
  {
    ref:{chapter:6},
    q:`A vinyl record pressing plant's bronze table ingests press-run events via Auto Loader. Every event is new and immutable; nothing already landed is edited. Which table type fits, and what would a materialized view cost unnecessarily?`,
    opts:[
      `A materialized view, since manufacturing data should default to the safer option`,
      `Neither; events should be processed as a one-time batch load`,
      `A streaming table; its incremental, process-once model fits an append-only source exactly, and a materialized view would only add a needless recompute cost`,
      `A materialized view, because streaming tables cannot ingest through Auto Loader`

    correct:2,
    explain:`When a source only ever appends, a streaming table's incremental semantics fit exactly.`
  },
  {
    ref:{chapter:6},

    opts:[
      `A streaming table, since it processes corrections with the lowest latency`,
      `A streaming table paired with a manual foreachBatch step`,
      `Either type works equally well if run frequently`,
      `A materialized view; it recomputes against silver's current state, so a corrected row is reflected, unlike a streaming table`

    correct:3,
    explain:`A streaming table only ever processes new rows; a materialized view recomputes against silver's current state, so the correction flows through.`
  },

  {
    ref:{chapter:7},
    q:`An artisan cheese maker's aging-room CDC feed replicates across two facility gateways, and a change occasionally arrives out of order, with an older sequence value landing after a newer one already applied. What keeps the target table correct?`,

      `apply_changes processes every record strictly in arrival order regardless of sequence_by`,
      `The pipeline fails whenever a change arrives out of order`,
      `Out-of-order changes are silently ignored entirely`

    correct:0,
    explain:`sequence_by decides which of several changes to the same key wins by comparing the incoming value against what was already applied.`
  },
  {
    ref:{chapter:7},
    q:`A cheese maker's quality team needs to know a wheel's approved aging protocol as of any past date, not just today. Which apply_changes configuration provides that?`,
    opts:[
      `stored_as_scd_type=1, the default`,
      `stored_as_scd_type=2, which retains every version of a row with __START_AT and __END_AT columns`,

    correct:1,
    explain:`A point-in-time question requires retained history, which only SCD Type 2 provides.`
  },
  /* Ch 08 - Structured Streaming vs Lakeflow Pipelines (TO) */
  {
    ref:{chapter:8},
    q:`A specialty tea importer's pipeline reads warehouse-humidity sensor events from Kafka and must push spoilage alerts to an external climate-control API within seconds, with no Delta table in that hop. Which approach fits, and what single fact decides it?`,

      `A materialized view refreshed every few seconds`,
      `Raw Structured Streaming with foreachBatch, since the sink is an external API, not a Delta table in Unity Catalog`,
      `Either approach works equally well, since both run on Structured Streaming underneath`

    correct:2,
    explain:`Lakeflow Declarative Pipelines produce streaming tables and materialized views inside Unity Catalog, never arbitrary external calls.`
  },
  {
    ref:{chapter:8},
    q:`A tea importer building their first bronze-silver-gold quality pipeline wants checkpoint management and data-quality checks out of the box, and their output is Delta tables in Unity Catalog. What is the strongest recommendation?`,
    opts:[
      `Build it on raw Structured Streaming, since medallion pipelines require foreachBatch`,
      `Either approach is equally appropriate`,
      `Structured Streaming for bronze, manual process for silver and gold`,
      `Build it as a Lakeflow Declarative Pipeline; checkpoints, retries, and expectations come managed, and the sink already fits`

    correct:3,
    explain:`Everything this new team wants is exactly what a Lakeflow Declarative Pipeline provides out of the box.`
  },

  {
    ref:{chapter:9},
    q:`A craft distillery's barrel-aging job has a compute_stats task feeding two parallel tasks, publish and archive. A final audit_log task must run once both finish, whether they succeeded or failed. Which run_if setting fits?`,

      `ALL_SUCCESS, the default`,
      `AT_LEAST_ONE_FAILED`,
      `A For Each task wrapping audit_log`

    correct:0,
    explain:`ALL_DONE fires once every dependency has finished, pass or fail, matching "log every run regardless of outcome."`
  },

    ref:{chapter:9},
    q:`The same warehouse-inventory sync notebook must run once for each of 14 distillery locations listed in a config value, with no more than 3 running at once due to a shared ERP rate limit. What achieves this with one task definition?`,

      `Fourteen separate tasks, one hardcoded per location`,
      `A For Each task wrapping the sync notebook, iterating the 14-location list with a concurrency limit of 3`,
      `One task with an internal Python loop over all 14 locations`,
      `run_if=AT_LEAST_ONE_FAILED on a single task`

    correct:1,
    explain:`A For Each task runs one inner task per list element with a configurable concurrency limit, matching the rate-limit requirement directly.`
  },

  {
    ref:{chapter:10},

    opts:[
      `Both comparisons fail, since exact order and float equality are required by default`,
      `The row-order comparison fails, and the average passes, since only whole numbers get float tolerance`,
      `Both comparisons pass; assertDataFrameEqual treats rows as unordered by default and applies rtol/atol tolerances`,
      `The row-order comparison passes, and the average fails, since there is no built-in float tolerance`

    correct:2,
    explain:`assertDataFrameEqual forgives both by default: unordered row comparison, and rtol/atol tolerance for floating-point differences.`
  },
  {
    ref:{chapter:10},
    q:`A candle company's fragrance-blend transformation passes every unit test on hand-built sample rows, but produces wrong output only for one specific production batch. What is the fastest way to find the divergence?`,

  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
