<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Full Mock 2",
  badge: "Databricks DE Professional",
  blurb: "Sit it cold, under exam conditions: fifty-nine scenario questions in two hours, sampled across all ten exam sections at their official weights, no feedback until you submit. Pick the single best answer.",
  coverage: "Sealed mock 2 of 2, new scenarios throughout. Samples all 37 chapters by section weight: Developing Code 22%, Ingestion 7%, Transformation and Quality 10%, Sharing and Federation 5%, Monitoring and Alerting 10%, Cost and Performance 13%, Security and Compliance 10%, Governance 7%, Debugging and Deploying 10%, Data Modelling 6%. None of these questions appear in the unit practice exams or in Full Mock 1.",
  minutes: 120,
  pass: 70
};
const QUESTIONS = [
  /* Coverage plan (59 questions, every chapter at least once, interleaved):
     Unit 1  Developing Code with Python and SQL   13  Ch 1, 2, 3, 4 x2, 5, 6, 7 x2, 8, 9 x2, 10
     Unit 2  Data Ingestion and Acquisition         4  Ch 11 x2, 12 x2
     Unit 3  Transformation, Cleansing, Quality     6  Ch 13 x3, 14 x3
     Unit 4  Data Sharing and Federation            3  Ch 15, 16 x2
     Unit 5  Monitoring and Alerting                6  Ch 17 x2, 18, 19, 20 x2
     Unit 6  Cost and Performance Optimisation      8  Ch 21, 22, 23, 24 x2, 25 x3
     Unit 7  Security and Compliance                6  Ch 26, 27 x2, 28, 29 x2
     Unit 8  Data Governance                        4  Ch 30 x2, 31 x2
     Unit 9  Debugging and Deploying                6  Ch 32 x2, 33 x2, 34 x2
     Unit 10 Data Modelling                         3  Ch 35, 36, 37 */
  /* Ch 14 - Quarantining bad data with expectations */
  {
    q:`A hospital network's silver_claims table carries <code>@dp.expect_or_fail("has_member", "member_id IS NOT NULL")</code>. Last night's update processed a batch of two million claim rows, twelve of which had a null member_id, and the update failed. In the post-incident review the operations lead asks how many of the two million rows reached silver_claims. What is the correct answer?`,
    opts:[
      "1,999,988: the twelve failing rows were held back and every other row in the batch was committed before the failure was raised",
      "Only the rows processed before the first null member_id was encountered, because the flow stops at the first violation and keeps what it had already written",
      "None: expect_or_fail stops that flow's update and rolls the transaction back, so the batch is written all or nothing",
      "All two million: expect_or_fail writes every row and marks the flow failed afterwards so the offending rows can be inspected in place and corrected by the data steward"
    ],
    correct:2,
    explain:`expect_or_fail is the severity that refuses to write partial data: a failing row stops the flow's update and the whole transaction rolls back, so silver_claims is exactly as it was before the update started. The idea that the good rows were committed and only the twelve were held back (the tempting reading) describes expect_or_drop, not expect_or_fail; the whole point of the fail severity is that nothing from that batch lands until the data is fixed.`
  },
  /* Ch 22 - Deletion vectors and Liquid Clustering */
  {
    q:`A media company's quarterly cost target includes trimming storage. An engineer deleted about 40% of the rows from a 12 TB ad-impressions table that has deletion vectors enabled; the DELETE finished in seconds. Two weeks later the storage bill for the table has not moved. Why, and what completes the job?`,
    opts:[
      "Deletion vectors marked the rows as removed without rewriting the Parquet files, so the bytes are still there until OPTIMIZE rewrites the affected files and VACUUM removes the superseded ones",
      "The DELETE ran as a logical soft delete because the table is managed; on an external table the same statement would have removed the files from storage immediately, which is why cost-sensitive teams keep large tables external",
      "Deletion vectors are resolved at read time only, so the storage figure will fall by itself once every reader has refreshed its cached view of the table",
      "The transaction log still lists the deleted rows for time travel; running RESTORE to the current version compacts the log and releases the storage"
    ],
    correct:0,
    explain:`A deletion vector records which rows in a file are logically removed and leaves the file itself untouched until it is compacted later, which is exactly why the DELETE was fast and why no bytes have been freed yet: OPTIMIZE rewrites those files without the marked rows, and VACUUM then removes the old files once they are past the retention window. Managed versus external (the tempting distinction) has nothing to do with it; deletion vectors behave the same way on both.`
  },
  /* Ch 7 - CDC with the APPLY CHANGES API */
  {
    q:`A gaming studio maintains silver_player_profiles with <code>apply_changes</code>, using <code>keys=["player_id"]</code> and <code>sequence_by="ingest_ts"</code>, the timestamp at which bronze received each change message. After a six-hour Kafka consumer outage, the buffered messages were replayed. Many profiles now show display names that had already been superseded before the outage. What went wrong, and what is the fix?`,
    opts:[
      "Replayed messages bypass sequence_by entirely because apply_changes treats a redelivery as a brand-new insert, so stale rows accumulate; add apply_as_deletes to clear the superseded rows after each replay",
      "The keys were not unique across the replay, so replayed and original rows collided; add ingest_ts to the keys list so each delivered message keeps its own row in the target",
      "The target is SCD type 1, which lets an older value overwrite a newer one; switching to stored_as_scd_type=2 prevents overwrites because every version is kept",
      "ingest_ts measures arrival, so the replayed old changes carried newer sequence values and won; sequence_by must use the source's own change timestamp or log sequence number"
    ],
    correct:3,
    explain:`sequence_by decides which of several changes to the same key is the latest, so it has to reflect when the change happened at the source, not when the pipeline happened to receive it; an arrival timestamp makes any replay look newer than everything applied before it. Adding ingest_ts to keys (the tempting distractor) would turn a current-state table into one row per delivered message, destroying the upsert semantics apply_changes exists to provide.`
  },
  /* Ch 31 - The UC permission inheritance model */
  {
    q:`A hospital network's <code>clinical</code> catalog carries SELECT granted to <code>all_clinicians</code>, deliberately, across hundreds of tables. A new table of genomic consent records must be readable only by a five-person ethics group, and revoking the catalog grant would disrupt every clinician. Where should the table be created, and why?`,
    opts:[
      "In clinical.research, followed by DENY SELECT ON TABLE genomic_consent TO all_clinicians, which Unity Catalog evaluates ahead of any inherited grant",
      "In a catalog or schema that carries no broad grant, with SELECT granted only to the ethics group; nothing below a catalog-level grant can block what it reaches",
      "In clinical.research, with the table owner revoking SELECT from all_clinicians on just that table, since an owner can always narrow what reaches their own object",
      "In clinical.research, with REVOKE SELECT ON SCHEMA research FROM all_clinicians, which stops the catalog-level grant at the schema boundary for that group only"
    ],
    correct:1,
    explain:`Unity Catalog is purely additive: a catalog-level grant reaches every current and future object beneath it, there is no DENY, and a table owner cannot override a grant made higher up, so the only ways to keep the table out of reach are to adjust the catalog grant or to place the object where that grant does not apply. Revoking at the schema level (the tempting middle ground) does nothing because the group never held a schema-level grant to revoke; the access comes from the catalog.`
  },
  /* Ch 17 - System tables: cost, audit, utilization */
  {
    q:`A hospital network's finance analyst is asked to build a monthly cost report from <code>system.billing.usage</code>. Every query she runs returns a permission error, while the platform administrator runs the same SQL successfully. The workspace is Unity Catalog enabled and system tables are clearly populated. What is the fix?`,
    opts:[
      "Grant her the standard chain for any table: USE CATALOG on system, USE SCHEMA on system.billing and SELECT on the usage table, ideally through a finance group",
      "Enable system tables for her workspace specifically, since each workspace must opt in before its own users can read the system catalog",
      "Make her a workspace admin, because the system catalog is visible only to workspace administrators and account administrators, and no table-level grant can open it to anyone else",
      "Have her query the billing data through the account console export instead, since system tables are not meant to be read by individual users"
    ],
    correct:0,
    explain:`System tables live in the system catalog and are governed like any other table: reading them needs USE CATALOG, USE SCHEMA and SELECT, and the admin can query them only because admins get that access by default. Making her a workspace admin (the tempting shortcut) is both an overreach and beside the point, since the controlling mechanism is the standard Unity Catalog grant chain, not workspace administration.`
  },
  /* Ch 1 - DABs project structure */
  {
    q:`A gaming studio's new engineer opens a pull request that changes the bundle's <code>prod</code> target from <code>mode: production</code> to <code>mode: development</code>, explaining that "prod deploys will be quicker to test". If it merges, what happens the next time two different engineers each run <code>databricks bundle deploy -t prod</code>?`,
    opts:[
      "Both deploys land at the fixed production path, because the mode setting only controls how verbose bundle validate output is and has no effect on where resources go",
      "The second deploy fails with a lock conflict until the first engineer runs bundle destroy against the prod target",
      "Each deploy lands under that engineer's own prefixed names and paths, so prod ends up with two copies of every job and neither at the fixed production location",
      "Nothing changes until bundle validate is rerun, since the target's mode is read only at validation time and cached in the workspace"
    ],
    correct:2,
    explain:`mode: development prefixes resource names and deploy paths with the deploying user's identity, which is exactly the per-engineer isolation that is wanted in dev and disastrous in prod: the single, fixed, service-principal-owned deployment that production mode provides disappears, and each engineer gets a private copy. A lock conflict (the tempting failure) is the wrong mental model; the deploys do not collide at all, which is the problem.`
  },
  /* Ch 25 - Diagnosing bottlenecks with Query Profile */
  {
    q:`A media company's daily ad-revenue query has tripled in cost over a quarter. Query Profile shows the scan node reading every file of the 6 TB impressions table with 0% pruned, even though the table is Liquid Clustered on <code>event_ts</code> and the query asks for one day. The predicate reads <code>WHERE date_format(event_ts, 'yyyy-MM-dd') = '2026-10-03'</code>. The team proposes doubling the warehouse size. What is the cheapest effective fix?`,
    opts:[
      "Double the warehouse size as proposed, since a scan that reads every file is I/O-bound and more nodes read the same files in parallel",
      "Compare event_ts directly against a timestamp range instead of wrapping it in date_format, so each file's min and max statistics can rule it out before it is opened",
      "Run OPTIMIZE ZORDER BY (event_ts) nightly in addition to the clustering so that the formatted-date predicate can use the Z-Order layout",
      "Add a materialized view that stores date_format(event_ts) as its own column and point the dashboard at it, accepting an hourly refresh cost and a second copy of the six terabytes"
    ],
    correct:1,
    explain:`Data skipping compares a predicate against each file's stored min and max for the column itself; once the column is wrapped in a function the stored statistics say nothing about the function's result, so every file has to be opened, however well the table is clustered. Doubling the warehouse (the tempting proposal) buys the same wasted scan twice as fast at twice the price, which is the opposite of fixing the query first.`
  },
  /* Ch 11 - Multi-format ingestion */
  {
    q:`A media company starts a new Structured Streaming job against a Kafka topic that retains seven days of ad-click events, expecting the first run to load the whole backlog. The bronze table only ever contains events produced after the job started. Why?`,
    opts:[
      "Kafka only retains data for consumer groups that were subscribed when it was produced, so a brand-new consumer group can never read events that arrived before its first poll",
      "Auto Loader's checkpoint was initialised at the current time; setting cloudFiles.includeExistingFiles to true makes the backlog visible",
      "A streaming read from Kafka can only begin at the newest offset, so the retained seven days must be loaded with a separate batch read before the stream is started",
      "The read used the default startingOffsets of latest, so it began at the end of the topic; set startingOffsets to earliest for the initial backfill"
    ],
    correct:3,
    explain:`Message buses are read directly with format("kafka") and options such as kafka.bootstrap.servers, subscribe and startingOffsets, and the streaming default for startingOffsets is latest, so a new query begins at the end of the topic unless told otherwise. The Auto Loader option (the tempting fix) belongs to the cloudFiles source, which discovers files in storage and plays no part in a Kafka read.`
  },
  /* Ch 33 - Job repair and parameter overrides */
  {
    q:`A manufacturing plant's nightly job has five tasks: extract, then parse, then enrich (which depends on parse), then publish (which depends on enrich), plus archive, which depends only on parse. Last night extract, parse and archive succeeded, enrich failed on a bad lookup, and publish was never started. The fix is in place and the on-call clicks Repair Run. Which tasks run?`,
    opts:[
      "Only enrich; publish stays in its skipped state and has to be started afterwards with a separate Run Now",
      "Every task, because once any task has failed Repair Run restarts the run from the first task to guarantee a consistent result",
      "enrich and publish only; extract, parse and archive keep their results from the original run",
      "enrich, publish and archive, because archive shares an upstream with the failed task and is rerun to keep the archived output consistent with it"
    ],
    correct:2,
    explain:`Repair Run reruns the failed or cancelled tasks together with everything that depended on them, and leaves every already-successful task's output in place: enrich failed and publish depends on it, so those two run; archive depends only on parse, which succeeded, so it keeps its result. Rerunning archive too (the tempting over-correction) would redo finished work for a task whose inputs never changed.`
  },
  /* Ch 27 - Row filters and column masks */
  {
    q:`A hospital network bound a row filter to its <code>encounters</code> table so that caseworkers see only their own facility's rows. That night the aggregation job, which runs as the service principal <code>svc-reporting</code>, produced zero rows for every facility. What explains it, and what is the fix?`,
    opts:[
      "The filter applies to every query, the service principal's included; the function must return true for svc-reporting, for instance via a group membership check, or the job sees nothing",
      "A row filter breaks any job that reads the table under a service principal, because filter functions can only evaluate human users with a workspace login; the job must be changed to run as a named user",
      "The filter was bound on the wrong column; binding it ON (facility_id) rather than on the facility name would have exempted automated readers",

  /* Ch 29 - Purging and retention: VACUUM and right to be forgotten */

    q:`A healthcare analytics team believes its erasure process is complete: patients who request deletion are flagged <code>is_erased = true</code> in the patients table, and a nightly <code>VACUUM patients</code> job runs. A compliance deadline review asks whether those patients' data has left storage. What is the correct assessment?`,
    opts:[

  /* Ch 13 - Advanced transformations: window functions, joins, aggregations */
  {
    q:`An energy utility's new engineer submits a pull request computing each meter's day-over-day consumption change as <code>reading_kwh - LAG(reading_kwh, 1) OVER (PARTITION BY meter_id)</code>, with no ORDER BY in the window. What happens when it runs?`,

  /* Ch 15 - Delta Sharing: D2D vs open protocol (TO) */
  {
    q:`A hospital network's imaging vendor runs its own Unity Catalog-enabled Databricks workspace. The vendor needs a table of study metadata, a volume holding the de-identified DICOM files and the hospital's registered segmentation model. An engineer proposes the open sharing protocol with a bearer token "because it works everywhere". What is the correct response?`,

      "Neither protocol applies; the files and the model have to be copied to the vendor's cloud storage, because Delta Sharing covers tabular data only",

  {
    q:`A media company's new engineer adds four independent ingestion tasks to a job, one per content source, each reading its own files and writing its own bronze table. The pull request chains them with <code>depends_on</code>: source_b depends on source_a, source_c on source_b, source_d on source_c, "so the run order is predictable". The job now takes four times longer than the longest single task. What should the reviewer ask for?`,

  /* Ch 25 - Diagnosing bottlenecks with Query Profile */
  {
    q:`A media company's dashboard query runs about three hundred times a day. Query Profile shows a join whose output is 4.1 billion rows although its inputs are 210 million impressions and 9,000 campaigns, followed by a DISTINCT that shrinks the result back down; the join and the DISTINCT dominate the time. What is the most cost-effective next step?`,
    opts:[

    correct:0,
    explain:`A join emitting far more rows than either input is the exploding-join signature, and here the cause is in the data: duplicate campaign keys multiply every matching impression, and the DISTINCT then spends a shuffle removing rows that should never have existed. A broadcast hint (the tempting optimisation) changes how the join is executed, not how many rows it produces; the explosion is a property of the keys, not of the join strategy.`

    q:`A gaming studio is designing a new bronze-to-gold pipeline from Kafka into Unity Catalog Delta tables. One architect insists on raw Structured Streaming jobs because, in her words, "streaming tables do not checkpoint, so a failure replays events twice". The other proposes a Lakeflow Spark Declarative Pipeline. Who is right, and what decides it?`,

  /* Ch 29 - Purging and retention: VACUUM and right to be forgotten */

    q:`A gaming studio's engineer, chasing a quarter-end storage target, disabled the retention safety check and ran <code>VACUUM match_events RETAIN 0 HOURS</code>. Within the hour a long-running leaderboard job failed with missing-file errors, and the next day a request to <code>RESTORE</code> the table to the previous day's version also failed. How should the post-incident review read the two failures?`,

  /* Ch 14 - Quarantining bad data with expectations */
  {
    q:`A gaming studio's Lakeflow Spark Declarative Pipeline feeds two silver tables from one bronze events table: <code>silver_matches</code> uses <code>@dp.expect_or_drop</code> on a validity rule, while <code>silver_chat</code> uses only a plain <code>@dp.expect</code> on its own rule. A new engineer argues that the strict rule on silver_matches "protects the pipeline", so silver_chat is covered too. Is that right?`,

  /* Ch 32 - Troubleshooting: Spark UI, cluster logs, event logs */
  {
    q:`A manufacturing company's batch job failed overnight. Spark UI shows stage 14 failed, and the failed task carries a stack trace: a <code>NumberFormatException</code> parsing <code>batch_weight</code>, pointing at a specific line of the transformation. The new on-call engineer begins by downloading the cluster's driver and worker logs. What is the better order of work?`,
    opts:[
      "Start with the failed task in Spark UI: its stack trace already names the line and the bad value, so the cluster logs add nothing for a failure Spark itself recorded",
      "Start with the cluster event log regardless of what Spark UI shows, because infrastructure problems must be ruled out first for every failure before any stack trace is trusted",
      "Start with the pipeline event log, which records the exact flow that failed and the row that caused it for any job that writes to Delta",
      "Start with Query Profile for stage 14, which shows the operator the exception was thrown from and the input rows it was processing when it failed, with no need for logs"
    ],
    correct:0,
    explain:`The evidence to read first depends on the symptom: when a specific task has a stack trace, Spark UI already holds the root cause, and the cluster logs are for failures that happen outside Spark's own execution, such as init scripts, memory kills or lost nodes. Ruling out infrastructure first (the tempting ritual) is the right instinct when there is no task-level detail at all, which is the opposite of this situation.`
  },
  /* Ch 4 - Production pipelines: Lakeflow Declarative Pipelines and Auto Loader */
  {
    q:`A utility's bronze table receives about twenty meter-export files a day. A new engineer configured Auto Loader in file notification mode, which required a cloud queue, event subscriptions and extra permissions, and the team now spends time keeping that plumbing working. Was the extra setup necessary?`,
    opts:[
      "Yes: file notification is the only discovery mode that guarantees each file is processed exactly once, since directory listing can miss files that land between two triggers and never revisit them",
      "Yes: directory listing is deprecated for Lakeflow Spark Declarative Pipelines and file notification is required for any production bronze table",
      "No, but for a different reason: at twenty files a day Auto Loader itself is overkill and a scheduled COPY INTO should replace it",
      "No: directory listing simply checks the folder on each trigger, needs no cloud setup and fits moderate volume; file notification earns its complexity only at very high file counts"
    ],
    correct:3,
    explain:`Auto Loader scales two ways, and the choice is a volume question: directory listing is the simple default for low to moderate file counts, while file notification swaps a cloud queue for listing so that cost stays flat at millions of files. Exactly-once processing (the tempting justification) comes from Auto Loader's checkpoint in both modes, not from the notification plumbing.`
  },
  /* Ch 12 - Append-only pipelines: batch and streaming on Delta */
  {
    q:`An energy utility's <code>meter_reads</code> table is written continuously by a Structured Streaming job in append mode, and three downstream jobs read it with <code>readStream</code>. A calibration fault means two months of readings for 500 meters must be corrected. Which approach corrects the data while keeping the downstream streams healthy?`,
    opts:[
      "Append correction records carrying the corrected value, a correction flag and a later timestamp, and have consumers apply latest-wins, so every writer stays append-only",
      "Run a MERGE that updates the affected rows in place; Structured Streaming consumers of a Delta table receive updated rows as fresh appends, so nothing downstream changes",
      "OVERWRITE the two affected months with corrected files, since replacing whole date partitions does not count as a change commit for a downstream stream",
      "DELETE the faulty rows and re-insert the corrected ones in a single transaction, which the downstream streams treat as an ordinary append because the net row count is unchanged"
    ],
    correct:0,
    explain:`A downstream stream stays healthy only if every writer sticks to inserts: UPDATE, DELETE, MERGE and OVERWRITE all break an append-only reader on its next micro-batch, so the correction has to be expressed as new rows that consumers resolve. The MERGE option (the tempting direct fix) describes behaviour Structured Streaming does not have; an in-place update is a change commit, and the readers would throw.`
  },
  /* Ch 13 - Advanced transformations: window functions, joins, aggregations */
  {
    q:`A manufacturing company joins a 4 TB production-events fact to a 30 MB <code>suppliers</code> dimension on default settings. The physical plan shows a sort-merge join shuffling both sides. The engineer expected the small side to be broadcast automatically. Why was it not, and what should she do?`,
    opts:[
      "Dimension tables are never broadcast automatically; broadcasting always requires an explicit hint whatever the table size",
      "The fact table is too large to broadcast, so Spark falls back to a sort-merge join for the whole join regardless of how small the other side is, and only a smaller fact table changes that",
      "The 30 MB dimension is over spark.sql.autoBroadcastJoinThreshold (10 MB by default); add a BROADCAST hint on suppliers or raise the threshold, since 30 MB fits in executor memory",
      "Sort-merge is already optimal here: a 30 MB side cannot be broadcast because broadcast joins are limited to tables under 1 MB"
    ],
    correct:2,
    explain:`Spark broadcasts the smaller side automatically only when it is under the threshold, 10 MB by default, so a 30 MB dimension is shuffled like any other table unless a hint forces the broadcast or the threshold is raised. Reading the fallback as caused by the fact table (the tempting explanation) misses that only the small side has to fit; the fact side is never broadcast in either strategy.`
  }
];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
