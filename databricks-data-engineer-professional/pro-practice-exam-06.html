<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Practice Exam · Databricks DE Professional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     EXAM SHELL - frozen. Do not edit anything in this style block.
     All per-exam customization lives in the EXAM PAYLOAD script section.
  ===================================================================== */
  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;
    --ink-soft:#a7a59f; --ink-faint:#6b6a66; --gold:#e3b84a; --green:#34d3a6; --red:#e8625c;
    --line:rgba(255,255,255,0.08);
    --display:"Fraunces",Georgia,serif; --body:"Hanken Grotesk",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:radial-gradient(1100px 650px at 50% -8%,#1a1d29 0%,transparent 58%),var(--bg);font-family:var(--body);color:var(--ink);min-height:100vh;line-height:1.5;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* sticky top */
  .top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .timer.warn{color:var(--gold);}
  .timer svg{opacity:.7;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  /* intro */
  .intro{text-align:center;margin:auto 0;padding:30px 0;}
  .intro .badge{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px;}
  .intro h1{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.05;letter-spacing:-0.02em;margin-bottom:16px;}
  .intro p{color:var(--ink-soft);font-size:15.5px;max-width:30em;margin:0 auto 14px;}
  .facts{display:flex;justify-content:center;gap:0;margin:24px 0 28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .fact{flex:1;padding:16px 10px;}
  .fact+.fact{border-left:1px solid var(--line);}
  .fact b{display:block;font-family:var(--display);font-size:22px;font-weight:600;color:var(--gold);}
  .fact span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#14110c;font-weight:700;font-size:16px;padding:15px 30px;border-radius:14px;border:none;cursor:pointer;transition:transform .15s ease;font-family:var(--body);}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.35;pointer-events:none;}

  /* question */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .qnum{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:0.04em;}
  .flag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-faint);background:transparent;border:1px solid var(--line);border-radius:100px;padding:5px 12px;cursor:pointer;transition:.15s;font-family:var(--body);}
  .flag.on{color:var(--gold);border-color:var(--gold);background:rgba(227,184,74,0.1);}
  .qtext{font-size:18px;line-height:1.5;font-weight:500;margin-bottom:20px;}
  .qtext code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:5px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);line-height:1.4;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:rgba(255,255,255,0.2);}
  .opt.sel{border-color:var(--gold);background:rgba(227,184,74,0.08);}
  .opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .opt.sel .key{background:var(--gold);color:#14110c;}

  /* review states */
  .opt.correct{border-color:var(--green);background:rgba(52,211,166,0.1);}
  .opt.correct .key{background:var(--green);color:#072018;}
  .opt.incorrect{border-color:var(--red);background:rgba(232,98,92,0.1);}
  .opt.incorrect .key{background:var(--red);color:#2a0a08;}
  .explain{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .explain b{color:var(--ink);}

  /* nav dots */
  .nav-dots{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 4px;justify-content:center;}
  .dot{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-faint);cursor:pointer;transition:.15s;font-family:var(--body);}
  .dot.answered{background:var(--surface-2);color:var(--ink);border-color:rgba(255,255,255,0.18);}
  .dot.current{border-color:var(--gold);color:var(--gold);}
  .dot.flagged{box-shadow:inset 0 0 0 2px rgba(227,184,74,0.5);}

  /* footer nav */
  .foot{display:flex;gap:12px;margin-top:24px;}
  .foot .btn{flex:1;}

  /* results */
  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:140px;height:140px;margin:6px auto 18px;}
  .scorering svg{transform:rotate(-90deg);}
  .scorering .tr{stroke:rgba(255,255,255,0.1);}
  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scorering .ctr b{font-family:var(--display);font-size:38px;font-weight:600;line-height:1;}
  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .verdict{font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:6px;}
  .verdict.pass{color:var(--green);}
  .verdict.fail{color:var(--gold);}
  .res p{color:var(--ink-soft);font-size:14.5px;max-width:28em;margin:0 auto 22px;}
  .res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="lbl" id="topLbl">Practice Exam</span>
    <span class="timer" id="timer" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6" stroke-linecap="round"/></svg>
      <span id="timerVal">20:00</span>
    </span>
  </div>
  <div class="pbar"><i id="pbar"></i></div>

  <div class="body-wrap" id="root"></div>
</div>

<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 6",
  badge: "Databricks DE Professional",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer.",
  coverage: "Covers all 25 chapters across Units 1-6: Developing Code with Python and SQL, Data Ingestion and Acquisition, Transformation Cleansing and Quality, Data Sharing and Federation, Monitoring and Alerting, and Cost and Performance Optimisation.",
  minutes: 100,
  pass: 70
};

const QUESTIONS = [
  /* Ch 01 - DABs Project Structure for Scalable Python */
  {
    q:`A hospital network's data platform team deploys the same bundle to a dev target and, separately, to a shared "demo" target configured with mode: production. Two engineers deploying to demo on the same day land at the identical fixed path, while their dev deploys never collide. What explains this?`,
    opts:[
      `mode: production always deploys to one fixed path, typically run_as a service principal, regardless of what the target is named`,
      `demo silently inherits dev's per-user prefixing whenever two people deploy the same day`,
      `The second engineer's demo deploy is rejected to prevent the collision`,
      `Fixed-path behavior only applies to targets literally named "prod"`
    ],
    correct:0,
    explain:`mode: production deploys to a single fixed path, typically run_as a service principal, no matter what the target is called, which is exactly why demo behaves like dev's opposite here. Nothing inherits dev's prefixing automatically, and the second deploy is not rejected, it simply lands at the same shared path as the first.`
  },
  {
    q:`A reviewer at a hospital network sees a new job parameter default hardcoded as a long patient-eligibility formula inside resources/pipelines.yml, instead of a reference to a tested function. What is the concern?`,
    opts:[
      `None; resources/*.yml is intended to carry any computed default, including formulas`,
      `The formula belongs in src/ as a tested, importable function; resources/*.yml should declare structure, not carry business logic`,
      `The formula should move into databricks.yml, since all computed defaults belong there`,
      `The formula must be duplicated across every job that needs it, since resources/*.yml files cannot share code`
    ],
    correct:1,
    explain:`resources/*.yml is meant to declare what runs and when, not carry embedded logic; an eligibility formula belongs in src/ as an importable, unit-testable function instead. databricks.yml only holds bundle-level config like targets, and nothing requires duplicating logic instead of sharing a function.`
  },
  /* Ch 02 - Libraries and Dependencies: PyPI, Wheels, Source Archives */
  {
    q:`A bank's fraud-scoring pipeline worked for months, then broke on a scheduled run after a shared dependency, declared as scikit-learn with no version, resolved to a newer release with a breaking API change. What is the direct cause, and the fix?`,
    opts:[
      `PyPI itself is unreliable for this kind of package; switch to a source archive instead`,
      `The dependency should have been installed with %pip install instead of declared in the bundle`,
      `An unpinned dependency can resolve to a newer, breaking version on a later install; pin it to an exact version instead`,
      `Nothing could have prevented this; dependency breakage is unavoidable over time`
    ],
    correct:2,
    explain:`Leaving a dependency unpinned means a later install can silently resolve to a newer, breaking version; pinning to an exact version like scikit-learn==1.4.0 is the fix, since it makes every install reproducible. Source archives address build requirements, not version drift, and %pip install would make the dependency less reproducible, not more, since it is session-scoped.`
  },
  {
    q:`A logistics company's job cluster image has no C compiler. A required routing-optimization package's latest release ships only a source distribution for the cluster's Python version, no wheel. What is the likely outcome, and the safer fix?`,
    opts:[
      `Nothing breaks; pip builds source distributions without needing any compiler`,
      `Databricks automatically substitutes a compatible wheel from a different Python version`,
      `The job falls back to %pip install, which does not require a compiler for source builds`,
      `The install likely fails, since building the source archive needs a compiler and headers the image lacks; pin to the last version that shipped a wheel, or build one in-house`
    ],
    correct:3,
    explain:`With no wheel available, pip has to build the source archive locally, which needs a compiler and headers a minimal image may not have, so the install can fail; pinning to a version with a wheel, or building one in-house, sidesteps the missing build tools. Databricks does not auto-substitute wheels across Python versions, and %pip install still triggers the same local build.`
  },
  /* Ch 03 - Python and Pandas UDFs */
  {
    q:`A gaming analytics pipeline defines a Python UDF that calls .lower() on a player-handle column, when Spark's built-in lower() already does the same thing. What is the strongest argument for removing the UDF?`,
    opts:[
      `lower() runs inside Catalyst's optimized path with no Python process involved; any UDF pays serialization overhead the built-in never incurs`,
      `UDFs cannot lowercase strings at all, so this one must already be broken`,
      `Removing it only matters if the column is later joined against another table`,
      `There is no real difference, since both approaches compile to the same physical plan`
    ],
    correct:0,
    explain:`Reaching for a UDF only makes sense when nothing built-in covers the case; lower() already does, and it runs entirely inside Catalyst's optimized path, while any UDF pays a serialization cost the built-in never pays. UDFs handle string casing fine, a later join does not change this trade-off, and a UDF never compiles into the same optimized plan as a built-in.`
  },
  {
    q:`A pandas UDF in a game-telemetry pipeline loads a 4 GB matchmaking model from disk inside the function body, and that load dominates runtime because it repeats every batch. Which signature fixes this without changing what the UDF computes?`,
    opts:[
      `A scalar Series -> Series pandas UDF, since scalar signatures never reload state`,
      `Iterator[pd.Series] -> Iterator[pd.Series], loading the model once before iterating over batches instead of once per batch`,
      `A plain row-at-a-time @udf, since it avoids batch-level state entirely`,
      `mapInPandas with a smaller batch size, so reloads happen more often but each is cheaper`
    ],
    correct:1,
    explain:`The iterator-of-Series signature lets setup code, like loading a model, run once before the loop over batches begins, so the expensive load happens a single time instead of on every batch. A scalar Series to Series pandas UDF still gets invoked fresh per batch, a plain row-at-a-time UDF would reload it once per row, and a smaller batch size only makes the reload happen more often.`
  },
  /* Ch 04 - Production Pipelines: Lakeflow Declarative Pipelines + Auto Loader */
  {
    q:`A logistics bronze table ingests shipment-scan JSON via Auto Loader. A carrier adds a new field mid-quarter, and the pipeline keeps running, with the new field showing up in the target table automatically instead of breaking the stream. What made that possible?`,
    opts:[
      `Auto Loader ignores schema changes entirely and drops any unrecognized field`,
      `The pipeline restarted from scratch automatically the moment the new field appeared`,
      `cloudFiles.schemaLocation persisted the previously inferred schema and its evolution history, so the new column was added rather than rejected`,
      `JSON files never carry a schema, so there was nothing for Auto Loader to reconcile`
    ],
    correct:2,
    explain:`schemaLocation is where Auto Loader checkpoints the schema it inferred and tracks evolution history; that is what lets a genuinely new column be added automatically instead of breaking the stream or being silently dropped. Auto Loader does not restart from scratch on a schema change, and JSON is semi-structured, its schema is inferred at read time, not absent entirely.`
  },
  {
    q:`A logistics engineer insists a separate orchestrator is required to guarantee bronze_scans finishes before silver_scans runs in a Lakeflow Declarative Pipeline. Is that orchestrator necessary?`,
    opts:[
      `Yes, since Lakeflow Declarative Pipelines have no concept of dependency ordering on their own`,
      `Yes, but only because this involves two different tables rather than two views`,
      `No, but only if both tables happen to share the same trigger interval`,
      `No; the pipeline parses silver_scans's function body for a dlt.read("bronze_scans") reference and builds that dependency edge automatically`
    ],
    correct:3,
    explain:`Lakeflow Declarative Pipelines parse every table function to find read references like dlt.read("bronze_scans") and build the dependency DAG from them automatically; no external orchestrator, trigger alignment, or table-versus-view distinction changes that.`
  },
  /* Ch 05 - Automating Jobs: UI, API, and CLI */
  {
    q:`A streaming media company wants every job deployed through repeatable, scripted automation with no manual UI steps anywhere in the pipeline. Which interface do they need to build around, and why is the UI unsuitable?`,
    opts:[
      `The CLI or the REST API it wraps; the UI requires a human clicking through it, which breaks unattended automation`,
      `The UI, since it is the only interface that guarantees a job looks correct before it runs`,
      `Any of the three interchangeably, since they all read and write the same job spec`,
      `The REST API only; the CLI cannot be invoked from an automation pipeline`
    ],
    correct:0,
    explain:`Repeatable, unattended automation needs something scriptable and non-interactive, which the CLI (often via bundle deploy) and REST API both are, while the UI fundamentally requires a person to click through it. The three interfaces share one job spec, but that does not make them equally fit for unattended automation, and the CLI runs perfectly well inside a script.`
  },
  {
    q:`A media analyst wants to test a recommendation notebook once against a modified content catalog, with no permanent job definition left behind for anyone to stumble on later. Which API call fits?`,
    opts:[
      `jobs/run-now, since it accepts one-time parameter overrides on any job`,
      `jobs/runs/submit, which runs the task once with no job definition persisted at all`,
      `jobs/create, followed immediately by a manual delete once the test finishes`,
      `jobs/list, filtered to jobs created in the last hour`
    ],
    correct:1,
    explain:`runs/submit is designed for exactly this: an ephemeral, one-off run with nothing saved behind it. run-now does accept overrides, but only against a job that already exists and stays in its run history. create-then-delete works but leaves a needless job definition in between, and jobs/list only reads existing state.`
  },
  /* Ch 06 - Streaming Tables vs Materialized Views (TO) */
  {
    q:`A census bureau's bronze table ingests household-survey submissions via Auto Loader. Every submission is a new, immutable record; nothing already landed is ever edited or removed. Which table type fits, and what would a materialized view cost unnecessarily here?`,
    opts:[
      `A materialized view, since government data should always default to the safer option`,
      `Neither; survey submissions should be processed as a one-time batch load only`,
      `A streaming table; its incremental, process-once model fits an append-only source exactly, and a materialized view would only add a needless recompute cost`,
      `A materialized view, because streaming tables cannot ingest through Auto Loader`
    ],
    correct:2,
    explain:`When a source only ever appends, a streaming table's incremental, process-once semantics fit exactly, with lower latency and nothing lost. A materialized view would still work, but it pays a recompute cost to guard against upstream changes this strictly append-only source never produces. Streaming tables commonly read from Auto Loader.`
  },
  {
    q:`A census bureau's population-estimate gold table is built from a silver table that gets corrected whenever a data-entry error is found (existing rows are updated, not just appended). Which table type keeps the estimate accurate after a correction?`,
    opts:[
      `A streaming table, since it processes corrections with the lowest latency`,
      `A streaming table paired with a manual foreachBatch step layered on top`,
      `Either type works equally well as long as the pipeline runs frequently`,
      `A materialized view; it recomputes or incrementally maintains its result against silver's current state, so a corrected row is reflected, unlike a streaming table which only sees new rows`
    ],
    correct:3,
    explain:`A streaming table only ever processes new rows; a correction that updates an existing silver row is invisible to it. A materialized view recomputes or incrementally maintains its result against silver's current state, so the correction flows through correctly. foreachBatch is a raw Structured Streaming construct, not something layered onto a Lakeflow streaming table.`
  },
  /* Ch 07 - CDC with the APPLY CHANGES API */
  {
    q:`An agricultural IoT feed replicates soil-sensor calibration changes across two regional gateways, and a change for sensor_id 771 occasionally arrives out of order, with an older sequence value landing after a newer one already applied. What keeps the target table correct?`,
    opts:[
      `sequence_by compares the incoming change's sequence value to what has already been applied for that key, and only lets a genuinely newer change through`,
      `apply_changes processes every record strictly in arrival order regardless of sequence_by`,
      `The pipeline fails whenever a change arrives out of order relative to its sequence value`,
      `Out-of-order changes are silently ignored entirely, regardless of their sequence value`
    ],
    correct:0,
    explain:`sequence_by is what lets apply_changes decide which of several changes to the same key actually wins; it compares the incoming value against what was already applied and lets a change through only if it is genuinely newer, so a late-arriving older change is correctly ignored. Arrival order at the pipeline plays no role.`
  },
  {
    q:`A pharmaceutical compliance team needs to answer "what was this batch's approved formulation as of any past date," not just the current one. Which apply_changes configuration provides that?`,
    opts:[
      `stored_as_scd_type=1, the default, since it needs the least configuration`,
      `stored_as_scd_type=2, which retains every version of a row and adds __START_AT and __END_AT columns marking when each version was valid`,
      `apply_as_deletes, since historical answers require removing stale formulation rows`,
      `sequence_by pointed at the batch's original manufacture date instead of the change timestamp`
    ],
    correct:1,
    explain:`A point-in-time question requires retained history, which only SCD Type 2 provides: every change becomes its own row bounded by __START_AT and __END_AT. Type 1 overwrites in place and only shows the current value, apply_as_deletes governs how source deletes are handled rather than history retention, and sequence_by controls ordering, not what gets stored.`
  },
  /* Ch 08 - Structured Streaming vs Lakeflow Pipelines (TO) */
  {
    q:`A telecom pipeline reads call-detail records from Kafka and must push flagged fraud events to an external SIM-blocking API within seconds, with no Delta table in that hop. Which approach fits, and what single fact decides it?`,
    opts:[
      `A Lakeflow streaming table, since it processes incrementally with the lowest latency`,
      `A materialized view refreshed every few seconds, since materialized views can call external APIs directly`,
      `Raw Structured Streaming with foreachBatch, since the sink is an external API, not a Delta table in Unity Catalog, which the managed pipeline cannot target`,
      `Either approach works equally well, since both run on the same Structured Streaming engine underneath`
    ],
    correct:2,
    explain:`The deciding fact is the sink: Lakeflow Declarative Pipelines produce streaming tables and materialized views inside Unity Catalog, never arbitrary external calls, so an external API rules it out regardless of latency. Raw Structured Streaming with foreachBatch can call any external system per micro-batch. Materialized views remain Delta objects in Unity Catalog, not a general external-call mechanism.`
  },
  {
    q:`A telecom team building their first bronze-silver-gold network-quality pipeline wants checkpoint management, retries, and data-quality checks to come out of the box, and their output is Delta tables in Unity Catalog. What is the strongest recommendation?`,
    opts:[
      `Build it on raw Structured Streaming, since medallion pipelines require foreachBatch for correctness`,
      `Either approach is equally appropriate, so the choice does not matter`,
      `Structured Streaming for bronze, and a separate manual process for silver and gold`,
      `Build it as a Lakeflow Declarative Pipeline; checkpoints, retries, and expectations come managed, and the sink already fits what it targets`
    ],
    correct:3,
    explain:`Everything this new team wants, managed checkpoints, retries, and data-quality expectations, is exactly what a Lakeflow Declarative Pipeline provides out of the box, and their sink, Delta tables in Unity Catalog, is precisely what it targets. Medallion pipelines do not require foreachBatch, and splitting layers across different tooling adds complexity a single managed pipeline avoids.`
  },
  /* Ch 09 - Control Flow and Task Configuration in Jobs */
  {
    q:`An education platform's grading job has a compute_scores task feeding two parallel tasks, publish_lms and archive_raw. A final audit_log task must run once both finish, whether they succeeded or failed, so every grading run is logged regardless of outcome. Which run_if setting fits audit_log?`,
    opts:[
      `ALL_DONE, so it runs once both upstream tasks finish, regardless of outcome`,
      `ALL_SUCCESS, the default, so it only runs after a clean run`,
      `AT_LEAST_ONE_FAILED, so it only runs when something upstream failed`,
      `A For Each task wrapping audit_log, iterating over the two upstream tasks`
    ],
    correct:0,
    explain:`ALL_DONE fires once every dependency has finished, pass or fail, which is exactly what "log every run regardless of outcome" requires. ALL_SUCCESS would skip logging after any failure, and AT_LEAST_ONE_FAILED would skip logging after a clean run, the opposite of always logging. For Each iterates over list elements to repeat a task, it does not encode this kind of conditional logic.`
  },
  {
    q:`The same enrollment-sync notebook must run once for each of 30 partner schools listed in a config value, with no more than 6 running at once to respect a shared SIS API rate limit. What configuration achieves this with one task definition?`,
    opts:[
      `Thirty separate tasks, one hardcoded per school, all depending on the same upstream task`,
      `A For Each task wrapping the enrollment-sync notebook, iterating the 30-school list with a concurrency limit of 6`,

    opts:[
      `Network latency to the storage layer, fixed by moving the cluster to a different region`,
      `Data skew, where one partition holds disproportionately more data than the rest; fixed by reclustering or addressing the skewed key`,
      `A missing index on the source table, fixed by adding one`,
      `Insufficient executor memory across the whole cluster, fixed by adding more executors`
    ],
    correct:1,
    explain:`One task taking far longer while the rest of the stage waits is the classic signature of data skew: a single partition holding disproportionately more rows than its neighbors. The typical fix is addressing the skewed key directly, often through reclustering, rather than a region change, an index (Delta tables do not use traditional indexes), or simply adding more executors, which does not rebalance an already-uneven partition.`
  }
];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

let state = { screen:"intro", i:0, answers:Array(QUESTIONS.length).fill(null), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a!==null).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i]===j?'sel':''}" data-j="${j}">
          <span class="key">${"ABCD"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j]!==null) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{ state.answers[i] = Number(el.dataset.j); render(); setProgress(); };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a===null).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(state.answers[idx]===Q.correct) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], ok=mine===Q.correct;
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(j===Q.correct) cls+=" correct";
          else if(j===mine) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCD"[j]}</span><span>${o}${j===mine?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:Array(QUESTIONS.length).fill(null), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
