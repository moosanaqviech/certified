    <h2 class="reveal">One bundle, many targets</h2>
    <p class="lead reveal" style="margin-bottom:16px">A Databricks Asset Bundle defines your jobs and pipelines as code. Named <strong>targets</strong> parametrize where each deploy lands and which catalog it uses.</p>
    <div class="codeblock reveal">
<span class="cm"># databricks.yml: one bundle, three targets</span><br>
targets:<br>
&nbsp;&nbsp;<span class="al">dev</span>:<br>
&nbsp;&nbsp;&nbsp;&nbsp;variables: { catalog: <span class="st">dev</span> }<br>
&nbsp;&nbsp;<span class="al">test</span>:<br>
&nbsp;&nbsp;&nbsp;&nbsp;variables: { catalog: <span class="st">test</span> }<br>
&nbsp;&nbsp;<span class="al">prod</span>:<br>
&nbsp;&nbsp;&nbsp;&nbsp;variables: { catalog: <span class="st">prod</span> }<br><br>
<span class="cm"># promote the same code to the next stage</span><br>
<span class="kw">databricks</span> bundle deploy <span class="al">-t prod</span>
    </div>
    <p class="lead reveal" style="font-size:14px;margin-top:14px">Deploying the same bundle to the next target is the promotion. Nothing is hand-edited along the way.</p>
    <div class="spacer"></div>` },

  /* 6 — the path forward */
  { html: `
    <div class="eyebrow reveal">The path forward</div>
    <h2 class="reveal">How a change reaches prod</h2>
    <div class="pills reveal" style="margin-top:10px">
      <div class="pill"><p><b>1 · Branch in dev</b>Work on a branch in a Git Folder, running against dev data.</p></div>
      <div class="pill"><p><b>2 · PR to main</b>Open a pull request. Review and merge fold the change into the shared source.</p></div>
      <div class="pill"><p><b>3 · Deploy to test</b>A bundle deploy to the test target validates the code on prod-like data.</p></div>
      <div class="pill"><p><b>4 · Deploy to prod</b>Once tests pass, deploy the same bundle to prod, run by a service principal rather than a personal account.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 7 — quiz 2 (the anti-pattern) */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:22px">An engineer fixes a bug by editing the job's notebook directly in prod, then pastes the change into dev by hand. What is wrong, and what is better?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Nothing is wrong; editing prod directly is the fastest safe fix</button>
      <button class="choice" data-correct="false"><span class="key">B</span>Prod should always be edited first, and dev should copy down from prod</button>
      <button class="choice" data-correct="true"><span class="key">C</span>Prod changed outside version control, causing drift; the fix belongs in Git, then deployed to test and prod via the bundle</button>
      <button class="choice" data-correct="false"><span class="key">D</span>The two workspaces should be merged into one so edits never diverge</button>
    </div>
    <div class="feedback"><b>Correct.</b> Hand-editing prod leaves no audit trail and lets environments drift apart. Changes belong in Git first, then flow forward by deploying the bundle to each target, so every environment stays reproducible from one source.</div>` },

  /* 8 — done */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `

      <div class="pill"><p><b>Promote code, not data</b>One bundle, parametrized by target, points at a separate catalog per environment.</p></div>

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* Keys and swipes only move between cards. Leaving the lesson always takes
   a deliberate tap, so a stray swipe on the final card cannot navigate away. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
