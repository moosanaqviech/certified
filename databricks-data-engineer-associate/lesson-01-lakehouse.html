    <h2 class="reveal" style="font-size:23px">What core problem does the lakehouse solve?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Makes data lakes cheaper</button>
      <button class="choice" data-correct="true"><span class="key">B</span>Removes the need for separate lake + warehouse</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Replaces SQL with Python</button>
    </div>
    <div class="feedback"><b>Unifies them.</b> The lakehouse puts warehouse reliability on lake-cheap open storage, so you don't run two systems and copy data between them.</div>` },

  { glow: "radial-gradient(540px 340px at 50% 20%, rgba(52,211,166,0.14), transparent 70%)", quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check · 2 of 2</div>
    <h2 class="reveal" style="font-size:23px">Which capability does the lakehouse borrow from the <span style="color:var(--warehouse)">warehouse</span> side?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Cheap object storage</button>
      <button class="choice" data-correct="true"><span class="key">B</span>ACID transactions & governance</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Storing unstructured files</button>
    </div>
    <div class="feedback"><b>ACID & governance.</b> Cheap storage and flexible file types come from the lake side; reliability, transactions, and fine-grained governance are the warehouse contributions.</div>` },

  { glow: "radial-gradient(560px 360px at 50% 16%, rgba(52,211,166,0.16), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Lesson complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">The foundation everything builds on:</p>
    <div class="pills reveal">
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--lake)" stroke-width="2"><path d="M3 12c3-4 6-4 9 0s6 4 9 0M3 17c3-4 6-4 9 0s6 4 9 0" stroke-linecap="round"/></svg><p><b>Lake gives</b>Cheap, open storage for any data type</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--warehouse)" stroke-width="2"><path d="M4 9l8-5 8 5v10a1 1 0 01-1 1H5a1 1 0 01-1-1z"/></svg><p><b>Warehouse gives</b>ACID reliability, BI speed, governance</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--house)" stroke-width="2"><path d="M12 3l9 6v11a1 1 0 01-1 1H4a1 1 0 01-1-1V9z"/><path d="M9 21v-7h6v7" stroke-linejoin="round"/></svg><p><b>Lakehouse</b>Both at once - one platform, no copies</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ----------  ENGINE  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* Keys and swipes only move between cards. Leaving the lesson always takes
   a deliberate tap, so a stray swipe on the final card cannot navigate away. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
</html>
