  { glow: "radial-gradient(540px 340px at 50% 20%, rgba(52,211,166,0.14), transparent 70%)", quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check · 2 of 2</div>
    <h2 class="reveal" style="font-size:21px">What does <span style="color:var(--flow)">Predictive Optimization</span> do for a Unity Catalog managed table?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Encrypts the table at rest</button>
      <button class="choice" data-correct="true"><span class="key">B</span>Automatically runs OPTIMIZE / clustering / VACUUM when beneficial</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Forces you to schedule maintenance jobs</button>
    </div>
    <div class="feedback"><b>It automates maintenance.</b> Predictive Optimization decides when to run <code>OPTIMIZE</code>, clustering, and <code>VACUUM</code> on managed tables — removing the manual schedules you'd otherwise babysit.</div>` },

  /* 7 - done */
  { glow: "radial-gradient(560px 360px at 50% 16%, rgba(52,211,166,0.16), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Lesson complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">Self-organizing tables, in four ideas:</p>
    <div class="pills reveal">
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--flow)" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg><p><b>CLUSTER BY</b>Replaces partitioning + Z-order; better data skipping</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--auto)" stroke-width="2"><path d="M12 3v6m0 6v6M5 12H3m18 0h-2M7 7L5 5m14 14-2-2" stroke-linecap="round"/></svg><p><b>Flexible keys</b>Change with ALTER TABLE — no rewrite; AUTO picks for you</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--flow)" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3" stroke-linecap="round"/></svg><p><b>Predictive Optimization</b>Auto OPTIMIZE / clustering / VACUUM on managed tables</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="2"><path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg><p><b>Net effect</b>Less manual tuning, fewer small files, faster scans</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ----------  ENGINE  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* Keys and swipes only move between cards. Leaving the lesson always takes
   a deliberate tap, so a stray swipe on the final card cannot navigate away. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
