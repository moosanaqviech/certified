    <div class="art reveal">${A.why}</div>
    <p class="lead reveal">A failed job and a <strong>slow</strong> job are different problems. The Jobs UI tells you a run failed; the <strong>Spark UI</strong> tells you why a run that <em>succeeds</em> is crawling. Three culprits cause most of it.</p>` },

  /* 2 - stages and tasks */
  { glow: "radial-gradient(540px 340px at 50% 16%, rgba(79,168,232,0.12), transparent 70%)",
    html: `
    <div class="tag reveal" style="color:var(--shuffle)"><span style="background:var(--shuffle);width:8px;height:8px;border-radius:50%;display:inline-block"></span>HOW TO READ IT</div>
    <h2 class="reveal">Stages and tasks.</h2>
    <div class="art grow reveal">${A.stages}</div>
    <p class="lead reveal">Spark breaks a query into <strong>stages</strong>, and each stage into <strong>tasks</strong> that run in parallel across the cluster. A stage finishes only when its slowest task does - so bottlenecks show up as <strong>patterns in the task metrics</strong>.</p>` },

  /* 3 - skew */
  { glow: "radial-gradient(540px 340px at 50% 16%, rgba(224,144,58,0.15), transparent 70%)",
    html: `
    <div class="tag reveal" style="color:var(--skew)"><span style="background:var(--skew);width:8px;height:8px;border-radius:50%;display:inline-block"></span>CULPRIT 1 · SKEW</div>
    <h2 class="reveal" style="color:var(--skew)">One task does all the work.</h2>
    <div class="art reveal">${A.skew}</div>
    <p class="lead reveal"><strong>Skew</strong> is uneven data across partitions: one task gets far more rows than the others and becomes a straggler everyone waits on. Tell-tale sign: <strong>max task duration ≫ the median</strong>. Usually caused by a few dominant key values.</p>` },

  /* 4 - shuffle */
  { glow: "radial-gradient(540px 340px at 50% 16%, rgba(79,168,232,0.14), transparent 70%)",
    html: `
    <div class="tag reveal" style="color:var(--shuffle)"><span style="background:var(--shuffle);width:8px;height:8px;border-radius:50%;display:inline-block"></span>CULPRIT 2 · SHUFFLE</div>
    <h2 class="reveal" style="color:var(--shuffle)">Data crosses the network.</h2>
    <div class="art reveal">${A.shuffle}</div>
    <p class="lead reveal"><strong>Shuffle</strong> is data moving between nodes - triggered by wide operations like <strong>joins and groupBy</strong>. It's necessary but expensive. Large <strong>shuffle read/write</strong> in the stage metrics flags it as your bottleneck.</p>` },

  /* 5 - spill */
  { glow: "radial-gradient(540px 340px at 50% 16%, rgba(232,98,92,0.14), transparent 70%)",
    html: `
    <div class="tag reveal" style="color:var(--spill)"><span style="background:var(--spill);width:8px;height:8px;border-radius:50%;display:inline-block"></span>CULPRIT 3 · SPILL</div>
    <h2 class="reveal" style="color:var(--spill)">Memory overflows to disk.</h2>
    <div class="art reveal">${A.spill}</div>
    <p class="lead reveal"><strong>Spill</strong> happens when a task's data won't fit in memory, so Spark writes it to slow disk. The UI shows <strong>Spill (memory)</strong> and <strong>Spill (disk)</strong> columns - any spill means tasks are starved for memory and slowing down.</p>` },

  /* 6 - quiz 1 → skew */
  { glow: "radial-gradient(540px 340px at 50% 20%, rgba(224,144,58,0.14), transparent 70%)", quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check · 1 of 2</div>
    <h2 class="reveal" style="font-size:21px">In a stage, most tasks finish in ~5 seconds but <span style="color:var(--skew)">one takes 8 minutes</span>. Which problem is this?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span>Data skew</button>
      <button class="choice" data-correct="false"><span class="key">B</span>Shuffle</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Spill to disk</button>
    </div>
    <div class="feedback"><b>Skew.</b> One straggler task with a duration far above the median is the signature of skew - that task's partition got a disproportionate share of the data, and the whole stage waits for it.</div>` },

  /* 7 - quiz 2 → shuffle */
  { glow: "radial-gradient(540px 340px at 50% 20%, rgba(79,168,232,0.14), transparent 70%)", quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check · 2 of 2</div>
    <h2 class="reveal" style="font-size:21px">A stage with a large <span style="color:var(--shuffle)">join</span> shows very high shuffle read/write bytes. What's happening?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Skew - one key dominates</button>
      <button class="choice" data-correct="true"><span class="key">B</span>Shuffle - the join moves lots of data across the network</button>
      <button class="choice" data-correct="false"><span class="key">C</span>The job has failed</button>
    </div>
    <div class="feedback"><b style="color:var(--shuffle)">Shuffle.</b> Wide operations like joins repartition data across nodes; heavy shuffle read/write is the metric that exposes it. (A broadcast join can avoid shuffling the large side - a fix you'll meet later.)</div>` },

  /* 8 - done */
  { glow: "radial-gradient(560px 360px at 50% 16%, rgba(224,144,58,0.16), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Lesson complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">The three S's of a slow Spark job:</p>
    <div class="pills reveal">
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--skew)" stroke-width="2"><path d="M4 18h3M4 13h7M4 8h16" stroke-linecap="round"/></svg><p><b>Skew</b>One straggler task - max duration ≫ median</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--shuffle)" stroke-width="2"><path d="M7 8l-4 4 4 4M17 8l4 4-4 4M14 4l-4 16" stroke-linecap="round" stroke-linejoin="round"/></svg><p><b>Shuffle</b>Joins / groupBy move data - high shuffle read/write</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--spill)" stroke-width="2"><path d="M12 3v10m0 0l-3-3m3 3l3-3M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/></svg><p><b>Spill</b>Memory → disk - watch Spill (memory) / Spill (disk)</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg><p><b>Where</b>Spark UI → stage detail → task metrics</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ----------  ENGINE  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* Keys and swipes only move between cards. Leaving the lesson always takes
   a deliberate tap, so a stray swipe on the final card cannot navigate away. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
</html>
