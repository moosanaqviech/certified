    html: `

    <h2 class="reveal" style="font-size:22px">Analysts may use the customers table but must <span style="color:var(--col)">never see raw SSNs</span> — they should see a masked version. What do you apply?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span>A column mask on the ssn column</button>
      <button class="choice" data-correct="false"><span class="key">B</span>A REVOKE on the whole table</button>
      <button class="choice" data-correct="false"><span class="key">C</span>A row filter on the table</button>
    </div>
    <div class="feedback"><b>A column mask.</b> Masking redacts a specific column's value per user while leaving the rest of the row visible. Revoking the table removes all access, and a row filter hides rows — neither matches "see the table but mask one column."</div>` },

  /* 6 - quiz 2 */
  { glow: "radial-gradient(540px 340px at 50% 20%, rgba(79,184,232,0.13), transparent 70%)", quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check · 2 of 2</div>
    <h2 class="reveal" style="font-size:22px">Each regional manager should query the orders table but only see <span style="color:var(--row)">their own region's rows</span>. What enforces this?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>A column mask on the region column</button>
      <button class="choice" data-correct="true"><span class="key">B</span>A row filter (row-level security) keyed to the user's region</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Giving each manager their own copy of the table</button>
    </div>
    <div class="feedback"><b style="color:var(--row)">A row filter.</b> Row-level security restricts which rows return based on the caller's identity or group, so each manager sees only their region. Copying the table per manager defeats single-source governance.</div>` },

  /* 7 - done */
  { glow: "radial-gradient(560px 360px at 50% 16%, rgba(176,124,232,0.16), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Lesson complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">Fine-grained access, in three ideas:</p>
    <div class="pills reveal">
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--col)" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M14 4v16" /><path d="M16 10l3 2-3 2" stroke-linecap="round" stroke-linejoin="round"/></svg><p><b>Column masking</b>Redacts a column's value per user — SET MASK</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--row)" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M4 14h16" /><path d="M8 14l8-5" stroke-linecap="round"/></svg><p><b>Row-level security</b>Filters which rows return — SET ROW FILTER</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0114 0" stroke-linecap="round"/></svg><p><b>Decided by a UDF</b>is_account_group_member() / current_user() — no data copies</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ----------  ENGINE  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* Keys and swipes only move between cards. Leaving the lesson always takes
   a deliberate tap, so a stray swipe on the final card cannot navigate away. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
</html>
