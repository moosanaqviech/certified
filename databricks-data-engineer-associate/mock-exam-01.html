<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Full Mock 1",
  badge: "Databricks DE Associate",
  blurb: "Sit it cold, under exam conditions: forty-five scenario questions in ninety minutes, sampled across all seven exam sections at their official weights, no feedback until you submit. Pick the single best answer.",
  coverage: "Sealed mock 1 of 2. Samples all 35 chapters by section weight: Platform 10%, Ingestion 21%, Transformation 22%, Lakeflow Jobs 16%, CI/CD 10%, Monitoring 10%, Governance 11%. None of these questions appear in the unit practice tests.",
  minutes: 90,
  pass: 70
};
const QUESTIONS = [
  /* Ch 5 - Ingestion patterns */
  {
    q:`A team runs a nightly job and wants each run to process only the files that arrived in cloud storage since the previous run, with no always-on stream between runs. Which setup gives incremental processing at batch cadence?`,
    opts:[
      "An Auto Loader stream with Trigger.AvailableNow run by the scheduled job, so each run consumes everything new since the checkpoint and then stops",
      "A continuous job so the stream never has to restart and no files are missed",
      "A nightly full reload of the folder followed by dropDuplicates on the target",
      "COPY INTO with the force option set to true on every run"
    ],
    correct:0,
    explain:`Auto Loader's checkpoint remembers which files were processed, and Trigger.AvailableNow processes all new files as micro-batches then exits, which is incremental ingestion on a batch schedule. A continuous job (the tempting choice) delivers the same incrementality but keeps a cluster running all night for a workload that only needs to run once.`
  },
  /* Ch 2 - Delta Lake essentials */
  {
    q:`A batch job appends a DataFrame whose amount column is a STRING into a Delta table where amount is DECIMAL(18,2), and the write fails with a schema mismatch. A teammate suggests enabling mergeSchema. What is the right response?`,
    opts:[
      "Enable mergeSchema so Delta changes the existing column to STRING automatically",
      "Cast amount to DECIMAL before the write: schema enforcement is rejecting a type mismatch, and mergeSchema only adds new columns, it does not change existing types",
      "Drop the constraint on the amount column so the write can proceed",
      "Recreate the target as an external table, since external tables do not enforce schemas"
    ],
    correct:1,
    explain:`Schema enforcement exists to stop exactly this: a write whose column types do not match the table is rejected so the table stays trustworthy, and the fix is to conform the data before writing. mergeSchema (the tempting option) permits new columns to be added; it never silently rewrites an existing column's type, and external tables enforce schemas just like managed ones.`
  },
  /* Ch 11 - Bronze to Silver cleaning */
  {
    q:`Two months after launch, a team discovers that the Silver deduplication rule kept the wrong record whenever a source resent an order. They plan to recompute Silver from scratch with the corrected rule. Which property of the Bronze layer makes that repair possible?`,
    opts:[
      "Bronze is partitioned by ingestion date, so the affected days can be reloaded quickly",
      "Bronze enforces NOT NULL constraints, so every record needed for the rebuild is guaranteed present",
      "Bronze keeps the records exactly as ingested, append-only, so Silver can be rebuilt from the full history with the corrected logic",
      "Bronze is a materialized view that refreshes whenever Silver changes"
    ],
    correct:2,
    explain:`Bronze's job is to be the replayable raw landing zone: nothing is cleaned or deduplicated there, so a downstream logic bug is always recoverable by rebuilding from it. Partitioning by date (the tempting choice) helps performance but is irrelevant if the raw records had been overwritten or cleaned in place.`
  },
  /* Ch 10 - Choosing an ingestion method */
  {
    q:`Three sources need ingesting: employee records from a Workday tenant, about two million JSON event files a day landing in cloud storage with a drifting schema, and a weekly export of a dozen CSV files handled by a SQL-only team. Which pairing of tools is correct?`,
    opts:[
      "Workday: COPY INTO; JSON files: Lakeflow Connect; weekly CSVs: Auto Loader",
      "All three through Auto Loader, since it handles any file volume",
      "Workday: Auto Loader; JSON files: COPY INTO; weekly CSVs: Lakeflow Connect",
      "Workday: Lakeflow Connect; JSON files: Auto Loader; weekly CSVs: COPY INTO"
    ],
    correct:3,
    explain:`Ask where the data lives first: Workday data sits inside an application, so only Lakeflow Connect can reach it. Both other sources are already files in cloud storage, and between the file tools the millions of drifting JSON files point at Auto Loader while a dozen weekly CSVs for a SQL team point at COPY INTO. Routing everything through Auto Loader (the tempting simplification) cannot read Workday at all.`
  },
  /* Ch 1 - The Lakehouse */
  {
    q:`A media company keeps raw event Parquet files in cloud object storage and copies a curated subset into a separate warehouse every night. Leadership wants BI teams to get warehouse-grade guarantees (transactions, schema enforcement, governed access) directly on the lake so the nightly copy can be retired. What has to be added to the lake to make that possible?`,
    opts:[
      "A premium storage tier so queries against the raw files return quickly enough for dashboards",
      "An open table format with a transaction log, such as Delta Lake, on the same files, plus a catalog that governs access",
      "Validation logic inside every ingestion script so only well-formed Parquet is ever written",
      "One large always-on cluster that both the BI and data science teams share"
    ],
    correct:1,
    explain:`The lakehouse is exactly this combination: Delta's transaction log gives ACID writes, isolation for concurrent readers, and schema enforcement on ordinary cloud files, and Unity Catalog adds the governance the warehouse used to provide. Validating files in ingestion scripts (the tempting choice) cannot give readers isolation from half-finished writes or a single governed permission model; it only guards one write path.`
  },
  /* Ch 17 - Data quality checks */
  {
    q:`A Lakeflow Spark Declarative Pipelines flow must keep valid rows flowing into Silver, must never let rows with a null order_id reach Silver, and must keep the invalid rows somewhere for review, all without failing the pipeline. Which pattern achieves this?`,
    opts:[
      "An expectation with ON VIOLATION FAIL UPDATE, then inspect the failed run's event log for the bad rows",
      "A NOT NULL constraint on the Silver table plus a manual reprocess of any rejected batch",
      "A quarantine pattern: Silver uses an expectation with ON VIOLATION DROP ROW, and a separate quarantine table keeps the rows that fail the inverted expectation",
      "A bare EXPECT with no action so every row lands, then a weekly DELETE of the bad rows"
    ],
    correct:2,
    explain:`Three requirements need three properties: DROP ROW keeps the pipeline running while keeping bad rows out of Silver, and routing the same rows into a quarantine table preserves them for review. FAIL UPDATE (the tempting strict choice) stops the pipeline, and a bare EXPECT lets the bad rows into Silver.`
  },
  /* Ch 16 - Gold-layer objects */
  {
    q:`A gold layer needs two objects from an append-only clickstream Silver table: sessionized rows that should be appended as new events arrive, and a daily KPI aggregate whose inputs can change when late corrections update Silver. Which pairing fits?`,
    opts:[
      "A streaming table for both objects",
      "A materialized view for the sessionized rows and a streaming table for the KPI aggregate",
      "Standard views for both, refreshed by a scheduled job",
      "A streaming table for the append-only sessionized rows and a materialized view for the KPI aggregate whose inputs can change"
    ],
    correct:3,
    explain:`Streaming tables are built for data that arrives and is processed once, which matches appending sessions; materialized views recompute (incrementally where possible) whenever their inputs change, which matches an aggregate over data that gets corrected. Using a streaming table for the aggregate (the tempting choice) would not reflect updates to already-processed rows.`
  },
  /* Ch 35 - ABAC policies */
  {
    q:`An ABAC policy created on the sales catalog masks every column tagged pii for everyone except the privacy_team group. A table in the marketing catalog carries the same pii tag, but its columns are not masked. Why?`,
    opts:[
      "Tags cannot be evaluated across catalog boundaries",
      "Column masks override ABAC policies, so a table-level mask must exist first",
      "The privacy_team exception disables the policy for everyone once any member queries the table",
      "The policy applies within the securable it was created on; create it at a level that covers both catalogs, or add one on the marketing catalog as well"
    ],
    correct:3,
    explain:`ABAC policies attach to a securable and govern the objects beneath it, which is why a catalog-level policy reaches every tagged column in that catalog and nothing outside it. The tag mechanism itself is not catalog-scoped (the tempting reading); the scope of the policy is.`
  },
  /* Ch 8 - Auto Loader vs COPY INTO */
  {
    q:`An Auto Loader pipeline was built for a source that turned out to deliver about twenty files a month. Most of the pipeline's cost and complexity now sits in the streaming checkpoint and cluster setup. What should the team do?`,
    opts:[
      "Replace it with a scheduled COPY INTO statement: at tens of files a month, a streaming source is unnecessary overhead and COPY INTO stays idempotent",
      "Keep Auto Loader but switch to a continuous trigger so the checkpoint is always warm",
      "Move the source to a Lakeflow Connect managed connector for cloud storage",
      "Load the files into the Delta table by hand each month"
    ],
    correct:0,
    explain:`The trade-off signals point at COPY INTO: low, periodic volume and a preference for simple SQL. Auto Loader earns its streaming machinery when files arrive continuously in large numbers or schemas drift; keeping it on a continuous trigger (the tempting non-change) makes the cost problem worse.`
  },
  /* Ch 12 - Joins */
  {
    q:`To speed up a join, an engineer adds a broadcast hint on a 3 GB customer dimension. The job now runs slower and the driver logs show memory pressure. What should they do?`,
    opts:[
      "Raise spark.sql.autoBroadcastJoinThreshold to 4 GB so the hint is honored without pressure",
      "Broadcast the fact table instead, since it is the side being shuffled",
      "Remove the hint: broadcasting sends a full copy of the table through the driver to every executor, which a multi-gigabyte table cannot afford; let Spark use a shuffle join or shrink the dimension first",
      "Switch to a cross join, which never shuffles either side"
    ],
    correct:2,
    explain:`Broadcast joins win when the small side is genuinely small (tens of megabytes) because every executor holds a copy; at 3 GB that copy overwhelms driver and executor memory and the join slows down or fails. Raising the threshold (the tempting knob) only tells Spark to broadcast even bigger tables, making the problem worse.`
  },
  /* Ch 27 - Spark UI bottlenecks */
  {
    q:`In the Spark UI, one stage dominates a job's runtime with 800 GB of shuffle write, but its tasks are evenly sized and the spill columns are zero. Where should the optimization effort go?`,
    opts:[
      "Add executor memory, because heavy shuffle write indicates memory pressure",
      "Raise spark.sql.shuffle.partitions to 5000 so the shuffle is split into smaller pieces",
      "Reduce the volume crossing the network: filter and project before the join, and broadcast the small side if there is one",
      "Enable disk caching on the cluster so the shuffle files are served from cache"
    ],
    correct:2,
    explain:`Shuffle write measures how much data a wide operation moved across the cluster; with no spill and no skew, the cost is the volume itself, so the fix is to move less (earlier filters, narrower projections, a broadcast join). More memory (the tempting knob) addresses spill, which this stage does not have.`
  },
  /* Ch 28 - Liquid Clustering and Predictive Optimization */
  {
    q:`A table is partitioned by country and Z-ordered by order_date, but most queries now filter on customer_id and run slowly. The team wants better data skipping without another risky layout rewrite next year. What should they do?`,
    opts:[
      "Add customer_id as a second partition column so both filters skip files",
      "Keep the country partitions and run a nightly Z-order on customer_id instead",
      "Create one copy of the table per major customer",
      "Convert the table to Liquid Clustering with CLUSTER BY (customer_id); the clustering keys can be changed later without a manual rewrite"
    ],
    correct:3,
    explain:`Liquid Clustering replaces both partitioning and Z-ordering, avoids the small-file and skew traps of high-cardinality partition columns, and lets you change keys as query patterns change. Partitioning by customer_id (the tempting extension) creates millions of tiny partitions, which is exactly the trap it warns about.`
  },
  /* Ch 3 - Unity Catalog overview */
  {
    q:`A team needs to govern a set of scanned PDF invoices and serialized model files with the same permission model as their tables. Someone tried to register the folder as a table and it failed. Which Unity Catalog object should hold these files?`,
    opts:[
      "A volume, which governs non-tabular files under the same catalog.schema hierarchy and grants",
      "A Delta table with a single BINARY column holding the file bytes, so table grants apply",
      "A folder in the DBFS root, shared by path with the team",
      "An external table pointing at the folder with the file format set to binary"
    ],
    correct:0,
    explain:`Volumes are the Unity Catalog securable for non-tabular data: files live under catalog.schema.volume and are governed with the same GRANT model as tables. Stuffing bytes into a BINARY column (the tempting workaround) forces every reader through a table and loses the files as files; DBFS root is outside Unity Catalog governance entirely.`
  },
  /* Ch 29 - Diagnosing cluster failures */
  {
    q:`A scheduled job is marked failed before any task ran. The run page shows the job cluster never became available, and the cluster's event log mentions an init script exit code. Where should the investigation start?`,
    opts:[
      "It is a launch failure: read the cluster event log and the init script output, since none of the job's code ever executed",
      "It is a driver out-of-memory error: remove collect() calls from the notebook",
      "It is a spot instance reclamation: switch the workers to on-demand instances",
      "It is data skew: enable Adaptive Query Execution"
    ],
    correct:0,
    explain:`When a cluster fails to start, the reason lives in the cluster event log and startup logs, not in Spark; an init script that exits non-zero prevents the cluster from ever serving the job. Driver OOM and skew (the tempting Spark diagnoses) require the code to have run, which it did not.`
  },
  /* Ch 30 - Performance trends and baselines */
  {
    q:`A daily pipeline's runtime has grown roughly 5 percent a week for three months with no deployments in that period, and the input volume has grown at a similar rate. How should the team read this?`,
    opts:[
      "A single bad deployment: roll back the most recent release",
      "Noise: runtimes vary and this trend can be ignored",
      "Gradual creep tracking data growth: compare runtime against input volume in the run history, then plan layout optimization or capacity before the SLA is at risk",
      "Spot instance reclamations slowing the cluster on some nights"
    ],
    correct:2,
    explain:`A baseline that includes data volume separates a step change from creep: a smooth increase that moves with input size is organic growth, which calls for planning (clustering, compaction, right-sizing) rather than a hunt for one bad change. Rolling back a release (the tempting move) cannot help when nothing was released.`
  },

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
