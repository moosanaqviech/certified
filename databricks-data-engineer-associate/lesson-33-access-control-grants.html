      <button class="choice" data-correct="false"><span class="key">C</span>It's a conflict, so the table becomes read-only for everyone</button>
    </div>
    <div class="feedback"><b style="color:var(--deny)">Deny wins.</b> <code>DENY</code> takes precedence over any grant, so an explicit deny blocks access even when the principal is otherwise granted the privilege through a group.</div>` },

  /* 6 - done */
  { glow: "radial-gradient(560px 360px at 50% 16%, rgba(124,140,248,0.16), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Lesson complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">The access model, in four ideas:</p>
    <div class="pills reveal">
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--grant)" stroke-width="2"><path d="M5 12l4 4 10-10" stroke-linecap="round" stroke-linejoin="round"/></svg><p><b>GRANT</b>Privilege + object + principal; grant to groups</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M12 3v18M5 10l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg><p><b>Inheritance + USE</b>Grants cascade down; need USE on parent catalog/schema</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#e8a33d" stroke-width="2"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 015 5v3" stroke-linecap="round" stroke-linejoin="round"/></svg><p><b>REVOKE</b>Removes a grant — back to neutral</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--deny)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M5.5 5.5l13 13" stroke-linecap="round"/></svg><p><b>DENY</b>Explicit block — overrides any grant</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ----------  ENGINE  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* Keys and swipes only move between cards. Leaving the lesson always takes
   a deliberate tap, so a stray swipe on the final card cannot navigate away. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
</html>
