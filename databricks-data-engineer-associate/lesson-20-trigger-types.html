    <div class="eyebrow reveal">Decision</div>
    <h2 class="reveal">Match the trigger to the signal</h2>
    <p class="lead reveal" style="margin-bottom:18px">Exam scenarios hand you one of these clues. Map clue to trigger:</p>
    <div class="pills reveal">
      <div class="pill"><p><b>"Every night at 2 AM", "weekly report"</b>Fixed cadence in the wording: <span style="color:var(--accent);font-weight:600">Scheduled</span>.</p></div>
      <div class="pill"><p><b>"Within seconds", "real-time", "streaming"</b>Latency is the requirement: <span style="color:var(--accent);font-weight:600">Continuous</span>.</p></div>
      <div class="pill"><p><b>"Unpredictable", "whenever files land", "avoid wasted runs"</b>Data-driven and irregular: <span style="color:var(--accent);font-weight:600">File arrival</span>.</p></div>
    </div>
    <p class="lead reveal" style="margin-top:16px;font-size:15px">Cost order, low to high, when data is irregular: file arrival, then scheduled, then continuous.</p>
    <div class="spacer"></div>` },
 
  /* 7 - quiz 2 */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:24px">A fraud dashboard must reflect new events within seconds. The job runs a Structured Streaming pipeline. Which trigger?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Scheduled, with a cron firing every minute</button>
      <button class="choice" data-correct="true"><span class="key">B</span>Continuous</button>
      <button class="choice" data-correct="false"><span class="key">C</span>File arrival on the events location</button>
    </div>
    <div class="feedback"><b>Correct.</b> Continuous keeps the streaming job always on, giving second-level latency and automatic restarts. A adds cluster startup time to every run and can never hit "within seconds". C checks about once a minute and only reacts to new files, not a stream of events.</div>` },
 
  /* 8 - done */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Lesson complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">Time decides, the job decides, or the data decides.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Scheduled</b>Quartz cron, fixed cadence, blind to whether data arrived.</p></div>
      <div class="pill"><p><b>Continuous</b>Back-to-back runs, lowest latency, auto-restart, highest cost.</p></div>
      <div class="pill"><p><b>File arrival</b>Watches a UC volume or external location, fires only when files land.</p></div>
    </div>
    <div class="spacer"></div>` }
];


/* ============================================================
   ▲▲▲  LESSON PAYLOAD - END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE - shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* Keys and swipes only move between cards. Leaving the lesson always takes
   a deliberate tap, so a stray swipe on the final card cannot navigate away. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
</html>
