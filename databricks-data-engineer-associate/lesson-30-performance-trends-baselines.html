    <h2 class="reveal" style="font-size:21px">Why is a <span style="color:var(--base)">baseline</span> the first thing to establish before judging performance?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>It makes jobs run faster</button>
      <button class="choice" data-correct="true"><span class="key">B</span>It's the "normal" you compare new runs against</button>
      <button class="choice" data-correct="false"><span class="key">C</span>It replaces the need for monitoring</button>
    </div>
    <div class="feedback"><b>It defines "normal."</b> A baseline captures typical duration, cost, and data volume. Only by comparing a new run to it can you tell a genuine regression from everyday noise.</div>` },

  /* 6 - quiz 2 */
  { glow: "radial-gradient(540px 340px at 50% 20%, rgba(232,98,92,0.14), transparent 70%)", quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check · 2 of 2</div>
    <h2 class="reveal" style="font-size:21px">A job jumps from 10 to 40 minutes <span style="color:var(--bad)">the day after a deploy</span>, then stays there. Most likely cause?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Gradual data growth</button>
      <button class="choice" data-correct="true"><span class="key">B</span>A specific change — new code or config</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Random noise; ignore it</button>
    </div>
    <div class="feedback"><b>A specific change.</b> A sudden step that lines up with a deploy points to new code or config — not slow organic growth (which creeps) or noise (which doesn't hold). Check what shipped.</div>` },

  /* 7 - done */
  { glow: "radial-gradient(560px 360px at 50% 16%, rgba(79,168,232,0.16), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Lesson complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">Trends &amp; baselines, in four ideas:</p>
    <div class="pills reveal">
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--base)" stroke-width="2"><path d="M4 19V5m0 14h16" stroke-linecap="round"/><path d="M7 15l4-4 3 2 4-6" stroke-linecap="round" stroke-linejoin="round"/></svg><p><b>One run ≠ the story</b>A number only means something against a reference</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--base)" stroke-width="2"><path d="M4 12h16" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="12" r="2"/></svg><p><b>Baseline = normal</b>Typical duration, cost, and data volume</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--base)" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16" stroke-linecap="round"/></svg><p><b>Where</b>Jobs UI timeline · system tables · query history</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--bad)" stroke-width="2"><path d="M4 16l5-5 3 3 8-9" stroke-linecap="round" stroke-linejoin="round"/></svg><p><b>Creep vs. spike</b>Slow climb = data growth · sudden step = a change</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ----------  ENGINE  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* Keys and swipes only move between cards. Leaving the lesson always takes
   a deliberate tap, so a stray swipe on the final card cannot navigate away. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
</html>
