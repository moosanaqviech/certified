<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Full Mock 2",
  badge: "Databricks DE Associate",
  blurb: "Sit it cold, under exam conditions: forty-five scenario questions in ninety minutes, sampled across all seven exam sections at their official weights, no feedback until you submit. Pick the single best answer.",
  coverage: "Sealed mock 2 of 2. Samples all 35 chapters by section weight: Platform 10%, Ingestion 21%, Transformation 22%, Lakeflow Jobs 16%, CI/CD 10%, Monitoring 10%, Governance 11%. None of these questions appear in the unit practice tests.",
  minutes: 90,
  pass: 70
};
const QUESTIONS = [
  /* Ch 10 - Choosing an ingestion method */
  {
    q:`Another team exports nightly Parquet snapshots of their application's tables into a cloud storage bucket. A new engineer proposes ingesting them with Lakeflow Connect. What is the correct guidance?`,
    opts:[
      "Lakeflow Connect is right, because the Parquet files originate from an application",
      "A JDBC read of the bucket is the intended pattern for exported tables",
      "Auto Loader or COPY INTO: the data already sits as files in cloud storage, which is the file-ingestion tools' domain; Lakeflow Connect reaches into external systems",
      "Manual uploads through the workspace UI each morning"
    ],
    correct:2,
    explain:`The first question in choosing an ingestion method is where the data lives: files in cloud storage belong to COPY INTO or Auto Loader regardless of what produced them. Lakeflow Connect (the tempting choice, since an application is involved) connects to the application or database itself, not to a bucket of exports.`
  },
  /* Ch 29 - Diagnosing cluster failures */
  {
    q:`A job cluster fails to launch with a message from the cloud provider that the requested instance type is unavailable in the availability zone. What kind of failure is this, and what fixes it?`,
    opts:[
      "A notebook syntax error; fix the code and rerun",
      "A driver out-of-memory error; increase driver memory",
      "A cloud capacity or quota launch failure: choose another instance type or zone (or use a fleet or pool) and retry; the code never ran",
      "Data skew; enable Adaptive Query Execution"
    ],
    correct:2,
    explain:`When the cluster never starts, the cause is infrastructure, and the cluster event log says so: the cloud could not supply the machines requested. Driver memory (the tempting Spark fix) is irrelevant to a driver that was never provisioned.`
  },
  /* Ch 18 - Anatomy of a Job */
  {
    q:`An hourly job usually takes 40 minutes, but once a week it takes 70, and on those days the next hourly run does not happen at all. Which job setting explains this, and what does it control?`,
    opts:[
      "Maximum concurrent runs, set to 1: when a trigger fires while a run is active, the new run is skipped rather than started in parallel",
      "Task retries, which absorbed the second run",
      "The task timeout, which cancelled the second run",
      "For each concurrency, which limits parallel iterations"
    ],
    correct:0,
    explain:`The job-level concurrency limit decides what happens when a trigger fires during an active run; at 1, the overlapping run is skipped. Retries and timeouts (the tempting settings) act on a task inside a run, not on whether a run starts.`
  },
  /* Ch 28 - Liquid Clustering and Predictive Optimization */
  {
    q:`Predictive Optimization is enabled for the account, and the team's managed tables are being compacted automatically, but their external tables never are. Why, and what should they do?`,
    opts:[
      "Predictive Optimization runs on every Delta table; the external tables must have it disabled individually",
      "Predictive Optimization only handles VACUUM, not OPTIMIZE",
      "External tables cannot be optimized at all",
      "Predictive Optimization targets Unity Catalog managed tables; convert the external tables to managed with SET MANAGED, or keep a scheduled OPTIMIZE for them"
    ],
    correct:3,
    explain:`Predictive Optimization decides when to run OPTIMIZE, clustering, and VACUUM for managed tables, where Unity Catalog owns the data; external tables are outside that scope and keep needing a manual schedule unless converted. The tempting reading, that every Delta table is covered, is the reason the external tables were forgotten.`
  },
  /* Ch 33 - Access control */
  {
    q:`A user with SELECT on the finance.reports.margins table tries to GRANT SELECT on it to a teammate and gets a permission error. What is the reason?`,
    opts:[
      "SELECT includes the right to re-grant the same privilege",
      "The teammate needs USE CATALOG before any grant can be issued",
      "GRANT statements can only be run from a SQL warehouse",
      "Granting requires ownership of the object or the MANAGE privilege on it; ask the owner to grant the access or to transfer ownership"
    ],
    correct:3,
    explain:`Having a privilege and being allowed to hand it out are different things in Unity Catalog: owners and holders of MANAGE administer grants on an object, and holding SELECT does not. The USE CATALOG idea (the tempting choice) is a traversal privilege the teammate will also need, but it is not why the GRANT failed.`
  },
  /* Ch 9 - Lakeflow Connect */
  {
    q:`A source is supported by Lakeflow Connect, but the team needs to apply custom transformation logic during extraction and wants control over the pipeline's internals rather than a fully hands-off setup. Which connector type fits?`,
    opts:[
      "A standard connector, trading the managed connector's hands-off simplicity for more control over the pipeline",
      "A managed connector, which allows arbitrary custom code inside the extraction step",
      "COPY INTO pointed at the SaaS application's API",
      "Auto Loader with a JDBC source option"
    ],
    correct:0,
    explain:`The managed versus standard choice is a control trade-off: managed connectors have Databricks run the whole pipeline, and standard connectors give the team more hands-on control at the cost of that simplicity. The tempting reading, that managed connectors accept custom code, is backwards; that is what makes them managed.`
  },
  /* Ch 32 - Converting managed and external */
  {
    q:`A team's external Delta tables are missing out on automatic maintenance, and dropping and recreating them during migrations has become error-prone. They want Unity Catalog to own the data going forward. Which statement is correct?`,
    opts:[
      "Recreate each table as a new external table in a fresh bucket",
      "Grant MODIFY on the tables to the platform team",
      "Run ALTER TABLE ... SET MANAGED on each table; afterward Unity Catalog owns the data, DROP TABLE removes the files, and automatic maintenance such as Predictive Optimization applies",
      "Enable Change Data Feed, which converts the tables to managed"
    ],
    correct:2,
    explain:`SET MANAGED is the in-place upgrade from external to managed, and the important consequence to remember is that the drop behavior flips: the data lifecycle is now tied to the table. Recreating as external (the tempting choice) leaves the tables exactly where they started.`
  },
  /* Ch 20 - Trigger types */
  {
    q:`A team configures a file arrival trigger on a plain cloud storage URL that has never been registered in Unity Catalog, and the trigger cannot be saved. What is required?`,
    opts:[
      "File arrival triggers only work on the DBFS root",
      "File arrival triggers require the job to run continuously",
      "The monitored path must be a Unity Catalog external location or volume; register the storage first",
      "Replace the trigger with a one-minute schedule"
    ],
    correct:2,
    explain:`File arrival triggers watch governed storage: a Unity Catalog volume or external location, which is what gives the platform permission to monitor the path. A one-minute schedule (the tempting substitute) trades an event-driven start for hundreds of empty runs a day.`
  },
  /* Ch 31 - Managed vs external tables */
  {
    q:`An engineer runs CREATE TABLE sales.bronze.events (id INT, payload STRING) and then looks for the table's files in the team's bucket, but nothing is there. Why?`,
    opts:[
      "The files are still being written and will appear after the first OPTIMIZE",
      "A CREATE TABLE without a LOCATION clause makes a managed table, stored in the schema's or catalog's managed storage location rather than the team's bucket",
      "Managed tables keep their data in the metastore database, not in files",
      "The statement created a view, which has no files"
    ],
    correct:1,
    explain:`Managed is the default: without LOCATION, Unity Catalog places the files in the managed storage configured for that schema or catalog and owns them. Only an external table (LOCATION specified) lives in a path the team chose.`
  },
  /* Ch 23 - Asset Bundles */
  {
    q:`A job defined in a bundle was edited directly in the production UI to change its schedule. The next databricks bundle deploy -t prod put the old schedule back. What is going on?`,
    opts:[
      "Bundle deploys own the resources they define and overwrite them on each deploy; change the schedule in the bundle's YAML and redeploy so source stays the truth",
      "The UI edit failed to save",
      "The job must be deleted before each deploy so UI edits persist",
      "Running databricks bundle run would have saved the UI edit"
    ],
    correct:0,
    explain:`Bundles are infrastructure as code: the resource definitions in databricks.yml are the source of truth, and a deploy reconciles the workspace to them. Deleting the job before deploy (the tempting idea) would also discard the run history and change nothing about where edits should be made.`
  },
  /* Ch 14 - Deduplication and aggregations */
  {
    q:`A streaming aggregation uses a 10-minute watermark, but a monitoring source is known to deliver events up to two hours late, and those late events are being dropped from the hourly totals. What should change?`,
    opts:[
      "Remove the watermark so no event is ever dropped",
      "Switch from an aggregation to dropDuplicates",
      "Shorten the watermark to one minute so results flush faster",
      "Widen the watermark to about two hours so late events are still counted, accepting the larger state and later finalization that come with it"
    ],
    correct:3,
    explain:`The watermark is a promise about how late data can be; events later than it are dropped by design, so it must cover the source's real lateness. Removing it (the tempting fix) means state is never expired and the job's memory grows without bound.`
  },
  /* Ch 6 - COPY INTO */
  {
    q:`Pipe-delimited CSV files with a header row land under nested date folders alongside unrelated .log files. A SQL team must load only the CSVs with COPY INTO. Which clauses are correct?`,
    opts:[
      "COPY_OPTIONS ('header' = 'true', 'delimiter' = '|') and a WHERE clause excluding .log files",
      "Rename the .log files to .txt so COPY INTO ignores them",
      "PATTERN = '*.csv' together with FORMAT_OPTIONS ('header' = 'true', 'delimiter' = '|')",
      "Load everything with default options, then filter out the log rows in Silver"
    ],
    correct:2,
    explain:`PATTERN selects which files under the source path are read, and parsing details such as the header row and delimiter belong in FORMAT_OPTIONS. Putting header and delimiter in COPY_OPTIONS (the tempting mix-up) targets the wrong clause: COPY_OPTIONS controls load behavior such as force and mergeSchema.`
  },
  /* Ch 14 - Deduplication and aggregations */
  {
    q:`An orders-per-customer report undercounts. The query uses count(discount_code) grouped by customer_id, and many orders have no discount code. What is the correct aggregation?`,
    opts:[
      "count(*) (or count of a non-null key such as order_id), because count on a nullable column skips the nulls",
      "count(discount_code) is correct; the undercount must come from a join",
      "sum(1) over discount_code, which includes null rows",
      "approx_count_distinct(order_id), which estimates the true total"
    ],
    correct:0,
    explain:`count(column) counts only non-null values in that column, so every order without a discount code vanished from the total; count(*) counts rows. The distinct estimate (the tempting alternative) answers a different question and adds approximation to a query that needs an exact count.`
  },
  /* Ch 7 - Auto Loader */
  {
    q:`Auto Loader infers a zip_code column from CSV files as an integer, which strips the leading zeros the business needs. Which option fixes the type at inference time?`,
    opts:[
      "Provide cloudFiles.schemaHints with zip_code declared as STRING so inference uses that type",
      "Cast the column after loading; inference cannot be influenced",
      "Set cloudFiles.schemaEvolutionMode to rescue so the original text is kept",
      "Switch to COPY INTO, which never infers types"
    ],
    correct:0,
    explain:`Schema hints let you pin the type of specific columns while inference handles the rest, which is the intended fix for an inferred type that loses information. Rescue mode (the tempting choice) governs how new or mismatched fields are handled; it does not change how an existing column is typed.`
  },
  /* Ch 24 - Environment promotion */
  {
    q:`A team asks what should differ between their dev, test, and prod deployments of the same pipeline. Which answer matches the recommended promotion model?`,
    opts:[
      "A separate code branch per environment with environment-specific edits",
      "The same data in every environment so tests are realistic",
      "Manual configuration in each workspace so operators stay in control",
      "One bundle source with per-target overrides such as catalog names, compute sizes, and whether schedules are paused"
    ],
    correct:3,
    explain:`Promotion keeps the code and resource definitions identical and varies only the target-specific settings, so what passed in test is what runs in prod. A branch per environment (the tempting structure) guarantees that the environments drift apart over time.`
  },
  /* Ch 25 - The Databricks CLI */
  {
    q:`After a bundle deploy to a staging target, the CI pipeline should trigger the deployed job and report its result. Which command does this?`,
    opts:[
      "databricks bundle validate, which runs the job in a dry-run mode",
      "databricks bundle run <job_key> -t staging, which triggers the deployed job in that target and reports the run",
      "databricks bundle destroy, which removes and recreates the job to test it",
      "databricks fs cp, which uploads the notebook and starts it"
    ],
    correct:1,
    explain:`The bundle verbs map onto the lifecycle: validate checks configuration, deploy creates or updates resources, run triggers a deployed job or pipeline, destroy removes them. validate (the tempting choice) never executes anything, which is exactly why it is safe on pull requests.`
  },
  /* Ch 27 - Spark UI bottlenecks */
  {
    q:`A stage's tasks all take roughly the same time, and every one of them shows spill to memory and disk in the Spark UI. What does this pattern indicate?`,
    opts:[
      "Uniform tasks that all spill mean each shuffle partition is too large for the memory available; increase the number of shuffle partitions or the memory per executor",
      "Data skew on one key; salt the join key",
      "A driver out-of-memory condition; remove collect() calls",
      "A network bottleneck in the shuffle service"
    ],
    correct:0,
    explain:`Skew shows up as one or a few straggler tasks; when every task spills evenly, the problem is that each partition simply does not fit in memory. Salting (the tempting fix) redistributes a hot key that this stage does not have.`

/* =====================================================================

===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
