  .btn { flex: 1; border: none; font-family: var(--body); font-weight: 700; font-size: 16px; letter-spacing: 0.01em; padding: 16px; border-radius: 16px; cursor: pointer; background: var(--ink); color: var(--bg); transition: transform 0.15s ease, opacity 0.2s ease, background 0.3s ease; }

  .choice { text-align:left; cursor:pointer; background: var(--surface-2); border: 1.5px solid var(--line); color: var(--ink); font-family: var(--body); font-weight: 600; font-size: 15px; padding: 16px 18px; border-radius: 15px; display:flex; align-items:center; gap: 13px; transition: border-color 0.2s, background 0.2s, transform 0.1s; }

  .feedback { margin-top:16px; font-size:14.5px; line-height:1.5; color: var(--ink-soft); opacity:0; transform: translateY(8px); transition: 0.35s ease; }

  { html: `

    <h2 class="reveal">In a stream, bound the memory.</h2>
    <div class="art reveal">${A.watermark}</div>
    <p class="lead reveal" style="margin-bottom:16px">Streaming dedup has to remember every key it has seen, which grows without limit. Add a watermark on the event-time column so Spark can drop old state once late data is no longer expected.</p>
    <div class="codeblock reveal">df.<span class="al">withWatermark</span>(<span class="st">"event_time"</span>, <span class="st">"1 hour"</span>) \\
  .dropDuplicates([<span class="st">"id"</span>, <span class="st">"event_time"</span>])</div>
    <div class="spacer"></div>` },

  /* 7 - aggregations concept */
  { html: `
    <div class="eyebrow reveal">Aggregations</div>
    <h2 class="reveal">groupBy, then agg.</h2>
    <div class="art reveal">${A.aggregate}</div>
    <p class="lead reveal" style="margin-bottom:16px">Group rows by a key, then compute a summary per group. Watch the counting verbs: <code>count()</code> tallies rows, <code>countDistinct()</code> tallies unique values, and <code>approx_count_distinct()</code> trades a little accuracy for big speed at scale.</p>
    <div class="codeblock reveal">df.groupBy(<span class="st">"region"</span>).<span class="al">agg</span>(
    sum(<span class="st">"amount"</span>).alias(<span class="st">"revenue"</span>),
    <span class="al">countDistinct</span>(<span class="st">"user_id"</span>).alias(<span class="st">"buyers"</span>))</div>
    <div class="spacer"></div>` },

  /* 8 - quiz 3 */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check · 3 of 3</div>
    <h2 class="reveal" style="font-size:24px">You need unique customers per region from a billion-row table, and exact precision is not required. Which is most efficient?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>agg(count("user_id"))</button>
      <button class="choice" data-correct="false"><span class="key">B</span>agg(countDistinct("user_id"))</button>
      <button class="choice" data-correct="true"><span class="key">C</span>agg(approx_count_distinct("user_id"))</button>
    </div>
    <div class="feedback"><b>Correct.</b> <code>approx_count_distinct</code> uses HyperLogLog to estimate uniques far more cheaply at scale. <code>count()</code> would tally rows (including repeats), not unique customers, and <code>countDistinct()</code> is exact but heavier.</div>` },

  /* 9 - done */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Lesson complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">Clean the repeats, then summarize the rest.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>dropDuplicates()</b>No args is full-row dedup (= DISTINCT); pass keys for a subset.</p></div>
      <div class="pill"><p><b>Keep the latest</b>row_number() over a window, ordered by time, keep rank 1.</p></div>
      <div class="pill"><p><b>Streaming</b>Add a watermark so dedup state stays bounded.</p></div>
      <div class="pill"><p><b>Aggregations</b>groupBy().agg(); approx_count_distinct for cheap uniques at scale.</p></div>
    </div>
    <div class="spacer"></div>` }
];
/* ----------  ENGINE - shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
</html>
