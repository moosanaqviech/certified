      <button class="choice" data-correct="false"><span class="key">C</span>It only renames the table</button>
    </div>
    <div class="feedback"><b>It becomes managed.</b> <code>SET MANAGED</code> upgrades an external Delta table to a managed one, so Unity Catalog owns the data and runs maintenance like Predictive Optimization for you.</div>` },

  /* 6 - quiz 2 */
  { glow: "radial-gradient(540px 340px at 50% 20%, rgba(232,80,80,0.13), transparent 70%)", quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check · 2 of 2</div>
    <h2 class="reveal" style="font-size:22px">After converting an external table to <span style="color:var(--managed)">managed</span>, what changes about <code>DROP TABLE</code>?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span>Dropping it now also deletes the underlying data files</button>
      <button class="choice" data-correct="false"><span class="key">B</span>Nothing changes; the files always survive a drop</button>
      <button class="choice" data-correct="false"><span class="key">C</span>DROP TABLE is no longer allowed</button>
    </div>
    <div class="feedback"><b>The data gets deleted.</b> Managed tables tie the data lifecycle to the table, so after conversion a drop removes the files too — the opposite of the external behaviour you started with.</div>` },

  /* 7 - done */
  { glow: "radial-gradient(560px 360px at 50% 16%, rgba(52,211,166,0.16), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Lesson complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">Converting, in three ideas:</p>
    <div class="pills reveal">
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M4 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg><p><b>External → managed</b>ALTER TABLE … SET MANAGED upgrades a Delta table in place</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#e85050" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke-linecap="round" stroke-linejoin="round"/></svg><p><b>Lifecycle flips</b>Managed DROP deletes data — verify before you switch</p></div>
      <div class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--managed)" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M12 8v8" stroke-linecap="round"/></svg><p><b>Need to relocate?</b>CTAS or DEEP CLONE into the target type, then repoint</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ----------  ENGINE  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* Keys and swipes only move between cards. Leaving the lesson always takes
   a deliberate tap, so a stray swipe on the final card cannot navigate away. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled && !cards[i].last) go(i + 1);
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
</html>
