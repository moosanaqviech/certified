      <p class="lead" data-step="2" style="font-size:14.5px">The hypothesis becomes one change: raise overlap so boundary text lives in both neighbors. Size and strategy stay frozen this round.</p>
      <p class="lead" data-step="3" style="font-size:14.5px">A chunking change is a rebuild: re-chunk, re-embed with the same embedding model the index uses, re-index. Skip a step and the index lies.</p>
      <p class="lead" data-step="4" style="font-size:14.5px">Same eval set, same metric. Recall@5 moved from 0.58 to 0.71, so the change stays. Flat or worse: revert, next hypothesis.</p>
    </div>` },

  /* 4 : symptom map */
  { html: `
    <div class="eyebrow reveal">Failure patterns</div>
    <h2 class="reveal">Read the symptom, pick the dial</h2>
    <p class="lead reveal" style="margin-bottom:16px">Each retrieval failure pattern points at a specific chunking adjustment.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Answer split across chunks</b>Retrieved chunks each hold half the answer. Chunks are too small or overlap too low: raise one of them.</p></div>
      <div class="pill"><p><b>Right keywords, buried answer</b>Chunks match the query terms but drown the answer in unrelated text, and the embedding averaged the meaning away. Shrink chunks or split on structure instead of fixed size.</p></div>
      <div class="pill"><p><b>Whole-section questions</b>Answers only make sense with surrounding context. Use structure-aware chunks, or parent-document retrieval: match on small chunks, hand the LLM the parent section.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 5 : model constraints */
  { html: `
    <div class="eyebrow reveal">The walls</div>
    <h2 class="reveal">Models bound the search space</h2>
    <p class="lead reveal" style="margin-bottom:16px">The loop only explores candidate sizes that <strong>both models can carry</strong>.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Embedding model input limit</b>A candidate chunk longer than the embedding model's context length gets truncated before embedding, so its tail never reaches the index. Chapter 22's ceiling applies to every size you try.</p></div>
      <div class="pill"><p><b>LLM prompt budget</b>k chunks times chunk size must fit the prompt alongside instructions and the question. Bigger chunks mean fewer of them fit per request.</p></div>
      <div class="pill"><p><b>Then tune inside the walls</b>Within those limits, the eval set decides. Outside them, no metric can save the candidate.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 6 : quiz */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:21px">Recall@5 sits at 0.55. Tracing the misses: each failing answer is a procedure whose steps straddle two adjacent 150-token chunks (no overlap), and no single retrieved chunk holds the full procedure. Next move?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Swap in a larger LLM with a bigger context window</button>
      <button class="choice" data-correct="false"><span class="key">B</span>Add a re-ranker on top of the current index</button>
      <button class="choice" data-correct="true"><span class="key">C</span>Increase chunk size or add overlap, rebuild the index, re-measure recall@5</button>
      <button class="choice" data-correct="false"><span class="key">D</span>Raise k from 5 to 25 so more chunks reach the prompt</button>
    </div>
    <div class="feedback"><b>Correct.</b> The evidence names a chunking failure: answers are being cut at chunk boundaries, so the fix is bigger chunks or more overlap, then a rebuild and a re-measure on the same eval set. A is the tempting trap: no LLM can answer from a procedure it never receives, because the failure is in retrieval, not generation. B only reorders chunks that each still hold half the answer, and D mostly adds noise without guaranteeing both halves arrive together.</div>` },

  /* 7 : discipline */
  { html: `
    <div class="eyebrow reveal">Discipline</div>
    <h2 class="reveal">One variable per loop</h2>
    <p class="lead reveal" style="margin-bottom:16px">The loop only attributes wins when you <strong>change exactly one thing</strong> between measurements.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Size, overlap, or strategy</b>Pick one dial per iteration. Move two at once and the metric cannot tell you which one earned the delta.</p></div>
      <div class="pill"><p><b>Every change costs a rebuild</b>Re-chunk, re-embed, re-index before re-measuring. That cost is why hypotheses come from failure analysis, not from a grid of random sizes.</p></div>
      <div class="pill"><p><b>Exam signal</b>When a question hands you a retrieval failure pattern plus metrics, the answer is a chunking adjustment. A bigger LLM or a re-ranker is the distractor that ignores the evidence.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 8 : done */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Loop closed</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">Chunking is tuned by evidence: eval set, hypothesis, one change, re-measure.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Eval set first</b>Real queries mapped to expected documents. Without it, tuning is guessing.</p></div>
      <div class="pill"><p><b>Symptoms map to dials</b>Split answers: more size or overlap. Buried answers: smaller or structure-aware chunks. Whole-section needs: parent-document retrieval.</p></div>
      <div class="pill"><p><b>One change, one rebuild, one verdict</b>Keep the change only when recall@k or precision@k moved on the same eval set.</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ----------
   v2 adds opt-in, per-card step builds on top of the v1 card engine. A card
   with no `steps` field takes exactly the v1 paths below and renders and
   behaves identically; every v2 branch is guarded by `steps` being present. */
const ENGINE_VERSION = 'v2';
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};
const stepState = {};   // v2: current revealed step per card index (mirrors `answered`)

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

/* v2: apply step visibility for one card WITHOUT touching its .in class, so a
   step reveal never replays the card-entrance .reveal stagger. Cumulative for
   normal elements (data-step <= current). Captions append by default: inside
   .stepcaps they accumulate too (data-step="0" is the pre-first-tap caption),
   and captions behind the current step get .step-past (dimmed) while the
   current one stays at full strength. A .stepcap-swap container (or legacy
   .stepcap) opts into swap: only the caption whose data-step equals the
   current step is shown. */
function applySteps(idx) {
  const cur = stepState[idx] || 0;
  els[idx].querySelectorAll('[data-step]').forEach(function(nd) {
    const s = parseInt(nd.getAttribute('data-step'), 10);
    const swapCap = nd.closest && nd.closest('.stepcap-swap, .stepcap');
    const appendCap = !swapCap && nd.closest && nd.closest('.stepcaps');
    const on = swapCap ? (s === cur) : appendCap ? (s <= cur) : (s >= 1 && s <= cur);
    nd.classList.toggle('step-on', on);
    nd.classList.toggle('step-past', !!appendCap && on && s < cur);
  });
}

/* Card layout: the only place that adds/removes .in (and thus replays reveal).
   Called on card change, never on a step advance. */
function layout() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
    applySteps(idx);   // persists built state on revisit
  });
  glow.style.background = cards[i].glow || 'transparent';
}

/* Footer/button state only. Safe to call after a step advance (no reveal). */
function updateFooter() {
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  const total = c.steps || 0;
  const stepsLeft = total > 0 && (stepState[i] || 0) < total;
  if (stepsLeft) { nextBtn.disabled = false; nextBtn.textContent = (i === 0) ? 'Begin lesson' : 'Continue'; }
  else if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
}

function render() {
  layout();
  updateFooter();
  if (cards[i].quiz) wireQuiz(els[i], i);
}

/* v2: reveal the next step of the current card. Returns true if a step was
   consumed (so the caller does not also advance the card). */
function advanceStep(idx) {
  const total = cards[idx].steps || 0;
  if (!total) return false;
  const cur = stepState[idx] || 0;
  if (cur >= total) return false;
  stepState[idx] = cur + 1;
  applySteps(idx);
  updateFooter();
  return true;
}

/* v2: reveal every remaining step at once (swipe-left escape hatch). */
function skipSteps(idx) {
  const total = cards[idx].steps || 0;
  if (!total || (stepState[idx] || 0) >= total) return false;
  stepState[idx] = total;
  applySteps(idx);
  updateFooter();
  return true;
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

/* Primary action. On a step card mid-build this reveals the next step; once
   the steps are done (or on a card with none) it advances, honoring the quiz
   gate exactly as v1 did. Shared by the Continue button and ArrowRight. */
function handleNext() {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  if (advanceStep(i)) return;
  go(i + 1);
}
nextBtn.onclick = handleNext;
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* v2: tapping anywhere on a step card advances one step; once built, a tap
   advances the card (gate permitting). Cards with no steps ignore taps, so
   this listener is inert on v1-style cards. Elements with their own behavior
   (quiz choices, links) are skipped so a tap never double-fires. */
vp.addEventListener('click', e => {
  const c = cards[i];
  if (!c.steps) return;
  if (e.target.closest('.choice, a')) return;
  if ((stepState[i] || 0) < c.steps) { advanceStep(i); return; }
  if (!nextBtn.disabled && !c.last) go(i + 1);
});

/* Keys and swipes only move between cards (or, for a step card, between
   steps). Leaving the lesson always takes a deliberate tap, so a stray swipe
   on the final card cannot navigate away. ArrowRight mirrors the Continue
   button step-wise; ArrowLeft mirrors Back. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) handleNext();
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  // Swipe left: skip any remaining steps and advance in one gesture, honoring
  // the quiz gate (updateFooter re-derives nextBtn.disabled after the skip).
  if (dx < -50 && !cards[i].last) { skipSteps(i); if (!nextBtn.disabled) go(i + 1); }
  if (dx > 50 && i > 0) go(i - 1);
});

render();
</script>
</body>
</html>
