<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */

const E = {
  name: "Practice Exam 2",
  badge: "Databricks GenAI Engineer Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer. Databricks publishes no official passing score; 70% is our practice target.",
  coverage: "Covers all 13 objectives of Section 3: Application Development.",
  minutes: 26,
  pass: 70
};

const QUESTIONS = [

  /* Q1 · Ch 16 - Select Langchain/similar tools for a GenAI application */
  {
    q:`An insurance claims agent must classify each claim, route high-value claims to a human approval gate, loop through tool calls against three back-end systems, and carry state across those steps. Which orchestration choice fits best?`,
    opts:[
      "A single LangChain LCEL chain, since one linear pass covers every case",
      "LangGraph, whose graph of nodes handles loops, branching, human gates, and shared state",
      "Plain Python with no framework, hand-rolling the state machine from scratch",
      "LlamaIndex, because it specializes in this kind of stateful control flow"
    ],
    correct:1,
    explain:`Why: the workload is stateful and cyclic, with branching, loops, and a human approval gate, which is exactly what LangGraph's node-and-edge graph models. A single linear LCEL chain (A) cannot loop or branch back, and while plain Python (C) could do it, you would be rebuilding the control flow LangGraph already provides. LlamaIndex is retrieval-centric, not a general agent control-flow framework.`
  },

  /* Q2 · Ch 17 - Augment a prompt with context from user input by field, term, and intent */
  {
    q:`A support bot answers billing questions from one shared policy corpus. Refund rules differ by plan tier, users state their tier in their messages, yet answers keep citing the wrong tier's rules. What is the right fix?`,
    opts:[
      "Raise the model temperature so it considers more possibilities",
      "Add every tier's full policy to the system prompt on every call",
      "Extract the tier from the user's message and use it to filter retrieval to that tier's rules",
      "Switch to a larger LLM with a longer context window"
    ],
    correct:2,
    explain:`Why: the message already carries the tier, so prompt augmentation extracts that field and uses it to scope retrieval to the matching rules, which fixes the wrong-tier citations. Raising temperature (A) adds randomness, not precision, dumping all tiers into the prompt (B) invites the same confusion at higher cost, and a bigger model (D) does not know which tier applies unless you tell it.`
  },

  /* Q3 · Ch 18 - Create a prompt that adjusts an LLM's response from a baseline to a desired output */
  {
    q:`A support bot's baseline reply is factually accurate but rambling and casual. The spec wants a formal tone capped at three bullet points. What is the right next move?`,
    opts:[
      "Add explicit format and tone instructions (formal, at most three bullets), changing one lever at a time",
      "Swap in a different base model and hope the style improves",
      "Lower the temperature to zero to make the answer shorter",
      "Retrieve more documents so the model has more to work with"
    ],
    correct:0,
    explain:`Why: the content is right and only the presentation is off, so the fix is a targeted instruction that specifies the desired tone and format, adjusting one lever so you can see its effect. Changing the model (B) is a large move for a formatting gap, temperature (C) controls randomness, not structure, and more retrieval (D) makes a rambling answer longer, not tighter.`
  },

  /* Q4 · Ch 19 - Qualitatively assess responses to identify quality and safety issues */
  {
    q:`A benefits bot answers from retrieved handbook chunks. The chunks state parental leave is 16 weeks. The response says: "You get 12 weeks of paid parental leave, per Section 4.2." No chunk mentions 12 weeks or a Section 4.2. Which failure mode is this?`,
    opts:[
      "A retrieval miss, since the right chunk was never fetched",
      "A safety violation, since the content is harmful",
      "A formatting error in the citation style",
      "Hallucination: the answer states facts not grounded in the retrieved context"
    ],
    correct:3,
    explain:`Why: the correct context was retrieved (16 weeks) but the answer invented a different number and a citation that appears nowhere, which is ungrounded generation, or hallucination. It is not a retrieval miss (A) because the right chunk was present, and the problem is fabricated facts, not harmful content (B) or citation style (C).`
  },

  /* Q5 · Ch 20 - Implement LLM guardrails to prevent negative outcomes */
  {
    q:`A RAG assistant answers HR questions from wiki pages that sometimes contain employee ID numbers. The requirement: an ID number must never appear in a response. Where must the guardrail sit?`,
    opts:[
      "In the system prompt, by asking the model politely not to reveal IDs",
      "On the output, as an enforced guardrail that inspects the generated response before it is returned",
      "On the input only, by rejecting questions that mention IDs",
      "In the retriever, by lowering the number of chunks returned"
    ],
    correct:1,
    explain:`Why: only an output guardrail sees the finished draft, so it is the layer that can catch and block an ID number the model included, guaranteeing it never reaches the user. A prompt (A) asks but does not enforce, an input guardrail (C) cannot catch an ID that came from the retrieved context, and reducing chunks (D) does not stop an ID in a chunk that is still retrieved.`
  },

  /* Q6 · Ch 21 - Select the best LLM based on the attributes of the application */
  {
    q:`An application must run fully in your Databricks account for data-residency reasons, needs domain fine-tuning later, and has a tight per-token budget. Which model choice fits these attributes?`,
    opts:[
      "A frontier proprietary model called over the public internet, since it tops the leaderboards",
      "Whichever model has the highest MMLU score, regardless of hosting",
      "An open model served on Databricks, which stays in your account and can be fine-tuned",
      "A different proprietary model for each request to spread the load"
    ],
    correct:2,
    explain:`Why: the deciding attributes are residency (stays in your account), fine-tunability, and cost, and an open model served on Databricks satisfies all three. A frontier proprietary model over the public internet (A) breaks residency and is not fine-tunable by you, a leaderboard score (B) ignores the actual constraints, and rotating proprietary models (D) solves nothing here.`
  },

  /* Q7 · Ch 22 - Select an embedding model context length based on documents, queries, and optimization */
  {
    q:`A support-ticket RAG bot uses 400-token chunks and one-sentence queries, and the stated strategy puts cost and latency ahead of answer quality. Which embedding model fits?`,
    opts:[
      "A smaller-context model whose window comfortably fits a 400-token chunk, at lower dimensions and cost",
      "The largest available context window, to be safe",
      "A different embedding model for queries than for chunks",
      "A model with an 8K context window to leave maximum headroom"
    ],
    correct:0,
    explain:`Why: the chunks are small and the priority is cost and latency, so the right choice is a model whose context length just fits the chunk at lower dimensions, which is cheaper and faster to embed and store. An oversized window (B, D) pays for capacity the 400-token chunks never use, and using different models on each side (C) breaks the shared vector space that retrieval depends on.`
  },

  /* Q8 · Ch 23 - Select a model from a hub or marketplace based on model cards / metadata */
  {
    q:`Before running any tests, you must narrow a dozen candidate models on a hub down to a shortlist for a commercial product with a 3,000-token prompt. What does the model card let you do first?`,
    opts:[
      "Rank the candidates by real answer quality on your task",
      "Measure the latency each model will show on your endpoint",
      "Confirm cost per token for your exact traffic pattern",
      "Filter out models by license, context window, and size before spending on a bake-off"
    ],
    correct:3,
    explain:`Why: a model card carries metadata (license terms, context window, parameter size) that lets you eliminate unfit candidates cheaply, for example dropping non-commercial licenses or windows under 3,000 tokens, before any testing. Cards filter but do not rank real task quality (A) or measure your latency (B) or cost (C); those come from an actual experiment on your data.`
  },

  /* Q9 · Ch 23 - Select the best model based on common metrics generated in experiments */
  {
    q:`A public leaderboard ranks model X first on MMLU. On your 300-ticket evaluation set, run as MLflow runs with the same judge scorers, model Y scores higher on correctness and answers faster. Which model ships?`,
    opts:[
      "Model X, because a public benchmark is more authoritative than an in-house test",
      "Model Y, because it wins on your own task metrics, which are what the deployment is judged on",
      "Neither: rerun until model X wins to match the leaderboard",
      "Whichever model is larger, since size predicts quality"
    ],
    correct:1,
    explain:`Why: the decision runs on metrics generated from your own experiment, and model Y wins on correctness and latency for your actual task, so it ships. A general leaderboard (A) measures a different task, tuning the experiment until a preferred model wins (C) is not evaluation, and parameter count (D) is not evidence of task quality.`
  },

  /* Q10 · Ch 24 - Select a chunking strategy based on model and retrieval evaluation */
  {
    q:`Recall@5 on your retrieval eval set sits at 0.55. Tracing the misses, each failing answer is a procedure whose steps straddle two adjacent 150-token chunks with no overlap, so no single retrieved chunk holds the full procedure. What is the right next change?`,
    opts:[
      "Ship the app anyway, since 0.55 is a passing number",
      "Switch to a larger LLM to compensate for the retrieval gap",
      "Increase chunk size or add overlap so a full procedure lands in one chunk, then re-measure",
      "Change the chunk size, the overlap, and the embedding model all at once to move faster"
    ],
    correct:2,
    explain:`Why: the eval names the cause, procedures split across adjacent chunks, so enlarging the chunk or adding overlap keeps each procedure whole, and you re-measure to confirm the metric moved. Shipping at 0.55 (A) ignores a diagnosed failure, a bigger LLM (B) cannot answer from context it never retrieved, and changing three variables at once (D) makes the result impossible to attribute.`
  },

  /* Q11 · Ch 25 - Utilize MLflow and Agent Framework for developing agentic systems */
  {
    q:`Your LangGraph agent already answers correctly in a notebook. Before deploying, you wrap it in the Agent Framework's ResponsesAgent interface. What does that wrapper actually provide?`,
    opts:[
      "A standard request/response signature and tracing so the agent can be logged, evaluated, and served",
      "A faster inference engine that reduces token cost",
      "An automatic rewrite of your agent's logic into pure SQL",
      "A guarantee that the agent's answers are correct"
    ],
    correct:0,
    explain:`Why: wrapping any framework's agent in ResponsesAgent gives it the standard serving contract and MLflow tracing the platform expects, so it can be logged as code, evaluated, and deployed to an endpoint. It does not change inference speed or cost (B), rewrite logic to SQL (C), or make answers correct (D); correctness still comes from the agent itself.`
  },

  /* Q12 · Ch 26 - Enable multi-agent systems to leverage Genie Spaces or the conversational API */
  {
    q:`An internal assistant must answer both "what does the refund policy allow?" and "how many orders shipped late last month?" The first lives in policy documents, the second in governed tables. Which architecture serves both?`,
    opts:[
      "Embed the tables as text and rely on vector search for the numeric question too",
      "Answer the numeric question by asking the LLM to estimate from memory",
      "Put every order row into the system prompt on each call",
      "Give the agent a retriever tool for the documents and a Genie Space as a tool for the tabular question"
    ],
    correct:3,
    explain:`Why: the two questions need two knowledge surfaces, so the agent calls a retriever for the policy text and a Genie Space, which queries the governed tables in natural language, for the count. Embedding tables as text (A) and prompt-stuffing rows (C) are unreliable and expensive for aggregate queries, and asking the LLM to estimate (B) invents numbers rather than querying them.`
  },

  /* Q13 · Ch 27 - Compare the evaluation and monitoring phases of the GenAI life cycle */
  {
    q:`A stakeholder asks whether a given quality check belongs to "evaluation" or "monitoring." The check runs automatically on live production traffic to catch quality regressions after release. Which phase is it, and why?`,
    opts:[
      "Evaluation, because any quality check is evaluation by definition",
      "Monitoring, because it runs online on live traffic after deployment to catch regressions",
      "Neither, because quality can only be judged by humans",
      "Both are the same activity with different names"
    ],
    correct:1,
    explain:`Why: the two phases measure the same qualities from different vantage points, and a check running online on live traffic after release is monitoring, whereas evaluation runs offline before users see the app. Calling every check evaluation (A) erases the distinction, humans are not the only judges (C), and the phases are genuinely different vantage points, not one thing (D).`
  }

];


/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
