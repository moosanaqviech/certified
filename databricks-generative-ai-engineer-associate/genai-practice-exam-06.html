<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */

const E = {
  name: "Practice Exam 6",
  badge: "Databricks GenAI Engineer Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer. Databricks publishes no official passing score; 70% is our practice target.",
  coverage: "Full-length mock exam: 45 questions sampling all six sections, mirroring the real exam's shape.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

  /* Q1 · Ch 03 - Choose the model task from the output */
  {
    q:`A support team feeds each five-paragraph customer email into a model and wants back a single sentence that captures what the customer is asking for, adding no facts that were not in the email. Which model task fits this requirement?`,
    opts:[
      "Text generation, because the model produces new sentence text as its output",
      "Named-entity extraction, because the model must pull the customer's request out of the email",
      "Summarization, because a long input becomes a short output that adds no new facts",
      "Classification, because the model reduces the email to a single concise result"
    ],
    correct:2,
    explain:`Long input, short output, and no new facts is the signature of summarization. Text generation (A) is the wrong read because a one-sentence gist of an existing paragraph condenses rather than invents content, and the no-new-facts constraint rules it out. Extraction returns fields and classification returns a label, neither of which is a fluent one-sentence gist.`
  },

  /* Q2 · Ch 04 - Prompt for a specific output format */
  {
    q:`A model is asked to return product attributes as JSON, but every response begins with "Here is the JSON you requested:" followed by the object, which breaks the downstream parser. Which change best fixes this on Databricks Model Serving?`,
    opts:[
      "State the exact JSON schema, show one example of the output, fence the input, and enable Structured Outputs on the endpoint",
      "Lower the temperature to 0 so the model stops adding conversational text before the JSON",
      "Increase max_tokens so the full JSON object is never truncated after the preamble",
      "Ask the model in the system prompt to be helpful and to explain each field it returns"
    ],
    correct:0,
    explain:`Stating the format explicitly, giving one example, fencing the input, and turning on Structured Outputs constrains the response to the schema so no preamble can appear. Lowering temperature (B) reduces randomness but does not stop the model from prepending prose. More tokens (C) addresses truncation, not the extra preamble, and asking for explanations (D) makes the output less machine-readable.`
  },

  /* Q3 · Ch 05 - Select chain components */
  {
    q:`An engineer needs a chain that answers policy questions grounded in a document corpus and returns a JSON object with an <code>answer</code> field and a <code>sources</code> list. Which set of components does the chain require?`,
    opts:[
      "A prompt and a model only, since the model already knows most policy language",
      "A prompt, a model, and an output parser, with the sources hard-coded in the prompt",
      "A retriever and a model only, letting the model emit whatever shape it chooses",
      "A prompt, a retriever, a model, and an output parser that formats answer plus sources as JSON"
    ],
    correct:3,
    explain:`A grounded answer needs a retriever to pull the policy passages, and the structured answer-with-sources output needs an output parser, on top of the prompt and model. Prompt-and-model alone (A) cannot ground the answer in the corpus, and hard-coding sources (B) defeats retrieval. Dropping the parser (C) leaves the JSON shape unenforced.`
  },

  /* Q4 · Ch 06 - Define and order tools for multi-stage reasoning */
  {
    q:`An agent must (1) look up a customer's account id from their email, then (2) fetch that account's open invoices, then (3) compute the total owed. How should the tools be defined so the agent runs them in the only correct order?`,
    opts:[
      "Give all three tools identical descriptions so the LLM is free to call them in any order",
      "Design each tool so its required argument is the output of the previous tool, making the dependency force the sequence",
      "Merge all three steps into one tool so the LLM never has to choose an order",
      "Order the steps in the system prompt only, leaving each tool's arguments unconstrained"
    ],
    correct:1,
    explain:`Tools are contracts, and when the invoice tool requires an account id and the total tool requires the invoice list, the argument dependencies force lookup, then fetch, then compute. Identical descriptions (A) give the model nothing to reason over. Merging into one tool (C) throws away the composability that lets the agent reuse steps, and prompt-only ordering (D) is easily ignored without the argument constraints.`
  },

  /* Q5 · Ch 07 - Agent Bricks: which brick */
  {
    q:`A team wants a governed assistant that answers employee questions using the company's internal HR handbook and benefits PDFs, with citations, and minimal custom orchestration. Which Agent Bricks option fits?`,
    opts:[
      "Knowledge Assistant, which builds a governed Q&A agent over your own documents",
      "Multiagent Supervisor, which routes a request across several specialized agents",
      "Information Extraction, which pulls structured fields out of each document",
      "A custom LangGraph agent, because Agent Bricks cannot cite sources"
    ],
    correct:0,
    explain:`Knowledge Assistant is purpose-built for Q&A over your documents with citations and little custom code. Multiagent Supervisor (B) is for routing across multiple agents or tools, which this single-corpus task does not need. Information Extraction (C) produces structured fields, not conversational answers, and a hand-built agent (D) is unnecessary when the managed brick fits.`
  },

  /* Q6 · Ch 10 - Filter extraneous content */
  {
    q:`A RAG app over scraped web pages keeps returning chunks made of cookie-consent banners and site navigation menus, crowding out the real content. Where should this be fixed?`,
    opts:[
      "At query time, by asking the LLM to ignore any navigation or cookie text it sees",
      "By raising k so more chunks are retrieved and the good ones outnumber the boilerplate",
      "By switching to a larger generation model that can reason past the noise",
      "During ingestion and cleaning, by stripping boilerplate and deduplicating before embedding"
    ],
    correct:3,
    explain:`Boilerplate such as nav bars and cookie notices should be removed in preprocessing before text is embedded, so it never becomes a retrievable chunk. Telling the LLM to ignore it (A) wastes context and is unreliable, and raising k (B) retrieves more noise alongside signal. A bigger model (C) does not clean a polluted index.`
  },

  /* Q7 · Ch 11 - Chunking strategy tradeoffs */
  {
    q:`An index over a large manual has grown expensive because embedding the corpus produces far too many vectors, and the team wants to cut the number of embeddings while keeping continuity across chunk boundaries. Which adjustment fits?`,
    opts:[
      "Shrink the chunk size and increase the overlap so each idea is embedded several times",
      "Raise the chunk size and keep a modest overlap so fewer chunks cover the same text",
      "Keep the chunk size but embed every sentence separately for maximum precision",
      "Remove overlap entirely and cut chunk size in half to make each vector cheaper"
    ],
    correct:1,
    explain:`Larger chunks mean fewer chunks over the same corpus, cutting the embedding count, while a modest overlap preserves continuity across boundaries. Shrinking chunks and adding overlap (A) multiplies the vector count, the opposite of the goal. Per-sentence embedding (C) explodes the count, and removing overlap while halving size (D) increases the number of chunks and loses continuity.`
  },

  /* Q8 · Ch 12 - Advanced chunking and retrieval */
  {
    q:`Retrieval returns the exact sentence that matches the query, but generated answers are wrong because the model lacks the surrounding paragraph that gives the sentence meaning. Which retrieval design addresses this?`,
    opts:[
      "Increase k so several nearby small chunks are returned and hope the context appears",
      "Switch to a higher-dimensional embedding model to sharpen the sentence match",
      "Use parent-document retrieval: match on the small chunk but return its larger parent passage",
      "Re-rank the small chunks so the best-matching sentence is always placed first"
    ],
    correct:2,
    explain:`Parent-document retrieval matches on small, precise chunks but returns the larger parent so the model gets the surrounding context. Raising k (A) adds unrelated neighbors without guaranteeing the right parent. A better embedding (B) improves the match but still returns a context-poor chunk, and re-ranking (D) reorders chunks without expanding their context.`
  },

  /* Q9 · Ch 13 - Write chunked text to Delta in Unity Catalog */
  {
    q:`An engineer will store chunked documents in Unity Catalog and keep a Vector Search index continuously in sync from that table. What is the correct setup?`,
    opts:[
      "Write one row per chunk to a Delta table with Change Data Feed enabled, then create a Delta Sync index over it",
      "Create the Vector Search index first, then backfill the Delta table so the index has a schema to follow",
      "Store all chunks as a single JSON blob in one Delta row, then point the index at that row",
      "Write chunks to a Delta table without Change Data Feed and refresh the index manually each night"
    ],
    correct:0,
    explain:`The Delta table is the corpus with one row per chunk, and a Delta Sync index needs Change Data Feed on the source so it stays current, so you write the CDF-enabled table first, then create the index. Creating the index first (B) inverts the dependency. One JSON blob (C) is not one-row-per-chunk retrieval, and disabling CDF (D) prevents automatic sync.`
  },

  /* Q10 · Ch 14 - Measure retrieval quality */
  {
    q:`A team has thousands of real user queries logged but no labeled relevant documents, and wants an automated read on retrieval quality before tuning anything. What should they do?`,
    opts:[
      "Skip measurement and tune chunk size directly, since without labels no metric is possible",
      "Compute precision@k and recall@k against the unlabeled queries as if every retrieved chunk were relevant",
      "Ship to production and rely on user complaints as the only feasible quality signal",
      "Use an LLM judge to score context relevance for each query and retrieved set, a reference-free read"
    ],
    correct:3,
    explain:`With real queries but no ground-truth labels, a reference-free LLM judge scoring context relevance gives an automated quality read without labels. Skipping measurement (A) violates the measure-before-tuning rule. Precision and recall (B) require labeled relevant documents to compute, and waiting for complaints (C) is neither automated nor early.`
  },

  /* Q11 · Ch 15 - Re-ranking */
  {
    q:`A retrieval step recalls 50 candidates and the truly relevant chunk often sits around position 20, but the generator only sees the top 5. The endpoint has latency headroom. What improves answer quality?`,
    opts:[
      "Cut the recall to the top 5 directly so the generator sees only the strongest first-pass hits",
      "Retrieve the 50 candidates wide, re-rank them with a second model, and keep the top few",
      "Disable retrieval and let the model answer from its parametric knowledge instead",
      "Increase the embedding dimension so the relevant chunk ranks first without re-ranking"
    ],
    correct:1,
    explain:`Retrieve wide, re-rank with a second model, then keep narrow surfaces the relevant chunk that first-pass scoring buried, and the latency headroom pays for the extra model. Cutting recall to 5 (A) discards the chunk that sat at position 20. Disabling retrieval (C) removes grounding, and a bigger embedding (D) does not reliably reorder a specific buried result the way a re-ranker does.`
  },

  /* Q12 · Ch 18 - Steer from baseline to desired output */
  {
    q:`A baseline prompt yields correct facts but the answers are far too verbose and bury the recommendation in the last line. The team wants a two-sentence answer that leads with the recommendation. What is the best next step?`,
    opts:[
      "Swap in a larger model, since verbosity is a capability limit of the current one",
      "Lower max_tokens so the response is physically cut off after two sentences",
      "Add an explicit instruction with a short example showing a two-sentence answer that leads with the recommendation",
      "Add a retriever so the recommendation is grounded in a source document"
    ],
    correct:2,
    explain:`Wrong emphasis and verbosity are fixed by an explicit format-and-tone instruction that shows the desired shape, changing one lever at a time. A larger model (A) does not address a prompting problem. Truncating with max_tokens (B) can chop the answer mid-sentence, and adding a retriever (D) solves grounding, not verbosity or ordering.`
  },

  /* Q13 · Ch 19 - Assess quality and safety failure modes */
  {
    q:`A RAG assistant confidently states a refund window of 60 days, but none of the retrieved policy chunks mention 60 days; the real value is 30. What failure mode is this?`,
    opts:[
      "Ungrounded generation (hallucination): the answer asserts a fact absent from the retrieved context",
      "Indirect prompt injection: a retrieved document told the model to change the number",
      "PII exposure: the model leaked information it should have kept private",
      "Retrieval latency: the correct chunk arrived too slowly to be used"
    ],
    correct:0,
    explain:`Stating a fact that appears nowhere in the retrieved context is the definition of ungrounded generation, or hallucination. Indirect prompt injection (B) would require a malicious instruction embedded in a document, which is not described. PII exposure (C) concerns leaked private data, and latency (D) is an operational metric, not the cause of a wrong fact.`
  },

  /* Q14 · Ch 20 - Implement output guardrails */
  {
    q:`Compliance requires that no response from a customer-facing endpoint ever contains a full government ID number, even if the model tries to include one. Where must this rule be enforced?`,
    opts:[
      "In the system prompt, by instructing the model never to output an ID number",
      "As an enforced output guardrail at the endpoint that inspects and blocks or redacts the generated draft",
      "In the retriever, by excluding any chunk that contains an ID number from the index",
      "In the user-facing app's CSS, by hiding any text that looks like an ID number"
    ],
    correct:1,
    explain:`Only an output guardrail sees the generated draft, so a hard rule against IDs in responses must be enforced there, where it can block or redact. A prompt (A) asks but cannot guarantee. Filtering the retriever (C) misses IDs the model generates from elsewhere, and hiding text in CSS (D) leaves the data in the response payload.`
  },

  /* Q15 · Ch 21 - Choose the LLM by application attributes */
  {
    q:`A regulated bank needs an assistant whose data must stay in its own region, that can be fine-tuned on internal transcripts, and that runs on a tight budget. How should the model be chosen?`,
    opts:[
      "Pick whichever proprietary model tops the current public leaderboard for chat quality",
      "Pick the model with the largest context window regardless of where it runs",
      "Pick the model with the lowest published per-token list price and ignore residency",
      "Pick an open model served on Databricks, satisfying residency, fine-tunability, and cost together"
    ],
    correct:3,
    explain:`Data residency, fine-tunability, and a tight budget together point to an open model served on Databricks, where the data stays in your governed environment and the model can be fine-tuned. A leaderboard (A) ignores your specific attributes. The largest context window (B) is one attribute among several, and lowest list price alone (C) ignores the residency and fine-tuning requirements.`
  },

  /* Q16 · Ch 22 - Embedding model context length */
  {
    q:`A team is picking an embedding model for short user queries and moderate-length chunks, and their priority is low cost and low latency at high volume. Which choice fits, and what constraint must hold?`,
    opts:[
      "Choose the largest available context length so no chunk can ever overflow the window",
      "Use one embedding model for queries and a different one for chunks to optimize each side",
      "Pick a smaller context length and lower dimensions, using the same embedding model on both sides",
      "Maximize the embedding dimension to push retrieval quality as high as possible"

const PASS = E.pass;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
