<style>
  /* =====================================================================

  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;

  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .timer.warn{color:var(--gold);}
  .timer svg{opacity:.7;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  /* intro */
  .intro{text-align:center;margin:auto 0;padding:30px 0;}
  .intro .badge{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px;}
  .intro h1{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.05;letter-spacing:-0.02em;margin-bottom:16px;}

<div class="app">
  <div class="top">

<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */

const E = {
  name: "Practice Exam 3",
  badge: "Databricks GenAI Engineer Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer. Databricks publishes no official passing score; 70% is our practice target.",
  coverage: "Covers all 15 objectives of Section 4: Assembling and Deploying Applications.",
  minutes: 30,
  pass: 70
};

const QUESTIONS = [

  /* Q1 · Ch 28 - Choose the basic elements needed to create a RAG application */
  {
    q:`An engineer is assembling a RAG application and will log it with MLflow so it can be registered and served. Which set lists the basic elements the application needs?`,
    opts:[
      "Temperature, top_k, stop tokens, seed, max_tokens, and a random state",
      "Model flavor, embedding model, retriever, dependencies, an input example, and a model signature",
      "Cluster policy, init script, instance pool, spot ratio, autoscaling, and node type",
      "Catalog, schema, volume, external location, storage credential, and network route"
    ],
    correct:1,
    explain:`Building and logging a deployable RAG app requires the model flavor, the embedding model, the retriever, its resource dependencies, an input example, and a model signature. Option A lists generation parameters, which tune a single call but are not the app's structural elements, and C and D are compute and storage nouns from unrelated parts of the platform.`
  },

  /* Q2 · Ch 29 - Code a simple chain according to requirements */
  {
    q:`A requirement states the endpoint will receive a chat request in the messages format and must return a plain string. The existing prompt template reads a single <code>question</code> variable. Which chain satisfies the requirement?`,
    opts:[
      "prompt | llm, returning the raw message object with no parser",
      "A pyfunc wrapper whose predict() ignores the messages and calls the model directly",
      "A RunnableLambda that extracts the user text from messages, then prompt | ChatDatabricks | StrOutputParser",
      "Two chained ChatDatabricks calls, the first reformatting the messages into a question"
    ],
    correct:2,
    explain:`The input contract (messages) does not match the prompt's <code>question</code> variable, so a RunnableLambda reshapes it, and the plain-string requirement is met by StrOutputParser. Omitting the parser (A) returns a message object, which violates the string requirement, and a second model call (D) is wasteful glue for what a deterministic lambda does.`
  },

  /* Q3 · Ch 30 - Code a chain using a pyfunc model with pre- and post-processing */
  {
    q:`A team must normalize each request before the model call and strip PII from every response after it, all inside one deployable artifact. In testing they do the redaction in notebook cells after calling the chain, and production returns unredacted PII. What is the correct approach?`,
    opts:[
      "Wrap the model in an mlflow.pyfunc.PythonModel and put the normalization and redaction inside predict()",
      "Keep the redaction in notebook cells and log only the chain",
      "Use the native langchain flavor and rely on it to redact automatically",
      "Add the redaction as an endpoint ACL on the serving endpoint"
    ],
    correct:0,
    explain:`Only code inside the logged model runs at serve time, so pre- and post-processing must live inside a pyfunc predict() method to ship with the artifact. Redaction done in loose notebook cells (B) is never part of the model, so the endpoint returns raw output, and an ACL (D) governs who may call the endpoint, not what it returns.`
  },

  /* Q4 · Ch 31 - Register the model to Unity Catalog using MLflow */
  {
    q:`A team wants three-level governance for their model and a way to promote versions without redeploying. Which approach registers and promotes the model correctly under Unity Catalog?`,
    opts:[
      "Register with a one-part model name and move it through Staging and Production stages",
      "Call transition_model_version_stage to Production, then load the model by its stage",
      "Leave the default registry URI in place and register a catalog.schema.model name",
      "Set the registry URI to databricks-uc, register as catalog.schema.model, and promote by moving an alias"
    ],
    correct:3,
    explain:`Unity Catalog needs set_registry_uri("databricks-uc"), a three-level catalog.schema.model name, and promotion by re-pointing a mutable alias like @champion. Stages and transition_model_version_stage (A, B) belong to the legacy workspace registry and are unsupported under Unity Catalog, and leaving the default URI (C) targets that legacy registry, where a three-level name is not the promotion model.`
  },

  /* Q5 · Ch 32 - Explain key concepts and components of Mosaic AI Vector Search */
  {
    q:`A corpus lives in a Delta table refreshed nightly. The team wants a governed index that stays current automatically, but a newly created index is not picking up row changes. Which choice both fits the goal and names the likely fix?`,
    opts:[
      "A Direct Vector Access Index, writing vectors through the REST API after each nightly load",
      "A Delta Sync Index, with Change Data Feed enabled on the source table",
      "A Direct Vector Access Index with continuous sync turned on",
      "A plain Delta table queried with a cosine-similarity SQL expression"
    ],
    correct:1,
    explain:`"Stay current with the table automatically" is a Delta Sync Index, and it relies on Change Data Feed on the source table to see incremental changes, so a missing CDF explains an index that indexes nothing. A Direct Vector Access Index (A, C) never auto-syncs, and continuous sync is a Delta Sync feature, not a Direct Access one.`
  },

  /* Q6 · Ch 33 - Create and query a Vector Search index */
  {
    q:`An app must show a source URL next to each retrieved chunk, but the retriever only ever returns the id and text. The <code>url</code> column exists on the index. What is the fix?`,
    opts:[
      "Add url to the columns argument of similarity_search",
      "Set query_type to HYBRID so metadata is returned",
      "Rebuild the index as Direct Vector Access",
      "Raise num_results so more fields come back"
    ],
    correct:0,
    explain:`similarity_search returns only the fields named in its columns argument, defaulting to roughly the primary key and source text, so url must be listed there. Hybrid search (B) changes ranking, not which fields return, num_results (D) changes how many rows return, and the index type (C) is unrelated to column selection.`
  },

  /* Q7 · Ch 34 - Configure vector search for a solution based on embeddings, latency, and cost */
  {
    q:`A product search must serve about 80 queries per second over 100 million items, and latency is critical. Which configuration fits the workload?`,
    opts:[
      "Storage Optimized, with hybrid search and reranking on for best quality",
      "Storage Optimized with continuous sync and hybrid search",
      "A Standard endpoint, hybrid search and reranking off, with a fine-tuned embedding model",
      "A Standard endpoint with reranking on to protect quality"
    ],
    correct:2,
    explain:`100 million items sit under the Standard ceiling, and only a Standard endpoint sustains 80 QPS at low latency; Storage Optimized tops out well below that at hundreds of milliseconds. A latency-critical budget means reranking and hybrid go off, since both add time, and a fine-tuned embedding model recovers relevance without them. Any option that keeps reranking on (A, D) or uses Storage Optimized (A, B) misses the latency or QPS target.`
  },

  /* Q8 · Ch 35 - Identify how to serve an LLM application on Foundation Model APIs */
  {
    q:`A production service will send a steady, high volume of requests to a Databricks-hosted model, needs predictable latency, and will later serve a fine-tuned variant. Which serving mode fits?`,
    opts:[
      "Pay-per-token, because it needs no capacity planning",
      "Provisioned throughput on Mosaic AI Model Serving",
      "Pay-per-token in priority mode, which removes all rate limits",
      "A classic all-purpose cluster running the model directly"
    ],
    correct:1,
    explain:`Steady high volume with a latency guarantee, and serving a fine-tuned model, both require provisioned throughput: dedicated capacity that will not throttle and that supports custom-weight models. Pay-per-token (A, C) is best for experimentation and low volume and cannot serve fine-tuned weights, and Foundation Model APIs are not run on a self-managed cluster (D).`
  },

  /* Q9 · Ch 36 - Control access to resources from a model serving endpoint */
  {
    q:`A deployed agent gained a new Unity Catalog function tool and a vector index. It works in the notebook, but the served endpoint fails both with authentication errors. What is the correct fix?`,
    opts:[
      "Grant every user CAN_MANAGE on the serving endpoint",
      "Switch the endpoint to pay-per-token serving",
      "Store a workspace-admin token inside the model so it can reach anything",
      "Re-log the model with the index and function declared in resources=, then redeploy"
    ],
    correct:3,
    explain:`The endpoint's service principal only receives credentials for resources declared at log time, so a new tool and index must be added to resources= and the model redeployed. Endpoint ACLs like CAN_MANAGE (A) govern who calls the endpoint, not what it can reach, and a baked-in admin token (C) breaks least privilege and is never the intended pattern.`
  },

  /* Q10 · Ch 37 - Identify batch inference workloads and apply ai_query() appropriately */
  {
    q:`A team must classify 20 million archived documents once, overnight, at the lowest cost, and a handful of malformed rows should not abort the run. Latency per document does not matter. What is the right approach?`,
    opts:[
      "Stand up a real-time serving endpoint and loop 20 million requests from Python",
      "Run ai_query over the table on serverless with failOnError left at its default",
      "Run ai_query (or ai_classify) over the table on serverless with failOnError set to false",
      "Ask each user to submit documents through a chat interface"
    ],
    correct:2,
    explain:`A one-off, latency-insensitive, whole-table job at lowest cost is the case for batch ai_query, which parallelizes and scales the run. Setting failOnError to false lets malformed rows return an errorMessage so the job completes with the good rows. The default true (B) aborts the whole query on one bad row, and a real-time endpoint (A) is slower and pricier for bulk scoring.`
  },

  /* Q11 · Ch 38 - Configure a persistent datastore for agent memory or structured state */
  {
    q:`An assistant remembers a conversation in testing, but in production it intermittently forgets earlier turns and always forgets after a deploy. What resolves it?`,
    opts:[
      "Increase the serving endpoint's memory allocation",
      "Persist conversation state to an external store such as Lakebase or a Delta table, keyed by session id",
      "Cache the history in a module-level Python dictionary on the endpoint",
      "Enlarge the model's context window"
    ],
    correct:1,
    explain:`Intermittent forgetting plus always forgetting after a deploy is the signature of in-process state: scale-out routes follow-ups to a replica without the history, and restarts wipe it. Durable memory must live in an external store keyed by session id. A larger context window (D) or a process-local dict (C) does not survive restarts or scale-out.`
  },

  /* Q12 · Ch 39 - Integrate managed, external, and custom MCP servers */
  {
    q:`An agent needs to run existing Unity Catalog functions and search a Vector Search index, and the team wants the least infrastructure to build and maintain. Which MCP option fits?`,
    opts:[
      "Databricks-managed MCP servers, which already expose Unity Catalog functions and Vector Search",
      "A custom MCP server the team builds and hosts on Databricks Apps",
      "An external MCP server running on a third-party host",
      "No MCP; hardcode the tool calls inside the agent"
    ],
    correct:0,
    explain:`Unity Catalog functions and Vector Search are exactly what Databricks-managed MCP servers already expose, with hosting and auth handled for you, so there is nothing to build. A custom server (B) would duplicate that work, and an external server (C) is for capabilities that live outside Databricks, which is not the case here.`
  },

  /* Q13 · Ch 40 - Apply prompt version control and manage the prompt lifecycle */
  {
    q:`A team wants to roll a new prompt to production with the ability to instantly roll back and a full record of what ran when. Which is the MLflow way?`,
    opts:[
      "Merge the new prompt text into the main git branch and redeploy the app",
      "Overwrite the prompt JSON file on the CI runner during the release",
      "Update the prompt row in a Delta table in place",
      "Register a new prompt version and move the production alias to it"
    ],
    correct:3,
    explain:`MLflow promotes prompts by registering an immutable new version and re-pointing a mutable alias like production, which gives instant rollback and a complete version history. A branch merge (A) or a file or row overwrite (B, C) keeps no governed version and leaves no alias to roll back to.`
  },

  /* Q14 · Ch 41 - Apply CI/CD best practices for agents */
  {
    q:`A retriever change silently degraded answer quality but shipped because CI only checked that the endpoint returned some text, and the team also promotes by copying artifacts between workspaces. What should the pipeline do instead?`,
    opts:[
      "Add only a faster HTTP smoke test to the pipeline",
      "Rely on production monitoring to catch regressions after release",
      "Unit-test the tools and retriever, gate on mlflow.genai.evaluate() scorers against a curated dataset, and promote by re-pointing a Unity Catalog alias",
      "Continue copying artifacts between workspaces but do it more carefully"
    ],
    correct:2,
    explain:`Component tests catch a retriever regression directly, and mlflow.genai.evaluate() scorers gate on measured quality rather than "some text came back", while alias promotion preserves lineage and rollback. Relying on monitoring alone (B) lets the regression reach users first, and manual artifact copying (A, D) loses lineage and reproducible rollback.`
  },

  /* Q15 · Ch 42 - Develop an interactive user-facing interface for an agent */
  {
    q:`A team is building a web app where users chat with a deployed agent, and each user must only see data their Unity Catalog permissions allow. How should the app call the agent's serving endpoint?`,
    opts:[
      "Embed a personal access token in the page's JavaScript so the browser calls the endpoint directly",
      "Have the app backend call the endpoint using the app's service principal, forwarding each user's identity for on-behalf-of-user access",
      "Give every user an API key to paste into the interface",
      "Make the endpoint public and filter the results in the browser"
    ],
    correct:1,
    explain:`The app backend calls the endpoint so no credential ever reaches the browser, and forwarding each user's identity applies Unity Catalog row filters and masks per person. A token in front-end JavaScript (A) or handed to users (C) leaks it to every client, and an unauthenticated endpoint with browser-side filtering (D) exposes both the endpoint and the restricted data.`
  }
];


/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
