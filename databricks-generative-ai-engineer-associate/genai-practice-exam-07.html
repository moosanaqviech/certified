<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */

const E = {
  name: "Practice Exam 7",
  badge: "Databricks GenAI Engineer Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer. Databricks publishes no official passing score; 70% is our practice target.",
  coverage: "Full-length mock exam: 45 questions sampling all six sections, mirroring the real exam's shape.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

  /* Q1 · Ch 02 - translate business goal to a pipeline spec */
  {
    q:`A product manager asks an engineer to build "an AI assistant that answers customer billing questions." The engineer wants to start the project the right way. What should the very first deliverable be, before any architecture or model is chosen?`,
    opts:[
      "A written pipeline spec that names the inputs, the expected outputs, the constraints, and the failure modes the assistant must handle",
      "A benchmark comparing three foundation models on a public QA leaderboard",
      "A Mosaic AI Vector Search index built over the billing knowledge base",
      "A finished prompt template that formats billing answers as JSON"
    ],
    correct:0,
    explain:`Why: the first deliverable is a specification that pins down named inputs, outputs, constraints, and failure modes; that spec drives every later choice. Standing up a Vector Search index first commits to an architecture before the requirements exist, so it is premature and may be thrown away.`
  },

  /* Q2 · Ch 03 - choose the model task from the output */
  {
    q:`An engineer receives long multi-turn support call transcripts and must produce a single one-sentence gist of each call for a dashboard. No new facts are introduced and nothing is labeled. Which model task fits?`,
    opts:[
      "Extraction, because fields are pulled from the transcript",
      "Classification, because each call gets one dashboard label",
      "Generation, because the model writes brand-new sentences",
      "Summarization, because a long input is compressed to a short faithful gist with no new facts"
    ],
    correct:3,
    explain:`Why: read the output. Long input compressed to a short, faithful gist with no new information is Summarization. Calling it Generation is the common trap: producing a one-sentence condensation of existing content is summarizing, not authoring new content.`
  },

  /* Q3 · Ch 05 - select chain components */
  {
    q:`A chain must answer a user's policy question with a grounded JSON object that includes the answer text and a list of source citations. Which set of components does the chain need?`,
    opts:[
      "A prompt and a model only, relying on the model's parametric knowledge",
      "A prompt, a model, a retriever, and an output parser",
      "A model and an output parser, with no retriever",
      "A prompt and a retriever, with no model"
    ],
    correct:1,
    explain:`Why: grounding requires a retriever to pull the source passages, and a structured JSON-with-citations output requires an output parser on the back end, wrapped around the prompt and model. A prompt-and-model-only chain has no grounding, so its citations would be fabricated rather than retrieved.`
  },

  /* Q4 · Ch 06 - define and order tools for multi-stage reasoning */
  {
    q:`An agent must (1) find a customer's internal ID from their email address, then (2) fetch that customer's open orders using the ID. How should the tools be defined so the model is forced into the correct sequence?`,
    opts:[
      "Give one tool that takes an email and returns orders directly, hiding the two steps from the model",
      "Define both tools to accept an email so the model can call either one first",
      "Define lookup_customer_by_email that returns an id, and get_orders(customer_id) whose description says it requires the id from the first tool",
      "Let the model guess the customer ID from the email string using a formatting rule"
    ],
    correct:2,
    explain:`Why: a tool is a contract the model reads. Making get_orders require a customer_id that only lookup_customer_by_email produces forces the dependency, so the lookup must run first. Defining both tools to accept an email removes the dependency and lets the model call them in any order, which breaks the required sequence.`
  },

  /* Q5 · Ch 07 - Agent Bricks: which brick */
  {
    q:`A team wants a ready-made agent that answers employee questions over a large set of internal policy and HR documents, with citations, without building a custom chain. Which Agent Bricks option fits?`,
    opts:[
      "Multiagent Supervisor, to route across several specialized agents",
      "Information Extraction, to pull structured fields out of the documents",
      "A Genie Space, to answer questions over governed SQL tables",
      "Knowledge Assistant, to answer questions over a document collection"
    ],
    correct:3,
    explain:`Why: Knowledge Assistant is the Agent Bricks option purpose-built for question-and-answer over your own documents. Information Extraction is the wrong pick because the goal is answering questions, not pulling structured fields from each document into a schema.`
  },

  /* Q6 · Ch 08 - identify needed source documents */
  {
    q:`A RAG assistant returns "I don't have that information" whenever users ask about the 2026 pricing tiers. The corpus only contains pricing sheets through 2024. The retriever and prompt work fine on 2024 questions. What is the correct fix?`,
    opts:[
      "Rewrite the system prompt to instruct the model to answer confidently",
      "Add the 2026 pricing document to the source corpus and re-index it",
      "Switch to a larger foundation model with more parameters",
      "Lower the retriever's similarity threshold so more chunks are returned"
    ],
    correct:1,
    explain:`Why: no source, no answer. The information simply is not in the corpus, so the only real fix is adding the missing 2026 pricing document. A bigger model or a looser threshold cannot retrieve a fact that was never ingested, and prompting it to sound confident would invite hallucination.`
  },

  /* Q7 · Ch 09 - choose the Python package to extract content */
  {
    q:`The source documents are scanned image-only PDFs of old contracts; there is no selectable text layer. Which Python package should the ingestion job use to extract the text?`,
    opts:[
      "BeautifulSoup, to parse the document's HTML markup",
      "pypdf, to read the embedded text stream from the PDF",
      "pytesseract, to run OCR over the page images",
      "python-docx, to read the paragraphs from the Word file"
    ],
    correct:2,
    explain:`Why: image-only scans have no digital text to read, so optical character recognition (pytesseract) is required to turn the pixels into text. pypdf only extracts an existing embedded text layer, which scanned images do not have, so it would return nothing useful.`
  },

  /* Q8 · Ch 10 - filter extraneous content */
  {
    q:`Answers from a RAG app keep quoting cookie-consent banners and navigation menus because the ingested web pages carried that boilerplate into the chunks. Where should this be fixed?`,
    opts:[
      "Strip the nav bars, footers, and cookie notices and deduplicate during ingestion and cleaning, before embedding",
      "Add a rule to the answer prompt telling the model to ignore cookie notices",
      "Lower k so fewer chunks are retrieved at query time",
      "Increase the chunk overlap so more surrounding context is included"
    ],
    correct:0,
    explain:`Why: boilerplate removal and deduplication belong in preprocessing, before embedding, so the noise never becomes a retrievable chunk. Telling the model to ignore cookie notices at query time still wastes retrieval slots on junk chunks and leaves the corpus polluted, so it treats the symptom, not the cause.`
  },

  /* Q9 · Ch 13 - write chunked text to Delta in Unity Catalog */
  {
    q:`An engineer is preparing a corpus that a Mosaic AI Vector Search Delta Sync index will keep current as documents change. Which sequence correctly sets up the source table and index?`,
    opts:[
      "Create the Vector Search index first, then write the chunk rows into a Delta table afterward",
      "Write one row per document (not per chunk) to Delta, then build a self-managed index",
      "Write chunks to a Delta table without Change Data Feed, then rely on nightly full re-embeds",
      "Write one row per chunk to a Delta table with Change Data Feed enabled, then create the Delta Sync index over it"
    ],
    correct:3,
    explain:`Why: the Delta table is the corpus, one row per chunk, and a Delta Sync index requires Change Data Feed on that table so updates flow to the index automatically, so the table must exist and be configured before the index is created. Building the index first has no source to sync from, and skipping Change Data Feed breaks the automatic sync the Delta Sync index depends on.`
  },

  /* Q10 · Ch 14 - measure retrieval */
  {
    q:`A team has a log of real user queries hitting their retriever but no labeled relevance judgments. They want an automated read on retrieval quality before they start tuning. What is the most practical approach?`,
    opts:[
      "Skip measurement and tune chunk size directly, then ship whatever feels better",
      "Use an LLM judge to score context relevance of the retrieved chunks, giving a reference-free automated signal",
      "Compute precision@k and recall@k, which require no labels",
      "Report only end-to-end answer accuracy from user thumbs-up counts"
    ],
    correct:1,
    explain:`Why: precision@k and recall@k both need relevance labels, which this team does not have, so an LLM judge scoring context relevance is the reference-free way to get an automated read. Claiming precision@k needs no labels is the trap: it is defined against known-relevant items, so it cannot be computed here.`
  },

  /* Q11 · Ch 15 - re-ranking */
  {
    q:`Diagnostics show the relevant chunk is usually present in the top 50 candidates but sits below the top 5 that the app passes to the model. The app has comfortable latency headroom. What should the team do?`,
    opts:[
      "Cut k to the top 3 so only the strongest first-pass hits reach the model",
      "Switch to a smaller, faster embedding model to speed up retrieval",
      "Retrieve a wide candidate set, apply a re-ranker to re-score them, and keep a narrow top set",
      "Disable re-ranking to protect the latency budget"
    ],
    correct:2,
    explain:`Why: the relevant chunk exists in a wide recall but ranks too low, which is exactly what a re-ranker fixes: retrieve wide, re-rank, keep narrow, and the latency slack pays for the second-pass model. Cutting k tighter would drop the relevant chunk entirely, since it already sits below the top 5.`
  },

  /* Q12 · Ch 16 - select the framework */
  {
    q:`An engineer needs to build an agent that loops over tool calls, branches based on intermediate results, keeps state across steps, and pauses for a human approval gate before a sensitive action. Which framework best fits?`,
    opts:[
      "LangGraph, which models stateful, looping, branching agents with human-in-the-loop gates",
      "LangChain LCEL, for expressing a single linear chain",
      "LlamaIndex, whose strength is retrieval-centric indexing",
      "Plain Python with no framework, since the flow is trivial"
    ],
    correct:0,
    explain:`Why: statefulness, loops, branches, and a human approval gate are the graph-shaped control flow LangGraph is built for. LCEL expresses a linear pipe and has no native notion of loops, branch state, or a human pause, so it is the wrong tool for this control flow.`
  },

  /* Q13 · Ch 17 - augment a prompt by field, term, or intent */
  {
    q:`A support agent gives free-tier users answers that describe premium-only features, because retrieval pulls in documentation for every plan. Each incoming message already states the user's plan tier. How should retrieval be fixed?`,
    opts:[
      "Increase the number of retrieved chunks so the correct tier is more likely included",
      "Add a post-hoc disclaimer to every answer telling users to check their plan",
      "Fine-tune the model on premium documentation so it learns the difference",
      "Extract the plan tier from the message and use it to filter retrieval to that tier's documents"
    ],
    correct:3,
    explain:`Why: the plan tier is a field present in the request, so extracting it and filtering retrieval to matching documents removes the wrong-context passages at the source. Retrieving more chunks only adds more mixed-tier content, making it more likely, not less, that premium docs reach a free-tier answer.`
  },

  /* Q14 · Ch 18 - steer from baseline to desired output */
  {
    q:`A baseline prompt places the formatting instruction at the very end, after a long pasted document, and the model ignores it. An engineer wants to steer the output toward compliance while changing as little as possible. What is the best single change?`,
    opts:[
      "Rewrite the entire prompt, swap the model, and add two few-shot examples at once",
      "Move the instruction to the top and fence the pasted document as clearly delimited input",
      "Lower the temperature to zero and leave the layout unchanged",
      "Add three more instructions restating the same formatting rule in different words"
    ],
    correct:1,
    explain:`Why: an instruction buried after a long input is easy to lose, so moving it up front and fencing the data is the targeted, one-lever change that steering discipline calls for. Changing the prompt, model, and examples all at once violates the change-one-variable rule and makes it impossible to attribute the result.`
  },

  /* Q15 · Ch 19 - assess quality and safety failure modes */
  {
    q:`A RAG assistant returns an answer that suddenly instructs the user to email their password to an external address. Investigation shows one retrieved document contained that instruction as hidden text. Which failure mode is this?`,
    opts:[
      "Ungrounded hallucination, because the model invented a fact not in context",
      "PII exposure, because the response leaked personal data",
      "Indirect prompt injection, because the answer obeyed an instruction hidden inside a retrieved document",
      "Simple retrieval miss, because the wrong chunk was returned"
    ],
    correct:2,
    explain:`Why: the harmful instruction came from text embedded in a retrieved document and the model followed it, which is the definition of indirect prompt injection. It is not hallucination: the instruction was actually present in the context, not invented, so the defect is that retrieved text was trusted as a command rather than treated as data.`
  },

  /* Q16 · Ch 20 - implement output-side guardrails */
  {
    q:`Compliance requires that no full account ID ever appears in a response, even if a retrieved chunk contains one and the model tries to echo it. Where must this rule be enforced?`,
    opts:[
      "As an enforced output guardrail on the serving endpoint that inspects and blocks or redacts the generated draft",
      "As a line in the system prompt asking the model politely not to include account IDs",
      "As a retrieval filter that removes chunks containing account IDs before generation",
      "As a note in the user-facing documentation warning users not to request IDs"
    ],
    correct:0,
    explain:`Why: only an output guardrail sees the generated draft, so a rule about what must never appear in a response has to be enforced there, at the endpoint. A prompt only asks and can be ignored, and a retrieval filter cannot catch an ID the model produces from a chunk that slipped through or from its own text.`
  },

  /* Q17 · Ch 21 - choose the LLM by application attributes */
  {
    q:`A regulated customer requires that data never leave their Databricks region, wants to fine-tune the model on proprietary tickets, and has a tight per-token budget. Which choice best satisfies all three attributes?`,
    opts:[
      "The top model on a public general-purpose leaderboard, called through its vendor API",
      "A large closed proprietary model accessed over the public internet",
      "Whichever model has the largest context window, regardless of cost or hosting",
      "An open-weights model fine-tuned and served on Databricks within the customer's region"
    ],
    correct:3,
    explain:`Why: residency, fine-tunability, and a tight budget together point to an open model served on Databricks in-region, where you control hosting and can fine-tune cost-effectively. A leaderboard-topping vendor API fails the residency and fine-tuning requirements, and the leaderboard measures generic tasks, not this customer's constraints.`
  },

  /* Q18 · Ch 23 - select a model from a hub by model card or metadata */
  {
    q:`Before running an expensive bake-off, an engineer wants to narrow a marketplace list of ten candidate models down to those that could even work: the app needs a permissive commercial license and at least a 32K-token context window. What is the model card's role here?`,
    opts:[
      "The card reports task accuracy on this app, so the highest-scoring card wins outright",
      "The card's license and context-window metadata gate eligibility, filtering candidates before any bake-off",
      "The card is marketing only and should be ignored in favor of running all ten in the bake-off",
      "The card guarantees latency on Databricks serving, so it replaces load testing"
    ],
    correct:1,
    explain:`Why: model-card metadata such as license and context window gates which candidates are even eligible, so it is a pre-filter you apply before spending on a bake-off. The card does not measure your task's quality; it filters candidates, and the surviving models still have to win the bake-off on your own metrics.`
  },

  /* Q19 · Ch 24 - select a chunking strategy from evaluation */
  {
    q:`Evaluation shows the retriever finds the right document, but answers about multi-step procedures are incomplete because steps get split across adjacent chunks that share no overlap. What is the disciplined next move?`,
    opts:[
      "Ship a new embedding model, a new chunk size, and added overlap together to fix it fast",
      "Conclude the retriever is fine and rewrite the answer prompt instead",
      "Add chunk overlap so step boundaries are preserved, change only that variable, and re-measure",
      "Double k and hope both halves of each procedure are retrieved together"
    ],
    correct:2,

const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
