<style>
  /* =====================================================================
     EXAM SHELL - frozen. Do not edit anything in this style block.
     All per-exam customization lives in the EXAM PAYLOAD script section.
  ===================================================================== */
  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;
    --ink-soft:#a7a59f; --ink-faint:#6b6a66; --gold:#e3b84a; --green:#34d3a6; --red:#e8625c;
    --line:rgba(255,255,255,0.08);
    --display:"Fraunces",Georgia,serif; --body:"Hanken Grotesk",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:radial-gradient(1100px 650px at 50% -8%,#1a1d29 0%,transparent 58%),var(--bg);font-family:var(--body);color:var(--ink);min-height:100vh;line-height:1.5;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* sticky top */
  .top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .timer.warn{color:var(--gold);}
  .timer svg{opacity:.7;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  /* intro */
  .intro{text-align:center;margin:auto 0;padding:30px 0;}
  .intro .badge{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px;}
  .intro h1{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.05;letter-spacing:-0.02em;margin-bottom:16px;}
  .intro p{color:var(--ink-soft);font-size:15.5px;max-width:30em;margin:0 auto 14px;}
  .facts{display:flex;justify-content:center;gap:0;margin:24px 0 28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .fact{flex:1;padding:16px 10px;}
  .fact+.fact{border-left:1px solid var(--line);}
  .fact b{display:block;font-family:var(--display);font-size:22px;font-weight:600;color:var(--gold);}
  .fact span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#14110c;font-weight:700;font-size:16px;padding:15px 30px;border-radius:14px;border:none;cursor:pointer;transition:transform .15s ease;font-family:var(--body);}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.35;pointer-events:none;}

  /* question */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .qnum{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:0.04em;}
  .flag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-faint);background:transparent;border:1px solid var(--line);border-radius:100px;padding:5px 12px;cursor:pointer;transition:.15s;font-family:var(--body);}
  .flag.on{color:var(--gold);border-color:var(--gold);background:rgba(227,184,74,0.1);}
  .qtext{font-size:18px;line-height:1.5;font-weight:500;margin-bottom:20px;}
  .qtext code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:5px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);line-height:1.4;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:rgba(255,255,255,0.2);}
  .opt.sel{border-color:var(--gold);background:rgba(227,184,74,0.08);}
  .opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .opt.sel .key{background:var(--gold);color:#14110c;}

  /* review states */
  .opt.correct{border-color:var(--green);background:rgba(52,211,166,0.1);}
  .opt.correct .key{background:var(--green);color:#072018;}
  .opt.incorrect{border-color:var(--red);background:rgba(232,98,92,0.1);}
  .opt.incorrect .key{background:var(--red);color:#2a0a08;}
  .explain{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .explain b{color:var(--ink);}

  /* nav dots */
  .nav-dots{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 4px;justify-content:center;}
  .dot{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-faint);cursor:pointer;transition:.15s;font-family:var(--body);}
  .dot.answered{background:var(--surface-2);color:var(--ink);border-color:rgba(255,255,255,0.18);}
  .dot.current{border-color:var(--gold);color:var(--gold);}
  .dot.flagged{box-shadow:inset 0 0 0 2px rgba(227,184,74,0.5);}

  /* footer nav */
  .foot{display:flex;gap:12px;margin-top:24px;}
  .foot .btn{flex:1;}

  /* results */
  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:140px;height:140px;margin:6px auto 18px;}
  .scorering svg{transform:rotate(-90deg);}
  .scorering .tr{stroke:rgba(255,255,255,0.1);}
  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scorering .ctr b{font-family:var(--display);font-size:38px;font-weight:600;line-height:1;}
  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .verdict{font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:6px;}
  .verdict.pass{color:var(--green);}
  .verdict.fail{color:var(--gold);}
  .res p{color:var(--ink-soft);font-size:14.5px;max-width:28em;margin:0 auto 22px;}
  .res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}
</style>

<body>
<div class="app">
  <div class="top">
    <span class="lbl" id="topLbl">Practice Exam</span>
    <span class="timer" id="timer" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6" stroke-linecap="round"/></svg>
      <span id="timerVal">20:00</span>
    </span>
  </div>
  <div class="pbar"><i id="pbar"></i></div>

  <div class="body-wrap" id="root"></div>
</div>

<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 1",
  badge: "Databricks GenAI Engineer Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer. Databricks publishes no official passing score; 70% is our practice target.",
  coverage: "Covers all 14 objectives of Sections 1 and 2: Design Applications and Data Preparation.",
  minutes: 28,
  pass: 70
};

const QUESTIONS = [

  /* Q1 · Ch 02 - Translate business use case goals into desired inputs and outputs */
  {
    q:`A support director asks for "AI that cuts the time agents spend catching up on long tickets". Before choosing any model or tool, the engineer writes the pipeline spec. Which input and output description matches the business goal?`,
    opts:[
      "Input: an agent's draft reply; output: a politeness score from 1 to 10",
      "Input: the full ticket conversation thread; output: a short summary of the issue and current status",
      "Input: the customer's account ID; output: a list of the customer's past orders",
      "Input: the product manual; output: a chatbot that can discuss any support topic"
    ],
    correct:1,
    explain:`The goal is faster catch-up on long threads, so the pipeline must take the thread in and hand a compact summary back: that is the input-output pair the goal implies. Option D is the tempting one because a chatbot sounds helpful, but "a chatbot" is an application, not an output description, and it answers a different goal than the one stated.`
  },

  /* Q2 · Ch 03 - Select model tasks to accomplish a given business requirement */
  {
    q:`Every incoming customer email must be routed into exactly one of five predefined queues (billing, returns, technical, sales, other) before any reply is drafted. Which model task fits the routing step?`,
    opts:[
      "Classification, assigning each email one of the five queue labels",
      "Summarization, condensing each email before a human routes it",
      "Text generation, drafting a reply that mentions the right queue",
      "Extraction, pulling the sender's details into structured fields"
    ],
    correct:0,
    explain:`Choosing one label from a fixed set is classification by definition. Summarization is the tempting distractor because shorter emails feel easier to route, but it still leaves the routing decision unmade: the requirement is the label itself, not a condensed email. Generation and extraction produce the wrong kind of output entirely.`
  },

  /* Q3 · Ch 04 - Design a prompt that elicits a specifically formatted response */
  {
    q:`A chain's output feeds a billing system that parses JSON with the fields "amount", "currency", and "due_date". The model usually complies but sometimes wraps the JSON in a friendly sentence, which breaks the parser. Which prompt change most directly fixes this?`,
    opts:[
      "Raise the temperature so the model explores formats until one parses",
      "Add 'be concise' to the instructions so less prose surrounds the JSON",
      "Specify the exact JSON schema, state that nothing outside the JSON object may appear, and show a compliant example response",
      "Ask the model to apologize and retry whenever the parser fails"
    ],
    correct:2,
    explain:`Format compliance comes from an explicit contract: name the schema, forbid surrounding text, and anchor it with an example the model can imitate. "Be concise" is the tempting distractor because it sounds like less prose, but concise prose around the JSON still breaks the parser; the prompt must rule the prose out, not shrink it. Raising temperature increases variation, the opposite of what parsing needs.`
  },

  /* Q4 · Ch 05 - Select chain components for a desired model input and output */
  {
    q:`Spec: input is a free-text employee question; output is a prose answer grounded in the company's benefits documents. Which minimal component set satisfies the spec?`,
    opts:[
      "A prompt template and a model: the model already knows common benefits",
      "An embedding model queried directly, returning the nearest document chunks to the user",
      "A tool-calling agent that decides at runtime whether to search the benefits documents",
      "A retriever over the benefits index, a prompt template, a model, and a string output parser"
    ],
    correct:3,
    explain:`Grounded output demands a retriever at the front, and a prose answer needs the template, model, and a plain string parser behind it: four components, none spare. The agent (option C) is the tempting overbuild: the path never varies (every question consults the same documents), so a fixed chain does the job without runtime decision overhead. Option B retrieves chunks but never generates an answer.`
  },

  /* Q5 · Ch 06 - Define and order tools for multi-stage reasoning */
  {
    q:`An operations agent must handle "my delivery is late" requests by checking the order's shipping status and, only if the delay exceeds the promised window, issuing a goodwill credit. Two tools exist: get_shipping_status and issue_credit. How should the tools be defined and ordered?`,
    opts:[
      "Order issue_credit first so the customer is compensated before any lookup delays the reply",
      "get_shipping_status runs first to gather the facts; issue_credit is described as conditional on the delay those facts show",
      "Merge both into one tool so the model cannot call them in the wrong order",
      "Let the model call either tool in any order, since tool order never affects outcomes"
    ],
    correct:1,
    explain:`Multi-stage reasoning orders knowledge-gathering tools before action tools: the status lookup produces the fact that justifies (or blocks) the credit, so its output must exist first, and the credit tool's description should state that condition. Merging the tools (option C) is the tempting shortcut, but it welds a lookup to an irreversible action, so every status check would risk issuing a credit.`
  },

  /* Q6 · Ch 07 - Determine how and when to use Agent Bricks */
  {
    q:`An HR team wants employees to ask natural-language questions over its policy handbook and get cited answers. The team has no engineers available to write or maintain agent code. Which Agent Bricks option fits?`,
    opts:[
      "Knowledge Assistant, configured over the policy documents",
      "Multiagent Supervisor, coordinating specialist agents for each policy area",
      "Information Extraction, converting the handbook into structured records",
      "A custom agent built with the Mosaic AI Agent Framework"
    ],
    correct:0,
    explain:`Question answering over a document corpus with citations, delivered without custom code, is exactly the Knowledge Assistant's job. The Multiagent Supervisor is the tempting escalation, but there is only one knowledge domain here and no specialist agents to coordinate, so it adds architecture without adding capability. A custom Agent Framework build contradicts the no-engineers constraint.`
  },

  /* Q7 · Ch 08 - Identify needed source documents for knowledge and quality */
  {
    q:`A retailer launches a RAG assistant for its new appliance line. The corpus holds last season's manuals and the company blog. Users asking about the new models get confident answers describing the old ones. What is the root fix?`,
    opts:[
      "Add a re-ranking pass so the most relevant old-manual chunks rise to the top",
      "Lower the model's temperature so it answers less confidently",
      "Ingest the new appliance line's manuals and retire the superseded ones from the corpus",
      "Increase chunk overlap so more context from each manual reaches the model"
    ],
    correct:2,
    explain:`The corpus lacks the knowledge users need and still carries the stale version that answers in its place, so the fix is sourcing: add the new manuals and retire the old ones. Re-ranking is the tempting distractor because relevance sounds like the issue, but re-ranking can only reorder chunks that exist, and every existing chunk describes the wrong product line.`
  },

  /* Q8 · Ch 09 - Choose the Python package to extract document content */
  {
    q:`A knowledge base migration exports thousands of articles as HTML files. The pipeline must pull the article body text while skipping navigation menus and sidebars. Which Python package is the right extraction tool?`,
    opts:[
      "pytesseract, to run OCR over rendered screenshots of each page",
      "pypdf, after converting each article to PDF",
      "python-docx, since the articles are word-processed content",
      "BeautifulSoup, parsing the HTML tree and selecting the article body elements"
    ],
    correct:3,
    explain:`HTML is structured markup, and BeautifulSoup is built to navigate that structure and select exactly the elements worth keeping, which is also how the menus and sidebars get skipped. OCR is the tempting wrong turn: rendering pages to images and reading pixels throws away the markup that makes precise extraction easy. Converting to PDF first adds a lossy step for no benefit.`
  },

  /* Q9 · Ch 10 - Filter extraneous content that degrades a RAG application */
  {
    q:`Every page of a firm's contract PDFs carries the same three-line confidentiality disclaimer. After ingestion, searches keep returning disclaimer chunks near the top, and answer quality drops. What should the team change?`,
    opts:[
      "Strip the repeated disclaimer during ingestion, before chunking and embedding, and rebuild the index",
      "Add a system prompt instruction telling the model to disregard confidentiality notices",
      "Raise top-k so substantive chunks are retrieved alongside the disclaimers",
      "Reduce chunk size so each disclaimer occupies fewer tokens per chunk"
    ],
    correct:0,
    explain:`Text repeated identically on every page is boilerplate; removing it upstream keeps it out of the embeddings and the index, which is the only place the problem can actually be fixed. The prompt instruction is the tempting patch, but the disclaimers have already spent retrieval slots by the time the model reads anything, so relevant chunks were pushed out before the instruction could matter.`
  },

  /* Q10 · Ch 11 - Apply a chunking strategy for document structure and model constraints */
  {
    q:`A pipeline chunks documents at 1,000 tokens and embeds them with a model whose maximum input length is 512 tokens. Retrieval quality is poor for facts that tend to appear late in each chunk. What is going wrong?`,
    opts:[
      "The overlap is too small, so facts at chunk boundaries are being lost",
      "The embedding model has too few dimensions to represent long chunks",
      "Vector search cannot index chunks longer than the query text",
      "Each chunk is truncated at 512 tokens before embedding, so content past that point is never represented in the index"
    ],
    correct:3,
    explain:`A chunk longer than the embedding model's input limit gets cut at that limit: the first 512 tokens are embedded and the rest silently never reaches the index, which is exactly why late-in-chunk facts cannot be found. Chunk size must respect the embedding model's context length. Overlap is the tempting answer because it also involves lost content, but overlap losses happen at boundaries, not consistently in the back half of every chunk.`
  },

  /* Q11 · Ch 12 - Design retrieval systems using advanced chunking strategies */
  {
    q:`A compliance corpus consists of deeply structured manuals: numbered parts, sections, and subsections with meaningful headings. Fixed-size chunking keeps merging the end of one rule with the start of the next, and retrieved chunks mix topics. Which redesign fits the document structure?`,
    opts:[
      "Halve the chunk size so each chunk carries fewer mixed topics",
      "Split on the heading structure so each chunk is one section, and carry the heading path as metadata",
      "Double the overlap so every rule appears whole in at least one chunk",
      "Keep the chunks and add a re-ranker to prefer single-topic results"
    ],
    correct:1,
    explain:`The documents already draw their own boundaries; structure-aware splitting cuts at headings so every chunk is one semantically whole section, and the heading path becomes metadata that sharpens both embedding and filtering. Doubling overlap is the tempting patch, but it duplicates the mixed-topic problem into more chunks rather than aligning any cut with the structure.`
  },

  /* Q12 · Ch 13 - Operations and sequence to write chunked text into Delta tables */
  {
    q:`Chunks are re-ingested nightly, and the team wants its Mosaic AI Vector Search index to pick up the changes automatically after each run. Which storage setup supports this?`,
    opts:[
      "Write the chunks as JSON files to cloud storage and point the index at the bucket",
      "Write a workspace-local table and rebuild the index manually every night",
      "Write a Delta table in Unity Catalog with delta.enableChangeDataFeed set to true, and create a Delta Sync index with sync triggered after the nightly job",
      "Write a Delta table in Unity Catalog with Change Data Feed disabled to keep nightly writes fast"
    ],
    correct:2,
    explain:`A Delta Sync index follows a Unity Catalog Delta table through its Change Data Feed, so enabling the feed and triggering a sync after each ingestion run is the sequence that keeps the index current without manual work. Option D is the tempting near-miss: the write-speed saving is trivial, and disabling the feed removes exactly the change stream the sync depends on.`
  },

  /* Q13 · Ch 14 - Use tools and metrics to evaluate retrieval performance */
  {
    q:`To cut prompt noise, a team reduced top-k from 10 to 3. Precision@k improved, but answers now regularly omit facts that the corpus does contain. Which metric should the team track to quantify this regression?`,
    opts:[
      "Recall@k, the fraction of all relevant chunks that make it into the top k",
      "Precision@k on a larger evaluation set",
      "End-to-end answer latency across the two configurations",
      "Token count of the final prompts"
    ],
    correct:0,
    explain:`Facts that exist in the corpus but never reach the prompt are missing evidence, which is what recall@k measures: shrinking k raised precision by trading recall away, and only tracking both shows the trade. Re-measuring precision on more data is the tempting distractor, but precision is the metric that improved; it cannot reveal what was lost.`
  },

  /* Q14 · Ch 15 - Explain the role of re-ranking in information retrieval */
  {
    q:`An architect proposes adding a re-ranking stage to a RAG system's retrieval path. Which statement correctly describes what that stage does?`,
    opts:[
      "It replaces vector search, scoring every chunk in the corpus against the query for exact ranking",
      "It caches previous query results so repeated questions skip retrieval entirely",
      "It expands the user's query with synonyms before the vector search runs",
      "It re-scores the first-pass candidate set with a model that reads query and chunk together, improving the order at the top at the cost of added latency"
    ],
    correct:3,
    explain:`Re-ranking is a second stage: fast vector search nominates a candidate set, then a stronger model (typically a cross-encoder) scores each query-chunk pair to fix the ordering where only the top few slots matter, and the extra pass costs latency. Option A is the tempting confusion: scoring the whole corpus per query is exactly what re-rankers cannot afford, which is why the first pass must exist.`
  }

];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
