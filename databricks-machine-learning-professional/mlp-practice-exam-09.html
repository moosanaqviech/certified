<script>

/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Practice Exam 9",
  badge: "Databricks ML Professional",
  blurb: "Full-length mock. Exam-style, scenario-based questions across all six units, set at a streaming service, an airline and a freight carrier. Pick the single best answer. Databricks publishes no official passing score; 70% is our practice target, and 85% or more is a strong readiness signal.",
  coverage: "Full-length mock exam: 59 questions in 120 minutes across all six units, weighted like the real exam (Model Development 44%, MLOps 44%, Model Deployment 12%).",
  minutes: 120,
  pass: 70
};

const QUESTIONS = [

  /* Q1 - Ch 1 */
  { ref:{chapter:1}, q:`Altair Air wants a delay-prediction classifier. The training data is 6 GB of flight records, and the team's preferred model is a scikit-learn gradient-boosting pipeline they already know well. A colleague insists every Databricks model must use Spark ML. What is the right call?`,
    opts:[
      "Use the single-node scikit-learn pipeline, since 6 GB fits comfortably on one node; Spark ML pays off when data outgrows a single machine",
      "Use Spark ML, because Databricks only supports Spark ML models",
      "Use Spark ML, because it is always more accurate",
      "Sample down to 100 MB to make scikit-learn possible"
    ],
    correct:0,
    explain:`Spark ML is the tool for data that outgrows one node; at 6 GB a familiar single-node library is the simpler choice. Databricks registers and serves scikit-learn models without issue, so the colleague's premise is wrong.` },

  /* Q2 - Ch 2 */
  { ref:{chapter:2}, q:`Reelhouse's churn pipeline is a Pipeline of StringIndexer, OneHotEncoder, VectorAssembler and RandomForestClassifier. The team wants to tune the forest's numTrees and the indexer's handleInvalid together with cross-validation. What should they pass to CrossValidator as the estimator?`,
    opts:[
      "The whole Pipeline, with a ParamGridBuilder grid covering parameters from both stages",
      "Only the RandomForestClassifier, after transforming the data once",
      "The fitted PipelineModel",
      "The VectorAssembler"
    ],
    correct:0,
    explain:`Passing the Pipeline lets each fold refit every stage with the grid's values, including preprocessing parameters. Tuning only the forest on pre-transformed data cannot vary indexer settings, and fitting preprocessing once on all data leaks validation rows into it.` },

  /* Q3 - Ch 2 */
  { ref:{chapter:2}, q:`Tidepath Freight saved a fitted PipelineModel for shipment-delay scoring. A new scoring notebook must use it exactly as trained. How should it be loaded?`,
    opts:[
      "Pipeline.load and call fit on the scoring data",
      "Rebuild the stages by hand with the same parameters",
      "Load only the final classifier and skip preprocessing",
      "PipelineModel.load on the saved path (or load the logged MLflow model), then call transform"
    ],
    correct:3,
    explain:`Loading the fitted PipelineModel restores every fitted stage, so transform reproduces training-time preprocessing. Loading the unfitted Pipeline and fitting it on scoring data retrains everything on the wrong data.` },

  /* Q4 - Ch 3 */
  { ref:{chapter:3}, q:`Altair Air one-hot encodes the airport_index column for a logistic regression, and a reviewer worries about perfect collinearity among the encoded columns. What does OneHotEncoder do by default that addresses this?`,
    opts:[
      "It standardizes each encoded column to unit variance",
      "It merges rare categories into one column",
      "dropLast defaults to true, dropping the last category so the columns are not perfectly collinear",
      "It encodes categories as ordered integers"
    ],
    correct:2,
    explain:`With dropLast true, the last category is represented by all zeros, which avoids a redundant column. Encoding as ordered integers is what StringIndexer does; it would impose a false order on airports.` },

  /* Q5 - Ch 4 */
  { ref:{chapter:4}, q:`Reelhouse wants to predict which of 12 genres a new title belongs to from 200 numeric and encoded features on 50 million viewing records. Which Spark ML estimator fits?`,
    opts:[
      "RandomForestClassifier, which supports multiclass labels",
      "GBTRegressor",
      "ALS",
      "LinearRegression"
    ],
    correct:0,
    explain:`A 12-way label is multiclass classification, which RandomForestClassifier supports. A regressor treats genres as numbers on a scale, which they are not.` },

  /* Q6 - Ch 5 */
  { ref:{chapter:5}, q:`Tidepath Freight tunes a model on 3 billion rows and must finish within a fixed nightly window. Which tuner and setting fit best?`,
    opts:[
      "TrainValidationSplit, with the parallelism parameter raised to use idle executors",
      "CrossValidator with 10 folds",
      "CrossValidator with parallelism set to 1",
      "Manual tuning in a single-node notebook"
    ],
    correct:0,
    explain:`One split per setting keeps cost low at this scale, and parallelism fits settings concurrently. Ten-fold cross-validation gives a steadier estimate but costs ten fits per setting, which will not fit a nightly window.` },

  /* Q7 - Ch 6 */
  { ref:{chapter:6}, q:`Altair Air's multiclass delay-cause model (weather, crew, mechanical, air traffic) is evaluated with MulticlassClassificationEvaluator. Which metric does it use by default?`,
    opts:[
      "accuracy",
      "f1",
      "areaUnderROC",
      "rmse"
    ],
    correct:1,
    explain:`MulticlassClassificationEvaluator defaults to f1, a weighted F1 across classes. Accuracy is available, but it must be set explicitly with metricName.` },

  /* Q8 - Ch 7 */
  { ref:{chapter:7}, q:`Reelhouse has a fitted PipelineModel that flags abusive comments, and comments land in a Delta table continuously. Moderators need flags within seconds. What is the most direct approach?`,
    opts:[
      "readStream the comments table, apply PipelineModel.transform, and writeStream the flags to a Delta table",
      "A daily batch job over all comments",
      "Re-fit the pipeline on each micro-batch",
      "Collect comments to the driver every few seconds"
    ],
    correct:0,
    explain:`A fitted PipelineModel scores streaming DataFrames, so Structured Streaming flags comments as they arrive. A daily batch is simpler, but flags would arrive hours too late for moderators.` },

  /* Q9 - Ch 8 */
  { ref:{chapter:8}, q:`Tidepath Freight scores 400 million shipments nightly in batch with a model trained on 3 TB. A teammate suggests a single-node scikit-learn model for this job. What fits better?`,
    opts:[
      "A single-node model scoring 400 million rows on the driver",
      "Spark ML trained and applied with transform across the cluster, since both training data and batch scoring are large and there is no per-request latency need",
      "A real-time endpoint called once per shipment",
      "Sampling 1% of shipments to score"
    ],
    correct:1,
    explain:`Large training data and large batch scoring with no latency requirement play to Spark ML's strengths. Single-node models shine for small data and low-latency single requests, which is not this job.` },

  /* Q10 - Ch 9 */
  { ref:{chapter:9}, q:`Altair Air wants to train a separate small model for each of 600 routes on a Spark cluster rather than one model on all data. The training code uses scikit-learn. Which Spark feature matches this per-group training?`,
    opts:[
      "Spark ML's CrossValidator",
      "A scalar pandas UDF over the whole DataFrame",
      "Broadcasting the training data to every executor",
      "The Pandas Function API, applyInPandas grouped by route"
    ],
    correct:3,
    explain:`applyInPandas passes each group's rows to a Python function, ideal for per-group scikit-learn training. A scalar pandas UDF transforms columns in batches and cannot gather a whole route's rows to fit a model.` },

  /* Q11 - Ch 10 */
  { ref:{chapter:10}, q:`Reelhouse's grouped training function, run with applyInPandas, must return a result to Spark. The team wants a summary row per region with the region, the MLflow run ID and the validation RMSE. What should the function return and declare?`,
    opts:[
      "The trained model object",
      "A pandas DataFrame with those columns, matching the output schema passed to applyInPandas",
      "Nothing; logging to MLflow is enough",
      "A Python dict"
    ],
    correct:1,
    explain:`applyInPandas expects each call to return a pandas DataFrame matching the declared schema. Returning a model object is not a valid output; the model is logged to MLflow and referenced by run ID.` },

  /* Q12 - Ch 11 */
  { ref:{chapter:11}, q:`Tidepath Freight has a router PyFunc that holds one model per depot and is registered in Unity Catalog. They need to score 300 million rows in batch with it. Which approach applies it across the cluster?`,
    opts:[
      "Load the router on the driver and loop over rows",
      "mlflow.pyfunc.spark_udf on the registered model, applied to the DataFrame",
      "Deploy it to an endpoint and call it 300 million times",
      "Convert each depot model to Spark ML first"
    ],
    correct:1,
    explain:`spark_udf wraps a registered PyFunc as a Spark UDF that scores partitions in parallel. An endpoint works for real time, but 300 million network calls is the wrong tool for a batch job.` },

  /* Q13 - Ch 12 */
  { ref:{chapter:12}, q:`Altair Air's Optuna study uses MlflowStorage and MlflowSparkStudy. Where can the team compare all trials' parameters and objective values?`,
    opts:[
      "Only in the driver's standard output",
      "Nowhere, unless they export the study to CSV",
      "In the Spark UI's SQL tab",
      "In MLflow, where each trial is recorded"
    ],
    correct:3,
    explain:`MlflowStorage records the study and its trials in MLflow, where they can be compared. Driver output shows progress, but it is not a durable, comparable record.` },

  /* Q14 - Ch 13 */
  { ref:{chapter:13}, q:`Reelhouse wants to tune a recommendation model with Ray Tune on Databricks and see every trial's metrics in MLflow. Which combination fits?`,
    opts:[
      "Hyperopt SparkTrials",
      "CrossValidator with a Ray estimator",
      "setup_ray_cluster to start Ray on the cluster, Ray Tune for the search, and MLflow logging from the trials",
      "Ray Tune on a separate cloud VM outside Databricks"
    ],
    correct:2,
    explain:`Ray on Databricks runs on the cluster after setup_ray_cluster, Tune schedules the trials, and MLflow records them. SparkTrials belongs to Hyperopt, which this exam guide does not cover; it names Optuna and Ray Tune.` },

  /* Q15 - Ch 14 */
  { ref:{chapter:14}, q:`Tidepath Freight's Spark job processes 20 TB and is slow on eight workers, while a separate single-node Python script crashes with out-of-memory errors on a 32 GB machine. Which scaling fits each?`,
    opts:[
      "Larger nodes for both",
      "More workers for both",
      "Add workers for the Spark job (horizontal), and use a larger node for the single-node script (vertical)",
      "Rewrite both in pandas"
    ],
    correct:2,
    explain:`Distributed code benefits from more workers, while single-node code can only use a bigger machine. Adding workers to the single-node script changes nothing, because it never uses them.` },

  /* Q16 - Ch 15 */
  { ref:{chapter:15}, q:`Altair Air trains a vision model that fits on one GPU, using eight GPUs with each holding a full copy of the model and processing different batches, gradients averaged each step. What is this called?`,
    opts:[
      "Model parallelism",
      "Data parallelism",
      "Pipeline scheduling",
      "Horizontal feature parallelism"
    ],
    correct:1,
    explain:`Full model copies working on different batches with averaged gradients is data parallelism. Model parallelism splits the model itself across devices, which is unnecessary when it fits on one.` },

  /* Q17 - Ch 15 */
  { ref:{chapter:15}, q:`Reelhouse's new transformer recommender has outgrown a single GPU's memory. The team moves to sharding parameters, gradients and optimizer state across GPUs with FSDP. How should this be classified for the exam's two categories?`,
    opts:[
      "With data parallelism, since FSDP never splits model state",
      "With model parallelism, since the model's state is split across devices because it does not fit on one",
      "Neither; FSDP is a form of vertical scaling",
      "Neither; FSDP is a tuning method"
    ],
    correct:1,
    explain:`FSDP shards model state across devices to fit models too large for one GPU, which groups it with model parallelism here (it also splits data, a nuance worth knowing). It is not vertical scaling, which means a bigger single machine.` },

  /* Q18 - Ch 16 */
  { ref:{chapter:16}, q:`Tidepath Freight needs a fleet-routing simulation with thousands of small Python tasks of different sizes, some on GPUs, scheduled dynamically. The input data is small. Which framework fits best?`,
    opts:[
      "Ray, built for flexible, fine-grained Python task scheduling",
      "Spark SQL",
      "Spark ML",
      "A single pandas notebook"
    ],
    correct:0,
    explain:`Ray schedules heterogeneous Python tasks dynamically, which suits simulations. Spark excels at large-scale data processing, but its strengths are wasted on small data with irregular tasks.` },

  /* Q19 - Ch 17 */
  { ref:{chapter:17}, q:`Altair Air logs a parent run for a tuning job and wants each trial inside it to appear as a child. What should the code do when starting each trial's run?`,
    opts:[
      "Start a new experiment per trial",
      "Call mlflow.end_run before each trial",
      "Call mlflow.start_run(nested=True) inside the active parent run",
      "Set a tag named parent on each top-level run"
    ],
    correct:2,
    explain:`nested=True creates a child of the currently active run. Ending the parent first would make each trial a separate top-level run.` },

  /* Q20 - Ch 18 */
  { ref:{chapter:18}, q:`Reelhouse wants every training run to record the exact list of excluded content IDs (12,000 IDs) for audit. Which logging approach fits?`,
    opts:[
      "Log each ID as a separate parameter",
      "Log the list as an artifact, for example with mlflow.log_dict or log_text",
      "Put the whole list in one tag",
      "Log the count as a metric only"
    ],
    correct:1,
    explain:`Large structured data belongs in an artifact. Parameters and tags are short values with size limits; 12,000 parameters would also clutter the run.` },

  /* Q21 - Ch 19 */
  { ref:{chapter:19}, q:`Tidepath Freight's ETA model needs the distance between pickup and drop-off computed from coordinates in each request, using a geodesic function from training. How should it be served so serving matches training?`,

      "Store distances for every pair of locations in a table",
      "Train without the distance feature",

  /* Q22 - Ch 20 */
  { ref:{chapter:20}, q:`Altair Air trains a no-show model on bookings, each with a booking_time, joined to a customer feature table with a timestamp key. Some features were recalculated after the bookings happened. Which lookup prevents leakage?`,
    opts:[
      "A point-in-time FeatureLookup with timestamp_lookup_key set to booking_time",
      "A plain join on customer_id",
      "Training only on the latest feature snapshot",
      "Dropping the timestamp column from the feature table"

    correct:0,
    explain:`A point-in-time lookup returns the latest feature values at or before each booking. A plain join returns the newest values, including ones computed after the booking.` },

  /* Q23 - Ch 21 */
  { ref:{chapter:21}, q:`Reelhouse recomputes viewer engagement features nightly and wants them kept current in the feature table without hand-running notebooks. Which setup fits?`,
    opts:[

      "A scheduled Lakeflow Job that computes the features and calls fe.write_table with mode=\"merge\"",

    explain:`A scheduled job with merge writes keeps the table current automatically. Recreating the table nightly discards it and its history each time.` },

  { ref:{chapter:22}, q:`Tidepath Freight's routing endpoint needs depot features with millisecond latency. A teammate proposes online tables. What should the team use?`,

      "Direct SQL warehouse queries from the endpoint",
      "A CSV file packaged with the model",
      "A Databricks Online Feature Store, fed with publish_table"

  /* Q25 - Ch 23 */
  { ref:{chapter:23}, q:`Altair Air wants a feature counting each aircraft's sensor faults in the last 15 minutes, available to a maintenance model within seconds. Faults arrive as a stream. What fits?`,
    opts:[
      "An hourly batch job",
      "A nightly snapshot",
      "A streaming windowed aggregation written with fe.write_table and published continuously",
      "Counting faults inside the request"
    ],
    correct:2,
    explain:`Streaming writes with continuous publishing keep a 15-minute window fresh. An hourly batch would be stale for most of each hour.` },

  /* Q26 - Ch 24 */
  { ref:{chapter:24}, q:`Reelhouse's partner dashboard needs viewer features (average watch time, genre mix) plus an on-demand ratio computed from a request value, as feature values only. What should be deployed?`,
    opts:[
      "The recommender model's endpoint",
      "A Feature Serving endpoint from a FeatureSpec with the lookups and the on-demand FeatureFunction",
      "A nightly CSV export",
      "A SQL warehouse dashboard query"
    ],
    correct:1,

  /* Q27 - Ch 25 */
  { ref:{chapter:25}, q:`In Tidepath Freight's recommended MLOps workflow, what triggers deployment of the ML pipelines to the production environment?`,
    opts:[

      "Any merge to a feature branch",
      "A data scientist running the training notebook in production",
      "A drift alert"
    ],
    correct:0,
    explain:`Production deployment follows a release branch. Merging to main updates staging; drift alerts trigger retraining, not deployment of new code.` },

  /* Q28 - Ch 26 */
  { ref:{chapter:26}, q:`Altair Air retrains a demand model weekly on booking data that only production may read, and wants reviewed code to drive retraining. Which pattern fits?`,
    opts:[

      "Deploy models",
      "Manual retraining by data scientists in production",
      "Training once and never retraining"

  { ref:{chapter:27}, q:`Reelhouse wants retraining to start automatically when a monitored metric crosses a threshold. Which pair of Databricks features covers the trigger and the work?`,

  { ref:{chapter:28}, q:`Tidepath Freight's batch inference job loads models:/ml.prod.eta@champion. Engineers move the Champion alias from version 14 to version 15. What happens to the job?`,

  { ref:{chapter:30}, q:`At Reelhouse, which tests should run in production itself?`,

      "Load tests on every request",
      "None of the code test suites; production runs model validation checks and monitoring on code already tested earlier"

  { ref:{chapter:31}, q:`Tidepath Freight changes only the evaluation metric threshold that a model must clear before registration. The pipeline is feature engineering, training, evaluation, deployment and inference. Which stages must rerun?`,

  { ref:{chapter:31}, q:`Altair Air designs an integration test for its pipelines in staging. Which data should it use?`,

  { ref:{chapter:32}, q:`Reelhouse's data scientists keep functions and their tests in the same notebook. What is the main drawback Databricks notes for this layout?`,

      "Accuracy at 0.5",
      "Mean absolute error"

    47:["lesson-47-blue-green-vs-canary.html", "Blue-Green vs Canary Deployment"],
    48:["lesson-48-served-entities-traffic-split.html", "Rolling Out a Model with Model Serving: Served Entities and Traffic Split"],
    49:["lesson-49-scaling-high-traffic-endpoints.html", "Scaling a High-Traffic Endpoint: Scale-Out and Route Optimization"],
    50:["lesson-50-registering-custom-pyfunc-models.html", "Registering Custom PyFunc Models and Artifacts in Unity Catalog"],
    51:["lesson-51-deploying-custom-models.html", "Deploying Custom Models: Deployments SDK vs REST API vs UI"],
    52:["lesson-52-querying-served-models.html", "Querying Served Models: REST API vs MLflow Deployments SDK"]
  }
};
/* ===== EXAM PAYLOAD - END ===== */

   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
