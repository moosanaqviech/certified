const E = {
  name: "Practice Exam 4",
  badge: "Databricks ML Professional",
  blurb: "Scenario-based questions across Unit 4, Lifecycle, Testing and Environments. Pick the single best answer.",
  coverage: "Covers Unit 4: all 10 chapters, one question per chapter.",
  minutes: 20,
  pass: 70
};

const QUESTIONS = [

  /* Ch 25 - The deploy-code lifecycle pipeline (2.1) */
  { ref:{chapter:25}, q:`Fernway's platform team wants every change to the demand-forecast code reviewed and tested before it reaches production, and wants production to retrain on its own data without anyone copying models between workspaces. Which flow matches the Databricks recommended MLOps workflow?`,
    opts:[
      "Data scientists train in dev, then copy the best model version to the prod catalog after a manual review",
      "Develop on a branch, run unit tests on a pull request to main, run integration tests in staging, then cut a release branch that deploys the pipelines to production, where training, validation and deployment run on prod data",
      "Develop and test directly in the production workspace, with Git used only for backups",
      "Run integration tests in production after each deploy, and roll back if they fail"
    ],
    correct:1,
    explain:`The recommended workflow moves code, not models: PR unit tests, staging integration tests, then a release branch to production, where the pipelines retrain, validate (Challenger) and deploy (Champion) on prod data. Option A promotes a model, which skips staging tests for the supporting code and trains on dev data rather than production data.` },

  /* Ch 26 - Deploy code vs deploy models (2.2, TO) */
  { ref:{chapter:26}, q:`Fernway fine-tunes a large product-image embedding model once on dozens of GPUs over several days; it changes only a couple of times a year. The team runs a single workspace and has no CI/CD system yet. Which deployment pattern fits this model best?`,
    opts:[
      "Deploy code, retraining the model separately in staging and production",
      "Deploy code, with a nightly retraining schedule in production",
      "Deploy models only for the inference code, and deploy code for training",
      "Deploy models: train once, then promote the trained artifact toward production"
    ],
    correct:3,
    explain:`Very expensive, rarely changing training with one workspace and no CI/CD are the deploy-models signals, so the artifact is trained once and promoted. Option A follows the general recommendation, but it would pay for several multi-day GPU runs to produce the same model with no gain in safety.` },

  /* Ch 27 - Mapping Databricks features to lifecycle activities (2.3) */
  { ref:{chapter:27}, q:`Fernway's nightly batch scoring job should always use whichever recommendation model version is currently approved for production, and pick up a newly approved version without any code change. Which Databricks feature provides that?`,
    opts:[
      "A Unity Catalog model alias such as Champion, loaded by the job with models:/catalog.schema.model@champion",
      "A Model Serving endpoint that the batch job calls row by row",
      "An MLflow experiment, from which the job loads the run with the best metric",
      "A Git folder that holds the model file next to the job's notebook"
    ],
    correct:0,
    explain:`An alias is a movable reference to a registered version, so the job loads the approved version and follows the alias when it is reassigned. Option C picks the best-scoring run, which may never have passed validation and is not what production is approved to use.` },

  /* Ch 28 - Model versions and aliases in Unity Catalog (2.3) */
  { ref:{chapter:28}, q:`Version 22 of Fernway's churn model was promoted to Champion this morning, and complaint rates spiked within hours. Version 21 was the previous Champion. The team wants every consumer back on version 21 immediately while keeping version 22 for investigation. What should they do?`,
    opts:[
      "Delete version 22 so the registry falls back to version 21",
      "Transition version 22 to the Archived stage and version 21 to Production",
      "Reassign the Champion alias to version 21",
      "Register version 21 again so it becomes version 23"
    ],
    correct:2,
    explain:`Moving the alias redirects every consumer that loads Champion on its next load and leaves version 22 intact. Option B describes the legacy Workspace Model Registry: stages are not supported for models in Unity Catalog, where promotion and rollback happen through aliases.` },

  /* Ch 29 - Unit testing notebook functions (2.4) */
  { ref:{chapter:29}, q:`A Fernway notebook cell computes a basket-size label inline, and a recent edit silently changed the boundary between "small" and "medium". The team wants a test that fails immediately on such a change, runs in seconds and never touches production tables. What should they do?`,
    opts:[
      "Extract the logic into a function, and write pytest tests in a test_ file that call it with small hand-built inputs, including the boundary values",
      "Rerun the full training pipeline after each edit and compare the final model's accuracy",
      "Add a dashboard that charts the share of each label in production each day",
      "Wrap the cell in try and except so errors are logged instead of raised"
    ],
    correct:0,
    explain:`A unit test needs a callable function and specific inputs with expected outputs, run on fake data. Option B is a real check, but it exercises the whole pipeline: slow, coarse, and unlikely to pinpoint a single boundary change.` },

  /* Ch 30 - Which tests run where (2.4) */
  { ref:{chapter:30}, q:`Fernway runs a two-hour end-to-end pipeline test on every commit, so developers commit rarely, and nothing is tested in staging before release. Last month, an inference job read a column the training pipeline had renamed. Which test placement fixes both problems?`,
    opts:[
      "Unit tests only, everywhere, because they are fastest",
      "All tests in production after deployment, on real data",
      "Integration tests on every commit, plus monitoring in production",
      "Unit tests in CI on every pull request, and integration tests across all pipelines in staging before merge and release"
    ],
    correct:3,
    explain:`Unit tests give fast feedback on logic, and staging integration tests catch broken hand-offs between pipelines, like a renamed column. Option A is fast, but no unit test of a single function can see that two pipelines disagree about a column name.` },

  /* Ch 31 - Designing an end-to-end integration test (2.5) */
  { ref:{chapter:31}, q:`Fernway's markdown-pricing pipeline writes features to the feature store, builds a training set, trains, evaluates, logs the model with the Feature Engineering client, deploys it to an endpoint and runs batch inference. An engineer changes only the evaluation threshold the model must clear before registration. At minimum, which integration tests must rerun?`,
    opts:[
      "Feature engineering only",
      "Evaluation, deployment and inference, but not feature engineering or training",
      "Training only",
      "All stages, including feature engineering"
    ],
    correct:1,
    explain:`Rerun from the first stage the change touches: the threshold lives in evaluation, which decides whether a model is registered and deployed, so evaluation and everything after it must rerun. Option D is safe but wasteful, since neither feature engineering nor training reads the threshold, so their outputs cannot change.` },

  /* Ch 32 - Notebooks vs Python modules (2.6, TO) */
  { ref:{chapter:32}, q:`Fernway's Python feature helpers are copied into eight notebooks, and the team wants GitHub Actions to run a pytest suite for them on every pull request. A teammate suggests moving the helpers into one shared notebook and pulling it in with %run. What should they do instead?`,
    opts:[
      "Keep functions and their tests together in each notebook",
      "Put the helpers in a shared notebook and the tests in a markdown cell",
      "Move the helpers into a .py module in the repo with test_ files beside it, and import the module in each notebook",
      "Convert the helpers to Scala so they compile before tests run"
    ],
    correct:2,
    explain:`For Python, Databricks recommends functions and tests outside notebooks, where CI runners and pytest work naturally. A shared notebook with %run removes the copy-paste, but notebook-defined functions are hard to use or test outside notebooks, which is exactly what the CI job needs.` },

  /* Ch 33 - Designing scalable ML environments (2.7) */
  { ref:{chapter:33}, q:`An experiment at Fernway overwrote a production feature table, and an exploratory job starved the nightly scoring cluster, because everyone shares one workspace and one catalog. Data scientists still need to analyze production predictions. Which design fits Databricks guidance?`,
    opts:[
      "Separate dev, staging and prod workspaces and catalogs on one metastore, with data scientists read-write on dev and read-only on prod, and prod writes and compute reserved for production pipelines",
      "Keep one workspace but ask data scientists to prefix their tables with dev_",
      "Block all data scientist access to production data and workspaces",
      "Give everyone write access to prod and rely on table history to undo mistakes"
    ],
    correct:0,
    explain:`Separate environments isolate compute and jobs, a catalog per environment isolates writes, and read-only prod access keeps analysis possible. Option C is safe, but it removes the read access Databricks recommends so data scientists can study how their models behave in production.` },

  /* Ch 34 - Declarative Automation Bundles (2.8) */
  { ref:{chapter:34}, q:`Fernway's staging and prod workspaces have drifted: different cluster sizes, a missing quality monitor, an endpoint with the wrong workload size. DevOps wants the MLflow experiment, Unity Catalog registered model, serving endpoint and jobs version-controlled and deployed to every environment the same way, with only a few per-environment differences. Which approach fits?`,
    opts:[
      "Package the training code as an MLflow Project and run it in each workspace",
      "Keep a checklist and recreate each resource by hand per workspace",
      "Maintain one bundle per environment, edited separately",
      "Declare all resources in one Declarative Automation Bundle with dev, staging and prod targets, override per-environment settings in the targets, and deploy with databricks bundle deploy -t"
    ],
    correct:3,
    explain:`A bundle declares experiments, registered models, endpoints, jobs and monitors as versioned configuration, and targets vary settings per environment from one definition. Option C also uses bundles, but separate copies drift apart over time, which is the problem the team is trying to solve.` }
];

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
