const QUESTIONS = [

  /* Ch 09 - Scaling Training with Spark ML and pandas UDFs (1.8) */
  { ref:{chapter:9}, q:`A Fernway data scientist wraps the training of one scikit-learn random forest, over the full 300-million-row orders table, inside a pandas UDF so that "Spark will distribute it." The job fails with out-of-memory on a single worker. What is the correct diagnosis?`,
    opts:[
      "The UDF needs a larger maxRecordsPerBatch setting",
      "The cluster needs more workers so the fit can be split across them",
      "A pandas UDF runs each call on one worker, so one model over the full table still needs one machine's memory; a distributed algorithm such as Spark ML fits this case",
      "scikit-learn cannot run inside Spark at all"
    ],
    correct:2,
    explain:`pandas UDFs and function APIs run your single-node code once per batch or group on one worker; they parallelize many small fits, not one big one. More workers (B) add parallel tasks, but a single fit still lands on one worker, so they cannot help a model whose data exceeds that worker's memory.` },

  /* Ch 10 - Group-Specific Training (1.14) */
  { ref:{chapter:10}, q:`Fernway trains one forecasting model per store with <code>groupBy("store_id").applyInPandas(train_store, schema)</code>. Planners need to compare per-store accuracy in MLflow and retrieve any store's model later. Which design of <code>train_store</code> meets this?`,
    opts:[
      "Log each store's model and metrics to an MLflow child run tagged with the store id, and return a row with the store id, metric and run id",
      "Return the pickled model bytes as a column of the output DataFrame",
      "Train every store inside one MLflow run and log a single average metric",
      "Write each model to the driver's local disk and print the path"
    ],
    correct:0,
    explain:`A tagged child run per store makes metrics comparable and models searchable, and the returned run ids form a lookup table for inference. B keeps the models, but it pushes large binary blobs through the result DataFrame and bypasses MLflow tracking, so nothing is comparable or governed.` },

  /* Ch 11 - Group-Specific Inference (1.14) */
  { ref:{chapter:11}, q:`Fernway scores weekly demand with a row-level UDF that loads each row's store model from MLflow. After grouping by store to load each model once, one task still fails with out-of-memory because the flagship store has millions of rows. Scores must remain per store. What is the best fix?`,
    opts:[
      "Increase maxRecordsPerBatch so the flagship group is split into batches",
      "Remove the flagship store from the weekly run",
      "Go back to the row-level UDF for the flagship store",
      "Score with a router pyfunc that sends each row to its store's model, applied through mlflow.pyfunc.spark_udf, so rows are processed in batches rather than as one group"
    ],
    correct:3,
    explain:`Inference rows are independent, so a router model applied as a Spark UDF scores the flagship's rows in batches without loading the whole group at once. Option A is the trap: maxRecordsPerBatch does not apply to grouped map, so the flagship's rows would still arrive together.` },

  /* Ch 12 - Distributed Optuna with MLflow (1.9) */
  { ref:{chapter:12}, q:`Fernway's ETA team is migrating a Hyperopt tuning job to Databricks Runtime ML 17.x. They want Optuna trials distributed across Spark executors, every trial recorded in their MLflow experiment, and minimal custom code. Which approach fits?`,
    opts:[
      "Keep Hyperopt with SparkTrials, since it ships with every ML runtime",
      "Create MlflowStorage with the experiment id and run an MlflowSparkStudy on that storage",
      "Run one Optuna study per executor with local SQLite storage and merge the results",
      "Use Optuna's MLflowCallback and start studies asynchronously from the driver"
    ],
    correct:1,
    explain:`MlflowStorage makes the MLflow Tracking Server Optuna's shared storage, and MlflowSparkStudy launches the trials on PySpark executors. Option D does log to MLflow, but asynchronous calls on the driver do not distribute trials across the cluster; option A fails outright because Hyperopt is not included in Databricks Runtime ML after 16.4 LTS ML.` },

  /* Ch 13 - Ray Tune (1.10) */
  { ref:{chapter:13}, q:`Fernway runs Ray Tune on a Ray-on-Spark cluster to tune a PyTorch model. Trials complete, but none of their metrics appear in MLflow, because each trial's <code>mlflow.log_metric</code> call fails inside the Ray worker. What should the team change?`,
    opts:[
      "Start a parent MLflow run on the driver and pass its run id and the Databricks credentials into each trial, which logs to a nested child run",
      "Raise max_worker_nodes in setup_ray_cluster",
      "Replace Ray Tune with CrossValidator",
      "Log all trial results as one JSON parameter after tuner.fit() returns"
    ],
    correct:0,
    explain:`Ray trials run in separate worker processes without the notebook's MLflow context, so each needs the client credentials and the parent run id to log nested child runs. D gets results into MLflow, but as one flattened value, losing per-trial metrics and the comparison view the team needs.` },

  /* Ch 14 - Vertical vs Horizontal Scaling (1.11), with Ch 10 */
  { ref:{chapter:14}, q:`Fernway's grouped-map training of 400 store models runs on two workers and takes four hours. Memory use per task stays well below its limit, and tasks queue waiting for free cores. Which change most directly reduces the runtime?`,
    opts:[
      "Swap to two workers with twice the memory and the same cores",
      "Move to a single-node cluster on the largest instance type",
      "Add more workers of the same size so more store tasks run concurrently",
      "Train a single Spark ML model across all stores"
    ],
    correct:2,
    explain:`Independent tasks that already fit in memory are limited by how many can run at once, and total executor cores set that ceiling, so scaling out helps directly. Option A is the scale-up reflex: more memory per worker fixes tasks that are too big, but these tasks already fit, so it buys almost nothing.` },

  /* Ch 15 - Data vs Model Parallelism (1.12) */
  { ref:{chapter:15}, q:`Fernway's language model for product descriptions needs roughly four times the memory of its largest GPU for parameters, gradients and optimizer state. The team first tried DDP across eight GPUs with smaller per-GPU batches, and it still fails with out-of-memory. Why, and what should they do?`,
    opts:[
      "DDP needs at least 16 GPUs; double the GPU count",
      "DDP replicates the full model state on every GPU, so the model must be split: shard it with FSDP or the DeepSpeed distributor",
      "The batch is still too large; reduce it to one sample per GPU",
      "Switch to Spark ML, which handles large models automatically"
    ],
    correct:1,
    explain:`Data parallelism puts a full copy of parameters, gradients and optimizer state on every device, so a model that cannot fit on one GPU needs model parallelism, starting with sharding. Option C shrinks activations, which helps a little, but the replicated model state alone already exceeds the GPU.` },

  /* Ch 16 - Ray vs Spark (1.13) */
  { ref:{chapter:16}, q:`Fernway is building a reinforcement learning simulation to optimize van routing. Each simulation episode is a compute-heavy, independent task, and inputs come from large Delta tables of historical routes that need joining first. Which design follows Databricks guidance?`,

      "Use a single large driver to run episodes sequentially",
      "Use Spark to join and prepare the route tables, pass them to Ray with ray.data.from_spark, and run the episodes as Ray tasks"
    ],
    correct:3,
    explain:`Reinforcement learning and simulation are named Ray workloads, while large joins are Spark's data-parallel strength; the recommended pattern is Spark for data handling and Ray for computation. Option B picks the right engine for the episodes but gives Ray the relational work Spark does better.` }
];

const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
