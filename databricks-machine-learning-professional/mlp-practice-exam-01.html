const E = {
  name: "Practice Exam 1",
  badge: "Databricks ML Professional",
  blurb: "Scenario-based questions across Unit 1, Spark ML at Scale. Pick the single best answer.",
  coverage: "Covers Unit 1: all 8 chapters, one question per chapter.",
  minutes: 16,
  pass: 70
};

const QUESTIONS = [

  /* Ch 01 - When Spark ML Fits (1.1) */
  { ref:{chapter:1}, q:`Fernway Market's pricing team trains a markdown model on 18,000 rows of weekly product aggregates, produced by a Spark job that reads 2 billion transaction rows. The model is retrained weekly and its scores are written to a table. A teammate proposes rewriting the training step in Spark ML "because the source data is huge." What is the best response?`,
    opts:[
      "Agree: any model whose source data is processed in Spark should be trained with Spark ML",
      "Keep the Spark aggregation, but train the model with a single-node library, since the training set fits easily in memory",
      "Move the aggregation to pandas so the whole workflow runs on one node",
      "Train with Spark ML on Standard compute to share the cluster's driver memory"
    ],
    correct:1,
    explain:`The signal that matters is the size of the training data, and 18,000 aggregated rows fit comfortably on one node, so single-node training is simpler and faster while Spark keeps doing the heavy aggregation. Option A confuses scalable preprocessing with distributed training: processing big data in Spark does not oblige the model itself to be distributed.` },

  /* Ch 02 - Building a Spark ML Pipeline (1.2) */
  { ref:{chapter:2}, q:`A Fernway engineer builds <code>Pipeline(stages=[region_idx, region_ohe, assembler, lr])</code>, fits it on the full customer table, and reports a validation AUC computed on a 20% sample of that same table. A reviewer flags two problems. Which pair is correct?`,
    opts:[
      "The pipeline should end with a Transformer, and the evaluation sample is too small",
      "VectorAssembler must be fitted before the encoder, and AUC is the wrong metric",
      "The OneHotEncoder must come before the StringIndexer, and the sample should be 30%",
      "The pipeline was fitted on rows later used for validation, and fitting should use the training split only, with validation rows only transformed"
    ],
    correct:3,
    explain:`Pipeline.fit lets every Estimator learn from the data it sees, so fitting on the whole table leaks the validation rows into the indexer, encoder and model, inflating the AUC. The fix is fit on train, transform validation. Option A sounds structural, but a Pipeline ending in an Estimator is normal: fit turns it into a PipelineModel whose last stage is the fitted model.` },

  /* Ch 03 - Feature Transformers (1.3) */
  { ref:{chapter:3}, q:`Fernway's delivery-slot column holds strings such as "Morning", "Evening" and "Late night". A linear regression in Spark ML needs this column as features, and new slot names may appear after training; every row must still be scored. Which stage sequence meets the requirements?`,
    opts:[
      "StringIndexer with handleInvalid set to keep, then OneHotEncoder, then VectorAssembler",
      "VectorAssembler directly on the string column, then StandardScaler",
      "OneHotEncoder on the string column, then StringIndexer, then VectorAssembler",
      "StringIndexer with handleInvalid set to skip, then VectorAssembler on the index"
    ],
    correct:0,
    explain:`Strings are indexed first, one-hot encoded so the linear model does not treat slot indices as magnitudes, then assembled; "keep" puts unseen slots in an extra bucket so every row is scored. Option D handles new slots without failing, but "skip" drops those rows, and feeding a raw index to a linear model imposes a false ordering.` },

  /* Ch 04 - Choosing an Estimator (1.3) */
  { ref:{chapter:4}, q:`Fernway wants to predict which of five packaging types (bag, box, chilled box, frozen box, bulk crate) each order needs, from item counts and categories. The label column is a string. Which Spark ML setup fits?`,
    opts:[
      "GBTClassifier on the string label",
      "LinearRegression on a StringIndexer-encoded label",
      "StringIndexer on the label, then a multiclass classifier such as RandomForestClassifier",
      "KMeans with k set to 5, mapping clusters to packaging types"
    ],
    correct:2,
    explain:`Five categories make this multiclass classification, and Spark ML classifiers need a numeric label, so the label is indexed first. Option D finds five groups, but clustering ignores the label, so its clusters need not match packaging types; GBTClassifier in A only supports binary labels, and regression in B treats the indices as quantities.` },

  /* Ch 05 - CrossValidator vs TrainValidationSplit (1.4) */
  { ref:{chapter:5}, q:`Fernway is tuning a model on 1,200 rows of store-launch history, with a 12-setting grid that takes about four minutes per full pass. Two candidate settings swap places depending on the random split seed. Leadership will use the model to approve new store sites. Which tuning approach fits best?`,
    opts:[
      "TrainValidationSplit with trainRatio 0.8 and parallelism 8",
      "CrossValidator with numFolds 5, so each setting is judged on the average of five validation folds",
      "TrainValidationSplit run once per seed, keeping the best single score",
      "No tuner, since the grid is small enough to judge by eye"
    ],
    correct:1,
    explain:`Small data, seed-dependent winners and an affordable grid are the CrossValidator signals: averaging five folds gives a stable choice for a high-stakes decision. Option A is faster, but it still judges each setting on one small validation slice, which is exactly what made the winner flip.` },

  /* Ch 06 - Evaluating Spark ML Models (1.5) */
  { ref:{chapter:6}, q:`Fernway's van-loading model predicts the number of crates per route. Operations says a few large under-predictions are far costlier than many small misses, because a short van means a second trip. The team is setting up a RegressionEvaluator for tuning. Which metric should it use?`,
    opts:[
      "rmse, because squaring errors penalizes large misses more heavily",
      "mae, because it is easier to explain to operations",
      "r2, because it shows the share of variance explained",
      "areaUnderROC, because it ranks routes by risk"
    ],
    correct:0,
    explain:`RMSE squares each error before averaging, so a few big misses dominate it, matching the stated cost. MAE weights every crate of error equally, which would let the model trade a few large misses for many small gains, the opposite of what operations wants.` },

  /* Ch 07 - Batch and Streaming Scoring (1.6), with Ch 03 (VectorSizeHint) */
  { ref:{chapter:7}, q:`Fernway moves its fitted fraud PipelineModel from a nightly batch job to a Structured Streaming query over order events. One input is an array-based vector column of basket embeddings. The streaming query fails when VectorAssembler cannot determine the size of that column. What is the correct fix?`,
    opts:[
      "Fit the pipeline on each micro-batch inside foreachBatch",
      "Convert the stream to pandas in each micro-batch and score with scikit-learn",
      "Load the model by version number instead of by alias",
      "Add a VectorSizeHint stage for the embedding column before VectorAssembler, refit offline, and register the new pipeline"
    ],
    correct:3,
    explain:`In a streaming DataFrame a vector column's size cannot be inferred before data arrives, so VectorSizeHint declares it for VectorAssembler; the pipeline is refit offline and the stream only transforms. Option A is the classic trap: estimators cannot learn from a stream, and per-batch refitting would also change the learned mappings from batch to batch.` },

  /* Ch 08 - Spark ML vs Single-Node Models for Inference (1.7) */
  { ref:{chapter:8}, q:`Fernway's substitution model suggests a replacement item while a picker is scanning a shelf, and the handheld app needs an answer in about 50 milliseconds per scan. A prototype is a Spark ML RandomForestClassifier trained on 3 million rows that fit comfortably on one node. What should the team deploy?`,
    opts:[
      "The Spark ML model in a streaming query that scores scan events every few seconds",
      "The Spark ML model wrapped as pyfunc on a serving endpoint",
      "A single-node model such as scikit-learn or XGBoost, trained on the same data and served on a Model Serving endpoint",
      "A nightly batch job that pre-scores every item pair in every store"
    ],
    correct:2,
    explain:`Per-request, millisecond inference points to a single-node model behind Model Serving, and the training data already fits on one node. Option B looks convenient because pyfunc can wrap Spark models, but that wrapper scores by starting a SparkContext and building a DataFrame, which is the wrong cost for each scan.` }
];

    49:["lesson-49-scaling-high-traffic-endpoints.html", "Scaling a High-Traffic Endpoint: Scale-Out and Route Optimization"],
    50:["lesson-50-registering-custom-pyfunc-models.html", "Registering Custom PyFunc Models and Artifacts in Unity Catalog"],
    51:["lesson-51-deploying-custom-models.html", "Deploying Custom Models: Deployments SDK vs REST API vs UI"],
    52:["lesson-52-querying-served-models.html", "Querying Served Models: REST API vs MLflow Deployments SDK"]
  }
};
/* ===== EXAM PAYLOAD - END ===== */
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
