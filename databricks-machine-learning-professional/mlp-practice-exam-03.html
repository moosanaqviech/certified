const E = {
  name: "Practice Exam 3",
  badge: "Databricks ML Professional",
  blurb: "Scenario-based questions across Unit 3, Advanced MLflow and Feature Store. Pick the single best answer.",
  coverage: "Covers Unit 3: all 8 chapters, one question per chapter.",

const QUESTIONS = [

  /* Ch 17 - Nested Runs (1.15) */
  { ref:{chapter:17}, q:`Fernway's basket-value team runs a grid of 24 hyperparameter settings, each scored with 5-fold cross-validation, and then trains the best setting on all training data for a final test evaluation. They want to compare settings easily in the MLflow UI and see which search produced the final model. How should they structure their runs?`,
    opts:[
      "One parent run for the search, a nested child run per setting that logs its aggregated CV metrics, and a final evaluation run for the best setting nested under the same parent",
      "One run per fold per setting, all at the top level, tagged with the setting number",
      "One parent run per fold, each with a child run for the setting that won that fold",
      "A single run that logs all 120 fold scores as separate metrics"
    ],
    correct:0,
    explain:`A parent for the search with one child per setting puts the comparison at the right level, and nesting the final evaluation under the same parent records which search chose it. Option B keeps everything searchable by tag, but it produces 120 flat runs with no hierarchy and no structural link from the final model to its search.` },

  /* Ch 18 - Logging custom metrics, params and artifacts (1.16) */
  { ref:{chapter:18}, q:`Fernway's ETA runs use XGBoost autologging. Operations also wants each run to record the on-time-promise rate as a comparable number, a residual plot by region, and the feature snapshot version that trained the model, searchable across runs. Which set of calls adds these?`,
    opts:[
      "mlflow.log_param for the on-time rate, mlflow.log_artifact for the snapshot version, and mlflow.log_metric for the plot",
      "mlflow.log_dict for all three, in one JSON file",
      "mlflow.log_metric for the on-time rate, mlflow.log_figure for the residual plot, and mlflow.set_tag for the snapshot version",
      "Nothing extra: autologging records business metrics and plots for XGBoost"
    ],
    correct:2,
    explain:`A comparable number is a metric, a plot is a figure artifact, and a searchable label about the run is a tag. Option B keeps all the information, but a JSON artifact cannot be sorted or charted like a metric or filtered like a tag, so runs could not be compared on the on-time rate.` },

  /* Ch 19 - Custom PyFunc with real-time feature engineering (1.17) */
  { ref:{chapter:19}, q:`Fernway's delivery-window model needs two features built from each raw request: the hour of day in the store's time zone and the distance from store to address, using a store-coordinates table. A previous launch failed because the app computed the hour in UTC. Which deployment prevents a repeat?`,
    opts:[
      "Deploy the model alone and publish a specification of the feature formulas for the app team",
      "Log a custom PyFunc that loads the model and store table in load_context and computes both features with the training code inside predict",
      "Precompute both features nightly for every store and address pair",
      "Deploy the model alone and require the app to send the features in UTC"
    ],
    correct:1,
    explain:`Shipping the feature code inside the model makes training and serving run one implementation, and load_context loads the artifacts once rather than per request. Option A documents the formulas, but a second implementation in the app is precisely how the time-zone bug happened.` },

  /* Ch 20 - Point-in-time lookups (1.18) */
  { ref:{chapter:20}, q:`Fernway's churn model reaches AUC 0.95 offline but 0.70 in production. Training joins each label to the customer feature table on customer_id, and that table is overwritten nightly with current values. Which change fixes the root cause?`,
    opts:[
      "Train on a smaller, more recent sample of labels",
      "Read the feature table with Delta time travel as of the training run date",
      "Add more features to compensate for the gap",
      "Keep feature history in a time series feature table and set timestamp_lookup_key to each label's timestamp on the FeatureLookup"
    ],
    correct:3,
    explain:`Joining labels to current values leaks information from after each label; a point-in-time lookup returns the latest value at or before each label's own timestamp. Option B sounds time-aware, but it pins one table version for every row, so old labels still see values recorded long after them.` },

  /* Ch 21 - Automating feature computation (1.19) */
  { ref:{chapter:21}, q:`Three Fernway teams compute "orders in the last 30 days" differently in their own notebooks. The platform team will create one shared feature table and a nightly job that recomputes features only for customers who ordered that day. Which approach keeps every other customer's values intact?`,
    opts:[
      "Recreate the table with fe.create_table every night",
      "Overwrite the table with the day's DataFrame using saveAsTable",
      "fe.write_table with mode=\"merge\", which updates matching keys and leaves other rows unchanged",
      "Write each day's rows to a new table and point models at the latest one"
    ],
    correct:2,
    explain:`A merge updates rows whose primary key appears in the new DataFrame and leaves the rest as they are, so partial nightly refreshes are safe. Option B writes the right rows but replaces the whole table, wiping every customer who did not order that day.` },

  /* Ch 22 - Online Feature Stores (1.20) */
  { ref:{chapter:22}, q:`Fernway's fraud endpoint needs customer features in milliseconds at checkout. The offline feature table is refreshed by a nightly job and has a non-null primary key. A teammate suggests creating an online table with the Databricks SDK, as an older tutorial shows. What should the team do?`,
    opts:[
      "Enable Change Data Feed, create a Databricks Online Feature Store, and publish the table in TRIGGERED mode after the nightly job",
      "Follow the tutorial and create a legacy online table",
      "Point the endpoint at the offline Delta table through a SQL warehouse",
      "Publish in CONTINUOUS mode, because online stores only support streaming"
    ],
    correct:0,
    explain:`Online Feature Stores, powered by Lakebase, replace the deprecated online tables, and TRIGGERED publishing fits a nightly refresh once Change Data Feed is on. Option B follows the guide-era approach, but legacy online tables are deprecated and were no longer accessible after January 15, 2026.` },

  /* Ch 23 - Streaming ingestion for real-time features (1.21), with Ch 22 */
  { ref:{chapter:23}, q:`During card-testing attacks, Fernway's "failed payments per card in the last hour" feature must reflect attempts from seconds ago at the checkout endpoint. Today it is computed by the nightly job. Which design meets the requirement?`,
    opts:[
      "Run the nightly job every 15 minutes and publish in SNAPSHOT mode each time",
      "Compute the count inside the model's predict function from the request",
      "Lower the online store capacity to reduce latency",
      "A Structured Streaming aggregation written with fe.write_table, and the table published to the online store in CONTINUOUS mode"
    ],
    correct:3,
    explain:`Passing a streaming DataFrame to write_table keeps the offline table current, and CONTINUOUS publishing streams each change to the online store. Option B fails because a single request carries one attempt, not the card's recent history; option A still lags by up to 15 minutes and recopies the table each time.` },

  /* Ch 24 - On-demand features and feature serving (1.22) */
  { ref:{chapter:24}, q:`A Fernway partner app needs, for a given customer and cart, the customer's average basket total and the ratio of the current cart total to that average. It needs feature values only, not a prediction, and the ratio must match how the fraud model computes it. What should the team deploy?`,
    opts:[
      "The fraud model's endpoint, parsing features from its output",
      "A Feature Serving endpoint built from a FeatureSpec containing the FeatureLookup and the same Unity Catalog UDF as a FeatureFunction",
      "A nightly export of the ratio for every customer and cart",
      "A copy of the ratio code inside the partner app"
    ],
    correct:1,
    explain:`Feature Serving returns feature values from published tables with on-demand functions applied, and reusing the model's UC UDF keeps the ratio identical. Option A is tempting because the model computes the same features, but a model endpoint returns predictions, not its internal feature values.` }
];

    49:["lesson-49-scaling-high-traffic-endpoints.html", "Scaling a High-Traffic Endpoint: Scale-Out and Route Optimization"],
    50:["lesson-50-registering-custom-pyfunc-models.html", "Registering Custom PyFunc Models and Artifacts in Unity Catalog"],
    51:["lesson-51-deploying-custom-models.html", "Deploying Custom Models: Deployments SDK vs REST API vs UI"],
    52:["lesson-52-querying-served-models.html", "Querying Served Models: REST API vs MLflow Deployments SDK"]
  }
};
/* ===== EXAM PAYLOAD - END ===== */
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
