<script>
/* =====================================================================

   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.

/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Practice Exam 7",
  badge: "Databricks ML Professional",
  blurb: "Full-length mock. Exam-style, scenario-based questions across all six units, set at a bank and an insurer. Pick the single best answer. Databricks publishes no official passing score; 70% is our practice target, and 85% or more is a strong readiness signal.",
  coverage: "Full-length mock exam: 59 questions in 120 minutes across all six units, weighted like the real exam (Model Development 44%, MLOps 44%, Model Deployment 12%).",
  minutes: 120,
  pass: 70
};

const QUESTIONS = [

  /* Q1 - Ch 1 */
  { ref:{chapter:1}, q:`Granite Trust Bank wants a credit-default model trained on 900 million loan-month rows (about 4 TB) stored in Delta. The features are numeric and categorical, and a tree ensemble or logistic regression is acceptable. A data scientist proposes converting the data to pandas on the driver and using scikit-learn. What should the team do instead?`,
    opts:[
      "Train with Spark ML estimators on the cluster, since the data is far larger than a single node can hold",
      "Sample 1% of the rows to pandas, train with scikit-learn, and accept the lost data",
      "Upgrade the driver to the largest instance and keep the pandas plan",
      "Export the table to CSV files and train locally in batches"
    ],
    correct:0,
    explain:`At terabyte scale with supported model families, Spark ML trains where the data lives, across the cluster. A bigger driver is tempting, but no single node comfortably holds 4 TB, and the plan still serializes all data through one machine.` },

  /* Q2 - Ch 2 */
  { ref:{chapter:2}, q:`Ashby Mutual's claims team builds a Spark ML workflow: index the claim_type column, one-hot encode it, assemble features, and fit a GBTClassifier. Scoring jobs must apply exactly the same transformations that training used. How should they structure the code?`,
    opts:[
      "Fit each stage separately and rebuild the transformations by hand in the scoring job",
      "Put all four stages in one Pipeline, fit it on training data, and save and reuse the resulting PipelineModel for scoring",
      "Fit the indexer on the scoring data each time so new claim types are captured",
      "Save only the GBT model and re-run the feature code in the scoring notebook"
    ],
    correct:1,
    explain:`A fitted PipelineModel carries every fitted stage, so scoring applies the same index mapping and encoding as training. Refitting the indexer on scoring data looks adaptive, but it produces a different label-to-index mapping than the model was trained on.` },

  /* Q3 - Ch 3 */
  { ref:{chapter:3}, q:`Granite Trust's fraud pipeline indexes merchant_category with StringIndexer. Nightly scoring fails whenever a category appears that was not in the training data. The team wants scoring to continue and treat unseen categories as their own bucket. What should they change?`,
    opts:[
      "Drop OneHotEncoder so the raw index is used",
      "Set handleInvalid=\"keep\" on the StringIndexer before fitting the pipeline",
      "Re-fit the whole pipeline on each night's data before scoring",
      "Filter out every row with an unseen category during scoring"
    ],
    correct:1,
    explain:`With handleInvalid set to keep, unseen labels get an extra index instead of raising an error, so scoring continues. Filtering rows avoids the error too, but silently drops transactions that still need a fraud score.` },

  /* Q4 - Ch 4 */
  { ref:{chapter:4}, q:`Ashby Mutual needs to predict the dollar amount of each new claim from about 30 numeric and encoded features on 200 million rows, and wants to capture non-linear interactions. Which Spark ML estimator fits best?`,
    opts:[
      "GBTRegressor",
      "LogisticRegression",
      "ALS",
      "KMeans"
    ],
    correct:0,
    explain:`Claim amount is a continuous target, and gradient-boosted trees capture non-linear interactions at scale. LogisticRegression is a natural pick for tabular data, but it is a classifier and cannot predict a dollar amount.` },

  /* Q5 - Ch 4 */
  { ref:{chapter:4}, q:`Granite Trust wants to recommend financial products to 20 million customers from an implicit-feedback table of customer and product interactions (views and applications), with no other features. Which Spark ML estimator is designed for this?`,
    opts:[
      "RandomForestClassifier on one-hot product IDs",
      "LinearRegression on interaction counts",
      "ALS with implicitPrefs set to true",
      "BisectingKMeans on customer IDs"
    ],
    correct:2,
    explain:`ALS factorizes the user and item interaction matrix, and implicitPrefs handles views and applications as implicit feedback. A random forest on one-hot product IDs is possible in principle, but it explodes the feature space and does not learn latent preferences.` },

  /* Q6 - Ch 5 */
  { ref:{chapter:5}, q:`Granite Trust tunes a logistic regression over 12 parameter combinations on 2 billion rows. A 3-fold CrossValidator run takes most of a day, and the data is large enough that one held-out split gives a stable estimate. How should they cut tuning time?`,
    opts:[
      "Switch to TrainValidationSplit with a single train and validation split",
      "Increase numFolds to 10 for a more stable estimate",
      "Remove the evaluator so the tuner trains faster",
      "Tune on the driver with scikit-learn's GridSearchCV"
    ],
    correct:0,
    explain:`TrainValidationSplit fits each combination once instead of k times, and with billions of rows one split is reliable. More folds would make the estimate slightly steadier, but it multiplies the training cost the team is trying to cut.` },

  /* Q7 - Ch 6 */
  { ref:{chapter:6}, q:`Ashby Mutual's binary model flags likely-fraudulent claims, and only 0.5% of claims are fraudulent. The team wants an evaluator metric that reflects performance on the rare positive class rather than being dominated by the many negatives. Which setting fits?`,
    opts:[
      "MulticlassClassificationEvaluator with metricName=\"accuracy\"",
      "RegressionEvaluator with metricName=\"rmse\"",
      "BinaryClassificationEvaluator with metricName=\"areaUnderPR\"",
      "BinaryClassificationEvaluator with its default metric and no other change"
    ],
    correct:2,
    explain:`Area under the precision-recall curve focuses on how well the positive class is found and is more informative under heavy imbalance. Accuracy looks high here even for a model that never flags fraud, because 99.5% of claims are negative.` },

  /* Q8 - Ch 7 */
  { ref:{chapter:7}, q:`Granite Trust has a fitted PipelineModel for transaction risk. New transactions arrive continuously in a Delta table, and risk scores must be appended to an output table within a minute. What is the most direct way to score them?`,
    opts:[
      "Collect new rows to the driver every minute and call predict row by row",
      "Re-fit the pipeline every minute on the newest rows",
      "Read the Delta table with readStream, apply PipelineModel.transform, and write the result with writeStream",
      "Export the model to ONNX and score in a separate service"
    ],
    correct:2,
    explain:`A fitted PipelineModel applies to a streaming DataFrame just as to a batch one, so Structured Streaming scores rows as they arrive. Collecting rows to the driver works for tiny volumes, but it gives up parallelism and does not scale with transaction volume.` },

  /* Q9 - Ch 8 */
  { ref:{chapter:8}, q:`Ashby Mutual's quote-pricing model has 40 features, trains on 2 GB of data, and must answer single quote requests in under 50 ms from a web app. A colleague wants to train and serve it as a Spark ML PipelineModel. What should the team weigh most?`,
    opts:[
      "Spark ML is required for any model served on Databricks",
      "Spark ML always gives better accuracy than single-node libraries",
      "Low latency requires training with CrossValidator on Spark",
      "A single-node model (for example scikit-learn) fits this data size and avoids Spark's per-request overhead for low-latency serving"
    ],
    correct:3,
    explain:`The data fits on one node and the workload is single low-latency requests, which is where a single-node model is simpler and faster to serve. Spark ML adds value when data outgrows one machine, but serving a Spark ML model carries SparkContext overhead that buys nothing here.` },

  /* Q10 - Ch 9 */
  { ref:{chapter:9}, q:`Granite Trust has a trained scikit-learn churn model and wants to score 500 million customer rows in a Spark DataFrame. Loading the model per row is slow. Which approach scores in parallel while loading the model once per batch iterator?`,
    opts:[
      "A row-at-a-time Python UDF that unpickles the model inside the function",
      "Collect the DataFrame to the driver and call model.predict once",
      "Retrain the model with Spark ML before scoring",
      "An iterator-of-Series pandas UDF that loads the model once and then predicts on each batch"
    ],
    correct:3,
    explain:`An iterator pandas UDF runs setup code once per executor task, then predicts on vectorized batches across the cluster. A row-at-a-time UDF parallelizes too, but loading and calling the model per row is exactly the slowness the team wants to remove.` },

  /* Q11 - Ch 10 */
  { ref:{chapter:10}, q:`Ashby Mutual wants a separate claim-frequency model for each of 3,000 regions, trained in parallel, with each region's model and metrics recorded in MLflow. How should they implement this?`,
    opts:[
      "groupBy(\"region\").applyInPandas with a function that trains one model per group and logs it to an MLflow child run",
      "A driver-side for loop that filters each region and trains sequentially",
      "One global Spark ML model with region as a feature",
      "A pandas UDF over the whole table that returns a single model"
    ],
    correct:0,
    explain:`applyInPandas hands each region's rows to a Python function in parallel, and logging inside it gives one run per region. A driver loop produces the same models, but sequentially, so 3,000 trainings take far longer.` },

  /* Q12 - Ch 11 */
  { ref:{chapter:11}, q:`Granite Trust has one forecasting model per branch (1,200 branches) registered in MLflow and must score each branch's daily data. A first attempt loads the right model inside a per-row function and is very slow. What is the better design?`,
    opts:[
      "Group by branch and use applyInPandas so each group loads its branch's model once and scores all its rows",
      "Load all 1,200 models on the driver and broadcast them inside a row UDF",
      "Merge all branches into one model at scoring time",
      "Score each branch in a separate job, one after another"
    ],
    correct:0,
    explain:`Grouping by branch means each model is loaded once per group and applied to a whole pandas DataFrame. Broadcasting every model avoids repeated loads, but shipping 1,200 models to every executor wastes memory when each task needs only one.` },

  /* Q13 - Ch 12 */
  { ref:{chapter:12}, q:`Granite Trust wants to run an Optuna hyperparameter search with trials distributed across a Spark cluster and every trial recorded in MLflow, so the study can be inspected and resumed. Which setup fits?`,
    opts:[
      "An in-memory Optuna study on the driver with a plain MLflow callback",
      "Hyperopt with SparkTrials",
      "MlflowStorage as the study's storage with MlflowSparkStudy to distribute the trials",
      "A Python thread pool on the driver running trials in parallel"
    ],
    correct:2,
    explain:`MlflowStorage persists the study in MLflow and MlflowSparkStudy runs trials across Spark workers. An in-memory study with a callback logs results, but trials stay on the driver and the study cannot be resumed from storage.` },

  /* Q14 - Ch 12 */
  { ref:{chapter:12}, q:`An Ashby Mutual Optuna study backed by MlflowStorage was interrupted after 60 of 200 trials when a cluster was terminated. What is the advantage of this setup now?`,
    opts:[
      "The study restarts automatically from trial 1 when the cluster comes back",
      "All 60 completed trials are lost, but their models remain in the registry",
      "The study must be rebuilt as a CrossValidator",
      "The study state lives in MLflow, so it can be loaded and resumed with the remaining trials instead of starting over"
    ],
    correct:3,
    explain:`Because MlflowStorage keeps the study in MLflow, completed trials survive cluster loss and the search continues from where it stopped. Restarting from trial 1 would be the outcome of in-memory storage, which is what MlflowStorage avoids.` },

  /* Q15 - Ch 13 */
  { ref:{chapter:13}, q:`Ashby Mutual's data scientists want Ray Tune for a PyTorch tuning job on a Databricks cluster, with results tracked in MLflow. What is the first step on the cluster?`,
    opts:[
      "Install Ray only on the driver and run Ray Tune locally",
      "Start a Ray cluster on the Spark cluster with setup_ray_cluster, then run Ray Tune and log trials to MLflow",
      "Convert the PyTorch model to Spark ML before tuning",
      "Use CrossValidator with a PyTorch estimator"
    ],
    correct:1,
    explain:`Ray on Databricks starts Ray worker processes on the Spark cluster with setup_ray_cluster, and Ray Tune then spreads trials across them. Running Ray only on the driver works, but it tunes on one machine and ignores the workers.` },

  /* Q16 - Ch 14 */
  { ref:{chapter:14}, q:`Granite Trust's single-node XGBoost training on 30 GB of data runs out of memory on a 64 GB machine because of feature engineering overhead. The code depends on single-node libraries, and rewriting it is not planned this quarter. What is the quickest fix?`,
    opts:[
      "Scale horizontally by adding ten worker nodes to the cluster",
      "Switch to Spark ML gradient-boosted trees",
      "Sample the data down to 5 GB",
      "Scale vertically to a node with more memory"
    ],
    correct:3,
    explain:`Single-node code cannot use extra workers, so a larger machine is the fastest fix when no rewrite is planned. Adding workers is the long-term path for distributed code, but this code would still run on one node.` },

  /* Q17 - Ch 15 */
  { ref:{chapter:15}, q:`Ashby Mutual fine-tunes a document model that fits comfortably in one GPU's memory, and training is slow because the dataset is huge. They have eight GPUs. Which form of parallelism fits?`,
    opts:[
      "Model parallelism: split the model's layers across the eight GPUs",
      "Data parallelism: each GPU holds a full copy of the model and processes different batches",
      "No parallelism; use a single larger GPU",
      "Run eight separate trainings with different seeds"
    ],
    correct:1,
    explain:`When the model fits on one device and the bottleneck is data volume, replicating the model and splitting batches speeds up training. Model parallelism is for models too large for one device; here it adds communication overhead with no benefit.` },

  /* Q18 - Ch 16 */
  { ref:{chapter:16}, q:`Granite Trust needs to clean and join 5 TB of transaction logs into training features, then run a reinforcement-learning simulation that needs fine-grained, Python-native task scheduling across many workers. Which split of tools fits?`,
    opts:[
      "Ray for both the data preparation and the simulation",
      "Spark for both, using Spark ML for the reinforcement learning",
      "pandas on the driver for preparation, Spark for the simulation",

/* =====================================================================

const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
