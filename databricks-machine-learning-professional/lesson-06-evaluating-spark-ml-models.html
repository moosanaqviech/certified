<script>
/* ============================================================
   ▼▼▼  LESSON PAYLOAD — BEGIN  ▼▼▼
   Unit 1 · Spark ML · Chapter 6 · Evaluating Spark ML Models: Evaluators
   and Metrics. Objective 1.5.
   Shape: cover, case file, three evaluators (step build), regression
   metrics, binary metrics, multiclass metrics, match the metric to the
   decision (step build), quiz, evaluate honestly, quiz, decision (last).
   Sources (fetched 15 Nov 2026): exam guide PDF (30 Sep 2025); Spark 4.3
   ML tuning guide (evaluator per problem type, BinaryClassification
   default areaUnderROC, setMetricName); Spark ScalaDoc for
   RegressionEvaluator (rmse default; mse, r2, mae, var) and
   MulticlassClassificationEvaluator (f1 default; accuracy, weighted
   metrics, per-label metrics, logLoss, hammingLoss).
   ============================================================ */

/* ----------  NAV  ---------- */
const NAV = {
  catalog:   "index.html",
  next:      "lesson-07-batch-and-streaming-scoring.html",
  nextLabel: "Next chapter"
};

/* ----------  ART  ---------- */
const A = {
  cover: `<svg viewBox="0 0 320 200">
    <defs>
      <radialGradient id="m06r" cx="0.5" cy="0.5" r="0.6">
        <stop offset="0" style="stop-color:rgba(242,137,105,0.22)"/>

      </radialGradient>
    </defs>
    <style>
      .m06n { animation: m06swing 5s ease-in-out infinite; transform-origin: 160px 132px; }
      @keyframes m06swing { 0%, 100% { transform: rotate(-58deg); } 50% { transform: rotate(48deg); } }
      @media (prefers-reduced-motion: reduce) { .m06n { animation: none; transform: rotate(20deg); } }
    </style>
    <ellipse cx="160" cy="100" rx="156" ry="94" fill="url(#m06r)"/>
    <g font-family="Hanken Grotesk" font-weight="700" font-size="9">
      <path d="M80 132 A80 80 0 0 1 240 132" fill="none" stroke="var(--line)" stroke-width="12" stroke-linecap="round"/>

      <g class="m06n"><line x1="160" y1="132" x2="160" y2="64" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/></g>
      <circle cx="160" cy="132" r="7" fill="var(--accent)"/>
      <text x="62" y="152" fill="var(--cool)">rmse</text><text x="140" y="44" fill="var(--cool)">areaUnderPR</text><text x="234" y="152" fill="var(--cool)">logLoss</text>
      <text x="160" y="22" text-anchor="middle" fill="var(--ink)" font-size="11">The metric is the decision, written as a number</text>
      <text x="160" y="184" text-anchor="middle" fill="var(--ink-soft)" font-size="9.5" font-weight="500">Pick the evaluator for the problem, then the metric for the cost.</text>
    </g>

  done: `<svg viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="38" fill="none" stroke="var(--accent)" stroke-width="3"/>

};

/* ----------  CARDS  ---------- */
const cards = [

  /* 0: cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.3"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 1 · Spark ML · Chapter 6</div>
    <h1 class="reveal" style="font-size:32px">Evaluating Spark ML Models</h1>
    <p class="lead reveal">An evaluator turns predictions into one number, and that number drives tuning, model selection and sign-off. Choosing the wrong metric quietly optimizes the wrong thing.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1: case file */
  { html: `
    <div class="eyebrow reveal">Case file · Fernway Market</div>
    <h2 class="reveal" style="font-size:25px">Three models, three sign-offs</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>Checkout fraud</b>About 1 order in 400 is fraudulent. Analysts review the highest-scored orders each morning.</p></div>
      <div class="pill"><p><b>Basket value</b>Finance cares most about big misses, because a large under-forecast leaves vans short.</p></div>
      <div class="pill"><p><b>Substitution reason</b>Three classes; the score's confidence will trigger automatic refunds.</p></div>
      <div class="pill"><p><b>The decision</b>Which evaluator and metric should each model be judged on?</p></div>
    </div>` },

  /* 2: three evaluators, step build */
  { steps: 3,
    html: `
    <div class="eyebrow reveal">Pick the evaluator</div>
    <h2 class="reveal" style="font-size:24px">One per problem type</h2>
    <div class="pills">
      <div class="pill" data-step="1" style="pointer-events:none"><p><b>RegressionEvaluator</b>Continuous targets. Default metric: <code>rmse</code>.</p></div>
      <div class="pill" data-step="2" style="pointer-events:none"><p><b>BinaryClassificationEvaluator</b>Two classes, read from the raw prediction scores. Default metric: <code>areaUnderROC</code>.</p></div>
      <div class="pill" data-step="3" style="pointer-events:none"><p><b>MulticlassClassificationEvaluator</b>Two or more classes, from predicted labels and probabilities. Default metric: <code>f1</code>.</p></div>
    </div>
    <p class="lead" style="margin-top:12px;font-size:14px">Multilabel and ranking evaluators also exist. Change any default with <code>setMetricName</code> or <code>metricName=</code>.</p>` },

  /* 3: regression metrics */
  { html: `
    <div class="eyebrow reveal">Regression metrics</div>
    <h2 class="reveal" style="font-size:25px">rmse, mse, mae, r2, var</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>rmse (default) and mse</b>Squaring the errors punishes big misses heavily. Lower is better.</p></div>
      <div class="pill"><p><b>mae</b>Average absolute error: every dollar of miss counts the same, and outliers pull it less.</p></div>
      <div class="pill"><p><b>r2 and var</b>Share of variance explained, and explained variance. Higher is better; useful for comparing against a baseline.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 4: binary */
  { html: `
    <div class="eyebrow reveal">Binary metrics</div>
    <h2 class="reveal" style="font-size:25px">areaUnderROC vs areaUnderPR</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>areaUnderROC (default)</b>How well the scores rank positives above negatives across all thresholds. With very rare positives it can look excellent while precision at the top is poor.</p></div>
      <div class="pill"><p><b>areaUnderPR</b>Precision against recall. It focuses on the positive class, so it is the sharper choice for rare events such as fraud.</p></div>
      <div class="pill"><p><b>Both are threshold-free</b>They judge the ranking, not a chosen cut-off.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 5: multiclass */
  { html: `

      <div class="pill" data-step="1" style="pointer-events:none"><p><b>Big misses hurt most</b>rmse. Every unit of error hurts equally: mae.</p></div>
      <div class="pill" data-step="2" style="pointer-events:none"><p><b>Rare positives, review the top of the list</b>areaUnderPR rather than areaUnderROC.</p></div>
      <div class="pill" data-step="3" style="pointer-events:none"><p><b>Actions fire on a probability threshold</b>logLoss, because the probability values themselves must be trustworthy, not just the ranking or the label.</p></div>
    </div>` },

  /* 7: quiz 1 */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:18px">Fernway's fraud model flags about 1 order in 400 as fraud, and analysts review only the top-scored orders. Model A has areaUnderROC 0.97, but analysts find few real fraud cases at the top of its list. Which metric should the team tune and compare on?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span><span>accuracy from MulticlassClassificationEvaluator</span></button>
      <button class="choice" data-correct="false"><span class="key">B</span><span>areaUnderROC, since 0.97 already shows strong ranking</span></button>
      <button class="choice" data-correct="true"><span class="key">C</span><span>areaUnderPR from BinaryClassificationEvaluator</span></button>
      <button class="choice" data-correct="false"><span class="key">D</span><span>rmse from RegressionEvaluator on the fraud score</span></button>
    </div>
    <div class="feedback"><b>Correct.</b> With rare positives, areaUnderPR measures precision where analysts actually look. B is tempting because it is the evaluator's default and the number is high, but ROC rewards ranking the many negatives correctly, which hides poor precision at the top.</div>` },

  /* 8: honest evaluation */
  { html: `
    <div class="eyebrow reveal">Evaluate honestly</div>
    <h2 class="reveal" style="font-size:25px">Where the number comes from</h2>
    <div class="pills reveal">
      <div class="pill"><p><b>Held-out data only</b>Call <code>evaluate</code> on a transformed test set, never on the rows the model was fitted on.</p></div>
      <div class="pill"><p><b>Direction matters</b>rmse and logLoss are better when lower; AUC and f1 when higher. Tuners read the evaluator's <code>isLargerBetter</code>, so the same evaluator object should drive tuning and reporting.</p></div>
      <div class="pill"><p><b>Same columns</b>Point the evaluator at the label and prediction (or raw prediction) columns the model actually wrote.</p></div>
    </div>` },

  /* 9: quiz 2 */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:18px">The substitution-reason classifier's probability will trigger an automatic refund when it exceeds 0.9 for "damaged". Which metric best selects between candidate models?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span><span>logLoss, because refunds depend on the probability values being well calibrated</span></button>
      <button class="choice" data-correct="false"><span class="key">B</span><span>f1, the evaluator's default for multiclass models</span></button>
      <button class="choice" data-correct="false"><span class="key">C</span><span>accuracy, because refunds need correct labels</span></button>
      <button class="choice" data-correct="false"><span class="key">D</span><span>areaUnderROC on each class separately</span></button>
    </div>
    <div class="feedback"><b>Right.</b> A threshold on the probability means the probabilities themselves must be trustworthy, which logLoss measures. B judges predicted labels, so two models with equal F1 can have very different confidence, and that difference is exactly what fires refunds.</div>` },

  /* 10: decision */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="done-badge reveal">${A.done}</div>
    <div class="eyebrow reveal" style="text-align:center">Decision · Fernway Market</div>
    <h2 class="reveal" style="text-align:center;font-size:25px">One metric per cost of error</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:16px;font-size:15px">Fraud is judged on areaUnderPR. Basket value keeps rmse, because big misses strand vans. Substitution reason is selected on logLoss, since its probability triggers refunds.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Evaluator</b>Regression, binary or multiclass: set by the problem.</p></div>
      <div class="pill"><p><b>Metric</b>Set by what a mistake costs, not by the default.</p></div>

    <div class="spacer"></div>` }

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ----------
   v2 adds opt-in, per-card step builds on top of the v1 card engine. A card
   with no `steps` field takes exactly the v1 paths below and renders and
   behaves identically; every v2 branch is guarded by `steps` being present. */
const ENGINE_VERSION = 'v2';
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
const catalogBtn = document.getElementById('catalog');
const footerEl = document.getElementById('footer');
let i = 0;
const answered = {};
const stepState = {};   // v2: current revealed step per card index (mirrors `answered`)

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

/* v2: apply step visibility for one card WITHOUT touching its .in class, so a
   step reveal never replays the card-entrance .reveal stagger. Cumulative for
   normal elements (data-step <= current). Captions append by default: inside
   .stepcaps they accumulate too (data-step="0" is the pre-first-tap caption),
   and captions behind the current step get .step-past (dimmed) while the
   current one stays at full strength. A .stepcap-swap container (or legacy
   .stepcap) opts into swap: only the caption whose data-step equals the
   current step is shown. */
function applySteps(idx) {
  const cur = stepState[idx] || 0;
  els[idx].querySelectorAll('[data-step]').forEach(function(nd) {
    const s = parseInt(nd.getAttribute('data-step'), 10);
    const swapCap = nd.closest && nd.closest('.stepcap-swap, .stepcap');
    const appendCap = !swapCap && nd.closest && nd.closest('.stepcaps');
    const on = swapCap ? (s === cur) : appendCap ? (s <= cur) : (s >= 1 && s <= cur);
    nd.classList.toggle('step-on', on);
    nd.classList.toggle('step-past', !!appendCap && on && s < cur);
  });
}

/* Card layout: the only place that adds/removes .in (and thus replays reveal).
   Called on card change, never on a step advance. */
function layout() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
    applySteps(idx);   // persists built state on revisit
  });
  glow.style.background = cards[i].glow || 'transparent';
}

/* Footer/button state only. Safe to call after a step advance (no reveal). */
function updateFooter() {
  const c = cards[i];
  const end = !!c.last;
  const twoUp = end && !!NAV.next;   // last chapter of a course shows one button
  backBtn.hidden = end;
  backBtn.disabled = (i === 0);
  catalogBtn.hidden = !twoUp;
  footerEl.classList.toggle('end', twoUp);
  const total = c.steps || 0;
  const stepsLeft = total > 0 && (stepState[i] || 0) < total;
  if (stepsLeft) { nextBtn.disabled = false; nextBtn.textContent = (i === 0) ? 'Begin lesson' : 'Continue'; }
  else if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (end) { nextBtn.disabled = false; nextBtn.textContent = NAV.next ? NAV.nextLabel + ' →' : 'Back to catalog'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
}

function render() {
  layout();
  updateFooter();
  if (cards[i].quiz) wireQuiz(els[i], i);
}

/* v2: reveal the next step of the current card. Returns true if a step was
   consumed (so the caller does not also advance the card). */
function advanceStep(idx) {
  const total = cards[idx].steps || 0;
  if (!total) return false;
  const cur = stepState[idx] || 0;
  if (cur >= total) return false;
  stepState[idx] = cur + 1;
  applySteps(idx);
  updateFooter();
  return true;
}

/* v2: reveal every remaining step at once (swipe-left escape hatch). */
function skipSteps(idx) {
  const total = cards[idx].steps || 0;
  if (!total || (stepState[idx] || 0) >= total) return false;
  stepState[idx] = total;
  applySteps(idx);
  updateFooter();
  return true;
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

/* Primary action. On a step card mid-build this reveals the next step; once
   the steps are done (or on a card with none) it advances, honoring the quiz
   gate exactly as v1 did. Shared by the Continue button and ArrowRight. */
function handleNext() {
  if (cards[i].last) { location.href = NAV.next || NAV.catalog; return; }
  if (advanceStep(i)) return;
  go(i + 1);
}
nextBtn.onclick = handleNext;
backBtn.onclick = () => go(i - 1);
catalogBtn.onclick = () => { location.href = NAV.catalog; };

/* v2: tapping anywhere on a step card advances one step; once built, a tap
   advances the card (gate permitting). Cards with no steps ignore taps, so
   this listener is inert on v1-style cards. Elements with their own behavior
   (quiz choices, links) are skipped so a tap never double-fires. */
vp.addEventListener('click', e => {
  const c = cards[i];
  if (!c.steps) return;
  if (e.target.closest('.choice, a')) return;
  if ((stepState[i] || 0) < c.steps) { advanceStep(i); return; }
  if (!nextBtn.disabled && !c.last) go(i + 1);
});

/* Keys and swipes only move between cards (or, for a step card, between
   steps). Leaving the lesson always takes a deliberate tap, so a stray swipe
   on the final card cannot navigate away. ArrowRight mirrors the Continue
   button step-wise; ArrowLeft mirrors Back. */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled && !cards[i].last) handleNext();
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  // Swipe left: skip any remaining steps and advance in one gesture, honoring
  // the quiz gate (updateFooter re-derives nextBtn.disabled after the skip).
  if (dx < -50 && !cards[i].last) { skipSteps(i); if (!nextBtn.disabled) go(i + 1); }
  if (dx > 50 && i > 0) go(i - 1);
});

render();

/* Back to quiz (additive). A "Review: Chapter N" link in a quiz explanation
   opens this lesson with ?back=<quiz path>, plus &tab=1 when it opened in a
   new tab. Only then a small bar above the progress segments offers the way
   back: closing the tab returns to the untouched quiz tab, otherwise it goes
   to the quiz path, which restores the session. No param, no change. */
(function () {
  let back = null, tab = false;
  try {
    const p = new URLSearchParams(location.search), b = p.get('back');
    tab = p.get('tab') === '1';
    if (b && b.charAt(0) === '/' && b.charAt(1) !== '/' && b.charAt(1) !== '\\') {
      const u = new URL(b, location.href);
      if (u.origin === location.origin) back = u.pathname + u.search;
    }
  } catch (e) { return; }
  if (!back) return;
  const bar = document.createElement('div');
  bar.style.cssText = 'position:relative;z-index:7;padding:14px 20px 0;';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = '← Back to quiz';
  btn.style.cssText = 'font:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--surface-2,rgba(255,255,255,0.06));border:1px solid var(--line,rgba(255,255,255,0.1));border-radius:999px;padding:7px 14px;cursor:pointer;';
  btn.onclick = () => {
    if (tab) { try { window.close(); } catch (e) {} setTimeout(() => { location.href = back; }, 300); }
    else location.href = back;
  };
  bar.appendChild(btn);
  const tb = document.getElementById('topbar');
  tb.parentNode.insertBefore(bar, tb);
})();
</script>
</body>
</html>
