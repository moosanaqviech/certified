  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}

/* ===== EXAM PAYLOAD - BEGIN ===== */
const E = {
  name: "Practice Exam 8",
  badge: "Databricks ML Professional",
  blurb: "Full-length mock. Exam-style, scenario-based questions across all six units, set at a clinic network and an energy utility. Pick the single best answer. Databricks publishes no official passing score; 70% is our practice target, and 85% or more is a strong readiness signal.",
  coverage: "Full-length mock exam: 59 questions in 120 minutes across all six units, weighted like the real exam (Model Development 44%, MLOps 44%, Model Deployment 12%).",
  minutes: 120,
  pass: 70
};

const QUESTIONS = [

  /* Q1 - Ch 1 */
  { ref:{chapter:1}, q:`Kestrel Power has 18 months of smart-meter readings at 15-minute intervals for 6 million homes, about 300 billion rows, and wants a linear model of consumption against weather features. The team argues over tools. Which choice fits?`,
    opts:[
      "Spark ML LinearRegression on the cluster, because the data is far beyond single-node memory",
      "scikit-learn on a sample taken to the driver, because Spark ML lacks linear models",
      "Spark ML only for feature engineering, then collect everything to pandas for training",
      "A Spark SQL query that fits the regression with window functions"
    ],
    correct:0,
    explain:`Spark ML includes linear models and trains them across the cluster where the data lives. Collecting to pandas after feature engineering still pushes hundreds of billions of rows through one machine.` },

  /* Q2 - Ch 2 */
  { ref:{chapter:2}, q:`Brightwater Clinics' readmission pipeline has four stages: an Imputer, a StringIndexer, a VectorAssembler and a LogisticRegression. A teammate calls fit on the Pipeline and then tries to call fit again on the result to score new patients. What is the correct mental model?`,
    opts:[
      "Each stage must be fit separately before the Pipeline can transform",
      "PipelineModel.fit retrains on the new data and then scores it",
      "Pipeline.fit returns a PipelineModel, a Transformer; score new data by calling transform on it",
      "Pipelines can only score the data they were fit on"
    ],
    correct:2,
    explain:`Fitting a Pipeline estimator produces a PipelineModel whose stages are all fitted transformers, so new data goes through transform. Fitting again would retrain on the scoring data, which is never the intent at scoring time.` },

  /* Q3 - Ch 3 */
  { ref:{chapter:3}, q:`Kestrel Power assembles 40 sensor features with VectorAssembler, and some readings are null when a sensor drops out. Training fails with an error about null values in the assembler. The team wants to drop such rows during training. What should they set?`,
    opts:[
      "handleInvalid=\"keep\" on a StringIndexer",
      "handleInvalid=\"skip\" on the VectorAssembler",
      "dropLast=False on the OneHotEncoder",
      "maxIter on the estimator"
    ],
    correct:1,
    explain:`VectorAssembler's handleInvalid controls nulls in its inputs, and skip filters out rows with nulls. The StringIndexer setting handles unseen labels in string columns, which is a different problem.` },

  /* Q4 - Ch 4 */
  { ref:{chapter:4}, q:`Brightwater Clinics wants to group 40 million patient visits into a small number of utilization profiles for planning, with no labels available. Which Spark ML estimator fits?`,
    opts:[
      "RandomForestClassifier",
      "KMeans",
      "GBTRegressor",
      "ALS"
    ],
    correct:1,
    explain:`With no labels and a goal of finding groups, clustering with KMeans fits. A random forest needs a labeled target, which the clinics do not have.` },

  /* Q5 - Ch 5 */
  { ref:{chapter:5}, q:`Brightwater Clinics has only 40,000 labeled rows for a rare-condition classifier and wants the most reliable comparison of 8 parameter settings; compute is cheap at this size. Which tuner fits?`,
    opts:[
      "CrossValidator with several folds",
      "TrainValidationSplit with trainRatio 0.75",
      "No tuning, since the data is small",
      "TrainValidationSplit with trainRatio 0.99"
    ],
    correct:0,
    explain:`With little data, averaging over several folds gives a steadier estimate, and the extra fits are cheap. A single split is faster, but its estimate depends heavily on which rows land in validation.` },

  /* Q6 - Ch 5 */
  { ref:{chapter:5}, q:`Kestrel Power runs a CrossValidator over 24 settings on a large cluster, and the Spark UI shows most executors idle while models fit one at a time. Which setting uses the cluster better?`,
    opts:[
      "Lower numFolds to 1",
      "Raise the tuner's parallelism parameter so several models fit at the same time",
      "Increase the estimator's maxIter",
      "Cache the evaluator"
    ],
    correct:1,
    explain:`The parallelism parameter lets the tuner fit multiple settings concurrently, using idle executors. Fewer folds would shorten the run, but it trades away the reliability that CrossValidator exists to provide.` },

  /* Q7 - Ch 6 */
  { ref:{chapter:6}, q:`Kestrel Power forecasts hourly demand per substation. Operations cares about the average size of the error in megawatts, and occasional large misses should not dominate the comparison. Which evaluator setting fits?`,
    opts:[
      "RegressionEvaluator with metricName=\"rmse\"",
      "RegressionEvaluator with metricName=\"mae\"",
      "BinaryClassificationEvaluator with areaUnderROC",
      "MulticlassClassificationEvaluator with f1"
    ],
    correct:1,
    explain:`Mean absolute error weights every megawatt of error equally, so large misses do not dominate. RMSE squares errors and is the right pick when big misses hurt most, which is the opposite of what operations asked for.` },

  /* Q8 - Ch 7 */
  { ref:{chapter:7}, q:`Brightwater Clinics has a fitted PipelineModel for no-show risk and needs to score next week's 2 million appointments every Sunday night, writing results to a Delta table. What is the simplest approach?`,
    opts:[
      "A streaming job that runs all week waiting for appointments",
      "A Model Serving endpoint called once per appointment",
      "A scheduled batch job that loads the PipelineModel, calls transform on the appointments DataFrame and writes the output",
      "Collecting appointments to the driver and scoring with a loop"
    ],
    correct:2,
    explain:`A weekly batch of known rows is a batch scoring job: load, transform, write. An endpoint per appointment works, but it adds millions of network calls for a job with no latency requirement.` },

  /* Q9 - Ch 8 */
  { ref:{chapter:8}, q:`Kestrel Power trained a GBT model with Spark ML on 2 TB of data. Now a field app needs a single prediction per request in under 30 ms, and the team considers whether to keep the Spark ML model for serving. What is the key concern?`,
    opts:[
      "Spark ML models cannot be registered in Unity Catalog",
      "Spark ML models are always less accurate than single-node models",
      "Training data size is irrelevant to the choice of training framework",
      "Serving a Spark ML model brings SparkContext overhead per request, so a low-latency single-request path may favor a single-node model"
    ],
    correct:3,
    explain:`Spark ML is the right tool for training at terabyte scale, but per-request serving pays for Spark's machinery. Claims that Spark ML models cannot be registered are false; the issue is latency, not governance.` },

  /* Q10 - Ch 9 */
  { ref:{chapter:9}, q:`Brightwater Clinics wants to apply a TensorFlow imaging-triage model to 80 million image references stored in a Spark DataFrame. Loading the model takes 20 seconds. Which approach keeps model loading to once per executor task?`,
    opts:[
      "A scalar pandas UDF that loads the model on each call",
      "mapInPandas with the model loaded inside the per-row loop",
      "A Python UDF with the model as a global loaded per row",
      "An iterator pandas UDF that loads the model before looping over batches"
    ],
    correct:3,
    explain:`The iterator form runs setup once and then streams batches through the loaded model. A scalar pandas UDF is vectorized, but loading inside each call repeats the 20-second load for every batch.` },

  /* Q11 - Ch 10 */
  { ref:{chapter:10}, q:`Kestrel Power trains one load-forecast model per substation (4,500 substations) with applyInPandas. The team wants each substation's model and metrics findable in MLflow, grouped under the overall training job. How should logging be structured?`,
    opts:[
      "Log only the final average metric for the whole job",
      "Write each model to a local file on the executor",
      "One parent run for the job, and inside the grouped function a child run per substation that logs its model and metrics",
      "Create one MLflow experiment per substation"
    ],
    correct:2,
    explain:`A parent run with a child run per group keeps 4,500 models organized and searchable. Separate experiments per substation would scatter results across thousands of experiments with no shared view.` },

  /* Q12 - Ch 11 */
  { ref:{chapter:11}, q:`Brightwater Clinics serves a separate length-of-stay model per hospital through one endpoint. The team wants one registered model that routes each request to the right hospital's model. What should they build?`,
    opts:[
      "One endpoint per hospital model, chosen by the caller",
      "A single global model retrained with hospital_id as a feature",
      "A router PyFunc that loads all hospital models in load_context and dispatches each row by hospital_id in predict",
      "A pandas UDF registered as the model"
    ],
    correct:2,
    explain:`A router PyFunc wraps the per-group models and dispatches inside predict, so one registered model serves all hospitals. One endpoint per hospital works, but it multiplies endpoints and pushes routing logic into every caller.` },

  /* Q13 - Ch 12 */
  { ref:{chapter:12}, q:`Kestrel Power wants Optuna trials to run on Spark workers, not just the driver, while results land in MLflow. A teammate wrote a plain Optuna study with an MLflow callback, and all trials run on the driver. What should change?`,
    opts:[
      "Increase the driver size",
      "Run the callback more often",
      "Replace Optuna with CrossValidator",
      "Use MlflowStorage for the study and MlflowSparkStudy to run trials across Spark"
    ],
    correct:3,
    explain:`MlflowSparkStudy distributes trials to Spark workers while MlflowStorage keeps the study in MLflow. A bigger driver speeds each trial slightly, but trials still run one machine at a time.` },

  /* Q14 - Ch 13 */
  { ref:{chapter:13}, q:`Brightwater Clinics wants to tune a PyTorch model with Ray Tune on Databricks, using GPUs on the worker nodes. Which sequence fits?`,
    opts:[
      "Install Ray on a laptop and connect it to the warehouse",
      "Start Ray on the cluster with setup_ray_cluster, run the Tune job across the workers, and log trials to MLflow",
      "Run Ray Tune on the driver only, leaving workers idle",
      "Use applyInPandas to run each trial"
    ],
    correct:1,
    explain:`setup_ray_cluster starts Ray workers on the Spark cluster's nodes so Tune can schedule GPU trials across them. Running on the driver alone ignores the worker GPUs the team paid for.` },

  /* Q15 - Ch 13 */
  { ref:{chapter:13}, q:`After a Ray Tune search on Databricks finishes, Kestrel Power's engineer leaves the notebook attached, and the cluster's Spark jobs stay slow because Ray still holds worker resources. What should the code do at the end?`,
    opts:[
      "Shut down the Ray cluster (for example with shutdown_ray_cluster) so its resources return to Spark",
      "Restart the driver every time",
      "Increase the number of Spark partitions",
      "Disable MLflow logging"
    ],
    correct:0,
    explain:`Ray on Databricks reserves worker resources while running, so shutting it down returns them to Spark. Restarting the driver frees resources too, but it also wipes the notebook state and is a blunt workaround.` },

  /* Q16 - Ch 14 */
  { ref:{chapter:14}, q:`Kestrel Power's Spark ML training on 10 TB scales well, but it is slow on four workers. The code is already distributed. What is the most effective way to speed it up?`,
    opts:[
      "Scale vertically by moving to one very large node",
      "Scale horizontally by adding more workers",
      "Rewrite the job in pandas",
      "Reduce the data to fit one node"
    ],
    correct:1,
    explain:`Distributed Spark ML code speeds up with more workers sharing the partitions. One huge node caps how far the job can grow and cannot hold 10 TB in memory anyway.` },

  /* Q17 - Ch 15 */
  { ref:{chapter:15}, q:`Brightwater Clinics wants to fine-tune a language model whose parameters and optimizer state do not fit in one GPU's memory, even with batch size 1. Which approach fits?`,
    opts:[
      "Pure data parallelism with a full model copy on each GPU",
      "Train on CPU with larger batches",
      "Reduce the dataset size",
      "Model parallelism (or sharded approaches such as FSDP) that splits the model's state across GPUs"
    ],
    correct:3,
    explain:`When the model itself does not fit on one device, its state must be split across devices. Plain data parallelism needs a full copy per GPU, which is exactly what does not fit.` },

  /* Q18 - Ch 16 */
  { ref:{chapter:16}, q:`Kestrel Power's team needs to build features from 8 TB of meter data with joins and aggregations, then train many small Python models with heterogeneous GPU and CPU tasks. Which combination fits?`,
    opts:[
      "Ray alone for everything",
      "Spark ML alone, forcing all models into Spark ML",
      "Spark for the 8 TB feature pipeline and Ray for the heterogeneous Python training tasks",
      "A single node with pandas for both"
    ],
    correct:2,
    explain:`Spark is built for large joins and aggregations, while Ray schedules heterogeneous Python tasks flexibly. Ray can handle data too, but Spark is the stronger engine for terabyte-scale relational work.` },

  /* Q19 - Ch 17 */
  { ref:{chapter:17}, q:`Brightwater Clinics runs a 5-fold cross-validated search over 12 settings, then retrains the best on all data for a final test. They want to see which search produced the final model. How should runs be organized?`,
    opts:[
      "One top-level run per fold per setting",
      "One run that logs all 60 fold scores",
      "A parent run for the search, a child per setting logging aggregated CV metrics, and the final evaluation as another child under the same parent",
      "A separate experiment for the final model"
    ],
    correct:2,
    explain:`Children per setting under one parent, plus the final evaluation in the same tree, link the model to its search. A separate experiment for the final model breaks that link entirely.` },

  /* Q20 - Ch 18 */
  { ref:{chapter:18}, q:`Kestrel Power wants each forecasting run to store a JSON of its holiday calendar and a table of per-region errors as viewable artifacts, without writing temporary files first. Which calls fit?`,
    opts:[
      "mlflow.log_param for both",
      "mlflow.set_tag for both",
      "mlflow.log_metric for both",
      "mlflow.log_dict for the calendar and mlflow.log_table for the per-region errors"
    ],
    correct:3,
    explain:`log_dict writes a dictionary as a JSON artifact and log_table writes tabular data as an artifact, both without manual files. Tags and parameters are short strings meant for labels and inputs, not documents or tables.` },

  /* Q21 - Ch 19 */
  { ref:{chapter:19}, q:`Brightwater Clinics' sepsis model needs, at request time, the hours since admission computed from the admission timestamp and the current time. The model is served as a custom PyFunc. Where should that computation live?`,
    opts:[
      "Inside the PyFunc's predict, using the same function as training",
      "In each calling application",
      "In a nightly batch table",
      "Nowhere; send the raw timestamp to the model"
    ],
    correct:0,
    explain:`Request-time features computed inside the PyFunc use the training logic and the time of the request. A nightly table would be up to a day stale for a feature that changes every hour.` },

  /* Q22 - Ch 20 */
  { ref:{chapter:20}, q:`Kestrel Power's outage model trains on events, each with an event_time, joined to an hourly weather feature table with a timestamp key. They want the most recent weather values no older than 6 hours before each event. Which lookup fits?`,
    opts:[
      "A plain join on the location key only",
      "A FeatureLookup with timestamp_lookup_key set to event_time and a lookback_window of 6 hours",
      "A FeatureLookup without a timestamp key",
      "A join on the exact hour, dropping rows with no match"
    ],
    correct:1,
    explain:`A point-in-time lookup takes the latest value at or before each event, and lookback_window rejects values older than 6 hours. A join on location only takes the latest weather, including readings after the event.` },

  /* Q23 - Ch 21 */
  { ref:{chapter:21}, q:`Brightwater Clinics wants a feature table keyed by patient_id with a daily snapshot_date as its time series column, created through the Feature Engineering client. What should the create call include?`,
    opts:[
      "Only patient_id as the primary key, ignoring the date",
      "No primary key; the client infers one",
      "partition_columns set to patient_id instead of primary keys",
      "primary_keys including patient_id and snapshot_date, with timeseries_columns set to snapshot_date"
    ],
    correct:3,
    explain:`A time series feature table includes the timestamp in its key and declares it as the time series column, which enables point-in-time lookups. Keying on patient_id alone allows only one row per patient, losing the daily history.` },

  /* Q24 - Ch 22 */
  { ref:{chapter:22}, q:`Kestrel Power published a feature table to a Databricks Online Feature Store. Features change once a day after a batch job. Which publish behavior keeps the online copy current at the lowest cost?`,
    opts:[
      "Continuous publishing with a streaming pipeline",
      "Re-creating the online store every day",
      "Triggered publishing after each daily batch update",
      "Reading the offline Delta table at serving time"
    ],
    correct:2,
    explain:`Data that changes once a day only needs syncing after each update, which triggered publishing does. Continuous publishing keeps a stream running all day for changes that arrive once.` },

  /* Q25 - Ch 23 */
  { ref:{chapter:23}, q:`Brightwater Clinics wants a feature counting each patient's vital-sign alarms in the last 30 minutes available to a model within seconds. The source is a stream of alarm events. Which design fits?`,
    opts:[
      "A daily batch aggregation published in triggered mode",
      "Computing the count from the single incoming request",
      "A weekly snapshot table",
      "A Structured Streaming windowed aggregation written with fe.write_table, published continuously to the online store"
    ],
    correct:3,
    explain:`A streaming aggregation with continuous publishing keeps a 30-minute window fresh within seconds. A daily batch would be hours stale for a half-hour window.` },

  /* Q26 - Ch 24 */
  { ref:{chapter:24}, q:`Kestrel Power's model needs the ratio of a request's current load to the meter's 30-day average, where the average is a stored feature and the current load arrives with the request. The ratio must be computed identically in training and serving. What should the team use?`,
    opts:[
      "Compute the ratio in the calling app",
      "Store the ratio in the feature table nightly",
      "An on-demand feature: a Unity Catalog Python UDF included in the training set and model as a FeatureFunction",
      "Compute it in a SQL view over the online store"
    ],
    correct:2,
    explain:`A FeatureFunction runs the same UC function at training and at serving, using the request's value. Storing the ratio nightly cannot work, because the current load is only known at request time.` },

  /* Q27 - Ch 25 */
  { ref:{chapter:25}, q:`In Kestrel Power's production environment, which stage gives a newly trained model version the Challenger alias?`,
    opts:[
      "The training pipeline, as soon as the version is registered",
      "The validation pipeline, after its format, metadata, slice-performance and compliance checks pass",
      "The monitoring pipeline, when drift is detected",
      "The serving endpoint, on first request"
    ],
    correct:1,
    explain:`Validation checks each new version and assigns Challenger on success; deployment then compares Challenger with Champion. Training only registers the version, which has not yet been checked.` },

  /* Q28 - Ch 26 */
  { ref:{chapter:26}, q:`Brightwater Clinics fine-tunes a large medical imaging model once on 64 GPUs over four days and changes it about twice a year. They have one workspace and no CI/CD. Which pattern fits?`,
    opts:[
      "Deploy code with nightly retraining in production",
      "Deploy code, retraining in staging and again in production",
      "Deploy models: train once and promote the trained artifact",
      "Retrain manually in production each month"
    ],
    correct:2,
    explain:`Very expensive, rarely changing training with one workspace and no CI/CD are the deploy-models signals. Deploy code is the general default, but it would repeat a four-day GPU run for the same model.` },

  /* Q29 - Ch 26 */
  { ref:{chapter:26}, q:`Kestrel Power wants deploy-code safety, but its full training run is expensive and should run only once per release, on full production data, before promotion. Which middle ground do Databricks docs describe?`,
    opts:[
      "Deploy code to staging, train there on full production data, then promote the resulting model to prod",
      "Train in dev on a sample and promote the model",
      "Skip staging and train only in prod",
      "Train in both staging and prod on full data"
    ],
    correct:0,
    explain:`The hybrid deploys code to staging, trains once on full data there, and promotes the model. Training in both environments doubles the expensive run the team wants to do once.` },

  /* Q30 - Ch 27 */
  { ref:{chapter:27}, q:`Brightwater Clinics wants its training, validation, deployment and batch inference steps to run in order every week, with retries and alerts on failure. Which Databricks feature covers this?`,
    opts:[
      "Lakeflow Jobs",
      "MLflow Tracking",
      "Models in Unity Catalog",
      "Online Feature Stores"
    ],
    correct:0,
    explain:`Lakeflow Jobs orchestrates multi-task workflows on a schedule with retries and notifications. MLflow Tracking records what each run did, but it does not schedule or chain the steps.` },

  /* Q31 - Ch 28 */
  { ref:{chapter:28}, q:`Kestrel Power still uses Staging and Production stages in a legacy workspace registry and is moving to models in Unity Catalog. How should promotion be expressed after the move?`,
    opts:[
      "The same Staging and Production stages, now in Unity Catalog",
      "Separate catalogs per environment, with aliases such as Champion and Challenger for promotion",
      "Tags only, with no aliases",
      "A new registered model for every version"
    ],
    correct:1,
    explain:`Models in Unity Catalog do not support stages; environments map to catalogs and promotion uses aliases. Carrying stages over is not possible, because the concept does not exist there.` },

  /* Q32 - Ch 29 */
  { ref:{chapter:29}, q:`Brightwater Clinics writes a pytest test for a function that converts lab values to standard units. Which data should the test use?`,
    opts:[
      "A full copy of yesterday's production lab table",
      "Small, hand-built inputs that resemble production, including edge cases such as zero, nulls and unit boundaries",
      "Random values generated without a fixed seed",
      "No data; just check that the function exists"
    ],
    correct:1,
    explain:`Unit tests use small, deterministic, non-production data with edge cases, so failures are fast and specific. A copy of production data is slow, risky, and changes daily, which makes failures hard to reproduce.` },

  /* Q33 - Ch 30 */
  { ref:{chapter:30}, q:`Kestrel Power asks where its integration tests, which run feature engineering, training, inference and monitoring together, should execute. What does the Databricks workflow recommend?`,
    opts:[
      "On developers' laptops before each commit",
      "In production, after deployment",
      "Only in the dev workspace on each data scientist's cluster",
      "In staging, ideally in an environment close to production, before merging and release"
    ],
    correct:3,
    explain:`Integration tests run all pipelines together in staging, ideally close to production, before release. Production is where code arrives already tested; running the suites there is too late.` },

  /* Q34 - Ch 31 */
  { ref:{chapter:31}, q:`Brightwater Clinics' pipeline runs feature engineering, training, evaluation, deployment and batch inference. An engineer changes only the batch inference job's output format. Which integration test stages must rerun at minimum?`,
    opts:[
      "Inference only, since it is the first and only stage the change touches",
      "Every stage, from feature engineering onward",
      "Training and evaluation",
      "Feature engineering and deployment"
    ],
    correct:0,
    explain:`Rerun from the first stage a change touches; inference is last, and no upstream stage reads its output. Rerunning everything is safe but wastes the cluster time selective re-runs exist to save.` },

  /* Q35 - Ch 32 */
  { ref:{chapter:32}, q:`Kestrel Power's pricing analytics team writes Scala notebooks and wants reusable functions with ScalaTest tests. Which layout does Databricks recommend for Scala?`,
    opts:[
      "Functions and tests in Python modules outside notebooks",
      "Functions and tests in Scala files outside notebooks",
      "No unit tests, since Scala is compiled",
      "Functions in one notebook, unit tests in a separate notebook"
    ],
    correct:3,
    explain:`For Scala notebooks, Databricks recommends a functions notebook plus a separate test notebook. The outside-notebook approach is the Python and R recommendation and is not supported for Scala.` },

  /* Q36 - Ch 33 */
  { ref:{chapter:33}, q:`Brightwater Clinics' production scoring jobs run under a data scientist's personal account, and they broke when that person changed roles. What should production jobs use?`,
    opts:[
      "A shared login used by the whole team",
      "The account of the most senior engineer",
      "A service principal identity, with production deployed through the release process",
      "Any personal account, as long as it has admin rights"
    ],
    correct:2,
    explain:`Production pipelines should run as a non-personal service principal so access does not depend on one person. A shared login avoids the single-person problem but removes accountability and is poor security practice.` },

  /* Q37 - Ch 34 */
  { ref:{chapter:34}, q:`Kestrel Power's bundle defines its forecast serving endpoint. The endpoint must use a small workload in dev and a large one in prod, from the same bundle. How should this be expressed?`,
    opts:[
      "Keep two copies of the bundle",
      "Deploy dev settings everywhere and resize prod by hand",
      "Edit databricks.yml before each deploy",
      "Override the endpoint's workload setting in the prod target, or set it from a variable each target defines"
    ],
    correct:3,
    explain:`Targets vary settings per environment while sharing one definition. Two copies of the bundle work at first, but they drift apart, which is the problem bundles solve.` },

  /* Q38 - Ch 35 */
  { ref:{chapter:35}, q:`Kestrel Power's new demand model has no history yet, and the team is unsure how quickly it degrades. Following Databricks guidance, how should they start retraining?`,
    opts:[
      "Retrain only when a human notices problems",
      "Trigger retraining on every refresh of the monitor",
      "Never retrain; retraining risks regressions",
      "Begin with scheduled, periodic retraining, and add monitoring-triggered retraining once they know when the schedule is not enough"
    ],
    correct:3,
    explain:`Databricks recommends starting with scheduled retraining and moving to triggered retraining when needed. Triggering on every refresh ignores whether anything changed and wastes compute.` },

  /* Q39 - Ch 36 */
  { ref:{chapter:36}, q:`Kestrel Power's new load forecast feeds a dispatch plan where a 300 MW miss is far worse than three 100 MW misses. Which metric should decide between challenger and Champion?`,
    opts:[
      "MAE, which weights every megawatt equally",
      "RMSE, which penalizes large errors more heavily",
      "Log loss",
      "AUROC"
    ],
    correct:1,
    explain:`RMSE squares errors, so large misses dominate, matching a plan where big misses are disproportionately costly. MAE is a good default, but it treats one big miss the same as several small ones adding to the same total.` },

  /* Q40 - Ch 37 */
  { ref:{chapter:37}, q:`Brightwater Clinics checks drift on the numeric feature length_of_stay. Which pair of drift metrics table columns gives both a hypothesis test and a size of change?`,
    opts:[
      "ks_test and wasserstein_distance (or population_stability_index)",
      "chi_squared_test and js_distance",
      "tv_distance and l_infinity_distance",
      "count_delta and percent_null_delta"
    ],
    correct:0,
    explain:`For numeric columns, KS is the test and Wasserstein or PSI gives the size. Chi-squared and JS distance apply to categorical columns and are null for numeric ones.` },

  /* Q41 - Ch 38 */
  { ref:{chapter:38}, q:`Kestrel Power wants to monitor its customer_accounts table, which is overwritten nightly, has no timestamp, and is about 50 GB. The team wants null rates and distributions checked against a reference copy. Which profile type fits?`,
    opts:[
      "Time series on a load-time column added for the purpose",
      "Snapshot, with the reference copy as the baseline table",
      "Inference with a dummy prediction column",
      "None; data profiling needs a timestamp"
    ],
    correct:1,
    explain:`Snapshot profiles tables with no time dimension, and a baseline gives the reference. Adding a load-time column to an overwritten table yields one window per night, which adds nothing over a snapshot.` },

  /* Q42 - Ch 38 */
  { ref:{chapter:38}, q:`Brightwater Clinics wants to track how the distribution of an appointments table changes week over week. The table has an appointment_ts column and no model is involved. Which profile type fits?`,
    opts:[
      "Time series on appointment_ts with weekly granularity",
      "Inference with appointment_ts as the timestamp",
      "Snapshot refreshed weekly",
      "Snapshot with a baseline"
    ],
    correct:0,
    explain:`A timestamped table with no model is the time series case, with metrics per window. A weekly snapshot profiles the whole table each time and does not break changes into windows.` },

  /* Q43 - Ch 39 */
  { ref:{chapter:39}, q:`Kestrel Power is writing new monitor creation code. Which API do the current Databricks docs use for data profiling?`,
    opts:[
      "w.quality_monitors.create, the long-term API",
      "The online_tables API",
      "mlflow.evaluate",
      "w.data_quality.create_monitor with a Monitor and DataProfilingConfig"
    ],
    correct:3,
    explain:`The current docs create profiles with the data_quality API; quality_monitors is described as deprecated legacy. New code should not be written against a deprecated API.` },

  /* Q44 - Ch 40 */
  { ref:{chapter:40}, q:`Brightwater Clinics wants to know where the AI Gateway-enabled inference table for its readmission endpoint fits in its monitoring pipeline. What is its role?`,
    opts:[
      "Health: it reports CPU and memory usage",
      "Logging: it records each request and response, which is processed into the table that data profiling monitors",
      "Alerting: it notifies on drift",
      "Training: it replaces the feature table"
    ],
    correct:1,
    explain:`The inference table is the logging layer that feeds drift and quality monitoring. CPU and memory come from endpoint health metrics, which are a separate component.` },

  /* Q45 - Ch 41 */
  { ref:{chapter:41}, q:`Kestrel Power wants an alert the morning after a firmware update suddenly changes how a voltage sensor reports values. Which drift comparison is most direct?`,
    opts:[
      "Baseline drift against training data",
      "Model quality after labels arrive",
      "Consecutive drift at daily granularity",
      "A snapshot profile"
    ],
    correct:2,
    explain:`A step change appears as a large difference between one day and the previous one. Baseline drift also rises, but it mixes the jump with all earlier change and does not pinpoint when it happened.` },

  /* Q46 - Ch 41 */
  { ref:{chapter:41}, q:`Brightwater Clinics configured consecutive drift only. Patient age has risen slowly for a year as a clinic network was acquired, and no alert ever fired. What should they add?`,
    opts:[
      "Hourly granularity",
      "More slicing expressions",
      "A shorter alert schedule",
      "A baseline table so baseline drift is computed against the training data"
    ],
    correct:3,
    explain:`Baseline drift compares each window with a fixed reference, so slow change accumulates into a visible gap. Finer granularity makes each consecutive step even smaller, hiding creep further.` },

  /* Q47 - Ch 42 */
  { ref:{chapter:42}, q:`Kestrel Power wants a drift alert to reach on-call engineers in PagerDuty and also start the retraining job. Which destinations fit?`,
    opts:[
      "A PagerDuty notification destination plus a webhook destination that starts the training job",
      "Email only, since alerts support nothing else",
      "A dashboard refresh",
      "A tag on the drift metrics table"
    ],
    correct:0,
    explain:`SQL alerts support integrations such as PagerDuty and webhooks in addition to email. Email is the default, but it is not the only destination.` },

  /* Q48 - Ch 43 */
  { ref:{chapter:43}, q:`Brightwater Clinics profiled its endpoint's raw payload table directly and sees no quality metrics. What must happen before an inference profile can compute them?`,
    opts:[
      "Enable endpoint health metrics",
      "Increase the monitor's granularity",
      "Unpack predictions and features into columns and join ground-truth labels, then profile the processed table with label and prediction columns set",
      "Switch to a snapshot profile"
    ],
    correct:2,
    explain:`Quality metrics need label and prediction columns, which the raw JSON log does not have. Health metrics describe the endpoint's infrastructure and cannot compute accuracy.` },

  /* Q49 - Ch 43 */
  { ref:{chapter:43}, q:`Kestrel Power's outage labels arrive up to 10 days after each prediction. Their weekly quality chart always shows the most recent week with unusually few labeled rows. How should they interpret and handle this?`,
    opts:[
      "Recent windows are partially labeled; rerun the label join as labels arrive so recent windows fill in, and read them with that lag in mind",
      "The model has broken; roll back immediately",
      "The monitor is misconfigured; delete and recreate it",
      "Drop recent predictions from the table"
    ],
    correct:0,
    explain:`With label delays, recent windows reflect only labeled rows until the labels arrive. Rolling back would react to missing data, not to a real drop in quality.` },

  /* Q50 - Ch 44 */
  { ref:{chapter:44}, q:`Brightwater Clinics wants a custom metric that measures, per window, the share of predictions where the model missed a true readmission. The expression uses both the prediction and label columns. How should it be defined?`,
    opts:[
      "An aggregate custom metric with input_columns=[\":table\"] and a definition using {{prediction_col}} and {{label_col}}",
      "A derived metric reading the primary table",
      "A drift metric with a join to the label table",
      "A per-column aggregate using {{input_column}} only"
    ],
    correct:0,
    explain:`Aggregate metrics read the primary table, and :table lets one expression use several columns. Derived metrics cannot read the primary table, and definitions cannot contain joins.` },

  /* Q51 - Ch 45 */
  { ref:{chapter:45}, q:`Kestrel Power's low-volume model gets about 100 requests a day, and its daily quality chart swings wildly. What is the best adjustment?`,
    opts:[
      "Use five-minute granularity",
      "Add more slicing expressions",
      "Use a coarser granularity such as one week",
      "Remove the baseline table"
    ],
    correct:2,
    explain:`Larger windows hold more rows, so metrics stabilize. More slices split the few rows per window into even smaller groups and make the noise worse.` },

  /* Q52 - Ch 46 */
  { ref:{chapter:46}, q:`After a new version of Brightwater Clinics' triage model went live, 5xx errors jumped while request rate and CPU stayed normal, and memory climbed to its limit before each failure. Where should the team look?`,
    opts:[
      "The server logs, with a rollback or larger compute ready, since the new version's memory footprint exceeds the compute",
      "The callers' payloads, since all errors are client side",
      "The drift metrics table",
      "Add provisioned concurrency to absorb the errors"
    ],
    correct:0,
    explain:`Server errors with flat load and memory at its limit after a deploy point to the new version's footprint. Client-side problems show up as 4xx errors, not 5xx.` },

  /* Q53 - Ch 47 */
  { ref:{chapter:47}, q:`Brightwater Clinics' internal coding-assistant model is used by 60 billing staff, and a new version must replace the old one for everyone on the same day so claim codes stay consistent. Which pattern fits?`,
    opts:[
      "Canary at 5%, raised monthly",
      "Blue-green: bring the new version up beside the old, verify it, switch all traffic at once, and keep the old one ready for rollback",
      "A permanent 50/50 split",
      "Shadow traffic for a quarter"
    ],
    correct:1,
    explain:`Everyone must switch together, and with 60 users a canary would gather little evidence. A slow canary limits risk, but staff would see inconsistent codes for weeks.` },

  /* Q54 - Ch 48 */
  { ref:{chapter:48}, q:`Kestrel Power's endpoint serves versions 3 and 4 of a model at 50/50, and version 4's metrics have held for a week. How does the team complete the rollout?`,
    opts:[
      "Create a new endpoint for version 4 and delete the old one",
      "Move the Champion alias; the endpoint follows automatically",
      "Restart the endpoint",
      "Update the endpoint config so version 4 receives 100% of traffic, or remove version 3's served entity"
    ],
    correct:3,
    explain:`Traffic is controlled by the endpoint config, so a final update sends all traffic to version 4. A new endpoint changes the URL every caller uses and is unnecessary.` },

  /* Q55 - Ch 49 */
  { ref:{chapter:49}, q:`Kestrel Power's model takes about 50 ms per request, and peak traffic is 800 requests a second. Roughly what provisioned concurrency should the endpoint reach at peak?`,
    opts:[
      "About 40, plus headroom, confirmed with a load test",
      "4, the Small workload size",
      "800",
      "0, with scale to zero"
    ],
    correct:0,
    explain:`Concurrency is QPS times execution time: 800 x 0.05 = 40 requests in flight. Setting it to 800 confuses throughput with concurrency and over-provisions twentyfold.` },

  /* Q56 - Ch 49 */
  { ref:{chapter:49}, q:`Brightwater Clinics' patient-portal endpoint is idle at night and must answer the first morning request quickly. A teammate enabled scale to zero to save cost. What is the concern?`,
    opts:[
      "Scale to zero deletes the endpoint after an hour",
      "Scaling to zero adds cold-start latency and capacity is not guaranteed, so it is not recommended for production endpoints",
      "Scale to zero disables the inference table",
      "There is no concern; it only affects billing"
    ],
    correct:1,
    explain:`Databricks advises against scale to zero for production because of cold starts and unguaranteed capacity. It does not delete the endpoint; the cost is latency on the first requests.` },

  /* Q57 - Ch 50 */
  { ref:{chapter:50}, q:`Brightwater Clinics tries to register a custom PyFunc in Unity Catalog and the registration is rejected. The model was logged without a signature. What should they do?`,
    opts:[
      "Register it in a different schema",
      "Add the model to pip_requirements",
      "Log the model again with a signature, for example from infer_signature on sample inputs and outputs, and register it",
      "Register it with a numeric name"
    ],
    correct:2,
    explain:`Signatures are required to register models in Unity Catalog. Changing the schema does not help, because the requirement applies everywhere in Unity Catalog.` },

  /* Q58 - Ch 51 */
  { ref:{chapter:51}, q:`Kestrel Power's release tool is written in shell scripts with curl and has no Python. How should it create and update serving endpoints?`,
    opts:[
      "The MLflow Deployments SDK",
      "The Serving UI with a checklist",
      "The REST API: POST /api/2.0/serving-endpoints to create and PUT /api/2.0/serving-endpoints/{name}/config to update",
      "client.predict"
    ],
    correct:2,
    explain:`Any HTTP tool can call the REST API, so no Python is needed. The Deployments SDK suits Python pipelines but requires Python on the runner.` },

  /* Q59 - Ch 52 */
  { ref:{chapter:52}, q:`Brightwater Clinics' Java scheduling service calls a custom model endpoint. Which request format do the docs recommend for tabular inputs, and where should credentials go?`,
    opts:[
      "dataframe_split in the JSON body, with an OAuth token in the Authorization header",
      "dataframe_records, with the token in the URL",
      "instances, with no authentication",
      "A CSV body, with the token as a form field"
    ],
    correct:0,
    explain:`dataframe_split is the recommended tabular format, and tokens belong in the header. dataframe_records also works, but it does not guarantee column order, and tokens in URLs leak into logs.` }
];

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
