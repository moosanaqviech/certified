<script>
/* =====================================================================

   The only section you edit per exam: the E config object and the

const E = {
  name: "Full Mock 2",
  badge: "AWS Cloud Practitioner (CLF-C02)",
  blurb: "A full-length mock: 50 scenario questions across all four domains at the official weights, 90 minutes. Most questions have one best answer; a few ask you to select two. Pass mark is 70%, our practice target (the real exam reports a scaled score of 700 out of 1,000).",
  coverage: "All four domains, sampled at the official weights: 12 Cloud Concepts, 15 Security and Compliance, 17 Cloud Technology and Services, 6 Billing, Pricing, and Support. Scenarios from healthcare and the public sector, never reused in drills.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

/* Q1 · Ch 01 - The value proposition of the AWS Cloud · Skill 1.1 knowledge */
  {
    ref:{chapter:1},
    q:`A nonprofit that runs an online medical training platform for nurses has signed partnerships with hospitals on three other continents, starting next month. Course videos and quizzes load slowly for those nurses today, and the nonprofit has no staff or budget to open facilities abroad. Which advantage of the AWS Cloud speaks most directly to this situation?`,
    opts:[
      "Stop guessing capacity",
      "Benefit from massive economies of scale",
      "Go global in minutes",
      "Trade fixed expense for variable expense"
    ],
    correct:2,
    explain:`Deploying to multiple AWS Regions with a few clicks, for lower latency and a better experience for users worldwide, is the "go global in minutes" advantage. Stop guessing capacity is the tempting choice because new partners mean more users, but adding the right amount of capacity in one place does not shorten the distance to nurses on other continents.`
  },
  /* Q2 · Ch 02 - Global infrastructure benefits · Skill 1.1.1 */
  {
    ref:{chapter:2},
    q:`A telehealth nonprofit based in North America starts serving patients in a country where the law says patient records must be stored inside that country. The country has an AWS Region, and the nonprofit wants fast responses for patients there without leasing or building any facilities. Which benefit of the AWS global infrastructure applies?`,
    opts:[
      "Global reach: deploy in the Region in that country to choose where data is stored and to lower latency",
      "Elasticity: add capacity in the existing North American Region during busy hours",
      "Economies of scale: lower prices for the existing Region's resources",
      "High availability: spread the workload across Availability Zones in the existing Region"
    ],
    correct:0,
    explain:`Global reach lets a customer run close to distant users and choose which Region holds its data, which meets both the latency need and the data location rule with no facilities to build. Spreading across Availability Zones in the existing Region is tempting because it improves resilience, but those zones are still in North America, so neither the law nor the distance problem is solved.`
  },
  /* Q3 · Ch 03 - High availability, elasticity and agility · Skill 1.1.2 */
  {
    ref:{chapter:3},
    q:`A school district's online learning platform is busy on weekday mornings and nearly idle on weekends and during the summer break. The IT director says the district needs "scalability". What the district actually describes is capacity that grows for the morning rush and shrinks automatically when the platform goes quiet, so it stops paying for idle servers. Which term fits that need best?`,
    opts:[
      "Scalability, because the platform must handle growth by adding resources",
      "Elasticity, because capacity must track demand both up and back down",
      "High availability, because the platform must keep serving when a component fails",
      "Agility, because new resources arrive in minutes instead of weeks"
    ],
    correct:1,
    explain:`Matching capacity to demand as it changes, in both directions, with the shrinking half saving money on idle servers, is elasticity. Scalability is the tempting answer because it is the word the director used, but it only describes how far a system can grow, not how closely capacity follows the load back down.`
  },
  /* Q4 · Ch 04 - The six pillars of the Well-Architected Framework · Skill 1.2.1 */
  {
    ref:{chapter:4},
    q:`A hospital's architecture team reads that the AWS Well-Architected Framework was restructured in November 2026, and a team member claims the pillars were reduced in the process. Which statement correctly describes the change?`,
    opts:[
      "The six pillars were merged into three broader pillars",
      "The sustainability pillar was removed and folded into cost optimization",
      "The framework was replaced by the AWS Cloud Adoption Framework",
      "The pillar whitepapers were merged into one document with a new Cloud Foundations section, and there are still six pillars"
    ],
    correct:3,
    explain:`In November 2026 AWS merged the six pillar whitepapers into a single framework document and added a Cloud Foundations section on accounts, identity and networking, while the pillars stayed the same six. Folding sustainability into cost optimization is the tempting claim because the two pillars overlap, but sustainability is still its own pillar.`
  },
  /* Q5 · Ch 05 - Telling the pillars apart · Skill 1.2.2 */
  {
    ref:{chapter:5},
    q:`A state transportation agency shuts down idle development servers every night. It reports the result to the governor's climate office as a drop in emissions and in resources used per workload, and it sets a target to keep reducing that figure. Which Well-Architected pillar is this goal measured against?`,
    opts:[
      "Sustainability",
      "Cost optimization",
      "Performance efficiency",
      "Reliability"
    ],
    correct:0,
    explain:`Turning off idle servers helps both cost and sustainability, so the scenario's measure decides, and here it is emissions and resources per workload: the sustainability pillar. Cost optimization is the tempting choice because the same action lowers the bill, but the agency is reporting environmental impact, not dollars.`
  },
  /* Q6 · Ch 06 - The AWS Cloud Adoption Framework · Skill 1.3.1 */
  {
    ref:{chapter:6},
    q:`A city government delivered pilot cloud projects for its building permit system in production and showed incremental value to the council. It now wants to expand those pilots to full scale and make the benefits last. Which phase of the AWS Cloud Adoption Framework journey is the city entering?`,
    opts:[
      "Envision",
      "Align",
      "Scale",
      "Launch"
    ],
    correct:2,
    explain:`Expanding pilots to full scale and making the benefits last is the Scale phase. Launch is the tempting answer because the pilots are what the city just finished, but Launch is the phase of delivering those pilots in production, which the city has already done.`
  },
  /* Q7 · Ch 07 - Migration strategies: the 7 Rs · Skill 1.3.2 */
  {
    ref:{chapter:7},
    q:`During a hospital's migration planning, the team reviews its laboratory system. The system was upgraded last year and depends on on-premises hardware connected to the lab analyzers that has no cloud equivalent. The hospital decides to keep it where it is for now and revisit it later. Which migration strategy is this?`,
    opts:[
      "Retire",
      "Retain",
      "Rehost",
      "Relocate"
    ],
    correct:1,
    explain:`A recent upgrade and hardware with no cloud equivalent are retain signals: the application stays where it is for now. Retire is the tempting choice because it also means the system does not move, but retire decommissions an application with no business value, and the lab system is still in daily use.`
  },
  /* Q8 · Ch 08 - Tools for the migration journey · Skill 1.3.2 */
  {
    ref:{chapter:8},
    q:`A county library system is moving its catalog database to AWS. The library can take the catalog offline over a holiday weekend, so it does not need the source and target kept in sync. It wants to copy the data once during that planned window. Which service and approach fit?`,
    opts:[
      "AWS Application Migration Service, replicating the database server at the block level",
      "Migration Evaluator, building a business case for the move",
      "AWS License Manager, tracking the database licenses during the move",
      "AWS Database Migration Service, running a one-time migration during the window"
    ],
    correct:3,
    explain:`AWS DMS moves databases into AWS either once during a planned window or with ongoing replication, and a holiday-weekend outage makes the one-time migration enough. AWS Application Migration Service is the tempting distractor because it also moves workloads with little downtime, but it replicates whole servers for rehosting, not a database's data.`
  },
  /* Q9 · Ch 09 - Fixed vs variable costs · Skills 1.4.1, 1.4.2 · select two */
  {
    ref:{chapter:9},
    q:`A state health agency's finance office wants to move from fixed expense to variable expense by running its workloads on AWS. Which TWO statements describe variable expense on AWS?`,
    opts:[
      "Capacity is bought up front for the expected peak and depreciated over several years",
      "The agency pays only when resources are consumed, and only for how much is consumed",
      "The monthly bill stays the same whether the systems are busy or idle",
      "A project that is switched off stops costing money",
      "Resources left running stop being billed once a monthly budget is reached"
    ],
    correct:[1,3],
    explain:`Variable expense means paying only for what is consumed, so spending follows use and a project that is switched off stops costing money. Buying capacity up front for the peak is the fixed-expense model being left behind, and resources left running keep costing money on AWS: the bill follows use, and nothing stops billing when a budget figure is reached.`
  },
  /* Q10 · Ch 10 - Licensing: BYOL vs license included · Skill 1.4.3 */
  {
    ref:{chapter:10},
    q:`A city's public works department needs Windows Server instances for a new permit-tracking system. It owns no Windows licenses and does not want staff buying licenses or tracking license compliance. Which statement describes the license-included model it should choose?`,
    opts:[
      "AWS holds the license and tracks compliance, and the license cost is built into the hourly price of the instance",
      "The department buys the licenses separately, and AWS License Manager tracks them for it",
      "The department must run the instances on Dedicated Hosts so licenses can be counted per core",
      "The license is free on AWS, so the hourly price covers only the infrastructure"
    ],
    correct:0,
    explain:`Under license included, AWS holds the license, tracks compliance, and builds the license cost into the hourly price, so nothing is bought or tracked separately. Buying licenses and tracking them in License Manager is the tempting option because it is a real AWS approach, but that is Bring Your Own License, which leaves compliance with the customer.`
  },
  /* Q11 · Ch 11 - Rightsizing · Skill 1.4.4 */
  {
    ref:{chapter:11},
    q:`A state university's finance office plans to buy a three-year Savings Plan for the Amazon EC2 fleet that runs its student information systems. Utilization reports show most instances average well under 20% CPU, because they were sized for enrollment week years ago. What should the university do first?`,
    opts:[
      "Buy the Savings Plan now, since any discount lowers the bill",
      "Move the fleet to larger instances to leave room for growth before committing",
      "Rightsize the instances, then commit based on the smaller usage",
      "Switch the whole fleet to Spot Instances instead of committing"
    ],
    correct:2,
    explain:`Rightsizing first means the Savings Plan or Reserved Instance commitment covers what the workload actually needs; committing first locks in paying for oversized capacity. Buying the Savings Plan now is the tempting option because the discount is real, but a discount on waste is still waste.`
  },
  /* Q12 · Ch 12 - Automation and economies of scale · Skills 1.4.5, 1.4.6 */
  {
    ref:{chapter:12},
    q:`A public health agency's AWS costs fell this year for several reasons. Which of these savings comes from economies of scale?`,
    opts:[
      "It stopped its test environments every night with a scheduled script",
      "It downsized instances that ran below 10% CPU all month",
      "It stopped buying hardware up front and paid only for what it used",
      "It paid lower pay-as-you-go prices that AWS can offer because it aggregates usage across a vast number of customers"
    ],
    correct:3,
    explain:`Economies of scale lower unit prices because AWS combines the usage of a vast number of customers, and the customer does nothing to earn it. The scheduled script is the tempting distractor because it is also a source of savings, but it is automation the agency did itself to cut waste, not a lower unit price.`
  },
  /* Q13 · Ch 13 - Shared responsibility: security of the cloud · Skills 2.1.1, 2.1.3 */
  {
    ref:{chapter:13},
    q:`An auditor asks a dental clinic chain to show the physical and environmental controls protecting the AWS data centers that host its patient scheduling system. How should the clinic chain treat these controls?`,
    opts:[
      "Write and test its own guard and access procedures for each AWS data center",
      "As inherited controls: it relies on AWS's controls and shows AWS's audit reports from AWS Artifact",
      "As shared controls that the clinic chain and AWS each carry out in their own layer",
      "As customer-specific controls tied to the clinic chain's own application"
    ],
    correct:1,
    explain:`Physical and environmental controls are the classic inherited controls: the customer takes them entirely from AWS, and AWS proves them with audit reports available in AWS Artifact. Shared controls are the tempting answer, but those are controls such as patch management that each side performs in its own layer, and the customer has no layer inside an AWS data center.`
  },
  /* Q14 · Ch 14 - Security in the cloud · Skills 2.1.2, 2.1.4 */
  {
    ref:{chapter:14},
    q:`A state Medicaid agency's eligibility application routes certain records into a dedicated security zone that only that application uses, a design that depends entirely on how the agency built the application. Under the shared responsibility model, which kind of control is this?`,
    opts:[
      "A customer-specific control",
      "An inherited control",
      "A shared control",
      "A control AWS performs on the customer's behalf"
    ],
    correct:0,
    explain:`Routing or zoning data within specific security environments for the customer's own application is AWS's example of a customer-specific control, which is solely the customer's. A shared control is the tempting choice, but shared controls such as patch management or training are carried out by both sides in separate layers, while this zoning exists only in the agency's application.`
  },
  /* Q15 · Ch 15 - How responsibility shifts: EC2 vs RDS vs Lambda · Skill 2.1.5 */
  {
    ref:{chapter:15},
    q:`A hospital moves its patient billing database from Amazon EC2 to Amazon RDS. A new billing clerk needs a database login with read access to two tables. Under the shared responsibility model, who creates that login and grants the permissions?`,
    opts:[
      "AWS, because Amazon RDS is a managed database",
      "AWS, during the maintenance window the hospital selects",
      "AWS and the hospital equally, as a shared control",
      "The hospital, because database users and permissions stay with the customer on RDS"
    ],
    correct:3,
    explain:`On Amazon RDS, AWS takes over the operating system and database engine software, but database users, permissions, network access and the data stay with the customer. The maintenance window option is tempting because AWS does update the engine then, but that window is for AWS's patching, not for managing the hospital's database users.`
  },
  /* Q16 · Ch 17 - AWS Organizations and AWS Control Tower · Skill 2.2 knowledge */
  {
    ref:{chapter:17},

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
