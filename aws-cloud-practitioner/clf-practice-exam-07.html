<script>
/* =====================================================================

   The only section you edit per exam: the E config object and the

const E = {
  name: "Full Mock 3",
  badge: "AWS Cloud Practitioner (CLF-C02)",
  blurb: "A full-length mock: 50 scenario questions across all four domains at the official weights, 90 minutes. Most questions have one best answer; a few ask you to select two. Pass mark is 70%, our practice target (the real exam reports a scaled score of 700 out of 1,000).",
  coverage: "All four domains, sampled at the official weights: 12 Cloud Concepts, 15 Security and Compliance, 17 Cloud Technology and Services, 6 Billing, Pricing, and Support. Scenarios from media, travel and manufacturing, never reused in drills.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

/* Q1 · Ch 01 - The value proposition of the AWS Cloud · Skill 1.1 knowledge */
  {
    ref:{chapter:1},
    q:`A furniture factory's managers are new to AWS. In a briefing, they ask for AWS's own one-sentence definition of what cloud computing is. Which statement matches it?`,
    opts:[
      "Leasing a dedicated rack in an AWS data center that the customer fills with its own servers",
      "Buying servers through AWS and installing them in the customer's own facility",
      "On-demand delivery of IT resources such as compute, storage and databases over the internet, with pay-as-you-go pricing",
      "A fixed annual contract under which AWS runs and configures every application for the customer"
    ],
    correct:2,
    explain:`AWS defines cloud computing as the on-demand delivery of IT resources over the internet with pay-as-you-go pricing, on hardware that AWS owns and maintains. Option D is the tempting one because AWS does take on the hardware, but there is no large fixed commitment, and what runs on the hardware and how it is configured is still the customer's job.`
  },

  /* Q2 · Ch 02 - Global infrastructure benefits · Skill 1.1.1 */
  {
    ref:{chapter:2},
    q:`A hotel chain signs a contract with a government client in its home country. The contract says guest records for that client must be stored inside the country. The chain wants to meet this on AWS without building or leasing any facility. Which benefit of the AWS global infrastructure applies?`,
    opts:[
      "Global reach: it can choose an AWS Region in that country and keep the records there",
      "Elasticity: capacity in its current Region grows and shrinks with bookings",
      "Economies of scale: lower AWS prices pay for a local data center",
      "Edge locations: guest records are cached close to the client's offices"
    ],
    correct:0,
    explain:`Part of global reach is choice of location: customers pick the Regions where their data is stored, which is how a contract that requires data to stay in a country is met. Edge locations are the tempting distractor because they sit close to users, but they cache and deliver content quickly; they are not where the chain chooses to store its records.`
  },

  /* Q3 · Ch 03 - High availability, elasticity and agility · Skill 1.1.2 */
  {
    ref:{chapter:3},
    q:`A podcast network expects its audience to grow tenfold over the next three years. It wants an architecture that can keep handling that growth by adding resources. Nothing in the plan mentions reducing capacity after peaks. Which term best describes this requirement?`,
    opts:[
      "Elasticity",
      "High availability",
      "Agility",
      "Scalability"
    ],
    correct:3,
    explain:`Scalability is the ability to handle growth by adding resources: it describes how far a system can grow. Elasticity is the tempting answer, but elasticity means capacity tracks demand in both directions, and its tell is shrinking after a peak to stop paying for idle capacity, which this plan never mentions.`
  },

  /* Q4 · Ch 04 - The six pillars of the Well-Architected Framework · Skill 1.2.1 */
  {
    ref:{chapter:4},
    q:`A video streaming company's architects adopt the design principle "maintain traceability and implement a strong identity foundation" for their new platform. Which Well-Architected pillar does this principle belong to?`,
    opts:[
      "Operational excellence",
      "Security",
      "Reliability",
      "Cost optimization"
    ],
    correct:1,
    explain:`A strong identity foundation with least privilege, plus traceability of every action, is a key idea of the security pillar. Operational excellence is the tempting distractor because tracing and observing a workload sounds operational, but its key idea is treating operations as code; traceability of who did what protects the system, which is security.`
  },

  /* Q5 · Ch 05 - Telling the pillars apart · Skill 1.2.2 */
  {
    ref:{chapter:5},
    q:`A car maker's platform team writes a script that runs every time a new storage bucket is created. It turns on encryption and makes sure every action on the bucket is logged with the identity that performed it. Which Well-Architected pillar does this automation serve?`,
    opts:[
      "Security",
      "Operational excellence",
      "Reliability",
      "Performance efficiency"
    ],
    correct:0,
    explain:`Encryption and traceability of who did what are security concerns, and the tie-breaker is clear: automating a security control is security. Operational excellence is the tempting answer because the team automated something, but that pillar covers automating deployments and routine operations, not the protection of data.`
  },

  /* Q6 · Ch 06 - The AWS Cloud Adoption Framework · Skill 1.3.1 */
  {
    ref:{chapter:6},
    q:`During an airline's cloud transformation, its infrastructure leaders and site reliability engineers are responsible for making sure cloud services are delivered at the level the business needs. Which AWS Cloud Adoption Framework perspective covers their work?`,
    opts:[
      "Platform",
      "Governance",
      "Business",
      "Operations"
    ],
    correct:3,
    explain:`The Operations perspective makes sure cloud services are delivered at the level the business needs, and its stakeholders are infrastructure leaders and site reliability engineers. Platform is the tempting distractor because it is also technical, but it is about building an enterprise-grade hybrid cloud platform and modernizing workloads, with the CTO, architects and engineers as stakeholders.`
  },

  /* Q7 · Ch 07 - Migration strategies: the 7 Rs · Skill 1.3.2 */
  {
    ref:{chapter:7},
    q:`A media group has acquired a small film studio. It wants to move the studio's Amazon RDS database from the studio's AWS account into the group's own AWS account, with no changes to the application and no new hardware. Which migration strategy is this?`,
    opts:[
      "Rehost",
      "Replatform",
      "Relocate",
      "Refactor"
    ],
    correct:2,
    explain:`Relocate covers moving resources such as an Amazon RDS database to another VPC, Region or account, with no rewrite and no new hardware. Rehost is the tempting answer because the application is unchanged, but rehosting moves servers from outside AWS into AWS; this database is already on AWS and only changes accounts.`
  },

  /* Q8 · Ch 08 - Tools for the migration journey · Skill 1.3.2 */
  {
    ref:{chapter:8},
    q:`A tour operator must move 250 on-premises virtual servers, plus a few servers running in another cloud, to AWS before its hosting contract ends. The applications stay as they are, and each server's cutover must take only minutes. Which service fits best?`,
    opts:[
      "AWS Database Migration Service",
      "AWS Application Migration Service",
      "AWS Schema Conversion Tool",
      "AWS CloudFormation"
    ],
    correct:1,
    explain:`AWS Application Migration Service continuously replicates physical, virtual or other-cloud servers at the block level and converts them to run on AWS, so large rehosting moves cut over in minutes; AWS calls it the primary service for lift and shift. AWS DMS is the tempting distractor because it also replicates continuously, but it moves databases, not whole servers.`
  },

  /* Q9 · Ch 09 - Fixed vs variable costs · Skills 1.4.1, 1.4.2 · select two */
  {
    ref:{chapter:9},
    q:`A travel magazine publisher runs part of its systems in its own data center and part on AWS. Its finance team is sorting costs into fixed and variable. Which TWO of these costs stay the same in a month when reader traffic falls by half?`,
    opts:[
      "Per-request charges for its AWS Lambda functions",
      "The lease on the space that holds its server racks",
      "On-Demand charges for Amazon EC2 instances it stops at night",
      "Depreciation on the servers it bought last year",
      "Charges for data transferred out of AWS to readers"
    ],
    correct:[1,3],
    explain:`A data center lease and depreciation on owned servers are fixed expenses: they were committed in advance and are paid whether the hardware is busy or idle. The AWS charges are variable expenses that fall with use; On-Demand EC2 charges are the most tempting choice because servers are involved, but instances that are stopped or used less are billed less.`
  },

  /* Q10 · Ch 10 - Licensing: BYOL vs license included · Skill 1.4.3 */
  {
    ref:{chapter:10},
    q:`A film production company needs a handful of Windows Server instances to run editing software for a four-month shoot. It owns no Windows licenses and wants one AWS bill with nothing to buy or track. Which licensing approach fits?`,
    opts:[
      "Buy Windows licenses and bring them to Amazon EC2 Dedicated Hosts",
      "Purchase perpetual licenses before the shoot and reuse them later",
      "Run the editing servers in its own office for the shoot",
      "Launch the instances with the license included in the hourly price"
    ],
    correct:3,
    explain:`With license included, AWS holds the license and its cost is built into the hourly price, which fits a short project with no owned licenses and no wish to track them. BYOL on Dedicated Hosts is the tempting distractor because it is the other AWS licensing model, but it only makes sense for licenses a company already owns.`
  },

  /* Q11 · Ch 11 - Rightsizing · Skill 1.4.4 */
  {
    ref:{chapter:11},
    q:`A logistics company finished a large project last quarter. It suspects that some Amazon EC2 instances and other resources from that project are still running but doing no work at all. It wants AWS to identify them so they can be stopped or deleted. Which service should it use?`,
    opts:[
      "AWS Compute Optimizer",
      "AWS Pricing Calculator",
      "AWS Application Migration Service",
      "AWS CloudFormation"
    ],
    correct:0,
    explain:`AWS Compute Optimizer analyzes utilization metrics and, besides rightsizing recommendations, gives a list of idle resources to stop or delete. The Pricing Calculator is the tempting distractor because it is a cost tool, but it estimates the cost of resources before they exist; it does not look at how running resources are used.`
  },

  /* Q12 · Ch 12 - Automation and economies of scale · Skills 1.4.5, 1.4.6 */
  {
    ref:{chapter:12},
    q:`A factory's IT team applies network changes by hand late at night. Mistakes made by rushed staff caused two outages this year, and afterward nobody could tell exactly what had changed. Which benefit of automation addresses this?`,
    opts:[
      "Economies of scale lower the unit price of each change",
      "Variable expense means each outage costs less",
      "Scripts and templates run the same steps the same way, so errors drop and changes can be tracked and reverted",
      "Rightsizing makes each server smaller, so changes are simpler"
    ],
    correct:2,
    explain:`Automation means fewer errors: the same steps run the same way every time, and changes can be tracked and reverted. Economies of scale is the tempting distractor because it is the other savings source in this chapter, but it lowers AWS's unit prices; it does nothing about mistakes in the customer's own procedures.`
  },

  /* Q13 · Ch 13 - Shared responsibility: security of the cloud · Skills 2.1.1, 2.1.3 */
  {
    ref:{chapter:13},
    q:`A broadcaster's auditor asks it to show the controls for fire protection, power and physical access in the data centers that run its AWS workloads. How should the broadcaster handle this request?`,
    opts:[
      "Write and test its own fire protection procedures for the AWS facilities",
      "Treat them as inherited controls and rely on AWS's audit reports, available in AWS Artifact",
      "Treat them as shared controls and document its half of each one",
      "Turn on AWS Config rules that evaluate the data centers"
    ],
    correct:1,
    explain:`Physical and environmental controls are inherited: the customer takes them entirely from AWS, and AWS proves them in audit reports published in AWS Artifact. Shared controls are the tempting distractor, but those are controls such as patching and training that each side performs in its own layer, and the broadcaster has no part to play in AWS's facilities.`
  },

  /* Q14 · Ch 14 - Security in the cloud · Skills 2.1.2, 2.1.4 */
  {
    ref:{chapter:14},
    q:`A tour operator's security lead is writing a policy that explains security awareness training under the AWS shared responsibility model. Which statement is correct?`,
    opts:[
      "AWS trains its own employees, and the tour operator trains its own employees",
      "AWS trains the tour operator's staff as part of every service",
      "The tour operator must train the staff who work in AWS data centers",
      "Training is an inherited control that the tour operator takes entirely from AWS"
    ],
    correct:0,
    explain:`Awareness and training is a shared control: each side performs it in its own context, so AWS trains AWS employees and the customer trains its own employees. Calling it inherited is the tempting mistake, but inherited controls, such as physical and environmental protection, are ones the customer takes entirely from AWS, and the operator's staff are not covered by AWS's training.`
  },

  /* Q15 · Ch 15 - How responsibility shifts: EC2 vs RDS vs Lambda · Skill 2.1.5 */
  {
    ref:{chapter:15},
    q:`A publisher moves its article-tagging job from Amazon EC2 to AWS Lambda with a managed runtime, and its database from EC2 to Amazon RDS. Which responsibility stays with the publisher on both new services?`,
    opts:[
      "Patching the operating system the job and the database run on",
      "Updating the RDS database engine and the Lambda managed runtime",
      "Securing the virtualization layer beneath both services",
      "Controlling who can access the data and protecting the data itself"
    ],
    correct:3,
    explain:`Data and who can access it through IAM stay with the customer on every service, from EC2 to RDS to Lambda. Option B is the tempting one because the database engine and runtime were the publisher's job on EC2, but on RDS and on a managed Lambda runtime AWS patches them, along with the operating system below.`
  },

  /* Q16 · Ch 16 - Compliance: AWS Artifact · Skills 2.2.1, 2.2.2, 2.2.6 */
  {
    ref:{chapter:16},
    q:`A ticket-booking site downloads AWS's PCI DSS report from AWS Artifact. Its manager concludes that the site is now PCI DSS compliant and no further work is needed. What is the correct view?`,
    opts:[
      "Correct, because the report covers every workload running in the account",
      "Correct, but only if the site runs in a single AWS Region",
      "The report proves AWS's infrastructure controls; the site must still prove its own configuration, access and data handling",
      "The site must also download the same report from AWS Trusted Advisor"

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
