<style>
  /* =====================================================================

  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;

    --display:"Fraunces",Georgia,serif; --body:"Hanken Grotesk",system-ui,sans-serif;

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:radial-gradient(1100px 650px at 50% -8%,#1a1d29 0%,transparent 58%),var(--bg);font-family:var(--body);color:var(--ink);min-height:100vh;line-height:1.5;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* sticky top */
  .top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .timer.warn{color:var(--gold);}
  .timer svg{opacity:.7;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  .intro{text-align:center;margin:auto 0;padding:30px 0;}

  .intro h1{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.05;letter-spacing:-0.02em;margin-bottom:16px;}

  .facts{display:flex;justify-content:center;gap:0;margin:24px 0 28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;}

  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}

  .qtext code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:5px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);line-height:1.4;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:rgba(255,255,255,0.2);}
  .opt.sel{border-color:var(--gold);background:rgba(227,184,74,0.08);}
  .opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .opt.sel .key{background:var(--gold);color:#14110c;}

  /* review states */
  .opt.correct{border-color:var(--green);background:rgba(52,211,166,0.1);}
  .opt.correct .key{background:var(--green);color:#072018;}
  .opt.incorrect{border-color:var(--red);background:rgba(232,98,92,0.1);}
  .opt.incorrect .key{background:var(--red);color:#2a0a08;}
  .explain{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .explain b{color:var(--ink);}

  /* nav dots */
  .nav-dots{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 4px;justify-content:center;}
  .dot{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-faint);cursor:pointer;transition:.15s;font-family:var(--body);}
  .dot.answered{background:var(--surface-2);color:var(--ink);border-color:rgba(255,255,255,0.18);}

  .dot.flagged{box-shadow:inset 0 0 0 2px rgba(227,184,74,0.5);}

  /* footer nav */
  .foot{display:flex;gap:12px;margin-top:24px;}
  .foot .btn{flex:1;}

  /* results */
  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:140px;height:140px;margin:6px auto 18px;}

  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scorering .ctr b{font-family:var(--display);font-size:38px;font-weight:600;line-height:1;}
  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .verdict{font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:6px;}
  .verdict.pass{color:var(--green);}
  .verdict.fail{color:var(--gold);}
  .res p{color:var(--ink-soft);font-size:14.5px;max-width:28em;margin:0 auto 22px;}
  .res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}

<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "Practice Exam 3",
  badge: "AWS Cloud Practitioner (CLF-C02)",
  blurb: "Exam-style, scenario-based questions, one per chapter. Most questions have one best answer; a few ask you to select two. Pass mark is 70%, our practice target (the real exam reports a scaled score of 700 out of 1,000).",
  coverage: "Covers chapters 29-55: Unit 3 (Cloud Technology and Services). One question per chapter.",
  minutes: 54,
  pass: 70
};

const QUESTIONS = [

  /* Q1 · Ch 29 - Ways to reach AWS: Console, CLI, SDKs and APIs · Skill 3.1.1 */
  {
    ref:{chapter:29},
    q:`A mobile app's backend, written in Java, must create a record in Amazon DynamoDB every time a user signs up. How should the backend code interact with DynamoDB?`,
    opts:[
      "Through the AWS Management Console",
      "By running AWS CLI commands manually each day",
      "Through the AWS SDK for Java",
      "By downloading reports from AWS Artifact"
    ],
    correct:2,
    explain:`An SDK lets application code call AWS service APIs directly in its own language as part of normal operation. The CLI is the tempting distractor because it also calls AWS APIs, but it is a command-line tool for people and scripts, not a library the running application uses on every sign-up.`
  },

  /* Q2 · Ch 30 - Infrastructure as code and repeatable processes · Skills 3.1.1, 3.1.2 */
  {
    ref:{chapter:30},
    q:`After a disaster-recovery test, a company learned that rebuilding its environment by hand took two days and produced configuration mistakes. It wants to recreate the full environment in another Region quickly and identically. What should it adopt?`,
    opts:[
      "AWS CloudFormation templates that define the environment as code",
      "A written checklist for administrators to follow in the console",
      "A larger AWS Support plan",
      "Amazon CloudWatch dashboards for each resource"
    ],
    correct:0,
    explain:`Infrastructure as code with CloudFormation builds the same resources from a template every time, in any Region, quickly and without manual mistakes. A written checklist is the tempting improvement, but it is still a manual, one-click-at-a-time process, which is the source of the slowness and errors.`
  },

  /* Q3 · Ch 31 - Deployment models · Skill 3.1.3 */
  {
    ref:{chapter:31},
    q:`A university keeps its student records system in its own data center for now, but is building a new analytics platform in AWS that must read those records over a private connection. Which deployment model describes this?`,
    opts:[
      "Cloud",
      "On-premises",
      "Private cloud only",
      "Hybrid"
    ],
    correct:3,
    explain:`Connecting existing on-premises systems with resources in AWS so they work together is the hybrid model. Cloud is the tempting distractor because the new platform runs in AWS, but the records system stays in the university's data center, so the overall setup spans both.`
  },

  /* Q4 · Ch 32 - Regions, Availability Zones and edge locations · Skill 3.2.1 */
  {
    ref:{chapter:32},
    q:`Which statement correctly describes AWS edge locations?`,
    opts:[
      "They are the Availability Zones inside each Region",
      "They are sites close to end users that services such as Amazon CloudFront use to deliver content with low latency",
      "They are on-premises racks installed by AWS Outposts",
      "They are the only places where Amazon EC2 instances can run"
    ],
    correct:1,
    explain:`Edge locations are a separate, widely distributed set of sites near users, used by CloudFront, Route 53 and Global Accelerator to deliver content and traffic quickly. Confusing them with Availability Zones is the common trap: AZs are the data center groups inside a Region where workloads such as EC2 run.`
  },

  /* Q5 · Ch 33 - High availability across Availability Zones · Skills 3.2.2, 3.2.3 */
  {
    ref:{chapter:33},
    q:`A company's application must keep running if one data center loses power. It currently runs on EC2 instances in a single Availability Zone. What is the most direct way to meet the requirement?`,
    opts:[
      "Run the instances across at least two Availability Zones behind a load balancer",
      "Move the application to a second Region and delete the first deployment",
      "Use larger instance types in the same Availability Zone",
      "Turn on AWS Shield Advanced"
    ],
    correct:0,
    explain:`Availability Zones are separate facilities with independent power and networking, so spreading instances across two or more AZs keeps the application running when one fails. Moving to another Region is the tempting overreach: it simply relocates the single-AZ problem, and a single Region is enough for surviving a data center outage.`
  },

  /* Q6 · Ch 34 - When to use multiple Regions · Skill 3.2.4 */
  {
    ref:{chapter:34},
    q:`A stock trading platform must be able to keep operating even if an entire AWS Region becomes unavailable. Which approach meets this requirement?`,
    opts:[
      "Deploy across three Availability Zones in one Region",
      "Use Amazon CloudFront in front of the application",
      "Maintain a recoverable copy of the application and data in a second AWS Region",
      "Enable Amazon EC2 Auto Scaling"
    ],
    correct:2,
    explain:`Surviving the loss of a whole Region is a disaster-recovery and business-continuity need, which requires a second Region. Three Availability Zones is the tempting answer because it is the standard high-availability design, but every AZ in it belongs to the same Region.`
  },

  /* Q7 · Ch 35 - Amazon EC2 instance types · Skill 3.3.1 */
  {
    ref:{chapter:35},
    q:`A research group runs simulations that keep processors at 100% for hours but need relatively little memory. Which EC2 instance family fits best?`,
    opts:[
      "Memory optimized",
      "Storage optimized",
      "General purpose",
      "Compute optimized"
    ],
    correct:3,
    explain:`Compute optimized instances have high-performance processors for CPU-bound work such as scientific modeling and batch processing. General purpose is the tempting safe choice, but its balanced design gives up processor performance per dollar that this CPU-heavy, memory-light workload needs.`
  },

  /* Q8 · Ch 36 - Containers: ECS vs EKS · Skill 3.3.2 */
  {
    ref:{chapter:36},
    q:`A company wants to run containers on AWS using the same open-source orchestration platform it runs in another cloud and on premises, so its teams can use one set of tools everywhere. Which service fits?`,
    opts:[
      "Amazon ECS",
      "Amazon EKS",
      "AWS Elastic Beanstalk",
      "Amazon Lightsail"
    ],
    correct:1,
    explain:`EKS runs standard Kubernetes, the open-source orchestrator that also runs in other clouds and on premises, so tools and skills carry over. ECS is the tempting distractor because it is AWS's simplest container service, but it uses AWS's own orchestrator, which does not run outside AWS.`
  },

  /* Q9 · Ch 37 - Serverless compute: Lambda vs Fargate · Skill 3.3.3 */
  {
    ref:{chapter:37},
    q:`A small function must run for a few seconds each time a message arrives in an Amazon SQS queue. Messages arrive irregularly, and the team wants no servers or containers to manage and no cost while idle. What fits best?`,
    opts:[
      "AWS Lambda triggered by the queue",
      "An Amazon EC2 instance polling the queue",
      "AWS Fargate tasks running continuously",
      "Amazon EKS with managed node groups"
    ],
    correct:0,
    explain:`Lambda runs code in response to events such as queue messages, with nothing to manage and no charge when it is not running. Fargate is the tempting distractor because it is also serverless, but continuously running containers would be billed while waiting for irregular messages.`
  },

  /* Q10 · Ch 38 - Auto scaling and load balancers · Skills 3.3.4, 3.3.5 · select two */
  {
    ref:{chapter:38},
    q:`A web application runs on EC2 instances. The company wants (1) the number of instances to grow and shrink automatically with traffic and (2) incoming requests spread only across healthy instances. Which TWO services provide this?`,
    opts:[
      "Amazon EC2 Auto Scaling",
      "Amazon Route 53 domain registration",
      "Elastic Load Balancing",
      "AWS Outposts",
      "Amazon S3 Lifecycle"
    ],
    correct:[0,2],
    explain:`EC2 Auto Scaling adds and removes instances with demand, providing elasticity, and Elastic Load Balancing distributes requests across healthy instances. Route 53 is the most tempting distractor because it directs users too, but domain registration does not distribute requests across instances or change their number.`
  },

  /* Q11 · Ch 39 - Tools to build, deploy and troubleshoot applications · Skills 3.8.4, 3.8.6 */
  {
    ref:{chapter:39},
    q:`A frontend team wants to build, deploy and host a web application with user sign-in and a backend, without assembling each AWS service themselves. Which service is designed for this?`,
    opts:[
      "AWS X-Ray",
      "AWS CodeBuild",
      "AWS Amplify",
      "AWS Step Functions"
    ],
    correct:2,
    explain:`Amplify builds, deploys and hosts full-stack web and mobile applications, aimed at frontend and mobile developers. CodeBuild is the tempting distractor because it is a developer tool, but it only compiles and tests code; it does not host the app or provide sign-in and backend features.`
  },

  /* Q12 · Ch 40 - A database on EC2 vs a managed database · Skill 3.4.1 */
  {
    ref:{chapter:40},
    q:`A company needs a relational database but wants AWS to handle provisioning, patching, backups and failure detection, and it has no need for operating system access. What should it choose?`,
    opts:[
      "A database installed on an Amazon EC2 instance",
      "A database on an on-premises server",
      "Amazon EC2 instance store",
      "Amazon RDS"
    ],
    correct:3,
    explain:`Amazon RDS is a managed relational database service where AWS handles provisioning, patching, backups and failure detection. A database on EC2 is the tempting distractor because it can run the same engine, but then the company does all of that administration itself, which is what it wants to avoid.`
  },

  /* Q13 · Ch 41 - Relational databases: RDS and Aurora · Skill 3.4.2 */
  {
    ref:{chapter:41},
    q:`A company wants to migrate a PostgreSQL application to a managed, PostgreSQL-compatible relational database built for the cloud, with storage that grows automatically and is replicated across three Availability Zones. Which service fits?`,
    opts:[
      "Amazon DynamoDB",
      "Amazon Aurora",
      "Amazon Neptune",
      "Amazon ElastiCache"
    ],
    correct:1,
    explain:`Aurora is MySQL- and PostgreSQL-compatible, built for the cloud, with storage that grows automatically and copies data across three AZs. DynamoDB is the tempting distractor because it is also fully managed, but it is a NoSQL database, so the PostgreSQL application would have to be rewritten.`
  },

  /* Q14 · Ch 42 - NoSQL and in-memory databases · Skills 3.4.3, 3.4.4 */
  {
    ref:{chapter:42},
    q:`A ticketing site stores each user's session data and needs to read it in microseconds on every page load to keep pages fast. Which service is designed for this kind of in-memory data?`,
    opts:[
      "Amazon ElastiCache",
      "Amazon Redshift",
      "Amazon S3 Glacier Instant Retrieval",
      "Amazon DocumentDB"
    ],
    correct:0,
    explain:`ElastiCache is an in-memory data store and cache that answers in microseconds, commonly used for session data. DocumentDB is the tempting distractor because it is also a managed database, but it stores documents on disk for MongoDB-compatible workloads rather than serving data from memory.`
  },

  /* Q15 · Ch 43 - Database migration: DMS and SCT · Skill 3.4.5 */
  {
    ref:{chapter:43},
    q:`A company is moving an Oracle data warehouse to Amazon Redshift. Before the data can be loaded, the warehouse schema must be converted for the new engine. Which tool performs the schema conversion?`,
    opts:[
      "AWS Application Migration Service",
      "Amazon Kinesis",
      "AWS Schema Conversion Tool (AWS SCT)",
      "AWS Backup"
    ],
    correct:2,
    explain:`AWS SCT converts schemas from one engine to another, including data warehouse schemas with Amazon Redshift as a target; AWS DMS can then move the data. Application Migration Service is the tempting distractor because it is a migration service, but it moves whole servers unchanged and does not convert database schemas.`
  },

  /* Q16 · Ch 44 - The parts of a VPC · Skill 3.5.1 */
  {
    ref:{chapter:44},
    q:`A company places its database in a VPC subnet that has no route to an internet gateway, so it cannot be reached from the internet. What kind of subnet is this?`,
    opts:[
      "A public subnet",
      "An edge location",
      "A NAT gateway",
      "A private subnet"
    ],
    correct:3,
    explain:`A subnet without a route to an internet gateway is private, the usual place for databases and application servers. A NAT gateway is the tempting distractor because it is often mentioned with private subnets, but it is a gateway resource that private subnets use for outbound access, not a type of subnet.`
  },

  /* Q17 · Ch 45 - Security groups vs network ACLs · Skill 3.5.2 */
  {
    ref:{chapter:45},
    q:`Which statement correctly compares security groups and network ACLs in a VPC?`,
    opts:[
      "Security groups are stateless and apply to subnets; network ACLs are stateful and apply to instances",
      "Security groups are stateful and apply to resources such as instances; network ACLs are stateless and apply to subnets",
      "Both are stateless and support only deny rules",
      "Both apply only to traffic leaving the VPC"
    ],
    correct:1,
    explain:`Security groups attach to resources, allow only, and are stateful; network ACLs attach to subnets, support allow and deny rules, and are stateless. The first option is the classic trap: it swaps every property between the two.`
  },

  /* Q18 · Ch 46 - Amazon Route 53 · Skill 3.5.3 */
  {
    ref:{chapter:46},
    q:`A company runs its application in Regions in North America, Europe and Asia and wants each user sent to the Region that gives them the lowest latency. What should it use?`,
    opts:[
      "Amazon Route 53 latency-based routing",
      "An Application Load Balancer in one Region",
      "Amazon EC2 Auto Scaling",
      "AWS Direct Connect"
    ],
    correct:0,

const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
