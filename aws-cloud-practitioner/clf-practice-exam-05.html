<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
   Sealed full-length mock: never reuse these questions in the unit exams

===================================================================== */
const E = {
  name: "Full Mock 1",
  badge: "AWS Cloud Practitioner (CLF-C02)",
  blurb: "A full-length mock: 50 scenario questions across all four domains at the official weights, 90 minutes. Most questions have one best answer; a few ask you to select two. Pass mark is 70%, our practice target (the real exam reports a scaled score of 700 out of 1,000).",
  coverage: "All four domains, sampled at the official weights: 12 Cloud Concepts, 15 Security and Compliance, 17 Cloud Technology and Services, 6 Billing, Pricing, and Support. Scenarios from retail and financial services, never reused in drills.",
  minutes: 90,
  pass: 70
};

const QUESTIONS = [

/* Q1 · Ch 01 - The value proposition of the AWS Cloud · Skill 1.1 knowledge */
  {
    ref:{chapter:1},
    q:`An online fashion boutique's developers wait about six weeks for every new test server, because each one goes through a purchase order, delivery and racking. Leadership wants developers to get servers in minutes so that trying a new idea is cheap and quick. Which advantage of the AWS Cloud describes what leadership wants?`,
    opts:[
      "Go global in minutes",
      "Increase speed and agility",
      "Benefit from massive economies of scale",
      "Trade fixed expense for variable expense"
    ],
    correct:1,
    explain:`Increase speed and agility means new resources are a click away, so the time to give developers a server drops from weeks to minutes and experiments get cheap. Go global in minutes is the tempting option because it is also about speed, but it describes deploying to multiple Regions for lower latency, not how fast a team gets a server.`
  },
  /* Q2 · Ch 02 - Global infrastructure benefits · Skill 1.1.1 */
  {
    ref:{chapter:2},
    q:`A card-payments company runs a proven, templated setup in one AWS Region. It has just won a contract with merchants in South America, with go-live next month, and it has no facilities or hardware on that continent. Which benefit of the AWS global infrastructure makes the deadline realistic?`,
    opts:[
      "Elasticity, because capacity in the existing Region grows automatically with new merchants",
      "Economies of scale, because AWS prices fall as more customers join",
      "High availability, because the existing Region already spans several Availability Zones",
      "Speed of deployment, because the infrastructure already exists and the same setup can be repeated in another Region"
    ],
    correct:3,
    explain:`AWS has already built the Regions, and the same services run in each, so a setup proven in one Region can be repeated in another, often from the same template, instead of building a site. Elasticity is the tempting choice because it also adds capacity, but extra capacity in the existing Region does not put the service on a new continent.`
  },
  /* Q3 · Ch 03 - High availability, elasticity and agility · Skill 1.1.2 */
  {
    ref:{chapter:3},
    q:`A supermarket chain's marketing team wants to test three versions of a loyalty app feature, each for one week, and switch off the two that perform worst so they stop costing money. Which advantage of the AWS Cloud is the team relying on?`,
    opts:[
      "Agility",
      "High availability",
      "Elasticity",
      "Economies of scale"
    ],
    correct:0,
    explain:`Agility is about how fast a team can try an idea: resources arrive in minutes, and a failed test is switched off and stops costing money. Elasticity is the tempting answer because capacity is released, but elasticity means capacity tracking a changing load, while this scenario is about running cheap, short experiments.`
  },
  /* Q4 · Ch 04 - The six pillars of the Well-Architected Framework · Skill 1.2.1 */
  {
    ref:{chapter:4},
    q:`An insurer plans to review its claims-processing workload in the AWS Well-Architected Tool. Besides the framework's standard questions, it wants an extra set of questions written for that specific type of workload, answered inside the same tool. What should it use?`,
    opts:[
      "AWS Artifact compliance reports",
      "The perspectives of the AWS Cloud Adoption Framework",
      "A lens in the AWS Well-Architected Tool",
      "AWS Trusted Advisor checks"
    ],
    correct:2,
    explain:`Lenses are extra sets of questions for a specific type of workload, used inside the AWS Well-Architected Tool alongside the framework's own questions. The Cloud Adoption Framework is the tempting distractor because it is also an AWS framework, but it assesses the organization's cloud readiness, not one workload's design.`
  },
  /* Q5 · Ch 05 - Telling the pillars apart · Skill 1.2.2 */
  {
    ref:{chapter:5},
    q:`An e-commerce company automates its weekly release so that each deployment is a small, reversible change, keeps its runbooks as versioned code, and holds a review after every operational event to learn from it. Which Well-Architected pillar do these practices belong to?`,
    opts:[
      "Operational excellence",
      "Security",
      "Reliability",
      "Performance efficiency"
    ],
    correct:0,
    explain:`Operations as code, small reversible changes and learning from operational events are operational excellence practices. Security is the tempting choice because both pillars favor automation, but the tie-breaker is what gets automated: a deployment or routine operation is operational excellence, while an automated security control would be security.`
  },
  /* Q6 · Ch 06 - The AWS Cloud Adoption Framework · Skill 1.3.1 */
  {
    ref:{chapter:6},
    q:`A bank sets up a cloud steering committee led by its CFO and chief risk officer. The committee's job is to orchestrate the bank's cloud initiatives so that they deliver the most benefit while keeping transformation risk low. Which AWS CAF perspective does this work belong to?`,
    opts:[
      "Business",
      "Governance",
      "Operations",
      "People"
    ],
    correct:1,
    explain:`The Governance perspective orchestrates cloud initiatives to maximize benefit and minimize transformation risk, with stakeholders that include the CFO and chief risk officer. Business is the tempting answer because the CFO is also one of its stakeholders, but the Business perspective is about making cloud investments speed up business outcomes, not about steering initiatives and managing risk.`
  },
  /* Q7 · Ch 07 - Migration strategies: the 7 Rs · Skill 1.3.2 */
  {
    ref:{chapter:7},
    q:`During migration planning, a retailer decides to stop running its self-hosted employee scheduling application and replace it with a software as a service (SaaS) product from another vendor, moving its data across and training managers on the new tool. Which migration strategy is this?`,
    opts:[
      "Rehost",
      "Replatform",
      "Retain",
      "Repurchase"
    ],
    correct:3,
    explain:`Replacing an application with a different product, typically SaaS, is repurchase, or "drop and shop", which removes infrastructure to maintain at the cost of training users and moving data. Replatform is the tempting option because it also involves some change, but replatforming keeps the same application and makes targeted optimizations, such as moving its database to a managed service.`
  },
  /* Q8 · Ch 08 - Tools for the migration journey · Skill 1.3.2 */
  {
    ref:{chapter:8},
    q:`An insurer's CFO will approve a move to AWS only after seeing a data-driven business case built from the company's actual on-premises usage. The case must point out over-provisioned servers and compare the cost of bringing existing licenses with licenses included in the AWS price. Which AWS offering builds this case?`,
    opts:[
      "AWS Application Migration Service",
      "AWS Database Migration Service (AWS DMS)",
      "Migration Evaluator",
      "AWS Pricing Calculator"
    ],
    correct:2,
    explain:`Migration Evaluator builds a data-driven business case from actual on-premises usage, finds over-provisioned servers and compares Bring Your Own License with License Included costs. The Pricing Calculator is the tempting choice because it also estimates AWS costs, but it prices a design someone enters by hand; it does not analyze the insurer's real usage or flag over-provisioned servers.`
  },
  /* Q9 · Ch 09 - Fixed vs variable costs · Skills 1.4.1, 1.4.2 · select two */
  {
    ref:{chapter:9},
    q:`A payments startup expects transaction volumes to swing widely, with some very quiet months, and it does not yet know how large it will grow. It is comparing buying its own servers with running on AWS using pay-as-you-go pricing. Which TWO statements describe its costs on AWS?`,
    opts:[
      "Its compute costs are committed in advance and stay flat for several years",
      "Spending can fall in quiet months, because it pays only for the resources it consumes",
      "Resources left running in a quiet month stop being billed automatically",
      "Capacity bought for the busiest month is paid for in every quiet month",
      "It avoids a large upfront hardware investment before demand is known"
    ],
    correct:[1,4],
    explain:`On AWS the startup trades fixed for variable expense: spending follows consumption, so it can fall in quiet months, and there is no large upfront investment before anyone knows how the capacity will be used. Resources left running are the trap: the bill follows use, so a server left on in a quiet month is still billed. Flat committed costs and paying for peak capacity every month describe the buy-ahead, fixed side.`
  },
  /* Q10 · Ch 10 - Licensing: BYOL vs license included · Skill 1.4.3 */
  {
    ref:{chapter:10},
    q:`A bank brings its own per-core database licenses to Amazon EC2 across 30 accounts and several Regions. Auditors want the bank to track how many licenses are in use everywhere and to stop launches that would exceed what the bank owns. Which AWS service supports this?`,
    opts:[
      "AWS Artifact",
      "AWS License Manager",
      "Migration Evaluator",
      "AWS Trusted Advisor"
    ],
    correct:1,
    explain:`AWS License Manager tracks licenses from vendors such as Microsoft, Oracle, SAP and IBM across accounts and Regions, and can stop launches that would break the limits. With BYOL, staying within the vendor's terms is the customer's job, and License Manager is the AWS piece that helps. Migration Evaluator is tempting because it also deals with licensing, but it compares license costs for a business case before migrating; it does not enforce limits on running workloads.`
  },
  /* Q11 · Ch 11 - Rightsizing · Skill 1.4.4 */
  {
    ref:{chapter:11},
    q:`An online retailer uses AWS Compute Optimizer to rightsize its Amazon EC2 fleet, but the team notices the recommendations do not reflect how much memory its instances actually use. What should the team do so memory utilization is part of the analysis?`,
    opts:[
      "Install the Amazon CloudWatch agent on the instances so memory metrics are collected",
      "Buy a Savings Plan so Compute Optimizer can see the fleet's usage",
      "Turn on AWS CloudTrail in every Region",
      "Estimate the fleet again in the AWS Pricing Calculator"
    ],
    correct:0,
    explain:`Compute Optimizer reads utilization metrics from Amazon CloudWatch, and memory metrics need the CloudWatch agent installed on the instances. Buying a Savings Plan is the tempting move because it is also a cost step, but the lesson's order is to rightsize first and commit afterward, and a commitment adds no memory data.`
  },
  /* Q12 · Ch 12 - Automation and economies of scale · Skills 1.4.5, 1.4.6 */
  {
    ref:{chapter:12},
    q:`An insurance company's finance director notices that AWS has lowered the prices of several services the company uses over the past few years, even though the company changed nothing about how it runs them. Which advantage of the AWS Cloud explains these lower prices?`,
    opts:[
      "Rightsizing its instances to match demand",
      "Trading fixed expense for variable expense",
      "Automating schedules that stop idle resources",
      "Benefit from massive economies of scale"
    ],
    correct:3,
    explain:`AWS aggregates the usage of hundreds of thousands of customers, and at that scale hardware, power and operations cost less per unit, which translates into lower pay-as-you-go prices; the customer does nothing to earn it. Rightsizing and automation also cut costs, but they are changes the customer makes to reduce waste, and the company here changed nothing.`
  },
  /* Q13 · Ch 13 - Shared responsibility: security of the cloud · Skills 2.1.1, 2.1.3 */
  {
    ref:{chapter:13},
    q:`A payments company is preparing for an audit. For physical and environmental controls in the data centers that run its workloads, it tells the auditor that it does not build or prove these controls itself, but takes them entirely from AWS. What does the shared responsibility model call these controls?`,
    opts:[
      "Shared controls",
      "Customer-specific controls",
      "Inherited controls",
      "Service control policies"
    ],
    correct:2,
    explain:`Inherited controls are the ones a customer fully takes from AWS, and physical and environmental controls in AWS data centers are the classic example, proven by AWS audit reports in AWS Artifact. Shared controls is the tempting answer, but a shared control, such as patch management, is carried out by both parties, each in its own layer.`
  },
  /* Q14 · Ch 14 - Security in the cloud · Skills 2.1.2, 2.1.4 */
  {
    ref:{chapter:14},
    q:`An insurer's security lead asks how security awareness training is handled under the AWS shared responsibility model. Which answer is correct?`,
    opts:[
      "It is a shared control: AWS trains AWS employees, and the insurer trains its own employees",
      "It is an inherited control: AWS trains the insurer's employees on the insurer's behalf",
      "It is a customer-specific control, because training depends on the insurer's application",
      "It is AWS's responsibility alone, because training is part of security of the cloud"
    ],
    correct:0,
    explain:`AWS lists awareness and training as a shared control: the same control applies in two separate contexts, with AWS training its own staff and the customer training its own. The inherited option is tempting because AWS does run training, but AWS trains only AWS employees; the insurer's staff are the insurer's to train.`
  },
  /* Q15 · Ch 15 - How responsibility shifts: EC2 vs RDS vs Lambda · Skill 2.1.5 */
  {
    ref:{chapter:15},
    q:`A fintech runs its payment API on AWS Lambda with a managed runtime and its ledger on Amazon RDS for PostgreSQL. Which responsibility stays with the fintech for both services?`,
    opts:[
      "Patching the operating system the code and database run on",
      "Updating the PostgreSQL database engine software",
      "Patching the Lambda managed runtime",
      "Controlling who can access its data, and protecting the data itself"
    ],
    correct:3,
    explain:`Data and access never move: on every service the customer owns its data, who can reach it through IAM and its encryption choices. The patching options are the trap, because on RDS AWS patches the operating system and database engine, and on Lambda with a managed runtime AWS patches the operating system and runtime.`
  },
  /* Q16 · Ch 16 - Compliance: AWS Artifact · Skills 2.2.1, 2.2.2, 2.2.6 */
  {
    ref:{chapter:16},
    q:`A bank downloads AWS's PCI report from AWS Artifact. Its CTO then announces that the bank's card-processing application on AWS is therefore PCI compliant. What is wrong with this conclusion?`,

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the post-submit review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this exam>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
