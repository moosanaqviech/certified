/* ----------  CARDS  ---------- */
/* Card shape: { glow?, quiz?, last?, html }
   glow  — optional per-card ambient, e.g. "radial-gradient(540px 340px at 50% 20%, var(--accent-glow), transparent 70%)"

   last  — true on the final card; turns the button into "Restart"            */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 4 · Chapter 28</div>
    <h1 class="reveal">Scoring a Whole Table</h1>
    <p class="lead reveal">Batch is the most common deployment, and the trick is not to collect the data to the model. You send the model to the data, as a Spark UDF, and every partition scores in parallel.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — the shape of a batch job */
  { html: `
    <div class="eyebrow reveal">The shape</div>
    <h2 class="reveal">Read, score, write</h2>
    <p class="lead reveal" style="margin-bottom:18px">Every batch inference job is the same three steps, usually run by a scheduled Lakeflow Job.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Read the input table</b>The rows to score, straight from Unity Catalog.</p></div>
      <div class="pill"><p><b>Score with the model</b>Load the registered model and apply it across the DataFrame.</p></div>

    <div class="spacer"></div>` },

  /* 2 — the spark_udf pattern */
  { html: `
    <div class="eyebrow reveal">The core pattern</div>
    <h2 class="reveal">Load the model as a Spark UDF</h2>
    <p class="lead reveal" style="margin-bottom:14px">MLflow wraps any logged model in a UDF, so a single-machine model scores a distributed DataFrame.</p>
    <div class="codeblock reveal"><span class="kw">import</span> mlflow
predict = mlflow.pyfunc.spark_udf(
    spark, model_uri=<span class="st">"models:/prod.ml.churn@champion"</span>)

df.withColumn(<span class="st">"prediction"</span>, predict(*df.columns)) \
  .write.mode(<span class="st">"overwrite"</span>) \
  .saveAsTable(<span class="st">"prod.ml.churn_scores"</span>)</div>
    <div class="spacer"></div>` },

  /* 3 — why it scales */
  { html: `
    <div class="eyebrow reveal">Why it scales</div>
    <h2 class="reveal">A copy per worker, not per row</h2>
    <p class="lead reveal" style="margin-bottom:18px">This is the same vectorized machinery as Chapter 26, applied to a model.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>The model ships to the executors</b>Each worker loads it once and scores its own partitions, so nothing is collected to the driver.</p></div>
      <div class="pill"><p><b>Batches, not rows</b>The UDF is vectorized, so rows are scored in batches over Arrow rather than one at a time.</p></div>
      <div class="pill"><p><b>Throughput follows the cluster</b>More workers means more partitions scored at once, which is what makes batch the high-throughput option.</p></div>

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
</html>
