<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Practice Exam · Databricks DE Associate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     EXAM SHELL - frozen. Do not edit anything in this style block.
     All per-exam customization lives in the EXAM PAYLOAD script section.
  ===================================================================== */
  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;
    --ink-soft:#a7a59f; --ink-faint:#6b6a66; --gold:#e3b84a; --green:#34d3a6; --red:#e8625c;
    --line:rgba(255,255,255,0.08);
    --display:"Fraunces",Georgia,serif; --body:"Hanken Grotesk",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:radial-gradient(1100px 650px at 50% -8%,#1a1d29 0%,transparent 58%),var(--bg);font-family:var(--body);color:var(--ink);min-height:100vh;line-height:1.5;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* sticky top */
  .top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .timer.warn{color:var(--gold);}
  .timer svg{opacity:.7;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  /* intro */
  .intro{text-align:center;margin:auto 0;padding:30px 0;}
  .intro .badge{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px;}
  .intro h1{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.05;letter-spacing:-0.02em;margin-bottom:16px;}
  .intro p{color:var(--ink-soft);font-size:15.5px;max-width:30em;margin:0 auto 14px;}
  .facts{display:flex;justify-content:center;gap:0;margin:24px 0 28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .fact{flex:1;padding:16px 10px;}
  .fact+.fact{border-left:1px solid var(--line);}
  .fact b{display:block;font-family:var(--display);font-size:22px;font-weight:600;color:var(--gold);}
  .fact span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#14110c;font-weight:700;font-size:16px;padding:15px 30px;border-radius:14px;border:none;cursor:pointer;transition:transform .15s ease;font-family:var(--body);}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.35;pointer-events:none;}

  /* question */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .qnum{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:0.04em;}
  .flag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-faint);background:transparent;border:1px solid var(--line);border-radius:100px;padding:5px 12px;cursor:pointer;transition:.15s;font-family:var(--body);}
  .flag.on{color:var(--gold);border-color:var(--gold);background:rgba(227,184,74,0.1);}
  .qtext{font-size:18px;line-height:1.5;font-weight:500;margin-bottom:20px;}
  .qtext code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:5px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);line-height:1.4;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:rgba(255,255,255,0.2);}
  .opt.sel{border-color:var(--gold);background:rgba(227,184,74,0.08);}
  .opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .opt.sel .key{background:var(--gold);color:#14110c;}

  /* review states */
  .opt.correct{border-color:var(--green);background:rgba(52,211,166,0.1);}
  .opt.correct .key{background:var(--green);color:#072018;}
  .opt.incorrect{border-color:var(--red);background:rgba(232,98,92,0.1);}
  .opt.incorrect .key{background:var(--red);color:#2a0a08;}
  .explain{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .explain b{color:var(--ink);}

  /* nav dots */
  .nav-dots{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 4px;justify-content:center;}
  .dot{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-faint);cursor:pointer;transition:.15s;font-family:var(--body);}
  .dot.answered{background:var(--surface-2);color:var(--ink);border-color:rgba(255,255,255,0.18);}
  .dot.current{border-color:var(--gold);color:var(--gold);}
  .dot.flagged{box-shadow:inset 0 0 0 2px rgba(227,184,74,0.5);}

  /* footer nav */
  .foot{display:flex;gap:12px;margin-top:24px;}
  .foot .btn{flex:1;}

  /* results */
  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:140px;height:140px;margin:6px auto 18px;}
  .scorering svg{transform:rotate(-90deg);}
  .scorering .tr{stroke:rgba(255,255,255,0.1);}
  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scorering .ctr b{font-family:var(--display);font-size:38px;font-weight:600;line-height:1;}
  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .verdict{font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:6px;}
  .verdict.pass{color:var(--green);}
  .verdict.fail{color:var(--gold);}
  .res p{color:var(--ink-soft);font-size:14.5px;max-width:28em;margin:0 auto 22px;}
  .res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}
</style>

<div class="app">
  <div class="top">
    <span class="lbl" id="topLbl">Practice Exam</span>
    <span class="timer" id="timer" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6" stroke-linecap="round"/></svg>
      <span id="timerVal">20:00</span>
    </span>
  </div>

<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "ML Practice Exam 4: Full Mock",
  badge: "Databricks Machine Learning Associate",
  blurb: "A full-length mock exam: 48 questions in 90 minutes, one per official objective, matching the real exam's structure. Pick the single best answer.",
  coverage: "All four sections, all 48 official objectives, at the real exam's length and pace.",
  minutes: 90,
  pass: 70          /* our practice target, not an official Databricks cut score */
};

/* Full mock. The real exam is 48 scored questions against 48 published
   objectives, so this maps one question to each. Sections 1 to 3 use a
   fourth distinct scenario set, sharing nothing with Exams 1, 2, or 3. */

const QUESTIONS = [

  /* ---------- SECTION 1: Databricks Machine Learning (18) ---------- */

  /* Obj: Best practices of an MLOps strategy (Ch 31) */
  {
    q:`A production ML system must let any past prediction be explained, and any bad release be reverted quickly. Which combination supports both?`,
    opts:[
      "Frequent retraining on a larger cluster",
      "Storing every model file in a shared workspace folder with descriptive filenames",
      "Versioned code in Git folders, versioned data in Delta, and immutable model versions in Unity Catalog with alias-based promotion",
      "Keeping only the current production model, to avoid confusion between versions"
    ],
    correct:2,
    explain:`Explaining a past prediction needs the code, data, and model version that produced it, and fast reversion needs earlier versions still to exist behind a movable pointer. Keeping only the current model destroys exactly the history both requirements depend on.`
  },

  /* Obj: Advantages of using ML runtimes (Ch 02) */
  {
    q:`Which of these comes preinstalled on Databricks Runtime for Machine Learning but not on the standard Databricks Runtime?`,
    opts:[
      "scikit-learn, XGBoost, MLflow, and the deep learning frameworks",
      "Apache Spark and Delta Lake",
      "Unity Catalog and SQL warehouses",
      "The Databricks CLI and REST API"
    ],
    correct:0,
    explain:`The ML runtime is the standard runtime plus a curated, version-matched ML stack, which is exactly the set of libraries listed. Spark and Delta are part of the standard runtime already, and Unity Catalog and the CLI are platform services rather than runtime libraries.`
  },

  /* Obj: How AutoML facilitates model/feature selection (Ch 03) */
  {
    q:`An AutoML classification run has completed. Which libraries did its candidate models most likely come from?`,
    opts:[
      "Only Spark ML, because AutoML runs on Spark",
      "Open-source libraries such as scikit-learn, XGBoost, and LightGBM",
      "A proprietary Databricks algorithm not available elsewhere",
      "Deep learning frameworks only"
    ],
    correct:1,
    explain:`AutoML trials familiar open-source algorithms, which is part of why its generated code is readable and editable by the team that receives it. A proprietary or deep-learning-only approach would undercut the transparency the glass-box design is built around.`
  },

  /* Obj: Advantages AutoML brings to model development (Ch 03, 04) */
  {
    q:`After a classification AutoML run, a data scientist wants the code for the third-best trial rather than the winner. Where is it?`,
    opts:[
      "It is discarded, since only the winning trial's code is kept",
      "It is imported into the workspace next to the best trial notebook",
      "It must be regenerated by rerunning AutoML over a narrower search",
      "It is retained as an MLflow artifact on that trial's run, rather than being auto-imported into the workspace"
    ],
    correct:3,
    explain:`For classification and regression, the data exploration and best trial notebooks are imported into the workspace while the other trials' notebooks remain available as MLflow artifacts. Nothing is discarded, so there is no need to rerun the search to recover a runner-up.`
  },

  /* Obj: Benefits of feature tables at the account level in UC (Ch 05, 06) */
  {
    q:`A new project needs customer lifetime-value features that another team may already have built. How does Unity Catalog help avoid rebuilding them?`,
    opts:[
      "It generates the features automatically from the underlying source tables",
      "Existing feature tables are discoverable in the catalog and reusable, because they are governed at account level rather than hidden inside one workspace",
      "It copies every feature table into all workspaces when it is created",
      "It blocks the creation of a feature table when a similar one already exists"
    ],
    correct:1,
    explain:`Account-level governance makes feature tables searchable and shareable across workspaces, so the first step is looking for what exists rather than rebuilding it. Unity Catalog neither invents features nor blocks new ones, it simply makes the existing ones findable.`
  },

  /* Obj: Create a feature store table in Unity Catalog (Ch 06) */
  {
    q:`Why does a feature table require a primary key?`,
    opts:[
      "To guarantee that duplicate feature values can never be written",
      "Because Delta tables cannot be created without one",
      "Because features are looked up per entity by that key, both when building a training set and when scoring",
      "To determine the physical file layout of the table on storage"
    ],
    correct:2,
    explain:`The key is the lookup contract: it is how a training set joins features onto labels and how scoring fetches the right entity's values. Ordinary Delta tables need no primary key, so this requirement exists specifically to make feature lookups possible.`
  },

  /* Obj: Write data to a feature store table (Ch 06) */
  {
    q:`Which client is used to create and write feature tables in Unity Catalog?`,
    opts:[
      "<code>FeatureEngineeringClient</code>, from the databricks-feature-engineering package",
      "<code>MlflowClient</code>",
      "The Spark session's catalog interface",
      "The Unity Catalog REST API, which is the only supported route"
    ],
    correct:0,
    explain:`Feature table creation, writing, training-set assembly, and batch scoring all run through the feature engineering client. <code>MlflowClient</code> manages experiments, runs, and registered models, which is a different surface entirely.`
  },

  /* Obj: Train a model with features from a feature store table (Ch 06) */
  {
    q:`Why does <code>create_training_set</code> matter when feature values change over time?`,
    opts:[
      "It always uses the newest feature values, which is what training requires",
      "It prevents the feature table from being updated while training runs",
      "It converts the feature table into a static snapshot table",
      "It can join features point-in-time correctly, so a training row does not see feature values from after its label was known"
    ],
    correct:3,
    explain:`Point-in-time correctness prevents a subtle leak in which a row is trained against feature values that only existed after the outcome occurred. Always taking the newest values is precisely the mistake that causes it, producing a model that looks strong in training and fails in production.`
  },

  /* Obj: Score a model using features from a feature store table (Ch 06) */
  {
    q:`A team scores a feature-store-trained model by recomputing the features inside the scoring job, with slightly different logic from training. What is the risk?`,
    opts:[
      "The job fails, because the model rejects recomputed features",
      "There is no risk, provided the column names match",
      "Training and serving skew: the model receives inputs computed differently from those it learned on, degrading predictions silently",
      "The feature table is overwritten by the scoring job"
    ],
    correct:2,
    explain:`Nothing errors, which is what makes this dangerous: the model happily scores subtly different inputs and quality drifts without any obvious failure. Reading from the same feature table at both training and scoring time is what removes the possibility.`
  },

  /* Obj: Differences between online and offline feature tables (Ch 07) */
  {
    q:`What is the operational cost of introducing an online store alongside an offline feature table?`,
    opts:[
      "There is none, since it replaces the offline table at no extra cost",
      "It is an additional component to provision and keep in sync with the offline table, justified only when real-time lookups are genuinely required",
      "It requires the model to be retrained each time it syncs",
      "It doubles the cost of every training run"
    ],
    correct:1,
    explain:`An online store is an extra managed component with its own sync to maintain, so it earns its place only when per-request millisecond lookups are needed. It supplements rather than replaces the offline table, which remains the source of truth for training.`
  },

  /* Obj: Identify the best run using the MLflow Client API (Ch 11) */
  {
    q:`A call to <code>search_runs</code> specifies <code>order_by</code> on a metric but omits <code>max_results</code>. What happens?`,
    opts:[
      "The call fails, because <code>max_results</code> is required whenever ordering is used",
      "Only the single best run is returned, since ordering implies a limit",
      "The runs come back unordered, because ordering requires a result limit",
      "The runs come back ordered by that metric, and the caller takes the first element to get the best one"
    ],
    correct:3,
    explain:`Ordering and limiting are independent: without a limit you receive the ordered collection and read the first entry. Setting <code>max_results=1</code> is simply a convenience that avoids transferring runs you do not intend to inspect.`
  },

  /* Obj: Manually log metrics, artifacts, and models in an MLflow Run (Ch 08) */
  {
    q:`A training script uses a custom threshold that is not a model hyperparameter but does change the results. How should it be recorded so runs remain comparable?`,
    opts:[
      "Log it with <code>log_param</code> inside the run, so the value sits alongside the run's other inputs",
      "Log it with <code>log_metric</code>, since every number is a metric",
      "Encode it in the notebook's filename",
      "It cannot be recorded, because it is not a model hyperparameter"
    ],
    correct:0,
    explain:`Parameters are the inputs that define a run, whatever their origin, so logging the threshold there lets you compare runs and explain differences later. Metrics are outputs you rank runs by, and a filename is not tracked or queryable.`
  },

  /* Obj: Identify information available in the MLflow UI (Ch 08) */
  {
    q:`An experiment holds hundreds of runs, and a data scientist wants only those where one parameter took a particular value. What does the tracking interface provide?`,
    opts:[
      "Runs can only be browsed in the order they were created",
      "Runs can be searched and filtered by parameter and metric values, and sorted by any logged metric",
      "Filtering is possible only after exporting the runs to a table",
      "Only the ten most recent runs remain queryable"
    ],
    correct:1,
    explain:`Because every run logs parameters and metrics in a consistent shape, the tracking surface supports filtering and sorting over them directly. That is the same capability the client API exposes programmatically through filter strings and ordering.`
  },

  /* Obj: Register a model using the MLflow Client API in the UC registry (Ch 10) */
  {
    q:`A model has just been registered as a new version in Unity Catalog. What is true about its serving status?`,
    opts:[
      "It immediately begins receiving production traffic",
      "It replaces the previous version everywhere that version was loaded",
      "It is stored and versioned, but nothing serves it until an alias or an endpoint points at it",
      "It is automatically assigned the champion alias"
    ],
    correct:2,
    explain:`Registration records a version; promotion is the separate, deliberate act of moving an alias or updating an endpoint. That separation is what makes it safe to register every retrain automatically without disturbing production.`
  },

  /* Obj: Benefits of registering models in the UC registry (Ch 10) */
  {
    q:`A model in the Unity Catalog registry needs an impact analysis: if one of its source tables changes, what downstream work is affected?`,
    opts:[
      "Unity Catalog lineage connects the source tables, the feature tables, and the model, so the dependency chain can be traced",
      "This requires separately maintained documentation, under either registry",
      "The workspace registry provides this, but Unity Catalog does not",
      "Model artifacts embed their source table schemas for exactly this purpose"
    ],
    correct:0,
    explain:`Governing data, features, and models in one catalog is what makes lineage traceable end to end, so impact analysis becomes a query rather than an archaeology exercise. A workspace-local registry has no visibility into the catalog's data lineage at all.`
  },

  /* Obj: Scenarios where promoting code is preferred (Ch 32) */
  {
    q:`Under the deploy models pattern, what is the staging environment's role?`,
    opts:[
      "Staging retrains the model on a subset of the data",
      "Staging is skipped, because the artifact is already final",
      "Staging produces the artifact that production will ultimately use",
      "Staging tests the already-trained artifact before it is promoted into production"
    ],
    correct:3,
    explain:`When the artifact rather than the code is promoted, staging becomes the place that artifact is validated before production accepts it. Retraining in staging describes the deploy code pattern, where the code, not a finished model, is what moves between environments.`
  },

  /* Obj: Set or remove a tag for a model (Ch 10) */
  {
    q:`A serving job must always load whichever version is currently approved for production. Should it reference a tag or an alias, and why?`,
    opts:[
      "A tag, because tags can be attached to a specific version",
      "Either one, since both resolve to a version at load time",
      "An alias, because an alias is a movable pointer that resolves to exactly one version when loaded, whereas a tag only describes",
      "Neither; the job should hardcode the version number"
    ],
    correct:2,
    explain:`Loading is done by alias precisely because an alias resolves to one version and can be moved when a new model is promoted. Tags are descriptive metadata used for filtering and can sit on many versions at once, so they cannot serve as a load target.`
  },

  /* Obj: Promote a challenger to champion using aliases (Ch 10) */
  {
    q:`Can one model version carry more than one alias at the same time?`,
    opts:[
      "No, a version may hold at most one alias",
      "Yes, so a single version can be both <code>champion</code> and, for example, <code>last_validated</code> simultaneously",
      "No, because aliases attach to the registered model rather than to individual versions",
      "Only if all of the aliases are assigned in a single API call"
    ],
    correct:1,
    explain:`Aliases are independent named pointers, so several can reference the same version and each can be moved on its own. That flexibility is what makes champion and challenger workflows, and extra bookkeeping labels, straightforward to express.`
  },

  /* ---------- SECTION 2: Data Processing (9) ---------- */

  /* Obj: Compute summary statistics (Ch 12) */
  {
    q:`On a very large DataFrame, <code>dbutils.data.summarize</code> returns distinct counts and percentiles quickly. What should you know about those figures?`,
    opts:[
      "They are approximate by default for speed, and can be computed precisely when exactness matters",
      "They are always exact, regardless of the dataset's size",
      "They are estimated from the first partition alone",
      "Percentiles are exact but the counts are approximate"
    ],
    correct:0,
    explain:`Approximation is what keeps profiling fast at scale, and the precision can be raised when an exact answer is genuinely needed. The estimates are computed across the data rather than from a single partition, so they remain representative.`
  },

  /* Obj: Remove outliers based on standard deviation or IQR (Ch 13) */
  {
    q:`A sensor column contains a few implausibly high readings caused by a known hardware glitch, but those same rows hold valid values in every other column. What is a reasonable treatment?`,
    opts:[
      "Drop the entire column from the dataset",
      "Leave the values untouched, since outliers must never be modified",
      "Replace the affected rows entirely with column means",
      "Cap the extreme readings at a sensible bound, keeping the rows and their other valid features"
    ],
    correct:3,
    explain:`Capping keeps otherwise-useful rows while stopping known-bad values from dominating the model, which fits a diagnosed measurement error. Dropping the column discards a real signal, and outliers are modified routinely once their cause is understood.`
  },

  /* Obj: Create visualizations for categorical or continuous features (Ch 33) */
  {
    q:`A team wants to see whether advertising spend and revenue move together, and whether that relationship is straight or curved. Which visualization fits?`,
    opts:[
      "Two separate histograms, one for each variable",
      "A scatter plot of one against the other, which shows both the direction and the shape of the relationship",
      "A box plot of revenue on its own",
      "A bar chart of advertising spend by category"
    ],
    correct:1,
    explain:`Only a plot of the pair together reveals whether the relationship is linear, curved, or absent, which a correlation coefficient alone would miss. Separate histograms describe each variable's distribution but say nothing about how they relate.`
  },

  /* Obj: Compare two features using the appropriate method (Ch 34) */
  {
    q:`Two continuous features correlate with each other at 0.97. What is the practical concern?`,
    opts:[
      "One of them must be leaking the target",
      "Neither feature is useful, so both should be removed",
      "They are largely redundant, adding cost and potentially destabilizing a linear model, so keeping one is worth considering",
      "The correlation shows that both features need imputation"
    ],
    correct:2,
    explain:`Two features carrying nearly the same information duplicate cost without adding signal, and near-collinearity makes linear model coefficients unstable. Leakage is about a feature's relationship to the target rather than to another feature, and nothing here concerns missing values.`
  },

  /* Obj: Compare and contrast imputing with mean, median, or mode (Ch 14) */
  {
    q:`A column is 95% null. What is usually the most sensible treatment?`,
    opts:[
      "Impute the missing 95% using the mean of the remaining values",
      "Impute with zero, so the column can be retained",
      "Impute with the median and proceed as normal",
      "Consider dropping the column, since imputing 95% of it would mostly fabricate data"
    ],
    correct:3,
    explain:`When almost everything is missing, any fill value invents the column rather than repairing it, and the 5% that is real carries little signal. Imputation is appropriate for scattered gaps, not for a column that barely exists.`
  },

  /* Obj: Impute missing values with mode, mean, or median (Ch 14) */
  {
    q:`Which strategies does the Spark ML <code>Imputer</code> support for filling numeric nulls?`,
    opts:[
      "Mean, median, and mode",
      "Mean only",
      "Forward fill and backward fill",
      "Interpolation between neighbouring rows"
    ],
    correct:0,
    explain:`The <code>Imputer</code> offers mean, median, and mode, which covers the symmetric, skewed, and most-frequent cases. Forward fill and interpolation assume an ordering between rows that a distributed DataFrame does not guarantee.`
  },

  /* Obj: Use one-hot encoding for categorical features (Ch 15) */
  {
    q:`After <code>StringIndexer</code> and <code>OneHotEncoder</code> run on a four-level category, what does the encoded column hold?`,
    opts:[
      "A single integer between 0 and 3",
      "The original string value, preserved for interpretability",
      "A sparse vector marking which level the row belongs to, with the remaining positions zero",
      "Four separate string columns"
    ],
    correct:2,
    explain:`The encoder expands each index into a vector with one position active, which is what removes any implied ordering between the levels. The single integer is the intermediate output of the indexer, before the one-hot step runs.`
  },

  /* Obj: When one-hot encoding is or is not appropriate (Ch 15) */
  {
    q:`For which combination is one-hot encoding clearly the right choice?`,
    opts:[
      "A 10,000-level identifier column feeding a gradient-boosted tree",
      "A five-level nominal column with no natural order, feeding a logistic regression",
      "An ordered low, medium, high column where the ordering carries meaning",
      "A continuous income column feeding a linear model"
    ],
    correct:1,
    explain:`Low-cardinality nominal categories going into a linear model are the textbook case, since the model reads numbers literally and one-hot prevents any invented ordering. High cardinality explodes the width, ordered levels lose their order, and a continuous column needs no encoding at all.`
  },

  /* Obj: Scenarios where log scale transformation is appropriate (Ch 35) */
  {
    q:`A model trained on a log-transformed target returns a prediction of 11.2. What does that number represent?`,
    opts:[
      "A value on the log scale, which must be exponentiated to give a prediction in the original units",
      "A prediction already expressed in the original units",
      "A probability between 0 and 1 that has been rescaled",
      "An error term rather than a prediction"
    ],
    correct:0,
    explain:`A model trained to predict the log of a quantity emits values on that log scale, so the inverse transform is required before the number means anything to a reader. Reporting 11.2 as if it were currency is precisely the trap this objective targets.`
  },

  /* ---------- SECTION 3: Model Development (15) ---------- */

  /* Obj: Use ML foundations to select the appropriate algorithm (Ch 36) */
  {
    q:`A clinical decision support tool must let doctors see how each input contributed to a recommendation. A deep ensemble scores marginally higher than logistic regression. What should drive the choice?`,
    opts:[
      "The higher score, since predictive accuracy is what matters clinically",
      "Neither model, because regulated clinical use rules out machine learning",
      "The ensemble, because model choice should never be constrained by explainability requirements",
      "The stated interpretability requirement, which a linear model's coefficients satisfy directly and which outweighs a marginal accuracy gain"
    ],
    correct:3,
    explain:`When a scenario states an explainability requirement, that constraint is part of the problem definition rather than a preference to trade away for a small metric gain. Machine learning is widely used in clinical settings, so the constraint shapes the model choice instead of ruling it out.`
  },

  /* Obj: Identify methods to mitigate data imbalance (Ch 37) */
  {
    q:`A trained classifier rarely predicts the rare positive class at the default 0.5 cutoff, and missing positives is expensive. What is the cheapest effective adjustment?`,
    opts:[
      "Retrain the model from scratch on an entirely new dataset",
      "Lower the decision threshold so more cases are flagged positive, trading precision for recall, with no retraining required",
      "Raise the threshold above 0.5 so predictions become more confident",
      "Change the evaluation metric to accuracy"
    ],
    correct:1,
    explain:`The threshold is applied after training, so moving it changes the precision and recall balance immediately and for free. Raising it would predict the rare class even less often, and accuracy is the metric that hides this failure rather than one that addresses it.`
  },

  /* Obj: Compare estimators and transformers (Ch 18) */
  {
    q:`<code>VectorAssembler</code> combines several columns into one vector column. Which kind of stage is it, and why?`,
    opts:[
      "An estimator, because it changes the DataFrame's schema",
      "An estimator, because it must be fit before it can be used",
      "A transformer, because it applies fixed logic and learns nothing from the data",
      "Neither; it is a construct that exists only inside a pipeline"
    ],
    correct:2,
    explain:`The test is whether a stage must see the data before it can act, and concatenating known columns requires no such pass. Changing the schema is not the criterion: <code>StringIndexer</code> also adds a column but must learn the label set first, making it an estimator.`
  },

  /* Obj: Develop a training pipeline (Ch 19) */
  {
    q:`A pipeline of indexer, encoder, assembler, and model has been fit on the training data. How should the test set be scored?`,
    opts:[
      "Call <code>transform</code> on the resulting PipelineModel, which replays every stage exactly as it was fitted",
      "Call <code>fit</code> on the pipeline again, this time using the test data",
      "Run only the assembler stage on the test data, then predict",
      "Rebuild the pipeline using encoders derived from the test data"
    ],
    correct:0,
    explain:`The fitted PipelineModel is a transformer that applies the encoders and the model learned during training, which is what keeps scoring consistent. Fitting anything on the test data relearns those stages from it, which is leakage.`
  },

  /* Obj: Use Hyperopt's fmin operation (Ch 20) */
  {
    q:`Which best describes the <code>space</code> argument passed to <code>fmin</code>?`,
    opts:[
      "A list of the exact hyperparameter combinations to evaluate",
      "The number of trials the search should run",
      "A trained model whose parameters will be adjusted in place",
      "A dictionary mapping hyperparameters to distributions or choices, defining the range of legal values"
    ],
    correct:3,
    explain:`The search space declares what values are permissible, using distributions such as uniform, loguniform, quniform, and choice, and the algorithm samples within it. An explicit list of combinations is a grid, and the trial count is <code>max_evals</code>.`
  },

  /* Obj: Perform random, grid, or Bayesian search (Ch 21) */
  {
    q:`Two hyperparameters each have three sensible values, models fit in seconds, and the team needs reproducible and complete coverage. Which search fits?`,
    opts:[
      "Bayesian search, as the most sophisticated option available",
      "Random search with 500 trials, for thorough coverage",
      "Grid search: nine combinations is cheap to run exhaustively and repeats identically every time",
      "No search; tune the two values by hand, one at a time"
    ],
    correct:2,
    explain:`A nine-point space is small enough to enumerate completely and cheaply, which satisfies both the coverage and reproducibility requirements. Adaptive search buys nothing on a space this small, and 500 random draws would mostly revisit the same nine settings.`
  },

  /* Obj: Parallelize single node models for hyperparameter tuning (Ch 22) */
  {
    q:`A team sets <code>SparkTrials</code> parallelism equal to <code>max_evals</code>, so every trial runs at once. What is the downside?`,
    opts:[
      "Every trial is proposed before any result is known, so the adaptive search cannot learn from completed trials",
      "The search fails, because parallelism may not equal <code>max_evals</code>",
      "The results become non-deterministic and therefore invalid",
      "Each individual model trains more slowly on the cluster"
    ],
    correct:0,
    explain:`Bayesian search improves by conditioning each proposal on finished trials, so running everything simultaneously reduces it to a random search of the same size. The run still completes and each fit is no slower; what is lost is the adaptivity.`
  },

  /* Obj: Benefits and downsides of cross-validation (Ch 23) */
  {
    q:`When is cross-validation most worth its additional cost compared with a single train-validation split?`,
    opts:[
      "When the dataset has tens of millions of rows and each fit takes hours",
      "When the dataset is small, so a single validation slice would give a noisy and unreliable estimate",
      "When only one hyperparameter setting is being evaluated",
      "When the test set has already been used during tuning"
    ],
    correct:1,
    explain:`On a small dataset the estimate from one arbitrary slice swings considerably, so averaging across folds buys real confidence for modest compute. With tens of millions of rows a single holdout is already representative, making k times the fits poor value.`
  },

  /* Obj: Perform cross-validation as part of model fitting (Ch 23) */
  {
    q:`After a <code>CrossValidator</code> completes its search, what does the model it returns represent?`,
    opts:[
      "The individual fold model that scored best on its own fold",
      "An average of the parameters of all the fold models",
      "The first fold's model, retained as representative of the rest",
      "The best hyperparameter setting, refit on the full training data"
    ],
    correct:3,
    explain:`The folds exist to compare settings, and once a winner is identified it is refit on all the training data so the shipped model learns from everything available. Each fold model saw only part of the data, so keeping one of them would waste the rest.`
  },

  /* Obj: Identify the number of models trained (Ch 24) */
  {
    q:`A grid of 12 combinations is evaluated with <code>TrainValidationSplit</code> rather than a 4-fold <code>CrossValidator</code>. How many fits does the search perform?`,
    opts:[
      "12, because a single validation split fits each combination exactly once",
      "48, the same as 4-fold cross-validation would require",
      "3, the combinations divided by the number of folds",
      "16, the combinations plus the folds"
    ],
    correct:0,
    explain:`A single holdout has no fold multiplier, so the search costs one fit per combination. That four-times saving against 4-fold cross-validation is exactly the compute-versus-confidence trade between the two approaches.`
  },

  /* Obj: Use common classification metrics (Ch 17) */
  {
    q:`A team needs one number balancing precision and recall for an imbalanced classifier. Which metric and evaluator?`,
    opts:[
      "Accuracy, from <code>BinaryClassificationEvaluator</code>",
      "RMSE, from <code>RegressionEvaluator</code>",
      "F1, from <code>MulticlassClassificationEvaluator</code>",
      "R-squared, from <code>MulticlassClassificationEvaluator</code>"
    ],
    correct:2,
    explain:`F1 is the harmonic mean of precision and recall, which is exactly the single balanced figure described, and Spark exposes it through the multiclass evaluator. RMSE and R-squared are regression metrics, and accuracy is the measure that imbalance renders misleading.`
  },

  /* Obj: Use common regression metrics (Ch 17) */
  {
    q:`A regression model reports an R-squared of 0.82. What does that mean?`,
    opts:[
      "Predictions are off by 0.82 units on average",
      "82% of predictions are exactly correct",
      "The model's RMSE is 0.82",
      "About 82% of the variance in the target is explained by the model"
    ],
    correct:3,
    explain:`R-squared is the proportion of the target's variance the model accounts for, which is why it is unitless and comparable across problems. Average error in the target's own units is MAE or RMSE, which are different quantities entirely.`
  },

  /* Obj: Choose the most appropriate metric for a scenario (Ch 17) */
  {
    q:`A defect classifier reports 99.4% accuracy on data where 99.4% of items are non-defective. What should the team conclude?`,
    opts:[
      "The model performs excellently and is ready to deploy",
      "Accuracy is uninformative here, since always predicting non-defective scores identically; use precision, recall, F1, or AUC instead",
      "The accuracy figure must have been computed incorrectly",
      "The dataset needs additional non-defective examples"
    ],
    correct:1,
    explain:`Matching the majority class rate means the score is consistent with a model that never detects a defect at all, so it reveals nothing about the class that matters. Metrics that separate performance on the rare class are what expose whether anything is being learned.`
  },

  /* Obj: Exponentiate log-transformed variables (Ch 35) */
  {
    q:`A stakeholder asks for the predicted revenue for a specific customer, from a model trained on log revenue. What must happen before answering?`,
    opts:[
      "Report the raw model output, which is already in revenue units",
      "Multiply the output by the dataset's mean revenue",
      "Exponentiate the prediction using the inverse of the transform applied, returning it to revenue units",
      "Report the output as a percentage instead"
    ],
    correct:2,
    explain:`The model predicts on the log scale, so only the matching inverse transform recovers a figure in currency. Reporting the raw value or rescaling it by a mean would give a number that is confidently and badly wrong.`
  },

  /* Obj: Assess model complexity and the bias-variance tradeoff (Ch 38) */
  {
    q:`A model scores poorly on both the training and the validation sets, and the two scores sit close together. What does this indicate and what helps?`,
    opts:[
      "Underfitting with high bias; add complexity, engineer better features, or reduce regularization",
      "Overfitting; simplify the model and increase regularization",
      "A data leak in the validation split",
      "The evaluation metric is inappropriate for the task"
    ],
    correct:0,
    explain:`Weak performance even on data the model has already seen, with little gap to validation, means the model cannot represent the pattern at all. Overfitting shows the opposite signature, a strong training score beside a much weaker validation one.`
  },

  /* ---------- SECTION 4: Model Deployment (6) ---------- */

  /* Obj: Differences and advantages of batch, realtime, and streaming serving (Ch 27) */
  {
    q:`A pricing engine must return a price while a customer waits on a web page, using inputs that only exist at the moment of the request. Which serving approach fits?`,
    opts:[
      "Batch inference, scoring every customer nightly into a table the page reads",
      "Real-time serving behind an endpoint, since the caller blocks on a per-request prediction whose input is not known in advance",
      "Streaming inference, writing prices to a sink that the page polls",
      "Any of the three, since they differ only in cost"
    ],
    correct:1,
    explain:`Two signals point the same way: the input does not exist until the request arrives, and a caller is waiting on the answer. Batch cannot precompute a score for an input that did not exist, and a streaming sink produces results asynchronously rather than answering the blocked request.`
  },

  /* Obj: Deploy a custom model to a model endpoint (Ch 30) */
  {
    q:`A team has a custom Python model logged to MLflow and registered in Unity Catalog. How do they expose it for real-time inference?`,
    opts:[
      "Copy the model files onto a web server and write a small Flask application",
      "Schedule a Lakeflow Job that writes predictions to a table every minute",
      "Publish the model into an online feature store",
      "Create a Model Serving endpoint that serves that registered model version, giving a managed, autoscaling REST API"
    ],
    correct:3,
    explain:`Model Serving takes a registered model version and provisions the serverless endpoint behind it, so no infrastructure is hand-built. A one-minute batch job is not real time, and an online store holds features rather than serving model predictions.`
  },

  /* Obj: Use pandas to perform batch inference (Ch 28) */
  {
    q:`A model logged with MLflow must score a very large Spark DataFrame. Which approach applies it in parallel across the cluster?`,
    opts:[
      "Load it with <code>mlflow.pyfunc.spark_udf</code> and apply the returned UDF to the DataFrame, so every partition is scored in parallel",
      "Collect the DataFrame to the driver with <code>toPandas</code> and call <code>predict</code> once",
      "Loop over the rows, calling <code>predict</code> for each one",
      "Send each row individually to a real-time serving endpoint"
    ],
    correct:0,
    explain:`<code>spark_udf</code> ships the model to the executors and scores batches of rows on each partition, which is what makes very large tables feasible. Collecting to the driver puts the whole dataset on one machine, and per-row calls discard the vectorization that makes this fast.`
  },

  /* Obj: How streaming inference is performed (Ch 29) */
  {
    q:`A team wants predictions produced continuously as records arrive, managed as declared tables rather than hand-operated streaming queries. What describes this?`,
    opts:[
      "A scheduled batch job that runs every few hours",
      "A Model Serving endpoint polled on a timer",
      "Streaming inference in a declarative pipeline, where the model is applied as a transformation on a streaming table (Lakeflow Spark Declarative Pipelines, the product formerly called Delta Live Tables)",
      "An AutoML forecasting run"
    ],
    correct:2,
    explain:`Declaring a streaming table whose transformation applies the model gives continuous scoring with orchestration, retries, and checkpoints handled for you. A scheduled batch job is not continuous, and polling an endpoint on a timer inverts the request-response model serving is designed for.`
  },

  /* Obj: Deploy and query a model for realtime inference (Ch 30) */
  {
    q:`An application needs a prediction from a deployed Model Serving endpoint. How does it obtain one?`,
    opts:[
      "By reading a Delta table that the endpoint writes its predictions into",
      "By submitting a Spark job that loads the model from the registry",
      "By attaching to the serving cluster and calling <code>predict</code> locally",
      "By sending an HTTP request containing the input records to the endpoint's URL and reading the prediction from the response"
    ],
    correct:3,
    explain:`A serving endpoint is a REST API, so querying it means posting the inputs and receiving the scored response synchronously. Reading a table is the batch pattern, and the whole point of a managed endpoint is that there is no cluster for the caller to attach to.`
  },

  /* Obj: Split data between endpoints for realtime inference (Ch 30) */
  {
    q:`A team wants 90% of live traffic served by the proven model and 10% by a new version, so the two can be compared under real load. What supports this?`,
    opts:[
      "Deploying two separate endpoints and asking client applications to choose between them at random",
      "Configuring traffic splitting on the serving endpoint, routing a set percentage of requests to each served model version",
      "Alternating the champion alias between the two versions every few minutes",
      "Running both models in a nightly batch job and comparing the outputs"
    ],
    correct:1,
    explain:`An endpoint can serve several model versions at once with a percentage of traffic assigned to each, which is the built-in mechanism for staged rollouts and A/B comparison. Pushing the split into client code duplicates infrastructure, and flapping an alias gives an inconsistent, unmeasurable experience.`
  }
];

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

let state = { screen:"intro", i:0, answers:Array(QUESTIONS.length).fill(null), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a!==null).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i]===j?'sel':''}" data-j="${j}">
          <span class="key">${"ABCD"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j]!==null) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{ state.answers[i] = Number(el.dataset.j); render(); setProgress(); };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a===null).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(state.answers[idx]===Q.correct) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], ok=mine===Q.correct;
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(j===Q.correct) cls+=" correct";
          else if(j===mine) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCD"[j]}</span><span>${o}${j===mine?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:Array(QUESTIONS.length).fill(null), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
