<style>
  /* =====================================================================
     EXAM SHELL - frozen. Do not edit anything in this style block.

  ===================================================================== */
  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;
    --ink-soft:#a7a59f; --ink-faint:#6b6a66; --gold:#e3b84a; --green:#34d3a6; --red:#e8625c;
    --line:rgba(255,255,255,0.08);
    --display:"Fraunces",Georgia,serif; --body:"Hanken Grotesk",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:radial-gradient(1100px 650px at 50% -8%,#1a1d29 0%,transparent 58%),var(--bg);font-family:var(--body);color:var(--ink);min-height:100vh;line-height:1.5;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* sticky top */
  .top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .timer.warn{color:var(--gold);}
  .timer svg{opacity:.7;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  /* intro */
  .intro{text-align:center;margin:auto 0;padding:30px 0;}
  .intro .badge{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px;}
  .intro h1{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.05;letter-spacing:-0.02em;margin-bottom:16px;}
  .intro p{color:var(--ink-soft);font-size:15.5px;max-width:30em;margin:0 auto 14px;}
  .facts{display:flex;justify-content:center;gap:0;margin:24px 0 28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .fact{flex:1;padding:16px 10px;}
  .fact+.fact{border-left:1px solid var(--line);}
  .fact b{display:block;font-family:var(--display);font-size:22px;font-weight:600;color:var(--gold);}
  .fact span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#14110c;font-weight:700;font-size:16px;padding:15px 30px;border-radius:14px;border:none;cursor:pointer;transition:transform .15s ease;font-family:var(--body);}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.35;pointer-events:none;}

  /* question */
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .qnum{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:0.04em;}
  .flag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-faint);background:transparent;border:1px solid var(--line);border-radius:100px;padding:5px 12px;cursor:pointer;transition:.15s;font-family:var(--body);}
  .flag.on{color:var(--gold);border-color:var(--gold);background:rgba(227,184,74,0.1);}
  .qtext{font-size:18px;line-height:1.5;font-weight:500;margin-bottom:20px;}
  .qtext code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:5px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);line-height:1.4;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:rgba(255,255,255,0.2);}
  .opt.sel{border-color:var(--gold);background:rgba(227,184,74,0.08);}
  .opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .opt.sel .key{background:var(--gold);color:#14110c;}

  /* review states */
  .opt.correct{border-color:var(--green);background:rgba(52,211,166,0.1);}
  .opt.correct .key{background:var(--green);color:#072018;}
  .opt.incorrect{border-color:var(--red);background:rgba(232,98,92,0.1);}
  .opt.incorrect .key{background:var(--red);color:#2a0a08;}
  .explain{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .explain b{color:var(--ink);}

  /* nav dots */
  .nav-dots{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 4px;justify-content:center;}
  .dot{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-faint);cursor:pointer;transition:.15s;font-family:var(--body);}
  .dot.answered{background:var(--surface-2);color:var(--ink);border-color:rgba(255,255,255,0.18);}
  .dot.current{border-color:var(--gold);color:var(--gold);}
  .dot.flagged{box-shadow:inset 0 0 0 2px rgba(227,184,74,0.5);}

  /* footer nav */
  .foot{display:flex;gap:12px;margin-top:24px;}
  .foot .btn{flex:1;}

  /* results */
  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:140px;height:140px;margin:6px auto 18px;}
  .scorering svg{transform:rotate(-90deg);}
  .scorering .tr{stroke:rgba(255,255,255,0.1);}
  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scorering .ctr b{font-family:var(--display);font-size:38px;font-weight:600;line-height:1;}
  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .verdict{font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:6px;}
  .verdict.pass{color:var(--green);}
  .verdict.fail{color:var(--gold);}
  .res p{color:var(--ink-soft);font-size:14.5px;max-width:28em;margin:0 auto 22px;}
  .res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}

<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "ML Practice Exam 2",
  badge: "Databricks Machine Learning Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer.",
  coverage: "Sections 1 and 2: Databricks Machine Learning, Data Processing. One question per official objective, all 27.",
  minutes: 54,
  pass: 70          /* our practice target, not an official Databricks cut score */
};

/* Section 1 objectives reappear here with entirely new scenarios, so this
   exam tests the same objectives without replaying Practice Exam 1. */

const QUESTIONS = [

  /* ---------- SECTION 1: Databricks Machine Learning (18) ---------- */

  /* Obj: Identify the best practices of an MLOps strategy (Ch 31) */
  {
    q:`A churn model deployed six months ago still scores well when re-evaluated on its original test set, but the business outcomes it drives have clearly degraded. Which MLOps practice would have surfaced this earliest?`,
    opts:[
      "Increasing the number of cross-validation folds during the original training",
      "Applying more descriptive tags to the registered model",
      "Monitoring incoming feature drift and live prediction quality, with a defined trigger for retraining",
      "Retraining weekly on the same historical training set"
    ],
    correct:2,
    explain:`A model degrades because the world moves, not because the frozen test set changed, so only monitoring live inputs and outcomes reveals it. More folds improves the original estimate but says nothing about later drift, and retraining on unchanged historical data reproduces the same stale model.`
  },

  /* Obj: Identify the advantages of using ML runtimes (Ch 02) */
  {
    q:`A team is beginning deep learning work and wants GPU training without hand-installing NVIDIA drivers and CUDA libraries on every cluster. What should they select?`,
    opts:[
      "The GPU variant of Databricks Runtime for Machine Learning, which ships the drivers and CUDA libraries preinstalled",
      "The standard Databricks Runtime, adding the drivers through an init script",
      "The CPU variant of the ML runtime, since it also includes the deep learning frameworks",
      "Any GPU cluster on the standard runtime, because drivers are always included there"
    ],
    correct:0,
    explain:`The GPU ML runtime exists precisely to remove that setup: drivers and CUDA arrive preinstalled and version-matched with the frameworks. The CPU ML runtime does include the frameworks but cannot use a GPU, and the standard runtime leaves the driver problem to you.`
  },

  /* Obj: Identify how AutoML facilitates model/feature selection (Ch 03) */
  {
    q:`A team wants AutoML to help choose a model for weekly demand forecasting, and to make use of feature tables they have already curated. Which statement is correct?`,
    opts:[
      "AutoML supports classification and regression only, so forecasting must be built by hand",
      "AutoML can forecast, but it cannot read existing feature tables",
      "AutoML requires every feature to be recomputed inside the AutoML run itself",
      "AutoML covers forecasting alongside classification and regression, and can pull in existing feature tables to augment the training data"
    ],
    correct:3,
    explain:`Forecasting is a first-class AutoML task next to classification and regression, and AutoML can draw on existing feature tables rather than forcing you to rebuild features. Treating it as classification-only, or as unable to reuse curated features, understates what it does.`
  },

  /* Obj: Identify the advantages AutoML brings to model development (Ch 03, 04) */
  {
    q:`An AutoML run has finished and a data scientist wants the shortest path from that result to a model they can refine themselves. What does AutoML hand them?`,
    opts:[
      "A locked best model that can be deployed but not modified",
      "A ranked experiment of trials plus an imported best trial notebook holding the winning pipeline's code, ready to edit and rerun",
      "Aggregate metrics only, from which the pipeline must be rewritten",
      "A single notebook with every trial's code merged into one file"
    ],
    correct:1,
    explain:`The leaderboard ranks the trials and the best trial notebook is imported into the workspace as real, editable code, so refining means opening it and changing a step. Nothing is locked, and the trials stay separate rather than being merged into one file.`
  },

  /* Obj: Benefits of feature tables at the account level in UC vs workspace level (Ch 05, 06) */
  {
    q:`An auditor asks which source tables fed the features used by a model now running in production. Why does holding feature tables in Unity Catalog make that answerable?`,
    opts:[
      "Unity Catalog stores a written description of each feature that the author supplies",
      "Workspace-level feature tables track the same lineage, so either arrangement would answer it",
      "Because data, features, and models are governed in one catalog, lineage links the model back through its features to the source tables",
      "The model artifact itself embeds a copy of the source tables"
    ],
    correct:2,
    explain:`Shared governance is what makes lineage traceable end to end: the model, its feature tables, and the underlying data are all objects in the same catalog. Author-written descriptions are documentation rather than lineage, and workspace-local tables are exactly the fragmented arrangement this replaces.`
  },

  /* Obj: Create a feature store table in Unity Catalog (Ch 06) */
  {
    q:`A team already has a Delta table in Unity Catalog holding per-device aggregates, and wants to use it as a feature table without copying the data anywhere. What is needed?`,
    opts:[
      "Export the data and re-import it through the feature engineering client",
      "Convert it into a managed table inside a dedicated feature schema",
      "Nothing at all, since every Unity Catalog table is usable as a feature table",
      "Ensure the table has a primary key constraint, because a Unity Catalog Delta table with a primary key can serve as a feature table"
    ],
    correct:3,
    explain:`Feature tables are not a separate storage format: a governed Delta table qualifies once it has the primary key that lookups depend on. No copy or re-import is required, but the key is not optional, so a table without one cannot serve feature lookups.`
  },

  /* Obj: Write data to a feature store table (Ch 06) */
  {
    q:`New feature columns must be added to an existing feature table that several models already read. What is the appropriate approach?`,
    opts:[
      "Write the updated DataFrame including the new columns to the existing feature table; existing consumers continue reading only the features they look up",
      "Create a second feature table and require every model to join both",
      "Drop the feature table and recreate it with the new schema",
      "Add the columns to the online store only, leaving the offline table unchanged"
    ],
    correct:0,
    explain:`Writing the wider DataFrame to the same table adds the columns while leaving existing lookups untouched, since each model requests the features it named. Dropping and recreating destroys lineage and grants, and splitting into a second table pushes needless joins onto every consumer.`
  },

  /* Obj: Train a model with features from a feature store table (Ch 06) */
  {
    q:`A training set must combine features from two different feature tables, each keyed on a different column, joined onto a labels DataFrame. What supports this?`,
    opts:[
      "Only one feature table may be used per training set",
      "Provide multiple <code>FeatureLookup</code> entries, one per table with its own lookup key, to <code>create_training_set</code>",
      "Union the two feature tables first, then use a single lookup",
      "Join both tables manually, because <code>create_training_set</code> accepts only one lookup"
    ],
    correct:1,
    explain:`Feature lookups are a list, so several tables with different keys can be joined into one training set and all of their metadata is recorded on the model. Unioning tables with different keys and schemas is not meaningful, and there is no one-table limit to work around.`
  },

  /* Obj: Score a model using features from a feature store table (Ch 06) */
  {
    q:`Why does scoring through <code>score_batch</code> reduce the risk of training and serving skew?`,
    opts:[
      "It retrains the model on the scoring data before predicting",
      "It caches the training data and reuses those values at scoring time",
      "It recomputes the features from raw data using the original training notebook",
      "It reads feature values from the same feature table the model was trained against, so the two definitions cannot drift apart"
    ],
    correct:3,
    explain:`Skew arises when training and serving compute features differently, and reading both from one governed table removes that possibility entirely. It does not retrain, and reusing cached training values would give stale rather than current features.`
  },

  /* Obj: Describe the differences between online and offline feature tables (Ch 07) */
  {
    q:`A team is assembling a training set from three years of historical features across millions of entities. Do they need an online store?`,
    opts:[
      "Yes, because online stores are faster in every access pattern",
      "Yes, because training sets can only be built from online stores",
      "No: training reads features in bulk, which is exactly what the offline Delta table is built for",
      "No, because feature tables cannot be used for training at all"
    ],
    correct:2,
    explain:`A large historical join is a high-throughput bulk read, the pattern the offline Delta table is optimized for, so no online store is involved. Online stores optimize single-entity lookups for real-time serving, which is the opposite workload.`
  },

  /* Obj: Identify the best run using the MLflow Client API (Ch 11) */
  {
    q:`An automated job must select the best run, but only from runs that finished successfully and whose validation RMSE is below 0.5. How should <code>search_runs</code> be called?`,
    opts:[
      "Pass a <code>filter_string</code> restricting the status and the metric, together with <code>order_by</code> on that metric",
      "Retrieve every run and filter them in pandas after collecting to the driver",
      "Use <code>order_by</code> alone, since <code>search_runs</code> cannot filter",
      "Use a <code>filter_string</code> combining the two conditions with <code>OR</code>"
    ],
    correct:0,
    explain:`<code>search_runs</code> filters server-side with a filter string and orders by a metric in the same call, which is both correct and cheap. Filtering after collecting works but pulls every run to the driver needlessly, and the filter syntax joins expressions with AND rather than OR.`
  },

  /* Obj: Manually log metrics, artifacts, and models in an MLflow Run (Ch 08) */
  {
    q:`A custom Python model wrapper is not covered by autologging. How should it be recorded so it can later be registered and served?`,
    opts:[
      "Save it to a volume and record the file path as a run parameter",
      "Log it as a model within the run using the appropriate MLflow <code>log_model</code> call, making it a versioned artifact of that run",
      "Log its accuracy as a metric, from which the model can be inferred",
      "Attach it to the run as a tag"
    ],
    correct:1,
    explain:`Logging it as a model produces a proper MLflow model with its flavors and dependencies, which is the form registration and serving both expect. A path recorded as a parameter is just text, and metrics and tags carry values rather than model artifacts.`
  },

  /* Obj: Identify information available in the MLflow UI (Ch 08) */
  {
    q:`Two runs in the same experiment produced noticeably different results, and a data scientist wants to see which settings differed. What does the MLflow UI allow?`,
    opts:[
      "Viewing one run at a time only; any comparison requires exporting to a notebook",
      "Viewing the logged model files but not the parameter values",
      "Selecting the runs and comparing them side by side, showing the parameters and metrics each one logged",
      "Viewing metrics only, since parameters are discarded once a run completes"
    ],
    correct:2,
    explain:`Side-by-side comparison of runs is a core tracking feature, and it lines up the logged parameters and metrics so differences are immediately visible. Parameters are retained with the run permanently, which is what makes a result reproducible.`
  },

  /* Obj: Register a model using the MLflow Client API in the UC registry (Ch 10) */
  {
    q:`A nightly job registers the freshly retrained model under <code>prod.ml.demand</code> every night. After a month, what does the registry hold?`,
    opts:[
      "One model with only the latest version, since each registration overwrites the previous one",
      "About thirty separate registered models, one per night",
      "One model with a single version that has been updated about thirty times",
      "One registered model with about thirty immutable versions, any of which can be loaded or rolled back to"
    ],
    correct:3,
    explain:`Registering under an existing name appends a new immutable version each time, which is what preserves history and makes rollback a matter of pointing an alias at an earlier version. Nothing is overwritten, and the name stays a single registered model rather than multiplying.`
  },

  /* Obj: Benefits of registering models in the UC registry over the workspace registry (Ch 10) */
  {
    q:`A model registered from the data science workspace must be served from a separate production workspace. Why does the Unity Catalog registry help here?`,
    opts:[
      "The model is registered once under a three-level name in a shared metastore and is reachable from any workspace that is permitted",
      "The workspace registry replicates models between workspaces automatically",
      "Models must be exported and re-registered in the target workspace under either registry",
      "Cross-workspace access requires copying the model files by hand"
    ],
    correct:0,
    explain:`Unity Catalog spans workspaces, so one registration under <code>catalog.schema.model</code> is visible wherever permissions allow, with no copying or re-registration. Workspace-local registries are exactly what forces export and re-import between environments.`
  },

  /* Obj: Scenarios where promoting code is preferred over promoting models (Ch 32) */
  {
    q:`A model requires three weeks of training on specialized hardware and the run cannot practically be reproduced in each environment. Which pattern applies, and what is its status?`,
    opts:[
      "Deploy code, since promoting code is required regardless of training cost",
      "Deploy models: train once, test the artifact in staging, and promote it, which Databricks reserves for cases like prohibitively expensive or hard-to-reproduce training",
      "Deploy models, because promoting artifacts is the recommended default for all workloads",
      "Neither, because such models cannot be promoted to production"
    ],
    correct:1,
    explain:`This is the documented exception: when retraining per environment is impractical, the artifact is promoted and staging tests it instead. The status matters, though, since deploy code remains the recommended default and deploy models is the narrow case, not the norm.`
  },

  /* Obj: Set or remove a tag for a model (Ch 10) */
  {
    q:`A model carries the tag <code>review_status=pending</code>, but the review is now finished and the label no longer applies. What is correct, and how does a tag differ from an alias?`,
    opts:[
      "Reassign an alias named pending to a different version",
      "Delete the model version in order to clear its tags",
      "Delete the tag from the model; a tag describes and is used for filtering, while an alias points at a specific version to load",
      "Tags cannot be removed once set, so add a second tag recording completion"
    ],
    correct:2,
    explain:`Tags are mutable key-value metadata that can be set and deleted freely, and removing an obsolete one keeps the catalog honest. The distinction matters: an alias selects which version consumers load, whereas a tag only describes, so the two are not interchangeable.`
  },

  /* Obj: Promote a challenger model to a champion model using aliases (Ch 10) */
  {
    q:`A team wants most traffic served by the proven model while a new version is evaluated on a small slice. How do aliases support that?`,
    opts:[
      "Assign <code>champion</code> to the proven version and <code>challenger</code> to the new one, then route traffic by alias",
      "Aliases are limited to one per model, so this needs two separate registered models",
      "Move the new version into the Staging stage and split traffic by stage",
      "Rename the versions to champion and challenger"
    ],
    correct:0,
    explain:`A registered model can carry several aliases at once, so champion and challenger naturally express a staged rollout and promotion is just moving an alias. Stages belong to the legacy workspace registry, and versions are numbered rather than renamed.`
  },

  /* ---------- SECTION 2: Data Processing (9) ---------- */

  /* Obj: Compute summary statistics using .summary() or dbutils data summaries (Ch 12) */
  {
    q:`A data scientist needs per-column count, mean, standard deviation, min, max, and quartiles for a large Spark DataFrame, plus null and distinct counts and a per-column distribution view, in a single step. What provides all of it?`,
    opts:[
      "<code>df.count()</code>, followed by inspecting a sample of rows by hand",
      "<code>df.summary()</code> alone, which also renders histograms",
      "A separate <code>groupBy</code> aggregation for each column in turn",
      "<code>dbutils.data.summarize(df)</code>, or the Data Profile tab of <code>display(df)</code>, which produce summary statistics, null and distinct counts, and per-column histograms"
    ],
    correct:3,
    explain:`The Databricks data profile is the one-step option, combining the statistics <code>summary()</code> gives with null and distinct counts and histograms. <code>summary()</code> alone returns the numeric statistics without the distribution view, and a row count says almost nothing about the data.`
  },

  /* Obj: Remove outliers based on standard deviation or IQR (Ch 13) */
  {
    q:`A numeric column has a first quartile of 15 and a third quartile of 35. Under the 1.5 x IQR rule, which values are flagged as low outliers?`,
    opts:[
      "Anything below 15, the first quartile itself",
      "Anything below -15, that is Q1 minus 1.5 x IQR where the IQR is 20",
      "Anything below 5, that is Q1 minus half the IQR",
      "Anything below -5, that is Q1 minus the IQR"
    ],
    correct:1,
    explain:`The IQR is 35 minus 15, so 20, and the lower fence sits at Q1 minus 1.5 times that, giving 15 minus 30 equals -15. The quartile itself is not a fence, and the rule multiplies the IQR by 1.5 rather than by 1 or 0.5.`
  },

  /* Obj: Create visualizations for categorical or continuous features (Ch 33) */
  {
    q:`A data scientist must check whether a continuous <code>session_duration</code> column is skewed and whether extreme values are present. Which choice fits?`,
    opts:[
      "A bar chart of counts with one bar per distinct duration value",
      "A pie chart of duration ranges",
      "A histogram to show the shape of the distribution, plus a box plot to show the quartiles and flag outliers",
      "A contingency table of duration against itself"
    ],
    correct:2,
    explain:`The histogram exposes skew by revealing the distribution's shape, and the box plot marks quartiles and points beyond the whiskers, answering both questions. Bar and pie charts count discrete categories and would produce thousands of meaningless slices across continuous durations.`
  },

  /* Obj: Compare two categorical or two continuous features (Ch 34) */
  {
    q:`A team wants to know whether two categorical columns, <code>channel</code> and <code>converted</code>, are related. Which method is appropriate?`,
    opts:[
      "Build a contingency table of co-occurrence counts, optionally testing independence with a chi-square test",
      "Compute the Pearson correlation between the two columns",
      "Plot a separate histogram of each column",
      "Compute the mean of each column and compare the two numbers"
    ],
    correct:0,
    explain:`Categorical values have no numeric order, so the relationship shows up in how often each combination co-occurs, which a contingency table captures and chi-square tests formally. Correlation and means both require ordered numeric values, and separate histograms describe each column alone rather than their relationship.`
  },

  /* Obj: Compare and contrast imputing with mean, median, or mode (Ch 14) */
  {
    q:`A right-skewed numeric column with several very large values has missing entries. Compared with the mean, why is the median often the better fill value?`,
    opts:[
      "The median is faster to compute across a large dataset",
      "The mean is pulled toward the extreme values and so misrepresents a typical row, while the median is not",
      "The median reproduces the column's original variance exactly",
      "The mean cannot be computed at all when nulls are present"
    ],
    correct:1,
    explain:`On a skewed column the mean drifts toward the long tail, so filling with it inserts values that are unlike most rows, whereas the middle value stays representative. Computing a median is in fact more work than a mean, and neither statistic preserves the original variance.`
  },

  /* Obj: Impute missing values with mode, mean, or median (Ch 14) */
  {
    q:`A pipeline must fill nulls in two numeric columns with each column's median, as a stage that is fit on the training data and then applied to validation and test. What fits?`,
    opts:[
      "A SQL statement replacing nulls with a hardcoded constant",
      "Dropping the affected rows, since Spark ML cannot impute",
      "Computing the medians over the full dataset and substituting those literal values",
      "A Spark ML <code>Imputer</code> with its strategy set to median, fit on the training data and applied downstream"
    ],
    correct:3,
    explain:`The <code>Imputer</code> is an estimator, so fitting it on the training split learns each column's median and applying it fills the other splits with those same learned values. Computing medians across the full dataset leaks test information into training, and a hardcoded constant is not a median at all.`
  },

  /* Obj: Use one-hot encoding for categorical features (Ch 15) */
  {
    q:`A <code>payment_method</code> column holds five string values and will feed a logistic regression. What is the correct Spark ML sequence?`,
    opts:[
      "Pass the string column straight to the estimator",
      "Apply <code>OneHotEncoder</code> directly to the string column",
      "Apply <code>StringIndexer</code> to turn the strings into indices, then <code>OneHotEncoder</code> to expand those indices into binary vectors",
      "Apply <code>VectorAssembler</code> to the string column and then the estimator"
    ],
    correct:2,
    explain:`Spark ML one-hot encoding is a two-step chain because <code>OneHotEncoder</code> expands numeric indices rather than raw strings, so the indexer must run first. Estimators cannot consume raw strings, and <code>VectorAssembler</code> only gathers already-numeric columns into a vector.`
  },

  /* Obj: When one-hot encoding is or is not appropriate (Ch 15) */
  {
    q:`A gradient-boosted tree model uses a categorical column with roughly 8,000 distinct values. Why is one-hot encoding a poor fit here?`,
    opts:[
      "It would create thousands of sparse columns that inflate the data's width and slow training, while trees split perfectly well on an index encoding",
      "Tree models are unable to consume binary indicator columns",
      "One-hot encoding alters the underlying meaning of the categories",
      "One-hot encoding can only be applied to numeric columns"
    ],
    correct:0,
    explain:`One-hot on 8,000 levels produces 8,000 mostly-zero columns, which is expensive and unhelpful for a tree that can branch on an index directly. Trees can consume indicator columns perfectly well, so the objection is dimensionality rather than compatibility.`
  },

  /* Obj: Identify scenarios where log scale transformation is appropriate (Ch 35) */
  {
    q:`Which of these columns most clearly calls for a log transformation?`,
    opts:[
      "A binary flag containing only the values 0 and 1",
      "A right-skewed revenue column spanning several orders of magnitude, where most values are small and a few are enormous",
      "An unordered categorical column with six levels",
      "A normally distributed height column with a narrow range"
    ],
    correct:1,
    explain:`Heavy right skew across several orders of magnitude is the classic case: the log compresses the long tail and brings the distribution closer to symmetric. A binary flag and a narrow, already-symmetric column have nothing to compress, and a log is undefined over unordered categories.`
  }
];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
