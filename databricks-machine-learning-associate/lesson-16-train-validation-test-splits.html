<script>
/* ============================================================
   ▼▼▼  LESSON PAYLOAD — BEGIN  ▼▼▼
   This block (A + cards) is the ONLY thing that changes per
   lesson. Replace it and the palette vars above; leave the
   ENGINE below untouched.
   ============================================================ */

/* ----------  ART  (custom SVGs, referenced from cards as ${A.name})  ---------- */
const A = {
  cover: `<svg viewBox="0 0 320 200">
    <text x="160" y="30" text-anchor="middle" fill="var(--accent)" font-family="Hanken Grotesk" font-size="10" font-weight="700" letter-spacing="1.2">ONE DATASET, THREE JOBS</text>

    <rect x="24" y="70" width="168" height="44" rx="9" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="1.4"/>
    <text x="108" y="90" text-anchor="middle" fill="var(--accent)" font-family="Hanken Grotesk" font-size="11" font-weight="700">train</text>
    <text x="108" y="105" text-anchor="middle" fill="var(--ink-soft)" font-family="Hanken Grotesk" font-size="8">60% &#183; fit the model</text>

    <rect x="196" y="70" width="56" height="44" rx="9" fill="var(--surface-2)" stroke="var(--line)"/>
    <text x="224" y="88" text-anchor="middle" fill="var(--ink)" font-family="Hanken Grotesk" font-size="9.5" font-weight="600">valid.</text>
    <text x="224" y="102" text-anchor="middle" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="7.5">20% &#183; tune</text>

    <rect x="256" y="70" width="40" height="44" rx="9" fill="var(--surface-2)" stroke="var(--line)"/>
    <text x="276" y="88" text-anchor="middle" fill="var(--ink)" font-family="Hanken Grotesk" font-size="9.5" font-weight="600">test</text>
    <text x="276" y="102" text-anchor="middle" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="7.5">20%</text>

    <text x="276" y="132" text-anchor="middle" fill="var(--accent)" font-family="Hanken Grotesk" font-size="8" font-weight="700">touch once</text>

    <text x="160" y="170" text-anchor="middle" fill="var(--ink-soft)" font-family="Hanken Grotesk" font-size="8.5">fit on train, tune on validation, judge once on test</text>
  </svg>`,

  done: `<svg viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="38" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <path d="M28 43 l9 9 l19 -20" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`
};

/* ----------  CARDS  ---------- */
/* Card shape: { glow?, quiz?, last?, html }
   glow  — optional per-card ambient, e.g. "radial-gradient(540px 340px at 50% 20%, var(--accent-glow), transparent 70%)"
   quiz  — true to gate "Continue" until an answer is picked; needs .choices/.choice[data-correct]/.feedback
   last  — true on the final card; turns the button into "Restart"            */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 2 · Chapter 16</div>
    <h1 class="reveal">Train, Validation, Test</h1>
    <p class="lead reveal">A model that is graded on the same data it studied will always look brilliant. Splitting the data into three roles is how you get an honest estimate of how it will do on data it has never seen.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — the three roles */
  { html: `
    <div class="eyebrow reveal">Three jobs</div>
    <h2 class="reveal">Each split has one role</h2>
    <p class="lead reveal" style="margin-bottom:18px">The same dataset is divided so that fitting, tuning, and judging never happen on the same rows.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Train</b>The model learns its parameters here. It is the only data the model fits on.</p></div>
      <div class="pill"><p><b>Validation</b>You compare models and tune hyperparameters against this set, without ever training on it.</p></div>
      <div class="pill"><p><b>Test</b>Held back for a single, final estimate of performance on unseen data.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 2 — why hold out test */
  { html: `
    <div class="eyebrow reveal">The final exam</div>
    <h2 class="reveal">Why the test set is sacred</h2>
    <p class="lead reveal" style="margin-bottom:18px">Every time you look at a set to make a decision, you leak a little of it into the model. The test set is protected from that.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Tune on validation, not test</b>If you tune against the test set, its score becomes optimistic and stops predicting real-world performance.</p></div>
      <div class="pill"><p><b>Open it once</b>The test set is the last thing you touch, to report a number you can trust.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 3 — how in Spark */
  { html: `
    <div class="eyebrow reveal">In Spark</div>
    <h2 class="reveal">randomSplit with a seed</h2>
    <p class="lead reveal" style="margin-bottom:16px">Spark splits a DataFrame by fractions, and a fixed seed makes the split reproducible run to run.</p>
    <div class="codeblock reveal">train, val, test = df.randomSplit(
    [0.6, 0.2, 0.2], seed=42,
)</div>
    <div class="pills reveal">
      <div class="pill"><p><b>The seed matters</b>Without a fixed seed the split changes each run, so results stop being comparable.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 4 — no leakage */
  { html: `
    <div class="eyebrow reveal">Keep them separate</div>
    <h2 class="reveal">Fit preprocessing on train only</h2>
    <p class="lead reveal" style="margin-bottom:18px">The split only protects you if the earlier steps respect it. Learn every transform from the training set.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Imputers, encoders, scalers</b>Fit them on the training data, then apply the learned values to validation and test.</p></div>
      <div class="pill"><p><b>Fitting before splitting leaks</b>Computing a mean or a scaler over the whole dataset lets test information reach the model.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 5 — validation vs cross-validation */
  { html: `
    <div class="eyebrow reveal">A preview</div>
    <h2 class="reveal">One split, or many folds</h2>
    <p class="lead reveal" style="margin-bottom:18px">A single validation split is quick, but it is not the only option.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Fixed validation split</b>Fast and simple, but the estimate depends on which rows happened to land in validation.</p></div>
      <div class="pill"><p><b>Cross-validation rotates the folds</b>It reuses the data by validating on each fold in turn, for a steadier estimate. Unit 3 goes deep on it.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 6 — quiz: the roles */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:21px">Which split gives the final, unbiased estimate of how the model will perform on unseen data?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>The training set, since the model knows it best</button>
      <button class="choice" data-correct="false"><span class="key">B</span>The validation set, since it is used to compare models</button>
      <button class="choice" data-correct="true"><span class="key">C</span>The test set, opened once at the very end</button>
    </div>
    <div class="feedback"><b>Correct.</b> The test set is held back from all fitting and tuning, so its score is the honest estimate of unseen performance. Training scores are optimistic by definition, and the validation set has already been used to make tuning decisions.</div>` },

  /* 7 — quiz: leakage */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">You scale features by fitting a scaler on the entire dataset, then split into train, validation, and test. What is wrong?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span>The scaler saw the test data, leaking test information into training and inflating scores</button>
      <button class="choice" data-correct="false"><span class="key">B</span>Nothing; scaling before splitting is the recommended order</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Scaling should never be applied to validation or test data</button>
    </div>
    <div class="feedback"><b>Correct.</b> Fitting the scaler on all the data lets statistics from the test set influence the transform, which is leakage and makes the test score optimistic. The fix is to fit on train only, then apply that scaler to validation and test.</div>` },

  /* 8 — done */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Chapter 16 complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">Split the data into three roles so fitting, tuning, and judging never overlap.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Train fits, validation tunes, test judges</b>The test set is opened once for an honest final estimate.</p></div>
      <div class="pill"><p><b>randomSplit with a seed</b>Reproducible fractions, so runs stay comparable.</p></div>
      <div class="pill"><p><b>Fit preprocessing on train only</b>Learning transforms from all the data leaks the test set.</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ============================================================
   ▲▲▲  LESSON PAYLOAD — END  ▲▲▲
   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
</html>
