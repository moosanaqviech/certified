  .topbar { position: relative; z-index: 6; padding: 18px 20px 8px; display: flex; gap: 5px; align-items: center; }

/* ----------  ART  (custom SVGs, referenced from cards as ${A.name})  ---------- */
const A = {
  cover: `<svg viewBox="0 0 320 200">

    <text x="236" y="110" text-anchor="middle" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="8">low-latency serving</text>

    <text x="84" y="144" text-anchor="middle" fill="var(--ink-soft)" font-family="Hanken Grotesk" font-size="8.5">high throughput, batch</text>

    <text x="160" y="180" text-anchor="middle" fill="var(--accent)" font-family="Hanken Grotesk" font-size="9" font-weight="700">same features, two access patterns</text>

/* ----------  CARDS  ---------- */
/* Card shape: { glow?, quiz?, last?, html }
   glow  — optional per-card ambient, e.g. "radial-gradient(540px 340px at 50% 20%, var(--accent-glow), transparent 70%)"
   quiz  — true to gate "Continue" until an answer is picked; needs .choices/.choice[data-correct]/.feedback
   last  — true on the final card; turns the button into "Restart"            */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 1 · Chapter 7</div>
    <div class="tag reveal" style="color:var(--accent); border-color:var(--accent);">Trade-off lesson</div>
    <h1 class="reveal">Online or Offline Features</h1>
    <p class="lead reveal">The same feature values can be read two ways: in bulk for training, or one row at a time for a live prediction. Those are offline and online feature tables, and picking the right one is about latency, not data.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — shared ground */
  { html: `
    <div class="eyebrow reveal">Shared ground</div>
    <h2 class="reveal">One set of features, read two ways</h2>
    <p class="lead reveal" style="margin-bottom:18px">A feature table is computed feature values with a primary key, governed in Unity Catalog. Both access patterns serve the same features; the question is how they are read.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Same source of truth</b>The offline table is the authoritative copy; the online store is kept in sync with it so training and serving see consistent values.</p></div>
      <div class="pill"><p><b>Different read shape</b>Training reads millions of rows at once; a live prediction needs one entity's features, right now.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 2 — option A: offline */
  { html: `
    <div class="eyebrow reveal">Option A</div>
    <h2 class="reveal">Offline feature tables</h2>
    <p class="lead reveal" style="margin-bottom:18px">An offline feature table is a Delta table in Unity Catalog, built for bulk reads.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Made for training and batch scoring</b>Join large feature sets to a training label, or score a whole table at once.</p></div>
      <div class="pill"><p><b>High throughput, not low latency</b>It reads huge volumes efficiently, but a single-row lookup is not what a Delta table is fast at.</p></div>
      <div class="pill"><p><b>The default</b>Every feature table starts here; the offline copy is what you discover, share, and train on.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 3 — option B: online */
  { html: `
    <div class="eyebrow reveal">Option B</div>
    <h2 class="reveal">Online feature stores</h2>
    <p class="lead reveal" style="margin-bottom:18px">An online store is a managed, low-latency copy of the feature table, synced from the offline table for real-time serving.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Made for real-time inference</b>A model serving endpoint looks up one entity's current features in milliseconds, per request.</p></div>
      <div class="pill"><p><b>Kept in sync</b>Databricks syncs the offline table to the online store, on a schedule or continuously, so serving sees fresh values.</p></div>
      <div class="pill"><p><b>Extra moving part</b>You provision and keep the online store fresh; it exists only because a Delta table cannot serve single lookups fast enough.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 4 — side-by-side comparison */
  { html: `
    <div class="eyebrow reveal">Side by side</div>
    <h2 class="reveal" style="font-size:24px">Bulk vs single-row</h2>
    <div class="reveal" style="overflow-x:auto; margin-top:12px;">
      <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
        <tr style="border-bottom:1px solid var(--line);">
          <td style="padding:10px 6px; color:var(--ink-faint); font-weight:600;">Signal</td>
          <td style="padding:10px 6px; color:var(--accent); font-weight:700;">Offline</td>
          <td style="padding:10px 6px; color:var(--accent); font-weight:700;">Online</td>
        </tr>
        <tr style="border-bottom:1px solid var(--line);">
          <td style="padding:10px 6px; color:var(--ink-soft);">Read pattern</td>
          <td style="padding:10px 6px; color:var(--ink);">Millions of rows</td>
          <td style="padding:10px 6px; color:var(--ink);">One row per request</td>
        </tr>
        <tr style="border-bottom:1px solid var(--line);">
          <td style="padding:10px 6px; color:var(--ink-soft);">Latency</td>
          <td style="padding:10px 6px; color:var(--ink);">Seconds to minutes</td>
          <td style="padding:10px 6px; color:var(--ink);">Milliseconds</td>
        </tr>
        <tr style="border-bottom:1px solid var(--line);">
          <td style="padding:10px 6px; color:var(--ink-soft);">Used by</td>
          <td style="padding:10px 6px; color:var(--ink);">Training, batch scoring</td>
          <td style="padding:10px 6px; color:var(--ink);">Real-time serving</td>
        </tr>
        <tr>
          <td style="padding:10px 6px; color:var(--ink-soft);">Storage</td>
          <td style="padding:10px 6px; color:var(--ink);">Delta table in UC</td>
          <td style="padding:10px 6px; color:var(--ink);">Managed online store</td>
        </tr>
      </table>
    </div>
    <div class="spacer"></div>` },

  /* 5 — decision signal */
  { html: `
    <div class="eyebrow reveal">Decision signal</div>
    <h2 class="reveal">Ask how the model is served</h2>
    <p class="lead reveal" style="margin-bottom:18px">One question settles it: does a prediction happen live, per request, or over a batch?</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Real-time endpoint: publish to an online store</b>If a serving endpoint must fetch features per request in milliseconds, the offline Delta table is too slow; sync it online.</p></div>
      <div class="pill"><p><b>Training or batch scoring: offline is enough</b>If features are read in bulk to train or to score a whole table, the offline table is the right and simplest choice.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 6 — quiz: favors online */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:21px">A fraud model is served as a real-time endpoint and must fetch a card's latest features within a few milliseconds of each transaction. Which feature table should it read from?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span>An online feature store synced from the offline table, for low-latency per-request lookups</button>
      <button class="choice" data-correct="false"><span class="key">B</span>The offline Delta feature table directly, since it holds the same values</button>
      <button class="choice" data-correct="false"><span class="key">C</span>A one-off CSV export of the features refreshed nightly</button>

  { quiz: true,

  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,

    </div>
    <div class="spacer"></div>` }
];

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
</html>
