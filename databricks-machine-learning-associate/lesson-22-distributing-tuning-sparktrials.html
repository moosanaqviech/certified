const A = {

      <text x="140" y="128" text-anchor="middle" fill="var(--accent)" font-family="Hanken Grotesk" font-size="8">trial 2</text>

      <rect x="184" y="94" width="76" height="46" rx="9" fill="var(--surface-2)" stroke="var(--line)"/>
      <text x="222" y="113" text-anchor="middle" fill="var(--ink)" font-family="Hanken Grotesk" font-size="8.5" font-weight="600">worker</text>
      <text x="222" y="128" text-anchor="middle" fill="var(--accent)" font-family="Hanken Grotesk" font-size="8">trial 3</text>

      <rect x="266" y="94" width="36" height="46" rx="9" fill="var(--surface-2)" stroke="var(--line)" stroke-dasharray="3 3"/>

/* ----------  CARDS  ---------- */
/* Card shape: { glow?, quiz?, last?, html }
   glow  — optional per-card ambient, e.g. "radial-gradient(540px 340px at 50% 20%, var(--accent-glow), transparent 70%)"
   quiz  — true to gate "Continue" until an answer is picked; needs .choices/.choice[data-correct]/.feedback
   last  — true on the final card; turns the button into "Restart"            */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 3 · Chapter 22</div>
    <h1 class="reveal">Tuning Across the Cluster</h1>
    <p class="lead reveal">Tuning means fitting many models, and fitting them one after another wastes a cluster. SparkTrials runs the trials in parallel across workers, but only for the right kind of model.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — the Trials object */
  { html: `
    <div class="eyebrow reveal">The switch</div>
    <h2 class="reveal">The trials object decides where fits run</h2>
    <p class="lead reveal" style="margin-bottom:16px">Everything else about <code>fmin</code> stays the same. Swapping the trials object is what distributes the search.</p>
    <div class="codeblock reveal"><span class="kw">from</span> hyperopt <span class="kw">import</span> SparkTrials, fmin, tpe
best = fmin(fn=objective, space=space,
            algo=tpe.suggest, max_evals=64,
            trials=SparkTrials(parallelism=8))</div>
    <div class="spacer"></div>` },

  /* 2 — how SparkTrials works */
  { html: `
    <div class="eyebrow reveal">How it works</div>
    <h2 class="reveal">One trial per worker</h2>
    <p class="lead reveal" style="margin-bottom:18px">The driver proposes settings; the workers do the fitting, several at a time.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Each trial fits on one worker</b>A whole model is trained on a single executor, and many executors work at once.</p></div>
      <div class="pill"><p><b>parallelism sets the width</b>It caps how many trials evaluate concurrently, bounded by the cluster's available task slots.</p></div>
      <div class="pill"><p><b>Results still stream back</b>Completed trials return to the driver, which uses them to propose the next settings.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 3 — the crucial rule */
  { html: `
    <div class="eyebrow reveal">The rule that matters</div>
    <h2 class="reveal">SparkTrials is for single-machine models</h2>
    <p class="lead reveal" style="margin-bottom:18px">This is the distinction the exam cares about, and it follows from where the fitting happens.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Use SparkTrials for scikit-learn and friends</b>Single-machine libraries fit fine inside one worker, so parallel trials are pure gain.</p></div>
      <div class="pill"><p><b>Use plain Trials for Spark ML</b>A distributed algorithm already spans the cluster; it cannot be nested inside a single worker's task.</p></div>
      <div class="pill"><p><b>The clash</b>Trying to distribute an already-distributed fit is the mistake; one layer of parallelism is enough.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 4 — parallelism vs adaptivity */
  { html: `
    <div class="eyebrow reveal">The tension</div>
    <h2 class="reveal">Parallelism costs adaptivity</h2>
    <p class="lead reveal" style="margin-bottom:18px">Adaptive search learns from finished trials, so running everything at once leaves it nothing to learn from.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>More parallelism, faster wall clock</b>Eight concurrent trials finish a 64-trial search far sooner than one at a time.</p></div>
      <div class="pill"><p><b>Less parallelism, smarter proposals</b>Each new trial sees more completed results, so for a fixed max_evals it can find better settings.</p></div>
      <div class="pill"><p><b>Pick a middle value</b>A common approach is a parallelism well below max_evals, so the search still adapts several times.</p></div>

    <div class="pills reveal">
      <div class="pill"><p><b>fmin is the parent run</b>Each trial is logged as a child run under it, so the whole search reads as one experiment.</p></div>
      <div class="pill"><p><b>Then pick the winner</b>Query the runs with the client API from Chapter 11 to pull the best trial programmatically.</p></div>

    <div class="feedback"><b>Correct.</b> SparkTrials exists precisely for single-machine libraries like scikit-learn: each trial fits on one worker, so many settings evaluate at once. Plain Trials would run the search on the driver alone, leaving the cluster idle.</div>` },

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
</html>
