<style>
  :root {

<script>
/* ============================================================
   ▼▼▼  LESSON PAYLOAD — BEGIN  ▼▼▼
   This block (A + cards) is the ONLY thing that changes per
   lesson. Replace it and the palette vars above; leave the
   ENGINE below untouched.
   ============================================================ */

/* ----------  ART  (custom SVGs, referenced from cards as ${A.name})  ---------- */
const A = {
  cover: `<svg viewBox="0 0 320 200">
    <rect x="118" y="14" width="84" height="24" rx="8" fill="var(--surface-2)" stroke="var(--line)"/>
    <text x="160" y="30" text-anchor="middle" fill="var(--ink-soft)" font-family="Hanken Grotesk" font-size="9">raw data</text>
    <line x1="160" y1="38" x2="160" y2="54" stroke="var(--line)" stroke-width="1.4"/>

    <rect x="96" y="54" width="128" height="46" rx="11" fill="none" stroke="var(--accent)" stroke-width="1.8"/>
    <text x="160" y="74" text-anchor="middle" fill="var(--accent)" font-family="Hanken Grotesk" font-size="11" font-weight="700">feature table</text>
    <text x="160" y="90" text-anchor="middle" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="8">customer_id (primary key)</text>

    <line x1="150" y1="100" x2="86" y2="124" stroke="var(--line)" stroke-width="1.3"/>
    <line x1="170" y1="100" x2="234" y2="124" stroke="var(--line)" stroke-width="1.3"/>

    <rect x="26" y="124" width="118" height="38" rx="10" fill="var(--surface-2)" stroke="var(--line)"/>
    <text x="85" y="141" text-anchor="middle" fill="var(--ink)" font-family="Hanken Grotesk" font-size="9.5" font-weight="600">training set</text>
    <text x="85" y="154" text-anchor="middle" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="7.5">join features to labels</text>

    <rect x="176" y="124" width="118" height="38" rx="10" fill="var(--surface-2)" stroke="var(--line)"/>
    <text x="235" y="141" text-anchor="middle" fill="var(--ink)" font-family="Hanken Grotesk" font-size="9.5" font-weight="600">batch scoring</text>
    <text x="235" y="154" text-anchor="middle" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="7.5">look up by key</text>

    <text x="160" y="182" text-anchor="middle" fill="var(--accent)" font-family="Hanken Grotesk" font-size="9" font-weight="700">compute once, use for training and scoring</text>
  </svg>`,

  done: `<svg viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="38" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <path d="M28 43 l9 9 l19 -20" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`
};

/* ----------  CARDS  ---------- */
/* Card shape: { glow?, quiz?, last?, html }
   glow  — optional per-card ambient, e.g. "radial-gradient(540px 340px at 50% 20%, var(--accent-glow), transparent 70%)"
   quiz  — true to gate "Continue" until an answer is picked; needs .choices/.choice[data-correct]/.feedback
   last  — true on the final card; turns the button into "Restart"            */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 1 · Chapter 6</div>
    <h1 class="reveal">Features You Compute Once</h1>
    <p class="lead reveal">The same features usually feed both training and prediction. A feature table computes them once, in Unity Catalog, so training and serving read the exact same values instead of two notebooks reinventing them.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — the problem */
  { html: `
    <div class="eyebrow reveal">Why it exists</div>
    <h2 class="reveal">Recomputing features invites skew</h2>
    <p class="lead reveal" style="margin-bottom:18px">When each notebook derives its own features, the same idea gets implemented twice, and small differences quietly break models.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Duplicated logic</b>Every project recomputes "average spend per customer" its own way, so nothing is reusable.</p></div>
      <div class="pill"><p><b>Train and serve drift apart</b>If training computes a feature one way and serving another, the model sees different inputs in production than it learned on.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 2 — what a feature table is */
  { html: `
    <div class="eyebrow reveal">The object</div>
    <h2 class="reveal">A feature table is a table with a key</h2>
    <p class="lead reveal" style="margin-bottom:18px">Feature Engineering in Unity Catalog does not invent a new store: a feature table is a governed Delta table.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Any UC Delta table with a primary key</b>The primary key is what makes it a feature table; features are looked up by it.</p></div>
      <div class="pill"><p><b>Governed like any UC object</b>It gets the same grants, lineage, and discovery as the tables and models from Chapter 5.</p></div>
      <div class="pill"><p><b>Reusable across projects</b>Once it exists, any model can pull from it instead of rebuilding the features.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 3 — creating and writing */
  { html: `
    <div class="eyebrow reveal">Create it</div>
    <h2 class="reveal">Define the table, write the features</h2>
    <p class="lead reveal" style="margin-bottom:16px">The FeatureEngineeringClient creates the table with a primary key and populates it from a DataFrame.</p>
    <div class="codeblock reveal"><span class="kw">from</span> databricks.feature_engineering <span class="kw">import</span> FeatureEngineeringClient
fe = FeatureEngineeringClient()
fe.create_table(
    name=<span class="st">"prod.ml.customer_features"</span>,
    primary_keys=<span class="st">"customer_id"</span>,
    df=features_df,
)</div>
    <div class="spacer"></div>` },

  /* 4 — consuming for training */
  { html: `
    <div class="eyebrow reveal">Train with it</div>
    <h2 class="reveal">Look up features by key</h2>
    <p class="lead reveal" style="margin-bottom:16px">A FeatureLookup joins features onto your labels by the key, and create_training_set does it point-in-time correctly.</p>
    <div class="codeblock reveal"><span class="kw">from</span> databricks.feature_engineering <span class="kw">import</span> FeatureLookup
lookups = [FeatureLookup(
    table_name=<span class="st">"prod.ml.customer_features"</span>,
    lookup_key=<span class="st">"customer_id"</span>,
)]
training_set = fe.create_training_set(
    df=labels_df, feature_lookups=lookups, label=<span class="st">"churned"</span>,
)</div>
    <div class="spacer"></div>` },

  /* 5 — scoring and train/serve consistency */
  { html: `
    <div class="eyebrow reveal">Score with it</div>
    <h2 class="reveal">The model carries its feature recipe</h2>
    <p class="lead reveal" style="margin-bottom:18px">A model logged from a training set remembers which features it used, so scoring does not recompute them.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Pass keys, get features</b>Give <code>fe.score_batch</code> a DataFrame of primary keys and it looks the features up automatically.</p></div>
      <div class="pill"><p><b>Train and serve stay identical</b>Because both read the same feature table, the values at serving match the values at training. No skew.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 6 — quiz: what makes a feature table */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:21px">You have a Delta table of customer features in Unity Catalog. What does it need to be usable as a feature table?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span>A primary key constraint, which features are looked up by</button>
      <button class="choice" data-correct="false"><span class="key">B</span>It must be copied into a dedicated feature-store schema outside Unity Catalog</button>
      <button class="choice" data-correct="false"><span class="key">C</span>It must be converted from Delta to a non-table online format</button>
    </div>
    <div class="feedback"><b>Correct.</b> Any Unity Catalog Delta table with a primary key can serve as a feature table; the key is how lookups find each entity's features. Feature Engineering lives inside Unity Catalog, not a separate store, and the table stays Delta.</div>` },

  /* 7 — quiz: scoring / consistency */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">A model was trained from a feature table using create_training_set and logged with that feature metadata. At batch inference with score_batch, what do you provide?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>A DataFrame with every feature recomputed by hand for each row</button>
      <button class="choice" data-correct="true"><span class="key">B</span>A DataFrame of primary keys; score_batch looks the features up from the table</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Nothing; the model already contains all future feature values</button>
    </div>
    <div class="feedback"><b>Correct.</b> Because the model remembers which features it used, you pass just the primary keys and score_batch fetches the current feature values from the table. That is exactly what keeps training and serving consistent; recomputing features by hand is what reintroduces skew.</div>` },

  /* 8 — done */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Chapter 6 complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">A feature table computes features once in Unity Catalog and serves them to both training and scoring.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>A Delta table with a primary key</b>Governed in Unity Catalog; features are looked up by the key.</p></div>
      <div class="pill"><p><b>Create, train, score with one client</b>create_table to build it, FeatureLookup to train, score_batch to serve by key.</p></div>
      <div class="pill"><p><b>One source of features, no skew</b>Training and serving read the same values, which is the whole point.</p></div>
    </div>
    <div class="spacer"></div>` }
];

   ============================================================ */


/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
</html>
