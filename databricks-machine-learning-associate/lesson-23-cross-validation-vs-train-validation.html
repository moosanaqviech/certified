  .topbar { position: relative; z-index: 6; padding: 18px 20px 8px; display: flex; gap: 5px; align-items: center; }

  .codeblock .kw { color:#7cb8e8; font-weight:600; }

  .choice:active { transform: scale(0.985); }
  .choice .key { width:26px; height:26px; border-radius:8px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background: rgba(255,255,255,0.06); font-size:13px; color: var(--ink-soft); }
  .choice.correct { border-color: var(--accent); background: var(--accent-glow); }
  .choice.correct .key { background: var(--accent); color: var(--accent-ink); }
  .choice.wrong { border-color: rgba(232,98,92,0.8); background: rgba(232,98,92,0.12); }

  .feedback { margin-top:16px; font-size:14.5px; line-height:1.5; color: var(--ink-soft); opacity:0; transform: translateY(8px); transition: 0.35s ease; }

  .done-badge { width: 84px; height:84px; margin: 0 auto 6px; }

<script>
/* ============================================================

   lesson. Replace it and the palette vars above; leave the

/* ----------  ART  (custom SVGs, referenced from cards as ${A.name})  ---------- */
const A = {
  cover: `<svg viewBox="0 0 320 200">
    <text x="160" y="20" text-anchor="middle" fill="var(--accent)" font-family="Hanken Grotesk" font-size="10" font-weight="700" letter-spacing="1.2">ROTATE THE HOLDOUT</text>

    <text x="26" y="46" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="8">fold 1</text>
    <rect x="66" y="36" width="60" height="16" rx="4" fill="var(--accent)" fill-opacity="0.3" stroke="var(--accent)"/>
    <rect x="130" y="36" width="60" height="16" rx="4" fill="var(--surface-2)" stroke="var(--line)"/>
    <rect x="194" y="36" width="60" height="16" rx="4" fill="var(--surface-2)" stroke="var(--line)"/>

    <text x="26" y="76" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="8">fold 2</text>
    <rect x="66" y="66" width="60" height="16" rx="4" fill="var(--surface-2)" stroke="var(--line)"/>
    <rect x="130" y="66" width="60" height="16" rx="4" fill="var(--accent)" fill-opacity="0.3" stroke="var(--accent)"/>
    <rect x="194" y="66" width="60" height="16" rx="4" fill="var(--surface-2)" stroke="var(--line)"/>

    <text x="26" y="106" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="8">fold 3</text>
    <rect x="66" y="96" width="60" height="16" rx="4" fill="var(--surface-2)" stroke="var(--line)"/>
    <rect x="130" y="96" width="60" height="16" rx="4" fill="var(--surface-2)" stroke="var(--line)"/>
    <rect x="194" y="96" width="60" height="16" rx="4" fill="var(--accent)" fill-opacity="0.3" stroke="var(--accent)"/>

    <text x="266" y="46" fill="var(--accent)" font-family="Hanken Grotesk" font-size="7.5">validate</text>
    <text x="266" y="78" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="7.5">train</text>

    <line x1="66" y1="126" x2="254" y2="126" stroke="var(--line)" stroke-width="1"/>
    <text x="160" y="146" text-anchor="middle" fill="var(--ink)" font-family="Hanken Grotesk" font-size="9.5" font-weight="600">average the three scores</text>
    <text x="160" y="176" text-anchor="middle" fill="var(--ink-soft)" font-family="Hanken Grotesk" font-size="8.5">every row validates exactly once</text>
  </svg>`,

  done: `<svg viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="38" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <path d="M28 43 l9 9 l19 -20" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`
};

/* ----------  CARDS  ---------- */
/* Card shape: { glow?, quiz?, last?, html }
   glow  — optional per-card ambient, e.g. "radial-gradient(540px 340px at 50% 20%, var(--accent-glow), transparent 70%)"
   quiz  — true to gate "Continue" until an answer is picked; needs .choices/.choice[data-correct]/.feedback
   last  — true on the final card; turns the button into "Restart"            */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 3 · Chapter 23</div>
    <div class="tag reveal" style="color:var(--accent); border-color:var(--accent);">Trade-off lesson</div>
    <h1 class="reveal">One Split, or K Folds</h1>
    <p class="lead reveal">Chapter 16 held out a validation set. But a single split judges every model on one arbitrary slice of data. Cross-validation rotates the holdout instead, buying a steadier estimate with compute.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — shared ground */
  { html: `
    <div class="eyebrow reveal">Shared ground</div>
    <h2 class="reveal">Both estimate unseen performance</h2>
    <p class="lead reveal" style="margin-bottom:18px">Each approach exists to answer the same question during tuning: how well will this setting generalize? They differ in how many times they ask.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Neither touches the test set</b>Both work inside the training data; the test split stays sealed for the final estimate.</p></div>
      <div class="pill"><p><b>Both drive the same choice</b>The score is what ranks hyperparameter settings and picks the winner.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 2 — option A: train-validation split */
  { html: `
    <div class="eyebrow reveal">Option A</div>
    <h2 class="reveal">A single train-validation split</h2>
    <p class="lead reveal" style="margin-bottom:18px">Carve off one validation slice, evaluate every setting against it, and keep the best. Spark calls this TrainValidationSplit.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>One fit per setting</b>The cheapest option: each hyperparameter combination trains exactly once.</p></div>
      <div class="pill"><p><b>The estimate is noisy</b>The score depends on which rows happened to land in validation, so a lucky split can crown the wrong model.</p></div>
      <div class="pill"><p><b>Worse on small data</b>The smaller the validation slice, the more the estimate swings.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 3 — option B: cross-validation */
  { html: `
    <div class="eyebrow reveal">Option B</div>
    <h2 class="reveal">K-fold cross-validation</h2>
    <p class="lead reveal" style="margin-bottom:18px">Split the data into k folds, then train k times, holding out a different fold each round and averaging the scores.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Every row is validated once</b>With k = 3, each fold trains on two thirds and validates on the remaining third.</p></div>
      <div class="pill"><p><b>A steadier estimate</b>Averaging k scores cancels the luck of any single split.</p></div>
      <div class="pill"><p><b>k times the compute</b>Each setting is now fit k times instead of once, which is the whole cost.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 4 — comparison table */
  { html: `
    <div class="eyebrow reveal">Side by side</div>
    <h2 class="reveal" style="font-size:24px">Cost against confidence</h2>
    <div class="reveal" style="overflow-x:auto; margin-top:12px;">
      <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
        <tr style="border-bottom:1px solid var(--line);">
          <td style="padding:10px 6px; color:var(--ink-faint); font-weight:600;">Signal</td>
          <td style="padding:10px 6px; color:var(--accent); font-weight:700;">Single split</td>
          <td style="padding:10px 6px; color:var(--accent); font-weight:700;">K-fold CV</td>
        </tr>
        <tr style="border-bottom:1px solid var(--line);">
          <td style="padding:10px 6px; color:var(--ink-soft);">Fits per setting</td>
          <td style="padding:10px 6px; color:var(--ink);">1</td>
          <td style="padding:10px 6px; color:var(--ink);">k</td>
        </tr>
        <tr style="border-bottom:1px solid var(--line);">
          <td style="padding:10px 6px; color:var(--ink-soft);">Estimate variance</td>
          <td style="padding:10px 6px; color:var(--ink);">Higher</td>
          <td style="padding:10px 6px; color:var(--ink);">Lower</td>
        </tr>
        <tr style="border-bottom:1px solid var(--line);">
          <td style="padding:10px 6px; color:var(--ink-soft);">Uses all data to validate</td>
          <td style="padding:10px 6px; color:var(--ink);">No</td>
          <td style="padding:10px 6px; color:var(--ink);">Yes</td>
        </tr>
        <tr>
          <td style="padding:10px 6px; color:var(--ink-soft);">Spark class</td>
          <td style="padding:10px 6px; color:var(--ink);">TrainValidationSplit</td>
          <td style="padding:10px 6px; color:var(--ink);">CrossValidator</td>
        </tr>
      </table>
    </div>
    <div class="spacer"></div>` },

  /* 5 — decision signal */
  { html: `
    <div class="eyebrow reveal">Decision signal</div>
    <h2 class="reveal">Weigh dataset size against fit cost</h2>
    <p class="lead reveal" style="margin-bottom:18px">Two facts decide it: how much data you have, and how expensive one fit is.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Small data or a close race: cross-validate</b>When a single slice would be tiny or two settings score within noise of each other, averaging folds is worth the compute.</p></div>
      <div class="pill"><p><b>Huge data or expensive fits: one split</b>With millions of rows a single validation slice is already representative, and k times the training cost buys little.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 6 — quiz: favors cross-validation */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">You have 2,000 rows, models train in seconds, and two hyperparameter settings score almost identically on your validation slice. What should you do?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span>Use k-fold cross-validation, averaging the folds for a more reliable comparison</button>
      <button class="choice" data-correct="false"><span class="key">B</span>Keep the single split and pick whichever scored marginally higher</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Compare them on the test set instead</button>
    </div>
    <div class="feedback"><b>Correct.</b> On a small dataset a single validation slice is noisy, so two near-identical scores may just be split luck; averaging k folds is cheap here and gives a trustworthy comparison. Using the test set to choose would burn the one honest estimate you have left.</div>` },

  /* 7 — quiz: favors single split */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">You have 50 million rows and each fit takes three hours. Why might a single train-validation split be the better call?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Cross-validation is inaccurate on large datasets</button>
      <button class="choice" data-correct="true"><span class="key">B</span>A validation slice that large is already representative, and k-fold would multiply a three-hour fit by k for little gain</button>
      <button class="choice" data-correct="false"><span class="key">C</span>CrossValidator cannot handle datasets that size</button>
    </div>
    <div class="feedback"><b>Correct.</b> With tens of millions of rows a single holdout is big enough to give a stable estimate, so paying k times three hours per setting buys almost no extra confidence. Cross-validation is not less accurate at scale, and Spark's CrossValidator has no such size limit; the objection is purely cost versus benefit.</div>` },

  /* 8 — done */
  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Chapter 23 complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">Cross-validation buys a steadier estimate with k times the fits; a single split is cheaper and often enough at scale.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>K folds, each validated once</b>Train k times, hold out a different fold each round, average the scores.</p></div>
      <div class="pill"><p><b>The cost is k fits per setting</b>TrainValidationSplit fits once; CrossValidator fits k times.</p></div>
      <div class="pill"><p><b>Size and fit cost decide</b>Small data or close results favor CV; huge data or expensive fits favor one split.</p></div>
    </div>
    <div class="spacer"></div>` }
];

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
</html>
