<style>
  :root {

  }

  .topbar { position: relative; z-index: 6; padding: 18px 20px 8px; display: flex; gap: 5px; align-items: center; }

const A = {

    <rect x="176" y="94" width="38" height="13" rx="3" fill="var(--accent)" fill-opacity="0.5"/>
    <text x="270" y="104" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="7">C</text>
    <rect x="176" y="112" width="20" height="13" rx="3" fill="var(--accent)" fill-opacity="0.35"/>

/* ----------  CARDS  ---------- */
/* Card shape: { glow?, quiz?, last?, html }
   glow  — optional per-card ambient, e.g. "radial-gradient(540px 340px at 50% 20%, var(--accent-glow), transparent 70%)"
   quiz  — true to gate "Continue" until an answer is picked; needs .choices/.choice[data-correct]/.feedback
   last  — true on the final card; turns the button into "Restart"            */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 2 · Chapter 33</div>
    <h1 class="reveal">Seeing the Feature</h1>
    <p class="lead reveal">Summary statistics compress a column to a few numbers, and numbers hide shape. A chart shows the skew, the gaps, and the outliers at a glance, but only if you pick the plot that matches the feature type.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — why plot */
  { html: `
    <div class="eyebrow reveal">Why plot</div>
    <h2 class="reveal">Statistics can agree while data differs</h2>
    <p class="lead reveal" style="margin-bottom:18px">Two columns can share a mean and a standard deviation and still be nothing alike.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Shape is invisible in a summary</b>Bimodal, skewed, and uniform data can produce similar averages.</p></div>
      <div class="pill"><p><b>Charts surface the problems fast</b>Skew, gaps, spikes at a default value, and stray extremes all show up immediately.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 2 — continuous features */
  { html: `
    <div class="eyebrow reveal">Continuous features</div>
    <h2 class="reveal">Histogram for shape, box plot for spread</h2>
    <p class="lead reveal" style="margin-bottom:18px">Numeric columns need a view of the whole distribution.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Histogram</b>Bins the values and shows the distribution: is it symmetric, skewed, or multi-peaked.</p></div>
      <div class="pill"><p><b>Box plot</b>Draws the quartiles and whiskers, so the IQR fences from Chapter 13 become visual and outliers appear as points.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 3 — categorical features */
  { html: `
    <div class="eyebrow reveal">Categorical features</div>
    <h2 class="reveal">Bar chart of counts</h2>
    <p class="lead reveal" style="margin-bottom:18px">Categories have no order and no spread, so you count them rather than bin them.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>One bar per level</b>The height is how many rows fall in that category.</p></div>
      <div class="pill"><p><b>It reveals two problems at once</b>A long tail of rare levels warns of high cardinality (Chapter 15), and a dominant level warns of class imbalance if it is the target.</p></div>
      <div class="pill"><p><b>Not a histogram</b>A histogram bins a continuous range; a bar chart counts discrete labels. The exam cares about that distinction.</p></div>
    </div>
    <div class="spacer"></div>` },

    <h2 class="reveal">display() plots without extra libraries</h2>
    <p class="lead reveal" style="margin-bottom:16px">You can chart a Spark DataFrame straight from a notebook cell.</p>

<span class="cm"># then pick a chart type in the cell output,</span>
<span class="cm"># or open the Data Profile tab for automatic</span>

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
</html>
