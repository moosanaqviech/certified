<script>
/* ============================================================

/* ----------  ART  (custom SVGs, referenced from cards as ${A.name})  ---------- */
const A = {
  cover: `<svg viewBox="0 0 320 200">
    <text x="160" y="22" text-anchor="middle" fill="var(--accent)" font-family="Hanken Grotesk" font-size="10" font-weight="700" letter-spacing="1.2">TWO FEATURES, TWO METHODS</text>

    <text x="80" y="44" text-anchor="middle" fill="var(--ink)" font-family="Hanken Grotesk" font-size="9" font-weight="600">both continuous</text>
    <line x1="34" y1="126" x2="34" y2="54" stroke="var(--line)" stroke-width="1.2"/>
    <line x1="34" y1="126" x2="128" y2="126" stroke="var(--line)" stroke-width="1.2"/>
    <g fill="var(--accent)">

      <circle cx="102" cy="76" r="2.6"/><circle cx="112" cy="66" r="2.6"/><circle cx="120" cy="62" r="2.6"/>
    </g>
    <line x1="44" y1="120" x2="124" y2="60" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="80" y="146" text-anchor="middle" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="8">scatter + correlation</text>

    <line x1="152" y1="40" x2="152" y2="152" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>

    <text x="238" y="44" text-anchor="middle" fill="var(--ink)" font-family="Hanken Grotesk" font-size="9" font-weight="600">both categorical</text>
    <g font-family="Hanken Grotesk" font-size="8">
      <rect x="196" y="56" width="42" height="20" rx="3" fill="var(--surface-2)" stroke="var(--line)"/>
      <rect x="240" y="56" width="42" height="20" rx="3" fill="var(--surface-2)" stroke="var(--line)"/>
      <rect x="196" y="78" width="42" height="20" rx="3" fill="var(--accent)" fill-opacity="0.3" stroke="var(--accent)"/>
      <text x="217" y="92" text-anchor="middle" fill="var(--accent)" font-weight="700">120</text>
      <rect x="240" y="78" width="42" height="20" rx="3" fill="var(--surface-2)" stroke="var(--line)"/>
      <text x="261" y="92" text-anchor="middle" fill="var(--ink-soft)">18</text>
      <rect x="196" y="100" width="42" height="20" rx="3" fill="var(--surface-2)" stroke="var(--line)"/>
      <text x="217" y="114" text-anchor="middle" fill="var(--ink-soft)">22</text>
      <rect x="240" y="100" width="42" height="20" rx="3" fill="var(--accent)" fill-opacity="0.3" stroke="var(--accent)"/>
      <text x="261" y="114" text-anchor="middle" fill="var(--accent)" font-weight="700">96</text>
    </g>
    <text x="238" y="146" text-anchor="middle" fill="var(--ink-faint)" font-family="Hanken Grotesk" font-size="8">contingency table</text>

    <text x="160" y="178" text-anchor="middle" fill="var(--ink-soft)" font-family="Hanken Grotesk" font-size="8.5">the pair of types picks the comparison</text>
  </svg>`,

  done: `<svg viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="38" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <path d="M28 43 l9 9 l19 -20" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`
};

/* ----------  CARDS  ---------- */
/* Card shape: { glow?, quiz?, last?, html }
   glow  — optional per-card ambient, e.g. "radial-gradient(540px 340px at 50% 20%, var(--accent-glow), transparent 70%)"
   quiz  — true to gate "Continue" until an answer is picked; needs .choices/.choice[data-correct]/.feedback
   last  — true on the final card; turns the button into "Restart"            */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 2 · Chapter 34</div>
    <h1 class="reveal">Do These Two Move Together</h1>
    <p class="lead reveal">Chapter 33 looked at features one at a time. Now compare a pair, because features that carry the same information are redundant, and a feature that tracks the target too closely may be leaking it.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — why compare */
  { html: `
    <div class="eyebrow reveal">Why compare</div>
    <h2 class="reveal">Relationships change what you keep</h2>
    <p class="lead reveal" style="margin-bottom:18px">A pairwise comparison answers questions a single-column profile cannot.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Redundancy</b>Two nearly identical features add cost without adding signal, and can destabilize linear models.</p></div>
      <div class="pill"><p><b>Leakage</b>A feature almost perfectly related to the target is often information you would not have at prediction time.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 2 — two continuous */
  { html: `
    <div class="eyebrow reveal">Two continuous features</div>
    <h2 class="reveal">Scatter plot, then correlation</h2>
    <p class="lead reveal" style="margin-bottom:16px">Plot them against each other to see the relationship, then put a number on it.</p>
    <div class="codeblock reveal" style="margin-bottom:14px">df.stat.corr(<span class="st">"income"</span>, <span class="st">"spend"</span>)
<span class="cm"># Pearson correlation: -1 to 1</span></div>
    <div class="pills reveal">
      <div class="pill"><p><b>Near 1 or -1 means strongly related</b>Positive moves together, negative moves oppositely, near 0 means no linear relationship.</p></div>
      <div class="pill"><p><b>Correlation only sees straight lines</b>A strong curved relationship can still score near zero, which is why you look at the scatter too.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 3 — two categorical */
  { html: `
    <div class="eyebrow reveal">Two categorical features</div>
    <h2 class="reveal">A contingency table of counts</h2>
    <p class="lead reveal" style="margin-bottom:16px">Correlation is meaningless for unordered labels, so you cross-tabulate instead: how often does each combination occur.</p>
    <div class="codeblock reveal" style="margin-bottom:14px">df.crosstab(<span class="st">"region"</span>, <span class="st">"churned"</span>).show()
<span class="cm"># rows x columns of co-occurrence counts</span></div>
    <div class="pills reveal">
      <div class="pill"><p><b>Read it for lopsidedness</b>If one region's rows concentrate in one outcome, the two are related.</p></div>
      <div class="pill"><p><b>A chi-square test formalizes it</b>It asks whether the observed counts differ from what independence would predict.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 4 — the mixed case */
  { html: `
    <div class="eyebrow reveal">The mixed case</div>
    <h2 class="reveal">One of each: group and compare</h2>
    <p class="lead reveal" style="margin-bottom:18px">The exam asks about like-for-like pairs, but mixed pairs come up constantly in practice.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Split the continuous by the category</b>Compare the distribution of the numeric feature within each category, side by side.</p></div>
      <div class="pill"><p><b>Grouped statistics work too</b>A group-by with mean and standard deviation per category shows whether the groups differ.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 5 — acting on it */
  { html: `
    <div class="eyebrow reveal">What to do about it</div>
    <h2 class="reveal">Strong relationships need a decision</h2>
    <p class="lead reveal" style="margin-bottom:18px">Finding the relationship is half the job; the other half is deciding what it means.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Two features nearly identical</b>Drop one, or combine them, rather than feeding both.</p></div>
      <div class="pill"><p><b>A feature near-perfectly predicts the target</b>Suspect leakage and check whether it would exist at prediction time.</p></div>
      <div class="pill"><p><b>No relationship is also information</b>A feature unrelated to the target may simply not be worth keeping.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 6 — quiz: two categorical */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">You want to know whether "region" and "subscription tier", both categorical, are related. What is the appropriate method?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Pearson correlation between the two columns</button>
      <button class="choice" data-correct="true"><span class="key">B</span>A contingency table of co-occurrence counts, optionally with a chi-square test</button>
      <button class="choice" data-correct="false"><span class="key">C</span>A histogram of each column</button>
    </div>
    <div class="feedback"><b>Correct.</b> Categorical features have no numeric order, so you cross-tabulate the counts and can test independence with chi-square. Correlation requires ordered numeric values, and separate histograms describe each feature alone rather than the relationship between them.</div>` },

  /* 7 — quiz: correlation limits */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:20px">Two continuous features show a Pearson correlation near 0, but the scatter plot traces a clear U shape. What do you conclude?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span>They are related, but not linearly; correlation near 0 only rules out a straight-line relationship</button>
      <button class="choice" data-correct="false"><span class="key">B</span>They are independent, since correlation is the definitive test</button>
      <button class="choice" data-correct="false"><span class="key">C</span>The correlation must have been computed incorrectly</button>
    </div>
    <div class="feedback"><b>Correct.</b> Pearson correlation measures linear association only, so a symmetric curve can genuinely score near zero while the features are strongly related. That is exactly why you plot the pair rather than trusting the coefficient alone.</div>` },

  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>

    <p class="lead reveal" style="text-align:center;margin-bottom:20px">Compare a pair with the method their types call for, then act on what you find.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Two continuous: scatter plus correlation</b>df.stat.corr for the number, the plot for the shape.</p></div>
      <div class="pill"><p><b>Two categorical: contingency table</b>df.crosstab of counts, chi-square to test independence.</p></div>

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
</html>
