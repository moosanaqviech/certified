<script>
/* =====================================================================
   EXAM PAYLOAD - BEGIN
   The only section you edit per exam: the E config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.
===================================================================== */
const E = {
  name: "ML Practice Exam 3",
  badge: "Databricks Machine Learning Associate",
  blurb: "Exam-style, scenario-based questions that combine multiple concepts, just like the real test. Pick the single best answer.",
  coverage: "Sections 1 to 3: Databricks ML, Data Processing, Model Development. One question per official objective, all 42.",
  minutes: 84,
  pass: 70          /* our practice target, not an official Databricks cut score */
};

/* Sections 1 and 2 reappear here with a third distinct set of scenarios, so
   the same objectives are tested without repeating Practice Exams 1 or 2. */

const QUESTIONS = [

  /* ---------- SECTION 1: Databricks Machine Learning (18) ---------- */

  /* Obj: Best practices of an MLOps strategy (Ch 31) */
  {
    q:`A team promotes work by having a data scientist manually copy notebooks between workspaces whenever they look ready. Which change would most improve reliability?`,
    opts:[
      "Copy the notebooks more frequently so production stays closer to development",
      "Automate promotion through a CI/CD pipeline that runs integration tests in staging before anything reaches production",
      "Have a second person watch each copy being made",
      "Keep production and development in one workspace so no copying is needed"
    ],
    correct:1,
    explain:`Manual promotion has no gate and no repeatability, so the fix is an automated path with tests standing between staging and production. Copying more often or adding an observer repeats the same unverified step, and collapsing the environments removes the separation that makes testing meaningful.`
  },

  /* Obj: Advantages of using ML runtimes (Ch 02) */
  {
    q:`A nightly job reads a Delta table, cleans it, and writes a curated table. It trains no models and logs nothing to MLflow. Which runtime fits, and why?`,
    opts:[
      "The GPU ML runtime, because GPUs accelerate Delta writes",
      "Databricks Runtime ML, so the ML libraries are on hand in case the job grows",
      "Databricks Runtime ML, because Delta operations require it",
      "The standard Databricks Runtime, since the job never imports anything from the ML stack"
    ],
    correct:3,
    explain:`Match the runtime to the workload: a pure read, transform, and write job uses Spark and Delta, both of which the standard runtime provides. The ML runtime would carry libraries this job never imports, and a GPU does nothing for Delta writes.`
  },

  /* Obj: How AutoML facilitates model/feature selection (Ch 03) */
  {
    q:`Before trusting an AutoML result, a data scientist opens the data exploration notebook it produced. What is that notebook for?`,
    opts:[
      "It profiles the input data and warns about high cardinality, strong correlations, and missing values, so weak or leaking features can be caught before any trial is trusted",
      "It contains the training code for the winning model",
      "It ranks the trials by the primary metric",
      "It records the hyperparameter space AutoML searched"
    ],
    correct:0,
    explain:`The data exploration notebook is about the input, not the model: it profiles each column and flags the problems that would quietly distort every trial. The winning model's code lives in the best trial notebook, and the ranking of trials is the experiment leaderboard.`
  },

  /* Obj: Advantages AutoML brings to model development (Ch 03, 04) */
  {
    q:`A reviewer asks which features most influenced AutoML's winning model. Where is that answered?`,
    opts:[
      "In the data exploration notebook's correlation summary",
      "On the experiment leaderboard, which lists feature importance for each trial",
      "In the SHAP feature-importance section of the best trial notebook",
      "In the tags attached to the registered model"
    ],
    correct:2,
    explain:`AutoML includes a SHAP section in the best trial notebook that ranks how each feature drove that model's predictions. Correlations in the data exploration notebook describe the raw input rather than the fitted model, and the leaderboard reports metrics per trial, not feature attribution.`
  },

  /* Obj: Benefits of feature tables at the account level in UC (Ch 05, 06) */
  {
    q:`A security review asks how access to features is controlled now that feature tables live in Unity Catalog. What is true?`,
    opts:[
      "They are securable objects governed by the same SQL grants as tables, with privileges inheritable from the catalog or schema",
      "They use a separate access-control system specific to the feature store",
      "They are readable by anyone with access to the workspace",
      "Access can be granted per model only, not per feature table"
    ],
    correct:0,
    explain:`Feature tables are ordinary Unity Catalog securables, so the existing grant model and its inheritance apply without a second system to reason about. That single permission model is precisely the benefit of account-level governance over workspace-local feature storage.`
  },

  /* Obj: Create a feature store table in Unity Catalog (Ch 06) */
  {
    q:`Which is a valid name for a feature table created in Unity Catalog?`,
    opts:[
      "<code>customer_features</code>, with the catalog and schema inferred from the notebook",
      "<code>prod.ml.customer_features</code>, using the three-level catalog, schema, object namespace",
      "<code>/Features/prod/customer_features</code>, a workspace path",
      "<code>ml.customer_features</code>, the two-level form"
    ],
    correct:1,
    explain:`Every Unity Catalog object is addressed as <code>catalog.schema.object</code>, and a feature table is no exception. The two-level form is the legacy Hive metastore style, and workspace file paths are not how catalog objects are named.`
  },

  /* Obj: Write data to a feature store table (Ch 06) */
  {
    q:`How is a feature table typically kept current in production?`,
    opts:[
      "Consumers recompute the features themselves each time they read the table",
      "Someone regenerates it by hand whenever it is noticed to be stale",
      "The online store is refreshed and the offline table is left as it is",
      "A scheduled Lakeflow Job recomputes the features and writes them to the feature table"
    ],
    correct:3,
    explain:`Feature freshness is a pipeline concern, so a scheduled job recomputes and writes the values, keeping one authoritative table current. Pushing recomputation onto consumers reintroduces the duplicated logic feature tables exist to remove, and updating only the online copy would leave training reading stale values.`
  },

  /* Obj: Train a model with features from a feature store table (Ch 06) */
  {
    q:`Beyond performing the join, what does <code>create_training_set</code> do that a hand-written join does not?`,
    opts:[
      "It automatically selects which features improve the model",
      "It caches the features into the online store",
      "It records the feature metadata with the model, so scoring can later look the same features up by key",
      "It removes the need to split the data into train and test"
    ],
    correct:2,
    explain:`The recorded metadata is the whole point: it is what allows <code>score_batch</code> to take only keys later and fetch the identical features. A manual join produces the same training rows but leaves the model with no memory of where those features came from.`
  },

  /* Obj: Score a model using features from a feature store table (Ch 06) */
  {
    q:`A model trained from feature tables is deployed to a real-time endpoint. How can features be supplied at request time?`,
    opts:[
      "The request must carry every feature value, because endpoints cannot look features up",
      "The endpoint can look up current feature values from an online store using the keys carried in the request",
      "The endpoint recomputes the features from the source tables on every request",
      "Features are frozen at training time and the same values are reused for all requests"
    ],
    correct:1,
    explain:`Publishing features to an online store lets serving fetch the current values by key within the request's latency budget. Recomputing from source per request would be far too slow, and reusing training-time values would make every prediction stale.`
  },

  /* Obj: Differences between online and offline feature tables (Ch 07) */
  {
    q:`What is the relationship between an offline feature table and its online store?`,
    opts:[
      "The offline table is the source of truth and the online store is kept in sync from it, so both serve the same feature values",
      "They are independent stores populated by two separate pipelines",
      "The online store is the source of truth and the offline table is derived from it",
      "They deliberately hold different sets of features"
    ],
    correct:0,
    explain:`The offline Delta table is authoritative and the online copy is synced from it, which is exactly what keeps training and serving consistent. Two independent pipelines would let the definitions drift apart, reintroducing the skew this design prevents.`
  },

  /* Obj: Identify the best run using the MLflow Client API (Ch 11) */
  {
    q:`A script calls <code>MlflowClient().search_runs(...)</code>. What does it receive back?`,
    opts:[
      "A pandas DataFrame with one row per run",
      "A list of registered model versions",
      "A list of Run objects, whose info and data expose the run id, parameters, and metrics",
      "A single run, chosen automatically as the best"
    ],
    correct:2,
    explain:`The client API returns Run objects, so you read <code>run.info.run_id</code> and the logged params and metrics from the object. The fluent <code>mlflow.search_runs</code> is the variant that returns a pandas DataFrame, and neither picks a winner for you without an <code>order_by</code>.`
  },

  /* Obj: Manually log metrics, artifacts, and models in an MLflow Run (Ch 08) */
  {
    q:`A team already calls <code>mlflow.autolog()</code> and now also wants to record a fairness metric they compute themselves. What should they do?`,
    opts:[
      "Nothing, because autologging captures any metric once the function is defined",
      "Replace autologging with fully manual logging of every parameter and metric",
      "Record the fairness metric as a tag on the run instead",
      "Keep autologging for the standard capture and add an explicit <code>log_metric</code> call for the custom metric"
    ],
    correct:3,
    explain:`Autologging and manual logging compose, so the library-reported values are captured automatically and you add only what autologging cannot know about. Abandoning autolog would mean re-implementing what it already does, and a tag stores a label rather than a numeric metric you can rank runs by.`
  },

  /* Obj: Identify information available in the MLflow UI (Ch 08) */
  {
    q:`A run logged a confusion matrix image and a fitted model. Where do those appear?`,
    opts:[
      "Under that run's artifacts, alongside the logged model, browsable from the run page",
      "Under the experiment's parameter list",
      "Only in the model registry, and only once the model has been registered",
      "Nowhere, since only scalar metrics are retained after a run"
    ],
    correct:0,
    explain:`Files and models logged during a run are stored as that run's artifacts and can be browsed directly from the run page. Registration is a separate, later step, and artifacts persist with the run whether or not the model is ever registered.`
  },

  /* Obj: Register a model using the MLflow Client API in the UC registry (Ch 10) */
  {
    q:`A job holds the run id of the best run and must register that run's model. What identifies the model to register?`,
    opts:[
      "The experiment id on its own",
      "A model URI of the form <code>runs:/&lt;run_id&gt;/&lt;artifact_path&gt;</code>, pointing at the model logged by that run",
      "The metric value achieved by the best run",
      "The <code>champion</code> alias, which resolves to the best run automatically"
    ],
    correct:1,
    explain:`A run URI addresses the model artifact inside a specific run, which is exactly what registration needs as its source. An experiment contains many runs, a metric is not a locator, and an alias points at an already-registered version rather than at a run.`
  },

  /* Obj: Benefits of registering models in the UC registry (Ch 10) */
  {
    q:`Which statement best captures why Databricks recommends the Unity Catalog registry?`,
    opts:[
      "It loads models faster than the workspace registry",
      "It supports a wider set of model flavors",
      "Models become securable objects governed alongside data and features, sharing grants, lineage, and one namespace",
      "It retrains registered models automatically as new data arrives"
    ],
    correct:2,
    explain:`The advantage is governance, not performance: a registered model sits in the same catalog as the tables and features it came from, under one permission and lineage model. Flavor support is a property of MLflow itself, and no registry retrains models on your behalf.`
  },

  /* Obj: Scenarios where promoting code is preferred (Ch 32) */
  {
    q:`Under the deploy code pattern, what has been reviewed and tested by the time a model reaches production?`,
    opts:[
      "The training code itself, because the thing promoted between environments is a commit that passes code review and integration tests",
      "Only the final model's metrics",
      "Nothing, since review happens after deployment",
      "The model artifact, which is signed off during staging"
    ],
    correct:0,
    explain:`Promoting code means the reviewed and tested artifact is the commit, so the production model is produced by code that has already passed every gate. Signing off an artifact in staging describes the deploy models pattern, which is the exception rather than the default.`
  },

  /* Obj: Set or remove a tag for a model (Ch 10) */
  {
    q:`A team wants to mark one specific model version as having passed a bias audit, without labelling the other versions. What fits?`,
    opts:[
      "Assign an alias named <code>bias_audited</code> to that version",
      "Set a tag on the registered model, which applies to every version",
      "Rename that version",
      "Set a tag on that model version, since tags can be attached at the version level as well as the model level"
    ],
    correct:3,
    explain:`Tags exist at both the registered model and the individual version level, so a version-level tag records a fact about exactly one version. An alias is a pointer used to select a version for loading, and a model-level tag would wrongly imply every version had been audited.`
  },

  /* Obj: Promote a challenger to champion using aliases (Ch 10) */
  {
    q:`A newly promoted champion is causing errors in production and must be reverted immediately. What is the fastest safe action?`,
    opts:[
      "Delete the faulty version so the previous one is used instead",
      "Reassign the <code>champion</code> alias back to the previous version, which consumers loading by alias pick up",
      "Retrain the previous model from scratch",
      "Roll back the serving application to an older release"
    ],
    correct:1,
    explain:`Because versions are immutable and the alias is a movable pointer, rollback is one reassignment and every consumer loading by alias follows immediately. Deleting a version destroys history unnecessarily, and retraining or redeploying the application is far slower than moving a pointer.`
  },

  /* ---------- SECTION 2: Data Processing (9) ---------- */

  /* Obj: Compute summary statistics (Ch 12) */
  {
    q:`In the summary of a numeric column, the 75th percentile is 48 while the maximum is 12,400. What does that gap most likely indicate?`,
    opts:[
      "The column contains a large number of nulls",
      "The column is uniformly distributed",
      "Outliers: a few values sit far above where the bulk of the data lies",
      "The column is categorical and was summarized incorrectly"
    ],
    correct:2,
    explain:`When three quarters of the values sit below 48 but the maximum is in the thousands, a small number of extreme values are stretching the range. Null counts are reported separately, and a uniform distribution would place the maximum close to the upper quartile.`
  },

  /* Obj: Remove outliers based on standard deviation or IQR (Ch 13) */
  {
    q:`A team flags any value more than three standard deviations from the mean as an outlier. When is this rule least reliable?`,
    opts:[
      "When the column is heavily skewed, because the mean and standard deviation are themselves distorted by the tail, which makes the IQR rule safer",
      "When the column is approximately normally distributed",
      "When the dataset contains more than a million rows",
      "When the column contains only positive values"
    ],
    correct:0,
    explain:`The z-score rule assumes a roughly symmetric distribution, and on skewed data the extreme values inflate both the mean and the standard deviation they are measured against. The IQR rule uses quartiles, which the tail does not distort, so it is the safer detector there.`
  },

  /* Obj: Create visualizations for categorical or continuous features (Ch 33) */
  {
    q:`A bar chart of the target column shows one class with 40,000 rows and the other with 300. What has the chart revealed, and what follows?`,
    opts:[
      "High cardinality, so the column should be hash encoded",
      "Missing values, so the column needs imputation",
      "A skewed continuous distribution, so a log transform applies",
      "Severe class imbalance, so accuracy will mislead and mitigation such as class weights should be considered"
    ],
    correct:3,
    explain:`A bar chart of a categorical target exposes the class balance directly, and a 40,000 to 300 split is severe imbalance. That changes both the metric you trust and the training approach, whereas cardinality, nulls, and log transforms are different problems entirely.`
  },

  /* Obj: Compare two features using the appropriate method (Ch 34) */
  {
    q:`A continuous feature correlates with the continuous target at 0.998. What should the team suspect first?`,
    opts:[
      "That the feature is simply very predictive and should be weighted more heavily",
      "Leakage: the feature may encode the target, or hold information that would not exist at prediction time",
      "That the correlation was computed on the wrong column type",
      "That the target needs a log transform"
    ],
    correct:1,
    explain:`A near-perfect correlation with the target is far more often leakage than genuine signal, so the first move is checking whether that value would be available before the outcome is known. Treating it as a strong feature ships a model that collapses in production once the leaked column is unavailable.`
  },

  /* Obj: Compare and contrast imputing with mean, median, or mode (Ch 14) */
  {
    q:`A categorical column with six levels has missing values. Which fill strategy is appropriate?`,
    opts:[
      "The mode, that is the most frequent level, or an explicit unknown category",
      "The mean of the encoded category indices",
      "The median of the encoded category indices",
      "Zero, since categories become numeric once encoded"
    ],
    correct:0,
    explain:`Categories have no arithmetic, so the only meaningful summary is the most frequent level, and an explicit unknown category is the honest alternative when missingness itself is informative. Averaging encoded indices produces a value that corresponds to no real category at all.`
  },

  /* Obj: Impute missing values with mode, mean, or median (Ch 14) */
  {
    q:`Where must the median used by a Spark ML <code>Imputer</code> be computed, in order to avoid leakage?`,
    opts:[
      "On the full dataset before splitting, so every split is filled consistently",
      "Separately within each split, using that split's own median",
      "On the training split only, then applied to validation and test",
      "On the test split, since that is where performance is measured"
    ],
    correct:2,
    explain:`The imputer is an estimator, so it must learn its statistic from training data alone and then apply those learned values everywhere else. Computing over the full dataset lets test information reach training, and a per-split median lets each split influence its own filling.`
  },

  /* Obj: Use one-hot encoding for categorical features (Ch 15) */
  {
    q:`Why is mapping the categories red, green, and blue to 1, 2, and 3 a poor input for a linear model?`,
    opts:[
      "Linear models cannot accept integer-valued inputs",
      "It implies an order and a spacing that do not exist, so the model treats blue as greater than red",
      "It creates too many columns for the model to handle",
      "Integers cannot be gathered into a features vector"
    ],
    correct:1,
    explain:`A linear model reads those numbers literally, so an arbitrary labelling invents a ranking and even a claim that the gap from red to green equals the gap from green to blue. One-hot encoding avoids this by giving each category its own independent indicator column.`
  },

  /* Obj: When one-hot encoding is or is not appropriate (Ch 15) */
  {
    q:`A column holds the ordered levels low, medium, and high. Which encoding preserves the most information?`,
    opts:[
      "One-hot encoding, which is always the correct choice for categorical data",
      "Hashing the values into a fixed number of buckets",
      "Dropping the column, since ordered categories cannot be modelled",
      "An ordered index encoding, because the levels have a genuine order that one-hot would discard"
    ],
    correct:3,
    explain:`When an order really exists, encoding it as an ordered index preserves that relationship, whereas one-hot deliberately throws it away by treating the levels as unrelated. One-hot is the right default for nominal categories, not a universal rule.`
  },

  /* Obj: Scenarios where log scale transformation is appropriate (Ch 35) */
  {
    q:`A right-skewed column of order counts contains many zeros and needs a log transform. What should be used?`,
    opts:[
      "<code>log1p</code>, the log of one plus the value, since the log of zero is undefined",
      "A plain log, because Spark returns zero for the log of zero",
      "No transform at all, because columns containing zeros cannot be logged",
      "Replace the zeros with the column mean, then apply a plain log"
    ],
    correct:0,
    explain:`<code>log1p</code> exists exactly for this case: shifting by one keeps zeros valid while preserving the compression a log provides. Substituting the mean for genuine zeros would fabricate data, changing the distribution rather than transforming it.`
  },

  /* ---------- SECTION 3: Model Development (15) ---------- */

  /* Obj: Use ML foundations to select the appropriate algorithm (Ch 36) */
  {
    q:`A dataset of customer records has no target column, and the goal is to group similar customers together. Which approach applies?`,
    opts:[
      "Logistic regression",
      "Linear regression",
      "An unsupervised clustering algorithm, since there are no labels to learn from",
      "A gradient-boosted classifier"
    ],
    correct:2,
    explain:`Without a target column there is nothing supervised to learn, so finding structure in the data is a clustering task. Regression and classification both require known labels during training, which this dataset does not provide.`
  },

  /* Obj: Identify methods to mitigate data imbalance in training data (Ch 37) */
  {
    q:`Which set of techniques addresses class imbalance in training data?`,
    opts:[
      "Raising the learning rate and adding more trees",
      "Oversampling the minority class, undersampling the majority class, or applying class weights",
      "Removing the minority class rows so the classes are consistent",
      "Changing the evaluation metric to accuracy"
    ],
    correct:1,
    explain:`Resampling and class weighting both increase the influence of the rare class during training, which is what imbalance mitigation means. Deleting the minority discards the very outcome being predicted, and accuracy is the metric that conceals the problem rather than one that solves it.`
  },

  /* Obj: Compare estimators and transformers (Ch 18) */
  {
    q:`What distinguishes an estimator from a transformer in Spark ML?`,
    opts:[
      "An estimator has a <code>fit</code> method that learns from data and returns a transformer, while a transformer applies fixed logic through <code>transform</code>",
      "An estimator can only operate on numeric columns",
      "A transformer must be fit before it can be used",
      "The two terms are interchangeable names for pipeline stages"
    ],
    correct:0,
    explain:`The defining relationship is that fitting an estimator produces a transformer, which is why anything that learns from data must be fit on the training split only. A transformer needs no fitting precisely because it carries no learned state.`
  },

  /* Obj: Develop a training pipeline (Ch 19) */
  {
    q:`In a Spark ML pipeline for a model with both categorical and numeric features, what must happen immediately before the estimator stage?`,
    opts:[
      "The label column must be one-hot encoded",
      "The DataFrame must be converted to pandas",
      "The pipeline must be fit twice, once for each feature type",
      "<code>VectorAssembler</code> must combine all prepared feature columns into a single features vector"
    ],
    correct:3,
    explain:`Spark ML estimators read one assembled vector column rather than many separate columns, so assembly is always the last step before the model. The label stays as it is, and a pipeline is fit once with all stages running in sequence.`
  },

  /* Obj: Use Hyperopt's fmin operation (Ch 20) */
  {
    q:`An objective function passed to <code>fmin</code> evaluates accuracy, where higher is better. What must it return?`,
    opts:[
      "The accuracy directly, since <code>fmin</code> maximizes by default",
      "The accuracy, with <code>algo</code> set to a maximizing search algorithm",
      "The negative of the accuracy, because <code>fmin</code> minimizes whatever it is given",
      "The accuracy expressed as a percentage rather than a fraction"
    ],
    correct:2,
    explain:`The function name is literal: <code>fmin</code> searches for the smallest returned value, so a higher-is-better metric has to be negated for the best model to be the lowest loss. There is no maximizing switch on <code>algo</code>, and rescaling the number does not change the direction of the search.`
  },

  /* Obj: Perform random, grid, or Bayesian search (Ch 21) */
  {
    q:`Each model fit takes 45 minutes and five hyperparameters must be tuned within a small trial budget. Which search strategy fits best, and why?`,
    opts:[
      "Grid search, for exhaustive coverage across all five hyperparameters",
      "Bayesian search with <code>tpe.suggest</code>, since it uses completed trials to propose promising settings and so spends few fits",
      "Random search, because random sampling suits expensive fits",
      "No search at all; keep the library defaults"
    ],
    correct:1,
    explain:`When fits are expensive and the budget is small, an adaptive method that learns from finished trials finds good settings in the fewest evaluations. A grid across five hyperparameters explodes combinatorially, and random search, while a solid baseline, never uses what earlier trials revealed.`
  },

  /* Obj: Parallelize single node models for hyperparameter tuning (Ch 22) */
  {
    q:`An objective function fits a scikit-learn model on a sample that fits comfortably in memory. Which trials object distributes the search across the cluster?`,
    opts:[
      "<code>SparkTrials</code>, which evaluates each single-machine fit on its own worker in parallel",
      "<code>Trials</code>, which distributes across workers automatically",
      "Neither, because scikit-learn models cannot be tuned on Databricks",
      "<code>SparkTrials</code>, but only after converting the model to Spark ML"
    ],
    correct:0,
    explain:`<code>SparkTrials</code> exists for exactly this case: a single-machine library whose whole fit runs inside one worker, so many settings evaluate concurrently. Plain <code>Trials</code> runs the search on the driver alone, and no conversion to Spark ML is required.`
  },

  /* Obj: Benefits and downsides of cross-validation over train-validation split (Ch 23) */
  {
    q:`What is the main downside of k-fold cross-validation compared with a single train-validation split?`,
    opts:[
      "It produces a less reliable estimate of performance",
      "It cannot be combined with a hyperparameter grid",
      "It requires the test set to be used during tuning",
      "It costs k times as many model fits for every hyperparameter setting"
    ],
    correct:3,
    explain:`Cross-validation buys a steadier estimate precisely by training k times per setting, so compute is the price paid. Its estimate is more reliable rather than less, it pairs naturally with a grid, and the test set stays untouched under either approach.`
  },

  /* Obj: Perform cross-validation as part of model fitting (Ch 23) */
  {
    q:`Which Spark ML class performs k-fold cross-validation over a hyperparameter grid as part of fitting?`,
    opts:[
      "<code>TrainValidationSplit</code>, by setting its <code>numFolds</code> parameter",
      "<code>CrossValidator</code>, configured with an estimator, an <code>estimatorParamMaps</code> grid, an evaluator, and <code>numFolds</code>",
      "<code>ParamGridBuilder</code>, which both builds the grid and runs the folds",
      "The <code>Imputer</code>, run in cross-validation mode"
    ],
    correct:1,
    explain:`<code>CrossValidator</code> is the estimator that wraps the model, the grid, and an evaluator and fits across folds. <code>TrainValidationSplit</code> deliberately uses one holdout and has no folds, while <code>ParamGridBuilder</code> only constructs the parameter combinations.`
  },

  /* Obj: Identify the number of models trained with grid search and CV (Ch 24) */
  {
    q:`A grid specifies 4 values for one hyperparameter and 3 for another, run with 5-fold cross-validation. How many models are fit during the search?`,
    opts:[
      "12, the number of grid combinations",
      "17, the combinations plus the folds",
      "60, since each of the 12 combinations is fit once per fold",
      "20, the folds multiplied by the larger grid dimension"
    ],
    correct:2,
    explain:`The grid multiplies to 4 times 3, giving 12 combinations, and cross-validation fits each one on every fold, so 12 times 5 equals 60. The counts multiply at each stage, so adding them badly underestimates the real cost.`
  },

  /* Obj: Use common classification metrics (Ch 17) */
  {
    q:`Which Spark ML evaluator provides <code>areaUnderROC</code> for a binary classifier?`,
    opts:[
      "<code>BinaryClassificationEvaluator</code>",
      "<code>MulticlassClassificationEvaluator</code>",
      "<code>RegressionEvaluator</code>",
      "<code>CrossValidator</code>, which computes AUC internally"
    ],
    correct:0,
    explain:`AUC for a two-class problem comes from <code>BinaryClassificationEvaluator</code>, whose default metric is <code>areaUnderROC</code>. The multiclass evaluator reports accuracy and F1, the regression evaluator handles continuous targets, and <code>CrossValidator</code> uses whichever evaluator you hand it.`
  },

  /* Obj: Use common regression metrics (Ch 17) */
  {
    q:`A model predicts house prices, and a few very large errors are far more damaging than many small ones. Which metric reflects that priority best?`,
    opts:[
      "R-squared, since it reports the share of variance explained",
      "MAE, which treats every error with equal weight",
      "Accuracy, applied to binned price ranges",
      "RMSE, which squares the errors and therefore penalizes large ones most heavily"
    ],
    correct:3,
    explain:`Squaring the errors makes RMSE grow disproportionately with the biggest misses, which is exactly the emphasis described. MAE deliberately weights all errors equally, and accuracy is a classification metric that would discard the continuous target.`
  },

  /* Obj: Choose the most appropriate metric for a scenario (Ch 17) */
  {
    q:`In a disease screening model, missing a genuine positive case is far costlier than raising a false alarm. Which metric should be prioritized?`,
    opts:[
      "Precision, to keep false alarms low",
      "Recall, to maximize the proportion of actual positives that are caught",
      "Accuracy, since it summarizes overall correctness",
      "R-squared"
    ],
    correct:1,
    explain:`Recall measures how many real positives the model finds, which is precisely what a costly miss demands you optimize. Precision targets the opposite error, accuracy hides failure on a rare class, and R-squared applies to regression rather than screening.`
  },

  /* Obj: Exponentiate log-transformed variables before metrics (Ch 35) */
  {
    q:`A model was trained on a log-transformed price target. Before reporting RMSE in dollars, what must happen?`,
    opts:[
      "Nothing, because RMSE is independent of the scale of the target",
      "The RMSE should itself be logged a second time for consistency",
      "The training data should be re-logged before evaluation",
      "The predictions must be exponentiated back to the original scale, and RMSE computed on those values"
    ],
    correct:3,
    explain:`A model trained on a logged target emits logged predictions, so an RMSE taken directly on them is an error in log units and looks deceptively small. Inverting the transform first puts both predictions and the metric back into dollars, where the number means what it claims.`
  },

  /* Obj: Assess model complexity and the bias-variance tradeoff (Ch 38) */
  {
    q:`A model scores 0.98 on the training data and 0.68 on validation. What does this indicate, and what helps?`,
    opts:[
      "Underfitting; increase the model's complexity substantially",
      "A broken validation split; re-split the data and try again",
      "Overfitting with high variance; simplify the model, increase regularization, or add training data",
      "Nothing is wrong, since the training score is the one that matters"
    ],
    correct:2,
    explain:`A near-perfect training score beside a much weaker validation score is the signature of memorizing the training rows rather than learning the pattern. Adding complexity would widen that gap, and judging by the training score alone is the exact mistake a validation split exists to prevent.`
  }
];
/* =====================================================================
   EXAM PAYLOAD - END
===================================================================== */

/* =====================================================================
   ENGINE - frozen. Do not edit below this line.
===================================================================== */
const PASS = E.pass;
const SECONDS = E.minutes * 60;

/* Answer model: `correct` is a scalar index for single-answer questions and an
   array of indexes for multiple-response ones. MULTI[i] decides per QUESTION,
   never per exam, so a single-answer item sitting next to a multi item still
   replaces its selection on click. Internally every answer is an array, with
   [] meaning unanswered; KEY() gives the sorted answer key to compare against.
   Note the init below builds a fresh [] per question: Array(n).fill([]) would
   share one array across all of them. */
const MULTI = QUESTIONS.map(Q => Array.isArray(Q.correct));
const KEY = Q => (Array.isArray(Q.correct) ? Q.correct.slice() : [Q.correct]).sort((a,b)=>a-b);
const sameSet = (a,b) => a.length===b.length && a.every((v,k)=>v===b[k]);
const blankAnswers = () => Array.from({length:QUESTIONS.length}, () => []);

let state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const timerEl = document.getElementById("timer");
const timerVal = document.getElementById("timerVal");
const topLbl = document.getElementById("topLbl");

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

document.title = `${E.name} · ${E.badge}`;
timerVal.textContent = fmt(SECONDS);

function startTimer(){
  timerEl.style.display="flex";
  state.tick = setInterval(()=>{
    state.left--;
    timerVal.textContent = fmt(state.left);
    if(state.left<=120) timerEl.classList.add("warn");
    if(state.left<=0){ clearInterval(state.tick); submit(); }
  },1000);
}

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a.length>0).length;
    pbar.style.width = (answered/QUESTIONS.length*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = E.name;
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${E.badge}</div>
      <h1>${E.name}</h1>
      <p>${E.blurb}</p>
      <p style="font-size:13.5px;color:var(--ink-faint)">${E.coverage}</p>
      <div class="facts">
        <div class="fact"><b>${QUESTIONS.length}</b><span>questions</span></div>
        <div class="fact"><b>${fmt(SECONDS)}</b><span>timer</span></div>
        <div class="fact"><b>${PASS}%</b><span>to pass</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No feedback until you submit. Answers and explanations come at the end, exam-style.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start exam →</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; startTimer(); render(); setProgress(); };
  setProgress();
}

function renderTest(){
  const i = state.i, Q = QUESTIONS[i];
  topLbl.textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  root.innerHTML = `
    <div class="qhead">
      <span class="qnum">QUESTION ${i+1}${MULTI[i]?` &middot; SELECT ${["","ONE","TWO","THREE","FOUR","FIVE"][KEY(Q).length]||KEY(Q).length}`:""}</span>
      <button class="flag ${state.flags[i]?'on':''}" id="flagBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${state.flags[i]?'Flagged':'Flag'}
      </button>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i].includes(j)?'sel':''}" data-j="${j}" aria-pressed="${state.answers[i].includes(j)}">
          <span class="key">${"ABCDEF"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>
    <div class="nav-dots">
      ${QUESTIONS.map((_,j)=>{
        let cls="dot";
        if(state.answers[j].length>0) cls+=" answered";
        if(j===i) cls+=" current";
        if(state.flags[j]) cls+=" flagged";
        return `<button class="${cls}" data-go="${j}">${j+1}</button>`;
      }).join("")}
    </div>
    <div class="foot">
      <button class="btn sec" id="prevBtn" ${i===0?'disabled':''}>← Prev</button>
      ${i===QUESTIONS.length-1
        ? `<button class="btn" id="submitBtn">Submit exam</button>`
        : `<button class="btn sec" id="nextBtn">Next →</button>`}
    </div>`;

  root.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const j = Number(el.dataset.j);
      if(MULTI[i]){
        const a = state.answers[i], at = a.indexOf(j);
        if(at>=0) a.splice(at,1); else a.push(j);
        a.sort((x,y)=>x-y);
      } else {
        state.answers[i] = [j];   /* single answer: replace, never accumulate */
      }
      render(); setProgress();
    };
  });
  root.querySelectorAll(".dot").forEach(el=>{
    el.onclick = ()=>{ state.i = Number(el.dataset.go); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  document.getElementById("flagBtn").onclick = ()=>{ state.flags[i] = !state.flags[i]; render(); };
  const prev = document.getElementById("prevBtn");
  if(prev) prev.onclick = ()=>{ state.i--; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = document.getElementById("nextBtn");
  if(next) next.onclick = ()=>{ state.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const sub = document.getElementById("submitBtn");
  if(sub) sub.onclick = confirmSubmit;
  setProgress();
}

function confirmSubmit(){
  const un = state.answers.filter(a=>a.length===0).length;
  if(un>0){
    if(!confirm(`${un} question${un>1?'s':''} unanswered. Submit anyway?`)) return;
  }
  submit();
}

function submit(){
  if(state.tick) clearInterval(state.tick);
  timerEl.style.display="none";
  state.submitted=true; state.screen="results"; render(); setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

function score(){
  /* All or nothing on multi: a partially correct set scores zero, matching
     how the real exams grade multiple-response items. */
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(sameSet(state.answers[idx], KEY(Q))) c++; });
  return c;
}

function renderResults(){
  topLbl.textContent="Results";
  const c=score(), total=QUESTIONS.length, pct=Math.round(c/total*100), passed=pct>=PASS;
  const R=62, CIRC=2*Math.PI*R, off=CIRC*(1-pct/100);
  const col = passed ? "var(--green)" : "var(--gold)";
  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="tr" cx="70" cy="70" r="${R}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="70" cy="70" r="${R}" fill="none" stroke-width="9" stroke="${col}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b>${pct}%</b><span>${c} / ${total} correct</span></div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Passed':'Keep going'}</div>
      <p>${passed
        ? `That's above the ${PASS}% bar. Review the explanations below to lock in anything you guessed.`
        : `Below the ${PASS}% pass line, which is normal this early. The review below is where the real learning is.`}</p>
      <div class="res-actions">
        <button class="btn" id="reviewBtn">Review answers ↓</button>
        <button class="btn sec" id="retakeBtn">Retake</button>
      </div>
    </div>
    <div id="review"></div>`;
  requestAnimationFrame(()=>{ const f=root.querySelector(".fl"); if(f) f.style.strokeDashoffset=off.toFixed(1); });
  document.getElementById("retakeBtn").onclick=retake;
  document.getElementById("reviewBtn").onclick=()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
}

function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], key=KEY(Q), ok=sameSet(mine,key);
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(key.includes(j)) cls+=" correct";
          else if(mine.includes(j)) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCDEF"[j]}</span><span>${o}${mine.includes(j)?'  ·  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake exam</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

function retake(){
  state = { screen:"intro", i:0, answers:blankAnswers(), flags:Array(QUESTIONS.length).fill(false), submitted:false, left:SECONDS, tick:null };
  timerEl.classList.remove("warn"); timerVal.textContent=fmt(SECONDS);
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
