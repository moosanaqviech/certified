<style>
  :root {

<script>

/* ----------  ART  (custom SVGs, referenced from cards as ${A.name})  ---------- */
const A = {
  cover: `<svg viewBox="0 0 320 200">
    <rect x="30" y="20" width="260" height="30" rx="9" fill="none" stroke="var(--accent)" stroke-width="1.8"/>

    <rect x="44" y="94" width="232" height="30" rx="8" fill="var(--surface-2)" stroke="var(--line)"/>
    <text x="58" y="113" fill="var(--ink)" font-family="Hanken Grotesk" font-size="9.5" font-weight="600">run 2</text>
    <text x="150" y="113" fill="var(--ink-soft)" font-family="Hanken Grotesk" font-size="8">params &#183; metrics &#183; model</text>

    <rect x="44" y="128" width="232" height="30" rx="8" fill="var(--surface-2)" stroke="var(--accent)"/>
    <text x="58" y="147" fill="var(--accent)" font-family="Hanken Grotesk" font-size="9.5" font-weight="700">run 3</text>
    <text x="150" y="147" fill="var(--accent)" font-family="Hanken Grotesk" font-size="8">best metric &#9733;</text>

    <text x="160" y="180" text-anchor="middle" fill="var(--ink-soft)" font-family="Hanken Grotesk" font-size="8.5">every run records what you tried and how it scored</text>
  </svg>`,

  done: `<svg viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="38" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <path d="M28 43 l9 9 l19 -20" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`
};

/* ----------  CARDS  ---------- */
/* Card shape: { glow?, quiz?, last?, html }
   glow  — optional per-card ambient, e.g. "radial-gradient(540px 340px at 50% 20%, var(--accent-glow), transparent 70%)"
   quiz  — true to gate "Continue" until an answer is picked; needs .choices/.choice[data-correct]/.feedback
   last  — true on the final card; turns the button into "Restart"            */
const cards = [

  /* 0 — cover */
  { glow: "radial-gradient(540px 340px at 50% 18%, var(--accent-glow), transparent 70%)",
    html: `
    <div class="spacer" style="flex:0.2"></div>
    <div class="eyebrow reveal"><span class="dot" style="background:var(--accent)"></span>Unit 1 · Chapter 8</div>
    <h1 class="reveal">Tracking Every Experiment</h1>
    <p class="lead reveal">Modeling is trial and error, and without a record you cannot tell which trial won or why. MLflow Tracking logs every run's inputs and results, so you can compare, reproduce, and trust the model you ship.</p>
    <div class="art grow reveal">${A.cover}</div>` },

  /* 1 — the hierarchy */
  { html: `
    <div class="eyebrow reveal">The structure</div>
    <h2 class="reveal">Experiments contain runs</h2>
    <p class="lead reveal" style="margin-bottom:18px">MLflow Tracking organizes work into two levels, and everything you log attaches to one of them.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>A run is one execution</b>One training attempt, with its own parameters, metrics, and outputs.</p></div>
      <div class="pill"><p><b>An experiment groups related runs</b>All the runs for a problem live in one experiment, so you can compare them side by side.</p></div>
      <div class="pill"><p><b>Databricks hosts the tracking server</b>Runs are logged to a managed tracking server; each notebook has a default experiment to log into.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 2 — what a run captures */
  { html: `
    <div class="eyebrow reveal">What a run records</div>
    <h2 class="reveal">Four things, every run</h2>
    <p class="lead reveal" style="margin-bottom:18px">A run is a complete snapshot of one attempt, enough to explain and rebuild it.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Parameters</b>The inputs you set: hyperparameters, config, the knobs that define this attempt.</p></div>
      <div class="pill"><p><b>Metrics</b>The results: accuracy, RMSE, loss. Metrics can be logged over steps to show a training curve.</p></div>
      <div class="pill"><p><b>Artifacts and the model</b>Files the run produced, plots, and the trained model itself, stored with the run.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 3 — autologging */
  { html: `
    <div class="eyebrow reveal">The easy way</div>
    <h2 class="reveal">Autologging, one line</h2>
    <p class="lead reveal" style="margin-bottom:18px">Call <code>mlflow.autolog()</code> before training and MLflow captures the run for you.</p>
    <div class="codeblock reveal" style="margin-bottom:16px"><span class="kw">import</span> mlflow
mlflow.autolog()
<span class="cm"># train as usual; params, metrics, and</span>
<span class="cm"># the model are logged automatically</span>
model.fit(X_train, y_train)</div>
    <div class="pills reveal">
      <div class="pill"><p><b>Works with the common libraries</b>scikit-learn, XGBoost, PyTorch, Keras, Spark ML, and more are supported out of the box.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 4 — manual logging */
  { html: `
    <div class="eyebrow reveal">The precise way</div>
    <h2 class="reveal">Manual logging, full control</h2>
    <p class="lead reveal" style="margin-bottom:18px">When you want to log exactly what you choose, open a run and log to it by hand.</p>
    <div class="codeblock reveal" style="margin-bottom:16px"><span class="kw">with</span> mlflow.start_run():
    mlflow.log_param(<span class="st">"max_depth"</span>, 6)
    mlflow.log_metric(<span class="st">"rmse"</span>, rmse)
    mlflow.log_artifact(<span class="st">"plot.png"</span>)</div>
    <div class="pills reveal">
      <div class="pill"><p><b>For custom metrics and files</b>Log a metric MLflow would not capture, or an artifact like a chart or a data sample, on your terms.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 5 — comparing runs */
  { html: `
    <div class="eyebrow reveal">The payoff</div>
    <h2 class="reveal">Compare runs, then choose</h2>
    <p class="lead reveal" style="margin-bottom:18px">Because every run logs the same shape of data, the tracking UI lets you line them up.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Sort and filter by metric</b>Rank runs by a metric to see which parameters produced the best result.</p></div>
      <div class="pill"><p><b>Reproducibility</b>Each run keeps the parameters and code that produced it, so a good result can be rebuilt, not just admired.</p></div>
    </div>
    <div class="spacer"></div>` },

  /* 6 — quiz: autolog */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:21px">A data scientist training a scikit-learn model wants parameters, metrics, and the model logged with the least code. What is the simplest approach?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="true"><span class="key">A</span>Call <code>mlflow.autolog()</code> before fitting, and let MLflow capture the run</button>
      <button class="choice" data-correct="false"><span class="key">B</span>Write the metrics to a text file in DBFS after training</button>
      <button class="choice" data-correct="false"><span class="key">C</span>Manually call log_param and log_metric for every value</button>
    </div>
    <div class="feedback"><b>Correct.</b> For a supported library like scikit-learn, <code>mlflow.autolog()</code> records parameters, metrics, and the model automatically with a single line. Manual logging works but is more code, and a text file in DBFS is not tracked or comparable in MLflow.</div>` },

  /* 7 — quiz: experiment vs run */
  { quiz: true,
    html: `
    <div class="eyebrow reveal">Quick check</div>
    <h2 class="reveal" style="font-size:21px">You trained the same model with ten different hyperparameter settings and want to compare all ten in one place. How does MLflow organize this?</h2>
    <div class="choices reveal">
      <button class="choice" data-correct="false"><span class="key">A</span>Ten separate experiments, one per setting</button>
      <button class="choice" data-correct="true"><span class="key">B</span>One experiment containing ten runs, compared by their logged metrics</button>
      <button class="choice" data-correct="false"><span class="key">C</span>One run containing ten experiments</button>
    </div>
    <div class="feedback"><b>Correct.</b> Each training attempt is a run, and related runs live together in one experiment, which is exactly where you compare them by metric. Experiments do not nest inside runs, and splitting each attempt into its own experiment would defeat the side-by-side comparison.</div>` },

  { glow: "radial-gradient(560px 360px at 50% 16%, var(--accent-glow), transparent 70%)", last: true,
    html: `
    <div class="spacer" style="flex:0.4"></div>
    <div class="done-badge reveal">${A.done}</div>
    <h2 class="reveal" style="text-align:center;font-size:27px">Chapter 8 complete</h2>
    <p class="lead reveal" style="text-align:center;margin-bottom:20px">MLflow Tracking records every run so you can compare attempts and reproduce the winner.</p>
    <div class="pills reveal">
      <div class="pill"><p><b>Experiments contain runs</b>A run is one attempt; an experiment groups related runs for comparison.</p></div>
      <div class="pill"><p><b>Every run logs params, metrics, artifacts, and the model</b>Enough to explain and rebuild the result.</p></div>

/* ----------  ENGINE — shared, do not edit  ---------- */
const vp = document.getElementById('viewport');
const topbar = document.getElementById('topbar');
const glow = document.getElementById('glow');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');
let i = 0;
const answered = {};

cards.forEach(() => { const s = document.createElement('div'); s.className = 'seg'; s.innerHTML = '<i></i>'; topbar.appendChild(s); });
const segs = [...topbar.children];

const els = cards.map((c) => { const d = document.createElement('div'); d.className = 'card'; d.innerHTML = c.html; vp.appendChild(d); return d; });

function render() {
  cards.forEach((c, idx) => {
    const el = els[idx];
    el.classList.remove('in','out-left');
    if (idx === i) el.classList.add('in');
    else if (idx < i) el.classList.add('out-left');
    segs[idx].classList.toggle('done', idx < i);
    segs[idx].classList.toggle('active', idx === i);
  });
  glow.style.background = cards[i].glow || 'transparent';
  backBtn.disabled = (i === 0);
  const c = cards[i];
  if (c.quiz && !answered[i]) { nextBtn.disabled = true; nextBtn.textContent = 'Pick an answer'; }
  else if (c.last) { nextBtn.disabled = false; nextBtn.textContent = 'Restart ↻'; }
  else if (i === 0) { nextBtn.disabled = false; nextBtn.textContent = 'Begin lesson'; }
  else { nextBtn.disabled = false; nextBtn.textContent = 'Continue'; }
  if (c.quiz) wireQuiz(els[i], i);
}

function wireQuiz(cardEl, idx) {
  const choices = [...cardEl.querySelectorAll('.choice')];
  const fb = cardEl.querySelector('.feedback');
  choices.forEach(ch => {
    ch.onclick = () => {
      if (answered[idx]) return;
      answered[idx] = true;
      choices.forEach(o => {
        if (o.dataset.correct === 'true') o.classList.add('correct');
        else if (o === ch) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.classList.add('show');
      nextBtn.disabled = false; nextBtn.textContent = 'Continue';
    };
  });
}

function go(n) { if (n < 0 || n >= cards.length) return; i = n; render(); }

nextBtn.onclick = () => {
  if (cards[i].last) {
    for (const k in answered) delete answered[k];
    els.forEach((el, idx) => {
      if (cards[idx].quiz) {
        el.querySelectorAll('.choice').forEach(o => o.className = 'choice');
        const f = el.querySelector('.feedback'); if (f) f.classList.remove('show');
      }
    });
    go(0); return;
  }
  go(i + 1);
};
backBtn.onclick = () => go(i - 1);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.disabled) backBtn.click();
});

let sx = 0;
vp.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && !nextBtn.disabled) nextBtn.click();
  if (dx > 50 && !backBtn.disabled) backBtn.click();
});

render();
</script>
</body>
</html>
