<style>
  /* =====================================================================
     READINESS SHELL - frozen. Do not edit anything in this style block.
     All per-cert customization lives in the READINESS PAYLOAD script
     section (the R config object and the QUESTIONS array).

     The :root token block below is the exam engine's palette, kept
     identical on purpose: the readiness quiz is assessment-family and
     must read as a sibling of the practice exams. The domain-accent ramp
     is the ONLY added color, and it is used solely in the result-screen
     breakdown and the share card.
  ===================================================================== */
  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;
    --ink-soft:#a7a59f; --ink-faint:#6b6a66; --gold:#e3b84a; --green:#34d3a6; --red:#e8625c;
    --line:rgba(255,255,255,0.08);
    --display:"Fraunces",Georgia,serif; --body:"Hanken Grotesk",system-ui,sans-serif;
  }
  /* Domain-accent ramp. Result breakdown + share card only. These avoid
     the reserved trio: --green and --red (review correctness) and --gold
     (brand mark), so a domain bar never reads as right/wrong or as brand. */
  :root{
    --acc-1:#6ea8fe;  /* blue       */
    --acc-2:#a78bfa;  /* violet     */
    --acc-3:#4dd0e1;  /* cyan       */
    --acc-4:#f4a259;  /* orange     */
    --acc-5:#f6a5c0;  /* pink       */
    --acc-6:#b3c1ff;  /* periwinkle */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:radial-gradient(1100px 650px at 50% -8%,#1a1d29 0%,transparent 58%),var(--bg);font-family:var(--body);color:var(--ink);min-height:100vh;line-height:1.5;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* sticky top */
  .top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  /* intro */
  .intro{text-align:center;margin:auto 0;padding:30px 0;}
  .intro .badge{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px;}
  .intro h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.06;letter-spacing:-0.02em;margin-bottom:16px;}
  .intro p{color:var(--ink-soft);font-size:15.5px;max-width:30em;margin:0 auto 14px;}
  .facts{display:flex;justify-content:center;gap:0;margin:24px 0 28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .fact{flex:1;padding:16px 10px;}
  .fact+.fact{border-left:1px solid var(--line);}
  .fact b{display:block;font-family:var(--display);font-size:22px;font-weight:600;color:var(--gold);}
  .fact span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#14110c;font-weight:700;font-size:16px;padding:15px 30px;border-radius:14px;border:none;cursor:pointer;transition:transform .15s ease;font-family:var(--body);}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.35;pointer-events:none;}

  /* question flow (linear, auto-advance, lesson-style slide) */
  .qstage{position:relative;flex:1;overflow:hidden;}
  .qcard{opacity:1;transform:translateX(0);transition:opacity .3s ease,transform .3s cubic-bezier(.2,.7,.2,1);}
  .qcard.out-left{opacity:0;transform:translateX(-42px);}
  .qcard.out-right{opacity:0;transform:translateX(42px);}
  .qcard.in-right{opacity:0;transform:translateX(42px);}
  .qcard.in-left{opacity:0;transform:translateX(-42px);}

  .qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .qback{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-size:17px;cursor:pointer;transition:.15s;font-family:var(--body);flex:0 0 auto;}
  .qback:hover{border-color:rgba(255,255,255,0.2);color:var(--ink);}
  .qback.hide{visibility:hidden;}
  .qnum{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:0.04em;}
  .qtext{font-size:18px;line-height:1.5;font-weight:500;margin-bottom:20px;}
  .qtext code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:5px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);line-height:1.4;transition:border-color .15s,background .15s;width:100%;}
  .opt:hover{border-color:rgba(255,255,255,0.2);}
  .opt.sel{border-color:var(--gold);background:rgba(227,184,74,0.08);}
  .opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .opt.sel .key{background:var(--gold);color:#14110c;}

  /* review states */
  .opt.correct{border-color:var(--green);background:rgba(52,211,166,0.1);}
  .opt.correct .key{background:var(--green);color:#072018;}
  .opt.incorrect{border-color:var(--red);background:rgba(232,98,92,0.1);}
  .opt.incorrect .key{background:var(--red);color:#2a0a08;}
  .explain{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .explain b{color:var(--ink);}

  /* results */
  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:150px;height:150px;margin:6px auto 6px;}
  .scorering svg{transform:rotate(-90deg);}
  .scorering .tr{stroke:rgba(255,255,255,0.1);}
  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scorering .ctr b{font-family:var(--display);font-size:40px;font-weight:600;line-height:1;}
  .scorering .ctr em{font-style:normal;font-size:13px;color:var(--gold);font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-top:5px;}
  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}

  /* verdict band */
  .verdict-band{margin:16px auto 4px;max-width:30em;opacity:0;transform:translateY(10px);transition:opacity .25s ease,transform .25s ease;transition-delay:.55s;}
  .verdict-band.show{opacity:1;transform:none;}
  .verdict-band h2{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1;margin-bottom:6px;}
  .verdict-band p{color:var(--ink-soft);font-size:14.5px;line-height:1.5;margin:0 auto;}

  /* per-domain breakdown */
  .dbreak{margin:30px 0 6px;text-align:left;}
  .sec-head{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:4px;}
  .sec-sub{font-size:12.5px;color:var(--ink-faint);margin-bottom:16px;}
  .drow{margin-bottom:16px;}
  .drow .dtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:10px;}
  .drow .dname{font-size:13.5px;font-weight:600;color:var(--ink);}
  .drow .dscore{font-size:12.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .dtrack{position:relative;height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
  .dfill{height:100%;width:0;border-radius:6px;transition:width .7s cubic-bezier(.2,.7,.2,1);}
  .dmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,0.5);border-radius:2px;}
  .dweight{font-size:11px;color:var(--ink-faint);margin-top:5px;}

  /* prescriptions */
  .presc{margin:26px 0 6px;text-align:left;}
  .presc-card{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:11px;text-decoration:none;color:var(--ink);transition:border-color .15s,background .15s;}
  .presc-card:hover{border-color:rgba(255,255,255,0.2);background:var(--surface-2);}
  .presc-card .pc-dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;}
  .presc-card .pc-body{flex:1;}
  .presc-card .pc-dom{display:block;font-size:12px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px;}
  .presc-card .pc-line{display:block;font-size:14px;line-height:1.4;color:var(--ink);}
  .presc-card .pc-go{flex:0 0 auto;color:var(--ink-faint);font-size:18px;}

  /* actions */
  .res-actions{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
  .res-actions .btn{flex:1;min-width:44%;}

  /* email capture (opt-in, appears after results; hidden when unset) */
  .email{margin:26px 0 4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;}
  .email label{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:10px;}
  .email-row{display:flex;gap:9px;}
  .email input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;color:var(--ink);font-family:var(--body);font-size:15px;}
  .email input::placeholder{color:var(--ink-faint);}
  .email input:focus{outline:none;border-color:var(--gold);}
  .email .btn{padding:12px 18px;font-size:15px;}
  .email .note{font-size:12px;color:var(--ink-faint);margin-top:9px;}

  /* review (reused verbatim from the exam renderer) */
  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}

  /* offscreen canvas host for the share card */
  .sharehost{position:fixed;left:-99999px;top:0;}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="lbl" id="topLbl">Readiness Quiz</span>
  </div>
  <div class="pbar"><i id="pbar"></i></div>

  <div class="body-wrap" id="root"></div>
</div>
<div class="sharehost"><canvas id="shareCanvas" width="1080" height="1080"></canvas></div>

<script>
/* =====================================================================
   READINESS PAYLOAD - BEGIN
   The only section you edit per cert: the R config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.

   Sourced from the Databricks Certified Associate Developer for Apache
   Spark exam guide (30 Oct 2025 edition), the Apache Spark 4.0
   documentation and the course lessons. prescribe / href are drawn from
   curriculum-index-databricks-spark-developer-associate (7 units, 40
   chapters). Every scenario below is new: none reuses or rewords a
   question from spark-practice-exam-01 to 06.
===================================================================== */
const R = {
  cert:   "Databricks Spark Developer Associate",
  code:   "Databricks Spark Associate",
  badge:  "Databricks Apache Spark · Associate",
  intro:  "Twelve scenario questions across all seven exam sections, grouped into five areas. No timer, no signup. At the end you get a per-area readiness readout and exactly what to study next.",
  courseUrl: "../databricks-apache-spark-developer-associate/",   /* course home (Unit 1 free) */

  /* The guide's seven sections, re-clustered into five domains so that a
     12-question quiz gives every domain at least 2 questions. Sections 1,
     2 and 3 stand alone; Section 4 (10%) stands alone with 2 questions;
     the three small sections (5 Structured Streaming 10%, 6 Spark Connect
     5%, 7 Pandas API on Spark 5%) are merged into one 20% domain with one
     question each. The section weights ARE published on the certification
     page (20/20/30/10/10/5/5), so each weight below is the sum of the
     official weights of the sections it holds and reads as "% of exam".
     count sums to 12 (2/2/3/2/3). accent = ramp token. prescribe + href
     from the curriculum index; each href deep links to the first unit of
     its domain on the course home. */
  domains: [
    { id:"c1", name:"Apache Spark Architecture", weight:20, count:2, accent:"var(--acc-1)",
      prescribe:"Unit 1 (Ch 1-9): the driver and executors, DataFrames and the SparkSession, caching and storage levels, executor memory and GC, jobs, stages and tasks, partitions and shuffles, lazy evaluation, and the Spark modules.",
      href:"../databricks-apache-spark-developer-associate/#unit-1" },
    { id:"c2", name:"Using Spark SQL", weight:20, count:2, accent:"var(--acc-2)",
      prescribe:"Unit 2 (Ch 10-15): reading files and JDBC, partitionBy and overwrite, querying files directly with SQL, save modes, persistent tables, and temporary views.",
      href:"../databricks-apache-spark-developer-associate/#unit-2" },
    { id:"c3", name:"DataFrame API", weight:30, count:3, accent:"var(--acc-3)",
      prescribe:"Unit 3 (Ch 16-28): columns and rows, deduplication and missing data, aggregations, dates, joins and unions, explicit schemas, sorting and converting, Python UDFs, state stores, broadcast variables and broadcast joins.",
      href:"../databricks-apache-spark-developer-associate/#unit-3" },
    { id:"c4", name:"Troubleshooting and Tuning", weight:10, count:2, accent:"var(--acc-4)",
      prescribe:"Unit 4 (Ch 29-32): repartition versus coalesce, data skew and reducing shuffles, Adaptive Query Execution, and reading logs and the Spark UI.",
      href:"../databricks-apache-spark-developer-associate/#unit-4" },
    { id:"c5", name:"Streaming, Spark Connect and Pandas API", weight:20, count:3, accent:"var(--acc-5)",
      prescribe:"Units 5 to 7 (Ch 33-40): the Structured Streaming model, output modes and sinks, windows and deduplication, Spark Connect, deployment modes, the Pandas API on Spark, and Pandas UDFs.",
      href:"../databricks-apache-spark-developer-associate/#unit-5" }
  ],

  /* Verdict bands on raw correct count out of 12 (not weighted). Descending
     by min; the first whose min is met wins. */
  bands: [
    { min:10, key:"ready",      label:"Exam-ready",       note:"You are scoring where passing candidates score. Tighten your weakest area below, then book it." },
    { min:7,  key:"close",      label:"Close: 1-2 weeks", note:"A focused week or two on the areas flagged below should get you over the line." },
    { min:4,  key:"foundation", label:"Foundation needed",note:"The core is forming but has gaps. Work the flagged units in order before drilling practice exams." },
    { min:0,  key:"start",      label:"Start from Unit 1", note:"Best to build from the ground up across the 40-chapter course. Start with Unit 1, which is free." }
  ]
};

const QUESTIONS = [
  /* ---------- Domain 1: Apache Spark Architecture (2) ---------- */

  /* Q1 - Where the time goes under lazy evaluation (Ch 8) */
  {
    ref:{chapter:8},
    domain:"c1",
    q:`A developer times each line of a job with <code>time.time()</code>. The lines that read a Parquet source, filter it and join it to a lookup table each take a few milliseconds, and the final <code>write.parquet(...)</code> line takes 20 minutes. A teammate concludes that writing the files is the slow step. What is actually going on?`,
    opts:[
      "The write really is the bottleneck, since the read, filter and join steps have already finished by then",
      "The read, filter and join are transformations that only build a plan; the write is the action that runs the whole plan, so the 20 minutes covers every step",
      "Spark cached the source automatically on the read line, so only the join and the write do any work",
      "Spark ran the earlier lines in the background, so they were still finishing while the write line was being timed"
    ],
    correct:1,
    explain:`Transformations are lazy: each of those lines returns at once with a bigger plan, and nothing runs until an action such as the write starts a job that reads, filters, joins and writes in one go. The 20 minutes therefore belongs to the whole plan, and the Stages and SQL tabs of the Spark UI show which part is expensive. Blaming the write (the trap) reads the line timings as if each line had executed its own work, which is exactly what lazy evaluation does not do.`
  },

  /* Q2 - Execution evicting cached blocks in unified memory (Ch 4, 5) */
  {
    ref:{chapter:4},
    domain:"c1",
    q:`A job persists <code>profiles</code> with <code>StorageLevel.MEMORY_ONLY</code>, and after the first action the Storage tab shows it 100% cached. A large sort-merge join then runs on the same executors, and afterwards the Storage tab shows only about 55% of <code>profiles</code> still in memory. No executor was lost. What happened, and what does it mean for later actions on <code>profiles</code>?`,
    opts:[
      "The join's execution memory evicted cached blocks above the share that spark.memory.storageFraction protects; later actions recompute the missing partitions from lineage, so results stay correct",
      "Cached blocks can never be evicted by execution memory, so the drop must be a reporting delay and every partition is still cached",
      "The evicted blocks were moved to local disk, so later actions read them back from disk instead of memory",
      "Later actions on profiles will return only the 55% of rows that are still cached"
    ],
    correct:0,
    explain:`Under unified memory, execution and storage share one region: a shuffle or join that needs room evicts cached blocks until storage falls to the floor that spark.memory.storageFraction protects, while storage can never evict execution. With MEMORY_ONLY an evicted partition is simply dropped and rebuilt from lineage on its next use, so the cost is recomputation, never wrong results. Moving blocks to disk (the trap) is what MEMORY_AND_DISK does; MEMORY_ONLY has no disk copy to fall back on.`
  },

  /* ---------- Domain 2: Using Spark SQL (2) ---------- */

  /* Q3 - Parallel connections on a JDBC write (Ch 11) */
  {
    ref:{chapter:11},
    domain:"c2",
    q:`A job appends scored leads to PostgreSQL with <code>leads.write.jdbc(url, "crm.leads", mode="append", properties=props)</code>. The DataFrame has 400 partitions after an upstream join. During the write the DBA reports that the database hit its limit of 100 connections and refused new sessions. Which change fixes it?`,
    opts:[
      "Switch to mode(\"overwrite\") so the table is replaced in a single transaction",
      "Add partitionBy(\"region\") to the writer so each region is written separately",
      "Cache leads before the write so each task finishes faster and releases its connection sooner",
      "Reduce the partition count before the write, for example with coalesce(16), because each partition writes over its own connection"
    ],
    correct:3,
    explain:`A JDBC write runs one task per DataFrame partition and every task opens its own database connection, so 400 partitions means up to 400 concurrent sessions; cutting the partition count first (coalesce, which needs no shuffle to reduce, or the writer's numPartitions option, which coalesces for you) caps the connections. partitionBy (the trap) is a file-layout tool that creates directories, it does not apply to a database table and does nothing about task parallelism.`
  },

  /* Q4 - Temporary view versus persistent table (Ch 14, 15) */
  {
    ref:{chapter:14},
    domain:"c2",
    q:`A nightly notebook computes churn scores and ends with <code>scores.createOrReplaceTempView("churn_scores")</code>. The next morning, analysts querying from a different cluster report that <code>churn_scores</code> does not exist. The scores must be queryable by name from any cluster until the next run replaces them. What should the notebook do instead?`,
    opts:[
      "Use createGlobalTempView(\"churn_scores\") so the view is shared outside the session",
      "Call spark.catalog.cacheTable(\"churn_scores\") so the view stays in memory overnight",
      "Write the scores with scores.write.mode(\"overwrite\").saveAsTable(\"crm.churn_scores\")",
      "Run spark.sql(\"CREATE OR REPLACE TEMP VIEW churn_scores AS SELECT * FROM churn_scores\")"
    ],
    correct:2,
    explain:`A temporary view lives only in the SparkSession that created it, so other clusters never see it and it disappears when the session ends; saveAsTable writes the data and registers a persistent table in the catalog that any cluster can query, and overwrite replaces it on each nightly run. A global temporary view (the trap) is shared only across sessions of the same Spark application, under the global_temp database, and it is gone when that application stops, so a different cluster still cannot reach it.`
  },

  /* ---------- Domain 3: DataFrame API (3) ---------- */

  /* Q5 - Parsing a day-first date string (Ch 20) */
  {
    ref:{chapter:20},
    domain:"c3",
    q:`<code>shipments</code> has a string column <code>ship_d</code> holding day-first dates such as "07/10/2026", meaning 7 October 2026. On Spark 4.0, which expression turns it into a DATE of 2026-10-07?`,
    opts:[
      "F.to_date(\"ship_d\", \"MM/dd/yyyy\")",
      "F.date_format(\"ship_d\", \"dd/MM/yyyy\")",
      "F.to_date(\"ship_d\", \"dd/mm/yyyy\")",
      "F.to_date(\"ship_d\", \"dd/MM/yyyy\")"
    ],
    correct:3,
    explain:`to_date parses a string with a datetime pattern, and in that pattern dd is day of month, capital MM is month and yyyy is the year, so "dd/MM/yyyy" reads 07/10/2026 as 7 October. The month-first pattern (the trap) parses this value without complaint but as 10 July, a silent swap on every day up to 12, and under Spark 4.0's default ANSI mode it raises an error on a day such as 25. Small mm means minutes, and date_format goes the other way, turning a date into text.`
  },

  /* Q6 - Building a complete grid with crossJoin (Ch 21, 18) */
  {
    ref:{chapter:21},
    domain:"c3",
    q:`A monthly report must show sales for every store on every day, with 0 on days a store sold nothing. <code>stores</code> has 300 rows (<code>store_id</code>), <code>calendar</code> has 31 rows (<code>sale_date</code>), and <code>sales</code> has <code>store_id</code>, <code>sale_date</code> and <code>amount</code> only for days with sales. Which approach produces all 9,300 store-day rows?`,
    opts:[
      "stores.crossJoin(calendar), then a left join to sales on store_id and sale_date, then na.fill(0, [\"amount\"])",
      "sales.join(stores, \"store_id\", \"full\"), then na.fill(0, [\"amount\"])",
      "stores.join(calendar, \"store_id\", \"left\"), then a left join to sales",
      "sales.groupBy(\"store_id\", \"sale_date\").agg(F.sum(\"amount\")), then na.fill(0)"
    ],
    correct:0,
    explain:`crossJoin pairs every store with every date, giving the 300 x 31 = 9,300 row grid on purpose; a left join from that grid to sales on both keys keeps every store-day, and na.fill turns the unmatched amounts into 0. The full outer join with stores (the trap) does add stores that never sold, but it can only produce dates that already appear in sales, so the missing days are still missing. calendar has no store_id to join on, and grouping sales only summarizes rows that exist.`
  },

  /* Q7 - A broadcast hint on a side that is too big (Ch 28) */
  {
    ref:{chapter:28},
    domain:"c3",
    q:`To avoid sorting, an engineer changes a join of a 4 TB <code>events</code> table with a 6 GB <code>customers</code> table to <code>events.join(broadcast(customers), "customer_id")</code>. The job now fails while building the broadcast, with an OutOfMemoryError on the driver. What is the right fix?`,
    opts:[
      "Raise spark.sql.autoBroadcastJoinThreshold to 8 GB so Spark broadcasts customers on its own instead of through the hint",
      "Remove the hint and let Spark use a sort-merge join, the right strategy when both sides are large",
      "Broadcast events instead, since the larger side should be the one copied to every executor",
      "Cache customers before the join so the broadcast is read from executor memory"
    ],
    correct:1,
    explain:`A broadcast hash join collects the hinted side on the driver and ships a full copy to every executor, which only pays off for a side small enough to hold comfortably in memory; at 6 GB the broadcast itself is what fails, while a sort-merge join shuffles and sorts both sides but scales to any size. Raising the threshold (the trap) removes the need for the hint but asks Spark to perform the same oversized broadcast, so it fails the same way.`
  },

  /* ---------- Domain 4: Troubleshooting and Tuning (2) ---------- */

  /* Q8 - Skewed aggregation that AQE does not split (Ch 30, 31) */
  {
    ref:{chapter:30},
    domain:"c4",
    q:`With AQE on at its defaults, a job runs <code>clicks.groupBy("user_id").agg(F.collect_list("page"))</code>. One crawler account produces 40% of all rows, and the final stage sits for hours on a single task while the rest of the 200 tasks finished in minutes. Why did AQE not split that task, and what helps?`,
    opts:[
      "AQE only splits a partition after it exceeds 256 MB, so lower that threshold until the crawler's partition qualifies",
      "Raise spark.sql.shuffle.partitions to 2,000 so the crawler's rows spread over more tasks",
      "AQE's skew handling splits skewed partitions of sort-merge joins only; every row of one grouping key still lands in one task, so handle the hot key directly, by filtering the crawler out or salting the key and aggregating in two steps",
      "AQE does not run on aggregations at all, so switching it off and back on will not change anything"
    ],
    correct:2,
    explain:`AQE's skew optimization targets sort-merge joins: it splits an oversized join partition and replicates the matching side, but a grouping key hashes to exactly one reduce partition, so a single hot key in an aggregation is untouched. Removing or salting that key is what spreads the work. Raising the shuffle partition count (the trap) only adds partitions: all rows of user_id for the crawler still hash to the same one, so the straggler keeps its entire load.`
  },

  /* Q9 - Reading spill in the Stages tab (Ch 32, 7, 29) */
  {
    ref:{chapter:32},
    domain:"c4",
    q:`A nightly aggregation runs on a 100-core cluster with <code>spark.sql.shuffle.partitions</code> at its default. In the Spark UI's Stages tab, the post-shuffle stage shows 200 tasks, a median shuffle read of about 6 GB per task with little difference between median and max, and Spill (Disk) on every task. Nothing fails, but the stage is slow. Which change addresses the cause?`,
    opts:[
      "Coalesce to 100 partitions so the task count matches the cores",
      "Increase driver memory, since spill means the driver is short of memory",
      "Raise spark.sql.shuffle.partitions (to around 2,000) so each task's share fits in its execution memory",
      "Cache the input DataFrame so the shuffle reads from memory"
    ],
    correct:2,
    explain:`Spill on every task with an even spread of shuffle read means the data is not skewed, the partitions are simply too large: each 6 GB task overflows its share of execution memory and writes to disk, so more shuffle partitions of a few hundred megabytes each fit in memory and stop spilling. Coalescing to match the cores (the trap) sounds tidy, but it doubles each partition to about 12 GB and makes the spill worse. Spill happens in executor tasks, so driver memory is irrelevant.`
  },

  /* ---------- Domain 5: Streaming, Spark Connect and Pandas API (3) ---------- */

  /* Q10 - availableNow for a scheduled catch-up run (Ch 33, 34) */
  {
    ref:{chapter:33},
    domain:"c5",
    q:`To save cost, a file-based streaming job now runs twice a day from a scheduled job instead of continuously. Between runs about 50 GB of new files arrive. The team tried <code>trigger(once=True)</code>, and the one huge micro-batch runs out of memory. Each run must process everything that arrived since the last run, pick up exactly where it stopped, and then shut down. Which trigger fits?`,
    opts:[
      "trigger(availableNow=True), which processes all available data in as many micro-batches as needed and then stops, with the checkpoint tracking progress",
      "trigger(processingTime=\"12 hours\"), so one micro-batch runs every twelve hours",
      "trigger(continuous=\"1 second\"), so the backlog is drained with millisecond latency",
      "A batch spark.read over the whole landing folder on each run, with mode(\"overwrite\") on the output"
    ],
    correct:0,
    explain:`availableNow processes everything that is available when the query starts, split into micro-batches that respect the source's rate limits such as maxFilesPerTrigger, then stops; the checkpoint records which files were done, so the next run resumes exactly where this one ended. A twelve-hour processingTime trigger (the trap) also batches the work, but the query stays running and the cluster stays up between batches, which defeats the point of the schedule. A batch reread reprocesses every file each time and tracks no progress.`
  },

  /* Q11 - The thin Spark Connect client (Ch 37) */
  {
    ref:{chapter:37},
    domain:"c5",
    q:`A small Python service runs in a slim container image that has no Java runtime. It needs to run DataFrame queries against a shared cluster that already runs a Spark Connect server. How should the service connect?`,
    opts:[
      "pip install pyspark, then SparkSession.builder.master(\"spark://host:7077\").getOrCreate()",
      "pip install pyspark-client, then SparkSession.builder.remote(\"sc://host:15002\").getOrCreate()",
      "Package the code and run spark-submit --deploy-mode cluster from the container",
      "pip install pyspark-client, then SparkSession.builder.remote(\"spark://host:7077\").getOrCreate()"
    ],
    correct:1,
    explain:`pyspark-client is the pure Python Spark Connect package with no jars and no Java runtime, and remote("sc://...") (port 15002 by default) sends unresolved logical plans to the server over gRPC, so the container never runs a JVM. Pointing master at the cluster manager (the trap) is classic mode: the driver would run inside the container and needs a local JVM, and so does spark-submit. remote() expects an sc:// Spark Connect URL, not a cluster manager address.`
  },

  /* Q12 - Iterator Pandas UDF for expensive setup (Ch 40) */
  {
    ref:{chapter:40},
    domain:"c5",
    q:`A Pandas UDF scores a text column with a model that takes 20 seconds to load. It is written as Series to Series and loads the model at the top of the function body, and the job crawls: each task spends most of its time reloading the model. Which change removes the repeated loading?`,
    opts:[
      "Raise spark.sql.execution.arrow.maxRecordsPerBatch so the function is called on fewer, larger batches",
      "Rewrite it as a row-at-a-time Python UDF that loads the model inside the function",
      "Group by a constant column and use applyInPandas so the model loads in one place",
      "Use the Iterator of Series to Iterator of Series form, loading the model once before looping over the batches"
    ],
    correct:3,
    explain:`A Series to Series Pandas UDF is called once per Arrow batch (10,000 rows by default), so setup inside it repeats for every batch; the Iterator form receives all of a task's batches as an iterator, so the model loads once and then each batch is yielded through it. Raising maxRecordsPerBatch (the trap) only reduces the number of reloads, it does not remove them, and larger batches cost more Python worker memory. A constant grouping key would push all rows into one task.`
  }
];

const TOTAL = QUESTIONS.length;

let state = { screen:"intro", i:0, answers:Array(TOTAL).fill(null), busy:false };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");

document.title = `Readiness Quiz · ${R.cert}`;

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a!==null).length;
    pbar.style.width = (answered/TOTAL*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = "Readiness Quiz";

/* ---------- linear question flow with slide transition ---------- */
function renderTest(){
  root.innerHTML = `<div class="qstage"><div class="qcard" id="qcard"></div></div>`;
  paintQuestion();
}

function questionHTML(i){
  const Q = QUESTIONS[i];
  return `
    <div class="qhead">
      <button class="qback ${i===0?'hide':''}" id="backBtn" aria-label="Back">&larr;</button>
      <span class="qnum">QUESTION ${i+1} OF ${TOTAL}</span>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i]===j?'sel':''}" data-j="${j}">
          <span class="key">${"ABCD"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>`;
}

function wireQuestion(i){
  const card = document.getElementById("qcard");
  card.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=> selectAnswer(i, Number(el.dataset.j), el);
  });
  const back = document.getElementById("backBtn");
  if(back) back.onclick = ()=> goBack(i);
}

function paintQuestion(){
  const i = state.i;
  topLbl.textContent = `Question ${i+1} / ${TOTAL}`;
  const card = document.getElementById("qcard");
  card.className = "qcard";
  card.innerHTML = questionHTML(i);
  wireQuestion(i);
  setProgress();
}

function selectAnswer(i, j, el){
  if(state.busy) return;
  state.answers[i] = j;
  const card = document.getElementById("qcard");
  card.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
  el.classList.add("sel");
  setProgress();
  state.busy = true;
  /* brief beat so the selection registers, then slide out */
  setTimeout(()=>{
    card.classList.add("out-left");
    setTimeout(()=>{
      if(i === TOTAL-1){ finish(); return; }
      state.i = i+1;
      slideIn("in-right");
    }, 300);
  }, 250);
}

function goBack(i){
  if(state.busy || i===0) return;
  state.busy = true;
  const card = document.getElementById("qcard");
  card.classList.add("out-right");
  setTimeout(()=>{
    state.i = i-1;
    slideIn("in-left");
  }, 300);
}

function slideIn(fromClass){
  const i = state.i;
  topLbl.textContent = `Question ${i+1} / ${TOTAL}`;
  const card = document.getElementById("qcard");
  card.className = "qcard " + fromClass;
  card.innerHTML = questionHTML(i);
  wireQuestion(i);
  setProgress();
  /* force reflow so the incoming offset is applied before we clear it */
  void card.offsetWidth;
  requestAnimationFrame(()=>{
    card.className = "qcard";
    setTimeout(()=>{ state.busy = false; }, 320);
  });
}

function finish(){
  state.screen = "results";
  render();
  setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- scoring ---------- */
function score(){
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(state.answers[idx]===Q.correct) c++; });
  return c;
}

function domainScores(){
  return R.domains.map(d=>{
    let correct=0, count=0;
    QUESTIONS.forEach((Q,idx)=>{
      if(Q.domain===d.id){ count++; if(state.answers[idx]===Q.correct) correct++; }
    });
    return { d, correct, count, frac: count? correct/count : 0 };
  });
}

function bandFor(c){
  /* R.bands descend by min; first whose min is met wins. Raw count, not weighted. */
  return R.bands.find(b=> c>=b.min) || R.bands[R.bands.length-1];
}

function countUp(el, target, ms){
  if(!el) return;
  const start = performance.now();
  function frame(now){
    const t = Math.min(1, (now-start)/ms);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = Math.round(eased*target) + "%";
    if(t<1) requestAnimationFrame(frame);
    else el.textContent = target + "%";
  }
  requestAnimationFrame(frame);
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the results review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this quiz>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- review (reused verbatim from the exam renderer) ---------- */
function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], ok=mine===Q.correct;
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(j===Q.correct) cls+=" correct";
          else if(j===mine) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCD"[j]}</span><span>${o}${j===mine?'  &middot;  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake quiz</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

/* ---------- email capture ---------- */
function readCookie(name){
  const m = document.cookie.match(new RegExp("(?:^|;\\s*)" + name + "=([^;]+)"));
  return m ? decodeURIComponent(m[1]) : "";
}
/* Segment key: the /ready/<slug> filename is the reliable cert slug (R.code is
   not consistent across quizzes). */
function quizSlug(){
  const parts = location.pathname.replace(/\/+$/,"").split("/");
  let last = parts[parts.length-1] || "";
  if(last.endsWith(".html")) last = last.slice(0,-5);
  return last || String(R.code||"").toLowerCase();
}
function newEventId(){
  try{ if(window.crypto && crypto.randomUUID) return "lead_"+crypto.randomUUID(); }catch(_e){}
  return "lead_"+Date.now()+"_"+Math.random().toString(16).slice(2);
}
/* isApp(): true inside the mobile app, which opens pages with ?app=1 (the
   flag is remembered in sessionStorage for the WebView session), so sessions can be
   suppressed or tagged once the mobile project supplies a signal (custom UA
   token, query param, or injected flag). No signal exists today, so this is
   always false and web behaviour is unchanged. */
function isApp(){ try{ if(/[?&]app=1(?:&|$)/.test(location.search)){ sessionStorage.setItem("cc_app","1"); return true; } return sessionStorage.getItem("cc_app")==="1"; }catch(_e){ return false; } }

function submitEmail(e){
  e.preventDefault();
  if(!EMAIL_ENDPOINT) return;
  const input = document.getElementById("emailInput");
  const note = document.getElementById("emailNote");
  const btn = e.target.querySelector("button[type=submit]");
  const email = (input && input.value || "").trim();
  if(!email){ if(note) note.textContent = "Enter your email to get your plan."; return; }
  if(btn){ btn.disabled = true; btn.textContent = "Sending..."; }

  const eid = newEventId();
  const slug = quizSlug();
  const payload = {
    email: email, slug: slug, cert: R.cert,
    correct: score(), total: TOTAL,
    event_id: eid, fbp: readCookie("_fbp"), fbc: readCookie("_fbc"),
    event_source_url: location.href
  };
  fetch(EMAIL_ENDPOINT, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json().catch(function(){ return {}; }); })
    .then(function(d){
      if(d && d.ok){
        if(note) note.textContent = "Done. Check your inbox to confirm and get your plan.";
        if(input) input.disabled = true;
        if(btn) btn.textContent = "Sent";
        /* Lead conversion: pixel + GA4, sharing event_id with the server-side
           Lead sent by /api/subscribe so Meta deduplicates the pair. Fired only
           on a confirmed signup, and suppressed inside the app. */
        if(!isApp()){
          try{ if(typeof fbq==="function") fbq("track","Lead",
            {content_name:R.cert,content_category:slug},{eventID:eid}); }catch(_e){}
          try{ if(typeof gtag==="function") gtag("event","generate_lead",
            {event_id:eid,cert:R.cert,quiz_slug:slug}); }catch(_e){}
        }
      } else {
        if(note) note.textContent = (d && d.error) || "Could not send just now. Try again in a moment.";
        if(btn){ btn.disabled = false; btn.textContent = "Send"; }
      }
    })
    .catch(function(){
      if(note) note.textContent = "Could not send just now. Try again in a moment.";
      if(btn){ btn.disabled = false; btn.textContent = "Send"; }
    });
}

/* ---------- share card (Canvas, 1080x1080) ---------- */
function resolveColor(v){
  v = (v||"").trim();
  const m = v.match(/^var\((--[a-z0-9-]+)\)$/i);
  if(m){
    const c = getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim();
    return c || "#6ea8fe";
  }
  return v || "#6ea8fe";
}

function rr(ctx, x, y, w, h, r){
  r = Math.min(r, h/2, w/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawShareCard(){
  const cv = document.getElementById("shareCanvas");
  const ctx = cv.getContext("2d");
  const W = 1080, H = 1080, M = 88;

  /* Visual Brain palette (marketing artifact, brand-governed) */
  const GROUND = "#14161c", CREAM = "#e9e6dd", MUTED = "#8b90a0", FAINT = "#62647a";
  const PANEL = "#1b1e26", GOLD = "#d9a441";

  const c = score(), pct = Math.round(c/TOTAL*100);
  const ds = domainScores();

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = GROUND; ctx.fillRect(0,0,W,H);
  ctx.textBaseline = "alphabetic";

  /* eyebrow */
  ctx.fillStyle = FAINT;
  ctx.font = '700 26px "Hanken Grotesk", system-ui, sans-serif';
  ctx.fillText("CERTIFY  ·  READINESS", M, 168);

  /* big figure */
  ctx.fillStyle = GOLD;
  ctx.font = '600 210px "Fraunces", Georgia, serif';
  const figure = pct + "%";
  ctx.fillText(figure, M-4, 440);
  const figW = ctx.measureText(figure).width;
  ctx.fillStyle = CREAM;
  ctx.font = '500 62px "Fraunces", Georgia, serif';
  ctx.fillText("ready", M + figW + 26, 440);

  /* cert code */
  ctx.fillStyle = MUTED;
  ctx.font = '600 34px "Hanken Grotesk", system-ui, sans-serif';
  ctx.fillText(R.code + "  ·  " + c + " / " + TOTAL + " correct", M, 512);

  /* domain mini-bars, scaled so N rows always sit above the brand mark */
  const barX = M, barW = W - M*2;
  const bandTop = 630, bandBottom = 918;
  const rowH = ds.length > 1 ? Math.min(92, (bandBottom - bandTop) / (ds.length - 1)) : 0;
  let y = bandTop;
  ds.forEach(x=>{
    const acc = resolveColor(x.d.accent);
    ctx.fillStyle = CREAM;
    ctx.font = '600 27px "Hanken Grotesk", system-ui, sans-serif';
    const name = x.d.name.length > 34 ? x.d.name.slice(0,33)+"…" : x.d.name;
    ctx.fillText(name, barX, y);
    ctx.fillStyle = MUTED;
    ctx.textAlign = "right";
    ctx.fillText(x.correct + "/" + x.count, barX + barW, y);
    ctx.textAlign = "left";
    /* track */
    ctx.fillStyle = PANEL;
    rr(ctx, barX, y+18, barW, 16, 8); ctx.fill();
    /* fill */
    const fw = Math.max(16, barW * x.frac);
    ctx.fillStyle = acc;
    rr(ctx, barX, y+18, fw, 16, 8); ctx.fill();
    y += rowH;
  });

  /* brand mark: gold check + wordmark, bottom-left */
  const markY = 1004;
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(M, markY-9);
  ctx.lineTo(M+13, markY+6);
  ctx.lineTo(M+38, markY-24);
  ctx.stroke();
  ctx.fillStyle = CREAM;
  ctx.font = '600 34px "Hanken Grotesk", system-ui, sans-serif';
  ctx.fillText("certify.courses", M+56, markY+2);

  return cv;
}

function shareResult(){
  const btn = document.getElementById("shareBtn");
  const restore = ()=>{ if(btn){ btn.disabled=false; btn.textContent="Share result"; } };
  if(btn){ btn.disabled=true; btn.textContent="Preparing…"; }

  const fonts = [
    '600 210px "Fraunces"',
    '500 62px "Fraunces"',
    '700 26px "Hanken Grotesk"',
    '600 34px "Hanken Grotesk"'
  ];
  const ready = (document.fonts && document.fonts.load)
    ? Promise.all(fonts.map(f=>document.fonts.load(f))).catch(()=>{})
    : Promise.resolve();

  ready.then(()=>{
    const cv = drawShareCard();
    cv.toBlob(blob=>{
      if(!blob){ restore(); return; }
      const c = score(), pct = Math.round(c/TOTAL*100);
      const file = new File([blob], `readiness-${R.code}.png`, { type:"image/png" });
      const shareData = {
        files:[file],
        title:`${R.code} readiness`,
        text:`I'm ${pct}% ready for the ${R.code}. Check yours at certify.courses.`
      };
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        navigator.share(shareData).catch(()=>{}).finally(restore);
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `readiness-${R.code}.png`;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        restore();
      }
    }, "image/png");
  });
}

function retake(){
  state = { screen:"intro", i:0, answers:Array(TOTAL).fill(null), busy:false };
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
