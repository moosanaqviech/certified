<style>
  /* =====================================================================
     READINESS SHELL - frozen. Do not edit anything in this style block.
     All per-cert customization lives in the READINESS PAYLOAD script
     section (the R config object and the QUESTIONS array).

     The :root token block below is the exam engine's palette, kept
     identical on purpose: the readiness quiz is assessment-family and
     must read as a sibling of the practice exams. The domain-accent ramp
     is the ONLY added color, and it is used solely in the result-screen
     breakdown and the share card.
  ===================================================================== */
  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;
    --ink-soft:#a7a59f; --ink-faint:#6b6a66; --gold:#e3b84a; --green:#34d3a6; --red:#e8625c;
    --line:rgba(255,255,255,0.08);
    --display:"Fraunces",Georgia,serif; --body:"Hanken Grotesk",system-ui,sans-serif;
  }
  /* Domain-accent ramp. Result breakdown + share card only. These avoid
     the reserved trio: --green and --red (review correctness) and --gold
     (brand mark), so a domain bar never reads as right/wrong or as brand. */
  :root{
    --acc-1:#6ea8fe;  /* blue       */
    --acc-2:#a78bfa;  /* violet     */
    --acc-3:#4dd0e1;  /* cyan       */
    --acc-4:#f4a259;  /* orange     */
    --acc-5:#f6a5c0;  /* pink       */
    --acc-6:#b3c1ff;  /* periwinkle */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:radial-gradient(1100px 650px at 50% -8%,#1a1d29 0%,transparent 58%),var(--bg);font-family:var(--body);color:var(--ink);min-height:100vh;line-height:1.5;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* sticky top */
  .top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  /* intro */
  .intro{text-align:center;margin:auto 0;padding:30px 0;}
  .intro .badge{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px;}
  .intro h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.06;letter-spacing:-0.02em;margin-bottom:16px;}
  .intro p{color:var(--ink-soft);font-size:15.5px;max-width:30em;margin:0 auto 14px;}
  .facts{display:flex;justify-content:center;gap:0;margin:24px 0 28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .fact{flex:1;padding:16px 10px;}
  .fact+.fact{border-left:1px solid var(--line);}
  .fact b{display:block;font-family:var(--display);font-size:22px;font-weight:600;color:var(--gold);}
  .fact span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#14110c;font-weight:700;font-size:16px;padding:15px 30px;border-radius:14px;border:none;cursor:pointer;transition:transform .15s ease;font-family:var(--body);}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.35;pointer-events:none;}

  /* question flow (linear, auto-advance, lesson-style slide) */
  .qstage{position:relative;flex:1;overflow:hidden;}
  .qcard{opacity:1;transform:translateX(0);transition:opacity .3s ease,transform .3s cubic-bezier(.2,.7,.2,1);}
  .qcard.out-left{opacity:0;transform:translateX(-42px);}
  .qcard.out-right{opacity:0;transform:translateX(42px);}
  .qcard.in-right{opacity:0;transform:translateX(42px);}
  .qcard.in-left{opacity:0;transform:translateX(-42px);}

  .qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .qback{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-size:17px;cursor:pointer;transition:.15s;font-family:var(--body);flex:0 0 auto;}
  .qback:hover{border-color:rgba(255,255,255,0.2);color:var(--ink);}
  .qback.hide{visibility:hidden;}
  .qnum{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:0.04em;}
  .qtext{font-size:18px;line-height:1.5;font-weight:500;margin-bottom:20px;}
  .qtext code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:5px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);line-height:1.4;transition:border-color .15s,background .15s;width:100%;}
  .opt:hover{border-color:rgba(255,255,255,0.2);}
  .opt.sel{border-color:var(--gold);background:rgba(227,184,74,0.08);}
  .opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .opt.sel .key{background:var(--gold);color:#14110c;}

  /* review states */
  .opt.correct{border-color:var(--green);background:rgba(52,211,166,0.1);}
  .opt.correct .key{background:var(--green);color:#072018;}
  .opt.incorrect{border-color:var(--red);background:rgba(232,98,92,0.1);}
  .opt.incorrect .key{background:var(--red);color:#2a0a08;}
  .explain{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .explain b{color:var(--ink);}

  /* results */
  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:150px;height:150px;margin:6px auto 6px;}
  .scorering svg{transform:rotate(-90deg);}
  .scorering .tr{stroke:rgba(255,255,255,0.1);}
  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scorering .ctr b{font-family:var(--display);font-size:40px;font-weight:600;line-height:1;}
  .scorering .ctr em{font-style:normal;font-size:13px;color:var(--gold);font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-top:5px;}
  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}

  /* verdict band */
  .verdict-band{margin:16px auto 4px;max-width:30em;opacity:0;transform:translateY(10px);transition:opacity .25s ease,transform .25s ease;transition-delay:.55s;}
  .verdict-band.show{opacity:1;transform:none;}
  .verdict-band h2{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1;margin-bottom:6px;}
  .verdict-band p{color:var(--ink-soft);font-size:14.5px;line-height:1.5;margin:0 auto;}

  /* per-domain breakdown */
  .dbreak{margin:30px 0 6px;text-align:left;}
  .sec-head{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:4px;}
  .sec-sub{font-size:12.5px;color:var(--ink-faint);margin-bottom:16px;}
  .drow{margin-bottom:16px;}
  .drow .dtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:10px;}
  .drow .dname{font-size:13.5px;font-weight:600;color:var(--ink);}
  .drow .dscore{font-size:12.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .dtrack{position:relative;height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
  .dfill{height:100%;width:0;border-radius:6px;transition:width .7s cubic-bezier(.2,.7,.2,1);}
  .dmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,0.5);border-radius:2px;}
  .dweight{font-size:11px;color:var(--ink-faint);margin-top:5px;}

  /* prescriptions */
  .presc{margin:26px 0 6px;text-align:left;}
  .presc-card{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:11px;text-decoration:none;color:var(--ink);transition:border-color .15s,background .15s;}
  .presc-card:hover{border-color:rgba(255,255,255,0.2);background:var(--surface-2);}
  .presc-card .pc-dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;}
  .presc-card .pc-body{flex:1;}
  .presc-card .pc-dom{display:block;font-size:12px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px;}
  .presc-card .pc-line{display:block;font-size:14px;line-height:1.4;color:var(--ink);}
  .presc-card .pc-go{flex:0 0 auto;color:var(--ink-faint);font-size:18px;}

  /* actions */
  .res-actions{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
  .res-actions .btn{flex:1;min-width:44%;}

  /* email capture (opt-in, appears after results; hidden when unset) */
  .email{margin:26px 0 4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;}
  .email label{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:10px;}
  .email-row{display:flex;gap:9px;}
  .email input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;color:var(--ink);font-family:var(--body);font-size:15px;}
  .email input::placeholder{color:var(--ink-faint);}
  .email input:focus{outline:none;border-color:var(--gold);}
  .email .btn{padding:12px 18px;font-size:15px;}
  .email .note{font-size:12px;color:var(--ink-faint);margin-top:9px;}

  /* review (reused verbatim from the exam renderer) */
  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}

  /* offscreen canvas host for the share card */
  .sharehost{position:fixed;left:-99999px;top:0;}
</style>

<body>
<div class="app">
  <div class="top">
    <span class="lbl" id="topLbl">Readiness Quiz</span>
  </div>
  <div class="pbar"><i id="pbar"></i></div>

  <div class="body-wrap" id="root"></div>
</div>
<div class="sharehost"><canvas id="shareCanvas" width="1080" height="1080"></canvas></div>

<script>
/* =====================================================================
   READINESS PAYLOAD - BEGIN
   The only section you edit per cert: the R config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.

   Sourced from the Databricks Certified Generative AI Engineer Associate
   exam guide (edition covering the live exam as of 18 Mar 2026) and the
   course lessons. R.domains carries the 6 official sections directly, so
   the readout maps one to one onto the course's six units. prescribe /
   href are drawn from curriculum-index-databricks-genai-associate (6
   units, 55 chapters, 56 objectives).
===================================================================== */
const R = {
  cert:   "Databricks Generative AI Engineer Associate",
  code:   "Databricks GenAI Engineer Associate",
  badge:  "Databricks Generative AI · Associate",
  intro:  "Twelve scenario questions across all six exam sections. No timer, no signup. At the end you get a per-section readiness readout and exactly what to study next.",
  courseUrl: "../databricks-generative-ai-engineer-associate/index.html",   /* course home (Units 1 and 2 free) */

  /* The 6 official sections, in exam order. The guide publishes NO section
     percentages (the 14/14/30/22/8/12 split seen on third-party sites is
     not in the guide and must never be quoted). weight here is DERIVED
     from the objective count per section, 6/8/13/15/4/10 of 56, rounded to
     whole points (11/14/23/27/7/18, which sums to 100), and reads as the
     share of objectives, never as an official exam weighting. count sums
     to 12 and tracks those shares (1/2/3/3/1/2). accent = ramp token.
     prescribe + href from curriculum-index-databricks-genai-associate;
     each href deep links to the section's unit on the course home. */
  domains: [
    { id:"s1", name:"Design Applications", weight:11, count:1, accent:"var(--acc-1)",
      prescribe:"Unit 1 (Ch 1-7): translating a business goal into inputs and outputs, choosing the model task, prompts for a specific format, chain components, defining and ordering tools, and when Agent Bricks (Knowledge Assistant, Multiagent Supervisor, Information Extraction) fits.",
      href:"../databricks-generative-ai-engineer-associate/index.html#unit-1" },
    { id:"s2", name:"Data Preparation", weight:14, count:2, accent:"var(--acc-2)",
      prescribe:"Unit 2 (Ch 8-15): sourcing documents, extraction packages, filtering boilerplate, chunk size and overlap, advanced chunking, writing chunks to Delta tables in Unity Catalog, retrieval metrics, and re-ranking.",
      href:"../databricks-generative-ai-engineer-associate/index.html#unit-2" },
    { id:"s3", name:"Application Development", weight:23, count:3, accent:"var(--acc-3)",
      prescribe:"Unit 3 (Ch 16-27): orchestration frameworks, prompt augmentation, steering and guardrails, choosing the LLM and the embedding context length, model cards and experiment metrics, agents with MLflow and the Agent Framework, Genie Spaces, and evaluation versus monitoring.",
      href:"../databricks-generative-ai-engineer-associate/index.html#unit-3" },
    { id:"s4", name:"Assembling and Deploying Applications", weight:27, count:3, accent:"var(--acc-4)",
      prescribe:"Unit 4 (Ch 28-42): RAG application elements, pyfunc chains, Models in Unity Catalog, Mosaic AI Vector Search indexes and sizing, Foundation Model APIs, endpoint resource access, ai_query() batch inference, memory stores, MCP servers, prompt versions and aliases, CI/CD, and user-facing interfaces.",
      href:"../databricks-generative-ai-engineer-associate/index.html#unit-4" },
    { id:"s5", name:"Governance", weight:7, count:1, accent:"var(--acc-5)",
      prescribe:"Unit 5 (Ch 43-46): masking as a guardrail, defending against malicious input, legal and licensing limits on data and models, and mitigating problematic text in a corpus.",
      href:"../databricks-generative-ai-engineer-associate/index.html#unit-5" },
    { id:"s6", name:"Evaluation and Monitoring", weight:18, count:2, accent:"var(--acc-6)",
      prescribe:"Unit 6 (Ch 47-55): quantitative model metrics, judges that need ground truth, custom Scorers, agent evaluation with tracing, SME feedback, what to monitor, inference tables and Agent Monitoring, AI Gateway surfaces, and cost control.",
      href:"../databricks-generative-ai-engineer-associate/index.html#unit-6" }
  ],

  /* Verdict bands on raw correct count out of 12 (not weighted). Descending
     by min; the first whose min is met wins. */
  bands: [
    { min:10, key:"ready",      label:"Exam-ready",       note:"You are scoring where passing candidates score. Tighten your weakest section below, then book it." },
    { min:7,  key:"close",      label:"Close: 1-2 weeks", note:"A focused week or two on the sections flagged below should get you over the line." },
    { min:4,  key:"foundation", label:"Foundation needed",note:"The core is forming but has gaps. Work the flagged units in order before drilling practice exams." },
    { min:0,  key:"start",      label:"Start from Unit 1", note:"Best to build from the ground up across the 55-chapter course. Units 1 and 2 are free, and the full course is the fastest path." }
  ]
};

const QUESTIONS = [
  /* ---------- Section 1: Design Applications (1) ---------- */

  /* Q1 - Model task and minimal chain from the spec (Ch 3, 5) */
  {
    domain:"s1",
    q:`An insurer receives claim emails and wants a pipeline that lands four fields per email in a Delta table: claimant name, policy number, incident date, and claimed amount. Everything needed is in the email itself. Which model task and minimal chain fit the spec?`,
    opts:[
      "Summarization, with a prompt template, model, and string output parser",
      "Extraction, with a prompt template, model, and structured output parser",
      "Extraction, with a retriever over the policy documents in front of the prompt template, model, and structured output parser",
      "Generation, with a tool-calling agent that decides per email which fields to look up"
    ],
    correct:1,
    explain:`The output spec reads like table columns whose values appear in the text, which is extraction's contract (<code>ai_extract</code> on Databricks), and the input is self-contained, so the chain is the core trio with a structured parser and no retriever. Option C is the trap: a retriever adds grounding the spec never asked for, since nothing in the email needs looking up in company documents, and the exam treats extra components as the wrong answer. Summarization keeps the narrative rather than the named values, and an agent spends runtime decisions on a path that never varies.`
  },

  /* ---------- Section 2: Data Preparation (2) ---------- */

  /* Q2 - Chunk size, overlap, and the embedding count (Ch 11) */
  {
    domain:"s2",
    q:`A 1,000,000-token corpus is chunked at 500 tokens with a 100-token overlap. To sharpen matching, an engineer proposes 250-token chunks with a 50-token overlap, noting that the overlap stays at 20 percent of the chunk either way. What happens to the number of embeddings the pipeline must compute and store?`,
    opts:[
      "It roughly doubles, because the stride between chunk starts falls from 400 to 200 tokens",
      "It stays about the same, because the overlap is still 20 percent of the chunk size on both settings",
      "It roughly halves, because each chunk is half the size and the overlap shrinks with it",
      "It falls by about a quarter, because the overlap was cut from 100 tokens to 50"
    ],
    correct:0,
    explain:`Chunks are laid down every (size minus overlap) tokens, so the old stride of 400 gives about 2,500 chunks and the new stride of 200 gives about 5,000: twice the embeddings to compute, store, and search. The unchanged overlap ratio (option B) is the trap, because the embedding count follows the absolute stride, not the ratio, and shrinking chunks multiplies them faster than any overlap saving. Smaller chunks may well sharpen matching, but the budget has to be counted first, which is why the exam guide pairs a larger chunk size with less overlap when the goal is fewer embeddings.`
  },

  /* Q3 - Reading precision against recall, and the fix (Ch 14, 15) */
  {
    domain:"s2",
    q:`On a labeled evaluation set, a RAG retriever scores recall@5 of 0.95 but precision@5 of 0.30, and the generated answers keep drifting onto topics the user never asked about. The endpoint has latency headroom. Which change targets the measured problem?`,
    opts:[
      "Raise top-k to 10 so that more of the relevant chunks reach the prompt",
      "Add chunk overlap so that no fact is cut at a chunk boundary",
      "Re-rank the retrieved candidates and pass fewer chunks to the prompt, tracking precision@k",
      "Switch to an embedding model with a longer context length so each chunk carries more surrounding context"
    ],
    correct:2,
    explain:`High recall with low precision means the evidence is already arriving but it is buried in noise, and noise in the prompt is exactly what produces off-topic answers. A re-ranking pass reads query and chunk together, orders the candidates well, and lets the app keep only the strongest few, which raises precision@k without giving up the recall that is already fine. Raising top-k (option A) is the trap: recall is not the problem, and five more chunks mostly add more noise. Overlap and embedding context length address chunking failures that these metrics do not show.`
  },

  /* ---------- Section 3: Application Development (3) ---------- */

  /* Q4 - Embedding context length for section-level chunks (Ch 22, 11) */
  {
    domain:"s3",
    q:`A legal team's RAG corpus is chunked at the section level, about 1,500 tokens each, because a rule and its exceptions must stay in one chunk. The current embedding model has a 512-token context length, and questions about the end of long sections return nothing useful. Quality comes first. Which embedding choice fixes it?`,
    opts:[
      "Keep the 512-token model, since queries are short and the window only needs to fit the query",
      "Keep the 512-token model for the index and embed only the queries with a longer-context model",
      "Re-chunk at 300 tokens so every chunk fits inside the 512-token window",
      "Re-embed the whole index and the queries with a long-context model such as databricks-gte-large-en"
    ],
    correct:3,
    explain:`Text past the embedding model's context length is truncated silently, so the tail of every 1,500-token section never entered a vector and no query can find it. With quality first and chunks that must stay whole, the fix is a longer window on the document side: <code>databricks-gte-large-en</code> takes 8,192 tokens, and the same model must embed the queries, which means rebuilding the index. Option B is the trap: a different model on the query side places meanings in an unrelated vector space, so results still come back but relevance collapses. Re-chunking at 300 tokens (C) fits the window by breaking the rule-plus-exceptions unit the team required.`
  },

  /* Q5 - Which guardrail layer can see the problem (Ch 20) */
  {
    domain:"s3",
    q:`An internal IT helpdesk assistant is being used to write poems and summarize news. Every such request costs a full generation, and some replies have embarrassed the company. The new requirement is that off-scope requests must never reach the model and must get a standard refusal. Where does the control belong?`,
    opts:[
      "In the system prompt, with scope and refusal rules the model is told to follow",
      "On the output, with a moderation check on the draft response before it is returned to the user",
      "On the input, with a topic screen that returns a canned refusal before the model is called",
      "In the generation settings, with a lower temperature so the model stays on task"
    ],
    correct:2,
    explain:`An input-side check runs before any generation, so a rejected request costs zero model tokens and the refusal is deterministic, which is the only layer that satisfies "must never reach the model". The system prompt (option A) is the trap: it is always present but never sufficient, because the rules are just tokens the model weighs, and the model still runs and still bills. Output moderation would catch the embarrassing replies, but only after the generation has been paid for, and temperature shifts probabilities without enforcing anything.`
  },

  /* Q6 - Documents plus tables with no engineering capacity (Ch 26, 7) */
  {
    domain:"s3",
    q:`A people-operations team wants one assistant that answers policy questions from its HR handbook and headcount questions from governed Unity Catalog tables. It needs to be live this week, has no engineers to write or maintain agent code, and has no custom routing or tool requirements. Which build fits?`,
    opts:[
      "A Mosaic AI Agent Framework agent in code, with a vector retriever tool and a GenieAgent subagent, deployed with agents.deploy()",
      "An Agent Bricks Multiagent Supervisor with a Knowledge Assistant over the handbook and a Genie Space over the tables",
      "A single Knowledge Assistant, with the headcount tables exported to text nightly and added to its documents",
      "A Genie Space alone, with the handbook loaded into a table so one specialist can answer both kinds of question"
    ],
    correct:1,
    explain:`Documents and tables need different retrieval machinery, and with no engineering capacity and no custom routing the no-code route is the Multiagent Supervisor: add a Knowledge Assistant for the handbook and a Genie Space as a second specialist, and the Supervisor routes each question and combines the answers. Writing the Agent Framework agent (option A) is the trap, because it also works and is the right call when custom tools or routing are needed, but it is code this team cannot write or maintain by the deadline. Exporting the tables to text (C) goes stale as soon as the data changes and cannot aggregate, and a Genie Space is a specialist for tables, not for a handbook.`
  },

  /* ---------- Section 4: Assembling and Deploying Applications (3) ---------- */

  /* Q7 - Index type when the team owns the embedding pipeline (Ch 32) */
  {
    domain:"s4",
    q:`A team already computes embeddings in its own streaming job, using an embedding model it hosts outside Databricks, and wants to push each vector into a Mosaic AI Vector Search index the moment it is produced. There is no Delta table that holds the chunks. Which index type fits?`,
    opts:[
      "A Delta Sync Index with Databricks-computed embeddings, pointed at the streaming job's output",
      "A Delta Sync Index with self-managed embeddings, so the team's own vectors are used",
      "A Delta Sync Index on a Storage Optimized endpoint with continuous sync",
      "A Direct Vector Access Index, with the job writing vectors through the API"
    ],
    correct:3,
    explain:`A Direct Vector Access Index has no source table and no automatic sync: the team inserts, updates, and deletes vectors itself through the API, which is exactly the shape of a streaming job that already owns the embedding pipeline. Self-managed embeddings on a Delta Sync Index (option B) is the trap, because it does let you supply precomputed vectors, but only from an <code>embedding_vector_column</code> on a source Delta table that the sync pipeline tracks, and here no such table exists. Continuous sync is a Delta Sync feature, and it is not available on Storage Optimized endpoints in any case.`
  },

  /* Q8 - Passthrough identity versus on-behalf-of-user (Ch 36) */
  {
    domain:"s4",
    q:`An agent deployed with automatic authentication passthrough queries a sales table that carries row filters by region. In the notebook each analyst saw only their own region, but through the served endpoint every analyst sees every region's rows. What is the cause, and the fix?`,
    opts:[
      "The endpoint runs as one service principal for all callers; use on-behalf-of-user authentication so queries run as each user",
      "The table was left out of resources= at log time; add it and redeploy so the credential is scoped to it",
      "Endpoint ACLs are too broad; grant CAN_QUERY only to the regional analyst groups so that each group can reach only its own rows",
      "Row filters do not apply to Model Serving; move the regional filtering into the agent's prompt"
    ],
    correct:0,
    explain:`Automatic passthrough gives the endpoint its own system service principal, so every caller's query hits the table as the same identity and the row filters resolve the same way for everyone. When data access must differ per user, the agent has to carry the calling user's identity, which is on-behalf-of-user authentication through <code>ModelServingUserCredentials</code>. Adding the table to <code>resources=</code> (option B) is the trap: declared resources decide what the endpoint can reach, and it plainly reaches the table already, so the problem is which identity it reaches it as. Endpoint ACLs govern who may invoke the endpoint, not which rows a query returns.`
  },

  /* Q9 - Why an alias move did not reach production (Ch 40, 41) */
  {
    domain:"s4",
    q:`A deployed agent loads its prompt with <code>load_prompt("prompts:/support-summary/3")</code>. The team registers version 4, evaluates it, and moves the production alias to it, yet the endpoint keeps answering with the version 3 wording. Why?`,
    opts:[
      "Alias moves only take effect after the new version is merged into the main git branch",
      "Version 4 must first be copied into the production catalog before the alias can resolve to it",
      "Moving an alias never changes a served prompt on its own; rolling out version 4 requires redeploying the endpoint",
      "The code pins version 3 by number; it should load the alias, prompts:/support-summary@production"
    ],
    correct:3,
    explain:`Application code is meant to reference the alias, never a version number: with <code>prompts:/support-summary@production</code>, moving the alias to version 4 is the promotion and every caller follows without a code change or redeploy, and rolling back is just pointing the alias at version 3 again. Option C is the trap, because it describes what the pinned URI makes it look like, but the alias mechanism exists precisely so promotion does not need a redeploy. Branch merges are not how MLflow promotes prompts, and prompt versions are not copied between catalogs to be promoted.`
  },

  /* ---------- Section 5: Governance (1) ---------- */

  /* Q10 - Masking at the data layer, not only at the gateway (Ch 43, 20) */
  {
    domain:"s5",
    q:`A support assistant indexes ticket text that contains customers' phone numbers. The Mosaic AI Gateway PII guardrail masks the output, yet the chat UI shows retrieved chunks as citations, and reviewers found raw numbers in those citations. Availability must not drop. What closes the gap?`,
    opts:[
      "Also enable PII masking on the input phase of the gateway",
      "Mask the ticket text at the data layer with a Unity Catalog column mask before chunking, then rebuild the index",
      "Switch the gateway guardrail from mask to block so any response touching PII is refused",
      "Rely on Vector Search encryption at rest, since the index is already protected"
    ],
    correct:1,
    explain:`The gateway guards traffic, but the citations are retrieved chunks, so the PII was already embedded and matched before any output guardrail ran. Masking at the data layer, with a Unity Catalog column mask applied before the chunking job reads the text, keeps the numbers out of the index entirely, and the gateway mask stays on as defense in depth for what users type. Input-phase masking (option A) is the trap: it protects what users send, not what retrieval surfaces. Blocking (C) would protect the data at the cost of the availability objective, and encryption at rest protects storage, not what an entitled query returns.`
  },

  /* ---------- Section 6: Evaluation and Monitoring (2) ---------- */

  /* Q11 - Which judges labels unlock (Ch 48, 14) */
  {
    domain:"s6",
    q:`A team has run RelevanceToQuery, RetrievalGroundedness, and Safety on production traces since launch. It has now curated 200 evaluation examples, each with an expected answer. Which judges does that labeling newly make available, and why?`,
    opts:[
      "Correctness and RetrievalSufficiency, because both compare against the expected answer",
      "RetrievalGroundedness, because checking that an answer is supported now has a reference to check against",
      "RetrievalRelevance and Safety, which were waiting on labeled examples",
      "None of the built-in judges; only a custom @scorer can read the expectations field"
    ],
    correct:0,
    explain:`Correctness compares the response to a labeled expected answer, and RetrievalSufficiency asks whether the retrieved chunks contain everything that expected answer needs, so both are ground-truth judges that could not run until the labels existed. RetrievalGroundedness (option B) is the trap: it checks the answer against the retrieved context, not against a reference, which is why the team could already run it on unlabeled traffic. Relevance and Safety are reference-free too, and the built-in judges read the expectations directly, so a custom scorer is not required to use them.`
  },

  /* Q12 - From a flagged production failure back to the release gate (Ch 53, 54, 48) */
  {
    domain:"s6",
    q:`Agent Monitoring flags a cluster of low-groundedness responses from a live RAG endpoint last week. The team wants to read exactly what those users asked and what came back, and to make sure the next release cannot ship the same failures. What is the Databricks-native path?`,
    opts:[
      "Enable usage tables, which store each request's full prompt and response alongside its token counts and caller",
      "Rate-limit the callers who produced the flagged requests until the next release",
      "Query the inference table for the flagged requests and add them, once labeled, to the release evaluation dataset",
      "Turn off the groundedness judge in monitoring, since it cannot run reliably without ground truth"
    ],
    correct:2,
    explain:`The inference table is a governed Unity Catalog Delta table of requests and responses, so the flagged traces can be filtered and read with SQL, and once labeled they become new evaluation examples (and ground truth for the Correctness judge) that <code>mlflow.genai.evaluate()</code> runs before the next release. Usage tables (option A) are the trap: they are the AI Gateway's accounting surface, token counts and volume per caller, and hold no payloads. Rate limiting shapes traffic rather than fixing quality, and groundedness is reference-free, so it needs no ground truth and should stay on.`
  }
];

const EMAIL_ENDPOINT = "/api/subscribe";

const TOTAL = QUESTIONS.length;

let state = { screen:"intro", i:0, answers:Array(TOTAL).fill(null), busy:false };

const root = document.getElementById("root");
const pbar = document.getElementById("pbar");
const topLbl = document.getElementById("topLbl");

document.title = `Readiness Quiz · ${R.cert}`;

function setProgress(){
  if(state.screen==="test"){
    const answered = state.answers.filter(a=>a!==null).length;
    pbar.style.width = (answered/TOTAL*100)+"%";
  } else if(state.screen==="results"){ pbar.style.width="100%"; }
  else pbar.style.width="0%";
}

/* ---------- render ---------- */
function render(){
  if(state.screen==="intro") return renderIntro();
  if(state.screen==="test") return renderTest();
  if(state.screen==="results") return renderResults();
}

function renderIntro(){
  topLbl.textContent = "Readiness Quiz";
  root.innerHTML = `
    <div class="intro">
      <div class="badge">${R.badge}</div>

        <div class="fact"><b>${R.domains.length}</b><span>domains</span></div>
        <div class="fact"><b>~8</b><span>minutes</span></div>
      </div>
      <p style="font-size:13px;color:var(--ink-faint)">No timer, no signup. Your per-domain readout and what to study next come at the end.</p>
      <div style="margin-top:24px"><button class="btn" id="startBtn">Start &rarr;</button></div>
    </div>`;
  document.getElementById("startBtn").onclick = ()=>{ state.screen="test"; state.i=0; render(); setProgress(); };
  setProgress();
}

/* ---------- linear question flow with slide transition ---------- */
function renderTest(){
  root.innerHTML = `<div class="qstage"><div class="qcard" id="qcard"></div></div>`;
  paintQuestion();
}

function questionHTML(i){
  const Q = QUESTIONS[i];
  return `
    <div class="qhead">
      <button class="qback ${i===0?'hide':''}" id="backBtn" aria-label="Back">&larr;</button>
      <span class="qnum">QUESTION ${i+1} OF ${TOTAL}</span>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i]===j?'sel':''}" data-j="${j}">
          <span class="key">${"ABCD"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>`;
}

function wireQuestion(i){
  const card = document.getElementById("qcard");
  card.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=> selectAnswer(i, Number(el.dataset.j), el);
  });
  const back = document.getElementById("backBtn");
  if(back) back.onclick = ()=> goBack(i);
}

function paintQuestion(){
  const i = state.i;
  topLbl.textContent = `Question ${i+1} / ${TOTAL}`;
  const card = document.getElementById("qcard");
  card.className = "qcard";
  card.innerHTML = questionHTML(i);
  wireQuestion(i);
  setProgress();
}

function selectAnswer(i, j, el){
  if(state.busy) return;
  state.answers[i] = j;
  const card = document.getElementById("qcard");
  card.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
  el.classList.add("sel");
  setProgress();
  state.busy = true;
  /* brief beat so the selection registers, then slide out */
  setTimeout(()=>{
    card.classList.add("out-left");
    setTimeout(()=>{
      if(i === TOTAL-1){ finish(); return; }
      state.i = i+1;
      slideIn("in-right");
    }, 300);
  }, 250);
}

function goBack(i){
  if(state.busy || i===0) return;
  state.busy = true;
  const card = document.getElementById("qcard");
  card.classList.add("out-right");
  setTimeout(()=>{
    state.i = i-1;
    slideIn("in-left");
  }, 300);
}

function slideIn(fromClass){
  const i = state.i;
  topLbl.textContent = `Question ${i+1} / ${TOTAL}`;
  const card = document.getElementById("qcard");
  card.className = "qcard " + fromClass;
  card.innerHTML = questionHTML(i);
  wireQuestion(i);
  setProgress();
  /* force reflow so the incoming offset is applied before we clear it */
  void card.offsetWidth;
  requestAnimationFrame(()=>{
    card.className = "qcard";
    setTimeout(()=>{ state.busy = false; }, 320);
  });
}

function finish(){
  state.screen = "results";
  render();
  setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- scoring ---------- */
function score(){
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(state.answers[idx]===Q.correct) c++; });
  return c;
}

function domainScores(){
  return R.domains.map(d=>{
    let correct=0, count=0;
    QUESTIONS.forEach((Q,idx)=>{
      if(Q.domain===d.id){ count++; if(state.answers[idx]===Q.correct) correct++; }
    });
    return { d, correct, count, frac: count? correct/count : 0 };
  });
}

function bandFor(c){
  /* R.bands descend by min; first whose min is met wins. Raw count, not weighted. */
  return R.bands.find(b=> c>=b.min) || R.bands[R.bands.length-1];
}

/* ---------- results ---------- */
function renderResults(){
  topLbl.textContent = "Your readiness";
  state.busy = false;
  const c = score(), pct = Math.round(c/TOTAL*100);
  const band = bandFor(c);
  const ds = domainScores();
  const RAD = 66, CIRC = 2*Math.PI*RAD, off = CIRC*(1-pct/100);

  /* prescriptions: any domain below full marks, weakest first
     (lowest fraction, tie-broken by higher exam weight). */
  const weak = ds.filter(x=> x.correct < x.count)
                 .sort((a,b)=> (a.frac-b.frac) || (b.d.weight-a.d.weight));

  root.innerHTML = `
    <div class="res">
      <div class="scorering">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle class="tr" cx="75" cy="75" r="${RAD}" fill="none" stroke-width="9"/>
          <circle class="fl" cx="75" cy="75" r="${RAD}" fill="none" stroke-width="9" stroke="var(--gold)" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${CIRC.toFixed(1)}"/>
        </svg>
        <div class="ctr"><b id="pctNum">0%</b><em>ready</em><span>${c} / ${TOTAL} correct</span></div>
      </div>

      <div class="verdict-band" id="verdictBand">
        <h2>${band.label}</h2>
        <p>${band.note}</p>
      </div>
    </div>

    <div class="dbreak">
      <div class="sec-head">By domain</div>
      <div class="sec-sub">Your score in each domain against how much it weighs on the exam (the tick).</div>
      ${ds.map((x,idx)=>{
        const w = x.frac*100;
        return `<div class="drow">
          <div class="dtop">
            <span class="dname">${x.d.name}</span>
            <span class="dscore">${x.correct}/${x.count}</span>
          </div>
          <div class="dtrack">
            <div class="dfill" data-w="${w}" style="background:${x.d.accent};transition-delay:${(0.6+idx*0.09).toFixed(2)}s"></div>
            <div class="dmark" style="left:${x.d.weight}%"></div>
          </div>
          <div class="dweight">${x.d.weight}% of exam</div>
        </div>`;
      }).join("")}
    </div>

    ${weak.length ? `<div class="presc">
      <div class="sec-head">What to study next</div>
      <div class="sec-sub">Weakest domain first. Each links straight into the course.</div>
      ${weak.map(x=>`
        <a class="presc-card" href="${x.d.href}">
          <span class="pc-dot" style="background:${x.d.accent}"></span>
          <span class="pc-body">
            <span class="pc-dom">${x.d.name} &middot; ${x.correct}/${x.count}</span>
            <span class="pc-line">${x.d.prescribe}</span>
          </span>
          <span class="pc-go">&rarr;</span>
        </a>`).join("")}
    </div>` : `<div class="presc">
      <div class="sec-head">Full marks across every domain</div>
      <div class="sec-sub">Nothing flagged. Drill a timed practice exam to confirm, then book it.</div>
    </div>`}

    <div class="res-actions">
      <button class="btn" id="shareBtn">Share result</button>
      <button class="btn sec" id="reviewBtn">Review answers</button>
      <button class="btn sec" id="retakeBtn">Retake</button>
    </div>

    ${EMAIL_ENDPOINT ? `<form class="email" id="emailForm">
      <label>Get the ${R.cert} study plan and launch updates</label>
      <div class="email-row">
        <input type="email" id="emailInput" required placeholder="you@example.com" autocomplete="email">
        <button class="btn" type="submit">Send</button>
      </div>
      <div class="note" id="emailNote">One email with your readout and a suggested study order. No spam.</div>
    </form>` : ``}

    <div id="review"></div>`;

  /* mount animation: ring fill + count-up + verdict + staggered bars */
  requestAnimationFrame(()=>{
    const fl = root.querySelector(".fl");
    if(fl) fl.style.strokeDashoffset = off.toFixed(1);
    const vb = document.getElementById("verdictBand");
    if(vb) vb.classList.add("show");
    root.querySelectorAll(".dfill").forEach(el=>{ el.style.width = el.dataset.w + "%"; });
    countUp(document.getElementById("pctNum"), pct, 1000);
  });

  document.getElementById("shareBtn").onclick = shareResult;
  document.getElementById("retakeBtn").onclick = retake;
  document.getElementById("reviewBtn").onclick = ()=>{ renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth"}); };
  const ef = document.getElementById("emailForm");
  if(ef) ef.onsubmit = submitEmail;
}

function countUp(el, target, ms){
  if(!el) return;
  const start = performance.now();
  function frame(now){
    const t = Math.min(1, (now-start)/ms);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = Math.round(eased*target) + "%";
    if(t<1) requestAnimationFrame(frame);
    else el.textContent = target + "%";
  }
  requestAnimationFrame(frame);
}

/* ---------- review (reused verbatim from the exam renderer) ---------- */
function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], ok=mine===Q.correct;
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(j===Q.correct) cls+=" correct";
          else if(j===mine) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCD"[j]}</span><span>${o}${j===mine?'  &middot;  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake quiz</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

/* ---------- email capture ---------- */
function readCookie(name){
  const m = document.cookie.match(new RegExp("(?:^|;\\s*)" + name + "=([^;]+)"));
  return m ? decodeURIComponent(m[1]) : "";
}
/* Segment key: the /ready/<slug> filename is the reliable cert slug (R.code is
   not consistent across quizzes). */
function quizSlug(){
  const parts = location.pathname.replace(/\/+$/,"").split("/");
  let last = parts[parts.length-1] || "";
  if(last.endsWith(".html")) last = last.slice(0,-5);
  return last || String(R.code||"").toLowerCase();
}
function newEventId(){
  try{ if(window.crypto && crypto.randomUUID) return "lead_"+crypto.randomUUID(); }catch(_e){}
  return "lead_"+Date.now()+"_"+Math.random().toString(16).slice(2);
}
/* isApp(): true inside the mobile app, which opens pages with ?app=1 (the
   flag is remembered in sessionStorage for the WebView session), so sessions can be
   suppressed or tagged once the mobile project supplies a signal (custom UA
   token, query param, or injected flag). No signal exists today, so this is
   always false and web behaviour is unchanged. */
function isApp(){ try{ if(/[?&]app=1(?:&|$)/.test(location.search)){ sessionStorage.setItem("cc_app","1"); return true; } return sessionStorage.getItem("cc_app")==="1"; }catch(_e){ return false; } }

function submitEmail(e){
  e.preventDefault();
  if(!EMAIL_ENDPOINT) return;
  const input = document.getElementById("emailInput");
  const note = document.getElementById("emailNote");
  const btn = e.target.querySelector("button[type=submit]");
  const email = (input && input.value || "").trim();
  if(!email){ if(note) note.textContent = "Enter your email to get your plan."; return; }
  if(btn){ btn.disabled = true; btn.textContent = "Sending..."; }

  const eid = newEventId();
  const slug = quizSlug();
  const payload = {
    email: email, slug: slug, cert: R.cert,
    correct: score(), total: TOTAL,
    event_id: eid, fbp: readCookie("_fbp"), fbc: readCookie("_fbc"),
    event_source_url: location.href
  };
  fetch(EMAIL_ENDPOINT, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json().catch(function(){ return {}; }); })
    .then(function(d){
      if(d && d.ok){
        if(note) note.textContent = "Done. Check your inbox to confirm and get your plan.";
        if(input) input.disabled = true;
        if(btn) btn.textContent = "Sent";
        /* Lead conversion: pixel + GA4, sharing event_id with the server-side
           Lead sent by /api/subscribe so Meta deduplicates the pair. Fired only
           on a confirmed signup, and suppressed inside the app. */
        if(!isApp()){
          try{ if(typeof fbq==="function") fbq("track","Lead",
            {content_name:R.cert,content_category:slug},{eventID:eid}); }catch(_e){}
          try{ if(typeof gtag==="function") gtag("event","generate_lead",
            {event_id:eid,cert:R.cert,quiz_slug:slug}); }catch(_e){}
        }
      } else {
        if(note) note.textContent = (d && d.error) || "Could not send just now. Try again in a moment.";
        if(btn){ btn.disabled = false; btn.textContent = "Send"; }
      }
    })
    .catch(function(){
      if(note) note.textContent = "Could not send just now. Try again in a moment.";
      if(btn){ btn.disabled = false; btn.textContent = "Send"; }
    });
}

/* ---------- share card (Canvas, 1080x1080) ---------- */
function resolveColor(v){
  v = (v||"").trim();
  const m = v.match(/^var\((--[a-z0-9-]+)\)$/i);
  if(m){
    const c = getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim();
    return c || "#6ea8fe";
  }
  return v || "#6ea8fe";
}

function rr(ctx, x, y, w, h, r){
  r = Math.min(r, h/2, w/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawShareCard(){
  const cv = document.getElementById("shareCanvas");
  const ctx = cv.getContext("2d");
  const W = 1080, H = 1080, M = 88;

  /* Visual Brain palette (marketing artifact, brand-governed) */
  const GROUND = "#14161c", CREAM = "#e9e6dd", MUTED = "#8b90a0", FAINT = "#62647a";
  const PANEL = "#1b1e26", GOLD = "#d9a441";

  const c = score(), pct = Math.round(c/TOTAL*100);
  const ds = domainScores();

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = GROUND; ctx.fillRect(0,0,W,H);
  ctx.textBaseline = "alphabetic";

  /* eyebrow */
  ctx.fillStyle = FAINT;
  ctx.font = '700 26px "Hanken Grotesk", system-ui, sans-serif';
  ctx.fillText("CERTIFY  ·  READINESS", M, 168);

  /* big figure */
  ctx.fillStyle = GOLD;
  ctx.font = '600 210px "Fraunces", Georgia, serif';
  const figure = pct + "%";
  ctx.fillText(figure, M-4, 440);
  const figW = ctx.measureText(figure).width;
  ctx.fillStyle = CREAM;
  ctx.font = '500 62px "Fraunces", Georgia, serif';
  ctx.fillText("ready", M + figW + 26, 440);

  /* cert code */
  ctx.fillStyle = MUTED;
  ctx.font = '600 34px "Hanken Grotesk", system-ui, sans-serif';
  ctx.fillText(R.code + "  ·  " + c + " / " + TOTAL + " correct", M, 512);

  /* domain mini-bars, scaled so N rows always sit above the brand mark */
  const barX = M, barW = W - M*2;
  const bandTop = 630, bandBottom = 918;
  const rowH = ds.length > 1 ? Math.min(92, (bandBottom - bandTop) / (ds.length - 1)) : 0;
  let y = bandTop;
  ds.forEach(x=>{
    const acc = resolveColor(x.d.accent);
    ctx.fillStyle = CREAM;
    ctx.font = '600 27px "Hanken Grotesk", system-ui, sans-serif';
    const name = x.d.name.length > 34 ? x.d.name.slice(0,33)+"…" : x.d.name;
    ctx.fillText(name, barX, y);
    ctx.fillStyle = MUTED;
    ctx.textAlign = "right";
    ctx.fillText(x.correct + "/" + x.count, barX + barW, y);
    ctx.textAlign = "left";
    /* track */
    ctx.fillStyle = PANEL;
    rr(ctx, barX, y+18, barW, 16, 8); ctx.fill();
    /* fill */
    const fw = Math.max(16, barW * x.frac);
    ctx.fillStyle = acc;
    rr(ctx, barX, y+18, fw, 16, 8); ctx.fill();
    y += rowH;
  });

  /* brand mark: gold check + wordmark, bottom-left */
  const markY = 1004;
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(M, markY-9);
  ctx.lineTo(M+13, markY+6);
  ctx.lineTo(M+38, markY-24);
  ctx.stroke();
  ctx.fillStyle = CREAM;
  ctx.font = '600 34px "Hanken Grotesk", system-ui, sans-serif';
  ctx.fillText("certify.courses", M+56, markY+2);

  return cv;
}

function shareResult(){
  const btn = document.getElementById("shareBtn");
  const restore = ()=>{ if(btn){ btn.disabled=false; btn.textContent="Share result"; } };
  if(btn){ btn.disabled=true; btn.textContent="Preparing…"; }

  const fonts = [
    '600 210px "Fraunces"',
    '500 62px "Fraunces"',
    '700 26px "Hanken Grotesk"',
    '600 34px "Hanken Grotesk"'
  ];
  const ready = (document.fonts && document.fonts.load)
    ? Promise.all(fonts.map(f=>document.fonts.load(f))).catch(()=>{})
    : Promise.resolve();

  ready.then(()=>{
    const cv = drawShareCard();
    cv.toBlob(blob=>{
      if(!blob){ restore(); return; }
      const c = score(), pct = Math.round(c/TOTAL*100);
      const file = new File([blob], `readiness-${R.code}.png`, { type:"image/png" });
      const shareData = {
        files:[file],
        title:`${R.code} readiness`,
        text:`I'm ${pct}% ready for the ${R.code}. Check yours at certify.courses.`
      };
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        navigator.share(shareData).catch(()=>{}).finally(restore);
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `readiness-${R.code}.png`;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        restore();
      }
    }, "image/png");
  });
}

function retake(){
  state = { screen:"intro", i:0, answers:Array(TOTAL).fill(null), busy:false };
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
