<style>
  /* =====================================================================
     READINESS SHELL - frozen. Do not edit anything in this style block.
     All per-cert customization lives in the READINESS PAYLOAD script
     section (the R config object and the QUESTIONS array).

     The :root token block below is the exam engine's palette, kept
     identical on purpose: the readiness quiz is assessment-family and
     must read as a sibling of the practice exams. The domain-accent ramp
     is the ONLY added color, and it is used solely in the result-screen
     breakdown and the share card.
  ===================================================================== */
  :root{
    --bg:#0b0d12; --surface:#161a22; --surface-2:#1d2230; --ink:#f3f0ea;
    --ink-soft:#a7a59f; --ink-faint:#6b6a66; --gold:#e3b84a; --green:#34d3a6; --red:#e8625c;
    --line:rgba(255,255,255,0.08);
    --display:"Fraunces",Georgia,serif; --body:"Hanken Grotesk",system-ui,sans-serif;
  }
  /* Domain-accent ramp. Result breakdown + share card only. These avoid
     the reserved trio: --green and --red (review correctness) and --gold
     (brand mark), so a domain bar never reads as right/wrong or as brand. */
  :root{
    --acc-1:#6ea8fe;  /* blue       */
    --acc-2:#a78bfa;  /* violet     */
    --acc-3:#4dd0e1;  /* cyan       */
    --acc-4:#f4a259;  /* orange     */
    --acc-5:#f6a5c0;  /* pink       */
    --acc-6:#b3c1ff;  /* periwinkle */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:radial-gradient(1100px 650px at 50% -8%,#1a1d29 0%,transparent 58%),var(--bg);font-family:var(--body);color:var(--ink);min-height:100vh;line-height:1.5;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* sticky top */
  .top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .top .lbl{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .pbar{height:3px;background:rgba(255,255,255,0.1);}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease;}

  .body-wrap{flex:1;padding:26px 22px 30px;display:flex;flex-direction:column;}

  /* intro */
  .intro{text-align:center;margin:auto 0;padding:30px 0;}
  .intro .badge{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px;}
  .intro h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.06;letter-spacing:-0.02em;margin-bottom:16px;}
  .intro p{color:var(--ink-soft);font-size:15.5px;max-width:30em;margin:0 auto 14px;}
  .facts{display:flex;justify-content:center;gap:0;margin:24px 0 28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .fact{flex:1;padding:16px 10px;}
  .fact+.fact{border-left:1px solid var(--line);}
  .fact b{display:block;font-family:var(--display);font-size:22px;font-weight:600;color:var(--gold);}
  .fact span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#14110c;font-weight:700;font-size:16px;padding:15px 30px;border-radius:14px;border:none;cursor:pointer;transition:transform .15s ease;font-family:var(--body);}
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn:disabled{opacity:.35;pointer-events:none;}

  /* question flow (linear, auto-advance, lesson-style slide) */
  .qstage{position:relative;flex:1;overflow:hidden;}
  .qcard{opacity:1;transform:translateX(0);transition:opacity .3s ease,transform .3s cubic-bezier(.2,.7,.2,1);}
  .qcard.out-left{opacity:0;transform:translateX(-42px);}
  .qcard.out-right{opacity:0;transform:translateX(42px);}
  .qcard.in-right{opacity:0;transform:translateX(42px);}
  .qcard.in-left{opacity:0;transform:translateX(-42px);}

  .qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .qback{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-size:17px;cursor:pointer;transition:.15s;font-family:var(--body);flex:0 0 auto;}
  .qback:hover{border-color:rgba(255,255,255,0.2);color:var(--ink);}
  .qback.hide{visibility:hidden;}
  .qnum{font-size:13px;font-weight:700;color:var(--ink-faint);letter-spacing:0.04em;}
  .qtext{font-size:18px;line-height:1.5;font-weight:500;margin-bottom:20px;}
  .qtext code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:5px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);line-height:1.4;transition:border-color .15s,background .15s;width:100%;}
  .opt:hover{border-color:rgba(255,255,255,0.2);}
  .opt.sel{border-color:var(--gold);background:rgba(227,184,74,0.08);}
  .opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .opt.sel .key{background:var(--gold);color:#14110c;}

  /* review states */
  .opt.correct{border-color:var(--green);background:rgba(52,211,166,0.1);}
  .opt.correct .key{background:var(--green);color:#072018;}
  .opt.incorrect{border-color:var(--red);background:rgba(232,98,92,0.1);}
  .opt.incorrect .key{background:var(--red);color:#2a0a08;}
  .explain{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .explain b{color:var(--ink);}

  /* results */
  .res{text-align:center;padding:14px 0 10px;}
  .scorering{position:relative;width:150px;height:150px;margin:6px auto 6px;}
  .scorering svg{transform:rotate(-90deg);}
  .scorering .tr{stroke:rgba(255,255,255,0.1);}
  .scorering .fl{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
  .scorering .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .scorering .ctr b{font-family:var(--display);font-size:40px;font-weight:600;line-height:1;}
  .scorering .ctr em{font-style:normal;font-size:13px;color:var(--gold);font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-top:5px;}
  .scorering .ctr span{font-size:12px;color:var(--ink-faint);margin-top:3px;}

  /* verdict band */
  .verdict-band{margin:16px auto 4px;max-width:30em;opacity:0;transform:translateY(10px);transition:opacity .25s ease,transform .25s ease;transition-delay:.55s;}
  .verdict-band.show{opacity:1;transform:none;}
  .verdict-band h2{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1;margin-bottom:6px;}
  .verdict-band p{color:var(--ink-soft);font-size:14.5px;line-height:1.5;margin:0 auto;}

  /* per-domain breakdown */
  .dbreak{margin:30px 0 6px;text-align:left;}
  .sec-head{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:4px;}
  .sec-sub{font-size:12.5px;color:var(--ink-faint);margin-bottom:16px;}
  .drow{margin-bottom:16px;}
  .drow .dtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:10px;}
  .drow .dname{font-size:13.5px;font-weight:600;color:var(--ink);}
  .drow .dscore{font-size:12.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .dtrack{position:relative;height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
  .dfill{height:100%;width:0;border-radius:6px;transition:width .7s cubic-bezier(.2,.7,.2,1);}
  .dmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,0.5);border-radius:2px;}
  .dweight{font-size:11px;color:var(--ink-faint);margin-top:5px;}

  /* prescriptions */
  .presc{margin:26px 0 6px;text-align:left;}
  .presc-card{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:11px;text-decoration:none;color:var(--ink);transition:border-color .15s,background .15s;}
  .presc-card:hover{border-color:rgba(255,255,255,0.2);background:var(--surface-2);}
  .presc-card .pc-dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;}
  .presc-card .pc-body{flex:1;}
  .presc-card .pc-dom{display:block;font-size:12px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px;}
  .presc-card .pc-line{display:block;font-size:14px;line-height:1.4;color:var(--ink);}
  .presc-card .pc-go{flex:0 0 auto;color:var(--ink-faint);font-size:18px;}

  /* actions */
  .res-actions{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
  .res-actions .btn{flex:1;min-width:44%;}

  /* email capture (opt-in, appears after results; hidden when unset) */
  .email{margin:26px 0 4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;}
  .email label{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:10px;}
  .email-row{display:flex;gap:9px;}
  .email input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;color:var(--ink);font-family:var(--body);font-size:15px;}
  .email input::placeholder{color:var(--ink-faint);}
  .email input:focus{outline:none;border-color:var(--gold);}
  .email .btn{padding:12px 18px;font-size:15px;}
  .email .note{font-size:12px;color:var(--ink-faint);margin-top:9px;}

  /* review (reused verbatim from the exam renderer) */
  .review-head{font-family:var(--display);font-size:18px;font-weight:600;margin:34px 0 4px;padding-top:22px;border-top:1px solid var(--line);}
  .rev-q{margin-top:22px;}
  .rev-q .rq{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:12px;}
  .rev-q .rq .mark{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:8px;vertical-align:middle;}
  .mark.ok{background:rgba(52,211,166,0.15);color:var(--green);}
  .mark.no{background:rgba(232,98,92,0.15);color:var(--red);}

  /* offscreen canvas host for the share card */
  .sharehost{position:fixed;left:-99999px;top:0;}
</style>
</head>

<div class="app">
  <div class="top">
    <span class="lbl" id="topLbl">Readiness Quiz</span>
  </div>
  <div class="pbar"><i id="pbar"></i></div>

  <div class="body-wrap" id="root"></div>
</div>
<div class="sharehost"><canvas id="shareCanvas" width="1080" height="1080"></canvas></div>

<script>
/* =====================================================================
   READINESS PAYLOAD - BEGIN
   The only section you edit per cert: the R config object and the
   QUESTIONS array. Everything below the END marker is the frozen engine.

   Sourced from the Databricks Certified Context Engineer Associate exam
   guide (29 Jul 2026), the Databricks, MLflow and LangGraph documentation
   as taught in the course lessons. prescribe / href are drawn from
   curriculum-index-databricks-context-engineer-associate (7 units, 48
   chapters). Every scenario below is new: none reuses or rewords a question
   from ctx-practice-exam-01 to 10, and none is set at the lessons' case-study
   company.
===================================================================== */
const R = {
  cert:   "Databricks Context Engineer Associate",
  code:   "Databricks Context Engineer Associate",
  badge:  "Databricks Context Engineer · Associate",
  intro:  "Twelve scenario questions across all seven exam sections, grouped into five areas. No timer, no signup. At the end you get a per-area readiness readout and exactly what to study next.",
  courseUrl: "../databricks-context-engineer-associate/",   /* course home (every unit free) */

  /* The guide's seven sections, re-clustered into five domains so that a
     12-question quiz gives every domain at least 2 questions. Sections 3
     (Retrieval, 20%), 4 (Memory, 18%) and 5 (Tools, 13%) stand alone; the
     two smaller neighbours are paired: 1 Foundations (16%) with 2
     Instructions (9%), and 6 Compaction (11%) with 7 Multi-Agent (13%). The
     section weights ARE published in the exam guide (16/9/20/18/13/11/13),
     so each weight below is the sum of the official weights of the sections
     it holds and reads as "% of exam". count sums to 12 (3/2/2/2/3).
     accent = ramp token. prescribe + href from the curriculum index; each
     href deep links to the first unit of its domain on the course home. */
  domains: [
    { id:"c1", name:"Foundations and Instructions", weight:25, count:3, accent:"var(--acc-1)",
      prescribe:"Units 1 and 2 (Ch 1-13): the attention budget, the four context failure modes and their fixes, proactive context management, context rot, reasoning modes, system prompt calibration, few-shot budgets, and Genie space knowledge levers.",
      href:"../databricks-context-engineer-associate/#unit-1" },
    { id:"c2", name:"Knowledge Retrieval and Genie", weight:20, count:2, accent:"var(--acc-2)",
      prescribe:"Unit 3 (Ch 14-23): Unity Catalog metadata and Genie curation, task scoping, pre-inference versus just-in-time retrieval, chunking, AI Search index types, sync modes, hybrid search and reranking, and diagnosing retrieval failures.",
      href:"../databricks-context-engineer-associate/#unit-3" },
    { id:"c3", name:"Memory with Lakebase and MLflow", weight:18, count:2, accent:"var(--acc-3)",
      prescribe:"Unit 4 (Ch 24-31): session versus cross-session memory, scratchpads versus Delta-backed state, Lakebase checkpointing, retrieving memories, over- and under-retrieval, and picking a reliable configuration in MLflow 3.",
      href:"../databricks-context-engineer-associate/#unit-4" },
    { id:"c4", name:"Tools, MCP and Agent Context", weight:13, count:2, accent:"var(--acc-4)",
      prescribe:"Unit 5 (Ch 32-37): choosing Unity Catalog function tools, progressive disclosure for MCP tool access, disambiguating tool descriptions, clearing raw tool outputs, and Agent Skills.",
      href:"../databricks-context-engineer-associate/#unit-5" },
    { id:"c5", name:"Compaction and Multi-Agent Design", weight:24, count:3, accent:"var(--acc-5)",
      prescribe:"Units 6 and 7 (Ch 38-48): trimming versus compaction, what is safe to remove, tuning a compaction prompt, sub-agent dispatch and output design, context propagation, agent boundaries, and long-horizon strategies.",
      href:"../databricks-context-engineer-associate/#unit-6" }
  ],

  /* Verdict bands on raw correct count out of 12 (not weighted). Descending
     by min; the first whose min is met wins. */
  bands: [
    { min:10, key:"ready",      label:"Exam-ready",       note:"You are scoring where passing candidates score. Tighten your weakest area below, then book it." },
    { min:7,  key:"close",      label:"Close: 1-2 weeks", note:"A focused week or two on the areas flagged below should get you over the line." },
    { min:4,  key:"foundation", label:"Foundation needed",note:"The core is forming but has gaps. Work the flagged units in order before drilling practice exams." },
    { min:0,  key:"start",      label:"Start from Unit 1", note:"Best to build from the ground up across the 48-chapter course. Start with Unit 1; every unit is free." }
  ]
};

const QUESTIONS = [
  /* ---------- Domain 1: Foundations and Instructions (3) ---------- */

  /* Q1 - Poisoning versus clash in a trace (Ch 3) */
  {
    ref:{chapter:3},
    domain:"c1",
    q:`A travel company's booking agent looks up a hotel's cancellation policy with a tool, which returns "free cancellation until 48 hours before check-in." The next model span summarizes this as "free cancellation at any time" and writes that line to the session notes. For the rest of the session the agent tells the traveller they can cancel for free whenever they like. Which failure mode is this, and what fixes it?`,
    opts:[
      "Context clash: retrieve only the current version of the hotel policy before the model call",
      "Context poisoning: check model summaries against the tool output before saving them to notes, and remove the bad note from the session",
      "Context distraction: shorten the session history so the policy stays in focus",
      "Context confusion: remove tools the agent does not need for this request"
    ],
    correct:1,
    explain:`The false claim has no source anywhere in the trace: the model invented it, saved it, and later turns cite it. That is poisoning, fixed by validating claims before they are persisted and clearing what is already there. Clash is the tempting answer because the summary disagrees with the tool output, but clash means two real sources in the window disagreeing; here there is only one source and a fabricated restatement of it.`
  },

  /* Q2 - Reasoning mode from the task signals (Ch 8) */
  {
    ref:{chapter:8},
    domain:"c1",
    q:`A retailer adds a step to its support pipeline that tags each incoming email with one of eight intents. It handles tens of thousands of emails a day with a sub-second latency target, and the right tag almost always follows directly from the email text. The serving model is a hybrid model that can switch reasoning off. Which reasoning mode fits this step?`,
    opts:[
      "Extended thinking, so the model double-checks each tag",
      "Reduced thinking at the lowest effort level, as a safe middle ground",
      "Extended thinking with a smaller max_tokens to keep cost down",
      "Standard mode, with reasoning switched off"
    ],
    correct:3,
    explain:`The answer follows directly from the input, volume is high and latency is tight, which are the signals for standard mode, and this model can turn reasoning off. Reduced thinking is the tempting middle, but it is the fallback for models that cannot disable reasoning; here it would add reasoning tokens and latency for no accuracy gain on a simple classification.`
  },

  /* Q3 - Genie knowledge lever for inconsistent metric logic (Ch 13) */
  {
    ref:{chapter:13},
    domain:"c1",
    q:`A logistics company's Genie space understands the team's vocabulary well. But "on-time delivery rate" comes back with different numbers depending on how the question is worded: sometimes late-but-same-day deliveries count as on time, sometimes they do not. The definition is settled and must be applied the same way in every question that uses it. Which knowledge lever fits?`,
    opts:[
      "A SQL expression that defines the on-time delivery rate measure",
      "A general instruction explaining in prose how on-time delivery is calculated",
      "Sample questions that ask for the on-time rate in several wordings",
      "Longer column descriptions on the deliveries table"
    ],
    correct:0,
    explain:`Metric logic that must be computed identically every time is what SQL expressions are for: Genie applies the defined SQL rather than interpreting a description. A general instruction is the tempting pick because it states the rule, but instructions are interpreted, so the calculation can still drift between questions; they suit vocabulary and context that cut across many questions.`
  },

  /* ---------- Domain 2: Knowledge Retrieval and Genie (2) ---------- */

  /* Q4 - Pre-inference versus just-in-time retrieval (Ch 17) */
  {
    ref:{chapter:17},
    domain:"c2",
    q:`A hospital network is building an assistant for ward staff. Questions mix live values ("what is bed 12's latest potassium result and when was it drawn?") with protocol text ("what does the hypokalaemia protocol say about IV replacement?"), and many turns are short follow-ups that need no lookup at all. Which retrieval design fits?`,
    opts:[
      "Pre-inference retrieval: inject the top ten chunks from a combined labs-and-protocols index on every turn",
      "Pre-inference retrieval with a larger top-k so both kinds of content are always present",
      "Just-in-time retrieval: a lab-results query tool and a protocol search tool that the agent calls when a turn needs them",
      "Load the patient's full record and every protocol into the system prompt at session start"
    ],
    correct:2,
    explain:`Exact current values from tables, and turns that need nothing, are both just-in-time signals: the agent queries live data when it must and skips retrieval on follow-ups. Pre-inference injection is tempting because one index seems to cover both sources, but embedding search cannot reliably return a current lab value, and it adds chunks to every follow-up turn whether they are needed or not.`
  },

  /* Q5 - Stale triggered index (Ch 21) */
  {
    ref:{chapter:21},
    domain:"c2",
    q:`An energy utility's field assistant answers from a Delta Sync index over its safety-procedures table. The table is rebuilt by a pipeline every night, and the index uses triggered sync. Nobody has run a sync since the index was created, so technicians are quoting a procedure that was revised three weeks ago. Same-day freshness is enough. What is the most cost-effective fix?`,
    opts:[
      "Add a task that calls the index's sync right after the nightly pipeline in the same job",
      "Switch the index to continuous sync",
      "Drop and recreate the index every night",
      "Convert it to a Direct Access index and write updates from application code"
    ],
    correct:0,
    explain:`A triggered index only changes when a sync runs, and the source changes once a night, so syncing as the next task after the pipeline keeps the index exactly as fresh as the table. Continuous sync would also fix it, which makes it the tempting answer, but it keeps a streaming pipeline running all day for data that changes nightly, paying for freshness nobody needs.`
  },

  /* ---------- Domain 3: Memory with Lakebase and MLflow (2) ---------- */

  /* Q6 - Session versus cross-session memory (Ch 24) */
  {
    ref:{chapter:24},
    domain:"c3",
    q:`A bank's support agent stores customer preferences in long-term memory. Halfway through a chat, a customer says they now want statements by post instead of email. At the end of the same chat, the agent confirms "your statements will keep arriving by email," reading the preference from long-term memory. What is the mismatch, and what fixes it?`,
    opts:[
      "The long-term store is stale; schedule a nightly job to refresh it",
      "The session history was too long; compact it more often",
      "The agent needs cross-session memory; persist every message across sessions",
      "Long-term memory answered a fact that changed in this session; let current session state win, and write the change back to long-term memory"
    ],
    correct:3,
    explain:`The newest value was born in this conversation, so session memory should answer, and the update should then be written back so future sessions see it. Refreshing the store nightly is tempting because the long-term value is indeed stale, but a nightly refresh would still give the wrong answer for the rest of this chat; the error is which store the agent read, not how often it is refreshed.`
  },

  /* Q7 - Most reliable configuration across metrics (Ch 31) */
  {
    ref:{chapter:31},
    domain:"c3",
    q:`An e-commerce team evaluates three memory configurations on the same evaluation set in MLflow 3. K: correctness 0.95, groundedness 0.94, retrieval sufficiency 0.61. L: 0.88, 0.87, 0.89. M: 0.98, 0.70, 0.99. The assistant must be correct, grounded and not miss relevant history, all at once. Which configuration is the most reliable?`,
    opts:[
      "M, because it has the highest single score and the highest average",
      "L, because none of its metrics lags",
      "K, because two of its three metrics are above 0.90",
      "None, because the three cannot be compared without a cost metric"
    ],
    correct:1,
    explain:`Reliability for a task that needs every quality is set by the weakest metric: L's lowest score (0.87) is far above K's (0.61) and M's (0.70). M is the tempting pick because it has the top single score and the highest average (0.89 to L's 0.88), but the average hides its groundedness gap, which would show up in production as invented details. A parallel coordinates chart makes that dip visible at a glance.`
  },

  /* ---------- Domain 4: Tools, MCP and Agent Context (2) ---------- */

  /* Q8 - Progressive disclosure over a large MCP registry (Ch 34) */
  {
    ref:{chapter:34},
    domain:"c4",
    q:`A media company exposes 150 MCP tools to its newsroom agent, and every request currently carries every tool schema. The agent also mixes up four similar archive-search tools. Which design applies progressive disclosure correctly?`,
    opts:[
      "Load all 150 schemas, then add a classifier step that picks among the four archive tools",
      "Merge the four archive tools into one tool with a mode parameter",
      "Give each tool a distinct capability descriptor, score descriptors against the request in a discovery step, and load only the best match's schema",
      "Move to a model with a larger context window so all 150 schemas fit comfortably"
    ],
    correct:2,
    explain:`Staged discovery against distinct descriptors cuts token cost at the source and removes the ambiguity, because only the best-matching schema ever enters the window. The classifier is the tempting option since it does resolve the confusion, but it still pays for all 150 schemas on every request before choosing, which is exactly the raw tool dump progressive disclosure replaces.`
  },

  /* Q9 - Which raw tool output to clear (Ch 36) */
  {
    ref:{chapter:36},
    domain:"c4",
    q:`A procurement agent is 35 tool calls into a supplier review and near its context capacity. Which raw tool output is the best candidate to clear?`,
    opts:[
      "The contract text returned for the clause the agent is reviewing right now",
      "A spend query whose totals the agent has not yet written into its notes or messages",
      "The user's message listing which suppliers to exclude from the review",
      "An early price lookup for a supplier that the agent re-ran later and got newer prices for"
    ],
    correct:3,
    explain:`A superseded result is safe to clear, and keeping it invites a clash with the newer figures. The unrecorded spend query is the tempting choice because it is an old raw output, but its facts exist nowhere else in the history, so clearing it deletes information the review still needs. User messages are never clearing candidates.`
  },

  /* ---------- Domain 5: Compaction and Multi-Agent Design (3) ---------- */

  /* Q10 - Recall before precision in a compaction prompt (Ch 41) */
  {
    ref:{chapter:41},
    domain:"c5",
    q:`An engineer is tuning a compaction prompt for a research agent against six real traces, each with a list of the facts later steps relied on. Draft 2 produces compact 250-token summaries, but when the agent continues from them it loses three of the eleven listed facts. What should the next iteration focus on?`,
    opts:[
      "Recall: revise the prompt so all eleven facts survive, accepting a longer summary for now",
      "Precision: tighten the summary further so it is cheaper to carry",
      "Raise the compaction threshold so compaction happens less often",
      "Replace compaction with a rule that drops the oldest turns"
    ],
    correct:0,
    explain:`A fact missing from the summary is gone for good and fails silently downstream, so recall comes first; length is tuned once every must-keep fact survives. Tightening for precision is tempting because the summaries already look efficient, but cutting further is how facts get lost in the first place.`
  },

  /* Q11 - Under-informed dispatch versus stale retrieval (Ch 44) */
  {
    ref:{chapter:44},
    domain:"c5",
    q:`A lending platform's coordinator agent reviews a batch of loan files, decides that self-employed applicants need two years of tax returns, and dispatches one sub-agent per file with the message "Assess this application." Sub-agents approve self-employed applicants on one year of returns. Their retrieved policy documents are current. Which fix is best without enlarging each sub-agent's context window?`,
    opts:[
      "Pass the coordinator's full trace to every sub-agent",
      "Re-sync the policy document index",
      "Attach a compressed summary of the coordinator's decisions and their reasons to each dispatch",
      "Merge all files into a single sub-agent so it sees the coordinator's reasoning"
    ],
    correct:2,
    explain:`Retrieval is current, so what the sub-agents lack is the coordinator's decision, and a short summary of decisions and reasons carries it cheaply. Passing the full trace is tempting because it fully informs them, but it grows every sub-agent's window with the coordinator's whole history, which the constraint rules out. Re-syncing would only help if retrieved context showed old values.`
  },

  /* Q12 - Sub-agent output design for a saturated orchestrator (Ch 46) */
  {
    ref:{chapter:46},
    domain:"c5",
    q:`A consultancy's due-diligence orchestrator dispatches six sub-agents per target company, and each returns its full working transcript. The orchestrator's window fills after one round, and its final memo drops findings from the first sub-agents. Which change to the sub-agents' output best reduces load without losing coherence?`,
    opts:[
      "Return only a one-line verdict from each sub-agent",
      "Return a structured result: the finding, key evidence with IDs, assumptions and open questions, plus a pointer to the full working",
      "Truncate each transcript to its last 500 tokens",
      "Move the orchestrator to a model with a larger context window"
    ],
    correct:1,
    explain:`A condensed, structured return keeps what the orchestrator needs to integrate and reconcile findings while the detail stays behind a pointer. The one-line verdict is tempting because it is the smallest, but without evidence and assumptions the orchestrator cannot explain its memo or resolve sub-agents that disagree. Truncation drops content by position, so the conclusion itself may be what goes.`
  }
];

/* ---------- linear question flow with slide transition ---------- */
function renderTest(){
  root.innerHTML = `<div class="qstage"><div class="qcard" id="qcard"></div></div>`;
  paintQuestion();
}

function questionHTML(i){
  const Q = QUESTIONS[i];
  return `
    <div class="qhead">
      <button class="qback ${i===0?'hide':''}" id="backBtn" aria-label="Back">&larr;</button>
      <span class="qnum">QUESTION ${i+1} OF ${TOTAL}</span>
    </div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o,j)=>`
        <button class="opt ${state.answers[i]===j?'sel':''}" data-j="${j}">
          <span class="key">${"ABCD"[j]}</span><span>${o}</span>
        </button>`).join("")}
    </div>`;
}

function wireQuestion(i){
  const card = document.getElementById("qcard");
  card.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=> selectAnswer(i, Number(el.dataset.j), el);
  });
  const back = document.getElementById("backBtn");
  if(back) back.onclick = ()=> goBack(i);
}

function paintQuestion(){
  const i = state.i;
  topLbl.textContent = `Question ${i+1} / ${TOTAL}`;
  const card = document.getElementById("qcard");
  card.className = "qcard";
  card.innerHTML = questionHTML(i);
  wireQuestion(i);
  setProgress();
}

function selectAnswer(i, j, el){
  if(state.busy) return;
  state.answers[i] = j;
  const card = document.getElementById("qcard");
  card.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
  el.classList.add("sel");
  setProgress();
  state.busy = true;
  /* brief beat so the selection registers, then slide out */
  setTimeout(()=>{
    card.classList.add("out-left");
    setTimeout(()=>{
      if(i === TOTAL-1){ finish(); return; }
      state.i = i+1;
      slideIn("in-right");
    }, 300);
  }, 250);
}

function goBack(i){
  if(state.busy || i===0) return;
  state.busy = true;
  const card = document.getElementById("qcard");
  card.classList.add("out-right");
  setTimeout(()=>{
    state.i = i-1;
    slideIn("in-left");
  }, 300);
}

function slideIn(fromClass){
  const i = state.i;
  topLbl.textContent = `Question ${i+1} / ${TOTAL}`;
  const card = document.getElementById("qcard");
  card.className = "qcard " + fromClass;
  card.innerHTML = questionHTML(i);
  wireQuestion(i);
  setProgress();
  /* force reflow so the incoming offset is applied before we clear it */
  void card.offsetWidth;
  requestAnimationFrame(()=>{
    card.className = "qcard";
    setTimeout(()=>{ state.busy = false; }, 320);
  });
}

function finish(){
  state.screen = "results";
  render();
  setProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- scoring ---------- */
function score(){
  let c=0; QUESTIONS.forEach((Q,idx)=>{ if(state.answers[idx]===Q.correct) c++; });
  return c;
}

function domainScores(){
  return R.domains.map(d=>{
    let correct=0, count=0;
    QUESTIONS.forEach((Q,idx)=>{
      if(Q.domain===d.id){ count++; if(state.answers[idx]===Q.correct) correct++; }
    });
    return { d, correct, count, frac: count? correct/count : 0 };
  });
}

function bandFor(c){
  /* R.bands descend by min; first whose min is met wins. Raw count, not weighted. */
  return R.bands.find(b=> c>=b.min) || R.bands[R.bands.length-1];
}

function countUp(el, target, ms){
  if(!el) return;
  const start = performance.now();
  function frame(now){
    const t = Math.min(1, (now-start)/ms);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = Math.round(eased*target) + "%";
    if(t<1) requestAnimationFrame(frame);
    else el.textContent = target + "%";
  }
  requestAnimationFrame(frame);
}

/* Chapter links (optional, additive). A question may carry ref:{chapter:N}.
   When the payload also defines a CHAPTERS table, the results review
   shows "Review: Chapter N" under that question's explanation, never during
   the attempt. Questions without ref, and payloads without CHAPTERS, render
   exactly as before. The link opens in a new tab with ?back=<this quiz>&tab=1
   so this review stays put and the lesson can offer "Back to quiz".
     const CHAPTERS = { course:"<gate course id>", base:"", free:[1,2],
                        list:{ 1:["lesson-01-x.html","Title"], ... } };
   A chapter outside `free` is labelled Locked for visitors who have not
   unlocked the course; its link still opens the lesson URL, where the gate
   serves the existing unlock page. */
const CHAP = (typeof CHAPTERS === "object" && CHAPTERS && CHAPTERS.list) ? CHAPTERS : null;
function chapLocked(n){
  if(!CHAP || (CHAP.free||[]).indexOf(n)>=0) return false;
  if(!/(?:^|;\s*)cc_gating=1(?:;|$)/.test(document.cookie)) return false;
  const m = document.cookie.match(/(?:^|;\s*)cc_ui=([^;]+)/), l = m ? decodeURIComponent(m[1]).split(".") : [];
  /* the pre-multi-course cookie "1" grants de-assoc only, as in gate.ts */
  return l.indexOf(CHAP.course)<0 && !(CHAP.course==="de-assoc" && l.indexOf("1")>=0);
}
function refLink(Q){
  const n = Q && Q.ref && Q.ref.chapter, c = CHAP && CHAP.list[n];
  if(!c) return "";
  const lock = chapLocked(n);
  const href = (CHAP.base||"") + c[0] + "?back=" + encodeURIComponent(location.pathname) + "&tab=1";
  return `<a href="${href}" target="_blank" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--gold);font-weight:600;text-decoration:none">`
    + `<span>Review: Chapter ${n} &middot; ${c[1]}</span>`
    + (lock ? `<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px">Locked</span>` : "")
    + `<span aria-hidden="true">&#8599;</span></a>`;
}

/* ---------- review (reused verbatim from the exam renderer) ---------- */
function renderReview(){
  const wrap=document.getElementById("review");
  wrap.innerHTML = `<div class="review-head">Answer review</div>` + QUESTIONS.map((Q,idx)=>{
    const mine=state.answers[idx], ok=mine===Q.correct;
    return `<div class="rev-q">
      <div class="rq"><span class="mark ${ok?'ok':'no'}">${ok?'Correct':'Review'}</span>Q${idx+1}. ${Q.q}</div>
      <div class="opts">
        ${Q.opts.map((o,j)=>{
          let cls="opt";
          if(j===Q.correct) cls+=" correct";
          else if(j===mine) cls+=" incorrect";
          return `<div class="${cls}"><span class="key">${"ABCD"[j]}</span><span>${o}${j===mine?'  &middot;  your answer':''}</span></div>`;
        }).join("")}
      </div>
      <div class="explain"><b>Why:</b> ${Q.explain}${refLink(Q)}</div>
    </div>`;
  }).join("") + `<div style="margin-top:28px;text-align:center"><button class="btn sec" id="retakeBtn2">Retake quiz</button></div>`;
  document.getElementById("retakeBtn2").onclick=retake;
}

/* ---------- email capture ---------- */
function readCookie(name){
  const m = document.cookie.match(new RegExp("(?:^|;\\s*)" + name + "=([^;]+)"));
  return m ? decodeURIComponent(m[1]) : "";
}
/* Segment key: the /ready/<slug> filename is the reliable cert slug (R.code is
   not consistent across quizzes). */
function quizSlug(){
  const parts = location.pathname.replace(/\/+$/,"").split("/");
  let last = parts[parts.length-1] || "";
  if(last.endsWith(".html")) last = last.slice(0,-5);
  return last || String(R.code||"").toLowerCase();
}
function newEventId(){
  try{ if(window.crypto && crypto.randomUUID) return "lead_"+crypto.randomUUID(); }catch(_e){}
  return "lead_"+Date.now()+"_"+Math.random().toString(16).slice(2);
}
/* isApp(): true inside the mobile app, which opens pages with ?app=1 (the
   flag is remembered in sessionStorage for the WebView session), so sessions can be
   suppressed or tagged once the mobile project supplies a signal (custom UA
   token, query param, or injected flag). No signal exists today, so this is
   always false and web behaviour is unchanged. */
function isApp(){ try{ if(/[?&]app=1(?:&|$)/.test(location.search)){ sessionStorage.setItem("cc_app","1"); return true; } return sessionStorage.getItem("cc_app")==="1"; }catch(_e){ return false; } }

function submitEmail(e){
  e.preventDefault();
  if(!EMAIL_ENDPOINT) return;
  const input = document.getElementById("emailInput");
  const note = document.getElementById("emailNote");
  const btn = e.target.querySelector("button[type=submit]");
  const email = (input && input.value || "").trim();
  if(!email){ if(note) note.textContent = "Enter your email to get your plan."; return; }
  if(btn){ btn.disabled = true; btn.textContent = "Sending..."; }

  const eid = newEventId();
  const slug = quizSlug();
  const payload = {
    email: email, slug: slug, cert: R.cert,
    correct: score(), total: TOTAL,
    event_id: eid, fbp: readCookie("_fbp"), fbc: readCookie("_fbc"),
    event_source_url: location.href
  };
  fetch(EMAIL_ENDPOINT, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json().catch(function(){ return {}; }); })
    .then(function(d){
      if(d && d.ok){
        if(note) note.textContent = "Done. Check your inbox to confirm and get your plan.";
        if(input) input.disabled = true;
        if(btn) btn.textContent = "Sent";
        /* Lead conversion: pixel + GA4, sharing event_id with the server-side
           Lead sent by /api/subscribe so Meta deduplicates the pair. Fired only
           on a confirmed signup, and suppressed inside the app. */
        if(!isApp()){
          try{ if(typeof fbq==="function") fbq("track","Lead",
            {content_name:R.cert,content_category:slug},{eventID:eid}); }catch(_e){}
          try{ if(typeof gtag==="function") gtag("event","generate_lead",
            {event_id:eid,cert:R.cert,quiz_slug:slug}); }catch(_e){}
        }
      } else {
        if(note) note.textContent = (d && d.error) || "Could not send just now. Try again in a moment.";
        if(btn){ btn.disabled = false; btn.textContent = "Send"; }
      }
    })
    .catch(function(){
      if(note) note.textContent = "Could not send just now. Try again in a moment.";
      if(btn){ btn.disabled = false; btn.textContent = "Send"; }
    });
}

/* ---------- share card (Canvas, 1080x1080) ---------- */
function resolveColor(v){
  v = (v||"").trim();
  const m = v.match(/^var\((--[a-z0-9-]+)\)$/i);
  if(m){
    const c = getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim();
    return c || "#6ea8fe";
  }
  return v || "#6ea8fe";
}

function rr(ctx, x, y, w, h, r){
  r = Math.min(r, h/2, w/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawShareCard(){
  const cv = document.getElementById("shareCanvas");
  const ctx = cv.getContext("2d");
  const W = 1080, H = 1080, M = 88;

  /* Visual Brain palette (marketing artifact, brand-governed) */
  const GROUND = "#14161c", CREAM = "#e9e6dd", MUTED = "#8b90a0", FAINT = "#62647a";
  const PANEL = "#1b1e26", GOLD = "#d9a441";

  const c = score(), pct = Math.round(c/TOTAL*100);
  const ds = domainScores();

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = GROUND; ctx.fillRect(0,0,W,H);
  ctx.textBaseline = "alphabetic";

  /* eyebrow */
  ctx.fillStyle = FAINT;
  ctx.font = '700 26px "Hanken Grotesk", system-ui, sans-serif';
  ctx.fillText("CERTIFY  ·  READINESS", M, 168);

  /* big figure */
  ctx.fillStyle = GOLD;
  ctx.font = '600 210px "Fraunces", Georgia, serif';
  const figure = pct + "%";
  ctx.fillText(figure, M-4, 440);
  const figW = ctx.measureText(figure).width;
  ctx.fillStyle = CREAM;
  ctx.font = '500 62px "Fraunces", Georgia, serif';
  ctx.fillText("ready", M + figW + 26, 440);

  /* cert code */
  ctx.fillStyle = MUTED;
  ctx.font = '600 34px "Hanken Grotesk", system-ui, sans-serif';
  ctx.fillText(R.code + "  ·  " + c + " / " + TOTAL + " correct", M, 512);

  /* domain mini-bars, scaled so N rows always sit above the brand mark */
  const barX = M, barW = W - M*2;
  const bandTop = 630, bandBottom = 918;
  const rowH = ds.length > 1 ? Math.min(92, (bandBottom - bandTop) / (ds.length - 1)) : 0;
  let y = bandTop;
  ds.forEach(x=>{
    const acc = resolveColor(x.d.accent);
    ctx.fillStyle = CREAM;
    ctx.font = '600 27px "Hanken Grotesk", system-ui, sans-serif';
    const name = x.d.name.length > 34 ? x.d.name.slice(0,33)+"…" : x.d.name;
    ctx.fillText(name, barX, y);
    ctx.fillStyle = MUTED;
    ctx.textAlign = "right";
    ctx.fillText(x.correct + "/" + x.count, barX + barW, y);
    ctx.textAlign = "left";
    /* track */
    ctx.fillStyle = PANEL;
    rr(ctx, barX, y+18, barW, 16, 8); ctx.fill();
    /* fill */
    const fw = Math.max(16, barW * x.frac);
    ctx.fillStyle = acc;
    rr(ctx, barX, y+18, fw, 16, 8); ctx.fill();
    y += rowH;
  });

  /* brand mark: gold check + wordmark, bottom-left */
  const markY = 1004;
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(M, markY-9);
  ctx.lineTo(M+13, markY+6);
  ctx.lineTo(M+38, markY-24);
  ctx.stroke();
  ctx.fillStyle = CREAM;
  ctx.font = '600 34px "Hanken Grotesk", system-ui, sans-serif';
  ctx.fillText("certify.courses", M+56, markY+2);

  return cv;
}

function shareResult(){
  const btn = document.getElementById("shareBtn");
  const restore = ()=>{ if(btn){ btn.disabled=false; btn.textContent="Share result"; } };
  if(btn){ btn.disabled=true; btn.textContent="Preparing…"; }

  const fonts = [
    '600 210px "Fraunces"',
    '500 62px "Fraunces"',
    '700 26px "Hanken Grotesk"',
    '600 34px "Hanken Grotesk"'
  ];
  const ready = (document.fonts && document.fonts.load)
    ? Promise.all(fonts.map(f=>document.fonts.load(f))).catch(()=>{})
    : Promise.resolve();

  ready.then(()=>{
    const cv = drawShareCard();
    cv.toBlob(blob=>{
      if(!blob){ restore(); return; }
      const c = score(), pct = Math.round(c/TOTAL*100);
      const file = new File([blob], `readiness-${R.code}.png`, { type:"image/png" });
      const shareData = {
        files:[file],
        title:`${R.code} readiness`,
        text:`I'm ${pct}% ready for the ${R.code}. Check yours at certify.courses.`
      };
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        navigator.share(shareData).catch(()=>{}).finally(restore);
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `readiness-${R.code}.png`;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        restore();
      }
    }, "image/png");
  });
}

function retake(){
  state = { screen:"intro", i:0, answers:Array(TOTAL).fill(null), busy:false };
  render(); setProgress(); window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
