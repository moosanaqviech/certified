<h1>Two questions, one answer</h1>
<p>An interactive lesson on the fundamental theorem of calculus: finding a rate from a total and building a total from a rate are opposite operations, and that link turns long sums into simple subtraction. Thirteen cards, about six minutes.</p>
</article>
