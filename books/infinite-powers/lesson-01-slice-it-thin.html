<h1>Slice it thin</h1>
<p>An interactive lesson on the one big move behind calculus: cut a curved or changing problem into pieces so thin that each is simple, solve the pieces, and add them back. Thirteen cards, about six minutes, with original scenarios and one question about your own life.</p>
</article>
