<h1>Building a network</h1>
<p>How a computer network is built from links, switches and routers, how it shares wires, how layers hide the mess, and what bandwidth and latency really mean. Adapted from Chapter 1 of Computer Networks: A Systems Approach by Larry Peterson and Bruce Davie (CC BY 4.0).</p>

      "art": "<svg viewBox='0 0 320 190' xmlns='http://www.w3.org/2000/svg' data-pattern='flow'><g font-family='Hanken Grotesk, system-ui, sans-serif'><g data-step='1' style='pointer-events:none'><text x='90' y='50' text-anchor='end' font-size='11' font-weight='600' fill='var(--ink)'>Fixed slots</text><rect x='98' y='34' width='30' height='24' rx='4' fill='var(--accent)'/><text x='113' y='50' text-anchor='middle' font-size='10' font-weight='700' fill='var(--bg)'>S1</text><rect x='132' y='34' width='30' height='24' rx='4' stroke='var(--ink-faint)' stroke-dasharray='3 3' fill='none'/><rect x='166' y='34' width='30' height='24' rx='4' stroke='var(--ink-faint)' stroke-dasharray='3 3' fill='none'/><rect x='200' y='34' width='30' height='24' rx='4' fill='var(--accent)'/><text x='215' y='50' text-anchor='middle' font-size='10' font-weight='700' fill='var(--bg)'>S1</text><rect x='234' y='34' width='30' height='24' rx='4' stroke='var(--ink-faint)' stroke-dasharray='3 3' fill='none'/><rect x='268' y='34' width='30' height='24' rx='4' fill='var(--accent)'/><text x='283' y='50' text-anchor='middle' font-size='10' font-weight='700' fill='var(--bg)'>S3</text><text x='98' y='72' text-anchor='start' font-size='10' fill='var(--ink-soft)'>S2's empty slots go unused</text></g><g data-step='2' style='pointer-events:none'><text x='90' y='110' text-anchor='end' font-size='11' font-weight='600' fill='var(--ink)'>On demand</text><rect x='98' y='94' width='30' height='24' rx='4' fill='var(--accent)'/><text x='113' y='110' text-anchor='middle' font-size='10' font-weight='700' fill='var(--bg)'>S1</text><rect x='132' y='94' width='30' height='24' rx='4' fill='var(--accent)'/><text x='147' y='110' text-anchor='middle' font-size='10' font-weight='700' fill='var(--bg)'>S1</text><rect x='166' y='94' width='30' height='24' rx='4' fill='var(--good)'/><text x='181' y='110' text-anchor='middle' font-size='10' font-weight='700' fill='var(--bg)'>S3</text><rect x='200' y='94' width='30' height='24' rx='4' fill='var(--accent)'/><text x='215' y='110' text-anchor='middle' font-size='10' font-weight='700' fill='var(--bg)'>S1</text><rect x='234' y='94' width='30' height='24' rx='4' fill='var(--good)'/><text x='249' y='110' text-anchor='middle' font-size='10' font-weight='700' fill='var(--bg)'>S3</text><rect x='268' y='94' width='30' height='24' rx='4' fill='var(--accent)'/><text x='283' y='110' text-anchor='middle' font-size='10' font-weight='700' fill='var(--bg)'>S1</text><text x='98' y='132' text-anchor='start' font-size='10' fill='var(--ink-soft)'>no idle gaps: whoever has data sends</text></g><g data-step='3' style='pointer-events:none'><text x='90' y='166' text-anchor='end' font-size='11' font-weight='600' fill='var(--bad)'>Too busy</text><rect x='100' y='146' width='140' height='32' rx='6' fill='none' stroke='var(--bad)' stroke-width='2'/><rect x='106' y='150' width='18' height='24' rx='3' fill='var(--accent)'/><rect x='128' y='150' width='18' height='24' rx='3' fill='var(--accent)'/><rect x='150' y='150' width='18' height='24' rx='3' fill='var(--accent)'/><rect x='172' y='150' width='18' height='24' rx='3' fill='var(--accent)'/><rect x='194' y='150' width='18' height='24' rx='3' fill='var(--accent)'/><rect x='216' y='150' width='18' height='24' rx='3' fill='var(--accent)'/><rect x='252' y='150' width='18' height='24' rx='3' fill='none' stroke='var(--bad)' stroke-dasharray='3 3'/></g></g></svg>",
      "look": "diagram",
      "alt": "Three rows of time slots: fixed slots with gaps, slots filled on demand, and a full buffer dropping a packet.",
      "body": [
        "Joining everyone raises a new problem: many conversations want the same link at once. Sharing a link is called **multiplexing**.",
        {
          "step": 1,
          "text": "**Fixed turns:** each sender gets its own time slot (or its own frequency, like TV channels). A sender with nothing to say wastes its turn."
        },
        {
          "step": 2,
          "text": "**On demand:** data goes out in limited-size **packets**, from whoever has something to send. This is **statistical multiplexing**, and it is why the internet uses packet switching: no idle gaps."
        },
        {
          "step": 3,
          "text": "**The price:** if packets arrive faster than the link can send them, the switch stores them; when its memory fills, it drops some. The switch is **congested**."
        }
      ]
    },
    {
      "id": "idle",
      "type": "predict",
      "prompt": "Back to your web page. It loads in a second, then you read it for two minutes. With fixed time slots, what happens to your share of the link while you read?",

          "text": "It sits idle and nobody can use it",

          "outcome": "Right. That waste is why computer networks share on demand: while you read, your slot would carry nothing."
        },
        {
          "text": "It is given to whoever needs it",
          "outcome": "That is what on-demand sharing does. Fixed slots cannot hand a turn to someone else."
        },
        {
          "text": "It downloads the next page in advance",
          "outcome": "The network has no idea what you will click next."
        }

      "takeaway": "Computer traffic is bursty: long silences, then sudden demands. Sharing by packet suits it."

      "steps": 3,
      "body": [
        "A good network also hides failures from the apps that use it. The chapter sorts them into three kinds:",
        {
          "step": 1,
          "text": "**Bit errors:** a 1 flips to a 0, from lightning, a power surge or a microwave oven. Rare: about 1 bit in a million on copper, 1 in a trillion or better on fibre."
        },
        {
          "step": 2,
          "text": "**Lost packets:** usually a congested switch with no room left, sometimes a software bug that forwards a packet the wrong way."
        },
        {
          "step": 3,
          "text": "**Broken links and nodes:** a crashed machine, a power cut, a cable dug up by a careless digger. A packet network can often route around them."
        }
      ]

      "label": "Encapsulation",
      "alt": "A message gains a TCP header, then an IP header, then a Wi-Fi header, and arrives with all three removed.",
      "stages": [
        {
          "text": "Providing those channels on top of messy links is too much for one program, so networks are built in **layers**, each hiding the one below. Watch your click's request go down them.",
          "art": "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 340 292' font-family='Hanken Grotesk, system-ui, sans-serif'><g data-k='msg'><rect x='95' y='120' width='150' height='44' rx='6' fill='var(--tint)'/><text x='170.0' y='147' text-anchor='middle' font-size='12' font-weight='700' fill='var(--ink)'>GET /index.html</text></g><g data-k='c'><text x='170' y='200' text-anchor='middle' font-size='12' fill='var(--ink-soft)'>the browser's request: just bytes to the layers below</text></g><text x='170' y='80' text-anchor='middle' font-size='12' fill='var(--ink-soft)'>on your device</text></svg>"
        },
        {
          "text": "Each layer adds a small **header** in front, with instructions for its partner layer on the other machine. TCP's says which app the data is for and in what order.",
          "art": "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 340 292' font-family='Hanken Grotesk, system-ui, sans-serif'><g data-k='tcp' data-from='msg'><rect x='55' y='120' width='56' height='44' rx='6' fill='var(--accent)'/><text x='83.0' y='147' text-anchor='middle' font-size='12' font-weight='700' fill='var(--bg)'>TCP</text></g><g data-k='msg'><rect x='115' y='120' width='150' height='44' rx='6' fill='var(--tint)'/><text x='190.0' y='147' text-anchor='middle' font-size='12' font-weight='700' fill='var(--ink)'>GET /index.html</text></g><g data-k='c'><text x='170' y='200' text-anchor='middle' font-size='12' fill='var(--ink-soft)'>TCP adds a header: which app, which order</text></g><text x='170' y='80' text-anchor='middle' font-size='12' fill='var(--ink-soft)'>on your device</text></svg>"
        },
        {
          "text": "The IP layer adds its own header with the **address** of the destination.",
          "art": "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 340 292' font-family='Hanken Grotesk, system-ui, sans-serif'><g data-k='ip' data-from='tcp'><rect x='25' y='120' width='50' height='44' rx='6' fill='var(--good)'/><text x='50.0' y='147' text-anchor='middle' font-size='12' font-weight='700' fill='var(--bg)'>IP</text></g><g data-k='tcp'><rect x='79' y='120' width='56' height='44' rx='6' fill='var(--accent)'/><text x='107.0' y='147' text-anchor='middle' font-size='12' font-weight='700' fill='var(--bg)'>TCP</text></g><g data-k='msg'><rect x='139' y='120' width='150' height='44' rx='6' fill='var(--tint)'/><text x='214.0' y='147' text-anchor='middle' font-size='12' font-weight='700' fill='var(--ink)'>GET /index.html</text></g><g data-k='c'><text x='170' y='200' text-anchor='middle' font-size='12' fill='var(--ink-soft)'>IP adds the destination address</text></g><text x='170' y='80' text-anchor='middle' font-size='12' fill='var(--ink-soft)'>on your device</text></svg>"
        },
        {
          "text": "The link layer adds one more for the wire or radio. Routers along the way look only at the IP header; the rest is just cargo.",
          "art": "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 340 292' font-family='Hanken Grotesk, system-ui, sans-serif'><g data-k='eth' data-from='ip' data-into='msg'><rect x='10' y='120' width='54' height='44' rx='6' fill='var(--ink-soft)'/><text x='37.0' y='147' text-anchor='middle' font-size='12' font-weight='700' fill='var(--bg)'>Wi-Fi</text></g><g data-k='ip' data-into='msg'><rect x='68' y='120' width='44' height='44' rx='6' fill='var(--good)'/><text x='90.0' y='147' text-anchor='middle' font-size='12' font-weight='700' fill='var(--bg)'>IP</text></g><g data-k='tcp' data-into='msg'><rect x='116' y='120' width='50' height='44' rx='6' fill='var(--accent)'/><text x='141.0' y='147' text-anchor='middle' font-size='12' font-weight='700' fill='var(--bg)'>TCP</text></g><g data-k='msg'><rect x='170' y='120' width='150' height='44' rx='6' fill='var(--tint)'/><text x='245.0' y='147' text-anchor='middle' font-size='12' font-weight='700' fill='var(--ink)'>GET /index.html</text></g><path d='M68 112 V96 H112 V112' fill='none' stroke='var(--good)' stroke-width='2'/><text x='90' y='90' text-anchor='middle' font-size='10' fill='var(--good)'>routers read only this</text><g data-k='c'><text x='170' y='200' text-anchor='middle' font-size='12' fill='var(--ink-soft)'>the link adds its own header and the packet leaves</text></g><text x='170' y='60' text-anchor='middle' font-size='12' fill='var(--ink-soft)'>on the wire</text></svg>"
        },

        }
      ]
    },
    {
      "id": "hourglass",
      "type": "concept",

      "look": "diagram",
      "alt": "An hourglass: many apps on top, TCP and UDP below, a single IP layer at the waist, many network technologies at the bottom.",
      "body": [

          "text": "Wide at the top: countless apps, all built on shared protocols such as HTTP for the web."

          "text": "**TCP** gives a reliable stream; **UDP** just sends individual messages."
