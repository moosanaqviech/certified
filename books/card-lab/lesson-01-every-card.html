<p>A test lesson for the book engine's interactive cards: a slider explorable, an estimate, three simulations, a label-the-diagram card and a spot-the-mistake card.</p>

<script type="application/json" id="lesson">
{
  "schema": 1,
  "book": "card-lab",
  "n": 1,
  "title": "Every interactive card",
  "idea": "cards",
  "cards": [
    {
      "id": "cover",
      "type": "cover",
      "eyebrow": "Card lab",
      "title": "Try, estimate, run, label, spot",
      "art": "<svg viewBox='0 0 320 190' xmlns='http://www.w3.org/2000/svg'><style>.c{animation:fl 2.4s ease-in-out infinite;transform-origin:160px 95px}@keyframes fl{0%,100%{transform:rotateY(0)}50%{transform:rotateY(180deg)}}@media (prefers-reduced-motion: reduce){.c{animation:none}}</style><path d='M30 160 Q110 150 160 110 T290 40' fill='none' stroke='var(--accent)' stroke-width='3'/><g class='c'><circle cx='160' cy='95' r='34' fill='var(--good)' fill-opacity='.85'/><text x='160' y='103' text-anchor='middle' font-family='Hanken Grotesk, system-ui, sans-serif' font-size='24' font-weight='700' fill='var(--bg)'>H</text></g></svg>",
      "look": "illustration",
      "lead": "A test bed for the interactive cards. Play with everything."
    },
    {
      "id": "strips",
      "type": "explorable",
      "title": "Squeeze the error",
      "body": [
        "Rectangles under a curve estimate the area beneath it. Add strips and watch the gap close."
      ],
      "slider": {
        "id": "n",
        "label": "Number of strips",
        "min": 1,
        "max": 80,
        "step": 1,
        "value": 3
      },
      "plot": {
        "view": "riemann",
        "x": [
          0,
          6
        ],
        "y": [
          0,
          5
        ],
        "f": "1.55 + 0.85*sin(0.95*x - 0.6) + 0.12*x",
        "xLabel": "x"
      },
      "readouts": [
        {
          "label": "Strips' total",
          "expr": "area",
          "digits": 3
        },
        {
          "label": "True area",
          "expr": "exact",
          "digits": 3
        },
        {
          "label": "Error",
          "expr": "error",
          "digits": 1,
          "unit": "%"
        }
      ],
      "goal": {
        "readout": 2,
        "op": "below",
        "value": 1,
        "text": "Under 1%: more, thinner strips win.",
        "prompt": "Goal: get the error under 1%."
      },
      "why": "Every strip still misses a sliver, but the slivers shrink faster than their number grows. In the limit the error is zero: that limit is the integral."
    },
    {
      "id": "tangent",
      "type": "concept",
      "title": "From two points to one",
      "steps": 2,
      "art": "<svg viewBox='0 0 320 190' xmlns='http://www.w3.org/2000/svg' data-pattern='graph'><g font-family='Hanken Grotesk, system-ui, sans-serif'><line x1='30' y1='165' x2='300' y2='165' stroke='var(--ink-faint)'/><line x1='30' y1='20' x2='30' y2='165' stroke='var(--ink-faint)'/><path d='M30 160 C100 155 170 120 290 30' fill='none' stroke='var(--accent)' stroke-width='3'/><circle cx='130' cy='139' r='4' fill='var(--ink)'/><text x='122' y='158' font-size='11' fill='var(--ink-soft)'>P</text><g data-step='1'><line x1='60' y1='176' x2='290' y2='60' stroke='var(--ink-soft)' stroke-width='1.6'/><circle cx='230' cy='85' r='3.5' fill='var(--ink)'/><text x='238' y='104' font-size='11' fill='var(--ink-soft)'>Q, far away</text></g><g data-step='2'><line x1='40' y1='167' x2='280' y2='92' stroke='var(--good)' stroke-width='2.4'/><text x='176' y='112' font-size='11' fill='var(--good)'>Q slides into P: the tangent</text></g><text x='300' y='182' text-anchor='end' font-size='10' fill='var(--ink-soft)'>x</text></g></svg>",
      "look": "diagram",
      "alt": "A curve with a point P. A line through P and a distant point Q slides until Q reaches P and the line becomes the tangent.",
      "body": [
        "A slope needs two points. So how can a curve have a slope at one point?",
        {
          "step": 1,
          "text": "Draw a line through **P** and a second point **Q**. Its slope is easy: rise over run."
        },
        {
          "step": 2,
          "text": "Slide Q toward P. The line settles on one slope: the **tangent**, the slope at P alone."
        }
      ]
    },
    {
      "id": "secant",
      "type": "explorable",
      "title": "Slide Q toward P",
      "body": [
        "The slider is the gap h between P and Q. Shrink it."
      ],
      "slider": {
        "id": "h",
        "label": "Gap between P and Q",
        "min": 0.01,
        "max": 3,
        "step": 0.01,
        "value": 2.5,
        "digits": 2
      },
      "plot": {
        "view": "secant",
        "at": 1.5,
        "x": [
          0,
          5
        ],
        "y": [
          0,
          6
        ],
        "f": "0.2*x^2 + 0.3*x + 0.5",
        "xLabel": "x"
      },
      "readouts": [
        {
          "label": "Slope of PQ",
          "expr": "slope",
          "digits": 3
        },
        {
          "label": "Slope at P",
          "expr": "exact",
          "digits": 3
        }
      ],
      "why": "As h shrinks, the two readouts meet. That meeting point is the derivative."
    },
    {
      "id": "spotit",
      "type": "spot",
      "review": true,
      "prompt": "This works out the slope of y = x² at any x. Which step is wrong?",
      "working": [
        {
          "text": "Slope of the line from x to x + h is ((x + h)² - x²) / h"
        },
        {
          "text": "(x + h)² = x² + h²",
          "wrong": true,
          "why": "Squaring a sum gives a middle term: (x + h)² = x² + 2xh + h². Dropping 2xh loses the whole answer."
        },
        {
          "text": "So the slope is (x² + h² - x²) / h = h"
        },
        {
          "text": "As h shrinks to 0, the slope is 0 everywhere"
        }
      ],
      "why": "With the middle term kept, the slope is 2x + h, which settles on 2x. A slope of 0 everywhere would mean a flat line, and y = x² is not flat.",
      "variants": [
        {
          "prompt": "A student concludes y = x² has slope 0 everywhere. Tap the step where the working goes wrong."
        }
      ]
    },
    {
      "id": "guess",
      "type": "estimate",
      "review": true,
      "prompt": "You flip a fair coin 1,000 times. Roughly how many heads?",
      "answer": 500,
      "tolerance": 40,
      "unit": "heads",
      "why": "Half of 1,000 is 500. Real runs wander: about 95% of the time you land between 469 and 531.",
      "variants": [
        {
          "prompt": "A fair coin is tossed 1,000 times. Estimate the number of tails."
        }
      ]
    },
    {
      "id": "flips",
      "type": "simulate",
      "title": "Flip it yourself",
      "model": "coins",
      "params": {
        "p": 0.5
      },
      "runs": [
        10,
        100,
        1000
      ],
      "body": [
        "Run small batches first, then big ones. Watch the line wobble, then settle near the dashed half."
      ]
    },
    {
      "id": "settle",
      "type": "case",
      "title": "Seven heads in ten",
      "steps": 3,
      "art": "<svg viewBox='0 0 320 190' xmlns='http://www.w3.org/2000/svg' data-pattern='flow'><g font-family='Hanken Grotesk, system-ui, sans-serif'><g data-step='1'><rect x='14' y='60' width='86' height='60' rx='10' fill='var(--tint)' stroke='var(--ink-faint)'/><text x='57' y='86' text-anchor='middle' font-size='11' fill='var(--ink-soft)'>10 flips</text><text x='57' y='106' text-anchor='middle' font-size='15' font-weight='700' fill='var(--ink)'>70%</text></g><g data-step='2'><path d='M104 90 H116' stroke='var(--ink-soft)' stroke-width='2'/><rect x='118' y='60' width='86' height='60' rx='10' fill='var(--tint)' stroke='var(--ink-faint)'/><text x='161' y='86' text-anchor='middle' font-size='11' fill='var(--ink-soft)'>100 flips</text><text x='161' y='106' text-anchor='middle' font-size='15' font-weight='700' fill='var(--ink)'>56%</text></g><g data-step='3'><path d='M208 90 H220' stroke='var(--ink-soft)' stroke-width='2'/><rect x='222' y='60' width='86' height='60' rx='10' fill='var(--tint)' stroke='var(--accent)'/><text x='265' y='86' text-anchor='middle' font-size='11' fill='var(--ink-soft)'>10,000 flips</text><text x='265' y='106' text-anchor='middle' font-size='15' font-weight='700' fill='var(--accent)'>50.3%</text><text x='160' y='160' text-anchor='middle' font-size='11' fill='var(--ink-soft)'>the share drifts toward one half</text></g></g></svg>",
      "look": "diagram",
      "alt": "Three boxes in a row: 10 flips at 70% heads, 100 flips at 56%, 10,000 flips at 50.3%.",
      "body": [
        "Mira flips seven heads in her first ten. Is the coin biased? She keeps going.",
        {
          "step": 1,
          "text": "After **10** flips, 70% heads looks suspicious."
        },
        {
          "step": 2,
          "text": "After **100**, it is 56%."
        },
        {
          "step": 3,
          "text": "After **10,000**, it is 50.3%. The early streak did not get cancelled out; it got **diluted**."
        }
      ]
    },
    {
      "id": "fallacy",
      "type": "choice",
      "review": true,
      "prompt": "After seven heads in ten flips, what is the chance the next flip is heads?",
      "options": [
        {
          "text": "Less than half: tails is due",
          "why": "That is the gambler's fallacy. The coin has no memory of the last ten flips."
        },
        {
          "text": "Exactly half",
          "why": "Right. Each flip is independent. The long-run share settles because early streaks are diluted, not repaid.",
          "correct": true
        },
        {
          "text": "More than half: heads is on a streak",
          "why": "A streak in a fair coin says nothing about the next flip."
        },
        {
          "text": "It depends on the time of day",
          "why": "Nothing about the clock changes a fair coin."
        }
      ]
    },
    {
      "id": "dice",
      "type": "simulate",
      "title": "Two dice, many rolls",
      "model": "dice",
      "params": {
        "dice": 2,
        "sides": 6
      },
      "runs": [
        10,
        100,
        1000
      ],
      "body": [
        "Roll two dice and add them. Which total turns up most, and why does the shape become a tent?"
      ]
    },
    {
      "id": "parts",
      "type": "label",
      "review": true,
      "look": "diagram",
      "prompt": "Label the parts of this graph.",
      "art": "<svg viewBox='0 0 320 190' xmlns='http://www.w3.org/2000/svg' data-pattern='graph'><path d='M40 160 L40 150 C90 140 150 118 200 92 L200 160 Z' fill='var(--good)' fill-opacity='.25'/><line x1='30' y1='160' x2='300' y2='160' stroke='var(--ink-faint)'/><line x1='30' y1='20' x2='30' y2='160' stroke='var(--ink-faint)'/><path d='M40 150 C90 140 150 118 200 92 S270 40 300 24' fill='none' stroke='var(--accent)' stroke-width='3'/><line x1='200' y1='130' x2='300' y2='20' stroke='var(--ink)' stroke-width='1.6' transform='translate(-30 18)'/><circle cx='242' cy='66' r='4' fill='var(--ink)'/></svg>",
      "alt": "A curve rising left to right, a shaded region under part of it, a straight line touching the curve at one point, and the horizontal axis.",
      "targets": [
        {
          "id": "curve",
          "label": "the curve",
          "x": 112,
          "y": 116
        },
        {
          "id": "area",
          "label": "area under the curve",
          "x": 150,
          "y": 146
        },
        {
          "id": "tan",
          "label": "tangent line",
          "x": 272,
          "y": 18
        },
        {
          "id": "axis",
          "label": "x-axis",
          "x": 285,
          "y": 172
        }
      ],
      "distractors": [
        "slope of zero"
      ],
      "why": "Area under the curve is what integrals measure; the tangent's slope is what derivatives measure. The curve carries both."
    },
    {
      "id": "drift",
      "type": "simulate",
      "title": "A small advantage, many generations",
      "model": "drift",
      "params": {
        "start": 0.05,
        "advantage": 0.05,
        "size": 300
      },
      "runs": [
        10,
        50
      ],
      "body": [
        "A trait starts in 5% of a population and gives a 5% edge in leaving offspring. Run the generations, then start a new population and compare."
      ]
    },
    {
      "id": "double",
      "type": "explorable",
      "title": "Double your money",
      "body": [
        "£1,000 grows at a yearly interest rate for 10 years."
      ],
      "slider": {
        "id": "r",
        "label": "Interest rate",
        "min": 0,
        "max": 15,
        "step": 0.1,
        "value": 2,
        "unit": "%",
        "digits": 1
      },
      "plot": {
        "view": "curve",
        "x": [
          0,
          10
        ],
        "y": [
          0,
          4000
        ],
        "f": "1000*(1 + r/100)^x",
        "xLabel": "years",
        "yLabel": "£"
      },
      "readouts": [
        {
          "label": "After 10 years, in £",
          "expr": "end",
          "digits": 0
        }
      ],
      "goal": {
        "readout": 0,
        "op": "within",
        "value": 2000,
        "within": 40,
        "text": "Doubled. Close to 7%.",
        "prompt": "Goal: find the rate that turns £1,000 into about £2,000."
      },
      "why": "The rule of 72: divide 72 by the rate to get the years to double. At 7.2%, ten years."
    },
    {
      "id": "yours",
      "type": "reflect",
      "prompt": "Which card taught you something you would not have believed if you had only read it?",
      "minChars": 20,
      "example": "The coins. I would have bet the streak had to be paid back by tails."
    },
    {
      "id": "done",
      "type": "done",
      "title": "Lesson complete",
      "can": "Use each interactive card: explore with a slider, estimate, run a simulation, label a drawing and spot a mistake."
    }
  ]
}
