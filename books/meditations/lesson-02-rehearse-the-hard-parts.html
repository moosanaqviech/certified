<h1>Rehearse the hard parts</h1>
<p>An interactive lesson on a morning habit from the Meditations of Marcus Aurelius: expect the day's difficult people and moments before they arrive, and decide your response in advance. Fifteen cards, about seven minutes, ending with one plan for tomorrow.</p>
