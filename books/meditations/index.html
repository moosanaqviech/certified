/* Shows saved progress per lesson. Reads the same key the engine writes. */
(function () {
  var p = {};
  try { p = JSON.parse(localStorage.getItem('books.v1.progress.meditations') || '{}'); } catch (e) {}
  var links = document.querySelectorAll('[data-lesson]');
  for (var i = 0; i < links.length; i++) {
    var me = p[links[i].getAttribute('data-lesson')];
    if (!me) continue;
    links[i].querySelector('[data-status]').textContent = me.completed ? 'Completed' : 'In progress';
  }
})();
